<svg width="360" height="1000" preserveAspectRatio="xMinYMin meet" viewBox="0 0 360 1000" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Future-defined groups versus aligned time zero</title><desc>Of 100 customers, 40 cancel before month six. Among 60 survivors, 20 receive a badge and four later cancel, while eight of 40 others cancel. Retrospective groups have 20 versus 60 percent cancellation; the month-six-survivor comparison has 20 versus 20 percent. The population changes and confounding can remain.</desc>
