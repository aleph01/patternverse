			<path d="M 690,515 L 690,527" style="stroke: rgb(40%,40%,36%); stroke-linecap: butt; stroke-width: 1;"/>
			<text x="682.772" y="496" style="font-family: Helvetica; font-size: 13px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,992) scale(1,-1)">12</text>
			<text x="557.5945" y="531" style="font-family: Helvetica; font-size: 13px;fill: rgb(0%,47%,30%); stroke:none;" transform="translate(0,1062) scale(1,-1)">8 cancel later</text>
			<text x="30" y="460" style="font-family: Helvetica-Bold; font-size: 17px;fill: rgb(44%,34%,72%); stroke:none;" transform="translate(0,920) scale(1,-1)">Observed gap: -40 percentage points</text>
			<text x="30" y="436" style="font-family: Helvetica; font-size: 13px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,872) scale(1,-1)">All 40 early events enter the no-badge group.</text>
			<text x="30" y="380" style="font-family: Helvetica-Bold; font-size: 18px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,760) scale(1,-1)">Aligned at month 6</text>
			<text x="30" y="352" style="font-family: Helvetica; font-size: 13px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,704) scale(1,-1)">Eligibility, group labels and follow-up start together.</text>
			<text x="30" y="310" style="font-family: Helvetica-Bold; font-size: 15px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,620) scale(1,-1)">Badge: 4 / 20 = 20%</text>
			<path d="M 502.5,305 L 690,305" style="stroke: rgb(0%,47%,30%); stroke-linecap: butt; stroke-width: 2;"/>
