<svg width="720" height="800" preserveAspectRatio="xMinYMin meet" viewBox="0 0 720 800" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Future-defined groups versus aligned time zero</title><desc>Of 100 customers, 40 cancel before month six. Among 60 survivors, 20 receive a badge and four later cancel, while eight of 40 others cancel. Retrospective groups have 20 versus 60 percent cancellation; the month-six-survivor comparison has 20 versus 20 percent. The population changes and confounding can remain.</desc>
	<title>...</title>
	<desc>...</desc>
	<clipPath id="clip">
		<rect x="0" y="0" width="720" height="800"/>
	</clipPath>
	<g id="group" transform="scale(1,-1) translate(0,-800)" style="clip-path: url(#clip)">
		<g transform="">
			<rect x="0" y="0" width="720" height="800" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(98%,98%,96%); fill-rule: evenodd;"/>
			<text x="30" y="765" style="font-family: Helvetica-Bold; font-size: 25px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,1530) scale(1,-1)">Start both groups at the same time</text>
			<text x="30" y="722.0" style="font-family: Helvetica; font-size: 15px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,1444) scale(1,-1)">A badge requires six active months. Complete records for 100 customers.</text>
			<text x="30" y="655" style="font-family: Helvetica-Bold; font-size: 18px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,1310) scale(1,-1)">Groups defined by a future badge</text>
			<text x="30" y="627" style="font-family: Helvetica; font-size: 13px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,1254) scale(1,-1)">Labels learned at month 6; outcomes counted from month 0.</text>
			<text x="30" y="585" style="font-family: Helvetica-Bold; font-size: 15px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,1170) scale(1,-1)">Badge: 4 / 20 = 20%</text>
			<rect x="315.0" y="585" width="187.5" height="21" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(93%,90%,96%); fill-rule: evenodd;"/>
			<text x="362.1515" y="591" style="font-family: Helvetica; font-size: 13px;fill: rgb(44%,34%,72%); stroke:none;" transform="translate(0,1182) scale(1,-1)">Must stay active</text>
			<path d="M 315,580 L 690,580" style="stroke: rgb(0%,47%,30%); stroke-linecap: butt; stroke-width: 2;"/>
			<path d="M 315,580 L 502.5,580" style="stroke: rgb(44%,34%,72%); stroke-linecap: butt; stroke-width: 2;"/>
			<path d="M 315,575 L 315,587" style="stroke: rgb(40%,40%,36%); stroke-linecap: butt; stroke-width: 1;"/>
			<text x="311.386" y="556" style="font-family: Helvetica; font-size: 13px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,1112) scale(1,-1)">0</text>
