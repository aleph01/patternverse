			<text x="311.386" y="496" style="font-family: Helvetica; font-size: 13px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,992) scale(1,-1)">0</text>
			<path d="M 502.5,515 L 502.5,527" style="stroke: rgb(40%,40%,36%); stroke-linecap: butt; stroke-width: 1;"/>
