			<text x="498.886" y="281" style="font-family: Helvetica; font-size: 13px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,562) scale(1,-1)">6</text>
			<path d="M 690,300 L 690,312" style="stroke: rgb(40%,40%,36%); stroke-linecap: butt; stroke-width: 1;"/>
			<text x="682.772" y="281" style="font-family: Helvetica; font-size: 13px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,562) scale(1,-1)">12</text>
			<text x="557.5945" y="315" style="font-family: Helvetica; font-size: 13px;fill: rgb(0%,47%,30%); stroke:none;" transform="translate(0,630) scale(1,-1)">4 cancel later</text>
			<text x="30" y="250" style="font-family: Helvetica-Bold; font-size: 15px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,500) scale(1,-1)">No badge: 8 / 40 = 20%</text>
			<path d="M 502.5,245 L 690,245" style="stroke: rgb(0%,47%,30%); stroke-linecap: butt; stroke-width: 2;"/>
			<path d="M 502.5,240 L 502.5,252" style="stroke: rgb(40%,40%,36%); stroke-linecap: butt; stroke-width: 1;"/>
			<text x="498.886" y="221" style="font-family: Helvetica; font-size: 13px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,442) scale(1,-1)">6</text>
			<path d="M 690,240 L 690,252" style="stroke: rgb(40%,40%,36%); stroke-linecap: butt; stroke-width: 1;"/>
			<text x="682.772" y="221" style="font-family: Helvetica; font-size: 13px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,442) scale(1,-1)">12</text>
			<text x="557.5945" y="255" style="font-family: Helvetica; font-size: 13px;fill: rgb(0%,47%,30%); stroke:none;" transform="translate(0,510) scale(1,-1)">8 cancel later</text>
			<text x="30" y="185" style="font-family: Helvetica-Bold; font-size: 17px;fill: rgb(0%,47%,30%); stroke:none;" transform="translate(0,370) scale(1,-1)">Observed gap: 0 percentage points</text>
			<text x="30" y="161" style="font-family: Helvetica; font-size: 13px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,322) scale(1,-1)">60 eligible survivors; follow months 6-12.</text>
			<text x="30" y="95" style="font-family: Helvetica; font-size: 14px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,190) scale(1,-1)">Month numbers are time since account creation. The aligned comparison changes the population and</text>
			<text x="30" y="75.4" style="font-family: Helvetica; font-size: 14px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,150) scale(1,-1)">period.</text>
			<text x="30" y="50" style="font-family: Helvetica-Bold; font-size: 14px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,100) scale(1,-1)">Equal observed rates do not establish no causal effect.</text>
		</g>
	</g>
</svg>
