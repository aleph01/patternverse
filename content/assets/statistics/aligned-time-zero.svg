			<text x="498.886" y="556" style="font-family: Helvetica; font-size: 13px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,1112) scale(1,-1)">6</text>
			<path d="M 690,575 L 690,587" style="stroke: rgb(40%,40%,36%); stroke-linecap: butt; stroke-width: 1;"/>
			<text x="682.772" y="556" style="font-family: Helvetica; font-size: 13px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,1112) scale(1,-1)">12</text>
			<text x="557.5945" y="591" style="font-family: Helvetica; font-size: 13px;fill: rgb(0%,47%,30%); stroke:none;" transform="translate(0,1182) scale(1,-1)">4 cancel later</text>
			<text x="30" y="525" style="font-family: Helvetica-Bold; font-size: 15px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,1050) scale(1,-1)">No badge: 48 / 80 = 60%</text>
			<rect x="315.0" y="525" width="187.5" height="21" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(93%,93%,91%); fill-rule: evenodd;"/>
			<text x="365.0375" y="531" style="font-family: Helvetica; font-size: 13px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,1062) scale(1,-1)">40 cancel early</text>
			<path d="M 315,520 L 690,520" style="stroke: rgb(0%,47%,30%); stroke-linecap: butt; stroke-width: 2;"/>
