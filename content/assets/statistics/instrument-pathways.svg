<svg width="720" height="850" preserveAspectRatio="xMinYMin meet" viewBox="0 0 720 850" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Instrumental-variable pathways and a local ratio</title><desc>Random invitation affects attendance, attendance affects performance, and unmeasured motivation affects both attendance and performance. A dashed direct invitation-to-performance route would threaten exclusion. Attendance differs 60 versus 20 percent and performance means 54 versus 50, so the Wald ratio is four divided by 0.40, ten points. Local interpretation needs the stated assumptions.</desc>
