			<text x="30" y="155" style="font-family: Helvetica-Bold; font-size: 21px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,310) scale(1,-1)">Respondent mean: 4.2</text>
			<text x="30" y="117" style="font-family: Helvetica-Bold; font-size: 21px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,234) scale(1,-1)">Population-weighted mean: 3.3</text>
			<text x="30" y="68" style="font-family: Helvetica; font-size: 14px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,136) scale(1,-1)">Weighting assumes respondents represent their population group. Missing experiences remain an</text>
