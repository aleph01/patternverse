<svg width="720" height="630" preserveAspectRatio="xMinYMin meet" viewBox="0 0 720 630" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Population composition, responses, and weighted means</title><desc>New customers are 20 percent of the population, 50 percent of invitations, and 80 percent of responses. Respondent average 4.2; population-standardized average 3.3 under within-group assumptions.</desc>
