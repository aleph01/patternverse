		<rect x="0" y="0" width="720" height="630"/>
	</clipPath>
	<g id="group" transform="scale(1,-1) translate(0,-630)" style="clip-path: url(#clip)">
		<g transform="">
			<rect x="0" y="0" width="720" height="630" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(98%,98%,96%); fill-rule: evenodd;"/>
			<text x="30" y="595" style="font-family: Helvetica-Bold; font-size: 25px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,1190) scale(1,-1)">Trace who reaches the average</text>
			<text x="30" y="552.0" style="font-family: Helvetica; font-size: 15px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,1104) scale(1,-1)">Green: new customers. Purple: established customers.</text>
			<text x="30" y="452" style="font-family: Helvetica-Bold; font-size: 16px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,904) scale(1,-1)">Population: 1,000</text>
			<rect x="240" y="440" width="88.0" height="30" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(0%,47%,30%); fill-rule: evenodd;"/>
