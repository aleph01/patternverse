			<text x="335.993" y="349" style="font-family: Helvetica; font-size: 14px;fill: rgb(100%,100%,100%); stroke:none;" transform="translate(0,698) scale(1,-1)">50%</text>
			<text x="555.993" y="349" style="font-family: Helvetica; font-size: 14px;fill: rgb(100%,100%,100%); stroke:none;" transform="translate(0,698) scale(1,-1)">50%</text>
			<text x="30" y="252" style="font-family: Helvetica-Bold; font-size: 16px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,504) scale(1,-1)">Responded: 100</text>
			<rect x="240" y="240" width="352.0" height="30" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(0%,47%,30%); fill-rule: evenodd;"/>
