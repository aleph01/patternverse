			<text x="30" y="352" style="font-family: Helvetica-Bold; font-size: 16px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,704) scale(1,-1)">Invited: 200</text>
			<rect x="240" y="340" width="220.0" height="30" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(0%,47%,30%); fill-rule: evenodd;"/>
