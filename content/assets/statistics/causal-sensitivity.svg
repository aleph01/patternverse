<svg width="720" height="580" preserveAspectRatio="xMinYMin meet" viewBox="0 0 720 580" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Sensitivity to a fixed additive bias</title><desc>The adjusted estimate is seven minus b, and conditional interval endpoints are seven minus b plus or minus 1.959964. Point estimate crosses zero at b seven; lower endpoint at b 5.04. A ten-point outcome difference associated with a binary baseline characteristic and prevalence gap 0.7 supplies bias seven. Bias assumptions are not estimated by the chart.</desc>
