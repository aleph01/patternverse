<svg width="720" height="700" preserveAspectRatio="xMinYMin meet" viewBox="0 0 720 700" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink"><title>A stated estimand and the consequences of changing it</title><desc>Two randomized groups of 1000 yield paid day-90 counts 600 and 650, difference five percentage points. Day-seven activity 700 versus 800 gives a different ten-point contrast. Selecting 400 retained among 500 new-message openers gives 80 percent, which compared with all current customers gives a misleading twenty-point contrast for a changed population.</desc>
	<title>...</title>
	<desc>...</desc>
	<clipPath id="clip">
		<rect x="0" y="0" width="720" height="700"/>
	</clipPath>
	<g id="group" transform="scale(1,-1) translate(0,-700)" style="clip-path: url(#clip)">
		<g transform="">
			<rect x="0" y="0" width="720" height="700" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(98%,98%,96%); fill-rule: evenodd;"/>
			<text x="30" y="665" style="font-family: Helvetica-Bold; font-size: 25px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,1330) scale(1,-1)">Define the answer before the analysis</text>
			<text x="30" y="622.0" style="font-family: Helvetica; font-size: 15px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,1244) scale(1,-1)">New paid subscribers; assignment at signup; complete 90-day outcomes.</text>
			<text x="30" y="535" style="font-family: Helvetica-Bold; font-size: 18px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,1070) scale(1,-1)">Target: day-90 paid probability, new message minus current message.</text>
			<text x="30" y="470" style="font-family: Helvetica-Bold; font-size: 16px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,940) scale(1,-1)">Current: 1,000 assigned</text>
			<rect x="30" y="435" width="396.0" height="22" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(44%,34%,72%); fill-rule: evenodd;"/>
			<text x="30" y="410" style="font-family: Helvetica; font-size: 15px;fill: rgb(44%,34%,72%); stroke:none;" transform="translate(0,820) scale(1,-1)">600 paid at day 90: 60%</text>
			<text x="30" y="380" style="font-family: Helvetica-Bold; font-size: 16px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,760) scale(1,-1)">New: 1,000 assigned</text>
			<rect x="30" y="345" width="429.0" height="22" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(0%,47%,30%); fill-rule: evenodd;"/>
			<text x="30" y="320" style="font-family: Helvetica; font-size: 15px;fill: rgb(0%,47%,30%); stroke:none;" transform="translate(0,640) scale(1,-1)">650 paid at day 90: 65%</text>
			<text x="30" y="235" style="font-family: Helvetica-Bold; font-size: 15px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,470) scale(1,-1)">Stated target: paid at day 90</text>
			<text x="30" y="211" style="font-family: Helvetica; font-size: 16px;fill: rgb(0%,47%,30%); stroke:none;" transform="translate(0,422) scale(1,-1)">+5 percentage points</text>
			<text x="30" y="177" style="font-family: Helvetica-Bold; font-size: 15px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,354) scale(1,-1)">Different outcome: active day 7</text>
			<text x="30" y="153" style="font-family: Helvetica; font-size: 16px;fill: rgb(40%,40%,36%); stroke:none;" transform="translate(0,306) scale(1,-1)">+10 percentage points</text>
			<text x="30" y="119" style="font-family: Helvetica-Bold; font-size: 15px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,238) scale(1,-1)">Selected new openers vs all current</text>
			<text x="30" y="95" style="font-family: Helvetica; font-size: 16px;fill: rgb(44%,34%,72%); stroke:none;" transform="translate(0,190) scale(1,-1)">+20 percentage points</text>
			<text x="30" y="42" style="font-family: Helvetica; font-size: 14px;fill: rgb(9%,9%,7%); stroke:none;" transform="translate(0,84) scale(1,-1)">The opener comparison selects on behavior after assignment. It does not preserve the original target.</text>
		</g>
	</g>
</svg>
