<svg width="720" height="640" preserveAspectRatio="xMinYMin meet" viewBox="0 0 720 640" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Action thresholds and the conditional value of information</title><desc>Expected net benefit of acting is fifty times p minus cost; cost ten crosses zero at 0.2, cost twenty at 0.4. At p 0.3 with cost ten, act-now expected benefit is five. A check with sensitivity 0.8, specificity 0.9 and cost two yields expected net benefit 6.9; perfect information gives twelve before its cost. These are conditional utilities, not guaranteed outcomes.</desc>
