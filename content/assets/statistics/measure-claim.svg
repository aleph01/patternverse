<svg width="720" height="530" preserveAspectRatio="xMinYMin meet" viewBox="0 0 720 530" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Measure and intended claim</title><desc>Recall scores 60 to 90, application scores 50 to 55. The 80/20 composite rises from 58 to 83; equal weighting gives 55 to 72.5. Neither alone establishes transfer.</desc>
