<svg width="360" height="900" preserveAspectRatio="xMinYMin meet" viewBox="0 0 360 900" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink"><title>A stated estimand and the consequences of changing it</title><desc>Two randomized groups of 1000 yield paid day-90 counts 600 and 650, difference five percentage points. Day-seven activity 700 versus 800 gives a different ten-point contrast. Selecting 400 retained among 500 new-message openers gives 80 percent, which compared with all current customers gives a misleading twenty-point contrast for a changed population.</desc>
