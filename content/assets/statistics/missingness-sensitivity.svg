<svg width="720" height="520" preserveAspectRatio="xMinYMin meet" viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Missing-outcome sensitivity and tipping point</title><desc>The full cohort mean is 48 plus 0.4 times the unobserved mean. Missing-group means 80,65,55,40 imply full means 80,74,70,64. Crossing 55 changes the comparison with 70. Extreme bounds are 48 to 88.</desc>
