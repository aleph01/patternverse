<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1044" viewBox="0 0 360 1044" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Return eligibility depends on current environment and state</title><desc id="desc">A recovery gate asks whether the retained old environment is ready, adequately provisioned, and compatible with current data. If it is eligible, route future traffic back and drain candidate work. If it is not, hold the return and use the separately planned recovery procedure; neither branch undoes committed effects.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1044" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Check the return path</text><text x="24" y="76" font-size="17" fill="#626962">Recovery gate · not data restoration</text><rect x="24" y="108" width="312" height="200" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="146" font-size="22" fill="#252c28">Retained blue eligible?</text><text x="40" y="188" font-size="19" fill="#252c28">Ready for current load</text><text x="40" y="226" font-size="18" fill="#252c28">Current data is compatible</text><text x="40" y="268" font-size="16" fill="#626962">Checks are evidence, not proof.</text><path d="M72 308V364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="344" font-size="17" fill="#626962">Choose from evidence</text><rect x="24" y="368" width="312" height="360" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="40" y="392" width="280" height="120" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="56" y="430" font-size="19" fill="#252c28">Yes: return new traffic</text><text x="56" y="468" font-size="18" fill="#252c28">Drain green work</text><text x="56" y="496" font-size="17" fill="#626962">Keep completed effects</text><text x="56" y="552" font-size="20" fill="#626962">OR</text><rect x="40" y="580" width="280" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="618" font-size="20" fill="#252c28">No: hold the return</text><text x="56" y="656" font-size="18" fill="#252c28">Use planned recovery</text><text x="56" y="684" font-size="16" fill="#626962">Old code alone is insufficient</text><rect x="24" y="776" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="814" font-size="21" fill="#252c28">Effects are not undone</text><text x="40" y="854" font-size="17" fill="#252c28">Orders, messages, external calls</text><text x="40" y="894" font-size="17" fill="#626962">need their own recovery rules.</text><text x="24" y="966" font-size="18" fill="#252c28">Close the return window before</text><text x="24" y="1004" font-size="17" fill="#626962">incompatible changes or retirement.</text></svg>
