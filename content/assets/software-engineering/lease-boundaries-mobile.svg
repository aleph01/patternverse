<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1296" viewBox="0 0 360 1296" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Lease knowledge and effect boundaries</title><desc id="desc">A sends a renewal request but receives no reply. The authority may have renewed it, so A's local knowledge is uncertain. Separately, an expired grant can be replaced while A's process still runs. External writes need enforcement at their destination.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1296" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Three separate boundaries</text><rect x="24" y="112" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">A sends a renewal request</text><text x="40" y="167" font-size="16" fill="#626962">A does not receive a reply.</text><text x="40" y="222" font-size="17" fill="#626962">Sending is not confirmation.</text><path d="M180 256V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="320" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="349" font-size="18" fill="#252c28">Authority may have renewed</text><text x="40" y="375" font-size="16" fill="#626962">The reply could have been lost.</text><text x="40" y="430" font-size="16" fill="#626962">Timeout does not prove failure.</text><path d="M180 464V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="528" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="557" font-size="18" fill="#252c28">A’s knowledge is uncertain</text><text x="40" y="583" font-size="16" fill="#626962">No assumed permission extension.</text><text x="40" y="638" font-size="15" fill="#626962">Follow the service’s recovery rules.</text><rect x="24" y="752" width="312" height="152" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="786" font-size="19" fill="#252c28">Even after authority expiry…</text><text x="40" y="830" font-size="16" fill="#626962">A may still run or send delayed I/O.</text><text x="40" y="872" font-size="16" fill="#626962">A replacement may already exist.</text><rect x="24" y="984" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1013" font-size="18" fill="#252c28">External destination</text><text x="40" y="1039" font-size="16" fill="#626962">Must reject obsolete authority.</text><text x="40" y="1094" font-size="16" fill="#626962">A local lease check is insufficient.</text><text x="24" y="1210" font-size="16" fill="#626962">Arrows: renewal uncertainty trace.</text><text x="24" y="1250" font-size="15" fill="#626962">Lower panels: separate responsibilities.</text></svg>
