<svg xmlns="http://www.w3.org/2000/svg" width="720" height="644" viewBox="0 0 720 644" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Bounded contexts preserve different meanings and identities</title><desc id="desc">Sales models commercial account AC-72 as an established relationship. Billing models payer BILL-19 as current and BILL-20 as overdue. Service Access models workspace WS-301 as enabled and funded by BILL-19. Identity mappings connect the models, while the funding relationship identifies which payer matters to the workspace.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="644" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One company, three coherent local models</text><rect x="24" y="84" width="200" height="420" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="118" font-size="22" fill="#252c28">Sales</text><rect x="40" y="164" width="168" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="193" font-size="20" fill="#252c28">AC-72</text><text x="56" y="219" font-size="17" fill="#626962">Established</text><text x="40" y="334" font-size="17" fill="#626962">Commercial</text><text x="40" y="364" font-size="17" fill="#626962">relationships</text><rect x="264" y="84" width="200" height="420" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="280" y="118" font-size="22" fill="#252c28">Billing</text><rect x="280" y="164" width="168" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="296" y="193" font-size="20" fill="#252c28">BILL-19</text><text x="296" y="219" font-size="17" fill="#626962">Current</text><rect x="280" y="344" width="168" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="296" y="373" font-size="20" fill="#252c28">BILL-20</text><text x="296" y="399" font-size="17" fill="#626962">Overdue</text><rect x="504" y="84" width="192" height="420" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="520" y="118" font-size="20" fill="#252c28">Service Access</text><rect x="520" y="164" width="160" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="536" y="193" font-size="20" fill="#252c28">WS-301</text><text x="536" y="219" font-size="17" fill="#626962">Enabled</text><text x="520" y="312" font-size="16" fill="#252c28">Funding: BILL-19</text><text x="520" y="354" font-size="17" fill="#626962">Workspace and</text><text x="520" y="384" font-size="17" fill="#626962">entitlements</text><path d="M208 220H278" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><path d="M242 220V400H278" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="230" y="194" font-size="16" fill="#626962">IDs</text><path d="M448 220H518" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="466" y="194" font-size="17" fill="#626962">funds</text><text x="24" y="560" font-size="18" fill="#252c28">Dashed: identity mapping · green: funding relationship</text><text x="24" y="612" font-size="18" fill="#252c28">BILL-20 being overdue does not define WS-301’s access state.</text></svg>
