<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1144" viewBox="0 0 360 1144" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Compensation resumes without erasing other work</title><desc id="desc">Inventory starts with five mugs. O42 reserves two, and another order O99 reserves one, leaving two available. O42's carrier declines. Packing is released, Inventory release temporarily fails, and a later retry releases only O42's two mugs. Four remain available; O99 still holds one.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1144" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Release this order’s effects</text><rect x="24" y="112" width="312" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Inventory starts with 5</text><text x="40" y="167" font-size="17" fill="#626962">All physical mug units</text><path d="M180 208V270" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="272" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="301" font-size="18" fill="#252c28">O42 holds 2; O99 holds 1</text><text x="40" y="327" font-size="16" fill="#626962">Available mugs: 2</text><path d="M180 384V446" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="448" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="477" font-size="20" fill="#252c28">Carrier declines O42</text><text x="40" y="503" font-size="17" fill="#626962">Packing release succeeds</text><path d="M180 560V622" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="624" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="653" font-size="18" fill="#252c28">Inventory release unavailable</text><text x="40" y="679" font-size="16" fill="#626962">waiting_compensation / done: 1</text><text x="40" y="732" font-size="16" fill="#626962">2 mugs free; 1 packing slot free</text><path d="M180 768V830" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="810" font-size="16" fill="#626962">resume call</text><rect x="24" y="832" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="861" font-size="18" fill="#252c28">Release only O42’s 2 mugs</text><text x="40" y="887" font-size="16" fill="#626962">compensated / done: 0</text><text x="40" y="940" font-size="16" fill="#626962">4 mugs free; O99 still holds 1</text><text x="24" y="1064" font-size="15" fill="#626962">Arrows: interleaving, refusal, recovery.</text><text x="24" y="1100" font-size="15" fill="#626962">Same in-memory state; no crash recovery.</text></svg>
