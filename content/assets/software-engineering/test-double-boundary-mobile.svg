<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1200" viewBox="0 0 360 1200" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Controlled collaborator, real checkout</title><desc id="desc">Production checkout calls a payment adapter. In a focused test, the same real checkout calls a test double through the charge contract; the test arranges its response and verifies the returned status and recorded call. The real payment adapter and provider are outside this test.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1200" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Control the collaborator</text><text x="24" y="82" font-size="19" fill="#626962">Production wiring</text><rect x="24" y="112" width="312" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="21" fill="#252c28">Real checkout</text><text x="40" y="180" font-size="18" fill="#626962">Application decision</text><path d="M72 200V256" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="234" font-size="18" fill="#626962">charge(order, cents)</text><rect x="24" y="260" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="300" font-size="21" fill="#252c28">Production gateway</text><text x="40" y="338" font-size="18" fill="#626962">Adapter + provider I/O</text><text x="24" y="420" font-size="19" fill="#626962">Focused test wiring</text><rect x="24" y="448" width="312" height="116" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="486" font-size="21" fill="#252c28">Test setup</text><text x="40" y="520" font-size="18" fill="#252c28">Prepare reply or exception</text><text x="40" y="550" font-size="18" fill="#626962">Supply a fresh double</text><path d="M72 564V620" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="600" font-size="18" fill="#626962">Exercise the subject</text><rect x="24" y="624" width="312" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="660" font-size="21" fill="#252c28">Real checkout</text><text x="40" y="692" font-size="18" fill="#626962">Same decision code</text><path d="M72 712V768" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="748" font-size="18" fill="#626962">charge(order, cents)</text><rect x="24" y="772" width="312" height="116" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="810" font-size="21" fill="#252c28">Gateway double</text><text x="40" y="846" font-size="18" fill="#252c28">Return reply / raise error</text><text x="40" y="876" font-size="18" fill="#626962">Record calls</text><path d="M72 888V952" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="928" font-size="17" fill="#626962">Observe after execution</text><rect x="24" y="956" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="994" font-size="21" fill="#252c28">Test assertions</text><text x="40" y="1030" font-size="18" fill="#252c28">Check checkout result</text><text x="40" y="1064" font-size="18" fill="#252c28">Inspect the recorded call</text><text x="24" y="1132" font-size="18" fill="#626962">No provider contact in this test.</text><text x="24" y="1168" font-size="18" fill="#626962">Real adapter needs separate tests.</text></svg>
