<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1104" viewBox="0 0 360 1104" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Limited serving exposure and three evidence-gated outcomes</title><desc id="desc">A router assigns a limited share of real requests to the candidate and the remainder to the incumbent. Separate release metrics reach an evidence gate that chooses expansion, a bounded hold, or restoration of future traffic.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1104" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Evaluate, then change exposure</text><text x="24" y="80" font-size="18" fill="#626962">Example: a 10% candidate stage</text><rect x="24" y="108" width="312" height="164" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="146" font-size="22" fill="#252c28">Router · 100 requests</text><text x="40" y="188" font-size="19" fill="#252c28">Incumbent: 90 requests</text><text x="40" y="226" font-size="19" fill="#252c28">Candidate: 10 requests</text><text x="40" y="258" font-size="16" fill="#626962">Both return real responses</text><path d="M72 272V328" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="308" font-size="17" fill="#626962">Separate release metrics</text><rect x="24" y="332" width="312" height="164" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="370" font-size="22" fill="#252c28">Evidence gate</text><text x="40" y="410" font-size="18" fill="#252c28">Serving health + outcomes</text><text x="40" y="448" font-size="18" fill="#252c28">Enough reliable observation</text><text x="40" y="480" font-size="16" fill="#626962">No evidence is not a pass.</text><path d="M72 496V552" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="532" font-size="18" fill="#626962">Choose next allocation</text><rect x="24" y="556" width="312" height="424" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="40" y="580" width="280" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="618" font-size="20" fill="#252c28">Pass: advance / promote</text><text x="56" y="656" font-size="17" fill="#626962">Next planned stage</text><rect x="40" y="708" width="280" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="746" font-size="20" fill="#252c28">Uncertain: hold</text><text x="56" y="784" font-size="17" fill="#626962">Bound observation time</text><rect x="40" y="836" width="280" height="120" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="56" y="874" font-size="22" fill="#252c28">Breach: restore</text><text x="56" y="914" font-size="17" fill="#252c28">Future candidate share → 0%</text><text x="56" y="944" font-size="16" fill="#626962">Prior effects remain</text><text x="24" y="1028" font-size="18" fill="#252c28">Incumbent must remain ready</text><text x="24" y="1066" font-size="18" fill="#626962">and compatible with current data.</text></svg>
