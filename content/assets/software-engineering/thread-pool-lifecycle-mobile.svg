<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1336" viewBox="0 0 360 1336" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Thread Pool: task and worker lifetimes</title><desc id="desc">In one possible schedule, worker A runs job 0 and later job 2 on the same thread. Worker B runs job 1 and later job 3. Each future becomes a result or exception, which the coordinator collects before freeing an admission place. After the final submitted tasks finish, the owner shuts down and joins the pool workers before removing temporary files.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1336" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">A task ends; its thread stays</text><text x="24" y="98" font-size="16" fill="#626962">One possible schedule; assignments vary.</text><rect x="24" y="144" width="312" height="168" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="176" font-size="20" fill="#252c28">Thread A</text><text x="40" y="218" font-size="18" fill="#252c28">job 0: 3 bytes</text><path d="M180 232V266" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="292" font-size="18" fill="#252c28">job 2: ValueError</text><rect x="24" y="376" width="312" height="168" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="408" font-size="20" fill="#252c28">Thread B</text><text x="40" y="450" font-size="18" fill="#252c28">job 1: 4 bytes</text><path d="M180 464V498" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="524" font-size="18" fill="#252c28">job 3: FileNotFoundError</text><text x="24" y="606" font-size="16" fill="#626962">Row arrows: same thread, next task.</text><rect x="24" y="672" width="312" height="200" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="704" font-size="19" fill="#252c28">Coordinator collects futures</text><text x="40" y="748" font-size="15" fill="#626962">Each result or error stays tied to its job.</text><text x="40" y="792" font-size="16" fill="#626962">Collect → free an admission place.</text><text x="40" y="840" font-size="15" fill="#626962">Collection overlaps worker execution.</text><rect x="24" y="968" width="312" height="216" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1000" font-size="19" fill="#252c28">Owner exits the pool context</text><text x="40" y="1044" font-size="16" fill="#626962">Wait for submitted tasks to finish.</text><text x="40" y="1088" font-size="16" fill="#626962">Join workers before returning.</text><text x="40" y="1132" font-size="16" fill="#626962">Then remove temporary input files.</text><text x="24" y="1248" font-size="16" fill="#626962">Report sorting does not order execution.</text><text x="24" y="1290" font-size="16" fill="#626962">A stuck task can hold shutdown open.</text></svg>
