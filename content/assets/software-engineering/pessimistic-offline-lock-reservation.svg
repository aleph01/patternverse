<svg xmlns="http://www.w3.org/2000/svg" width="720" height="936" viewBox="0 0 720 936" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A persistent write reservation spans an offline edit</title><desc id="desc">A short acquisition transaction stores Alice's unique owner token and commits. Alice edits with no database transaction held open. Bob's competing acquisition is refused while that lock row exists. Alice later saves under an ownership check and removes the lock in one short transaction.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="936" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Logical ownership outlives short transactions</text><rect x="24" y="84" width="672" height="120" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">1. Acquire write ownership</text><text x="40" y="139" font-size="17" fill="#626962">Insert owner A; read title; COMMIT.</text><text x="40" y="178" font-size="17" fill="#626962">Return the acquisition handle.</text><rect x="24" y="320" width="672" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="349" font-size="20" fill="#252c28">2. Edit across requests</text><text x="40" y="375" font-size="17" fill="#626962">No database transaction held; lock row persists.</text><path d="M360 204V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="520" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="549" font-size="20" fill="#252c28">Bob tries to acquire</text><text x="40" y="575" font-size="17" fill="#626962">Existing note key → Busy.</text><rect x="384" y="520" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="549" font-size="20" fill="#252c28">Alice saves with A</text><text x="400" y="575" font-size="17" fill="#626962">Check owner; write; delete lock.</text><path d="M180 420V518" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 420V518" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="744" width="672" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="773" font-size="20" fill="#252c28">Short completion transaction</text><text x="40" y="799" font-size="17" fill="#626962">Ownership check, data write, and release commit together.</text><path d="M540 632V742" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="892" font-size="17" fill="#626962">Read-only queries remain allowed.</text></svg>
