<svg xmlns="http://www.w3.org/2000/svg" width="720" height="614" viewBox="0 0 720 614" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A state-dependent agenda in three control cycles</title><desc id="desc">With text and layout features present, layout and text sources are eligible while combination is blocked. The controller chooses layout, then text, then the newly enabled combination source. Their additions remain on the board until the declared goal is met.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="selection" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="614" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Choose from the current opportunities</text><text x="24" y="98" font-size="17" fill="#626962">Cycle</text><text x="120" y="98" font-size="17" fill="#626962">Eligible / blocked</text><text x="376" y="98" font-size="17" fill="#626962">Choose</text><text x="520" y="98" font-size="17" fill="#626962">Add to board</text><text x="24" y="152" font-size="22" fill="#252c28">1</text><text x="120" y="152" font-size="18" fill="#252c28">layout (20), text (10)</text><text x="120" y="182" font-size="17" fill="#626962">combine: not eligible</text><rect x="376" y="122" width="112" height="72" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="392" y="156" font-size="20" fill="#252c28">layout</text><path d="M488 158H518" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="520" y="152" font-size="17" fill="#252c28">has_table = True</text><text x="520" y="182" font-size="17" fill="#626962">Table evidence</text><text x="24" y="288" font-size="22" fill="#252c28">2</text><text x="120" y="288" font-size="18" fill="#252c28">text (10)</text><text x="120" y="318" font-size="17" fill="#626962">combine: not eligible</text><rect x="376" y="258" width="112" height="72" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="392" y="292" font-size="20" fill="#252c28">text</text><path d="M488 294H518" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="520" y="288" font-size="17" fill="#252c28">candidate = invoice</text><text x="520" y="318" font-size="17" fill="#626962">Text hypothesis</text><text x="24" y="424" font-size="22" fill="#252c28">3</text><text x="120" y="424" font-size="18" fill="#252c28">combine (100)</text><text x="120" y="454" font-size="17" fill="#626962">Both clues present</text><rect x="376" y="394" width="112" height="72" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="392" y="428" font-size="20" fill="#252c28">combine</text><path d="M488 430H518" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="520" y="424" font-size="17" fill="#252c28">interpretation:</text><text x="520" y="454" font-size="17" fill="#626962">invoice-supported</text><text x="24" y="552" font-size="18" fill="#252c28">Goal met after three committed contributions.</text><text x="24" y="586" font-size="17" fill="#626962">With budget 2, the same run stops before combination.</text></svg>
