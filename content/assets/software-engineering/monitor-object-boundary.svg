<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1296" viewBox="0 0 720 1296" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Monitor Object state and locking boundary</title><desc id="desc">Producer and consumer caller threads enter synchronized put, get, and close methods through one shared monitor lock. The protected inbox contains a bounded deque and a closed flag. A condition wait releases that same lock; a returning waiter reacquires it and rechecks the state predicate.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1296" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Callers execute methods through one shared monitor lock</text><rect x="24" y="112" width="296" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Producer caller</text><text x="40" y="167" font-size="17" fill="#626962">Calls put(item).</text><rect x="400" y="112" width="296" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="416" y="141" font-size="20" fill="#252c28">Consumer caller</text><text x="416" y="167" font-size="17" fill="#626962">Calls get().</text><path d="M172 240V302H328V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M548 240V302H392V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="276" y="286" font-size="17" fill="#626962">method invocation</text><rect x="24" y="352" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="381" font-size="20" fill="#252c28">Synchronized methods: put, get, close</text><text x="40" y="407" font-size="17" fill="#626962">Each method runs on its caller’s thread; the object has no worker.</text><path d="M360 480V574" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="534" font-size="17" fill="#626962">same lock</text><rect x="24" y="576" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="605" font-size="20" fill="#252c28">Shared monitor lock</text><text x="40" y="631" font-size="17" fill="#626962">Exclusive access covers both the state predicate and its mutation.</text><path d="M360 704V798" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="758" font-size="17" fill="#626962">check + update</text><rect x="24" y="800" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="829" font-size="20" fill="#252c28">Protected state: bounded deque and closed flag</text><text x="40" y="855" font-size="17" fill="#626962">Invariant: 0 ≤ item count ≤ capacity. Callers have no unlocked state path.</text><rect x="24" y="1024" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1058" font-size="22" fill="#252c28">If a predicate is false: wait through the condition</text><text x="40" y="1102" font-size="19" fill="#626962">Wait releases this same lock so another caller can change state.</text><text x="40" y="1142" font-size="18" fill="#626962">A returning waiter reacquires it and checks the predicate again.</text><text x="24" y="1252" font-size="17" fill="#626962">Arrows: synchronized entry and protected state access, not queued methods.</text></svg>
