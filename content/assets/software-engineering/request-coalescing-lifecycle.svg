<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1008" viewBox="0 0 720 1008" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Own the work; separate the waits</title><desc id="desc">A, B, and C initially await one price load. B cancels only its wait. The load continues and A and C receive 1200 cents. Completion retires flight 1. A later caller starts flight 2, increasing the loader count from one to two.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="1008" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">One departing caller does not cancel shared work</text><text x="24" y="78" font-size="19" fill="#626962">The program’s event-controlled execution.</text><rect x="24" y="112" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="146" font-size="22" fill="#252c28">1. Three callers join flight 1</text><text x="40" y="192" font-size="21" fill="#252c28">A, B, C await the same task</text><text x="40" y="236" font-size="19" fill="#626962">Underlying loads: 1</text><path d="M72 256V316" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="294" font-size="18" fill="#626962">Cancel B’s wait</text><rect x="24" y="320" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="354" font-size="22" fill="#252c28">2. B cancels its wait</text><text x="40" y="400" font-size="21" fill="#252c28">A and C remain attached</text><text x="40" y="444" font-size="19" fill="#626962">Flight 1 continues</text><path d="M72 464V524" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="502" font-size="18" fill="#626962">Complete loader</text><rect x="24" y="528" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="562" font-size="22" fill="#252c28">3. Flight 1 completes</text><text x="40" y="608" font-size="21" fill="#252c28">A and C receive 1200 cents</text><text x="40" y="652" font-size="19" fill="#626962">Retire flight 1</text><path d="M72 672V732" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="710" font-size="18" fill="#626962">New call after completion</text><rect x="24" y="736" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="770" font-size="22" fill="#252c28">4. Later call starts flight 2</text><text x="40" y="816" font-size="21" fill="#252c28">No completed-price cache</text><text x="40" y="860" font-size="19" fill="#626962">Underlying loads: 2</text><text x="24" y="932" font-size="21" fill="#252c28">Wait cancellation is local.</text><text x="24" y="966" font-size="19" fill="#626962">Shared work needs its own deadline and shutdown policy.</text></svg>
