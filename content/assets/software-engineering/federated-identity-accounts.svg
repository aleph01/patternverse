<svg xmlns="http://www.w3.org/2000/svg" width="720" height="880" viewBox="0 0 720 880" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Issuer-qualified accounts and local permissions</title><desc id="desc">Five post-validation cases retain issuer-qualified identities: North subject 17 resolves to a1 and may read the summary; South subject 17 resolves to b9 and is denied; North subject 18 is unlinked and denied. North subject 17 still resolves to a1 after its email changes. After a1 loses its local report grant, it remains recognized but the next summary request is denied.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="880" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Issuer scopes identity; the portal grants access</text><text x="24" y="78" font-size="19" fill="#626962">Fixture values have already passed protocol validation.</text><text x="40" y="132" font-size="19" fill="#626962">Federated identity</text><text x="376" y="132" font-size="19" fill="#626962">Account</text><text x="552" y="132" font-size="19" fill="#626962">Summary</text><rect x="24" y="160" width="672" height="108" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="198" font-size="21" fill="#252c28">North / subject 17</text><text x="40" y="238" font-size="18" fill="#626962">sam@example.test</text><path d="M340 216H364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="222" font-size="20" fill="#252c28">a1</text><text x="552" y="222" font-size="20" fill="#252c28">Allowed</text><path d="M516 216H544" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="288" width="672" height="108" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="326" font-size="21" fill="#252c28">South / subject 17</text><text x="40" y="366" font-size="18" fill="#626962">sam@example.test</text><path d="M340 344H364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="350" font-size="20" fill="#252c28">b9</text><text x="552" y="350" font-size="20" fill="#252c28">Denied</text><path d="M516 344H544" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="416" width="672" height="108" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="454" font-size="21" fill="#252c28">North / subject 18</text><text x="40" y="494" font-size="18" fill="#626962">sam@example.test</text><path d="M340 472H364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="478" font-size="20" fill="#252c28">Unlinked</text><text x="552" y="478" font-size="20" fill="#252c28">Denied</text><rect x="24" y="544" width="672" height="108" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="582" font-size="21" fill="#252c28">North / subject 17</text><text x="40" y="622" font-size="18" fill="#626962">new@example.test</text><path d="M340 600H364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="606" font-size="20" fill="#252c28">a1</text><text x="552" y="606" font-size="20" fill="#252c28">Allowed</text><path d="M516 600H544" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="672" width="672" height="108" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="710" font-size="21" fill="#252c28">North / subject 17</text><text x="40" y="750" font-size="18" fill="#626962">Local grant revoked</text><path d="M340 728H364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="734" font-size="20" fill="#252c28">a1</text><text x="552" y="734" font-size="20" fill="#252c28">Denied</text><path d="M516 728H544" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="834" font-size="19" fill="#252c28">Same subject or email does not merge issuer namespaces.</text></svg>
