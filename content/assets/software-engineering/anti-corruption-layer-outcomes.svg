<svg xmlns="http://www.w3.org/2000/svg" width="720" height="952" viewBox="0 0 720 952" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Anti-Corruption Layer: local facts and integration uncertainty</title><desc id="desc">A valid supplier snapshot with quantity 10, committed 7, and damaged 2 yields one sellable unit; a request for two is false under the local rule. A timeout yields StockUnavailable, not a zero-stock Availability. An unmapped local SKU fails before calling the supplier. These outcomes do not reserve or change stock.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="952" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Insufficient stock and missing evidence are different</text><rect x="24" y="104" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="18" fill="#252c28">Coherent supplier snapshot</text><text x="40" y="159" font-size="16" fill="#626962">10 total − 7 committed − 2 damaged</text><path d="M336 168H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="384" y="104" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="133" font-size="20" fill="#252c28">Availability(SKU-42, 1)</text><text x="400" y="159" font-size="17" fill="#626962">can_supply(2) → False</text><rect x="24" y="336" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="365" font-size="20" fill="#252c28">Supplier timeout</text><text x="40" y="391" font-size="17" fill="#626962">No usable response</text><path d="M336 400H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="384" y="336" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="365" font-size="20" fill="#252c28">StockUnavailable</text><text x="400" y="391" font-size="17" fill="#626962">Availability not established</text><rect x="24" y="568" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="597" font-size="18" fill="#252c28">Unmapped local SKU</text><text x="40" y="623" font-size="16" fill="#626962">SKU-MISSING has no supplier ID.</text><path d="M336 632H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="384" y="568" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="597" font-size="20" fill="#252c28">StockUnavailable</text><text x="400" y="623" font-size="17" fill="#626962">No supplier call is made.</text><text x="24" y="816" font-size="18" fill="#252c28">Unknown availability is not zero units.</text><text x="24" y="856" font-size="18" fill="#252c28">None of these reads reserves or changes stock.</text><text x="24" y="896" font-size="17" fill="#626962">The domain’s supply rule remains separate from integration failure.</text></svg>
