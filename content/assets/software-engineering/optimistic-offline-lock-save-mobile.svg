<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1224" viewBox="0 0 360 1224" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Conditional update and edit log share one completion boundary</title><desc id="desc">A short save transaction conditionally changes the note and advances its version, then inserts the edit-log row. Both commit together. A stale version or later log failure rolls the transaction back. After conflict, the application reloads and reviews before making a new proposal; it does not blindly retry the old replacement.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1224" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">One short save transaction</text><text x="24" y="60" font-size="22" fill="#252c28">contains every write</text><rect x="8" y="84" width="344" height="1000" fill="#fff" stroke="#00855b" stroke-width="1.2"/><rect x="24" y="132" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="161" font-size="20" fill="#252c28">BEGIN IMMEDIATE</text><text x="40" y="187" font-size="17" fill="#626962">Short write transaction.</text><rect x="24" y="352" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="381" font-size="20" fill="#252c28">UPDATE: ID + version</text><text x="40" y="407" font-size="17" fill="#626962">One match required.</text><text x="40" y="462" font-size="17" fill="#626962">Title + version provisional.</text><rect x="24" y="624" width="312" height="116" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="653" font-size="20" fill="#252c28">INSERT edit-log row</text><text x="40" y="679" font-size="17" fill="#626962">Still provisional.</text><rect x="24" y="884" width="312" height="116" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="913" font-size="20" fill="#252c28">COMMIT</text><text x="40" y="939" font-size="17" fill="#626962">Now report success.</text><path d="M180 252V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 496V622" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 740V882" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="1148" font-size="18" fill="#252c28">After BEGIN: error → ROLLBACK.</text><text x="24" y="1184" font-size="17" fill="#626962">Reload and review a conflict.</text></svg>
