<svg xmlns="http://www.w3.org/2000/svg" width="720" height="992" viewBox="0 0 720 992" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Reuse the shared subproblem</title><desc id="desc">Five project tasks form an acyclic dependency graph. Publish depends on package; package depends on assets and templates; both depend on parse. Parse finishes at minute 2, assets at 5, templates at 6, package at 7, and publish at 9. The shared parse result is computed once and reused.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="992" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Five tasks; one result for each completed task</text><text x="24" y="78" font-size="19" fill="#626962">Arrow: upper task needs lower task’s result.</text><rect x="200" y="120" width="320" height="116" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="216" y="152" font-size="22" fill="#252c28">4 / publish</text><text x="216" y="192" font-size="18" fill="#626962">Own: 2 min</text><text x="216" y="220" font-size="20" fill="#252c28">Finish: 9 min</text><path d="M360 236V268" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="200" y="272" width="320" height="116" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="216" y="304" font-size="22" fill="#252c28">3 / package</text><text x="216" y="344" font-size="18" fill="#626962">Own: 1 min</text><text x="216" y="372" font-size="20" fill="#252c28">Finish: 7 min</text><path d="M360 388V420H172V452" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 388V420H548V452" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="456" width="296" height="116" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="488" font-size="22" fill="#252c28">1 / assets</text><text x="40" y="528" font-size="18" fill="#626962">Own: 3 min</text><text x="40" y="556" font-size="20" fill="#252c28">Finish: 5 min</text><rect x="400" y="456" width="296" height="116" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="416" y="488" font-size="22" fill="#252c28">2 / templates</text><text x="416" y="528" font-size="18" fill="#626962">Own: 4 min</text><text x="416" y="556" font-size="20" fill="#252c28">Finish: 6 min</text><path d="M172 572V644H300V676" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M548 572V644H420V676" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="200" y="680" width="320" height="116" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="216" y="712" font-size="22" fill="#252c28">0 / parse</text><text x="216" y="752" font-size="18" fill="#626962">Own: 2 min</text><text x="216" y="780" font-size="20" fill="#252c28">Finish: 2 min</text><rect x="24" y="844" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="876" font-size="20" fill="#252c28">Task 0: first request computes; the second reuses 2 minutes.</text><text x="40" y="916" font-size="18" fill="#626962">Cold calculation: five task bodies, not six. No resource limits modeled.</text><text x="40" y="944" font-size="17" fill="#626962">Finish times assume unlimited parallel resources; arrows are dependencies.</text></svg>
