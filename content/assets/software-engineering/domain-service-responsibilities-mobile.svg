<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1072" viewBox="0 0 360 1072" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Domain service decision and its collaborators</title><desc id="desc">A booking use case supplies a workshop request and room-offer snapshots to the select_room domain service. RoomOffer.can_host checks each offer's own compatibility; select_room compares qualifying offers by seat count and room ID, then returns a selected offer or no match.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1072" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Business decision,</text><text x="24" y="60" font-size="22" fill="#252c28">explicit responsibilities</text><rect x="24" y="104" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Application use case</text><text x="40" y="159" font-size="17" fill="#626962">Load inputs; act on result</text><rect x="24" y="270" width="312" height="510" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="44" y="306" font-size="20" fill="#252c28">Domain model</text><rect x="44" y="352" width="272" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="381" font-size="20" fill="#252c28">select_room</text><text x="60" y="407" font-size="17" fill="#626962">Compare supplied offers</text><path d="M180 204V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="248" font-size="18" fill="#626962">calls</text><path d="M180 428V464" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="44" y="466" width="272" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="495" font-size="18" fill="#252c28">1. RoomOffer.can_host</text><text x="60" y="521" font-size="16" fill="#626962">Seats + required features</text><path d="M180 566V604" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="44" y="606" width="272" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="635" font-size="18" fill="#252c28">2. Choose smallest fit</text><text x="60" y="661" font-size="16" fill="#626962">Then break ties by room ID</text><path d="M180 706V854" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="820" font-size="18" fill="#626962">return</text><rect x="24" y="856" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="885" font-size="20" fill="#252c28">RoomOffer or None</text><text x="40" y="911" font-size="17" fill="#626962">No booking side effect</text><text x="24" y="1014" font-size="18" fill="#252c28">Application: load and book</text><text x="24" y="1044" font-size="18" fill="#252c28">Domain service: decide</text></svg>
