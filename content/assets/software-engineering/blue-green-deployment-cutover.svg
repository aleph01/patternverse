<svg xmlns="http://www.w3.org/2000/svg" width="720" height="828" viewBox="0 0 720 828" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Two application environments and request ownership across cutover</title><desc id="desc">Before cutover, the router sends new requests to blue version 1 while green version 2 is validated. After cutover, new requests go to green; an already admitted request can still complete on blue. The shared compatible data store remains outside the application-environment boundary.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="828" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Switch the destination of new traffic</text><text x="24" y="80" font-size="18" fill="#626962">Environment names are labels; the accent marks the active route.</text><rect x="24" y="108" width="672" height="220" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="144" font-size="22" fill="#252c28">Before cutover · new requests → blue</text><rect x="40" y="172" width="160" height="72" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="216" font-size="22" fill="#252c28">Router</text><rect x="264" y="172" width="184" height="72" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="280" y="204" font-size="22" fill="#252c28">Blue v1</text><text x="280" y="232" font-size="17" fill="#626962">Serving</text><rect x="496" y="172" width="184" height="72" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="512" y="204" font-size="22" fill="#252c28">Green v2</text><text x="512" y="232" font-size="16" fill="#626962">Candidate checks</text><path d="M200 208H260" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="296" font-size="18" fill="#626962">Green is validated without normal user traffic.</text><rect x="24" y="360" width="672" height="236" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="396" font-size="22" fill="#252c28">After cutover · new requests → green</text><rect x="40" y="432" width="160" height="72" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="476" font-size="22" fill="#252c28">Router</text><rect x="264" y="432" width="184" height="72" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="280" y="464" font-size="22" fill="#252c28">Blue v1</text><text x="280" y="492" font-size="17" fill="#626962">Drain old work</text><rect x="496" y="432" width="184" height="72" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="512" y="464" font-size="22" fill="#252c28">Green v2</text><text x="512" y="492" font-size="17" fill="#626962">Serving</text><path d="M200 468H232V416H588V428" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="556" font-size="18" fill="#626962">Blue keeps admitted requests; new requests go to green.</text><rect x="24" y="636" width="672" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="674" font-size="22" fill="#252c28">Shared data store · schema 1</text><text x="40" y="714" font-size="18" fill="#252c28">Both versions must understand the current schema and values.</text><text x="24" y="788" font-size="17" fill="#252c28">Arrows route new requests; old work stays with its admitting environment.</text></svg>
