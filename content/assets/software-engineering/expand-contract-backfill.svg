<svg xmlns="http://www.w3.org/2000/svg" width="720" height="764" viewBox="0 0 720 764" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Reject stale historical copies after newer live changes</title><desc id="desc">A backfill holds account A at revision 10 with standard tier. A live update has already advanced the target to revision 11 with premium tier. A guard rejects the stale revision-10 write, leaving premium at revision 11. This versioned-copy example is separate from the single-value Python API bridge.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="764" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">A delayed backfill must not overwrite a live update</text><text x="24" y="84" font-size="18" fill="#626962">Separate two-copy example; the Python API bridge uses one value.</text><rect x="24" y="124" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="164" font-size="22" fill="#252c28">Backfill snapshot · A</text><text x="40" y="204" font-size="19" fill="#252c28">revision 10 · standard</text><text x="40" y="238" font-size="18" fill="#626962">Copy is delayed</text><rect x="384" y="124" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="164" font-size="21" fill="#252c28">Target after live update</text><text x="400" y="204" font-size="19" fill="#252c28">revision 11 · premium</text><text x="400" y="238" font-size="18" fill="#626962">Already current</text><path d="M180 252V336" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="300" font-size="18" fill="#626962">incoming: 10</text><path d="M540 252V336" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="400" y="300" font-size="18" fill="#626962">stored: 11</text><rect x="24" y="340" width="672" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="380" font-size="21" fill="#252c28">Atomic conditional write: accept only a newer revision</text><text x="40" y="424" font-size="22" fill="#252c28">10 > 11 is false → reject the stale write</text><text x="40" y="466" font-size="18" fill="#626962">Compare and write together; use one authoritative revision order per account.</text><path d="M360 484V560" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="384" y="532" font-size="18" fill="#626962">Preserve newer value</text><rect x="24" y="564" width="672" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="604" font-size="23" fill="#252c28">Target remains: revision 11 · premium</text><text x="40" y="646" font-size="18" fill="#626962">An equal-revision retry is a no-op under this rule.</text><text x="24" y="722" font-size="18" fill="#252c28">Retain deletion ordering too; a checkpoint alone does not prevent races.</text></svg>
