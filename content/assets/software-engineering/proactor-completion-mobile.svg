<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1256" viewBox="0 0 360 1256" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Proactor operation completion</title><desc id="desc">The initiator submits a read request with an identity, buffer, and handler. The operation processor performs the read and places its result on a completion queue. The dispatcher retrieves that result and invokes the matching handler with transferred bytes and status.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1256" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Submit work; receive results</text><rect x="24" y="112" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">Initiator submits a read</text><text x="40" y="167" font-size="16" fill="#626962">Request ID + buffer + handler</text><path d="M180 240V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="286" font-size="16" fill="#626962">submit</text><rect x="24" y="320" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="349" font-size="18" fill="#252c28">Operation processor</text><text x="40" y="375" font-size="16" fill="#626962">Performs the requested I/O.</text><path d="M180 448V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="494" font-size="16" fill="#626962">terminal result</text><rect x="24" y="528" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="557" font-size="18" fill="#252c28">Completion queue</text><text x="40" y="583" font-size="16" fill="#626962">Request ID + byte count + status</text><path d="M180 656V734" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="702" font-size="16" fill="#626962">dequeue</text><rect x="24" y="736" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="765" font-size="18" fill="#252c28">Proactor dispatcher</text><text x="40" y="791" font-size="16" fill="#626962">Finds the matching handler.</text><path d="M180 864V942" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="910" font-size="16" fill="#626962">completion</text><rect x="24" y="944" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="973" font-size="18" fill="#252c28">Handler consumes the result</text><text x="40" y="999" font-size="16" fill="#626962">Updates state; may start next I/O.</text><text x="40" y="1054" font-size="15" fill="#626962">It does not wait for read readiness.</text><text x="24" y="1172" font-size="16" fill="#626962">Arrows: submission and result flow.</text><text x="24" y="1210" font-size="15" fill="#626962">A short read can need another operation.</text></svg>
