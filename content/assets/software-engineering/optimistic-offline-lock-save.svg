<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Conditional update and edit log share one completion boundary</title><desc id="desc">A short save transaction conditionally changes the note and advances its version, then inserts the edit-log row. Both commit together. A stale version or later log failure rolls the transaction back. After conflict, the application reloads and reviews before making a new proposal; it does not blindly retry the old replacement.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="960" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Compare, write, and complete together</text><rect x="24" y="84" width="672" height="768" fill="#fff" stroke="#00855b" stroke-width="1.2"/><rect x="44" y="132" width="632" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="161" font-size="20" fill="#252c28">BEGIN IMMEDIATE</text><text x="60" y="187" font-size="17" fill="#626962">One short database write transaction.</text><rect x="44" y="320" width="632" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="349" font-size="20" fill="#252c28">Conditional UPDATE: ID + expected version</text><text x="60" y="375" font-size="17" fill="#626962">One match → title and version are provisional.</text><rect x="44" y="520" width="632" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="549" font-size="20" fill="#252c28">INSERT edit-log row</text><text x="60" y="575" font-size="17" fill="#626962">Still provisional.</text><rect x="44" y="720" width="632" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="749" font-size="20" fill="#252c28">COMMIT</text><text x="60" y="775" font-size="17" fill="#626962">Now return the new snapshot.</text><path d="M360 220V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 420V518" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 608V718" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="916" font-size="18" fill="#252c28">After BEGIN: any error rolls back this save.</text></svg>
