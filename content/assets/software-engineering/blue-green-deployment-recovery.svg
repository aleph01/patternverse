<svg xmlns="http://www.w3.org/2000/svg" width="720" height="732" viewBox="0 0 720 732" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Return eligibility depends on current environment and state</title><desc id="desc">A recovery gate asks whether the retained old environment is ready, adequately provisioned, and compatible with current data. If it is eligible, route future traffic back and drain candidate work. If it is not, hold the return and use the separately planned recovery procedure; neither branch undoes committed effects.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="732" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Check the return path against current state</text><text x="24" y="80" font-size="18" fill="#626962">Switching back changes future routing, not committed effects.</text><rect x="24" y="112" width="672" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="150" font-size="22" fill="#252c28">Retained blue eligible?</text><text x="40" y="190" font-size="19" fill="#252c28">Ready and provisioned for current load</text><text x="40" y="230" font-size="19" fill="#252c28">Compatible with current data and contracts</text><text x="40" y="256" font-size="17" fill="#626962">Illustrative code checks readiness + declared schema support.</text><path d="M180 272V344" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 272V344" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="316" font-size="18" fill="#626962">Yes</text><text x="400" y="316" font-size="18" fill="#626962">No</text><rect x="24" y="348" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="386" font-size="20" fill="#252c28">Route new traffic back</text><text x="40" y="426" font-size="19" fill="#252c28">Drain green work</text><text x="40" y="468" font-size="16" fill="#626962">Preserve completed transactions</text><rect x="384" y="348" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="386" font-size="22" fill="#252c28">Hold the return</text><text x="400" y="426" font-size="19" fill="#252c28">Use planned recovery</text><text x="400" y="468" font-size="16" fill="#626962">Retained code alone is insufficient</text><rect x="24" y="540" width="672" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="580" font-size="21" fill="#252c28">Neither outcome reverses committed effects.</text><text x="40" y="622" font-size="18" fill="#252c28">Recover orders, messages, and external actions through explicit procedures.</text><text x="24" y="692" font-size="18" fill="#252c28">Close the return window before incompatible changes and retirement.</text></svg>
