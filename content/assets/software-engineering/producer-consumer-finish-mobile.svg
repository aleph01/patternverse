<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1336" viewBox="0 0 360 1336" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Producer-Consumer: completion and shutdown</title><desc id="desc">The coordinator first finishes all producers, then enqueues one stop marker per consumer behind accepted jobs, waits for queue task accounting, and joins the consumer threads. Consumers keep removing and handling jobs during shutdown, recording either a measurement or a rejection before task_done; each exits after its own stop marker.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1336" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Finish, drain, join</text><rect x="24" y="104" width="312" height="136" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="136" font-size="19" fill="#252c28">Consumers stay active</text><text x="40" y="176" font-size="17" fill="#626962">get → handle → task_done</text><text x="40" y="214" font-size="16" fill="#626962">Stop entry: task_done, then exit.</text><rect x="24" y="304" width="312" height="152" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="336" font-size="18" fill="#252c28">1 / finish all producers</text><text x="40" y="382" font-size="16" fill="#626962">The last data job has been put.</text><text x="40" y="426" font-size="16" fill="#626962">No producer may submit later.</text><path d="M180 456V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="528" width="312" height="152" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="560" font-size="18" fill="#252c28">2 / put one stop per consumer</text><text x="40" y="606" font-size="16" fill="#626962">Markers follow accepted jobs.</text><text x="40" y="650" font-size="16" fill="#626962">These puts may block for space.</text><path d="M180 680V750" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="752" width="312" height="152" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="784" font-size="18" fill="#252c28">3 / pending.join()</text><text x="40" y="830" font-size="16" fill="#626962">Wait for all task_done calls.</text><text x="40" y="874" font-size="16" fill="#626962">Handled failures also count.</text><path d="M180 904V974" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="976" width="312" height="152" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1008" font-size="18" fill="#252c28">4 / thread.join() for each</text><text x="40" y="1054" font-size="16" fill="#626962">Wait for consumer termination.</text><text x="40" y="1098" font-size="16" fill="#626962">Now read and order outcomes.</text><text x="24" y="1200" font-size="16" fill="#626962">Arrows: coordinator call order.</text><text x="24" y="1238" font-size="16" fill="#626962">Workers overlap steps 1–3.</text><text x="24" y="1292" font-size="17" fill="#252c28">Completion is not universal success.</text></svg>
