<svg xmlns="http://www.w3.org/2000/svg" width="720" height="632" viewBox="0 0 720 632" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Stock and movement commit together or roll back</title><desc id="desc">A successful issue starts with five units, subtracts three, inserts movement I-1, and commits two remaining units. A later attempt using duplicate movement I-1 starts with two units, temporarily subtracts one, fails to insert, and rolls back to two. The original I-1 movement remains three units.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="632" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One procedure; commit or rollback</text><text x="24" y="84" font-size="18" fill="#626962">Before</text><text x="264" y="84" font-size="18" fill="#626962">Inside transaction</text><text x="504" y="84" font-size="18" fill="#626962">After</text><rect x="24" y="112" width="200" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="142" font-size="21" fill="#252c28">5 available</text><text x="40" y="182" font-size="17" fill="#626962">I-1: new ID</text><text x="40" y="222" font-size="17" fill="#252c28">Request: 3 units</text><rect x="264" y="112" width="200" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="280" y="142" font-size="21" fill="#252c28">5 → 2</text><text x="280" y="182" font-size="17" fill="#626962">Insert I-1: 3 units</text><text x="280" y="222" font-size="17" fill="#252c28">COMMIT</text><rect x="504" y="112" width="192" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="520" y="142" font-size="21" fill="#252c28">2 available</text><text x="520" y="182" font-size="17" fill="#626962">I-1: 3 units</text><text x="520" y="222" font-size="17" fill="#252c28">Saved</text><path d="M224 184H262" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M464 184H502" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="352" width="200" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="382" font-size="21" fill="#252c28">2 available</text><text x="40" y="422" font-size="17" fill="#626962">I-1: reused ID</text><text x="40" y="462" font-size="17" fill="#252c28">Request: 1 unit</text><rect x="264" y="352" width="200" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="280" y="382" font-size="21" fill="#252c28">2 → 1</text><text x="280" y="422" font-size="17" fill="#626962">Insert I-1 fails</text><text x="280" y="462" font-size="17" fill="#252c28">ROLLBACK</text><rect x="504" y="352" width="192" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="520" y="382" font-size="21" fill="#252c28">2 available</text><text x="520" y="422" font-size="17" fill="#626962">I-1: 3 units</text><text x="520" y="462" font-size="17" fill="#252c28">Unchanged</text><path d="M224 424H262" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M464 424H502" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="24" y="556" font-size="18" fill="#252c28">Provisional updates are not committed results.</text><text x="24" y="596" font-size="17" fill="#626962">Dashed arrow: failed insert and rollback of the earlier update.</text></svg>
