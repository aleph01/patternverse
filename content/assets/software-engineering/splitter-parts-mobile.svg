<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1280" viewBox="0 0 360 1280" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Splitter: child identity and parent context</title><desc id="desc">Order event E901 for O42 contains L1 with two BOOK units and L2 with one MUG unit. Splitter creates two immutable child messages, retaining parent E901 and order O42. Each child has its own line ID and one-based position within a two-part sequence.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1280" fill="#fff"/><text x="24" y="34" font-size="23" fill="#252c28">One parent, distinct children</text><rect x="24" y="112" width="312" height="200" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Order event E901</text><text x="40" y="167" font-size="17" fill="#626962">Order: O42</text><text x="40" y="212" font-size="18" fill="#626962">L1: BOOK / 2 units</text><text x="40" y="256" font-size="18" fill="#626962">L2: MUG / 1 unit</text><path d="M180 312V398" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="362" font-size="17" fill="#626962">extract</text><rect x="48" y="400" width="288" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="64" y="429" font-size="20" fill="#252c28">Splitter</text><text x="64" y="455" font-size="17" fill="#626962">Validate all, then construct.</text><path d="M48 450H12V670H46" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M12 670V990H46" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="48" y="560" width="288" height="232" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="589" font-size="20" fill="#252c28">Child L1</text><text x="64" y="615" font-size="17" fill="#626962">Key: (E901, L1)</text><text x="64" y="658" font-size="17" fill="#626962">Order: O42 / SKU: BOOK</text><text x="64" y="702" font-size="18" fill="#626962">Quantity: 2 units</text><text x="64" y="750" font-size="17" fill="#626962">Position: 1 / size: 2</text><rect x="48" y="880" width="288" height="232" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="909" font-size="20" fill="#252c28">Child L2</text><text x="64" y="935" font-size="17" fill="#626962">Key: (E901, L2)</text><text x="64" y="978" font-size="17" fill="#626962">Order: O42 / SKU: MUG</text><text x="64" y="1022" font-size="18" fill="#626962">Quantity: 1 unit</text><text x="64" y="1070" font-size="17" fill="#626962">Position: 2 / size: 2</text><text x="24" y="1184" font-size="17" fill="#252c28">Arrows: create child messages.</text><text x="24" y="1228" font-size="16" fill="#626962">Position does not order completion.</text></svg>
