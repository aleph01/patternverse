<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1104" viewBox="0 0 360 1104" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Routing misses, method rejection, and handler errors remain distinct</title><desc id="desc">An unknown path produces a 404 without calling a handler. A known path with the wrong recognized method produces a 405 with an Allow value. A selected handler that raises an exception produces a generic 500, with its request ID retained in internal diagnostics. All three cases reach the simulation’s shared audit completion step.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1104" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Three distinct failure outcomes</text><rect x="24" y="104" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Case 1: unknown path</text><text x="40" y="159" font-size="17" fill="#626962">GET /missing</text><text x="40" y="216" font-size="17" fill="#626962">404 Not found; no handler call.</text><rect x="24" y="312" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="341" font-size="20" fill="#252c28">Case 2: wrong method</text><text x="40" y="367" font-size="17" fill="#626962">POST /orders; only GET allowed</text><text x="40" y="424" font-size="16" fill="#626962">405; Allow: GET; no handler call.</text><rect x="24" y="520" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="549" font-size="20" fill="#252c28">Case 3: handler failure</text><text x="40" y="575" font-size="17" fill="#626962">GET /broken raises RuntimeError</text><text x="40" y="632" font-size="17" fill="#626962">500 Internal error to the caller.</text><text x="40" y="668" font-size="17" fill="#626962">ID + exception class internally.</text><rect x="24" y="800" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="829" font-size="20" fill="#252c28">Every illustrated case</text><text x="40" y="855" font-size="17" fill="#626962">Append request ID and status.</text><text x="40" y="912" font-size="17" fill="#626962">One common completion step.</text><text x="24" y="1008" font-size="18" fill="#252c28">These are alternative requests.</text><text x="24" y="1048" font-size="17" fill="#626962">The audit is in memory only.</text></svg>
