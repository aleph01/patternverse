<svg xmlns="http://www.w3.org/2000/svg" width="720" height="944" viewBox="0 0 720 944" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Content-Based Router: fallback and delivery boundaries</title><desc id="desc">An unfamiliar but structurally valid service order selects unclassified-review through the otherwise rule. A negative amount selects invalid-messages before business rules run. Selecting priority-fulfillment says nothing about enqueue acknowledgment or completed shipment; those are later boundaries with their own failure handling.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="944" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Unmatched, malformed, and undelivered differ</text><rect x="24" y="104" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Valid, unfamiliar kind</text><text x="40" y="159" font-size="17" fill="#626962">service / 9900 US dollar cents</text><path d="M336 160H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="384" y="104" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="133" font-size="20" fill="#252c28">unclassified-review</text><text x="400" y="159" font-size="17" fill="#626962">otherwise / orders-v1</text><rect x="24" y="336" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="365" font-size="20" fill="#252c28">Malformed amount</text><text x="40" y="391" font-size="17" fill="#626962">−1 US dollar cents</text><path d="M336 392H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="384" y="336" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="365" font-size="20" fill="#252c28">invalid-messages</text><text x="400" y="391" font-size="17" fill="#626962">fields / orders-v1</text><text x="24" y="568" font-size="22" fill="#252c28">Selection, handoff, and completion are separate</text><rect x="24" y="632" width="192" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="661" font-size="18" fill="#252c28">Select channel</text><text x="40" y="687" font-size="16" fill="#626962">Decision only</text><rect x="264" y="632" width="192" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="280" y="661" font-size="18" fill="#252c28">Enqueue</text><text x="280" y="687" font-size="16" fill="#626962">May fail or retry</text><rect x="504" y="632" width="192" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="520" y="661" font-size="18" fill="#252c28">Handle order</text><text x="520" y="687" font-size="16" fill="#626962">Effect may fail</text><path d="M216 696H262" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M456 696H502" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="840" font-size="18" fill="#252c28">One valid decision does not prove the next step succeeded.</text><text x="24" y="884" font-size="17" fill="#626962">Invalid-message selection here is not a broker dead-letter protocol.</text></svg>
