<svg xmlns="http://www.w3.org/2000/svg" width="720" height="992" viewBox="0 0 720 992" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Lease lifetime</title><desc id="desc">At authority time zero A acquires the partition for 3000 milliseconds. At 2000 milliseconds A renews, moving expiry to 5000. B is denied at 4999. At exactly 5000 A's grant is expired and B can acquire a new grant.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="992" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One right, with an explicit expiry boundary</text><text x="24" y="70" font-size="19" fill="#626962">Authority clock / integer milliseconds</text><rect x="24" y="112" width="144" height="136" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="21" fill="#252c28">0 ms</text><rect x="208" y="112" width="488" height="136" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="224" y="141" font-size="20" fill="#252c28">A acquires grant 1</text><text x="224" y="167" font-size="17" fill="#626962">TTL 3000 ms / deadline 3000 ms</text><text x="224" y="220" font-size="16" fill="#626962">Exclusive claim for one partition.</text><path d="M96 248V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="304" width="144" height="136" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="340" font-size="21" fill="#252c28">2000 ms</text><rect x="208" y="304" width="488" height="136" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="224" y="333" font-size="20" fill="#252c28">A’s renewal is accepted</text><text x="224" y="359" font-size="17" fill="#626962">New deadline: 2000 + 3000 = 5000 ms</text><text x="224" y="412" font-size="16" fill="#626962">Renew from acceptance time, not the old deadline.</text><path d="M96 440V494" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="496" width="144" height="136" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="532" font-size="21" fill="#252c28">4999 ms</text><rect x="208" y="496" width="488" height="136" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="224" y="525" font-size="20" fill="#252c28">B attempts to acquire</text><text x="224" y="551" font-size="17" fill="#626962">Denied: A’s grant is still current</text><text x="224" y="604" font-size="16" fill="#626962">Validity requires authority time &lt; deadline.</text><path d="M96 632V686" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="688" width="144" height="136" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="724" font-size="21" fill="#252c28">5000 ms</text><rect x="208" y="688" width="488" height="136" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="224" y="717" font-size="20" fill="#252c28">A’s grant has expired</text><text x="224" y="743" font-size="17" fill="#626962">A cannot renew; B can acquire a new grant</text><text x="224" y="796" font-size="16" fill="#626962">Expiry is included in the invalid interval.</text><text x="24" y="908" font-size="17" fill="#626962">Arrows: ordered operations on one authority clock, not network messages.</text><text x="24" y="948" font-size="17" fill="#626962">A’s renewed valid interval is [0, 5000) ms; expiry does not stop its process.</text></svg>
