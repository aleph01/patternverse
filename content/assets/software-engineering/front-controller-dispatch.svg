<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A common request lifecycle delegates action-specific processing</title><desc id="desc">Several web paths enter a shared front controller. It creates request-local context, chooses an allowlisted handler, and delegates path-specific work. Handler results or recognized routing failures return through common completion handling. Domain operations remain behind the handlers. Only paths mapped to this entry point participate.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1040" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Central entry processing, delegated actions</text><rect x="24" y="100" width="672" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">Mapped requests</text><text x="40" y="155" font-size="17" fill="#626962">GET /; GET /orders; POST /orders; other mapped paths</text><path d="M360 196V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="252" font-size="17" fill="#626962">request</text><rect x="24" y="304" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="333" font-size="20" fill="#252c28">Front Controller</text><text x="40" y="359" font-size="17" fill="#626962">New request context; locale; allowlisted handler selection</text><text x="40" y="418" font-size="17" fill="#626962">404 / 405 skip the handler and complete centrally.</text><path d="M360 448V504H180V566" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 504H540V566" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="488" font-size="17" fill="#626962">Select one handler for this request.</text><rect x="24" y="568" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="597" font-size="20" fill="#252c28">Welcome handler</text><text x="40" y="623" font-size="17" fill="#626962">Path-specific response work</text><rect x="384" y="568" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="597" font-size="20" fill="#252c28">Orders handler</text><text x="400" y="623" font-size="17" fill="#626962">Application / view delegation</text><path d="M696 384H708V880H698" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 680V822" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="752" font-size="17" fill="#626962">result / failure</text><path d="M540 680V822" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="752" font-size="17" fill="#626962">result / failure</text><rect x="24" y="824" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="853" font-size="20" fill="#252c28">Shared completion and response</text><text x="40" y="879" font-size="17" fill="#626962">Translate handler failures; append audit status; return Response.</text><text x="24" y="1000" font-size="17" fill="#626962">Mapped scope matters; replicas may share the same processing contract.</text></svg>
