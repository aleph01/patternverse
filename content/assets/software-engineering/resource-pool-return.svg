<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1200" viewBox="0 0 720 1200" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Resource Pool: reset before reuse</title><desc id="desc">A borrow owns a buffer until its scope ends, including on a job exception. Scope exit invalidates the old handle and resets all eight bytes before publishing the buffer as idle. If the pool has closed, the returned buffer is dropped instead. The next borrow receives a new handle; the old handle remains invalid.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1200" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Return cleanup separates one borrower from the next</text><rect x="24" y="112" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">The borrow scope ends, even when the job raises</text><text x="40" y="167" font-size="17" fill="#626962">The pool’s finally block starts return cleanup.</text><path d="M360 240V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="320" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="349" font-size="20" fill="#252c28">Invalidate the old handle, then reset all eight bytes</text><text x="40" y="375" font-size="17" fill="#626962">The backing buffer remains unavailable while reset runs outside the pool lock.</text><path d="M360 464V542" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="544" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="573" font-size="20" fill="#252c28">Under the condition lock, check whether the pool is still open</text><text x="40" y="599" font-size="17" fill="#626962">Availability is published only after cleanup; notify waiting callers.</text><path d="M360 672V716H196V798" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 716H524V798" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="136" y="760" font-size="18" fill="#626962">open</text><text x="548" y="760" font-size="18" fill="#626962">closed</text><rect x="48" y="800" width="296" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="64" y="829" font-size="20" fill="#252c28">Return to idle</text><text x="64" y="855" font-size="17" fill="#626962">Next borrow: fresh handle</text><rect x="376" y="800" width="296" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="392" y="829" font-size="20" fill="#252c28">Drop the buffer</text><text x="392" y="855" font-size="17" fill="#626962">No new borrow permitted</text><text x="64" y="910" font-size="16" fill="#626962">Old handle stays invalid.</text><text x="392" y="910" font-size="15" fill="#626962">Active use was not revoked.</text><text x="24" y="1040" font-size="18" fill="#252c28">Pool close stops admission and wakes waiters; it does not join borrowers.</text><text x="24" y="1090" font-size="18" fill="#252c28">Open-pool return reuses the resource, not the previous handle.</text><text x="24" y="1150" font-size="17" fill="#626962">Arrows: cleanup order and the open-versus-closed return decision.</text></svg>
