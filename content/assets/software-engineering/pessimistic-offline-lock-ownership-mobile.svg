<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1128" viewBox="0 0 360 1128" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Guard both writes and release with current ownership</title><desc id="desc">After Alice's ownership ends, Bob acquires the note using a fresh token. A late save using Alice's old token matches no ownership row and is rejected. A late cancellation using that token cannot remove Bob's lock. Bob can still save or cancel his own reservation.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1128" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">An old token</text><text x="24" y="60" font-size="22" fill="#252c28">cannot act for a new owner</text><rect x="24" y="104" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">B owns note 1 now</text><text x="40" y="159" font-size="17" fill="#626962">A was released or revoked.</text><text x="40" y="214" font-size="17" fill="#626962">B has a fresh token.</text><text x="24" y="288" font-size="18" fill="#252c28">Late calls</text><rect x="8" y="304" width="344" height="440" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><path d="M180 248V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="344" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="373" font-size="20" fill="#252c28">Late save with A</text><text x="40" y="399" font-size="17" fill="#626962">Owner check matches zero.</text><text x="40" y="452" font-size="17" fill="#626962">Reject; title unchanged.</text><rect x="24" y="552" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="581" font-size="20" fill="#252c28">Late cancel with A</text><text x="40" y="607" font-size="17" fill="#626962">DELETE matches zero.</text><text x="40" y="660" font-size="17" fill="#626962">Keep B’s lock.</text><rect x="24" y="856" width="312" height="116" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="885" font-size="20" fill="#252c28">B remains the owner</text><text x="40" y="911" font-size="17" fill="#626962">A cannot release B’s lock.</text><path d="M180 744V854" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="1040" font-size="18" fill="#252c28">Validate at write and release.</text><text x="24" y="1080" font-size="17" fill="#626962">Fresh token for every acquisition.</text></svg>
