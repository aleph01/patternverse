<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1076" viewBox="0 0 360 1076" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One evaluated policy decision selects a receipt path</title><desc id="desc">A request context and a versioned flag-policy snapshot feed one evaluator. Its Boolean decision reaches a toggle point that selects the standard receipt or the detailed receipt. Only the selected rendering path runs.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1076" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Decide once for this request</text><text x="24" y="76" font-size="18" fill="#626962">Receipt rollout · original example</text><rect x="24" y="108" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="146" font-size="22" fill="#252c28">Account: acct-42</text><text x="40" y="184" font-size="18" fill="#252c28">Policy v1: expose to 20%</text><text x="40" y="222" font-size="18" fill="#626962">Trusted key + one snapshot</text><path d="M72 248V304" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="284" font-size="18" fill="#626962">Evaluate once</text><rect x="24" y="308" width="312" height="140" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="346" font-size="22" fill="#252c28">Evaluator</text><text x="40" y="386" font-size="18" fill="#252c28">Bucket 12 &lt; 20 → enabled</text><text x="40" y="426" font-size="17" fill="#626962">Revision v1 · reason: rollout</text><path d="M72 448V504" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="484" font-size="18" fill="#626962">Keep request decision</text><rect x="24" y="508" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="546" font-size="22" fill="#252c28">Toggle point</text><text x="40" y="584" font-size="18" fill="#252c28">Renderer selects one path</text><path d="M72 612V652" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="648" font-size="18" fill="#626962">Select one alternative</text><rect x="24" y="656" width="312" height="308" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="40" y="676" width="280" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="714" font-size="20" fill="#252c28">False: standard receipt</text><text x="56" y="752" font-size="18" fill="#626962">Existing layout</text><text x="56" y="812" font-size="20" fill="#626962">OR</text><rect x="40" y="844" width="280" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="56" y="882" font-size="20" fill="#252c28">True: detailed receipt</text><text x="56" y="920" font-size="18" fill="#626962">New layout</text><text x="24" y="998" font-size="18" fill="#252c28">Only the selected path runs.</text><text x="24" y="1038" font-size="18" fill="#626962">Authorization stays separate.</text></svg>
