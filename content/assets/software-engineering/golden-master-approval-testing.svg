<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Observe, compare, review</title><desc id="desc">A fixed scenario produces an actual report that is compared with a reviewed approved file. A mismatch writes a separate received file and a diff. Only a deliberate review can replace the approved baseline; the normal test never updates it.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="800" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Observe, compare, review</text><text x="24" y="80" font-size="19" fill="#626962">Execution boundaries and evidence</text><rect x="24" y="112" width="672" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="22" fill="#252c28">Fixed scenario</text><text x="40" y="188" font-size="20" fill="#252c28">Produce a reproducible observation</text><text x="40" y="224" font-size="18" fill="#626962">Normalize only justified differences</text><path d="M72 232V280" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="266" font-size="17" fill="#626962">Observe</text><rect x="24" y="284" width="672" height="120" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="320" font-size="22" fill="#252c28">Compare to approved</text><text x="40" y="360" font-size="20" fill="#252c28">Read the reviewed baseline</text><text x="40" y="396" font-size="18" fill="#626962">Normal tests do not change it</text><path d="M72 404V452" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="438" font-size="17" fill="#626962">Compare</text><rect x="24" y="456" width="672" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="492" font-size="22" fill="#252c28">Match or mismatch</text><text x="40" y="532" font-size="20" fill="#252c28">Match: pass; mismatch: fail + diff</text><text x="40" y="568" font-size="18" fill="#626962">Write received output separately</text><path d="M72 576V624" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="610" font-size="17" fill="#626962">For a mismatch</text><rect x="24" y="628" width="672" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="664" font-size="22" fill="#252c28">Review a difference</text><text x="40" y="704" font-size="20" fill="#252c28">Keep or deliberately replace baseline</text><text x="40" y="740" font-size="18" fill="#626962">Review is a separate operation</text></svg>
