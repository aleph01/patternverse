<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1088" viewBox="0 0 360 1088" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A receiving context owns semantic interpretation</title><desc id="desc">A published BillingCondition for BILL-19 and a workspace funded by BILL-19 enter Access-owned interpretation. A current condition means keep current access; an overdue condition means review access. The function rejects mismatched or unresolved payer mappings and never directly changes the workspace's enabled state.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1088" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Translate the meaning;</text><text x="24" y="60" font-size="22" fill="#252c28">keep the decision local</text><rect x="24" y="104" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">BillingCondition</text><text x="40" y="159" font-size="17" fill="#626962">BILL-19 · overdue</text><rect x="24" y="252" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="281" font-size="20" fill="#252c28">Workspace WS-301</text><text x="40" y="307" font-size="17" fill="#626962">Funded by BILL-19 · enabled</text><rect x="24" y="430" width="312" height="132" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="464" font-size="18" fill="#252c28">Access-owned interpretation</text><text x="40" y="502" font-size="17" fill="#252c28">Match funding payer exactly</text><text x="40" y="536" font-size="17" fill="#626962">Use known payment states</text><path d="M180 204V224H12V496H22" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 352V428" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="642" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="671" font-size="20" fill="#252c28">review_access</text><text x="40" y="697" font-size="17" fill="#626962">WS-301 stays enabled</text><path d="M180 562V640" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="608" font-size="17" fill="#626962">match</text><rect x="24" y="822" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="851" font-size="20" fill="#252c28">Wrong or unknown payer</text><text x="40" y="877" font-size="17" fill="#626962">Error; access stays unchanged</text><path d="M336 496H348V872H338" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="204" y="790" font-size="17" fill="#626962">if unresolved</text><text x="24" y="990" font-size="17" fill="#252c28">Published billing fact ≠ access state.</text><text x="24" y="1024" font-size="17" fill="#252c28">This example performs no state write.</text><text x="24" y="1070" font-size="16" fill="#626962">Green: assessment · dashed: rejection</text></svg>
