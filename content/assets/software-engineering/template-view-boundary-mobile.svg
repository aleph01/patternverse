<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1120" viewBox="0 0 360 1120" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">HTML text encoding and missing-field failure have separate meanings</title><desc id="desc">A product name containing an ampersand and angle brackets is encoded as HTML character references. The browser displays the original name as text rather than creating an extra element. Separately, omitting the required availability field raises a missing-field error before the buffered renderer returns HTML.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1120" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Keep values as text;</text><text x="24" y="60" font-size="22" fill="#252c28">check required fields</text><rect x="24" y="104" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Raw name value</text><text x="40" y="159" font-size="17" fill="#626962">A&amp;B &lt;Lab></text><path d="M180 208V326" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="270" font-size="17" fill="#626962">encode + render</text><rect x="24" y="328" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="357" font-size="20" fill="#252c28">HTML source</text><text x="40" y="383" font-size="17" fill="#626962">&lt;h1>A&amp;amp;B &amp;lt;Lab&amp;gt;&lt;/h1></text><path d="M180 440V558" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="502" font-size="17" fill="#626962">parse HTML</text><rect x="24" y="560" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="589" font-size="20" fill="#252c28">Browser heading text</text><text x="40" y="615" font-size="17" fill="#626962">A&amp;B &lt;Lab></text><text x="40" y="674" font-size="16" fill="#626962">No extra Lab element is created.</text><text x="24" y="808" font-size="19" fill="#252c28">Separate contract failure</text><rect x="24" y="864" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="893" font-size="20" fill="#252c28">Missing availability</text><text x="40" y="919" font-size="17" fill="#626962">KeyError before HTML returns.</text><text x="40" y="978" font-size="17" fill="#626962">Zero units is valid data.</text><text x="24" y="1072" font-size="18" fill="#252c28">Text encoding is context-specific.</text></svg>
