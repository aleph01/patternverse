<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Immutable replacement without aliasing changes</title><desc id="desc">Before a change, booked and proposed refer to the same stay value, 2026-10-29 to 2026-11-01. After proposed is assigned the result of shifted(2), booked still refers to the original dates while proposed refers to 2026-10-31 to 2026-11-03.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="900" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A replacement changes one owner’s reference</text><rect x="24" y="102" width="672" height="246" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="138" font-size="21" fill="#252c28">Before · both variables refer to one value</text><rect x="44" y="174" width="180" height="52" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="207" font-size="20" fill="#252c28">booked</text><rect x="44" y="266" width="180" height="52" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="299" font-size="20" fill="#252c28">proposed</text><rect x="372" y="198" width="304" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="388" y="228" font-size="20" fill="#252c28">Check-in: 2026-10-29</text><text x="388" y="258" font-size="20" fill="#252c28">Checkout: 2026-11-01</text><text x="388" y="292" font-size="17" fill="#626962">3 calendar nights</text><path d="M224 200H370" fill="none" stroke="#626962" stroke-width="1.3" marker-end="url(#wiring)"/><path d="M224 292H370" fill="none" stroke="#626962" stroke-width="1.3" marker-end="url(#wiring)"/><rect x="24" y="404" width="672" height="364" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="440" font-size="21" fill="#252c28">After · proposed = proposed.shifted(2)</text><rect x="44" y="494" width="180" height="52" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="527" font-size="20" fill="#252c28">booked</text><rect x="372" y="470" width="304" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="388" y="500" font-size="20" fill="#252c28">Check-in: 2026-10-29</text><text x="388" y="530" font-size="20" fill="#252c28">Checkout: 2026-11-01</text><text x="388" y="564" font-size="17" fill="#626962">3 calendar nights</text><path d="M224 520H370" fill="none" stroke="#626962" stroke-width="1.3" marker-end="url(#wiring)"/><rect x="44" y="648" width="180" height="52" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="681" font-size="20" fill="#252c28">proposed</text><rect x="372" y="624" width="304" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="388" y="654" font-size="20" fill="#252c28">Check-in: 2026-10-31</text><text x="388" y="684" font-size="20" fill="#252c28">Checkout: 2026-11-03</text><text x="388" y="718" font-size="17" fill="#626962">3 calendar nights</text><path d="M224 674H370" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="822" font-size="19" fill="#252c28">Arrows show references, not mutation of a shared value.</text><text x="24" y="860" font-size="18" fill="#252c28">booked keeps the old dates; proposed receives the new value.</text></svg>
