<svg xmlns="http://www.w3.org/2000/svg" width="720" height="896" viewBox="0 0 720 896" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Database per Service: ownership versus physical hosting</title><desc id="desc">Orders and Inventory use separate runtime roles and each issues SQL only to its own private schema. The two schemas share one PostgreSQL server. An inter-service API request connects the services above the storage boundary, rather than granting Orders direct access to Inventory tables.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="896" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One server can host two private stores</text><rect x="24" y="112" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Orders service</text><text x="40" y="167" font-size="17" fill="#626962">Runtime role: orders_app</text><rect x="384" y="112" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="141" font-size="20" fill="#252c28">Inventory service</text><text x="400" y="167" font-size="17" fill="#626962">Runtime role: inventory_app</text><path d="M336 168H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="341" y="144" font-size="16" fill="#626962">API</text><rect x="24" y="352" width="672" height="368" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><path d="M180 224V430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="312" font-size="18" fill="#626962">Own SQL</text><path d="M540 224V430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="312" font-size="18" fill="#626962">Own SQL</text><rect x="48" y="432" width="264" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="64" y="461" font-size="20" fill="#252c28">orders schema</text><text x="64" y="487" font-size="17" fill="#626962">orders.orders</text><text x="64" y="550" font-size="16" fill="#626962">Owner: orders_owner</text><rect x="408" y="432" width="264" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="424" y="461" font-size="20" fill="#252c28">inventory schema</text><text x="424" y="487" font-size="17" fill="#626962">inventory.stock</text><text x="424" y="550" font-size="16" fill="#626962">Owner: inventory_owner</text><text x="40" y="680" font-size="20" fill="#626962">Same PostgreSQL server; separate schemas and runtime privileges.</text><text x="24" y="800" font-size="18" fill="#252c28">Arrows: service API request or SQL into the service’s own store.</text><text x="24" y="840" font-size="18" fill="#626962">No runtime role receives a direct SQL grant to the other schema.</text></svg>
