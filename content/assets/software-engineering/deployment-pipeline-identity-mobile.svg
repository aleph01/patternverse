<svg xmlns="http://www.w3.org/2000/svg" width="360" height="932" viewBox="0 0 360 932" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Bind evidence to the actual bytes</title><desc id="desc">Validation evidence identifies artifact digest A. A promotion request supplies either the same digest A or different bytes with digest B. Only matching bytes with complete required evidence and approval are eligible; a matching build name alone is insufficient.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="932" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Bind evidence to the actual bytes</text><text x="24" y="80" font-size="17" fill="#626962">Identity is one gate, not proof of safety.</text><rect x="24" y="112" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="22" fill="#252c28">Validation record</text><text x="40" y="188" font-size="17" fill="#252c28">Digest A passed required checks</text><text x="40" y="224" font-size="16" fill="#626962">Evidence belongs to these bytes</text><path d="M72 252V304" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="288" font-size="17" fill="#626962">Associate</text><rect x="24" y="308" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="344" font-size="22" fill="#252c28">Promotion input</text><text x="40" y="384" font-size="17" fill="#252c28">Name: build-42; digest A or B</text><text x="40" y="420" font-size="16" fill="#626962">A name alone proves no identity</text><path d="M72 448V500" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="484" font-size="17" fill="#626962">Compare with evidence</text><rect x="24" y="504" width="312" height="140" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="540" font-size="22" fill="#252c28">Eligibility check</text><text x="40" y="580" font-size="17" fill="#252c28">Same digest + required evidence</text><text x="40" y="616" font-size="16" fill="#626962">Release approval also required</text><path d="M72 644V696" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="680" font-size="17" fill="#626962">Decide before writing</text><rect x="24" y="700" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="736" font-size="22" fill="#252c28">Possible results</text><text x="40" y="776" font-size="17" fill="#252c28">A + complete gates → eligible</text><text x="40" y="812" font-size="16" fill="#626962">B or missing gate → blocked</text><text x="24" y="892" font-size="16" fill="#252c28">Use trusted storage and evidence writers.</text></svg>
