<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1192" viewBox="0 0 360 1192" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Service Layer coordinates commit and rollback</title><desc id="desc">The booking operation begins a write transaction, reads availability, applies the domain rule, updates remaining seats, and inserts the booking row. Commit makes both writes visible together. If the insert fails because a booking ID already exists, rollback restores the earlier capacity update and the caller receives an error.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1192" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Save both changes,</text><text x="24" y="60" font-size="22" fill="#252c28">or keep neither</text><rect x="24" y="104" width="312" height="80" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">BEGIN IMMEDIATE</text><text x="40" y="159" font-size="17" fill="#626962">Acquire write transaction</text><rect x="24" y="244" width="312" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="273" font-size="20" fill="#252c28">Load + domain decision</text><text x="40" y="299" font-size="17" fill="#626962">3 seats − 2 booked = 1 left</text><rect x="24" y="384" width="312" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="413" font-size="20" fill="#252c28">UPDATE availability</text><text x="40" y="439" font-size="17" fill="#626962">First write: seats_left = 1</text><rect x="24" y="524" width="312" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="553" font-size="20" fill="#252c28">INSERT booking</text><text x="40" y="579" font-size="17" fill="#626962">Second write: unique booking ID</text><path d="M180 184V242" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 324V382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 464V522" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="704" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="733" font-size="20" fill="#252c28">COMMIT</text><text x="40" y="759" font-size="17" fill="#626962">Return 1 remaining seat</text><path d="M180 604V702" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="660" font-size="17" fill="#626962">success</text><rect x="24" y="904" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="933" font-size="20" fill="#252c28">Duplicate ID → ROLLBACK</text><text x="40" y="959" font-size="17" fill="#626962">Restore the first write</text><path d="M336 564H348V954H338" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="24" y="1080" font-size="17" fill="#252c28">Green: successful sequence.</text><text x="24" y="1112" font-size="17" fill="#626962">Dashed: insert fails; undo writes.</text><text x="24" y="1152" font-size="18" fill="#252c28">The caller receives an error.</text></svg>
