<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1184" viewBox="0 0 360 1184" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Exposure and privilege are separate</title><desc id="desc">Public clients reach a limited-privilege gatekeeper, which screens requests and forwards only the fixed label-preview operation over an authenticated internal channel. A separate private service owns authorization and order access. Only that service reaches the order store; the gatekeeper has no storage credentials or direct storage route.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1184" fill="#fff"/><text x="24" y="36" font-size="23" fill="#252c28">Screen at the edge</text><text x="24" y="78" font-size="17" fill="#626962">Keep authority in a private service.</text><rect x="24" y="112" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="22" fill="#252c28">Public client</text><text x="40" y="184" font-size="18" fill="#252c28">Untrusted request bytes</text><text x="40" y="214" font-size="17" fill="#626962">No direct back-end route</text><path d="M72 224V284" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="260" font-size="18" fill="#626962">Public request</text><rect x="24" y="288" width="312" height="236" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="328" font-size="23" fill="#252c28">Gatekeeper</text><text x="40" y="368" font-size="18" fill="#252c28">Limited-privilege identity</text><text x="40" y="402" font-size="18" fill="#252c28">Bound and validate input</text><text x="40" y="436" font-size="18" fill="#252c28">Build fixed preview request</text><text x="40" y="474" font-size="17" fill="#626962">No order-store credentials</text><text x="40" y="508" font-size="17" fill="#626962">Separate runtime</text><path d="M72 524V600" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="554" font-size="17" fill="#626962">Fixed preview contract</text><text x="96" y="584" font-size="17" fill="#626962">Authenticated service hop</text><rect x="24" y="604" width="312" height="296" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="644" font-size="22" fill="#252c28">Private LabelService</text><text x="40" y="688" font-size="18" fill="#252c28">Verified user context</text><text x="40" y="722" font-size="18" fill="#252c28">Current owner + quota</text><text x="40" y="756" font-size="18" fill="#252c28">Creates preview response</text><text x="40" y="802" font-size="17" fill="#626962">Internal endpoint only</text><text x="40" y="836" font-size="17" fill="#626962">Separate identity / runtime</text><text x="40" y="874" font-size="18" fill="#252c28">Order-access authority</text><path d="M72 900V956" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="934" font-size="17" fill="#626962">Service-only access</text><rect x="24" y="960" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1000" font-size="22" fill="#252c28">Orders</text><text x="40" y="1042" font-size="18" fill="#252c28">Credentials stay private.</text><text x="24" y="1124" font-size="17" fill="#252c28">Ingress cannot read orders directly.</text><text x="24" y="1158" font-size="18" fill="#626962">Enforce this in deployment.</text></svg>
