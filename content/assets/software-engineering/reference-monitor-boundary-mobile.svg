<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1120" viewBox="0 0 360 1120" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Mediate every protected access</title><desc id="desc">Interactive reads and export requests both enter one logical enforcement boundary. The mechanism uses authenticated subject identity, requested operation, trusted object metadata, and current policy. Only an allowed operation reaches the report store; a denial returns no report. The store has no direct caller access within the declared boundary.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1120" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Mediate every access path</text><text x="24" y="78" font-size="17" fill="#626962">Declared scope: report bodies.</text><rect x="24" y="112" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="22" fill="#252c28">Read / Export paths</text><text x="40" y="184" font-size="18" fill="#252c28">Trusted subject identity</text><text x="40" y="214" font-size="18" fill="#626962">Requested action + object</text><path d="M180 224V284" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="204" y="262" font-size="17" fill="#626962">mediate</text><rect x="24" y="288" width="312" height="624" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="328" font-size="21" fill="#252c28">Enforcement boundary</text><text x="40" y="364" font-size="17" fill="#626962">Caller has no direct store access</text><rect x="40" y="392" width="280" height="108" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="428" font-size="20" fill="#252c28">Policy + tenant metadata</text><text x="56" y="470" font-size="18" fill="#626962">Current trusted facts</text><path d="M180 500V548" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="204" y="532" font-size="17" fill="#626962">evaluate</text><rect x="40" y="552" width="280" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="56" y="590" font-size="22" fill="#252c28">Access validation</text><text x="56" y="628" font-size="17" fill="#252c28">subject / action / exact object</text><text x="56" y="664" font-size="18" fill="#626962">Explicit permit required</text><path d="M180 680V732" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="204" y="716" font-size="17" fill="#626962">allow</text><rect x="40" y="736" width="280" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="774" font-size="22" fill="#252c28">Report bodies</text><text x="56" y="816" font-size="18" fill="#626962">Read only after permit</text><text x="40" y="880" font-size="19" fill="#252c28">No permit → no body read</text><rect x="24" y="952" width="312" height="136" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="990" font-size="20" fill="#252c28">Complete mediation</text><text x="40" y="1030" font-size="20" fill="#252c28">Protected enforcement</text><text x="40" y="1070" font-size="20" fill="#252c28">Analyzable mechanism</text></svg>
