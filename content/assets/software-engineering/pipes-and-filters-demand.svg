<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Downstream data and upstream demand in the generator example</title><desc id="desc">Solid arrows carry data from the CSV source through the filter chain to the consumer. Dashed arrows carry requests for the next result upstream. The first result consumes the 18 °C and 25 °C records; the 30 °C record waits for another request.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="demand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="424" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Demand pulls upstream; data moves downstream</text><rect x="24" y="190" width="176" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="219" font-size="20" fill="#252c28">CSV source</text><text x="40" y="245" font-size="17" fill="#626962">18, 25, 30 °C</text><rect x="272" y="190" width="176" height="80" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="288" y="219" font-size="20" fill="#252c28">Filter chain</text><text x="288" y="245" font-size="17" fill="#626962">Four generators</text><rect x="520" y="190" width="176" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="536" y="219" font-size="20" fill="#252c28">Consumer</text><text x="536" y="245" font-size="17" fill="#626962">next() / print</text><path d="M200 236H270" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="216" y="224" font-size="16" fill="#252c28">CSV</text><path d="M448 236H518" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="474" y="224" font-size="16" fill="#252c28">text</text><path d="M320 190V92H112V188" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#demand)"/><text x="208" y="80" font-size="17" fill="#252c28">next()</text><path d="M608 190V130H400V188" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#demand)"/><text x="468" y="118" font-size="17" fill="#252c28">next()</text><text x="24" y="316" font-size="18" fill="#252c28">First result: read 18 °C, then 25 °C.</text><text x="24" y="350" font-size="18" fill="#252c28">The 30 °C record waits for the next request.</text><text x="24" y="394" font-size="17" fill="#626962">Solid: data · dashed: demand</text></svg>
