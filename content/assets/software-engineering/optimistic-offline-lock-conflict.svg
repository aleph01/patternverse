<svg xmlns="http://www.w3.org/2000/svg" width="720" height="880" viewBox="0 0 720 880" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Original-version validation rejects the later stale save</title><desc id="desc">Alice and Bob both read note version 1 and edit outside database transactions. Alice's conditional save matches version 1, writes her title, and commits version 2. Bob's later save still expects version 1, matches no row, and is rejected without overwriting Alice.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="880" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Two edits start at version 1</text><rect x="24" y="84" width="672" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">Load independently: same note, version 1</text><text x="40" y="139" font-size="17" fill="#626962">Both snapshots keep the original version.</text><rect x="24" y="248" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="277" font-size="20" fill="#252c28">Alice: Launch plan</text><text x="40" y="303" font-size="17" fill="#626962">Expected version: 1</text><rect x="384" y="248" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="277" font-size="20" fill="#252c28">Bob: Budget plan</text><text x="400" y="303" font-size="17" fill="#626962">Expected version: 1</text><path d="M180 172V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 172V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="408" font-size="18" fill="#626962">Editing interval: no database transaction held.</text><rect x="24" y="464" width="672" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="493" font-size="20" fill="#252c28">1. Alice saves: WHERE version = 1 matches</text><text x="40" y="519" font-size="17" fill="#626962">Title: Launch plan; committed version: 2</text><rect x="24" y="664" width="672" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="693" font-size="20" fill="#252c28">2. Bob saves: WHERE version = 1 matches zero</text><text x="40" y="719" font-size="17" fill="#626962">Conflict; Alice’s version 2 remains.</text><path d="M360 564V662" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="620" font-size="17" fill="#626962">Bob saves later</text><text x="24" y="834" font-size="18" fill="#252c28">Reload and review before proposing another write.</text></svg>
