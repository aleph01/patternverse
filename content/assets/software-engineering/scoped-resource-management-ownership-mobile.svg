<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1320" viewBox="0 0 360 1320" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Scoped Resource Management: dependency-aware ownership</title><desc id="desc">One scope owns a temporary directory, then an open file in that directory, then a gzip decoder that borrows that file. Acquisitions are registered as they succeed. On exit, the decoder closes before the file, and the file closes before the directory is removed. A returned byte value is independent of all three resources.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1320" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Scope owns cleanup</text><rect x="24" y="112" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">One explicit ownership stack</text><text x="40" y="167" font-size="16" fill="#626962">Register each successful entry.</text><rect x="24" y="336" width="312" height="200" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="368" font-size="20" fill="#252c28">Acquire + register</text><text x="40" y="412" font-size="17" fill="#252c28">1 / create temporary directory</text><text x="40" y="456" font-size="17" fill="#252c28">2 / open the raw file inside it</text><text x="40" y="500" font-size="17" fill="#252c28">3 / decoder borrows that file</text><path d="M180 536V606" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="608" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="637" font-size="18" fill="#252c28">Scope ends</text><text x="40" y="663" font-size="16" fill="#626962">Return, early exit, or body exception.</text><path d="M180 752V830" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="832" width="312" height="200" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="864" font-size="19" fill="#252c28">Release registered contexts</text><text x="40" y="908" font-size="18" fill="#252c28">3 / close the decoder</text><text x="40" y="952" font-size="18" fill="#252c28">2 / close the raw file</text><text x="40" y="996" font-size="18" fill="#252c28">1 / remove the directory</text><text x="24" y="1120" font-size="16" fill="#626962">The decoder does not close the raw file.</text><text x="24" y="1170" font-size="17" fill="#252c28">Only detached bytes are returned.</text><text x="24" y="1230" font-size="16" fill="#626962">Arrows: control reaches cleanup.</text><text x="24" y="1274" font-size="16" fill="#626962">Numbers identify acquisition order.</text></svg>
