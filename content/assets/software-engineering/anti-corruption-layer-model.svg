<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1008" viewBox="0 0 720 1008" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Anti-Corruption Layer: a protected local stock model</title><desc id="desc">The shop asks availability for local SKU-42. A shop-owned Anti-Corruption Layer maps it to supplier ITEM-9 and calls the supplier lookup. The supplier’s active record reports quantity 10, committed 7, and damaged 2. The layer returns a local Availability with one sellable unit; the shop’s own model decides whether a request for two units can be supplied.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1008" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">External capability through the shop’s own model</text><rect x="24" y="104" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Shop model and local policy</text><text x="40" y="159" font-size="17" fill="#626962">availability(SKU-42) returns Availability(sellable_units=1).</text><text x="40" y="198" font-size="18" fill="#626962">can_supply(2) → False is the shop’s rule.</text><path d="M180 232V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="294" font-size="17" fill="#626962">local request</text><path d="M540 352V234" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="294" font-size="17" fill="#626962">local value</text><rect x="24" y="352" width="672" height="192" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="381" font-size="20" fill="#252c28">Shop-owned SupplierStockACL</text><text x="40" y="407" font-size="17" fill="#626962">Identity: SKU-42 → ITEM-9</text><text x="40" y="446" font-size="18" fill="#626962">Translate: 10 − 7 − 2 = 1 sellable unit, not status A → available.</text><text x="40" y="502" font-size="18" fill="#626962">Failure contract: TimeoutError → StockUnavailable</text><path d="M180 544V694" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="618" font-size="17" fill="#626962">lookup ITEM-9</text><path d="M540 696V546" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="618" font-size="17" fill="#626962">snapshot</text><rect x="24" y="696" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="725" font-size="20" fill="#252c28">Supplier model</text><text x="40" y="751" font-size="17" fill="#626962">lookup(ITEM-9): status A / quantity 10 / committed 7 / damaged 2</text><text x="40" y="790" font-size="18" fill="#626962">A means active record; quantity includes excluded units.</text><text x="24" y="912" font-size="17" fill="#252c28">Solid arrows show requests and returned values, not source dependencies.</text><text x="24" y="952" font-size="17" fill="#626962">Source dependency: boundary.py imports domain.py.</text></svg>
