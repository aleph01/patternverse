<svg xmlns="http://www.w3.org/2000/svg" width="720" height="984" viewBox="0 0 720 984" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Message Translator: a directional parcel contract</title><desc id="desc">Carrier schema 1 supplies event E901, parcel P42, gross_kg as the decimal string 1.250, and state R. Mapping carrier-a-v1/warehouse-v2 preserves event and parcel identity, converts kilograms to 1250 integer grams, and maps the documented carrier code R to ready_for_pickup. Warehouse schema 2 receives a newly constructed message with mapping provenance.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="984" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Translate a contract without inventing meaning</text><rect x="24" y="100" width="672" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="130" font-size="20" fill="#252c28">Carrier schema 1</text><text x="40" y="174" font-size="17" fill="#626962">source: carrier-a / event: E901</text><text x="40" y="214" font-size="17" fill="#626962">parcel: P42</text><text x="400" y="174" font-size="19" fill="#626962">gross_kg: &quot;1.250&quot;</text><text x="400" y="214" font-size="19" fill="#626962">state: R</text><path d="M360 260V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="310" font-size="17" fill="#626962">translate</text><rect x="24" y="352" width="672" height="208" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="384" font-size="20" fill="#252c28">Mapping: carrier-a-v1/warehouse-v2</text><text x="40" y="426" font-size="18" fill="#626962">Identity: carrier-a / E901 / P42</text><text x="40" y="462" font-size="18" fill="#626962">Gross mass: Decimal('1.250') × 1000 = 1250 g</text><text x="40" y="498" font-size="18" fill="#626962">Carrier state: R → ready_for_pickup; D → dispatched</text><text x="40" y="534" font-size="17" fill="#626962">Reject unsupported code, precision, or mass range.</text><path d="M360 560V654" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="656" width="672" height="192" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="688" font-size="20" fill="#252c28">Warehouse schema 2</text><text x="40" y="730" font-size="17" fill="#626962">source_system: carrier-a</text><text x="40" y="766" font-size="17" fill="#626962">event_id: E901 / parcel_id: P42</text><text x="400" y="730" font-size="18" fill="#626962">gross_mass_g: 1250</text><text x="400" y="766" font-size="17" fill="#626962">pickup_state: ready_for_pickup</text><text x="40" y="814" font-size="17" fill="#626962">mapping_version: carrier-a-v1/warehouse-v2</text><text x="24" y="928" font-size="17" fill="#252c28">Same gross mass. No rounding, enrichment, or reverse mapping is implied.</text></svg>
