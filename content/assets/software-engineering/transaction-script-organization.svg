<svg xmlns="http://www.w3.org/2000/svg" width="720" height="908" viewBox="0 0 720 908" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Transaction Script organizes rules by request</title><desc id="desc">An issue-stock request enters the issue_stock procedure. The procedure validates the quantity, reads stock, checks units against availability, calculates the remainder, and writes stock plus a movement record. The capacity decision lives inside the procedure; database rows hold data rather than supplying business-object methods.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="908" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Business rules live in the request procedure</text><rect x="24" y="84" width="672" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">Issue-stock request</text><text x="40" y="139" font-size="17" fill="#626962">P-7 · 3 whole units · movement I-1</text><path d="M360 172V242" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="244" width="672" height="540" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="44" y="282" font-size="23" fill="#252c28">issue_stock</text><rect x="44" y="316" width="280" height="90" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="345" font-size="20" fill="#252c28">Validate units</text><text x="60" y="371" font-size="17" fill="#626962">Positive whole count</text><rect x="396" y="316" width="280" height="90" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="412" y="345" font-size="20" fill="#252c28">Read available</text><text x="412" y="371" font-size="17" fill="#626962">P-7 has 5 units</text><path d="M324 360H394" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M536 406V428H360V452" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="44" y="454" width="632" height="96" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="483" font-size="20" fill="#252c28">Check + calculate</text><text x="60" y="509" font-size="17" fill="#626962">3 &lt;= 5 → remaining = 5 − 3 = 2</text><rect x="44" y="654" width="632" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="683" font-size="20" fill="#252c28">Write stock + movement</text><text x="60" y="709" font-size="17" fill="#626962">Use a local database transaction for both writes</text><path d="M360 550V652" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="836" font-size="18" fill="#252c28">The rule lives in the procedure; rows supply data.</text><text x="24" y="872" font-size="17" fill="#626962">Arrows show execution order within this request.</text></svg>
