<svg xmlns="http://www.w3.org/2000/svg" width="720" height="512" viewBox="0 0 720 512" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Independent service releases and owned records</title><desc id="desc">Orders release 7 and Inventory release 12 are separate deployment units. Orders sends a reservation request to Inventory through its contract. Each service accesses only its own records.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="512" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Business boundaries that are also release boundaries</text><rect x="24" y="120" width="284" height="246" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="154" font-size="20" fill="#252c28">Orders · release 7</text><rect x="44" y="184" width="244" height="68" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="213" font-size="20" fill="#252c28">Place order</text><text x="60" y="239" font-size="17" fill="#626962">Public contract</text><path d="M166 252V278" stroke="#a6aca3" stroke-width="1.2"/><rect x="44" y="278" width="244" height="68" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="307" font-size="20" fill="#252c28">Order status</text><text x="60" y="333" font-size="17" fill="#626962">Owned by this service</text><rect x="412" y="120" width="284" height="246" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="428" y="154" font-size="20" fill="#252c28">Inventory · release 12</text><rect x="432" y="184" width="244" height="68" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="448" y="213" font-size="20" fill="#252c28">Reserve units</text><text x="448" y="239" font-size="17" fill="#626962">Public contract</text><path d="M554 252V278" stroke="#a6aca3" stroke-width="1.2"/><rect x="432" y="278" width="244" height="68" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="448" y="307" font-size="20" fill="#252c28">Stock + reservations</text><text x="448" y="333" font-size="17" fill="#626962">Owned by this service</text><path d="M288 218H430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="328" y="168" font-size="17" fill="#252c28">reserve</text><text x="314" y="192" font-size="14" fill="#252c28">network request</text><text x="24" y="428" font-size="19" fill="#252c28">Separate deployables; explicit communication contracts.</text><text x="24" y="464" font-size="17" fill="#626962">No service writes directly to the other service’s records.</text></svg>
