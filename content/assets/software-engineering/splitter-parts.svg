<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1032" viewBox="0 0 720 1032" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Splitter: child identity and parent context</title><desc id="desc">Order event E901 for O42 contains L1 with two BOOK units and L2 with one MUG unit. Splitter creates two immutable child messages, retaining parent E901 and order O42. Each child has its own line ID and one-based position within a two-part sequence.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1032" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One composite input becomes distinct work</text><rect x="24" y="112" width="672" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="144" font-size="21" fill="#252c28">Order event E901 / order O42</text><text x="40" y="196" font-size="19" fill="#626962">L1: BOOK / 2 units</text><text x="400" y="196" font-size="19" fill="#626962">L2: MUG / 1 unit</text><text x="40" y="250" font-size="18" fill="#626962">Each line has its own identity, even when SKUs repeat.</text><path d="M360 288V382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="340" font-size="17" fill="#626962">extract</text><rect x="224" y="384" width="272" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="240" y="413" font-size="20" fill="#252c28">Splitter</text><text x="240" y="439" font-size="17" fill="#626962">Validate all, then construct.</text><path d="M360 484V560H180V638" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 560H540V638" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="640" width="312" height="208" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="669" font-size="20" fill="#252c28">Child L1</text><text x="40" y="695" font-size="17" fill="#626962">Key: (E901, L1)</text><text x="40" y="738" font-size="18" fill="#626962">Order: O42 / SKU: BOOK</text><text x="40" y="778" font-size="18" fill="#626962">Quantity: 2 units</text><text x="40" y="822" font-size="18" fill="#626962">Position: 1 / size: 2</text><rect x="384" y="640" width="312" height="208" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="669" font-size="20" fill="#252c28">Child L2</text><text x="400" y="695" font-size="17" fill="#626962">Key: (E901, L2)</text><text x="400" y="738" font-size="18" fill="#626962">Order: O42 / SKU: MUG</text><text x="400" y="778" font-size="18" fill="#626962">Quantity: 1 unit</text><text x="400" y="822" font-size="18" fill="#626962">Position: 2 / size: 2</text><text x="24" y="936" font-size="18" fill="#252c28">Arrows: create child messages; they do not represent worker completion.</text><text x="24" y="980" font-size="18" fill="#626962">Key = immutable parent event + line identity, not sequence position.</text></svg>
