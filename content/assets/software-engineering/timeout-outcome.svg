<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1152" viewBox="0 0 720 1152" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Timeout is distinct from confirmed operation outcome</title><desc id="desc">When a deadline expires, the caller takes a timeout path and may request cancellation. A cooperative local dependency releases its resource before reporting timeout. A remote service can commit before cancellation or a late reply arrives; the caller must reconcile that outcome rather than infer rollback.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1152" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A timeout and the operation’s outcome are different facts</text><text x="24" y="128" font-size="20" fill="#252c28">Cooperative local dependency</text><text x="400" y="128" font-size="20" fill="#252c28">One possible remote ordering</text><rect x="24" y="184" width="296" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="213" font-size="18" fill="#252c28">Deadline expires</text><text x="40" y="239" font-size="16" fill="#626962">Request cancellation.</text><rect x="400" y="184" width="296" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="416" y="213" font-size="18" fill="#252c28">Server commits</text><text x="416" y="239" font-size="16" fill="#626962">Client has no confirmation yet.</text><path d="M172 312V406" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M548 312V406" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="408" width="296" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="437" font-size="18" fill="#252c28">Unwind local finally</text><text x="40" y="463" font-size="16" fill="#626962">Run the owned cleanup path.</text><rect x="400" y="408" width="296" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="416" y="437" font-size="18" fill="#252c28">Client deadline expires</text><text x="416" y="463" font-size="16" fill="#626962">Cancellation can arrive too late.</text><path d="M172 536V630" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M548 536V630" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="632" width="296" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="661" font-size="18" fill="#252c28">Report TimeoutError</text><text x="40" y="687" font-size="16" fill="#626962">Cleanup may delay this step.</text><rect x="400" y="632" width="296" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="416" y="661" font-size="18" fill="#252c28">A reply arrives late</text><text x="416" y="687" font-size="16" fill="#626962">The wait has already expired.</text><rect x="24" y="864" width="672" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="896" font-size="20" fill="#252c28">Reconcile uncertain remote outcomes by operation identity</text><text x="40" y="940" font-size="17" fill="#626962">The local cleanup path does not prove that the remote operation stopped.</text><text x="40" y="984" font-size="17" fill="#626962">Timeout alone cannot confirm rejection, success, or rollback.</text><text x="24" y="1104" font-size="17" fill="#626962">Arrows: order within each example; the columns have separate lifecycles.</text></svg>
