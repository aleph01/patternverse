<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1176" viewBox="0 0 720 1176" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Proactor request lifetime and cancellation</title><desc id="desc">A and B occupy two request slots. B finishes first, but its queued completion still retains a slot. Cancellation is requested for A without freeing its context. The backend reports A successful with three bytes. Dispatch consumes B and A's actual outcomes and releases their request slots.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1176" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Retain request state until its terminal result is consumed</text><rect x="24" y="112" width="144" height="128" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="19" fill="#252c28">2 retained</text><rect x="208" y="112" width="488" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="224" y="141" font-size="18" fill="#252c28">Submit A and B / up to 8 bytes each</text><text x="224" y="167" font-size="16" fill="#626962">Both requests retain their own buffer and handler.</text><path d="M96 240V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="304" width="144" height="128" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="340" font-size="19" fill="#252c28">2 retained</text><rect x="208" y="304" width="488" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="224" y="333" font-size="18" fill="#252c28">B completes first with ok / 2 bytes</text><text x="224" y="359" font-size="16" fill="#626962">Its completion is queued; B’s request slot is not released yet.</text><path d="M96 432V494" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="496" width="144" height="128" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="532" font-size="19" fill="#252c28">2 retained</text><rect x="208" y="496" width="488" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="224" y="525" font-size="18" fill="#252c28">Request cancellation of A</text><text x="224" y="551" font-size="16" fill="#626962">Keep A’s context. Cancellation has not supplied an outcome.</text><path d="M96 624V686" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="688" width="144" height="128" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="724" font-size="19" fill="#252c28">2 retained</text><rect x="208" y="688" width="488" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="224" y="717" font-size="18" fill="#252c28">A completes successfully with hel / 3 bytes</text><text x="224" y="743" font-size="16" fill="#626962">A’s result still records that cancellation was requested.</text><path d="M96 816V878" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="880" width="144" height="128" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="916" font-size="19" fill="#252c28">0 retained</text><rect x="208" y="880" width="488" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="224" y="909" font-size="18" fill="#252c28">Dispatch B’s result, then A’s result</text><text x="224" y="935" font-size="16" fill="#626962">Release each pending request as its completion is dispatched.</text><text x="24" y="1090" font-size="17" fill="#626962">Arrows: the teaching model’s event trace; completion order is not universal.</text><text x="24" y="1130" font-size="16" fill="#626962">Slot retention through dispatch is a model policy, not a native API requirement.</text></svg>
