<svg xmlns="http://www.w3.org/2000/svg" width="720" height="512" viewBox="0 0 720 512" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">External assembly and later collaborator use</title><desc id="desc">Startup code chooses a price source and supplies it to QuoteService. Once assembled, QuoteService calls the supplied source through unit_price rather than constructing or looking up a provider.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="512" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Assemble separately, then use the collaborator</text><rect x="150" y="100" width="420" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="166" y="129" font-size="20" fill="#252c28">main.py · composition root</text><text x="166" y="155" font-size="17" fill="#626962">Chooses and constructs the concrete graph</text><path d="M500 180V298" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="520" y="238" font-size="17" fill="#626962">1 · create</text><path d="M220 180V298" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="42" y="238" font-size="17" fill="#626962">2 · supply provider</text><rect x="24" y="300" width="270" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="329" font-size="20" fill="#252c28">QuoteService(prices)</text><text x="40" y="355" font-size="17" fill="#626962">Stores the reference</text><rect x="426" y="300" width="270" height="80" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="442" y="329" font-size="20" fill="#252c28">Price provider</text><text x="442" y="355" font-size="17" fill="#626962">SQLite or memory</text><path d="M294 340H424" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="308" y="300" font-size="16" fill="#252c28">3 · later call</text><text x="310" y="324" font-size="16" fill="#252c28">unit_price</text><text x="24" y="438" font-size="17" fill="#626962">Dashed: startup construction and supply</text><text x="24" y="470" font-size="17" fill="#626962">Solid: operational call through the price-source contract</text></svg>
