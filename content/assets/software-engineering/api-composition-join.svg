<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1008" viewBox="0 0 720 1008" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Dependent owner API reads and an identity join</title><desc id="desc">An API Composer receives order IDs O42, O43, and O44. It calls Orders once, derives distinct customer IDs C2 and C7, calls Customers once, and joins returned rows by customer ID. The three cards retain requested order; O42 and O44 reuse the same C7 result.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1008" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Compose through owner APIs, not private tables</text><rect x="24" y="112" width="264" height="464" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="146" font-size="22" fill="#252c28">API Composer</text><text x="40" y="180" font-size="18" fill="#626962">O42 / O43 / O44</text><text x="40" y="282" font-size="17" fill="#626962">Read requested orders.</text><text x="40" y="342" font-size="16" fill="#626962">Deduplicate customer IDs,</text><text x="40" y="380" font-size="16" fill="#626962">then fetch those customers.</text><text x="40" y="546" font-size="18" fill="#252c28">Join by customer_id.</text><rect x="456" y="112" width="240" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="472" y="141" font-size="18" fill="#252c28">Orders API</text><text x="472" y="167" font-size="16" fill="#626962">Order rows + references</text><text x="472" y="248" font-size="17" fill="#626962">Owns order data</text><path d="M288 192H454" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="306" y="174" font-size="16" fill="#626962">1 / order IDs</text><path d="M456 240H290" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="306" y="222" font-size="16" fill="#626962">order rows</text><rect x="456" y="400" width="240" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="472" y="429" font-size="18" fill="#252c28">Customers API</text><text x="472" y="455" font-size="16" fill="#626962">Labels + revisions</text><text x="472" y="536" font-size="17" fill="#626962">Owns customer data</text><path d="M288 460H454" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="306" y="442" font-size="16" fill="#626962">2 / C2, C7</text><path d="M456 508H290" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="306" y="490" font-size="16" fill="#626962">customer rows</text><path d="M156 576V702" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="172" y="654" font-size="17" fill="#626962">3 / local identity join</text><rect x="24" y="704" width="672" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="733" font-size="20" fill="#252c28">Cards in requested order</text><text x="40" y="759" font-size="17" fill="#626962">O42 → Mira / 7000 euro cents / revisions (4, 11)</text><text x="40" y="810" font-size="17" fill="#626962">O43 → Sol / 2500 euro cents / revisions (1, 3)</text><text x="40" y="850" font-size="17" fill="#626962">O44 → Mira / 900 euro cents / revisions (2, 11)</text><text x="24" y="966" font-size="18" fill="#626962">Arrows: API requests, returned rows, and the composed result.</text></svg>
