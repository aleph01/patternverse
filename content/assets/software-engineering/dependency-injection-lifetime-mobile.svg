<svg xmlns="http://www.w3.org/2000/svg" width="360" height="868" viewBox="0 0 360 868" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Connection ownership around injected collaborators</title><desc id="desc">The application opens a database connection, builds SqlitePrices and QuoteService, uses the service while the connection is open, and closes the connection when its owning scope ends. The consumer borrows the collaborator and cannot safely keep using it afterward.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="868" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">The application owns</text><text x="24" y="60" font-size="22" fill="#252c28">the connection lifetime</text><rect x="24" y="104" width="312" height="614" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="138" font-size="20" fill="#252c28">Owning scope in main.py</text><rect x="44" y="166" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="195" font-size="20" fill="#252c28">1 · Open connection</text><text x="60" y="221" font-size="17" fill="#626962">Application acquires it</text><path d="M180 242V284" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="44" y="286" width="272" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="315" font-size="20" fill="#252c28">2 · Build collaborators</text><text x="60" y="341" font-size="17" fill="#626962">Adapter borrows connection</text><path d="M180 362V404" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="44" y="406" width="272" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="435" font-size="20" fill="#252c28">3 · Calculate quotes</text><text x="60" y="461" font-size="17" fill="#626962">Connection is still open</text><path d="M180 482V524" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="44" y="526" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="555" font-size="20" fill="#252c28">4 · Close on scope exit</text><text x="60" y="581" font-size="17" fill="#626962">Also when an error escapes</text><text x="44" y="652" font-size="18" fill="#252c28">Use finishes before close.</text><text x="40" y="690" font-size="16" fill="#626962">No ownership transfer to consumer.</text><text x="24" y="770" font-size="18" fill="#252c28">After exit: database access fails.</text><text x="24" y="804" font-size="17" fill="#626962">An injected reference can outlive</text><text x="24" y="830" font-size="17" fill="#626962">the resource it refers to.</text></svg>
