<svg xmlns="http://www.w3.org/2000/svg" width="720" height="984" viewBox="0 0 720 984" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Required identity coverage rejects an incomplete join</title><desc id="desc">Orders returns O42, O43, and O44 with customer references C7, C2, and C7. Customers returns C2 but omits required C7. The composer rejects the whole result as incomplete; it does not silently drop O42 and O44 or invent a customer label.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="984" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Require a complete answer or expose failure</text><rect x="24" y="112" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">Orders returns all 3 rows</text><text x="40" y="167" font-size="16" fill="#626962">O42 → C7 / O43 → C2 / O44 → C7</text><text x="40" y="252" font-size="18" fill="#626962">Required: C2 and C7</text><rect x="384" y="112" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="141" font-size="20" fill="#252c28">Customers returns C2 only</text><text x="400" y="167" font-size="17" fill="#626962">C7 is absent.</text><text x="400" y="252" font-size="18" fill="#626962">No replacement label</text><path d="M180 288V366H300V430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 288V366H420V430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="432" width="672" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="461" font-size="20" fill="#252c28">Composer checks exact identity coverage</text><text x="40" y="487" font-size="17" fill="#626962">Expected {C2, C7} ≠ actual {C2}</text><text x="40" y="552" font-size="19" fill="#626962">Raise CompositionError: Missing required identity</text><path d="M360 592V670" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="672" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="701" font-size="20" fill="#252c28">No cards returned from this query</text><text x="40" y="727" font-size="17" fill="#626962">Do not silently drop O42 and O44 or invent a customer label.</text><text x="40" y="770" font-size="18" fill="#626962">This example requires both APIs and every requested identity.</text><text x="24" y="900" font-size="17" fill="#626962">Arrows: owner responses, completeness check, and failure outcome.</text><text x="24" y="940" font-size="18" fill="#626962">Optional data requires an explicit partial-response policy.</text></svg>
