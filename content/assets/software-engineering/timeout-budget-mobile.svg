<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1240" viewBox="0 0 360 1240" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One shared quote budget</title><desc id="desc">A quote has one 300 millisecond budget. Inventory consumes the first 120 milliseconds, leaving shipping 180 milliseconds until the same deadline. Giving shipping a fresh 300 milliseconds would extend the operation to 420 milliseconds. Queueing and setup must be explicitly included or excluded from the chosen boundary.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1240" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Spend one shared budget</text><rect x="24" y="104" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="133" font-size="18" fill="#252c28">Quote budget / 300 ms</text><text x="40" y="159" font-size="16" fill="#626962">One deadline for both stages.</text><rect x="24" y="288" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="317" font-size="18" fill="#252c28">Inventory / 120 ms used</text><text x="40" y="343" font-size="16" fill="#626962">Remaining: 300 − 120 = 180 ms.</text><path d="M180 416V486" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="488" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="517" font-size="18" fill="#252c28">Shipping / up to 180 ms</text><text x="40" y="543" font-size="16" fill="#626962">The original deadline stays fixed.</text><path d="M180 616V686" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="688" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="717" font-size="18" fill="#252c28">Deadline / at 300 ms</text><text x="40" y="743" font-size="16" fill="#626962">Take the timeout path if overdue.</text><rect x="24" y="896" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="925" font-size="18" fill="#252c28">Resetting breaks the total budget</text><text x="40" y="970" font-size="17" fill="#626962">120 ms + a fresh 300 ms</text><text x="40" y="1014" font-size="17" fill="#626962">allows 420 ms across the two waits.</text><text x="24" y="1120" font-size="16" fill="#626962">Arrows: stage handoff toward expiry.</text><text x="24" y="1160" font-size="16" fill="#626962">Queue/setup need an explicit boundary.</text><text x="24" y="1200" font-size="16" fill="#626962">Illustrative accounting; not a benchmark.</text></svg>
