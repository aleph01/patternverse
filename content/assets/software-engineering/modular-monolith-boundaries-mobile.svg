<svg xmlns="http://www.w3.org/2000/svg" width="360" height="974" viewBox="0 0 360 974" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Public interfaces and owned state inside one application release</title><desc id="desc">One application release contains Customers and Tickets modules. Startup code composes their public APIs. Tickets calls the Customers API locally, while each module keeps its own records behind that interface.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="974" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">One deployment;</text><text x="24" y="60" font-size="22" fill="#252c28">explicit module boundaries</text><rect x="24" y="104" width="312" height="762" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="134" font-size="19" fill="#252c28">One application release</text><rect x="44" y="152" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="181" font-size="20" fill="#252c28">main.py</text><text x="60" y="207" font-size="17" fill="#626962">Startup composition</text><rect x="44" y="294" width="272" height="222" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="326" font-size="21" fill="#252c28">Tickets</text><rect x="64" y="344" width="232" height="64" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="80" y="373" font-size="20" fill="#252c28">Tickets API</text><text x="80" y="399" font-size="17" fill="#626962">open · get</text><rect x="64" y="430" width="232" height="64" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="80" y="459" font-size="20" fill="#252c28">Ticket state</text><text x="80" y="485" font-size="17" fill="#626962">Owned by Tickets</text><rect x="44" y="612" width="272" height="222" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="644" font-size="21" fill="#252c28">Customers</text><rect x="64" y="662" width="232" height="64" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="80" y="691" font-size="20" fill="#252c28">Customers API</text><text x="80" y="717" font-size="17" fill="#626962">active_customer</text><rect x="64" y="748" width="232" height="64" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="80" y="777" font-size="20" fill="#252c28">Customer store</text><text x="80" y="803" font-size="17" fill="#626962">_store.py · private</text><path d="M268 228V342" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><path d="M316 190H328V694H298" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><path d="M64 376H36V694H62" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="60" y="566" font-size="18" fill="#252c28">local call</text><text x="24" y="914" font-size="17" fill="#626962">Dashed: startup wiring</text><text x="24" y="946" font-size="17" fill="#626962">Solid: local call through an API</text></svg>
