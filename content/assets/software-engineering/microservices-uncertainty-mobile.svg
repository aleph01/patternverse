<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1028" viewBox="0 0 360 1028" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Remote success with a lost reply and an explicit retry</title><desc id="desc">Inventory accepts a reservation and reduces stock, but its reply is lost. Orders stays pending. A later retry with the same order identity retrieves the existing reservation and lets Orders confirm without reducing stock again.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1028" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">A lost reply is an</text><text x="24" y="60" font-size="22" fill="#252c28">uncertain outcome</text><text x="24" y="98" font-size="17" fill="#626962">Read downward: event order</text><rect x="24" y="130" width="312" height="126" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="160" font-size="20" fill="#252c28">1 · Orders requests</text><text x="40" y="196" font-size="18" fill="#252c28">Reserve 2 units for o1</text><text x="40" y="226" font-size="17" fill="#626962">Order status: pending</text><path d="M180 256V296" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="298" width="312" height="126" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="328" font-size="20" fill="#252c28">2 · Inventory records</text><text x="40" y="364" font-size="18" fill="#252c28">Stock: 4 → 2 units</text><text x="40" y="394" font-size="17" fill="#626962">Remembers o1: reserved</text><path d="M180 424V468" fill="none" stroke="#626962" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M175 447L185 457M175 457L185 447" stroke="#626962" stroke-width="1.4"/><text x="200" y="458" font-size="17" fill="#626962">Reply lost</text><rect x="24" y="482" width="312" height="126" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="512" font-size="20" fill="#252c28">3 · Orders waits</text><text x="40" y="548" font-size="18" fill="#252c28">Outcome remains unknown</text><text x="40" y="578" font-size="17" fill="#626962">Order status: pending</text><path d="M180 608V648" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="650" width="312" height="126" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="680" font-size="20" fill="#252c28">4 · Orders retries o1</text><text x="40" y="716" font-size="18" fill="#252c28">Same identity + 2 units</text><text x="40" y="746" font-size="17" fill="#626962">Inventory returns saved result</text><path d="M180 776V816" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="818" width="312" height="126" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="848" font-size="20" fill="#252c28">5 · Orders confirms</text><text x="40" y="884" font-size="18" fill="#252c28">Order status: confirmed</text><text x="40" y="914" font-size="17" fill="#626962">Stock stays at 2 units</text><text x="24" y="990" font-size="17" fill="#626962">No cross-service transaction.</text></svg>
