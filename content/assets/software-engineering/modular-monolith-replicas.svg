<svg xmlns="http://www.w3.org/2000/svg" width="720" height="614" viewBox="0 0 720 614" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Scaling the application with complete runtime replicas</title><desc id="desc">A router sends each request to one of two replicas of the same application release. Each replica contains both Customers and Tickets; the modules remain part of the same deployment unit.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="614" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One release, multiple runtime replicas</text><rect x="240" y="98" width="240" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="256" y="127" font-size="20" fill="#252c28">Route each request</text><text x="256" y="153" font-size="17" fill="#626962">Choose one replica</text><path d="M360 174V208H174V258" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 208H546V258" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="260" width="300" height="244" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="294" font-size="20" fill="#252c28">Replica 1 · release A</text><rect x="44" y="326" width="260" height="60" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="362" font-size="19" fill="#252c28">Customers</text><rect x="44" y="410" width="260" height="60" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="446" font-size="19" fill="#252c28">Tickets</text><rect x="396" y="260" width="300" height="244" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="412" y="294" font-size="20" fill="#252c28">Replica 2 · release A</text><rect x="416" y="326" width="260" height="60" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="432" y="362" font-size="19" fill="#252c28">Customers</text><rect x="416" y="410" width="260" height="60" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="432" y="446" font-size="19" fill="#252c28">Tickets</text><text x="24" y="554" font-size="18" fill="#252c28">Replicas contain the complete application.</text><text x="24" y="586" font-size="17" fill="#626962">Storage and concurrency still need explicit design.</text></svg>
