<svg xmlns="http://www.w3.org/2000/svg" width="720" height="792" viewBox="0 0 720 792" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Policy outcomes and protected-body reads</title><desc id="desc">Four evaluations show enforcement outcomes. Under policy version 1, Alice’s R1 request is allowed and reads North’s body; R2 is denied without a body read. After revocation, version 2 denies R1. An unavailable decision service produces no response and no body read. Unsupported obligations also block an otherwise permitted read.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="792" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Only usable, explicit permission releases a body</text><text x="24" y="78" font-size="19" fill="#626962">The handler distinguishes denial from an unavailable decision.</text><text x="40" y="132" font-size="19" fill="#626962">Read request</text><text x="376" y="132" font-size="19" fill="#626962">Evaluation</text><text x="552" y="132" font-size="19" fill="#626962">Body read</text><rect x="24" y="160" width="672" height="108" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="198" font-size="21" fill="#252c28">Own tenant</text><text x="40" y="238" font-size="18" fill="#626962">alice / R1</text><path d="M340 216H364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="222" font-size="20" fill="#252c28">P1 · allow</text><text x="552" y="222" font-size="20" fill="#252c28">Yes</text><path d="M516 216H544" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="288" width="672" height="108" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="326" font-size="21" fill="#252c28">Other tenant</text><text x="40" y="366" font-size="18" fill="#626962">alice / R2</text><path d="M340 344H364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="350" font-size="20" fill="#252c28">P1 · deny</text><text x="552" y="350" font-size="20" fill="#252c28">No</text><rect x="24" y="416" width="672" height="108" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="454" font-size="21" fill="#252c28">After revocation</text><text x="40" y="494" font-size="18" fill="#626962">alice / R1</text><path d="M340 472H364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="478" font-size="20" fill="#252c28">P2 · deny</text><text x="552" y="478" font-size="20" fill="#252c28">No</text><rect x="24" y="544" width="672" height="108" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="582" font-size="21" fill="#252c28">Engine offline</text><text x="40" y="622" font-size="18" fill="#626962">alice / R1</text><path d="M340 600H364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="606" font-size="20" fill="#252c28">Unavailable</text><text x="552" y="606" font-size="20" fill="#252c28">No</text><text x="24" y="708" font-size="19" fill="#252c28">A permit with unsupported obligations also blocks the read.</text><text x="24" y="752" font-size="19" fill="#626962">Policy version labels do not prove fleet-wide freshness.</text></svg>
