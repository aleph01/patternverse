<svg xmlns="http://www.w3.org/2000/svg" width="360" height="856" viewBox="0 0 360 856" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Independent service releases and owned records</title><desc id="desc">Orders release 7 and Inventory release 12 are separate deployment units. Orders sends a reservation request to Inventory through its contract. Each service accesses only its own records.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="856" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Business boundaries;</text><text x="24" y="60" font-size="22" fill="#252c28">independent releases</text><rect x="24" y="108" width="312" height="246" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="142" font-size="20" fill="#252c28">Orders · release 7</text><rect x="44" y="172" width="272" height="68" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="201" font-size="20" fill="#252c28">Place order</text><text x="60" y="227" font-size="17" fill="#626962">Public contract</text><path d="M180 240V266" stroke="#a6aca3" stroke-width="1.2"/><rect x="44" y="266" width="272" height="68" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="295" font-size="20" fill="#252c28">Order status</text><text x="60" y="321" font-size="17" fill="#626962">Owned by this service</text><text x="64" y="406" font-size="17" fill="#252c28">reserve · network request</text><path d="M44 206H12V582H42" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="484" width="312" height="246" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="518" font-size="20" fill="#252c28">Inventory · release 12</text><rect x="44" y="548" width="272" height="68" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="577" font-size="20" fill="#252c28">Reserve units</text><text x="60" y="603" font-size="17" fill="#626962">Public contract</text><path d="M180 616V642" stroke="#a6aca3" stroke-width="1.2"/><rect x="44" y="642" width="272" height="68" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="671" font-size="20" fill="#252c28">Stock + reservations</text><text x="60" y="697" font-size="17" fill="#626962">Owned by this service</text><text x="24" y="788" font-size="17" fill="#252c28">Each service owns its records.</text><text x="24" y="820" font-size="17" fill="#626962">Releases keep contracts compatible.</text></svg>
