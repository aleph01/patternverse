<svg xmlns="http://www.w3.org/2000/svg" width="720" height="744" viewBox="0 0 720 744" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One shared stream, two active consumers</title><desc id="desc">One thumbnail work queue contains jobs J1, J2, and J3. Consumer A receives J1 while consumer B receives J2. J3 remains ready until a consumer requests more work. These workers divide one logical stream; they do not each receive every job.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="744" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">One shared stream, two active consumers</text><text x="24" y="78" font-size="19" fill="#626962">Snapshot after two receives.</text><rect x="200" y="112" width="320" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="216" y="148" font-size="22" fill="#252c28">Shared work queue</text><text x="216" y="184" font-size="20" fill="#252c28">J3 remains ready</text><text x="216" y="212" font-size="17" fill="#626962">J1 and J2 have been delivered.</text><path d="M240 224V264H180V348" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="310" font-size="20" fill="#252c28">J1 / token 1 → A</text><path d="M480 224V264H540V348" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="384" y="310" font-size="20" fill="#252c28">J2 / token 2 → B</text><rect x="24" y="352" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="392" font-size="22" fill="#252c28">Consumer A</text><text x="40" y="436" font-size="21" fill="#252c28">Holds J1 / token 1</text><text x="40" y="478" font-size="18" fill="#626962">Thumbnail handler</text><rect x="384" y="352" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="392" font-size="22" fill="#252c28">Consumer B</text><text x="400" y="436" font-size="21" fill="#252c28">Holds J2 / token 2</text><text x="400" y="478" font-size="18" fill="#626962">Thumbnail handler</text><rect x="24" y="552" width="672" height="148" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="592" font-size="23" fill="#252c28">One recipient per delivery.</text><text x="40" y="636" font-size="20" fill="#626962">B can acknowledge J2, then receive J3 while A holds J1.</text><text x="40" y="676" font-size="19" fill="#626962">Equal work shares are not promised.</text></svg>
