<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1048" viewBox="0 0 720 1048" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Splitter: validation and publication boundaries</title><desc id="desc">A bounded input is fully validated before two children are returned. An invalid second line instead raises SplitError and returns no children. Later publication is a separate boundary: child L1 can be accepted while sending L2 fails, leaving a partial delivery that requires recovery.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1048" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A local return value is not an atomic publication</text><rect x="24" y="104" width="672" height="408" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="140" font-size="22" fill="#252c28">Inside split_order: validate before returning</text><rect x="40" y="184" width="264" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="213" font-size="20" fill="#252c28">All lines valid</text><text x="56" y="239" font-size="17" fill="#626962">L1: 2 units / L2: 1 unit</text><path d="M304 240H398" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="400" y="184" width="280" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="416" y="213" font-size="20" fill="#252c28">Return 2 children</text><text x="416" y="239" font-size="17" fill="#626962">Immutable local values</text><rect x="40" y="352" width="264" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="381" font-size="20" fill="#252c28">Invalid second line</text><text x="56" y="407" font-size="17" fill="#626962">L1: 2 units / L2: 0 units</text><path d="M304 408H398" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="400" y="352" width="280" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="416" y="381" font-size="20" fill="#252c28">Raise SplitError</text><text x="416" y="407" font-size="17" fill="#626962">No children returned</text><rect x="24" y="608" width="672" height="304" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="648" font-size="22" fill="#252c28">Later: caller publishes the valid children</text><rect x="40" y="688" width="280" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="56" y="717" font-size="20" fill="#252c28">Child L1</text><text x="56" y="743" font-size="17" fill="#626962">Broker accepts</text><rect x="376" y="688" width="304" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="392" y="717" font-size="20" fill="#252c28">Child L2</text><text x="392" y="743" font-size="17" fill="#626962">Send fails</text><text x="40" y="844" font-size="19" fill="#252c28">Partial delivery needs recovery. A replay can repeat L1.</text><text x="40" y="884" font-size="18" fill="#626962">Stable keys support deduplication; they do not perform it.</text><text x="24" y="996" font-size="18" fill="#252c28">Local validation cannot roll back a broker acceptance or a business effect.</text></svg>
