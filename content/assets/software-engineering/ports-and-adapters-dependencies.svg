<svg xmlns="http://www.w3.org/2000/svg" width="720" height="478" viewBox="0 0 720 478" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Runtime calls versus source dependencies</title><desc id="desc">Runtime calls go from the application to a SQLite adapter through the stock port. The source import goes in the opposite direction: adapters.py imports definitions from application.py, while application.py imports no adapters.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="478" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Calls and imports point different ways</text><text x="24" y="86" font-size="21" fill="#252c28">Runtime: application calls the adapter</text><rect x="24" y="118" width="272" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="147" font-size="20" fill="#252c28">ReserveStock</text><text x="40" y="173" font-size="17" fill="#626962">Calls StockPort.take</text><rect x="424" y="118" width="272" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="440" y="147" font-size="20" fill="#252c28">SQLiteStock</text><text x="440" y="173" font-size="17" fill="#626962">Executes SQL</text><path d="M296 168H422" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340" y="150" font-size="17" fill="#252c28">call</text><text x="24" y="278" font-size="21" fill="#252c28">Source: adapters depend on the application</text><rect x="24" y="310" width="272" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="339" font-size="20" fill="#252c28">application.py</text><text x="40" y="365" font-size="17" fill="#626962">Operation · port · error</text><rect x="424" y="310" width="272" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="440" y="339" font-size="20" fill="#252c28">adapters.py</text><text x="440" y="365" font-size="17" fill="#626962">Imports app definitions</text><path d="M424 360H298" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="330" y="342" font-size="17" fill="#252c28">import</text><text x="24" y="450" font-size="17" fill="#626962">The core never imports its storage adapter.</text></svg>
