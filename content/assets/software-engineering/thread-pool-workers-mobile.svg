<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1312" viewBox="0 0 360 1312" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Thread Pool: workers and admission</title><desc id="desc">A coordinator admits at most four jobs awaiting result collection. The pool has up to two reusable threads; in the illustrated snapshot two jobs execute while two wait. A thread finishes one job and takes another instead of being recreated. Completed futures still occupy the coordinator’s admission window until collected.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1312" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Two limits, one workload</text><rect x="24" y="112" width="312" height="152" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="144" font-size="18" fill="#252c28">Coordinator window = four jobs</text><text x="40" y="188" font-size="16" fill="#626962">Count every submitted job whose</text><text x="40" y="220" font-size="16" fill="#626962">outcome has not been collected.</text><path d="M180 264V334" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="308" font-size="16" fill="#626962">submit</text><rect x="24" y="336" width="312" height="152" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="368" font-size="17" fill="#252c28">Two queued calls in this snapshot</text><rect x="40" y="400" width="128" height="56" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="192" y="400" width="128" height="56" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="54" y="434" font-size="18" fill="#252c28">job 2</text><text x="206" y="434" font-size="18" fill="#252c28">job 3</text><path d="M180 488V590" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="544" font-size="16" fill="#626962">dispatch</text><rect x="24" y="592" width="312" height="200" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="624" font-size="18" fill="#252c28">Pool: up to two worker threads</text><text x="40" y="670" font-size="18" fill="#252c28">A executes job 0.</text><text x="40" y="710" font-size="18" fill="#252c28">B executes job 1.</text><text x="40" y="760" font-size="16" fill="#626962">Reuse these threads for later jobs.</text><rect x="24" y="888" width="312" height="168" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="920" font-size="19" fill="#252c28">Finished but not collected?</text><text x="40" y="964" font-size="15" fill="#626962">The future still counts in the window.</text><text x="40" y="1008" font-size="16" fill="#626962">Collect it before admitting more.</text><text x="24" y="1130" font-size="16" fill="#626962">Snapshot: two running + two queued.</text><text x="24" y="1170" font-size="16" fill="#626962">The pool ceiling alone is not a</text><text x="24" y="1202" font-size="16" fill="#626962">limit on the submitted backlog.</text><text x="24" y="1260" font-size="16" fill="#626962">Arrows: submission and dispatch.</text></svg>
