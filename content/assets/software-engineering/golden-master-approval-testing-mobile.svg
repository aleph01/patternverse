<svg xmlns="http://www.w3.org/2000/svg" width="360" height="884" viewBox="0 0 360 884" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Observe, compare, review</title><desc id="desc">A fixed scenario produces an actual report that is compared with a reviewed approved file. A mismatch writes a separate received file and a diff. Only a deliberate review can replace the approved baseline; the normal test never updates it.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="884" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Observe, compare, review</text><text x="24" y="80" font-size="17" fill="#626962">Execution boundaries and evidence</text><rect x="24" y="112" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="20" fill="#252c28">Fixed scenario</text><text x="40" y="188" font-size="16" fill="#252c28">Produce a reproducible observation</text><text x="40" y="224" font-size="15" fill="#626962">Normalize only justified differences</text><path d="M72 252V304" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="288" font-size="17" fill="#626962">Observe</text><rect x="24" y="308" width="312" height="140" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="344" font-size="20" fill="#252c28">Compare to approved</text><text x="40" y="384" font-size="16" fill="#252c28">Read the reviewed baseline</text><text x="40" y="420" font-size="15" fill="#626962">Normal tests do not change it</text><path d="M72 448V500" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="484" font-size="17" fill="#626962">Compare</text><rect x="24" y="504" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="540" font-size="20" fill="#252c28">Match or mismatch</text><text x="40" y="580" font-size="16" fill="#252c28">Match: pass; mismatch: fail + diff</text><text x="40" y="616" font-size="15" fill="#626962">Write received output separately</text><path d="M72 644V696" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="680" font-size="17" fill="#626962">For a mismatch</text><rect x="24" y="700" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="736" font-size="20" fill="#252c28">Review a difference</text><text x="40" y="776" font-size="16" fill="#252c28">Keep or deliberately replace baseline</text><text x="40" y="812" font-size="15" fill="#626962">Review is a separate operation</text></svg>
