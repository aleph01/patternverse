<svg xmlns="http://www.w3.org/2000/svg" width="720" height="506" viewBox="0 0 720 506" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Startup registration and a sealed execution registry</title><desc id="desc">During configuration, the core checks each extension’s declared API version and unique identity before registration. The first string input seals the registry. Requests then execute against that fixed set; later registration is rejected.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="506" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Choose extensions before serving requests</text><rect x="24" y="116" width="280" height="132" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="152" font-size="22" fill="#252c28">Configuring</text><text x="40" y="188" font-size="17" fill="#252c28">API v1 · unique identity</text><text x="40" y="218" font-size="17" fill="#252c28">Register trusted extensions</text><rect x="416" y="116" width="280" height="132" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="432" y="152" font-size="22" fill="#252c28">Sealed</text><text x="432" y="188" font-size="17" fill="#252c28">Same configured extensions</text><text x="432" y="218" font-size="17" fill="#252c28">Dispatch in registration order</text><path d="M304 182H414" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="312" y="140" font-size="17" fill="#252c28">First string</text><text x="312" y="162" font-size="17" fill="#252c28">input</text><text x="24" y="306" font-size="17" fill="#626962">Further registration is allowed.</text><path d="M556 248V362" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="572" y="318" font-size="17" fill="#252c28">register</text><rect x="416" y="364" width="280" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="432" y="393" font-size="20" fill="#252c28">Registration rejected</text><text x="432" y="419" font-size="17" fill="#626962">Registry stays sealed</text><text x="24" y="368" font-size="17" fill="#252c28">No extensions is a valid setup.</text><text x="24" y="396" font-size="17" fill="#626962">Hot replacement is not modeled.</text><text x="24" y="478" font-size="17" fill="#626962">Sealing fixes configuration; it does not isolate execution.</text></svg>
