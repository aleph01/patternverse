<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A three-unit policy admits only work that fits</title><desc id="desc">With capacity three, a running heavy search occupies two units. A second two-unit search would require four and is refused without invocation. A one-unit lookup fits exactly alongside the running search. After local work finishes and releases its units, a later heavy search can run. Policy units do not reserve execution threads or predict actual resource consumption.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#252c28" stroke-width="1.2"/></marker></defs><rect width="720" height="976" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A three-unit policy admits only work that fits</text><rect x="24" y="112" width="672" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="148" font-size="22" fill="#252c28">Held heavy search / cost 2</text><rect x="40" y="190" width="30" height="30" fill="#00855b" stroke="#00855b" stroke-width="1.2"/><rect x="84" y="190" width="30" height="30" fill="#00855b" stroke="#00855b" stroke-width="1.2"/><rect x="128" y="190" width="30" height="30" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="208" y="214" font-size="20" fill="#626962">2 occupied / 1 available / capacity 3</text><text x="24" y="320" font-size="20" fill="#626962">While the first search is active</text><rect x="24" y="352" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="388" font-size="22" fill="#252c28">Next heavy / cost 2</text><text x="40" y="438" font-size="20" fill="#252c28">2 + 2 = 4 > 3 / refused</text><text x="40" y="484" font-size="17" fill="#626962">No invocation; no budget claim.</text><rect x="384" y="352" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="388" font-size="22" fill="#252c28">Light lookup / cost 1</text><text x="400" y="438" font-size="20" fill="#252c28">2 + 1 = 3 / fits exactly</text><text x="400" y="484" font-size="17" fill="#626962">Caller thread was already available.</text><rect x="24" y="624" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="662" font-size="22" fill="#252c28">Finish held work; release its 2 units</text><text x="40" y="706" font-size="19" fill="#626962">Later heavy work can claim 2 units again.</text><rect x="24" y="800" width="672" height="136" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="838" font-size="22" fill="#252c28">A policy budget, not a hardware reservation</text><text x="40" y="882" font-size="19" fill="#626962">No priority guarantee, timed rate, or fleet-wide accounting.</text></svg>
