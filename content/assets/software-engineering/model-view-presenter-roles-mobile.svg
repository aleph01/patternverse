<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1184" viewBox="0 0 360 1184" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">MVP with a passive view and an interchangeable recording view</title><desc id="desc">A reservation view forwards quantity text to a presenter. The presenter commands the booking model and reads its remaining seats, then sends display text, button availability, and a message back to the view. In the Passive View example there is no direct model-to-view connection. A recording view implements the same render contract during tests.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1184" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Passive View MVP:</text><text x="24" y="60" font-size="21" fill="#252c28">coordinate through a contract</text><rect x="24" y="104" width="312" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">View: widget adapter</text><text x="40" y="159" font-size="17" fill="#626962">Forward quantity text: &quot;2&quot;.</text><path d="M180 200V286" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="252" font-size="17" fill="#626962">event</text><rect x="24" y="288" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="317" font-size="20" fill="#252c28">Presenter: handle input</text><text x="40" y="343" font-size="17" fill="#626962">Parse text; call reserve(2).</text><path d="M180 400V486" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="452" font-size="17" fill="#626962">command</text><rect x="24" y="488" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="517" font-size="20" fill="#252c28">Booking model</text><text x="40" y="543" font-size="17" fill="#626962">Enforce capacity; mutate.</text><path d="M180 600V686" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="652" font-size="17" fill="#626962">remaining: 1</text><rect x="24" y="688" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="717" font-size="20" fill="#252c28">Same presenter: refresh</text><text x="40" y="743" font-size="17" fill="#626962">Build text, flag, and message.</text><path d="M180 800V886" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="852" font-size="17" fill="#626962">render(screen)</text><rect x="24" y="888" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="917" font-size="20" fill="#252c28">Same view: display</text><text x="40" y="943" font-size="17" fill="#626962">Seats left: 1; Reserve enabled.</text><text x="24" y="1052" font-size="18" fill="#252c28">Tests substitute RecordingView.</text><text x="24" y="1088" font-size="17" fill="#626962">It records the same screen value.</text><text x="24" y="1140" font-size="18" fill="#252c28">No direct view/model link.</text></svg>
