<svg xmlns="http://www.w3.org/2000/svg" width="720" height="652" viewBox="0 0 720 652" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One boundary, two implementations during migration</title><desc id="desc">Checkout and basket preview call an application-owned Rates boundary. One configured implementation serves each application instance: the legacy adapter or the new rate engine. Both are checked against the same behavioral contract.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="652" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Keep callers behind one application-owned seam</text><text x="24" y="80" font-size="18" fill="#626962">During migration · one selected implementation per application instance</text><rect x="24" y="112" width="312" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="22" fill="#252c28">Checkout</text><text x="40" y="184" font-size="18" fill="#252c28">Call quote_cents(weight_g)</text><rect x="384" y="112" width="312" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="148" font-size="22" fill="#252c28">Basket preview</text><text x="400" y="184" font-size="18" fill="#252c28">Call quote_cents(weight_g)</text><path d="M180 200V260" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 200V260" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="264" y="236" font-size="18" fill="#626962">Application calls</text><rect x="24" y="264" width="672" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="302" font-size="22" fill="#252c28">Rates · application-owned contract</text><text x="40" y="342" font-size="18" fill="#252c28">Positive integer grams in; integer US cents out; specified errors.</text><path d="M180 368V456" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 368V456" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="218" y="414" font-size="19" fill="#626962">Select one implementation</text><rect x="24" y="460" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="498" font-size="22" fill="#252c28">Legacy adapter</text><text x="40" y="536" font-size="18" fill="#626962">Wraps the vendor library</text><rect x="384" y="460" width="312" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="498" font-size="22" fill="#252c28">New rate engine</text><text x="400" y="536" font-size="18" fill="#626962">Implements the same contract</text><text x="24" y="612" font-size="19" fill="#252c28">Shared behavioral checks exercise both implementations independently.</text></svg>
