<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1136" viewBox="0 0 360 1136" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Share the fixed cost</title><desc id="desc">Seven individual calls would each pay five milliseconds of fixed overhead plus one millisecond per item, totaling 42 milliseconds of modeled service work. The example emits four batches containing three, one, one, and two items, totaling 27 milliseconds under the same assumptions. Collection waiting is excluded.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1136" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Share the fixed cost</text><text x="24" y="78" font-size="17" fill="#626962">Model: 5 ms per call + 1 ms per item.</text><rect x="24" y="112" width="312" height="284" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="21" fill="#252c28">Seven individual calls</text><rect x="40" y="176" width="56" height="56" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="49" y="200" font-size="17" fill="#252c28">a</text><text x="49" y="222" font-size="16" fill="#626962">6 ms</text><rect x="112" y="176" width="56" height="56" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="121" y="200" font-size="17" fill="#252c28">bb</text><text x="121" y="222" font-size="16" fill="#626962">6 ms</text><rect x="184" y="176" width="56" height="56" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="193" y="200" font-size="17" fill="#252c28">c</text><text x="193" y="222" font-size="16" fill="#626962">6 ms</text><rect x="256" y="176" width="56" height="56" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="265" y="200" font-size="17" fill="#252c28">dddd</text><text x="265" y="222" font-size="16" fill="#626962">6 ms</text><rect x="40" y="248" width="56" height="56" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="49" y="272" font-size="17" fill="#252c28">eee</text><text x="49" y="294" font-size="16" fill="#626962">6 ms</text><rect x="112" y="248" width="56" height="56" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="121" y="272" font-size="17" fill="#252c28">f</text><text x="121" y="294" font-size="16" fill="#626962">6 ms</text><rect x="184" y="248" width="56" height="56" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="193" y="272" font-size="17" fill="#252c28">g</text><text x="193" y="294" font-size="16" fill="#626962">6 ms</text><text x="40" y="370" font-size="23" fill="#252c28">7 × (5 + 1) = 42 ms</text><rect x="24" y="432" width="312" height="500" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="468" font-size="21" fill="#252c28">Four grouped calls</text><rect x="40" y="496" width="280" height="76" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="525" font-size="20" fill="#252c28">a, bb, c</text><text x="56" y="555" font-size="18" fill="#626962">3 items: 5 + 3 = 8 ms</text><rect x="40" y="594" width="280" height="76" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="623" font-size="20" fill="#252c28">dddd</text><text x="56" y="653" font-size="18" fill="#626962">1 item: 5 + 1 = 6 ms</text><rect x="40" y="692" width="280" height="76" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="721" font-size="20" fill="#252c28">eee</text><text x="56" y="751" font-size="18" fill="#626962">1 item: 5 + 1 = 6 ms</text><rect x="40" y="790" width="280" height="76" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="819" font-size="20" fill="#252c28">f, g</text><text x="56" y="849" font-size="18" fill="#626962">2 items: 5 + 2 = 7 ms</text><text x="40" y="908" font-size="22" fill="#252c28">8 + 6 + 6 + 7 = 27 ms</text><rect x="24" y="972" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1008" font-size="19" fill="#252c28">Same 7 items; 3 fewer calls.</text><text x="40" y="1046" font-size="17" fill="#626962">15 ms less modeled service work.</text><text x="40" y="1080" font-size="17" fill="#626962">Collection waiting is additional.</text></svg>
