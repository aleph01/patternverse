<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1312" viewBox="0 0 360 1312" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Resource Pool: lifetime and exclusive use</title><desc id="desc">A pool manages two resources. One belongs exclusively to caller A while another is idle and available to caller B. Caller C must wait if both are borrowed. Use takes place outside the pool’s coordination lock, and a resource becomes available again only after return cleanup.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1312" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Pool owns resource lifetime</text><rect x="24" y="112" width="312" height="184" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="144" font-size="19" fill="#252c28">Pool owns two 8-byte buffers</text><text x="40" y="190" font-size="16" fill="#626962">R0 is already lent to caller A.</text><text x="40" y="232" font-size="16" fill="#626962">R1 is idle until caller B checks out.</text><text x="40" y="274" font-size="16" fill="#626962">No extra buffer on exhaustion.</text><rect x="24" y="384" width="312" height="136" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="416" font-size="20" fill="#252c28">Caller B borrows R1</text><text x="40" y="460" font-size="16" fill="#626962">R1 changes from idle to borrowed.</text><text x="40" y="496" font-size="16" fill="#626962">It is the same resource, not a copy.</text><rect x="24" y="608" width="312" height="136" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="640" font-size="20" fill="#252c28">Caller A still holds R0</text><text x="40" y="684" font-size="16" fill="#626962">Use outside the coordination lock.</text><text x="40" y="720" font-size="16" fill="#626962">No other borrower gets R0.</text><path d="M180 296V382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="346" font-size="16" fill="#626962">checkout</text><text x="40" y="566" font-size="16" fill="#626962">Two active borrows, distinct resources.</text><rect x="24" y="840" width="312" height="184" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="872" font-size="19" fill="#252c28">Both borrowed or resetting?</text><text x="40" y="916" font-size="16" fill="#626962">Caller C waits for availability.</text><text x="40" y="960" font-size="16" fill="#626962">Return cleanup must finish first.</text><text x="40" y="1000" font-size="15" fill="#626962">Close wakes waiters to reject them.</text><text x="24" y="1100" font-size="16" fill="#626962">Capacity: idle + borrowed + resetting.</text><text x="24" y="1150" font-size="16" fill="#626962">An active borrow occupies a place</text><text x="24" y="1182" font-size="16" fill="#626962">even while its caller is doing no work.</text><text x="24" y="1260" font-size="16" fill="#626962">Arrow: checkout of R1 to caller B.</text></svg>
