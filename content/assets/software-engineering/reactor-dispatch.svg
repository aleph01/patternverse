<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1104" viewBox="0 0 720 1104" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Reactor readiness dispatch</title><desc id="desc">Two sockets are registered with the Reactor. The dispatcher waits on the selector, receives readable socket handles, and invokes each handle's registered handler. Each handler attempts nonblocking reads, retains unfinished state, and returns control to the dispatcher.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1104" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Readiness selects a handler; the handler performs I/O</text><rect x="24" y="112" width="296" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Socket A registration</text><text x="40" y="167" font-size="17" fill="#626962">Read interest + callback A</text><rect x="400" y="112" width="296" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="416" y="141" font-size="20" fill="#252c28">Socket B registration</text><text x="416" y="167" font-size="17" fill="#626962">Read interest + callback B</text><path d="M172 224V286H328V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M548 224V286H392V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="270" y="270" font-size="17" fill="#626962">wait on registered handles</text><rect x="24" y="352" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="381" font-size="20" fill="#252c28">Selector / synchronous event demultiplexer</text><text x="40" y="407" font-size="17" fill="#626962">Waits until handles are ready, then returns their registrations.</text><path d="M360 480V574" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="534" font-size="17" fill="#626962">readable registrations</text><rect x="24" y="576" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="605" font-size="20" fill="#252c28">Reactor dispatcher</text><text x="40" y="631" font-size="17" fill="#626962">For each ready key: call its registered handler with the event mask.</text><path d="M360 704V798" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="758" font-size="17" fill="#626962">callback</text><rect x="24" y="800" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="829" font-size="20" fill="#252c28">Handler performs nonblocking I/O, then returns</text><text x="40" y="855" font-size="17" fill="#626962">One bounded read; retain per-connection framing state.</text><text x="40" y="900" font-size="16" fill="#626962">A would-block result returns control rather than waiting inside the handler.</text><text x="24" y="1012" font-size="16" fill="#626962">Arrows: registration interests and control flow; no completed record is implied.</text><text x="24" y="1050" font-size="18" fill="#626962">After the callback returns, the loop can process other ready connections.</text></svg>
