<svg xmlns="http://www.w3.org/2000/svg" width="720" height="644" viewBox="0 0 720 644" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A stable core with independent optional analyzers</title><desc id="desc">A document request enters the core, which normalizes text and produces the base line count. Through the analyzer contract, the core calls independent word-count and TODO-count plug-ins, then assembles their results.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="644" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Extend capabilities, keep the core</text><rect x="24" y="86" width="352" height="68" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="115" font-size="20" fill="#252c28">Document text</text><text x="40" y="141" font-size="17" fill="#626962">inspect(text)</text><path d="M200 154V204" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="216" y="188" font-size="17" fill="#252c28">request</text><rect x="24" y="206" width="352" height="242" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="240" font-size="22" fill="#252c28">Document core</text><text x="40" y="282" font-size="19" fill="#252c28">Normalize text</text><text x="40" y="312" font-size="19" fill="#252c28">Count lines · assemble report</text><rect x="44" y="348" width="312" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="377" font-size="20" fill="#252c28">Analyzer API v1</text><text x="60" y="403" font-size="17" fill="#626962">analyze(text) → count</text><rect x="488" y="242" width="208" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="504" y="271" font-size="20" fill="#252c28">WordCount</text><text x="504" y="297" font-size="17" fill="#626962">Counts tokens</text><rect x="488" y="370" width="208" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="504" y="399" font-size="20" fill="#252c28">TodoCount</text><text x="504" y="425" font-size="17" fill="#626962">Counts TODO lines</text><path d="M356 386H430V280H486" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M430 386V408H486" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="386" y="362" font-size="17" fill="#252c28">calls</text><path d="M200 448V510" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="216" y="486" font-size="17" fill="#252c28">result</text><rect x="24" y="512" width="352" height="68" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="541" font-size="20" fill="#252c28">Complete report</text><text x="40" y="567" font-size="17" fill="#626962">Base + extension counts</text><text x="488" y="502" font-size="17" fill="#626962">Optional capabilities</text><text x="24" y="616" font-size="18" fill="#626962">Plug-ins receive text; they do not call each other.</text></svg>
