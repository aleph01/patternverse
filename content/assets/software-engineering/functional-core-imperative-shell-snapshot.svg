<svg xmlns="http://www.w3.org/2000/svg" width="720" height="526" viewBox="0 0 720 526" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Snapshot repeatability and changing external state</title><desc id="desc">An observed stock value of three produces a proposal for seven units toward a target of ten. If actual stock becomes eight before execution, the saved proposal still says seven. A pure computation is repeatable but does not refresh its observations.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="526" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A pure decision still uses an observed snapshot</text><rect x="24" y="110" width="300" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="139" font-size="20" fill="#252c28">1 · Observe</text><text x="40" y="165" font-size="17" fill="#626962">Stock 3 · point 3 · target 10</text><rect x="396" y="110" width="300" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="412" y="139" font-size="20" fill="#252c28">2 · Compute</text><text x="412" y="165" font-size="17" fill="#626962">Proposal: 7 units</text><path d="M324 154H394" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M546 198V288" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="248" font-size="18" fill="#626962">Meanwhile: external stock changes</text><rect x="396" y="290" width="300" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="412" y="319" font-size="20" fill="#252c28">3 · Current stock: 8</text><text x="412" y="345" font-size="17" fill="#626962">Saved input remains 3</text><path d="M396 334H326" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="290" width="300" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="319" font-size="20" fill="#252c28">4 · Saved proposal: 7</text><text x="40" y="345" font-size="17" fill="#626962">No automatic refresh or lock</text><text x="24" y="446" font-size="19" fill="#252c28">Recomputing from 8 units would produce no proposal.</text><text x="24" y="482" font-size="17" fill="#626962">Purity does not keep external state unchanged between read and action.</text></svg>
