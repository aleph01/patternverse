<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1368" viewBox="0 0 360 1368" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Scoped Resource Management: partial acquisition and failure</title><desc id="desc">On a successful read or body exception, cleanup closes the decoder, closes the raw file, and removes the directory. If opening the raw file fails, cleanup removes only the already-owned directory; no file or decoder exit is registered. A resource whose own entry fails remains responsible for its internal partial acquisition.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1368" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Unwind only what is owned</text><rect x="24" y="112" width="312" height="280" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="144" font-size="20" fill="#252c28">All three contexts entered</text><text x="40" y="188" font-size="17" fill="#626962">Success or body exception:</text><text x="40" y="232" font-size="18" fill="#252c28">1 / close decoder</text><text x="40" y="276" font-size="18" fill="#252c28">2 / close raw file</text><text x="40" y="320" font-size="18" fill="#252c28">3 / remove directory</text><text x="40" y="364" font-size="16" fill="#626962">This is reverse acquisition order.</text><rect x="24" y="488" width="312" height="280" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="520" font-size="20" fill="#252c28">Opening the raw file fails</text><text x="40" y="564" font-size="16" fill="#626962">Only the directory context entered.</text><text x="40" y="608" font-size="16" fill="#252c28">Remove that directory and contents.</text><text x="40" y="652" font-size="16" fill="#626962">No raw-reader exit was registered.</text><text x="40" y="696" font-size="16" fill="#626962">No decoder was constructed.</text><text x="40" y="740" font-size="15" fill="#626962">Propagate the open error after cleanup.</text><rect x="24" y="864" width="312" height="232" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="896" font-size="20" fill="#252c28">If cleanup itself raises</text><text x="40" y="940" font-size="15" fill="#626962">Attempt the remaining registered exits.</text><text x="40" y="984" font-size="16" fill="#626962">The outcome may change; inspect</text><text x="40" y="1018" font-size="16" fill="#626962">the exception and its chained context.</text><text x="40" y="1062" font-size="14" fill="#626962">Attempted release is not proof of success.</text><text x="24" y="1180" font-size="17" fill="#252c28">No exit callback for a failed entry.</text><text x="24" y="1228" font-size="16" fill="#626962">An entry routine must clean up its own</text><text x="24" y="1262" font-size="16" fill="#626962">internal partial allocation if it fails.</text><text x="24" y="1322" font-size="16" fill="#626962">Numbered lines give cleanup order.</text></svg>
