<svg xmlns="http://www.w3.org/2000/svg" width="720" height="880" viewBox="0 0 720 880" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Visible scenario overrides and real test inputs</title><desc id="desc">A default order recipe supplies a customer, US destination, standard delivery, and empty notes. One test overrides the subtotal to 4999 cents; another overrides it to 5000 cents. Each build creates a separate real order, which the same delivery rule evaluates.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="880" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Defaults provide context; overrides explain the test</text><text x="24" y="84" font-size="19" fill="#626962">A reusable recipe supplies context, not the expected answer.</text><rect x="24" y="120" width="672" height="108" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="162" font-size="22" fill="#252c28">Default OrderBuilder</text><text x="40" y="204" font-size="18" fill="#626962">Customer C7 · US · standard delivery · notes empty · subtotal 1000 cents</text><path d="M180 228V316" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="278" font-size="18" fill="#626962">Choose inputs</text><path d="M540 228V316" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="320" width="312" height="108" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="362" font-size="22" fill="#252c28">Below the threshold</text><text x="40" y="404" font-size="20" fill="#252c28">with_subtotal(4999)</text><rect x="384" y="320" width="312" height="108" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="362" font-size="22" fill="#252c28">At the threshold</text><text x="400" y="404" font-size="20" fill="#252c28">with_subtotal(5000)</text><path d="M180 428V500" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="204" y="472" font-size="18" fill="#626962">build()</text><path d="M540 428V500" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="564" y="472" font-size="18" fill="#626962">build()</text><rect x="24" y="504" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="546" font-size="22" fill="#252c28">Real Order A</text><text x="40" y="584" font-size="19" fill="#626962">Subtotal: 4999 cents</text><rect x="384" y="504" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="546" font-size="22" fill="#252c28">Real Order B</text><text x="400" y="584" font-size="19" fill="#626962">Subtotal: 5000 cents</text><path d="M180 604V676" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="650" font-size="18" fill="#626962">delivery_fee</text><path d="M540 604V676" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="400" y="650" font-size="18" fill="#626962">delivery_fee</text><rect x="24" y="680" width="312" height="108" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="722" font-size="22" fill="#252c28">Fee: 500 cents</text><text x="40" y="764" font-size="18" fill="#626962">Test asserts this result</text><rect x="384" y="680" width="312" height="108" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="722" font-size="22" fill="#252c28">Fee: 0 cents</text><text x="400" y="764" font-size="18" fill="#626962">Test asserts this result</text><text x="24" y="840" font-size="19" fill="#252c28">Same real delivery rule; separate real inputs; explicit boundary.</text></svg>
