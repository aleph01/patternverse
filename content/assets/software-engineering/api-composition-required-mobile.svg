<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Required identity coverage rejects an incomplete join</title><desc id="desc">Orders returns O42, O43, and O44 with customer references C7, C2, and C7. Customers returns C2 but omits required C7. The composer rejects the whole result as incomplete; it does not silently drop O42 and O44 or invent a customer label.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1000" fill="#fff"/><text x="24" y="34" font-size="21" fill="#252c28">Missing required data fails visibly</text><rect x="24" y="112" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">Orders returns all 3 rows</text><text x="40" y="167" font-size="16" fill="#626962">O42 → C7 / O43 → C2 / O44 → C7</text><text x="40" y="214" font-size="16" fill="#626962">Required customers: C2 and C7</text><path d="M180 240V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="304" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="333" font-size="18" fill="#252c28">Customers returns C2 only</text><text x="40" y="359" font-size="16" fill="#626962">C7 is missing from the response.</text><text x="40" y="406" font-size="16" fill="#626962">No substitute label is invented.</text><path d="M180 432V494" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="496" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="525" font-size="18" fill="#252c28">Check exact identity coverage</text><text x="40" y="551" font-size="16" fill="#626962">Expected {C2, C7} ≠ actual {C2}</text><text x="40" y="598" font-size="17" fill="#626962">Missing required identity</text><path d="M180 624V686" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="688" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="717" font-size="18" fill="#252c28">CompositionError</text><text x="40" y="743" font-size="16" fill="#626962">Return no cards from this query.</text><text x="40" y="790" font-size="16" fill="#626962">No silent inner-join row loss.</text><text x="24" y="920" font-size="15" fill="#626962">Arrows: required read, check, and failure.</text><text x="24" y="956" font-size="15" fill="#626962">A partial product needs another contract.</text></svg>
