<svg xmlns="http://www.w3.org/2000/svg" width="360" height="752" viewBox="0 0 360 752" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Runtime calls versus source dependencies</title><desc id="desc">Runtime calls go from the application to a SQLite adapter through the stock port. The source import goes in the opposite direction: adapters.py imports definitions from application.py, while application.py imports no adapters.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="752" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Calls and imports</text><text x="24" y="60" font-size="22" fill="#252c28">are different relationships</text><text x="24" y="108" font-size="21" fill="#252c28">At runtime</text><rect x="24" y="132" width="312" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="161" font-size="20" fill="#252c28">ReserveStock</text><text x="40" y="187" font-size="17" fill="#626962">Calls StockPort.take</text><path d="M180 208V270" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="248" font-size="17" fill="#252c28">calls</text><rect x="24" y="272" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="301" font-size="20" fill="#252c28">SQLiteStock</text><text x="40" y="327" font-size="17" fill="#626962">Executes SQL</text><text x="24" y="414" font-size="21" fill="#252c28">In source code</text><rect x="24" y="438" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="467" font-size="20" fill="#252c28">adapters.py</text><text x="40" y="493" font-size="17" fill="#626962">Imports app definitions</text><path d="M180 514V576" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="554" font-size="17" fill="#252c28">imports</text><rect x="24" y="578" width="312" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="607" font-size="20" fill="#252c28">application.py</text><text x="40" y="633" font-size="17" fill="#626962">Operation · port · error</text><text x="24" y="710" font-size="17" fill="#626962">application.py imports no adapter.</text></svg>
