<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1128" viewBox="0 0 360 1128" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A persistent write reservation spans an offline edit</title><desc id="desc">A short acquisition transaction stores Alice's unique owner token and commits. Alice edits with no database transaction held open. Bob's competing acquisition is refused while that lock row exists. Alice later saves under an ownership check and removes the lock in one short transaction.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1128" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Reserve write ownership</text><text x="24" y="60" font-size="22" fill="#252c28">across separate requests</text><rect x="24" y="104" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">1. Acquire</text><text x="40" y="159" font-size="17" fill="#626962">Insert A; read protected title.</text><text x="40" y="214" font-size="17" fill="#626962">COMMIT; return handle.</text><rect x="24" y="352" width="312" height="116" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="381" font-size="20" fill="#252c28">2. Edit across requests</text><text x="40" y="407" font-size="17" fill="#626962">Committed lock row persists.</text><path d="M180 248V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="592" width="312" height="116" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="621" font-size="20" fill="#252c28">Competing acquisition</text><text x="40" y="647" font-size="17" fill="#626962">Existing note key → Busy.</text><path d="M180 468V590" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="824" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="853" font-size="20" fill="#252c28">3. Owner saves</text><text x="40" y="879" font-size="17" fill="#626962">Check A; write; delete lock.</text><text x="40" y="934" font-size="17" fill="#626962">COMMIT all three together.</text><path d="M180 708V822" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="770" font-size="17" fill="#626962">owner completes</text><text x="24" y="1040" font-size="18" fill="#252c28">Lock row persists between calls.</text><text x="24" y="1080" font-size="17" fill="#626962">No long database transaction.</text></svg>
