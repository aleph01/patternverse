<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1312" viewBox="0 0 720 1312" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Scoped Resource Management: partial acquisition and failure</title><desc id="desc">On a successful read or body exception, cleanup closes the decoder, closes the raw file, and removes the directory. If opening the raw file fails, cleanup removes only the already-owned directory; no file or decoder exit is registered. A resource whose own entry fails remains responsible for its internal partial acquisition.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1312" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Partial setup changes which resources need cleanup</text><text x="24" y="128" font-size="21" fill="#252c28">All entries succeed</text><text x="400" y="128" font-size="21" fill="#252c28">Raw file open fails</text><rect x="24" y="176" width="296" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="205" font-size="18" fill="#252c28">Directory + file + decoder</text><text x="40" y="231" font-size="16" fill="#626962">Three registered exit handlers</text><rect x="400" y="176" width="296" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="416" y="205" font-size="18" fill="#252c28">Directory context entered</text><text x="416" y="231" font-size="16" fill="#626962">Opening raw file raises an error</text><path d="M172 304V398" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M548 304V398" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="400" width="296" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="429" font-size="18" fill="#252c28">Close decoder</text><text x="40" y="455" font-size="16" fill="#626962">Dependent stops using the file.</text><path d="M172 512V606" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="608" width="296" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="637" font-size="18" fill="#252c28">Close raw file</text><text x="40" y="663" font-size="16" fill="#626962">Release its owned handle.</text><path d="M172 720V814" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="816" width="296" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="845" font-size="18" fill="#252c28">Remove directory</text><text x="40" y="871" font-size="16" fill="#626962">Remove owned workspace contents.</text><rect x="400" y="400" width="296" height="224" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="416" y="432" font-size="20" fill="#252c28">Remove directory</text><text x="416" y="478" font-size="16" fill="#626962">Clean only the owned prefix.</text><text x="416" y="524" font-size="16" fill="#626962">No raw-reader exit registered.</text><text x="416" y="570" font-size="16" fill="#626962">No decoder constructed.</text><text x="400" y="720" font-size="16" fill="#626962">The open error leaves the scope</text><text x="400" y="756" font-size="16" fill="#626962">after directory cleanup succeeds.</text><rect x="24" y="1072" width="672" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1101" font-size="20" fill="#252c28">A cleanup failure can change the outcome that reaches the caller</text><text x="40" y="1127" font-size="17" fill="#626962">ExitStack still attempts remaining registered exits; release may itself fail.</text><text x="24" y="1272" font-size="17" fill="#626962">Arrows: scope-exit cleanup. An entry routine owns its internal failure cleanup.</text></svg>
