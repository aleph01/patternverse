<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Response matching and version-specific compatibility evidence</title><desc id="desc">For reader-3, an original provider response with available equal to seven and unit EA passes. Adding an unused zone field also passes. Renaming available to quantity fails. A separate version matrix shows reader-3 with provider-8 passing, reader-3 with provider-9 failing, and an unverified reader-4/provider-8 pair remaining unknown.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="1000" fill="#fff"/><text x="24" y="36" font-size="23" fill="#252c28">Matching and release evidence answer different questions</text><text x="24" y="84" font-size="19" fill="#626962">Runnable example: one reader-3 contract, three provider variants.</text><rect x="24" y="116" width="672" height="96" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="152" font-size="21" fill="#252c28">Original</text><text x="40" y="192" font-size="18" fill="#626962">available: 7 · unit: EA</text><text x="532" y="174" font-size="20" fill="#252c28">compatible</text><rect x="24" y="232" width="672" height="96" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="268" font-size="21" fill="#252c28">Unused field added</text><text x="40" y="308" font-size="18" fill="#626962">Same fields + zone: A3</text><text x="532" y="290" font-size="20" fill="#252c28">compatible</text><rect x="24" y="348" width="672" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="384" font-size="21" fill="#252c28">Required name changed</text><text x="40" y="424" font-size="18" fill="#626962">quantity replaces available</text><text x="532" y="406" font-size="20" fill="#252c28">incompatible</text><text x="24" y="514" font-size="19" fill="#626962">Illustrative release evidence · separate from the simulation</text><text x="40" y="566" font-size="18" fill="#626962">Application versions</text><text x="488" y="566" font-size="18" fill="#626962">Verification</text><rect x="24" y="592" width="672" height="80" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="640" font-size="21" fill="#252c28">reader-3 + provider-8</text><text x="488" y="640" font-size="21" fill="#252c28">verified pass</text><rect x="24" y="696" width="672" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="744" font-size="21" fill="#252c28">reader-3 + provider-9</text><text x="488" y="744" font-size="21" fill="#252c28">verified fail</text><rect x="24" y="800" width="672" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="848" font-size="21" fill="#252c28">reader-4 + provider-8</text><text x="488" y="848" font-size="21" fill="#252c28">unknown</text><text x="24" y="958" font-size="19" fill="#252c28">Unknown is not a pass; evaluate versions that will coexist.</text></svg>
