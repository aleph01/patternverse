<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1216" viewBox="0 0 720 1216" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Thread Pool: workers and admission</title><desc id="desc">A coordinator admits at most four jobs awaiting result collection. The pool has up to two reusable threads; in the illustrated snapshot two jobs execute while two wait. A thread finishes one job and takes another instead of being recreated. Completed futures still occupy the coordinator’s admission window until collected.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1216" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Limit worker threads and admitted work separately</text><rect x="24" y="112" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Coordinator: track up to four submitted jobs awaiting collection</text><text x="40" y="167" font-size="17" fill="#626962">The window includes queued, running, and completed-uncollected jobs.</text><path d="M360 256V334" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="302" font-size="17" fill="#626962">submit</text><rect x="24" y="336" width="672" height="448" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="368" font-size="21" fill="#252c28">Thread pool: up to two reusable workers</text><rect x="48" y="416" width="624" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="448" font-size="18" fill="#252c28">Queue snapshot: job 2 and job 3 wait while both workers are busy.</text><text x="64" y="486" font-size="16" fill="#626962">Scheduling and queue policy belong to the executor.</text><path d="M360 512V552H196V606" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 552H524V606" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="278" y="588" font-size="16" fill="#626962">dispatch when free</text><rect x="48" y="608" width="296" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="637" font-size="20" fill="#252c28">Worker thread A</text><text x="64" y="663" font-size="17" fill="#626962">Executing job 0</text><rect x="376" y="608" width="296" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="392" y="637" font-size="20" fill="#252c28">Worker thread B</text><text x="392" y="663" font-size="17" fill="#626962">Executing job 1</text><text x="64" y="720" font-size="16" fill="#626962">Same thread takes another task.</text><text x="392" y="720" font-size="16" fill="#626962">Same thread takes another task.</text><rect x="24" y="880" width="672" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="909" font-size="20" fill="#252c28">Finished future, not yet collected: still one admitted job</text><text x="40" y="935" font-size="17" fill="#626962">Collect the result or exception before freeing its window place.</text><text x="24" y="1080" font-size="19" fill="#252c28">Snapshot: two running + two queued = four jobs awaiting collection.</text><text x="24" y="1120" font-size="17" fill="#626962">The worker ceiling alone does not bound the submitted backlog.</text><text x="24" y="1170" font-size="17" fill="#626962">Arrows: submission and dispatch; threads are reused across jobs.</text></svg>
