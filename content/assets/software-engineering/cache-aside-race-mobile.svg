<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1184" viewBox="0 0 360 1184" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">An older read can fill late</title><desc id="desc">Four ordered events show a late cache fill: reader A obtains 1200 on a miss; writer B commits 1300; B invalidates the key; A installs its older 1200. The authoritative store remains 1300 while a subsequent cache hit can return 1200.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1184" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">An older read can fill late</text><text x="24" y="78" font-size="17" fill="#626962">Same unversioned key: product:P7</text><text x="24" y="110" font-size="17" fill="#626962">Prices are integer cents.</text><rect x="24" y="144" width="312" height="156" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="176" font-size="21" fill="#252c28">1. Reader A misses</text><text x="40" y="224" font-size="18" fill="#252c28">A reads source price 1200</text><text x="40" y="272" font-size="17" fill="#626962">A holds 1200; cache empty</text><path d="M180 300V336" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="340" width="312" height="156" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="372" font-size="21" fill="#252c28">2. Writer B commits</text><text x="40" y="420" font-size="18" fill="#252c28">B writes source price 1300</text><text x="40" y="468" font-size="17" fill="#626962">Source 1300; cache empty</text><path d="M180 496V532" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="536" width="312" height="156" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="568" font-size="21" fill="#252c28">3. B invalidates</text><text x="40" y="616" font-size="18" fill="#252c28">B deletes the cache key</text><text x="40" y="664" font-size="17" fill="#626962">Source 1300; cache empty</text><path d="M180 692V728" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="732" width="312" height="156" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="764" font-size="21" fill="#252c28">4. A fills late</text><text x="40" y="812" font-size="18" fill="#252c28">A installs its earlier 1200</text><text x="40" y="860" font-size="17" fill="#626962">Source 1300; cache 1200</text><rect x="24" y="972" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1006" font-size="20" fill="#252c28">A later hit may return 1200.</text><text x="40" y="1050" font-size="17" fill="#626962">TTL starts at the late installation.</text><text x="40" y="1092" font-size="17" fill="#626962">It does not prove source age.</text><text x="40" y="1130" font-size="17" fill="#626962">No version check rejects this fill.</text></svg>
