<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1296" viewBox="0 0 360 1296" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Separate semaphore admission and permit release</title><desc id="desc">A backfill action acquires its one permit and waits on an event. A second backfill call is rejected without invocation, while a live call uses its independent permit. After the event is released, the first backfill finishes, returns its permit, and permits another backfill call.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1296" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">A permit follows active work</text><rect x="24" y="112" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">Backfill acquires its only permit</text><text x="40" y="167" font-size="16" fill="#626962">Action waits on an owned event.</text><path d="M224 240V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="300" font-size="17" fill="#626962">While it is active</text><rect x="24" y="352" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="381" font-size="18" fill="#252c28">Another backfill / rejected</text><text x="40" y="407" font-size="16" fill="#626962">Its action is never invoked.</text><rect x="24" y="560" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="589" font-size="18" fill="#252c28">Live / independent permit</text><text x="40" y="615" font-size="16" fill="#626962">Runs on its available caller thread.</text><rect x="24" y="768" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="797" font-size="18" fill="#252c28">Release the event; join worker</text><text x="40" y="823" font-size="16" fill="#626962">Backfill finishes; finally releases.</text><path d="M224 896V1006" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="956" font-size="17" fill="#626962">Now capacity is free</text><rect x="24" y="1008" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1037" font-size="18" fill="#252c28">A new backfill call / admitted</text><text x="40" y="1063" font-size="16" fill="#626962">Uses the returned permit.</text><text x="24" y="1216" font-size="16" fill="#626962">No internal queue or thread reservation.</text><text x="24" y="1256" font-size="16" fill="#626962">Arrows: local action-lifetime sequence.</text></svg>
