<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Open and closed registration with guarded operations</title><desc id="desc">While registration is open, reserve and cancel can change reservations after their checks pass. close_registration moves the workshop to closed. Closed registration rejects reserve and cancel; closing it again leaves it closed.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="490" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Registration state controls which changes are allowed</text><rect x="24" y="120" width="300" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="149" font-size="20" fill="#252c28">Open</text><text x="40" y="175" font-size="17" fill="#626962">reserve / cancel after checks</text><rect x="396" y="120" width="300" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="412" y="149" font-size="20" fill="#252c28">Closed</text><text x="412" y="175" font-size="17" fill="#626962">reserve / cancel rejected</text><path d="M324 164H394" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="286" y="88" font-size="17" fill="#252c28">close_registration</text><path d="M100 208V260H248V210" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="306" font-size="18" fill="#252c28">Successful reserve or cancel stays open.</text><text x="24" y="344" font-size="18" fill="#252c28">Invalid operations leave bookings unchanged.</text><text x="396" y="306" font-size="18" fill="#252c28">Close again: stays closed.</text><text x="24" y="414" font-size="18" fill="#252c28">The policy closes registration; it does not delete reservations.</text><text x="24" y="452" font-size="17" fill="#626962">No database lock, timer, or class hierarchy is supplied by this diagram.</text></svg>
