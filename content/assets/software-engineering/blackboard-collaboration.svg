<svg xmlns="http://www.w3.org/2000/svg" width="720" height="648" viewBox="0 0 720 648" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Shared state, independent knowledge, and separate control</title><desc id="desc">A shared blackboard holds input features, intermediate evidence, and a document hypothesis. Independent text, layout, and combination knowledge sources read snapshots and propose additions. A separate controller chooses an eligible source and commits its contribution.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="selection" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="648" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Shared state, independent expertise</text><text x="24" y="82" font-size="20" fill="#626962">Text · layout · combination specialists</text><rect x="24" y="130" width="280" height="260" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="166" font-size="22" fill="#252c28">Blackboard</text><text x="40" y="212" font-size="19" fill="#252c28">Input features</text><text x="40" y="248" font-size="19" fill="#252c28">Partial evidence</text><text x="40" y="284" font-size="19" fill="#252c28">Supported hypotheses</text><text x="40" y="344" font-size="17" fill="#626962">Retain earlier contributions</text><rect x="416" y="130" width="280" height="132" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="432" y="159" font-size="20" fill="#252c28">Knowledge source</text><text x="432" y="185" font-size="17" fill="#626962">Layout selected this cycle</text><rect x="416" y="392" width="280" height="132" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="432" y="428" font-size="20" fill="#252c28">Control component</text><text x="432" y="460" font-size="18" fill="#252c28">Eligibility · priority</text><text x="432" y="492" font-size="18" fill="#252c28">Validate · commit</text><path d="M304 182H414" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="320" y="162" font-size="16" fill="#252c28">snapshot</text><path d="M620 262V390" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="636" y="330" font-size="17" fill="#252c28">patch</text><path d="M492 392V264" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#selection)"/><text x="422" y="330" font-size="17" fill="#252c28">select</text><path d="M304 336H360V426H414" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="320" y="318" font-size="17" fill="#252c28">state</text><path d="M416 458H164V392" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="240" y="440" font-size="17" fill="#252c28">commit</text><text x="24" y="586" font-size="17" fill="#626962">Solid: state and contributions · dashed: work selection</text><text x="24" y="620" font-size="18" fill="#252c28">Only the controller commits changes.</text></svg>
