<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Identity reuse ends at the scope boundary</title><desc id="desc">The current scope holds a Contact named Ada Lovelace while the database row has been changed to Augusta. A map hit retains the local object. Closing the scope clears the registry; a new scope selects the row and constructs a different Contact named Augusta in this example.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="840" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One local object does not guarantee fresh data</text><rect x="24" y="104" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Current scope: Contact 1</text><text x="40" y="159" font-size="17" fill="#626962">name: Ada Lovelace</text><text x="40" y="214" font-size="17" fill="#626962">Map hit retains local edits.</text><rect x="384" y="104" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="133" font-size="20" fill="#252c28">Stored row: Contact 1</text><text x="400" y="159" font-size="17" fill="#626962">name: Augusta</text><text x="400" y="214" font-size="17" fill="#626962">Changed by direct SQL.</text><rect x="24" y="360" width="672" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="389" font-size="20" fill="#252c28">Close the current scope</text><text x="40" y="415" font-size="17" fill="#626962">Clear the map; old references may still exist.</text><path d="M180 264V358" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="576" width="672" height="124" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="605" font-size="20" fill="#252c28">New scope: get(1) selects and constructs again</text><text x="40" y="631" font-size="17" fill="#626962">New Contact object; name: Augusta</text><path d="M360 464V574" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="764" font-size="18" fill="#252c28">The observed row still depends on database isolation.</text><text x="24" y="800" font-size="17" fill="#626962">A map hit, refresh, and a new scope have different policies.</text></svg>
