<svg xmlns="http://www.w3.org/2000/svg" width="360" height="884" viewBox="0 0 360 884" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Shadow Traffic</title><desc id="desc">All user responses come from the incumbent. Selected request copies reach separately bounded candidate capacity and an evidence collector. Candidate outputs have no route to users or production effects; comparison joins records by request identity.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="884" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Shadow Traffic</text><text x="24" y="80" font-size="17" fill="#626962">Execution boundaries and evidence</text><rect x="24" y="112" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="20" fill="#252c28">Live path retains authority</text><text x="40" y="188" font-size="16" fill="#252c28">Incumbent answers every user</text><text x="40" y="224" font-size="15" fill="#626962">Only selected copies leave this path</text><path d="M72 252V304" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="288" font-size="17" fill="#626962">Selected copies only</text><rect x="24" y="308" width="312" height="140" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="344" font-size="20" fill="#252c28">Isolated shadow work</text><text x="40" y="384" font-size="16" fill="#252c28">Bound admission, queue and workers</text><text x="40" y="420" font-size="15" fill="#626962">No production-effect authority</text><path d="M72 448V500" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="484" font-size="17" fill="#626962">Capture outcomes</text><rect x="24" y="504" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="540" font-size="20" fill="#252c28">Attributed evidence</text><text x="40" y="580" font-size="16" fill="#252c28">Request ID + snapshots + versions</text><text x="40" y="616" font-size="15" fill="#626962">Count misses and incomplete labels</text><path d="M72 644V696" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="680" font-size="17" fill="#626962">Join by identity</text><rect x="24" y="700" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="736" font-size="20" fill="#252c28">Compare matched cases</text><text x="40" y="776" font-size="16" fill="#252c28">Use timely pairs and labeled pairs</text><text x="40" y="812" font-size="15" fill="#626962">No candidate user responses</text></svg>
