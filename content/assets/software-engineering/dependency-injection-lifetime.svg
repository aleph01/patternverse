<svg xmlns="http://www.w3.org/2000/svg" width="720" height="604" viewBox="0 0 720 604" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Connection ownership around injected collaborators</title><desc id="desc">The application opens a database connection, builds SqlitePrices and QuoteService, uses the service while the connection is open, and closes the connection when its owning scope ends. The consumer borrows the collaborator and cannot safely keep using it afterward.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="604" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Borrow a resource within its owner’s lifetime</text><rect x="24" y="102" width="672" height="370" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="140" font-size="21" fill="#252c28">Owning scope in main.py</text><rect x="44" y="186" width="184" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="215" font-size="20" fill="#252c28">1 · Open</text><text x="60" y="241" font-size="17" fill="#626962">Connection</text><rect x="268" y="186" width="184" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="284" y="215" font-size="20" fill="#252c28">2 · Build</text><text x="284" y="241" font-size="17" fill="#626962">Adapter + service</text><rect x="492" y="186" width="184" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="508" y="215" font-size="20" fill="#252c28">3 · Use</text><text x="508" y="241" font-size="17" fill="#626962">Calculate quote</text><path d="M228 224H266" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M452 224H490" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M584 262V310H362V338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="268" y="340" width="184" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="284" y="369" font-size="20" fill="#252c28">4 · Close</text><text x="284" y="395" font-size="17" fill="#626962">Scope exit</text><text x="44" y="450" font-size="17" fill="#626962">The consumer borrows. The application closes, including on errors.</text><text x="24" y="528" font-size="18" fill="#252c28">After scope exit, the retained reference points to a closed connection.</text><text x="24" y="562" font-size="17" fill="#626962">Injection supplies a collaborator; it does not keep the resource alive.</text></svg>
