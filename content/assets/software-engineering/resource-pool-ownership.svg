<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1200" viewBox="0 0 720 1200" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Resource Pool: lifetime and exclusive use</title><desc id="desc">A pool manages two resources. One belongs exclusively to caller A while another is idle and available to caller B. Caller C must wait if both are borrowed. Use takes place outside the pool’s coordination lock, and a resource becomes available again only after return cleanup.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1200" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">The pool owns lifetime; callers borrow exclusive use</text><rect x="24" y="112" width="672" height="288" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="148" font-size="21" fill="#252c28">Pool owns two resources: R0 and R1</text><rect x="48" y="200" width="296" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="229" font-size="20" fill="#252c28">R0: already lent to A</text><text x="64" y="255" font-size="17" fill="#626962">Unavailable to another caller</text><rect x="376" y="200" width="296" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="392" y="229" font-size="20" fill="#252c28">R1: idle</text><text x="392" y="255" font-size="17" fill="#626962">Available until checkout</text><path d="M196 400V450M196 500V558" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="48" y="478" font-size="16" fill="#626962">Exclusive use already granted</text><path d="M524 400V450M524 500V558" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="384" y="478" font-size="16" fill="#626962">Checkout grants exclusive use</text><rect x="48" y="560" width="296" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="589" font-size="20" fill="#252c28">Caller A uses R0</text><text x="64" y="615" font-size="17" fill="#626962">Work outside the pool lock</text><rect x="376" y="560" width="296" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="392" y="589" font-size="20" fill="#252c28">Caller B now uses R1</text><text x="392" y="615" font-size="17" fill="#626962">Same resource, not a copy</text><rect x="24" y="816" width="672" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="845" font-size="20" fill="#252c28">If both resources are borrowed or resetting, caller C waits</text><text x="40" y="871" font-size="17" fill="#626962">This fixed pool creates no third instance; close wakes waiters to reject them.</text><text x="24" y="1050" font-size="20" fill="#252c28">Capacity counts idle + borrowed + resetting resources.</text><text x="24" y="1092" font-size="17" fill="#626962">A returned resource becomes available only after cleanup completes.</text><text x="24" y="1150" font-size="17" fill="#626962">Arrows: exclusive-use grants, not physical copies or permanent ownership.</text></svg>
