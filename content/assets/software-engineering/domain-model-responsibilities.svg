<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Shared domain operations and owned reservation state</title><desc id="desc">The website and batch importer both invoke Workshop operations. Workshop owns capacity, registration state, and its reservation collection. Reservations are created and removed through those operations, while callers receive an immutable view of the records.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="660" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Business operations protect the state they own</text><rect x="24" y="102" width="300" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="131" font-size="20" fill="#252c28">Website</text><text x="40" y="157" font-size="17" fill="#626962">Requests a reservation</text><rect x="396" y="102" width="300" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="412" y="131" font-size="20" fill="#252c28">Batch importer</text><text x="412" y="157" font-size="17" fill="#626962">Requests a reservation</text><path d="M174 178V278" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M546 178V278" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="240" y="248" font-size="17" fill="#252c28">reserve / cancel through the model</text><rect x="24" y="280" width="672" height="290" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="318" font-size="22" fill="#252c28">Workshop</text><rect x="44" y="344" width="286" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="373" font-size="20" fill="#252c28">Operations check rules</text><text x="60" y="399" font-size="17" fill="#626962">Open · unique · enough seats</text><path d="M330 382H366" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="368" y="344" width="308" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="384" y="373" font-size="20" fill="#252c28">Owned reservations</text><text x="384" y="399" font-size="17" fill="#626962">Immutable records; private map</text><text x="44" y="470" font-size="19" fill="#252c28">Fixed capacity · registration state</text><text x="44" y="508" font-size="19" fill="#252c28">Remaining = capacity − total reserved seats</text><text x="44" y="546" font-size="17" fill="#626962">Rejected operations do not change the reservation collection.</text><text x="24" y="622" font-size="18" fill="#252c28">The same domain operations serve every application entry point.</text></svg>
