<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Equivalent stay dates in distinct runtime objects</title><desc id="desc">Two separately constructed StayDates instances both contain check-in 2026-10-29 and checkout 2026-11-01. They represent equal three-night values even though they are different runtime objects.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="440" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Equality follows meaning, not the runtime instance</text><text x="24" y="110" font-size="21" fill="#252c28">StayDates · instance A</text><text x="412" y="110" font-size="21" fill="#252c28">StayDates · instance B</text><rect x="24" y="132" width="284" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="162" font-size="20" fill="#252c28">Check-in: 2026-10-29</text><text x="40" y="192" font-size="20" fill="#252c28">Checkout: 2026-11-01</text><text x="40" y="226" font-size="17" fill="#626962">3 calendar nights</text><rect x="412" y="132" width="284" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="428" y="162" font-size="20" fill="#252c28">Check-in: 2026-10-29</text><text x="428" y="192" font-size="20" fill="#252c28">Checkout: 2026-11-01</text><text x="428" y="226" font-size="17" fill="#626962">3 calendar nights</text><text x="350" y="198" font-size="28" fill="#252c28">=</text><text x="24" y="310" font-size="21" fill="#252c28">Equal value: True · same runtime object: False</text><text x="24" y="358" font-size="18" fill="#252c28">Check-in included; checkout excluded. Both values describe 3 nights.</text><text x="24" y="400" font-size="17" fill="#626962">The complete type and both dates determine equality.</text></svg>
