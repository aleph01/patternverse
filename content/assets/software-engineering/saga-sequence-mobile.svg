<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1112" viewBox="0 0 360 1112" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Saga local steps and compensating work</title><desc id="desc">Inventory reserves two mugs for O42, Packing reserves one slot, and Carrier declines delivery without committing it. Compensation releases the packing slot and then the Inventory reservation. Each effect belongs to its participant; there is no shared rollback.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1112" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Local steps, explicit recovery</text><rect x="24" y="112" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">1 / Inventory accepts</text><text x="40" y="167" font-size="17" fill="#626962">O42 holds 2 mugs</text><path d="M180 224V286" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="264" font-size="16" fill="#626962">next step</text><rect x="24" y="288" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="317" font-size="20" fill="#252c28">2 / Packing accepts</text><text x="40" y="343" font-size="17" fill="#626962">O42 holds 1 slot</text><path d="M180 400V462" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="464" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="493" font-size="20" fill="#252c28">3 / Carrier declines</text><text x="40" y="519" font-size="17" fill="#626962">No delivery effect committed</text><path d="M180 576V638" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="616" font-size="16" fill="#626962">compensate</text><rect x="24" y="640" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="669" font-size="18" fill="#252c28">C2 / Release packing</text><text x="40" y="695" font-size="16" fill="#626962">New local operation / O42 only</text><path d="M180 752V814" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="816" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="845" font-size="18" fill="#252c28">C1 / Release inventory</text><text x="40" y="871" font-size="16" fill="#626962">New local operation / O42 only</text><text x="24" y="1024" font-size="16" fill="#626962">Arrows: this plan’s execution order.</text><text x="24" y="1060" font-size="17" fill="#626962">Earlier commits are not erased.</text></svg>
