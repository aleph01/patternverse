<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1208" viewBox="0 0 360 1208" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Content-Based Router: fallback and delivery boundaries</title><desc id="desc">An unfamiliar but structurally valid service order selects unclassified-review through the otherwise rule. A negative amount selects invalid-messages before business rules run. Selecting priority-fulfillment says nothing about enqueue acknowledgment or completed shipment; those are later boundaries with their own failure handling.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1208" fill="#fff"/><text x="24" y="32" font-size="21" fill="#252c28">Fallback and failure are different</text><rect x="24" y="104" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Valid, unfamiliar kind</text><text x="40" y="159" font-size="17" fill="#626962">service / 9900 cents</text><text x="40" y="198" font-size="17" fill="#626962">Select unclassified-review.</text><rect x="24" y="336" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="365" font-size="20" fill="#252c28">Malformed amount</text><text x="40" y="391" font-size="17" fill="#626962">−1 US dollar cents</text><text x="40" y="430" font-size="17" fill="#626962">Select invalid-messages.</text><text x="24" y="560" font-size="20" fill="#252c28">A selection is not completion</text><rect x="24" y="616" width="312" height="96" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="645" font-size="20" fill="#252c28">1. Select logical channel</text><text x="40" y="671" font-size="17" fill="#626962">Return a Decision value.</text><path d="M180 712V790" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="792" width="312" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="821" font-size="20" fill="#252c28">2. Forward to destination</text><text x="40" y="847" font-size="17" fill="#626962">Transport can fail or retry.</text><path d="M180 888V966" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="968" width="312" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="997" font-size="20" fill="#252c28">3. Consumer does the work</text><text x="40" y="1023" font-size="17" fill="#626962">Business effects can fail.</text><text x="24" y="1144" font-size="18" fill="#252c28">No step guarantees the next one.</text></svg>
