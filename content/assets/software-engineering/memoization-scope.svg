<svg xmlns="http://www.w3.org/2000/svg" width="720" height="824" viewBox="0 0 720 824" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Same key, different snapshot owners</title><desc id="desc">Two estimator instances own separate immutable snapshots and memo tables. Snapshot S1 has parsing duration 2 minutes and caches task key 4 as finish time 9 minutes. Snapshot S2 has parsing duration 20 minutes and caches the same task key 4 as 27 minutes. Editing the caller’s input does not change S1.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="824" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A task index is meaningful within its snapshot</text><text x="24" y="78" font-size="19" fill="#626962">Each estimator owns a frozen snapshot and its own memo table.</text><text x="24" y="148" font-size="21" fill="#252c28">S1 / original estimator</text><rect x="24" y="184" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="216" font-size="21" fill="#252c28">Frozen input</text><text x="40" y="260" font-size="19" fill="#626962">Task 0 duration: 2 min</text><path d="M180 296V336" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="204" y="324" font-size="17" fill="#626962">Calculate</text><rect x="24" y="340" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="372" font-size="21" fill="#252c28">Owned memo table</text><text x="40" y="420" font-size="22" fill="#252c28">Task key 4 → 9 min</text><text x="24" y="500" font-size="20" fill="#252c28">Estimate task 4: 9 minutes</text><text x="24" y="536" font-size="17" fill="#626962">Separate table; no cross-snapshot reuse.</text><text x="384" y="148" font-size="21" fill="#252c28">S2 / fresh estimator</text><rect x="384" y="184" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="216" font-size="21" fill="#252c28">Frozen input</text><text x="400" y="260" font-size="19" fill="#626962">Task 0 duration: 20 min</text><path d="M540 296V336" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="564" y="324" font-size="17" fill="#626962">Calculate</text><rect x="384" y="340" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="372" font-size="21" fill="#252c28">Owned memo table</text><text x="400" y="420" font-size="22" fill="#252c28">Task key 4 → 27 min</text><text x="384" y="500" font-size="20" fill="#252c28">Estimate task 4: 27 minutes</text><text x="384" y="536" font-size="17" fill="#626962">Separate table; no cross-snapshot reuse.</text><rect x="24" y="640" width="672" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="674" font-size="21" fill="#252c28">Editing caller input does not alter the original estimator.</text><text x="40" y="718" font-size="18" fill="#626962">Clearing releases entries; recomputation still reads the same snapshot.</text><text x="40" y="758" font-size="18" fill="#626962">A changed project gets a fresh estimator and an independent memo table.</text></svg>
