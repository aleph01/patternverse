<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1204" viewBox="0 0 360 1204" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Repository keeps storage behind domain-oriented access</title><desc id="desc">Application code asks the Workshops repository for workshops with room for two attendees. Either the memory implementation filters stored Workshop objects or the SQLite implementation queries rows and constructs Workshop objects. The caller receives the same ordered domain-level result without seeing SQL or cursors.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1204" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Ask for domain objects,</text><text x="24" y="60" font-size="20" fill="#252c28">keep storage behind the boundary</text><rect x="24" y="104" width="312" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Application caller</text><text x="40" y="159" font-size="17" fill="#626962">with_room_for(2)</text><path d="M180 188V266" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="268" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="300" font-size="22" fill="#252c28">Workshops contract</text><text x="40" y="334" font-size="18" fill="#252c28">add(Workshop) · get(id)</text><text x="40" y="370" font-size="18" fill="#252c28">with_room_for(seats)</text><rect x="24" y="508" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="537" font-size="20" fill="#252c28">MemoryWorkshops</text><text x="40" y="563" font-size="17" fill="#626962">Filter Workshops; order by ID</text><rect x="24" y="748" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="777" font-size="20" fill="#252c28">SqliteWorkshops</text><text x="40" y="803" font-size="17" fill="#626962">Query rows → Workshop objects</text><path d="M180 412V506" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M336 370H348V808H338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="968" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="997" font-size="20" fill="#252c28">Same domain result</text><text x="40" y="1023" font-size="17" fill="#626962">A: 2 seats · B: 3 seats</text><path d="M24 568H12V1018H22" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><path d="M180 868V966" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="24" y="1132" font-size="17" fill="#252c28">Solid: call the chosen adapter.</text><text x="24" y="1168" font-size="17" fill="#626962">Dashed: return selected objects.</text></svg>
