<svg xmlns="http://www.w3.org/2000/svg" width="720" height="912" viewBox="0 0 720 912" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Controlled collaborator, real checkout</title><desc id="desc">Production checkout calls a payment adapter. In a focused test, the same real checkout calls a test double through the charge contract; the test arranges its response and verifies the returned status and recorded call. The real payment adapter and provider are outside this test.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="912" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Keep checkout real; replace its collaborator</text><text x="24" y="102" font-size="19" fill="#626962">Production wiring</text><rect x="24" y="132" width="240" height="108" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="174" font-size="22" fill="#252c28">Real checkout</text><text x="40" y="214" font-size="18" fill="#626962">Application decision</text><path d="M264 188H432" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="296" y="170" font-size="18" fill="#626962">charge</text><rect x="432" y="132" width="264" height="108" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="448" y="174" font-size="22" fill="#252c28">Production gateway</text><text x="448" y="214" font-size="18" fill="#626962">Adapter + provider I/O</text><text x="24" y="312" font-size="19" fill="#626962">Focused test wiring</text><rect x="24" y="344" width="672" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="386" font-size="22" fill="#252c28">Test setup</text><text x="40" y="426" font-size="19" fill="#252c28">Prepare reply or exception; supply a fresh gateway double.</text><path d="M552 448V520" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="338" y="494" font-size="18" fill="#626962">Install + configure</text><rect x="24" y="524" width="240" height="108" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="566" font-size="22" fill="#252c28">Real checkout</text><text x="40" y="606" font-size="18" fill="#626962">Same decision code</text><path d="M264 580H432" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="296" y="562" font-size="18" fill="#626962">charge</text><rect x="432" y="524" width="264" height="108" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="448" y="562" font-size="22" fill="#252c28">Gateway double</text><text x="448" y="594" font-size="18" fill="#252c28">Reply / exception</text><text x="448" y="622" font-size="17" fill="#626962">Record calls</text><path d="M144 632V716" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="682" font-size="18" fill="#626962">Result</text><path d="M552 632V716" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="574" y="682" font-size="18" fill="#626962">Calls</text><rect x="24" y="720" width="672" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="762" font-size="22" fill="#252c28">Test assertions</text><text x="40" y="802" font-size="19" fill="#252c28">Check checkout result and inspect the recorded call.</text><text x="24" y="876" font-size="19" fill="#626962">No provider contact here. Verify the real adapter separately.</text></svg>
