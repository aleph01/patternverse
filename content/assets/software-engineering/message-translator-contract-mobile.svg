<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1136" viewBox="0 0 360 1136" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Message Translator: a directional parcel contract</title><desc id="desc">Carrier schema 1 supplies event E901, parcel P42, gross_kg as the decimal string 1.250, and state R. Mapping carrier-a-v1/warehouse-v2 preserves event and parcel identity, converts kilograms to 1250 integer grams, and maps the documented carrier code R to ready_for_pickup. Warehouse schema 2 receives a newly constructed message with mapping provenance.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1136" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Translate units and meanings</text><rect x="24" y="104" width="312" height="208" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Carrier schema 1</text><text x="40" y="159" font-size="17" fill="#626962">source: carrier-a</text><text x="40" y="198" font-size="17" fill="#626962">E901 / parcel P42</text><text x="40" y="234" font-size="18" fill="#626962">gross_kg: &quot;1.250&quot;</text><text x="40" y="270" font-size="18" fill="#626962">state: R</text><path d="M180 312V398" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="362" font-size="17" fill="#626962">translate</text><rect x="24" y="400" width="312" height="208" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="429" font-size="20" fill="#252c28">Mapping: carrier-a-v1</text><text x="40" y="455" font-size="17" fill="#626962">Target: warehouse-v2</text><text x="40" y="494" font-size="17" fill="#626962">1.250 kg × 1000 = 1250 g</text><text x="40" y="530" font-size="17" fill="#626962">R → ready_for_pickup</text><text x="40" y="566" font-size="16" fill="#626962">Keep source and event identity.</text><path d="M180 608V694" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="696" width="312" height="256" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="725" font-size="20" fill="#252c28">Warehouse schema 2</text><text x="40" y="751" font-size="17" fill="#626962">source_system: carrier-a</text><text x="40" y="790" font-size="17" fill="#626962">event_id: E901 / parcel_id: P42</text><text x="40" y="826" font-size="18" fill="#626962">gross_mass_g: 1250</text><text x="40" y="862" font-size="17" fill="#626962">pickup_state: ready_for_pickup</text><text x="40" y="910" font-size="15" fill="#626962">Mapping version travels with output.</text><text x="24" y="1040" font-size="17" fill="#252c28">Gross mass means the same thing.</text><text x="24" y="1080" font-size="17" fill="#626962">Whole grams only; no rounding.</text></svg>
