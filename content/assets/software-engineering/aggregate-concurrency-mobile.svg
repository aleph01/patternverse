<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1068" viewBox="0 0 360 1068" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A competing aggregate update requires re-evaluation</title><desc id="desc">Two writers load version 7 of a plan holding 60 kilograms. One proposes adding 40 kilograms and the other 30 kilograms; both pass their local capacity check. The first atomic save advances to version 8 at 100 kilograms. The second save expects version 7 and is rejected. Re-evaluating its command against version 8 exceeds capacity.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1068" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Local validity needs</text><text x="24" y="60" font-size="22" fill="#252c28">an atomic save</text><rect x="24" y="104" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">1. Both load version 7</text><text x="40" y="159" font-size="17" fill="#626962">60 kg used · capacity: 100 kg</text><path d="M180 204V248" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="250" width="312" height="140" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="282" font-size="20" fill="#252c28">2. Both local checks pass</text><text x="40" y="324" font-size="19" fill="#252c28">A adds 40 kg: total 100 kg</text><text x="40" y="358" font-size="19" fill="#252c28">B adds 30 kg: total 90 kg</text><path d="M180 390V436" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="438" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="467" font-size="20" fill="#252c28">3. A saves, expecting v7</text><text x="40" y="493" font-size="17" fill="#626962">Stored: 100 kg · version 8</text><path d="M180 538V596" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="598" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="627" font-size="20" fill="#252c28">4. B saves, expecting v7</text><text x="40" y="653" font-size="17" fill="#626962">Conflict: stored version is 8</text><path d="M180 698V756" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="758" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="790" font-size="20" fill="#252c28">5. Reload and re-evaluate</text><text x="40" y="832" font-size="21" fill="#252c28">100 + 30 = 130 kg</text><text x="40" y="868" font-size="18" fill="#252c28">Capacity exceeded: reject</text><text x="24" y="958" font-size="18" fill="#252c28">Version check and all writes</text><text x="24" y="988" font-size="18" fill="#252c28">must share one atomic commit.</text><text x="24" y="1036" font-size="17" fill="#626962">Arrows show the numbered sequence.</text></svg>
