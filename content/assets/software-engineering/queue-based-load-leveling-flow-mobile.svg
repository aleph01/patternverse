<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1128" viewBox="0 0 360 1128" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Buffer arrivals, then control the drain</title><desc id="desc">Bursty producers enqueue jobs into a six-place waiting buffer. A controlled handler transfers work toward the target using a two-job budget per one-second model tick. Confirmed admission and completed work are distinct outcomes. Queue capacity, drain budget, and target capacity are separate controls.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1128" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Accept now; finish later</text><rect x="24" y="104" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="136" font-size="20" fill="#252c28">Producers / bursty intake</text><text x="40" y="174" font-size="17" fill="#626962">Tick 1: six jobs arrive.</text><path d="M300 216V312" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="264" font-size="17" fill="#626962">Confirmed enqueue</text><rect x="24" y="312" width="312" height="192" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="344" font-size="20" fill="#252c28">Waiting queue / capacity 6</text><rect x="40" y="376" width="28" height="32" fill="#fff" stroke="#00855b" stroke-width="1.2"/><rect x="84" y="376" width="28" height="32" fill="#fff" stroke="#00855b" stroke-width="1.2"/><rect x="128" y="376" width="28" height="32" fill="#fff" stroke="#00855b" stroke-width="1.2"/><rect x="172" y="376" width="28" height="32" fill="#fff" stroke="#00855b" stroke-width="1.2"/><rect x="216" y="376" width="28" height="32" fill="#fff" stroke="#00855b" stroke-width="1.2"/><rect x="260" y="376" width="28" height="32" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="438" font-size="17" fill="#626962">Count jobs.</text><text x="40" y="478" font-size="17" fill="#626962">Also bound bytes in production.</text><path d="M300 504V600" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="552" font-size="17" fill="#626962">Take within the budget</text><rect x="24" y="600" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="632" font-size="20" fill="#252c28">Controlled handler</text><text x="40" y="672" font-size="18" fill="#252c28">At most 2 jobs per 1 s tick.</text><text x="40" y="712" font-size="16" fill="#626962">All consumers share this budget.</text><path d="M300 744V840" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="792" font-size="17" fill="#626962">Work toward the target</text><rect x="24" y="840" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="872" font-size="20" fill="#252c28">Target / report writer</text><text x="40" y="912" font-size="17" fill="#626962">Fits the chosen service budget.</text><text x="24" y="1016" font-size="17" fill="#626962">Arrows: work transfer.</text><text x="24" y="1056" font-size="17" fill="#252c28">Enqueued does not mean finished.</text><text x="24" y="1096" font-size="17" fill="#626962">The tick budget is a model rule.</text></svg>
