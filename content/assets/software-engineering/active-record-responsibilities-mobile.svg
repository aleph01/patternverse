<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1172" viewBox="0 0 360 1172" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Active Record combines row state, rules, and persistence</title><desc id="desc">A caller loads and works with a Task object. The Task contains its title and completion flag, rename and complete business operations, and find and save persistence methods. The same class issues SQL for the corresponding tasks row; no separate mapper is used.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1172" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">One record object,</text><text x="24" y="60" font-size="22" fill="#252c28">business behavior and SQL</text><rect x="24" y="104" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Caller</text><text x="40" y="159" font-size="17" fill="#626962">find · complete · save</text><path d="M180 204V278" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="280" width="312" height="560" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="316" font-size="23" fill="#252c28">Task</text><rect x="44" y="348" width="272" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="380" font-size="20" fill="#252c28">Data</text><text x="60" y="416" font-size="17" fill="#252c28">id: 1 · done: False</text><text x="60" y="446" font-size="17" fill="#626962">title: Label cartons</text><rect x="44" y="488" width="272" height="132" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="520" font-size="20" fill="#252c28">Business rules</text><text x="60" y="558" font-size="17" fill="#252c28">rename(title) · complete()</text><text x="60" y="596" font-size="17" fill="#626962">No rename if done</text><rect x="44" y="648" width="272" height="132" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="680" font-size="20" fill="#252c28">Persistence methods</text><text x="60" y="718" font-size="17" fill="#252c28">find(db, id) · save()</text><text x="60" y="756" font-size="16" fill="#626962">SELECT / INSERT / UPDATE</text><rect x="24" y="928" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="957" font-size="20" fill="#252c28">tasks row</text><text x="40" y="983" font-size="17" fill="#626962">id: 1 · done: 0</text><path d="M180 840V926" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="1100" font-size="18" fill="#252c28">One class owns both roles.</text><text x="24" y="1136" font-size="17" fill="#626962">Arrows: calls, then SQL.</text></svg>
