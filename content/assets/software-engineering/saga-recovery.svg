<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Compensation resumes without erasing other work</title><desc id="desc">Inventory starts with five mugs. O42 reserves two, and another order O99 reserves one, leaving two available. O42's carrier declines. Packing is released, Inventory release temporarily fails, and a later retry releases only O42's two mugs. Four remain available; O99 still holds one.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="920" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Compensation preserves legitimate intervening work</text><rect x="24" y="112" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Inventory starts with 5 physical mugs</text><text x="40" y="167" font-size="17" fill="#626962">O42 reserves 2; another order O99 reserves 1. Available: 2.</text><text x="40" y="210" font-size="18" fill="#626962">Each reservation has its own identity.</text><path d="M360 240V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="320" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="349" font-size="20" fill="#252c28">Carrier declines O42; Packing releases its slot</text><text x="40" y="375" font-size="17" fill="#626962">Inventory release is temporarily unavailable.</text><text x="40" y="418" font-size="18" fill="#626962">waiting_compensation / done: 1 / 2 mugs free / 1 slot free</text><path d="M360 448V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="494" font-size="17" fill="#626962">resume call</text><rect x="24" y="528" width="672" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="557" font-size="20" fill="#252c28">Retry C1: release only O42’s two mugs</text><text x="40" y="583" font-size="17" fill="#626962">Available: 4. Packing compensation is not repeated.</text><text x="40" y="646" font-size="18" fill="#626962">compensated / done: 0 / O99 still holds 1 mug</text><text x="24" y="790" font-size="20" fill="#252c28">The acceptable result is 4 available, not the original 5.</text><text x="24" y="834" font-size="18" fill="#626962">Arrows: intervening work, compensation pause, then retry.</text><text x="24" y="874" font-size="16" fill="#626962">This simulation retains one in-memory coordinator state; it has no crash recovery.</text></svg>
