<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1056" viewBox="0 0 360 1056" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Lease lifetime</title><desc id="desc">At authority time zero A acquires the partition for 3000 milliseconds. At 2000 milliseconds A renews, moving expiry to 5000. B is denied at 4999. At exactly 5000 A's grant is expired and B can acquire a new grant.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1056" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Grant, renew, expire</text><text x="24" y="70" font-size="16" fill="#626962">Authority clock / integer milliseconds</text><rect x="24" y="112" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">0 ms / A acquires grant 1</text><text x="40" y="167" font-size="16" fill="#626962">TTL 3000 / expires at 3000</text><text x="40" y="222" font-size="16" fill="#626962">Only one current acquisition.</text><path d="M180 256V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="320" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="349" font-size="18" fill="#252c28">2000 ms / renewal accepted</text><text x="40" y="375" font-size="16" fill="#626962">New deadline: 2000 + 3000</text><text x="40" y="430" font-size="17" fill="#626962">Expires at 5000, not 6000.</text><path d="M180 464V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="528" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="557" font-size="18" fill="#252c28">4999 ms / B asks to acquire</text><text x="40" y="583" font-size="16" fill="#626962">A is still current / B is denied</text><text x="40" y="638" font-size="16" fill="#626962">Time is strictly before expiry.</text><path d="M180 672V734" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="736" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="765" font-size="18" fill="#252c28">5000 ms / A’s grant expired</text><text x="40" y="791" font-size="16" fill="#626962">A cannot renew in this model.</text><text x="40" y="846" font-size="17" fill="#626962">B can acquire a new grant.</text><text x="24" y="970" font-size="15" fill="#626962">Arrows: successive authority operations.</text><text x="24" y="1008" font-size="16" fill="#626962">No client clock is modeled.</text></svg>
