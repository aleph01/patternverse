<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1056" viewBox="0 0 720 1056" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Four causes, four emissions</title><desc id="desc">The program emits a, bb, and c at 8 milliseconds because three items have accumulated. At 13 milliseconds it emits dddd before adding eee because seven bytes would exceed the six-byte limit. At 23 milliseconds eee reaches ten milliseconds of age. Closing at 26 milliseconds emits the remaining f and g.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="1056" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Four causes emit four bounded batches</text><text x="24" y="78" font-size="19" fill="#626962">Limits: 3 items / 6 payload bytes / 10 ms oldest-item age.</text><rect x="24" y="112" width="672" height="156" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="146" font-size="22" fill="#252c28">8 ms / count</text><text x="40" y="190" font-size="22" fill="#252c28">a, bb, c / 4 bytes</text><text x="328" y="190" font-size="19" fill="#626962">Third item arrives at 8 ms.</text><text x="328" y="228" font-size="19" fill="#626962">Count reaches 3; 4 payload bytes.</text><path d="M72 268V328" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="306" font-size="18" fill="#626962">Add dddd, then eee</text><rect x="24" y="332" width="672" height="156" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="366" font-size="22" fill="#252c28">13 ms / size</text><text x="40" y="410" font-size="22" fill="#252c28">dddd / 4 bytes</text><text x="328" y="410" font-size="19" fill="#626962">4 + 3 would exceed 6 bytes.</text><text x="328" y="448" font-size="19" fill="#626962">Emit dddd before admitting eee.</text><path d="M72 488V548" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="526" font-size="18" fill="#626962">Advance with no arrival</text><rect x="24" y="552" width="672" height="156" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="586" font-size="22" fill="#252c28">23 ms / age</text><text x="40" y="630" font-size="22" fill="#252c28">eee / 3 bytes</text><text x="328" y="630" font-size="19" fill="#626962">Oldest item arrived at 13 ms.</text><text x="328" y="668" font-size="19" fill="#626962">13 + 10 = 23 ms; advance called.</text><path d="M72 708V768" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="746" font-size="18" fill="#626962">Add f, g; close</text><rect x="24" y="772" width="672" height="156" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="806" font-size="22" fill="#252c28">26 ms / close</text><text x="40" y="850" font-size="22" fill="#252c28">f, g / 2 bytes</text><text x="328" y="850" font-size="19" fill="#626962">f and g arrived at 24 and 25 ms.</text><text x="328" y="888" font-size="19" fill="#626962">Close drains the partial group.</text><text x="24" y="980" font-size="21" fill="#252c28">Age needs a progress mechanism.</text><text x="24" y="1014" font-size="19" fill="#626962">Late advance means late emission; sending adds more delay.</text></svg>
