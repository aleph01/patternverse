<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1256" viewBox="0 0 360 1256" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Reactor readiness dispatch</title><desc id="desc">Two sockets are registered with the Reactor. The dispatcher waits on the selector, receives readable socket handles, and invokes each handle's registered handler. Each handler attempts nonblocking reads, retains unfinished state, and returns control to the dispatcher.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1256" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Wait, dispatch, return</text><rect x="24" y="112" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">Registered sockets A and B</text><text x="40" y="167" font-size="16" fill="#626962">Read interest + one callback each</text><path d="M180 240V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="286" font-size="16" fill="#626962">wait</text><rect x="24" y="320" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="349" font-size="18" fill="#252c28">Selector / demultiplexer</text><text x="40" y="375" font-size="16" fill="#626962">Returns readable registrations.</text><path d="M180 448V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="494" font-size="16" fill="#626962">ready handles</text><rect x="24" y="528" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="557" font-size="18" fill="#252c28">Reactor dispatcher</text><text x="40" y="583" font-size="16" fill="#626962">Calls key.data(key, mask).</text><path d="M180 656V734" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="702" font-size="16" fill="#626962">callback</text><rect x="24" y="736" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="765" font-size="18" fill="#252c28">Connection’s read handler</text><text x="40" y="791" font-size="16" fill="#626962">Attempts one nonblocking read.</text><text x="40" y="846" font-size="16" fill="#626962">Retains unfinished bytes locally.</text><path d="M180 880V958" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="926" font-size="16" fill="#626962">return</text><rect x="24" y="960" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="989" font-size="18" fill="#252c28">Loop can wait or dispatch again</text><text x="40" y="1015" font-size="16" fill="#626962">No handler waits for a full record.</text><text x="24" y="1172" font-size="15" fill="#626962">Arrows: control flow for one loop turn.</text><text x="24" y="1210" font-size="15" fill="#626962">A ready socket is not a complete record.</text></svg>
