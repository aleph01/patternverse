<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1296" viewBox="0 0 360 1296" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Decisions outside business logic, enforcement at the resource</title><desc id="desc">A resource handler builds a decision request from a trusted subject and report metadata, sends it to a separate policy engine, and receives a decision with query binding, policy version, and obligations. The same handler validates and enforces that response before reading a protected body. Missing, denied, unusable, or failed decisions never reach the body read.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1296" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Separate decision and action</text><text x="24" y="78" font-size="18" fill="#626962">The handler still guards the read.</text><rect x="24" y="112" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="152" font-size="22" fill="#252c28">1 Handler / PEP</text><text x="40" y="192" font-size="18" fill="#252c28">Authenticated subject</text><text x="40" y="226" font-size="18" fill="#252c28">Trusted report tenant</text><text x="40" y="264" font-size="18" fill="#626962">Build exact read query</text><path d="M72 288V368" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="326" font-size="18" fill="#626962">Decision request</text><text x="96" y="356" font-size="17" fill="#626962">subject/action/resource</text><rect x="24" y="372" width="312" height="184" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="412" font-size="21" fill="#252c28">2 Policy engine / PDP</text><text x="40" y="452" font-size="18" fill="#252c28">Rules + policy data</text><text x="40" y="488" font-size="18" fill="#252c28">Evaluate current query</text><text x="40" y="528" font-size="18" fill="#626962">Return allow or deny</text><path d="M72 556V644" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="594" font-size="17" fill="#626962">Decision + obligations</text><text x="96" y="624" font-size="17" fill="#626962">+ policy version</text><rect x="24" y="648" width="312" height="264" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="688" font-size="21" fill="#252c28">3 Same handler / PEP</text><text x="40" y="730" font-size="18" fill="#252c28">Require Boolean true</text><text x="40" y="768" font-size="18" fill="#252c28">Match the exact query</text><text x="40" y="806" font-size="18" fill="#252c28">Require usable response</text><text x="40" y="844" font-size="17" fill="#252c28">Reject unsupported obligations</text><text x="40" y="882" font-size="17" fill="#626962">Deny or failure → no read</text><path d="M72 912V992" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="950" font-size="17" fill="#626962">Only usable permission</text><text x="96" y="980" font-size="17" fill="#626962">reaches body retrieval</text><rect x="24" y="996" width="312" height="152" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1036" font-size="21" fill="#252c28">4 Protected report body</text><text x="40" y="1078" font-size="18" fill="#252c28">Only the handler reads it.</text><text x="40" y="1116" font-size="17" fill="#626962">No direct PDP body access</text><text x="24" y="1192" font-size="17" fill="#252c28">Decision policy can run locally,</text><text x="24" y="1226" font-size="18" fill="#252c28">in a sidecar, or remotely.</text><text x="24" y="1266" font-size="17" fill="#626962">These are ownership boundaries.</text></svg>
