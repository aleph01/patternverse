<svg xmlns="http://www.w3.org/2000/svg" width="360" height="932" viewBox="0 0 360 932" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Continuing equipment identity across changes and representations</title><desc id="desc">Equipment studio / 42 is registered with label Camera, renamed Camera B, and reconstructed as another object from a serialized record. The identity stays studio / 42 across all three representations.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="932" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Identity continues through</text><text x="24" y="60" font-size="22" fill="#252c28">changes and reconstruction</text><rect x="24" y="112" width="312" height="180" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="144" font-size="20" fill="#252c28">1 · Register</text><rect x="44" y="164" width="272" height="54" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="198" font-size="20" fill="#252c28">studio / 42</text><text x="44" y="252" font-size="19" fill="#252c28">Camera</text><text x="44" y="280" font-size="17" fill="#626962">Python object A</text><path d="M180 292V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="352" width="312" height="180" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="384" font-size="20" fill="#252c28">2 · Rename</text><rect x="44" y="404" width="272" height="54" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="438" font-size="20" fill="#252c28">studio / 42</text><text x="44" y="492" font-size="19" fill="#252c28">Camera B</text><text x="44" y="520" font-size="17" fill="#626962">Python object A</text><path d="M180 532V590" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="592" width="312" height="180" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="624" font-size="20" fill="#252c28">3 · Reload from JSON</text><rect x="44" y="644" width="272" height="54" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="678" font-size="20" fill="#252c28">studio / 42</text><text x="44" y="732" font-size="19" fill="#252c28">Camera B</text><text x="44" y="760" font-size="17" fill="#626962">Python object B</text><text x="24" y="830" font-size="18" fill="#252c28">The complete key is preserved.</text><text x="24" y="870" font-size="17" fill="#626962">Reload creates a different object,</text><text x="24" y="896" font-size="17" fill="#626962">representing the same equipment.</text></svg>
