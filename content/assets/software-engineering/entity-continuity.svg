<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Continuing equipment identity across changes and representations</title><desc id="desc">Equipment studio / 42 is registered with label Camera, renamed Camera B, and reconstructed as another object from a serialized record. The identity stays studio / 42 across all three representations.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="480" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Identity continues through changes and reconstruction</text><rect x="24" y="112" width="200" height="180" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="144" font-size="20" fill="#252c28">1 · Register</text><rect x="44" y="164" width="160" height="54" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="198" font-size="20" fill="#252c28">studio / 42</text><text x="44" y="252" font-size="19" fill="#252c28">Camera</text><text x="44" y="280" font-size="17" fill="#626962">Python object A</text><rect x="260" y="112" width="200" height="180" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="276" y="144" font-size="20" fill="#252c28">2 · Rename</text><rect x="280" y="164" width="160" height="54" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="296" y="198" font-size="20" fill="#252c28">studio / 42</text><text x="280" y="252" font-size="19" fill="#252c28">Camera B</text><text x="280" y="280" font-size="17" fill="#626962">Python object A</text><rect x="496" y="112" width="200" height="180" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="512" y="144" font-size="20" fill="#252c28">3 · Reload</text><rect x="516" y="164" width="160" height="54" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="532" y="198" font-size="20" fill="#252c28">studio / 42</text><text x="516" y="252" font-size="19" fill="#252c28">Camera B</text><text x="516" y="280" font-size="17" fill="#626962">Python object B</text><path d="M224 202H258" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M460 202H494" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="358" font-size="19" fill="#252c28">Same EquipmentId; labels and runtime instances can differ.</text><text x="24" y="400" font-size="18" fill="#252c28">Reload reuses the serialized catalog and number.</text><text x="24" y="438" font-size="17" fill="#626962">The key identifies equipment, not a particular snapshot of its state.</text></svg>
