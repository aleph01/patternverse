<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1168" viewBox="0 0 360 1168" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Request-Reply: deadline and late answer</title><desc id="desc">A pending request has a local deadline of 500 milliseconds. A valid reply received at 499 milliseconds completes that request. If the request is still pending at 500 milliseconds, expiration removes its context. A later reply is ignored. The remote service can still have completed the work; local expiration is not remote cancellation.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1168" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">A timeout ends local waiting</text><rect x="24" y="104" width="312" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Pending desk:3</text><text x="40" y="159" font-size="17" fill="#626962">Local deadline: 500 ms</text><text x="24" y="272" font-size="19" fill="#252c28">Alternative A: before deadline</text><rect x="24" y="320" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="349" font-size="20" fill="#252c28">Valid reply at 499 ms</text><text x="40" y="375" font-size="17" fill="#626962">Accept 3 units; remove waiter.</text><text x="24" y="500" font-size="19" fill="#252c28">Alternative B: deadline reached</text><rect x="24" y="548" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="577" font-size="20" fill="#252c28">Still pending at 500 ms</text><text x="40" y="603" font-size="17" fill="#626962">Expire and remove waiter.</text><path d="M180 660V750" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="712" font-size="17" fill="#626962">then</text><rect x="24" y="752" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="781" font-size="20" fill="#252c28">Reply arrives at 501 ms</text><text x="40" y="807" font-size="17" fill="#626962">No pending match: ignore.</text><text x="24" y="944" font-size="18" fill="#252c28">The server may have finished.</text><text x="24" y="988" font-size="17" fill="#626962">No cancellation was sent.</text><text x="24" y="1080" font-size="17" fill="#252c28">At 500 ms, accept also times out.</text><text x="24" y="1120" font-size="17" fill="#626962">Boundary rule: now ≥ deadline.</text></svg>
