<svg xmlns="http://www.w3.org/2000/svg" width="720" height="992" viewBox="0 0 720 992" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Invalid drafts stay outside accepted domain state</title><desc id="desc">The accepted profile name is Ada. A blank draft produces an error, disables Apply, and leaves Ada unchanged. Replacing the draft with Grace enables Apply. Applying invokes domain validation and changes the accepted name to Grace, after which Apply and Cancel are disabled.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="992" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Keep drafts separate from accepted data</text><rect x="24" y="100" width="672" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">Accepted name: Ada</text><text x="40" y="155" font-size="17" fill="#626962">Editor begins with draft: Ada.</text><rect x="24" y="308" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="337" font-size="20" fill="#252c28">Draft: two spaces</text><text x="40" y="363" font-size="17" fill="#626962">Apply disabled; Cancel enabled.</text><text x="40" y="412" font-size="16" fill="#626962">Error: name needs 1–40 chars.</text><rect x="384" y="308" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="337" font-size="20" fill="#252c28">Accepted name: Ada</text><text x="400" y="363" font-size="17" fill="#626962">Invalid Apply changes no name.</text><path d="M180 196V306" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="254" font-size="17" fill="#626962">edit draft</text><path d="M336 372H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="548" width="672" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="577" font-size="20" fill="#252c28">Draft: Grace; accepted name still Ada</text><text x="40" y="603" font-size="17" fill="#626962">Apply enabled; Cancel enabled.</text><path d="M180 436V546" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="496" font-size="17" fill="#626962">replace draft</text><rect x="24" y="780" width="672" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="809" font-size="20" fill="#252c28">After successful Apply: accepted name and draft are Grace</text><text x="40" y="835" font-size="17" fill="#626962">Apply disabled; Cancel disabled; feedback: Saved</text><path d="M180 652V778" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="718" font-size="17" fill="#626962">Apply validates and renames</text><text x="24" y="944" font-size="18" fill="#252c28">Cancel would instead reload the current accepted name.</text></svg>
