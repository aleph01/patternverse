<svg xmlns="http://www.w3.org/2000/svg" width="360" height="968" viewBox="0 0 360 968" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A stable seam directs capabilities to different implementations</title><desc id="desc">During migration, clients keep using one entry point. Its routing seam sends the catalog capability to the replacement and the invoice capability to the legacy implementation. The request selects one owner; no error path automatically sends it to both.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="968" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Shift responsibility by slice</text><text x="24" y="84" font-size="19" fill="#626962">During the catalog migration</text><rect x="24" y="112" width="312" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="150" font-size="22" fill="#252c28">Clients</text><text x="40" y="182" font-size="18" fill="#626962">Keep the same entry point</text><path d="M72 200V256" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="236" font-size="18" fill="#626962">Request a capability</text><rect x="24" y="260" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="298" font-size="22" fill="#252c28">Routing seam</text><text x="40" y="338" font-size="19" fill="#252c28">invoices → legacy</text><text x="40" y="378" font-size="19" fill="#252c28">catalog → replacement</text><text x="24" y="456" font-size="19" fill="#626962">Invoice request selects:</text><rect x="24" y="480" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="518" font-size="22" fill="#252c28">Legacy system</text><text x="40" y="556" font-size="19" fill="#252c28">Owns invoice capability</text><text x="24" y="640" font-size="19" fill="#626962">Catalog request selects:</text><rect x="24" y="664" width="312" height="120" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="702" font-size="22" fill="#252c28">Replacement</text><text x="40" y="740" font-size="19" fill="#252c28">Owns catalog capability</text><text x="40" y="772" font-size="17" fill="#626962">Errors stay on this path</text><text x="24" y="836" font-size="18" fill="#252c28">One selected handler per request.</text><text x="24" y="874" font-size="18" fill="#626962">No automatic error fallback.</text><text x="24" y="926" font-size="18" fill="#626962">Retire displaced paths deliberately.</text></svg>
