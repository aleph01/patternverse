<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1160" viewBox="0 0 360 1160" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Rejected reservation preserves capacity and changes screen feedback</title><desc id="desc">A three-seat model accepts a reservation of two seats, and the presenter renders one remaining seat with Reserve enabled. A second request for two is rejected without mutation. The presenter reads the unchanged remaining count and renders the same availability with an error message. The recording view captures that screen result without a GUI.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1160" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Reject the booking;</text><text x="24" y="60" font-size="22" fill="#252c28">update the feedback</text><rect x="24" y="104" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Before the next click</text><text x="40" y="159" font-size="17" fill="#626962">Seats left: 1; Reserve enabled.</text><path d="M180 208V294" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="260" font-size="17" fill="#626962">reserve(&quot;2&quot;)</text><rect x="24" y="296" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="325" font-size="20" fill="#252c28">Presenter → model</text><text x="40" y="351" font-size="17" fill="#626962">Request two more seats.</text><path d="M180 400V486" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="452" font-size="17" fill="#626962">capacity check</text><rect x="24" y="488" width="312" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="517" font-size="20" fill="#252c28">Model rejects</text><text x="40" y="543" font-size="17" fill="#626962">2 > 1; remaining stays 1.</text><path d="M180 592V678" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="644" font-size="17" fill="#626962">BookingError</text><rect x="24" y="680" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="709" font-size="20" fill="#252c28">Presenter refreshes</text><text x="40" y="735" font-size="17" fill="#626962">Read unchanged remaining.</text><path d="M180 784V870" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="836" font-size="17" fill="#626962">render(screen)</text><rect x="24" y="872" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="901" font-size="20" fill="#252c28">View receives</text><text x="40" y="927" font-size="17" fill="#626962">Seats left: 1; Reserve enabled.</text><text x="40" y="986" font-size="17" fill="#626962">Message: Not enough seats</text><text x="24" y="1072" font-size="18" fill="#252c28">The recorder captures this result.</text><text x="24" y="1112" font-size="17" fill="#626962">A flag never replaces validation.</text></svg>
