<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1232" viewBox="0 0 360 1232" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Request-Reply: correlation and return address</title><desc id="desc">The desk sends inventory requests desk:1 and desk:2 with the return address desk.replies. The inventory service sends replies to that inbox, copying each request ID into its reply correlation ID. Reply desk:2 arrives before desk:1; the desk selects the matching pending context by ID rather than arrival order.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1232" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Match replies to requests</text><rect x="24" y="104" width="312" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Checkout desk</text><text x="40" y="159" font-size="17" fill="#626962">inbox: desk.replies</text><path d="M180 200V278" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="248" font-size="17" fill="#626962">send</text><rect x="24" y="280" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="309" font-size="20" fill="#252c28">Two requests</text><text x="40" y="335" font-size="17" fill="#626962">IDs desk:1 and desk:2</text><text x="40" y="374" font-size="17" fill="#626962">reply_to: desk.replies</text><path d="M180 424V502" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="474" font-size="17" fill="#626962">handle</text><rect x="24" y="504" width="312" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="533" font-size="20" fill="#252c28">Inventory service</text><text x="40" y="559" font-size="17" fill="#626962">Look up book and shoe units.</text><path d="M180 600V678" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="650" font-size="17" fill="#626962">reply</text><rect x="24" y="680" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="709" font-size="20" fill="#252c28">Replies reach desk.replies</text><text x="40" y="735" font-size="17" fill="#626962">desk:2 → 8 units arrives first.</text><text x="40" y="774" font-size="17" fill="#626962">desk:1 → 3 units arrives later.</text><path d="M180 824V910" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="874" font-size="17" fill="#626962">match by ID</text><rect x="24" y="912" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="941" font-size="20" fill="#252c28">Resume matching contexts</text><text x="40" y="967" font-size="17" fill="#626962">desk:2 completes first.</text><text x="40" y="1006" font-size="17" fill="#626962">desk:1 completes later.</text><text x="40" y="1042" font-size="17" fill="#626962">Arrival order is not identity.</text><text x="24" y="1144" font-size="18" fill="#252c28">Address selects the inbox.</text><text x="24" y="1184" font-size="18" fill="#252c28">ID selects the pending request.</text></svg>
