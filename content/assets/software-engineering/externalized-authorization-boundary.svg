<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1064" viewBox="0 0 720 1064" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Decisions outside business logic, enforcement at the resource</title><desc id="desc">A resource handler builds a decision request from a trusted subject and report metadata, sends it to a separate policy engine, and receives a decision with query binding, policy version, and obligations. The same handler validates and enforces that response before reading a protected body. Missing, denied, unusable, or failed decisions never reach the body read.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="1064" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Move decisions; enforce at the operation</text><text x="24" y="78" font-size="19" fill="#626962">One read request crosses a policy decision interface.</text><rect x="24" y="112" width="672" height="136" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="152" font-size="23" fill="#252c28">1 Handler / PEP</text><text x="40" y="194" font-size="19" fill="#252c28">Authenticated subject + trusted resource metadata</text><text x="40" y="230" font-size="19" fill="#626962">Build (subject, action, resource, tenant)</text><path d="M72 248V316" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="290" font-size="19" fill="#626962">Decision request: exact operation + context</text><rect x="24" y="320" width="672" height="152" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="360" font-size="23" fill="#252c28">2 Policy engine / PDP</text><text x="40" y="404" font-size="19" fill="#252c28">Evaluate rules + policy data; decide access</text><text x="40" y="444" font-size="19" fill="#626962">Policy ownership is separate from business processing.</text><path d="M72 472V548" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="514" font-size="19" fill="#626962">Decision response + policy version + obligations</text><rect x="24" y="552" width="672" height="200" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="592" font-size="23" fill="#252c28">3 Same handler / PEP</text><text x="40" y="632" font-size="19" fill="#252c28">Require Boolean true and matching query</text><text x="40" y="672" font-size="19" fill="#252c28">Reject unusable replies and unsupported obligations</text><text x="40" y="720" font-size="19" fill="#626962">Deny or failure → no protected-body read</text><path d="M72 752V828" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="798" font-size="19" fill="#626962">Only explicit, usable permission reaches the body</text><rect x="24" y="832" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="874" font-size="23" fill="#252c28">4 Protected report body</text><text x="40" y="920" font-size="19" fill="#626962">PDP decides; the handler performs the read.</text><text x="24" y="992" font-size="19" fill="#252c28">Errors and unsupported obligations cause no body read.</text><text x="24" y="1032" font-size="18" fill="#626962">A local engine, sidecar, or remote service can fill the PDP role.</text></svg>
