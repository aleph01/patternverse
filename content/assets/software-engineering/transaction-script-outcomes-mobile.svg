<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1256" viewBox="0 0 360 1256" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Stock and movement commit together or roll back</title><desc id="desc">A successful issue starts with five units, subtracts three, inserts movement I-1, and commits two remaining units. A later attempt using duplicate movement I-1 starts with two units, temporarily subtracts one, fails to insert, and rolls back to two. The original I-1 movement remains three units.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1256" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Same procedure,</text><text x="24" y="60" font-size="22" fill="#252c28">two transaction outcomes</text><text x="24" y="112" font-size="20" fill="#252c28">New movement I-1</text><rect x="24" y="144" width="312" height="90" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="173" font-size="20" fill="#252c28">5 available</text><text x="40" y="199" font-size="17" fill="#626962">Request: 3 units</text><rect x="24" y="294" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="326" font-size="21" fill="#252c28">5 → 2 (provisional)</text><text x="40" y="360" font-size="17" fill="#626962">Insert I-1: 3 units</text><text x="40" y="392" font-size="19" fill="#252c28">COMMIT</text><rect x="24" y="474" width="312" height="90" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="503" font-size="20" fill="#252c28">2 available</text><text x="40" y="529" font-size="17" fill="#626962">Stored movement I-1: 3 units</text><path d="M180 234V292" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 414V472" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="660" font-size="20" fill="#252c28">Duplicate movement I-1</text><rect x="24" y="696" width="312" height="90" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="725" font-size="20" fill="#252c28">2 available</text><text x="40" y="751" font-size="17" fill="#626962">Request: 1 unit</text><rect x="24" y="846" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="878" font-size="21" fill="#252c28">2 → 1 (provisional)</text><text x="40" y="912" font-size="17" fill="#626962">Insert I-1 fails</text><text x="40" y="944" font-size="19" fill="#252c28">ROLLBACK</text><rect x="24" y="1026" width="312" height="90" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1055" font-size="20" fill="#252c28">2 available</text><text x="40" y="1081" font-size="17" fill="#626962">I-1 still records 3 units</text><path d="M180 786V844" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 966V1024" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="24" y="1180" font-size="18" fill="#252c28">A rejected issue takes no stock.</text><text x="24" y="1216" font-size="17" fill="#626962">Dashed: failed insert and rollback.</text></svg>
