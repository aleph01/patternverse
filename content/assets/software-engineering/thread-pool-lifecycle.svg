<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1296" viewBox="0 0 720 1296" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Thread Pool: task and worker lifetimes</title><desc id="desc">In one possible schedule, worker A runs job 0 and later job 2 on the same thread. Worker B runs job 1 and later job 3. Each future becomes a result or exception, which the coordinator collects before freeing an admission place. After the final submitted tasks finish, the owner shuts down and joins the pool workers before removing temporary files.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1296" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Reusable threads, separate task futures</text><text x="24" y="96" font-size="17" fill="#626962">One possible schedule; task-to-thread assignment is not a promise.</text><rect x="24" y="160" width="128" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="198" font-size="20" fill="#252c28">Thread A</text><text x="40" y="244" font-size="17" fill="#626962">Reused</text><rect x="192" y="160" width="216" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="208" y="189" font-size="20" fill="#252c28">job 0</text><text x="208" y="215" font-size="17" fill="#626962">3 bytes</text><rect x="480" y="160" width="216" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="496" y="189" font-size="20" fill="#252c28">job 2</text><text x="496" y="215" font-size="17" fill="#626962">ValueError</text><path d="M408 240H478" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="424" y="218" font-size="15" fill="#626962">next</text><rect x="24" y="400" width="128" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="438" font-size="20" fill="#252c28">Thread B</text><text x="40" y="484" font-size="17" fill="#626962">Reused</text><rect x="192" y="400" width="216" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="208" y="429" font-size="20" fill="#252c28">job 1</text><text x="208" y="455" font-size="17" fill="#626962">4 bytes</text><rect x="480" y="400" width="216" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="496" y="429" font-size="20" fill="#252c28">job 3</text><text x="496" y="455" font-size="17" fill="#626962">FileNotFoundError</text><path d="M408 480H478" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="424" y="458" font-size="15" fill="#626962">next</text><text x="24" y="698" font-size="17" fill="#626962">Row arrows: the same thread takes another task, not a new thread.</text><rect x="24" y="768" width="672" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="797" font-size="20" fill="#252c28">Coordinator: collect each completed future’s result or exception</text><text x="40" y="823" font-size="17" fill="#626962">Collection overlaps execution and frees an admission place for another job.</text><rect x="24" y="1008" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1037" font-size="20" fill="#252c28">Pool owner: finish input, collect outcomes, exit the executor context</text><text x="40" y="1063" font-size="17" fill="#626962">Wait for submitted tasks and join workers before removing temporary files.</text><text x="24" y="1210" font-size="17" fill="#626962">Index-sorted reporting does not imply execution or completion order.</text><text x="24" y="1250" font-size="17" fill="#626962">A stuck task can keep shutdown waiting indefinitely.</text></svg>
