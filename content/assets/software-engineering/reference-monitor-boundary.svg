<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1008" viewBox="0 0 720 1008" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Mediate every protected access</title><desc id="desc">Interactive reads and export requests both enter one logical enforcement boundary. The mechanism uses authenticated subject identity, requested operation, trusted object metadata, and current policy. Only an allowed operation reaches the report store; a denial returns no report. The store has no direct caller access within the declared boundary.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="1008" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Every protected access crosses the boundary</text><text x="24" y="78" font-size="19" fill="#626962">Declared scope: report bodies.</text><rect x="24" y="272" width="672" height="552" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="310" font-size="24" fill="#252c28">Enforcement boundary</text><text x="40" y="350" font-size="19" fill="#626962">Subjects cannot directly access the store.</text><rect x="24" y="112" width="208" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="22" fill="#252c28">Read route</text><text x="40" y="188" font-size="18" fill="#626962">alice / read / R1</text><rect x="488" y="112" width="208" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="504" y="148" font-size="22" fill="#252c28">Export route</text><text x="504" y="188" font-size="18" fill="#626962">auditor / export / R1</text><path d="M128 208V244H420V364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M592 208V244H560V364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="48" y="368" width="248" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="408" font-size="22" fill="#252c28">Policy + metadata</text><text x="64" y="452" font-size="18" fill="#252c28">Current policy version</text><text x="64" y="492" font-size="18" fill="#626962">Trusted object tenant</text><path d="M300 444H344" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="304" y="428" font-size="17" fill="#626962">facts</text><rect x="348" y="368" width="324" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="364" y="408" font-size="22" fill="#252c28">Access validation</text><text x="364" y="452" font-size="19" fill="#252c28">subject / action / object</text><text x="364" y="492" font-size="19" fill="#626962">Explicit permit required</text><path d="M510 512V576" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="534" y="554" font-size="18" fill="#626962">allow operation</text><rect x="48" y="580" width="624" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="620" font-size="23" fill="#252c28">Report bodies</text><text x="64" y="664" font-size="21" fill="#252c28">R1: A totals</text><text x="384" y="664" font-size="21" fill="#252c28">R2: B totals</text><text x="48" y="746" font-size="22" fill="#252c28">Denied request: no body-store read.</text><text x="48" y="790" font-size="19" fill="#626962">No caller credentials bypass this declared boundary.</text><rect x="24" y="876" width="208" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="912" font-size="21" fill="#252c28">Complete</text><text x="40" y="950" font-size="21" fill="#252c28">mediation</text><rect x="256" y="876" width="208" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="272" y="912" font-size="21" fill="#252c28">Protected</text><text x="272" y="950" font-size="21" fill="#252c28">enforcement</text><rect x="488" y="876" width="208" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="504" y="912" font-size="21" fill="#252c28">Analyzable</text><text x="504" y="950" font-size="21" fill="#252c28">mechanism</text></svg>
