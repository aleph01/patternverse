<svg xmlns="http://www.w3.org/2000/svg" width="360" height="802" viewBox="0 0 360 802" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Startup registration and a sealed execution registry</title><desc id="desc">During configuration, the core checks each extension’s declared API version and unique identity before registration. The first string input seals the registry. Requests then execute against that fixed set; later registration is rejected.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="802" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Register first,</text><text x="24" y="60" font-size="22" fill="#252c28">then fix the configured set</text><rect x="24" y="110" width="312" height="132" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="146" font-size="22" fill="#252c28">Configuring</text><text x="40" y="182" font-size="17" fill="#252c28">API v1 · unique identity</text><text x="40" y="212" font-size="17" fill="#252c28">Register trusted extensions</text><path d="M180 242V330" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="280" font-size="17" fill="#252c28">First string</text><text x="196" y="304" font-size="17" fill="#252c28">input</text><rect x="24" y="332" width="312" height="132" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="368" font-size="22" fill="#252c28">Sealed</text><text x="40" y="404" font-size="17" fill="#252c28">Same configured extensions</text><text x="40" y="434" font-size="17" fill="#252c28">Dispatch in registration order</text><path d="M180 464V552" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="516" font-size="17" fill="#252c28">register</text><rect x="24" y="554" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="583" font-size="20" fill="#252c28">Registration rejected</text><text x="40" y="609" font-size="17" fill="#626962">Registry stays sealed</text><text x="24" y="682" font-size="18" fill="#252c28">Requests can still run.</text><text x="24" y="714" font-size="17" fill="#626962">New extensions need a new instance.</text><text x="24" y="772" font-size="17" fill="#626962">No live unloading or isolation.</text></svg>
