<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1336" viewBox="0 0 360 1336" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Scoped Locking: acquisition and all structured exits</title><desc id="desc">After lock acquisition succeeds, control enters the protected body. Normal completion, an early return, or an exception all reach the same scope-exit release. Only after that release does the caller continue, receive the return value, or observe the exception. Failed acquisition does not enter the protected body.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1336" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Scope owns the release</text><rect x="24" y="112" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">Acquire the shared lock</text><text x="40" y="167" font-size="16" fill="#626962">Enter only after acquisition succeeds.</text><path d="M180 240V334" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="336" width="312" height="152" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="365" font-size="18" fill="#252c28">Protected body</text><text x="40" y="391" font-size="16" fill="#626962">Check and update the shared invariant.</text><path d="M180 488V606" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="608" width="312" height="200" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="640" font-size="20" fill="#252c28">Any structured exit</text><text x="40" y="684" font-size="18" fill="#252c28">Normal completion</text><text x="40" y="728" font-size="18" fill="#252c28">Early return</text><text x="40" y="772" font-size="18" fill="#252c28">Propagating exception</text><path d="M180 808V910" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="912" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="941" font-size="18" fill="#252c28">Scope cleanup releases once</text><text x="40" y="967" font-size="16" fill="#626962">Only this acquisition is being released.</text><text x="24" y="1132" font-size="16" fill="#626962">Then the caller continues, gets a value,</text><text x="24" y="1166" font-size="16" fill="#626962">or observes the exception.</text><text x="24" y="1234" font-size="17" fill="#252c28">Failed entry never runs the body.</text><text x="24" y="1290" font-size="16" fill="#626962">Arrows: control flow, not data rollback.</text></svg>
