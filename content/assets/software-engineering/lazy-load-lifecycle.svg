<svg xmlns="http://www.w3.org/2000/svg" width="720" height="848" viewBox="0 0 720 848" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Deferred access has explicit failure and lifetime policies</title><desc id="desc">An unloaded document attempts a body read. Success stores the value and releases the callback; failure propagates while the body remains unloaded. After the reader closes, unloaded access is rejected before SQL, while an already-loaded body remains readable from memory.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="848" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Failure and reader exit do not mean loaded</text><rect x="24" y="84" width="672" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">Unloaded body: attempt read</text><text x="40" y="139" font-size="17" fill="#626962">Requires an active reader and usable connection.</text><rect x="24" y="288" width="312" height="140" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="317" font-size="20" fill="#252c28">Success</text><text x="40" y="343" font-size="17" fill="#626962">Store body; release callback.</text><text x="40" y="392" font-size="17" fill="#626962">Later reads use memory.</text><path d="M180 172V286" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="230" font-size="17" fill="#626962">success</text><rect x="384" y="288" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="317" font-size="20" fill="#252c28">Read fails</text><text x="400" y="343" font-size="17" fill="#626962">Propagate the error.</text><text x="400" y="392" font-size="17" fill="#626962">Keep UNLOADED and loader.</text><path d="M540 172V286" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="230" font-size="17" fill="#626962">failure</text><rect x="24" y="528" width="672" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="557" font-size="20" fill="#252c28">Reader exits</text><text x="40" y="583" font-size="17" fill="#626962">No new body lookups allowed.</text><path d="M180 428V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 428V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="704" width="312" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="733" font-size="20" fill="#252c28">Previously loaded</text><text x="40" y="759" font-size="17" fill="#626962">Body readable; no SQL.</text><path d="M180 616V702" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="384" y="704" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="733" font-size="20" fill="#252c28">Still unloaded</text><text x="400" y="759" font-size="17" fill="#626962">Read rejected before SQL.</text><path d="M540 616V702" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/></svg>
