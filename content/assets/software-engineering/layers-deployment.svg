<svg xmlns="http://www.w3.org/2000/svg" width="720" height="498" viewBox="0 0 720 498" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Logical layers and physical deployment tiers</title><desc id="desc">One deployment contains presentation, business logic, and price access in one process. A second deployment keeps presentation and business together but places price access in a separate service, requiring a network protocol.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="498" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Layers do not determine deployment</text><text x="24" y="82" font-size="22" fill="#252c28">One process</text><text x="396" y="82" font-size="22" fill="#252c28">Two tiers</text><rect x="24" y="100" width="300" height="292" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="396" y="100" width="300" height="196" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="44" y="122" width="260" height="54" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="151" font-size="20" fill="#252c28">Presentation</text><rect x="44" y="218" width="260" height="54" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="247" font-size="20" fill="#252c28">Business logic</text><rect x="44" y="314" width="260" height="54" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="343" font-size="20" fill="#252c28">Price access</text><path d="M174 176V216" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M174 272V312" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="416" y="122" width="260" height="54" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="432" y="151" font-size="20" fill="#252c28">Presentation</text><rect x="416" y="218" width="260" height="54" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="432" y="247" font-size="20" fill="#252c28">Business logic</text><path d="M546 176V216" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M546 272V366" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="564" y="333" font-size="17" fill="#252c28">Network call</text><rect x="396" y="368" width="300" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="412" y="397" font-size="20" fill="#252c28">Price-access service</text><text x="412" y="423" font-size="17" fill="#626962">Separate process</text><text x="24" y="435" font-size="17" fill="#626962">All calls stay inside the process.</text><text x="396" y="478" font-size="17" fill="#626962">New protocol and failure modes.</text></svg>
