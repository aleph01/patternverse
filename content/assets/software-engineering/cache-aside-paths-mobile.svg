<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1664" viewBox="0 0 360 1664" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Three application-owned paths</title><desc id="desc">Application code checks the cache first. A usable hit returns without reading the store. A miss or expired entry causes a store read and cache fill before returning. A separate write path commits the source update and then invalidates the cached key.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1664" fill="#fff"/><text x="24" y="34" font-size="21" fill="#252c28">Three application-owned paths</text><text x="24" y="78" font-size="17" fill="#626962">Arrows mean next operation.</text><text x="24" y="136" font-size="22" fill="#252c28">Usable hit</text><text x="24" y="172" font-size="17" fill="#626962">No source read</text><rect x="24" y="200" width="312" height="92" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="232" font-size="20" fill="#252c28">1. Check cache</text><text x="40" y="268" font-size="17" fill="#626962">Key matches; entry valid</text><path d="M180 292V322" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="324" width="312" height="92" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="356" font-size="20" fill="#252c28">2. Return cached value</text><text x="40" y="392" font-size="17" fill="#626962">Source is untouched</text><text x="24" y="500" font-size="22" fill="#252c28">Miss / expired</text><text x="24" y="536" font-size="17" fill="#626962">Load on demand</text><rect x="24" y="564" width="312" height="92" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="596" font-size="20" fill="#252c28">1. Check cache</text><text x="40" y="632" font-size="17" fill="#626962">No usable entry</text><path d="M180 656V686" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="688" width="312" height="92" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="720" font-size="20" fill="#252c28">2. Read source</text><text x="40" y="756" font-size="17" fill="#626962">Authoritative value</text><path d="M180 780V810" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="812" width="312" height="92" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="844" font-size="20" fill="#252c28">3. Fill cache</text><text x="40" y="880" font-size="17" fill="#626962">Value + expiration</text><path d="M180 904V934" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="936" width="312" height="92" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="968" font-size="20" fill="#252c28">4. Return loaded value</text><text x="40" y="1004" font-size="17" fill="#626962">Caller receives result</text><text x="24" y="1112" font-size="22" fill="#252c28">Application write</text><text x="24" y="1148" font-size="17" fill="#626962">Source first</text><rect x="24" y="1176" width="312" height="92" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1208" font-size="20" fill="#252c28">1. Commit source</text><text x="40" y="1244" font-size="17" fill="#626962">Write succeeds</text><path d="M180 1268V1298" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="1300" width="312" height="92" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1332" font-size="20" fill="#252c28">2. Invalidate cache</text><text x="40" y="1368" font-size="17" fill="#626962">Delete affected key</text><path d="M180 1392V1422" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="1424" width="312" height="92" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1456" font-size="20" fill="#252c28">3. Later read</text><text x="40" y="1492" font-size="17" fill="#626962">Reload on a miss</text><text x="24" y="1588" font-size="18" fill="#252c28">Cache data is disposable.</text><text x="24" y="1624" font-size="17" fill="#626962">These steps are not one transaction.</text></svg>
