<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">CQRS: separate command and query models</title><desc id="desc">A Book Seats command goes through a SeatPool model that checks capacity and changes booked seats. An Availability query uses SQL to return an immutable title, remaining count, status, and observed version. Both paths access one shows table; the query does not load the command model or perform booking.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="960" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Different responsibilities, one shared store</text><rect x="24" y="112" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Book Seats command</text><text x="40" y="167" font-size="17" fill="#626962">SHOW-7 / quantity: 2</text><rect x="384" y="112" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="141" font-size="20" fill="#252c28">Availability query</text><text x="400" y="167" font-size="17" fill="#626962">SHOW-7</text><path d="M180 212V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 212V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="304" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="333" font-size="20" fill="#252c28">Command model: SeatPool</text><text x="40" y="359" font-size="17" fill="#626962">Capacity / booked / booking rule</text><text x="40" y="420" font-size="16" fill="#626962">Validate latest state in transaction.</text><rect x="384" y="304" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="333" font-size="20" fill="#252c28">Query model: Availability</text><text x="400" y="359" font-size="17" fill="#626962">Title / remaining / status / version</text><text x="400" y="420" font-size="17" fill="#626962">SQL builds an immutable DTO.</text><path d="M180 480V606" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="548" font-size="17" fill="#626962">read + write</text><path d="M540 480V606" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="548" font-size="17" fill="#626962">SELECT</text><rect x="24" y="608" width="672" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="637" font-size="20" fill="#252c28">One shows table in SQLite</text><text x="40" y="663" font-size="17" fill="#626962">Command updates booked and version; query derives display fields.</text><text x="40" y="732" font-size="17" fill="#626962">Both models belong to one owner. No event log or separate read database.</text><text x="24" y="864" font-size="18" fill="#252c28">Arrows are calls. Queries do not invoke the booking model.</text><text x="24" y="904" font-size="18" fill="#626962">The two paths share storage, rather than one overloaded conceptual model.</text></svg>
