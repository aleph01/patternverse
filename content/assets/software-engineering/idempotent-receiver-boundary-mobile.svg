<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1256" viewBox="0 0 360 1256" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Idempotent Receiver: atomic effect and acknowledgment</title><desc id="desc">Before database commit, a failed stock constraint rolls back both the processed-message row and stock change, so retry remains possible. After commit, losing acknowledgment leaves both records durable, so redelivery is a duplicate. An external email or remote API call sits outside this database boundary and has no protection from this transaction.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1256" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">One atomic database boundary</text><rect x="24" y="112" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">One SQLite transaction</text><text x="40" y="167" font-size="17" fill="#626962">Processed key + payload</text><text x="40" y="216" font-size="18" fill="#626962">Inventory change</text><text x="40" y="256" font-size="17" fill="#626962">Commit both or roll back both.</text><path d="M180 288V330H12V476H46" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M12 476V756H46" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="48" y="384" width="288" height="184" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="413" font-size="20" fill="#252c28">Before commit: failure</text><text x="64" y="439" font-size="17" fill="#626962">Roll back marker and update.</text><text x="64" y="500" font-size="16" fill="#626962">No completed receipt recorded.</text><text x="64" y="540" font-size="18" fill="#626962">Retry can still apply.</text><rect x="48" y="664" width="288" height="184" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="64" y="693" font-size="20" fill="#252c28">After commit: ack lost</text><text x="64" y="719" font-size="17" fill="#626962">Both database changes survive.</text><text x="64" y="780" font-size="18" fill="#626962">Redelivery is a duplicate.</text><text x="64" y="820" font-size="17" fill="#626962">No additional stock change.</text><rect x="24" y="952" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="981" font-size="18" fill="#252c28">Outside this boundary</text><text x="40" y="1007" font-size="16" fill="#626962">Broker acknowledgment follows commit.</text><text x="40" y="1062" font-size="17" fill="#626962">Email and remote API effects</text><text x="40" y="1100" font-size="17" fill="#626962">need their own protection.</text><text x="24" y="1200" font-size="16" fill="#626962">Branches: alternative failure points.</text></svg>
