<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1112" viewBox="0 0 360 1112" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Data Mapper translates object and row representations</title><desc id="desc">An Appointment contains a TimeSlot with start minute 540 and end minute 570. AppointmentMapper translates that object into an appointments row with appointment_key A-7, begin_minute 540, and duration_minutes 30. On loading, the mapper reconstructs the end as start plus duration. The model has no dependency on the mapper or SQL.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1112" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Different representations,</text><text x="24" y="60" font-size="22" fill="#252c28">one appointment</text><rect x="24" y="104" width="312" height="220" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="140" font-size="22" fill="#252c28">Appointment</text><text x="40" y="176" font-size="18" fill="#252c28">id: A-7</text><rect x="44" y="200" width="272" height="100" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="234" font-size="20" fill="#252c28">TimeSlot</text><text x="60" y="274" font-size="18" fill="#252c28">start: 540 · end: 570</text><rect x="24" y="432" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="468" font-size="22" fill="#252c28">AppointmentMapper</text><text x="40" y="510" font-size="18" fill="#252c28">Write: end − start</text><text x="40" y="548" font-size="18" fill="#252c28">Read: start + duration</text><text x="40" y="584" font-size="17" fill="#626962">Duration: 30 whole minutes</text><rect x="24" y="724" width="312" height="200" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="760" font-size="22" fill="#252c28">appointments row</text><text x="40" y="802" font-size="17" fill="#252c28">appointment_key: A-7</text><text x="40" y="844" font-size="17" fill="#252c28">begin_minute: 540</text><text x="40" y="886" font-size="17" fill="#252c28">duration_minutes: 30</text><path d="M180 324V430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 608V722" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M24 824H12V536H22" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><path d="M24 476H12V214H22" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="24" y="1000" font-size="18" fill="#252c28">Solid: write · dashed: read</text><text x="24" y="1040" font-size="17" fill="#626962">Model imports no mapper or SQL.</text><text x="24" y="1076" font-size="17" fill="#626962">All times: minutes after midnight.</text></svg>
