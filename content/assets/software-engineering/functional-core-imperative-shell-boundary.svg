<svg xmlns="http://www.w3.org/2000/svg" width="720" height="552" viewBox="0 0 720 552" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Pure computation between external effects</title><desc id="desc">An imperative shell reads inventory from a CSV file and converts it to immutable item values. A functional core returns replenishment proposals. The shell writes those proposals to a CSV file; the core receives no file handle.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="552" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Observe → decide → act</text><rect x="24" y="108" width="672" height="344" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="146" font-size="21" fill="#252c28">Imperative shell · owns I/O and resource lifetime</text><rect x="44" y="238" width="180" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="267" font-size="20" fill="#252c28">1 · Read</text><text x="60" y="293" font-size="17" fill="#626962">stock.csv</text><rect x="268" y="224" width="184" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="284" y="253" font-size="20" fill="#252c28">2 · Pure core</text><text x="284" y="279" font-size="17" fill="#626962">plan_reorders</text><rect x="496" y="238" width="180" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="512" y="267" font-size="20" fill="#252c28">3 · Write</text><text x="512" y="293" font-size="17" fill="#626962">proposals.csv</text><path d="M224 276H266" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M452 276H494" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="208" y="204" font-size="17" fill="#252c28">Item values</text><text x="458" y="204" font-size="17" fill="#252c28">Proposals</text><text x="44" y="382" font-size="17" fill="#626962">The core receives values, never a file handle or database client.</text><text x="44" y="418" font-size="18" fill="#252c28">Only the shell reads, writes, and closes files.</text><text x="24" y="510" font-size="18" fill="#252c28">Arrows carry values. A returned proposal has not been executed.</text></svg>
