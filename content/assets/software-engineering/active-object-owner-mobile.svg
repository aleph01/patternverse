<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1256" viewBox="0 0 360 1256" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Active Object ownership and collaboration</title><desc id="desc">Clients invoke the stock proxy, which creates requests containing an immutable quantity change and a future. A bounded activation queue passes requests to one worker scheduler. Only that worker accesses the stock quantity and resolves each future with a result or error.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1256" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Invoke here; execute there</text><rect x="24" y="112" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">Caller thread / stock proxy</text><text x="40" y="167" font-size="16" fill="#626962">Captures (delta, future).</text><text x="40" y="222" font-size="16" fill="#626962">Returns the future to its caller.</text><path d="M180 256V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="294" font-size="16" fill="#626962">enqueue</text><rect x="24" y="320" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="349" font-size="18" fill="#252c28">Activation queue / FIFO</text><text x="40" y="375" font-size="16" fill="#626962">At most two requests wait here.</text><path d="M180 448V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="494" font-size="16" fill="#626962">dequeue</text><rect x="24" y="528" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="557" font-size="18" fill="#252c28">Owner thread / scheduler</text><text x="40" y="583" font-size="16" fill="#626962">Selects the next method request.</text><path d="M180 656V734" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="702" font-size="16" fill="#626962">execute</text><rect x="24" y="736" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="765" font-size="18" fill="#252c28">Servant state: quantity</text><text x="40" y="791" font-size="16" fill="#626962">Only the worker checks and updates.</text><path d="M180 864V942" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="910" font-size="16" fill="#626962">resolve</text><rect x="24" y="944" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="973" font-size="18" fill="#252c28">Future receives result or error</text><text x="40" y="999" font-size="16" fill="#626962">Integer result exposes no mutable state.</text><text x="40" y="1054" font-size="16" fill="#626962">Caller chooses when to wait.</text><text x="24" y="1172" font-size="15" fill="#626962">Arrows: request, execution, result flow.</text><text x="24" y="1210" font-size="15" fill="#626962">The caller never mutates quantity directly.</text></svg>
