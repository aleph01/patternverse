<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Current policy on every access</title><desc id="desc">Under policy version 1, Alice’s read of tenant A report R1 is allowed. A serialized revocation installs version 2; Alice’s next read is denied. An unavailable policy state at version 3 denies the auditor’s otherwise permitted export. An earlier returned copy of A totals is not recalled.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="960" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Revocation orders later accesses</text><text x="24" y="78" font-size="19" fill="#626962">Policy versions identify state.</text><rect x="24" y="112" width="672" height="224" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="150" font-size="23" fill="#252c28">P1 / policy available</text><text x="40" y="194" font-size="21" fill="#252c28">alice / read R1: A totals</text><text x="40" y="228" font-size="21" fill="#252c28">auditor / export R1: A totals</text><text x="40" y="262" font-size="21" fill="#252c28">alice / export R1: denied</text><text x="40" y="296" font-size="21" fill="#252c28">alice / read R2: denied</text><path d="M72 336V412" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="382" font-size="19" fill="#626962">Revoke under lock</text><rect x="24" y="416" width="672" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="454" font-size="23" fill="#252c28">P2 / alice read revoked</text><text x="40" y="504" font-size="21" fill="#252c28">alice / read R1: denied</text><text x="40" y="548" font-size="19" fill="#626962">Earlier returned A totals remains with the caller.</text><path d="M72 576V652" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="622" font-size="19" fill="#626962">Policy unavailable</text><rect x="24" y="656" width="672" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="694" font-size="23" fill="#252c28">P3 / policy unavailable</text><text x="40" y="744" font-size="21" fill="#252c28">auditor / export R1: denied</text><text x="40" y="788" font-size="19" fill="#626962">No permissive fallback.</text><text x="24" y="872" font-size="22" fill="#252c28">Revocation governs later accesses.</text><text x="24" y="914" font-size="19" fill="#626962">Information already returned cannot be recalled.</text></svg>
