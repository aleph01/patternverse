<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1176" viewBox="0 0 720 1176" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Monitor Object wait and notification</title><desc id="desc">A consumer finds an empty inbox, waits, and releases the lock. A producer acquires it, inserts one item, and notifies while retaining the lock. Only after the producer releases can the consumer reacquire. The consumer rechecks the predicate before removing an item, or waits again if it is still false.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1176" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Notification does not transfer the monitor lock</text><rect x="24" y="112" width="144" height="128" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="19" fill="#252c28">Consumer</text><text x="40" y="190" font-size="16" fill="#626962">owns lock</text><rect x="208" y="112" width="488" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="224" y="141" font-size="18" fill="#252c28">Find the inbox empty</text><text x="224" y="167" font-size="16" fill="#626962">get cannot remove data; it must wait for the predicate.</text><path d="M96 240V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="304" width="144" height="128" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="340" font-size="19" fill="#252c28">Released</text><text x="40" y="382" font-size="16" fill="#626962">caller waits</text><rect x="208" y="304" width="488" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="224" y="333" font-size="18" fill="#252c28">Condition.wait releases the lock</text><text x="224" y="359" font-size="16" fill="#626962">The suspended invocation does not block protected access.</text><path d="M96 432V494" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="496" width="144" height="128" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="532" font-size="19" fill="#252c28">Producer</text><text x="40" y="574" font-size="16" fill="#626962">owns lock</text><rect x="208" y="496" width="488" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="224" y="525" font-size="18" fill="#252c28">Insert one item and notify</text><text x="224" y="551" font-size="16" fill="#626962">Notification does not release the monitor lock.</text><path d="M96 624V686" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="688" width="144" height="128" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="724" font-size="19" fill="#252c28">Released</text><text x="40" y="766" font-size="16" fill="#626962">method exits</text><rect x="208" y="688" width="488" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="224" y="717" font-size="18" fill="#252c28">Producer returns and releases the lock</text><text x="224" y="743" font-size="16" fill="#626962">Notified callers can now compete to reacquire it.</text><path d="M96 816V878" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="880" width="144" height="128" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="916" font-size="19" fill="#252c28">Consumer</text><text x="40" y="958" font-size="16" fill="#626962">owns lock</text><rect x="208" y="880" width="488" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="224" y="909" font-size="18" fill="#252c28">Reacquire, then check the predicate</text><text x="224" y="935" font-size="16" fill="#626962">Remove only if data exists; otherwise wait again.</text><text x="24" y="1090" font-size="18" fill="#626962">Arrows: an explanatory trace, not a fairness or handoff guarantee.</text><text x="24" y="1130" font-size="17" fill="#626962">Recheck in a while loop: notification alone does not prove the predicate.</text></svg>
