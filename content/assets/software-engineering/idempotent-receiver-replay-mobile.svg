<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1096" viewBox="0 0 360 1096" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Idempotent Receiver: stable receipt identity</title><desc id="desc">Warehouse event E901 adds 40 mug units and records its processed identity in the same database transaction. The acknowledgment is lost. Redelivery with the same consumer, source, event ID, SKU, and quantity finds the committed record and leaves stock at 40. A distinct event E902 can legitimately add another 40.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1096" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Repeat delivery, preserve intent</text><text x="24" y="86" font-size="17" fill="#626962">stock-receipts / warehouse-a</text><rect x="24" y="144" width="312" height="208" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="173" font-size="20" fill="#252c28">E901: MUG / 40 units</text><text x="40" y="199" font-size="17" fill="#626962">Record E901 + stock 0 → 40</text><text x="40" y="268" font-size="18" fill="#626962">One database commit</text><text x="40" y="314" font-size="17" fill="#626962">applied; acknowledgment lost</text><path d="M180 352V442" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="404" font-size="17" fill="#626962">redelivery</text><rect x="24" y="444" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="473" font-size="20" fill="#252c28">E901: same payload</text><text x="40" y="499" font-size="17" fill="#626962">Record exists; no second add.</text><text x="40" y="554" font-size="18" fill="#626962">Return: duplicate</text><text x="40" y="594" font-size="18" fill="#626962">Stock: 40 units</text><rect x="24" y="736" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="765" font-size="20" fill="#252c28">E902: distinct receipt</text><text x="40" y="791" font-size="17" fill="#626962">Same MUG / 40 units</text><text x="40" y="846" font-size="18" fill="#626962">One commit: stock 40 → 80</text><text x="40" y="886" font-size="18" fill="#626962">Return: applied</text><text x="24" y="996" font-size="18" fill="#252c28">Identity distinguishes intent.</text><text x="24" y="1040" font-size="17" fill="#626962">Equal contents can be new work.</text></svg>
