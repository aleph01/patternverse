<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Parameterized Test</title><desc id="desc">Named rows containing a weight and expected fee feed the same test operation. Each row gets its own comparison and diagnostic identity. A boundary failure points to its case name rather than an anonymous loop iteration.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="800" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Parameterized Test</text><text x="24" y="80" font-size="19" fill="#626962">Execution boundaries and evidence</text><rect x="24" y="112" width="672" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="22" fill="#252c28">Named case data</text><text x="40" y="188" font-size="20" fill="#252c28">Inputs + independent expectations</text><text x="40" y="224" font-size="18" fill="#626962">Boundary names explain failures</text><path d="M72 232V280" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="266" font-size="17" fill="#626962">For each named case</text><rect x="24" y="284" width="672" height="120" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="320" font-size="22" fill="#252c28">Fresh invocation state</text><text x="40" y="360" font-size="20" fill="#252c28">Arrange and run the same test shape</text><text x="40" y="396" font-size="18" fill="#626962">Do not share mutable state by accident</text><path d="M72 404V452" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="438" font-size="17" fill="#626962">Assert this outcome</text><rect x="24" y="456" width="672" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="492" font-size="22" fill="#252c28">Compare this row</text><text x="40" y="532" font-size="20" fill="#252c28">Actual value versus expected value</text><text x="40" y="568" font-size="18" fill="#626962">Same production formula is no oracle</text><path d="M72 576V624" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="610" font-size="17" fill="#626962">Report this case</text><rect x="24" y="628" width="672" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="664" font-size="22" fill="#252c28">Identify the result</text><text x="40" y="704" font-size="20" fill="#252c28">Report case name and parameters</text><text x="40" y="740" font-size="18" fill="#626962">Subtests are not separate methods</text></svg>
