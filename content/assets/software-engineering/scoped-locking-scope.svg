<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1216" viewBox="0 0 720 1216" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Scoped Locking: acquisition and all structured exits</title><desc id="desc">After lock acquisition succeeds, control enters the protected body. Normal completion, an early return, or an exception all reach the same scope-exit release. Only after that release does the caller continue, receive the return value, or observe the exception. Failed acquisition does not enter the protected body.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1216" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Acquire once; release on structured scope exit</text><rect x="24" y="112" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Acquire the shared lock</text><text x="40" y="167" font-size="17" fill="#626962">The protected body starts only after acquisition succeeds.</text><path d="M360 224V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="320" width="672" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="349" font-size="20" fill="#252c28">Protected body: one complete critical section</text><text x="40" y="375" font-size="17" fill="#626962">State-dependent checks and updates use the same shared lock.</text><path d="M360 464V512H128V590" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 512V590" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 512H592V590" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="592" width="208" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="621" font-size="18" fill="#252c28">Normal completion</text><text x="40" y="647" font-size="16" fill="#626962">Fall through</text><rect x="256" y="592" width="208" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="272" y="621" font-size="18" fill="#252c28">Early return</text><text x="272" y="647" font-size="16" fill="#626962">Return a value</text><rect x="488" y="592" width="208" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="504" y="621" font-size="18" fill="#252c28">Exception</text><text x="504" y="647" font-size="16" fill="#626962">Propagate error</text><path d="M128 736V846" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 736V846" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M592 736V846" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="848" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="877" font-size="20" fill="#252c28">One shared cleanup boundary releases this acquisition</text><text x="40" y="903" font-size="17" fill="#626962">One selected exit path, one release; cleanup does not undo changed data.</text><path d="M360 992V1070" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="1118" font-size="21" fill="#252c28">Continue, deliver the return value, or propagate the exception.</text><text x="24" y="1170" font-size="17" fill="#626962">Arrows: control flow after successful entry. Process termination is excluded.</text></svg>
