<svg xmlns="http://www.w3.org/2000/svg" width="720" height="906" viewBox="0 0 720 906" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Data Mapper leaves transaction ownership with the caller</title><desc id="desc">The caller constructs a replacement Appointment and explicitly asks the mapper to update it. The mapper writes a provisional row change inside a caller-owned transaction. Caller commit makes it durable, while rollback discards it. Neither mapping nor object replacement automatically saves the appointment.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="906" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Mapping writes; the caller decides the outcome</text><rect x="24" y="84" width="672" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">New Appointment A-7</text><text x="40" y="139" font-size="17" fill="#626962">TimeSlot: 600–645 whole minutes</text><path d="M360 172V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="248" width="672" height="520" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="44" y="284" font-size="22" fill="#252c28">Caller-owned transaction</text><rect x="44" y="316" width="632" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="345" font-size="20" fill="#252c28">AppointmentMapper.update</text><text x="60" y="371" font-size="17" fill="#626962">Write begin_minute = 600 and duration_minutes = 45</text><rect x="44" y="452" width="632" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="481" font-size="20" fill="#252c28">Provisional row change</text><text x="60" y="507" font-size="17" fill="#626962">Uncommitted until the caller decides</text><path d="M360 404V450" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="44" y="640" width="292" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="669" font-size="20" fill="#252c28">COMMIT</text><text x="60" y="695" font-size="17" fill="#626962">Keep changed row</text><rect x="384" y="640" width="292" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="669" font-size="20" fill="#252c28">ROLLBACK</text><text x="400" y="695" font-size="17" fill="#626962">Restore previous row</text><path d="M360 540V582H190V638" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 582H530V638" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="24" y="832" font-size="18" fill="#252c28">Replacing the object alone performs no I/O.</text><text x="24" y="870" font-size="17" fill="#626962">Old TimeSlot stays [540, 570); reloading reads the stored outcome.</text></svg>
