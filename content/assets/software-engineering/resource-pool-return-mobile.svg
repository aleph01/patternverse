<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1424" viewBox="0 0 360 1424" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Resource Pool: reset before reuse</title><desc id="desc">A borrow owns a buffer until its scope ends, including on a job exception. Scope exit invalidates the old handle and resets all eight bytes before publishing the buffer as idle. If the pool has closed, the returned buffer is dropped instead. The next borrow receives a new handle; the old handle remains invalid.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1424" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">End the borrow before reuse</text><rect x="24" y="112" width="312" height="136" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">1 / scope ends</text><text x="40" y="167" font-size="16" fill="#626962">Normal return or a job exception.</text><path d="M180 248V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="320" width="312" height="136" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="349" font-size="18" fill="#252c28">2 / invalidate old handle</text><text x="40" y="375" font-size="16" fill="#626962">Public read/write now reject it.</text><path d="M180 456V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="528" width="312" height="136" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="557" font-size="18" fill="#252c28">3 / zero all eight bytes</text><text x="40" y="583" font-size="16" fill="#626962">Buffer stays unavailable during reset.</text><path d="M180 664V734" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="736" width="312" height="136" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="765" font-size="18" fill="#252c28">4 / if open, make it idle</text><text x="40" y="791" font-size="16" fill="#626962">Next borrow gets a fresh handle.</text><rect x="24" y="1024" width="312" height="232" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1056" font-size="20" fill="#252c28">If the pool has closed</text><text x="40" y="1100" font-size="15" fill="#626962">Reset the returning buffer, then drop it.</text><text x="40" y="1144" font-size="16" fill="#626962">Never put it back into circulation.</text><text x="40" y="1188" font-size="16" fill="#626962">Active borrows can finish their scope.</text><text x="40" y="1232" font-size="15" fill="#626962">No new borrows; waiters wake and fail.</text><text x="24" y="1332" font-size="16" fill="#626962">Arrows: cleanup order before reuse.</text><text x="24" y="1376" font-size="16" fill="#626962">An old handle never becomes valid again.</text></svg>
