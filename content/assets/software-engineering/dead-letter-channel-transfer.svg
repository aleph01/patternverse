<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1024" viewBox="0 0 720 1024" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Dead Letter Channel: safe local handoff</title><desc id="desc">One local SQLite transaction inserts the complete failure record and deletes the pending record. Commit leaves the instruction in the dead letter channel. A full destination or an error before commit leaves the source instruction intact. Broker acknowledgments and remote processing effects are outside this database simulation.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1024" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Keep source ownership until transfer is safe</text><rect x="24" y="112" width="672" height="192" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="150" font-size="22" fill="#252c28">One local SQLite transaction</text><text x="40" y="202" font-size="18" fill="#626962">1. Insert complete failure record</text><text x="400" y="202" font-size="18" fill="#626962">2. Delete pending row</text><text x="40" y="252" font-size="19" fill="#626962">Preserve receipt ID, event ID, bytes, timing, and failure context.</text><path d="M360 304V352H180V414" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 352H540V414" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="416" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="445" font-size="20" fill="#252c28">Destination accepts</text><text x="40" y="471" font-size="17" fill="#626962">Commit: pending 0 / dead 1</text><text x="40" y="536" font-size="18" fill="#626962">E901 remains recoverable.</text><rect x="384" y="416" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="445" font-size="20" fill="#252c28">Full channel or write error</text><text x="400" y="471" font-size="17" fill="#626962">Rollback: pending row retained</text><text x="400" y="536" font-size="17" fill="#626962">No silent deletion; raise failure.</text><rect x="24" y="704" width="672" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="733" font-size="18" fill="#252c28">Outside this simulation: broker-to-store transfer</text><text x="40" y="759" font-size="16" fill="#626962">A real remote handoff needs its own documented safety contract.</text><text x="40" y="824" font-size="20" fill="#626962">Moving a message cannot undo an earlier business effect.</text><text x="24" y="968" font-size="17" fill="#252c28">Arrows: alternative outcomes of one local transaction, not broker guarantees.</text></svg>
