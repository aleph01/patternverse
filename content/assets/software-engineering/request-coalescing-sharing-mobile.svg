<svg xmlns="http://www.w3.org/2000/svg" width="360" height="920" viewBox="0 0 360 920" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Equivalent reads share active work</title><desc id="desc">Callers A, B, and C use the same complete price-read key and join one active loader. The loader produces 1200 USD cents, which can satisfy each still-waiting caller. A different key starts separate work. The registry tracks active work rather than retained price values.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="920" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Share one active price read</text><text x="24" y="78" font-size="17" fill="#626962">Scope: one coalescer instance.</text><rect x="24" y="112" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="22" fill="#252c28">Callers A / B / C</text><text x="40" y="184" font-size="20" fill="#252c28">All request key K</text><text x="40" y="216" font-size="17" fill="#626962">Equivalent authorized price reads</text><path d="M180 232V292" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="204" y="270" font-size="17" fill="#626962">join K</text><rect x="24" y="296" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="334" font-size="22" fill="#252c28">Flight K → task 1</text><text x="40" y="376" font-size="19" fill="#252c28">tenant-A / SKU-7</text><text x="40" y="414" font-size="19" fill="#252c28">USD / price version 3</text><text x="40" y="452" font-size="17" fill="#626962">Caller waits remain separate.</text><path d="M96 472V532" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="112" y="512" font-size="17" fill="#626962">start</text><path d="M300 536V476" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="212" y="512" font-size="17" fill="#626962">result</text><rect x="24" y="536" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="574" font-size="22" fill="#252c28">One price loader</text><text x="40" y="616" font-size="22" fill="#252c28">1200 USD cents</text><text x="40" y="648" font-size="17" fill="#626962">One execution for matching keys</text><rect x="24" y="712" width="312" height="168" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="748" font-size="18" fill="#252c28">Result shared with waiting callers.</text><text x="40" y="792" font-size="17" fill="#626962">Different key → separate work.</text><text x="40" y="834" font-size="19" fill="#252c28">Retire completed flights.</text><text x="40" y="864" font-size="17" fill="#626962">No completed-price cache here.</text></svg>
