<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1240" viewBox="0 0 360 1240" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Proactor request lifetime and cancellation</title><desc id="desc">A and B occupy two request slots. B finishes first, but its queued completion still retains a slot. Cancellation is requested for A without freeing its context. The backend reports A successful with three bytes. Dispatch consumes B and A's actual outcomes and releases their request slots.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1240" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Cancel is not complete</text><rect x="24" y="112" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">A and B request up to 8 bytes</text><text x="40" y="167" font-size="16" fill="#626962">Two retained request slots.</text><path d="M180 240V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="304" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="333" font-size="18" fill="#252c28">B completes with ok / 2 bytes</text><text x="40" y="359" font-size="16" fill="#626962">B’s result is queued, not delivered.</text><text x="40" y="414" font-size="16" fill="#626962">A and B still occupy both slots.</text><path d="M180 448V510" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="512" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="541" font-size="18" fill="#252c28">Cancellation requested for A</text><text x="40" y="567" font-size="16" fill="#626962">Request state stays retained.</text><text x="40" y="622" font-size="17" fill="#626962">A’s outcome is not yet known.</text><path d="M180 656V718" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="720" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="749" font-size="18" fill="#252c28">A completes with hel / 3 bytes</text><text x="40" y="775" font-size="16" fill="#626962">Backend reports success, not cancel.</text><text x="40" y="830" font-size="15" fill="#626962">The read is short; context is intact.</text><path d="M180 864V926" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="928" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="957" font-size="18" fill="#252c28">Dispatch B, then A</text><text x="40" y="983" font-size="16" fill="#626962">Handlers receive actual outcomes.</text><text x="40" y="1038" font-size="15" fill="#626962">Zero retained request slots remain.</text><text x="24" y="1156" font-size="15" fill="#626962">Arrows: the model’s explicit event trace.</text><text x="24" y="1196" font-size="15" fill="#626962">Ordering is a fixture choice, not a rule.</text></svg>
