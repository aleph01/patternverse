<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1304" viewBox="0 0 360 1304" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Delegated authentication and local authority</title><desc id="desc">Four summarized phases of an OpenID Connect code-flow sign-in: the portal starts a transaction bound to its browser session; the identity provider authenticates the user; a code callback and server token exchange let the portal verify the resulting identity; the portal creates its own session and applies local report permissions. The user’s credentials remain with the provider.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1304" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Federate sign-in</text><text x="24" y="78" font-size="18" fill="#626962">Keep local access decisions.</text><rect x="24" y="112" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="150" font-size="21" fill="#252c28">1 Portal starts sign-in</text><text x="40" y="190" font-size="17" fill="#252c28">Approved issuer + callback</text><text x="40" y="224" font-size="18" fill="#252c28">Bound browser transaction</text><text x="40" y="260" font-size="17" fill="#626962">State · nonce · PKCE challenge</text><path d="M72 288V360" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="330" font-size="18" fill="#626962">Browser redirect</text><rect x="24" y="364" width="312" height="184" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="404" font-size="21" fill="#252c28">2 Provider authenticates</text><text x="40" y="444" font-size="18" fill="#252c28">Credentials stay here.</text><text x="40" y="480" font-size="18" fill="#252c28">Issues authorization code</text><text x="40" y="520" font-size="17" fill="#626962">Code returns via browser</text><path d="M72 548V636" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="586" font-size="17" fill="#626962">Code callback, then</text><text x="96" y="616" font-size="17" fill="#626962">TLS token exchange</text><rect x="24" y="640" width="312" height="240" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="680" font-size="21" fill="#252c28">3 Portal verifies identity</text><text x="40" y="724" font-size="18" fill="#252c28">Code + PKCE verifier</text><text x="40" y="760" font-size="17" fill="#252c28">Issuer · signature · audience</text><text x="40" y="796" font-size="17" fill="#252c28">Time · transaction binding</text><text x="40" y="838" font-size="18" fill="#252c28">Resolve (issuer, subject)</text><text x="40" y="870" font-size="17" fill="#626962">After protocol validation</text><path d="M72 880V952" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="924" font-size="17" fill="#626962">Local account resolved</text><rect x="24" y="956" width="312" height="232" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="996" font-size="21" fill="#252c28">4 Local session + access</text><text x="40" y="1040" font-size="18" fill="#252c28">Create the portal’s session.</text><text x="40" y="1076" font-size="17" fill="#252c28">Check local report permission.</text><text x="40" y="1116" font-size="17" fill="#626962">RP / IdP session lifetimes</text><text x="40" y="1150" font-size="18" fill="#626962">are managed separately.</text><text x="24" y="1236" font-size="18" fill="#252c28">OIDC code flow + PKCE example.</text><text x="24" y="1274" font-size="17" fill="#626962">Arrows summarize phases.</text></svg>
