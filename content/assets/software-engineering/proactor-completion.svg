<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1104" viewBox="0 0 720 1104" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Proactor operation completion</title><desc id="desc">The initiator submits a read request with an identity, buffer, and handler. The operation processor performs the read and places its result on a completion queue. The dispatcher retrieves that result and invokes the matching handler with transferred bytes and status.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1104" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Initiate now; dispatch a completed operation’s result later</text><rect x="24" y="112" width="296" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Initiator</text><text x="40" y="167" font-size="17" fill="#626962">Read + request ID + buffer</text><text x="40" y="222" font-size="17" fill="#626962">Registers completion handler.</text><rect x="400" y="112" width="296" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="416" y="141" font-size="20" fill="#252c28">Operation processor</text><text x="416" y="167" font-size="17" fill="#626962">Performs the requested I/O.</text><text x="416" y="222" font-size="17" fill="#626962">Not just a readiness signal.</text><path d="M320 164H398" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="328" y="146" font-size="15" fill="#626962">submit</text><path d="M548 256V318H360V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="302" font-size="17" fill="#626962">completed I/O result</text><rect x="24" y="352" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="381" font-size="20" fill="#252c28">Completion queue</text><text x="40" y="407" font-size="17" fill="#626962">Retains request identity, transferred byte count, and status.</text><path d="M360 480V574" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="534" font-size="17" fill="#626962">dequeue result</text><rect x="24" y="576" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="605" font-size="20" fill="#252c28">Proactor / completion dispatcher</text><text x="40" y="631" font-size="17" fill="#626962">Invokes the handler associated with that request.</text><path d="M360 704V798" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="758" font-size="17" fill="#626962">completion callback</text><rect x="24" y="800" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="829" font-size="20" fill="#252c28">Completion handler consumes the result</text><text x="40" y="855" font-size="17" fill="#626962">Checks count and status; updates protocol state; may initiate next I/O.</text><text x="40" y="900" font-size="17" fill="#626962">The requested operation is complete; the whole transfer may not be.</text><text x="24" y="1012" font-size="18" fill="#626962">Arrows: submit operation, enqueue result, and dispatch its completion.</text><text x="24" y="1050" font-size="17" fill="#626962">The handler receives an outcome rather than performing the original read.</text></svg>
