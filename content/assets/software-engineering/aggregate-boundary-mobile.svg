<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1044" viewBox="0 0 360 1044" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Aggregate root and its consistency boundary</title><desc id="desc">An application sends allocate(package_id, kg) to the LoadPlan root. Inside its boundary are a capacity of 100 kilograms and allocation values A at 60 kilograms and B at 40 kilograms. The root protects their combined weight. Package records remain outside and are referenced by ID.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1044" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">One root protects</text><text x="24" y="60" font-size="22" fill="#252c28">the complete plan</text><rect x="24" y="104" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Application</text><text x="40" y="159" font-size="17" fill="#626962">Requests a business change</text><text x="40" y="232" font-size="20" fill="#252c28">allocate(package_id, kg)</text><rect x="24" y="252" width="312" height="548" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="286" font-size="19" fill="#252c28">LoadPlan aggregate · plan-42</text><rect x="44" y="320" width="272" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="349" font-size="20" fill="#252c28">LoadPlan · root</text><text x="60" y="375" font-size="17" fill="#626962">Capacity: 100 kg</text><path d="M180 180V200H12V358H42" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="44" y="444" font-size="20" fill="#252c28">Owned allocation values</text><rect x="44" y="470" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="499" font-size="20" fill="#252c28">pkg-A · 60 kg</text><text x="60" y="525" font-size="17" fill="#626962">Package ID and weight</text><rect x="44" y="570" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="599" font-size="20" fill="#252c28">pkg-B · 40 kg</text><text x="60" y="625" font-size="17" fill="#626962">Package ID and weight</text><rect x="44" y="690" width="272" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="719" font-size="20" fill="#252c28">100 kg ≤ 100 kg</text><text x="60" y="745" font-size="17" fill="#626962">Total must fit capacity</text><path d="M180 800V894" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="196" y="856" font-size="18" fill="#626962">IDs only</text><rect x="44" y="896" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="925" font-size="18" fill="#252c28">Packages · separate roots</text><text x="60" y="951" font-size="16" fill="#626962">Tracking history stays outside</text><text x="24" y="1020" font-size="16" fill="#626962">Solid: command · dashed: ID reference</text></svg>
