<svg xmlns="http://www.w3.org/2000/svg" width="360" height="920" viewBox="0 0 360 920" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Shared state, independent knowledge, and separate control</title><desc id="desc">A shared blackboard holds input features, intermediate evidence, and a document hypothesis. Independent text, layout, and combination knowledge sources read snapshots and propose additions. A separate controller chooses an eligible source and commits its contribution.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="selection" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="920" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">One workspace;</text><text x="24" y="60" font-size="22" fill="#252c28">independent expertise</text><text x="24" y="102" font-size="18" fill="#626962">Text · layout · combination</text><rect x="44" y="132" width="272" height="184" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="166" font-size="22" fill="#252c28">Blackboard</text><text x="60" y="204" font-size="19" fill="#252c28">Inputs · evidence</text><text x="60" y="236" font-size="19" fill="#252c28">Partial solutions</text><text x="60" y="276" font-size="17" fill="#626962">Controller owns writes</text><rect x="44" y="418" width="272" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="447" font-size="20" fill="#252c28">Knowledge source</text><text x="60" y="473" font-size="17" fill="#626962">Layout selected this cycle</text><rect x="44" y="638" width="272" height="132" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="674" font-size="21" fill="#252c28">Control component</text><text x="60" y="712" font-size="18" fill="#252c28">Eligibility · priority</text><text x="60" y="744" font-size="18" fill="#252c28">Validate · commit</text><path d="M244 316V416" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="260" y="370" font-size="17" fill="#252c28">read</text><path d="M244 518V636" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="260" y="582" font-size="17" fill="#252c28">patch</text><path d="M116 638V520" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#selection)"/><text x="50" y="582" font-size="17" fill="#252c28">select</text><path d="M316 288H348V704H318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="300" y="618" font-size="17" fill="#252c28">state</text><path d="M44 712H12V268H42" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="376" font-size="17" fill="#252c28">commit</text><text x="24" y="818" font-size="17" fill="#252c28">Only the controller commits changes.</text><text x="24" y="862" font-size="17" fill="#626962">Solid: state and contributions</text><text x="24" y="890" font-size="17" fill="#626962">Dashed: selection of work</text></svg>
