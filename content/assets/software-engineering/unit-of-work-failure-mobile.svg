<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1232" viewBox="0 0 360 1232" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A failed Unit of Work rolls back its earlier writes</title><desc id="desc">The Unit of Work updates A, then attempts to insert duplicate B. The insert fails, so the transaction rolls back the earlier update. A retains its committed value, and the failed Unit of Work is discarded. A successful batch can commit all three kinds of change together.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1232" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">A later write fails;</text><text x="24" y="60" font-size="22" fill="#252c28">earlier writes roll back</text><rect x="24" y="104" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Committed labels</text><text x="40" y="159" font-size="17" fill="#626962">A: Ready · B: New</text><path d="M180 204V282" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="284" width="312" height="580" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="320" font-size="21" fill="#252c28">One commit attempt</text><rect x="44" y="352" width="272" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="381" font-size="20" fill="#252c28">UPDATE A → Wrong</text><text x="60" y="407" font-size="17" fill="#626962">Provisional write</text><rect x="44" y="512" width="272" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="541" font-size="20" fill="#252c28">INSERT B → Duplicate</text><text x="60" y="567" font-size="17" fill="#626962">Uniqueness constraint fails</text><path d="M180 452V510" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="44" y="712" width="272" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="741" font-size="20" fill="#252c28">ROLLBACK</text><text x="60" y="767" font-size="17" fill="#626962">Undo earlier UPDATE</text><path d="M180 612V710" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><rect x="24" y="960" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="989" font-size="20" fill="#252c28">A: Ready · B: New</text><text x="40" y="1015" font-size="17" fill="#626962">Committed state unchanged</text><path d="M180 812V958" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="24" y="1124" font-size="18" fill="#252c28">Failed scope is finished.</text><text x="24" y="1160" font-size="17" fill="#626962">Retry with a new Unit of Work.</text><text x="24" y="1196" font-size="16" fill="#626962">Dashed: failure / rollback</text></svg>
