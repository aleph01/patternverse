<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Buffer arrivals, then control the drain</title><desc id="desc">Bursty producers enqueue jobs into a six-place waiting buffer. A controlled handler transfers work toward the target using a two-job budget per one-second model tick. Confirmed admission and completed work are distinct outcomes. Queue capacity, drain budget, and target capacity are separate controls.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="1080" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Buffer arrivals, then control the drain</text><rect x="24" y="104" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="136" font-size="20" fill="#252c28">Producers / bursty intake</text><text x="40" y="176" font-size="19" fill="#626962">Tick 1: six jobs arrive. Tick 2: two more arrive.</text><path d="M360 216V312" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="264" font-size="17" fill="#626962">Confirmed enqueue</text><rect x="24" y="312" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="344" font-size="20" fill="#252c28">Waiting queue / capacity 6</text><rect x="40" y="376" width="32" height="32" fill="#fff" stroke="#00855b" stroke-width="1.2"/><rect x="88" y="376" width="32" height="32" fill="#fff" stroke="#00855b" stroke-width="1.2"/><rect x="136" y="376" width="32" height="32" fill="#fff" stroke="#00855b" stroke-width="1.2"/><rect x="184" y="376" width="32" height="32" fill="#fff" stroke="#00855b" stroke-width="1.2"/><rect x="232" y="376" width="32" height="32" fill="#fff" stroke="#00855b" stroke-width="1.2"/><rect x="280" y="376" width="32" height="32" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="438" font-size="17" fill="#626962">Count jobs; also bound bytes in production.</text><path d="M360 456V552" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="504" font-size="17" fill="#626962">Take within the budget</text><rect x="24" y="552" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="584" font-size="20" fill="#252c28">Controlled handler</text><text x="40" y="624" font-size="20" fill="#252c28">At most 2 jobs per one-second model tick.</text><text x="40" y="664" font-size="18" fill="#626962">Aggregate demand includes every consumer and retry.</text><path d="M360 696V792" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="744" font-size="17" fill="#626962">Work toward the target</text><rect x="24" y="792" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="824" font-size="20" fill="#252c28">Target / report writer</text><text x="40" y="864" font-size="19" fill="#626962">Queue depth alone does not protect its capacity.</text><text x="24" y="968" font-size="17" fill="#626962">Arrows: work transfer.</text><text x="24" y="1008" font-size="19" fill="#252c28">Confirmed enqueue is separate from successful completion.</text><text x="24" y="1048" font-size="18" fill="#626962">The tick budget models controlled service; it is not a live limiter.</text></svg>
