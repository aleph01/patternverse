<svg xmlns="http://www.w3.org/2000/svg" width="720" height="944" viewBox="0 0 720 944" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Full-membership voting and one vote per term</title><desc id="desc">In a fixed three-member group A, B, and C, an isolated C receives only its own vote and cannot win. A receives A and B's votes in term one and wins with two of three. Each voter can choose only one candidate per term, so another candidate cannot assemble a different majority in that term.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="944" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A majority means two of all three members</text><rect x="24" y="112" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">C isolated / term 1 / only C votes for C</text><text x="40" y="167" font-size="17" fill="#626962">One vote is insufficient. Membership remains A, B, C; quorum is 2.</text><text x="40" y="210" font-size="18" fill="#626962">No winner; the group is not resized to reachable members.</text><text x="24" y="324" font-size="21" fill="#252c28">Then A campaigns in term 1, contacting A and B.</text><rect x="24" y="352" width="208" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="381" font-size="18" fill="#252c28">Voter A</text><text x="40" y="407" font-size="16" fill="#626962">Term 1 / voted A</text><text x="40" y="460" font-size="16" fill="#626962">Grants A its vote</text><rect x="256" y="352" width="208" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="272" y="381" font-size="18" fill="#252c28">Voter B</text><text x="272" y="407" font-size="16" fill="#626962">Term 1 / voted A</text><text x="272" y="460" font-size="16" fill="#626962">Grants A its vote</text><rect x="488" y="352" width="208" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="504" y="381" font-size="18" fill="#252c28">Voter C</text><text x="504" y="407" font-size="16" fill="#626962">Term 1 / voted C</text><text x="504" y="460" font-size="15" fill="#626962">Earlier record retained</text><path d="M128 496V570H300V638" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 496V638" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="640" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="669" font-size="20" fill="#252c28">A elected in term 1</text><text x="40" y="695" font-size="17" fill="#626962">Distinct votes (A, B) / 2 of the full 3-member group</text><text x="40" y="738" font-size="18" fill="#626962">C is not part of A’s winning vote set.</text><text x="24" y="856" font-size="18" fill="#626962">Arrows: A’s granted votes contribute to its majority.</text><text x="24" y="896" font-size="17" fill="#626962">A voter cannot select different candidates within one retained term.</text></svg>
