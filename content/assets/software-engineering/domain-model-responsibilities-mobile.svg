<svg xmlns="http://www.w3.org/2000/svg" width="360" height="838" viewBox="0 0 360 838" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Shared domain operations and owned reservation state</title><desc id="desc">The website and batch importer both invoke Workshop operations. Workshop owns capacity, registration state, and its reservation collection. Reservations are created and removed through those operations, while callers receive an immutable view of the records.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="838" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Ask the model to perform</text><text x="24" y="60" font-size="22" fill="#252c28">a valid business change</text><rect x="24" y="112" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Website + batch importer</text><text x="40" y="167" font-size="17" fill="#626962">Use the same model operations</text><path d="M180 188V278" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="198" y="240" font-size="16" fill="#252c28">reserve / cancel</text><rect x="24" y="280" width="312" height="468" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="316" font-size="22" fill="#252c28">Workshop</text><rect x="44" y="340" width="272" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="369" font-size="20" fill="#252c28">Operations check rules</text><text x="60" y="395" font-size="17" fill="#626962">Open · unique · enough seats</text><path d="M180 416V456" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="44" y="458" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="487" font-size="20" fill="#252c28">Owned reservations</text><text x="60" y="513" font-size="17" fill="#626962">Immutable records; private map</text><text x="44" y="576" font-size="19" fill="#252c28">Fixed capacity</text><text x="44" y="610" font-size="18" fill="#252c28">Registration open or closed</text><text x="44" y="654" font-size="18" fill="#252c28">Remaining = capacity</text><text x="44" y="682" font-size="18" fill="#252c28">− total reserved seats</text><text x="40" y="724" font-size="16" fill="#626962">No direct append from callers.</text><text x="24" y="800" font-size="17" fill="#252c28">Failed checks leave bookings intact.</text></svg>
