<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1104" viewBox="0 0 720 1104" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Bulkhead saturation, independent admission and release</title><desc id="desc">A backfill action acquires its one permit and waits on an event. A second backfill call is rejected without invocation, while a live call uses its independent permit. After the event is released, the first backfill finishes, returns its permit, and permits another backfill call.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1104" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One full compartment leaves the other allowance available</text><text x="24" y="128" font-size="22" fill="#252c28">BACKFILL / capacity 1</text><text x="400" y="128" font-size="22" fill="#252c28">LIVE / capacity 1</text><rect x="24" y="184" width="296" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="213" font-size="18" fill="#252c28">First action holds permit</text><text x="40" y="239" font-size="16" fill="#626962">Waits on an event; remains active.</text><rect x="400" y="184" width="296" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="416" y="213" font-size="18" fill="#252c28">Its own permit is available</text><text x="416" y="239" font-size="16" fill="#626962">Separate from backfill occupancy.</text><path d="M172 312V406" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M548 312V406" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="408" width="296" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="437" font-size="18" fill="#252c28">Second action is rejected</text><text x="40" y="463" font-size="16" fill="#626962">No invocation and no waiting queue.</text><rect x="400" y="408" width="296" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="416" y="437" font-size="18" fill="#252c28">Live action returns served</text><text x="416" y="463" font-size="16" fill="#626962">Caller thread was already available.</text><rect x="24" y="632" width="296" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="661" font-size="18" fill="#252c28">Release event; join worker</text><text x="40" y="687" font-size="16" fill="#626962">First action finishes and releases.</text><path d="M172 760V854" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="856" width="296" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="885" font-size="18" fill="#252c28">A new backfill is admitted</text><text x="40" y="911" font-size="16" fill="#626962">The permit is available again.</text><rect x="400" y="632" width="296" height="352" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="416" y="668" font-size="18" fill="#252c28">The gate counts action lifetimes.</text><text x="416" y="732" font-size="17" fill="#626962">It does not reserve threads,</text><text x="416" y="772" font-size="17" fill="#626962">terminate running actions,</text><text x="416" y="812" font-size="17" fill="#626962">or bound downstream bytes.</text><text x="416" y="900" font-size="17" fill="#626962">Release follows local completion,</text><text x="416" y="940" font-size="17" fill="#626962">not merely a caller’s lost patience.</text><text x="24" y="1064" font-size="17" fill="#626962">Arrows: local sequencing. The live call can proceed during the active backfill.</text></svg>
