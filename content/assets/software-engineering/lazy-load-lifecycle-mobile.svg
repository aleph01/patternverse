<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1272" viewBox="0 0 360 1272" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Deferred access has explicit failure and lifetime policies</title><desc id="desc">An unloaded document attempts a body read. Success stores the value and releases the callback; failure propagates while the body remains unloaded. After the reader closes, unloaded access is rejected before SQL, while an already-loaded body remains readable from memory.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1272" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">A failed read</text><text x="24" y="60" font-size="22" fill="#252c28">leaves the body unloaded</text><rect x="24" y="104" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Unloaded: attempt read</text><text x="40" y="159" font-size="17" fill="#626962">Needs an active reader.</text><text x="24" y="248" font-size="18" fill="#252c28">Outcomes</text><rect x="8" y="264" width="344" height="408" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><path d="M180 204V262" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="296" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="325" font-size="20" fill="#252c28">Success: store the body</text><text x="40" y="351" font-size="17" fill="#626962">Release the callback.</text><text x="40" y="404" font-size="17" fill="#626962">Later access uses memory.</text><rect x="24" y="488" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="517" font-size="20" fill="#252c28">Failure: propagate error</text><text x="40" y="543" font-size="17" fill="#626962">Keep UNLOADED and loader.</text><text x="40" y="596" font-size="17" fill="#626962">Next access may try again.</text><rect x="24" y="720" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="749" font-size="20" fill="#252c28">Reader exits</text><text x="40" y="775" font-size="17" fill="#626962">No new body lookups.</text><path d="M180 672V718" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="884" font-size="18" fill="#252c28">After exit</text><rect x="8" y="900" width="344" height="336" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><path d="M180 820V898" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="936" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="965" font-size="20" fill="#252c28">Loaded before exit</text><text x="40" y="991" font-size="17" fill="#626962">Memory value stays readable.</text><rect x="24" y="1092" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1121" font-size="20" fill="#252c28">Unloaded at exit</text><text x="40" y="1147" font-size="17" fill="#626962">Read rejected before SQL.</text></svg>
