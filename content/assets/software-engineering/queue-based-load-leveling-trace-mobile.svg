<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1144" viewBox="0 0 360 1144" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A burst drains over four ticks</title><desc id="desc">Four one-second ticks show arrivals of six, two, zero, and zero jobs. All are admitted without rejection. Each tick completes two jobs, leaving four, four, two, and zero waiting. Accepted jobs total eight, completed jobs total eight, and the final backlog is empty.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1144" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">A burst drains over time</text><text x="24" y="80" font-size="16" fill="#626962">One tick = 1 second. Capacity = 6 jobs.</text><rect x="24" y="120" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="150" font-size="20" fill="#252c28">Tick 1 / arrivals 6</text><text x="40" y="190" font-size="18" fill="#252c28">Accepted 6 / rejected 0</text><text x="40" y="230" font-size="18" fill="#252c28">Completed 2 jobs</text><text x="40" y="270" font-size="18" fill="#626962">Waiting at tick end: 4</text><rect x="24" y="336" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="366" font-size="20" fill="#252c28">Tick 2 / arrivals 2</text><text x="40" y="406" font-size="18" fill="#252c28">Accepted 2 / rejected 0</text><text x="40" y="446" font-size="18" fill="#252c28">Completed 2 jobs</text><text x="40" y="486" font-size="18" fill="#626962">Waiting at tick end: 4</text><rect x="24" y="552" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="582" font-size="20" fill="#252c28">Tick 3 / arrivals 0</text><text x="40" y="622" font-size="18" fill="#252c28">Accepted 0 / rejected 0</text><text x="40" y="662" font-size="18" fill="#252c28">Completed 2 jobs</text><text x="40" y="702" font-size="18" fill="#626962">Waiting at tick end: 2</text><rect x="24" y="768" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="798" font-size="20" fill="#252c28">Tick 4 / arrivals 0</text><text x="40" y="838" font-size="18" fill="#252c28">Accepted 0 / rejected 0</text><text x="40" y="878" font-size="18" fill="#252c28">Completed 2 jobs</text><text x="40" y="918" font-size="18" fill="#626962">Waiting at tick end: 0</text><text x="24" y="1020" font-size="17" fill="#626962">Admit first; then drain up to 2.</text><text x="24" y="1060" font-size="17" fill="#252c28">Total: 8 accepted, 8 completed.</text><text x="24" y="1100" font-size="17" fill="#252c28">Final backlog: 0 jobs.</text></svg>
