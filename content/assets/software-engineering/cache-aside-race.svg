<svg xmlns="http://www.w3.org/2000/svg" width="720" height="944" viewBox="0 0 720 944" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">An older read can fill late</title><desc id="desc">Four ordered events show a late cache fill: reader A obtains 1200 on a miss; writer B commits 1300; B invalidates the key; A installs its older 1200. The authoritative store remains 1300 while a subsequent cache hit can return 1200.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="944" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Commit then invalidate still permits a late fill</text><text x="24" y="78" font-size="19" fill="#626962">Same unversioned key: product:P7. Events run top to bottom.</text><text x="24" y="110" font-size="18" fill="#626962">Prices are integer cents.</text><rect x="24" y="152" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="186" font-size="22" fill="#252c28">1. Reader A misses</text><text x="300" y="186" font-size="20" fill="#252c28">A reads source price 1200</text><text x="40" y="234" font-size="19" fill="#626962">A holds 1200; cache empty</text><path d="M360 264V296" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="300" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="334" font-size="22" fill="#252c28">2. Writer B commits</text><text x="300" y="334" font-size="20" fill="#252c28">B writes source price 1300</text><text x="40" y="382" font-size="19" fill="#626962">Source 1300; cache empty</text><path d="M360 412V444" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="448" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="482" font-size="22" fill="#252c28">3. B invalidates</text><text x="300" y="482" font-size="20" fill="#252c28">B deletes the cache key</text><text x="40" y="530" font-size="19" fill="#626962">Source 1300; cache empty</text><path d="M360 560V592" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="596" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="630" font-size="22" fill="#252c28">4. A fills late</text><text x="300" y="630" font-size="20" fill="#252c28">A installs its earlier 1200</text><text x="40" y="678" font-size="19" fill="#626962">Source 1300; cache 1200</text><rect x="24" y="792" width="672" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="826" font-size="20" fill="#252c28">A later cache hit can return 1200 while the source holds 1300.</text><text x="40" y="866" font-size="18" fill="#626962">TTL starts at installation; it does not prove source age.</text><text x="40" y="896" font-size="18" fill="#626962">This trace has no version check or fill/write coordination.</text></svg>
