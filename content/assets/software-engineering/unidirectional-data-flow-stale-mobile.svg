<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1256" viewBox="0 0 360 1256" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A stale request completion cannot replace newer accepted search state</title><desc id="desc">Search ca becomes request 1, then search cat becomes request 2. A successful completion for request 2 installs cat results and ends loading. Request 1 then completes, but its identifier is stale, so the update returns the existing state and the cat results remain visible.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1256" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Keep the latest search intent</text><rect x="24" y="104" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Current search: cat</text><text x="40" y="159" font-size="17" fill="#626962">Request 2; loading true</text><path d="M180 216V326" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="270" font-size="17" fill="#626962">Loaded(2)</text><rect x="24" y="328" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="357" font-size="20" fill="#252c28">Matching result accepted</text><text x="40" y="383" font-size="17" fill="#626962">cat, caterpillar</text><text x="40" y="438" font-size="17" fill="#626962">Loading becomes false.</text><path d="M180 472V558" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="522" font-size="17" fill="#626962">later event</text><rect x="24" y="560" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="589" font-size="20" fill="#252c28">Older response: Loaded(1)</text><text x="40" y="615" font-size="17" fill="#626962">car, cart</text><path d="M180 672V758" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="724" font-size="17" fill="#626962">guard check</text><rect x="24" y="760" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="789" font-size="20" fill="#252c28">Stale completion ignored</text><text x="40" y="815" font-size="17" fill="#626962">1 ≠ 2; no state transition.</text><path d="M180 872V958" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="924" font-size="17" fill="#626962">same state</text><rect x="24" y="960" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="989" font-size="20" fill="#252c28">View still shows cat</text><text x="40" y="1015" font-size="17" fill="#626962">cat, caterpillar</text><text x="40" y="1074" font-size="17" fill="#626962">Loading remains false.</text><text x="24" y="1168" font-size="18" fill="#252c28">Old work was not cancelled.</text><text x="24" y="1208" font-size="17" fill="#626962">Only its state change is rejected.</text></svg>
