<svg xmlns="http://www.w3.org/2000/svg" width="720" height="952" viewBox="0 0 720 952" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A failed Unit of Work rolls back its earlier writes</title><desc id="desc">The Unit of Work updates A, then attempts to insert duplicate B. The insert fails, so the transaction rolls back the earlier update. A retains its committed value, and the failed Unit of Work is discarded. A successful batch can commit all three kinds of change together.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="952" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A later write fails; earlier writes roll back</text><rect x="24" y="84" width="672" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">Committed labels</text><text x="40" y="139" font-size="17" fill="#626962">A: Ready · B: New</text><path d="M360 172V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="248" width="672" height="392" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="44" y="286" font-size="23" fill="#252c28">One commit attempt</text><rect x="44" y="324" width="280" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="353" font-size="20" fill="#252c28">UPDATE A → Wrong</text><text x="60" y="379" font-size="17" fill="#626962">Provisional write</text><rect x="396" y="324" width="280" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="412" y="353" font-size="20" fill="#252c28">INSERT B → Duplicate</text><text x="412" y="379" font-size="17" fill="#626962">Uniqueness constraint fails</text><path d="M324 374H394" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="44" y="508" width="632" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="537" font-size="20" fill="#252c28">ROLLBACK</text><text x="60" y="563" font-size="17" fill="#626962">Undo earlier UPDATE</text><path d="M536 424V466H360V506" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="552" y="460" font-size="17" fill="#626962">fails</text><rect x="24" y="728" width="672" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="757" font-size="20" fill="#252c28">Committed labels unchanged</text><text x="40" y="783" font-size="17" fill="#626962">A: Ready · B: New</text><path d="M360 596V726" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="24" y="880" font-size="18" fill="#252c28">Failed scope closes; retry with fresh inputs.</text><text x="24" y="916" font-size="17" fill="#626962">Dashed: failed write and rollback path.</text></svg>
