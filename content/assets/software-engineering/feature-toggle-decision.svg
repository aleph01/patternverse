<svg xmlns="http://www.w3.org/2000/svg" width="720" height="848" viewBox="0 0 720 848" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One evaluated policy decision selects a receipt path</title><desc id="desc">A request context and a versioned flag-policy snapshot feed one evaluator. Its Boolean decision reaches a toggle point that selects the standard receipt or the detailed receipt. Only the selected rendering path runs.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="848" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Separate policy evaluation from behavior selection</text><text x="24" y="80" font-size="18" fill="#626962">Receipt rollout · one configuration snapshot and a trusted account key</text><rect x="24" y="112" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="150" font-size="22" fill="#252c28">Request context</text><text x="40" y="190" font-size="19" fill="#252c28">Account: acct-42</text><rect x="384" y="112" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="150" font-size="22" fill="#252c28">Policy snapshot v1</text><text x="400" y="190" font-size="19" fill="#252c28">Expose to 20%</text><path d="M180 216V284" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 216V284" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="256" font-size="18" fill="#626962">Context</text><text x="400" y="256" font-size="18" fill="#626962">Configuration</text><rect x="24" y="288" width="672" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="326" font-size="22" fill="#252c28">Evaluator: stable bucket 12 &lt; 20 → enabled</text><text x="40" y="366" font-size="18" fill="#252c28">Return a Boolean decision with revision v1 and reason: rollout.</text><path d="M72 392V460" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="432" font-size="18" fill="#626962">One decision retained for this request</text><rect x="24" y="464" width="672" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="502" font-size="22" fill="#252c28">Toggle point: receipt renderer</text><text x="40" y="542" font-size="18" fill="#252c28">Accept the decision; keep targeting policy outside the renderer.</text><path d="M180 568V652" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 568V652" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="58" y="612" font-size="18" fill="#626962">False</text><text x="594" y="612" font-size="18" fill="#626962">True</text><text x="246" y="612" font-size="18" fill="#626962">Choose one path</text><rect x="24" y="656" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="694" font-size="22" fill="#252c28">Standard receipt</text><text x="40" y="734" font-size="18" fill="#626962">Existing layout</text><rect x="384" y="656" width="312" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="694" font-size="22" fill="#252c28">Detailed receipt</text><text x="400" y="734" font-size="18" fill="#626962">New layout</text><text x="24" y="808" font-size="19" fill="#252c28">Only the selected renderer runs; authorization stays separate.</text></svg>
