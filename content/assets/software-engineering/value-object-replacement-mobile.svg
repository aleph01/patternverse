<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1036" viewBox="0 0 360 1036" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Immutable replacement without aliasing changes</title><desc id="desc">Before a change, booked and proposed refer to the same stay value, 2026-10-29 to 2026-11-01. After proposed is assigned the result of shifted(2), booked still refers to the original dates while proposed refers to 2026-10-31 to 2026-11-03.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1036" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Replace a reference;</text><text x="24" y="60" font-size="22" fill="#252c28">leave the old value intact</text><rect x="24" y="104" width="312" height="292" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="138" font-size="20" fill="#252c28">Before · one shared value</text><rect x="44" y="166" width="272" height="52" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="199" font-size="20" fill="#252c28">booked + proposed</text><path d="M180 218V270" fill="none" stroke="#626962" stroke-width="1.3" marker-end="url(#wiring)"/><rect x="44" y="272" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="301" font-size="18" fill="#252c28">2026-10-29 / 2026-11-01</text><text x="60" y="327" font-size="16" fill="#626962">3 calendar nights</text><text x="44" y="426" font-size="17" fill="#252c28">proposed = proposed.shifted(2)</text><rect x="24" y="446" width="312" height="468" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="480" font-size="20" fill="#252c28">After · replace proposed</text><rect x="44" y="506" width="272" height="52" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="539" font-size="20" fill="#252c28">booked</text><path d="M180 558V592" fill="none" stroke="#626962" stroke-width="1.3" marker-end="url(#wiring)"/><rect x="44" y="594" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="623" font-size="18" fill="#252c28">2026-10-29 / 2026-11-01</text><text x="60" y="649" font-size="16" fill="#626962">3 calendar nights</text><rect x="44" y="720" width="272" height="52" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="753" font-size="20" fill="#252c28">proposed</text><path d="M180 772V806" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="44" y="808" width="272" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="837" font-size="18" fill="#252c28">2026-10-31 / 2026-11-03</text><text x="60" y="863" font-size="16" fill="#626962">3 calendar nights</text><text x="24" y="964" font-size="18" fill="#252c28">Arrows are held references.</text><text x="24" y="998" font-size="17" fill="#626962">The original dates never change.</text></svg>
