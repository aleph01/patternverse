<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1040" viewBox="0 0 360 1040" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Builder reuse and independent mutable children</title><desc id="desc">One immutable order builder produces Order A and Order B, each with its own empty notes list. Adding fragile to Order A changes only A’s list. Configuring an express variant creates a separate builder recipe and leaves the base recipe standard.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1040" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Reuse recipes, isolate results</text><text x="24" y="82" font-size="18" fill="#626962">Immutable builder state: notes = ()</text><rect x="24" y="112" width="312" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="22" fill="#252c28">Base recipe</text><text x="40" y="180" font-size="18" fill="#626962">Standard delivery · notes ()</text><path d="M72 200V256" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="236" font-size="18" fill="#626962">build() twice</text><rect x="24" y="260" width="312" height="108" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="298" font-size="22" fill="#252c28">Order A · list A</text><text x="40" y="338" font-size="18" fill="#252c28">After append: ['fragile']</text><rect x="24" y="400" width="312" height="108" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="438" font-size="22" fill="#252c28">Order B · list B</text><text x="40" y="478" font-size="18" fill="#252c28">Still empty: []</text><text x="24" y="556" font-size="18" fill="#626962">A and B own separate notes lists.</text><text x="24" y="622" font-size="19" fill="#626962">Configuration is separate too</text><rect x="24" y="652" width="312" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="688" font-size="21" fill="#252c28">Base recipe unchanged</text><text x="40" y="720" font-size="19" fill="#626962">express = False</text><path d="M72 740V800" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="776" font-size="19" fill="#626962">with_express()</text><rect x="24" y="804" width="312" height="108" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="842" font-size="22" fill="#252c28">New variant recipe</text><text x="40" y="882" font-size="19" fill="#252c28">express = True</text><text x="24" y="964" font-size="18" fill="#252c28">Fresh lists protect mutable notes.</text><text x="24" y="1004" font-size="18" fill="#626962">Fixed O17 is not a unique ID.</text></svg>
