<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1168" viewBox="0 0 720 1168" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A stale request completion cannot replace newer accepted search state</title><desc id="desc">Search ca becomes request 1, then search cat becomes request 2. A successful completion for request 2 installs cat results and ends loading. Request 1 then completes, but its identifier is stale, so the update returns the existing state and the cat results remain visible.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1168" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Request identity makes the ordering policy explicit</text><rect x="24" y="100" width="672" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">Current search intent: cat</text><text x="40" y="155" font-size="17" fill="#626962">Request 2; loading true; earlier request 1 is still in flight.</text><path d="M360 196V310" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="254" font-size="17" fill="#626962">Loaded(2)</text><rect x="24" y="312" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="341" font-size="20" fill="#252c28">Matching pending result accepted</text><text x="40" y="367" font-size="17" fill="#626962">Results: cat, caterpillar; request 2; loading false</text><path d="M360 424V542" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="486" font-size="17" fill="#626962">publish state</text><rect x="24" y="544" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="573" font-size="20" fill="#252c28">Current state now represents the newer response</text><text x="40" y="599" font-size="17" fill="#626962">The view shows cat, caterpillar.</text><path d="M180 656V774" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="716" font-size="17" fill="#626962">next event</text><rect x="24" y="776" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="805" font-size="20" fill="#252c28">Loaded(request 1)</text><text x="40" y="831" font-size="17" fill="#626962">Older results: car, cart</text><rect x="384" y="776" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="805" font-size="20" fill="#252c28">Guard rejects</text><text x="400" y="831" font-size="17" fill="#626962">1 ≠ 2; retain current state.</text><path d="M336 832H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="338" y="810" font-size="16" fill="#626962">check</text><path d="M540 888V1006" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="952" font-size="17" fill="#626962">unchanged</text><rect x="24" y="1008" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1037" font-size="20" fill="#252c28">Same UI state after the stale completion</text><text x="40" y="1063" font-size="17" fill="#626962">Results: cat, caterpillar; loading false</text></svg>
