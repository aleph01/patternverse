<svg xmlns="http://www.w3.org/2000/svg" width="360" height="958" viewBox="0 0 360 958" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Closed and open layer dependencies</title><desc id="desc">Closed layering permits presentation to use business logic and business logic to use price access. The open example also permits a direct presentation-to-price-access dependency for a separately defined read-only operation.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="958" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Choose the access policy</text><text x="28" y="76" font-size="21" fill="#252c28">Closed: adjacent only</text><rect x="28" y="104" width="280" height="72" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="133" font-size="20" fill="#252c28">Presentation</text><text x="44" y="159" font-size="17" fill="#626962">Parse input · format result</text><rect x="28" y="224" width="280" height="72" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="253" font-size="20" fill="#252c28">Business logic</text><text x="44" y="279" font-size="17" fill="#626962">Compute quote policy</text><rect x="28" y="344" width="280" height="72" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="373" font-size="20" fill="#252c28">Price access</text><text x="44" y="399" font-size="17" fill="#626962">Read unit price in cents</text><path d="M168 176V222" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M168 296V342" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="28" y="452" font-size="17" fill="#626962">Only the adjacent lower layer.</text><text x="28" y="510" font-size="21" fill="#252c28">Open: chosen bypass</text><rect x="28" y="538" width="280" height="72" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="567" font-size="20" fill="#252c28">Presentation</text><text x="44" y="593" font-size="17" fill="#626962">Parse input · format result</text><rect x="28" y="658" width="280" height="72" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="687" font-size="20" fill="#252c28">Business logic</text><text x="44" y="713" font-size="17" fill="#626962">Compute quote policy</text><rect x="28" y="778" width="280" height="72" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="807" font-size="20" fill="#252c28">Price access</text><text x="44" y="833" font-size="17" fill="#626962">Read unit price in cents</text><path d="M168 610V656" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M168 730V776" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M308 574H332V814H310" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="28" y="886" font-size="17" fill="#626962">Extra access is explicitly allowed.</text><text x="28" y="928" font-size="17" fill="#252c28">Quote rules still belong in business.</text></svg>
