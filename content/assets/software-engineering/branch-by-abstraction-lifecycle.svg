<svg xmlns="http://www.w3.org/2000/svg" width="720" height="844" viewBox="0 0 720 844" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A staged replacement with an explicit retirement gate</title><desc id="desc">Four releasable stages: introduce the seam with the old supplier active, build and verify the new supplier alongside it, switch after compatibility evidence, and retire the old supplier after remaining uses and recovery obligations are closed.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="844" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Replace in stages that remain releasable</text><rect x="24" y="100" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="138" font-size="22" fill="#252c28">1 Introduce the seam</text><text x="40" y="180" font-size="19" fill="#252c28">Keep the old implementation active.</text><text x="40" y="216" font-size="18" fill="#626962">Move direct calls behind the application contract.</text><path d="M72 228V272" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="260" font-size="18" fill="#626962">Preserve behavior</text><rect x="24" y="276" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="314" font-size="22" fill="#252c28">2 Build alongside</text><text x="40" y="356" font-size="19" fill="#252c28">Old remains active; develop and verify the new implementation.</text><text x="40" y="392" font-size="18" fill="#626962">Run shared contract checks and supplier-specific tests.</text><path d="M72 404V448" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="436" font-size="18" fill="#626962">Compatibility evidence</text><rect x="24" y="452" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="490" font-size="22" fill="#252c28">3 Switch deliberately</text><text x="40" y="532" font-size="19" fill="#252c28">Select the new implementation for a safe unit of work.</text><text x="40" y="568" font-size="18" fill="#626962">Observe real behavior; recovery depends on state compatibility.</text><path d="M72 580V624" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="612" font-size="18" fill="#626962">Retirement evidence</text><rect x="24" y="628" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="666" font-size="22" fill="#252c28">4 Retire the old path</text><text x="40" y="708" font-size="19" fill="#252c28">Confirm remaining uses and recovery obligations are closed.</text><text x="40" y="744" font-size="18" fill="#626962">Remove the old supplier, adapter, and transition controls.</text><text x="24" y="804" font-size="19" fill="#252c28">A working replacement does not establish that the old path is unused.</text></svg>
