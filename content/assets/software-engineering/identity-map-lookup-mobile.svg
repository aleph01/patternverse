<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1032" viewBox="0 0 360 1032" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Two lookups share one object through an Identity Map</title><desc id="desc">The first lookup of contact 1 misses the scoped map, selects its row, constructs a Contact, and registers its reference. A later lookup finds that entry and returns the same Contact object without selecting or constructing again.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1032" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Look up identity before</text><text x="24" y="60" font-size="22" fill="#252c28">constructing another object</text><rect x="8" y="84" width="344" height="812" fill="#fff" stroke="#00855b" stroke-width="1.2"/><rect x="24" y="112" width="280" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">1. get(1): map miss</text><text x="40" y="167" font-size="17" fill="#626962">SELECT, then construct</text><path d="M164 212V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="180" y="264" font-size="17" fill="#626962">register</text><rect x="24" y="304" width="280" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="333" font-size="20" fill="#252c28">Contact, ID 1</text><text x="40" y="359" font-size="17" fill="#626962">one stored reference</text><path d="M164 404V502" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="180" y="460" font-size="17" fill="#626962">refers to</text><rect x="24" y="504" width="280" height="116" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="533" font-size="20" fill="#252c28">One Contact object</text><text x="40" y="559" font-size="17" fill="#626962">name: Ada</text><rect x="24" y="756" width="280" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="785" font-size="20" fill="#252c28">2. get(1): map hit</text><text x="40" y="811" font-size="17" fill="#626962">reuse; no SELECT</text><path d="M304 806H336V354H306" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="308" y="700" font-size="15" fill="#626962">hit</text><text x="24" y="952" font-size="18" fill="#252c28">Both paths receive this object.</text><text x="24" y="988" font-size="17" fill="#626962">Within this scope only.</text></svg>
