<svg xmlns="http://www.w3.org/2000/svg" width="720" height="542" viewBox="0 0 720 542" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Application-owned ports and replaceable adapters</title><desc id="desc">Console and test drivers enter the same reservation operation. The application calls its own stock port, which can be served by a SQLite adapter or an in-memory substitute selected at startup.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="542" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One application, different adapters</text><text x="24" y="90" font-size="18" fill="#626962">Outside: drivers</text><text x="520" y="90" font-size="18" fill="#626962">Outside: storage</text><rect x="24" y="132" width="172" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="161" font-size="20" fill="#252c28">Console</text><text x="40" y="187" font-size="17" fill="#626962">Parse text</text><rect x="24" y="300" width="172" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="329" font-size="20" fill="#252c28">Test driver</text><text x="40" y="355" font-size="17" fill="#626962">Call directly</text><rect x="244" y="106" width="232" height="334" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="260" y="138" font-size="21" fill="#252c28">Application</text><rect x="260" y="164" width="200" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="276" y="193" font-size="20" fill="#252c28">reserve</text><text x="276" y="219" font-size="17" fill="#626962">Incoming port</text><rect x="260" y="304" width="200" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="276" y="333" font-size="20" fill="#252c28">StockPort.take</text><text x="276" y="359" font-size="17" fill="#626962">Outgoing port</text><path d="M196 170H258" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M196 338H220V202H258" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 240V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="374" y="278" font-size="17" fill="#252c28">Calls</text><rect x="520" y="244" width="176" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="536" y="273" font-size="18" fill="#252c28">SQLite adapter</text><text x="536" y="299" font-size="16" fill="#626962">Real SQL</text><rect x="520" y="364" width="176" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="536" y="393" font-size="18" fill="#252c28">Memory</text><text x="536" y="419" font-size="16" fill="#626962">Test substitute</text><path d="M460 340H492V282H518" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M492 340V402H518" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="478" font-size="17" fill="#626962">Same operation for both drivers.</text><text x="396" y="478" font-size="17" fill="#626962">One storage adapter per run.</text><text x="24" y="516" font-size="17" fill="#252c28">Arrows: possible runtime calls.</text></svg>
