<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1392" viewBox="0 0 360 1392" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Resource, operation and time restrictions</title><desc id="desc">A ticket issued at virtual second 100 permits GET on exports/E7.zip until but not including second 160. GET for E8 and PUT for E7 are denied. Reuse and a new GET at second 159 succeed. A new GET at second 160 is denied. This is a request-admission window, not a promise to cancel an existing transfer.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1392" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Scope and expiry are enforced</text><text x="24" y="78" font-size="17" fill="#626962">Grant issued at virtual second 100.</text><rect x="24" y="112" width="312" height="168" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="146" font-size="20" fill="#252c28">Download</text><text x="40" y="178" font-size="18" fill="#626962">GET / E7</text><text x="40" y="216" font-size="18" fill="#252c28">Time: 100 s</text><text x="40" y="254" font-size="18" fill="#252c28">Result: archive E7</text><rect x="24" y="308" width="312" height="168" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="342" font-size="20" fill="#252c28">Other object</text><text x="40" y="374" font-size="18" fill="#626962">GET / E8</text><text x="40" y="412" font-size="18" fill="#252c28">Time: 100 s</text><text x="40" y="450" font-size="18" fill="#252c28">Result: denied</text><rect x="24" y="504" width="312" height="168" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="538" font-size="20" fill="#252c28">Wrong verb</text><text x="40" y="570" font-size="18" fill="#626962">PUT / E7</text><text x="40" y="608" font-size="18" fill="#252c28">Time: 100 s</text><text x="40" y="646" font-size="18" fill="#252c28">Result: denied</text><rect x="24" y="700" width="312" height="168" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="734" font-size="20" fill="#252c28">Reuse</text><text x="40" y="766" font-size="18" fill="#626962">GET / E7</text><text x="40" y="804" font-size="18" fill="#252c28">Time: 100 s</text><text x="40" y="842" font-size="18" fill="#252c28">Result: archive E7</text><rect x="24" y="896" width="312" height="168" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="930" font-size="20" fill="#252c28">Before expiry</text><text x="40" y="962" font-size="18" fill="#626962">GET / E7</text><text x="40" y="1000" font-size="18" fill="#252c28">Time: 159 s</text><text x="40" y="1038" font-size="18" fill="#252c28">Result: archive E7</text><rect x="24" y="1092" width="312" height="168" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1126" font-size="20" fill="#252c28">At expiry</text><text x="40" y="1158" font-size="18" fill="#626962">GET / E7</text><text x="40" y="1196" font-size="18" fill="#252c28">Time: 160 s</text><text x="40" y="1234" font-size="18" fill="#252c28">Result: denied</text><text x="24" y="1312" font-size="17" fill="#252c28">Reuse is allowed within the window.</text><text x="24" y="1352" font-size="18" fill="#626962">Expiry blocks a new read.</text></svg>
