<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1008" viewBox="0 0 720 1008" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Content-Based Router: ordered policy and threshold</title><desc id="desc">A valid physical express order for 100000 US dollar cents enters an ordered routing policy. The high-value rule matches before the express rule, selecting manual-review only. A physical express order for 99999 cents reaches priority-fulfillment instead. The selected channel is a decision, not proof that a consumer completed the work.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1008" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Overlapping rules need an explicit winner</text><rect x="24" y="100" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">A41: physical + express</text><text x="40" y="155" font-size="17" fill="#626962">99999 US dollar cents</text><rect x="384" y="100" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="129" font-size="20" fill="#252c28">A42: physical + express</text><text x="400" y="155" font-size="17" fill="#626962">100000 US dollar cents</text><path d="M180 212V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 212V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="320" width="672" height="224" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="352" font-size="20" fill="#252c28">orders-v1: first matching rule wins</text><text x="40" y="392" font-size="18" fill="#626962">1. cents ≥ 100000 → manual-review</text><text x="40" y="424" font-size="18" fill="#626962">2. digital → digital-delivery</text><text x="40" y="456" font-size="18" fill="#626962">3. physical + express → priority-fulfillment</text><text x="40" y="488" font-size="18" fill="#626962">4. physical → standard-fulfillment</text><text x="40" y="520" font-size="18" fill="#626962">5. otherwise → unclassified-review</text><path d="M360 544V620H180V702" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 620H540V702" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="596" font-size="18" fill="#252c28">A41: first rule false</text><text x="384" y="596" font-size="18" fill="#252c28">A42: first rule true</text><rect x="24" y="704" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="733" font-size="18" fill="#252c28">A41 → priority-fulfillment</text><text x="40" y="759" font-size="16" fill="#626962">The express-physical rule wins.</text><text x="40" y="798" font-size="17" fill="#626962">One selected output.</text><rect x="384" y="704" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="733" font-size="18" fill="#252c28">A42 → manual-review</text><text x="400" y="759" font-size="16" fill="#626962">Stop at the high-value rule.</text><text x="400" y="798" font-size="17" fill="#626962">No express forwarding.</text><text x="24" y="920" font-size="17" fill="#252c28">First-match precedence is this policy, not a universal router guarantee.</text><text x="24" y="960" font-size="17" fill="#626962">Selecting a channel does not prove delivery or business completion.</text></svg>
