<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1052" viewBox="0 0 360 1052" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Two application environments and request ownership across cutover</title><desc id="desc">Before cutover, the router sends new requests to blue version 1 while green version 2 is validated. After cutover, new requests go to green; an already admitted request can still complete on blue. The shared compatible data store remains outside the application-environment boundary.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1052" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Switch new traffic, drain old</text><text x="24" y="76" font-size="18" fill="#626962">Application environments only</text><rect x="24" y="108" width="312" height="300" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="146" font-size="22" fill="#252c28">Before: blue serves</text><rect x="40" y="172" width="280" height="64" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="212" font-size="22" fill="#252c28">Router</text><path d="M72 236V264" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="256" font-size="17" fill="#626962">New requests</text><rect x="40" y="268" width="280" height="80" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="56" y="302" font-size="22" fill="#252c28">Blue v1</text><text x="56" y="332" font-size="17" fill="#626962">Live application</text><text x="40" y="384" font-size="18" fill="#626962">Green v2: checks only</text><rect x="24" y="444" width="312" height="300" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="482" font-size="22" fill="#252c28">After: green serves</text><rect x="40" y="508" width="280" height="64" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="548" font-size="22" fill="#252c28">Router</text><path d="M72 572V600" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="592" font-size="17" fill="#626962">New requests</text><rect x="40" y="604" width="280" height="80" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="56" y="638" font-size="22" fill="#252c28">Green v2</text><text x="56" y="668" font-size="17" fill="#626962">Live application</text><text x="40" y="720" font-size="18" fill="#626962">Blue v1: drain old work</text><rect x="24" y="784" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="822" font-size="22" fill="#252c28">Shared data · schema 1</text><text x="40" y="862" font-size="16" fill="#252c28">Both versions remain compatible.</text><text x="40" y="902" font-size="17" fill="#626962">No data-copy switch modeled.</text><text x="24" y="974" font-size="18" fill="#252c28">Arrows route new requests.</text><text x="24" y="1014" font-size="18" fill="#626962">Old work keeps its owner.</text></svg>
