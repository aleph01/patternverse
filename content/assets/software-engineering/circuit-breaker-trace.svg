<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Warehouse writer trace with local rejections and recovery probes</title><desc id="desc">Six sequential calls use one retained breaker. Two failures at time zero open it; a third call at zero is rejected locally. A probe fails at 100 milliseconds and reopens until 200. A call at 199 is rejected; a successful probe at 200 closes the breaker. Only four calls reach the simulated dependency.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1080" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Local rejection and probe execution have different outcomes</text><rect x="24" y="104" width="672" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">One retained breaker / two counted failures / 100 ms cooldown</text><text x="40" y="159" font-size="17" fill="#626962">A failed probe at 100 ms sets the next test boundary to 200 ms.</text><text x="40" y="264" font-size="17" fill="#626962">Call</text><text x="112" y="264" font-size="17" fill="#626962">Time / ms</text><text x="232" y="264" font-size="17" fill="#626962">Admission</text><text x="432" y="264" font-size="17" fill="#626962">Outcome</text><text x="592" y="264" font-size="17" fill="#626962">State after</text><rect x="24" y="296" width="672" height="72" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="339" font-size="17" fill="#252c28">1</text><text x="112" y="339" font-size="17" fill="#252c28">0</text><text x="232" y="339" font-size="17" fill="#252c28">normal call</text><text x="432" y="339" font-size="17" fill="#626962">failure</text><text x="592" y="339" font-size="17" fill="#252c28">closed</text><rect x="24" y="384" width="672" height="72" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="427" font-size="17" fill="#252c28">2</text><text x="112" y="427" font-size="17" fill="#252c28">0</text><text x="232" y="427" font-size="17" fill="#252c28">normal call</text><text x="432" y="427" font-size="17" fill="#626962">failure</text><text x="592" y="427" font-size="17" fill="#252c28">open</text><rect x="24" y="472" width="672" height="72" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="515" font-size="17" fill="#252c28">3</text><text x="112" y="515" font-size="17" fill="#252c28">0</text><text x="232" y="515" font-size="17" fill="#252c28">local rejection</text><text x="432" y="515" font-size="17" fill="#626962">not invoked</text><text x="592" y="515" font-size="17" fill="#252c28">open</text><rect x="24" y="560" width="672" height="72" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="603" font-size="17" fill="#252c28">4</text><text x="112" y="603" font-size="17" fill="#252c28">100</text><text x="232" y="603" font-size="17" fill="#252c28">recovery probe</text><text x="432" y="603" font-size="17" fill="#626962">failure</text><text x="592" y="603" font-size="17" fill="#252c28">open</text><rect x="24" y="648" width="672" height="72" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="691" font-size="17" fill="#252c28">5</text><text x="112" y="691" font-size="17" fill="#252c28">199</text><text x="232" y="691" font-size="17" fill="#252c28">local rejection</text><text x="432" y="691" font-size="17" fill="#626962">not invoked</text><text x="592" y="691" font-size="17" fill="#252c28">open</text><rect x="24" y="736" width="672" height="72" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="779" font-size="17" fill="#252c28">6</text><text x="112" y="779" font-size="17" fill="#252c28">200</text><text x="232" y="779" font-size="17" fill="#252c28">recovery probe</text><text x="432" y="779" font-size="17" fill="#626962">written</text><text x="592" y="779" font-size="17" fill="#252c28">closed</text><rect x="24" y="896" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="928" font-size="20" fill="#252c28">Only four requests invoke the simulated dependency</text><text x="40" y="972" font-size="17" fill="#626962">The two local rejections add no dependency result or counted failure.</text><text x="40" y="1014" font-size="17" fill="#626962">Rows show request order; times are virtual milliseconds, not measurements.</text></svg>
