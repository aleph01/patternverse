<svg xmlns="http://www.w3.org/2000/svg" width="360" height="984" viewBox="0 0 360 984" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Message Translator: unsupported meaning and precision</title><desc id="desc">A known carrier status R and weight 1.250 kilograms produce a complete output with 1250 grams. Unknown state X produces a TranslationError without output. Weight 1.2505 kilograms would require 1250.5 grams, which the target cannot represent; it is rejected instead of rounded. Original input stays unchanged, and error retention belongs to the caller.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="984" fill="#fff"/><text x="24" y="32" font-size="20" fill="#252c28">Translate completely or report failure</text><rect x="24" y="104" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Valid code and precision</text><text x="40" y="159" font-size="17" fill="#626962">1.250 kg / state R</text><text x="40" y="198" font-size="17" fill="#626962">1250 g / ready_for_pickup</text><rect x="24" y="336" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="365" font-size="20" fill="#252c28">Unknown code</text><text x="40" y="391" font-size="17" fill="#626962">1.250 kg / state X</text><text x="40" y="430" font-size="17" fill="#626962">TranslationError; no target.</text><rect x="24" y="568" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="597" font-size="20" fill="#252c28">Unsupported precision</text><text x="40" y="623" font-size="17" fill="#626962">1.2505 kg / state R</text><text x="40" y="662" font-size="16" fill="#626962">1250.5 g cannot fit whole grams.</text><text x="40" y="706" font-size="17" fill="#626962">TranslationError; no target.</text><text x="24" y="832" font-size="17" fill="#252c28">Original input remains unchanged.</text><text x="24" y="876" font-size="17" fill="#626962">No status guessing or rounding.</text><text x="24" y="940" font-size="17" fill="#626962">Caller owns error retention.</text></svg>
