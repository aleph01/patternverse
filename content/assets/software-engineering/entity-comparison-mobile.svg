<svg xmlns="http://www.w3.org/2000/svg" width="360" height="888" viewBox="0 0 360 888" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Identity equality, attribute equality, and identifier scope</title><desc id="desc">Three comparisons distinguish identity from state: studio / 42 with Camera B and studio / 42 with Camera C identify the same entity; studio / 42 and studio / 43 with identical labels identify different entities; rental / 42 is different from studio / 42 because the catalog scope differs.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="888" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Compare Equipment identity</text><text x="24" y="60" font-size="22" fill="#252c28">separately from its state</text><text x="24" y="112" font-size="21" fill="#252c28">1 · Same identity</text><rect x="24" y="132" width="312" height="150" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="168" font-size="19" fill="#252c28">studio / 42 · Camera B</text><text x="40" y="204" font-size="19" fill="#252c28">studio / 42 · Camera C</text><text x="40" y="256" font-size="17" fill="#252c28">Equal identity; different state.</text><text x="24" y="350" font-size="21" fill="#252c28">2 · Different number</text><rect x="24" y="370" width="312" height="150" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="406" font-size="19" fill="#252c28">studio / 42 · Camera B</text><text x="40" y="442" font-size="19" fill="#252c28">studio / 43 · Camera B</text><text x="40" y="494" font-size="17" fill="#252c28">Same label; different entities.</text><text x="24" y="588" font-size="21" fill="#252c28">3 · Different catalog</text><rect x="24" y="608" width="312" height="150" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="644" font-size="19" fill="#252c28">studio / 42 · Camera B</text><text x="40" y="680" font-size="19" fill="#252c28">rental / 42 · Camera B</text><text x="40" y="732" font-size="17" fill="#252c28">Same number; different scope.</text><text x="24" y="820" font-size="18" fill="#252c28">Equal identity does not mean</text><text x="24" y="850" font-size="18" fill="#252c28">equal or current state.</text></svg>
