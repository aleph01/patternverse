<svg xmlns="http://www.w3.org/2000/svg" width="360" height="948" viewBox="0 0 360 948" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Logical layers and physical deployment tiers</title><desc id="desc">One deployment contains presentation, business logic, and price access in one process. A second deployment keeps presentation and business together but places price access in a separate service, requiring a network protocol.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="948" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Deployment is a</text><text x="24" y="59" font-size="22" fill="#252c28">separate choice</text><text x="24" y="104" font-size="22" fill="#252c28">One process</text><rect x="24" y="128" width="312" height="300" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="44" y="148" width="272" height="64" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="177" font-size="20" fill="#252c28">Presentation</text><rect x="44" y="244" width="272" height="64" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="273" font-size="20" fill="#252c28">Business logic</text><rect x="44" y="340" width="272" height="64" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="369" font-size="20" fill="#252c28">Price access</text><path d="M180 212V242" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 308V338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="464" font-size="18" fill="#626962">All three layers run together.</text><text x="24" y="522" font-size="22" fill="#252c28">Two tiers</text><rect x="24" y="546" width="312" height="184" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="44" y="566" width="272" height="58" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="595" font-size="20" fill="#252c28">Presentation</text><rect x="44" y="656" width="272" height="58" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="685" font-size="20" fill="#252c28">Business logic</text><path d="M180 624V654" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 714V834" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="198" y="788" font-size="17" fill="#252c28">Network call</text><rect x="24" y="836" width="312" height="82" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="865" font-size="20" fill="#252c28">Price-access service</text><text x="40" y="891" font-size="17" fill="#626962">Separate process</text></svg>
