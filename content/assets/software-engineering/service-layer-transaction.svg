<svg xmlns="http://www.w3.org/2000/svg" width="720" height="852" viewBox="0 0 720 852" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Service Layer coordinates commit and rollback</title><desc id="desc">The booking operation begins a write transaction, reads availability, applies the domain rule, updates remaining seats, and inserts the booking row. Commit makes both writes visible together. If the insert fails because a booking ID already exists, rollback restores the earlier capacity update and the caller receives an error.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="852" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One operation owns its local transaction</text><rect x="24" y="84" width="400" height="80" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">BEGIN IMMEDIATE</text><text x="40" y="139" font-size="17" fill="#626962">Acquire the write transaction before reading</text><rect x="24" y="224" width="400" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="253" font-size="20" fill="#252c28">Load + domain decision</text><text x="40" y="279" font-size="17" fill="#626962">3 seats − 2 booked = 1 remaining</text><rect x="24" y="364" width="400" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="393" font-size="20" fill="#252c28">UPDATE availability</text><text x="40" y="419" font-size="17" fill="#626962">First write: seats_left = 1</text><rect x="24" y="504" width="400" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="533" font-size="20" fill="#252c28">INSERT booking</text><text x="40" y="559" font-size="17" fill="#626962">Second write: unique booking ID</text><path d="M224 164V222" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M224 304V362" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M224 444V502" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="674" width="400" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="703" font-size="20" fill="#252c28">COMMIT</text><text x="40" y="729" font-size="17" fill="#626962">Return 1 remaining seat</text><path d="M224 584V672" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="240" y="634" font-size="17" fill="#626962">success</text><rect x="472" y="504" width="224" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="488" y="534" font-size="18" fill="#252c28">Duplicate booking ID</text><text x="488" y="568" font-size="20" fill="#252c28">ROLLBACK</text><text x="488" y="600" font-size="17" fill="#626962">Restore first write</text><path d="M424 544H470" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="438" y="484" font-size="16" fill="#626962">error</text><text x="472" y="690" font-size="18" fill="#252c28">Error to caller</text><text x="472" y="722" font-size="17" fill="#626962">No writes retained</text><text x="24" y="820" font-size="18" fill="#252c28">Green: successful sequence · dashed: insert failure and rollback</text></svg>
