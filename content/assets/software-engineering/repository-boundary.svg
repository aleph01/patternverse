<svg xmlns="http://www.w3.org/2000/svg" width="720" height="844" viewBox="0 0 720 844" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Repository keeps storage behind domain-oriented access</title><desc id="desc">Application code asks the Workshops repository for workshops with room for two attendees. Either the memory implementation filters stored Workshop objects or the SQLite implementation queries rows and constructs Workshop objects. The caller receives the same ordered domain-level result without seeing SQL or cursors.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="844" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One domain contract, different storage</text><rect x="24" y="84" width="672" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">Application caller</text><text x="40" y="139" font-size="17" fill="#626962">repo.with_room_for(2)</text><path d="M360 172V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="248" width="672" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="277" font-size="20" fill="#252c28">Workshops access contract</text><text x="40" y="303" font-size="17" fill="#626962">add(Workshop) · get(id) · with_room_for(seats)</text><rect x="24" y="454" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="483" font-size="20" fill="#252c28">MemoryWorkshops</text><text x="40" y="509" font-size="17" fill="#626962">Filter Workshops; order by ID</text><rect x="384" y="454" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="483" font-size="20" fill="#252c28">SqliteWorkshops</text><text x="400" y="509" font-size="17" fill="#626962">Query rows → Workshop objects</text><path d="M180 348V452" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 348V452" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="654" width="672" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="683" font-size="20" fill="#252c28">Same domain result</text><text x="40" y="709" font-size="17" fill="#626962">Workshop A: 2 seats · Workshop B: 3 seats</text><path d="M180 574V612H280V652" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><path d="M540 574V612H440V652" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="24" y="808" font-size="18" fill="#252c28">Solid: call the chosen adapter · dashed: return domain objects</text></svg>
