<svg xmlns="http://www.w3.org/2000/svg" width="720" height="888" viewBox="0 0 720 888" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Checkout test scenarios and observable outcomes</title><desc id="desc">Four checkout scenarios use a fresh gateway double. Approval returns accepted:r-17 and refusal returns declined, each after one charge call. Zero cents raises ValueError with no charge call. TimeoutError propagates after one attempted call and does not mean declined.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="888" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">One real checkout, four controlled scenarios</text><text x="24" y="84" font-size="19" fill="#626962">Test amount: 2500 USD cents, except the zero boundary.</text><text x="40" y="136" font-size="18" fill="#626962">Double behavior</text><text x="352" y="136" font-size="18" fill="#626962">Checkout outcome</text><text x="568" y="136" font-size="18" fill="#626962">Interaction</text><rect x="24" y="164" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="204" font-size="22" fill="#252c28">Approval</text><text x="40" y="252" font-size="18" fill="#626962">Return r-17</text><text x="352" y="236" font-size="20" fill="#252c28">accepted:r-17</text><text x="568" y="236" font-size="17" fill="#252c28">1 charge call</text><rect x="24" y="312" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="352" font-size="22" fill="#252c28">Refusal</text><text x="40" y="400" font-size="18" fill="#626962">Raise Declined</text><text x="352" y="384" font-size="20" fill="#252c28">declined</text><text x="568" y="384" font-size="17" fill="#252c28">1 charge call</text><rect x="24" y="460" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="500" font-size="22" fill="#252c28">Zero cents</text><text x="40" y="548" font-size="18" fill="#626962">No reply needed</text><text x="352" y="532" font-size="20" fill="#252c28">ValueError</text><text x="568" y="532" font-size="17" fill="#252c28">0 charge calls</text><rect x="24" y="608" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="648" font-size="22" fill="#252c28">Lost reply</text><text x="40" y="696" font-size="18" fill="#626962">Raise TimeoutError</text><text x="352" y="680" font-size="20" fill="#252c28">TimeoutError</text><text x="568" y="680" font-size="17" fill="#252c28">1 charge call</text><text x="24" y="806" font-size="19" fill="#252c28">Timeout does not establish whether the provider charged.</text><text x="24" y="848" font-size="18" fill="#626962">A passing double-based test cannot prove provider behavior.</text></svg>
