<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Request-Reply: correlation and return address</title><desc id="desc">The desk sends inventory requests desk:1 and desk:2 with the return address desk.replies. The inventory service sends replies to that inbox, copying each request ID into its reply correlation ID. Reply desk:2 arrives before desk:1; the desk selects the matching pending context by ID rather than arrival order.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1040" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Reply identity is independent of arrival order</text><path d="M164 192V900" fill="none" stroke="#a6aca3" stroke-width="1" stroke-dasharray="4 6"/><path d="M556 192V900" fill="none" stroke="#a6aca3" stroke-width="1" stroke-dasharray="4 6"/><rect x="24" y="88" width="280" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="117" font-size="20" fill="#252c28">Checkout desk</text><text x="40" y="143" font-size="17" fill="#626962">inbox: desk.replies</text><rect x="416" y="88" width="280" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="432" y="117" font-size="20" fill="#252c28">Inventory service</text><text x="432" y="143" font-size="17" fill="#626962">Queries book and shoe stock.</text><text x="214" y="234" font-size="18" fill="#252c28">request desk:1 / book</text><text x="214" y="258" font-size="17" fill="#626962">reply_to: desk.replies</text><path d="M164 280H556" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="214" y="356" font-size="18" fill="#252c28">request desk:2 / shoe</text><text x="214" y="380" font-size="17" fill="#626962">reply_to: desk.replies</text><path d="M164 402H556" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="214" y="516" font-size="18" fill="#252c28">reply desk:2 / 8 units</text><text x="214" y="540" font-size="17" fill="#626962">correlation = desk:2</text><path d="M556 562H164" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="594" width="280" height="80" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="623" font-size="20" fill="#252c28">Complete desk:2</text><text x="40" y="649" font-size="17" fill="#626962">desk:1 remains pending.</text><text x="214" y="724" font-size="18" fill="#252c28">reply desk:1 / 3 units</text><text x="214" y="748" font-size="17" fill="#626962">correlation = desk:1</text><path d="M556 770H164" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="802" width="280" height="80" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="831" font-size="20" fill="#252c28">Complete desk:1</text><text x="40" y="857" font-size="17" fill="#626962">The later reply matches by ID.</text><text x="24" y="948" font-size="18" fill="#252c28">Time moves down; solid arrows carry messages.</text><text x="24" y="990" font-size="17" fill="#626962">A reply address routes the message. Its ID identifies the conversation.</text></svg>
