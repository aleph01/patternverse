<svg xmlns="http://www.w3.org/2000/svg" width="720" height="752" viewBox="0 0 720 752" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A stable seam directs capabilities to different implementations</title><desc id="desc">During migration, clients keep using one entry point. Its routing seam sends the catalog capability to the replacement and the invoice capability to the legacy implementation. The request selects one owner; no error path automatically sends it to both.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="752" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Transfer one capability through a controlled seam</text><text x="24" y="84" font-size="19" fill="#626962">During migration: catalog has moved; invoices have not.</text><rect x="24" y="116" width="672" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="152" font-size="22" fill="#252c28">Clients</text><text x="40" y="186" font-size="19" fill="#626962">Stable entry point and public operation contracts</text><path d="M360 204V280" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="384" y="250" font-size="18" fill="#626962">requests</text><rect x="24" y="284" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="326" font-size="22" fill="#252c28">Controlled routing seam</text><text x="40" y="370" font-size="20" fill="#252c28">invoices → legacy · catalog → replacement</text><path d="M180 396V472" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="440" font-size="18" fill="#626962">invoices</text><path d="M540 396V472" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="564" y="440" font-size="18" fill="#626962">catalog</text><rect x="24" y="476" width="312" height="132" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="518" font-size="22" fill="#252c28">Legacy system</text><text x="40" y="558" font-size="19" fill="#252c28">Owns invoice capability</text><text x="40" y="594" font-size="18" fill="#626962">Catalog path displaced</text><rect x="384" y="476" width="312" height="132" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="518" font-size="22" fill="#252c28">Replacement</text><text x="400" y="558" font-size="19" fill="#252c28">Owns catalog capability</text><text x="400" y="594" font-size="18" fill="#626962">Errors stay on this path</text><text x="24" y="668" font-size="19" fill="#252c28">One handler per request; replacement failure does not select legacy.</text><text x="24" y="712" font-size="18" fill="#626962">Retire old paths after dependency and recovery obligations are resolved.</text></svg>
