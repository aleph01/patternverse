<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Guard both writes and release with current ownership</title><desc id="desc">After Alice's ownership ends, Bob acquires the note using a fresh token. A late save using Alice's old token matches no ownership row and is rejected. A late cancellation using that token cannot remove Bob's lock. Bob can still save or cancel his own reservation.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="800" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Old ownership cannot replace a new acquisition</text><rect x="24" y="84" width="672" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">New acquisition: note 1 now belongs to token B</text><text x="40" y="139" font-size="17" fill="#626962">Earlier token A has been released or revoked.</text><rect x="24" y="296" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="325" font-size="20" fill="#252c28">Late save with token A</text><text x="40" y="351" font-size="17" fill="#626962">Owner check matches zero.</text><text x="40" y="400" font-size="17" fill="#626962">Reject; title unchanged.</text><rect x="384" y="296" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="325" font-size="20" fill="#252c28">Late cancel with token A</text><text x="400" y="351" font-size="17" fill="#626962">DELETE matches zero.</text><text x="400" y="400" font-size="17" fill="#626962">Keep B’s lock.</text><path d="M180 172V294" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 172V294" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="572" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="601" font-size="20" fill="#252c28">B remains the owner</text><text x="40" y="627" font-size="17" fill="#626962">Only the current handle can save or cancel.</text><path d="M180 436V570" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 436V570" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="756" font-size="17" fill="#626962">Token is per acquisition; username alone is insufficient.</text></svg>
