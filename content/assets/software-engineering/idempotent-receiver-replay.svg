<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1048" viewBox="0 0 720 1048" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Idempotent Receiver: stable receipt identity</title><desc id="desc">Warehouse event E901 adds 40 mug units and records its processed identity in the same database transaction. The acknowledgment is lost. Redelivery with the same consumer, source, event ID, SKU, and quantity finds the committed record and leaves stock at 40. A distinct event E902 can legitimately add another 40.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1048" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A replay repeats delivery, not the stock change</text><text x="24" y="86" font-size="19" fill="#626962">Consumer: stock-receipts / source: warehouse-a</text><rect x="24" y="144" width="672" height="192" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="180" font-size="22" fill="#252c28">First E901: MUG / 40 physical units</text><text x="40" y="230" font-size="20" fill="#626962">One commit: processed(E901, MUG, 40) + stock 0 → 40</text><text x="40" y="290" font-size="19" fill="#626962">Return: applied. Acknowledgment is lost after commit.</text><path d="M360 336V414" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="382" font-size="17" fill="#626962">redelivery</text><rect x="24" y="416" width="672" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="445" font-size="20" fill="#252c28">Same E901 + same payload</text><text x="40" y="471" font-size="17" fill="#626962">Find the committed identity; do not add 40 again.</text><text x="40" y="546" font-size="20" fill="#626962">Return: duplicate / stock: 40 units</text><rect x="24" y="704" width="672" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="733" font-size="20" fill="#252c28">Later E902: a distinct receipt</text><text x="40" y="759" font-size="17" fill="#626962">Same MUG / 40 units; different intended operation.</text><text x="40" y="816" font-size="20" fill="#626962">One commit: stock 40 → 80 / return: applied</text><text x="24" y="952" font-size="18" fill="#252c28">Identity stays stable across retries, while independent receipts stay distinct.</text><text x="24" y="992" font-size="18" fill="#626962">The arrow means another delivery of E901, not a second physical shipment.</text></svg>
