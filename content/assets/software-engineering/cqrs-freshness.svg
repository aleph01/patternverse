<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">CQRS: query freshness and authoritative command validation</title><desc id="desc">An availability DTO reports two remaining seats at version zero. A later booking command commits both seats and advances the stored version to one. The old DTO still reports two. A new command for one seat validates current state and rejects it; a fresh query reports zero, sold out, version one.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1000" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Use current state to decide the next command</text><rect x="24" y="112" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Old query DTO / version 0</text><text x="40" y="167" font-size="17" fill="#626962">Remaining: 2 / status: available</text><rect x="384" y="112" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="141" font-size="20" fill="#252c28">Authoritative state / version 0</text><text x="400" y="167" font-size="17" fill="#626962">Capacity: 2 / booked: 0</text><path d="M180 256V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="308" font-size="16" fill="#626962">keep snapshot</text><path d="M540 256V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="308" font-size="17" fill="#626962">book 2</text><rect x="24" y="352" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="381" font-size="20" fill="#252c28">Kept DTO / still version 0</text><text x="40" y="407" font-size="17" fill="#626962">Remaining: 2 / status: available</text><text x="40" y="484" font-size="17" fill="#626962">An earlier observation stays old.</text><rect x="384" y="352" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="381" font-size="20" fill="#252c28">BookSeats(2) commits</text><text x="400" y="407" font-size="17" fill="#626962">Booked: 2 / version: 1</text><text x="400" y="484" font-size="18" fill="#626962">Authoritative remaining: 0</text><path d="M540 528V584H180V638" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 584V638" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="600" font-size="16" fill="#626962">SELECT</text><rect x="24" y="640" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="669" font-size="20" fill="#252c28">BookSeats(1) rejects</text><text x="40" y="695" font-size="17" fill="#626962">Checks the current write state.</text><text x="40" y="760" font-size="19" fill="#626962">Insufficient seats</text><rect x="384" y="640" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="669" font-size="20" fill="#252c28">New query / version 1</text><text x="400" y="695" font-size="17" fill="#626962">0 remaining / sold out</text><text x="400" y="760" font-size="18" fill="#626962">DTO derived after commit</text><text x="24" y="904" font-size="17" fill="#252c28">Arrows: retention, committed change, command validation, and a new query.</text><text x="24" y="944" font-size="18" fill="#626962">A returned answer is an observation, not authority to allocate seats.</text></svg>
