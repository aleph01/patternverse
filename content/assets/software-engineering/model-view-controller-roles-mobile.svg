<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1384" viewBox="0 0 360 1384" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">MVC separates interaction, model behavior, and presentation</title><desc id="desc">User input reaches a controller, which translates reserve or cancel into a model operation. The model owns reservation state and capacity rules. After the operation, the composition code takes one snapshot and passes it to two views: a reserved-seat summary and a free-seat display. The controller does not format either view.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1384" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Three roles,</text><text x="24" y="60" font-size="22" fill="#252c28">one state owner</text><rect x="24" y="104" width="312" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">User action</text><text x="40" y="159" font-size="17" fill="#626962">reserve; digit text: 2</text><rect x="24" y="280" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="309" font-size="20" fill="#252c28">Controller: input</text><text x="40" y="335" font-size="17" fill="#626962">Parse count; choose operation.</text><text x="40" y="390" font-size="17" fill="#626962">No view formatting.</text><path d="M180 192V278" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="528" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="557" font-size="20" fill="#252c28">Model: state + rules</text><text x="40" y="583" font-size="17" fill="#626962">0 ≤ reserved ≤ capacity</text><text x="40" y="638" font-size="17" fill="#626962">Only valid changes mutate.</text><path d="M180 424V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="478" font-size="17" fill="#626962">invoke operation</text><rect x="24" y="768" width="312" height="124" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="797" font-size="20" fill="#252c28">Composition: one snapshot</text><text x="40" y="823" font-size="17" fill="#626962">Explicit refresh after action.</text><path d="M180 672V766" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="724" font-size="17" fill="#626962">snapshot result</text><text x="24" y="974" font-size="18" fill="#252c28">Views</text><rect x="8" y="1000" width="344" height="280" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><path d="M180 892V998" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="948" font-size="17" fill="#626962">render</text><rect x="24" y="1032" width="312" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1061" font-size="20" fill="#252c28">Summary view</text><text x="40" y="1087" font-size="17" fill="#626962">Reserved: 2/3</text><rect x="24" y="1160" width="312" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1189" font-size="20" fill="#252c28">Availability view</text><text x="40" y="1215" font-size="17" fill="#626962">Free: 1</text><text x="24" y="1336" font-size="18" fill="#252c28">Both read the same snapshot.</text></svg>
