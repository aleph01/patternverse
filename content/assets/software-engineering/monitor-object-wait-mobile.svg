<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1256" viewBox="0 0 360 1256" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Monitor Object wait and notification</title><desc id="desc">A consumer finds an empty inbox, waits, and releases the lock. A producer acquires it, inserts one item, and notifies while retaining the lock. Only after the producer releases can the consumer reacquire. The consumer rechecks the predicate before removing an item, or waits again if it is still false.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1256" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Notify, reacquire, recheck</text><rect x="24" y="112" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">1 / consumer owns lock</text><text x="40" y="167" font-size="16" fill="#626962">Inbox empty; get cannot proceed.</text><text x="40" y="222" font-size="15" fill="#626962">Must wait without keeping the lock.</text><path d="M180 256V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="320" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="349" font-size="18" fill="#252c28">2 / consumer waits</text><text x="40" y="375" font-size="16" fill="#626962">wait releases the monitor lock.</text><text x="40" y="430" font-size="16" fill="#626962">The caller remains suspended.</text><path d="M180 464V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="528" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="557" font-size="18" fill="#252c28">3 / producer owns lock</text><text x="40" y="583" font-size="16" fill="#626962">Insert an item; call notify_all().</text><text x="40" y="638" font-size="16" fill="#626962">Lock remains held during notify.</text><path d="M180 672V734" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="736" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="765" font-size="18" fill="#252c28">4 / producer returns</text><text x="40" y="791" font-size="16" fill="#626962">Exit releases the monitor lock.</text><text x="40" y="846" font-size="15" fill="#626962">Notified waiters may now compete.</text><path d="M180 880V942" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="944" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="973" font-size="18" fill="#252c28">5 / consumer owns lock</text><text x="40" y="999" font-size="16" fill="#626962">Reacquire and check state again.</text><text x="40" y="1054" font-size="17" fill="#626962">If no item, repeat waiting.</text><text x="24" y="1172" font-size="16" fill="#626962">Arrows: one explanatory event trace.</text><text x="24" y="1212" font-size="15" fill="#626962">A notification does not reserve an item.</text></svg>
