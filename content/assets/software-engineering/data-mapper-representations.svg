<svg xmlns="http://www.w3.org/2000/svg" width="720" height="672" viewBox="0 0 720 672" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Data Mapper translates object and row representations</title><desc id="desc">An Appointment contains a TimeSlot with start minute 540 and end minute 570. AppointmentMapper translates that object into an appointments row with appointment_key A-7, begin_minute 540, and duration_minutes 30. On loading, the mapper reconstructs the end as start plus duration. The model has no dependency on the mapper or SQL.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="672" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Objects and rows can have different shapes</text><rect x="24" y="104" width="280" height="240" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="140" font-size="22" fill="#252c28">Appointment</text><text x="40" y="178" font-size="18" fill="#252c28">id: A-7</text><rect x="44" y="200" width="240" height="124" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="234" font-size="20" fill="#252c28">TimeSlot</text><text x="60" y="270" font-size="18" fill="#252c28">start: 540</text><text x="60" y="304" font-size="18" fill="#252c28">end: 570</text><rect x="416" y="104" width="280" height="240" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="432" y="140" font-size="22" fill="#252c28">appointments row</text><text x="432" y="186" font-size="18" fill="#252c28">appointment_key: A-7</text><text x="432" y="232" font-size="18" fill="#252c28">begin_minute: 540</text><text x="432" y="278" font-size="18" fill="#252c28">duration_minutes: 30</text><path d="M304 184H414" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="334" y="162" font-size="17" fill="#626962">write</text><path d="M416 264H306" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="338" y="242" font-size="17" fill="#626962">read</text><rect x="24" y="424" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="464" font-size="22" fill="#252c28">AppointmentMapper knows both representations</text><text x="44" y="504" font-size="19" fill="#252c28">Write: duration = end − start = 30</text><text x="44" y="542" font-size="19" fill="#252c28">Read: end = start + duration = 570</text><text x="24" y="636" font-size="18" fill="#252c28">Model imports no mapper, SQL, or table definitions.</text></svg>
