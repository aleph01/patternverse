<svg xmlns="http://www.w3.org/2000/svg" width="720" height="724" viewBox="0 0 720 724" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Service Layer coordinates one application boundary</title><desc id="desc">A web adapter and a command-line adapter both call book on the service layer. The service coordinates loading, invoking Workshop.after_booking, writing availability and the booking record, then committing. Workshop owns the capacity rule; SQLite owns persistence and locking.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="724" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One application operation, different callers</text><rect x="24" y="84" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">Web adapter</text><text x="40" y="139" font-size="17" fill="#626962">Parse fields / present response</text><rect x="384" y="84" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="113" font-size="20" fill="#252c28">Command-line adapter</text><text x="400" y="139" font-size="17" fill="#626962">Parse arguments / print result</text><path d="M180 184V216H280V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 184V216H440V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="248" width="672" height="136" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="282" font-size="23" fill="#252c28">Service Layer · book</text><text x="44" y="324" font-size="20" fill="#252c28">Load → invoke model → write both changes → commit</text><text x="44" y="360" font-size="18" fill="#626962">Return remaining seats after a successful commit</text><rect x="24" y="484" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="513" font-size="20" fill="#252c28">Workshop.after_booking</text><text x="40" y="539" font-size="17" fill="#626962">Owns the capacity rule</text><rect x="384" y="484" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="513" font-size="20" fill="#252c28">SQLite</text><text x="400" y="539" font-size="17" fill="#626962">Owns locking and persistence</text><path d="M180 384V482" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 384V482" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="442" font-size="17" fill="#626962">invoke</text><text x="556" y="442" font-size="17" fill="#626962">read / write</text><text x="24" y="648" font-size="18" fill="#252c28">Arrows: calls to collaborators, not separate deployments.</text><text x="24" y="688" font-size="18" fill="#626962">One service operation does not itself create atomicity.</text></svg>
