<svg xmlns="http://www.w3.org/2000/svg" width="720" height="872" viewBox="0 0 720 872" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Limited serving exposure and three evidence-gated outcomes</title><desc id="desc">A router assigns a limited share of real requests to the candidate and the remainder to the incumbent. Separate release metrics reach an evidence gate that chooses expansion, a bounded hold, or restoration of future traffic.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="872" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Evaluate the release, then change exposure</text><text x="24" y="80" font-size="18" fill="#626962">Example: a 10% candidate stage · real user responses</text><rect x="24" y="112" width="672" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="150" font-size="22" fill="#252c28">Router · stable assignment for this stage</text><text x="40" y="180" font-size="18" fill="#252c28">100 requests: 10 candidate, 90 incumbent</text><path d="M180 192V264" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 192V264" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="236" font-size="18" fill="#626962">90 requests</text><text x="400" y="236" font-size="18" fill="#626962">10 requests</text><rect x="24" y="268" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="306" font-size="22" fill="#252c28">Incumbent</text><text x="40" y="346" font-size="18" fill="#626962">Serves remaining real work</text><rect x="384" y="268" width="312" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="306" font-size="22" fill="#252c28">Candidate</text><text x="400" y="346" font-size="18" fill="#626962">Serves limited real work</text><path d="M180 372V444" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 372V444" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="230" y="416" font-size="18" fill="#626962">Separate release metrics</text><rect x="24" y="448" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="486" font-size="22" fill="#252c28">Evidence gate · predefined policy</text><text x="40" y="526" font-size="18" fill="#252c28">Serving health + outcomes + enough trustworthy observation</text><text x="40" y="560" font-size="17" fill="#626962">No evidence is not a passing result.</text><path d="M128 576V648" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 576V648" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M592 576V648" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="652" width="208" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="690" font-size="18" fill="#252c28">Advance / promote</text><text x="40" y="732" font-size="17" fill="#252c28">Next planned stage</text><text x="40" y="764" font-size="16" fill="#626962">Retain recovery option</text><rect x="256" y="652" width="208" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="272" y="690" font-size="22" fill="#252c28">Hold</text><text x="272" y="732" font-size="17" fill="#252c28">Keep current share</text><text x="272" y="764" font-size="16" fill="#626962">Bound the observation</text><rect x="488" y="652" width="208" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="504" y="690" font-size="22" fill="#252c28">Restore</text><text x="504" y="732" font-size="17" fill="#252c28">Future share → 0%</text><text x="504" y="764" font-size="16" fill="#626962">Prior effects remain</text><text x="24" y="832" font-size="18" fill="#252c28">Restoration requires a healthy, compatible incumbent with capacity.</text></svg>
