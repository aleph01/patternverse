<svg xmlns="http://www.w3.org/2000/svg" width="360" height="950" viewBox="0 0 360 950" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One specification reused for selection and validation</title><desc id="desc">The print-queue selector and manual-release validator both call is_satisfied_by on the same eligible-for-print specification. The candidate is a PrintJob snapshot, and the result is a Boolean. The specification defines acceptance while callers decide what to do with the result.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="950" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">One criterion,</text><text x="24" y="60" font-size="22" fill="#252c28">two callers</text><rect x="24" y="104" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Queue selection</text><text x="40" y="159" font-size="17" fill="#626962">Keep every matching job</text><rect x="24" y="236" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="265" font-size="20" fill="#252c28">Release validation</text><text x="40" y="291" font-size="17" fill="#626962">Check one proposed job</text><rect x="44" y="392" width="272" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="421" font-size="18" fill="#252c28">eligible · Specification</text><text x="60" y="447" font-size="16" fill="#626962">is_satisfied_by(job)</text><path d="M180 180V200H12V442H42" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 312V390" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="572" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="601" font-size="20" fill="#252c28">PrintJob snapshot</text><text x="40" y="627" font-size="17" fill="#626962">Data without this policy</text><path d="M180 572V494" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="540" font-size="17" fill="#626962">input</text><rect x="24" y="752" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="781" font-size="20" fill="#252c28">True or False</text><text x="40" y="807" font-size="17" fill="#626962">Caller decides what to do</text><path d="M316 442H348V802H338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="252" y="724" font-size="17" fill="#626962">return</text><text x="24" y="922" font-size="17" fill="#626962">Same rule for filtering and validation.</text></svg>
