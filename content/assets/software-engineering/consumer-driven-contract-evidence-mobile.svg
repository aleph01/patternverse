<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1160" viewBox="0 0 360 1160" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Response matching and version-specific compatibility evidence</title><desc id="desc">For reader-3, an original provider response with available equal to seven and unit EA passes. Adding an unused zone field also passes. Renaming available to quantity fails. A separate version matrix shows reader-3 with provider-8 passing, reader-3 with provider-9 failing, and an unverified reader-4/provider-8 pair remaining unknown.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1160" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Match, then check versions</text><text x="24" y="84" font-size="18" fill="#626962">Runnable example: reader-3 contract</text><rect x="24" y="112" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="146" font-size="20" fill="#252c28">Original</text><text x="40" y="182" font-size="17" fill="#626962">available: 7 · unit: EA</text><text x="40" y="220" font-size="21" fill="#252c28">compatible</text><rect x="24" y="260" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="294" font-size="20" fill="#252c28">Unused field added</text><text x="40" y="330" font-size="17" fill="#626962">Same fields + zone: A3</text><text x="40" y="368" font-size="21" fill="#252c28">compatible</text><rect x="24" y="408" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="442" font-size="20" fill="#252c28">Required name changed</text><text x="40" y="478" font-size="17" fill="#626962">quantity replaces available</text><text x="40" y="516" font-size="21" fill="#252c28">incompatible</text><text x="24" y="602" font-size="19" fill="#626962">Illustrative release evidence</text><rect x="24" y="632" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="670" font-size="20" fill="#252c28">reader-3 + provider-8</text><text x="40" y="712" font-size="21" fill="#252c28">verified pass</text><rect x="24" y="768" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="806" font-size="20" fill="#252c28">reader-3 + provider-9</text><text x="40" y="848" font-size="21" fill="#252c28">verified fail</text><rect x="24" y="904" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="942" font-size="20" fill="#252c28">reader-4 + provider-8</text><text x="40" y="984" font-size="21" fill="#252c28">unknown</text><text x="24" y="1082" font-size="18" fill="#252c28">Unknown is not a passing result.</text><text x="24" y="1122" font-size="18" fill="#626962">Check versions that will coexist.</text></svg>
