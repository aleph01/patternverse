<svg xmlns="http://www.w3.org/2000/svg" width="360" height="920" viewBox="0 0 360 920" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One shared stream, two active consumers</title><desc id="desc">One thumbnail work queue contains jobs J1, J2, and J3. Consumer A receives J1 while consumer B receives J2. J3 remains ready until a consumer requests more work. These workers divide one logical stream; they do not each receive every job.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="920" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">One stream, two workers</text><text x="24" y="78" font-size="17" fill="#626962">Snapshot after two receives.</text><rect x="24" y="112" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="21" fill="#252c28">Shared work queue</text><text x="40" y="184" font-size="20" fill="#252c28">J3 remains ready</text><text x="40" y="210" font-size="17" fill="#626962">J1 and J2 have been delivered.</text><path d="M72 224V336" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="286" font-size="18" fill="#252c28">J1 / token 1 → A</text><rect x="24" y="340" width="312" height="124" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="376" font-size="22" fill="#252c28">Consumer A</text><text x="40" y="414" font-size="20" fill="#252c28">Holds J1 / token 1</text><text x="40" y="446" font-size="17" fill="#626962">Thumbnail handler</text><path d="M312 224V242H348V598H338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="506" font-size="18" fill="#252c28">J2 / token 2 → B</text><rect x="24" y="536" width="312" height="124" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="572" font-size="22" fill="#252c28">Consumer B</text><text x="40" y="610" font-size="20" fill="#252c28">Holds J2 / token 2</text><text x="40" y="642" font-size="17" fill="#626962">Thumbnail handler</text><rect x="24" y="708" width="312" height="172" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="744" font-size="19" fill="#252c28">One recipient per delivery.</text><text x="40" y="784" font-size="17" fill="#626962">B can acknowledge J2, then</text><text x="40" y="814" font-size="17" fill="#626962">receive J3 while A holds J1.</text><text x="40" y="854" font-size="16" fill="#626962">Equal work shares are not promised.</text></svg>
