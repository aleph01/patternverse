<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1104" viewBox="0 0 720 1104" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Lease knowledge and effect boundaries</title><desc id="desc">A sends a renewal request but receives no reply. The authority may have renewed it, so A's local knowledge is uncertain. Separately, an expired grant can be replaced while A's process still runs. External writes need enforcement at their destination.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1104" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Authority, client knowledge, and external effects</text><rect x="24" y="112" width="296" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Client A</text><text x="40" y="167" font-size="17" fill="#626962">Sends renewal; awaits reply.</text><text x="40" y="222" font-size="18" fill="#626962">No reply is received.</text><rect x="400" y="112" width="296" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="416" y="141" font-size="20" fill="#252c28">Authority</text><text x="416" y="167" font-size="17" fill="#626962">May commit the renewal.</text><text x="416" y="222" font-size="17" fill="#626962">Reply can be lost or delayed.</text><path d="M320 164H398" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="324" y="146" font-size="15" fill="#626962">request</text><rect x="24" y="352" width="672" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="386" font-size="22" fill="#252c28">Client knowledge: outcome unknown</text><text x="40" y="430" font-size="19" fill="#626962">A timeout does not prove the renewal was rejected.</text><text x="40" y="470" font-size="18" fill="#626962">Do not extend permission just because a request was sent.</text><path d="M172 256V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="592" width="672" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="626" font-size="22" fill="#252c28">Authority expiry is a separate event</text><text x="40" y="670" font-size="19" fill="#626962">After expiry a replacement can acquire the right.</text><text x="40" y="710" font-size="18" fill="#626962">A may still execute code and its delayed I/O may still arrive.</text><rect x="24" y="832" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="861" font-size="20" fill="#252c28">External destination: enforce authority where effects occur</text><text x="40" y="887" font-size="17" fill="#626962">Use fencing or an equivalent atomic mechanism for obsolete writers.</text><text x="40" y="942" font-size="18" fill="#626962">Lease expiry does not cancel an independent write.</text><text x="24" y="1058" font-size="17" fill="#626962">Arrows: renewal request and client uncertainty, not a clock protocol.</text></svg>
