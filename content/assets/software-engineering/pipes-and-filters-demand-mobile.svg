<svg xmlns="http://www.w3.org/2000/svg" width="360" height="792" viewBox="0 0 360 792" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Downstream data and upstream demand in the generator example</title><desc id="desc">Solid arrows carry data from the CSV source through the filter chain to the consumer. Dashed arrows carry requests for the next result upstream. The first result consumes the 18 °C and 25 °C records; the 30 °C record waits for another request.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="demand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="792" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Demand pulls upstream;</text><text x="24" y="60" font-size="22" fill="#252c28">data moves downstream</text><rect x="44" y="126" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="155" font-size="20" fill="#252c28">CSV source</text><text x="60" y="181" font-size="17" fill="#626962">18, 25, 30 °C</text><rect x="44" y="314" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="343" font-size="20" fill="#252c28">Filter chain</text><text x="60" y="369" font-size="17" fill="#626962">Four generators</text><rect x="44" y="502" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="531" font-size="20" fill="#252c28">Consumer</text><text x="60" y="557" font-size="17" fill="#626962">next() / print</text><path d="M244 202V312" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="260" y="260" font-size="17" fill="#252c28">CSV</text><path d="M116 314V204" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#demand)"/><text x="50" y="260" font-size="17" fill="#252c28">next()</text><path d="M244 390V500" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="260" y="448" font-size="17" fill="#252c28">text</text><path d="M116 502V392" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#demand)"/><text x="50" y="448" font-size="17" fill="#252c28">next()</text><text x="24" y="632" font-size="17" fill="#252c28">First result consumes two records.</text><text x="24" y="664" font-size="17" fill="#252c28">18 °C is dropped; 25 °C becomes 77 °F.</text><text x="24" y="708" font-size="17" fill="#626962">30 °C waits for the next request.</text><text x="24" y="764" font-size="17" fill="#626962">Solid: data · dashed: demand</text></svg>
