<svg xmlns="http://www.w3.org/2000/svg" width="720" height="816" viewBox="0 0 720 816" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Equivalent reads share active work</title><desc id="desc">Callers A, B, and C use the same complete price-read key and join one active loader. The loader produces 1200 USD cents, which can satisfy each still-waiting caller. A different key starts separate work. The registry tracks active work rather than retained price values.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="816" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Equivalent reads share active work</text><text x="24" y="78" font-size="19" fill="#626962">Scope: one coalescer instance.</text><rect x="24" y="112" width="208" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="22" fill="#252c28">Caller A</text><text x="40" y="184" font-size="18" fill="#626962">Same key K</text><rect x="256" y="112" width="208" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="272" y="148" font-size="22" fill="#252c28">Caller B</text><text x="272" y="184" font-size="18" fill="#626962">Same key K</text><rect x="488" y="112" width="208" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="504" y="148" font-size="22" fill="#252c28">Caller C</text><text x="504" y="184" font-size="18" fill="#626962">Same key K</text><path d="M128 200V248H320V284" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 200V284" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M592 200V248H400V284" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="258" font-size="18" fill="#626962">join K</text><rect x="24" y="288" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="328" font-size="23" fill="#252c28">Flight registry / K → task 1</text><text x="40" y="372" font-size="21" fill="#252c28">K = tenant-A / SKU-7 / USD / price version 3</text><text x="40" y="412" font-size="19" fill="#626962">Caller waits remain separate.</text><path d="M240 432V492" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="264" y="470" font-size="19" fill="#626962">start once</text><path d="M600 496V436" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="420" y="470" font-size="18" fill="#626962">shared outcome</text><rect x="24" y="496" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="536" font-size="23" fill="#252c28">Price loader / one active execution</text><text x="40" y="580" font-size="21" fill="#252c28">Produces 1200 USD cents</text><rect x="24" y="652" width="672" height="124" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="690" font-size="22" fill="#252c28">Same result available to A, B, C while waiting.</text><text x="40" y="734" font-size="19" fill="#626962">Different key → separate flight. Retire completed flights.</text></svg>
