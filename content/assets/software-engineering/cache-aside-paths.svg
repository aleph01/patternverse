<svg xmlns="http://www.w3.org/2000/svg" width="720" height="888" viewBox="0 0 720 888" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Three application-owned paths</title><desc id="desc">Application code checks the cache first. A usable hit returns without reading the store. A miss or expired entry causes a store read and cache fill before returning. A separate write path commits the source update and then invalidates the cached key.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="888" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Cache beside the source; application coordinates</text><text x="24" y="78" font-size="19" fill="#626962">Arrows mean next operation within each path.</text><text x="24" y="130" font-size="22" fill="#252c28">Usable hit</text><text x="24" y="166" font-size="17" fill="#626962">No source read</text><rect x="24" y="200" width="208" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="36" y="234" font-size="18" fill="#252c28">1. Check cache</text><text x="36" y="274" font-size="15" fill="#626962">Key matches; entry valid</text><path d="M128 300V336" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="340" width="208" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="36" y="374" font-size="18" fill="#252c28">2. Return cached value</text><text x="36" y="414" font-size="15" fill="#626962">Source is untouched</text><text x="256" y="130" font-size="22" fill="#252c28">Miss / expired</text><text x="256" y="166" font-size="17" fill="#626962">Load on demand</text><rect x="256" y="200" width="208" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="268" y="234" font-size="18" fill="#252c28">1. Check cache</text><text x="268" y="274" font-size="15" fill="#626962">No usable entry</text><path d="M360 300V336" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="256" y="340" width="208" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="268" y="374" font-size="18" fill="#252c28">2. Read source</text><text x="268" y="414" font-size="15" fill="#626962">Authoritative value</text><path d="M360 440V476" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="256" y="480" width="208" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="268" y="514" font-size="18" fill="#252c28">3. Fill cache</text><text x="268" y="554" font-size="15" fill="#626962">Value + expiration</text><path d="M360 580V616" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="256" y="620" width="208" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="268" y="654" font-size="18" fill="#252c28">4. Return loaded value</text><text x="268" y="694" font-size="15" fill="#626962">Caller receives result</text><text x="488" y="130" font-size="20" fill="#252c28">Application write</text><text x="488" y="166" font-size="17" fill="#626962">Source first</text><rect x="488" y="200" width="208" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="500" y="234" font-size="18" fill="#252c28">1. Commit source</text><text x="500" y="274" font-size="15" fill="#626962">Write succeeds</text><path d="M592 300V336" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="488" y="340" width="208" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="500" y="374" font-size="18" fill="#252c28">2. Invalidate cache</text><text x="500" y="414" font-size="15" fill="#626962">Delete affected key</text><path d="M592 440V476" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="488" y="480" width="208" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="500" y="514" font-size="18" fill="#252c28">3. Later read</text><text x="500" y="554" font-size="15" fill="#626962">Reload on a miss</text><rect x="24" y="760" width="672" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="795" font-size="19" fill="#252c28">Cache data is disposable; the source owns authoritative state.</text><text x="40" y="834" font-size="18" fill="#626962">Commit then invalidate is ordered, not atomic across systems.</text></svg>
