<svg xmlns="http://www.w3.org/2000/svg" width="720" height="984" viewBox="0 0 720 984" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Lost acknowledgment leaves publication retryable</title><desc id="desc">E901 is pending after the order commits. A broker accepts it, but acknowledgment is lost, so the source still says pending. After restart the relay sends the same E901, gets acknowledgment, and marks it dispatched. The broker test log contains two acceptances; the order remains a single row.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="984" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">The repeat window is after broker acceptance</text><rect x="24" y="112" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Source: E901 pending</text><text x="40" y="167" font-size="17" fill="#626962">One committed order O42</text><text x="40" y="238" font-size="18" fill="#626962">No publication yet</text><path d="M336 192H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="384" y="112" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="141" font-size="20" fill="#252c28">Broker accepts E901</text><text x="400" y="167" font-size="17" fill="#626962">Acceptance log: E901</text><text x="400" y="238" font-size="17" fill="#626962">Acknowledgment is lost.</text><path d="M540 272V366H180V430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="402" font-size="17" fill="#626962">restart / source still pending</text><rect x="24" y="432" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="461" font-size="20" fill="#252c28">Relay retries E901</text><text x="40" y="487" font-size="17" fill="#626962">Same saved ID and payload</text><text x="40" y="558" font-size="16" fill="#626962">Order transaction is not repeated.</text><path d="M336 512H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="384" y="432" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="461" font-size="18" fill="#252c28">Broker accepts E901 again</text><text x="400" y="487" font-size="16" fill="#626962">Acceptance log: E901, E901</text><text x="400" y="558" font-size="17" fill="#626962">Acknowledgment returns.</text><path d="M540 592V670" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="672" width="672" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="701" font-size="20" fill="#252c28">Source records dispatch success</text><text x="40" y="727" font-size="17" fill="#626962">One order remains; no pending event. Two broker acceptances.</text><text x="40" y="784" font-size="18" fill="#626962">Dispatched means broker acceptance, not consumer completion.</text><text x="24" y="906" font-size="18" fill="#626962">Arrows: publication, restart/retry, and recording dispatch.</text><text x="24" y="942" font-size="18" fill="#626962">Consumer-side repeat protection remains necessary.</text></svg>
