<svg xmlns="http://www.w3.org/2000/svg" width="360" height="946" viewBox="0 0 360 946" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Scaling the application with complete runtime replicas</title><desc id="desc">A router sends each request to one of two replicas of the same application release. Each replica contains both Customers and Tickets; the modules remain part of the same deployment unit.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="946" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Scale the application</text><text x="24" y="60" font-size="22" fill="#252c28">as one deployment unit</text><text x="24" y="108" font-size="17" fill="#626962">Same release: Customers + Tickets</text><rect x="24" y="150" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="179" font-size="20" fill="#252c28">Route each request</text><text x="40" y="205" font-size="17" fill="#626962">Choose one replica</text><rect x="44" y="318" width="272" height="200" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="352" font-size="20" fill="#252c28">Replica 1 · release A</text><rect x="64" y="380" width="232" height="48" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="80" y="410" font-size="19" fill="#252c28">Customers</text><rect x="64" y="450" width="232" height="48" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="80" y="480" font-size="19" fill="#252c28">Tickets</text><rect x="44" y="630" width="272" height="200" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="664" font-size="20" fill="#252c28">Replica 2 · release A</text><rect x="64" y="692" width="232" height="48" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="80" y="722" font-size="19" fill="#252c28">Customers</text><rect x="64" y="762" width="232" height="48" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="80" y="792" font-size="19" fill="#252c28">Tickets</text><path d="M24 188H12V418H42" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M12 418V730H42" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="884" font-size="17" fill="#252c28">Each replica includes both modules.</text><text x="24" y="916" font-size="17" fill="#626962">Memory-only data is instance-local.</text></svg>
