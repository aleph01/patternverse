<svg xmlns="http://www.w3.org/2000/svg" width="720" height="724" viewBox="0 0 720 724" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Repository retrieval does not provide a booking guarantee</title><desc id="desc">A repository returns workshop A with two seats left. Another booking then commits one remaining seat. The caller still holds its immutable two-seat snapshot; a new repository read can obtain the updated state. Neither the selection nor the old snapshot reserves seats; booking needs its own concurrency protection.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="724" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">An access boundary is not a reservation</text><rect x="24" y="84" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">Repository read</text><text x="40" y="139" font-size="17" fill="#626962">A has 2 seats left</text><rect x="384" y="84" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="113" font-size="20" fill="#252c28">Another booking commits</text><text x="400" y="139" font-size="17" fill="#626962">Stored A now has 1 seat</text><path d="M336 144H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340" y="116" font-size="15" fill="#626962">later</text><rect x="24" y="320" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="349" font-size="20" fill="#252c28">Caller still holds A: 2</text><text x="40" y="375" font-size="17" fill="#626962">Immutable old snapshot</text><rect x="384" y="320" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="349" font-size="20" fill="#252c28">New get('A')</text><text x="400" y="375" font-size="17" fill="#626962">Can observe the updated state</text><path d="M180 204V318" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><path d="M540 204V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="520" width="672" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="549" font-size="20" fill="#252c28">Selection does not reserve seats</text><text x="40" y="575" font-size="17" fill="#626962">Booking must recheck and update under concurrency protection</text><text x="24" y="688" font-size="18" fill="#626962">Dashed: retained snapshot · solid: later action or new read</text></svg>
