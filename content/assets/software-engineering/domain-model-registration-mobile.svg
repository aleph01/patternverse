<svg xmlns="http://www.w3.org/2000/svg" width="360" height="778" viewBox="0 0 360 778" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Open and closed registration with guarded operations</title><desc id="desc">While registration is open, reserve and cancel can change reservations after their checks pass. close_registration moves the workshop to closed. Closed registration rejects reserve and cancel; closing it again leaves it closed.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="778" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Registration has an</text><text x="24" y="60" font-size="22" fill="#252c28">explicit lifecycle</text><rect x="24" y="114" width="312" height="80" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="143" font-size="20" fill="#252c28">Open</text><text x="40" y="169" font-size="17" fill="#626962">reserve and cancel may succeed</text><path d="M90 194V258H270V196" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="44" y="302" font-size="17" fill="#252c28">reserve / cancel after checks</text><text x="44" y="336" font-size="18" fill="#252c28">Success stays open.</text><path d="M24 154H12V504H22" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="44" y="408" font-size="18" fill="#252c28">close_registration</text><rect x="24" y="464" width="312" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="493" font-size="20" fill="#252c28">Closed</text><text x="40" y="519" font-size="17" fill="#626962">reserve and cancel are rejected</text><text x="24" y="604" font-size="17" fill="#252c28">Bookings stay unchanged on rejection.</text><text x="24" y="644" font-size="17" fill="#626962">Closing again leaves it closed.</text><text x="24" y="710" font-size="18" fill="#252c28">This is the example’s policy,</text><text x="24" y="740" font-size="18" fill="#252c28">not a universal cancellation rule.</text></svg>
