<svg xmlns="http://www.w3.org/2000/svg" width="720" height="928" viewBox="0 0 720 928" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One rejected input preserves the state seen by both views</title><desc id="desc">Two displays first render the same snapshot with two reserved seats out of three and one free seat. A request to reserve two more is rejected by the model before state changes. A fresh snapshot still contains two reserved seats, and both displays remain consistent.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="928" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A rejected command leaves one consistent state</text><rect x="24" y="84" width="672" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">Current model state</text><text x="40" y="139" font-size="17" fill="#626962">2 reserved seats; capacity 3</text><rect x="24" y="260" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="289" font-size="20" fill="#252c28">Request: reserve 2</text><text x="40" y="315" font-size="17" fill="#626962">Parse count; call model.</text><rect x="384" y="260" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="289" font-size="20" fill="#252c28">Model rejects</text><text x="400" y="315" font-size="17" fill="#626962">2 + 2 > 3; no mutation.</text><path d="M180 172V258" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="220" font-size="17" fill="#626962">next action</text><path d="M336 310H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="488" width="672" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="517" font-size="20" fill="#252c28">Take another snapshot: still 2 out of 3</text><text x="40" y="543" font-size="17" fill="#626962">The earlier snapshot also remains 2 out of 3.</text><path d="M540 360V486" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="426" font-size="17" fill="#626962">unchanged state</text><rect x="24" y="716" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="745" font-size="20" fill="#252c28">Summary view</text><text x="40" y="771" font-size="17" fill="#626962">Reserved: 2/3</text><rect x="384" y="716" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="745" font-size="20" fill="#252c28">Availability view</text><text x="400" y="771" font-size="17" fill="#626962">Free: 1</text><path d="M180 588V714" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 588V714" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="884" font-size="17" fill="#626962">Render from state; do not repair counters in the views.</text></svg>
