<svg xmlns="http://www.w3.org/2000/svg" width="360" height="928" viewBox="0 0 360 928" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Reject stale historical copies after newer live changes</title><desc id="desc">A backfill holds account A at revision 10 with standard tier. A live update has already advanced the target to revision 11 with premium tier. A guard rejects the stale revision-10 write, leaving premium at revision 11. This versioned-copy example is separate from the single-value Python API bridge.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="928" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Do not restore stale data</text><text x="24" y="84" font-size="17" fill="#626962">Two-copy example; not the API code.</text><rect x="24" y="112" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="150" font-size="22" fill="#252c28">Backfill snapshot · A</text><text x="40" y="190" font-size="19" fill="#252c28">revision 10 · standard</text><path d="M72 216V272" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="252" font-size="18" fill="#626962">Live update arrives</text><rect x="24" y="276" width="312" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="314" font-size="21" fill="#252c28">Target already current</text><text x="40" y="354" font-size="19" fill="#252c28">revision 11 · premium</text><path d="M72 380V436" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="416" font-size="18" fill="#626962">Stale backfill attempts</text><rect x="24" y="440" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="478" font-size="21" fill="#252c28">Atomic revision guard</text><text x="40" y="518" font-size="18" fill="#252c28">incoming 10 > stored 11?</text><text x="40" y="558" font-size="19" fill="#252c28">False → reject stale copy</text><text x="40" y="588" font-size="17" fill="#626962">Same authoritative ordering</text><path d="M72 600V656" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="636" font-size="18" fill="#626962">Preserve newer value</text><rect x="24" y="660" width="312" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="698" font-size="22" fill="#252c28">Target remains</text><text x="40" y="738" font-size="19" fill="#252c28">revision 11 · premium</text><text x="24" y="814" font-size="18" fill="#252c28">Revisions must be comparable.</text><text x="24" y="852" font-size="18" fill="#626962">Equal retries are no-ops.</text><text x="24" y="890" font-size="18" fill="#626962">Protect deletion revisions too.</text></svg>
