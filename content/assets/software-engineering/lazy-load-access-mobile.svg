<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1192" viewBox="0 0 360 1192" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Lazy loading defers the body read until first access</title><desc id="desc">A document is first loaded with its title and an unloaded body marker. Reading the title performs no body query. The first body access selects and stores the body; later accesses return the stored value without another query. A document whose body is never accessed performs no body query.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1192" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Load less now;</text><text x="24" y="60" font-size="22" fill="#252c28">read the body on demand</text><rect x="24" y="104" width="312" height="116" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">1. Load ID and title</text><text x="40" y="159" font-size="17" fill="#626962">Body = UNLOADED</text><text x="40" y="194" font-size="17" fill="#626962">Keep the loader.</text><rect x="24" y="304" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="333" font-size="20" fill="#252c28">Read title: no body query</text><text x="40" y="359" font-size="17" fill="#626962">Stop here if enough.</text><path d="M180 220V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="536" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="565" font-size="20" fill="#252c28">2. First body access</text><text x="40" y="591" font-size="17" fill="#626962">SELECT by captured ID</text><path d="M180 404V534" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="470" font-size="17" fill="#626962">Only if requested</text><rect x="24" y="736" width="312" height="116" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="765" font-size="20" fill="#252c28">Store successful result</text><text x="40" y="791" font-size="17" fill="#626962">Text, empty text, or NULL</text><path d="M180 636V734" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="952" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="981" font-size="20" fill="#252c28">3. Later body reads</text><text x="40" y="1007" font-size="17" fill="#626962">Use stored value; no SELECT</text><path d="M180 852V950" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="1112" font-size="18" fill="#252c28">Unused body: zero body SELECTs.</text><text x="24" y="1152" font-size="17" fill="#626962">Cache is per Document instance.</text></svg>
