<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1024" viewBox="0 0 360 1024" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Database per Service: partial progress across local transactions</title><desc id="desc">Inventory commits a two-unit local adjustment, leaving three available units. A later Orders transaction rejects an order with zero requested units, leaving no order row. Inventory remains at three. Direct cross-service SQL is denied; a real workflow must resolve partial progress through a service contract and explicit recovery.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1024" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Local commits, partial progress</text><rect x="24" y="112" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Inventory transaction commits</text><text x="40" y="167" font-size="17" fill="#626962">MUG: 5 − 2 = 3 available units</text><text x="40" y="228" font-size="17" fill="#626962">Local change is now committed.</text><path d="M180 288V382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="342" font-size="17" fill="#626962">later</text><rect x="24" y="384" width="312" height="208" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="413" font-size="20" fill="#252c28">Orders transaction rejects</text><text x="40" y="439" font-size="17" fill="#626962">O42 / requested_units: 0</text><text x="40" y="504" font-size="17" fill="#626962">CHECK violation: no order row.</text><text x="40" y="548" font-size="18" fill="#626962">Inventory still has 3 units.</text><rect x="24" y="704" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="733" font-size="18" fill="#252c28">Explicit recovery is required</text><text x="40" y="759" font-size="16" fill="#626962">No implicit cross-service rollback.</text><text x="40" y="824" font-size="16" fill="#626962">A real workflow needs owned state</text><text x="40" y="856" font-size="16" fill="#626962">and service-level coordination.</text><text x="24" y="968" font-size="16" fill="#626962">Arrow: execution order, not one commit.</text></svg>
