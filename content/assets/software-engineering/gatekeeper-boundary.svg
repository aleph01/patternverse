<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Exposure and privilege are separate</title><desc id="desc">Public clients reach a limited-privilege gatekeeper, which screens requests and forwards only the fixed label-preview operation over an authenticated internal channel. A separate private service owns authorization and order access. Only that service reaches the order store; the gatekeeper has no storage credentials or direct storage route.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="1040" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Screen at the edge, keep authority private</text><text x="24" y="78" font-size="19" fill="#626962">Separate public exposure from business and storage privileges.</text><rect x="24" y="112" width="672" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="150" font-size="23" fill="#252c28">Public client</text><text x="40" y="190" font-size="19" fill="#626962">Untrusted request bytes · no direct back-end route</text><path d="M72 208V256" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="240" font-size="18" fill="#626962">Public request</text><rect x="24" y="260" width="672" height="216" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="302" font-size="23" fill="#252c28">Gatekeeper · limited-privilege identity</text><text x="40" y="350" font-size="19" fill="#252c28">Bound and validate input; build the fixed preview request.</text><text x="40" y="396" font-size="21" fill="#252c28">No order-store credentials</text><text x="40" y="444" font-size="19" fill="#626962">Separate runtime from the private service</text><path d="M72 476V548" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="518" font-size="19" fill="#626962">Fixed preview contract · authenticated service hop</text><rect x="24" y="552" width="672" height="236" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="594" font-size="23" fill="#252c28">Private LabelService</text><text x="40" y="640" font-size="19" fill="#252c28">Verified user context + current owner + business quota</text><text x="40" y="684" font-size="19" fill="#252c28">Creates preview response; owns order-access authority.</text><text x="40" y="732" font-size="20" fill="#252c28">Internal endpoint only</text><text x="40" y="768" font-size="18" fill="#626962">Separate identity / runtime</text><path d="M72 788V860" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="830" font-size="19" fill="#626962">Service identity accesses orders</text><rect x="24" y="864" width="672" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="904" font-size="23" fill="#252c28">Orders</text><text x="40" y="944" font-size="19" fill="#626962">Storage credentials remain with the private tier.</text><text x="24" y="1010" font-size="19" fill="#252c28">No ingress-to-store route; enforce the boundary in deployment.</text></svg>
