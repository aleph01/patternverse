<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1296" viewBox="0 0 360 1296" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Correlation Identifier: pending-context lifecycle</title><desc id="desc">The matcher receives a reply for desk:C2. An untrusted or unexpected source does not consume its context. A valid reply from the expected carrier completes the express quote and removes desk:C2. A duplicate then has no pending match. Explicit cleanup removes abandoned desk:C3 so its later reply is also ignored.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1296" fill="#fff"/><text x="24" y="32" font-size="21" fill="#252c28">Match first; consume deliberately</text><text x="24" y="88" font-size="18" fill="#252c28">Reply correlation: desk:C2</text><rect x="24" y="144" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="173" font-size="20" fill="#252c28">Unexpected source</text><text x="40" y="199" font-size="17" fill="#626962">No completion is accepted.</text><text x="40" y="238" font-size="17" fill="#626962">desk:C2 remains pending.</text><text x="24" y="368" font-size="19" fill="#252c28">A later valid reply</text><rect x="24" y="416" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="445" font-size="20" fill="#252c28">Expected source: carrier</text><text x="40" y="471" font-size="17" fill="#626962">Recover O42 / express.</text><text x="40" y="510" font-size="17" fill="#626962">Remove pending desk:C2.</text><path d="M180 560V646" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="610" font-size="16" fill="#626962">complete once</text><rect x="24" y="648" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="677" font-size="20" fill="#252c28">Duplicate reply arrives</text><text x="40" y="703" font-size="17" fill="#626962">No pending desk:C2: ignore.</text><text x="24" y="856" font-size="19" fill="#252c28">Abandoned conversations</text><rect x="24" y="904" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="933" font-size="20" fill="#252c28">Owner forgets desk:C3</text><text x="40" y="959" font-size="17" fill="#626962">A later C3 reply is ignored.</text><text x="24" y="1112" font-size="16" fill="#252c28">Source comes from a trusted adapter.</text><text x="24" y="1152" font-size="17" fill="#626962">The ID does not authenticate it.</text><text x="24" y="1240" font-size="17" fill="#252c28">No remote cancellation is implied.</text></svg>
