<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Correlation Identifier: independent message identities</title><desc id="desc">Economy and express quote requests for the same order O42 carry different correlation IDs, desk:C1 and desk:C2. A relay changes the express envelope message ID from desk:M2 to relay:M9 while preserving desk:C2. Replies have their own message IDs; the matcher uses correlation IDs to recover the economy or express context.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1120" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Envelope identity and conversation identity differ</text><rect x="24" y="100" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">Economy request</text><text x="40" y="155" font-size="17" fill="#626962">message: desk:M1</text><text x="40" y="194" font-size="17" fill="#626962">correlation: desk:C1</text><text x="40" y="224" font-size="17" fill="#626962">O42 / economy</text><rect x="384" y="100" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="129" font-size="20" fill="#252c28">Express request</text><text x="400" y="155" font-size="17" fill="#626962">message: desk:M2</text><text x="400" y="194" font-size="17" fill="#626962">correlation: desk:C2</text><text x="400" y="224" font-size="17" fill="#626962">O42 / express</text><path d="M180 244V598" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 244V342" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="384" y="344" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="373" font-size="20" fill="#252c28">Relay creates an envelope</text><text x="400" y="399" font-size="17" fill="#626962">message: relay:M9</text><text x="400" y="438" font-size="17" fill="#626962">correlation: desk:C2</text><path d="M540 488V598" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="600" width="672" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="629" font-size="20" fill="#252c28">Carrier handles each quote separately</text><text x="40" y="655" font-size="17" fill="#626962">Echo the conversation value; assign each reply its own message ID.</text><path d="M360 700V748H180V818" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 748H540V818" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="820" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="849" font-size="20" fill="#252c28">Reply carrier:R90</text><text x="40" y="875" font-size="17" fill="#626962">correlation: desk:C1</text><text x="40" y="914" font-size="17" fill="#626962">Match O42 / economy</text><rect x="384" y="820" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="849" font-size="20" fill="#252c28">Reply carrier:R91</text><text x="400" y="875" font-size="17" fill="#626962">correlation: desk:C2</text><text x="400" y="914" font-size="17" fill="#626962">Match O42 / express</text><text x="24" y="1032" font-size="18" fill="#252c28">Correlation recovers the quote context, regardless of reply order.</text><text x="24" y="1072" font-size="17" fill="#626962">Both operations concern O42; that business ID cannot distinguish them.</text></svg>
