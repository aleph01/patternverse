<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1376" viewBox="0 0 360 1376" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One rejected input preserves the state seen by both views</title><desc id="desc">Two displays first render the same snapshot with two reserved seats out of three and one free seat. A request to reserve two more is rejected by the model before state changes. A fresh snapshot still contains two reserved seats, and both displays remain consistent.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1376" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Reject before mutation;</text><text x="24" y="60" font-size="22" fill="#252c28">render the resulting state</text><rect x="24" y="104" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Current model state</text><text x="40" y="159" font-size="17" fill="#626962">2 reserved; capacity 3</text><rect x="24" y="304" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="333" font-size="20" fill="#252c28">Next input: reserve 2</text><text x="40" y="359" font-size="17" fill="#626962">Controller parses the count.</text><path d="M180 204V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="258" font-size="17" fill="#626962">next action</text><rect x="24" y="512" width="312" height="116" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="541" font-size="20" fill="#252c28">Model rejects command</text><text x="40" y="567" font-size="17" fill="#626962">2 + 2 > 3</text><text x="40" y="602" font-size="17" fill="#626962">State remains 2/3.</text><path d="M180 404V510" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="462" font-size="17" fill="#626962">reserve(2)</text><rect x="24" y="736" width="312" height="116" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="765" font-size="20" fill="#252c28">Take a fresh snapshot</text><text x="40" y="791" font-size="17" fill="#626962">Still 2 reserved out of 3.</text><path d="M180 628V734" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="688" font-size="17" fill="#626962">unchanged state</text><text x="24" y="942" font-size="18" fill="#252c28">Views</text><rect x="8" y="960" width="344" height="280" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><path d="M180 852V958" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="912" font-size="17" fill="#626962">render</text><rect x="24" y="992" width="312" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1021" font-size="20" fill="#252c28">Summary view</text><text x="40" y="1047" font-size="17" fill="#626962">Reserved: 2/3</text><rect x="24" y="1120" width="312" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1149" font-size="20" fill="#252c28">Availability view</text><text x="40" y="1175" font-size="17" fill="#626962">Free: 1</text><text x="24" y="1296" font-size="18" fill="#252c28">Reject before mutation.</text><text x="24" y="1332" font-size="17" fill="#626962">Both views remain consistent.</text></svg>
