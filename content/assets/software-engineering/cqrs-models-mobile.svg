<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1320" viewBox="0 0 360 1320" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">CQRS: separate command and query models</title><desc id="desc">A Book Seats command goes through a SeatPool model that checks capacity and changes booked seats. An Availability query uses SQL to return an immutable title, remaining count, status, and observed version. Both paths access one shows table; the query does not load the command model or perform booking.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1320" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Separate models, shared storage</text><rect x="24" y="112" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Book Seats command</text><text x="40" y="167" font-size="17" fill="#626962">SHOW-7 / quantity: 2</text><path d="M180 212V270" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="272" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="301" font-size="20" fill="#252c28">Command model: SeatPool</text><text x="40" y="327" font-size="17" fill="#626962">Capacity / booked / booking rule</text><text x="40" y="380" font-size="16" fill="#626962">Validate current state, then commit.</text><rect x="24" y="528" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="557" font-size="20" fill="#252c28">Availability query</text><text x="40" y="583" font-size="17" fill="#626962">SHOW-7</text><path d="M180 628V686" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="688" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="717" font-size="20" fill="#252c28">Query model: Availability</text><text x="40" y="743" font-size="17" fill="#626962">Title / remaining / status / version</text><text x="40" y="796" font-size="17" fill="#626962">SQL builds an immutable DTO.</text><path d="M24 344H12V1088H22" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="904" font-size="18" fill="#626962">Command reads + writes</text><path d="M180 832V1006" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="966" font-size="17" fill="#626962">SELECT</text><rect x="24" y="1008" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1037" font-size="20" fill="#252c28">One shows table in SQLite</text><text x="40" y="1063" font-size="17" fill="#626962">Shared source of current state</text><text x="40" y="1118" font-size="17" fill="#626962">No event log or second database.</text><text x="40" y="1158" font-size="17" fill="#626962">Both models have one owner.</text><text x="24" y="1264" font-size="16" fill="#626962">Arrows: calls into models and storage.</text></svg>
