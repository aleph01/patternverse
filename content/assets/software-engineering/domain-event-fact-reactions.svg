<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Domain fact and independent reactions</title><desc id="desc">A dispatch request reaches Shipment, which checks its ready state and records a ShipmentDispatched fact with event ID, shipment ID, tracking code, and occurrence time. Separate reactions consume the fact; Shipment does not call the archive or customer-communication code directly.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="840" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A named fact separates the transition from reactions</text><rect x="24" y="100" width="200" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="18" fill="#252c28">DispatchShipment</text><text x="40" y="155" font-size="16" fill="#626962">May be rejected</text><rect x="300" y="100" width="396" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="316" y="129" font-size="20" fill="#252c28">Shipment · ready to dispatched</text><text x="316" y="155" font-size="17" fill="#626962">Validate; record a pending fact</text><path d="M224 150H298" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="232" y="128" font-size="16" fill="#626962">request</text><path d="M498 200V278" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="516" y="246" font-size="17" fill="#626962">record</text><rect x="300" y="280" width="396" height="156" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="316" y="312" font-size="21" fill="#252c28">ShipmentDispatched</text><text x="316" y="348" font-size="18" fill="#252c28">E1 · shipment S1 · TRACK-9</text><text x="316" y="378" font-size="17" fill="#252c28">Occurred: 2026-10-29 10:00 UTC</text><text x="316" y="410" font-size="17" fill="#626962">Pending · immutable occurrence data</text><text x="24" y="312" font-size="21" fill="#252c28">Fact ≠ request</text><text x="24" y="348" font-size="18" fill="#252c28">A named local outcome</text><path d="M498 436V470H360V506" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="466" font-size="17" fill="#626962">Recording is separate from dispatch.</text><rect x="24" y="508" width="672" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="537" font-size="20" fill="#252c28">Application chooses dispatch timing</text><text x="40" y="563" font-size="17" fill="#626962">In this example: pure descriptions only</text><path d="M360 584V624H180V658" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 624H540V658" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="660" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="689" font-size="20" fill="#252c28">Archive description</text><text x="40" y="715" font-size="17" fill="#626962">Reads S1 + TRACK-9</text><rect x="384" y="660" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="689" font-size="20" fill="#252c28">Notice description</text><text x="400" y="715" font-size="17" fill="#626962">Reads S1 + E1</text><text x="24" y="808" font-size="17" fill="#626962">Solid arrows: request, record, then reactions under a chosen policy.</text></svg>
