<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Aggregator: completion and timeout lifecycle</title><desc id="desc">A group is open while only L1 is known. Arrival of L2 before the fixed 100 millisecond deadline closes it as complete. If L2 arrives at exactly 100 milliseconds, the group instead closes as timed out with L2 missing and no total. Valid late results and later polls do not release a second outcome.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1000" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">An exact deadline resolves the release race</text><rect x="24" y="112" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="146" font-size="22" fill="#252c28">Open: operation E902 / expected: L1 and L2</text><text x="40" y="194" font-size="18" fill="#626962">Seen: L1, 2 packed units / missing: L2 / fixed deadline: 100 ms</text><path d="M360 240V288H180V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 288H540V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="352" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="381" font-size="20" fill="#252c28">If L2 arrives at 99 ms</text><text x="40" y="407" font-size="17" fill="#626962">1 packed unit; before deadline</text><text x="40" y="456" font-size="19" fill="#252c28">complete / total: 3 units</text><text x="40" y="492" font-size="18" fill="#626962">Missing: none</text><rect x="384" y="352" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="381" font-size="20" fill="#252c28">If L2 arrives at 100 ms</text><text x="400" y="407" font-size="17" fill="#626962">Deadline reached; expiry wins</text><text x="400" y="456" font-size="19" fill="#252c28">timed_out / total: None</text><text x="400" y="492" font-size="18" fill="#626962">Missing: L2</text><path d="M180 512V598" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 512V598" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="600" width="672" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="629" font-size="20" fill="#252c28">Terminal state retained</text><text x="40" y="655" font-size="17" fill="#626962">Later valid contributions and polls produce no second release.</text><text x="40" y="710" font-size="19" fill="#626962">The caller can still read the saved outcome.</text><text x="24" y="848" font-size="18" fill="#252c28">Branches are alternative runs, not steps performed in sequence.</text><text x="24" y="888" font-size="18" fill="#626962">Timeout reports missing evidence. It neither cancels nor rolls back packing.</text><text x="24" y="944" font-size="17" fill="#626962">Arrows: local state transitions. No network or reliable publication is modeled.</text></svg>
