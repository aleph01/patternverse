<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1092" viewBox="0 0 360 1092" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Pending fact, atomic commitment, and repeated delivery</title><desc id="desc">A domain operation first holds a pending event in memory. In a durable publishing design, one atomic transaction commits business state and an outgoing record. A relay later sends the committed message to consumers; a repeated delivery retains the same event identity. A rollback leaves no committed outgoing record.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1092" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">A pending fact is not</text><text x="24" y="60" font-size="22" fill="#252c28">a delivered message</text><rect x="24" y="104" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">1. Pending fact E1</text><text x="40" y="159" font-size="17" fill="#626962">Memory only; local change</text><path d="M180 204V248" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="250" width="312" height="388" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="284" font-size="20" fill="#252c28">2. One atomic commit</text><rect x="44" y="316" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="345" font-size="20" fill="#252c28">Shipment S1</text><text x="60" y="371" font-size="17" fill="#626962">State: dispatched</text><rect x="44" y="432" width="272" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="461" font-size="18" fill="#252c28">Outgoing message M1</text><text x="60" y="487" font-size="16" fill="#626962">Mapped from domain fact E1</text><text x="44" y="560" font-size="18" fill="#252c28">Rollback commits neither.</text><text x="44" y="590" font-size="17" fill="#626962">State and record stay together.</text><path d="M180 638V682" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="684" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="713" font-size="20" fill="#252c28">3. Relay reads M1</text><text x="40" y="739" font-size="17" fill="#626962">Committed messages only</text><path d="M180 784V830" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="832" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="861" font-size="20" fill="#252c28">4. Consumer receives M1</text><text x="40" y="887" font-size="17" fill="#626962">Delivery may repeat M1</text><path d="M336 734H348V882H338" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="24" y="994" font-size="17" fill="#252c28">Retry uses the same message ID.</text><text x="24" y="1032" font-size="16" fill="#626962">Solid: normal progress</text><text x="24" y="1060" font-size="16" fill="#626962">Dashed: possible resend</text></svg>
