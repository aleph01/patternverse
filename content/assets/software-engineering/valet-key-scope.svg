<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1056" viewBox="0 0 720 1056" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Resource, operation and time restrictions</title><desc id="desc">A ticket issued at virtual second 100 permits GET on exports/E7.zip until but not including second 160. GET for E8 and PUT for E7 are denied. Reuse and a new GET at second 159 succeed. A new GET at second 160 is denied. This is a request-admission window, not a promise to cancel an existing transfer.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="1056" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">One resource, one verb, one validity window</text><text x="24" y="78" font-size="19" fill="#626962">Scope: GET exports/E7.zip; valid while 100 ≤ time &lt; 160.</text><text x="40" y="132" font-size="19" fill="#626962">Request</text><text x="376" y="132" font-size="19" fill="#626962">Time</text><text x="552" y="132" font-size="19" fill="#626962">Result</text><rect x="24" y="160" width="672" height="108" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="198" font-size="21" fill="#252c28">Download</text><text x="40" y="238" font-size="18" fill="#626962">GET / E7</text><text x="376" y="222" font-size="20" fill="#252c28">100 s</text><text x="552" y="222" font-size="20" fill="#252c28">archive E7</text><rect x="24" y="288" width="672" height="108" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="326" font-size="21" fill="#252c28">Other object</text><text x="40" y="366" font-size="18" fill="#626962">GET / E8</text><text x="376" y="350" font-size="20" fill="#252c28">100 s</text><text x="552" y="350" font-size="20" fill="#252c28">denied</text><rect x="24" y="416" width="672" height="108" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="454" font-size="21" fill="#252c28">Wrong verb</text><text x="40" y="494" font-size="18" fill="#626962">PUT / E7</text><text x="376" y="478" font-size="20" fill="#252c28">100 s</text><text x="552" y="478" font-size="20" fill="#252c28">denied</text><rect x="24" y="544" width="672" height="108" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="582" font-size="21" fill="#252c28">Reuse</text><text x="40" y="622" font-size="18" fill="#626962">GET / E7</text><text x="376" y="606" font-size="20" fill="#252c28">100 s</text><text x="552" y="606" font-size="20" fill="#252c28">archive E7</text><rect x="24" y="672" width="672" height="108" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="710" font-size="21" fill="#252c28">Before expiry</text><text x="40" y="750" font-size="18" fill="#626962">GET / E7</text><text x="376" y="734" font-size="20" fill="#252c28">159 s</text><text x="552" y="734" font-size="20" fill="#252c28">archive E7</text><rect x="24" y="800" width="672" height="108" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="838" font-size="21" fill="#252c28">At expiry</text><text x="40" y="878" font-size="18" fill="#626962">GET / E7</text><text x="376" y="862" font-size="20" fill="#252c28">160 s</text><text x="552" y="862" font-size="20" fill="#252c28">denied</text><text x="24" y="964" font-size="19" fill="#252c28">Repeated GET is allowed; this is not a one-use token.</text><text x="24" y="1012" font-size="18" fill="#626962">Expiry gates new requests, not bytes already delivered.</text></svg>
