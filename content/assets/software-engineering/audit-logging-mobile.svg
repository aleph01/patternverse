<svg xmlns="http://www.w3.org/2000/svg" width="360" height="884" viewBox="0 0 360 884" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Audit Logging</title><desc id="desc">A trusted application operation changes a balance and inserts an attributable audit event in the same database transaction. Both commit together or both roll back. A separate protected collector can later receive committed records; delivery to that collector is a different guarantee.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="884" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Audit Logging</text><text x="24" y="80" font-size="17" fill="#626962">Execution boundaries and evidence</text><rect x="24" y="112" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="20" fill="#252c28">Trusted operation</text><text x="40" y="188" font-size="16" fill="#252c28">Authenticated actor + request ID</text><text x="40" y="224" font-size="15" fill="#626962">Choose the capture guarantee</text><path d="M72 252V304" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="288" font-size="17" fill="#626962">Execute</text><rect x="24" y="308" width="312" height="140" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="344" font-size="20" fill="#252c28">One local transaction</text><text x="40" y="384" font-size="16" fill="#252c28">Balance update + audit insertion</text><text x="40" y="420" font-size="15" fill="#626962">One shared commit boundary</text><path d="M72 448V500" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="484" font-size="17" fill="#626962">Both or neither</text><rect x="24" y="504" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="540" font-size="20" fill="#252c28">Commit or roll back</text><text x="40" y="580" font-size="16" fill="#252c28">Both changes persist, or neither</text><text x="40" y="616" font-size="15" fill="#626962">Failed attempts need another path</text><path d="M72 644V696" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="680" font-size="17" fill="#626962">Separate delivery</text><rect x="24" y="700" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="736" font-size="20" fill="#252c28">Protected collection</text><text x="40" y="776" font-size="16" fill="#252c28">Ship committed evidence separately</text><text x="40" y="812" font-size="15" fill="#626962">Delivery is not the local commit</text></svg>
