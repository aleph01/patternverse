<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1376" viewBox="0 0 360 1376" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One controlled state transition path with explicit feedback events</title><desc id="desc">A user or service adapter supplies an event to the state owner. A controlled update produces a new UI state, which the view reads to render query, loading, results, and error consistently. The view sends subsequent interaction events back through the same entry path instead of directly changing shared state. Service work is outside the pure update in this example.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1376" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Explicit events, owned state</text><rect x="24" y="104" width="312" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Events</text><text x="40" y="159" font-size="17" fill="#626962">Search / Loaded / Failed</text><path d="M180 200V286" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="252" font-size="17" fill="#626962">event</text><rect x="24" y="288" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="317" font-size="20" fill="#252c28">State owner / update</text><text x="40" y="343" font-size="17" fill="#626962">Old state + event → new state</text><text x="40" y="398" font-size="17" fill="#626962">Replace the owned state.</text><path d="M180 432V518" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="484" font-size="17" fill="#626962">next state</text><rect x="24" y="520" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="549" font-size="20" fill="#252c28">UI state</text><text x="40" y="575" font-size="17" fill="#626962">query; ID; loading; results; error</text><text x="40" y="630" font-size="17" fill="#626962">Read-only snapshot here.</text><path d="M180 664V750" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="716" font-size="17" fill="#626962">render</text><rect x="24" y="752" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="781" font-size="20" fill="#252c28">View</text><text x="40" y="807" font-size="17" fill="#626962">Read state; report interaction.</text><path d="M24 808H12V152H22" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="984" font-size="20" fill="#252c28">Outside the pure update</text><rect x="24" y="1040" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1069" font-size="20" fill="#252c28">Effect adapter</text><text x="40" y="1095" font-size="17" fill="#626962">Nonempty Search starts work.</text><text x="40" y="1150" font-size="17" fill="#626962">Send Loaded or Failed events.</text><path d="M336 1128H348V152H338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="1288" font-size="18" fill="#252c28">Owner starts work after Search.</text><text x="24" y="1328" font-size="17" fill="#626962">Rendering never starts requests.</text></svg>
