<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1400" viewBox="0 0 360 1400" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Sequential warehouse writer admission trace</title><desc id="desc">Six sequential calls use one retained breaker. Two failures at time zero open it; a third call at zero is rejected locally. A probe fails at 100 milliseconds and reopens until 200. A call at 199 is rejected; a successful probe at 200 closes the breaker. Only four calls reach the simulated dependency.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1400" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Six requests; four invocations</text><rect x="24" y="112" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="142" font-size="18" fill="#252c28">1 / 0 ms / normal call</text><text x="40" y="186" font-size="17" fill="#626962">failure / then CLOSED</text><rect x="24" y="280" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="310" font-size="18" fill="#252c28">2 / 0 ms / normal call</text><text x="40" y="354" font-size="17" fill="#626962">failure / then OPEN</text><rect x="24" y="448" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="478" font-size="18" fill="#252c28">3 / 0 ms / local rejection</text><text x="40" y="522" font-size="17" fill="#626962">not invoked / then OPEN</text><rect x="24" y="616" width="312" height="120" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="646" font-size="18" fill="#252c28">4 / 100 ms / recovery probe</text><text x="40" y="690" font-size="17" fill="#626962">failure / then OPEN</text><rect x="24" y="784" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="814" font-size="18" fill="#252c28">5 / 199 ms / local rejection</text><text x="40" y="858" font-size="17" fill="#626962">not invoked / then OPEN</text><rect x="24" y="952" width="312" height="120" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="982" font-size="18" fill="#252c28">6 / 200 ms / recovery probe</text><text x="40" y="1026" font-size="17" fill="#626962">written / then CLOSED</text><rect x="24" y="1184" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1214" font-size="19" fill="#252c28">Four dependency invocations</text><text x="40" y="1258" font-size="16" fill="#626962">Two local rejections never call write.</text><text x="40" y="1302" font-size="17" fill="#626962">Rows: sequential request order.</text><text x="40" y="1344" font-size="17" fill="#626962">Time: virtual milliseconds.</text></svg>
