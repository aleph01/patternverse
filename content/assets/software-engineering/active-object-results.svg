<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1056" viewBox="0 0 720 1056" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Active Object results, failure, and shutdown</title><desc id="desc">Three admitted changes execute in order. Adding three units returns three. Removing five fails before mutation and returns an error, leaving three units. Adding two then returns five. Shutdown rejects new invocations, drains accepted requests, and joins the worker.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1056" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One execution owner preserves the stock rule</text><rect x="24" y="112" width="144" height="144" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="19" fill="#252c28">1 / +3 units</text><rect x="208" y="112" width="488" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="224" y="141" font-size="18" fill="#252c28">Add three / quantity 0 → 3</text><text x="224" y="167" font-size="16" fill="#626962">The first future receives 3 units.</text><path d="M96 256V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="320" width="144" height="144" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="356" font-size="19" fill="#252c28">2 / −5 units</text><rect x="208" y="320" width="488" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="224" y="349" font-size="18" fill="#252c28">Reject removal before mutation</text><text x="224" y="375" font-size="16" fill="#626962">Quantity stays 3; this request’s future receives an error.</text><path d="M96 464V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="528" width="144" height="144" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="564" font-size="19" fill="#252c28">3 / +2 units</text><rect x="208" y="528" width="488" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="224" y="557" font-size="18" fill="#252c28">Add two / quantity 3 → 5</text><text x="224" y="583" font-size="16" fill="#626962">The next request still runs; its future receives 5 units.</text><path d="M96 672V734" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="736" width="672" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="765" font-size="20" fill="#252c28">4 / close: stop admission, then drain and join</text><text x="40" y="791" font-size="17" fill="#626962">The stop marker follows accepted requests. New invocations are rejected.</text><text x="40" y="846" font-size="18" fill="#626962">The worker is non-daemon; close waits for it to finish.</text><text x="24" y="970" font-size="18" fill="#626962">Arrows: example execution order, not caller start order across threads.</text><text x="24" y="1010" font-size="16" fill="#626962">Pre-mutation validation preserves quantity here; exceptions do not imply rollback.</text></svg>
