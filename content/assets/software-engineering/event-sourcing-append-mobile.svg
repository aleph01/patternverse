<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1024" viewBox="0 0 360 1024" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Conditional append rejects stale decisions</title><desc id="desc">A release command based on revision two reaches a stream already at revision three and is rejected without adding an event. The caller must reload and reconsider. The accepted stream remains at revision three and replay still reports eighteen seats.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1024" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">A stale append adds nothing</text><rect x="24" y="112" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Release 1 seat from R1</text><text x="40" y="167" font-size="17" fill="#626962">Expected revision: 2</text><text x="40" y="208" font-size="16" fill="#626962">Decision based on earlier history</text><path d="M180 232V294" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="296" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="325" font-size="20" fill="#252c28">Stored stream now at 3</text><text x="40" y="351" font-size="17" fill="#626962">Opened / Reserved / Released</text><text x="40" y="404" font-size="17" fill="#626962">R1 holds 2; 18 available</text><path d="M180 440V502" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="504" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="533" font-size="20" fill="#252c28">Compare inside transaction</text><text x="40" y="559" font-size="17" fill="#626962">Expected 2 ≠ current 3</text><text x="40" y="612" font-size="17" fill="#626962">Reject; no INSERT; roll back</text><path d="M180 648V710" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="712" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="741" font-size="18" fill="#252c28">Stream remains at 3</text><text x="40" y="767" font-size="16" fill="#626962">Replaying still yields 18 available</text><text x="40" y="820" font-size="16" fill="#626962">Reload and reconsider the request.</text><text x="24" y="942" font-size="16" fill="#626962">Arrows: request, check, and outcome.</text><text x="24" y="980" font-size="16" fill="#626962">No event is added for this rejection.</text></svg>
