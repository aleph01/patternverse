<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1016" viewBox="0 0 720 1016" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">HTML text encoding and missing-field failure have separate meanings</title><desc id="desc">A product name containing an ampersand and angle brackets is encoded as HTML character references. The browser displays the original name as text rather than creating an extra element. Separately, omitting the required availability field raises a missing-field error before the buffered renderer returns HTML.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1016" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Text interpretation and field contracts are distinct</text><rect x="24" y="100" width="672" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">Raw product name</text><text x="40" y="155" font-size="17" fill="#626962">A&amp;B &lt;Lab></text><path d="M360 204V310" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="264" font-size="17" fill="#626962">encode + render</text><rect x="24" y="312" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="341" font-size="20" fill="#252c28">Encoded HTML source</text><text x="40" y="367" font-size="17" fill="#626962">&lt;h1>A&amp;amp;B &amp;lt;Lab&amp;gt;&lt;/h1></text><path d="M360 424V534" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="484" font-size="17" fill="#626962">parse HTML</text><rect x="24" y="536" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="565" font-size="20" fill="#252c28">Browser heading text</text><text x="40" y="591" font-size="17" fill="#626962">A&amp;B &lt;Lab>; no extra Lab element is created.</text><text x="24" y="748" font-size="20" fill="#252c28">Separate contract failure</text><rect x="24" y="800" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="829" font-size="20" fill="#252c28">Missing required availability</text><text x="40" y="855" font-size="17" fill="#626962">KeyError before this buffered renderer returns HTML.</text><text x="24" y="968" font-size="18" fill="#252c28">A zero units value is valid; an absent required field is a contract failure.</text></svg>
