<svg xmlns="http://www.w3.org/2000/svg" width="720" height="844" viewBox="0 0 720 844" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Active Record combines row state, rules, and persistence</title><desc id="desc">A caller loads and works with a Task object. The Task contains its title and completion flag, rename and complete business operations, and find and save persistence methods. The same class issues SQL for the corresponding tasks row; no separate mapper is used.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="844" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One record owns behavior and database access</text><rect x="24" y="84" width="672" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">Caller</text><text x="40" y="139" font-size="17" fill="#626962">Task.find(db, id) · task.complete() · task.save()</text><path d="M360 172V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="218" font-size="17" fill="#626962">call</text><rect x="24" y="248" width="672" height="300" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="44" y="284" font-size="23" fill="#252c28">Task · one record object</text><rect x="44" y="316" width="192" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="350" font-size="20" fill="#252c28">Data</text><text x="60" y="388" font-size="17" fill="#252c28">id: 1</text><text x="60" y="426" font-size="17" fill="#252c28">done: False</text><text x="60" y="464" font-size="17" fill="#626962">Label cartons</text><rect x="264" y="316" width="192" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="280" y="350" font-size="20" fill="#252c28">Business rules</text><text x="280" y="388" font-size="17" fill="#252c28">rename(title)</text><text x="280" y="426" font-size="17" fill="#252c28">complete()</text><text x="280" y="464" font-size="15" fill="#626962">No rename if done</text><rect x="484" y="316" width="192" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="500" y="350" font-size="20" fill="#252c28">Persistence</text><text x="500" y="388" font-size="17" fill="#252c28">find(db, id)</text><text x="500" y="426" font-size="17" fill="#252c28">save()</text><text x="500" y="464" font-size="15" fill="#626962">SQL inside the class</text><rect x="24" y="656" width="672" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="685" font-size="20" fill="#252c28">tasks row</text><text x="40" y="711" font-size="17" fill="#626962">id: 1 · title: 'Label cartons' · done: 0</text><path d="M360 548V654" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="612" font-size="17" fill="#626962">record method runs SQL</text><text x="24" y="808" font-size="18" fill="#252c28">Arrows: calls, then SQL. No separate mapper.</text></svg>
