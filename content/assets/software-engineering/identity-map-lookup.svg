<svg xmlns="http://www.w3.org/2000/svg" width="720" height="816" viewBox="0 0 720 816" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Two lookups share one object through an Identity Map</title><desc id="desc">The first lookup of contact 1 misses the scoped map, selects its row, constructs a Contact, and registers its reference. A later lookup finds that entry and returns the same Contact object without selecting or constructing again.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="816" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Look up identity before constructing an object</text><rect x="24" y="84" width="672" height="632" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="44" y="116" font-size="18" fill="#626962">One operation; one Contact scope</text><rect x="44" y="152" width="280" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="181" font-size="20" fill="#252c28">1. get(1): map miss</text><text x="60" y="207" font-size="17" fill="#626962">SELECT, then construct</text><path d="M184 252V334" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="200" y="298" font-size="17" fill="#626962">register</text><rect x="44" y="336" width="280" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="365" font-size="20" fill="#252c28">Contact, ID 1</text><text x="60" y="391" font-size="17" fill="#626962">one stored reference</text><rect x="400" y="324" width="276" height="124" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="416" y="353" font-size="20" fill="#252c28">One Contact object</text><text x="416" y="379" font-size="17" fill="#626962">name: Ada</text><path d="M324 386H398" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="338" y="366" font-size="17" fill="#626962">ref</text><rect x="44" y="560" width="280" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="589" font-size="20" fill="#252c28">2. get(1): map hit</text><text x="60" y="615" font-size="17" fill="#626962">reuse; no SELECT</text><path d="M184 560V438" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="200" y="504" font-size="17" fill="#626962">lookup</text><text x="400" y="540" font-size="18" fill="#252c28">Same reference returned</text><text x="400" y="574" font-size="17" fill="#626962">No second object created</text><text x="24" y="772" font-size="18" fill="#252c28">Both paths receive the same live object within this scope.</text></svg>
