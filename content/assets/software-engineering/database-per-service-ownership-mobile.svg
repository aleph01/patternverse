<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1176" viewBox="0 0 360 1176" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Database per Service: ownership versus physical hosting</title><desc id="desc">Orders and Inventory use separate runtime roles and each issues SQL only to its own private schema. The two schemas share one PostgreSQL server. An inter-service API request connects the services above the storage boundary, rather than granting Orders direct access to Inventory tables.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1176" fill="#fff"/><text x="24" y="34" font-size="21" fill="#252c28">Private ownership, shared hosting</text><rect x="24" y="112" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Orders service</text><text x="40" y="167" font-size="17" fill="#626962">Runtime role: orders_app</text><path d="M180 224V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="274" font-size="17" fill="#626962">Own SQL</text><rect x="24" y="304" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="333" font-size="20" fill="#252c28">Private orders schema</text><text x="40" y="359" font-size="17" fill="#626962">orders.orders</text><text x="40" y="414" font-size="17" fill="#626962">Owner: orders_owner</text><path d="M24 168H12V648H22" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="520" font-size="18" fill="#626962">API request to Inventory</text><rect x="24" y="592" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="621" font-size="20" fill="#252c28">Inventory service</text><text x="40" y="647" font-size="17" fill="#626962">Runtime role: inventory_app</text><path d="M180 704V782" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="754" font-size="17" fill="#626962">Own SQL</text><rect x="24" y="784" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="813" font-size="20" fill="#252c28">Private inventory schema</text><text x="40" y="839" font-size="17" fill="#626962">inventory.stock</text><text x="40" y="894" font-size="17" fill="#626962">Owner: inventory_owner</text><text x="24" y="1008" font-size="18" fill="#252c28">Both schemas share one server.</text><text x="24" y="1050" font-size="16" fill="#626962">Each runtime role gets only its own SQL.</text><text x="24" y="1120" font-size="15" fill="#626962">API calls do not grant foreign-table access.</text></svg>
