<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1140" viewBox="0 0 360 1140" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Data Mapper leaves transaction ownership with the caller</title><desc id="desc">The caller constructs a replacement Appointment and explicitly asks the mapper to update it. The mapper writes a provisional row change inside a caller-owned transaction. Caller commit makes it durable, while rollback discards it. Neither mapping nor object replacement automatically saves the appointment.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1140" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Explicit writes,</text><text x="24" y="60" font-size="22" fill="#252c28">caller-owned transaction</text><rect x="24" y="104" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">New Appointment A-7</text><text x="40" y="159" font-size="17" fill="#626962">TimeSlot: 600–645 minutes</text><path d="M180 204V282" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="284" width="312" height="640" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="320" font-size="20" fill="#252c28">Caller-owned transaction</text><rect x="44" y="352" width="272" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="381" font-size="20" fill="#252c28">Mapper.update</text><text x="60" y="407" font-size="17" fill="#626962">Write start 600, length 45</text><rect x="44" y="504" width="272" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="533" font-size="20" fill="#252c28">Provisional row</text><text x="60" y="559" font-size="17" fill="#626962">No hidden commit</text><path d="M180 452V502" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="44" y="684" width="272" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="713" font-size="20" fill="#252c28">COMMIT</text><text x="60" y="739" font-size="17" fill="#626962">Keep changed row</text><rect x="44" y="804" width="272" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="833" font-size="20" fill="#252c28">ROLLBACK</text><text x="60" y="859" font-size="17" fill="#626962">Restore previous row</text><path d="M180 604V682" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M316 554H324V846H318" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="24" y="1008" font-size="18" fill="#252c28">Object replacement alone</text><text x="24" y="1040" font-size="18" fill="#252c28">does not save anything.</text><text x="24" y="1104" font-size="16" fill="#626962">Solid: commit path · dashed: rollback</text></svg>
