<svg xmlns="http://www.w3.org/2000/svg" width="360" height="950" viewBox="0 0 360 950" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Application-owned ports and replaceable adapters</title><desc id="desc">Console and test drivers enter the same reservation operation. The application calls its own stock port, which can be served by a SQLite adapter or an in-memory substitute selected at startup.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="950" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Application inside,</text><text x="24" y="60" font-size="22" fill="#252c28">adapters outside</text><text x="24" y="100" font-size="18" fill="#626962">Outside: drivers</text><rect x="24" y="120" width="144" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="149" font-size="18" fill="#252c28">Console</text><text x="40" y="175" font-size="16" fill="#626962">Parse text</text><rect x="192" y="120" width="144" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="208" y="149" font-size="18" fill="#252c28">Test driver</text><text x="208" y="175" font-size="16" fill="#626962">Call directly</text><rect x="24" y="260" width="312" height="320" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="296" font-size="21" fill="#252c28">Application</text><rect x="44" y="328" width="272" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="357" font-size="20" fill="#252c28">reserve</text><text x="60" y="383" font-size="17" fill="#626962">Incoming port</text><rect x="44" y="480" width="272" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="509" font-size="20" fill="#252c28">StockPort.take</text><text x="60" y="535" font-size="17" fill="#626962">Outgoing port</text><path d="M96 196V228H12V366H42" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M264 196V228H348V366H318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 404V478" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="450" font-size="17" fill="#252c28">Calls stock</text><path d="M180 556V600H12V730H42" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M12 730V850H42" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="646" font-size="20" fill="#252c28">Select one storage adapter</text><rect x="44" y="692" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="721" font-size="20" fill="#252c28">SQLite adapter</text><text x="60" y="747" font-size="17" fill="#626962">Conditional update</text><rect x="44" y="812" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="841" font-size="20" fill="#252c28">Memory substitute</text><text x="60" y="867" font-size="17" fill="#626962">Sequential test model</text><text x="24" y="924" font-size="18" fill="#626962">Same application in both runs.</text></svg>
