<svg xmlns="http://www.w3.org/2000/svg" width="720" height="836" viewBox="0 0 720 836" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Selection and booking have different guarantees</title><desc id="desc">The application obtains candidate snapshots, asks the domain service to select a room, and submits a booking command to the room owner. If the selected room has been taken meanwhile, the booking is rejected and the application reloads candidates and re-evaluates selection.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="836" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A selection result is not a reservation</text><rect x="24" y="100" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">1. Load candidate offers</text><text x="40" y="155" font-size="17" fill="#626962">A/B: 12 · C: 20 · D: 10 seats</text><path d="M180 200V250" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="252" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="281" font-size="20" fill="#252c28">2. select_room returns A</text><text x="40" y="307" font-size="17" fill="#626962">12 seats · 12 attendees</text><rect x="384" y="252" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="281" font-size="18" fill="#252c28">3. Another writer books A</text><text x="400" y="307" font-size="16" fill="#626962">Owner commits the change</text><text x="384" y="386" font-size="17" fill="#626962">Concurrent change</text><path d="M540 352V398H250V438" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><path d="M180 352V438" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="440" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="469" font-size="18" fill="#252c28">4. Book A: conflict</text><text x="40" y="495" font-size="16" fill="#626962">Owner rejects stale availability</text><path d="M180 540V586H360V616" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="618" width="672" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="647" font-size="20" fill="#252c28">5. Reload offers; re-evaluate</text><text x="40" y="673" font-size="17" fill="#626962">B remains suitable: select_room returns room-B</text><text x="24" y="770" font-size="19" fill="#252c28">Booking requires an atomic availability check and write.</text><text x="24" y="808" font-size="17" fill="#626962">Solid: use-case sequence · dashed: concurrent state change</text></svg>
