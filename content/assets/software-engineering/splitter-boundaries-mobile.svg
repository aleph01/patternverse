<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1248" viewBox="0 0 360 1248" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Splitter: validation and publication boundaries</title><desc id="desc">A bounded input is fully validated before two children are returned. An invalid second line instead raises SplitError and returns no children. Later publication is a separate boundary: child L1 can be accepted while sending L2 fails, leaving a partial delivery that requires recovery.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1248" fill="#fff"/><text x="24" y="34" font-size="23" fill="#252c28">Construction is not delivery</text><rect x="24" y="104" width="312" height="504" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="140" font-size="21" fill="#252c28">Inside split_order</text><rect x="40" y="184" width="280" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="56" y="213" font-size="20" fill="#252c28">All lines valid</text><text x="56" y="239" font-size="17" fill="#626962">Return 2 immutable children.</text><rect x="40" y="352" width="280" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="381" font-size="20" fill="#252c28">Second line: 0 units</text><text x="56" y="407" font-size="17" fill="#626962">SplitError; no children returned.</text><text x="56" y="458" font-size="16" fill="#626962">First line cannot escape early.</text><text x="40" y="560" font-size="18" fill="#626962">No publication happens here.</text><rect x="24" y="704" width="312" height="416" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="742" font-size="21" fill="#252c28">Later: caller publishes</text><rect x="40" y="792" width="280" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="821" font-size="20" fill="#252c28">L1: broker accepts</text><text x="56" y="847" font-size="17" fill="#626962">L2: send fails</text><text x="40" y="968" font-size="17" fill="#252c28">Partial delivery needs recovery.</text><text x="40" y="1012" font-size="17" fill="#626962">Replay can repeat child L1.</text><text x="40" y="1060" font-size="16" fill="#626962">Stable keys enable deduplication;</text><text x="40" y="1088" font-size="16" fill="#626962">they do not perform it.</text><text x="24" y="1192" font-size="17" fill="#252c28">No atomic publication is promised.</text></svg>
