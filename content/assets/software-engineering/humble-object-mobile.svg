<svg xmlns="http://www.w3.org/2000/svg" width="360" height="884" viewBox="0 0 360 884" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Humble Object</title><desc id="desc">A GUI callback reads text, passes it to a testable shipping-label function, and writes the returned label. Tariff boundaries and validation are exercised directly; the thin adapter still needs a wiring check against real controls.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="884" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Humble Object</text><text x="24" y="80" font-size="17" fill="#626962">Execution boundaries and evidence</text><rect x="24" y="112" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="20" fill="#252c28">GUI adapter reads</text><text x="40" y="188" font-size="16" fill="#252c28">Read the weight field as text</text><text x="40" y="224" font-size="15" fill="#626962">Framework owns controls</text><path d="M72 252V304" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="288" font-size="17" fill="#626962">Delegate input</text><rect x="24" y="308" width="312" height="140" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="344" font-size="20" fill="#252c28">Testable decision</text><text x="40" y="384" font-size="16" fill="#252c28">Validate grams; calculate tariff</text><text x="40" y="420" font-size="15" fill="#626962">No GUI dependency</text><path d="M72 448V500" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="484" font-size="17" fill="#626962">Return decision</text><rect x="24" y="504" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="540" font-size="20" fill="#252c28">Explicit result</text><text x="40" y="580" font-size="16" fill="#252c28">Return the complete display label</text><text x="40" y="616" font-size="15" fill="#626962">Rules tested with ordinary values</text><path d="M72 644V696" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="680" font-size="17" fill="#626962">Apply result</text><rect x="24" y="700" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="736" font-size="20" fill="#252c28">GUI adapter writes</text><text x="40" y="776" font-size="16" fill="#252c28">Apply the label to the right control</text><text x="40" y="812" font-size="15" fill="#626962">Real binding still needs a check</text></svg>
