<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Version-attributed failure rates and exposure before recovery</title><desc id="desc">A ten-percent window serves ten candidate requests and advances. The twenty-five-percent window serves twenty-five candidate requests and rolls back because three fail. The combined endpoint rate is five percent, but the candidate rate is twelve percent. Thirty-five candidate requests remain part of the exposure after future candidate traffic becomes zero.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="720" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">A healthy average can hide a bad release</text><text x="24" y="80" font-size="18" fill="#626962">Fictional window 2: 100 requests, candidate share 25%</text><rect x="24" y="112" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="150" font-size="22" fill="#252c28">Endpoint aggregate</text><text x="40" y="194" font-size="22" fill="#252c28">5/100 failures = 5%</text><text x="40" y="234" font-size="17" fill="#626962">3 candidate + 2 incumbent</text><rect x="384" y="112" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="150" font-size="22" fill="#252c28">Candidate alone</text><text x="400" y="194" font-size="22" fill="#252c28">3/25 failures = 12%</text><text x="400" y="234" font-size="17" fill="#626962">Breaches 5% failure limit</text><path d="M540 256V328" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="400" y="300" font-size="17" fill="#626962">Reject this stage</text><rect x="24" y="332" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="370" font-size="22" fill="#252c28">Decision: restore future candidate share to 0%</text><text x="40" y="412" font-size="19" fill="#252c28">Window 1: 10 candidate + window 2: 25 candidate = 35 served</text><text x="40" y="444" font-size="18" fill="#626962">200 total requests; 3 candidate serving failures already occurred.</text><rect x="24" y="500" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="538" font-size="22" fill="#252c28">One extra rollback-lag window</text><text x="40" y="578" font-size="19" fill="#252c28">35 + 25 = 60 candidate requests; 3 + 3 = 6 candidate failures.</text><text x="40" y="612" font-size="17" fill="#626962">Lag extends exposure; it does not approve another expansion.</text><text x="24" y="680" font-size="18" fill="#252c28">Complete labels: 1 wrong prediction / 22 successful candidate responses.</text></svg>
