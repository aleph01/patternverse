<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1272" viewBox="0 0 360 1272" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Dependent owner API reads and an identity join</title><desc id="desc">An API Composer receives order IDs O42, O43, and O44. It calls Orders once, derives distinct customer IDs C2 and C7, calls Customers once, and joins returned rows by customer ID. The three cards retain requested order; O42 and O44 reuse the same C7 result.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1272" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Read APIs, then join by identity</text><rect x="24" y="112" width="312" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Requested order IDs</text><text x="40" y="167" font-size="17" fill="#626962">O42 / O43 / O44</text><path d="M180 208V270" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="272" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="301" font-size="20" fill="#252c28">1 / Read Orders API</text><text x="40" y="327" font-size="17" fill="#626962">Returns O43, O44, O42</text><text x="40" y="380" font-size="16" fill="#626962">Each row includes customer_id.</text><path d="M180 416V478" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="480" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="509" font-size="18" fill="#252c28">Composer derives distinct IDs</text><text x="40" y="535" font-size="16" fill="#626962">Customer batch: C2, C7</text><path d="M180 592V654" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="656" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="685" font-size="18" fill="#252c28">2 / Read Customers API</text><text x="40" y="711" font-size="16" fill="#626962">Returns C7 / Mira, then C2 / Sol</text><text x="40" y="764" font-size="16" fill="#626962">Owner-local revisions: 11 and 3</text><path d="M180 800V862" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="864" width="312" height="224" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="893" font-size="20" fill="#252c28">3 / Join by customer_id</text><text x="40" y="919" font-size="17" fill="#626962">Keep requested order:</text><text x="40" y="964" font-size="16" fill="#626962">O42 → Mira / 7000 euro cents</text><text x="40" y="1004" font-size="16" fill="#626962">O43 → Sol / 2500 euro cents</text><text x="40" y="1044" font-size="16" fill="#626962">O44 → Mira / 900 euro cents</text><text x="24" y="1192" font-size="15" fill="#626962">Arrows: dependent reads and local join.</text><text x="24" y="1228" font-size="15" fill="#626962">One customer response serves two cards.</text></svg>
