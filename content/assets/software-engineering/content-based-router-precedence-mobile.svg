<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1200" viewBox="0 0 360 1200" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Content-Based Router: ordered policy and threshold</title><desc id="desc">A valid physical express order for 100000 US dollar cents enters an ordered routing policy. The high-value rule matches before the express rule, selecting manual-review only. A physical express order for 99999 cents reaches priority-fulfillment instead. The selected channel is a decision, not proof that a consumer completed the work.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1200" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Overlapping rules need a winner</text><rect x="24" y="104" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Two physical express orders</text><text x="40" y="159" font-size="17" fill="#626962">A41: 99999 US dollar cents</text><text x="40" y="198" font-size="17" fill="#626962">A42: 100000 US dollar cents</text><path d="M180 248V334" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="298" font-size="17" fill="#626962">inspect</text><rect x="24" y="336" width="312" height="248" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="366" font-size="20" fill="#252c28">orders-v1: first match</text><text x="40" y="410" font-size="17" fill="#626962">1. cents ≥ 100000 → review</text><text x="40" y="444" font-size="17" fill="#626962">2. digital → digital delivery</text><text x="40" y="478" font-size="16" fill="#626962">3. physical + express → priority</text><text x="40" y="512" font-size="17" fill="#626962">4. physical → standard</text><text x="40" y="546" font-size="17" fill="#626962">5. otherwise → classification</text><path d="M180 584V640H12V758H22" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M12 758V966H22" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="704" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="733" font-size="20" fill="#252c28">A41: priority fulfillment</text><text x="40" y="759" font-size="17" fill="#626962">High-value rule is false.</text><rect x="24" y="912" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="941" font-size="20" fill="#252c28">A42: manual review</text><text x="40" y="967" font-size="17" fill="#626962">High-value rule wins first.</text><text x="24" y="1104" font-size="18" fill="#252c28">Select one channel per message.</text><text x="24" y="1144" font-size="17" fill="#626962">These are logical channel choices.</text></svg>
