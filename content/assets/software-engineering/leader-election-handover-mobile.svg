<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1072" viewBox="0 0 360 1072" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Separate election from destination handover</title><desc id="desc">A wins term one and publishes manifest-A. After a partition B wins term two with B and C. A's old election result still exists. B installs term two at the destination and publishes manifest-B; the destination rejects A's later term-one write and retains manifest-B.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1072" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Election is not write revocation</text><rect x="24" y="112" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">A elected / term 1</text><text x="40" y="167" font-size="16" fill="#626962">Votes A, B / publishes manifest-A</text><text x="40" y="214" font-size="16" fill="#626962">Old result remains in memory.</text><path d="M180 240V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="282" font-size="16" fill="#626962">partition</text><rect x="24" y="304" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="333" font-size="18" fill="#252c28">B elected / term 2</text><text x="40" y="359" font-size="16" fill="#626962">Votes B, C / A may still run</text><text x="40" y="406" font-size="16" fill="#626962">Destination not updated yet.</text><path d="M180 432V494" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="474" font-size="15" fill="#626962">install B / 2</text><rect x="24" y="496" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="525" font-size="18" fill="#252c28">Register installs B / term 2</text><text x="40" y="551" font-size="16" fill="#626962">Then B writes manifest-B.</text><text x="40" y="604" font-size="17" fill="#626962">Handover at this destination</text><path d="M180 640V702" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="704" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="733" font-size="18" fill="#252c28">Late A / term 1 write</text><text x="40" y="759" font-size="16" fill="#626962">Register rejects obsolete authority.</text><text x="40" y="812" font-size="16" fill="#626962">Stored value stays manifest-B.</text><text x="24" y="952" font-size="15" fill="#626962">Arrows: election trace and register calls.</text><text x="24" y="988" font-size="16" fill="#626962">Checks and writes must be atomic.</text><text x="24" y="1024" font-size="16" fill="#626962">This model has no crash recovery.</text></svg>
