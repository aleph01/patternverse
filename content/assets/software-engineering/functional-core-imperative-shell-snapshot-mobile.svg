<svg xmlns="http://www.w3.org/2000/svg" width="360" height="840" viewBox="0 0 360 840" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Snapshot repeatability and changing external state</title><desc id="desc">An observed stock value of three produces a proposal for seven units toward a target of ten. If actual stock becomes eight before execution, the saved proposal still says seven. A pure computation is repeatable but does not refresh its observations.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="840" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Repeatable does not</text><text x="24" y="60" font-size="22" fill="#252c28">mean current</text><rect x="24" y="112" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">1 · Observe stock</text><text x="40" y="167" font-size="17" fill="#626962">3 units · target 10</text><path d="M180 188V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="248" width="312" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="277" font-size="20" fill="#252c28">2 · Compute proposal</text><text x="40" y="303" font-size="17" fill="#626962">7 units to reach the target</text><path d="M180 324V406" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="198" y="356" font-size="16" fill="#626962">External stock</text><text x="198" y="382" font-size="16" fill="#626962">changes</text><rect x="24" y="408" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="437" font-size="20" fill="#252c28">3 · Current stock is 8</text><text x="40" y="463" font-size="17" fill="#626962">The saved input is still 3</text><path d="M180 484V542" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="544" width="312" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="573" font-size="20" fill="#252c28">4 · Saved proposal: 7</text><text x="40" y="599" font-size="17" fill="#626962">No automatic refresh or lock</text><text x="24" y="682" font-size="17" fill="#252c28">Recompute from 8: propose nothing.</text><text x="24" y="718" font-size="17" fill="#626962">The reorder point is 3 units.</text><text x="24" y="772" font-size="18" fill="#252c28">Execution needs its own</text><text x="24" y="802" font-size="18" fill="#252c28">consistency policy.</text></svg>
