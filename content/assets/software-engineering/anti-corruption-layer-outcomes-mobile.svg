<svg xmlns="http://www.w3.org/2000/svg" width="360" height="920" viewBox="0 0 360 920" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Anti-Corruption Layer: local facts and integration uncertainty</title><desc id="desc">A valid supplier snapshot with quantity 10, committed 7, and damaged 2 yields one sellable unit; a request for two is false under the local rule. A timeout yields StockUnavailable, not a zero-stock Availability. An unmapped local SKU fails before calling the supplier. These outcomes do not reserve or change stock.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="920" fill="#fff"/><text x="24" y="32" font-size="20" fill="#252c28">Insufficient is different from unknown</text><rect x="24" y="104" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Coherent snapshot</text><text x="40" y="159" font-size="17" fill="#626962">10 − 7 − 2 = 1 sellable unit</text><text x="40" y="198" font-size="18" fill="#626962">can_supply(2) → False</text><rect x="24" y="336" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="365" font-size="20" fill="#252c28">Supplier timeout</text><text x="40" y="391" font-size="17" fill="#626962">StockUnavailable</text><text x="40" y="430" font-size="17" fill="#626962">Not an Availability with zero.</text><rect x="24" y="568" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="597" font-size="20" fill="#252c28">Unmapped local SKU</text><text x="40" y="623" font-size="17" fill="#626962">StockUnavailable</text><text x="40" y="662" font-size="17" fill="#626962">No supplier call is made.</text><text x="24" y="816" font-size="18" fill="#252c28">No invented stock facts.</text><text x="24" y="856" font-size="17" fill="#626962">No reservation or stock change.</text></svg>
