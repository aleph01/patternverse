<svg xmlns="http://www.w3.org/2000/svg" width="720" height="880" viewBox="0 0 720 880" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Admission is not business authorization</title><desc id="desc">Five requests divide into three outcomes: a two-copy preview for Alice’s O100 order is admitted and allowed; an extra owner field and boolean copy count are rejected before forwarding; four copies and another owner’s order pass admission but are denied by the private service.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="880" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Admission and authorization answer different questions</text><text x="24" y="78" font-size="19" fill="#626962">A well-formed request can still be denied by the private service.</text><text x="40" y="132" font-size="19" fill="#626962">Request</text><text x="376" y="132" font-size="19" fill="#626962">Admission</text><text x="552" y="132" font-size="19" fill="#626962">Service result</text><rect x="24" y="160" width="672" height="108" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="198" font-size="21" fill="#252c28">Allowed preview</text><text x="40" y="238" font-size="18" fill="#626962">O100 · copies 2</text><path d="M340 216H364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="222" font-size="20" fill="#252c28">Admitted</text><text x="552" y="222" font-size="20" fill="#252c28">O100 x2</text><path d="M516 216H544" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="288" width="672" height="108" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="326" font-size="21" fill="#252c28">Extra owner field</text><text x="40" y="366" font-size="18" fill="#626962">owner: alice</text><path d="M340 344H364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="350" font-size="20" fill="#252c28">Rejected</text><text x="552" y="350" font-size="20" fill="#252c28">Not called</text><rect x="24" y="416" width="672" height="108" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="454" font-size="21" fill="#252c28">Boolean count</text><text x="40" y="494" font-size="18" fill="#626962">copies: true</text><path d="M340 472H364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="478" font-size="20" fill="#252c28">Rejected</text><text x="552" y="478" font-size="20" fill="#252c28">Not called</text><rect x="24" y="544" width="672" height="108" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="582" font-size="21" fill="#252c28">Over business quota</text><text x="40" y="622" font-size="18" fill="#626962">O100 · copies 4</text><path d="M340 600H364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="606" font-size="20" fill="#252c28">Admitted</text><text x="552" y="606" font-size="20" fill="#252c28">Denied</text><path d="M516 600H544" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="672" width="672" height="108" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="710" font-size="21" fill="#252c28">Other owner’s order</text><text x="40" y="750" font-size="18" fill="#626962">O200 · copies 1</text><path d="M340 728H364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="734" font-size="20" fill="#252c28">Admitted</text><text x="552" y="734" font-size="20" fill="#252c28">Denied</text><path d="M516 728H544" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="834" font-size="20" fill="#252c28">Rejected input never reaches the private service.</text></svg>
