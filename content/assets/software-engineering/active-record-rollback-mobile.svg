<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1080" viewBox="0 0 360 1080" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Active Record object state is not restored by database rollback</title><desc id="desc">A Task is loaded with done false. Calling complete changes the object to done true; save writes a provisional done true row. A later caller rollback restores the database row to done false while the object remains done true. Reloading creates an object reflecting the stored false value.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1080" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Rollback restores the row,</text><text x="24" y="60" font-size="22" fill="#252c28">not the object</text><rect x="24" y="104" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="138" font-size="21" fill="#252c28">Loaded</text><text x="40" y="180" font-size="18" fill="#252c28">Task.done: False</text><text x="40" y="220" font-size="18" fill="#626962">Database done: 0</text><rect x="24" y="324" width="312" height="164" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="358" font-size="21" fill="#252c28">complete + save</text><text x="40" y="400" font-size="18" fill="#252c28">Task.done: True</text><text x="40" y="438" font-size="18" fill="#252c28">Database done: 1</text><text x="40" y="468" font-size="16" fill="#626962">Writer sees uncommitted state</text><path d="M180 248V322" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="564" width="312" height="164" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="598" font-size="21" fill="#252c28">ROLLBACK</text><text x="40" y="640" font-size="18" fill="#252c28">Task.done: True</text><text x="40" y="678" font-size="18" fill="#252c28">Database done: 0</text><text x="40" y="708" font-size="16" fill="#626962">Row restored; object unchanged</text><path d="M180 488V562" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><rect x="24" y="848" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="877" font-size="20" fill="#252c28">Fresh Task.find</text><text x="40" y="903" font-size="17" fill="#626962">done: False from database</text><path d="M180 728V846" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="796" font-size="17" fill="#626962">reload</text><text x="24" y="1008" font-size="18" fill="#252c28">Old object is still done: True.</text><text x="24" y="1044" font-size="17" fill="#626962">Discard it after the failed use case.</text></svg>
