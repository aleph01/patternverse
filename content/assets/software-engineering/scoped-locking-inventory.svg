<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1256" viewBox="0 0 720 1256" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Scoped Locking: inventory return and rejection</title><desc id="desc">With five initial items, reserving two changes the protected state to three available and two reserved, then returns after release. A request for four raises before changing that state and still releases. Another caller can then reserve the remaining three and obtain zero available and five reserved. All displayed states preserve a total of five items.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1256" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One inventory lock, three calls, no missed release</text><text x="24" y="88" font-size="18" fill="#626962">Pairs: (available, reserved) item counts</text><rect x="24" y="128" width="672" height="224" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="160" font-size="21" fill="#252c28">Call 1 / reserve 2 — under the shared lock</text><text x="48" y="200" font-size="17" fill="#626962">before</text><text x="432" y="200" font-size="17" fill="#626962">after</text><rect x="48" y="216" width="240" height="64" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="432" y="216" width="240" height="64" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="260" font-size="25" fill="#252c28">(5, 0)</text><text x="448" y="260" font-size="25" fill="#252c28">(3, 2)</text><path d="M288 248H430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="320" font-size="17" fill="#626962">Return the new state after release. Check and publication are protected.</text><rect x="24" y="464" width="672" height="224" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="496" font-size="21" fill="#252c28">Call 2 / reserve 4 — under the shared lock</text><text x="48" y="536" font-size="17" fill="#626962">before</text><text x="432" y="536" font-size="17" fill="#626962">after</text><rect x="48" y="552" width="240" height="64" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="432" y="552" width="240" height="64" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="596" font-size="25" fill="#252c28">(3, 2)</text><text x="448" y="596" font-size="25" fill="#252c28">(3, 2)</text><path d="M288 584H430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="656" font-size="17" fill="#626962">Reject before changing the state. Release, then propagate ValueError.</text><rect x="24" y="800" width="672" height="224" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="832" font-size="21" fill="#252c28">Call 3 / reserve 3 — under the shared lock</text><text x="48" y="872" font-size="17" fill="#626962">before</text><text x="432" y="872" font-size="17" fill="#626962">after</text><rect x="48" y="888" width="240" height="64" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="432" y="888" width="240" height="64" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="932" font-size="25" fill="#252c28">(3, 2)</text><text x="448" y="932" font-size="25" fill="#252c28">(0, 5)</text><path d="M288 920H430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="992" font-size="17" fill="#626962">A later caller acquires the same lock. Release, then deliver the new state.</text><text x="24" y="1160" font-size="20" fill="#252c28">Invariant: nonnegative counts with a constant total of five items.</text><text x="24" y="1208" font-size="17" fill="#626962">Arrows: the protected operation. Equal pairs mean no state change.</text></svg>
