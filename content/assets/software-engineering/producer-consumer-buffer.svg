<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1176" viewBox="0 0 720 1176" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Producer-Consumer: waiting versus executing</title><desc id="desc">A producer holds record 4 while two queue places contain records 2 and 3. Two consumers already process records 0 and 1 outside the queue. Removing a queued record frees a waiting place before processing finishes. Outcomes are collected separately.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1176" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A full queue and two active consumers</text><rect x="24" y="104" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Producer holds record 4</text><text x="40" y="159" font-size="17" fill="#626962">Blocking put waits until a queue place opens.</text><path d="M360 216V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="262" font-size="17" fill="#626962">admit when free</text><rect x="24" y="304" width="672" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="334" font-size="20" fill="#252c28">FIFO queue: capacity = two waiting entries</text><rect x="40" y="358" width="304" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="387" font-size="20" fill="#252c28">record 2</text><text x="56" y="413" font-size="17" fill="#626962">Next entry removed</text><rect x="376" y="358" width="304" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="392" y="387" font-size="20" fill="#252c28">record 3</text><text x="392" y="413" font-size="17" fill="#626962">Removed after record 2</text><path d="M360 480V530H172V606" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 530H548V606" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="226" y="566" font-size="17" fill="#626962">next get when a consumer is ready</text><rect x="24" y="608" width="296" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="637" font-size="20" fill="#252c28">Consumer A</text><text x="40" y="663" font-size="17" fill="#626962">Processing record 0</text><rect x="400" y="608" width="296" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="416" y="637" font-size="20" fill="#252c28">Consumer B</text><text x="416" y="663" font-size="17" fill="#626962">Processing record 1</text><text x="40" y="720" font-size="16" fill="#626962">Work outside queue lock</text><text x="416" y="720" font-size="16" fill="#626962">Work outside queue lock</text><path d="M172 752V878" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M548 752V878" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="850" font-size="17" fill="#626962">outcomes</text><rect x="24" y="880" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="909" font-size="20" fill="#252c28">Separate result collection: a value or rejection for each record</text><text x="40" y="935" font-size="17" fill="#626962">The example restores report order by index after joining workers.</text><text x="24" y="1040" font-size="19" fill="#252c28">Two waiting + two executing = up to four accepted records here.</text><text x="24" y="1080" font-size="17" fill="#626962">Input batch, producer-held record, and collected results use extra memory.</text><text x="24" y="1130" font-size="17" fill="#626962">Arrows: admission, a subsequent take, and outcome recording.</text></svg>
