<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1448" viewBox="0 0 360 1448" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Bounded admission before a jittered retry</title><desc id="desc">After an eligible failure, retry only when an attempt remains and the total budget permits the sampled wait. A first full-jitter window is zero through 100 milliseconds, then zero through 200, then zero through 400. Four total attempts permit at most three waits. Permanent failure, exhausted attempts, or exhausted budget ends the operation.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1448" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Admit, then space retries</text><rect x="24" y="104" width="312" height="224" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="134" font-size="20" fill="#252c28">Four attempts total</text><text x="40" y="178" font-size="17" fill="#252c28">Retry 1 / draw 0..100 ms</text><text x="40" y="222" font-size="17" fill="#252c28">Retry 2 / draw 0..200 ms</text><text x="40" y="266" font-size="17" fill="#252c28">Retry 3 / draw 0..400 ms</text><text x="40" y="306" font-size="17" fill="#626962">No fourth retry.</text><rect x="24" y="408" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="437" font-size="18" fill="#252c28">Eligible and safe to repeat?</text><text x="40" y="463" font-size="16" fill="#626962">Permanent or unsafe: stop.</text><path d="M180 520V590" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="592" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="621" font-size="18" fill="#252c28">An attempt remains?</text><text x="40" y="647" font-size="16" fill="#626962">Initial attempt plus three retries.</text><path d="M180 704V774" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="776" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="805" font-size="18" fill="#252c28">Sample fits remaining budget?</text><text x="40" y="831" font-size="16" fill="#626962">Equal to the remainder: stop.</text><path d="M180 888V958" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="960" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="989" font-size="18" fill="#252c28">Wait, then recheck deadline</text><text x="40" y="1015" font-size="16" fill="#626962">Use the same operation budget.</text><rect x="24" y="1168" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1198" font-size="18" fill="#252c28">Stop when any check fails.</text><text x="40" y="1242" font-size="17" fill="#626962">No wait follows success</text><text x="40" y="1286" font-size="17" fill="#626962">or the last allowed failure.</text><text x="24" y="1404" font-size="16" fill="#626962">Arrows: advance only if checks pass.</text></svg>
