<svg xmlns="http://www.w3.org/2000/svg" width="360" height="958" viewBox="0 0 360 958" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Four filters connected by explicit stream contracts</title><desc id="desc">CSV records become Celsius readings, are selected at a 25 °C threshold, converted to Fahrenheit pairs, and formatted as text. A reading of 25 °C becomes 77.0 F; 18 °C is omitted.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="demand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="958" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Transform the stream</text><text x="24" y="74" font-size="19" fill="#252c28">Input: loft,25.0</text><rect x="24" y="110" width="312" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="139" font-size="20" fill="#252c28">Parse</text><text x="40" y="165" font-size="17" fill="#626962">CSV → CelsiusReading</text><path d="M180 186V278" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="230" font-size="16" fill="#626962">CelsiusReading</text><text x="196" y="252" font-size="17" fill="#252c28">loft · 25 °C</text><rect x="24" y="280" width="312" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="309" font-size="20" fill="#252c28">Select</text><text x="40" y="335" font-size="17" fill="#626962">Keep ≥25 °C</text><path d="M180 356V448" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="410" font-size="17" fill="#252c28">25 °C retained</text><rect x="24" y="450" width="312" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="479" font-size="20" fill="#252c28">Convert</text><text x="40" y="505" font-size="17" fill="#626962">°C → (sensor, °F)</text><path d="M180 526V618" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="580" font-size="17" fill="#252c28">(loft, 77 °F)</text><rect x="24" y="620" width="312" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="649" font-size="20" fill="#252c28">Format</text><text x="40" y="675" font-size="17" fill="#626962">Pair → display string</text><path d="M180 696V768" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="742" font-size="17" fill="#626962">string</text><rect x="24" y="770" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="799" font-size="20" fill="#252c28">loft: 77.0 F</text><text x="40" y="825" font-size="17" fill="#626962">One formatted string</text><text x="24" y="894" font-size="18" fill="#252c28">18 °C stops at Select.</text><text x="24" y="928" font-size="17" fill="#626962">Arrows show data flow.</text></svg>
