<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1120" viewBox="0 0 360 1120" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Aggregator: distinct expected members</title><desc id="desc">Operation E901 expects line results L1 and L2. L2 reports one packed unit, an identical L2 redelivery adds no new member, and L1 reports two packed units. Only the two distinct expected results release one complete summary totaling three physical units.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1120" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Count members, not deliveries</text><text x="24" y="86" font-size="18" fill="#626962">E901 expects exactly L1 and L2.</text><rect x="24" y="144" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="173" font-size="20" fill="#252c28">10 ms: L2 reports 1 unit</text><text x="40" y="199" font-size="17" fill="#626962">Seen: {L2}</text><text x="40" y="252" font-size="17" fill="#626962">Open: 1 of 2 expected members.</text><rect x="24" y="352" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="381" font-size="20" fill="#252c28">20 ms: same L2 again</text><text x="40" y="407" font-size="17" fill="#626962">Seen: {L2}</text><text x="40" y="460" font-size="17" fill="#626962">Open: still 1 of 2 members.</text><rect x="24" y="560" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="589" font-size="20" fill="#252c28">30 ms: L1 reports 2 units</text><text x="40" y="615" font-size="17" fill="#626962">Seen: {L1, L2}</text><text x="40" y="668" font-size="17" fill="#626962">Complete: 2 of 2 members.</text><path d="M180 704V798" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="758" font-size="17" fill="#626962">release</text><rect x="24" y="800" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="829" font-size="20" fill="#252c28">Outcome: E901 complete</text><text x="40" y="855" font-size="17" fill="#626962">Total: 3 packed physical units</text><text x="40" y="908" font-size="18" fill="#626962">Missing: none</text><text x="24" y="1024" font-size="18" fill="#252c28">Each line contributes once.</text><text x="24" y="1068" font-size="17" fill="#626962">No second output for a redelivery.</text></svg>
