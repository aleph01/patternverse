<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1168" viewBox="0 0 360 1168" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Anti-Corruption Layer: a protected local stock model</title><desc id="desc">The shop asks availability for local SKU-42. A shop-owned Anti-Corruption Layer maps it to supplier ITEM-9 and calls the supplier lookup. The supplier’s active record reports quantity 10, committed 7, and damaged 2. The layer returns a local Availability with one sellable unit; the shop’s own model decides whether a request for two units can be supplied.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1168" fill="#fff"/><text x="24" y="32" font-size="21" fill="#252c28">External capability, local meaning</text><rect x="24" y="104" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Shop asks availability</text><text x="40" y="159" font-size="17" fill="#626962">Local SKU: SKU-42</text><text x="40" y="198" font-size="17" fill="#626962">Model owns can_supply(2).</text><path d="M180 232V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="282" font-size="17" fill="#626962">request</text><rect x="24" y="320" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="349" font-size="20" fill="#252c28">Shop-owned boundary</text><text x="40" y="375" font-size="17" fill="#626962">SKU-42 → ITEM-9</text><text x="40" y="414" font-size="17" fill="#626962">Calls the supplier lookup.</text><text x="40" y="450" font-size="17" fill="#626962">Supplier types stay here.</text><path d="M180 496V582" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="546" font-size="17" fill="#626962">lookup</text><rect x="24" y="584" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="613" font-size="20" fill="#252c28">Supplier snapshot</text><text x="40" y="639" font-size="17" fill="#626962">Active record: A</text><text x="40" y="678" font-size="17" fill="#626962">Total 10 / committed 7</text><text x="40" y="714" font-size="16" fill="#626962">Damaged 2; categories disjoint.</text><path d="M180 760V846" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="810" font-size="17" fill="#626962">interpret</text><rect x="24" y="848" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="877" font-size="20" fill="#252c28">Boundary returns local value</text><text x="40" y="903" font-size="17" fill="#626962">SKU-42 / sellable_units: 1</text><text x="40" y="942" font-size="16" fill="#626962">Domain: can_supply(2) → False</text><text x="24" y="1072" font-size="17" fill="#252c28">Read snapshot; no reservation.</text><text x="24" y="1112" font-size="17" fill="#626962">Timeout is not zero stock.</text></svg>
