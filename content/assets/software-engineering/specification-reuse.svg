<svg xmlns="http://www.w3.org/2000/svg" width="720" height="710" viewBox="0 0 720 710" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One specification reused for selection and validation</title><desc id="desc">The print-queue selector and manual-release validator both call is_satisfied_by on the same eligible-for-print specification. The candidate is a PrintJob snapshot, and the result is a Boolean. The specification defines acceptance while callers decide what to do with the result.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="710" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One matching criterion, two callers</text><rect x="24" y="100" width="280" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">Queue selection</text><text x="40" y="155" font-size="17" fill="#626962">Keep every matching job</text><rect x="416" y="100" width="280" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="432" y="129" font-size="20" fill="#252c28">Release validation</text><text x="432" y="155" font-size="17" fill="#626962">Check one proposed job</text><rect x="164" y="280" width="392" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="180" y="309" font-size="20" fill="#252c28">eligible · Specification</text><text x="180" y="335" font-size="17" fill="#626962">is_satisfied_by(job)</text><path d="M164 200V240H280V278" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M556 200V240H440V278" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="476" width="280" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="505" font-size="20" fill="#252c28">PrintJob snapshot</text><text x="40" y="531" font-size="17" fill="#626962">Candidate data only</text><rect x="416" y="476" width="280" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="432" y="505" font-size="20" fill="#252c28">True or False</text><text x="432" y="531" font-size="17" fill="#626962">Caller decides what to do</text><path d="M164 476V430H280V382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="434" font-size="17" fill="#626962">evaluate</text><path d="M440 380V430H556V474" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="574" y="434" font-size="17" fill="#626962">return</text><text x="24" y="640" font-size="18" fill="#252c28">Arrows: calls, candidate input, and Boolean result.</text><text x="24" y="678" font-size="17" fill="#626962">Neither caller owns a second copy of the policy.</text></svg>
