<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1144" viewBox="0 0 360 1144" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Issuer-qualified accounts and local permissions</title><desc id="desc">Five post-validation cases retain issuer-qualified identities: North subject 17 resolves to a1 and may read the summary; South subject 17 resolves to b9 and is denied; North subject 18 is unlinked and denied. North subject 17 still resolves to a1 after its email changes. After a1 loses its local report grant, it remains recognized but the next summary request is denied.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1144" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Identity ≠ report permission</text><text x="24" y="78" font-size="18" fill="#626962">After protocol validation.</text><rect x="24" y="112" width="312" height="168" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="146" font-size="20" fill="#252c28">North / subject 17</text><text x="40" y="178" font-size="18" fill="#626962">sam@example.test</text><text x="40" y="216" font-size="18" fill="#252c28">Local account: a1</text><text x="40" y="254" font-size="18" fill="#252c28">Summary: allowed</text><rect x="24" y="308" width="312" height="168" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="342" font-size="20" fill="#252c28">South / subject 17</text><text x="40" y="374" font-size="18" fill="#626962">sam@example.test</text><text x="40" y="412" font-size="18" fill="#252c28">Local account: b9</text><text x="40" y="450" font-size="18" fill="#252c28">Summary: denied</text><rect x="24" y="504" width="312" height="168" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="538" font-size="20" fill="#252c28">North / subject 18</text><text x="40" y="570" font-size="18" fill="#626962">sam@example.test</text><text x="40" y="608" font-size="18" fill="#252c28">Local account: Unlinked</text><text x="40" y="646" font-size="18" fill="#252c28">Summary: denied</text><rect x="24" y="700" width="312" height="168" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="734" font-size="20" fill="#252c28">North / subject 17</text><text x="40" y="766" font-size="18" fill="#626962">new@example.test</text><text x="40" y="804" font-size="18" fill="#252c28">Local account: a1</text><text x="40" y="842" font-size="18" fill="#252c28">Summary: allowed</text><rect x="24" y="896" width="312" height="168" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="930" font-size="20" fill="#252c28">North / subject 17</text><text x="40" y="962" font-size="18" fill="#626962">Local grant revoked</text><text x="40" y="1000" font-size="18" fill="#252c28">Local account: a1</text><text x="40" y="1038" font-size="18" fill="#252c28">Summary: denied</text><text x="24" y="1120" font-size="19" fill="#252c28">Email alone never links accounts.</text></svg>
