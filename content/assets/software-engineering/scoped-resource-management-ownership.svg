<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1240" viewBox="0 0 720 1240" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Scoped Resource Management: dependency-aware ownership</title><desc id="desc">One scope owns a temporary directory, then an open file in that directory, then a gzip decoder that borrows that file. Acquisitions are registered as they succeed. On exit, the decoder closes before the file, and the file closes before the directory is removed. A returned byte value is independent of all three resources.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1240" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Acquire in dependency order; release in reverse</text><rect x="24" y="112" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">One scope owns directory, raw file, and decoder lifetimes</text><text x="40" y="167" font-size="17" fill="#626962">The decoder borrows the raw file; it does not own that file’s close.</text><text x="24" y="296" font-size="21" fill="#252c28">Acquire + register</text><text x="400" y="296" font-size="21" fill="#252c28">Release on scope exit</text><rect x="24" y="336" width="296" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="365" font-size="18" fill="#252c28">1 / directory</text><text x="40" y="391" font-size="16" fill="#626962">Create the workspace</text><rect x="400" y="336" width="296" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="416" y="365" font-size="18" fill="#252c28">3 / decoder</text><text x="416" y="391" font-size="16" fill="#626962">Close wrapper; raw stays open</text><path d="M172 480V574" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M548 480V574" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="576" width="296" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="605" font-size="18" fill="#252c28">2 / raw file</text><text x="40" y="631" font-size="16" fill="#626962">Open archive inside directory</text><rect x="400" y="576" width="296" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="416" y="605" font-size="18" fill="#252c28">2 / raw file</text><text x="416" y="631" font-size="16" fill="#626962">Close the owned file handle</text><path d="M172 720V814" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M548 720V814" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="816" width="296" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="845" font-size="18" fill="#252c28">3 / decoder</text><text x="40" y="871" font-size="16" fill="#626962">Borrows the raw file</text><rect x="400" y="816" width="296" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="416" y="845" font-size="18" fill="#252c28">1 / directory</text><text x="416" y="871" font-size="16" fill="#626962">Remove workspace contents</text><rect x="24" y="1072" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1101" font-size="20" fill="#252c28">Return detached bytes; no live reader escapes this scope</text><text x="40" y="1127" font-size="17" fill="#626962">Acquisition arrows show setup. Release arrows show reverse-order cleanup.</text></svg>
