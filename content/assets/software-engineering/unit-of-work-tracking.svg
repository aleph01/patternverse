<svg xmlns="http://www.w3.org/2000/svg" width="720" height="860" viewBox="0 0 720 860" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Unit of Work tracks new, modified, and removed objects</title><desc id="desc">One maintenance operation registers label A as modified, B as new, and C as removed. The Unit of Work tracks those object snapshots, then translates them into UPDATE, INSERT, and DELETE operations under one database transaction. No registration writes SQL by itself.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="860" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Track objects before coordinating persistence</text><rect x="24" y="84" width="672" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">One label-maintenance operation</text><text x="40" y="139" font-size="17" fill="#626962">Rename A · add B · retire C</text><path d="M360 172V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="248" width="672" height="320" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="44" y="286" font-size="23" fill="#252c28">Unit of Work registry</text><rect x="44" y="324" width="192" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="358" font-size="20" fill="#252c28">Modified</text><text x="60" y="400" font-size="18" fill="#252c28">A → Ready</text><text x="60" y="434" font-size="17" fill="#626962">UPDATE</text><rect x="264" y="324" width="192" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="280" y="358" font-size="20" fill="#252c28">New</text><text x="280" y="400" font-size="18" fill="#252c28">B → New</text><text x="280" y="434" font-size="17" fill="#626962">INSERT</text><rect x="484" y="324" width="192" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="500" y="358" font-size="20" fill="#252c28">Removed</text><text x="500" y="400" font-size="18" fill="#252c28">C → Obsolete</text><text x="500" y="434" font-size="17" fill="#626962">DELETE</text><text x="44" y="520" font-size="19" fill="#252c28">Registration collects snapshots; no SQL yet.</text><rect x="24" y="664" width="672" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="693" font-size="20" fill="#252c28">Commit: flush registered writes, then COMMIT</text><text x="40" y="719" font-size="17" fill="#626962">One business scope; one local database transaction</text><path d="M360 568V662" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="620" font-size="17" fill="#626962">explicit commit</text><text x="24" y="824" font-size="18" fill="#252c28">Registry order here: UPDATE → INSERT → DELETE.</text></svg>
