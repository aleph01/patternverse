<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1184" viewBox="0 0 360 1184" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A common request lifecycle delegates action-specific processing</title><desc id="desc">Several web paths enter a shared front controller. It creates request-local context, chooses an allowlisted handler, and delegates path-specific work. Handler results or recognized routing failures return through common completion handling. Domain operations remain behind the handlers. Only paths mapped to this entry point participate.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1184" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">One shared request lifecycle</text><rect x="24" y="104" width="312" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Mapped requests</text><text x="40" y="159" font-size="17" fill="#626962">Parsed method and exact path.</text><path d="M180 192V294" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="248" font-size="17" fill="#626962">request</text><rect x="24" y="296" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="325" font-size="20" fill="#252c28">Front Controller</text><text x="40" y="351" font-size="17" fill="#626962">New context; locale; routing.</text><text x="40" y="410" font-size="16" fill="#626962">404 / 405: skip the handler.</text><path d="M180 440V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="492" font-size="17" fill="#626962">select one</text><rect x="24" y="528" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="557" font-size="20" fill="#252c28">Delegated handler</text><text x="40" y="583" font-size="17" fill="#626962">welcome, orders, or broken</text><text x="40" y="642" font-size="16" fill="#626962">Application work stays behind it.</text><path d="M336 368H348V816H338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 672V758" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="724" font-size="17" fill="#626962">result / failure</text><rect x="24" y="760" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="789" font-size="20" fill="#252c28">Shared completion</text><text x="40" y="815" font-size="17" fill="#626962">Generic failure; append status.</text><path d="M180 872V958" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="924" font-size="17" fill="#626962">response</text><rect x="24" y="960" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="989" font-size="20" fill="#252c28">Return Response</text><text x="40" y="1015" font-size="17" fill="#626962">Status; text; Allow for 405.</text><text x="24" y="1136" font-size="18" fill="#252c28">Only mapped paths participate.</text></svg>
