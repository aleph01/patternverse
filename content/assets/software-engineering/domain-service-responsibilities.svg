<svg xmlns="http://www.w3.org/2000/svg" width="720" height="784" viewBox="0 0 720 784" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Domain service decision and its collaborators</title><desc id="desc">A booking use case supplies a workshop request and room-offer snapshots to the select_room domain service. RoomOffer.can_host checks each offer's own compatibility; select_room compares qualifying offers by seat count and room ID, then returns a selected offer or no match.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="784" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One domain decision, distinct responsibilities</text><rect x="24" y="82" width="672" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="111" font-size="20" fill="#252c28">Application use case</text><text x="40" y="137" font-size="17" fill="#626962">Load request + room offers; act on the result</text><rect x="24" y="214" width="672" height="346" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="44" y="248" font-size="21" fill="#252c28">Domain model</text><rect x="44" y="280" width="632" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="309" font-size="20" fill="#252c28">select_room · domain service</text><text x="60" y="335" font-size="17" fill="#626962">Compare supplied offers without retaining request state</text><path d="M360 158V278" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="378" y="194" font-size="17" fill="#626962">calls with snapshots</text><rect x="44" y="416" width="280" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="445" font-size="18" fill="#252c28">1. RoomOffer.can_host</text><text x="60" y="471" font-size="16" fill="#626962">Seats + required features</text><rect x="388" y="416" width="288" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="404" y="445" font-size="18" fill="#252c28">2. Choose smallest fit</text><text x="404" y="471" font-size="16" fill="#626962">Then break ties by room ID</text><path d="M184 356V414" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M532 356V414" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 356V630" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="378" y="600" font-size="17" fill="#626962">return</text><rect x="24" y="632" width="672" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="661" font-size="20" fill="#252c28">Selected RoomOffer or None</text><text x="40" y="687" font-size="17" fill="#626962">No booking or retained per-request state</text><text x="24" y="754" font-size="18" fill="#252c28">Application: load and book · domain service: decide</text></svg>
