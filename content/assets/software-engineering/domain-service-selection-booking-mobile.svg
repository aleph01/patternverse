<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1040" viewBox="0 0 360 1040" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Selection and booking have different guarantees</title><desc id="desc">The application obtains candidate snapshots, asks the domain service to select a room, and submits a booking command to the room owner. If the selected room has been taken meanwhile, the booking is rejected and the application reloads candidates and re-evaluates selection.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1040" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Choosing a room</text><text x="24" y="60" font-size="22" fill="#252c28">does not book it</text><rect x="24" y="104" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">1. Load candidate offers</text><text x="40" y="159" font-size="17" fill="#626962">A/B: 12 · C: 20 · D: 10 seats</text><path d="M180 204V252" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="254" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="283" font-size="20" fill="#252c28">2. select_room returns A</text><text x="40" y="309" font-size="17" fill="#626962">12 seats · 12 attendees</text><path d="M180 354V412" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><rect x="24" y="414" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="443" font-size="18" fill="#252c28">3. Another writer books A</text><text x="40" y="469" font-size="16" fill="#626962">Owner commits the change</text><path d="M180 514V572" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><rect x="24" y="574" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="603" font-size="20" fill="#252c28">4. Booking A is rejected</text><text x="40" y="629" font-size="17" fill="#626962">Availability changed</text><path d="M180 674V732" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="734" width="312" height="132" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="766" font-size="20" fill="#252c28">5. Reload and re-evaluate</text><text x="40" y="806" font-size="18" fill="#252c28">A is no longer offered.</text><text x="40" y="840" font-size="18" fill="#252c28">select_room returns room-B</text><text x="24" y="926" font-size="18" fill="#252c28">Booking requires an atomic</text><text x="24" y="956" font-size="18" fill="#252c28">availability check and write.</text><text x="24" y="1008" font-size="16" fill="#626962">Solid: use case · dashed: other writer</text></svg>
