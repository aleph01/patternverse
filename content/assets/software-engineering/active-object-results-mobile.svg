<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1112" viewBox="0 0 360 1112" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Active Object results, failure, and shutdown</title><desc id="desc">Three admitted changes execute in order. Adding three units returns three. Removing five fails before mutation and returns an error, leaving three units. Adding two then returns five. Shutdown rejects new invocations, drains accepted requests, and joins the worker.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1112" fill="#fff"/><text x="24" y="34" font-size="20" fill="#252c28">A failed request need not stop work</text><rect x="24" y="112" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">1 / add 3 units</text><text x="40" y="167" font-size="16" fill="#626962">Quantity: 0 → 3</text><text x="40" y="222" font-size="17" fill="#626962">Future returns 3 units.</text><path d="M180 256V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="320" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="349" font-size="18" fill="#252c28">2 / remove 5 units</text><text x="40" y="375" font-size="16" fill="#626962">Reject before changing quantity.</text><text x="40" y="430" font-size="15" fill="#626962">Future raises; quantity remains 3.</text><path d="M180 464V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="528" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="557" font-size="18" fill="#252c28">3 / add 2 units</text><text x="40" y="583" font-size="16" fill="#626962">Quantity: 3 → 5</text><text x="40" y="638" font-size="17" fill="#626962">Future returns 5 units.</text><path d="M180 672V734" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="736" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="765" font-size="18" fill="#252c28">4 / close the owner</text><text x="40" y="791" font-size="16" fill="#626962">Stop admission; drain accepted work.</text><text x="40" y="846" font-size="17" fill="#626962">Then join the worker.</text><text x="40" y="876" font-size="16" fill="#626962">New invocations are rejected.</text><text x="24" y="980" font-size="15" fill="#626962">Arrows: this example’s execution order.</text><text x="24" y="1020" font-size="15" fill="#626962">Validation precedes the failed mutation.</text><text x="24" y="1060" font-size="16" fill="#626962">No general rollback is provided.</text></svg>
