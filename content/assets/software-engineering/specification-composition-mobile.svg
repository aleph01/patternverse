<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1142" viewBox="0 0 360 1142" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Composed specification and boundary examples</title><desc id="desc">A composed printing policy requires approved OR proof copy, at most 40 pages, and NOT cancelled. Job A has approval and exactly 40 pages and passes. B has 41 pages and fails. C is an unapproved proof copy within the limit and passes. D has neither approval nor the exception and fails. E is cancelled and fails despite approval.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1142" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">An exception changes</text><text x="24" y="60" font-size="22" fill="#252c28">only its own group</text><rect x="24" y="104" width="312" height="156" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="138" font-size="20" fill="#252c28">(approved OR proof_copy)</text><text x="40" y="176" font-size="20" fill="#252c28">AND pages ≤ 40</text><text x="40" y="214" font-size="20" fill="#252c28">AND NOT cancelled</text><path d="M180 260V302" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="324" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="354" font-size="20" fill="#252c28">A · 40 pages · True</text><text x="40" y="390" font-size="17" fill="#252c28">Approved · not cancelled</text><text x="40" y="420" font-size="17" fill="#626962">Exact page limit</text><rect x="24" y="468" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="498" font-size="20" fill="#252c28">B · 41 pages · False</text><text x="40" y="534" font-size="17" fill="#252c28">Approved · not cancelled</text><text x="40" y="564" font-size="17" fill="#626962">Page limit fails</text><rect x="24" y="612" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="642" font-size="20" fill="#252c28">C · 4 pages · True</text><text x="40" y="678" font-size="17" fill="#252c28">Proof copy · not cancelled</text><text x="40" y="708" font-size="17" fill="#626962">Approval group passes</text><rect x="24" y="756" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="786" font-size="20" fill="#252c28">D · 4 pages · False</text><text x="40" y="822" font-size="17" fill="#252c28">No approval or proof copy</text><text x="40" y="852" font-size="17" fill="#626962">Approval group fails</text><rect x="24" y="900" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="930" font-size="20" fill="#252c28">E · 4 pages · False</text><text x="40" y="966" font-size="17" fill="#252c28">Approved · cancelled</text><text x="40" y="996" font-size="17" fill="#626962">Cancellation rule fails</text><text x="24" y="1072" font-size="18" fill="#252c28">Every group must pass.</text><text x="24" y="1110" font-size="17" fill="#626962">True and False labels carry the result.</text></svg>
