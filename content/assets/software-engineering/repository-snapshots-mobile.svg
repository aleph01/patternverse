<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1132" viewBox="0 0 360 1132" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Repository retrieval does not provide a booking guarantee</title><desc id="desc">A repository returns workshop A with two seats left. Another booking then commits one remaining seat. The caller still holds its immutable two-seat snapshot; a new repository read can obtain the updated state. Neither the selection nor the old snapshot reserves seats; booking needs its own concurrency protection.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1132" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">A returned snapshot</text><text x="24" y="60" font-size="22" fill="#252c28">is not a reservation</text><rect x="24" y="104" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Repository read</text><text x="40" y="159" font-size="17" fill="#626962">A has 2 seats left</text><rect x="24" y="296" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="325" font-size="20" fill="#252c28">Another booking commits</text><text x="40" y="351" font-size="17" fill="#626962">Stored A now has 1 seat</text><path d="M180 216V294" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="264" font-size="17" fill="#626962">later</text><rect x="24" y="500" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="529" font-size="20" fill="#252c28">Caller still holds A: 2</text><text x="40" y="555" font-size="17" fill="#626962">Immutable old snapshot</text><path d="M24 160H12V550H22" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><rect x="24" y="680" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="709" font-size="20" fill="#252c28">New get('A')</text><text x="40" y="735" font-size="17" fill="#626962">Can observe the updated state</text><path d="M180 408V448H348V730H338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="868" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="904" font-size="21" fill="#252c28">No reservation yet</text><text x="40" y="946" font-size="17" fill="#252c28">Booking must recheck and update</text><text x="40" y="978" font-size="17" fill="#626962">with concurrency protection.</text><text x="24" y="1096" font-size="17" fill="#626962">Dashed: retained old snapshot.</text></svg>
