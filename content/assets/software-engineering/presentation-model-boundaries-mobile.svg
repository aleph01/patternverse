<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1184" viewBox="0 0 360 1184" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">View, presentation model, and domain profile boundaries</title><desc id="desc">A view maps its name field, feedback label, and enabled buttons to a presentation model containing draft text, validation, and Apply/Cancel behavior. Apply invokes the domain profile’s rename operation; Cancel reloads the current name. The presentation model has no widget reference. The view owns mapping or binding.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1184" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Model the editing experience</text><rect x="24" y="104" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">View: layout and mapping</text><text x="40" y="159" font-size="17" fill="#626962">Text field, feedback, buttons.</text><rect x="24" y="400" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="429" font-size="20" fill="#252c28">Presentation model</text><text x="40" y="455" font-size="17" fill="#626962">draft; error; can_apply</text><text x="40" y="488" font-size="17" fill="#626962">can_cancel; apply(); cancel()</text><text x="40" y="536" font-size="18" fill="#252c28">No widget reference.</text><path d="M56 216V398" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="72" y="284" font-size="17" fill="#626962">draft / actions</text><path d="M304 400V218" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="334" font-size="17" fill="#626962">properties</text><rect x="24" y="800" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="829" font-size="20" fill="#252c28">Domain profile</text><text x="40" y="855" font-size="17" fill="#626962">Accepted name; validity rule.</text><path d="M56 576V798" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="72" y="648" font-size="17" fill="#626962">Apply: rename</text><path d="M304 800V578" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="718" font-size="17" fill="#626962">read name</text><text x="24" y="992" font-size="18" fill="#252c28">Cancel reloads the current name.</text><text x="24" y="1032" font-size="17" fill="#626962">It discards the editing draft.</text><text x="24" y="1100" font-size="18" fill="#252c28">View owns synchronization.</text><text x="24" y="1140" font-size="17" fill="#626962">Binding or an explicit mapping.</text></svg>
