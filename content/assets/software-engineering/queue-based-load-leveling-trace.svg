<svg xmlns="http://www.w3.org/2000/svg" width="720" height="736" viewBox="0 0 720 736" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A burst drains over four ticks</title><desc id="desc">Four one-second ticks show arrivals of six, two, zero, and zero jobs. All are admitted without rejection. Each tick completes two jobs, leaving four, four, two, and zero waiting. Accepted jobs total eight, completed jobs total eight, and the final backlog is empty.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="736" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Eight accepted jobs, two completions per tick</text><text x="24" y="88" font-size="19" fill="#626962">One tick = 1 second. Waiting capacity = 6 jobs.</text><rect x="24" y="128" width="672" height="64" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="166" font-size="18" fill="#252c28">Tick</text><text x="140" y="166" font-size="18" fill="#252c28">Arrive</text><text x="250" y="166" font-size="18" fill="#252c28">Accept</text><text x="358" y="166" font-size="18" fill="#252c28">Reject</text><text x="466" y="166" font-size="18" fill="#252c28">Done</text><text x="574" y="166" font-size="18" fill="#252c28">Waiting</text><rect x="24" y="192" width="672" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="243" font-size="22" fill="#252c28">1</text><text x="140" y="243" font-size="22" fill="#252c28">6</text><text x="250" y="243" font-size="22" fill="#252c28">6</text><text x="358" y="243" font-size="22" fill="#252c28">0</text><text x="466" y="243" font-size="22" fill="#252c28">2</text><text x="574" y="243" font-size="22" fill="#252c28">4</text><rect x="24" y="280" width="672" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="331" font-size="22" fill="#252c28">2</text><text x="140" y="331" font-size="22" fill="#252c28">2</text><text x="250" y="331" font-size="22" fill="#252c28">2</text><text x="358" y="331" font-size="22" fill="#252c28">0</text><text x="466" y="331" font-size="22" fill="#252c28">2</text><text x="574" y="331" font-size="22" fill="#252c28">4</text><rect x="24" y="368" width="672" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="419" font-size="22" fill="#252c28">3</text><text x="140" y="419" font-size="22" fill="#252c28">0</text><text x="250" y="419" font-size="22" fill="#252c28">0</text><text x="358" y="419" font-size="22" fill="#252c28">0</text><text x="466" y="419" font-size="22" fill="#252c28">2</text><text x="574" y="419" font-size="22" fill="#252c28">2</text><rect x="24" y="456" width="672" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="507" font-size="22" fill="#252c28">4</text><text x="140" y="507" font-size="22" fill="#252c28">0</text><text x="250" y="507" font-size="22" fill="#252c28">0</text><text x="358" y="507" font-size="22" fill="#252c28">0</text><text x="466" y="507" font-size="22" fill="#252c28">2</text><text x="574" y="507" font-size="22" fill="#252c28">0</text><text x="24" y="600" font-size="19" fill="#626962">Arrivals are admitted before that tick’s drain.</text><text x="24" y="642" font-size="19" fill="#626962">Waiting is sampled after completions at tick end.</text><text x="24" y="696" font-size="22" fill="#252c28">8 accepted = 8 completed + 0 still waiting</text></svg>
