<svg xmlns="http://www.w3.org/2000/svg" width="720" height="786" viewBox="0 0 720 786" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Pending fact, atomic commitment, and repeated delivery</title><desc id="desc">A domain operation first holds a pending event in memory. In a durable publishing design, one atomic transaction commits business state and an outgoing record. A relay later sends the committed message to consumers; a repeated delivery retains the same event identity. A rollback leaves no committed outgoing record.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="786" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Recording, commitment, and delivery differ</text><rect x="24" y="88" width="672" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="117" font-size="20" fill="#252c28">1. Pending domain fact E1 · memory</text><text x="40" y="143" font-size="17" fill="#626962">Shipment S1 changes locally; no durable write</text><path d="M360 188V232" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="234" width="672" height="232" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="44" y="270" font-size="21" fill="#252c28">2. One atomic commit</text><rect x="44" y="300" width="280" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="329" font-size="20" fill="#252c28">Shipment state</text><text x="60" y="355" font-size="17" fill="#626962">S1: dispatched</text><rect x="388" y="300" width="288" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="404" y="329" font-size="18" fill="#252c28">Outgoing message M1</text><text x="404" y="355" font-size="16" fill="#626962">Mapped from domain fact E1</text><text x="44" y="438" font-size="18" fill="#252c28">Rollback: neither the state change nor message record commits.</text><path d="M360 466V492H180V524" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="526" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="555" font-size="20" fill="#252c28">3. Relay reads M1</text><text x="40" y="581" font-size="17" fill="#626962">Committed messages only</text><rect x="384" y="526" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="555" font-size="20" fill="#252c28">4. Consumer receives M1</text><text x="400" y="581" font-size="17" fill="#626962">Delivery may repeat M1</text><path d="M336 576H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="343" y="558" font-size="16" fill="#626962">send</text><path d="M180 626V674H540V628" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="180" y="710" font-size="18" fill="#626962">Possible resend · same M1</text><text x="24" y="756" font-size="17" fill="#626962">Solid: normal progress · dashed: possible resend of the same message</text></svg>
