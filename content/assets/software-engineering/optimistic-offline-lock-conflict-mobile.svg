<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1224" viewBox="0 0 360 1224" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Original-version validation rejects the later stale save</title><desc id="desc">Alice and Bob both read note version 1 and edit outside database transactions. Alice's conditional save matches version 1, writes her title, and commits version 2. Bob's later save still expects version 1, matches no row, and is rejected without overwriting Alice.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1224" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Two edits start</text><text x="24" y="60" font-size="22" fill="#252c28">at version 1</text><rect x="24" y="104" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Same note, read separately</text><text x="40" y="159" font-size="17" fill="#626962">Each keeps its original token.</text><text x="24" y="248" font-size="18" fill="#252c28">Reads</text><rect x="8" y="264" width="344" height="312" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><path d="M180 204V262" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="296" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="325" font-size="20" fill="#252c28">Alice: Launch plan</text><text x="40" y="351" font-size="17" fill="#626962">Expected version: 1</text><rect x="24" y="440" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="469" font-size="20" fill="#252c28">Bob: Budget plan</text><text x="40" y="495" font-size="17" fill="#626962">Expected version: 1</text><text x="24" y="628" font-size="18" fill="#252c28">No transaction held while editing.</text><rect x="24" y="712" width="312" height="124" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="741" font-size="20" fill="#252c28">1. Alice: v1 matches</text><text x="40" y="767" font-size="17" fill="#626962">Store Launch plan; version 2.</text><rect x="24" y="948" width="312" height="124" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="977" font-size="20" fill="#252c28">2. Bob: v1 is stale</text><text x="40" y="1003" font-size="17" fill="#626962">Zero matches; conflict.</text><text x="40" y="1042" font-size="17" fill="#626962">Stored version 2 remains.</text><path d="M180 836V946" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="900" font-size="17" fill="#626962">save later</text><text x="24" y="1140" font-size="18" fill="#252c28">Reload and review;</text><text x="24" y="1176" font-size="17" fill="#626962">do not blindly retry.</text></svg>
