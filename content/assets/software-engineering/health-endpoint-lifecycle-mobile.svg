<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1300" viewBox="0 0 360 1300" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One policy, three separate HTTP signals</title><desc id="desc">Five lifecycle phases show liveness, startup, and readiness responses. Starting gives 200, 503, 503; ready gives three 200 responses; a required dependency outage gives 200, 200, 503; recovery gives three 200 responses; draining gives 200, 200, 503. Readiness loss does not imply a liveness failure or an automatic restart.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#252c28" stroke-width="1.2"/></marker></defs><rect width="360" height="1300" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Three signals, three decisions</text><text x="24" y="80" font-size="17" fill="#626962">The demo queries all three paths.</text><rect x="24" y="112" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="144" font-size="20" fill="#252c28">starting</text><text x="40" y="194" font-size="17" fill="#626962">live</text><text x="40" y="240" font-size="22" fill="#252c28">200</text><text x="138" y="194" font-size="17" fill="#626962">startup</text><text x="138" y="240" font-size="22" fill="#252c28">503</text><text x="236" y="194" font-size="17" fill="#626962">ready</text><text x="236" y="240" font-size="22" fill="#252c28">503</text><rect x="24" y="308" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="340" font-size="20" fill="#252c28">ready</text><text x="40" y="390" font-size="17" fill="#626962">live</text><text x="40" y="436" font-size="22" fill="#252c28">200</text><text x="138" y="390" font-size="17" fill="#626962">startup</text><text x="138" y="436" font-size="22" fill="#252c28">200</text><text x="236" y="390" font-size="17" fill="#626962">ready</text><text x="236" y="436" font-size="22" fill="#252c28">200</text><rect x="24" y="504" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="536" font-size="20" fill="#252c28">dependency down</text><text x="40" y="586" font-size="17" fill="#626962">live</text><text x="40" y="632" font-size="22" fill="#252c28">200</text><text x="138" y="586" font-size="17" fill="#626962">startup</text><text x="138" y="632" font-size="22" fill="#252c28">200</text><text x="236" y="586" font-size="17" fill="#626962">ready</text><text x="236" y="632" font-size="22" fill="#252c28">503</text><rect x="24" y="700" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="732" font-size="20" fill="#252c28">recovered</text><text x="40" y="782" font-size="17" fill="#626962">live</text><text x="40" y="828" font-size="22" fill="#252c28">200</text><text x="138" y="782" font-size="17" fill="#626962">startup</text><text x="138" y="828" font-size="22" fill="#252c28">200</text><text x="236" y="782" font-size="17" fill="#626962">ready</text><text x="236" y="828" font-size="22" fill="#252c28">200</text><rect x="24" y="896" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="928" font-size="20" fill="#252c28">draining</text><text x="40" y="978" font-size="17" fill="#626962">live</text><text x="40" y="1024" font-size="22" fill="#252c28">200</text><text x="138" y="978" font-size="17" fill="#626962">startup</text><text x="138" y="1024" font-size="22" fill="#252c28">200</text><text x="236" y="978" font-size="17" fill="#626962">ready</text><text x="236" y="1024" font-size="22" fill="#252c28">503</text><text x="24" y="1136" font-size="17" fill="#252c28">Unready is not a restart instruction.</text><text x="24" y="1176" font-size="17" fill="#626962">Requests read independent snapshots.</text><text x="24" y="1216" font-size="17" fill="#626962">The observer supplies control policy.</text><text x="24" y="1256" font-size="17" fill="#626962">Startup-gated probes normally wait.</text></svg>
