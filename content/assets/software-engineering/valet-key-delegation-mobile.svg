<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1240" viewBox="0 0 360 1240" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Narrow grant and direct resource access</title><desc id="desc">The client first requests an export download from the application. The application authenticates and authorizes the request, then returns a grant restricted to GET on export E7 for a short window. The client presents that grant directly to storage. Storage validates it and returns archive bytes directly to the client; those bytes do not pass through the issuing application.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1240" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Authorize, then transfer direct</text><text x="24" y="78" font-size="18" fill="#626962">Application handles the grant.</text><rect x="24" y="112" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="152" font-size="22" fill="#252c28">Client</text><text x="40" y="192" font-size="18" fill="#252c28">Request export E7</text><path d="M72 216V268" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="250" font-size="17" fill="#626962">1 Request grant</text><rect x="24" y="272" width="312" height="192" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="312" font-size="22" fill="#252c28">Application issuer</text><text x="40" y="352" font-size="18" fill="#252c28">Authenticate + authorize</text><text x="40" y="388" font-size="17" fill="#252c28">Grant: GET / exports/E7.zip</text><text x="40" y="428" font-size="17" fill="#626962">Valid: 100 ≤ time &lt; 160</text><path d="M72 464V532" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="508" font-size="17" fill="#626962">2 Return scoped grant</text><rect x="24" y="536" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="576" font-size="22" fill="#252c28">Client holds grant</text><text x="40" y="616" font-size="17" fill="#626962">Broad credentials stay private</text><path d="M72 648V732" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="686" font-size="17" fill="#626962">3 Direct GET to storage</text><text x="96" y="716" font-size="17" fill="#626962">Grant accompanies request</text><rect x="24" y="736" width="312" height="192" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="776" font-size="22" fill="#252c28">Storage enforces grant</text><text x="40" y="816" font-size="17" fill="#252c28">Exact resource + GET + time</text><text x="40" y="856" font-size="18" fill="#252c28">Allow → archive bytes</text><text x="40" y="898" font-size="17" fill="#626962">Other request → deny</text><path d="M72 928V1004" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="974" font-size="17" fill="#626962">4 Direct response</text><rect x="24" y="1008" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1048" font-size="22" fill="#252c28">Client receives bytes</text><text x="40" y="1088" font-size="17" fill="#626962">Application did not relay them</text><text x="24" y="1164" font-size="17" fill="#252c28">Possession is authority to use it.</text><text x="24" y="1204" font-size="18" fill="#626962">Protect the bearer grant.</text></svg>
