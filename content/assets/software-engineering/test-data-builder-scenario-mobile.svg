<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1128" viewBox="0 0 360 1128" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Visible scenario overrides and real test inputs</title><desc id="desc">A default order recipe supplies a customer, US destination, standard delivery, and empty notes. One test overrides the subtotal to 4999 cents; another overrides it to 5000 cents. Each build creates a separate real order, which the same delivery rule evaluates.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1128" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">State the important difference</text><text x="24" y="82" font-size="18" fill="#626962">A reusable recipe; real input objects.</text><rect x="24" y="112" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="150" font-size="22" fill="#252c28">Default OrderBuilder</text><text x="40" y="188" font-size="19" fill="#252c28">Customer C7 · US</text><text x="40" y="222" font-size="18" fill="#626962">Standard delivery · notes empty</text><text x="40" y="254" font-size="18" fill="#626962">Subtotal: 1000 cents</text><path d="M72 272V328" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="308" font-size="18" fill="#626962">Choose test inputs</text><rect x="24" y="332" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="370" font-size="22" fill="#252c28">Below the threshold</text><text x="40" y="408" font-size="20" fill="#252c28">with_subtotal(4999)</text><text x="40" y="446" font-size="18" fill="#626962">build() → real Order</text><path d="M72 476V532" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="512" font-size="18" fill="#626962">delivery_fee(order)</text><rect x="24" y="536" width="312" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="574" font-size="21" fill="#252c28">Expected fee: 500 cents</text><text x="40" y="606" font-size="17" fill="#626962">Assertion belongs to the test</text><text x="24" y="682" font-size="19" fill="#626962">Reuse the unchanged recipe</text><rect x="24" y="712" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="750" font-size="22" fill="#252c28">At the threshold</text><text x="40" y="788" font-size="20" fill="#252c28">with_subtotal(5000)</text><text x="40" y="826" font-size="17" fill="#626962">build() → another real Order</text><path d="M72 856V912" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="892" font-size="18" fill="#626962">delivery_fee(order)</text><rect x="24" y="916" width="312" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="954" font-size="21" fill="#252c28">Expected fee: 0 cents</text><text x="40" y="986" font-size="17" fill="#626962">Assertion belongs to the test</text><text x="24" y="1052" font-size="18" fill="#252c28">Same real delivery rule in both tests.</text><text x="24" y="1092" font-size="17" fill="#626962">The builder supplies no expected fee.</text></svg>
