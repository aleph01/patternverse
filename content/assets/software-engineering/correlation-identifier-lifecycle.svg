<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Correlation Identifier: pending-context lifecycle</title><desc id="desc">The matcher receives a reply for desk:C2. An untrusted or unexpected source does not consume its context. A valid reply from the expected carrier completes the express quote and removes desk:C2. A duplicate then has no pending match. Explicit cleanup removes abandoned desk:C3 so its later reply is also ignored.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1120" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Lookup does not by itself authorize completion</text><rect x="24" y="100" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">Reply correlation: desk:C2</text><text x="40" y="155" font-size="17" fill="#626962">Pending context: carrier / O42 / express</text><path d="M360 212V270H180V338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 270H540V338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="340" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="369" font-size="20" fill="#252c28">Unexpected source</text><text x="40" y="395" font-size="17" fill="#626962">Do not consume the context.</text><text x="40" y="434" font-size="17" fill="#626962">A valid answer can still arrive.</text><rect x="384" y="340" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="369" font-size="20" fill="#252c28">Expected source: carrier</text><text x="400" y="395" font-size="17" fill="#626962">Accept the validated answer.</text><text x="400" y="434" font-size="17" fill="#626962">Recover O42 / express.</text><path d="M180 484V618" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 484V618" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="620" width="312" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="649" font-size="20" fill="#252c28">Keep desk:C2 pending</text><text x="40" y="675" font-size="17" fill="#626962">Other contexts stay intact.</text><rect x="384" y="620" width="312" height="96" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="649" font-size="20" fill="#252c28">Remove pending desk:C2</text><text x="400" y="675" font-size="17" fill="#626962">Complete this context once.</text><path d="M540 716V802" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="384" y="804" width="312" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="833" font-size="20" fill="#252c28">Duplicate reply</text><text x="400" y="859" font-size="17" fill="#626962">No pending match: ignore.</text><text x="24" y="984" font-size="17" fill="#252c28">Explicit cleanup removes abandoned desk:C3; its later reply is ignored.</text><text x="24" y="1024" font-size="17" fill="#626962">Source identity is supplied by a trusted adapter, not proved by the ID.</text><text x="24" y="1064" font-size="17" fill="#626962">Local matching does not cancel or deduplicate remote operations.</text></svg>
