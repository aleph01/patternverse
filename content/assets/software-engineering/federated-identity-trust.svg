<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Delegated authentication and local authority</title><desc id="desc">Four summarized phases of an OpenID Connect code-flow sign-in: the portal starts a transaction bound to its browser session; the identity provider authenticates the user; a code callback and server token exchange let the portal verify the resulting identity; the portal creates its own session and applies local report permissions. The user’s credentials remain with the provider.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="1080" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Delegate authentication, retain local access</text><text x="24" y="78" font-size="19" fill="#626962">One OpenID Connect code-flow sign-in, summarized in four phases.</text><rect x="24" y="112" width="672" height="136" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="152" font-size="23" fill="#252c28">1 Portal starts sign-in</text><text x="40" y="194" font-size="19" fill="#252c28">Trusted issuer · registered callback</text><text x="40" y="230" font-size="19" fill="#626962">State · nonce · PKCE challenge (S256)</text><path d="M72 248V316" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="290" font-size="19" fill="#626962">Browser redirects to approved provider</text><rect x="24" y="320" width="672" height="152" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="360" font-size="23" fill="#252c28">2 Provider authenticates user</text><text x="40" y="404" font-size="19" fill="#252c28">Credentials remain at the identity provider.</text><text x="40" y="444" font-size="19" fill="#626962">Returns authorization code through the browser.</text><path d="M72 472V548" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="514" font-size="19" fill="#626962">Code callback, then TLS token exchange</text><rect x="24" y="552" width="672" height="184" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="592" font-size="23" fill="#252c28">3 Portal verifies returned identity</text><text x="40" y="632" font-size="19" fill="#252c28">Exchange code + PKCE verifier over TLS</text><text x="40" y="672" font-size="19" fill="#252c28">Issuer · signature · audience · time</text><text x="40" y="712" font-size="19" fill="#626962">Transaction binding · resolve (issuer, subject)</text><path d="M72 736V812" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="780" font-size="19" fill="#626962">Verified identity → local account</text><rect x="24" y="816" width="672" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="856" font-size="23" fill="#252c28">4 Portal establishes its session</text><text x="40" y="900" font-size="19" fill="#252c28">Local permissions govern each report request.</text><text x="40" y="940" font-size="19" fill="#252c28">Authenticated does not imply permitted.</text><text x="40" y="976" font-size="18" fill="#626962">The IdP session has a separate lifetime.</text><text x="24" y="1044" font-size="18" fill="#626962">Illustrated form: OpenID Connect authorization code + PKCE.</text></svg>
