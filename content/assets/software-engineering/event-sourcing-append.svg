<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Conditional append rejects stale decisions</title><desc id="desc">A release command based on revision two reaches a stream already at revision three and is rejected without adding an event. The caller must reload and reconsider. The accepted stream remains at revision three and replay still reports eighteen seats.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="960" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Append only against the state used to decide</text><rect x="24" y="112" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Release 1 seat from R1</text><text x="40" y="167" font-size="17" fill="#626962">Expected revision: 2</text><text x="40" y="244" font-size="18" fill="#626962">Earlier decision</text><rect x="384" y="112" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="141" font-size="20" fill="#252c28">Stored stream at revision 3</text><text x="400" y="167" font-size="17" fill="#626962">Opened / Reserved / Released</text><text x="400" y="244" font-size="18" fill="#626962">18 available; R1 holds 2</text><path d="M180 288V366H300V430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 288V366H420V430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="432" width="672" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="461" font-size="20" fill="#252c28">Conditional append in one transaction</text><text x="40" y="487" font-size="17" fill="#626962">Expected revision 2 ≠ current revision 3</text><text x="40" y="550" font-size="18" fill="#626962">Reject before INSERT; roll back. No new accepted fact.</text><path d="M360 592V670" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="672" width="672" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="701" font-size="20" fill="#252c28">Stream remains at revision 3</text><text x="40" y="727" font-size="17" fill="#626962">Reconstruction still yields 18 available and R1 holding 2.</text><text x="40" y="784" font-size="18" fill="#626962">Reload history and reconsider before proposing a new event.</text><text x="24" y="906" font-size="17" fill="#626962">Arrows: command input, current revision, and rejection outcome.</text></svg>
