<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1232" viewBox="0 0 360 1232" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Aggregator: completion and timeout lifecycle</title><desc id="desc">A group is open while only L1 is known. Arrival of L2 before the fixed 100 millisecond deadline closes it as complete. If L2 arrives at exactly 100 milliseconds, the group instead closes as timed out with L2 missing and no total. Valid late results and later polls do not release a second outcome.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1232" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">One group, two terminal paths</text><rect x="24" y="104" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Open: operation E902</text><text x="40" y="159" font-size="17" fill="#626962">Seen: L1 / 2 packed units</text><text x="40" y="210" font-size="18" fill="#626962">Missing: L2</text><text x="40" y="250" font-size="18" fill="#626962">Fixed deadline: 100 ms</text><path d="M180 280V320H12V464H46" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M12 464V744H46" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="48" y="384" width="288" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="64" y="413" font-size="20" fill="#252c28">If L2 arrives at 99 ms</text><text x="64" y="439" font-size="17" fill="#626962">complete / total: 3 units</text><text x="64" y="502" font-size="18" fill="#626962">Missing: none</text><rect x="48" y="664" width="288" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="693" font-size="20" fill="#252c28">If L2 arrives at 100 ms</text><text x="64" y="719" font-size="17" fill="#626962">timed_out / total: None</text><text x="64" y="782" font-size="18" fill="#626962">Missing: L2</text><rect x="24" y="936" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="965" font-size="20" fill="#252c28">Either path closes the group</text><text x="40" y="991" font-size="17" fill="#626962">Retain the terminal outcome.</text><text x="40" y="1044" font-size="16" fill="#626962">Later valid results: no new release.</text><text x="24" y="1176" font-size="17" fill="#626962">Timeout does not cancel workers.</text></svg>
