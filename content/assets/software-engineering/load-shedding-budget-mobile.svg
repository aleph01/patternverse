<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1240" viewBox="0 0 360 1240" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A three-unit policy admits only work that fits</title><desc id="desc">With capacity three, a running heavy search occupies two units. A second two-unit search would require four and is refused without invocation. A one-unit lookup fits exactly alongside the running search. After local work finishes and releases its units, a later heavy search can run. Policy units do not reserve execution threads or predict actual resource consumption.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#252c28" stroke-width="1.2"/></marker></defs><rect width="360" height="1240" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Admit only work that fits</text><rect x="24" y="112" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="146" font-size="20" fill="#252c28">Held heavy search / cost 2</text><rect x="40" y="186" width="30" height="30" fill="#00855b" stroke="#00855b" stroke-width="1.2"/><rect x="84" y="186" width="30" height="30" fill="#00855b" stroke="#00855b" stroke-width="1.2"/><rect x="128" y="186" width="30" height="30" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="248" font-size="18" fill="#626962">2 occupied / 1 available</text><text x="24" y="316" font-size="18" fill="#626962">While the first search is active</text><rect x="24" y="352" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="386" font-size="20" fill="#252c28">Next heavy / cost 2</text><text x="40" y="432" font-size="19" fill="#252c28">2 + 2 = 4 > 3 / refused</text><text x="40" y="474" font-size="17" fill="#626962">Callback is not invoked.</text><rect x="24" y="576" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="610" font-size="20" fill="#252c28">Light lookup / cost 1</text><text x="40" y="656" font-size="19" fill="#252c28">2 + 1 = 3 / fits exactly</text><text x="40" y="698" font-size="17" fill="#626962">Uses its available caller thread.</text><rect x="24" y="800" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="834" font-size="20" fill="#252c28">Held work finishes</text><text x="40" y="880" font-size="17" fill="#626962">Returns 2 units after cleanup.</text><text x="40" y="922" font-size="17" fill="#626962">Later heavy / cost 2 can run.</text><text x="24" y="1040" font-size="18" fill="#252c28">Same gate / capacity 3 policy units</text><text x="24" y="1080" font-size="17" fill="#626962">Equality fits; cost is trusted policy.</text><text x="24" y="1120" font-size="17" fill="#626962">No CPU, thread or rate reservation.</text><text x="24" y="1160" font-size="17" fill="#626962">Only this process shares the budget.</text><text x="24" y="1200" font-size="17" fill="#626962">No priority or fairness guarantee.</text></svg>
