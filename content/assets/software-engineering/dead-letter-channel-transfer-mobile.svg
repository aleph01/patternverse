<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1288" viewBox="0 0 360 1288" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Dead Letter Channel: safe local handoff</title><desc id="desc">One local SQLite transaction inserts the complete failure record and deletes the pending record. Commit leaves the instruction in the dead letter channel. A full destination or an error before commit leaves the source instruction intact. Broker acknowledgments and remote processing effects are outside this database simulation.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1288" fill="#fff"/><text x="24" y="34" font-size="21" fill="#252c28">Transfer without losing the source</text><rect x="24" y="112" width="312" height="208" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">One local SQLite transaction</text><text x="40" y="167" font-size="17" fill="#626962">Insert the complete failure record.</text><text x="40" y="222" font-size="17" fill="#626962">Delete the matching pending row.</text><text x="40" y="270" font-size="17" fill="#626962">Commit both changes together.</text><path d="M180 320V360H12V496H46" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M12 496V760H46" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="48" y="416" width="288" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="64" y="445" font-size="20" fill="#252c28">Destination accepts</text><text x="64" y="471" font-size="17" fill="#626962">Commit: pending 0 / dead 1</text><text x="64" y="532" font-size="15" fill="#626962">E901 remains available for recovery.</text><rect x="48" y="672" width="288" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="701" font-size="20" fill="#252c28">Full channel or write error</text><text x="64" y="727" font-size="17" fill="#626962">Rollback: pending row retained</text><text x="64" y="788" font-size="18" fill="#626962">No silent deletion.</text><text x="64" y="828" font-size="16" fill="#626962">Raise the failure to the caller.</text><rect x="24" y="960" width="312" height="192" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="989" font-size="18" fill="#252c28">Outside this simulation</text><text x="40" y="1015" font-size="16" fill="#626962">Broker-to-store transfer</text><text x="40" y="1070" font-size="17" fill="#626962">needs its own safety contract.</text><text x="40" y="1112" font-size="16" fill="#626962">Earlier business effects may exist.</text><text x="24" y="1232" font-size="15" fill="#626962">Branches: alternative transaction outcomes.</text></svg>
