<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1072" viewBox="0 0 360 1072" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Own the work; separate the waits</title><desc id="desc">A, B, and C initially await one price load. B cancels only its wait. The load continues and A and C receive 1200 cents. Completion retires flight 1. A later caller starts flight 2, increasing the loader count from one to two.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1072" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Own the work; separate waits</text><text x="24" y="78" font-size="17" fill="#626962">Event-controlled execution.</text><rect x="24" y="112" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="146" font-size="19" fill="#252c28">1. Three callers join flight 1</text><text x="40" y="194" font-size="18" fill="#252c28">A, B, C await the same task</text><text x="40" y="238" font-size="18" fill="#626962">Underlying loads: 1</text><path d="M72 272V332" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="310" font-size="17" fill="#626962">Cancel B’s wait</text><rect x="24" y="336" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="370" font-size="19" fill="#252c28">2. B cancels its wait</text><text x="40" y="418" font-size="18" fill="#252c28">A and C remain attached</text><text x="40" y="462" font-size="18" fill="#626962">Flight 1 continues</text><path d="M72 496V556" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="534" font-size="17" fill="#626962">Complete loader</text><rect x="24" y="560" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="594" font-size="19" fill="#252c28">3. Flight 1 completes</text><text x="40" y="642" font-size="18" fill="#252c28">A and C receive 1200 cents</text><text x="40" y="686" font-size="18" fill="#626962">Retire flight 1</text><path d="M72 720V780" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="758" font-size="17" fill="#626962">New call after completion</text><rect x="24" y="784" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="818" font-size="19" fill="#252c28">4. Later call starts flight 2</text><text x="40" y="866" font-size="18" fill="#252c28">No completed-price cache</text><text x="40" y="910" font-size="18" fill="#626962">Underlying loads: 2</text><text x="24" y="996" font-size="19" fill="#252c28">Wait cancellation is local.</text><text x="24" y="1030" font-size="17" fill="#626962">Shared work needs its own deadline.</text></svg>
