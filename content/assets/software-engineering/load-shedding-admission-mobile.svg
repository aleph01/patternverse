<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1144" viewBox="0 0 360 1144" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Refuse before the expensive path</title><desc id="desc">A request reaches a cheap admission decision before expensive work. If its trusted work cost fits the remaining budget, that cost is claimed and the operation runs. If it does not fit, the service returns an explicit overload result without invoking the operation or adding it to an internal waiting queue. Claimed budget returns after local completion and cleanup.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#252c28" stroke-width="1.2"/></marker></defs><rect width="360" height="1144" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Refuse before expensive work</text><rect x="24" y="80" width="312" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="110" font-size="20" fill="#252c28">Request / cheap checks</text><text x="40" y="140" font-size="17" fill="#626962">Classify before protected work.</text><path d="M100 160V190" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#control)"/><rect x="24" y="192" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="226" font-size="22" fill="#252c28">Admission decision</text><text x="40" y="272" font-size="19" fill="#252c28">Does the declared cost fit?</text><text x="40" y="312" font-size="17" fill="#626962">Trusted policy; cover all paths.</text><path d="M100 336V454" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M336 264H348V840H338" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#control)"/><rect x="24" y="456" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="488" font-size="20" fill="#252c28">Fits / claim budget</text><text x="40" y="530" font-size="17" fill="#252c28">Invoke the protected operation.</text><text x="40" y="574" font-size="17" fill="#626962">Release after local cleanup.</text><rect x="24" y="760" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="792" font-size="20" fill="#252c28">Does not fit / refuse</text><text x="40" y="834" font-size="17" fill="#252c28">Operation is never invoked.</text><text x="40" y="878" font-size="17" fill="#626962">No internal waiting queue.</text><text x="24" y="1016" font-size="18" fill="#252c28">The refusal path still costs work.</text><text x="24" y="1060" font-size="17" fill="#626962">No silent promise to process later.</text><text x="24" y="1104" font-size="17" fill="#626962">Arrows: admission control flow.</text></svg>
