<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Four filters connected by explicit stream contracts</title><desc id="desc">CSV records become Celsius readings, are selected at a 25 °C threshold, converted to Fahrenheit pairs, and formatted as text. A reading of 25 °C becomes 77.0 F; 18 °C is omitted.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="demand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="430" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Each stage owns one transformation</text><text x="24" y="90" font-size="20" fill="#252c28">Example input: loft,25.0</text><rect x="24" y="142" width="144" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="171" font-size="20" fill="#252c28">Parse</text><text x="40" y="197" font-size="17" fill="#626962">CSV → °C</text><text x="24" y="276" font-size="16" fill="#626962">CelsiusReading</text><text x="24" y="310" font-size="18" fill="#252c28">loft · 25 °C</text><path d="M168 192H198" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="200" y="142" width="144" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="216" y="171" font-size="20" fill="#252c28">Select</text><text x="216" y="197" font-size="17" fill="#626962">Keep ≥25 °C</text><text x="200" y="276" font-size="16" fill="#626962">CelsiusReading</text><text x="200" y="310" font-size="18" fill="#252c28">loft · 25 °C</text><path d="M344 192H374" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="376" y="142" width="144" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="392" y="171" font-size="20" fill="#252c28">Convert</text><text x="392" y="197" font-size="17" fill="#626962">°C → °F</text><text x="376" y="276" font-size="16" fill="#626962">(sensor, °F)</text><text x="376" y="310" font-size="18" fill="#252c28">loft · 77 °F</text><path d="M520 192H550" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="552" y="142" width="144" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="568" y="171" font-size="20" fill="#252c28">Format</text><text x="568" y="197" font-size="17" fill="#626962">Value → text</text><text x="552" y="276" font-size="16" fill="#626962">string</text><text x="552" y="310" font-size="18" fill="#252c28">loft: 77.0 F</text><text x="24" y="368" font-size="18" fill="#252c28">18 °C records stop at Select.</text><text x="24" y="402" font-size="17" fill="#626962">Arrows show data flow. Filter order is part of the contract.</text></svg>
