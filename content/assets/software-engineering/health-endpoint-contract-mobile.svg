<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1264" viewBox="0 0 360 1264" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">The endpoint reports; the observer decides</title><desc id="desc">An external prober calls an instance's health endpoint. The handler reads declared local lifecycle and dependency observations and returns a small status. The observer applies configured timing and thresholds before changing routing, startup gating, or restart behavior. The endpoint does not perform those actions itself.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#252c28" stroke-width="1.2"/></marker></defs><rect width="360" height="1264" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Report evidence; apply policy</text><rect x="24" y="104" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="138" font-size="20" fill="#252c28">Prober / declared consumer</text><text x="40" y="182" font-size="17" fill="#626962">Knows the question being asked.</text><path d="M300 216V358" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#control)"/><path d="M70 360V218" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="104" y="268" font-size="17" fill="#252c28">Health request</text><text x="90" y="320" font-size="17" fill="#626962">Status / timing</text><rect x="24" y="360" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="394" font-size="20" fill="#252c28">Instance / health handler</text><text x="40" y="442" font-size="18" fill="#252c28">Small, explicit response.</text><text x="40" y="492" font-size="17" fill="#626962">One snapshot per stateful probe.</text><path d="M300 648V538" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="596" font-size="17" fill="#626962">Reads declared evidence</text><rect x="24" y="648" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="682" font-size="20" fill="#252c28">Local lifecycle + selected</text><text x="40" y="720" font-size="20" fill="#252c28">dependency observations</text><text x="40" y="774" font-size="17" fill="#626962">Bounded check or aged snapshot.</text><path d="M336 160H348V1072H338" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#control)"/><rect x="24" y="992" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1026" font-size="20" fill="#252c28">Observer owns the action</text><text x="40" y="1070" font-size="17" fill="#252c28">Configure routing, startup gating,</text><text x="40" y="1110" font-size="17" fill="#252c28">restart, or alert policy.</text><text x="40" y="1150" font-size="17" fill="#626962">Endpoint does not act on itself.</text><text x="24" y="1220" font-size="17" fill="#626962">Timing and thresholds are configured.</text></svg>
