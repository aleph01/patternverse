<svg xmlns="http://www.w3.org/2000/svg" width="360" height="872" viewBox="0 0 360 872" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A stable core with independent optional analyzers</title><desc id="desc">A document request enters the core, which normalizes text and produces the base line count. Through the analyzer contract, the core calls independent word-count and TODO-count plug-ins, then assembles their results.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="872" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Keep the core;</text><text x="24" y="60" font-size="22" fill="#252c28">extend its capabilities</text><rect x="24" y="96" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="125" font-size="20" fill="#252c28">Document text</text><text x="40" y="151" font-size="17" fill="#626962">inspect(text)</text><path d="M180 172V218" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="202" font-size="17" fill="#252c28">request</text><rect x="24" y="220" width="312" height="244" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="252" font-size="21" fill="#252c28">Document core</text><text x="40" y="286" font-size="18" fill="#252c28">Normalize · count lines</text><text x="40" y="314" font-size="18" fill="#252c28">Assemble complete report</text><rect x="44" y="348" width="272" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="377" font-size="20" fill="#252c28">Analyzer API v1</text><text x="60" y="403" font-size="17" fill="#626962">analyze(text) → count</text><path d="M316 386H348V548H96V578" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M264 548V578" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="508" font-size="20" fill="#252c28">Optional capabilities</text><text x="292" y="536" font-size="17" fill="#252c28">calls</text><rect x="24" y="580" width="144" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="609" font-size="18" fill="#252c28">WordCount</text><text x="40" y="635" font-size="16" fill="#626962">Token count</text><rect x="192" y="580" width="144" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="208" y="609" font-size="18" fill="#252c28">TodoCount</text><text x="208" y="635" font-size="16" fill="#626962">TODO lines</text><path d="M24 440H12V752H22" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="700" font-size="17" fill="#252c28">result</text><rect x="24" y="714" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="743" font-size="20" fill="#252c28">Complete report</text><text x="40" y="769" font-size="17" fill="#626962">Base + extension counts</text><text x="24" y="840" font-size="17" fill="#626962">Base report works without plug-ins.</text></svg>
