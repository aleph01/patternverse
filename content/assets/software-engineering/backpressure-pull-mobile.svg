<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1144" viewBox="0 0 360 1144" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A completed write permits the next read</title><desc id="desc">The transfer reads the first chunk and awaits its sink write. While the write is blocked, it does not request chunk two. Completion permits the next read. After all three chunks complete, the generator is closed and the result reports three chunks and six bytes. Failure or cancellation exits through source closing instead of requesting further chunks.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="data" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#252c28" stroke-width="1.2"/></marker></defs><rect width="360" height="1144" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Await before advancing</text><rect x="24" y="112" width="312" height="152" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="144" font-size="18" fill="#252c28">Read first chunk / 1 byte</text><text x="40" y="192" font-size="17" fill="#626962">Call the asynchronous writer.</text><text x="40" y="236" font-size="17" fill="#626962">One unfinished invocation.</text><rect x="24" y="328" width="312" height="152" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="360" font-size="18" fill="#252c28">Await write / held by an event</text><text x="40" y="408" font-size="17" fill="#626962">Read count 1 / completed bytes 0</text><text x="40" y="452" font-size="17" fill="#626962">No request for chunk two.</text><rect x="24" y="568" width="312" height="152" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="600" font-size="18" fill="#252c28">Completion permits next read</text><text x="40" y="648" font-size="17" fill="#626962">Finish the callback; then advance.</text><text x="40" y="692" font-size="17" fill="#626962">No per-chunk task queue.</text><rect x="24" y="808" width="312" height="152" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="840" font-size="18" fill="#252c28">Exhaustion / source closed</text><text x="40" y="888" font-size="17" fill="#626962">3 chunks / 6 bytes completed</text><text x="40" y="932" font-size="17" fill="#626962">The generator is closed.</text><path d="M300 264V326" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#data)"/><path d="M300 480V566" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M300 720V806" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#data)"/><text x="24" y="1016" font-size="17" fill="#252c28">Failure or cancellation: close source.</text><text x="24" y="1060" font-size="17" fill="#626962">Ownership starts with transfer.</text><text x="24" y="1104" font-size="17" fill="#626962">The callback owns its sink cleanup.</text></svg>
