<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1312" viewBox="0 0 360 1312" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Same key, different snapshot owners</title><desc id="desc">Two estimator instances own separate immutable snapshots and memo tables. Snapshot S1 has parsing duration 2 minutes and caches task key 4 as finish time 9 minutes. Snapshot S2 has parsing duration 20 minutes and caches the same task key 4 as 27 minutes. Editing the caller’s input does not change S1.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1312" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Same key, different owners</text><text x="24" y="78" font-size="17" fill="#626962">Finish times are integer minutes.</text><text x="24" y="140" font-size="21" fill="#252c28">S1 / original estimator</text><rect x="24" y="176" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="208" font-size="21" fill="#252c28">Frozen input</text><text x="40" y="252" font-size="19" fill="#626962">Task 0 duration: 2 min</text><path d="M180 288V328" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="204" y="316" font-size="17" fill="#626962">Calculate</text><rect x="24" y="332" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="364" font-size="21" fill="#252c28">Owned memo table</text><text x="40" y="412" font-size="22" fill="#252c28">Task key 4 → 9 min</text><text x="24" y="492" font-size="20" fill="#252c28">Estimate task 4: 9 minutes</text><text x="24" y="528" font-size="16" fill="#626962">No entries shared with the other owner.</text><text x="24" y="616" font-size="21" fill="#252c28">S2 / fresh estimator</text><rect x="24" y="652" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="684" font-size="21" fill="#252c28">Frozen input</text><text x="40" y="728" font-size="19" fill="#626962">Task 0 duration: 20 min</text><path d="M180 764V804" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="204" y="792" font-size="17" fill="#626962">Calculate</text><rect x="24" y="808" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="840" font-size="21" fill="#252c28">Owned memo table</text><text x="40" y="888" font-size="22" fill="#252c28">Task key 4 → 27 min</text><text x="24" y="968" font-size="20" fill="#252c28">Estimate task 4: 27 minutes</text><text x="24" y="1004" font-size="16" fill="#626962">No entries shared with the other owner.</text><rect x="24" y="1100" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1132" font-size="17" fill="#252c28">Editing caller input leaves S1 intact.</text><text x="40" y="1174" font-size="17" fill="#626962">Clear: remove completed entries.</text><text x="40" y="1216" font-size="17" fill="#626962">Recompute: use the same snapshot.</text><text x="40" y="1258" font-size="17" fill="#626962">New input needs a fresh estimator.</text></svg>
