<svg xmlns="http://www.w3.org/2000/svg" width="720" height="740" viewBox="0 0 720 740" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Composed specification and boundary examples</title><desc id="desc">A composed printing policy requires approved OR proof copy, at most 40 pages, and NOT cancelled. Job A has approval and exactly 40 pages and passes. B has 41 pages and fails. C is an unapproved proof copy within the limit and passes. D has neither approval nor the exception and fails. E is cancelled and fails despite approval.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="740" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Grouped rules keep the exception bounded</text><rect x="24" y="84" width="672" height="156" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="118" font-size="22" fill="#252c28">(approved OR proof_copy)</text><text x="40" y="156" font-size="22" fill="#252c28">AND pages ≤ 40</text><text x="40" y="194" font-size="22" fill="#252c28">AND NOT cancelled</text><path d="M360 240V284" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="378" y="274" font-size="17" fill="#626962">All groups must hold</text><rect x="24" y="286" width="672" height="52" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="320" font-size="18" fill="#252c28">Job</text><text x="118" y="320" font-size="18" fill="#252c28">Pages</text><text x="222" y="320" font-size="18" fill="#252c28">Approval group</text><text x="438" y="320" font-size="18" fill="#252c28">Cancelled</text><text x="590" y="320" font-size="18" fill="#252c28">Result</text><rect x="24" y="338" width="672" height="56" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="373" font-size="18" fill="#252c28">A</text><text x="118" y="373" font-size="18" fill="#252c28">40</text><text x="222" y="373" font-size="18" fill="#252c28">approved</text><text x="438" y="373" font-size="18" fill="#252c28">False</text><text x="590" y="373" font-size="18" fill="#252c28">True</text><rect x="24" y="394" width="672" height="56" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="429" font-size="18" fill="#252c28">B</text><text x="118" y="429" font-size="18" fill="#252c28">41</text><text x="222" y="429" font-size="18" fill="#252c28">approved</text><text x="438" y="429" font-size="18" fill="#252c28">False</text><text x="590" y="429" font-size="18" fill="#252c28">False</text><rect x="24" y="450" width="672" height="56" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="485" font-size="18" fill="#252c28">C</text><text x="118" y="485" font-size="18" fill="#252c28">4</text><text x="222" y="485" font-size="18" fill="#252c28">proof copy</text><text x="438" y="485" font-size="18" fill="#252c28">False</text><text x="590" y="485" font-size="18" fill="#252c28">True</text><rect x="24" y="506" width="672" height="56" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="541" font-size="18" fill="#252c28">D</text><text x="118" y="541" font-size="18" fill="#252c28">4</text><text x="222" y="541" font-size="18" fill="#252c28">neither</text><text x="438" y="541" font-size="18" fill="#252c28">False</text><text x="590" y="541" font-size="18" fill="#252c28">False</text><rect x="24" y="562" width="672" height="56" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="597" font-size="18" fill="#252c28">E</text><text x="118" y="597" font-size="18" fill="#252c28">4</text><text x="222" y="597" font-size="18" fill="#252c28">approved</text><text x="438" y="597" font-size="18" fill="#252c28">True</text><text x="590" y="597" font-size="18" fill="#252c28">False</text><text x="24" y="670" font-size="19" fill="#252c28">D’s approval group fails; E is cancelled.</text><text x="24" y="710" font-size="17" fill="#626962">C’s exception does not override the page cap or cancellation.</text></svg>
