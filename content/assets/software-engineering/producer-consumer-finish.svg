<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1176" viewBox="0 0 720 1176" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Producer-Consumer: completion and shutdown</title><desc id="desc">The coordinator first finishes all producers, then enqueues one stop marker per consumer behind accepted jobs, waits for queue task accounting, and joins the consumer threads. Consumers keep removing and handling jobs during shutdown, recording either a measurement or a rejection before task_done; each exits after its own stop marker.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1176" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Shutdown: the coordinator waits; consumers keep running</text><rect x="24" y="112" width="416" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">Finish every producer</text><text x="40" y="167" font-size="16" fill="#626962">Last data job accepted; no later puts.</text><path d="M232 256V334" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="336" width="416" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="365" font-size="18" fill="#252c28">Put two private stop markers</text><text x="40" y="391" font-size="16" fill="#626962">One per consumer, after the jobs.</text><path d="M232 480V558" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="560" width="416" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="589" font-size="18" fill="#252c28">pending.join()</text><text x="40" y="615" font-size="16" fill="#626962">Wait for task accounting to reach zero.</text><path d="M232 704V782" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="784" width="416" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="813" font-size="18" fill="#252c28">Join both consumer threads</text><text x="40" y="839" font-size="16" fill="#626962">Wait for their termination; read results.</text><rect x="480" y="112" width="216" height="592" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="496" y="148" font-size="20" fill="#252c28">Consumers run</text><text x="496" y="184" font-size="18" fill="#252c28">during steps 1–3.</text><text x="496" y="264" font-size="18" fill="#252c28">For a data job:</text><text x="496" y="306" font-size="18" fill="#252c28">get</text><text x="496" y="348" font-size="17" fill="#252c28">handle + outcome</text><text x="496" y="390" font-size="18" fill="#252c28">task_done</text><text x="496" y="474" font-size="18" fill="#252c28">For a stop entry:</text><text x="496" y="516" font-size="18" fill="#252c28">get</text><text x="496" y="558" font-size="18" fill="#252c28">task_done</text><text x="496" y="600" font-size="18" fill="#252c28">exit</text><text x="496" y="670" font-size="15" fill="#626962">No queue lock at work.</text><text x="480" y="780" font-size="16" fill="#626962">Stops can be consumed</text><text x="480" y="816" font-size="16" fill="#626962">while the coordinator</text><text x="480" y="852" font-size="16" fill="#626962">is still sending stops.</text><text x="24" y="1040" font-size="19" fill="#252c28">Queue completion counts handled jobs, including rejected readings.</text><text x="24" y="1080" font-size="17" fill="#626962">A drained queue does not by itself prove that workers have terminated.</text><text x="24" y="1130" font-size="17" fill="#626962">Arrows: coordinator call order. Consumer execution overlaps it.</text></svg>
