<svg xmlns="http://www.w3.org/2000/svg" width="720" height="936" viewBox="0 0 720 936" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">View, presentation model, and domain profile boundaries</title><desc id="desc">A view maps its name field, feedback label, and enabled buttons to a presentation model containing draft text, validation, and Apply/Cancel behavior. Apply invokes the domain profile’s rename operation; Cancel reloads the current name. The presentation model has no widget reference. The view owns mapping or binding.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="936" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Separate editing state from accepted data</text><rect x="24" y="100" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">View: layout and mapping</text><text x="40" y="155" font-size="17" fill="#626962">Name field; feedback label; enabled buttons</text><rect x="24" y="344" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="373" font-size="20" fill="#252c28">Presentation model: a model of the editing session</text><text x="40" y="399" font-size="17" fill="#626962">draft; error; can_apply; can_cancel; apply(); cancel()</text><text x="40" y="458" font-size="17" fill="#626962">The editor has no reference to widgets or a view interface.</text><path d="M180 212V342" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="278" font-size="17" fill="#626962">draft / actions</text><path d="M540 344V214" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="298" font-size="17" fill="#626962">properties</text><rect x="24" y="656" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="685" font-size="20" fill="#252c28">Domain profile</text><text x="40" y="711" font-size="17" fill="#626962">Accepted name and its independent validity rule</text><path d="M180 488V654" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="570" font-size="17" fill="#626962">Apply: rename</text><path d="M540 656V490" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="610" font-size="17" fill="#626962">read name</text><text x="24" y="840" font-size="18" fill="#252c28">Cancel reloads the current name and discards the editing draft.</text><text x="24" y="888" font-size="18" fill="#252c28">The view owns binding or explicit synchronization.</text></svg>
