<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1168" viewBox="0 0 360 1168" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Invalid drafts stay outside accepted domain state</title><desc id="desc">The accepted profile name is Ada. A blank draft produces an error, disables Apply, and leaves Ada unchanged. Replacing the draft with Grace enables Apply. Applying invokes domain validation and changes the accepted name to Grace, after which Apply and Cancel are disabled.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1168" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Keep the draft separate</text><text x="24" y="60" font-size="22" fill="#252c28">until Apply succeeds</text><rect x="24" y="104" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Accepted name: Ada</text><text x="40" y="159" font-size="17" fill="#626962">Editor begins with draft: Ada.</text><path d="M180 208V294" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="260" font-size="17" fill="#626962">edit draft</text><rect x="24" y="296" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="325" font-size="20" fill="#252c28">Draft: two spaces</text><text x="40" y="351" font-size="17" fill="#626962">Apply disabled; Cancel enabled.</text><text x="40" y="406" font-size="17" fill="#626962">Error: name needs 1–40 chars.</text><path d="M180 440V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="492" font-size="17" fill="#626962">Apply rejects</text><rect x="24" y="528" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="557" font-size="20" fill="#252c28">Accepted name stays Ada</text><text x="40" y="583" font-size="17" fill="#626962">Invalid draft remains editable.</text><path d="M180 632V718" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="684" font-size="17" fill="#626962">edit draft</text><rect x="24" y="720" width="312" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="749" font-size="20" fill="#252c28">Draft: Grace</text><text x="40" y="775" font-size="17" fill="#626962">Apply enabled; Cancel enabled.</text><path d="M180 824V910" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="876" font-size="16" fill="#626962">Apply succeeds</text><rect x="24" y="912" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="941" font-size="20" fill="#252c28">Accepted name: Grace</text><text x="40" y="967" font-size="17" fill="#626962">Draft becomes Grace; Saved.</text><text x="40" y="1026" font-size="17" fill="#626962">Apply and Cancel disabled.</text><text x="24" y="1120" font-size="18" fill="#252c28">Validation also runs on Apply.</text></svg>
