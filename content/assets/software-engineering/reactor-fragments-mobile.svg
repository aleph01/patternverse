<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1104" viewBox="0 0 360 1104" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Reactor fragmented records</title><desc id="desc">A first sends hel without a newline, so its handler retains three bytes and returns. B sends ok followed by a newline and completes independently. A later sends lo followed by a newline, completing hello. A final incomplete record at EOF is rejected and its socket is unregistered before closing.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1104" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">A fragment need not stall B</text><rect x="24" y="112" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">1 / A receives hel</text><text x="40" y="167" font-size="16" fill="#626962">No LF terminator / no record yet</text><text x="40" y="222" font-size="15" fill="#626962">Keep A’s buffer; return to the loop.</text><path d="M180 256V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="320" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="349" font-size="18" fill="#252c28">2 / B receives ok + LF</text><text x="40" y="375" font-size="16" fill="#626962">Emit B’s complete record: ok</text><text x="40" y="430" font-size="15" fill="#626962">B does not wait for A’s terminator.</text><path d="M180 464V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="528" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="557" font-size="18" fill="#252c28">3 / A receives lo + LF</text><text x="40" y="583" font-size="16" fill="#626962">Retained hel + lo becomes hello.</text><text x="40" y="638" font-size="15" fill="#626962">Emit A’s complete record; clear buffer.</text><path d="M180 672V734" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="736" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="765" font-size="18" fill="#252c28">4 / A receives x, then EOF</text><text x="40" y="791" font-size="16" fill="#626962">Reject the unfinished suffix x.</text><text x="40" y="846" font-size="16" fill="#626962">Unregister A before closing it.</text><text x="24" y="970" font-size="16" fill="#626962">Arrows: one explanatory event trace.</text><text x="24" y="1010" font-size="16" fill="#626962">LF is the record terminator byte.</text><text x="24" y="1050" font-size="16" fill="#626962">Selector ordering is not guaranteed.</text></svg>
