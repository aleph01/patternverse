<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1144" viewBox="0 0 360 1144" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Template structure and presentation data are separate render inputs</title><desc id="desc">A trusted HTML template contains name, availability, and units markers. A separate preparation step supplies raw display strings from application data. The renderer escapes those values for HTML text and substitutes them into the template, producing one HTML fragment. Template structure and request-specific data remain separate inputs.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1144" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Structure and data meet</text><text x="24" y="60" font-size="22" fill="#252c28">at the rendering boundary</text><rect x="24" y="104" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Trusted product.html</text><text x="40" y="159" font-size="17" fill="#626962">&lt;h1>${name}&lt;/h1></text><text x="40" y="214" font-size="17" fill="#626962">Also: availability and units.</text><rect x="24" y="328" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="357" font-size="20" fill="#252c28">Prepared context</text><text x="40" y="383" font-size="17" fill="#626962">name: A&amp;B &lt;Lab></text><text x="40" y="414" font-size="17" fill="#626962">availability: In stock</text><text x="40" y="450" font-size="17" fill="#626962">units: 3</text><text x="24" y="568" font-size="18" fill="#252c28">Two inputs; one render operation.</text><rect x="24" y="656" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="685" font-size="20" fill="#252c28">Renderer</text><text x="40" y="711" font-size="17" fill="#626962">Escape values; substitute slots.</text><text x="40" y="766" font-size="17" fill="#626962">All slots are HTML text here.</text><path d="M24 176H12V712H22" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M336 416H348V712H338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 800V926" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="864" font-size="17" fill="#626962">HTML source</text><rect x="24" y="928" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="957" font-size="20" fill="#252c28">HTML fragment</text><text x="40" y="983" font-size="17" fill="#626962">&lt;h1>A&amp;amp;B &amp;lt;Lab&amp;gt;&lt;/h1></text><text x="24" y="1096" font-size="18" fill="#252c28">New escaped mapping per call.</text></svg>
