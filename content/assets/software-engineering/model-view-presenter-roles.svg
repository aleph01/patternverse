<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1024" viewBox="0 0 720 1024" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">MVP with a passive view and an interchangeable recording view</title><desc id="desc">A reservation view forwards quantity text to a presenter. The presenter commands the booking model and reads its remaining seats, then sends display text, button availability, and a message back to the view. In the Passive View example there is no direct model-to-view connection. A recording view implements the same render contract during tests.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1024" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A presenter coordinates a passive view</text><rect x="24" y="100" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">View: widget adapter</text><text x="40" y="155" font-size="17" fill="#626962">Forward quantity text: &quot;2&quot;.</text><rect x="24" y="336" width="312" height="124" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="365" font-size="20" fill="#252c28">Presenter: handle input</text><text x="40" y="391" font-size="17" fill="#626962">Parse text; call reserve(2).</text><path d="M180 212V334" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="280" font-size="17" fill="#626962">event</text><rect x="384" y="336" width="312" height="124" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="365" font-size="20" fill="#252c28">Booking model</text><text x="400" y="391" font-size="17" fill="#626962">Enforce capacity; mutate.</text><path d="M336 382H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="341" y="363" font-size="16" fill="#626962">call</text><path d="M384 430H338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="390" y="504" font-size="17" fill="#626962">read remaining: 1</text><rect x="24" y="580" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="609" font-size="20" fill="#252c28">Same presenter: derive the screen result</text><text x="40" y="635" font-size="17" fill="#626962">Seats left: 1; Reserve enabled; message: Reserved</text><path d="M180 460V578" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="526" font-size="17" fill="#626962">refresh</text><rect x="24" y="804" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="833" font-size="20" fill="#252c28">Same view: apply values</text><text x="40" y="859" font-size="17" fill="#626962">Widget properties only.</text><rect x="384" y="804" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="833" font-size="20" fill="#252c28">Or: recording view</text><text x="400" y="859" font-size="17" fill="#626962">Record values for assertions.</text><path d="M180 692V802" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="752" font-size="17" fill="#626962">render(screen)</text><path d="M540 692V802" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="752" font-size="17" fill="#626962">same contract</text><text x="24" y="972" font-size="18" fill="#252c28">No direct view/model link in this Passive View example.</text></svg>
