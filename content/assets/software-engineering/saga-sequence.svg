<svg xmlns="http://www.w3.org/2000/svg" width="720" height="904" viewBox="0 0 720 904" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Saga local steps and compensating work</title><desc id="desc">Inventory reserves two mugs for O42, Packing reserves one slot, and Carrier declines delivery without committing it. Compensation releases the packing slot and then the Inventory reservation. Each effect belongs to its participant; there is no shared rollback.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="904" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Forward progress and compensation are separate work</text><rect x="24" y="112" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">T1 / Inventory accepts</text><text x="40" y="167" font-size="17" fill="#626962">O42 reserves 2 physical mugs</text><text x="40" y="220" font-size="17" fill="#626962">Local effect committed</text><rect x="384" y="112" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="141" font-size="20" fill="#252c28">T2 / Packing accepts</text><text x="400" y="167" font-size="17" fill="#626962">O42 reserves 1 packing slot</text><text x="400" y="220" font-size="17" fill="#626962">Local effect committed</text><path d="M336 184H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 256V334" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="384" y="336" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="365" font-size="20" fill="#252c28">T3 / Carrier declines</text><text x="400" y="391" font-size="17" fill="#626962">No delivery effect committed</text><text x="400" y="444" font-size="17" fill="#626962">Triggers this plan’s recovery</text><path d="M540 480V558" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="384" y="560" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="589" font-size="18" fill="#252c28">C2 / Release packing</text><text x="400" y="615" font-size="16" fill="#626962">New local operation / O42 only</text><text x="400" y="668" font-size="17" fill="#626962">Explicit compensation</text><path d="M384 632H338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="560" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="589" font-size="18" fill="#252c28">C1 / Release inventory</text><text x="40" y="615" font-size="16" fill="#626962">New local operation / O42 only</text><text x="40" y="668" font-size="17" fill="#626962">Explicit compensation</text><text x="24" y="810" font-size="19" fill="#252c28">Arrows: T1 → T2 → T3 refusal → C2 → C1.</text><text x="24" y="850" font-size="18" fill="#626962">Participants own local effects. There is no shared rollback.</text></svg>
