<svg xmlns="http://www.w3.org/2000/svg" width="720" height="848" viewBox="0 0 720 848" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Builder reuse and independent mutable children</title><desc id="desc">One immutable order builder produces Order A and Order B, each with its own empty notes list. Adding fragile to Order A changes only A’s list. Configuring an express variant creates a separate builder recipe and leaves the base recipe standard.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="848" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Reusing a recipe must not share mutable results</text><text x="24" y="84" font-size="18" fill="#626962">Immutable builder configuration and fresh child lists solve different problems.</text><rect x="24" y="120" width="672" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="160" font-size="22" fill="#252c28">Base OrderBuilder</text><text x="40" y="200" font-size="19" fill="#626962">Standard delivery · notes = () · fixed fixture ID O17</text><path d="M180 224V312" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="272" font-size="18" fill="#626962">build()</text><path d="M540 224V312" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="564" y="272" font-size="18" fill="#626962">build()</text><rect x="24" y="316" width="312" height="136" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="358" font-size="22" fill="#252c28">Order A · list A</text><text x="40" y="398" font-size="19" fill="#252c28">append(&quot;fragile&quot;)</text><text x="40" y="432" font-size="19" fill="#252c28">notes = ['fragile']</text><rect x="384" y="316" width="312" height="136" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="358" font-size="22" fill="#252c28">Order B · list B</text><text x="400" y="398" font-size="19" fill="#626962">No append here</text><text x="400" y="432" font-size="19" fill="#252c28">notes = []</text><text x="24" y="500" font-size="19" fill="#626962">A and B are separate objects with separate notes lists.</text><text x="24" y="570" font-size="19" fill="#626962">Configuration reuse</text><rect x="24" y="604" width="264" height="108" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="646" font-size="22" fill="#252c28">Base recipe</text><text x="40" y="688" font-size="19" fill="#626962">express = False</text><path d="M288 660H432" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="306" y="638" font-size="18" fill="#626962">derive</text><rect x="432" y="604" width="264" height="108" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="448" y="646" font-size="22" fill="#252c28">New variant recipe</text><text x="448" y="688" font-size="19" fill="#252c28">express = True</text><text x="24" y="760" font-size="19" fill="#252c28">with_express() creates the variant; the base stays standard.</text><text x="24" y="808" font-size="18" fill="#626962">Fresh objects do not make fixed IDs unique or orders thread-safe.</text></svg>
