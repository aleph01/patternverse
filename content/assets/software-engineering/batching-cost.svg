<svg xmlns="http://www.w3.org/2000/svg" width="720" height="872" viewBox="0 0 720 872" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Share the fixed cost</title><desc id="desc">Seven individual calls would each pay five milliseconds of fixed overhead plus one millisecond per item, totaling 42 milliseconds of modeled service work. The example emits four batches containing three, one, one, and two items, totaling 27 milliseconds under the same assumptions. Collection waiting is excluded.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="872" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Same seven items, fewer fixed costs</text><text x="24" y="78" font-size="19" fill="#626962">Model: 5 ms per call + 1 ms per item.</text><rect x="24" y="112" width="232" height="560" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="152" font-size="22" fill="#252c28">Individual calls</text><rect x="40" y="184" width="200" height="44" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="213" font-size="19" fill="#252c28">a → 6 ms</text><rect x="40" y="238" width="200" height="44" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="267" font-size="19" fill="#252c28">bb → 6 ms</text><rect x="40" y="292" width="200" height="44" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="321" font-size="19" fill="#252c28">c → 6 ms</text><rect x="40" y="346" width="200" height="44" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="375" font-size="19" fill="#252c28">dddd → 6 ms</text><rect x="40" y="400" width="200" height="44" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="429" font-size="19" fill="#252c28">eee → 6 ms</text><rect x="40" y="454" width="200" height="44" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="483" font-size="19" fill="#252c28">f → 6 ms</text><rect x="40" y="508" width="200" height="44" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="537" font-size="19" fill="#252c28">g → 6 ms</text><text x="40" y="640" font-size="23" fill="#252c28">7 × 6 = 42 ms</text><rect x="288" y="112" width="408" height="560" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="304" y="152" font-size="22" fill="#252c28">The example’s four batches</text><rect x="304" y="184" width="376" height="88" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="320" y="218" font-size="22" fill="#252c28">a, bb, c</text><text x="320" y="254" font-size="19" fill="#626962">3 items: 5 + 3 = 8 ms</text><rect x="304" y="288" width="376" height="88" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="320" y="322" font-size="22" fill="#252c28">dddd</text><text x="320" y="358" font-size="19" fill="#626962">1 item: 5 + 1 = 6 ms</text><rect x="304" y="392" width="376" height="88" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="320" y="426" font-size="22" fill="#252c28">eee</text><text x="320" y="462" font-size="19" fill="#626962">1 item: 5 + 1 = 6 ms</text><rect x="304" y="496" width="376" height="88" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="320" y="530" font-size="22" fill="#252c28">f, g</text><text x="320" y="566" font-size="19" fill="#626962">2 items: 5 + 2 = 7 ms</text><text x="304" y="640" font-size="23" fill="#252c28">8 + 6 + 6 + 7 = 27 ms</text><rect x="24" y="728" width="672" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="766" font-size="22" fill="#252c28">Saved fixed overhead: 3 calls × 5 ms = 15 ms</text><text x="40" y="808" font-size="19" fill="#626962">Service work only; collection waiting is additional.</text></svg>
