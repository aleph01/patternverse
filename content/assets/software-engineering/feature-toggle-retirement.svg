<svg xmlns="http://www.w3.org/2000/svg" width="720" height="844" viewBox="0 0 720 844" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Temporary release exposure and evidence-gated retirement</title><desc id="desc">A temporary release flag progresses from deployed but off, through limited exposure, to full exposure and observation. A separate retirement gate requires completed rollback obligations before the old branch, flag checks, and configuration are removed.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="844" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Expose gradually, then retire the temporary flag</text><rect x="24" y="100" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="138" font-size="22" fill="#252c28">1 Deployed, off</text><text x="40" y="180" font-size="19" fill="#252c28">The release contains both rendering paths.</text><text x="40" y="216" font-size="18" fill="#626962">Users still receive the standard layout.</text><path d="M72 228V272" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="260" font-size="18" fill="#626962">Set exposure policy</text><rect x="24" y="276" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="314" font-size="22" fill="#252c28">2 Limited exposure</text><text x="40" y="356" font-size="19" fill="#252c28">A stable target cohort receives the detailed layout.</text><text x="40" y="392" font-size="18" fill="#626962">Observe variant exposure, errors, and outcomes.</text><path d="M72 404V448" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="436" font-size="18" fill="#626962">Use rollout evidence</text><rect x="24" y="452" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="490" font-size="22" fill="#252c28">3 Full exposure</text><text x="40" y="532" font-size="19" fill="#252c28">All intended targets receive the detailed layout.</text><text x="40" y="568" font-size="18" fill="#626962">Retain the flag only while recovery obligations require it.</text><path d="M72 580V624" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="612" font-size="18" fill="#626962">Review retirement evidence</text><rect x="24" y="628" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="666" font-size="22" fill="#252c28">4 Retirement gate</text><text x="40" y="708" font-size="19" fill="#252c28">Owner confirms the old path is no longer needed.</text><text x="40" y="744" font-size="18" fill="#626962">Remove the old path, toggle checks, and flag configuration.</text><text x="24" y="804" font-size="19" fill="#252c28">Full exposure does not remove the alternate code path.</text></svg>
