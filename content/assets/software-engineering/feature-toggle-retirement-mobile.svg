<svg xmlns="http://www.w3.org/2000/svg" width="360" height="920" viewBox="0 0 360 920" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Temporary release exposure and evidence-gated retirement</title><desc id="desc">A temporary release flag progresses from deployed but off, through limited exposure, to full exposure and observation. A separate retirement gate requires completed rollback obligations before the old branch, flag checks, and configuration are removed.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="920" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">A release flag needs an exit</text><rect x="24" y="88" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="126" font-size="22" fill="#252c28">1 Deployed, off</text><text x="40" y="168" font-size="17" fill="#252c28">Both paths are in the build</text><text x="40" y="204" font-size="16" fill="#626962">Standard layout remains active</text><path d="M72 232V284" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="268" font-size="17" fill="#626962">Set exposure policy</text><rect x="24" y="288" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="326" font-size="22" fill="#252c28">2 Limited exposure</text><text x="40" y="368" font-size="17" fill="#252c28">A stable cohort sees the change</text><text x="40" y="404" font-size="16" fill="#626962">Observe errors and outcomes</text><path d="M72 432V484" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="468" font-size="17" fill="#626962">Use rollout evidence</text><rect x="24" y="488" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="526" font-size="22" fill="#252c28">3 Full exposure</text><text x="40" y="568" font-size="17" fill="#252c28">New layout serves all targets</text><text x="40" y="604" font-size="16" fill="#626962">Keep the recovery window explicit</text><path d="M72 632V684" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="668" font-size="17" fill="#626962">Review retirement evidence</text><rect x="24" y="688" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="726" font-size="22" fill="#252c28">4 Retirement gate</text><text x="40" y="768" font-size="17" fill="#252c28">Recovery obligations closed</text><text x="40" y="804" font-size="16" fill="#626962">Remove old path, checks, config</text><text x="24" y="880" font-size="18" fill="#252c28">Full exposure ≠ flag removed.</text></svg>
