<svg xmlns="http://www.w3.org/2000/svg" width="360" height="968" viewBox="0 0 360 968" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Current policy on every access</title><desc id="desc">Under policy version 1, Alice’s read of tenant A report R1 is allowed. A serialized revocation installs version 2; Alice’s next read is denied. An unavailable policy state at version 3 denies the auditor’s otherwise permitted export. An earlier returned copy of A totals is not recalled.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="968" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Current policy, every access</text><text x="24" y="78" font-size="17" fill="#626962">Policy versions identify state.</text><rect x="24" y="112" width="312" height="264" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="148" font-size="21" fill="#252c28">P1 / policy available</text><text x="40" y="194" font-size="18" fill="#252c28">alice / read R1: A totals</text><text x="40" y="238" font-size="17" fill="#252c28">auditor / export R1: A totals</text><text x="40" y="282" font-size="18" fill="#252c28">alice / export R1: denied</text><text x="40" y="326" font-size="18" fill="#252c28">alice / read R2: denied</text><path d="M72 376V436" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="414" font-size="17" fill="#626962">Revoke under lock</text><rect x="24" y="440" width="312" height="168" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="478" font-size="20" fill="#252c28">P2 / alice read revoked</text><text x="40" y="522" font-size="18" fill="#252c28">alice / read R1: denied</text><text x="40" y="568" font-size="17" fill="#626962">Old copy remains with caller</text><path d="M72 608V668" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="646" font-size="17" fill="#626962">Policy unavailable</text><rect x="24" y="672" width="312" height="152" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="710" font-size="20" fill="#252c28">P3 / policy unavailable</text><text x="40" y="752" font-size="17" fill="#252c28">auditor / export R1: denied</text><text x="40" y="796" font-size="18" fill="#626962">No permissive fallback</text><text x="24" y="880" font-size="18" fill="#252c28">Each request uses current policy.</text><text x="24" y="918" font-size="17" fill="#626962">Earlier data cannot be recalled.</text></svg>
