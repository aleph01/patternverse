<svg xmlns="http://www.w3.org/2000/svg" width="720" height="504" viewBox="0 0 720 504" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Closed and open layer dependencies</title><desc id="desc">Closed layering permits presentation to use business logic and business logic to use price access. The open example also permits a direct presentation-to-price-access dependency for a separately defined read-only operation.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="504" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Choose the access policy</text><text x="24" y="78" font-size="21" fill="#252c28">Closed: adjacent only</text><rect x="24" y="106" width="280" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="135" font-size="20" fill="#252c28">Presentation</text><text x="40" y="161" font-size="17" fill="#626962">Parse input · format result</text><rect x="24" y="230" width="280" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="259" font-size="20" fill="#252c28">Business logic</text><text x="40" y="285" font-size="17" fill="#626962">Compute quote policy</text><rect x="24" y="354" width="280" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="383" font-size="20" fill="#252c28">Price access</text><text x="40" y="409" font-size="17" fill="#626962">Read unit price in cents</text><path d="M164 182V228" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M164 306V352" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="466" font-size="16" fill="#626962">Only the adjacent lower layer.</text><text x="396" y="78" font-size="21" fill="#252c28">Open: chosen bypass</text><rect x="396" y="106" width="264" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="412" y="135" font-size="20" fill="#252c28">Presentation</text><text x="412" y="161" font-size="17" fill="#626962">Parse input · format result</text><rect x="396" y="230" width="264" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="412" y="259" font-size="20" fill="#252c28">Business logic</text><text x="412" y="285" font-size="17" fill="#626962">Compute quote policy</text><rect x="396" y="354" width="264" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="412" y="383" font-size="20" fill="#252c28">Price access</text><text x="412" y="409" font-size="17" fill="#626962">Read unit price in cents</text><path d="M528 182V228" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M528 306V352" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M660 144H684V392H662" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="396" y="466" font-size="16" fill="#626962">Extra access is explicitly allowed.</text></svg>
