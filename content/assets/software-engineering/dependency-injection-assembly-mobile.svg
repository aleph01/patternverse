<svg xmlns="http://www.w3.org/2000/svg" width="360" height="778" viewBox="0 0 360 778" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">External assembly and later collaborator use</title><desc id="desc">Startup code chooses a price source and supplies it to QuoteService. Once assembled, QuoteService calls the supplied source through unit_price rather than constructing or looking up a provider.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="778" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Assemble separately,</text><text x="24" y="60" font-size="22" fill="#252c28">then use the collaborator</text><rect x="24" y="112" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">main.py · composition root</text><text x="40" y="167" font-size="17" fill="#626962">Chooses concrete providers</text><path d="M180 188V276" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="198" y="236" font-size="17" fill="#626962">1 · create</text><rect x="44" y="278" width="272" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="307" font-size="20" fill="#252c28">Price provider</text><text x="60" y="333" font-size="17" fill="#626962">SQLite or memory</text><path d="M24 150H12V496H42" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="44" y="406" font-size="17" fill="#626962">2 · supply provider</text><rect x="44" y="458" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="487" font-size="20" fill="#252c28">QuoteService(prices)</text><text x="60" y="513" font-size="17" fill="#626962">Stores the supplied reference</text><path d="M316 496H332V316H318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="44" y="590" font-size="18" fill="#252c28">3 · later call: unit_price(sku)</text><text x="24" y="660" font-size="17" fill="#626962">Dashed: startup wiring</text><text x="24" y="692" font-size="17" fill="#626962">Solid: operational call</text><text x="24" y="740" font-size="17" fill="#252c28">No provider lookup in QuoteService.</text></svg>
