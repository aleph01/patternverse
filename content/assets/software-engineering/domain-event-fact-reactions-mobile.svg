<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1066" viewBox="0 0 360 1066" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Domain fact and independent reactions</title><desc id="desc">A dispatch request reaches Shipment, which checks its ready state and records a ShipmentDispatched fact with event ID, shipment ID, tracking code, and occurrence time. Separate reactions consume the fact; Shipment does not call the archive or customer-communication code directly.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1066" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Name the occurrence;</text><text x="24" y="60" font-size="22" fill="#252c28">separate its reactions</text><rect x="24" y="104" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">DispatchShipment</text><text x="40" y="159" font-size="17" fill="#626962">Request · can be rejected</text><path d="M180 180V228" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="230" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="259" font-size="20" fill="#252c28">Shipment</text><text x="40" y="285" font-size="17" fill="#626962">ready to dispatched</text><path d="M180 330V378" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="380" width="312" height="156" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="414" font-size="20" fill="#252c28">ShipmentDispatched · E1</text><text x="40" y="450" font-size="18" fill="#252c28">Shipment S1 · TRACK-9</text><text x="40" y="480" font-size="17" fill="#252c28">2026-10-29 10:00 UTC</text><text x="40" y="512" font-size="17" fill="#626962">Pending · immutable fact</text><path d="M180 536V584" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="586" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="615" font-size="20" fill="#252c28">Application policy</text><text x="40" y="641" font-size="17" fill="#626962">Here: pure descriptions only</text><rect x="44" y="732" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="761" font-size="20" fill="#252c28">Archive description</text><text x="60" y="787" font-size="17" fill="#626962">S1 + TRACK-9</text><rect x="44" y="864" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="893" font-size="20" fill="#252c28">Notice description</text><text x="60" y="919" font-size="17" fill="#626962">S1 + E1</text><path d="M180 686V708H12V902H42" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M12 770H42" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="1000" font-size="17" fill="#252c28">Independent descriptions; neither sends.</text><text x="24" y="1034" font-size="17" fill="#626962">Recording does not commit or deliver.</text></svg>
