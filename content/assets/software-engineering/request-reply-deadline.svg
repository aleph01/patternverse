<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1024" viewBox="0 0 720 1024" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Request-Reply: deadline and late answer</title><desc id="desc">A pending request has a local deadline of 500 milliseconds. A valid reply received at 499 milliseconds completes that request. If the request is still pending at 500 milliseconds, expiration removes its context. A later reply is ignored. The remote service can still have completed the work; local expiration is not remote cancellation.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1024" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A deadline releases a waiter, not remote work</text><rect x="24" y="100" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">Pending desk:3</text><text x="40" y="155" font-size="17" fill="#626962">Local deadline: 500 ms. Alternative outcomes from the same state.</text><path d="M360 212V266H180V338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 266H540V338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="306" font-size="18" fill="#252c28">Before deadline</text><text x="384" y="306" font-size="18" fill="#252c28">Deadline reached</text><rect x="24" y="340" width="312" height="168" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="369" font-size="20" fill="#252c28">Valid reply at 499 ms</text><text x="40" y="395" font-size="17" fill="#626962">Accept the result: 3 units.</text><text x="40" y="450" font-size="17" fill="#626962">Remove pending desk:3.</text><rect x="384" y="340" width="312" height="168" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="369" font-size="20" fill="#252c28">Still pending at 500 ms</text><text x="400" y="395" font-size="17" fill="#626962">Expire the waiting context.</text><text x="400" y="450" font-size="17" fill="#626962">Remove pending desk:3.</text><path d="M180 508V678" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="592" font-size="17" fill="#626962">local completion</text><path d="M540 508V678" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="400" y="580" font-size="17" fill="#626962">reply arrives</text><text x="400" y="608" font-size="17" fill="#626962">at 501 ms</text><rect x="24" y="680" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="709" font-size="20" fill="#252c28">Completed once</text><text x="40" y="735" font-size="17" fill="#626962">A duplicate has no waiter.</text><rect x="384" y="680" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="709" font-size="20" fill="#252c28">Late reply ignored</text><text x="400" y="735" font-size="17" fill="#626962">No pending match remains.</text><text x="24" y="884" font-size="18" fill="#252c28">At exactly 500 ms, accept also returns a timeout.</text><text x="24" y="928" font-size="18" fill="#252c28">The remote operation may already have succeeded.</text><text x="24" y="968" font-size="17" fill="#626962">No cancellation, rollback, or retry is implied.</text></svg>
