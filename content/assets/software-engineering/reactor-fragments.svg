<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1104" viewBox="0 0 720 1104" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Reactor fragmented records</title><desc id="desc">A first sends hel without a newline, so its handler retains three bytes and returns. B sends ok followed by a newline and completes independently. A later sends lo followed by a newline, completing hello. A final incomplete record at EOF is rejected and its socket is unregistered before closing.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1104" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Per-connection state survives across short callbacks</text><rect x="24" y="112" width="128" height="144" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="21" fill="#252c28">1 / A</text><rect x="192" y="112" width="504" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="208" y="141" font-size="18" fill="#252c28">Receive hel; no LF terminator</text><text x="208" y="167" font-size="16" fill="#626962">A retains hel; handler returns without emitting a record.</text><path d="M88 256V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="320" width="128" height="144" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="356" font-size="21" fill="#252c28">2 / B</text><rect x="192" y="320" width="504" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="208" y="349" font-size="18" fill="#252c28">Receive ok + LF; emit ok</text><text x="208" y="375" font-size="16" fill="#626962">B completes while A’s record remains unfinished.</text><path d="M88 464V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="528" width="128" height="144" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="564" font-size="21" fill="#252c28">3 / A</text><rect x="192" y="528" width="504" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="208" y="557" font-size="18" fill="#252c28">Receive lo + LF; emit hello</text><text x="208" y="583" font-size="16" fill="#626962">A combines retained hel with lo, then clears its buffer.</text><path d="M88 672V734" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="736" width="128" height="144" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="772" font-size="21" fill="#252c28">4 / A</text><rect x="192" y="736" width="504" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="208" y="765" font-size="18" fill="#252c28">Receive x, then EOF; reject x</text><text x="208" y="791" font-size="16" fill="#626962">Unregister before close; keep earlier complete records.</text><text x="24" y="970" font-size="18" fill="#626962">Arrows: an explanatory trace, not a promise about selector ordering.</text><text x="24" y="1010" font-size="18" fill="#626962">Each callback consumes at most four bytes. LF marks a record boundary.</text><text x="24" y="1050" font-size="18" fill="#626962">Connection state is independent; no callback waits for a full record.</text></svg>
