<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1080" viewBox="0 0 360 1080" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Reuse the shared subproblem</title><desc id="desc">Five project tasks form an acyclic dependency graph. Publish depends on package; package depends on assets and templates; both depend on parse. Parse finishes at minute 2, assets at 5, templates at 6, package at 7, and publish at 9. The shared parse result is computed once and reused.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1080" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Reuse the shared subproblem</text><text x="24" y="78" font-size="17" fill="#626962">Arrow: needs the lower result.</text><rect x="60" y="120" width="240" height="132" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="76" y="152" font-size="20" fill="#252c28">4 / publish</text><text x="76" y="192" font-size="17" fill="#626962">Own: 2 min</text><text x="76" y="232" font-size="18" fill="#252c28">Finish: 9 min</text><path d="M180 252V284" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="288" width="240" height="132" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="76" y="320" font-size="20" fill="#252c28">3 / package</text><text x="76" y="360" font-size="17" fill="#626962">Own: 1 min</text><text x="76" y="400" font-size="18" fill="#252c28">Finish: 7 min</text><path d="M180 420V448H96V476" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 420V448H264V476" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="480" width="144" height="132" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="36" y="512" font-size="17" fill="#252c28">1 / assets</text><text x="36" y="552" font-size="17" fill="#626962">Own: 3 min</text><text x="36" y="592" font-size="18" fill="#252c28">Finish: 5 min</text><rect x="192" y="480" width="144" height="132" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="204" y="512" font-size="17" fill="#252c28">2 / templates</text><text x="204" y="552" font-size="17" fill="#626962">Own: 4 min</text><text x="204" y="592" font-size="18" fill="#252c28">Finish: 6 min</text><path d="M96 612V668H120V700" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M264 612V668H240V700" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="704" width="240" height="132" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="76" y="736" font-size="20" fill="#252c28">0 / parse</text><text x="76" y="776" font-size="17" fill="#626962">Own: 2 min</text><text x="76" y="816" font-size="18" fill="#252c28">Finish: 2 min</text><rect x="24" y="884" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="916" font-size="20" fill="#252c28">Task 0 is requested twice.</text><text x="40" y="956" font-size="17" fill="#626962">First request: compute and store.</text><text x="40" y="996" font-size="17" fill="#626962">Second request: reuse result 2.</text><text x="40" y="1028" font-size="17" fill="#626962">Cold calculation: five task bodies.</text></svg>
