<svg xmlns="http://www.w3.org/2000/svg" width="720" height="936" viewBox="0 0 720 936" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Routing misses, method rejection, and handler errors remain distinct</title><desc id="desc">An unknown path produces a 404 without calling a handler. A known path with the wrong recognized method produces a 405 with an Allow value. A selected handler that raises an exception produces a generic 500, with its request ID retained in internal diagnostics. All three cases reach the simulation’s shared audit completion step.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="936" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Distinct failures, one completion policy</text><rect x="24" y="100" width="672" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">Three alternative requests</text><text x="40" y="155" font-size="17" fill="#626962">Each enters the same processing boundary.</text><path d="M360 204V260H128V322" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 260V322" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 260H592V322" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="324" width="208" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="353" font-size="18" fill="#252c28">Unknown path</text><text x="40" y="379" font-size="16" fill="#626962">GET /missing</text><text x="40" y="420" font-size="17" fill="#252c28">404 Not found</text><text x="40" y="456" font-size="16" fill="#626962">No handler call.</text><rect x="256" y="324" width="208" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="272" y="353" font-size="18" fill="#252c28">Wrong method</text><text x="272" y="379" font-size="16" fill="#626962">POST /orders</text><text x="272" y="420" font-size="17" fill="#252c28">405; Allow: GET</text><text x="272" y="456" font-size="16" fill="#626962">No handler call.</text><rect x="488" y="324" width="208" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="504" y="353" font-size="18" fill="#252c28">Handler failure</text><text x="504" y="379" font-size="16" fill="#626962">GET /broken</text><text x="504" y="420" font-size="17" fill="#252c28">500 Internal error</text><text x="504" y="456" font-size="16" fill="#626962">Diagnostic ID kept.</text><path d="M128 484V654" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 484V654" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M592 484V654" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="656" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="685" font-size="20" fill="#252c28">Shared completion</text><text x="40" y="711" font-size="17" fill="#626962">Append this request ID and final status to the in-memory audit.</text><text x="24" y="844" font-size="17" fill="#626962">Failure diagnostics retain an ID and exception class, not public details.</text><text x="24" y="888" font-size="17" fill="#626962">Completion logging is not a durable or exactly-once audit guarantee.</text></svg>
