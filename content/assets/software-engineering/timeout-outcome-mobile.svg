<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1424" viewBox="0 0 360 1424" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Local cleanup and uncertain remote completion</title><desc id="desc">When a deadline expires, the caller takes a timeout path and may request cancellation. A cooperative local dependency releases its resource before reporting timeout. A remote service can commit before cancellation or a late reply arrives; the caller must reconcile that outcome rather than infer rollback.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1424" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Expiry is not remote rollback</text><text x="24" y="116" font-size="20" fill="#252c28">Cooperative local dependency</text><rect x="24" y="152" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="181" font-size="18" fill="#252c28">Deadline expires</text><text x="40" y="207" font-size="16" fill="#626962">Request cancellation.</text><path d="M180 264V334" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="336" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="365" font-size="18" fill="#252c28">Unwind the local finally block</text><text x="40" y="391" font-size="16" fill="#626962">Then report TimeoutError.</text><text x="24" y="520" font-size="20" fill="#252c28">One possible remote ordering</text><rect x="24" y="560" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="589" font-size="18" fill="#252c28">Server commits a state change</text><text x="40" y="615" font-size="16" fill="#626962">The client has no confirmation yet.</text><path d="M180 672V742" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="744" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="773" font-size="18" fill="#252c28">Client deadline expires</text><text x="40" y="799" font-size="16" fill="#626962">Cancellation can arrive too late.</text><path d="M180 856V926" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="928" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="957" font-size="18" fill="#252c28">A reply arrives late</text><text x="40" y="983" font-size="16" fill="#626962">The wait has already expired.</text><rect x="24" y="1120" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1150" font-size="18" fill="#252c28">Reconcile by operation identity</text><text x="40" y="1194" font-size="17" fill="#626962">Timeout alone cannot confirm</text><text x="40" y="1238" font-size="17" fill="#626962">rejection, success, or rollback.</text><text x="24" y="1348" font-size="16" fill="#626962">Arrows: order within each example.</text><text x="24" y="1388" font-size="16" fill="#626962">Cleanup itself can delay the outcome.</text></svg>
