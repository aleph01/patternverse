<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1072" viewBox="0 0 720 1072" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Aggregator: distinct expected members</title><desc id="desc">Operation E901 expects line results L1 and L2. L2 reports one packed unit, an identical L2 redelivery adds no new member, and L1 reports two packed units. Only the two distinct expected results release one complete summary totaling three physical units.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1072" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Count distinct members, not deliveries</text><text x="24" y="86" font-size="19" fill="#626962">Operation E901 expects exactly L1 and L2.</text><rect x="24" y="144" width="280" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="173" font-size="20" fill="#252c28">10 ms: L2 arrives</text><text x="40" y="199" font-size="17" fill="#626962">1 packed unit</text><path d="M304 200H398" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="400" y="144" width="296" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="416" y="173" font-size="20" fill="#252c28">Open: {L2}</text><text x="416" y="199" font-size="17" fill="#626962">1 of 2 expected members</text><rect x="24" y="352" width="280" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="381" font-size="20" fill="#252c28">20 ms: same L2 again</text><text x="40" y="407" font-size="17" fill="#626962">1 packed unit; redelivery</text><path d="M304 408H398" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="400" y="352" width="296" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="416" y="381" font-size="20" fill="#252c28">Open: {L2}</text><text x="416" y="407" font-size="17" fill="#626962">Still 1 of 2 members</text><rect x="24" y="560" width="280" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="589" font-size="20" fill="#252c28">30 ms: L1 arrives</text><text x="40" y="615" font-size="17" fill="#626962">2 packed units</text><path d="M304 616H398" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="400" y="560" width="296" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="416" y="589" font-size="20" fill="#252c28">Complete: {L1, L2}</text><text x="416" y="615" font-size="17" fill="#626962">2 of 2 expected members</text><path d="M548 672V750" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="564" y="716" font-size="17" fill="#626962">release</text><rect x="24" y="752" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="781" font-size="20" fill="#252c28">Outcome: E901 complete</text><text x="40" y="807" font-size="17" fill="#626962">Total: 3 packed physical units / missing: none</text><text x="40" y="860" font-size="19" fill="#626962">The repeated L2 report contributes no additional units.</text><text x="24" y="976" font-size="18" fill="#252c28">Horizontal arrows: accept results into the group. Vertical arrow: release.</text><text x="24" y="1016" font-size="18" fill="#626962">A complete report set does not prove the requested order was fulfilled.</text></svg>
