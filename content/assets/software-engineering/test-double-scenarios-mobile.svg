<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1180" viewBox="0 0 360 1180" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Checkout test scenarios and observable outcomes</title><desc id="desc">Four checkout scenarios use a fresh gateway double. Approval returns accepted:r-17 and refusal returns declined, each after one charge call. Zero cents raises ValueError with no charge call. TimeoutError propagates after one attempted call and does not mean declined.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1180" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Four controlled scenarios</text><text x="24" y="82" font-size="18" fill="#626962">Fresh gateway double for each test.</text><rect x="24" y="116" width="312" height="208" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="152" font-size="22" fill="#252c28">Approval</text><text x="40" y="188" font-size="18" fill="#626962">Return r-17</text><text x="40" y="228" font-size="17" fill="#626962">Checkout outcome</text><text x="40" y="264" font-size="21" fill="#252c28">accepted:r-17</text><text x="40" y="300" font-size="18" fill="#252c28">1 charge call</text><rect x="24" y="352" width="312" height="208" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="388" font-size="22" fill="#252c28">Refusal</text><text x="40" y="424" font-size="18" fill="#626962">Raise Declined</text><text x="40" y="464" font-size="17" fill="#626962">Checkout outcome</text><text x="40" y="500" font-size="21" fill="#252c28">declined</text><text x="40" y="536" font-size="18" fill="#252c28">1 charge call</text><rect x="24" y="588" width="312" height="208" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="624" font-size="22" fill="#252c28">Zero cents</text><text x="40" y="660" font-size="18" fill="#626962">No reply needed</text><text x="40" y="700" font-size="17" fill="#626962">Checkout outcome</text><text x="40" y="736" font-size="21" fill="#252c28">ValueError</text><text x="40" y="772" font-size="18" fill="#252c28">0 charge calls</text><rect x="24" y="824" width="312" height="208" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="860" font-size="22" fill="#252c28">Lost reply</text><text x="40" y="896" font-size="18" fill="#626962">Raise TimeoutError</text><text x="40" y="936" font-size="17" fill="#626962">Checkout outcome</text><text x="40" y="972" font-size="21" fill="#252c28">TimeoutError</text><text x="40" y="1008" font-size="18" fill="#252c28">1 charge call</text><text x="24" y="1106" font-size="18" fill="#252c28">Timeout does not mean refusal.</text><text x="24" y="1144" font-size="18" fill="#626962">Provider outcome stays unknown.</text></svg>
