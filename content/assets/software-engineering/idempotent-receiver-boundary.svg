<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1024" viewBox="0 0 720 1024" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Idempotent Receiver: atomic effect and acknowledgment</title><desc id="desc">Before database commit, a failed stock constraint rolls back both the processed-message row and stock change, so retry remains possible. After commit, losing acknowledgment leaves both records durable, so redelivery is a duplicate. An external email or remote API call sits outside this database boundary and has no protection from this transaction.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1024" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Protect the database effect as one unit</text><rect x="24" y="112" width="672" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="150" font-size="22" fill="#252c28">Inside one SQLite transaction</text><text x="40" y="196" font-size="19" fill="#626962">Processed key + payload</text><text x="400" y="196" font-size="19" fill="#626962">Inventory quantity change</text><text x="40" y="244" font-size="19" fill="#626962">Both commit, or neither survives.</text><path d="M360 272V320H180V382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 320H540V382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="384" width="312" height="200" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="413" font-size="20" fill="#252c28">Before commit: constraint fails</text><text x="40" y="439" font-size="17" fill="#626962">Roll back marker and update.</text><text x="40" y="504" font-size="17" fill="#626962">No completed receipt recorded.</text><text x="40" y="548" font-size="18" fill="#626962">Retry after fixing the failure.</text><rect x="384" y="384" width="312" height="200" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="413" font-size="20" fill="#252c28">After commit: ack lost</text><text x="400" y="439" font-size="17" fill="#626962">Both database changes survive.</text><text x="400" y="504" font-size="18" fill="#626962">Redelivery is a duplicate.</text><text x="400" y="548" font-size="18" fill="#626962">No additional stock change.</text><rect x="24" y="704" width="672" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="733" font-size="18" fill="#252c28">Outside this database boundary</text><text x="40" y="759" font-size="16" fill="#626962">Broker acknowledgment follows commit.</text><text x="40" y="824" font-size="20" fill="#626962">Email and remote API effects need their own protection.</text><text x="24" y="968" font-size="18" fill="#252c28">Arrows: alternative failure points around commit, not delivery guarantees.</text></svg>
