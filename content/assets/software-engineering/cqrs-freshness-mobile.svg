<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1224" viewBox="0 0 360 1224" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">CQRS: query freshness and authoritative command validation</title><desc id="desc">An availability DTO reports two remaining seats at version zero. A later booking command commits both seats and advances the stored version to one. The old DTO still reports two. A new command for one seat validates current state and rejects it; a fresh query reports zero, sold out, version one.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1224" fill="#fff"/><text x="24" y="34" font-size="23" fill="#252c28">Old answers are snapshots</text><rect x="24" y="112" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Old query DTO / version 0</text><text x="40" y="167" font-size="17" fill="#626962">2 remaining / available</text><text x="40" y="220" font-size="18" fill="#626962">Immutable snapshot</text><path d="M180 256V366" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="316" font-size="17" fill="#626962">later</text><rect x="24" y="368" width="312" height="184" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="397" font-size="20" fill="#252c28">BookSeats(2) commits</text><text x="40" y="423" font-size="17" fill="#626962">Capacity: 2 / booked: 2 / version: 1</text><text x="40" y="496" font-size="17" fill="#626962">Kept DTO still: 2 / version 0</text><text x="40" y="532" font-size="17" fill="#626962">Authoritative remaining: 0</text><path d="M180 552V670" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="620" font-size="17" fill="#626962">try 1 seat</text><rect x="24" y="672" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="701" font-size="20" fill="#252c28">BookSeats(1) rejects</text><text x="40" y="727" font-size="17" fill="#626962">Checks current state, not old DTO.</text><text x="40" y="788" font-size="18" fill="#626962">Insufficient seats</text><path d="M180 832V942" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="900" font-size="17" fill="#626962">SELECT</text><rect x="24" y="944" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="973" font-size="20" fill="#252c28">Fresh query / version 1</text><text x="40" y="999" font-size="17" fill="#626962">0 remaining / sold out</text><text x="40" y="1052" font-size="18" fill="#626962">New immutable DTO</text><text x="24" y="1168" font-size="17" fill="#626962">No asynchronous projection is used.</text></svg>
