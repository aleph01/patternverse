<svg xmlns="http://www.w3.org/2000/svg" width="720" height="778" viewBox="0 0 720 778" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A competing aggregate update requires re-evaluation</title><desc id="desc">Two writers load version 7 of a plan holding 60 kilograms. One proposes adding 40 kilograms and the other 30 kilograms; both pass their local capacity check. The first atomic save advances to version 8 at 100 kilograms. The second save expects version 7 and is rejected. Re-evaluating its command against version 8 exceeds capacity.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="778" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Local validation does not settle competing saves</text><rect x="24" y="84" width="672" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">1. Both load the same plan · version 7</text><text x="40" y="139" font-size="17" fill="#626962">pkg-A: 60 kg · capacity: 100 kg</text><path d="M360 160V194H180V226" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 194H540V226" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="228" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="257" font-size="20" fill="#252c28">2. A adds pkg-B: 40 kg</text><text x="40" y="283" font-size="17" fill="#626962">Local total: 100 kg · valid</text><rect x="384" y="228" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="257" font-size="20" fill="#252c28">2. B adds pkg-C: 30 kg</text><text x="400" y="283" font-size="17" fill="#626962">Local total: 90 kg · valid</text><path d="M180 328V388" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 328V388" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="390" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="419" font-size="20" fill="#252c28">3. A saves, expecting v7</text><text x="40" y="445" font-size="17" fill="#626962">Stored: 100 kg · version 8</text><rect x="384" y="390" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="419" font-size="20" fill="#252c28">4. B saves, expecting v7</text><text x="400" y="445" font-size="17" fill="#626962">Conflict: stored version is 8</text><path d="M540 490V530H360V558" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="560" width="672" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="589" font-size="20" fill="#252c28">5. Reload version 8 and re-evaluate B’s command</text><text x="40" y="615" font-size="17" fill="#626962">100 + 30 = 130 kg > capacity 100 kg · reject allocation</text><text x="24" y="714" font-size="18" fill="#252c28">Version check and all changed members share one atomic commit.</text><text x="24" y="750" font-size="17" fill="#626962">Arrows show load, save, and reload; numbers specify the order.</text></svg>
