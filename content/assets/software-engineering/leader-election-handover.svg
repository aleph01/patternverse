<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1008" viewBox="0 0 720 1008" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Separate election from destination handover</title><desc id="desc">A wins term one and publishes manifest-A. After a partition B wins term two with B and C. A's old election result still exists. B installs term two at the destination and publishes manifest-B; the destination rejects A's later term-one write and retains manifest-B.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1008" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A new election does not stop the old process</text><rect x="24" y="112" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Old result: A / term 1</text><text x="40" y="167" font-size="17" fill="#626962">A won votes from A and B.</text><text x="40" y="252" font-size="17" fill="#626962">A may still run after partition.</text><rect x="384" y="112" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="141" font-size="20" fill="#252c28">New result: B / term 2</text><text x="400" y="167" font-size="17" fill="#626962">B wins votes from B and C.</text><text x="400" y="252" font-size="17" fill="#626962">Election changes coordination.</text><path d="M540 288V366H420V430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="436" y="342" font-size="17" fill="#626962">install B / 2</text><rect x="24" y="432" width="672" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="461" font-size="20" fill="#252c28">Publication register installs B / term 2</text><text x="40" y="487" font-size="17" fill="#626962">B then writes manifest-B under the installed authority.</text><text x="40" y="550" font-size="19" fill="#626962">This is the destination handover boundary.</text><path d="M24 200H12V736H22" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 592V670" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="672" width="672" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="701" font-size="20" fill="#252c28">A’s delayed term-one write is rejected</text><text x="40" y="727" font-size="17" fill="#626962">The register compares term and owner atomically with each write.</text><text x="40" y="790" font-size="19" fill="#626962">Stored value remains manifest-B.</text><text x="24" y="924" font-size="17" fill="#626962">Arrows: election results and destination handover/write checks.</text><text x="24" y="964" font-size="18" fill="#626962">Election alone does not fence an independent resource.</text></svg>
