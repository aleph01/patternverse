<svg xmlns="http://www.w3.org/2000/svg" width="360" height="996" viewBox="0 0 360 996" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Version-attributed failure rates and exposure before recovery</title><desc id="desc">A ten-percent window serves ten candidate requests and advances. The twenty-five-percent window serves twenty-five candidate requests and rolls back because three fail. The combined endpoint rate is five percent, but the candidate rate is twelve percent. Thirty-five candidate requests remain part of the exposure after future candidate traffic becomes zero.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="996" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Separate the release metrics</text><text x="24" y="80" font-size="17" fill="#626962">Window 2 · 100 requests · 25% stage</text><rect x="24" y="108" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="146" font-size="22" fill="#252c28">Endpoint aggregate</text><text x="40" y="186" font-size="22" fill="#252c28">5/100 failures = 5%</text><text x="40" y="220" font-size="16" fill="#626962">3 candidate + 2 incumbent</text><rect x="24" y="268" width="312" height="140" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="306" font-size="22" fill="#252c28">Candidate alone</text><text x="40" y="346" font-size="22" fill="#252c28">3/25 failures = 12%</text><text x="40" y="384" font-size="17" fill="#626962">Breaches 5% failure limit</text><path d="M72 408V464" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="444" font-size="17" fill="#626962">Reject this stage</text><rect x="24" y="468" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="506" font-size="20" fill="#252c28">Restore future share to 0%</text><text x="40" y="548" font-size="18" fill="#252c28">10 + 25 = 35 candidate requests</text><text x="40" y="586" font-size="18" fill="#252c28">already served across 2 windows</text><text x="40" y="624" font-size="17" fill="#626962">200 total; 3 candidate failures</text><rect x="24" y="692" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="730" font-size="22" fill="#252c28">One extra lag window</text><text x="40" y="770" font-size="18" fill="#252c28">35 + 25 = 60 candidate requests</text><text x="40" y="810" font-size="18" fill="#252c28">3 + 3 = 6 candidate failures</text><text x="40" y="848" font-size="17" fill="#626962">Prior effects remain.</text><text x="24" y="918" font-size="18" fill="#252c28">Complete quality labels:</text><text x="24" y="956" font-size="17" fill="#626962">1 wrong / 22 successful responses.</text></svg>
