<svg xmlns="http://www.w3.org/2000/svg" width="720" height="848" viewBox="0 0 720 848" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One policy, three separate HTTP signals</title><desc id="desc">Five lifecycle phases show liveness, startup, and readiness responses. Starting gives 200, 503, 503; ready gives three 200 responses; a required dependency outage gives 200, 200, 503; recovery gives three 200 responses; draining gives 200, 200, 503. Readiness loss does not imply a liveness failure or an automatic restart.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#252c28" stroke-width="1.2"/></marker></defs><rect width="720" height="848" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One policy, three separate HTTP signals</text><text x="24" y="86" font-size="19" fill="#626962">Example statuses; each request reads its own snapshot.</text><rect x="24" y="112" width="672" height="64" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="152" font-size="19" fill="#252c28">Phase</text><text x="270" y="152" font-size="19" fill="#252c28">/livez</text><text x="400" y="152" font-size="19" fill="#252c28">/startupz</text><text x="540" y="152" font-size="19" fill="#252c28">/readyz</text><rect x="24" y="176" width="672" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="224" font-size="20" fill="#252c28">starting</text><text x="270" y="224" font-size="22" fill="#252c28">200</text><text x="400" y="224" font-size="22" fill="#252c28">503</text><text x="540" y="224" font-size="22" fill="#252c28">503</text><rect x="24" y="256" width="672" height="80" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="304" font-size="20" fill="#252c28">ready</text><text x="270" y="304" font-size="22" fill="#252c28">200</text><text x="400" y="304" font-size="22" fill="#252c28">200</text><text x="540" y="304" font-size="22" fill="#252c28">200</text><rect x="24" y="336" width="672" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="384" font-size="20" fill="#252c28">dependency down</text><text x="270" y="384" font-size="22" fill="#252c28">200</text><text x="400" y="384" font-size="22" fill="#252c28">200</text><text x="540" y="384" font-size="22" fill="#252c28">503</text><rect x="24" y="416" width="672" height="80" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="464" font-size="20" fill="#252c28">recovered</text><text x="270" y="464" font-size="22" fill="#252c28">200</text><text x="400" y="464" font-size="22" fill="#252c28">200</text><text x="540" y="464" font-size="22" fill="#252c28">200</text><rect x="24" y="496" width="672" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="544" font-size="20" fill="#252c28">draining</text><text x="270" y="544" font-size="22" fill="#252c28">200</text><text x="400" y="544" font-size="22" fill="#252c28">200</text><text x="540" y="544" font-size="22" fill="#252c28">503</text><rect x="24" y="656" width="672" height="152" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="690" font-size="20" fill="#252c28">Required dependency down: unready, not a restart signal.</text><text x="40" y="736" font-size="18" fill="#626962">Draining ends new-traffic eligibility; existing work can remain.</text><text x="40" y="780" font-size="18" fill="#626962">Demo calls all paths; startup-gated probes normally wait.</text></svg>
