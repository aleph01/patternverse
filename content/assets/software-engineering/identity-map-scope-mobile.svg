<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1120" viewBox="0 0 360 1120" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Identity reuse ends at the scope boundary</title><desc id="desc">The current scope holds a Contact named Ada Lovelace while the database row has been changed to Augusta. A map hit retains the local object. Closing the scope clears the registry; a new scope selects the row and constructs a different Contact named Augusta in this example.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1120" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Same local object</text><text x="24" y="60" font-size="22" fill="#252c28">does not mean fresh data</text><rect x="24" y="104" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Current scope: Contact 1</text><text x="40" y="159" font-size="17" fill="#626962">name: Ada Lovelace</text><text x="40" y="206" font-size="17" fill="#626962">Map hit retains local edits.</text><rect x="24" y="288" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="317" font-size="20" fill="#252c28">Stored row: Contact 1</text><text x="40" y="343" font-size="17" fill="#626962">name: Augusta</text><text x="40" y="390" font-size="17" fill="#626962">Changed by direct SQL.</text><rect x="24" y="504" width="312" height="116" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="533" font-size="20" fill="#252c28">Close the current scope</text><text x="40" y="559" font-size="17" fill="#626962">Clear the map; end reuse.</text><text x="40" y="592" font-size="17" fill="#626962">Old references may still exist.</text><rect x="24" y="784" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="813" font-size="20" fill="#252c28">New scope: get(1)</text><text x="40" y="839" font-size="17" fill="#626962">SELECT → new Contact</text><text x="40" y="902" font-size="20" fill="#252c28">name: Augusta</text><path d="M180 620V782" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="1004" font-size="18" fill="#252c28">The new scope loads again.</text><text x="24" y="1044" font-size="17" fill="#626962">Observed row still depends</text><text x="24" y="1072" font-size="17" fill="#626962">on database isolation.</text></svg>
