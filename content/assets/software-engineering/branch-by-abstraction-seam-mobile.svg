<svg xmlns="http://www.w3.org/2000/svg" width="360" height="844" viewBox="0 0 360 844" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One boundary, two implementations during migration</title><desc id="desc">Checkout and basket preview call an application-owned Rates boundary. One configured implementation serves each application instance: the legacy adapter or the new rate engine. Both are checked against the same behavioral contract.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="844" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Change the supplier</text><text x="24" y="76" font-size="18" fill="#626962">During migration · per instance</text><rect x="24" y="108" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="146" font-size="20" fill="#252c28">Checkout + basket preview</text><text x="40" y="184" font-size="18" fill="#252c28">Call quote_cents(weight_g)</text><path d="M72 212V268" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="248" font-size="18" fill="#626962">Application call</text><rect x="24" y="272" width="312" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="310" font-size="22" fill="#252c28">Rates contract</text><text x="40" y="348" font-size="18" fill="#252c28">Positive grams → US cents</text><path d="M72 376V432" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="412" font-size="18" fill="#626962">One configured choice</text><rect x="24" y="436" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="474" font-size="22" fill="#252c28">Legacy adapter</text><text x="40" y="512" font-size="18" fill="#626962">Wraps vendor library</text><text x="40" y="580" font-size="20" fill="#626962">OR</text><rect x="24" y="612" width="312" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="650" font-size="22" fill="#252c28">New rate engine</text><text x="40" y="688" font-size="18" fill="#626962">Same caller contract</text><text x="24" y="766" font-size="18" fill="#252c28">Shared checks cover both paths.</text><text x="24" y="806" font-size="18" fill="#626962">Do not run both per request.</text></svg>
