<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1296" viewBox="0 0 360 1296" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Producer-Consumer: waiting versus executing</title><desc id="desc">A producer holds record 4 while two queue places contain records 2 and 3. Two consumers already process records 0 and 1 outside the queue. Removing a queued record frees a waiting place before processing finishes. Outcomes are collected separately.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1296" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Bound waiting work</text><rect x="24" y="104" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="18" fill="#252c28">Producer holds record 4</text><text x="40" y="159" font-size="16" fill="#626962">put waits while the queue is full.</text><path d="M180 216V294" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="260" font-size="15" fill="#626962">admit when free</text><rect x="24" y="296" width="312" height="184" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="326" font-size="18" fill="#252c28">FIFO queue: two waiting places</text><rect x="40" y="350" width="132" height="94" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="188" y="350" width="132" height="94" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="54" y="380" font-size="18" fill="#252c28">record 2</text><text x="54" y="412" font-size="16" fill="#626962">next out</text><text x="202" y="380" font-size="18" fill="#252c28">record 3</text><text x="202" y="412" font-size="16" fill="#626962">behind 2</text><path d="M180 480V582" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="532" font-size="16" fill="#626962">next get</text><rect x="24" y="584" width="312" height="192" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="616" font-size="18" fill="#252c28">Two consumers: work in progress</text><text x="40" y="660" font-size="18" fill="#252c28">A processes record 0.</text><text x="40" y="702" font-size="18" fill="#252c28">B processes record 1.</text><text x="40" y="748" font-size="15" fill="#626962">Processing is outside the queue lock.</text><path d="M180 776V870" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="826" font-size="16" fill="#626962">outcome</text><rect x="24" y="872" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="901" font-size="18" fill="#252c28">Separate result collection</text><text x="40" y="927" font-size="16" fill="#626962">Success or rejection for each record.</text><text x="40" y="974" font-size="15" fill="#626962">Sorted by index after joining workers.</text><text x="24" y="1060" font-size="19" fill="#252c28">Two waiting + two executing</text><text x="24" y="1096" font-size="16" fill="#626962">Up to four accepted records here.</text><text x="24" y="1156" font-size="16" fill="#626962">The input batch, held record, and</text><text x="24" y="1188" font-size="16" fill="#626962">collected results use extra memory.</text><text x="24" y="1244" font-size="15" fill="#626962">Arrows: admission, next take, outcome.</text></svg>
