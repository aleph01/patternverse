<svg xmlns="http://www.w3.org/2000/svg" width="360" height="612" viewBox="0 0 360 612" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Translate the contract at the provider boundary</title><desc id="desc">The application calls send with its own mail contract. MailAdapter translates the fields into the vendor submit payload and converts the acceptance token on return. Acceptance is not a guarantee of delivery.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="612" fill="#fff"/><text x="24" y="32" font-size="22" text-anchor="start" fill="#252c28">One explicit translation</text><rect x="28" y="84" width="304" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="115" font-size="20" text-anchor="start" fill="#252c28">Application</text><text x="44" y="140" font-size="17" text-anchor="start" fill="#626962">send(to, subject, body)</text><path d="M180 168V236" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="198" y="208" font-size="17" text-anchor="start" fill="#252c28">calls</text><rect x="28" y="238" width="304" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="269" font-size="20" text-anchor="start" fill="#252c28">MailAdapter</text><text x="44" y="294" font-size="17" text-anchor="start" fill="#626962">Map payload + result</text><path d="M180 322V390" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="198" y="362" font-size="17" text-anchor="start" fill="#252c28">calls</text><rect x="28" y="392" width="304" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="423" font-size="20" text-anchor="start" fill="#252c28">VendorMail</text><text x="44" y="448" font-size="17" text-anchor="start" fill="#626962">submit(payload)</text><text x="24" y="536" font-size="18" text-anchor="start" fill="#252c28">The return value means accepted.</text><text x="24" y="562" font-size="18" text-anchor="start" fill="#252c28">Delivery is a separate outcome.</text></svg>
