<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Choose a family, then create compatible products</title><desc id="desc">The application chooses BrowserWidgets. Its create_button and create_menu operations supply a browser button and browser menu. NativeWidgets is an unused alternative family, not an independently mixed product source.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="650" fill="#fff"/><text x="24" y="32" font-size="22" text-anchor="start" fill="#252c28">One coherent family choice</text><rect x="28" y="76" width="304" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="107" font-size="20" text-anchor="start" fill="#252c28">BrowserWidgets</text><text x="44" y="132" font-size="17" text-anchor="start" fill="#626962">Selected family</text><path d="M180 160V210H102V240" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M180 210H258V240" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="28" y="242" width="144" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="273" font-size="20" text-anchor="start" fill="#252c28">Button</text><text x="44" y="298" font-size="17" text-anchor="start" fill="#626962">Browser</text><rect x="188" y="242" width="144" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="204" y="273" font-size="20" text-anchor="start" fill="#252c28">Menu</text><text x="204" y="298" font-size="17" text-anchor="start" fill="#626962">Browser</text><rect x="28" y="374" width="304" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 4"/><text x="44" y="405" font-size="20" text-anchor="start" fill="#252c28">NativeWidgets</text><text x="44" y="430" font-size="17" text-anchor="start" fill="#626962">Unused alternative</text><text x="24" y="520" font-size="18" text-anchor="start" fill="#252c28">Button and menu come from</text><text x="24" y="546" font-size="18" text-anchor="start" fill="#252c28">the same selected factory.</text></svg>
