<svg xmlns="http://www.w3.org/2000/svg" width="360" height="658" viewBox="0 0 360 658" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Select an operation and dispatch by element type</title><desc id="desc">Addition.accept dispatches to the chosen visitor visit_addition method. Evaluate recursively computes 2 plus 3 as 5. Format recursively produces the string parentheses 2 plus 3 parentheses. The visitor owns traversal in this example.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="658" fill="#fff"/><text x="24" y="32" font-size="22" text-anchor="start" fill="#252c28">One structure, several</text><text x="24" y="59" font-size="22" text-anchor="start" fill="#252c28">operations</text><rect x="28" y="80" width="304" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="111" font-size="20" text-anchor="start" fill="#252c28">Addition(2, 3)</text><text x="44" y="136" font-size="17" text-anchor="start" fill="#626962">accept(visitor)</text><path d="M180 164V210H100V258" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M180 210H260V258" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="28" y="260" width="144" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="291" font-size="20" text-anchor="start" fill="#252c28">Evaluate</text><text x="44" y="316" font-size="17" text-anchor="start" fill="#626962">Result: 5</text><rect x="188" y="260" width="144" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="204" y="291" font-size="20" text-anchor="start" fill="#252c28">Format</text><text x="204" y="316" font-size="17" text-anchor="start" fill="#626962">Result: (2 + 3)</text><text x="24" y="474" font-size="18" text-anchor="start" fill="#252c28">Choose a visitor for one operation.</text><text x="24" y="500" font-size="18" text-anchor="start" fill="#252c28">accept selects its type-specific method.</text><text x="24" y="526" font-size="18" text-anchor="start" fill="#252c28">The lines show alternative operations.</text></svg>
