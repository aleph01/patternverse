<svg xmlns="http://www.w3.org/2000/svg" width="360" height="584" viewBox="0 0 360 584" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Notify current subscribers without knowing their roles</title><desc id="desc">Document updates its title and synchronously notifies the heading and index subscribers. Each subscriber interprets the update. Unsubscribing removes that relationship so later changes are no longer delivered to it.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="584" fill="#fff"/><text x="24" y="32" font-size="22" text-anchor="start" fill="#252c28">One change, several</text><text x="24" y="59" font-size="22" text-anchor="start" fill="#252c28">subscribers</text><rect x="28" y="80" width="304" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="111" font-size="20" text-anchor="start" fill="#252c28">Document</text><text x="44" y="136" font-size="17" text-anchor="start" fill="#626962">Set title, then notify</text><path d="M180 164V206H100V254" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M180 206H260V254" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="28" y="256" width="144" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="287" font-size="20" text-anchor="start" fill="#252c28">Heading</text><text x="44" y="312" font-size="17" text-anchor="start" fill="#626962">Update view</text><rect x="188" y="256" width="144" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="204" y="287" font-size="20" text-anchor="start" fill="#252c28">Index</text><text x="204" y="312" font-size="17" text-anchor="start" fill="#626962">Update record</text><text x="24" y="470" font-size="18" text-anchor="start" fill="#252c28">Each arrow is a subscription.</text><text x="24" y="496" font-size="18" text-anchor="start" fill="#252c28">Cleanup ends the relationship.</text></svg>
