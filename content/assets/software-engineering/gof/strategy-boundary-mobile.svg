<svg xmlns="http://www.w3.org/2000/svg" width="360" height="848" viewBox="0 0 360 848" role="img" aria-labelledby="title desc" data-style="light-editorial">
<title id="title">Strategy moves the pricing rule out of checkout</title><desc id="desc">Before, checkout contains validation, standard pricing, express pricing, and confirmation. After, checkout keeps validation and confirmation but delegates its price calculation through one contract to a selected strategy. Standard and express are alternative implementations.</desc>
<style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs>
<rect width="360" height="848" fill="#fff"/>
<text x="28" y="38" font-size="23" text-anchor="start" fill="#252c28">Before</text><rect x="28" y="60" width="304" height="254" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="48" y="92" font-size="22" text-anchor="start" fill="#252c28">Checkout</text><text x="48" y="133" font-size="19" text-anchor="start" fill="#252c28">Validate order</text><rect x="48" y="155" width="264" height="66" fill="#fff" stroke="#a6aca3" stroke-width="1.2" /><text x="64" y="182" font-size="19" text-anchor="start" fill="#252c28">Standard pricing rule</text><text x="64" y="206" font-size="19" text-anchor="start" fill="#252c28">Express pricing rule</text><text x="48" y="261" font-size="19" text-anchor="start" fill="#252c28">Continue checkout</text><text x="30" y="350" font-size="18" text-anchor="start" fill="#626962">A new rule changes checkout.</text><text x="28" y="424" font-size="23" text-anchor="start" fill="#252c28">After</text><rect x="28" y="446" width="304" height="254" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="48" y="478" font-size="22" text-anchor="start" fill="#252c28">Checkout</text><text x="48" y="519" font-size="19" text-anchor="start" fill="#252c28">Validate order</text><rect x="48" y="541" width="264" height="66" fill="#edf5f0" stroke="#00855b" stroke-width="1.2" /><text x="64" y="568" font-size="19" text-anchor="start" fill="#252c28">Call selected pricing</text><text x="64" y="592" font-size="17" text-anchor="start" fill="#626962">Shipment → Quote</text><text x="48" y="647" font-size="19" text-anchor="start" fill="#252c28">Continue checkout</text><path d="M312 574H322V732H304" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="48" y="712" width="254" height="68" fill="#edf5f0" stroke="#00855b" stroke-width="1.2" /><text x="64" y="740" font-size="18" text-anchor="start" fill="#252c28">Selected pricing strategy</text><text x="64" y="764" font-size="17" text-anchor="start" fill="#626962">Standard or express</text><text x="28" y="821" font-size="18" text-anchor="start" fill="#252c28">One process. A replaceable policy.</text>
</svg>
