<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A small rule is a tree with evaluation meaning</title><desc id="desc">An And expression contains HasValue done equals False and HasValue priority equals high. Each child evaluates against the same task context. And combines the two boolean results, with short-circuit behavior.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="390" fill="#fff"/><text x="24" y="32" font-size="24" text-anchor="start" fill="#252c28">Compose meaning from expressions</text><rect x="230" y="78" width="260" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="246" y="109" font-size="20" text-anchor="start" fill="#252c28">And</text><text x="246" y="134" font-size="17" text-anchor="start" fill="#626962">Both conditions must hold</text><path d="M360 162V200H170V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M360 200H550V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="40" y="248" width="260" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="279" font-size="20" text-anchor="start" fill="#252c28">HasValue</text><text x="56" y="304" font-size="17" text-anchor="start" fill="#626962">done = False</text><rect x="420" y="248" width="260" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="436" y="279" font-size="20" text-anchor="start" fill="#252c28">HasValue</text><text x="436" y="304" font-size="17" text-anchor="start" fill="#626962">priority = high</text><text x="24" y="374" font-size="18" text-anchor="start" fill="#252c28">These are expression objects, not calls to eval on user text.</text></svg>
