<svg xmlns="http://www.w3.org/2000/svg" width="720" height="326" viewBox="0 0 720 326" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Translate the contract at the provider boundary</title><desc id="desc">The application calls send with its own mail contract. MailAdapter translates the fields into the vendor submit payload and converts the acceptance token on return. Acceptance is not a guarantee of delivery.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="326" fill="#fff"/><text x="24" y="32" font-size="24" text-anchor="start" fill="#252c28">Translate the contract at the provider boundary</text><rect x="24" y="112" width="192" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="143" font-size="20" text-anchor="start" fill="#252c28">Application</text><text x="40" y="168" font-size="17" text-anchor="start" fill="#626962">send(to, subject, body)</text><path d="M216 154H262" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="240" y="133" font-size="16" text-anchor="middle" fill="#252c28">calls</text><rect x="264" y="112" width="192" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="280" y="143" font-size="20" text-anchor="start" fill="#252c28">MailAdapter</text><text x="280" y="168" font-size="17" text-anchor="start" fill="#626962">Map payload + result</text><path d="M456 154H502" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="480" y="133" font-size="16" text-anchor="middle" fill="#252c28">calls</text><rect x="504" y="112" width="192" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="520" y="143" font-size="20" text-anchor="start" fill="#252c28">VendorMail</text><text x="520" y="168" font-size="17" text-anchor="start" fill="#626962">submit(payload)</text><text x="24" y="270" font-size="18" text-anchor="start" fill="#252c28">Return path: acceptance token → application submission ID.</text></svg>
