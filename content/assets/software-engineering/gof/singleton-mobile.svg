<svg xmlns="http://www.w3.org/2000/svg" width="360" height="622" viewBox="0 0 360 622" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Uniqueness must have a scope</title><desc id="desc">Two callers access DeviceCoordinator in the same process and class scope. Both receive the same instance. A separate process can create its own instance; this design does not enforce device exclusivity across processes.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="622" fill="#fff"/><text x="24" y="32" font-size="22" text-anchor="start" fill="#252c28">One instance in this process</text><rect x="28" y="80" width="144" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="111" font-size="20" text-anchor="start" fill="#252c28">Caller A</text><text x="44" y="136" font-size="17" text-anchor="start" fill="#626962">Construct</text><rect x="188" y="80" width="144" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="204" y="111" font-size="20" text-anchor="start" fill="#252c28">Caller B</text><text x="204" y="136" font-size="17" text-anchor="start" fill="#626962">Construct</text><path d="M100 164V200H180V238" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M260 164V200H180V238" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="28" y="240" width="304" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="271" font-size="20" text-anchor="start" fill="#252c28">DeviceCoordinator</text><text x="44" y="296" font-size="17" text-anchor="start" fill="#626962">Same instance</text><text x="24" y="406" font-size="18" text-anchor="start" fill="#252c28">The creation lock guards creation.</text><text x="24" y="432" font-size="18" text-anchor="start" fill="#252c28">Another process has another scope.</text></svg>
