<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Put collaboration rules in one local coordinator</title><desc id="desc">Server and credential fields report changes to ConnectionDialog. The dialog combines both values and sets the test button availability. The fields do not hold references to the button or each other.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="650" fill="#fff"/><text x="24" y="32" font-size="22" text-anchor="start" fill="#252c28">Coordinate the combined</text><text x="24" y="59" font-size="22" text-anchor="start" fill="#252c28">state</text><rect x="28" y="80" width="144" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="111" font-size="20" text-anchor="start" fill="#252c28">Server field</text><text x="44" y="136" font-size="17" text-anchor="start" fill="#626962">Report changes</text><rect x="188" y="80" width="144" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="204" y="111" font-size="20" text-anchor="start" fill="#252c28">Credential</text><text x="204" y="136" font-size="17" text-anchor="start" fill="#626962">Report changes</text><path d="M100 164V200H180V238" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M260 164V200H180V238" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="28" y="240" width="304" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="271" font-size="20" text-anchor="start" fill="#252c28">ConnectionDialog</text><text x="44" y="296" font-size="17" text-anchor="start" fill="#626962">Evaluate combined rule</text><path d="M180 324V390" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="28" y="392" width="304" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="423" font-size="20" text-anchor="start" fill="#252c28">Test button</text><text x="44" y="448" font-size="17" text-anchor="start" fill="#626962">Enable or disable</text><text x="24" y="566" font-size="18" text-anchor="start" fill="#252c28">Fields own their local behavior.</text><text x="24" y="592" font-size="18" text-anchor="start" fill="#252c28">The dialog owns collaboration.</text></svg>
