<svg xmlns="http://www.w3.org/2000/svg" width="360" height="612" viewBox="0 0 360 612" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Keep construction separate from the finished result</title><desc id="desc">Title and sections accumulate in ReportBuilder. Build validates required parts, then returns a finished Report with a copied immutable section sequence. Incomplete construction state stays in the builder.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="612" fill="#fff"/><text x="24" y="32" font-size="22" text-anchor="start" fill="#252c28">Make completion explicit</text><rect x="28" y="84" width="304" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="115" font-size="20" text-anchor="start" fill="#252c28">ReportBuilder</text><text x="44" y="140" font-size="17" text-anchor="start" fill="#626962">Collect parts</text><path d="M180 168V236" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="198" y="208" font-size="17" text-anchor="start" fill="#252c28">finish</text><rect x="28" y="238" width="304" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="269" font-size="20" text-anchor="start" fill="#252c28">build()</text><text x="44" y="294" font-size="17" text-anchor="start" fill="#626962">Validate choices</text><path d="M180 322V390" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="198" y="362" font-size="17" text-anchor="start" fill="#252c28">returns</text><rect x="28" y="392" width="304" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="423" font-size="20" text-anchor="start" fill="#252c28">Report</text><text x="44" y="448" font-size="17" text-anchor="start" fill="#626962">Finished value</text><text x="24" y="536" font-size="18" text-anchor="start" fill="#252c28">Partial choices stay in the builder.</text><text x="24" y="562" font-size="18" text-anchor="start" fill="#252c28">Finished results own their values.</text></svg>
