<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Copy the editable state; share only deliberate values</title><desc id="desc">An original shape is cloned into a new shape with a new identity and an independent label list. Both point to the same immutable style. Updating duplicate labels leaves the original labels unchanged.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="650" fill="#fff"/><text x="24" y="32" font-size="22" text-anchor="start" fill="#252c28">A copy with its own identity</text><rect x="28" y="84" width="304" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="115" font-size="20" text-anchor="start" fill="#252c28">Original shape</text><text x="44" y="140" font-size="17" text-anchor="start" fill="#626962">ID A · own label list</text><rect x="28" y="250" width="304" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="281" font-size="20" text-anchor="start" fill="#252c28">Cloned shape</text><text x="44" y="306" font-size="17" text-anchor="start" fill="#626962">ID B · copied label list</text><path d="M180 168V248" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="198" y="212" font-size="17" text-anchor="start" fill="#252c28">clone</text><rect x="28" y="434" width="304" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="465" font-size="20" text-anchor="start" fill="#252c28">Immutable style</text><text x="44" y="490" font-size="17" text-anchor="start" fill="#626962">Shared deliberately</text><path d="M28 126H12V476H26" fill="none" stroke="#a6aca3" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 334V432" fill="none" stroke="#a6aca3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="566" font-size="18" text-anchor="start" fill="#252c28">New identity. Independent labels.</text><text x="24" y="592" font-size="18" text-anchor="start" fill="#252c28">A shared value that cannot mutate.</text></svg>
