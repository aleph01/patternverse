<svg xmlns="http://www.w3.org/2000/svg" width="360" height="638" viewBox="0 0 360 638" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Ask a leaf or a whole for the same operation</title><desc id="desc">A gift bundle contains a stationery bundle and a card. The stationery bundle contains a pencil and notebook. Price calls recurse through the same component contract, producing 600 plus 200 equals 800 cents.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="638" fill="#fff"/><text x="24" y="32" font-size="22" text-anchor="start" fill="#252c28">A recursive part–whole price</text><rect x="28" y="76" width="304" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="107" font-size="20" text-anchor="start" fill="#252c28">Gift bundle</text><text x="44" y="132" font-size="17" text-anchor="start" fill="#626962">800 cents</text><path d="M180 160V190H100V220" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M180 190H260V220" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="28" y="222" width="144" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="253" font-size="20" text-anchor="start" fill="#252c28">Stationery</text><text x="44" y="278" font-size="17" text-anchor="start" fill="#626962">600 cents</text><rect x="188" y="222" width="144" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="204" y="253" font-size="20" text-anchor="start" fill="#252c28">Card</text><text x="204" y="278" font-size="17" text-anchor="start" fill="#626962">200 cents</text><path d="M100 306V340H100V374" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M100 340H260V374" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="28" y="376" width="144" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="407" font-size="20" text-anchor="start" fill="#252c28">Pencil</text><text x="44" y="432" font-size="17" text-anchor="start" fill="#626962">100 cents</text><rect x="188" y="376" width="144" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="204" y="407" font-size="20" text-anchor="start" fill="#252c28">Notebook</text><text x="204" y="432" font-size="17" text-anchor="start" fill="#626962">500 cents</text><text x="24" y="544" font-size="18" text-anchor="start" fill="#252c28">Each total follows the child links.</text><text x="24" y="570" font-size="18" text-anchor="start" fill="#252c28">Cycles need a separate policy.</text></svg>
