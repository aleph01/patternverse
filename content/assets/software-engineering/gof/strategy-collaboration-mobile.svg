<svg xmlns="http://www.w3.org/2000/svg" width="360" height="688" viewBox="0 0 360 688" role="img" aria-labelledby="title desc" data-style="light-editorial">
<title id="title">Select the strategy before calling it</title><desc id="desc">First, the customer option express is mapped to an express pricing strategy at the application boundary. Then checkout calls the selected express strategy with a shipment and receives a quote. Standard pricing remains an unused alternative and is not called.</desc>
<style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs>
<rect width="360" height="688" fill="#fff"/>
<text x="24" y="36" font-size="22" text-anchor="start" fill="#252c28">1  Select at the boundary</text><rect x="24" y="62" width="312" height="64" fill="#fff" stroke="#a6aca3" stroke-width="1.2" /><text x="44" y="89" font-size="17" text-anchor="start" fill="#626962">Customer option</text><text x="44" y="113" font-size="20" text-anchor="start" fill="#252c28">Express</text><path d="M180 126V163" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="24" y="164" width="312" height="62" fill="#edf5f0" stroke="#00855b" stroke-width="1.2" /><text x="44" y="191" font-size="20" text-anchor="start" fill="#252c28">Supply express pricing</text><text x="44" y="214" font-size="17" text-anchor="start" fill="#626962">Choose once for this checkout</text><text x="24" y="278" font-size="22" text-anchor="start" fill="#252c28">2  Call during checkout</text><rect x="24" y="302" width="312" height="58" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="44" y="338" font-size="20" text-anchor="start" fill="#252c28">Checkout workflow</text><path d="M180 360V430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="198" y="390" font-size="18" text-anchor="start" fill="#252c28">Shipment</text><rect x="24" y="431" width="312" height="66" fill="#edf5f0" stroke="#00855b" stroke-width="1.2" /><text x="44" y="459" font-size="20" text-anchor="start" fill="#252c28">Express pricing</text><text x="44" y="483" font-size="17" text-anchor="start" fill="#626962">Selected strategy</text><path d="M24 462H12V330H24" fill="none" stroke="#a6aca3" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="529" width="312" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 4"/><text x="44" y="556" font-size="19" text-anchor="start" fill="#626962">Standard pricing</text><text x="44" y="579" font-size="17" text-anchor="start" fill="#626962">Alternative; not called</text><text x="24" y="629" font-size="17" text-anchor="start" fill="#252c28">The return arrow carries a quote.</text><text x="24" y="657" font-size="17" text-anchor="start" fill="#252c28">Selection and calculation stay separate.</text>
</svg>
