<svg xmlns="http://www.w3.org/2000/svg" width="720" height="438" viewBox="0 0 720 438" role="img" aria-labelledby="title desc" data-style="light-editorial">
<title id="title">Strategy moves the pricing rule out of checkout</title><desc id="desc">Before, checkout contains validation, standard pricing, express pricing, and confirmation. After, checkout keeps validation and confirmation but delegates its price calculation through one contract to a selected strategy. Standard and express are alternative implementations.</desc>
<style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs>
<rect width="720" height="438" fill="#fff"/>
<text x="24" y="38" font-size="23" text-anchor="start" fill="#252c28">Before</text><rect x="24" y="60" width="304" height="254" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="44" y="92" font-size="22" text-anchor="start" fill="#252c28">Checkout</text><text x="44" y="133" font-size="19" text-anchor="start" fill="#252c28">Validate order</text><rect x="44" y="155" width="264" height="66" fill="#fff" stroke="#a6aca3" stroke-width="1.2" /><text x="60" y="182" font-size="19" text-anchor="start" fill="#252c28">Standard pricing rule</text><text x="60" y="206" font-size="19" text-anchor="start" fill="#252c28">Express pricing rule</text><text x="44" y="261" font-size="19" text-anchor="start" fill="#252c28">Continue checkout</text><text x="26" y="350" font-size="18" text-anchor="start" fill="#626962">A new rule changes checkout.</text><text x="392" y="38" font-size="23" text-anchor="start" fill="#252c28">After</text><rect x="392" y="60" width="304" height="254" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="412" y="92" font-size="22" text-anchor="start" fill="#252c28">Checkout</text><text x="412" y="133" font-size="19" text-anchor="start" fill="#252c28">Validate order</text><rect x="412" y="155" width="264" height="66" fill="#edf5f0" stroke="#00855b" stroke-width="1.2" /><text x="428" y="182" font-size="19" text-anchor="start" fill="#252c28">Call selected pricing</text><text x="428" y="206" font-size="17" text-anchor="start" fill="#626962">Shipment → Quote</text><text x="412" y="261" font-size="19" text-anchor="start" fill="#252c28">Continue checkout</text><path d="M676 188H686V346H668" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="412" y="326" width="254" height="68" fill="#edf5f0" stroke="#00855b" stroke-width="1.2" /><text x="428" y="354" font-size="18" text-anchor="start" fill="#252c28">Selected pricing strategy</text><text x="428" y="378" font-size="17" text-anchor="start" fill="#626962">Standard or express</text><text x="24" y="422" font-size="19" text-anchor="start" fill="#252c28">One process. A replaceable policy.</text>
</svg>
