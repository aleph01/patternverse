<svg xmlns="http://www.w3.org/2000/svg" width="720" height="412" viewBox="0 0 720 412" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Two dimensions vary without multiplying subclasses</title><desc id="desc">Circle and Rectangle are shape abstractions. Either can hold SvgRenderer or TextRenderer. The selected shape delegates drawing primitives to its renderer, rather than using one subclass for each shape-renderer pairing.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="412" fill="#fff"/><text x="24" y="32" font-size="24" text-anchor="start" fill="#252c28">Shape × rendering backend</text><text x="28" y="84" font-size="18" text-anchor="start" fill="#252c28">Shape abstractions</text><text x="432" y="84" font-size="18" text-anchor="start" fill="#252c28">Renderer implementations</text><rect x="28" y="108" width="260" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="139" font-size="20" text-anchor="start" fill="#252c28">Circle</text><text x="44" y="164" font-size="17" text-anchor="start" fill="#626962">draw()</text><rect x="28" y="246" width="260" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="277" font-size="20" text-anchor="start" fill="#252c28">Rectangle</text><text x="44" y="302" font-size="17" text-anchor="start" fill="#626962">draw()</text><rect x="432" y="108" width="260" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="448" y="139" font-size="20" text-anchor="start" fill="#252c28">SVG</text><text x="448" y="164" font-size="17" text-anchor="start" fill="#626962">Renderer</text><rect x="432" y="246" width="260" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="448" y="277" font-size="20" text-anchor="start" fill="#252c28">Text</text><text x="448" y="302" font-size="17" text-anchor="start" fill="#626962">Renderer</text><path d="M288 150H430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M288 288H430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M288 150L430 288" fill="none" stroke="#a6aca3" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M288 288L430 150" fill="none" stroke="#a6aca3" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="24" y="390" font-size="18" text-anchor="start" fill="#252c28">Adding a primitive still changes the shared renderer contract.</text></svg>
