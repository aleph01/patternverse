<svg xmlns="http://www.w3.org/2000/svg" width="360" height="566" viewBox="0 0 360 566" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A small rule is a tree with evaluation meaning</title><desc id="desc">An And expression contains HasValue done equals False and HasValue priority equals high. Each child evaluates against the same task context. And combines the two boolean results, with short-circuit behavior.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="566" fill="#fff"/><text x="24" y="32" font-size="22" text-anchor="start" fill="#252c28">Compose meaning from</text><text x="24" y="59" font-size="22" text-anchor="start" fill="#252c28">expressions</text><rect x="28" y="78" width="304" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="109" font-size="20" text-anchor="start" fill="#252c28">And</text><text x="44" y="134" font-size="17" text-anchor="start" fill="#626962">Both conditions must hold</text><path d="M180 162V206H100V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M180 206H260V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="28" y="248" width="144" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="279" font-size="20" text-anchor="start" fill="#252c28">HasValue</text><text x="44" y="304" font-size="17" text-anchor="start" fill="#626962">done = False</text><rect x="188" y="248" width="144" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="204" y="279" font-size="20" text-anchor="start" fill="#252c28">HasValue</text><text x="204" y="304" font-size="17" text-anchor="start" fill="#626962">priority = high</text><text x="24" y="448" font-size="18" text-anchor="start" fill="#252c28">Both read the same task context.</text><text x="24" y="474" font-size="18" text-anchor="start" fill="#252c28">Parsing user text is a separate step.</text></svg>
