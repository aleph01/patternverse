<svg xmlns="http://www.w3.org/2000/svg" width="360" height="652" viewBox="0 0 360 652" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Construct the subject only when access requires it</title><desc id="desc">At folder opening only LazyImage exists and load count is zero. The first render constructs Image and delegates rendering. A later render reuses that same Image, so load count remains one in this single-threaded example.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="652" fill="#fff"/><text x="24" y="32" font-size="22" text-anchor="start" fill="#252c28">Defer the expensive subject</text><text x="28" y="83" font-size="19" text-anchor="start" fill="#252c28">Before first render</text><rect x="28" y="104" width="304" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="135" font-size="20" text-anchor="start" fill="#252c28">LazyImage</text><text x="44" y="160" font-size="17" text-anchor="start" fill="#626962">Subject not loaded</text><text x="28" y="252" font-size="19" text-anchor="start" fill="#252c28">On render</text><rect x="28" y="274" width="304" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="305" font-size="20" text-anchor="start" fill="#252c28">LazyImage</text><text x="44" y="330" font-size="17" text-anchor="start" fill="#626962">Create once, then reuse</text><rect x="28" y="438" width="304" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="469" font-size="20" text-anchor="start" fill="#252c28">Image</text><text x="44" y="494" font-size="17" text-anchor="start" fill="#626962">Actual subject</text><path d="M180 358V436" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="198" y="401" font-size="17" text-anchor="start" fill="#252c28">render</text><text x="24" y="592" font-size="18" text-anchor="start" fill="#252c28">Later renders reuse the subject.</text><text x="24" y="618" font-size="18" text-anchor="start" fill="#252c28">Concurrent loading needs a policy.</text></svg>
