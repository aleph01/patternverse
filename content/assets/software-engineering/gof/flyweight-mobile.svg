<svg xmlns="http://www.w3.org/2000/svg" width="360" height="540" viewBox="0 0 360 540" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Share the common type; keep each position local</title><desc id="desc">Two logical tree values have different coordinates and point to the same immutable oak TreeType holding species and asset data. Changing a coordinate is not a change to the shared type.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="540" fill="#fff"/><text x="24" y="32" font-size="22" text-anchor="start" fill="#252c28">Many positions, one shared</text><text x="24" y="59" font-size="22" text-anchor="start" fill="#252c28">type</text><rect x="28" y="82" width="144" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="113" font-size="20" text-anchor="start" fill="#252c28">Tree A</text><text x="44" y="138" font-size="17" text-anchor="start" fill="#626962">x=10, y=20</text><rect x="188" y="82" width="144" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="204" y="113" font-size="20" text-anchor="start" fill="#252c28">Tree B</text><text x="204" y="138" font-size="17" text-anchor="start" fill="#626962">x=30, y=40</text><path d="M100 166V210H180V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M260 166V210H180V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="28" y="248" width="304" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="279" font-size="20" text-anchor="start" fill="#252c28">TreeType: oak</text><text x="44" y="304" font-size="17" text-anchor="start" fill="#626962">Shared species + asset</text><text x="24" y="424" font-size="18" text-anchor="start" fill="#252c28">Coordinates belong to each tree.</text><text x="24" y="450" font-size="18" text-anchor="start" fill="#252c28">Shared state needs safe ownership.</text></svg>
