<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Let the state owner define capture and restoration</title><desc id="desc">Layout creates a snapshot containing immutable position values. History retains that snapshot without unpacking it. When undo is requested, Layout restores its own state from the saved representation.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="420" fill="#fff"/><text x="24" y="32" font-size="24" text-anchor="start" fill="#252c28">State capture keeps an owner</text><rect x="28" y="84" width="260" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="115" font-size="20" text-anchor="start" fill="#252c28">Layout</text><text x="44" y="140" font-size="17" text-anchor="start" fill="#626962">State owner</text><rect x="432" y="84" width="260" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="448" y="115" font-size="20" text-anchor="start" fill="#252c28">Snapshot</text><text x="448" y="140" font-size="17" text-anchor="start" fill="#626962">Immutable saved values</text><path d="M288 113H430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="360" y="97" font-size="17" text-anchor="middle" fill="#252c28">save</text><path d="M432 153H290" fill="none" stroke="#a6aca3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="360" y="185" font-size="17" text-anchor="middle" fill="#252c28">restore</text><rect x="432" y="282" width="260" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="448" y="313" font-size="20" text-anchor="start" fill="#252c28">History</text><text x="448" y="338" font-size="17" text-anchor="start" fill="#626962">Store without unpacking</text><path d="M562 168V280" fill="none" stroke="#a6aca3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="398" font-size="18" text-anchor="start" fill="#252c28">An immutable snapshot does not drift with later edits.</text></svg>
