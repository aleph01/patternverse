<svg xmlns="http://www.w3.org/2000/svg" width="360" height="612" viewBox="0 0 360 612" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Offer the request until a handler accepts it</title><desc id="desc">A close event first reaches the focused text field, which declines it. The window handles it, so the application handler is not reached. If every handler declines, the request has an explicit unhandled result.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="612" fill="#fff"/><text x="24" y="32" font-size="22" text-anchor="start" fill="#252c28">First handler to accept wins</text><rect x="28" y="84" width="304" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="115" font-size="20" text-anchor="start" fill="#252c28">Text field</text><text x="44" y="140" font-size="17" text-anchor="start" fill="#626962">Declines close</text><path d="M180 168V236" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="198" y="208" font-size="17" text-anchor="start" fill="#252c28">next</text><rect x="28" y="238" width="304" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="269" font-size="20" text-anchor="start" fill="#252c28">Window</text><text x="44" y="294" font-size="17" text-anchor="start" fill="#626962">Handles close</text><text x="198" y="362" font-size="17" text-anchor="start" fill="#252c28">stop</text><rect x="28" y="392" width="304" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 4"/><text x="44" y="423" font-size="20" text-anchor="start" fill="#252c28">Application</text><text x="44" y="448" font-size="17" text-anchor="start" fill="#626962">Not reached</text><text x="24" y="536" font-size="18" text-anchor="start" fill="#252c28">Only a declined request continues.</text><text x="24" y="562" font-size="18" text-anchor="start" fill="#252c28">The last candidate may also decline.</text></svg>
