<svg xmlns="http://www.w3.org/2000/svg" width="720" height="912" viewBox="0 0 720 912" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Narrow grant and direct resource access</title><desc id="desc">The client first requests an export download from the application. The application authenticates and authorizes the request, then returns a grant restricted to GET on export E7 for a short window. The client presents that grant directly to storage. Storage validates it and returns archive bytes directly to the client; those bytes do not pass through the issuing application.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="912" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Authorize the grant; transfer bytes directly</text><text x="24" y="78" font-size="19" fill="#626962">The application handles permission, not the archive stream.</text><rect x="24" y="112" width="248" height="224" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="152" font-size="23" fill="#252c28">Client</text><text x="40" y="196" font-size="18" fill="#252c28">Authenticated at issuer</text><text x="40" y="236" font-size="18" fill="#252c28">Receives scoped grant</text><text x="40" y="282" font-size="18" fill="#626962">No account-wide key</text><text x="40" y="316" font-size="17" fill="#626962">No standing storage access</text><rect x="448" y="112" width="248" height="224" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="464" y="152" font-size="22" fill="#252c28">Application issuer</text><text x="464" y="196" font-size="18" fill="#252c28">Authorize export E7</text><text x="464" y="236" font-size="19" fill="#252c28">Issue GET grant</text><text x="464" y="282" font-size="18" fill="#626962">100 ≤ time &lt; 160</text><text x="464" y="316" font-size="17" fill="#626962">Keep broad authority</text><path d="M276 196H444" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="292" y="176" font-size="17" fill="#626962">1 Request</text><path d="M444 276H276" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="292" y="256" font-size="17" fill="#626962">2 Grant</text><path d="M112 336V540" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="84" y="440" font-size="20" fill="#252c28">3</text><path d="M216 540V340" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="232" y="468" font-size="20" fill="#252c28">4</text><text x="320" y="400" font-size="20" fill="#252c28">3 Direct GET + grant</text><text x="320" y="436" font-size="18" fill="#626962">Key: exports/E7.zip</text><text x="320" y="472" font-size="19" fill="#252c28">4 Archive bytes to client</text><text x="320" y="508" font-size="17" fill="#626962">Application is off the byte path</text><rect x="24" y="544" width="672" height="208" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="584" font-size="23" fill="#252c28">Storage enforcement</text><text x="40" y="628" font-size="20" fill="#252c28">Validate grant: resource / method / time</text><text x="40" y="674" font-size="19" fill="#252c28">Serve only authorized object bytes.</text><text x="40" y="720" font-size="18" fill="#626962">Broad storage credentials stay with trusted services.</text><text x="24" y="798" font-size="19" fill="#252c28">Issuance path: application authorizes a narrow delegation.</text><text x="24" y="840" font-size="19" fill="#626962">Data path: client ↔ storage; no application relay.</text><text x="24" y="882" font-size="18" fill="#626962">Bearer grant: protect it wherever it travels.</text></svg>
