<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Shared deadline versus resetting per-call limits</title><desc id="desc">A quote has one 300 millisecond budget. Inventory consumes the first 120 milliseconds, leaving shipping 180 milliseconds until the same deadline. Giving shipping a fresh 300 milliseconds would extend the operation to 420 milliseconds. Queueing and setup must be explicitly included or excluded from the chosen boundary.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1040" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A shared deadline preserves the total waiting budget</text><rect x="24" y="104" width="672" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Example boundary: inventory and shipping waits</text><text x="40" y="159" font-size="17" fill="#626962">Elapsed time runs left to right; all numbers are milliseconds.</text><text x="24" y="264" font-size="22" fill="#252c28">Shared operation budget</text><rect x="60" y="312" width="160" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="76" y="344" font-size="19" fill="#252c28">Inventory</text><text x="76" y="379" font-size="17" fill="#626962">120 ms</text><rect x="220" y="312" width="240" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="236" y="344" font-size="19" fill="#252c28">Shipping</text><text x="236" y="379" font-size="17" fill="#626962">180 ms remaining</text><path d="M460 288V470" fill="none" stroke="#00855b" stroke-width="1.5" stroke-dasharray="5 5"/><text x="60" y="450" font-size="17" fill="#626962">0 ms</text><text x="220" y="450" font-size="17" fill="#626962">120 ms</text><text x="472" y="450" font-size="17" fill="#626962">300 ms / deadline</text><text x="24" y="536" font-size="22" fill="#252c28">Fresh budget per call</text><rect x="60" y="584" width="160" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="76" y="616" font-size="19" fill="#252c28">Inventory</text><text x="76" y="651" font-size="17" fill="#626962">120 ms</text><rect x="220" y="584" width="400" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="236" y="616" font-size="19" fill="#252c28">Shipping</text><text x="236" y="651" font-size="17" fill="#626962">Fresh 300 ms allowance</text><path d="M460 560V744" fill="none" stroke="#00855b" stroke-width="1.5" stroke-dasharray="5 5"/><text x="60" y="726" font-size="17" fill="#626962">0 ms</text><text x="220" y="726" font-size="17" fill="#626962">120 ms</text><text x="620" y="726" font-size="17" fill="#626962">420 ms</text><rect x="24" y="816" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="845" font-size="20" fill="#252c28">After 120 ms, pass only the remaining 180 ms</text><text x="40" y="871" font-size="17" fill="#626962">Queueing and setup must be budgeted when included in the boundary.</text><text x="24" y="994" font-size="17" fill="#626962">Same horizontal scale in both rows. Numbers are illustrative, not measured.</text></svg>
