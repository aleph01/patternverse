<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Public interfaces and owned state inside one application release</title><desc id="desc">One application release contains Customers and Tickets modules. Startup code composes their public APIs. Tickets calls the Customers API locally, while each module keeps its own records behind that interface.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="610" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Module boundaries inside one application</text><rect x="24" y="100" width="672" height="430" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="136" font-size="21" fill="#252c28">One release · one process per replica</text><rect x="44" y="178" width="632" height="72" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="207" font-size="20" fill="#252c28">main.py · composition root</text><text x="60" y="233" font-size="17" fill="#626962">Build Customers and Tickets</text><text x="44" y="294" font-size="21" fill="#252c28">Tickets</text><text x="412" y="294" font-size="21" fill="#252c28">Customers</text><rect x="44" y="314" width="264" height="184" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="412" y="314" width="264" height="184" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="64" y="334" width="224" height="60" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="80" y="363" font-size="20" fill="#252c28">Tickets API</text><text x="80" y="389" font-size="17" fill="#626962">open · get</text><rect x="432" y="334" width="224" height="60" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="448" y="363" font-size="20" fill="#252c28">Customers API</text><text x="448" y="389" font-size="17" fill="#626962">active_customer</text><rect x="64" y="414" width="224" height="62" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="80" y="443" font-size="20" fill="#252c28">Ticket state</text><text x="80" y="469" font-size="17" fill="#626962">Private to Tickets</text><rect x="432" y="414" width="224" height="62" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="448" y="443" font-size="20" fill="#252c28">Customer store</text><text x="448" y="469" font-size="17" fill="#626962">_store.py · private</text><path d="M176 250V332" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><path d="M544 250V332" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><path d="M288 364H430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="316" y="344" font-size="17" fill="#252c28">local call</text><text x="24" y="580" font-size="17" fill="#626962">Public interfaces cross module boundaries; records do not.</text></svg>
