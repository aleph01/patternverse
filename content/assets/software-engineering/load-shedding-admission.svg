<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1024" viewBox="0 0 720 1024" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Refuse before the expensive path</title><desc id="desc">A request reaches a cheap admission decision before expensive work. If its trusted work cost fits the remaining budget, that cost is claimed and the operation runs. If it does not fit, the service returns an explicit overload result without invoking the operation or adding it to an internal waiting queue. Claimed budget returns after local completion and cleanup.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#252c28" stroke-width="1.2"/></marker></defs><rect width="720" height="1024" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Refuse before the expensive path</text><rect x="24" y="96" width="672" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="132" font-size="22" fill="#252c28">Request / cheap parsing and trusted classification</text><text x="40" y="174" font-size="19" fill="#626962">Decide before queries, allocations, or downstream fan-out.</text><path d="M360 200V278" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#control)"/><text x="24" y="246" font-size="17" fill="#626962">Classified request</text><rect x="24" y="280" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="318" font-size="24" fill="#252c28">Admission decision</text><text x="40" y="366" font-size="20" fill="#252c28">Server-assigned cost / remaining work budget</text><path d="M176 408V494" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M544 408V494" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#control)"/><text x="40" y="460" font-size="18" fill="#252c28">Fits</text><text x="408" y="460" font-size="18" fill="#252c28">Does not fit</text><rect x="24" y="496" width="304" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="530" font-size="20" fill="#252c28">Claim budget; invoke</text><text x="40" y="576" font-size="17" fill="#252c28">Protected operation starts.</text><text x="40" y="626" font-size="17" fill="#626962">Release after local cleanup.</text><rect x="392" y="496" width="304" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="408" y="530" font-size="20" fill="#252c28">Return overload result</text><text x="408" y="576" font-size="17" fill="#252c28">Operation never invoked.</text><text x="408" y="626" font-size="17" fill="#626962">No internal waiting queue.</text><rect x="24" y="736" width="672" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="774" font-size="22" fill="#252c28">Refusal still uses resources</text><text x="40" y="822" font-size="19" fill="#626962">This boundary cannot reclaim costs already incurred upstream.</text><text x="40" y="868" font-size="19" fill="#626962">An earlier layer may need to protect the admission gate.</text><text x="24" y="984" font-size="18" fill="#626962">Arrows: admission decisions and control flow.</text></svg>
