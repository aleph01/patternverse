<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1144" viewBox="0 0 360 1144" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Admission is not business authorization</title><desc id="desc">Five requests divide into three outcomes: a two-copy preview for Alice’s O100 order is admitted and allowed; an extra owner field and boolean copy count are rejected before forwarding; four copies and another owner’s order pass admission but are denied by the private service.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1144" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Admission ≠ authorization</text><text x="24" y="78" font-size="18" fill="#626962">Five label-preview requests.</text><rect x="24" y="112" width="312" height="168" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="146" font-size="20" fill="#252c28">Allowed preview</text><text x="40" y="178" font-size="18" fill="#626962">O100 · copies 2</text><text x="40" y="216" font-size="18" fill="#252c28">Admission: admitted</text><text x="40" y="254" font-size="18" fill="#252c28">Service: O100 x2</text><rect x="24" y="308" width="312" height="168" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="342" font-size="20" fill="#252c28">Extra owner field</text><text x="40" y="374" font-size="18" fill="#626962">owner: alice</text><text x="40" y="412" font-size="18" fill="#252c28">Admission: rejected</text><text x="40" y="450" font-size="18" fill="#252c28">Service: Not called</text><rect x="24" y="504" width="312" height="168" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="538" font-size="20" fill="#252c28">Boolean count</text><text x="40" y="570" font-size="18" fill="#626962">copies: true</text><text x="40" y="608" font-size="18" fill="#252c28">Admission: rejected</text><text x="40" y="646" font-size="18" fill="#252c28">Service: Not called</text><rect x="24" y="700" width="312" height="168" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="734" font-size="20" fill="#252c28">Over business quota</text><text x="40" y="766" font-size="18" fill="#626962">O100 · copies 4</text><text x="40" y="804" font-size="18" fill="#252c28">Admission: admitted</text><text x="40" y="842" font-size="18" fill="#252c28">Service: Denied</text><rect x="24" y="896" width="312" height="168" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="930" font-size="20" fill="#252c28">Other owner’s order</text><text x="40" y="962" font-size="18" fill="#626962">O200 · copies 1</text><text x="40" y="1000" font-size="18" fill="#252c28">Admission: admitted</text><text x="40" y="1038" font-size="18" fill="#252c28">Service: Denied</text><text x="24" y="1120" font-size="20" fill="#252c28">Rejected → no forwarding.</text></svg>
