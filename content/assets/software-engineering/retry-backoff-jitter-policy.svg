<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1136" viewBox="0 0 720 1136" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Bounded retry admission with capped jitter windows</title><desc id="desc">After an eligible failure, retry only when an attempt remains and the total budget permits the sampled wait. A first full-jitter window is zero through 100 milliseconds, then zero through 200, then zero through 400. Four total attempts permit at most three waits. Permanent failure, exhausted attempts, or exhausted budget ends the operation.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1136" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Retry admission and retry timing are separate decisions</text><text x="24" y="136" font-size="22" fill="#252c28">Before another attempt</text><text x="400" y="136" font-size="22" fill="#252c28">Example delay windows</text><rect x="24" y="184" width="296" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="213" font-size="18" fill="#252c28">Eligible and safe to repeat?</text><text x="40" y="239" font-size="16" fill="#626962">Permanent or unsafe: stop.</text><path d="M172 312V406" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="408" width="296" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="437" font-size="18" fill="#252c28">An attempt remains?</text><text x="40" y="463" font-size="16" fill="#626962">Four total; at most three retries.</text><path d="M172 536V630" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="632" width="296" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="661" font-size="18" fill="#252c28">Sample fits remaining budget?</text><text x="40" y="687" font-size="16" fill="#626962">Equal to the remainder: stop.</text><rect x="400" y="184" width="296" height="576" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="416" y="220" font-size="18" fill="#252c28">Uniform integer milliseconds</text><text x="416" y="292" font-size="19" fill="#252c28">Retry 1 / 0..100 ms</text><text x="416" y="380" font-size="19" fill="#252c28">Retry 2 / 0..200 ms</text><text x="416" y="468" font-size="19" fill="#252c28">Retry 3 / 0..400 ms</text><text x="416" y="580" font-size="17" fill="#626962">Initial attempt has no backoff.</text><text x="416" y="648" font-size="17" fill="#626962">Delay cap: 400 ms.</text><text x="416" y="716" font-size="17" fill="#626962">Total budget: 1,000 ms.</text><rect x="24" y="864" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="896" font-size="20" fill="#252c28">Wait, then recheck the same deadline before starting again</text><text x="40" y="942" font-size="17" fill="#626962">Stop when any admission check fails.</text><text x="40" y="984" font-size="17" fill="#626962">No wait follows success or the final allowed failure.</text><text x="24" y="1084" font-size="17" fill="#626962">Arrows: advance only if all checks pass. Spacing does not supply idempotency.</text></svg>
