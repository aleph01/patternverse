<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1252" viewBox="0 0 360 1252" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Unit of Work tracks new, modified, and removed objects</title><desc id="desc">One maintenance operation registers label A as modified, B as new, and C as removed. The Unit of Work tracks those object snapshots, then translates them into UPDATE, INSERT, and DELETE operations under one database transaction. No registration writes SQL by itself.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1252" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Track the objects,</text><text x="24" y="60" font-size="22" fill="#252c28">then coordinate the writes</text><rect x="24" y="104" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">One maintenance operation</text><text x="40" y="159" font-size="17" fill="#626962">Rename A · add B · retire C</text><path d="M180 204V278" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="280" width="312" height="620" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="318" font-size="21" fill="#252c28">Unit of Work registry</text><rect x="44" y="356" width="272" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="385" font-size="20" fill="#252c28">Modified A</text><text x="60" y="411" font-size="17" fill="#626962">Ready → UPDATE</text><rect x="44" y="496" width="272" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="525" font-size="20" fill="#252c28">New B</text><text x="60" y="551" font-size="17" fill="#626962">New → INSERT</text><rect x="44" y="636" width="272" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="665" font-size="20" fill="#252c28">Removed C</text><text x="60" y="691" font-size="17" fill="#626962">Obsolete → DELETE</text><text x="44" y="800" font-size="17" fill="#252c28">Final snapshots only</text><text x="44" y="836" font-size="17" fill="#626962">No SQL during registration</text><rect x="24" y="996" width="312" height="120" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1025" font-size="20" fill="#252c28">Explicit commit</text><text x="40" y="1051" font-size="17" fill="#626962">Flush, then commit transaction</text><path d="M180 900V994" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="1180" font-size="18" fill="#252c28">UPDATE → INSERT → DELETE</text><text x="24" y="1216" font-size="17" fill="#626962">One local persistence boundary</text></svg>
