<svg xmlns="http://www.w3.org/2000/svg" width="360" height="850" viewBox="0 0 360 850" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Pure computation between external effects</title><desc id="desc">An imperative shell reads inventory from a CSV file and converts it to immutable item values. A functional core returns replenishment proposals. The shell writes those proposals to a CSV file; the core receives no file handle.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="850" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Observe → decide → act</text><rect x="24" y="102" width="312" height="712" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="136" font-size="21" fill="#252c28">Imperative shell</text><rect x="44" y="166" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="195" font-size="20" fill="#252c28">1 · Read stock.csv</text><text x="60" y="221" font-size="17" fill="#626962">Parse and close the file</text><path d="M180 242V310" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="198" y="282" font-size="17" fill="#252c28">Item values</text><rect x="44" y="312" width="272" height="124" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="341" font-size="20" fill="#252c28">2 · Functional core</text><text x="60" y="367" font-size="17" fill="#626962">plan_reorders(items)</text><text x="60" y="416" font-size="16" fill="#626962">No file, clock, or database access</text><path d="M180 436V522" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="198" y="494" font-size="17" fill="#252c28">Proposals</text><rect x="44" y="524" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="553" font-size="20" fill="#252c28">3 · Write proposals.csv</text><text x="60" y="579" font-size="17" fill="#626962">Shell performs the effect</text><text x="44" y="654" font-size="18" fill="#252c28">Core: values in, values out</text><text x="44" y="694" font-size="16" fill="#626962">Shell: I/O and resource lifetime</text><text x="44" y="752" font-size="17" fill="#252c28">Returning a proposal does</text><text x="44" y="780" font-size="17" fill="#252c28">not place an order.</text></svg>
