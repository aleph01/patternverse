<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1048" viewBox="0 0 720 1048" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A completed write permits the next read</title><desc id="desc">The transfer reads the first chunk and awaits its sink write. While the write is blocked, it does not request chunk two. Completion permits the next read. After all three chunks complete, the generator is closed and the result reports three chunks and six bytes. Failure or cancellation exits through source closing instead of requesting further chunks.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="data" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#252c28" stroke-width="1.2"/></marker></defs><rect width="720" height="1048" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A completed write permits the next read</text><text x="24" y="104" font-size="20" fill="#252c28">SOURCE</text><text x="400" y="104" font-size="20" fill="#252c28">SINK CALLBACK</text><rect x="24" y="152" width="296" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="186" font-size="20" fill="#252c28">Read chunk one</text><text x="40" y="236" font-size="18" fill="#626962">One byte: a</text><rect x="400" y="152" width="296" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="416" y="186" font-size="20" fill="#252c28">Await write</text><text x="416" y="236" font-size="18" fill="#626962">Held on an event</text><rect x="24" y="360" width="296" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="394" font-size="20" fill="#252c28">Do not advance</text><text x="40" y="444" font-size="18" fill="#626962">Read count stays at 1</text><rect x="400" y="360" width="296" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="416" y="394" font-size="20" fill="#252c28">Still unfinished</text><text x="416" y="444" font-size="18" fill="#626962">Completed bytes stay at 0</text><rect x="24" y="640" width="296" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="674" font-size="20" fill="#252c28">Read next chunk</text><text x="40" y="724" font-size="18" fill="#626962">After the prior write finishes</text><rect x="400" y="640" width="296" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="416" y="674" font-size="20" fill="#252c28">Await next write</text><text x="416" y="724" font-size="18" fill="#626962">Repeat sequentially</text><path d="M320 216H398" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#data)"/><path d="M320 704H398" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#data)"/><path d="M548 488V560H172V490" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="232" y="542" font-size="19" fill="#252c28">Completion permits the next read</text><rect x="24" y="832" width="672" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="868" font-size="22" fill="#252c28">Finished: 3 chunks / 6 bytes / source closed</text><text x="40" y="910" font-size="18" fill="#626962">Failure or cancellation also exits through owned source closing.</text><text x="24" y="1004" font-size="18" fill="#626962">After transfer starts. Sink cleanup belongs to the callback.</text></svg>
