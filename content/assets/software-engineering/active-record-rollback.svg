<svg xmlns="http://www.w3.org/2000/svg" width="720" height="718" viewBox="0 0 720 718" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Active Record object state is not restored by database rollback</title><desc id="desc">A Task is loaded with done false. Calling complete changes the object to done true; save writes a provisional done true row. A later caller rollback restores the database row to done false while the object remains done true. Reloading creates an object reflecting the stored false value.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="718" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Rollback changes the row, not the object</text><text x="24" y="84" font-size="18" fill="#626962">Stage</text><text x="264" y="84" font-size="18" fill="#626962">In-memory Task</text><text x="504" y="84" font-size="18" fill="#626962">Database (writer)</text><rect x="24" y="112" width="200" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Loaded</text><text x="40" y="167" font-size="17" fill="#626962">Committed baseline</text><rect x="264" y="112" width="200" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="280" y="141" font-size="20" fill="#252c28">done: False</text><text x="280" y="167" font-size="17" fill="#626962">Local object</text><rect x="504" y="112" width="192" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="520" y="141" font-size="20" fill="#252c28">done: 0</text><text x="520" y="167" font-size="17" fill="#626962">Committed</text><rect x="24" y="292" width="200" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="321" font-size="20" fill="#252c28">complete + save</text><text x="40" y="347" font-size="17" fill="#626962">Provisional SQL</text><rect x="264" y="292" width="200" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="280" y="321" font-size="20" fill="#252c28">done: True</text><text x="280" y="347" font-size="17" fill="#626962">Changed in memory</text><rect x="504" y="292" width="192" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="520" y="321" font-size="20" fill="#252c28">done: 1</text><text x="520" y="347" font-size="17" fill="#626962">Uncommitted</text><rect x="24" y="472" width="200" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="501" font-size="20" fill="#252c28">ROLLBACK</text><text x="40" y="527" font-size="17" fill="#626962">Use case fails</text><rect x="264" y="472" width="200" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="280" y="501" font-size="20" fill="#252c28">done: True</text><text x="280" y="527" font-size="17" fill="#626962">Object unchanged</text><rect x="504" y="472" width="192" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="520" y="501" font-size="20" fill="#252c28">done: 0</text><text x="520" y="527" font-size="17" fill="#626962">Row restored</text><text x="24" y="644" font-size="18" fill="#252c28">Reload or discard the affected object.</text><text x="24" y="682" font-size="17" fill="#626962">An assigned ID is not proof of a committed row.</text></svg>
