<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1008" viewBox="0 0 720 1008" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Rejected reservation preserves capacity and changes screen feedback</title><desc id="desc">A three-seat model accepts a reservation of two seats, and the presenter renders one remaining seat with Reserve enabled. A second request for two is rejected without mutation. The presenter reads the unchanged remaining count and renders the same availability with an error message. The recording view captures that screen result without a GUI.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1008" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A failed command changes feedback, not capacity</text><rect x="24" y="100" width="672" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">Before the next click</text><text x="40" y="155" font-size="17" fill="#626962">Seats left: 1; Reserve enabled.</text><rect x="24" y="312" width="312" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="341" font-size="20" fill="#252c28">Presenter → model</text><text x="40" y="367" font-size="17" fill="#626962">Request two more seats.</text><path d="M180 204V310" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="264" font-size="17" fill="#626962">reserve(&quot;2&quot;)</text><rect x="384" y="312" width="312" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="341" font-size="20" fill="#252c28">Model rejects</text><text x="400" y="367" font-size="17" fill="#626962">2 > 1; no mutation.</text><path d="M336 364H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="536" width="672" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="565" font-size="20" fill="#252c28">Presenter refreshes after BookingError</text><text x="40" y="591" font-size="17" fill="#626962">Read remaining: 1; choose the rejection message.</text><path d="M540 416V534" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="478" font-size="17" fill="#626962">failure result</text><rect x="24" y="752" width="672" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="781" font-size="20" fill="#252c28">View receives one screen result</text><text x="40" y="807" font-size="17" fill="#626962">Seats left: 1; Reserve enabled; message: Not enough seats</text><path d="M180 640V750" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="702" font-size="17" fill="#626962">render(screen)</text><text x="24" y="924" font-size="18" fill="#252c28">The recorder captures the result without loading a GUI.</text><text x="24" y="960" font-size="17" fill="#626962">An enabled or disabled button never replaces model validation.</text></svg>
