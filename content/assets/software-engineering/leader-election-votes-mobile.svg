<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1112" viewBox="0 0 360 1112" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Full-membership voting and one vote per term</title><desc id="desc">In a fixed three-member group A, B, and C, an isolated C receives only its own vote and cannot win. A receives A and B's votes in term one and wins with two of three. Each voter can choose only one candidate per term, so another candidate cannot assemble a different majority in that term.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1112" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Count the full membership</text><rect x="24" y="112" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Fixed group: A, B, C</text><text x="40" y="167" font-size="17" fill="#626962">Quorum: 2 of all 3 voters</text><path d="M180 224V286" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="288" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="317" font-size="18" fill="#252c28">C isolated / term 1</text><text x="40" y="343" font-size="16" fill="#626962">Only C votes for C: 1 of 3</text><text x="40" y="390" font-size="18" fill="#626962">No winner</text><path d="M180 416V478" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="480" width="312" height="272" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="514" font-size="20" fill="#252c28">After A contacts A and B</text><text x="40" y="570" font-size="17" fill="#626962">Voter A / term 1 / voted A</text><text x="40" y="626" font-size="17" fill="#626962">Voter B / term 1 / voted A</text><text x="40" y="682" font-size="17" fill="#626962">Voter C / term 1 / voted C</text><path d="M180 752V846" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="806" font-size="15" fill="#626962">count A votes</text><rect x="24" y="848" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="877" font-size="20" fill="#252c28">A elected in term 1</text><text x="40" y="903" font-size="17" fill="#626962">Votes (A, B) / 2 of 3</text><text x="40" y="950" font-size="16" fill="#626962">C’s earlier vote stays recorded.</text><text x="24" y="1064" font-size="15" fill="#626962">Arrows: trace stages and vote counting.</text></svg>
