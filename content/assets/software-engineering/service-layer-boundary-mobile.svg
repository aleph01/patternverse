<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1008" viewBox="0 0 360 1008" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Service Layer coordinates one application boundary</title><desc id="desc">A web adapter and a command-line adapter both call book on the service layer. The service coordinates loading, invoking Workshop.after_booking, writing availability and the booking record, then committing. Workshop owns the capacity rule; SQLite owns persistence and locking.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1008" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">One operation,</text><text x="24" y="60" font-size="22" fill="#252c28">different callers</text><rect x="24" y="104" width="144" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="18" fill="#252c28">Web</text><text x="40" y="159" font-size="16" fill="#626962">Parse / present</text><rect x="192" y="104" width="144" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="208" y="133" font-size="18" fill="#252c28">CLI</text><text x="208" y="159" font-size="16" fill="#626962">Parse / print</text><path d="M96 204V246H138V278" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M264 204V246H222V278" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="280" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="314" font-size="21" fill="#252c28">Service Layer · book</text><text x="40" y="354" font-size="18" fill="#252c28">Load → ask the model</text><text x="40" y="390" font-size="18" fill="#252c28">Write → commit</text><text x="40" y="420" font-size="17" fill="#626962">Return remaining seats</text><rect x="24" y="520" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="549" font-size="20" fill="#252c28">Workshop.after_booking</text><text x="40" y="575" font-size="17" fill="#626962">Capacity rule</text><path d="M180 440V518" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="490" font-size="17" fill="#626962">invoke</text><rect x="24" y="700" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="729" font-size="20" fill="#252c28">SQLite</text><text x="40" y="755" font-size="17" fill="#626962">Lock / save / rollback</text><path d="M336 388H348V750H338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="862" font-size="17" fill="#252c28">Arrows: calls to collaborators.</text><text x="24" y="904" font-size="18" fill="#252c28">The service coordinates.</text><text x="24" y="936" font-size="17" fill="#626962">The model decides capacity.</text><text x="24" y="968" font-size="17" fill="#626962">The database protects writes.</text></svg>
