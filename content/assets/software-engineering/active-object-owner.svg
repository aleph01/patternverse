<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1320" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Active Object ownership and collaboration</title><desc id="desc">Clients invoke the stock proxy, which creates requests containing an immutable quantity change and a future. A bounded activation queue passes requests to one worker scheduler. Only that worker accesses the stock quantity and resolves each future with a result or error.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1320" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">The proxy accepts calls; one owner executes stock methods</text><rect x="24" y="112" width="296" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Caller thread</text><text x="40" y="167" font-size="17" fill="#626962">Invokes change(delta).</text><text x="40" y="222" font-size="17" fill="#626962">Can continue with a future.</text><rect x="400" y="112" width="296" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="416" y="141" font-size="20" fill="#252c28">Stock proxy</text><text x="416" y="167" font-size="17" fill="#626962">Captures (delta, future).</text><text x="416" y="222" font-size="16" fill="#626962">Does not execute stock changes.</text><path d="M320 156H398" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="328" y="140" font-size="15" fill="#626962">invoke</text><path d="M400 212H322" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="328" y="198" font-size="15" fill="#626962">future</text><path d="M548 256V318H360V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="302" font-size="17" fill="#626962">method request</text><rect x="24" y="352" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="381" font-size="20" fill="#252c28">Bounded activation queue / FIFO</text><text x="40" y="407" font-size="17" fill="#626962">At most two method requests wait; admission can reject a full queue.</text><path d="M360 480V574" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="534" font-size="17" fill="#626962">dequeue next request</text><rect x="24" y="576" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="605" font-size="20" fill="#252c28">Owner thread / scheduler</text><text x="40" y="631" font-size="17" fill="#626962">Runs one request at a time; queued cancellation can skip execution.</text><path d="M360 704V798" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="758" font-size="17" fill="#626962">invoke servant behavior</text><rect x="24" y="800" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="829" font-size="20" fill="#252c28">Worker-owned servant state: quantity</text><text x="40" y="855" font-size="17" fill="#626962">The worker checks and updates its local quantity; callers have no direct path.</text><path d="M360 928V1022" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="982" font-size="17" fill="#626962">resolve result</text><rect x="24" y="1024" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1053" font-size="20" fill="#252c28">Future already returned to the caller</text><text x="40" y="1079" font-size="17" fill="#626962">Receives an immutable integer or an exception for this request.</text><text x="24" y="1232" font-size="17" fill="#626962">Arrows: method invocation, queued request, worker execution, result delivery.</text><text x="24" y="1270" font-size="17" fill="#626962">The control lock guards admission and closure, not the servant’s quantity.</text></svg>
