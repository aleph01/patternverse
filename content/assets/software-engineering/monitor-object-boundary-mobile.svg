<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1104" viewBox="0 0 360 1104" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Monitor Object state and locking boundary</title><desc id="desc">Producer and consumer caller threads enter synchronized put, get, and close methods through one shared monitor lock. The protected inbox contains a bounded deque and a closed flag. A condition wait releases that same lock; a returning waiter reacquires it and rechecks the state predicate.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1104" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">One state boundary, one lock</text><rect x="24" y="112" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">Producer and consumer callers</text><text x="40" y="167" font-size="16" fill="#626962">put, get, close run on their threads.</text><path d="M180 240V318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="286" font-size="16" fill="#626962">enter method</text><rect x="24" y="320" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="349" font-size="18" fill="#252c28">Shared monitor lock</text><text x="40" y="375" font-size="16" fill="#626962">One caller in protected state access.</text><path d="M180 448V526" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="494" font-size="16" fill="#626962">check + update</text><rect x="24" y="528" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="557" font-size="18" fill="#252c28">Protected inbox state</text><text x="40" y="583" font-size="16" fill="#626962">Bounded deque + closed flag</text><text x="40" y="638" font-size="17" fill="#626962">Invariant: 0 ≤ count ≤ capacity</text><rect x="24" y="768" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="800" font-size="19" fill="#252c28">When a predicate is false</text><text x="40" y="842" font-size="16" fill="#626962">Condition.wait releases this lock.</text><text x="40" y="878" font-size="16" fill="#626962">On return: reacquire, then recheck.</text><text x="40" y="912" font-size="15" fill="#626962">No dedicated object worker exists.</text><text x="24" y="1012" font-size="16" fill="#626962">Arrows: caller entry and state access.</text><text x="24" y="1052" font-size="15" fill="#626962">The waiting invocation remains pending.</text></svg>
