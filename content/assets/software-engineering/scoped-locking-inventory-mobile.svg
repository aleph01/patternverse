<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1416" viewBox="0 0 360 1416" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Scoped Locking: inventory return and rejection</title><desc id="desc">With five initial items, reserving two changes the protected state to three available and two reserved, then returns after release. A request for four raises before changing that state and still releases. Another caller can then reserve the remaining three and obtain zero available and five reserved. All displayed states preserve a total of five items.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1416" fill="#fff"/><text x="24" y="34" font-size="21" fill="#252c28">Release on success and rejection</text><text x="24" y="88" font-size="16" fill="#626962">Pairs: (available, reserved) item counts</text><rect x="24" y="128" width="312" height="264" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="162" font-size="20" fill="#252c28">Call 1 / reserve 2</text><text x="40" y="208" font-size="16" fill="#626962">before</text><text x="208" y="208" font-size="16" fill="#626962">after</text><rect x="40" y="224" width="112" height="72" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="208" y="224" width="112" height="72" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="272" font-size="24" fill="#252c28">(5, 0)</text><text x="224" y="272" font-size="24" fill="#252c28">(3, 2)</text><path d="M152 260H206" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="344" font-size="16" fill="#626962">Return the new state after release.</text><text x="40" y="376" font-size="16" fill="#626962">Check and publication are protected.</text><rect x="24" y="472" width="312" height="264" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="506" font-size="20" fill="#252c28">Call 2 / reserve 4</text><text x="40" y="552" font-size="16" fill="#626962">before</text><text x="208" y="552" font-size="16" fill="#626962">after</text><rect x="40" y="568" width="112" height="72" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="208" y="568" width="112" height="72" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="616" font-size="24" fill="#252c28">(3, 2)</text><text x="224" y="616" font-size="24" fill="#252c28">(3, 2)</text><path d="M152 604H206" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="688" font-size="16" fill="#626962">Reject before changing the state.</text><text x="40" y="720" font-size="16" fill="#626962">Release, then propagate ValueError.</text><rect x="24" y="816" width="312" height="264" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="850" font-size="20" fill="#252c28">Call 3 / reserve 3</text><text x="40" y="896" font-size="16" fill="#626962">before</text><text x="208" y="896" font-size="16" fill="#626962">after</text><rect x="40" y="912" width="112" height="72" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="208" y="912" width="112" height="72" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="960" font-size="24" fill="#252c28">(3, 2)</text><text x="224" y="960" font-size="24" fill="#252c28">(0, 5)</text><path d="M152 948H206" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="1032" font-size="16" fill="#626962">A later caller acquires the same lock.</text><text x="40" y="1064" font-size="16" fill="#626962">Release, then deliver the new state.</text><text x="24" y="1240" font-size="16" fill="#626962">Invariant: both counts stay nonnegative;</text><text x="24" y="1274" font-size="16" fill="#626962">their sum stays five.</text><text x="24" y="1330" font-size="16" fill="#626962">Arrows: the protected operation.</text><text x="24" y="1372" font-size="16" fill="#626962">Rejection is checked before mutation.</text></svg>
