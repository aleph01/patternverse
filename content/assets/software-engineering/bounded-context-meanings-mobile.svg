<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1122" viewBox="0 0 360 1122" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Bounded contexts preserve different meanings and identities</title><desc id="desc">Sales models commercial account AC-72 as an established relationship. Billing models payer BILL-19 as current and BILL-20 as overdue. Service Access models workspace WS-301 as enabled and funded by BILL-19. Identity mappings connect the models, while the funding relationship identifies which payer matters to the workspace.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1122" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">One company,</text><text x="24" y="60" font-size="22" fill="#252c28">three coherent models</text><rect x="24" y="104" width="312" height="172" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="138" font-size="22" fill="#252c28">Sales</text><rect x="44" y="158" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="187" font-size="20" fill="#252c28">AC-72</text><text x="60" y="213" font-size="17" fill="#626962">Established relationship</text><rect x="24" y="352" width="312" height="320" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="386" font-size="22" fill="#252c28">Billing</text><rect x="44" y="412" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="441" font-size="20" fill="#252c28">BILL-19</text><text x="60" y="467" font-size="17" fill="#626962">Current</text><rect x="44" y="548" width="272" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="577" font-size="20" fill="#252c28">BILL-20</text><text x="60" y="603" font-size="17" fill="#626962">Overdue</text><rect x="24" y="752" width="312" height="200" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="40" y="786" font-size="22" fill="#252c28">Service Access</text><rect x="44" y="814" width="272" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="843" font-size="20" fill="#252c28">WS-301</text><text x="60" y="869" font-size="17" fill="#626962">Enabled</text><text x="44" y="924" font-size="18" fill="#252c28">Funding payer: BILL-19</text><path d="M180 276V314H12V586H42" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><path d="M12 450H42" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><path d="M316 450H348V852H318" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="256" y="728" font-size="17" fill="#626962">funds</text><text x="24" y="1012" font-size="17" fill="#626962">Dashed: mapped identities</text><text x="24" y="1044" font-size="17" fill="#626962">Green: funding relationship</text><text x="24" y="1090" font-size="18" fill="#252c28">Overdue is not an access state.</text></svg>
