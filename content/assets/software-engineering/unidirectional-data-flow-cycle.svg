<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One controlled state transition path with explicit feedback events</title><desc id="desc">A user or service adapter supplies an event to the state owner. A controlled update produces a new UI state, which the view reads to render query, loading, results, and error consistently. The view sends subsequent interaction events back through the same entry path instead of directly changing shared state. Service work is outside the pure update in this example.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1080" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Events return to the owner; state drives the view</text><rect x="24" y="100" width="672" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">Events from interaction or service completion</text><text x="40" y="155" font-size="17" fill="#626962">Search / Loaded / Failed</text><path d="M180 196V310" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="252" font-size="17" fill="#626962">event</text><rect x="24" y="312" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="341" font-size="20" fill="#252c28">State owner</text><text x="40" y="367" font-size="17" fill="#626962">update(previous, event)</text><text x="40" y="424" font-size="17" fill="#626962">Publish returned state.</text><rect x="384" y="312" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="341" font-size="20" fill="#252c28">Effect adapter</text><text x="400" y="367" font-size="17" fill="#626962">Service work outside update</text><text x="400" y="424" font-size="17" fill="#626962">Nonempty Search only.</text><path d="M336 384H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="338" y="366" font-size="16" fill="#626962">start</text><path d="M696 384H708V148H698" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 456V590" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="522" font-size="17" fill="#626962">next state</text><rect x="24" y="592" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="621" font-size="20" fill="#252c28">UI state: query, request ID, loading, results, error</text><text x="40" y="647" font-size="17" fill="#626962">Read-only snapshot in this example</text><path d="M360 704V822" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="764" font-size="17" fill="#626962">render</text><rect x="24" y="824" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="853" font-size="20" fill="#252c28">View</text><text x="40" y="879" font-size="17" fill="#626962">Format current state; send interaction events.</text><path d="M24 880H12V148H22" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="1000" font-size="18" fill="#252c28">Only the state owner replaces the feature state.</text><text x="24" y="1040" font-size="17" fill="#626962">The view and service callbacks send events instead.</text></svg>
