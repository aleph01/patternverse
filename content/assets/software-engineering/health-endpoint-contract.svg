<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1072" viewBox="0 0 720 1072" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">The endpoint reports; the observer decides</title><desc id="desc">An external prober calls an instance's health endpoint. The handler reads declared local lifecycle and dependency observations and returns a small status. The observer applies configured timing and thresholds before changing routing, startup gating, or restart behavior. The endpoint does not perform those actions itself.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#252c28" stroke-width="1.2"/></marker></defs><rect width="720" height="1072" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">The endpoint reports; the observer decides</text><rect x="24" y="96" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="132" font-size="22" fill="#252c28">External prober / declared consumer</text><text x="40" y="178" font-size="19" fill="#626962">Choose the operational question and evaluate the matching signal.</text><path d="M600 208V318" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#control)"/><path d="M120 320V210" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="400" y="260" font-size="18" fill="#252c28">Health request</text><text x="144" y="290" font-size="18" fill="#626962">Status / timed result</text><rect x="24" y="320" width="672" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="358" font-size="24" fill="#252c28">Instance / small health handler</text><text x="40" y="408" font-size="19" fill="#252c28">Read declared local lifecycle and selected dependency evidence.</text><text x="40" y="456" font-size="19" fill="#626962">Return a small status; each stateful request reads one snapshot.</text><path d="M172 584V498" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M548 584V498" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="550" font-size="17" fill="#626962">Read</text><text x="416" y="550" font-size="17" fill="#626962">Read</text><rect x="24" y="584" width="296" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="620" font-size="22" fill="#252c28">Lifecycle state</text><text x="40" y="670" font-size="18" fill="#626962">Initialization / draining</text><rect x="400" y="584" width="296" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="416" y="620" font-size="21" fill="#252c28">Dependency observations</text><text x="416" y="670" font-size="17" fill="#626962">Bounded checks / freshness</text><path d="M696 152H708V888H698" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#control)"/><rect x="24" y="808" width="672" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="846" font-size="22" fill="#252c28">Observer applies the matched policy</text><text x="40" y="890" font-size="19" fill="#252c28">Timing and thresholds govern routing, startup, restart, or alerts.</text><text x="40" y="936" font-size="19" fill="#626962">The endpoint does not perform these actions itself.</text><text x="24" y="1032" font-size="18" fill="#626962">Arrows: probe/response, evidence reads, and observer control.</text></svg>
