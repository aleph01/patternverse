<svg xmlns="http://www.w3.org/2000/svg" width="720" height="766" viewBox="0 0 720 766" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Remote success with a lost reply and an explicit retry</title><desc id="desc">Inventory accepts a reservation and reduces stock, but its reply is lost. Orders stays pending. A later retry with the same order identity retrieves the existing reservation and lets Orders confirm without reducing stock again.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="766" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A lost reply does not undo a remote change</text><rect x="40" y="86" width="220" height="72" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="115" font-size="20" fill="#252c28">Orders</text><text x="56" y="141" font-size="17" fill="#626962">Owns order status</text><rect x="460" y="86" width="220" height="72" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="476" y="115" font-size="20" fill="#252c28">Inventory</text><text x="476" y="141" font-size="17" fill="#626962">Owns stock + receipts</text><path d="M150 158V648M570 158V648" stroke="#a6aca3" stroke-width="1.2"/><text x="230" y="194" font-size="18" fill="#252c28">reserve o1 · 2 units</text><path d="M150 214H568" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="414" y="244" width="282" height="72" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="430" y="272" font-size="18" fill="#252c28">Stock: 4 → 2 units</text><text x="430" y="298" font-size="17" fill="#626962">Save o1: reserved</text><path d="M570 350H300" fill="none" stroke="#626962" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M295 345L305 355M295 355L305 345" stroke="#626962" stroke-width="1.4"/><text x="348" y="338" font-size="17" fill="#626962">reply lost</text><rect x="24" y="380" width="262" height="64" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="406" font-size="19" fill="#252c28">Order stays pending</text><text x="40" y="430" font-size="17" fill="#626962">Remote outcome unknown</text><text x="226" y="478" font-size="18" fill="#252c28">retry o1 · same 2 units</text><path d="M150 498H568" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="224" y="564" font-size="18" fill="#252c28">saved result: reserved</text><path d="M570 584H152" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="694" font-size="19" fill="#252c28">Orders confirms. Inventory still has 2 available units.</text><text x="24" y="728" font-size="17" fill="#626962">Retry identity prevents another deduction in this example.</text></svg>
