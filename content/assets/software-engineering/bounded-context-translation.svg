<svg xmlns="http://www.w3.org/2000/svg" width="720" height="772" viewBox="0 0 720 772" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A receiving context owns semantic interpretation</title><desc id="desc">A published BillingCondition for BILL-19 and a workspace funded by BILL-19 enter Access-owned interpretation. A current condition means keep current access; an overdue condition means review access. The function rejects mismatched or unresolved payer mappings and never directly changes the workspace's enabled state.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="772" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Translate a notice; preserve the local access model</text><rect x="24" y="84" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">BillingCondition</text><text x="40" y="139" font-size="17" fill="#626962">BILL-19 · overdue</text><rect x="384" y="84" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="114" font-size="20" fill="#252c28">Workspace WS-301</text><text x="400" y="146" font-size="17" fill="#252c28">Funding payer: BILL-19</text><text x="400" y="172" font-size="17" fill="#626962">Enabled: True</text><rect x="24" y="260" width="672" height="232" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="44" y="294" font-size="21" fill="#252c28">Access-owned interpretation</text><rect x="44" y="318" width="280" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="347" font-size="20" fill="#252c28">Matching payer</text><text x="60" y="373" font-size="17" fill="#626962">overdue: review_access</text><rect x="388" y="318" width="288" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="404" y="347" font-size="18" fill="#252c28">Unresolved / mismatch</text><text x="404" y="373" font-size="16" fill="#626962">Reject; do not guess</text><path d="M180 184V220H280V258" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 184V220H440V258" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="44" y="462" font-size="18" fill="#252c28">Never copy payment_state into enabled.</text><rect x="24" y="540" width="312" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="569" font-size="20" fill="#252c28">review_access</text><text x="40" y="595" font-size="17" fill="#626962">WS-301 remains enabled</text><rect x="384" y="540" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="569" font-size="20" fill="#252c28">Mapping error</text><text x="400" y="595" font-size="17" fill="#626962">Access state unchanged</text><path d="M184 418V444H12V590H22" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M532 418V538" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="24" y="704" font-size="18" fill="#252c28">Arrows: published inputs, local interpretation, then outcome.</text><text x="24" y="740" font-size="17" fill="#626962">This function returns advice; it does not change entitlements.</text></svg>
