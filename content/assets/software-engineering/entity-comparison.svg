<svg xmlns="http://www.w3.org/2000/svg" width="720" height="746" viewBox="0 0 720 746" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Identity equality, attribute equality, and identifier scope</title><desc id="desc">Three comparisons distinguish identity from state: studio / 42 with Camera B and studio / 42 with Camera C identify the same entity; studio / 42 and studio / 43 with identical labels identify different entities; rental / 42 is different from studio / 42 because the catalog scope differs.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="746" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Compare Equipment identity separately from state</text><text x="24" y="92" font-size="20" fill="#252c28">1 · Matching identity can accompany different state</text><rect x="24" y="112" width="284" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">studio / 42</text><text x="40" y="167" font-size="17" fill="#626962">Camera B</text><rect x="412" y="112" width="284" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="428" y="141" font-size="20" fill="#252c28">studio / 42</text><text x="428" y="167" font-size="17" fill="#626962">Camera C</text><text x="350" y="176" font-size="28" fill="#252c28">=</text><text x="24" y="254" font-size="18" fill="#252c28">Same entity; the two objects are independent.</text><text x="24" y="318" font-size="20" fill="#252c28">2 · Matching labels do not establish identity</text><rect x="24" y="338" width="284" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="367" font-size="20" fill="#252c28">studio / 42</text><text x="40" y="393" font-size="17" fill="#626962">Camera B</text><rect x="412" y="338" width="284" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="428" y="367" font-size="20" fill="#252c28">studio / 43</text><text x="428" y="393" font-size="17" fill="#626962">Camera B</text><text x="350" y="402" font-size="28" fill="#252c28">≠</text><text x="24" y="480" font-size="18" fill="#252c28">Different assigned numbers.</text><text x="24" y="544" font-size="20" fill="#252c28">3 · The catalog scopes the number</text><rect x="24" y="564" width="284" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="593" font-size="20" fill="#252c28">studio / 42</text><text x="40" y="619" font-size="17" fill="#626962">Camera B</text><rect x="412" y="564" width="284" height="104" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="428" y="593" font-size="20" fill="#252c28">rental / 42</text><text x="428" y="619" font-size="17" fill="#626962">Camera B</text><text x="350" y="628" font-size="28" fill="#252c28">≠</text><text x="24" y="706" font-size="18" fill="#252c28">Different catalogs, even with the same number.</text></svg>
