<svg xmlns="http://www.w3.org/2000/svg" width="360" height="932" viewBox="0 0 360 932" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Promote one identifiable candidate</title><desc id="desc">One release artifact passes through commit checks, deployed acceptance testing, an explicit release decision, and production deployment with a smoke check. Each promotion requires the preceding evidence for that artifact.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="932" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Promote one candidate</text><text x="24" y="80" font-size="17" fill="#626962">Stage design depends on the system.</text><rect x="24" y="112" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="148" font-size="22" fill="#252c28">1 Commit stage</text><text x="40" y="188" font-size="17" fill="#252c28">Build once; run fast checks</text><text x="40" y="224" font-size="16" fill="#626962">Record candidate identity</text><path d="M72 252V304" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="288" font-size="17" fill="#626962">Passing candidate</text><rect x="24" y="308" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="344" font-size="22" fill="#252c28">2 Acceptance stage</text><text x="40" y="384" font-size="17" fill="#252c28">Deploy the same package</text><text x="40" y="420" font-size="16" fill="#626962">Run broader behavior checks</text><path d="M72 448V500" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="484" font-size="17" fill="#626962">Required checks pass</text><rect x="24" y="504" width="312" height="140" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="540" font-size="22" fill="#252c28">3 Release decision</text><text x="40" y="580" font-size="17" fill="#252c28">Required evidence complete?</text><text x="40" y="616" font-size="16" fill="#626962">Authorize this candidate + target</text><path d="M72 644V696" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="680" font-size="17" fill="#626962">Approved promotion</text><rect x="24" y="700" width="312" height="140" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="736" font-size="22" fill="#252c28">4 Production stage</text><text x="40" y="776" font-size="17" fill="#252c28">Deploy; smoke test; observe</text><text x="40" y="812" font-size="16" fill="#626962">Keep recovery procedures ready</text><text x="24" y="892" font-size="16" fill="#252c28">Same package; versioned configuration.</text></svg>
