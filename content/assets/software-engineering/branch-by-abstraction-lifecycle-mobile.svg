<svg xmlns="http://www.w3.org/2000/svg" width="360" height="920" viewBox="0 0 360 920" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A staged replacement with an explicit retirement gate</title><desc id="desc">Four releasable stages: introduce the seam with the old supplier active, build and verify the new supplier alongside it, switch after compatibility evidence, and retire the old supplier after remaining uses and recovery obligations are closed.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="920" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Keep each stage releasable</text><rect x="24" y="88" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="126" font-size="22" fill="#252c28">1 Introduce the seam</text><text x="40" y="168" font-size="18" fill="#252c28">Old implementation active</text><text x="40" y="204" font-size="17" fill="#626962">Move direct calls behind Rates</text><path d="M72 232V284" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="268" font-size="18" fill="#626962">Preserve behavior</text><rect x="24" y="288" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="326" font-size="22" fill="#252c28">2 Build alongside</text><text x="40" y="368" font-size="18" fill="#252c28">Old active; new under test</text><text x="40" y="404" font-size="17" fill="#626962">Check both against the contract</text><path d="M72 432V484" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="468" font-size="18" fill="#626962">Compatibility evidence</text><rect x="24" y="488" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="526" font-size="22" fill="#252c28">3 Switch deliberately</text><text x="40" y="568" font-size="18" fill="#252c28">New implementation active</text><text x="40" y="604" font-size="17" fill="#626962">Observe behavior and failures</text><path d="M72 632V684" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="668" font-size="18" fill="#626962">Retirement evidence</text><rect x="24" y="688" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="726" font-size="22" fill="#252c28">4 Retire the old path</text><text x="40" y="768" font-size="18" fill="#252c28">Old uses + obligations closed</text><text x="40" y="804" font-size="17" fill="#626962">Remove adapter, library, switch</text><text x="24" y="880" font-size="18" fill="#252c28">New working ≠ old unused.</text></svg>
