<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1176" viewBox="0 0 360 1176" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Lost acknowledgment leaves publication retryable</title><desc id="desc">E901 is pending after the order commits. A broker accepts it, but acknowledgment is lost, so the source still says pending. After restart the relay sends the same E901, gets acknowledgment, and marks it dispatched. The broker test log contains two acceptances; the order remains a single row.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1176" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Acceptance can repeat</text><rect x="24" y="112" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Source: E901 pending</text><text x="40" y="167" font-size="17" fill="#626962">O42 already committed once</text><path d="M180 224V286" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="266" font-size="16" fill="#626962">send E901</text><rect x="24" y="288" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="317" font-size="20" fill="#252c28">Broker accepts E901</text><text x="40" y="343" font-size="17" fill="#626962">Acceptance log: E901</text><text x="40" y="390" font-size="17" fill="#626962">Acknowledgment is lost.</text><path d="M180 416V478" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="480" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="509" font-size="18" fill="#252c28">Restart: E901 still pending</text><text x="40" y="535" font-size="16" fill="#626962">No dispatch success was recorded.</text><text x="40" y="582" font-size="16" fill="#626962">Retry the same ID and payload.</text><path d="M180 608V670" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="650" font-size="16" fill="#626962">send E901</text><rect x="24" y="672" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="701" font-size="18" fill="#252c28">Broker accepts E901 again</text><text x="40" y="727" font-size="16" fill="#626962">Acceptance log: E901, E901</text><text x="40" y="774" font-size="17" fill="#626962">Acknowledgment returns.</text><path d="M180 800V862" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="864" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="893" font-size="20" fill="#252c28">Source marks dispatched</text><text x="40" y="919" font-size="17" fill="#626962">Order count: 1 / pending: 0</text><text x="24" y="1090" font-size="15" fill="#626962">Arrows: send, retry, then record success.</text><text x="24" y="1126" font-size="15" fill="#626962">Receiving effects need repeat protection.</text></svg>
