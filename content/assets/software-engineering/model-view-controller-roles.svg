<svg xmlns="http://www.w3.org/2000/svg" width="720" height="968" viewBox="0 0 720 968" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">MVC separates interaction, model behavior, and presentation</title><desc id="desc">User input reaches a controller, which translates reserve or cancel into a model operation. The model owns reservation state and capacity rules. After the operation, the composition code takes one snapshot and passes it to two views: a reserved-seat summary and a free-seat display. The controller does not format either view.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="968" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Separate input, rules, and representation</text><rect x="24" y="84" width="672" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">User action</text><text x="40" y="139" font-size="17" fill="#626962">reserve; digit text: 2</text><rect x="24" y="248" width="312" height="124" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="277" font-size="20" fill="#252c28">Controller: interpret input</text><text x="40" y="303" font-size="17" fill="#626962">ASCII digits → seat count</text><text x="40" y="350" font-size="17" fill="#626962">Choose reserve or cancel.</text><rect x="384" y="248" width="312" height="124" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="277" font-size="20" fill="#252c28">Model: state + rules</text><text x="400" y="303" font-size="17" fill="#626962">0 ≤ reserved ≤ capacity</text><text x="400" y="350" font-size="17" fill="#626962">Only valid changes mutate.</text><path d="M180 172V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M336 310H382" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340" y="288" font-size="16" fill="#626962">call</text><rect x="24" y="492" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="521" font-size="20" fill="#252c28">Composition: capture one model snapshot</text><text x="40" y="547" font-size="17" fill="#626962">Caller explicitly refreshes both views after the action.</text><path d="M540 372V490" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="434" font-size="17" fill="#626962">snapshot result</text><rect x="24" y="732" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="761" font-size="20" fill="#252c28">View: summary</text><text x="40" y="787" font-size="17" fill="#626962">Reserved: 2/3</text><rect x="384" y="732" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="761" font-size="20" fill="#252c28">View: availability</text><text x="400" y="787" font-size="17" fill="#626962">Free: 1</text><path d="M180 604V730" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540 604V730" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="670" font-size="17" fill="#626962">same snapshot</text><text x="556" y="670" font-size="17" fill="#626962">same snapshot</text><text x="24" y="924" font-size="18" fill="#252c28">Views format data; they do not choose the next command.</text></svg>
