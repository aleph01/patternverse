<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1040" viewBox="0 0 360 1040" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Same job, new delivery</title><desc id="desc">J1 is first delivered to A with token 1. Explicit disconnection retires that delivery and returns J1 to the ready queue. B receives J1 with token 4; a token-1 acknowledgment is rejected and token 4 can be acknowledged. The previous attempt’s business effect remains unknown.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1040" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Same job, new delivery</text><text x="24" y="78" font-size="17" fill="#626962">Explicit connection loss in the model.</text><rect x="24" y="112" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="146" font-size="20" fill="#252c28">1. A holds J1</text><text x="40" y="188" font-size="20" fill="#252c28">Delivery token 1</text><text x="40" y="228" font-size="16" fill="#626962">Unacknowledged; effect unknown</text><path d="M72 256V316" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="294" font-size="17" fill="#626962">Disconnect A</text><rect x="24" y="320" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="354" font-size="20" fill="#252c28">2. J1 becomes ready again</text><text x="40" y="396" font-size="20" fill="#252c28">Token 1 is retired</text><text x="40" y="436" font-size="16" fill="#626962">The logical job identity stays J1</text><path d="M72 464V524" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="502" font-size="17" fill="#626962">Receive at B</text><rect x="24" y="528" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="562" font-size="20" fill="#252c28">3. B holds J1</text><text x="40" y="604" font-size="20" fill="#252c28">New delivery token 4</text><text x="40" y="644" font-size="16" fill="#626962">J2 and J3 were acknowledged first</text><path d="M72 672V732" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="710" font-size="17" fill="#626962">Validate token</text><rect x="24" y="736" width="312" height="180" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="770" font-size="18" fill="#252c28">4. Acknowledge current delivery</text><text x="40" y="814" font-size="20" fill="#252c28">Old token 1: rejected</text><text x="40" y="856" font-size="20" fill="#252c28">Current token 4: accepted</text><text x="24" y="962" font-size="17" fill="#626962">Delivery state is not business proof.</text><text x="24" y="996" font-size="16" fill="#626962">Duplicate effects need a separate contract.</text></svg>
