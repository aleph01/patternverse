<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1136" viewBox="0 0 360 1136" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Correlation Identifier: independent message identities</title><desc id="desc">Economy and express quote requests for the same order O42 carry different correlation IDs, desk:C1 and desk:C2. A relay changes the express envelope message ID from desk:M2 to relay:M9 while preserving desk:C2. Replies have their own message IDs; the matcher uses correlation IDs to recover the economy or express context.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1136" fill="#fff"/><text x="24" y="32" font-size="21" fill="#252c28">New envelope, same conversation</text><rect x="24" y="104" width="312" height="184" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Two quotes for O42</text><text x="40" y="159" font-size="17" fill="#626962">desk:M1 / corr desk:C1</text><text x="40" y="198" font-size="17" fill="#626962">desk:M2 / corr desk:C2</text><text x="40" y="234" font-size="17" fill="#626962">C1 economy; C2 express</text><path d="M180 288V374" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="338" font-size="16" fill="#626962">follow express</text><rect x="24" y="376" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="405" font-size="20" fill="#252c28">Relay rewrites the envelope</text><text x="40" y="431" font-size="17" fill="#626962">message: relay:M9</text><text x="40" y="470" font-size="17" fill="#626962">correlation: desk:C2</text><path d="M180 520V606" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="570" font-size="17" fill="#626962">replier</text><rect x="24" y="608" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="637" font-size="20" fill="#252c28">Reply carrier:R91</text><text x="40" y="663" font-size="17" fill="#626962">correlation: desk:C2</text><text x="40" y="702" font-size="17" fill="#626962">US dollar cents: 1200</text><path d="M180 752V838" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="802" font-size="16" fill="#626962">lookup desk:C2</text><rect x="24" y="840" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="869" font-size="20" fill="#252c28">Saved context</text><text x="40" y="895" font-size="17" fill="#626962">O42 / express / 1200 cents</text><text x="24" y="1040" font-size="18" fill="#252c28">desk:C1 still means economy.</text><text x="24" y="1080" font-size="17" fill="#626962">Order ID alone cannot match both.</text></svg>
