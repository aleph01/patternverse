<svg xmlns="http://www.w3.org/2000/svg" width="720" height="872" viewBox="0 0 720 872" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Lazy loading defers the body read until first access</title><desc id="desc">A document is first loaded with its title and an unloaded body marker. Reading the title performs no body query. The first body access selects and stores the body; later accesses return the stored value without another query. A document whose body is never accessed performs no body query.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="872" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Load less now; read the body only on demand</text><rect x="24" y="84" width="672" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">1. Load header: ID and title</text><text x="40" y="139" font-size="17" fill="#626962">Body = UNLOADED; keep the loader.</text><rect x="24" y="248" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="277" font-size="20" fill="#252c28">Read title</text><text x="40" y="303" font-size="17" fill="#626962">No body SELECT</text><path d="M180 172V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="384" y="248" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="277" font-size="20" fill="#252c28">2. First body access</text><text x="400" y="303" font-size="17" fill="#626962">SELECT by captured ID</text><path d="M540 172V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="448" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="477" font-size="20" fill="#252c28">Never read the body?</text><text x="40" y="503" font-size="17" fill="#626962">No body SELECT ever.</text><rect x="384" y="448" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="477" font-size="20" fill="#252c28">Store successful result</text><text x="400" y="503" font-size="17" fill="#626962">Text, empty text, or NULL</text><path d="M540 360V446" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="384" y="648" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="677" font-size="20" fill="#252c28">3. Later body reads</text><text x="400" y="703" font-size="17" fill="#626962">Use stored value; no SELECT</text><path d="M540 560V646" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="830" font-size="18" fill="#252c28">Deferral avoids work only when the body stays unused.</text></svg>
