<svg xmlns="http://www.w3.org/2000/svg" width="720" height="754" viewBox="0 0 720 754" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Aggregate root and its consistency boundary</title><desc id="desc">An application sends allocate(package_id, kg) to the LoadPlan root. Inside its boundary are a capacity of 100 kilograms and allocation values A at 60 kilograms and B at 40 kilograms. The root protects their combined weight. Package records remain outside and are referenced by ID.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="754" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">One root guards the complete load plan</text><rect x="24" y="154" width="180" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="183" font-size="18" fill="#252c28">Application</text><text x="40" y="209" font-size="16" fill="#626962">Requests changes</text><text x="24" y="270" font-size="17" fill="#252c28">allocate(package_id, kg)</text><rect x="264" y="84" width="432" height="444" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="284" y="118" font-size="21" fill="#252c28">LoadPlan aggregate · plan-42</text><rect x="300" y="154" width="360" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="316" y="183" font-size="20" fill="#252c28">LoadPlan · root</text><text x="316" y="209" font-size="17" fill="#626962">Capacity: 100 kg</text><path d="M204 192H298" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="300" y="278" font-size="20" fill="#252c28">Owned allocation values</text><rect x="300" y="302" width="168" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="316" y="331" font-size="18" fill="#252c28">pkg-A · 60 kg</text><text x="316" y="357" font-size="16" fill="#626962">ID and weight</text><rect x="492" y="302" width="168" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="508" y="331" font-size="18" fill="#252c28">pkg-B · 40 kg</text><text x="508" y="357" font-size="16" fill="#626962">ID and weight</text><rect x="300" y="412" width="360" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="316" y="441" font-size="20" fill="#252c28">100 kg ≤ 100 kg</text><text x="316" y="467" font-size="17" fill="#626962">sum(allocations) ≤ capacity</text><path d="M480 528V614" fill="none" stroke="#626962" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#wiring)"/><text x="498" y="580" font-size="17" fill="#626962">References by ID</text><rect x="300" y="616" width="360" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="316" y="645" font-size="20" fill="#252c28">Packages · separate roots</text><text x="316" y="671" font-size="17" fill="#626962">Tracking history stays outside</text><text x="24" y="730" font-size="18" fill="#626962">Solid arrow: command · dashed arrow: reference by ID</text></svg>
