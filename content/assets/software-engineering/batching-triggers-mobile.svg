<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1136" viewBox="0 0 360 1136" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Four causes, four emissions</title><desc id="desc">The program emits a, bb, and c at 8 milliseconds because three items have accumulated. At 13 milliseconds it emits dddd before adding eee because seven bytes would exceed the six-byte limit. At 23 milliseconds eee reaches ten milliseconds of age. Closing at 26 milliseconds emits the remaining f and g.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1136" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Four causes, four emissions</text><text x="24" y="78" font-size="17" fill="#626962">Limits: 3 items / 6 bytes / 10 ms.</text><rect x="24" y="112" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="146" font-size="22" fill="#252c28">8 ms / count</text><text x="40" y="190" font-size="21" fill="#252c28">a, bb, c / 4 bytes</text><text x="40" y="232" font-size="17" fill="#626962">Third item arrives at 8 ms.</text><text x="40" y="264" font-size="17" fill="#626962">Count reaches 3; 4 payload bytes.</text><path d="M72 288V348" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="326" font-size="17" fill="#626962">Add dddd, then eee</text><rect x="24" y="352" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="386" font-size="22" fill="#252c28">13 ms / size</text><text x="40" y="430" font-size="21" fill="#252c28">dddd / 4 bytes</text><text x="40" y="472" font-size="17" fill="#626962">4 + 3 would exceed 6 bytes.</text><text x="40" y="504" font-size="17" fill="#626962">Emit dddd before admitting eee.</text><path d="M72 528V588" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="566" font-size="17" fill="#626962">Advance with no arrival</text><rect x="24" y="592" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="626" font-size="22" fill="#252c28">23 ms / age</text><text x="40" y="670" font-size="21" fill="#252c28">eee / 3 bytes</text><text x="40" y="712" font-size="17" fill="#626962">Oldest item arrived at 13 ms.</text><text x="40" y="744" font-size="17" fill="#626962">13 + 10 = 23 ms; advance called.</text><path d="M72 768V828" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="806" font-size="17" fill="#626962">Add f, g; close</text><rect x="24" y="832" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="866" font-size="22" fill="#252c28">26 ms / close</text><text x="40" y="910" font-size="21" fill="#252c28">f, g / 2 bytes</text><text x="40" y="952" font-size="17" fill="#626962">f and g arrived at 24 and 25 ms.</text><text x="40" y="984" font-size="17" fill="#626962">Close drains the partial group.</text><text x="24" y="1060" font-size="18" fill="#252c28">Age needs a progress mechanism.</text><text x="24" y="1094" font-size="17" fill="#626962">Late advance means late emission.</text></svg>
