<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1132" viewBox="0 0 360 1132" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Transaction Script organizes rules by request</title><desc id="desc">An issue-stock request enters the issue_stock procedure. The procedure validates the quantity, reads stock, checks units against availability, calculates the remainder, and writes stock plus a movement record. The capacity decision lives inside the procedure; database rows hold data rather than supplying business-object methods.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1132" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Business rules follow</text><text x="24" y="60" font-size="22" fill="#252c28">the request procedure</text><rect x="24" y="104" width="312" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Issue-stock request</text><text x="40" y="159" font-size="17" fill="#626962">P-7 · 3 units · movement I-1</text><path d="M180 188V258" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="260" width="312" height="700" fill="#fff" stroke="#00855b" stroke-width="1.2"/><text x="44" y="296" font-size="23" fill="#252c28">issue_stock</text><rect x="44" y="324" width="272" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="353" font-size="20" fill="#252c28">Validate units</text><text x="60" y="379" font-size="17" fill="#626962">Positive whole count</text><rect x="44" y="452" width="272" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="481" font-size="20" fill="#252c28">Read available</text><text x="60" y="507" font-size="17" fill="#626962">P-7 has 5 units</text><rect x="44" y="580" width="272" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="60" y="609" font-size="20" fill="#252c28">Check + calculate</text><text x="60" y="635" font-size="17" fill="#626962">3 &lt;= 5; remaining = 2</text><path d="M180 412V450" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 540V578" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="44" y="808" width="272" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="60" y="837" font-size="20" fill="#252c28">Write stock + movement</text><text x="60" y="863" font-size="17" fill="#626962">Use a local transaction</text><path d="M180 692V806" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="1024" font-size="18" fill="#252c28">The procedure owns the rule.</text><text x="24" y="1060" font-size="17" fill="#626962">Rows supply data.</text><text x="24" y="1096" font-size="17" fill="#626962">Arrows: execution order.</text></svg>
