<svg xmlns="http://www.w3.org/2000/svg" width="720" height="912" viewBox="0 0 720 912" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Template structure and presentation data are separate render inputs</title><desc id="desc">A trusted HTML template contains name, availability, and units markers. A separate preparation step supplies raw display strings from application data. The renderer escapes those values for HTML text and substitutes them into the template, producing one HTML fragment. Template structure and request-specific data remain separate inputs.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="912" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Trusted structure plus request-specific values</text><rect x="24" y="100" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">Trusted product.html</text><text x="40" y="155" font-size="17" fill="#626962">&lt;h1>${name}&lt;/h1></text><text x="40" y="208" font-size="17" fill="#626962">Also: availability and units.</text><rect x="384" y="100" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="129" font-size="20" fill="#252c28">Prepared context</text><text x="400" y="155" font-size="17" fill="#626962">name: A&amp;B &lt;Lab></text><text x="400" y="208" font-size="17" fill="#626962">availability: In stock</text><text x="400" y="244" font-size="17" fill="#626962">units: 3</text><path d="M180 276V398" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="340" font-size="17" fill="#626962">structure</text><path d="M540 276V398" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="340" font-size="17" fill="#626962">raw values</text><rect x="24" y="400" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="429" font-size="20" fill="#252c28">Renderer: encode values and substitute text slots</text><text x="40" y="455" font-size="17" fill="#626962">The template supplies markup; values never supply markup.</text><text x="40" y="510" font-size="17" fill="#626962">All dynamic slots in this example are HTML text.</text><path d="M360 544V670" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="610" font-size="17" fill="#626962">render</text><rect x="24" y="672" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="701" font-size="20" fill="#252c28">Buffered HTML fragment</text><text x="40" y="727" font-size="17" fill="#626962">&lt;h1>A&amp;amp;B &amp;lt;Lab&amp;gt;&lt;/h1></text><text x="24" y="864" font-size="18" fill="#252c28">Reusable template; fresh escaped mapping for each rendering call.</text></svg>
