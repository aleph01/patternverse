<svg xmlns="http://www.w3.org/2000/svg" width="360" height="714" viewBox="0 0 360 714" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Equivalent stay dates in distinct runtime objects</title><desc id="desc">Two separately constructed StayDates instances both contain check-in 2026-10-29 and checkout 2026-11-01. They represent equal three-night values even though they are different runtime objects.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="714" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Equivalent dates,</text><text x="24" y="60" font-size="22" fill="#252c28">equal values</text><text x="24" y="116" font-size="20" fill="#252c28">StayDates · instance A</text><rect x="24" y="138" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="168" font-size="20" fill="#252c28">Check-in: 2026-10-29</text><text x="40" y="198" font-size="20" fill="#252c28">Checkout: 2026-11-01</text><text x="40" y="232" font-size="17" fill="#626962">3 calendar nights</text><text x="24" y="312" font-size="20" fill="#252c28">StayDates · instance B</text><rect x="24" y="334" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="364" font-size="20" fill="#252c28">Check-in: 2026-10-29</text><text x="40" y="394" font-size="20" fill="#252c28">Checkout: 2026-11-01</text><text x="40" y="428" font-size="17" fill="#626962">3 calendar nights</text><text x="24" y="506" font-size="21" fill="#252c28">Equal value: True</text><text x="24" y="544" font-size="19" fill="#252c28">Same runtime object: False</text><text x="24" y="606" font-size="17" fill="#252c28">Check-in included; checkout excluded.</text><text x="24" y="646" font-size="17" fill="#626962">No separate business identifier</text><text x="24" y="674" font-size="17" fill="#626962">takes part in value equality.</text></svg>
