<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1032" viewBox="0 0 360 1032" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Policy outcomes and protected-body reads</title><desc id="desc">Four evaluations show enforcement outcomes. Under policy version 1, Alice’s R1 request is allowed and reads North’s body; R2 is denied without a body read. After revocation, version 2 denies R1. An unavailable decision service produces no response and no body read. Unsupported obligations also block an otherwise permitted read.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1032" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Require a usable permit</text><text x="24" y="78" font-size="18" fill="#626962">Same handler, four evaluations.</text><rect x="24" y="112" width="312" height="168" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="146" font-size="20" fill="#252c28">Own tenant</text><text x="40" y="178" font-size="18" fill="#626962">alice / R1</text><text x="40" y="216" font-size="18" fill="#252c28">Evaluation: P1 · allow</text><text x="40" y="254" font-size="18" fill="#252c28">Body read: yes</text><rect x="24" y="308" width="312" height="168" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="342" font-size="20" fill="#252c28">Other tenant</text><text x="40" y="374" font-size="18" fill="#626962">alice / R2</text><text x="40" y="412" font-size="18" fill="#252c28">Evaluation: P1 · deny</text><text x="40" y="450" font-size="18" fill="#252c28">Body read: no</text><rect x="24" y="504" width="312" height="168" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="538" font-size="20" fill="#252c28">After revocation</text><text x="40" y="570" font-size="18" fill="#626962">alice / R1</text><text x="40" y="608" font-size="18" fill="#252c28">Evaluation: P2 · deny</text><text x="40" y="646" font-size="18" fill="#252c28">Body read: no</text><rect x="24" y="700" width="312" height="168" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="734" font-size="20" fill="#252c28">Engine offline</text><text x="40" y="766" font-size="18" fill="#626962">alice / R1</text><text x="40" y="804" font-size="18" fill="#252c28">Evaluation: Unavailable</text><text x="40" y="842" font-size="18" fill="#252c28">Body read: no</text><text x="24" y="920" font-size="20" fill="#252c28">Unsupported obligations?</text><text x="24" y="958" font-size="17" fill="#252c28">An allow still cannot release data.</text><text x="24" y="1000" font-size="17" fill="#626962">Failure and denial stay distinct.</text></svg>
