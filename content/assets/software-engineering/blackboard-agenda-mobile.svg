<svg xmlns="http://www.w3.org/2000/svg" width="360" height="990" viewBox="0 0 360 990" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A state-dependent agenda in three control cycles</title><desc id="desc">With text and layout features present, layout and text sources are eligible while combination is blocked. The controller chooses layout, then text, then the newly enabled combination source. Their additions remain on the board until the declared goal is met.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="selection" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="990" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Re-evaluate after</text><text x="24" y="60" font-size="22" fill="#252c28">every contribution</text><rect x="24" y="110" width="312" height="220" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="146" font-size="21" fill="#252c28">1 · Choose layout (20)</text><text x="40" y="186" font-size="17" fill="#252c28">Eligible: layout (20), text (10)</text><text x="40" y="220" font-size="17" fill="#626962">combine (100): not eligible</text><rect x="40" y="250" width="280" height="56" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="56" y="284" font-size="19" fill="#252c28">Add has_table = True</text><rect x="24" y="378" width="312" height="220" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="414" font-size="21" fill="#252c28">2 · Choose text (10)</text><text x="40" y="454" font-size="17" fill="#252c28">Eligible: text (10)</text><text x="40" y="488" font-size="17" fill="#626962">combine (100): not eligible</text><rect x="40" y="518" width="280" height="56" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="56" y="552" font-size="19" fill="#252c28">Add candidate = invoice</text><path d="M180 330V376" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="360" font-size="17" fill="#252c28">recheck</text><path d="M180 598V644" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="628" font-size="17" fill="#252c28">recheck</text><rect x="24" y="646" width="312" height="232" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="682" font-size="21" fill="#252c28">3 · Choose combine (100)</text><text x="40" y="722" font-size="17" fill="#252c28">Eligible: combine (100)</text><text x="40" y="756" font-size="17" fill="#626962">Both clues are now present.</text><rect x="40" y="788" width="280" height="66" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="56" y="816" font-size="19" fill="#252c28">Add interpretation:</text><text x="56" y="842" font-size="18" fill="#252c28">invoice-supported</text><text x="24" y="928" font-size="17" fill="#252c28">Goal met after three contributions.</text><text x="24" y="960" font-size="17" fill="#626962">Budget 2 stops before combination.</text></svg>
