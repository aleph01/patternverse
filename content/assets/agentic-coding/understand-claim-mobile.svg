<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1253" viewBox="0 0 360 1253" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">An invented atomicity claim is challenged by a matched failure</title><desc id="desc">S17 predicts no partial state, but X17 explicitly commits each row and leaves P201 stored before the second write fails. Corrected T17 places the same writes in one transaction and retains baseline after the same exception. Experiments concern one explicit controlled failure point.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1253" class="paper"/><text x="20" y="32" font-size="19">Test the claimed transaction boundary</text><text x="20" y="68" font-size="16">S17, X17 and T17 are fictional labels.</text><rect x="20" y="106" width="320" height="172" class="neutral"/><text x="36" y="142" font-size="20">Same input and failure point</text><text x="36" y="184" font-size="17">Initial P100:4</text><text x="36" y="216" font-size="17">New rows P201:3 and P202:2</text><text x="36" y="248" font-size="17">Exception before second write.</text><rect x="20" y="324" width="320" height="140" class="pending"/><text x="36" y="360" font-size="20">S17 · invented claim</text><text x="36" y="402" font-size="17">All rows together or none.</text><text x="36" y="434" font-size="17">Predicted after failure: P100:4.</text><rect x="20" y="510" width="320" height="172" class="pending"/><text x="36" y="546" font-size="20">X17 · inspected incremental loop</text><text x="36" y="588" font-size="17">Insert P201, then COMMIT.</text><text x="36" y="620" font-size="17">Next write is not reached.</text><text x="36" y="652" font-size="17">Fresh read: P100:4; P201:3</text><path d="M180 694v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="747" width="320" height="140" class="neutral"/><text x="36" y="783" font-size="20">Source + state refute S17</text><text x="36" y="825" font-size="17">An error response is not rollback.</text><text x="36" y="857" font-size="17">Committed P201 remains stored.</text><rect x="20" y="933" width="320" height="204" class="mint"/><text x="36" y="969" font-size="20" class="accent">T17 · corrected reference</text><text x="36" y="1011" font-size="17">BEGIN before the loop.</text><text x="36" y="1043" font-size="17">Same exception → ROLLBACK.</text><text x="36" y="1075" font-size="17">Commit belongs after both writes.</text><text x="36" y="1107" font-size="17">Fresh read: only P100:4.</text><text x="20" y="1187" font-size="15">Arrow: observed behavior informs correction.</text><text x="20" y="1219" font-size="15">No crash, disk-failure or concurrency proof.</text></svg>
