<svg xmlns="http://www.w3.org/2000/svg" width="720" height="843" viewBox="0 0 720 843" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A written task boundary and an execution boundary are different</title><desc id="desc">The fictional delegated preview task includes CSV, validation, local code edits and related checks. Production effects sit beyond a separately specified execution boundary. Arrows show local flow and the crossed attempt toward an unavailable effect, not an actual production test.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="843" class="paper"/><text x="28" y="32" font-size="22">CSV preview: authority and capability</text><text x="28" y="68" font-size="18">Fictional task · modeled controls, not a security test</text><rect x="28" y="107" width="664" height="360" class="boundary"/><text x="44" y="144" font-size="22" class="accent">Agreed task: preview only</text><rect x="44" y="177" width="184" height="110" class="neutral"/><text x="60" y="213" font-size="20">Synthetic CSV</text><text x="60" y="249" font-size="19">P201,3</text><text x="60" y="278" font-size="19">P202,-1</text><rect x="268" y="177" width="184" height="110" class="mint"/><text x="284" y="213" font-size="19" class="accent">Reuse existing</text><text x="284" y="254" font-size="20" class="accent">validateProduct</text><rect x="492" y="177" width="184" height="110" class="neutral"/><text x="508" y="213" font-size="21">Preview</text><text x="508" y="249" font-size="17">Row 2: error</text><text x="508" y="278" font-size="17">No inventory write</text><path d="M236 232h24m-6 -5l6 5l-6 5" class="line"/><path d="M460 232h24m-6 -5l6 5l-6 5" class="line"/><rect x="44" y="331" width="632" height="101" class="neutral"/><text x="60" y="367" font-size="21">Available resources</text><text x="60" y="406" font-size="20">Preview + test edits · local renderer · synthetic fixtures</text><path d="M360 479v70m-5 -6l5 6l5 -6" class="line"/><path d="M350 504l20 20m-20 0l20 -20" class="line"/><text x="28" y="595" font-size="21">Specified execution boundary, enforced outside the model</text><rect x="28" y="623" width="664" height="140" class="line"/><rect x="34" y="629" width="652" height="128" class="fine"/><text x="44" y="662" font-size="22">Production inventory + schema</text><text x="44" y="703" font-size="20">Denied: schema writes, production calls, deployment</text><text x="44" y="742" font-size="19">Host/broker policy · production credentials not supplied</text><text x="28" y="811" font-size="19">Required fixture: P100 stays 4 · cross: operation unavailable</text></svg>
