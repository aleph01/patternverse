<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1224" viewBox="0 0 360 1224" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Abandon the local parser attempt while retaining its failing fixture</title><desc id="desc">Fictional C0 E1 E2 history is distinct from source restoration. C0 is selected again only within the owned scope. F1 and the row mismatch remain outside removal scope, supporting a new adapter investigation without losing the failure.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1224" class="paper"/><text x="20" y="32" font-size="20">Restore code. Retain the failure.</text><text x="20" y="68" font-size="15">Fictional local revisions · owned scope only</text><rect x="20" y="106" width="320" height="96" class="neutral"/><text x="36" y="142" font-size="21">C0 · earlier checks pass</text><text x="36" y="181" font-size="18">F1 preview row still wrong</text><path d="M180 214v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="255" width="320" height="96" class="pending"/><text x="36" y="291" font-size="21">E1 · remove quotes</text><text x="36" y="330" font-size="18">Breaks record structure</text><path d="M180 363v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="404" width="320" height="96" class="pending"/><text x="36" y="440" font-size="19">E2 · remove embedded CRLF</text><text x="36" y="479" font-size="18">Changes the note value</text><path d="M180 512v24m-5 -6l5 6l5 -6" class="boundary"/><text x="20" y="570" font-size="17" class="accent">Restore only the owned experiment</text><rect x="20" y="594" width="320" height="96" class="mint"/><text x="36" y="630" font-size="22" class="accent">Selected code: C0</text><text x="36" y="669" font-size="18">Recheck baseline and F1</text><text x="20" y="738" font-size="19" class="accent">Retained outside removal scope</text><rect x="20" y="764" width="320" height="164" class="mint"/><text x="36" y="800" font-size="21" class="accent">F1 · quoted multiline note</text><text x="36" y="841" font-size="17">One logical data record</text><text x="36" y="870" font-size="17">3 physical lines including header</text><text x="36" y="899" font-size="17">Expected row 1; observed row 2</text><rect x="20" y="974" width="320" height="104" class="neutral"/><text x="36" y="1010" font-size="17">New diagnosis: preview mapping</text><text x="36" y="1051" font-size="17">Keep quoting; inspect the adapter.</text><text x="20" y="1126" font-size="17">Black arrows: local source history</text><text x="20" y="1159" font-size="17">Green arrow: restoration action</text><text x="20" y="1192" font-size="17">Other contributors’ work stays intact.</text></svg>
