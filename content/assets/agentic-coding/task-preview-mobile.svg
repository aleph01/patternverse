<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1200" viewBox="0 0 360 1200" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Separate preview authority from modeled production permissions</title><desc id="desc">A fictional preview task uses synthetic CSV, existing validation, local edits and checks. A separate modeled execution boundary denies schema writes, production operations, and deployment. No actual isolation or denial test is claimed.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1200" class="paper"/><text x="20" y="32" font-size="18">CSV preview: authority and capability</text><text x="20" y="68" font-size="13">Fictional task · modeled controls, not a security test</text><rect x="20" y="106" width="320" height="650" class="boundary"/><text x="36" y="143" font-size="21" class="accent">Agreed task: preview only</text><rect x="36" y="172" width="288" height="104" class="neutral"/><text x="52" y="205" font-size="20">Synthetic CSV</text><text x="52" y="239" font-size="19">P201,3</text><text x="52" y="266" font-size="19">P202,-1</text><path d="M180 288v24m-5 -6l5 6l5 -6" class="line"/><rect x="36" y="328" width="288" height="72" class="mint"/><text x="52" y="372" font-size="21" class="accent">Reuse validateProduct</text><path d="M180 412v24m-5 -6l5 6l5 -6" class="line"/><rect x="36" y="452" width="288" height="103" class="neutral"/><text x="52" y="487" font-size="21">Read-only preview</text><text x="52" y="529" font-size="19">Row 2: negative quantity</text><rect x="36" y="600" width="288" height="121" class="neutral"/><text x="52" y="634" font-size="20">Available resources</text><text x="52" y="672" font-size="18">Edit preview + related tests</text><text x="52" y="701" font-size="18">Local renderer + fixtures</text><path d="M180 770v65m-5 -6l5 6l5 -6" class="line"/><path d="M170 796l20 20m-20 0l20 -20" class="line"/><text x="20" y="879" font-size="20">Specified execution boundary</text><rect x="20" y="907" width="320" height="179" class="line"/><rect x="26" y="913" width="308" height="167" class="fine"/><text x="36" y="948" font-size="18">Production inventory + schema</text><text x="36" y="988" font-size="18">Denied: schema writes</text><text x="36" y="1019" font-size="18">Production calls + deployment</text><text x="36" y="1050" font-size="18">No production credentials</text><text x="20" y="1136" font-size="17">Required fixture result: P100 stays 4</text><text x="20" y="1167" font-size="17">Cross: operation unavailable</text></svg>
