<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1024" viewBox="0 0 720 1024" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Code and fresh reads refute an invented all-or-nothing summary</title><desc id="desc">The predicted and observed lanes share the initial inventory, two valid rows and failure location. The incremental X17 helper commits P201 before failure; the T17 reference explicitly rolls back the same failure within one batch transaction. Lane arrows show execution order, not revision ancestry.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="1024" class="paper"/><text x="28" y="32" font-size="23">Compare the explanation with persisted state</text><text x="28" y="68" font-size="18">S17/X17/T17 are fictional labels · same rows and injected exception</text><rect x="28" y="106" width="664" height="140" class="neutral"/><text x="44" y="142" font-size="22">Shared fixture</text><text x="44" y="184" font-size="20">Initial P100:4; valid new rows P201:3 and P202:2.</text><text x="44" y="216" font-size="20">Controlled exception before the second write.</text><text x="28" y="302" font-size="21">S17 · claim, not evidence</text><text x="376" y="302" font-size="21">X17 · inspected + observed</text><rect x="28" y="330" width="316" height="108" class="neutral"/><text x="44" y="366" font-size="22">Before</text><text x="44" y="408" font-size="19">P100:4</text><rect x="376" y="330" width="316" height="108" class="neutral"/><text x="392" y="366" font-size="22">Before</text><text x="392" y="408" font-size="19">P100:4</text><path d="M186 452v24m-5 -6l5 6l5 -6" class="line"/><path d="M534 452v24m-5 -6l5 6l5 -6" class="line"/><text x="44" y="518" font-size="18">Failure before write 2</text><text x="392" y="518" font-size="18">COMMIT P201, then failure</text><rect x="28" y="550" width="316" height="140" class="pending"/><text x="44" y="586" font-size="21">Claimed after failure</text><text x="44" y="628" font-size="18">P100:4 only</text><text x="44" y="660" font-size="18">No partial inventory</text><rect x="376" y="550" width="316" height="140" class="pending"/><text x="392" y="586" font-size="21">Observed after failure</text><text x="392" y="628" font-size="18">P100:4; P201:3</text><text x="392" y="660" font-size="18">First row stayed committed.</text><rect x="28" y="736" width="664" height="172" class="mint"/><text x="44" y="772" font-size="22" class="accent">T17 · actual single-transaction reference</text><text x="44" y="814" font-size="19">BEGIN → insert P201 → same failure → ROLLBACK.</text><text x="44" y="846" font-size="19">Fresh read: P100:4 only. Commit is after both successful inserts.</text><text x="44" y="878" font-size="19">Update the code and the explanation; keep the same failure probe.</text><text x="28" y="952" font-size="18">Lane arrows: execution order to predicted or observed state.</text><text x="28" y="990" font-size="18">One controlled exception is not a general failure-safety certificate.</text></svg>
