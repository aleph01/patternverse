<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1208" viewBox="0 0 360 1208" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A mismatched request field is hidden by passing isolated fixtures</title><desc id="desc">A frontend mock ignores import_id while a backend fixture uses preview_id. Connecting the serializer shape to the handler reference exposes 400 preview_id_required; correcting the field produces reference 200. Real network, state, and UI behavior remain to be verified.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1208" class="paper"/><text x="20" y="32" font-size="20">Passing parts can miss one field</text><text x="20" y="68" font-size="16">PV7 · serializer/handler reference only</text><rect x="20" y="106" width="320" height="140" class="neutral"/><text x="36" y="142" font-size="19">Same preview and endpoint</text><text x="36" y="184" font-size="17">POST /imports/confirm</text><text x="36" y="216" font-size="17">PV7 contains the valid two-row file.</text><rect x="20" y="292" width="320" height="140" class="pending"/><text x="36" y="328" font-size="21">Frontend check: PASS</text><text x="36" y="370" font-size="17">Sends {import_id: &quot;PV7&quot;}</text><text x="36" y="402" font-size="17">Mock ignores body → success</text><rect x="20" y="478" width="320" height="140" class="neutral"/><text x="36" y="514" font-size="21">Backend check: PASS</text><text x="36" y="556" font-size="17">Fixture {preview_id: &quot;PV7&quot;}</text><text x="36" y="588" font-size="17">Expected handler → success</text><path d="M180 630v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="671" width="320" height="204" class="mint"/><text x="36" y="707" font-size="19" class="accent">Connect the actual shapes</text><text x="36" y="749" font-size="18">Sent key: import_id</text><text x="36" y="781" font-size="18">Required key: preview_id</text><text x="36" y="813" font-size="18">Reference: 400</text><text x="36" y="845" font-size="18">preview_id_required</text><rect x="20" y="921" width="320" height="172" class="mint"/><text x="36" y="957" font-size="18" class="accent">Correct only the request field</text><text x="36" y="999" font-size="17">{preview_id: &quot;PV7&quot;} → 200</text><text x="36" y="1031" font-size="17">Then verify the real write, reload,</text><text x="36" y="1063" font-size="17">fresh read, and error presentation.</text><text x="20" y="1143" font-size="17">Arrow: omitted contract boundary</text><text x="20" y="1176" font-size="16">No browser HTTP journey was executed.</text></svg>
