<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1012" viewBox="0 0 360 1012" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Compare local editing authority with live publishing effects</title><desc id="desc">The identical fictional edit changes P202,-1 accepted to P202,0 accepted under the same quantity rule. Local saving and rendering are delegated; saving on a production-served page can publish and is outside this task. No live publishing tool is supplied.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1012" class="paper"/><text x="20" y="32" font-size="19">Same edit. Different resulting effect.</text><text x="20" y="68" font-size="13">Fictional documentation task · quantity rule unchanged</text><rect x="20" y="106" width="320" height="114" class="neutral"/><text x="36" y="141" font-size="21">The identical correction</text><text x="36" y="181" font-size="20">P202,-1 accepted →</text><text x="36" y="210" font-size="20">P202,0 accepted</text><rect x="20" y="266" width="320" height="180" class="mint"/><text x="36" y="303" font-size="21" class="accent">Disposable local draft</text><text x="36" y="345" font-size="19">docs/import-guide/</text><text x="36" y="377" font-size="19">Reorganize prose + links</text><text x="36" y="409" font-size="19">Save + render permitted</text><rect x="20" y="492" width="320" height="195" class="pending"/><text x="36" y="529" font-size="21">Production-served page</text><text x="36" y="572" font-size="18">Same text and policy</text><text x="36" y="606" font-size="18">Saving can publish immediately</text><text x="36" y="640" font-size="18">No publishing authority or tool</text><rect x="20" y="733" width="320" height="166" class="neutral"/><text x="36" y="770" font-size="21">Local handoff evidence</text><text x="36" y="812" font-size="18">Rule accuracy + links</text><text x="36" y="844" font-size="18">Rendered views + scoped diff</text><text x="36" y="876" font-size="18">Return a reviewable draft</text><text x="20" y="949" font-size="18">Broad local editing freedom</text><text x="20" y="980" font-size="18">does not authorize live publication.</text></svg>
