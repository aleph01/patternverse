<svg xmlns="http://www.w3.org/2000/svg" width="720" height="748" viewBox="0 0 720 748" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Locate a missing fixture rather than change the application</title><desc id="desc">Matched fictional before and after runs preserve environment and application code. Missing fixture data stops loading; restoring the documented synthetic fixture lets the existing-SKU assertion run. No empty-inventory fallback is added.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="748" class="paper"/><text x="28" y="32" font-size="22">Locate the failure before changing code</text><text x="28" y="68" font-size="18">BASE-E · fictional controlled rerun</text><rect x="28" y="106" width="664" height="96" class="neutral"/><text x="44" y="141" font-size="22">Environment: unchanged</text><text x="44" y="180" font-size="20">Same runtime, working directory, and application code</text><text x="28" y="255" font-size="21">Before: fixture missing</text><text x="376" y="255" font-size="21" class="accent">After: fixture restored</text><rect x="28" y="284" width="316" height="140" class="pending"/><rect x="376" y="284" width="316" height="140" class="mint"/><text x="44" y="322" font-size="20">fixtures/inventory.csv</text><text x="392" y="322" font-size="20" class="accent">fixtures/inventory.csv</text><text x="44" y="365" font-size="20">ENOENT at load</text><text x="44" y="397" font-size="20">Missing path confirmed</text><text x="392" y="365" font-size="20">sku,quantity</text><text x="392" y="397" font-size="20">P100,4</text><path d="M186 438v24m-5 -6l5 6l5 -6" class="line"/><path d="M534 438v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="478" width="316" height="140" class="pending"/><rect x="376" y="478" width="316" height="140" class="mint"/><text x="44" y="516" font-size="21">Application not reached</text><text x="392" y="516" font-size="21" class="accent">Assertion now reached</text><text x="44" y="559" font-size="20">No assertion result</text><text x="392" y="559" font-size="19">P100,8 → existing-SKU error</text><text x="392" y="591" font-size="19">P100 stays 4</text><text x="28" y="673" font-size="20">Only fixture availability changes; application code is retained.</text><text x="28" y="716" font-size="19">One passing check does not establish the whole environment.</text></svg>
