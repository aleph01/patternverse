<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1163" viewBox="0 0 360 1163" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A concise resumption brief carries evidence and uncertainty</title><desc id="desc">Constructed R1 points to C0 plus uncommitted diagnostics D1 and to F1 with its row mismatch. It retains rejected explanations and the unresolved mapping question. A new session verifies actual state and reproduction before selecting a bounded edit.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1163" class="paper"/><text x="20" y="32" font-size="20">Resume from anchors, not a story</text><text x="20" y="68" font-size="15">Constructed brief R1 · verify before editing</text><rect x="20" y="106" width="320" height="140" class="neutral"/><text x="36" y="142" font-size="22">Source anchor</text><text x="36" y="184" font-size="17">C0 + uncommitted D1</text><text x="36" y="213" font-size="17">D1 logs preview diagnostics.</text><text x="36" y="242" font-size="17">No verified correction claimed.</text><rect x="20" y="292" width="320" height="140" class="neutral"/><text x="36" y="328" font-size="22">Failure anchor: F1</text><text x="36" y="370" font-size="17">Expected row 1; observed row 2</text><text x="36" y="399" font-size="17">One record; note retains CRLF</text><text x="36" y="428" font-size="17">Earlier baseline checks pass.</text><rect x="20" y="478" width="320" height="196" class="mint"/><text x="36" y="514" font-size="22" class="accent">R1 · retained learning</text><text x="36" y="556" font-size="17">E1 / E2 abandoned</text><text x="36" y="587" font-size="17">No local writes or sends</text><text x="36" y="618" font-size="17">Question: physical position used</text><text x="36" y="649" font-size="17">for a logical data-row number?</text><path d="M180 686v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="727" width="320" height="164" class="neutral"/><text x="36" y="763" font-size="21">Fresh session verifies</text><text x="36" y="805" font-size="17">Inspect source + dirty changes.</text><text x="36" y="834" font-size="17">Verify F1; reproduce failure.</text><text x="36" y="863" font-size="17">If state differs, update R1.</text><path d="M180 903v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="944" width="320" height="104" class="mint"/><text x="36" y="980" font-size="22" class="accent">Next bounded action</text><text x="36" y="1021" font-size="17">Inspect adapter before correction.</text><text x="20" y="1098" font-size="16">Arrows: inspect evidence before action</text><text x="20" y="1131" font-size="17">No fresh agent session was executed.</text></svg>
