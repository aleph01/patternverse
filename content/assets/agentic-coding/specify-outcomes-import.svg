<svg xmlns="http://www.w3.org/2000/svg" width="720" height="686" viewBox="0 0 720 686" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Specify the expected import outcome</title><desc id="desc">An acceptance matrix resolves the ambiguous import request. In the displayed fictional CSV, negative quantity and repeated identifier errors reject the entire file without changing existing inventory.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.leader{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.intervention{fill:none;stroke:var(--accent);stroke-width:1.4}
.failure{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:4 3}
</style><rect width="720" height="686" class="paper"/><text x="28" y="34" font-size="20">Same starting inventory: P100 = 4</text><rect x="28" y="54" width="664" height="44" class="neutral"/><text x="42" y="83" font-size="20">“Import CSV; handle errors.”</text><text x="28" y="132" font-size="18">Input case</text><text x="376" y="132" font-size="18" class="accent">Required outcome</text><path d="M28 148H692" class="fine"/><text x="40" y="184" font-size="20">P201,3 · P202,0</text><text x="376" y="184" font-size="19">Confirm: add both products</text><path d="M309 178H354" class="intervention"/><path d="M28 202H692" class="fine"/><text x="40" y="232" font-size="20">P202,-1</text><text x="376" y="232" font-size="19">Reject: inventory unchanged</text><path d="M309 226H354" class="intervention"/><path d="M28 250H692" class="fine"/><text x="40" y="280" font-size="20">Repeated P201</text><text x="376" y="280" font-size="19">Reject: inventory unchanged</text><path d="M309 274H354" class="intervention"/><path d="M28 298H692" class="fine"/><text x="28" y="346" font-size="20">One file, two failures</text><text x="74" y="390" font-size="21">sku,quantity</text><text x="35" y="424" font-size="17">1</text><text x="74" y="424" font-size="21">P201,3</text><text x="35" y="458" font-size="17">2</text><text x="74" y="458" font-size="21">P202,-1</text><text x="35" y="492" font-size="17">3</text><text x="74" y="492" font-size="21">P201,2</text><text x="394" y="390" font-size="20">Expected preview</text><text x="394" y="437" font-size="19">2: quantity must be ≥ 0</text><text x="394" y="482" font-size="19">3: P201 repeats row 1</text><path d="M239 452H331V431H378" class="leader"/><path d="M239 486H346V476H378" class="leader"/><rect x="28" y="536" width="664" height="88" class="mint"/><text x="44" y="570" font-size="21" class="accent">Rejected file: no confirmation</text><text x="44" y="605" font-size="20">Inventory after rejection: P100 = 4</text><text x="28" y="658" font-size="18">Neither P201 nor P202 is stored.</text></svg>
