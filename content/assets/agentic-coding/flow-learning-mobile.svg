<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1490" viewBox="0 0 360 1490" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Recurring finding to fixture and future evidence</title><desc id="desc">Two invented review findings lead to a versioned acceptance example and three fixtures. Constructed reference checks distinguish negative handling faults. The next iteration needs eligible-task counts and rework observations; recurrence is not measured.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1490" class="paper"/><text x="20" y="32" font-size="17">A recurring omission changes the brief</text><text x="20" y="68" font-size="15">Invented findings · bounded reference checks</text><rect x="20" y="100" width="320" height="140" class="neutral"/><text x="36" y="136" font-size="20">E18a and E18b · review</text><text x="36" y="178" font-size="17">Both miss negative quantities.</text><text x="36" y="210" font-size="17">No eligible-task denominator.</text><path d="M180 260v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="300" width="320" height="172" class="mint"/><text x="36" y="336" font-size="19" class="accent">Version the acceptance example</text><text x="36" y="378" font-size="17">Whole, nonnegative quantities.</text><text x="36" y="410" font-size="17">Invalid row → no batch writes.</text><text x="36" y="442" font-size="17">One-based logical data row.</text><path d="M180 504v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="544" width="320" height="140" class="neutral"/><text x="36" y="580" font-size="20">Fixture · valid</text><text x="36" y="622" font-size="17">P201,3 → add P201:3.</text><text x="36" y="654" font-size="17">Baseline P100:4 remains.</text><rect x="20" y="708" width="320" height="140" class="neutral"/><text x="36" y="744" font-size="20">Fixture · negative</text><text x="36" y="786" font-size="17">P201,-1 → reject row 1.</text><text x="36" y="818" font-size="17">quantity_nonnegative; no writes.</text><rect x="20" y="872" width="320" height="140" class="neutral"/><text x="36" y="908" font-size="20">Fixture · mixed batch</text><text x="36" y="950" font-size="17">P201,3 then P202,-1</text><text x="36" y="982" font-size="17">Reject row 2; only P100:4.</text><text x="20" y="1072" font-size="17">Reference passes 3/3 cases.</text><text x="20" y="1104" font-size="17">Incomplete version fails 2/3.</text><text x="20" y="1136" font-size="17">This is not a real importer test.</text><path d="M180 1170v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="1210" width="320" height="172" class="mint"/><text x="36" y="1246" font-size="20" class="accent">Next iteration · inspect</text><text x="36" y="1288" font-size="17">Omissions / eligible first reviews</text><text x="36" y="1320" font-size="17">Fixture version + scope + rework</text><text x="36" y="1352" font-size="17">Team recurrence: not observed</text><text x="20" y="1452" font-size="17">Down arrows = feedback into work.</text></svg>
