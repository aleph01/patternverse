<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1422" viewBox="0 0 360 1422" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Admission, code changes and data repair are separate recovery actions</title><desc id="desc">The same post-I7 and post-sale snapshot feeds separate control choices. Disabling F7 and changing code leave stored quantities intact. Conditional C7 removes the erroneous deltas while preserving S9; transaction guards, an exception, retry and stale-plan references scope the evidence. N7 delivery remains a separate fictional obligation.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1422" class="paper"/><text x="20" y="32" font-size="19">Three controls change different state</text><text x="20" y="68" font-size="16">Fictional I7 and S9 · SQLite reference</text><rect x="20" y="106" width="320" height="172" class="neutral"/><text x="36" y="142" font-size="20">Same current snapshot</text><text x="36" y="184" font-size="17">I7 overwrote 4→99 and 8→70.</text><text x="36" y="216" font-size="17">Legitimate S9 removed 2 from P100.</text><text x="36" y="248" font-size="17">Now P100:97; P900:70.</text><text x="20" y="324" font-size="16">Separate control → its specific effect</text><rect x="20" y="358" width="320" height="140" class="neutral"/><text x="36" y="394" font-size="20">Disable F7 → admission</text><text x="36" y="436" font-size="17">Block new import admissions.</text><text x="36" y="468" font-size="17">Stored quantities stay 97 and 70.</text><rect x="20" y="544" width="320" height="140" class="neutral"/><text x="36" y="580" font-size="20">A6 / A8 → application code</text><text x="36" y="622" font-size="17">Compatible rollback or fix-forward</text><text x="36" y="654" font-size="17">Stored quantities stay 97 and 70.</text><rect x="20" y="730" width="320" height="172" class="mint"/><text x="36" y="766" font-size="20" class="accent">C7 → conditional data repair</text><text x="36" y="808" font-size="17">P100: 97 − 95 → 2</text><text x="36" y="840" font-size="17">P900: 70 − 62 → 8</text><text x="36" y="872" font-size="17">Preserves S9; requires provenance.</text><rect x="20" y="948" width="320" height="204" class="neutral"/><text x="36" y="984" font-size="20">C7 guards and reference checks</text><text x="36" y="1026" font-size="17">Expected versions: P100 v2; P900 v1</text><text x="36" y="1058" font-size="17">Exception → both updates roll back.</text><text x="36" y="1090" font-size="17">Retry → 2 and 8; repeat → no change.</text><text x="36" y="1122" font-size="17">Stale plan → reject all updates.</text><rect x="20" y="1198" width="320" height="140" class="pending"/><text x="36" y="1234" font-size="20">N7 remains separate</text><text x="36" y="1276" font-size="17">Delivered notification is fictional.</text><text x="36" y="1308" font-size="17">No recall or correction executed.</text><text x="20" y="1388" font-size="15">Arrows in labels: control → affected state</text></svg>
