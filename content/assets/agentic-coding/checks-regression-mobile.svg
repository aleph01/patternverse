<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1168" viewBox="0 0 360 1168" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A fixed duplicate-row regression fails before and passes after the repair</title><desc id="desc">D0 collapses repeated SKU rows and writes the last value. D1 detects the repeated SKU before any write. The initial inventory, CSV, expected row error, final state, and write-call requirement are unchanged. These are in-memory teaching models.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1168" class="paper"/><text x="20" y="32" font-size="19">One case. One oracle. Two versions.</text><text x="20" y="68" font-size="15">D0 / D1: executed fictional reference models</text><rect x="20" y="106" width="320" height="168" class="neutral"/><text x="36" y="142" font-size="22">Held constant</text><text x="36" y="184" font-size="17">Initial P100: 4</text><text x="36" y="213" font-size="17">CSV rows: P201,3 then P201,2</text><text x="36" y="242" font-size="17">Same fixture and initial state</text><rect x="20" y="320" width="320" height="198" class="mint"/><text x="36" y="356" font-size="22" class="accent">Fixed expectation</text><text x="36" y="398" font-size="17">Reject: row 2, duplicate_sku</text><text x="36" y="427" font-size="17">Inventory stays P100: 4</text><text x="36" y="456" font-size="17">Write calls: 0</text><text x="36" y="485" font-size="17">Same assertions for D0 and D1</text><rect x="20" y="564" width="320" height="204" class="pending"/><text x="36" y="600" font-size="19">D0 · collapse duplicates first</text><text x="36" y="642" font-size="18">Accepted; no issues</text><text x="36" y="673" font-size="18">Inventory P100: 4; P201: 2</text><text x="36" y="704" font-size="18">Write calls: 1</text><text x="36" y="735" font-size="18">Fixed assertion: FAIL</text><rect x="20" y="814" width="320" height="204" class="mint"/><text x="36" y="850" font-size="19" class="accent">D1 · validate before writing</text><text x="36" y="892" font-size="18">Rejected: row 2, duplicate_sku</text><text x="36" y="923" font-size="18">Inventory P100: 4</text><text x="36" y="954" font-size="18">Write calls: 0</text><text x="36" y="985" font-size="18">Fixed assertion: PASS</text><text x="20" y="1070" font-size="16">Changed: duplicate-handling algorithm</text><text x="20" y="1103" font-size="17">Response, state, and calls all checked.</text><text x="20" y="1136" font-size="17">No production transaction was run.</text></svg>
