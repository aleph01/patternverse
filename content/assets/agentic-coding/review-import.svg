<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A review locates overwrite and transaction-boundary defects in a fictional diff</title><desc id="desc">The same create-only requirements and P100 baseline govern both review findings. Existing-stock validation removal permits overwrite, while per-row commits allow a partial import after failure. Other changed areas remain accounted for and no arbitrary risk score is assigned.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="1000" class="paper"/><text x="28" y="32" font-size="23">Trace policy changes inside a larger fictional diff</text><text x="28" y="68" font-size="18">Create-only: reject existing SKUs; valid new rows all or none · initial P100: 4</text><rect x="28" y="106" width="664" height="108" class="neutral"/><text x="44" y="142" font-size="22">Other changed areas still need coverage</text><text x="44" y="184" font-size="20">Preview wording in import-preview.tsx · helper naming in helpers.ts</text><rect x="28" y="260" width="664" height="204" class="mint"/><text x="44" y="296" font-size="22" class="accent">Consequential schematic diff: validation and writer</text><text x="44" y="338" font-size="19">- validate(rows, currentInventory)</text><text x="44" y="370" font-size="19">+ validate(rows)</text><text x="44" y="402" font-size="19">- insertNewRowsAtomically(rows)</text><text x="44" y="434" font-size="19">+ for (const row of rows) await upsertOne(row)</text><path d="M360 476v14H186v18m-5 -6l5 6l5 -6" class="line"/><path d="M360 490H534v18m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="526" width="316" height="204" class="pending"/><text x="44" y="562" font-size="22">Overwrite path</text><text x="44" y="604" font-size="17">Input P100:99; P201:3</text><text x="44" y="636" font-size="17">Upsert: P100:99; P201:3</text><text x="44" y="668" font-size="17">Required: reject, keep P100:4</text><rect x="376" y="526" width="316" height="204" class="pending"/><text x="392" y="562" font-size="22">Write-failure path</text><text x="392" y="604" font-size="17">Valid P201:3; P202:2</text><text x="392" y="636" font-size="17">Failure before row 2</text><text x="392" y="668" font-size="17">Per-row commit retains P201:3</text><text x="392" y="700" font-size="17">Atomic keeps only P100:4</text><rect x="28" y="776" width="664" height="140" class="mint"/><text x="44" y="812" font-size="21" class="accent">Disposition: request changes for both violated obligations</text><text x="44" y="854" font-size="19">Restore existing-SKU rejection and the all-or-nothing write boundary.</text><text x="44" y="886" font-size="19">Keep focused evidence for both; formatting cannot compensate.</text><text x="28" y="968" font-size="18">Arrows: trace edited logic into contractual consequences, not a risk score</text></svg>
