<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Compare a remembered signature with the inspected version</title><desc id="desc">A constructed RowReader upgrade from 1.8.0 to 2.1.0 uses identical CSV input. The inspected target changes the method, header option, and result envelope. No real library contract or executed upgrade is claimed.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="780" class="paper"/><text x="28" y="32" font-size="22">Same CSV. Check the version contract.</text><text x="28" y="68" font-size="19">RowReader · fictional package and API</text><rect x="28" y="108" width="664" height="90" class="neutral"/><text x="44" y="143" font-size="20">Same intended input</text><text x="44" y="179" font-size="22">sku,quantity  /  P201,3</text><rect x="28" y="242" width="316" height="308" class="pending"/><text x="44" y="281" font-size="21">Remembered from 1.8.0</text><text x="44" y="331" font-size="22">reader.parse(text)</text><text x="44" y="374" font-size="20">Assumes a list result</text><text x="44" y="518" font-size="19">Not the target contract</text><rect x="376" y="242" width="316" height="308" class="mint"/><text x="392" y="281" font-size="21" class="accent">Inspected target 2.1.0</text><text x="392" y="329" font-size="20">reader.read(text,</text><text x="392" y="364" font-size="20">{ header: true })</text><text x="392" y="399" font-size="20">rows: [{ sku: &quot;P201&quot;,</text><text x="392" y="434" font-size="20">quantity: &quot;3&quot; }]</text><text x="392" y="469" font-size="20">issues: []</text><rect x="28" y="597" width="664" height="105" class="mint"/><text x="44" y="634" font-size="21" class="accent">Lockfile = loaded module = 2.1.0</text><text x="44" y="675" font-size="20">Handle envelope + issues; quantity still needs validation.</text><text x="28" y="748" font-size="19">No real dependency or compatibility run is represented.</text></svg>
