<svg xmlns="http://www.w3.org/2000/svg" width="720" height="837" viewBox="0 0 720 837" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Replace stale active guidance without erasing its history</title><desc id="desc">A constructed RowReader API conflict is resolved by version-specific interface evidence and loaded-module agreement. The resulting change updates guidance and its source links, not product scope or the inventory quantity policy.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="837" class="paper"/><text x="28" y="32" font-size="22">Repair stale guidance with current evidence</text><text x="28" y="68" font-size="19">RowReader · fictional versions and contracts</text><rect x="28" y="106" width="664" height="90" class="neutral"/><text x="44" y="141" font-size="21">Same CSV operation</text><text x="44" y="178" font-size="22">sku,quantity / P201,3</text><rect x="28" y="241" width="316" height="242" class="pending"/><text x="44" y="279" font-size="22">Old note: 1.8.0</text><text x="44" y="325" font-size="20">reader.parse(text)</text><text x="44" y="363" font-size="20">Assumed list result</text><text x="44" y="401" font-size="20">Historical, not current</text><rect x="376" y="241" width="316" height="242" class="mint"/><text x="392" y="279" font-size="21" class="accent">Current evidence: 2.1.0</text><text x="392" y="321" font-size="18">Lockfile + module agree</text><text x="392" y="352" font-size="18">Vendor 2.1.0 contract</text><text x="392" y="383" font-size="18">reader.read(text,</text><text x="392" y="414" font-size="18">{ header: true })</text><text x="392" y="445" font-size="18">rows + issues; quantity &quot;3&quot;</text><path d="M534 495v28H360v26m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="567" width="664" height="145" class="mint"/><text x="44" y="604" font-size="22" class="accent">Update the current note</text><text x="44" y="647" font-size="19">Active guide → 2.1.0 note with source and verification scope</text><text x="44" y="682" font-size="19">Old signature → explicitly historical migration context</text><text x="28" y="763" font-size="21">INV-01 remains the product-policy source.</text><text x="28" y="805" font-size="19">The arrow indicates a documentation update, not an upgrade run.</text></svg>
