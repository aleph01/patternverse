<svg xmlns="http://www.w3.org/2000/svg" width="720" height="936" viewBox="0 0 720 936" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A branch update omits an unintegrated peer’s changed row convention</title><desc id="desc">Mainline M1 contains documentation only. F2 includes M1 and F1 but not B1; only candidate I1 combines both contributors and fails the expected row-2 display. Corrected backend B2 gives I2 row 2. Lane arrows describe ancestry, while panels report reference function checks and planned shared integration.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="936" class="paper"/><text x="28" y="32" font-size="23">Receiving M1 does not make peer B1 visible</text><text x="28" y="68" font-size="18">Fictional revision labels · lane arrows mean parent → child</text><text x="28" y="124" font-size="18">Mainline</text><text x="28" y="254" font-size="18">Frontend</text><text x="28" y="384" font-size="18">Backend</text><path d="M112 170h564M112 300h564M112 430h564" class="fine"/><path d="M127 170h266m-6 -5l6 5l-6 5" class="line"/><path d="M127 170h53v130h93m-6 -5l6 5l-6 5" class="line"/><path d="M127 170h53v260h93m-6 -5l6 5l-6 5" class="line"/><path d="M287 300h206m-6 -5l6 5l-6 5" class="line"/><path d="M400 177v53l95 64m-8 0l8 0l-3 -7" class="line"/><path d="M507 300h50l88 123m-8 -2l8 2l0 -8" class="line"/><path d="M287 430h356m-6 -5l6 5l-6 5" class="line"/><circle cx="120" cy="170" r="7" fill="#ffffff" stroke="#252c28" stroke-width="1.1"/><text x="102" y="202" font-size="18">M0</text><circle cx="400" cy="170" r="7" fill="#ffffff" stroke="#252c28" stroke-width="1.1"/><text x="382" y="150" font-size="18">M1</text><text x="449" y="146" font-size="17">docs only</text><circle cx="280" cy="300" r="7" fill="#ffffff" stroke="#252c28" stroke-width="1.1"/><text x="268" y="280" font-size="18">F1</text><circle cx="500" cy="300" r="7" fill="#ffffff" stroke="#252c28" stroke-width="1.1"/><text x="488" y="280" font-size="18">F2</text><text x="239" y="337" font-size="17">mock row 2</text><text x="461" y="337" font-size="17">+M1; no B1</text><circle cx="280" cy="430" r="7" fill="#ffffff" stroke="#252c28" stroke-width="1.1"/><text x="268" y="410" font-size="18">B1</text><text x="231" y="468" font-size="17">returns row 3</text><circle cx="650" cy="430" r="7" fill="#ffffff" stroke="#252c28" stroke-width="1.1"/><text x="662" y="410" font-size="18">I1</text><text x="594" y="468" font-size="17">candidate</text><rect x="28" y="516" width="664" height="140" class="pending"/><text x="44" y="552" font-size="22">I1 = F2 + B1 · composed check fails</text><text x="44" y="594" font-size="20">Same CSV: P201:3 then P202:−1, after the header.</text><text x="44" y="626" font-size="20">Display: Data row 3 · required: Data row 2</text><path d="M360 670v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="718" width="664" height="140" class="mint"/><text x="44" y="754" font-size="21" class="accent">I2 = F2 + corrected B2 · composed check passes</text><text x="44" y="796" font-size="19">B2 uses one-based logical data records, excluding the header.</text><text x="44" y="828" font-size="19">Display: Data row 2 · then integrate and check shared M2.</text><text x="28" y="902" font-size="18">Panel arrow: repair and recheck; no real merge or mainline check ran.</text></svg>
