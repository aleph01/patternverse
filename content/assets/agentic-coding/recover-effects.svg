<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1037" viewBox="0 0 720 1037" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Source restoration, data compensation, and delivery recovery differ</title><desc id="desc">The same fictional I7 import and S9 sale yield stock 13 before and after code restoration. Conditional compensation C7 targets 8 rather than overwriting the sale with the old stock 10. N7 remains delivered and requires a separate recovery decision.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="1037" class="paper"/><text x="28" y="32" font-size="23">Restoring source does not restore every effect</text><text x="28" y="68" font-size="19">Constructed additive-stock ledger · same import and sale throughout</text><rect x="28" y="106" width="664" height="104" class="neutral"/><text x="44" y="144" font-size="21">P100: initial 10 + import I7 (+5) − unrelated sale S9 (2) = 13</text><text x="44" y="185" font-size="19">N7 has already been delivered. Recovery must account for both systems.</text><text x="28" y="262" font-size="22">Code</text><text x="254" y="262" font-size="22">Database</text><text x="480" y="262" font-size="22">External service</text><rect x="28" y="291" width="212" height="112" class="neutral"/><text x="44" y="330" font-size="20">Faulty revision</text><text x="44" y="368" font-size="20">after I7</text><rect x="254" y="291" width="212" height="112" class="neutral"/><text x="270" y="330" font-size="20">Committed quantity</text><text x="270" y="368" font-size="20">13</text><rect x="480" y="291" width="212" height="112" class="neutral"/><text x="496" y="330" font-size="20">Notification N7</text><text x="496" y="368" font-size="20">delivered</text><path d="M134 415v24m-5 -6l5 6l5 -6" class="boundary"/><text x="28" y="477" font-size="21" class="accent">After source restoration</text><rect x="28" y="505" width="212" height="112" class="mint"/><text x="44" y="544" font-size="20" class="accent">Source: C0</text><text x="44" y="582" font-size="20" class="accent">Selected code</text><rect x="254" y="505" width="212" height="112" class="neutral"/><text x="270" y="544" font-size="20">Quantity stays</text><text x="270" y="582" font-size="20">13</text><rect x="480" y="505" width="212" height="112" class="pending"/><text x="496" y="544" font-size="20">N7 remains</text><text x="496" y="582" font-size="20">delivered</text><rect x="28" y="663" width="664" height="140" class="mint"/><text x="44" y="701" font-size="22" class="accent">Separate conditional repair: C7 references I7</text><text x="44" y="743" font-size="19">13 − 5 = target 8; retain S9’s legitimate −2 effect.</text><text x="44" y="775" font-size="19">Domain checks and transactional duplicate protection remain required.</text><rect x="28" y="849" width="664" height="104" class="pending"/><text x="44" y="887" font-size="21">Resetting to 10 would erase the unrelated sale’s effect.</text><text x="44" y="928" font-size="19">N7 cannot be unsent by code restore; any correction is a new action.</text><text x="28" y="1005" font-size="18">Green arrow: source restoration only. Compensation is a plan, not executed.</text></svg>
