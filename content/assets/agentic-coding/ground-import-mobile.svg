<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1244" viewBox="0 0 360 1244" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Ground proposed import in inspected validation and storage</title><desc id="desc">Fictional BASE-E: manual entry uses validateProduct and createProducts. Proposed CSV decoding reuses validation; the adapter adds row 2. Invalid preview blocks confirmation, so inventory stays P100:4. Dashed paths are proposed, solid paths inspected.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1244" class="paper"/><text x="20" y="32" font-size="20">Find the existing reuse points</text><text x="20" y="68" font-size="18">BASE-E · fictional system map</text><rect x="20" y="106" width="320" height="76" class="neutral"/><text x="36" y="139" font-size="21">ProductForm</text><text x="36" y="169" font-size="18">Inspected manual-entry caller</text><path d="M180 194v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="233" width="320" height="116" class="mint"/><text x="36" y="270" font-size="21" class="accent">validateProduct</text><text x="36" y="310" font-size="17">quantity_nonnegative</text><text x="36" y="337" font-size="17">Field code; no CSV row number</text><path d="M20 291H8V958h12m-6 -5l6 5l-6 5" class="line"/><path d="M180 394v-31m-5 6l5 -6l5 6" class="pending"/><rect x="20" y="396" width="320" height="124" class="pending"/><text x="36" y="431" font-size="18">Proposed CSV upload + decode</text><text x="36" y="470" font-size="20">P201,3</text><text x="36" y="500" font-size="20">P202,-1</text><path d="M340 291h10v336h-10m6 -5l-6 5l6 5" class="pending"/><rect x="20" y="572" width="320" height="110" class="pending"/><text x="36" y="608" font-size="21">Preview · read-only</text><text x="36" y="646" font-size="18">Adapter adds row 2 to error</text><path d="M180 694v36m-5 -6l5 6l5 -6" class="pending"/><path d="M173 703l14 14m-14 0l14 -14" class="line"/><text x="20" y="760" font-size="18">Invalid file: confirmation blocked</text><rect x="20" y="782" width="320" height="66" class="pending"/><text x="36" y="822" font-size="20">Confirm valid file only</text><path d="M180 860v24m-5 -6l5 6l5 -6" class="pending"/><rect x="20" y="900" width="320" height="116" class="mint"/><text x="36" y="935" font-size="21" class="accent">createProducts</text><text x="36" y="975" font-size="18">Existing-SKU check</text><text x="36" y="1003" font-size="18">All-or-none transaction</text><path d="M180 1028v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="1068" width="320" height="76" class="neutral"/><text x="36" y="1102" font-size="21">Inventory</text><text x="36" y="1132" font-size="18">This invalid file: P100 stays 4</text><text x="20" y="1190" font-size="17">Solid: inspected existing calls</text><text x="20" y="1218" font-size="17">Dashed: proposed import wiring</text></svg>
