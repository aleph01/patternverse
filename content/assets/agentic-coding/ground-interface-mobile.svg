<svg xmlns="http://www.w3.org/2000/svg" width="360" height="992" viewBox="0 0 360 992" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Inspect the fictional target dependency interface</title><desc id="desc">Identical CSV input is considered under the remembered RowReader 1.8.0 parse signature and inspected fictional 2.1.0 read contract. Lockfile and loaded module agree; the result separates rows and issues and retains quantity as text.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="992" class="paper"/><text x="20" y="32" font-size="18">Same CSV. Check the version contract.</text><text x="20" y="68" font-size="17">RowReader · fictional package and API</text><rect x="20" y="106" width="320" height="120" class="neutral"/><text x="36" y="140" font-size="20">Intended input</text><text x="36" y="180" font-size="20">sku,quantity</text><text x="36" y="210" font-size="20">P201,3</text><rect x="20" y="268" width="320" height="116" class="pending"/><text x="36" y="303" font-size="20">Remembered from 1.8.0</text><text x="36" y="343" font-size="20">reader.parse(text)</text><text x="36" y="372" font-size="18">Assumes a list result</text><rect x="20" y="431" width="320" height="106" class="mint"/><text x="36" y="467" font-size="20" class="accent">Target 2.1.0 inspected</text><text x="36" y="503" font-size="17">Lockfile = loaded module = 2.1.0</text><rect x="20" y="577" width="320" height="262" class="mint"/><text x="36" y="614" font-size="20" class="accent">Version-specific contract</text><text x="36" y="657" font-size="19">reader.read(text,</text><text x="36" y="689" font-size="19">{ header: true })</text><text x="36" y="721" font-size="19">rows: [{ sku: &quot;P201&quot;,</text><text x="36" y="753" font-size="19">quantity: &quot;3&quot; }]</text><text x="36" y="785" font-size="19">issues: []</text><text x="20" y="889" font-size="20">Quantity is still text.</text><text x="20" y="930" font-size="18">Handle issues and result envelope.</text><text x="20" y="961" font-size="18">Then apply product validation.</text></svg>
