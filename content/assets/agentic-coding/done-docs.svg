<svg xmlns="http://www.w3.org/2000/svg" width="720" height="744" viewBox="0 0 720 744" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Tie documentation completion to relevant checks</title><desc id="desc">Fictional DOC-D changes P202,-1 accepted to P202,0 accepted and repairs the import reference. The record checks accuracy, destination, rendering, and scope, without claiming unrelated runtime tests or publication.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="744" class="paper"/><text x="28" y="32" font-size="22">Documentation: relevant evidence</text><text x="28" y="68" font-size="18">DOC-D · fictional review record</text><rect x="28" y="106" width="316" height="106" class="neutral"/><rect x="376" y="106" width="316" height="106" class="mint"/><text x="44" y="143" font-size="19">Before: contradicts rule</text><text x="392" y="143" font-size="19">After: quantity ≥ 0</text><text x="44" y="184" font-size="22">P202,-1 accepted</text><text x="392" y="184" font-size="22" class="accent">P202,0 accepted</text><text x="28" y="260" font-size="22">Evidence at DOC-D</text><path d="M28 285H692" class="fine"/><text x="44" y="321" font-size="20" class="accent">Accuracy</text><text x="210" y="321" font-size="20">P202,0 agrees with the rule</text><path d="M28 345H692" class="fine"/><text x="44" y="381" font-size="20" class="accent">Links</text><text x="210" y="381" font-size="20">Import reference destination resolves</text><path d="M28 405H692" class="fine"/><text x="44" y="441" font-size="20" class="accent">Preview</text><text x="210" y="441" font-size="20">Desktop and phone views inspected</text><path d="M28 465H692" class="fine"/><text x="44" y="501" font-size="20" class="accent">Scope</text><text x="210" y="501" font-size="20">Diff confined to requested documentation</text><rect x="28" y="556" width="664" height="100" class="pending"/><text x="44" y="593" font-size="20">Runtime tests: not applicable · no executable change</text><text x="44" y="632" font-size="19">Not applicable is not a passing test result.</text><text x="28" y="708" font-size="21" class="accent">Ready for review · publication not established</text></svg>
