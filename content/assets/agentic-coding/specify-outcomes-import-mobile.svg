<svg xmlns="http://www.w3.org/2000/svg" width="360" height="990" viewBox="0 0 360 990" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Specify the expected import outcome</title><desc id="desc">Fictional input and acceptance cases. Row 2 has a negative quantity; row 3 repeats row 1. The expected rejection leaves P100 at quantity 4.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.leader{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.intervention{fill:none;stroke:var(--accent);stroke-width:1.4}
.failure{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:4 3}
</style><rect width="360" height="990" class="paper"/><text x="20" y="32" font-size="20">Start: P100 = 4</text><rect x="20" y="54" width="320" height="44" class="neutral"/><text x="30" y="82" font-size="18">“Import CSV; handle errors.”</text><text x="20" y="130" font-size="18" class="accent">Specify each expected outcome</text><text x="28" y="174" font-size="19">P201,3 · P202,0</text><text x="28" y="204" font-size="17">Confirm: add both products</text><path d="M20 221H340" class="fine"/><text x="28" y="254" font-size="19">P202,-1</text><text x="28" y="284" font-size="17">Reject: no inventory changes</text><path d="M20 301H340" class="fine"/><text x="28" y="334" font-size="19">Repeated P201</text><text x="28" y="364" font-size="17">Reject: no inventory changes</text><path d="M20 381H340" class="fine"/><text x="20" y="432" font-size="20">One file, two failures</text><text x="65" y="476" font-size="20">sku,quantity</text><text x="25" y="513" font-size="17">1</text><text x="65" y="513" font-size="20">P201,3</text><text x="25" y="550" font-size="17">2</text><text x="65" y="550" font-size="20">P202,-1</text><text x="25" y="587" font-size="17">3</text><text x="65" y="587" font-size="20">P201,2</text><text x="20" y="660" font-size="20">Expected preview</text><text x="25" y="702" font-size="18">2: quantity must be ≥ 0</text><text x="25" y="740" font-size="18">3: P201 repeats row 1</text><path d="M205 550H329V696H305" class="leader"/><path d="M205 587H312V734H298" class="leader"/><rect x="20" y="790" width="320" height="124" class="mint"/><text x="36" y="822" font-size="20" class="accent">Rejected file</text><text x="36" y="858" font-size="18">No confirmation.</text><text x="36" y="892" font-size="19">Inventory: P100 = 4</text><text x="20" y="958" font-size="17">Neither new product is stored.</text></svg>
