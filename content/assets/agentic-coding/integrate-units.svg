<svg xmlns="http://www.w3.org/2000/svg" width="720" height="824" viewBox="0 0 720 824" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A scaled integer passes a validator using a different unit</title><desc id="desc">The same input 3 each is represented as 300 hundredths by Q1, then misinterpreted as 300 each by V1 and the writer. Repair removes scaling. A matched fractional input 3.5 is then correctly rejected rather than written as 350. Results concern reference functions only.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="824" class="paper"/><text x="28" y="32" font-size="23">One input reveals incompatible quantity units</text><text x="28" y="68" font-size="18">Same CSV quantity 3 each · initial P100:4 · contract: whole each, 0–500</text><rect x="28" y="106" width="316" height="172" class="pending"/><text x="44" y="142" font-size="21">Q1 · wrong conversion</text><text x="44" y="184" font-size="18">CSV: 3 each</text><text x="44" y="216" font-size="18">×100 → 300 hundredths</text><text x="44" y="248" font-size="18">Mock expects that scale.</text><rect x="376" y="106" width="316" height="172" class="pending"/><text x="392" y="142" font-size="22">V1 · expects each</text><text x="392" y="184" font-size="17">Reads the number as 300 each.</text><text x="392" y="216" font-size="17">Integer and range checks pass.</text><text x="392" y="248" font-size="17">Writer stores P201:300.</text><path d="M344 198h32m-6 -5l6 5l-6 5" class="line"/><text x="28" y="320" font-size="18">Arrow: the value crosses the component boundary; units do not agree.</text><rect x="28" y="350" width="664" height="140" class="mint"/><text x="44" y="386" font-size="22" class="accent">Repair the importer’s representation</text><text x="44" y="428" font-size="19">Pass the same input as 3 each; remove multiplication by 100.</text><text x="44" y="460" font-size="19">V1 accepts 3; reference writer records P201:3 and retains P100:4.</text><rect x="28" y="536" width="316" height="172" class="pending"/><text x="44" y="572" font-size="21">Fraction contrast · old</text><text x="44" y="614" font-size="18">Input: 3.5 each</text><text x="44" y="646" font-size="18">×100 → 350; V1 accepts.</text><text x="44" y="678" font-size="18">Writer stores P201:350.</text><rect x="376" y="536" width="316" height="172" class="mint"/><text x="392" y="572" font-size="21" class="accent">Fraction contrast · fixed</text><text x="392" y="614" font-size="18">Same input: 3.5 each</text><text x="392" y="646" font-size="18">V1: quantity_whole</text><text x="392" y="678" font-size="18">0 writes; only P100:4</text><text x="28" y="752" font-size="19">Same inputs and contract; changed variable: importer scaling.</text><text x="28" y="790" font-size="18">Executed in-memory references; no production storage or migration test.</text></svg>
