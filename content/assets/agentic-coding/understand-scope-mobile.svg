<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1362" viewBox="0 0 360 1362" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Proportionate explanation distinguishes local and cross-component changes</title><desc id="desc">The local correction changes only display offset and retains the wire contract. A separate proposed versioned interface changes row representation and requires explicit producer meaning, three consumers and transition decoding. Reference outputs agree on displayed row 2 without proving deployed compatibility.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1362" class="paper"/><text x="20" y="32" font-size="20">Explain the boundary that changed</text><text x="20" y="68" font-size="16">Same displayed result: data row 2</text><rect x="20" y="106" width="320" height="204" class="mint"/><text x="36" y="142" font-size="20" class="accent">Local correction</text><text x="36" y="184" font-size="17">index + 2 → index + 1</text><text x="36" y="216" font-size="17">Index 1: row 3 → row 2</text><text x="36" y="248" font-size="17">Checks: 0→1 and 1→2</text><text x="36" y="280" font-size="17">Wire contract is unchanged.</text><rect x="20" y="356" width="320" height="204" class="neutral"/><text x="36" y="392" font-size="20">Separate interface proposal</text><text x="36" y="434" font-size="17">v1: row = 2</text><text x="36" y="466" font-size="17">v2: data_index = 1</text><text x="36" y="498" font-size="17">Both refer to logical data rows.</text><text x="36" y="530" font-size="17">ADR-17 status: proposed.</text><rect x="20" y="606" width="320" height="172" class="mint"/><text x="36" y="642" font-size="20" class="accent">Transition decoder</text><text x="36" y="684" font-size="17">v1 row 2 → canonical index 1</text><text x="36" y="716" font-size="17">v2 index 1 → canonical index 1</text><text x="36" y="748" font-size="17">Unknown-version fixture rejected.</text><rect x="20" y="824" width="320" height="204" class="neutral"/><text x="36" y="860" font-size="20">Declared consumers</text><text x="36" y="902" font-size="17">Web: Data row 2</text><text x="36" y="934" font-size="17">CLI: row 2</text><text x="36" y="966" font-size="17">Saved preview: dataIndex 1</text><text x="36" y="998" font-size="17">Code: quantity_nonnegative</text><rect x="20" y="1074" width="320" height="204" class="pending"/><text x="36" y="1110" font-size="20">Different explanatory scope</text><text x="36" y="1152" font-size="17">Local fix: rule, location, checks.</text><text x="36" y="1184" font-size="17">Interface: meaning and callers.</text><text x="36" y="1216" font-size="17">State compatibility and decision status.</text><text x="36" y="1248" font-size="17">Deployed clients remain untested.</text><text x="20" y="1328" font-size="15">Arrows in labels: conversion, not chronology</text></svg>
