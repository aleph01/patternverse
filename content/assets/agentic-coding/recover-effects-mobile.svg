<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1183" viewBox="0 0 360 1183" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Separate restored code, committed stock, and delivered notifications</title><desc id="desc">Source restoration changes only code. Stock remains 13 and N7 remains delivered. Under a simplified additive model a separately authorized C7 compensation targets 8 while preserving S9. Domain and retry checks remain requirements, not implemented guarantees.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1183" class="paper"/><text x="20" y="32" font-size="21">Code recovery has a boundary</text><text x="20" y="68" font-size="17">Constructed ledger · same I7 and S9</text><rect x="20" y="106" width="320" height="140" class="neutral"/><text x="36" y="142" font-size="21">P100 · additive stock only</text><text x="36" y="184" font-size="18">Initial 10 + import I7 (+5)</text><text x="36" y="215" font-size="18">− unrelated sale S9 (2) = 13</text><text x="20" y="296" font-size="21" class="accent">After source restoration</text><rect x="20" y="324" width="320" height="96" class="mint"/><text x="36" y="360" font-size="22" class="accent">Code returns to C0</text><text x="36" y="399" font-size="17">Existing effects are not reversed.</text><rect x="20" y="466" width="320" height="96" class="neutral"/><text x="36" y="502" font-size="22">Committed stock stays 13</text><text x="36" y="541" font-size="17">I7 and S9 remain in the ledger.</text><rect x="20" y="608" width="320" height="96" class="pending"/><text x="36" y="644" font-size="22">N7 remains delivered</text><text x="36" y="683" font-size="18">No source-control recall</text><rect x="20" y="750" width="320" height="168" class="mint"/><text x="36" y="786" font-size="20" class="accent">Conditional data repair: C7</text><text x="36" y="828" font-size="17">13 − I7’s 5 = target 8</text><text x="36" y="858" font-size="17">Keep the sale’s −2 effect.</text><text x="36" y="888" font-size="17">Check domain rules + duplicates.</text><rect x="20" y="964" width="320" height="104" class="pending"/><text x="36" y="1000" font-size="20">Do not reset stock to 10</text><text x="36" y="1041" font-size="17">That would erase S9’s effect.</text><text x="20" y="1118" font-size="17">A correction message is a new action.</text><text x="20" y="1151" font-size="17">Repair plan only; nothing executed.</text></svg>
