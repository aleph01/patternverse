<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1100" viewBox="0 0 360 1100" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Separate fixture setup failure from application behavior</title><desc id="desc">Fictional BASE-E with the same runtime and application code initially stops at missing fixtures/inventory.csv, before application assertions. Restoring synthetic P100,4 reaches an assertion that rejects P100,8 and retains quantity 4.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1100" class="paper"/><text x="20" y="32" font-size="18">Locate the failure before changing code</text><text x="20" y="68" font-size="18">BASE-E · fictional controlled rerun</text><rect x="20" y="107" width="320" height="102" class="neutral"/><text x="36" y="142" font-size="21">Environment: unchanged</text><text x="36" y="182" font-size="17">Same runtime + working directory</text><text x="20" y="253" font-size="21">Before: fixture missing</text><rect x="20" y="279" width="320" height="115" class="pending"/><text x="36" y="315" font-size="19">fixtures/inventory.csv</text><text x="36" y="355" font-size="18">ENOENT at load</text><text x="36" y="383" font-size="18">Missing path confirmed</text><path d="M180 406v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="447" width="320" height="101" class="pending"/><text x="36" y="482" font-size="21">Application not reached</text><text x="36" y="523" font-size="19">No assertion result</text><path d="M20 590H340" class="fine"/><text x="20" y="629" font-size="19" class="accent">Restore documented fixture only</text><rect x="20" y="659" width="320" height="130" class="mint"/><text x="36" y="695" font-size="19" class="accent">fixtures/inventory.csv</text><text x="36" y="736" font-size="20">sku,quantity</text><text x="36" y="767" font-size="20">P100,4</text><path d="M180 801v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="842" width="320" height="145" class="mint"/><text x="36" y="879" font-size="21" class="accent">Assertion now reached</text><text x="36" y="920" font-size="19">P100,8 → existing-SKU error</text><text x="36" y="952" font-size="19">P100 stays 4</text><text x="20" y="1037" font-size="18">Application code unchanged.</text><text x="20" y="1068" font-size="18">One check ≠ whole environment.</text></svg>
