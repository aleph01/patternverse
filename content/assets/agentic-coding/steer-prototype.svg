<svg xmlns="http://www.w3.org/2000/svg" width="720" height="979" viewBox="0 0 720 979" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Prototype success supports a limited design decision</title><desc id="desc">The same row-2 error is held constant. Adding a route to correction changes the fictional walkthrough outcome. A separate dashed boundary retains untested production conditions, with no scalability, accessibility, or population-wide usability claim.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="979" class="paper"/><text x="28" y="32" font-size="23">Resolve an interaction; retain the production questions</text><text x="28" y="68" font-size="19">Constructed walkthrough · not conducted user research</text><rect x="28" y="106" width="664" height="103" class="neutral"/><text x="44" y="144" font-size="22">Held constant: same file, row 2 with invalid quantity</text><text x="44" y="185" font-size="19">The file and other rows stay fixed; only the repair interaction changes.</text><rect x="28" y="255" width="316" height="230" class="pending"/><text x="44" y="293" font-size="22">A · blocked confirmation</text><text x="44" y="336" font-size="20">“Cannot confirm”</text><text x="44" y="375" font-size="20">No repair route</text><text x="44" y="414" font-size="20">Fictional participant stuck</text><rect x="376" y="255" width="316" height="230" class="mint"/><text x="392" y="293" font-size="22" class="accent">B · explicit repair path</text><text x="392" y="336" font-size="19">Fix row 2</text><text x="392" y="371" font-size="19">Open quantity field</text><text x="392" y="406" font-size="19">Retain file and other rows</text><text x="392" y="441" font-size="19">Return to preview</text><rect x="28" y="531" width="664" height="104" class="mint"/><text x="44" y="569" font-size="22" class="accent">Supported: carry B into the next design iteration</text><text x="44" y="610" font-size="20">The constructed participant completes this repair path.</text><rect x="28" y="681" width="664" height="172" class="pending"/><text x="44" y="719" font-size="22">Not established by the walkthrough</text><text x="44" y="761" font-size="19">Authorization · persistence · keyboard and assistive-technology access</text><text x="44" y="799" font-size="19">Failure recovery · representative load</text><text x="28" y="905" font-size="20">A prototype revision supports a design choice, not a release decision.</text><text x="28" y="947" font-size="18">Dashed boundary: production questions still requiring evidence</text></svg>
