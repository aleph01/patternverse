<svg xmlns="http://www.w3.org/2000/svg" width="720" height="890" viewBox="0 0 720 890" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Explanatory scope follows interface consequences rather than prose length</title><desc id="desc">A small display correction needs a rule and focused checks. The separate interface proposal preserves displayed row 2 while changing v1 row to v2 data_index; it therefore identifies decision status, producer semantics and three consumers. Checks use reference functions and do not execute a real migration.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="890" class="paper"/><text x="28" y="32" font-size="22">A local correction and an interface change need different evidence</text><text x="28" y="68" font-size="18">Same negative second data record · same intended displayed row 2</text><rect x="28" y="106" width="316" height="204" class="mint"/><text x="44" y="142" font-size="22" class="accent">Local correction</text><text x="44" y="184" font-size="18">index + 2 → index + 1</text><text x="44" y="216" font-size="18">Index 1: row 3 → row 2</text><text x="44" y="248" font-size="18">Checks: 0→1 and 1→2</text><text x="44" y="280" font-size="18">Wire contract unchanged.</text><rect x="376" y="106" width="316" height="204" class="neutral"/><text x="392" y="142" font-size="20">Separate interface proposal</text><text x="392" y="184" font-size="16">v1 errors[0].row = 2</text><text x="392" y="216" font-size="16">v2 errors[0].data_index = 1</text><text x="392" y="248" font-size="16">Logical rows; header excluded</text><text x="392" y="280" font-size="16">ADR-17: proposed, not accepted</text><text x="28" y="354" font-size="18">Explanation follows the changed responsibility, not a word-count target.</text><rect x="28" y="386" width="664" height="140" class="mint"/><text x="44" y="422" font-size="22" class="accent">Transition decoder · preserve interpretation</text><text x="44" y="464" font-size="19">v1 row 2 OR v2 data_index 1 → canonical dataIndex 1.</text><text x="44" y="496" font-size="19">Name producer assumptions, affected callers and compatibility limits.</text><path d="M360 540v24m-5 -6l5 6l5 -6" class="line"/><text x="28" y="606" font-size="18">Reference consumers of the same version-1 and version-2 fixtures</text><rect x="28" y="634" width="204" height="140" class="neutral"/><text x="44" y="670" font-size="20">Web renderer</text><text x="44" y="712" font-size="18">Data row 2</text><text x="44" y="744" font-size="18">Code retained</text><rect x="258" y="634" width="204" height="140" class="neutral"/><text x="274" y="670" font-size="20">CLI formatter</text><text x="274" y="712" font-size="18">row 2</text><text x="274" y="744" font-size="18">Code retained</text><rect x="488" y="634" width="204" height="140" class="neutral"/><text x="504" y="670" font-size="20">Saved reader</text><text x="504" y="712" font-size="18">dataIndex 1</text><text x="504" y="744" font-size="18">Code retained</text><text x="28" y="818" font-size="18">Code: quantity_nonnegative. The exercised unknown version is rejected.</text><text x="28" y="856" font-size="18">Arrow: decoded error reaches consumers; deployed clients are untested.</text></svg>
