<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1510" viewBox="0 0 360 1510" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Blocked importer work and proposed flow</title><desc id="desc">Initial contract C18 blocks validation V18, display U18 and bulk B18. Proposed policy records B18 withdrawal and focuses one useful increment I18 while retaining three unfinished child tasks. No observed improvement.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1510" class="paper"/><text x="20" y="32" font-size="18">Resolve the dependency; finish I18</text><text x="20" y="68" font-size="16">Fictional identifiers · no measured result</text><rect x="20" y="100" width="320" height="140" class="neutral"/><text x="36" y="136" font-size="20">Initial snapshot · C18</text><text x="36" y="178" font-size="17">Row contract waits for review.</text><text x="36" y="210" font-size="17">Logical row convention unsettled.</text><path d="M180 300V260m-5 6l5 -6l5 6" class="line"/><rect x="20" y="320" width="320" height="172" class="neutral"/><text x="36" y="356" font-size="20">Blocked · require C18</text><text x="36" y="398" font-size="17">V18 · validation</text><text x="36" y="430" font-size="17">U18 · error display</text><text x="36" y="462" font-size="17">B18 · bulk implementation</text><text x="20" y="540" font-size="17">Up arrow = requires the contract.</text><text x="20" y="600" font-size="20" class="accent">Proposal · ten working days</text><rect x="20" y="630" width="320" height="172" class="mint"/><text x="36" y="666" font-size="20" class="accent">Useful-increment WIP limit: 1</text><text x="36" y="708" font-size="17">Keep I18; withdraw B18 explicitly.</text><text x="36" y="740" font-size="17">Retain history; B18 accepted: 0.</text><text x="36" y="772" font-size="17">I18 still has 3 unfinished tasks.</text><rect x="20" y="870" width="320" height="108" class="neutral"/><text x="36" y="906" font-size="20">1 · Resolve C18</text><text x="36" y="948" font-size="17">Review and settle the contract.</text><path d="M180 994v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="1034" width="320" height="108" class="neutral"/><text x="36" y="1070" font-size="20">2 · Finish V18 and U18</text><text x="36" y="1112" font-size="17">Implement the agreed row rule.</text><path d="M180 1158v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="1198" width="320" height="140" class="neutral"/><text x="36" y="1234" font-size="20">3 · Check I18 together</text><text x="36" y="1276" font-size="17">Integrate and verify behavior.</text><text x="36" y="1308" font-size="17">Record acceptance and release.</text><text x="20" y="1404" font-size="17">Down arrows = planned sequence.</text><text x="20" y="1436" font-size="17">Inspect waits, age and rework.</text><text x="20" y="1468" font-size="17">Improvement remains unproven.</text></svg>
