<svg xmlns="http://www.w3.org/2000/svg" width="720" height="830" viewBox="0 0 720 830" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A reviewed and integrated fix has a distinct release state</title><desc id="desc">The fictional search tie-order defect has a reproducer, corrected and regression results at FIX-B, and integrated checks at MAIN-C. LIVE-A still serves; no production rollout is implied by integration.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="830" class="paper"/><text x="28" y="32" font-size="22">Search fix: evidence and delivery</text><text x="28" y="68" font-size="18">Fictional revisions · arrows show sequence</text><rect x="28" y="104" width="664" height="117" class="neutral"/><text x="44" y="140" font-size="21">Reproducer · A10 = 8, A20 = 8, A30 = 7</text><text x="44" y="182" font-size="20">Faulty: A20, A10, A30 · required: A10 before A20</text><path d="M360 233v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="270" width="664" height="117" class="mint"/><text x="44" y="306" font-size="21" class="accent">FIX-B · verified and reviewed</text><text x="44" y="348" font-size="19">A10, A20, A30 · tie + unequal-score regression cases</text><path d="M360 399v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="436" width="664" height="117" class="mint"/><text x="44" y="472" font-size="21" class="accent">MAIN-C · integrated</text><text x="44" y="514" font-size="20">Combined-code checks pass · fix complete in increment</text><path d="M28 589H692" class="fine"/><text x="28" y="624" font-size="21">Release is a separate claim</text><rect x="28" y="653" width="664" height="100" class="pending"/><text x="44" y="689" font-size="21">LIVE-A still serving · MAIN-C rollout pending</text><text x="44" y="729" font-size="19">Existing delivery process governs authorization and rollout.</text><text x="28" y="797" font-size="20">Ordering checks do not establish pagination consistency.</text></svg>
