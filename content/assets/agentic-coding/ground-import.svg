<svg xmlns="http://www.w3.org/2000/svg" width="720" height="958" viewBox="0 0 720 958" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Reuse existing validation and the inventory write boundary</title><desc id="desc">The fictional map distinguishes inspected ProductForm, validateProduct, createProducts and inventory relationships from proposed upload, preview and confirmation wiring. The invalid row blocks confirmation; no new storage bypass is introduced.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="958" class="paper"/><text x="28" y="32" font-size="22">Find the existing reuse points</text><text x="28" y="68" font-size="18">BASE-E · fictional system map</text><rect x="28" y="106" width="244" height="90" class="neutral"/><text x="44" y="143" font-size="22">ProductForm</text><text x="44" y="178" font-size="18">Existing manual entry</text><path d="M284 152h88m-6 -5l6 5l-6 5" class="line"/><rect x="388" y="106" width="304" height="130" class="mint"/><text x="404" y="145" font-size="22" class="accent">validateProduct</text><text x="404" y="184" font-size="18">quantity_nonnegative</text><text x="404" y="214" font-size="18">Field code, no row number</text><path d="M388 220h-34v380h-44v28m-5 -6l5 6l5 -6" class="line"/><text x="28" y="455" font-size="19">Manual-entry save</text><text x="28" y="486" font-size="19">keeps the write boundary</text><path d="M267 466H354" class="fine"/><rect x="28" y="272" width="244" height="126" class="pending"/><text x="44" y="308" font-size="20">CSV upload + decode</text><text x="44" y="347" font-size="20">P201,3</text><text x="44" y="378" font-size="20">P202,-1</text><path d="M272 334h56V188h60m-6 -5l6 5l-6 5" class="pending"/><path d="M540 248v26m-5 -6l5 6l5 -6" class="pending"/><rect x="388" y="290" width="304" height="108" class="pending"/><text x="404" y="326" font-size="21">Preview · read-only</text><text x="404" y="365" font-size="18">Adapter adds row 2 to error</text><path d="M540 410v44m-5 -6l5 6l5 -6" class="pending"/><path d="M533 424l14 14m-14 0l14 -14" class="line"/><text x="388" y="488" font-size="19">Invalid: confirmation blocked</text><rect x="388" y="510" width="304" height="66" class="pending"/><text x="404" y="550" font-size="20">Confirm valid file only</text><path d="M540 588v20H500v20m-5 -6l5 6l5 -6" class="pending"/><rect x="28" y="646" width="664" height="102" class="mint"/><text x="44" y="683" font-size="22" class="accent">createProducts · existing write boundary</text><text x="44" y="723" font-size="20">Existing-SKU check + all-or-none transaction</text><path d="M360 760v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="800" width="664" height="78" class="neutral"/><text x="44" y="834" font-size="21">Inventory</text><text x="44" y="864" font-size="19">This invalid file: P100 stays 4</text><text x="28" y="927" font-size="19">Solid: inspected calls · dashed: proposed import wiring</text></svg>
