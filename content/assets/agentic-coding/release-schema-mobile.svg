<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1140" viewBox="0 0 360 1140" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A nullable expansion and retained default preserve old-client inserts</title><desc id="desc">D0 supports A0 but not A1. D1 permits mixed old and new clients under the established legacy each meaning. D2 backfills and constrains the unit while retaining default each for A0 inserts. Without that default a counterexample rejects A0. Checks concern small SQLite clients, not an online deployment.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1140" class="paper"/><text x="20" y="32" font-size="19">Keep old and new clients compatible</text><text x="20" y="68" font-size="16">Whole items already mean each.</text><rect x="20" y="106" width="320" height="140" class="neutral"/><text x="36" y="142" font-size="20">D0 · no unit column</text><text x="36" y="184" font-size="17">A0 old: reads and writes work.</text><text x="36" y="216" font-size="17">A1 new: NO; unit is absent.</text><path d="M180 258v24m-5 -6l5 6l5 -6" class="line"/><text x="20" y="312" font-size="16">Expand before A1 depends on unit</text><rect x="20" y="338" width="320" height="172" class="neutral"/><text x="36" y="374" font-size="20">D1 · nullable unit</text><text x="36" y="416" font-size="17">A0: YES; may insert NULL.</text><text x="36" y="448" font-size="17">A1: YES; legacy NULL means each.</text><text x="36" y="480" font-size="17">A1 writes explicit each.</text><path d="M180 522v24m-5 -6l5 6l5 -6" class="line"/><text x="20" y="576" font-size="16">Coordinate default, backfill, constraint</text><rect x="20" y="602" width="320" height="204" class="mint"/><text x="36" y="638" font-size="20" class="accent">D2 · default each retained</text><text x="36" y="680" font-size="17">NOT NULL; CHECK unit = each</text><text x="36" y="712" font-size="17">A0: YES; omitted unit defaults.</text><text x="36" y="744" font-size="17">A1: YES; writes each.</text><text x="36" y="776" font-size="17">Fresh reads: no NULL units.</text><rect x="20" y="852" width="320" height="172" class="pending"/><text x="36" y="888" font-size="20">Rejected alternative</text><text x="36" y="930" font-size="17">Required unit; no default</text><text x="36" y="962" font-size="17">A0 insert fails: unit is missing.</text><text x="36" y="994" font-size="17">Same old named-column SQL.</text><text x="20" y="1074" font-size="16">Arrows: planned schema-stage order</text><text x="20" y="1106" font-size="16">SQLite reference; no online-DDL claim.</text></svg>
