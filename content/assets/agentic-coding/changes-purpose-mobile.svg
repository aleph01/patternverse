<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1042" viewBox="0 0 360 1042" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Compare hypothetical textual size with semantic scope</title><desc id="desc">Invented 1200-line internal helper rename has one transformation and preserves public behavior. Invented 40-line policy patch changes rounding, overwrite behavior, and partial saves against current requirements. Both need purpose-appropriate assessment; no effort or defect forecast is made.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1042" class="paper"/><text x="20" y="32" font-size="18">Count purposes, not only changed lines</text><text x="20" y="68" font-size="15">Invented counts · no universal size threshold</text><rect x="20" y="106" width="320" height="291" class="mint"/><text x="36" y="144" font-size="22" class="accent">1,200 lines · one purpose</text><text x="36" y="189" font-size="19">Internal helper rename</text><text x="36" y="226" font-size="19">formatRowError</text><text x="36" y="263" font-size="19">→ formatImportRowError</text><text x="36" y="300" font-size="19">Update references</text><text x="36" y="337" font-size="19">Preserve public behavior</text><rect x="20" y="443" width="320" height="285" class="pending"/><text x="36" y="481" font-size="22">40 lines · three decisions</text><text x="36" y="526" font-size="18">Round fractions</text><text x="36" y="566" font-size="18">Overwrite existing SKUs</text><text x="36" y="606" font-size="18">Save partial invalid files</text><text x="36" y="646" font-size="18">Conflicts with current requirements</text><rect x="20" y="774" width="320" height="154" class="neutral"/><text x="36" y="811" font-size="19">Rename evidence still needed</text><text x="36" y="853" font-size="16">Audit references, including dynamic</text><text x="36" y="884" font-size="16">Relevant build + regression checks</text><text x="20" y="978" font-size="19">Small diff ≠ one decision.</text><text x="20" y="1010" font-size="19">Mechanical ≠ unreviewed.</text></svg>
