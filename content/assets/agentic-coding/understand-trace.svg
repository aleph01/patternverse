<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1024" viewBox="0 0 720 1024" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A row trace exposes preview, confirmation and rejection responsibilities</title><desc id="desc">The same valid P201 row is traced from raw text through validation and read-only preview to confirmation and fresh storage. Negative-input and stale-state comparisons use separate controlled scenarios. Named functions and observed states come from the reference experiment; broader importer behavior remains untested.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="1024" class="paper"/><text x="28" y="32" font-size="23">Follow P201 through inspectable responsibilities</text><text x="28" y="68" font-size="18">Reference functions · create-only · each scenario starts at P100:4</text><rect x="28" y="106" width="204" height="140" class="neutral"/><text x="44" y="142" font-size="21">CSV input</text><text x="44" y="184" font-size="17">P201,3</text><text x="44" y="216" font-size="17">Logical data row 1</text><rect x="258" y="106" width="204" height="140" class="neutral"/><text x="274" y="142" font-size="21">parse_rows</text><text x="274" y="184" font-size="17">SKU: P201</text><text x="274" y="216" font-size="17">Quantity text: &quot;3&quot;</text><rect x="488" y="106" width="204" height="140" class="neutral"/><text x="504" y="142" font-size="21">validate_rows</text><text x="504" y="184" font-size="16">Whole; nonnegative</text><text x="504" y="216" font-size="16">Integer quantity: 3</text><path d="M232 180h26m-6 -5l6 5l-6 5" class="line"/><path d="M462 180h26m-6 -5l6 5l-6 5" class="line"/><text x="28" y="292" font-size="18">Arrows follow inspected data and control responsibility, not every path.</text><rect x="28" y="322" width="664" height="140" class="neutral"/><text x="44" y="358" font-size="22">preview_import · read-only inventory path</text><text x="44" y="400" font-size="19">Retain source and show P201:3.</text><text x="44" y="432" font-size="19">Observed inventory after preview: P100:4 only.</text><path d="M360 476v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="524" width="664" height="172" class="mint"/><text x="44" y="560" font-size="22" class="accent">confirm_import · the write boundary</text><text x="44" y="602" font-size="19">Re-parse retained source, validate, and check current inventory.</text><text x="44" y="634" font-size="19">P201 must still be absent inside the write transaction.</text><text x="44" y="666" font-size="19">After commit, fresh read: P100:4; P201:3.</text><rect x="28" y="742" width="316" height="204" class="pending"/><text x="44" y="778" font-size="21">Negative-input contrast</text><text x="44" y="820" font-size="17">Change P201,3 to P201,−1.</text><text x="44" y="852" font-size="17">Row 1: quantity_nonnegative</text><text x="44" y="884" font-size="17">Direct confirm: 0 writes.</text><text x="44" y="916" font-size="17">Fresh: P100:4 only.</text><rect x="376" y="742" width="316" height="204" class="pending"/><text x="392" y="778" font-size="21">Stale-preview contrast</text><text x="392" y="820" font-size="17">Same valid source P201,3.</text><text x="392" y="852" font-size="17">Other write creates P201:5.</text><text x="392" y="884" font-size="17">Confirm: sku_exists; 0 writes.</text><text x="392" y="916" font-size="17">Fresh: P100:4; P201:5.</text><text x="28" y="990" font-size="18">Authorization, HTTP, token persistence and other inputs remain unverified.</text></svg>
