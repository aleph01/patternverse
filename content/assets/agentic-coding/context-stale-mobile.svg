<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1025" viewBox="0 0 360 1025" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Reconcile a stale local note with a specific version contract</title><desc id="desc">For identical fictional CSV input, a stale RowReader 1.8.0 parse note conflicts with 2.1.0 resolution and vendor contract. Correct the active note to read with header true and rows/issues result; retain the old signature only as history. Product policy remains INV-01.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1025" class="paper"/><text x="20" y="32" font-size="17">Repair stale guidance with current evidence</text><text x="20" y="68" font-size="16">RowReader · fictional versions and contracts</text><rect x="20" y="105" width="320" height="102" class="neutral"/><text x="36" y="141" font-size="21">Same CSV operation</text><text x="36" y="183" font-size="20">sku,quantity / P201,3</text><rect x="20" y="251" width="320" height="146" class="pending"/><text x="36" y="287" font-size="21">Old note: 1.8.0</text><text x="36" y="330" font-size="20">reader.parse(text)</text><text x="36" y="362" font-size="20">Assumed list result</text><rect x="20" y="442" width="320" height="232" class="mint"/><text x="36" y="479" font-size="21" class="accent">Current evidence: 2.1.0</text><text x="36" y="522" font-size="18">Lockfile + loaded module agree</text><text x="36" y="553" font-size="18">Vendor contract for 2.1.0</text><text x="36" y="584" font-size="18">reader.read(text,</text><text x="36" y="615" font-size="18">{ header: true })</text><text x="36" y="646" font-size="18">rows + issues; quantity &quot;3&quot;</text><path d="M180 687v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="728" width="320" height="182" class="mint"/><text x="36" y="765" font-size="21" class="accent">Update the current note</text><text x="36" y="808" font-size="18">Link version + source + scope</text><text x="36" y="841" font-size="18">Guide → corrected 2.1.0 note</text><text x="36" y="874" font-size="18">Old signature: historical only</text><text x="20" y="961" font-size="17">Product policy still comes from INV-01.</text><text x="20" y="993" font-size="17">API evidence does not expand scope.</text></svg>
