<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1291" viewBox="0 0 360 1291" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A pre-commit worker termination preserves the selected atomic inventory policy</title><desc id="desc">The SQLite reference stages P201 then terminates before commit. A fresh connection sees only the baseline and a stale running record. Controlled retry commits both products and completion together. Later acknowledgement ambiguity and external delivery are not tested.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1291" class="paper"/><text x="20" y="32" font-size="20">Interrupt at a specified boundary</text><text x="20" y="68" font-size="17">J1 · executed SQLite reference probe</text><rect x="20" y="106" width="320" height="140" class="neutral"/><text x="36" y="142" font-size="18">Selected policy: all or nothing</text><text x="36" y="184" font-size="18">Initial inventory P100: 4</text><text x="36" y="216" font-size="18">J1 is recorded as running.</text><rect x="20" y="292" width="320" height="140" class="neutral"/><text x="36" y="328" font-size="21">Worker transaction</text><text x="36" y="370" font-size="18">BEGIN; stage P201: 3</text><text x="36" y="402" font-size="18">No COMMIT; P202 not written.</text><path d="M180 444v24m-5 -6l5 6l5 -6" class="line"/><text x="20" y="501" font-size="18" class="accent">Terminate worker before commit</text><rect x="20" y="529" width="320" height="172" class="mint"/><text x="36" y="565" font-size="19" class="accent">Fresh read after termination</text><text x="36" y="607" font-size="18">Only P100: 4 remains.</text><text x="36" y="639" font-size="18">J1 still says running.</text><text x="36" y="671" font-size="18">Reconcile the stale job status.</text><path d="M180 713v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="754" width="320" height="172" class="mint"/><text x="36" y="790" font-size="19" class="accent">Controlled retry: one commit</text><text x="36" y="832" font-size="17">P100:4, P201:3, P202:2</text><text x="36" y="864" font-size="17">J1 completed in same transaction</text><text x="36" y="896" font-size="17">Fresh connection verifies both.</text><rect x="20" y="972" width="320" height="204" class="pending"/><text x="36" y="1008" font-size="20">Still outside this probe</text><text x="36" y="1050" font-size="17">After-commit / before-ack failure</text><text x="36" y="1082" font-size="17">Real queue and message delivery</text><text x="36" y="1114" font-size="17">Batch-prefix policy needs its own</text><text x="36" y="1146" font-size="17">progress and resume expectations.</text><text x="20" y="1226" font-size="16">Arrows: observed reference sequence</text><text x="20" y="1259" font-size="17">Not a power-loss or production test.</text></svg>
