<svg xmlns="http://www.w3.org/2000/svg" width="720" height="870" viewBox="0 0 720 870" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Hypothetical review queue conservation</title><desc id="desc">A five-day ledger shows twelve arrivals and four completed reviews daily, leaving eight, sixteen, twenty-four, thirty-two and forty queued. Acceptance is unknown.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="870" class="paper"/><text x="32" y="32" font-size="22">Twelve arrive; four complete review</text><text x="32" y="68" font-size="19">Hypothetical · distinct review entries</text><rect x="32" y="104" width="656" height="140" class="neutral"/><text x="48" y="140" font-size="22">One day: previous queue + 12 − 4</text><text x="48" y="182" font-size="19">Net accumulation: 8 review entries per working day.</text><text x="48" y="214" font-size="19">Initial queue: 0. No returns, withdrawals or duplicates.</text><text x="48" y="310" font-size="19">Day</text><text x="188" y="310" font-size="19">Arrivals</text><text x="350" y="310" font-size="19">Reviews complete</text><text x="568" y="310" font-size="19">Queued</text><path d="M32 330H688" class="fine"/><text x="56" y="373" font-size="22">1</text><text x="204" y="373" font-size="22">12</text><text x="412" y="373" font-size="22">4</text><text x="592" y="373" font-size="22">8</text><path d="M32 388H688" class="fine"/><text x="56" y="425" font-size="22">2</text><text x="204" y="425" font-size="22">12</text><text x="412" y="425" font-size="22">4</text><text x="592" y="425" font-size="22">16</text><path d="M32 440H688" class="fine"/><text x="56" y="477" font-size="22">3</text><text x="204" y="477" font-size="22">12</text><text x="412" y="477" font-size="22">4</text><text x="592" y="477" font-size="22">24</text><path d="M32 492H688" class="fine"/><text x="56" y="529" font-size="22">4</text><text x="204" y="529" font-size="22">12</text><text x="412" y="529" font-size="22">4</text><text x="592" y="529" font-size="22">32</text><path d="M32 544H688" class="fine"/><text x="56" y="581" font-size="22">5</text><text x="204" y="581" font-size="22">12</text><text x="412" y="581" font-size="22">4</text><text x="592" y="581" font-size="22">40</text><path d="M32 596H688" class="fine"/><rect x="32" y="632" width="656" height="140" class="mint"/><text x="48" y="668" font-size="22" class="accent">Accepted and integrated: unknown</text><text x="48" y="710" font-size="19">Four completed reviews are not four accepted changes.</text><text x="48" y="742" font-size="19">The ledger establishes queue growth, not useful delivery.</text><text x="32" y="834" font-size="18">Constant rates are illustrative assumptions, not a forecast.</text></svg>
