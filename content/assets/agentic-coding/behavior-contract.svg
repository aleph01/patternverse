<svg xmlns="http://www.w3.org/2000/svg" width="720" height="942" viewBox="0 0 720 942" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">The frontend mock and backend fixture pass with incompatible field names</title><desc id="desc">The same preview token and endpoint are held fixed. A mock accepts the serializer’s import_id body while the backend fixture supplies preview_id. Connecting the shapes exposes the missing field; a corrected field still needs the full application path verified.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="942" class="paper"/><text x="28" y="32" font-size="23">Join the request shape the browser actually sends</text><text x="28" y="68" font-size="19">Same PV7 and confirmation endpoint · reference calculations only</text><rect x="28" y="106" width="664" height="108" class="neutral"/><text x="44" y="142" font-size="22">POST /imports/confirm</text><text x="44" y="184" font-size="20">Preview PV7 represents the same valid P201:3 and P202:2 input.</text><rect x="28" y="264" width="316" height="140" class="pending"/><text x="44" y="300" font-size="21">Frontend check: PASS</text><text x="44" y="342" font-size="18">Sends {import_id: &quot;PV7&quot;}</text><text x="44" y="374" font-size="18">Mock ignores body → success</text><rect x="376" y="264" width="316" height="140" class="neutral"/><text x="392" y="300" font-size="21">Backend check: PASS</text><text x="392" y="342" font-size="17">Fixture {preview_id: &quot;PV7&quot;}</text><text x="392" y="374" font-size="17">Actual required key → success</text><path d="M186 416v14H360v18m-5 -6l5 6l5 -6" class="line"/><path d="M534 416v14H360" class="line"/><rect x="28" y="466" width="664" height="172" class="mint"/><text x="44" y="502" font-size="22" class="accent">Connected shapes expose the mismatch</text><text x="44" y="544" font-size="19">Sent: {import_id: &quot;PV7&quot;}; handler requires preview_id</text><text x="44" y="576" font-size="19">Reference result: 400 · preview_id_required</text><text x="44" y="608" font-size="19">Real UI must show failure; rejection must leave storage unchanged.</text><rect x="28" y="684" width="664" height="140" class="mint"/><text x="44" y="720" font-size="21" class="accent">Correct only the field: {preview_id: &quot;PV7&quot;} → reference 200</text><text x="44" y="762" font-size="19">Then repeat the actual confirmation, write, reload, and fresh read.</text><text x="44" y="794" font-size="19">Keep the focused contract check for diagnosis.</text><text x="28" y="876" font-size="18">Arrows: omitted request-contract boundary, not a live HTTP trace</text><text x="28" y="910" font-size="18">Passing reference 200 is not evidence of persistent or user-visible completion.</text></svg>
