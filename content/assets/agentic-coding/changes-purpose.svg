<svg xmlns="http://www.w3.org/2000/svg" width="720" height="729" viewBox="0 0 720 729" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A large mechanical change can be conceptually narrow</title><desc id="desc">The counts 1200 and 40 are hypothetical. The internal helper rename has one intended purpose and keeps public behavior, whereas the short patch proposes three changes conflicting with the current contract. Size alone does not determine reviewability.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="729" class="paper"/><text x="28" y="32" font-size="23">Count purposes, not only changed lines</text><text x="28" y="68" font-size="19">Invented counts · no universal size threshold</text><rect x="28" y="107" width="316" height="325" class="mint"/><text x="44" y="146" font-size="23" class="accent">1,200 lines · one purpose</text><text x="44" y="193" font-size="19">Internal helper rename</text><text x="44" y="232" font-size="19">formatRowError</text><text x="44" y="271" font-size="19">→ formatImportRowError</text><text x="44" y="310" font-size="19">Update references</text><text x="44" y="349" font-size="19">Preserve public behavior</text><rect x="376" y="107" width="316" height="325" class="pending"/><text x="392" y="146" font-size="23">40 lines · three decisions</text><text x="392" y="193" font-size="20">Round fractions</text><text x="392" y="234" font-size="20">Overwrite existing SKUs</text><text x="392" y="275" font-size="20">Save partial invalid files</text><text x="392" y="350" font-size="19">Conflicts with current</text><text x="392" y="383" font-size="19">acceptance requirements</text><rect x="28" y="481" width="664" height="121" class="neutral"/><text x="44" y="519" font-size="22">Rename evidence still needed</text><text x="44" y="561" font-size="19">Reference audit, including dynamic uses; build + regression checks.</text><text x="28" y="655" font-size="21">A small diff can contain several consequential decisions.</text><text x="28" y="697" font-size="19">Mechanical does not mean unreviewed; counts are not thresholds.</text></svg>
