<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1233" viewBox="0 0 360 1233" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Resource permission separates permitted and denied rename paths</title><desc id="desc">The same U2 rename request targets P7 from Plan. A P7 editor reaches one write, while a P7 viewer or P8-only editor stops before writing. The authentication-only change wrongly admits both denied cases. Executed reference policy checks are not a production authorization assessment.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1233" class="paper"/><text x="20" y="32" font-size="21">Trace who can reach the writer</text><text x="20" y="68" font-size="16">Same U2 request · P7 · Plan → Revised</text><rect x="20" y="106" width="320" height="140" class="neutral"/><text x="36" y="142" font-size="20">Policy for this shared project</text><text x="36" y="184" font-size="16">Owner or current P7 editor may rename.</text><text x="36" y="216" font-size="16">Use server-established membership.</text><rect x="20" y="292" width="320" height="172" class="mint"/><text x="36" y="328" font-size="21" class="accent">Editor of P7 → permit</text><text x="36" y="370" font-size="18">Identity U2 → P7 role lookup</text><text x="36" y="402" font-size="18">Permission true → one write</text><text x="36" y="434" font-size="18">Title becomes Revised</text><rect x="20" y="510" width="320" height="172" class="pending"/><text x="36" y="546" font-size="18">Viewer P7 / editor P8 → deny</text><text x="36" y="588" font-size="18">Identity U2 → P7 role lookup</text><text x="36" y="620" font-size="18">Permission false → stop</text><text x="36" y="652" font-size="18">Zero writes; title stays Plan</text><rect x="20" y="728" width="320" height="172" class="pending"/><text x="36" y="764" font-size="18">Proposed guard checks identity</text><text x="36" y="806" font-size="16">if (!actor) return forbidden()</text><text x="36" y="838" font-size="16">Both relationship cases are logged in.</text><text x="36" y="870" font-size="16">The denied paths now reach a write.</text><rect x="20" y="946" width="320" height="172" class="mint"/><text x="36" y="982" font-size="20" class="accent">Restore resource permission</text><text x="36" y="1024" font-size="16">Keep allowed and denied checks.</text><text x="36" y="1056" font-size="16">Check response, title and write count.</text><text x="36" y="1088" font-size="16">Real route and lookup still untested.</text><text x="20" y="1168" font-size="14">Arrows within labels: request → decision → effect</text><text x="20" y="1201" font-size="17">Only the trusted relationship varies.</text></svg>
