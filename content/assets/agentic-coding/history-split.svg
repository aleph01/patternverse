<svg xmlns="http://www.w3.org/2000/svg" width="720" height="908" viewBox="0 0 720 908" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Purpose-based units preserve implementation and relevant tests</title><desc id="desc">The same final source and test files are compared as one mixed change or a confirmation unit B followed by rename N. Behavior assertions remain with B and are retained and rerun after N. Only B-to-N means ancestry; the final comparison concerns file bytes.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="908" class="paper"/><text x="28" y="32" font-size="23">Split by purpose, including within the same files</text><text x="28" y="68" font-size="18">Fictional local work · same input, baseline, assertions and final files</text><rect x="28" y="106" width="316" height="204" class="pending"/><text x="44" y="142" font-size="22">MIXED · one unit</text><text x="44" y="184" font-size="17">Add confirmation writer</text><text x="44" y="216" font-size="17">Rename parseRows to readRows</text><text x="44" y="248" font-size="17">Add feature assertions</text><text x="44" y="280" font-size="17">Update test helper imports</text><rect x="376" y="106" width="316" height="204" class="mint"/><text x="392" y="142" font-size="20" class="accent">B · confirmation + checks</text><text x="392" y="184" font-size="17">Keep parseRows as the name.</text><text x="392" y="216" font-size="17">Replace listed SKUs.</text><text x="392" y="248" font-size="17">Preserve absent stock.</text><text x="392" y="280" font-size="17">Include T2; T1/T2 pass.</text><path d="M534 334v24m-5 -6l5 6l5 -6" class="line"/><text x="376" y="393" font-size="17">B → N: parent-to-child order</text><rect x="376" y="422" width="316" height="204" class="mint"/><text x="392" y="458" font-size="20" class="accent">N · rename + references</text><text x="392" y="500" font-size="17">parseRows → readRows</text><text x="392" y="532" font-size="17">Update every source caller.</text><text x="392" y="564" font-size="17">Update test imports/calls.</text><text x="392" y="596" font-size="17">Keep assertions; T1/T2 pass.</text><rect x="28" y="422" width="316" height="172" class="neutral"/><text x="44" y="458" font-size="21">Both files mix purposes</text><text x="44" y="500" font-size="17">import.mjs</text><text x="44" y="532" font-size="17">import.test.mjs</text><text x="44" y="564" font-size="17">Do not split code from tests.</text><rect x="28" y="688" width="664" height="140" class="neutral"/><text x="44" y="724" font-size="23">N final files = MIXED final files</text><text x="44" y="766" font-size="20">Reference snapshots B and N load and pass their checks.</text><text x="44" y="798" font-size="20">Final file bytes match; no actual commits were split.</text><text x="28" y="874" font-size="18">Organized purposes help interpretation; byte equality is only one check.</text></svg>
