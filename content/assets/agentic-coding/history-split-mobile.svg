<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1087" viewBox="0 0 360 1087" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Two coherent purposes retain the same final files</title><desc id="desc">MIXED combines feature and rename changes within source and tests. B retains confirmation with its tests; N renames the helper and every caller while preserving assertions. Disposable reference snapshots pass and match final files, without modifying Git history.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1087" class="paper"/><text x="20" y="32" font-size="20">Separate purpose; retain final files</text><text x="20" y="68" font-size="15">Fictional local work · same CSV and stock</text><rect x="20" y="106" width="320" height="172" class="pending"/><text x="36" y="142" font-size="20">MIXED · feature + rename</text><text x="36" y="184" font-size="17">import.mjs: writer and helper name</text><text x="36" y="216" font-size="17">import.test.mjs: both purposes</text><text x="36" y="248" font-size="17">One unit hides two decisions.</text><text x="20" y="333" font-size="17">Reorganize owned, unshared work</text><rect x="20" y="368" width="320" height="172" class="mint"/><text x="36" y="404" font-size="20" class="accent">B · confirmation + its checks</text><text x="36" y="446" font-size="17">Keep parseRows as the name.</text><text x="36" y="478" font-size="17">Replace listed SKUs; retain others.</text><text x="36" y="510" font-size="17">T2 is included; T1/T2 pass.</text><path d="M180 552v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="605" width="320" height="172" class="mint"/><text x="36" y="641" font-size="20" class="accent">N · rename helper + references</text><text x="36" y="683" font-size="17">parseRows → readRows</text><text x="36" y="715" font-size="17">Update source and test callers.</text><text x="36" y="747" font-size="17">Keep assertions; rerun T1/T2.</text><rect x="20" y="831" width="320" height="172" class="neutral"/><text x="36" y="867" font-size="20">Reference comparison</text><text x="36" y="909" font-size="17">Final N files = final MIXED files.</text><text x="36" y="941" font-size="17">B and N both load and pass.</text><text x="36" y="973" font-size="17">No actual history split executed.</text><text x="20" y="1053" font-size="16">Arrow B → N: parent-to-child order</text></svg>
