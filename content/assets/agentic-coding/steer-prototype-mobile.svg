<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1151" viewBox="0 0 360 1151" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Prototype repair evidence has a defined boundary</title><desc id="desc">Both fictional prototype paths retain the same file and row-2 error. Adding a repair route supports one task walkthrough. Production conditions remain visibly separate and untested; no observed user research is claimed.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1151" class="paper"/><text x="20" y="32" font-size="20">What did the prototype establish?</text><text x="20" y="68" font-size="16">Constructed walkthrough · no user study</text><rect x="20" y="106" width="320" height="104" class="neutral"/><text x="36" y="143" font-size="18">Same file · row 2: invalid quantity</text><text x="36" y="184" font-size="18">File and other rows stay fixed.</text><rect x="20" y="256" width="320" height="104" class="pending"/><text x="36" y="293" font-size="21">A · “Cannot confirm” only</text><text x="36" y="334" font-size="17">Fictional participant gets stuck.</text><rect x="20" y="406" width="320" height="202" class="mint"/><text x="36" y="443" font-size="22" class="accent">B · repair path</text><text x="36" y="485" font-size="18">Fix row 2</text><text x="36" y="516" font-size="18">Open quantity field</text><text x="36" y="547" font-size="18">Retain file and other rows</text><text x="36" y="578" font-size="18">Return to preview</text><rect x="20" y="654" width="320" height="104" class="mint"/><text x="36" y="691" font-size="21" class="accent">Supported for this task</text><text x="36" y="732" font-size="17">Carry B into next design iteration.</text><rect x="20" y="804" width="320" height="232" class="pending"/><text x="36" y="841" font-size="17">Unresolved production conditions</text><text x="36" y="883" font-size="18">Authorization + persistence</text><text x="36" y="917" font-size="18">Keyboard + assistive tech</text><text x="36" y="951" font-size="18">Recovery after failure</text><text x="36" y="985" font-size="18">Representative load</text><text x="20" y="1086" font-size="17">Interaction evidence stays in scope.</text><text x="20" y="1119" font-size="17">No production-readiness conclusion.</text></svg>
