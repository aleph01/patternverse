<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1060" viewBox="0 0 720 1060" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Compare permitted and denied paths with the same actor, action and resource</title><desc id="desc">Only the trusted relationship differs across the U2 P7 rename cases. Resource authorization permits the P7 editor and denies the viewer or P8-only editor, preserving the denied state. An authentication-only guard loses that decision. The reference also checks owner and missing-actor cases outside this diagram.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="1060" class="paper"/><text x="28" y="32" font-size="23">A small guard change broadens the allowed writer</text><text x="28" y="68" font-size="19">Same U2 action and P7 starting state; vary only trusted relationship</text><rect x="28" y="106" width="664" height="108" class="neutral"/><text x="44" y="142" font-size="22">U2 → rename P7 from Plan to Revised</text><text x="44" y="184" font-size="18">Policy: P7 owner or current P7 editor; authenticated identity alone is insufficient.</text><rect x="28" y="264" width="316" height="140" class="neutral"/><text x="44" y="300" font-size="21">Permitted relationship</text><text x="44" y="342" font-size="18">Server lookup: editor of P7</text><text x="44" y="374" font-size="18">Identity: U2 · target: P7</text><rect x="376" y="264" width="316" height="140" class="neutral"/><text x="392" y="300" font-size="21">Denied relationships</text><text x="392" y="342" font-size="17">Viewer P7 or editor P8 only</text><text x="392" y="374" font-size="17">Identity: U2 · target: P7</text><path d="M186 416v24m-5 -6l5 6l5 -6" class="line"/><path d="M534 416v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="457" width="316" height="140" class="mint"/><text x="44" y="493" font-size="20" class="accent">Resource permission: true</text><text x="44" y="535" font-size="18">Permit the requested rename.</text><text x="44" y="567" font-size="18">Continue to the writer.</text><rect x="376" y="457" width="316" height="140" class="pending"/><text x="392" y="493" font-size="20">Resource permission: false</text><text x="392" y="535" font-size="18">Deny the requested rename.</text><text x="392" y="567" font-size="18">Stop before the writer.</text><path d="M186 609v24m-5 -6l5 6l5 -6" class="line"/><path d="M534 609v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="650" width="316" height="140" class="mint"/><text x="44" y="686" font-size="22" class="accent">State effect</text><text x="44" y="728" font-size="20">One write</text><text x="44" y="760" font-size="20">Title: Revised</text><rect x="376" y="650" width="316" height="140" class="pending"/><text x="392" y="686" font-size="22">State effect</text><text x="392" y="728" font-size="20">Zero writes</text><text x="392" y="760" font-size="20">Title: Plan</text><rect x="28" y="836" width="664" height="140" class="mint"/><text x="44" y="872" font-size="20" class="accent">Proposed identity-only guard: if (!actor) return forbidden()</text><text x="44" y="914" font-size="18">U2 is authenticated in both cases; denied relationships would also write.</text><text x="44" y="946" font-size="18">Disposition: restore resource-specific permission and meaningful checks.</text><text x="28" y="1028" font-size="18">Arrows: request identity → resource decision → write or unchanged state</text></svg>
