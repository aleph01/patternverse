</style><rect width="360" height="1022" class="paper"/><text x="20" y="32" font-size="19">Documentation: relevant evidence</text><text x="20" y="68" font-size="18">DOC-D · fictional review record</text><rect x="20" y="104" width="320" height="98" class="neutral"/><text x="36" y="139" font-size="18">Before: sample contradicts rule</text><text x="36" y="177" font-size="21">P202,-1 accepted</text><rect x="20" y="226" width="320" height="98" class="mint"/><text x="36" y="261" font-size="18">After: non-negative quantity</text><text x="36" y="299" font-size="21" class="accent">P202,0 accepted</text><text x="20" y="371" font-size="21">Evidence at DOC-D</text><path d="M20 399H340" class="fine"/><text x="28" y="429" font-size="19" class="accent">Accuracy</text><text x="28" y="460" font-size="18">P202,0 agrees with rule</text><path d="M20 486H340" class="fine"/><text x="28" y="516" font-size="19" class="accent">Links</text><text x="28" y="547" font-size="18">Import reference resolves</text><path d="M20 573H340" class="fine"/><text x="28" y="603" font-size="19" class="accent">Preview</text><text x="28" y="634" font-size="18">Desktop + phone inspected</text><path d="M20 660H340" class="fine"/><text x="28" y="690" font-size="19" class="accent">Scope</text><text x="28" y="721" font-size="18">Documentation-only diff</text><rect x="20" y="778" width="320" height="126" class="pending"/><text x="36" y="815" font-size="18">Runtime tests: not applicable</text><text x="36" y="846" font-size="18">No executable change</text><text x="36" y="877" font-size="18">Not recorded as passed</text><text x="20" y="953" font-size="21" class="accent">Ready for review</text><text x="20" y="990" font-size="19">Publication not established</text></svg>
