<svg xmlns="http://www.w3.org/2000/svg" width="720" height="992" viewBox="0 0 720 992" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Compatibility across an additive and constrained unit transition</title><desc id="desc">The matrix records tested named-column reference client support at D0, nullable D1 and backfilled constrained D2. Default each keeps A0 inserts valid. The no-default counterexample fails despite a valid new-client representation. Quantity meaning is fixed throughout; the reference does not certify online migration.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="992" class="paper"/><text x="28" y="32" font-size="23">Implicit each → explicit each, with compatible writers</text><text x="28" y="68" font-size="18">Named-column SQL · unchanged quantities · executed SQLite references</text><rect x="28" y="106" width="230" height="64" class="neutral"/><rect x="258" y="106" width="217" height="64" class="neutral"/><rect x="475" y="106" width="217" height="64" class="neutral"/><text x="44" y="146" font-size="20">Schema state</text><text x="274" y="146" font-size="20">A0 · old client</text><text x="491" y="146" font-size="20">A1 · new client</text><rect x="28" y="170" width="230" height="130" class="fine"/><rect x="258" y="170" width="217" height="130" class="fine"/><rect x="475" y="170" width="217" height="130" class="fine"/><text x="44" y="208" font-size="18">D0</text><text x="44" y="242" font-size="18">No unit column</text><text x="274" y="208" font-size="18">YES</text><text x="274" y="242" font-size="18">Named columns</text><text x="491" y="208" font-size="18">NO</text><text x="491" y="242" font-size="18">unit is absent</text><rect x="28" y="300" width="230" height="162" class="fine"/><rect x="258" y="300" width="217" height="162" class="fine"/><rect x="475" y="300" width="217" height="162" class="fine"/><text x="44" y="338" font-size="18">D1</text><text x="44" y="372" font-size="18">Nullable unit</text><text x="274" y="338" font-size="18">YES</text><text x="274" y="372" font-size="18">May insert NULL</text><text x="491" y="338" font-size="18">YES</text><text x="491" y="372" font-size="18">NULL means each</text><text x="491" y="406" font-size="18">Writes each</text><rect x="28" y="462" width="230" height="194" class="mint"/><rect x="258" y="462" width="217" height="194" class="mint"/><rect x="475" y="462" width="217" height="194" class="mint"/><text x="44" y="500" font-size="18">D2</text><text x="44" y="534" font-size="18">Backfill + constraint</text><text x="44" y="568" font-size="18">Default each</text><text x="274" y="500" font-size="18">YES</text><text x="274" y="534" font-size="18">Omitted unit</text><text x="274" y="568" font-size="18">receives default</text><text x="491" y="500" font-size="18">YES</text><text x="491" y="534" font-size="18">Writes each</text><text x="491" y="568" font-size="18">No NULL units</text><text x="28" y="704" font-size="18">Rows follow planned D0 → D1 → D2 order; YES means tested client scope.</text><rect x="28" y="736" width="664" height="140" class="pending"/><text x="44" y="772" font-size="22">Rejected alternative · required unit with no default</text><text x="44" y="814" font-size="19">A0 omits unit in its named-column INSERT; the insert fails.</text><text x="44" y="846" font-size="19">Retaining default each at D2 preserves that legacy writer.</text><text x="28" y="920" font-size="18">Fresh D2 quantities: P100:4, P201:3, P202:2, P203:1, P204:0.</text><text x="28" y="958" font-size="18">All units are each. Tiny table reconstruction is not an online-migration test.</text></svg>
