<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1279" viewBox="0 0 360 1279" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Narrow a timeout explanation while preserving uncertainty</title><desc id="desc">Constructed R17 parser completion rules out ongoing parsing. An identified TX9 lock establishes database contention as a contributor. Worker result delivery remains unobserved; the hypotheses need not be exclusive or exhaustive.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1279" class="paper"/><text x="20" y="32" font-size="19">Which stage explains the timeout?</text><text x="20" y="68" font-size="17">R17 · constructed 3,000 ms deadline</text><rect x="20" y="106" width="320" height="168" class="pending"/><text x="36" y="142" font-size="21">Competing explanations</text><text x="36" y="184" font-size="18">H1 · slow parsing</text><text x="36" y="214" font-size="18">H2 · database contention</text><text x="36" y="244" font-size="18">H3 · disconnected result path</text><rect x="20" y="320" width="320" height="154" class="neutral"/><text x="36" y="357" font-size="19">Observation 1 · same request</text><text x="36" y="398" font-size="18">Parsing ends at 12 ms</text><text x="36" y="427" font-size="18">DB waits from 14 ms; pending</text><text x="36" y="456" font-size="18">at the 3,000 ms deadline</text><path d="M180 486v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="527" width="320" height="126" class="neutral"/><text x="36" y="564" font-size="20">H1: not the ongoing wait</text><text x="36" y="606" font-size="18">DB wait cause still unresolved.</text><text x="36" y="634" font-size="18">H3 delivery evidence missing.</text><path d="M180 665v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="706" width="320" height="154" class="mint"/><text x="36" y="743" font-size="20" class="accent">Observation 2 · lock record</text><text x="36" y="785" font-size="17">TX9 blocks R17: 14 → 4,014 ms</text><text x="36" y="814" font-size="17">4,000 ms of database lock wait</text><text x="36" y="843" font-size="17">Positive evidence of contention</text><rect x="20" y="906" width="320" height="106" class="mint"/><text x="36" y="943" font-size="21" class="accent">H2 is a contributor</text><text x="36" y="984" font-size="18">Next: inspect TX9 boundary</text><rect x="20" y="1058" width="320" height="106" class="pending"/><text x="36" y="1095" font-size="21">H3 remains possible</text><text x="36" y="1136" font-size="18">Next: trace result delivery</text><text x="20" y="1214" font-size="16">Arrows: evidence narrows diagnosis</text><text x="20" y="1247" font-size="17">No probabilities; no measured trace.</text></svg>
