<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1070" viewBox="0 0 720 1070" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Installed code and serving admission have different controls</title><desc id="desc">Two independent controls identify installed artifact A7 and project admission F7. Constructed I7 evidence triggers a stop even though its status is completed. Disabling blocks new reference admissions without reversing code or committed data. No real rollout, telemetry or cancellation was executed.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="1070" class="paper"/><text x="28" y="32" font-size="23">Deployment does not grant import admission</text><text x="28" y="68" font-size="18">Fictional R7 · explicit group · no production observations or rates</text><rect x="28" y="106" width="316" height="172" class="neutral"/><text x="44" y="142" font-size="22">Deployment · A7</text><text x="44" y="184" font-size="18">Installed artifact A7</text><text x="44" y="216" font-size="18">Source MAIN7 · schema D1</text><text x="44" y="248" font-size="18">F7 does not replace code.</text><rect x="376" y="106" width="316" height="172" class="mint"/><text x="392" y="142" font-size="21" class="accent">Exposure authority · F7</text><text x="392" y="184" font-size="18">Admit authorized P7/P8.</text><text x="392" y="216" font-size="18">Exclude P9.</text><text x="392" y="248" font-size="18">Worker checks before start.</text><path d="M534 292v24m-5 -6l5 6l5 -6" class="line"/><text x="28" y="358" font-size="18">Admission creates work to observe; completion is only one signal.</text><rect x="28" y="386" width="664" height="172" class="pending"/><text x="44" y="422" font-size="22">Constructed I7 evidence · P7</text><text x="44" y="464" font-size="19">Status: completed · expected: reject existing SKUs without writes.</text><text x="44" y="496" font-size="19">P100: 4 → 99; P900: 8 → 70</text><text x="44" y="528" font-size="19">The create-only integrity rule is violated.</text><path d="M360 572v24m-5 -6l5 6l5 -6" class="line"/><text x="28" y="638" font-size="18">Evidence determines the stop decision; missing evidence would hold.</text><rect x="28" y="666" width="664" height="140" class="mint"/><text x="44" y="702" font-size="22" class="accent">Pause expansion and disable new admissions</text><text x="44" y="744" font-size="19">F7 off: P7/P8 denied; queued J8 cannot start in the reference.</text><text x="44" y="776" font-size="19">Verify real propagation and already admitted or in-flight work.</text><rect x="28" y="852" width="316" height="140" class="neutral"/><text x="44" y="888" font-size="21">Code remains installed</text><text x="44" y="930" font-size="17">Artifact A7 is still present.</text><text x="44" y="962" font-size="17">No deployment was reversed.</text><rect x="376" y="852" width="316" height="140" class="pending"/><text x="392" y="888" font-size="21">Committed data remains</text><text x="392" y="930" font-size="17">P100:99; P900:70</text><text x="392" y="962" font-size="17">Disabling does not repair it.</text><text x="28" y="1036" font-size="18">Arrows: admitted work → observations → containment decision.</text></svg>
