<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1630" viewBox="0 0 360 1630" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A fictional trace identifies the overwrite decision</title><desc id="desc">IMP42 and D7 link to C1 preview and C2 confirmation. Parent-to-child ancestry, reviewed range, integration mapping and release identity are distinct labeled relationships. T1 and T2 reference checks were executed; review, integration and release labels are fictional.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1630" class="paper"/><text x="20" y="32" font-size="20">Recover the overwrite decision</text><text x="20" y="68" font-size="16">Fictional IDs · no release executed</text><rect x="20" y="106" width="320" height="172" class="neutral"/><text x="36" y="142" font-size="20">IMP42 · accepted revision D7</text><text x="36" y="184" font-size="17">Listed SKUs replace quantities.</text><text x="36" y="216" font-size="17">Absent SKUs remain unchanged.</text><text x="36" y="248" font-size="17">D7 supersedes create-only policy.</text><path d="M180 288v22m-5 -6l5 6l5 -6" class="line"/><text x="20" y="340" font-size="16">Purpose links to implementation</text><rect x="20" y="366" width="320" height="172" class="neutral"/><text x="36" y="402" font-size="20">C1 · add preview + T1</text><text x="36" y="444" font-size="17">P100:99 → replace</text><text x="36" y="476" font-size="17">P201:3 → create</text><text x="36" y="508" font-size="17">T1: no inventory writes</text><path d="M180 548v22m-5 -6l5 6l5 -6" class="line"/><text x="20" y="600" font-size="16">C1 → C2: parent to child</text><rect x="20" y="626" width="320" height="172" class="mint"/><text x="36" y="662" font-size="20" class="accent">C2 · add confirmation + T2</text><text x="36" y="704" font-size="17">D7 explains the replacement rule.</text><text x="36" y="736" font-size="17">T2: P100:99; P201:3</text><text x="36" y="768" font-size="17">P900 stays 8.</text><path d="M180 808v22m-5 -6l5 6l5 -6" class="line"/><text x="20" y="860" font-size="16">Evidence at C2 supports assessment</text><rect x="20" y="886" width="320" height="172" class="neutral"/><text x="36" y="922" font-size="20">R2 · assess H0..C2</text><text x="36" y="964" font-size="17">Reviewed range is named.</text><text x="36" y="996" font-size="17">T1 and T2 identify C2.</text><text x="36" y="1028" font-size="17">Approval is not integration.</text><path d="M180 1068v22m-5 -6l5 6l5 -6" class="line"/><text x="20" y="1120" font-size="16">Map reviewed head into shared history</text><rect x="20" y="1146" width="320" height="140" class="neutral"/><text x="36" y="1182" font-size="20">M2 · integrated version</text><text x="36" y="1224" font-size="17">Parents: H0 and C2</text><text x="36" y="1256" font-size="17">I2: separate integration evidence</text><path d="M180 1296v22m-5 -6l5 6l5 -6" class="line"/><text x="20" y="1348" font-size="16">REL7 records source and build identity</text><rect x="20" y="1374" width="320" height="172" class="pending"/><text x="36" y="1410" font-size="20">REL7 · source M2</text><text x="36" y="1452" font-size="17">Artifact A7 · configuration CFG2</text><text x="36" y="1484" font-size="17">Real records need actual digests.</text><text x="36" y="1516" font-size="17">No running-state proof here.</text><text x="20" y="1596" font-size="16">Connectors mean their written relation.</text></svg>
