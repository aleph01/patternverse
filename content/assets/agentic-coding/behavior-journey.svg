<svg xmlns="http://www.w3.org/2000/svg" width="720" height="943" viewBox="0 0 720 943" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Trace a valid and invalid import through storage and a fresh reload read</title><desc id="desc">The same create-only contract requires persisted new products after confirmation and unchanged baseline after invalid confirmation. The two scenarios use isolated initial state. The diagram specifies the complete browser path; executed SQLite probes establish only the reference storage outcomes.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="943" class="paper"/><text x="28" y="32" font-size="23">Confirmation is not complete at the success display</text><text x="28" y="68" font-size="18">Planned browser journeys · storage outcomes checked in a SQLite reference</text><rect x="28" y="106" width="664" height="108" class="neutral"/><text x="44" y="142" font-size="22">Separate isolated baseline for each scenario</text><text x="44" y="184" font-size="20">Stored P100: 4 · preview writes nothing · existing stock must remain.</text><text x="28" y="260" font-size="22" class="accent">Valid file</text><text x="376" y="260" font-size="22">Invalid file</text><rect x="28" y="289" width="316" height="140" class="neutral"/><text x="44" y="325" font-size="21">1 · Upload → preview</text><text x="44" y="367" font-size="17">P201: 3; P202: 2 shown</text><text x="44" y="399" font-size="17">Stored inventory still P100: 4</text><rect x="376" y="289" width="316" height="140" class="neutral"/><text x="392" y="325" font-size="21">1 · Upload → preview</text><text x="392" y="367" font-size="17">P201: 3; P202: −1</text><text x="392" y="399" font-size="17">Row 2: quantity_nonnegative</text><path d="M186 441v24m-5 -6l5 6l5 -6" class="line"/><path d="M534 441v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="482" width="316" height="140" class="mint"/><text x="44" y="518" font-size="21" class="accent">2 · Confirm → storage</text><text x="44" y="560" font-size="17">POST /imports/confirm</text><text x="44" y="592" font-size="17">P100:4, P201:3, P202:2</text><rect x="376" y="482" width="316" height="140" class="pending"/><text x="392" y="518" font-size="21">2 · Reject confirmation</text><text x="392" y="560" font-size="17">Block normal confirm; reject at server</text><text x="392" y="592" font-size="17">No inventory writes</text><path d="M186 634v24m-5 -6l5 6l5 -6" class="line"/><path d="M534 634v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="675" width="316" height="140" class="mint"/><text x="44" y="711" font-size="20" class="accent">3 · Reload → fresh read</text><text x="44" y="753" font-size="17">GET /inventory → storage</text><text x="44" y="785" font-size="17">Response renders all three products</text><rect x="376" y="675" width="316" height="140" class="pending"/><text x="392" y="711" font-size="20">3 · Reload → fresh read</text><text x="392" y="753" font-size="17">GET /inventory → storage</text><text x="392" y="785" font-size="17">Response shows only P100: 4</text><text x="28" y="869" font-size="18">A fresh read must cross storage; a cached screen cannot establish persistence.</text><text x="28" y="911" font-size="18">Arrows: required verification sequence, not an executed browser trace</text></svg>
