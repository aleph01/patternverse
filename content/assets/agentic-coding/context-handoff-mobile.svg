<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1084" viewBox="0 0 360 1084" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A handoff preserves evidence, working changes, and uncertainty</title><desc id="desc">Fictional IMPORT-F parser checks pass. Uncommitted PREVIEW-D1 affects upload.ts and preview.ts, where H-2 reports row 3 instead of row 2. Confirmation is unknown and unwired. Double header offset remains a hypothesis.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1084" class="paper"/><text x="20" y="32" font-size="17">Handoff: claims need a state and a source</text><text x="20" y="68" font-size="16">Fictional branch, revisions, diff, and results</text><rect x="20" y="106" width="320" height="126" class="neutral"/><text x="36" y="141" font-size="21">codex/import-preview</text><text x="36" y="180" font-size="19">BASE-E → IMPORT-F</text><text x="36" y="210" font-size="19">+ uncommitted PREVIEW-D1</text><rect x="20" y="279" width="320" height="142" class="mint"/><text x="36" y="315" font-size="18" class="accent">Parser complete for these cases</text><text x="36" y="356" font-size="20">IMPORT-F</text><text x="36" y="388" font-size="20">Focused checks: passed</text><rect x="20" y="467" width="320" height="240" class="pending"/><text x="36" y="503" font-size="21">Preview unfinished</text><text x="36" y="546" font-size="18">upload.ts + preview.ts</text><text x="36" y="580" font-size="18">IMPORT-F + PREVIEW-D1</text><text x="36" y="614" font-size="18">Run H-2: failed</text><text x="36" y="648" font-size="18">Expected row 2 · observed row 3</text><rect x="20" y="753" width="320" height="114" class="pending"/><text x="36" y="790" font-size="21">Confirmation: unknown</text><text x="36" y="832" font-size="20">Save path not wired</text><text x="20" y="917" font-size="18">Next hypothesis, not a diagnosis:</text><text x="20" y="950" font-size="18">Header offset applied twice?</text><text x="20" y="983" font-size="18">Inspect diff; rerun the same case.</text><text x="20" y="1052" font-size="18">A note does not back up the code.</text></svg>
