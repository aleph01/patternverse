<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1275" viewBox="0 0 360 1275" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Planned browser journeys include the persistence and reload boundary</title><desc id="desc">Both scenarios start separately from P100:4. The valid path previews, confirms, persists, reloads and reads three products. The invalid path requires a row-2 error, server rejection and unchanged state. Only SQLite reference state checks were executed, not the proposed browser journeys.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1275" class="paper"/><text x="20" y="32" font-size="19">Follow confirmation into stored state</text><text x="20" y="68" font-size="15">Planned browser journey · reference DB checks</text><rect x="20" y="106" width="320" height="140" class="neutral"/><text x="36" y="142" font-size="19">Isolated baseline per scenario</text><text x="36" y="184" font-size="17">P100: 4; no imported products</text><text x="36" y="216" font-size="17">Preview must not write.</text><text x="20" y="292" font-size="20" class="accent">Valid file · two new products</text><rect x="20" y="320" width="320" height="140" class="neutral"/><text x="36" y="356" font-size="21">1 · Upload → preview</text><text x="36" y="398" font-size="18">P201: 3; P202: 2 shown</text><text x="36" y="430" font-size="18">Storage still P100: 4</text><path d="M180 472v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="513" width="320" height="140" class="mint"/><text x="36" y="549" font-size="21" class="accent">2 · Confirm → storage</text><text x="36" y="591" font-size="17">POST /imports/confirm</text><text x="36" y="623" font-size="17">Persist P100:4, P201:3, P202:2</text><path d="M180 665v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="706" width="320" height="172" class="mint"/><text x="36" y="742" font-size="21" class="accent">3 · Reload → fresh read</text><text x="36" y="784" font-size="18">GET /inventory</text><text x="36" y="816" font-size="18">Storage → response → render</text><text x="36" y="848" font-size="18">Same three products required</text><rect x="20" y="924" width="320" height="236" class="pending"/><text x="36" y="960" font-size="18">Invalid file · separate baseline</text><text x="36" y="1002" font-size="17">Upload P201,3 then P202,-1</text><text x="36" y="1034" font-size="17">Preview: row 2 error</text><text x="36" y="1066" font-size="17">quantity_nonnegative</text><text x="36" y="1098" font-size="17">Confirm: reject; no writes</text><text x="36" y="1130" font-size="17">Fresh read: only P100: 4</text><text x="20" y="1210" font-size="16">Arrows: planned verification sequence</text><text x="20" y="1243" font-size="16">Reload must cause a fresh storage read.</text></svg>
