<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1204" viewBox="0 0 360 1204" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A compatible preparation precedes a dependent confirmation feature</title><desc id="desc">S0 preview is followed by P1 extraction with the same preview cases and no confirmation capability. K1 starts from the planned shared preparation and adds confirmation checks. The labeled arrows describe a proposed integration sequence, not completed source-control operations or release.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1204" class="paper"/><text x="20" y="32" font-size="19">Integrate a working preparation first</text><text x="20" y="68" font-size="16">Fictional sequence · release is separate</text><rect x="20" y="106" width="320" height="172" class="neutral"/><text x="36" y="142" font-size="20">S0 · working preview</text><text x="36" y="184" font-size="17">Inline quantity checks</text><text x="36" y="216" font-size="17">Data row 2 stays row 2.</text><text x="36" y="248" font-size="17">No confirmation function</text><path d="M180 290v24m-5 -6l5 6l5 -6" class="line"/><text x="20" y="344" font-size="16">Extract; verify against shared code</text><rect x="20" y="370" width="320" height="172" class="mint"/><text x="36" y="406" font-size="20" class="accent">P1 · shared preparation</text><text x="36" y="448" font-size="17">Preview calls validateQuantity.</text><text x="36" y="480" font-size="17">Same response and error codes</text><text x="36" y="512" font-size="17">No confirmation function</text><path d="M180 554v24m-5 -6l5 6l5 -6" class="line"/><text x="20" y="608" font-size="16">Then start K1 from shared P1</text><rect x="20" y="634" width="320" height="204" class="mint"/><text x="36" y="670" font-size="20" class="accent">K1 · confirmation + checks</text><text x="36" y="712" font-size="17">Reuse the shared validator.</text><text x="36" y="744" font-size="17">P201:3 → accepted; 1 write</text><text x="36" y="776" font-size="17">P201:3.5 → rejected; 0 writes</text><text x="36" y="808" font-size="17">Existing preview cases still pass.</text><rect x="20" y="884" width="320" height="204" class="neutral"/><text x="36" y="920" font-size="20">Intermediate-state checks</text><text x="36" y="962" font-size="17">0, 3: accepted by preview</text><text x="36" y="994" font-size="17">−1: quantity_nonnegative</text><text x="36" y="1026" font-size="17">3.5: quantity_whole</text><text x="36" y="1058" font-size="17">501: quantity_max_500</text><text x="20" y="1138" font-size="16">Arrows: planned integration dependency</text><text x="20" y="1170" font-size="15">Reference modules ran; no commits landed.</text></svg>
