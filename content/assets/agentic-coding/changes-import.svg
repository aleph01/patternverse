<svg xmlns="http://www.w3.org/2000/svg" width="720" height="893" viewBox="0 0 720 893" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Compare one import review with two coherent dependent units</title><desc id="desc">The same fictional feature requirements are held constant. U1 covers read-only preview and its evidence, U2 confirmation and transactional checks. The arrow identifies a logical review/base dependency and intended integration order, not actual commits or releases.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="893" class="paper"/><text x="28" y="32" font-size="23">Split the review, retain the requirements</text><text x="28" y="68" font-size="19">Fictional change plan · no completed integrations</text><rect x="28" y="107" width="664" height="145" class="neutral"/><text x="44" y="144" font-size="22">Same parent requirements in both views</text><text x="44" y="185" font-size="20">P: preview row errors; invalid files write nothing</text><text x="44" y="219" font-size="20">C: confirm all rows or none; reject existing identifiers</text><rect x="28" y="307" width="316" height="329" class="pending"/><text x="44" y="347" font-size="22">One combined review</text><text x="44" y="394" font-size="20">Preview + confirmation</text><text x="44" y="431" font-size="20">Validation, UI, transaction</text><text x="44" y="468" font-size="20">All P + C evidence at once</text><text x="44" y="599" font-size="19">One diff, several concerns</text><rect x="376" y="307" width="316" height="143" class="mint"/><text x="392" y="345" font-size="22" class="accent">U1 · read-only preview</text><text x="392" y="387" font-size="20">P202,-1 → row 2 error</text><text x="392" y="419" font-size="20">P100 stays 4</text><path d="M534 462v24m-5 -6l5 6l5 -6" class="line"/><rect x="376" y="503" width="316" height="154" class="mint"/><text x="392" y="541" font-size="22" class="accent">U2 · confirmation</text><text x="392" y="583" font-size="17">Depends on U1</text><text x="392" y="617" font-size="17">All-or-none + existing-SKU checks</text><rect x="28" y="705" width="664" height="107" class="neutral"/><text x="44" y="742" font-size="20">Intended after U1: usable preview; parent still incomplete</text><text x="44" y="784" font-size="21">No confirmation control or import write route.</text><text x="28" y="861" font-size="18">Arrow: review/base dependency · queue awaits workload evidence</text></svg>
