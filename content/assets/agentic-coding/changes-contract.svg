<svg xmlns="http://www.w3.org/2000/svg" width="720" height="918" viewBox="0 0 720 918" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Separate frontend and backend reviews retain a shared dependency</title><desc id="desc">Fictional agreed preview response uses row. B1 follows it but F1 uses line in its mock and renderer. Isolated checks can pass while the combined path fails. Contract and combined evidence are prerequisites to closing the frontend review.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="918" class="paper"/><text x="28" y="32" font-size="23">Two branches still share an interface</text><text x="28" y="68" font-size="18">Fictional B1 + F1 · separate checks can miss a mismatch</text><rect x="28" y="107" width="664" height="140" class="mint"/><text x="44" y="144" font-size="22" class="accent">Agreed contract: row, excluding the header</text><text x="44" y="184" font-size="21">POST /imports/preview</text><text x="44" y="221" font-size="20">errors: [{ row: 2, code: &quot;quantity_nonnegative&quot; }]</text><path d="M186 259v24m-5 -6l5 6l5 -6" class="line"/><path d="M534 259v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="300" width="316" height="174" class="neutral"/><text x="44" y="339" font-size="22">B1 · backend lane</text><text x="44" y="382" font-size="19">Actual response: row: 2</text><text x="44" y="419" font-size="19">Own branch check: passes</text><rect x="376" y="300" width="316" height="174" class="pending"/><text x="392" y="339" font-size="22">F1 · frontend lane</text><text x="392" y="382" font-size="19">Mock: line: 2</text><text x="392" y="415" font-size="19">Renderer reads line</text><text x="392" y="448" font-size="19">Own branch check: passes</text><path d="M186 486v25H360v22m-5 -6l5 6l5 -6" class="line"/><path d="M534 486v25H360" class="line"/><rect x="28" y="551" width="664" height="132" class="pending"/><text x="44" y="589" font-size="21">Combined path: response has row; renderer expects line</text><text x="44" y="631" font-size="20">The row number disappears despite two passing branch checks.</text><rect x="28" y="730" width="664" height="107" class="mint"/><text x="44" y="767" font-size="22" class="accent">Correct F1 mock + renderer to use row</text><text x="44" y="809" font-size="18">Verify the actual endpoint-to-screen path against the combined base.</text><text x="28" y="886" font-size="17">Arrows: contract and combined-review dependencies, not merge commands</text></svg>
