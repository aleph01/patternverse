<svg xmlns="http://www.w3.org/2000/svg" width="720" height="953" viewBox="0 0 720 953" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A clean textual combination can still contain a semantic conflict</title><desc id="desc">Two fictional schema proposals from the same baseline disagree about mutable SKU labels and immutable SKU references. The unchanged product ID PR-7 and renamed SKU expose the mismatch. The declarations are schematic, not an applied migration or a particular schema language.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="953" class="paper"/><text x="28" y="32" font-size="23">Different files. Conflicting identity.</text><text x="28" y="68" font-size="19">Fictional schematic declarations, one baseline</text><rect x="28" y="107" width="316" height="220" class="pending"/><text x="44" y="146" font-size="22">A · products.schema</text><text x="44" y="192" font-size="20">− identity: sku</text><text x="44" y="230" font-size="20">+ identity: product_id</text><text x="44" y="268" font-size="20">+ sku: editable_label</text><rect x="376" y="107" width="316" height="220" class="pending"/><text x="392" y="146" font-size="22">B · stock.schema</text><text x="392" y="192" font-size="20">− product_ref: sku</text><text x="392" y="230" font-size="20">+ product_ref:</text><text x="392" y="268" font-size="20">immutable_sku</text><text x="28" y="379" font-size="21">Different files; no overlapping lines by construction.</text><rect x="28" y="424" width="664" height="140" class="neutral"/><text x="44" y="462" font-size="22">Same product PR-7; product_id unchanged</text><text x="44" y="505" font-size="21">Editable SKU: P100 → P101</text><text x="44" y="538" font-size="21">Stock reference remains P100</text><rect x="28" y="611" width="664" height="112" class="pending"/><text x="44" y="649" font-size="22">P100 no longer matches the product SKU P101</text><text x="44" y="691" font-size="17">A constraint may reject the rename; otherwise the reference is unresolved.</text><rect x="28" y="770" width="664" height="101" class="mint"/><text x="44" y="808" font-size="22" class="accent">Hold both proposals for a shared identity decision</text><text x="44" y="849" font-size="20">Then align references, migration compatibility, and checks.</text><text x="28" y="921" font-size="18">Schematic proposals only; no migration or merge experiment executed.</text></svg>
