<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1060" viewBox="0 0 720 1060" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Blocked importer work and proposed flow</title><desc id="desc">A fictional initial dependency graph and a proposed one-increment policy retain the same contract obligation. B18 withdrawal does not count as acceptance. No follow-up observations exist.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="1060" class="paper"/><text x="32" y="32" font-size="22">Resolve the dependency; finish I18</text><text x="32" y="68" font-size="19">Fictional identifiers · no measured result</text><text x="32" y="120" font-size="20">Initial snapshot · four tasks started; two increments</text><rect x="48" y="148" width="624" height="108" class="neutral"/><text x="64" y="184" font-size="22">C18 · shared error contract</text><text x="64" y="226" font-size="19">Waiting for review: logical row convention unsettled.</text><path d="M144 310V282H360V272m-5 6l5 -6l5 6" class="line"/><path d="M360 310V282" class="line"/><path d="M576 310V282H360" class="line"/><rect x="48" y="326" width="192" height="108" class="neutral"/><text x="64" y="362" font-size="19">V18 · validation</text><text x="64" y="404" font-size="17">Requires C18</text><rect x="264" y="326" width="192" height="108" class="neutral"/><text x="280" y="362" font-size="19">U18 · display</text><text x="280" y="404" font-size="17">Requires C18</text><rect x="480" y="326" width="192" height="108" class="neutral"/><text x="496" y="362" font-size="19">B18 · bulk</text><text x="496" y="404" font-size="17">Requires C18</text><text x="32" y="480" font-size="18">Dependency arrows point toward the required contract.</text><text x="32" y="544" font-size="22" class="accent">Proposed · ten-working-day experiment</text><rect x="32" y="574" width="656" height="140" class="mint"/><text x="48" y="610" font-size="22" class="accent">One started useful increment: I18</text><text x="48" y="652" font-size="19">B18 withdrawn with history; no accepted completion.</text><text x="48" y="684" font-size="19">I18 still has three unfinished child tasks: C18, V18, U18.</text><rect x="32" y="790" width="192" height="140" class="neutral"/><text x="48" y="826" font-size="18">1 · Resolve C18</text><text x="48" y="868" font-size="17">Review contract</text><text x="48" y="900" font-size="17">Settle row rule</text><rect x="264" y="790" width="192" height="140" class="neutral"/><text x="280" y="826" font-size="18">2 · Finish V18/U18</text><text x="280" y="868" font-size="17">Implement against</text><text x="280" y="900" font-size="17">the agreed contract</text><rect x="496" y="790" width="192" height="140" class="neutral"/><text x="512" y="826" font-size="18">3 · Check I18</text><text x="512" y="868" font-size="17">Integrate + verify</text><text x="512" y="900" font-size="17">Record acceptance</text><path d="M232 858H256m-6 -5l6 5l-6 5" class="line"/><path d="M464 858H488m-6 -5l6 5l-6 5" class="line"/><text x="32" y="990" font-size="18">Horizontal arrows = planned sequence. Also record release.</text><text x="32" y="1022" font-size="18">Inspect waiting, age and rework; improvement is unproven.</text></svg>
