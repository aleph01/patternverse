<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1181" viewBox="0 0 360 1181" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Two review units retain the original import acceptance requirements</title><desc id="desc">Fictional combined and split plans retain P, read-only preview with row errors, and C, all-or-none confirmation rejecting existing identifiers. U2 depends on U1. After U1 there is no confirm control or import write route; the parent remains incomplete.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1181" class="paper"/><text x="20" y="32" font-size="18">Split the review, retain the requirements</text><text x="20" y="68" font-size="14">Fictional change plan · no completed integrations</text><rect x="20" y="106" width="320" height="154" class="neutral"/><text x="36" y="142" font-size="20">Same parent requirements</text><text x="36" y="183" font-size="16">P: row-error preview; no invalid writes</text><text x="36" y="214" font-size="16">C: confirm all rows or none</text><text x="36" y="245" font-size="16">Reject existing identifiers</text><rect x="20" y="305" width="320" height="160" class="pending"/><text x="36" y="341" font-size="22">One combined review</text><text x="36" y="384" font-size="19">Preview + confirmation</text><text x="36" y="416" font-size="19">Validation, UI, transaction</text><text x="36" y="448" font-size="19">All P + C evidence at once</text><text x="20" y="516" font-size="21">Two dependent review units</text><rect x="20" y="546" width="320" height="143" class="mint"/><text x="36" y="583" font-size="21" class="accent">U1 · read-only preview</text><text x="36" y="625" font-size="18">P201,3 + P202,-1 → row 2 error</text><text x="36" y="657" font-size="18">P100 stays 4</text><path d="M180 701v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="742" width="320" height="149" class="mint"/><text x="36" y="779" font-size="21" class="accent">U2 · confirmation</text><text x="36" y="821" font-size="17">Depends on U1</text><text x="36" y="853" font-size="17">All-or-none + existing-SKU checks</text><rect x="20" y="937" width="320" height="132" class="neutral"/><text x="36" y="973" font-size="20">Intended state after U1</text><text x="36" y="1015" font-size="17">Preview usable; parent incomplete</text><text x="36" y="1046" font-size="17">No confirm control or write route</text><text x="20" y="1119" font-size="18">Arrow: review/base dependency</text><text x="20" y="1150" font-size="18">Queue: await workload evidence</text></svg>
