<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1040" viewBox="0 0 360 1040" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Hypothetical review queue conservation</title><desc id="desc">Each day adds twelve distinct entries and completes four reviews. Queued work grows eight per day to forty. Acceptance is unknown.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1040" class="paper"/><text x="20" y="32" font-size="18">Twelve arrive; four complete review</text><text x="20" y="68" font-size="16">Hypothetical · distinct review entries</text><rect x="20" y="100" width="320" height="172" class="neutral"/><text x="36" y="136" font-size="20">Each working day</text><text x="36" y="178" font-size="17">12 enter before 4 leave review.</text><text x="36" y="210" font-size="17">Net change: +8 queued.</text><text x="36" y="242" font-size="17">Initial queue: 0.</text><text x="28" y="350" font-size="17">Day</text><text x="102" y="350" font-size="17">Arrive</text><text x="184" y="350" font-size="17">Review</text><text x="276" y="350" font-size="17">Left</text><path d="M20 366H340" class="fine"/><text x="36" y="410" font-size="20">1</text><text x="118" y="410" font-size="20">12</text><text x="208" y="410" font-size="20">4</text><text x="282" y="410" font-size="20">8</text><path d="M20 426H340" class="fine"/><text x="36" y="465" font-size="20">2</text><text x="118" y="465" font-size="20">12</text><text x="208" y="465" font-size="20">4</text><text x="282" y="465" font-size="20">16</text><path d="M20 481H340" class="fine"/><text x="36" y="520" font-size="20">3</text><text x="118" y="520" font-size="20">12</text><text x="208" y="520" font-size="20">4</text><text x="282" y="520" font-size="20">24</text><path d="M20 536H340" class="fine"/><text x="36" y="575" font-size="20">4</text><text x="118" y="575" font-size="20">12</text><text x="208" y="575" font-size="20">4</text><text x="282" y="575" font-size="20">32</text><path d="M20 591H340" class="fine"/><text x="36" y="630" font-size="20">5</text><text x="118" y="630" font-size="20">12</text><text x="208" y="630" font-size="20">4</text><text x="282" y="630" font-size="20">40</text><path d="M20 646H340" class="fine"/><rect x="20" y="690" width="320" height="172" class="mint"/><text x="36" y="726" font-size="20" class="accent">Acceptance is unknown</text><text x="36" y="768" font-size="17">Review completion does not</text><text x="36" y="800" font-size="17">establish integration or</text><text x="36" y="832" font-size="17">product acceptance.</text><text x="20" y="944" font-size="17">No returns or withdrawals.</text><text x="20" y="976" font-size="17">Fixed rates are assumptions,</text><text x="20" y="1008" font-size="17">not a forecast of real work.</text></svg>
