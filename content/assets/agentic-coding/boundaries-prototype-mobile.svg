<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1036" viewBox="0 0 360 1036" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Separate prototype learning from production obligations</title><desc id="desc">The same fictional row-error question has different briefs. A prototype can use synthetic data and memory-only state. Production needs established validation, unchanged inventory during preview, and relevant checks. No user study or release is claimed.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1036" class="paper"/><text x="20" y="32" font-size="18">Same question, different boundaries</text><rect x="20" y="64" width="320" height="130" class="neutral"/><text x="36" y="96" font-size="18">Shared teaching fixture</text><text x="36" y="132" font-size="20">P201,3 · P202,-1</text><text x="36" y="170" font-size="17">Can row errors be understood?</text><text x="20" y="248" font-size="20" class="accent">Prototype brief</text><text x="28" y="291" font-size="19">Synthetic rows</text><text x="28" y="328" font-size="19">In-memory list</text><text x="28" y="365" font-size="19">Disposable local UI</text><text x="28" y="402" font-size="19">No external calls</text><text x="28" y="439" font-size="19">Evidence: interaction</text><text x="28" y="476" font-size="19">and observations</text><path d="M20 509H340" class="fine"/><text x="20" y="555" font-size="20" class="accent">Production brief</text><text x="28" y="598" font-size="18">Authorized real inputs</text><text x="28" y="635" font-size="18">Preview: no inventory writes</text><text x="28" y="672" font-size="18">Established validation</text><text x="28" y="709" font-size="18">Integration / failure checks</text><text x="28" y="746" font-size="18">Evidence: acceptance</text><text x="28" y="783" font-size="18">and preserved behavior</text><rect x="20" y="850" width="320" height="100" class="mint"/><text x="36" y="885" font-size="20" class="accent">Keep the learning.</text><text x="36" y="922" font-size="18">Reconsider implementation.</text><text x="20" y="1006" font-size="18">Prototype ≠ ready for release</text></svg>
