<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1413" viewBox="0 0 360 1413" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Concrete input, code responsibilities and state observations</title><desc id="desc">P201 quantity text is normalized to integer 3, previewed without writes, then revalidated and checked against current inventory before commit. Separate negative and stale-state contrasts explain rejection and retained state. The functions are teaching references, not actual application routes.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1413" class="paper"/><text x="20" y="32" font-size="19">Trace one row to its write boundary</text><text x="20" y="68" font-size="16">Reference functions · initial P100:4</text><rect x="20" y="106" width="320" height="140" class="neutral"/><text x="36" y="142" font-size="20">parse_rows · P201,3</text><text x="36" y="184" font-size="17">Logical data row 1</text><text x="36" y="216" font-size="17">quantity_text is the string &quot;3&quot;.</text><path d="M180 258v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="311" width="320" height="140" class="neutral"/><text x="36" y="347" font-size="20">validate_rows</text><text x="36" y="389" font-size="17">Whole, nonnegative quantity</text><text x="36" y="421" font-size="17">Normalize to integer 3.</text><path d="M180 463v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="516" width="320" height="140" class="neutral"/><text x="36" y="552" font-size="20">preview_import</text><text x="36" y="594" font-size="17">Retain source; show P201:3.</text><text x="36" y="626" font-size="17">No inventory writes: only P100:4.</text><path d="M180 668v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="721" width="320" height="172" class="mint"/><text x="36" y="757" font-size="20" class="accent">confirm_import</text><text x="36" y="799" font-size="17">Re-parse and validate source.</text><text x="36" y="831" font-size="17">Check P201 absent in transaction.</text><text x="36" y="863" font-size="17">Commit → fresh P100:4; P201:3</text><rect x="20" y="939" width="320" height="172" class="pending"/><text x="36" y="975" font-size="20">Contrast · change 3 to −1</text><text x="36" y="1017" font-size="17">Row 1: quantity_nonnegative</text><text x="36" y="1049" font-size="17">Direct confirmation rejects.</text><text x="36" y="1081" font-size="17">0 writes; only P100:4.</text><rect x="20" y="1157" width="320" height="172" class="pending"/><text x="36" y="1193" font-size="20">Contrast · valid preview is stale</text><text x="36" y="1235" font-size="17">Another write creates P201:5.</text><text x="36" y="1267" font-size="17">Confirmation rejects sku_exists.</text><text x="36" y="1299" font-size="17">P100:4 and P201:5 remain.</text><text x="20" y="1379" font-size="16">Arrows: inspected data/control path</text></svg>
