<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1036" viewBox="0 0 360 1036" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Separate parser completion from import completion</title><desc id="desc">The same fictional PARSER-A revision supports a parser task handoff but not a completed import. P201,3 yields a record, P202,-1 yields row 2 error, and application-level existing-SKU rejection remains unverified.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1036" class="paper"/><text x="20" y="32" font-size="20">Parser task / import feature</text><text x="20" y="68" font-size="18">PARSER-A · fictional evidence</text><rect x="20" y="100" width="320" height="300" class="mint"/><text x="36" y="136" font-size="21" class="accent">Parser task</text><text x="36" y="179" font-size="19">P201,3 → record</text><text x="36" y="211" font-size="19">P202,-1 → row 2 error</text><text x="36" y="243" font-size="19">Focused checks available</text><text x="36" y="275" font-size="19">Interface + diff inspectable</text><text x="36" y="349" font-size="19" class="accent">TASK COMPLETE</text><text x="36" y="380" font-size="19">Ready for review</text><rect x="20" y="438" width="320" height="300" class="pending"/><text x="36" y="474" font-size="21">Import feature</text><text x="36" y="514" font-size="18">Still missing</text><text x="36" y="549" font-size="19">Upload</text><text x="36" y="581" font-size="19">Error display</text><text x="36" y="613" font-size="19">Confirmation</text><text x="36" y="645" font-size="19">Persistence</text><text x="36" y="714" font-size="19">FEATURE INCOMPLETE</text><rect x="20" y="784" width="320" height="172" class="neutral"/><text x="36" y="821" font-size="18">Application acceptance case</text><text x="36" y="861" font-size="19">P100,8 → reject entire file</text><text x="36" y="893" font-size="19">P100 stays 4</text><text x="36" y="925" font-size="19">Not yet verified</text><text x="20" y="1004" font-size="18">Parser has no inventory access.</text></svg>
