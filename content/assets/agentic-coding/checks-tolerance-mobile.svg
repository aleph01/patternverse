<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1079" viewBox="0 0 360 1079" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A wider tolerance accepts the unchanged wrong rounding result</title><desc id="desc">Input 2.345, expected 2.35, actual 2.34, and ROUND-1 remain fixed. Exact equality and error tolerance 0.005 fail; inclusive tolerance 0.02 passes. Only the judge changed, not the implementation or requirement.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1079" class="paper"/><text x="20" y="32" font-size="22">The output did not change</text><text x="20" y="68" font-size="16">ROUND-1 · exact decimal reference values</text><rect x="20" y="106" width="320" height="198" class="neutral"/><text x="36" y="142" font-size="19">Held fixed in all three checks</text><text x="36" y="184" font-size="17">Input 2.345 · ties away from zero</text><text x="36" y="213" font-size="17">Expected 2.35 · actual 2.34</text><text x="36" y="242" font-size="17">Absolute error 0.01</text><text x="36" y="271" font-size="17">Display must have two decimals.</text><rect x="20" y="350" width="320" height="104" class="mint"/><text x="36" y="386" font-size="17" class="accent">Required: exact formatted value</text><text x="36" y="427" font-size="21">2.34 ≠ 2.35 → FAIL</text><rect x="20" y="500" width="320" height="104" class="neutral"/><text x="36" y="536" font-size="21">Old tolerance: 0.005</text><text x="36" y="577" font-size="21">0.01 &gt; 0.005 → FAIL</text><rect x="20" y="650" width="320" height="104" class="pending"/><text x="36" y="686" font-size="21">Wider tolerance: 0.02</text><text x="36" y="727" font-size="21">0.01 ≤ 0.02 → PASS</text><rect x="20" y="800" width="320" height="164" class="mint"/><text x="36" y="836" font-size="20" class="accent">Review the changed judge</text><text x="36" y="878" font-size="17">ROUND-1 still requires 2.35.</text><text x="36" y="907" font-size="17">Fix code, or authorize and version</text><text x="36" y="936" font-size="17">a genuinely changed contract.</text><text x="20" y="1014" font-size="17">Changed: acceptance predicate only</text><text x="20" y="1047" font-size="17">No corrected output is shown.</text></svg>
