<svg xmlns="http://www.w3.org/2000/svg" width="720" height="773" viewBox="0 0 720 773" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A narrow documentation task can delegate broad local discretion</title><desc id="desc">Matched fictional local and production environments retain the same text and policy. Local editing within docs/import-guide is delegated with accuracy and rendering evidence. Live publication is a different effect with no authority or tool in this task.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="773" class="paper"/><text x="28" y="32" font-size="23">Same edit. Different resulting effect.</text><text x="28" y="68" font-size="18">Fictional documentation task · quantity rule unchanged</text><rect x="28" y="107" width="664" height="100" class="neutral"/><text x="44" y="143" font-size="21">Identical text correction under the same quantity rule</text><text x="44" y="183" font-size="22">P202,-1 accepted → P202,0 accepted</text><rect x="28" y="252" width="316" height="234" class="mint"/><text x="44" y="291" font-size="22" class="accent">Disposable local draft</text><text x="44" y="338" font-size="19">docs/import-guide/</text><text x="44" y="374" font-size="19">Reorganize prose + links</text><text x="44" y="410" font-size="19">Save + render permitted</text><text x="44" y="446" font-size="19">No live publication</text><rect x="376" y="252" width="316" height="234" class="pending"/><text x="392" y="291" font-size="22">Production-served page</text><text x="392" y="338" font-size="19">Same text and policy</text><text x="392" y="374" font-size="19">Saving can publish</text><text x="392" y="410" font-size="19">No publishing authority</text><text x="392" y="446" font-size="19">No live publishing tool</text><rect x="28" y="534" width="664" height="114" class="neutral"/><text x="44" y="572" font-size="22">Proportionate local handoff evidence</text><text x="44" y="614" font-size="20">Rule accuracy · links · rendered views · scoped diff</text><text x="28" y="699" font-size="20">Environment and effect change; the requested text does not.</text><text x="28" y="741" font-size="19">Return a reviewable draft. Live publication remains outside scope.</text></svg>
