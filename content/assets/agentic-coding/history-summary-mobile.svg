<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1099" viewBox="0 0 360 1099" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A current description replaces a stale preview-only summary</title><desc id="desc">S1 describes the earlier C1 while the unchanged proposed head C2 contains a writer. Comparing the delta and reference evidence informs S2. S2 names the actual range, decision, version-specific checks and pending integration without claiming approval.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1099" class="paper"/><text x="20" y="32" font-size="19">Correct the record for the actual head</text><text x="20" y="68" font-size="16">Fictional IDs · proposed head stays C2</text><rect x="20" y="106" width="320" height="172" class="pending"/><text x="36" y="142" font-size="20">S1 · superseded record</text><text x="36" y="184" font-size="17">Describes C1: preview only.</text><text x="36" y="216" font-size="17">No confirmation writer.</text><text x="36" y="248" font-size="17">Evidence: T1 at C1</text><rect x="20" y="324" width="320" height="172" class="neutral"/><text x="36" y="360" font-size="20">Actual proposal · H0..C2</text><text x="36" y="402" font-size="17">C2 adds a confirmation writer.</text><text x="36" y="434" font-size="17">It can replace existing stock.</text><text x="36" y="466" font-size="17">C1 and C2 digests differ.</text><rect x="20" y="542" width="320" height="172" class="neutral"/><text x="36" y="578" font-size="20">Inspect C1..C2</text><text x="36" y="620" font-size="17">inventory[row.sku] = row.quantity</text><text x="36" y="652" font-size="17">New T2: listed stock replaces.</text><text x="36" y="684" font-size="17">Absent P900 remains 8.</text><path d="M180 726v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="779" width="320" height="204" class="mint"/><text x="36" y="815" font-size="20" class="accent">S2 · current description</text><text x="36" y="857" font-size="17">Scope: preview + confirmation</text><text x="36" y="889" font-size="17">Decision: D7 permits replacement.</text><text x="36" y="921" font-size="17">Evidence: T1 and T2 at C2</text><text x="36" y="953" font-size="17">Integration checks pending.</text><text x="20" y="1033" font-size="15">Arrow: comparison informs the correction.</text><text x="20" y="1065" font-size="16">Updated words do not perform review.</text></svg>
