<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1190" viewBox="0 0 360 1190" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Independent expected inventory rejects a self-derived snapshot</title><desc id="desc">The same state and input yield a faulty replacement map without P100. The separate create-only requirement derives the expected map with P100 retained. That comparison fails while copying the wrong map into a snapshot can pass.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1190" class="paper"/><text x="20" y="32" font-size="19">Let the expectation challenge code</text><text x="20" y="68" font-size="17">Fictional create-only inventory import</text><rect x="20" y="106" width="320" height="168" class="neutral"/><text x="36" y="142" font-size="21">Same state and input</text><text x="36" y="184" font-size="17">Initial P100: 4</text><text x="36" y="213" font-size="17">Import P201: 3 and P202: 2</text><text x="36" y="242" font-size="17">Existing stock must remain.</text><rect x="20" y="320" width="320" height="168" class="neutral"/><text x="36" y="356" font-size="19">Faulty implementation output</text><text x="36" y="398" font-size="17">P201: 3; P202: 2</text><text x="36" y="427" font-size="17">P100 missing; total 5</text><text x="36" y="456" font-size="17">The imported map replaced stock.</text><rect x="20" y="534" width="320" height="198" class="mint"/><text x="36" y="570" font-size="19" class="accent">Requirement → expected map</text><text x="36" y="612" font-size="17">P100: 4; P201: 3; P202: 2</text><text x="36" y="641" font-size="17">Total 4 + 3 + 2 = 9</text><text x="36" y="670" font-size="17">Fixture derived before accepting</text><text x="36" y="699" font-size="17">the implementation’s output.</text><path d="M180 744v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="785" width="320" height="104" class="mint"/><text x="36" y="821" font-size="18" class="accent">Independent comparison: FAIL</text><text x="36" y="862" font-size="18">P100 must still be present.</text><rect x="20" y="935" width="320" height="140" class="pending"/><text x="36" y="971" font-size="19">Copy output into snapshot?</text><text x="36" y="1013" font-size="17">Same wrong map matches: PASS</text><text x="36" y="1042" font-size="17">Agreement preserves the omission.</text><text x="20" y="1125" font-size="15">Arrow: fixture supplies the expected map</text><text x="20" y="1158" font-size="17">Check entries, not just the total.</text></svg>
