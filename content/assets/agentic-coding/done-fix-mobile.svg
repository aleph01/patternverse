<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1002" viewBox="0 0 360 1002" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Verify and integrate a fix without claiming a release</title><desc id="desc">Fictional search evidence moves from a tie-order defect to FIX-B and MAIN-C, with checks and review tied to revisions. LIVE-A is still serving; MAIN-C rollout remains pending. Ordering alone does not prove pagination consistency.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1002" class="paper"/><text x="20" y="32" font-size="19">Search fix: evidence and delivery</text><text x="20" y="68" font-size="16">Fictional revisions · arrows show sequence</text><rect x="20" y="103" width="320" height="154" class="neutral"/><text x="36" y="139" font-size="19">Reproduce the tie-order defect</text><text x="36" y="180" font-size="18">Scores: A10 = 8, A20 = 8</text><text x="36" y="210" font-size="18">Faulty: A20, A10, A30</text><text x="36" y="240" font-size="18">Required: A10 before A20</text><path d="M180 269v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="306" width="320" height="174" class="mint"/><text x="36" y="342" font-size="22" class="accent">FIX-B</text><text x="36" y="383" font-size="19">A10, A20, A30</text><text x="36" y="416" font-size="19">Tie + unequal-score checks</text><text x="36" y="449" font-size="19">Diff reviewed at FIX-B</text><path d="M180 492v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="529" width="320" height="144" class="mint"/><text x="36" y="565" font-size="22" class="accent">MAIN-C</text><text x="36" y="605" font-size="19">Integrated code checked</text><text x="36" y="638" font-size="19">Fix complete in increment</text><path d="M20 712H340" class="fine"/><text x="20" y="748" font-size="20">Release is a separate claim</text><rect x="20" y="779" width="320" height="140" class="pending"/><text x="36" y="815" font-size="21">LIVE-A still serving</text><text x="36" y="854" font-size="18">MAIN-C rollout pending</text><text x="36" y="885" font-size="18">Use existing delivery process</text><text x="20" y="970" font-size="18">Ordering ≠ pagination consistency</text></svg>
