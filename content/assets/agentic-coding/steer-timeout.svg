<svg xmlns="http://www.w3.org/2000/svg" width="720" height="988" viewBox="0 0 720 988" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Positive evidence identifies one timeout contributor, not all causes</title><desc id="desc">Three initial hypotheses are compared against constructed observations. Parser completion narrows the explanation; a TX9 lock record confirms a database contention contributor while missing delivery evidence leaves the worker result path unresolved.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="988" class="paper"/><text x="28" y="32" font-size="23">A timeout reproduces the symptom, not its cause</text><text x="28" y="68" font-size="19">R17 · constructed deadline 3,000 ms · hypotheses may coexist</text><rect x="28" y="106" width="212" height="138" class="pending"/><text x="44" y="143" font-size="20">H1 · parsing</text><text x="44" y="184" font-size="17">Parsing is still</text><text x="44" y="213" font-size="17">occupying the request</text><rect x="254" y="106" width="212" height="138" class="pending"/><text x="270" y="143" font-size="20">H2 · database</text><text x="270" y="184" font-size="17">Contention blocks</text><text x="270" y="213" font-size="17">progress</text><rect x="480" y="106" width="212" height="138" class="pending"/><text x="496" y="143" font-size="20">H3 · result path</text><text x="496" y="184" font-size="17">Worker result delivery</text><text x="496" y="213" font-size="17">is disconnected</text><rect x="28" y="290" width="664" height="112" class="neutral"/><text x="44" y="328" font-size="21">Observation 1 · correlated stages for R17</text><text x="44" y="370" font-size="19">Parse ends at 12 ms; DB waits from 14 ms and is pending at deadline.</text><path d="M360 414v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="455" width="664" height="112" class="neutral"/><text x="44" y="493" font-size="22">H1 does not explain the ongoing wait after parsing</text><text x="44" y="535" font-size="18">A pending DB span does not identify contention or verify result delivery.</text><path d="M360 579v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="620" width="664" height="112" class="mint"/><text x="44" y="658" font-size="22" class="accent">Observation 2 · correlated database lock record</text><text x="44" y="700" font-size="20">TX9 blocks R17 from 14 to 4,014 ms: 4,000 ms of lock wait.</text><path d="M360 744v12H186v18m-5 -6l5 6l5 -6" class="line"/><path d="M360 756H534v18m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="792" width="316" height="112" class="mint"/><text x="44" y="830" font-size="22" class="accent">H2 is a contributor</text><text x="44" y="869" font-size="18">Next: inspect TX9 boundary</text><rect x="376" y="792" width="316" height="112" class="pending"/><text x="392" y="830" font-size="22">H3 remains possible</text><text x="392" y="869" font-size="18">Next: trace result delivery</text><text x="28" y="956" font-size="18">Arrows: evidence narrows the explanation; no probabilities or timing scale</text></svg>
