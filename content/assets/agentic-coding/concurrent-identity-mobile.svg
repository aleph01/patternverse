<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1145" viewBox="0 0 360 1145" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Non-overlapping schema changes disagree about product identity</title><desc id="desc">Fictional products.schema makes SKU editable under product_id; stock.schema requires immutable SKU references. PR-7 changes label P100 to P101 while stock retains P100. Both proposals require a shared model decision, not merely text-conflict resolution.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1145" class="paper"/><text x="20" y="32" font-size="19">Different files. Conflicting identity.</text><text x="20" y="68" font-size="15">Fictional schematic declarations, one baseline</text><rect x="20" y="106" width="320" height="186" class="pending"/><text x="36" y="143" font-size="22">A · products.schema</text><text x="36" y="185" font-size="20">− identity: sku</text><text x="36" y="219" font-size="20">+ identity: product_id</text><text x="36" y="253" font-size="20">+ sku: editable_label</text><rect x="20" y="338" width="320" height="157" class="pending"/><text x="36" y="375" font-size="22">B · stock.schema</text><text x="36" y="417" font-size="18">− product_ref: sku</text><text x="36" y="451" font-size="18">+ product_ref: immutable_sku</text><text x="20" y="545" font-size="17">No overlapping lines by construction.</text><rect x="20" y="574" width="320" height="153" class="neutral"/><text x="36" y="611" font-size="22">Same product PR-7</text><text x="36" y="654" font-size="18">SKU changes: P100 → P101</text><text x="36" y="684" font-size="18">product_id remains PR-7</text><text x="36" y="714" font-size="18">Stock keeps reference P100</text><rect x="20" y="773" width="320" height="136" class="pending"/><text x="36" y="810" font-size="18">P100 no longer matches P101</text><text x="36" y="851" font-size="18">Constraint rejects rename, or</text><text x="36" y="881" font-size="18">stock reference is unresolved</text><rect x="20" y="955" width="320" height="108" class="mint"/><text x="36" y="992" font-size="21" class="accent">Hold for a shared decision</text><text x="36" y="1033" font-size="17">Choose identity; align references.</text><text x="20" y="1113" font-size="18">Clean text ≠ compatible data model</text></svg>
