<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1142" viewBox="0 0 360 1142" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A frontend review needs the real backend contract and combined evidence</title><desc id="desc">Fictional B1 returns row:2 but F1 tests a line:2 mock and reads line. Own checks pass, while the combined path loses the row number. The frontend fixture and renderer must be corrected and the actual response-to-screen path verified.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1142" class="paper"/><text x="20" y="32" font-size="19">Two branches still share an interface</text><text x="20" y="68" font-size="13">Fictional B1 + F1 · separate checks can miss a mismatch</text><rect x="20" y="106" width="320" height="148" class="mint"/><text x="36" y="143" font-size="21" class="accent">Agreed preview contract</text><text x="36" y="184" font-size="17">POST /imports/preview</text><text x="36" y="212" font-size="17">errors: [{ row: 2,</text><text x="36" y="240" font-size="17">code: &quot;quantity_nonnegative&quot; }]</text><rect x="20" y="300" width="320" height="140" class="neutral"/><text x="36" y="337" font-size="22">B1 · backend lane</text><text x="36" y="380" font-size="19">Actual response: row: 2</text><text x="36" y="412" font-size="19">Own branch check: passes</text><rect x="20" y="486" width="320" height="165" class="pending"/><text x="36" y="523" font-size="22">F1 · frontend lane</text><text x="36" y="566" font-size="19">Mock: line: 2</text><text x="36" y="598" font-size="19">Renderer reads line</text><text x="36" y="630" font-size="19">Own branch check: passes</text><path d="M340 370h10v417h-10m6 -5l-6 5l6 5" class="line"/><path d="M180 663v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="704" width="320" height="157" class="pending"/><text x="36" y="741" font-size="22">Combined path</text><text x="36" y="784" font-size="18">Response has row, not line</text><text x="36" y="815" font-size="18">Row number disappears</text><text x="36" y="846" font-size="18">F1 review needs this evidence</text><rect x="20" y="907" width="320" height="153" class="mint"/><text x="36" y="944" font-size="21" class="accent">Correct F1 before closing</text><text x="36" y="987" font-size="18">Mock + renderer use row</text><text x="36" y="1019" font-size="18">Verify actual endpoint → screen</text><text x="20" y="1110" font-size="17">Arrows: combined-path dependencies</text></svg>
