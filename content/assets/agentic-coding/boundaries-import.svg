<svg xmlns="http://www.w3.org/2000/svg" width="720" height="689" viewBox="0 0 720 689" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Make the import boundary and overwrite decision explicit</title><desc id="desc">An existing manual-entry path and validator are retained while import preview and confirmation are permitted. The overwrite choice moves from proposed alternatives to an accepted rejection policy. The connection denotes required reuse, not runtime chronology.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="689" class="paper"/><text x="28" y="34" font-size="21">CSV import: decide before writing</text><rect x="28" y="76" width="244" height="210" class="neutral"/><text x="44" y="112" font-size="20">Keep working</text><text x="44" y="155" font-size="19">Manual entry</text><text x="44" y="198" font-size="19">Existing validation</text><text x="44" y="244" font-size="18">Existing form checks</text><rect x="356" y="76" width="336" height="210" class="boundary"/><text x="372" y="112" font-size="20" class="accent">Permitted change</text><text x="372" y="155" font-size="19">CSV preview</text><text x="372" y="198" font-size="19">Import confirmation</text><text x="372" y="244" font-size="19">Reuse validation</text><path d="M272 191H356" class="line"/><text x="288" y="176" font-size="16">reuse</text><rect x="28" y="330" width="664" height="144" class="pending"/><text x="44" y="365" font-size="20">D-01: open overwrite decision</text><text x="44" y="405" font-size="20">Existing P100 = 4 · Incoming P100 = 8</text><text x="44" y="451" font-size="20">Reject → 4</text><text x="400" y="451" font-size="20">Replace → 8</text><rect x="28" y="520" width="664" height="97" class="mint"/><text x="44" y="555" font-size="20" class="accent">D-01: accepted</text><text x="44" y="591" font-size="20">Reject file on existing SKU; P100 stays 4.</text><text x="28" y="659" font-size="19">Accepted is not yet implemented.</text></svg>
