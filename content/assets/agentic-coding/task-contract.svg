<svg xmlns="http://www.w3.org/2000/svg" width="720" height="797" viewBox="0 0 720 797" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Expose a wire-contract change at the edge of delegated authority</title><desc id="desc">A fictional client update changes quantity from integer to value-and-unit object. The service outside the task still requires an integer. A bounded compatibility investigation can lead to a verified local update, deferral, or a separately coordinated scope decision.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="797" class="paper"/><text x="28" y="32" font-size="22">A package update finds a service contract</text><text x="28" y="68" font-size="18">Fictional stock-client payloads · no upgrade run</text><rect x="28" y="107" width="316" height="189" class="boundary"/><text x="44" y="145" font-size="23" class="accent">inventory-ui</text><text x="44" y="185" font-size="18">Client + required lock entries</text><text x="44" y="225" font-size="20">Before: quantity: 3</text><text x="44" y="255" font-size="20">Proposed quantity:</text><text x="44" y="285" font-size="20">{ value: 3, unit: &quot;item&quot; }</text><rect x="376" y="107" width="316" height="189" class="neutral"/><text x="392" y="145" font-size="23">inventory-api</text><text x="392" y="190" font-size="19">Outside edit authority</text><text x="392" y="225" font-size="19">Requires quantity: 3</text><text x="392" y="260" font-size="19">Object payload incompatible</text><path d="M350 218h19m-6 -5l6 5l-6 5" class="line"/><path d="M360 90V324" class="pending"/><text x="28" y="347" font-size="19">Arrow: wire dependency · dashed line: agreed edit boundary</text><rect x="28" y="391" width="664" height="115" class="pending"/><text x="44" y="428" font-size="22">Bounded investigation within inventory-ui</text><text x="44" y="471" font-size="19">Can a supported adapter preserve the existing integer contract?</text><path d="M360 518v22H186v22m-5 -6l5 6l5 -6" class="line"/><path d="M360 540H534v22m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="580" width="316" height="135" class="mint"/><text x="44" y="618" font-size="20" class="accent">If compatible and verified</text><text x="44" y="660" font-size="19">Continue inside inventory-ui</text><text x="44" y="690" font-size="19">Keep the service unchanged</text><rect x="376" y="580" width="316" height="135" class="pending"/><text x="392" y="618" font-size="20">Otherwise return a decision</text><text x="392" y="660" font-size="19">Defer, or coordinate</text><text x="392" y="690" font-size="19">an explicit scope change</text><text x="28" y="765" font-size="18">Conditional choices · no compatibility result or deployment claimed</text></svg>
