<svg xmlns="http://www.w3.org/2000/svg" width="720" height="956" viewBox="0 0 720 956" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Two isolated working areas converge through deliberate integration</title><desc id="desc">The same fictional ERR-1 governs frontend F1 and backend B1. The integration sequence is conditional on B1 preserving clients. The integrator checks the combined path and unchanged state rather than treating separate working areas as compatibility proof.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="956" class="paper"/><text x="28" y="32" font-size="23">Isolate files. Share the contract.</text><text x="28" y="68" font-size="19">Fictional work areas and integration plan</text><rect x="28" y="107" width="664" height="145" class="mint"/><text x="44" y="145" font-size="22" class="accent">ERR-1 · shared before implementation</text><text x="44" y="187" font-size="18">POST /imports/preview → row: 2, code: quantity_nonnegative</text><text x="44" y="220" font-size="18">One-based data rows; header excluded; preview writes nothing</text><path d="M186 264v24m-5 -6l5 6l5 -6" class="line"/><path d="M534 264v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="305" width="316" height="180" class="boundary"/><text x="44" y="344" font-size="22" class="accent">W-F · frontend F1</text><text x="44" y="391" font-size="17">Separate files + synthetic state</text><text x="44" y="425" font-size="17">Rendering</text><text x="44" y="459" font-size="17">Consumer checks against ERR-1</text><rect x="376" y="305" width="316" height="180" class="boundary"/><text x="392" y="344" font-size="22" class="accent">W-B · backend B1</text><text x="392" y="391" font-size="17">Separate files + synthetic state</text><text x="392" y="425" font-size="17">Endpoint</text><text x="392" y="459" font-size="17">Provider checks against ERR-1</text><path d="M186 497v18H12v243h16m-6 -5l6 5l-6 5" class="line"/><path d="M534 497v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="539" width="664" height="108" class="neutral"/><text x="44" y="577" font-size="22">I-B: integrate B1 if additive and compatible</text><text x="44" y="619" font-size="20">Verify existing clients before building on this shared base.</text><path d="M360 659v27m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="704" width="664" height="126" class="mint"/><text x="44" y="742" font-size="21" class="accent">I-BF: combine F1 against I-B; verify the actual path</text><text x="44" y="784" font-size="18">Endpoint → screen shows row 2; P100 stays 4; regressions checked.</text><text x="28" y="882" font-size="18">Assigned integrator owns combined evidence and unresolved questions.</text><text x="28" y="924" font-size="18">Arrows: contract/integration prerequisites, not a timing scale</text></svg>
