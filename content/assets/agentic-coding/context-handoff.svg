<svg xmlns="http://www.w3.org/2000/svg" width="720" height="902" viewBox="0 0 720 902" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Tie handoff claims to committed and uncommitted state</title><desc id="desc">A fictional note identifies branch codex/import-preview, base BASE-E, head IMPORT-F, and diff PREVIEW-D1. Parser, failed preview row numbering, and unknown confirmation remain distinct. Arrows identify evidence links, not chronological steps.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="902" class="paper"/><text x="28" y="32" font-size="22">Handoff: claims need a state and a source</text><text x="28" y="68" font-size="19">Fictional branch, revisions, diff, and results</text><rect x="28" y="107" width="664" height="106" class="neutral"/><text x="44" y="143" font-size="23">codex/import-preview</text><text x="44" y="184" font-size="21">BASE-E → IMPORT-F + uncommitted PREVIEW-D1</text><text x="28" y="258" font-size="20">Claim</text><text x="376" y="258" font-size="20">Inspectable basis</text><rect x="28" y="284" width="316" height="110" class="mint"/><rect x="376" y="284" width="316" height="110" class="mint"/><text x="44" y="323" font-size="22" class="accent">Parser complete</text><text x="44" y="363" font-size="19">For the recorded cases</text><text x="392" y="323" font-size="22" class="accent">IMPORT-F</text><text x="392" y="363" font-size="20">Focused checks: passed</text><path d="M350 339h19m-6 -5l6 5l-6 5" class="line"/><rect x="28" y="437" width="316" height="150" class="pending"/><rect x="376" y="437" width="316" height="150" class="neutral"/><text x="44" y="476" font-size="22">Preview unfinished</text><text x="44" y="517" font-size="21">Expected row 2</text><text x="44" y="550" font-size="21">Observed row 3</text><text x="392" y="476" font-size="20">PREVIEW-D1 + IMPORT-F</text><text x="392" y="517" font-size="20">upload.ts + preview.ts</text><text x="392" y="550" font-size="20">Run H-2: failed</text><path d="M350 512h19m-6 -5l6 5l-6 5" class="line"/><rect x="28" y="635" width="664" height="100" class="pending"/><text x="44" y="672" font-size="22">Confirmation revalidation: unknown</text><text x="44" y="712" font-size="20">Save path not wired; no completed integration check.</text><text x="28" y="786" font-size="21">Next hypothesis: header offset applied twice?</text><text x="28" y="828" font-size="19">Inspect the diff and rerun; a summary is not a diagnosis.</text><text x="28" y="870" font-size="19">Arrows link claims to evidence; no release is implied.</text></svg>
