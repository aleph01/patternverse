<svg xmlns="http://www.w3.org/2000/svg" width="720" height="966" viewBox="0 0 720 966" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Restorable source history and retained learning have different scopes</title><desc id="desc">Fictional C0 E1 E2 local history is abandoned within an owned boundary. The selected code returns to C0, while retained F1 and the expected versus observed row numbers guide a new investigation. This diagram is not an executed history operation.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="966" class="paper"/><text x="28" y="32" font-size="23">A recovery path for code and for learning</text><text x="28" y="68" font-size="19">Fictional local history · unshared experiment · other work preserved</text><text x="28" y="119" font-size="22">Source history</text><text x="376" y="119" font-size="22" class="accent">Retained evidence</text><rect x="28" y="148" width="316" height="112" class="neutral"/><text x="44" y="186" font-size="21">C0 · baseline checks pass</text><text x="44" y="228" font-size="19">F1 row failure still exists</text><path d="M186 272v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="313" width="316" height="112" class="pending"/><text x="44" y="351" font-size="22">E1 · remove quotes</text><text x="44" y="393" font-size="19">Breaks record structure</text><path d="M186 437v24m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="478" width="316" height="112" class="pending"/><text x="44" y="516" font-size="19">E2 · remove embedded CRLF</text><text x="44" y="558" font-size="19">Changes note value</text><path d="M186 602v24m-5 -6l5 6l5 -6" class="boundary"/><text x="28" y="660" font-size="20" class="accent">Restore owned scope</text><rect x="28" y="683" width="316" height="112" class="mint"/><text x="44" y="721" font-size="22" class="accent">Selected code: C0</text><text x="44" y="763" font-size="19">Recheck baseline and F1</text><rect x="376" y="148" width="316" height="176" class="mint"/><text x="392" y="186" font-size="20" class="accent">F1 · quoted CRLF in note</text><text x="392" y="228" font-size="17">One logical data record</text><text x="392" y="259" font-size="17">Three physical lines with header</text><text x="392" y="290" font-size="17">Keep outside removal scope</text><path d="M534 336v24m-5 -6l5 6l5 -6" class="line"/><rect x="376" y="377" width="316" height="176" class="neutral"/><text x="392" y="415" font-size="22">Failure record retained</text><text x="392" y="457" font-size="18">Expected data row 1</text><text x="392" y="488" font-size="18">Observed data row 2</text><text x="392" y="519" font-size="18">Rejected explanations retained</text><path d="M534 565v24m-5 -6l5 6l5 -6" class="line"/><rect x="376" y="606" width="316" height="189" class="neutral"/><text x="392" y="644" font-size="22">Next question</text><text x="392" y="687" font-size="19">Physical line position used</text><text x="392" y="721" font-size="19">as logical data row?</text><text x="392" y="755" font-size="19">Inspect the preview adapter.</text><text x="28" y="852" font-size="19">C0 is recoverable, not complete: the minimized failure must remain visible.</text><text x="28" y="900" font-size="18">Black arrows: history at left; retained evidence at right</text><text x="28" y="934" font-size="18">Green arrow: source restoration action, not a new parent commit</text></svg>
