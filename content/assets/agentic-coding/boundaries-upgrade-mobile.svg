<svg xmlns="http://www.w3.org/2000/svg" width="360" height="970" viewBox="0 0 360 970" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Investigate a dependency break without silently expanding scope</title><desc id="desc">The fictional token interface change triggers an adapter investigation. Conditional branches either preserve the current session rules or return a decision to defer or explicitly revise scope. No branch is an observed implementation result.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="970" class="paper"/><text x="20" y="32" font-size="19">Preserve current session rules.</text><rect x="20" y="72" width="320" height="90" class="neutral"/><text x="36" y="106" font-size="19">Client v1</text><text x="36" y="142" font-size="20">Token value</text><path d="M180 162V200" class="line"/><rect x="20" y="200" width="320" height="90" class="neutral"/><text x="36" y="234" font-size="19">Client v2</text><text x="36" y="270" font-size="20">Token callback</text><rect x="20" y="342" width="320" height="126" class="mint"/><text x="36" y="378" font-size="20" class="accent">Bounded investigation</text><text x="36" y="414" font-size="18">Can an adapter preserve</text><text x="36" y="446" font-size="18">the credential lifecycle?</text><path d="M180 468V492H10V766H20" class="line"/><path d="M10 582H20" class="line"/><rect x="20" y="522" width="320" height="126" class="boundary"/><text x="36" y="558" font-size="20" class="accent">If yes: continue upgrade</text><text x="36" y="596" font-size="18">Verify existing session rules</text><rect x="20" y="706" width="320" height="126" class="pending"/><text x="36" y="742" font-size="20">If no: return a decision</text><text x="36" y="780" font-size="19">Defer or revise scope</text><text x="20" y="904" font-size="18">Expansion remains a proposal.</text><text x="20" y="940" font-size="18">No redesign is implied.</text></svg>
