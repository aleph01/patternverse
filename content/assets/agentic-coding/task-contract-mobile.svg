<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1115" viewBox="0 0 360 1115" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A package task does not authorize a consumer rewrite</title><desc id="desc">Fictional inventory-ui can update stock-client and necessary lock entries. The consumer inventory-api expects integer quantity, while the proposed payload is an object. Local compatibility may be investigated; broader service changes require a separate decision.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1115" class="paper"/><text x="20" y="32" font-size="17">A package update finds a service contract</text><text x="20" y="68" font-size="15">Fictional stock-client payloads · no upgrade run</text><rect x="20" y="106" width="320" height="199" class="boundary"/><text x="36" y="142" font-size="22" class="accent">inventory-ui</text><text x="36" y="180" font-size="16">Allowed: client + required lock entries</text><text x="36" y="219" font-size="19">Before: quantity: 3</text><text x="36" y="251" font-size="19">Proposed: quantity:</text><text x="36" y="283" font-size="19">{ value: 3, unit: &quot;item&quot; }</text><path d="M180 317v24m-5 -6l5 6l5 -6" class="line"/><text x="20" y="386" font-size="19">Agreed edit boundary</text><path d="M20 410H340" class="pending"/><rect x="20" y="441" width="320" height="109" class="neutral"/><text x="36" y="478" font-size="22">inventory-api</text><text x="36" y="520" font-size="18">Still requires integer quantity</text><rect x="20" y="595" width="320" height="120" class="pending"/><text x="36" y="632" font-size="19">Bounded local investigation</text><text x="36" y="672" font-size="17">Can an adapter preserve the wire?</text><text x="36" y="701" font-size="17">Reading the contract is allowed.</text><rect x="20" y="758" width="320" height="105" class="mint"/><text x="36" y="794" font-size="20" class="accent">If compatible and verified</text><text x="36" y="835" font-size="19">Continue inside inventory-ui</text><rect x="20" y="907" width="320" height="126" class="pending"/><text x="36" y="943" font-size="20">Otherwise return a decision</text><text x="36" y="984" font-size="16">Defer, or coordinate broader scope</text><text x="36" y="1013" font-size="16">Do not rewrite inventory-api silently.</text><text x="20" y="1083" font-size="18">Conditional paths, not test outcomes.</text></svg>
