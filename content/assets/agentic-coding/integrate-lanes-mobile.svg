<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1392" viewBox="0 0 360 1392" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Receiving mainline does not include an unintegrated peer</title><desc id="desc">Recomposed vertical branch lanes show M0, documentation M1, frontend F1/F2 and peer backend B1. Ancestry arrows converge at candidate I1. The check exposes row 3 instead of 2; I2 corrects the backend convention before planned shared integration. All labels are fictional.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1392" class="paper"/><text x="20" y="32" font-size="20">Mainline update ≠ peer integration</text><text x="20" y="68" font-size="16">Fictional revisions · ancestry arrows</text><text x="22" y="120" font-size="16">Mainline</text><text x="139" y="120" font-size="16">Frontend</text><text x="267" y="120" font-size="16">Backend</text><path d="M60 144v354M180 144v354M300 144v354" class="fine"/><path d="M60 187v156m-5 -6l5 6l5 -6" class="line"/><path d="M67 180h113v43m-5 -6l5 6l5 -6" class="line"/><path d="M67 180h233v113m-5 -6l5 6l5 -6" class="line"/><path d="M180 237v186m-5 -6l5 6l5 -6" class="line"/><path d="M67 350h57l49 73m-7 -3l7 3l0 -8" class="line"/><path d="M180 437v176m-5 -6l5 6l5 -6" class="line"/><path d="M300 307v254H180v52m-5 -6l5 6l5 -6" class="line"/><circle cx="60" cy="180" r="7" fill="#ffffff" stroke="#252c28" stroke-width="1.1"/><text x="26" y="185" font-size="18">M0</text><circle cx="60" cy="350" r="7" fill="#ffffff" stroke="#252c28" stroke-width="1.1"/><text x="26" y="355" font-size="18">M1</text><circle cx="180" cy="230" r="7" fill="#ffffff" stroke="#252c28" stroke-width="1.1"/><text x="192" y="235" font-size="18">F1</text><circle cx="180" cy="430" r="7" fill="#ffffff" stroke="#252c28" stroke-width="1.1"/><text x="192" y="435" font-size="18">F2</text><circle cx="300" cy="300" r="7" fill="#ffffff" stroke="#252c28" stroke-width="1.1"/><text x="266" y="305" font-size="18">B1</text><circle cx="180" cy="620" r="7" fill="#ffffff" stroke="#252c28" stroke-width="1.1"/><text x="192" y="625" font-size="18">I1</text><text x="20" y="530" font-size="16">M1: docs only</text><text x="20" y="692" font-size="16">I1 is a candidate, not shared mainline.</text><rect x="20" y="724" width="320" height="140" class="neutral"/><text x="36" y="760" font-size="20">F2 has M1; it still lacks B1</text><text x="36" y="802" font-size="17">F1 mock expects row 2.</text><text x="36" y="834" font-size="17">B1’s own fixture expects row 3.</text><rect x="20" y="910" width="320" height="172" class="pending"/><text x="36" y="946" font-size="20">I1 · combine F2 + B1</text><text x="36" y="988" font-size="17">Same file: P201:3; P202:−1</text><text x="36" y="1020" font-size="17">Display: Data row 3</text><text x="36" y="1052" font-size="17">Required: Data row 2</text><path d="M180 1094v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="1136" width="320" height="172" class="mint"/><text x="36" y="1172" font-size="19" class="accent">I2 · use corrected backend B2</text><text x="36" y="1214" font-size="17">Contract excludes the header.</text><text x="36" y="1246" font-size="17">Display: Data row 2</text><text x="36" y="1278" font-size="17">Then assess shared M2.</text><text x="20" y="1358" font-size="16">Panel arrow: repair and recheck.</text></svg>
