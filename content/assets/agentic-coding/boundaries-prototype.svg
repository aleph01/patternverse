<svg xmlns="http://www.w3.org/2000/svg" width="720" height="672" viewBox="0 0 720 672" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Separate prototype learning from production obligations</title><desc id="desc">Matched briefs use the same fictional CSV fixture while differing in permitted data, state, implementation, and evidence. The comparison explains planned boundaries, not an observed prototype-to-production promotion.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="672" class="paper"/><text x="28" y="34" font-size="21">Same preview question. Different boundaries.</text><rect x="28" y="74" width="664" height="78" class="neutral"/><text x="44" y="106" font-size="20">Shared fixture: P201,3 · P202,-1</text><text x="44" y="137" font-size="18">Question: are row errors understandable?</text><text x="44" y="214" font-size="20" class="accent">Prototype brief</text><text x="396" y="214" font-size="20" class="accent">Production brief</text><path d="M360 190V494" class="fine"/><text x="44" y="259" font-size="19">Synthetic rows</text><text x="44" y="301" font-size="19">In-memory list</text><text x="44" y="343" font-size="19">Disposable local UI</text><text x="44" y="385" font-size="19">No external calls</text><text x="44" y="427" font-size="19">Evidence: interaction</text><text x="44" y="469" font-size="19">and observations</text><text x="396" y="259" font-size="18">Authorized real inputs</text><text x="396" y="301" font-size="18">Preview: no inventory writes</text><text x="396" y="343" font-size="18">Established validation</text><text x="396" y="385" font-size="18">Integration / failure checks</text><text x="396" y="427" font-size="18">Evidence: acceptance</text><text x="396" y="469" font-size="18">and preserved behavior</text><rect x="28" y="522" width="664" height="72" class="mint"/><text x="44" y="565" font-size="20" class="accent">Keep the learning; reconsider the implementation.</text><text x="28" y="642" font-size="19">Prototype evidence does not establish release readiness.</text></svg>
