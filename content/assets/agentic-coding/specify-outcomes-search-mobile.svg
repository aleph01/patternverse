<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Ordering and paging are separate decisions</title><desc id="desc">Fictional relevance scores allow two tie orders. An identifier tie-breaker resolves that ambiguity, but inserting A05 between pages makes offset paging repeat A20. A fixed session result set is a separate chosen requirement.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.leader{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.intervention{fill:none;stroke:var(--accent);stroke-width:1.4}
.failure{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:4 3}
</style><rect width="360" height="1000" class="paper"/><text x="20" y="32" font-size="20">Input scores</text><text x="20" y="76" font-size="20">A10</text><text x="108" y="76" font-size="19">Oak mug</text><text x="306" y="76" font-size="20">8</text><text x="20" y="114" font-size="20">A20</text><text x="108" y="114" font-size="19">Oak bowl</text><text x="306" y="114" font-size="20">8</text><text x="20" y="152" font-size="20">A30</text><text x="108" y="152" font-size="19">Oak tray</text><text x="306" y="152" font-size="20">7</text><path d="M20 174H340" class="fine"/><text x="20" y="211" font-size="19">Score only permits both:</text><text x="28" y="250" font-size="20">A10 · A20 · A30</text><text x="28" y="287" font-size="20">A20 · A10 · A30</text><text x="20" y="334" font-size="19" class="accent">Order by score, then ID</text><text x="28" y="371" font-size="20" class="accent">A10 · A20 · A30</text><path d="M20 400H340" class="fine"/><text x="20" y="445" font-size="20">Between page requests</text><text x="20" y="487" font-size="20">Page 1: [A10, A20]</text><text x="20" y="526" font-size="19">Insert A05 with score 8.</text><text x="20" y="573" font-size="19">New order:</text><text x="20" y="609" font-size="20">A05 · A10 · A20 · A30</text><text x="20" y="661" font-size="19">Offset 2 now gives:</text><rect x="20" y="676" width="160" height="43" class="failure"/><text x="30" y="705" font-size="22">[A20, A30]</text><text x="196" y="704" font-size="17">A20 repeats</text><rect x="20" y="765" width="320" height="156" class="mint"/><text x="36" y="800" font-size="19" class="accent">Chosen contract:</text><text x="36" y="834" font-size="17">Keep the session result set.</text><text x="36" y="869" font-size="20">Page 2: [A30]</text><text x="36" y="899" font-size="17">New search can see A05.</text><text x="20" y="969" font-size="17">Tie-breaking does not freeze data.</text></svg>
