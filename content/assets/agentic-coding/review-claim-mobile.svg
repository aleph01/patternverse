<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1458" viewBox="0 0 360 1458" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">A race allegation is assessed against code and an explicit execution model</title><desc id="desc">The supplied synchronous helper has no yield or reentrant callback in one JavaScript agent. A reference yields saved and missing with one persistence call. Inserting await creates a separate two-save counterexample. Refutation is scoped to the original read/delete mechanism and does not approve distributed or durable behavior.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1458" class="paper"/><text x="20" y="32" font-size="19">A reviewer claim needs a mechanism</text><text x="20" y="68" font-size="15">RACE-1 is invented · reference checks executed</text><rect x="20" y="106" width="320" height="108" class="pending"/><text x="36" y="142" font-size="18">Allegation, not established defect</text><text x="36" y="184" font-size="16">“Both calls read PV7 before deletion.”</text><rect x="20" y="260" width="320" height="204" class="neutral"/><text x="36" y="296" font-size="19">Inspected synchronous take()</text><text x="36" y="338" font-size="15">const value = pending.get(id);</text><text x="36" y="370" font-size="15">if (value === undefined) return null;</text><text x="36" y="402" font-size="15">pending.delete(id);</text><text x="36" y="434" font-size="15">return value;</text><rect x="20" y="510" width="320" height="172" class="neutral"/><text x="36" y="546" font-size="18">Required execution assumptions</text><text x="36" y="588" font-size="16">One JavaScript agent; private Map</text><text x="36" y="620" font-size="16">Primitive keys; no await or reentry</text><text x="36" y="652" font-size="16">take finishes before caller awaits.</text><path d="M180 694v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="735" width="320" height="172" class="mint"/><text x="36" y="771" font-size="20" class="accent">Original helper reference</text><text x="36" y="813" font-size="17">Results: saved + missing</text><text x="36" y="845" font-size="17">Persistence calls: 1</text><text x="36" y="877" font-size="17">Code + execution model explain why.</text><rect x="20" y="953" width="320" height="172" class="pending"/><text x="36" y="989" font-size="18">Separate await counterexample</text><text x="36" y="1031" font-size="16">Insert await between read and delete.</text><text x="36" y="1063" font-size="16">Results: saved + saved; calls: 2</text><text x="36" y="1095" font-size="16">This changes the original assumption.</text><rect x="20" y="1171" width="320" height="172" class="mint"/><text x="36" y="1207" font-size="19" class="accent">Disposition: scoped refutation</text><text x="36" y="1249" font-size="15">No read/delete interleaving here.</text><text x="36" y="1281" font-size="15">Reassess on async or deployment change.</text><text x="36" y="1313" font-size="15">No durable or distributed guarantee.</text><text x="20" y="1393" font-size="15">Arrow: inspected evidence → conclusion</text><text x="20" y="1426" font-size="17">One passing run alone is not a proof.</text></svg>
