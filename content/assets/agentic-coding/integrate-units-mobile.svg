<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1157" viewBox="0 0 360 1157" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">One quantity exposes an incompatible scaling assumption</title><desc id="desc">Input 3 each is multiplied to 300 hundredths but the validator and writer interpret the number as each. Removing the conversion retains quantity 3. Input 3.5 separately demonstrates forbidden fractions being accepted after scaling, then correctly rejected without writes.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1157" class="paper"/><text x="20" y="32" font-size="20">Same number type; different units</text><text x="20" y="68" font-size="16">Quantity 3 each · initial P100:4</text><rect x="20" y="106" width="320" height="140" class="neutral"/><text x="36" y="142" font-size="20">Contract at both boundaries</text><text x="36" y="184" font-size="17">CSV and V1 use each.</text><text x="36" y="216" font-size="17">Whole quantities from 0 to 500.</text><rect x="20" y="292" width="320" height="140" class="pending"/><text x="36" y="328" font-size="20">Q1 · wrong scaling</text><text x="36" y="370" font-size="17">Input: 3 each</text><text x="36" y="402" font-size="17">Multiply by 100 → 300 hundredths</text><path d="M180 444v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="497" width="320" height="140" class="pending"/><text x="36" y="533" font-size="20">V1 · interprets 300 as each</text><text x="36" y="575" font-size="17">300 is a valid whole number.</text><text x="36" y="607" font-size="17">Reference writer stores P201:300.</text><rect x="20" y="683" width="320" height="172" class="mint"/><text x="36" y="719" font-size="20" class="accent">Repair · remove the scaling</text><text x="36" y="761" font-size="17">Same input: 3 each</text><text x="36" y="793" font-size="17">V1 accepts 3; writer stores 3.</text><text x="36" y="825" font-size="17">P100 remains 4.</text><rect x="20" y="901" width="320" height="172" class="neutral"/><text x="36" y="937" font-size="20">Contrast · same fraction 3.5</text><text x="36" y="979" font-size="17">Old: 350 is accepted and written.</text><text x="36" y="1011" font-size="17">Fixed: quantity_whole; 0 writes.</text><text x="36" y="1043" font-size="17">Baseline remains P100:4.</text><text x="20" y="1123" font-size="15">Arrows: value passed to the next component</text></svg>
