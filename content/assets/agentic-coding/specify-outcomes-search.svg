<svg xmlns="http://www.w3.org/2000/svg" width="720" height="730" viewBox="0 0 720 730" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Ordering and paging are separate decisions</title><desc id="desc">Equal scores permit two orders until the identifier tie-breaker is specified. The same fictional list then demonstrates a repeat after a between-page insertion. The fixed result set is a chosen requirement, not an implemented guarantee.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.leader{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.intervention{fill:none;stroke:var(--accent);stroke-width:1.4}
.failure{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:4 3}
</style><rect width="720" height="730" class="paper"/><text x="28" y="34" font-size="21">Same fixture. Different permitted orders.</text><text x="28" y="84" font-size="19">Input scores</text><text x="384" y="84" font-size="19">Score only permits both:</text><text x="28" y="128" font-size="20">A10</text><text x="111" y="128" font-size="19">Oak mug</text><text x="294" y="128" font-size="20">8</text><text x="28" y="166" font-size="20">A20</text><text x="111" y="166" font-size="19">Oak bowl</text><text x="294" y="166" font-size="20">8</text><text x="28" y="204" font-size="20">A30</text><text x="111" y="204" font-size="19">Oak tray</text><text x="294" y="204" font-size="20">7</text><text x="392" y="128" font-size="20">A10 · A20 · A30</text><text x="392" y="166" font-size="20">A20 · A10 · A30</text><text x="384" y="211" font-size="18" class="accent">Add identifier tie-breaker</text><text x="392" y="245" font-size="20" class="accent">A10 · A20 · A30</text><path d="M28 279H692" class="fine"/><text x="28" y="319" font-size="21">Changing data is a separate decision</text><text x="28" y="367" font-size="20">Read page 1</text><text x="420" y="367" font-size="21">[A10, A20]</text><text x="28" y="411" font-size="20">Insert A05 with score 8</text><text x="28" y="456" font-size="20">New order: A05, A10, A20, A30</text><text x="28" y="512" font-size="20">Skip 2 in the new order</text><rect x="408" y="482" width="164" height="44" class="failure"/><text x="420" y="512" font-size="21">[A20, A30]</text><text x="590" y="512" font-size="17">A20 repeats</text><rect x="28" y="566" width="664" height="90" class="mint"/><text x="44" y="601" font-size="20" class="accent">Chosen contract: keep the session’s result set</text><text x="44" y="637" font-size="20">Page 2: [A30] · A new search can see A05.</text><text x="28" y="699" font-size="19">A tie-breaker is not a snapshot.</text></svg>
