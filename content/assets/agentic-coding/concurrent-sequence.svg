<svg xmlns="http://www.w3.org/2000/svg" width="720" height="928" viewBox="0 0 720 928" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Compare parallel reconciliation with a chosen sequential dependency</title><desc id="desc">Both fictional layouts preserve the offset correction and internal rename in import-errors.ts. Parallel copies need reconciliation; the selected sequence carries the corrected body into the renamed helper. Final caller evidence remains required, without a performance claim.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="928" class="paper"/><text x="28" y="32" font-size="23">Choose a sequence when edits are coupled</text><text x="28" y="68" font-size="19">Same offset fix + rename; fictional change labels</text><rect x="28" y="107" width="664" height="101" class="neutral"/><text x="44" y="145" font-size="22">Same expectation: dataIndex 1 must report row 2</text><text x="44" y="186" font-size="20">Current +2 gives 3; corrected +1 gives 2 · import-errors.ts</text><text x="28" y="262" font-size="22">Parallel option</text><text x="376" y="262" font-size="22" class="accent">Selected sequence</text><rect x="28" y="291" width="316" height="70" class="neutral"/><text x="44" y="334" font-size="22">BASE-H</text><rect x="376" y="291" width="316" height="70" class="neutral"/><text x="392" y="334" font-size="22">BASE-H</text><path d="M186 373v12H102v18m-5 -6l5 6l5 -6" class="line"/><path d="M186 385H270v18m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="421" width="148" height="100" class="pending"/><text x="44" y="458" font-size="20">Fix body</text><text x="44" y="498" font-size="20">+2 → +1</text><rect x="196" y="421" width="148" height="100" class="pending"/><text x="212" y="458" font-size="20">Rename</text><text x="212" y="498" font-size="17">Old body +2</text><path d="M102 533v15H186v18m-5 -6l5 6l5 -6" class="line"/><path d="M270 533v15H186" class="line"/><rect x="28" y="584" width="316" height="111" class="pending"/><text x="44" y="622" font-size="21">Reconcile both edits</text><text x="44" y="664" font-size="19">Name, body, and callers</text><path d="M534 373v24m-5 -6l5 6l5 -6" class="line"/><rect x="376" y="414" width="316" height="90" class="mint"/><text x="392" y="451" font-size="21" class="accent">A1: fix offset + checks</text><text x="392" y="486" font-size="19">dataIndex + 1</text><path d="M534 516v24m-5 -6l5 6l5 -6" class="line"/><rect x="376" y="557" width="316" height="138" class="mint"/><text x="392" y="594" font-size="21" class="accent">A2: rename from A1</text><text x="392" y="635" font-size="19">toDisplayRow →</text><text x="392" y="666" font-size="19">displayRowNumber</text><rect x="28" y="744" width="664" height="102" class="neutral"/><text x="44" y="782" font-size="21">Final evidence: renamed helper through its relevant caller</text><text x="44" y="824" font-size="20">dataIndex 1 → row 2; both requested edits retained</text><text x="28" y="896" font-size="18">Arrows: dependency structure, not a timing scale or speedup claim</text></svg>
