<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1336" viewBox="0 0 360 1336" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Review consequential importer behavior within the whole fictional patch</title><desc id="desc">The larger fictional change includes copy and naming as well as validation and writes. The removed existing-stock check and per-row upsert are traced to separate overwrite and partial-commit defects under the create-only contract. SQLite references verify the stated state effects, not a production importer.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1336" class="paper"/><text x="20" y="32" font-size="19">Find the consequential policy changes</text><text x="20" y="68" font-size="15">Fictional diff · create-only · initial P100: 4</text><rect x="20" y="106" width="320" height="140" class="neutral"/><text x="36" y="142" font-size="19">Account for the whole patch</text><text x="36" y="184" font-size="17">Preview copy and helper names</text><text x="36" y="216" font-size="17">Validation and writer changes</text><rect x="20" y="292" width="320" height="236" class="mint"/><text x="36" y="328" font-size="19" class="accent">Consequential schematic diff</text><text x="36" y="370" font-size="15">− validate(rows, currentInventory)</text><text x="36" y="402" font-size="15">+ validate(rows)</text><text x="36" y="434" font-size="15">− insertNewRowsAtomically(rows)</text><text x="36" y="466" font-size="15">+ for each row:</text><text x="36" y="498" font-size="15">  await upsertOne(row)</text><path d="M180 540v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="581" width="320" height="172" class="pending"/><text x="36" y="617" font-size="19">Trace the overwrite decision</text><text x="36" y="659" font-size="17">Input P100:99; P201:3</text><text x="36" y="691" font-size="17">Upsert result P100:99; P201:3</text><text x="36" y="723" font-size="17">Required: reject; only P100:4</text><rect x="20" y="799" width="320" height="204" class="pending"/><text x="36" y="835" font-size="20">Trace the write boundary</text><text x="36" y="877" font-size="17">Valid rows P201:3; P202:2</text><text x="36" y="909" font-size="17">Failure before row 2</text><text x="36" y="941" font-size="17">Per-row commit retains P201:3</text><text x="36" y="973" font-size="17">Atomic reference retains P100:4</text><rect x="20" y="1049" width="320" height="172" class="mint"/><text x="36" y="1085" font-size="19" class="accent">Disposition: request changes</text><text x="36" y="1127" font-size="18">Keep existing-SKU rejection.</text><text x="36" y="1159" font-size="18">Keep new rows all or none.</text><text x="36" y="1191" font-size="18">Retain both meaningful checks.</text><text x="20" y="1271" font-size="16">Arrow: edited logic → consequences</text><text x="20" y="1304" font-size="16">No score; mechanical scope still matters.</text></svg>
