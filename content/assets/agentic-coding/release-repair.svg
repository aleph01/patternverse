<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1052" viewBox="0 0 720 1052" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Distinct recovery controls preserve current-state evidence and later valid work</title><desc id="desc">Separate branches show admission disabling, code rollback or fix-forward, and conditional C7 data repair from the same current snapshot. C7 preserves the later sale, uses transaction and retry guards, and remains separate from notification N7. The executed checks concern only a disposable reference under the additive stock assumptions.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="1052" class="paper"/><text x="28" y="32" font-size="23">Containment is not persistent-data repair</text><text x="28" y="68" font-size="18">Fictional incident · same current state for each control below</text><rect x="28" y="106" width="664" height="140" class="neutral"/><text x="44" y="142" font-size="22">After I7 overwrite and legitimate sale S9</text><text x="44" y="184" font-size="19">I7: P100 4→99; P900 8→70. S9 then removes 2 from P100.</text><text x="44" y="216" font-size="19">Current P100:97 (v2); P900:70 (v1).</text><path d="M360 260v22H130v30m-5 -6l5 6l5 -6" class="line"/><path d="M360 282v30m-5 -6l5 6l5 -6" class="line"/><path d="M360 282H590v30m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="334" width="204" height="204" class="neutral"/><text x="44" y="370" font-size="21">Disable F7</text><text x="44" y="412" font-size="16">New admissions stop.</text><text x="44" y="444" font-size="16">Effect: admission</text><text x="44" y="476" font-size="16">Data stays 97 / 70.</text><rect x="258" y="334" width="204" height="204" class="neutral"/><text x="274" y="370" font-size="20">A6 / A8 code</text><text x="274" y="412" font-size="16">Rollback / fix-forward</text><text x="274" y="444" font-size="16">Effect: installed code</text><text x="274" y="476" font-size="16">Data stays 97 / 70.</text><rect x="488" y="334" width="204" height="204" class="mint"/><text x="504" y="370" font-size="20" class="accent">C7 data repair</text><text x="504" y="412" font-size="17">97 − 95 → 2</text><text x="504" y="444" font-size="17">70 − 62 → 8</text><text x="504" y="476" font-size="17">Preserve S9’s sale.</text><text x="28" y="582" font-size="17">Branch arrows: control choice → affected state, not a mandatory sequence.</text><rect x="28" y="614" width="664" height="172" class="mint"/><text x="44" y="650" font-size="22" class="accent">C7 · conditional and repeat-safe reference plan</text><text x="44" y="692" font-size="18">Require verified I7 history; compare expected quantities and versions.</text><text x="44" y="724" font-size="18">Controlled exception: both updates roll back. Retry: fresh quantities 2 / 8.</text><text x="44" y="756" font-size="18">Repeat C7: already applied. A stale plan rejects all updates.</text><rect x="28" y="832" width="664" height="140" class="pending"/><text x="44" y="868" font-size="22">Delivered N7 · separate obligation</text><text x="44" y="910" font-size="18">Notification status is fictional; no delivery recall or correction was executed.</text><text x="44" y="942" font-size="18">The additive repair model does not establish every domain’s recovery rule.</text><text x="28" y="1018" font-size="17">Only disposable SQLite data repair ran; no production rollback or incident fix.</text></svg>
