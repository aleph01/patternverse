<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1097" viewBox="0 0 360 1097" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Separate frontend and backend work under one versioned contract</title><desc id="desc">Fictional ERR-1 is used by separate W-F and W-B working areas. B1 may integrate first if compatible with existing clients; F1 then combines against that state. An assigned integrator verifies actual row 2 display and unchanged P100:4.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1097" class="paper"/><text x="20" y="32" font-size="20">Isolate files. Share the contract.</text><text x="20" y="68" font-size="17">Fictional work areas and integration plan</text><rect x="20" y="106" width="320" height="151" class="mint"/><text x="36" y="142" font-size="21" class="accent">ERR-1 · shared contract</text><text x="36" y="184" font-size="17">POST /imports/preview</text><text x="36" y="213" font-size="17">row: 2 · quantity_nonnegative</text><text x="36" y="242" font-size="17">Data rows start at 1; no writes</text><text x="20" y="289" font-size="19">Both working areas use ERR-1</text><rect x="20" y="312" width="320" height="131" class="boundary"/><text x="36" y="348" font-size="22" class="accent">W-F · frontend F1</text><text x="36" y="390" font-size="18">Separate files + synthetic state</text><text x="36" y="420" font-size="18">Rendering + consumer checks</text><rect x="20" y="490" width="320" height="131" class="boundary"/><text x="36" y="526" font-size="22" class="accent">W-B · backend B1</text><text x="36" y="568" font-size="18">Separate files + synthetic state</text><text x="36" y="598" font-size="18">Endpoint + provider checks</text><path d="M20 379H8V910h12m-6 -5l6 5l-6 5" class="line"/><path d="M180 633v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="675" width="320" height="108" class="neutral"/><text x="36" y="712" font-size="18">I-B: integrate B1 if compatible</text><text x="36" y="753" font-size="19">Preserve existing clients</text><path d="M180 795v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="837" width="320" height="146" class="mint"/><text x="36" y="874" font-size="18" class="accent">I-BF: add F1; check together</text><text x="36" y="916" font-size="17">Actual endpoint → screen: row 2</text><text x="36" y="947" font-size="17">P100 stays 4; retain regressions</text><text x="20" y="1033" font-size="17">Assigned integrator owns evidence.</text><text x="20" y="1065" font-size="17">Arrows: integration prerequisites</text></svg>
