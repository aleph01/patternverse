<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1259" viewBox="0 0 360 1259" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Sequence the header-offset fix before the helper rename</title><desc id="desc">The fictional parallel layout forks a body fix and rename from BASE-H, requiring reconciliation. The selected sequence fixes the offset in A1 then renames from that base in A2. Both plans retain the same requested changes and expected row 2, with no timing claim.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1259" class="paper"/><text x="20" y="32" font-size="17">Choose a sequence when edits are coupled</text><text x="20" y="68" font-size="15">Same offset fix + rename; fictional change labels</text><rect x="20" y="106" width="320" height="100" class="neutral"/><text x="36" y="143" font-size="19">dataIndex 1 must report row 2</text><text x="36" y="184" font-size="16">Current +2 gives 3; correct +1 gives 2</text><text x="20" y="257" font-size="21">Parallel option: same BASE-H</text><rect x="20" y="285" width="320" height="66" class="neutral"/><text x="36" y="325" font-size="22">import-errors.ts</text><path d="M180 363v13H94v18m-5 -6l5 6l5 -6" class="line"/><path d="M180 376H266v18m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="412" width="148" height="101" class="pending"/><text x="36" y="449" font-size="20">Fix body</text><text x="36" y="490" font-size="20">+2 → +1</text><rect x="192" y="412" width="148" height="101" class="pending"/><text x="208" y="449" font-size="20">Rename</text><text x="208" y="490" font-size="17">Old body +2</text><path d="M94 525v18H180v18m-5 -6l5 6l5 -6" class="line"/><path d="M266 525v18H180" class="line"/><rect x="20" y="579" width="320" height="110" class="pending"/><text x="36" y="616" font-size="18">Reconcile name, body, callers</text><text x="36" y="657" font-size="17">Neither isolated edit proves both.</text><text x="20" y="741" font-size="20" class="accent">Selected sequence from BASE-H</text><rect x="20" y="770" width="320" height="90" class="mint"/><text x="36" y="807" font-size="21" class="accent">A1: fix offset + checks</text><text x="36" y="842" font-size="19">dataIndex + 1</text><path d="M180 872v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="913" width="320" height="118" class="mint"/><text x="36" y="950" font-size="21" class="accent">A2: rename from A1</text><text x="36" y="989" font-size="19">toDisplayRow →</text><text x="36" y="1018" font-size="19">displayRowNumber</text><rect x="20" y="1077" width="320" height="100" class="neutral"/><text x="36" y="1114" font-size="17">Verify through the renamed caller</text><text x="36" y="1155" font-size="21">dataIndex 1 → row 2</text><text x="20" y="1227" font-size="17">Arrows: dependencies, not durations</text></svg>
