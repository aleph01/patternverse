<svg xmlns="http://www.w3.org/2000/svg" width="720" height="966" viewBox="0 0 720 966" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Changing the acceptance predicate does not change the fixed rounding output</title><desc id="desc">The three comparisons hold input 2.345, expected 2.35, and actual 2.34 constant. Only the wider inclusive tolerance passes. It does not satisfy the still-current exact display contract or establish an authorized rounding-policy change.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="966" class="paper"/><text x="28" y="32" font-size="23">A passing check can change without a repaired result</text><text x="28" y="68" font-size="19">ROUND-1 · exact decimal values · only the acceptance predicate varies</text><rect x="28" y="106" width="664" height="140" class="neutral"/><text x="44" y="144" font-size="21">Input 2.345 · required nearest rounding with ties away from zero</text><text x="44" y="186" font-size="20">Expected 2.35 · actual 2.34 from ties-to-even</text><text x="44" y="218" font-size="20">Absolute error |2.34 − 2.35| = 0.01 · two-decimal display required</text><rect x="28" y="292" width="664" height="104" class="mint"/><text x="44" y="330" font-size="22" class="accent">Required: exact formatted value</text><text x="44" y="372" font-size="21">Output 2.34 ≠ expected 2.35 → FAIL</text><rect x="28" y="442" width="664" height="104" class="neutral"/><text x="44" y="480" font-size="22">Earlier comparator: absolute error ≤ 0.005</text><text x="44" y="522" font-size="21">Same output 2.34 · error 0.01 &gt; 0.005 → FAIL</text><rect x="28" y="592" width="664" height="104" class="pending"/><text x="44" y="630" font-size="22">Relaxed comparator: absolute error ≤ 0.02</text><text x="44" y="672" font-size="21">Same output 2.34 · error 0.01 ≤ 0.02 → PASS</text><rect x="28" y="742" width="664" height="140" class="mint"/><text x="44" y="780" font-size="22" class="accent">Review whether the requirement actually changed</text><text x="44" y="822" font-size="20">ROUND-1 still requires 2.35. Correct the implementation, or obtain</text><text x="44" y="854" font-size="20">an explicit new contract decision and derive its expectations.</text><text x="28" y="934" font-size="18">No output, input, or requirement changed merely because tolerance widened.</text></svg>
