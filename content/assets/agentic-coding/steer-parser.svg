<svg xmlns="http://www.w3.org/2000/svg" width="720" height="982" viewBox="0 0 720 982" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">One representative quoted input distinguishes two parser approaches</title><desc id="desc">The same CRLF CSV input creates three apparent data rows with literal splitting but two records with the strict reference. The malformed fixture supplies a separate rejection check. The failure changes the implementation decision without certifying a production parser.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="982" class="paper"/><text x="28" y="32" font-size="23">Check the assumption before the upload UI</text><text x="28" y="68" font-size="19">Fictional fixtures · line breaks are CRLF</text><rect x="28" y="106" width="664" height="201" class="neutral"/><text x="44" y="143" font-size="21">Same valid input for both approaches</text><text x="44" y="186" font-size="20">sku,note</text><text x="44" y="217" font-size="20">P100,&quot;front</text><text x="44" y="248" font-size="20">shelf&quot;</text><text x="44" y="279" font-size="20">P200,&quot;He said &quot;&quot;ok&quot;&quot;, then left&quot;</text><path d="M360 319v12H186v18m-5 -6l5 6l5 -6" class="line"/><path d="M360 331H534v18m-5 -6l5 6l5 -6" class="line"/><rect x="28" y="366" width="316" height="184" class="pending"/><text x="44" y="404" font-size="20">Literal CRLF + comma split</text><text x="44" y="447" font-size="18">3 apparent data rows; expected 2</text><text x="44" y="479" font-size="18">shelf&quot; becomes a separate row</text><text x="44" y="511" font-size="18">Note’s comma also splits</text><rect x="376" y="366" width="316" height="184" class="mint"/><text x="392" y="404" font-size="21" class="accent">Strict CSV reference</text><text x="392" y="447" font-size="18">2 records; quoted CRLF retained</text><text x="392" y="479" font-size="18">Escaped quote retained</text><text x="392" y="511" font-size="18">Note’s comma retained</text><rect x="28" y="596" width="664" height="112" class="neutral"/><text x="44" y="634" font-size="21">Separate malformed fixture ends: P100,&quot;front</text><text x="44" y="676" font-size="20">Literal splitter accepts text; strict CSV raises an error.</text><rect x="28" y="754" width="664" height="110" class="mint"/><text x="44" y="792" font-size="22" class="accent">Reject literal splitting before dependent UI work expands</text><text x="44" y="833" font-size="20">Evaluate a parser with the required behavior in the target runtime.</text><text x="28" y="916" font-size="18">Arrows: one input enters a comparison, not measured execution time</text><text x="28" y="950" font-size="18">Reference fixtures only; streaming, limits, and importer behavior remain open.</text></svg>
