<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1185" viewBox="0 0 360 1185" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Quoted CSV probes change the implementation decision</title><desc id="desc">Both approaches receive the same CRLF fixture. A naive splitter creates three rows; a strict reference preserves two records and rejects the separate unfinished quote. Runtime integration and broader dialect behavior remain unchecked.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1185" class="paper"/><text x="20" y="32" font-size="20">Probe quoting before upload work</text><text x="20" y="68" font-size="16">Fictional input · CRLF at line breaks</text><rect x="20" y="106" width="320" height="201" class="neutral"/><text x="36" y="142" font-size="18">Same input for both approaches</text><text x="36" y="181" font-size="17">sku,note</text><text x="36" y="212" font-size="17">P100,&quot;front</text><text x="36" y="243" font-size="17">shelf&quot;</text><text x="36" y="274" font-size="17">P200,&quot;He said &quot;&quot;ok&quot;&quot;, then left&quot;</text><path d="M180 319v24m-5 -6l5 6l5 -6" class="line"/><rect x="20" y="360" width="320" height="158" class="pending"/><text x="36" y="396" font-size="19">Literal CRLF + comma split</text><text x="36" y="436" font-size="17">3 apparent data rows; expected 2</text><text x="36" y="466" font-size="17">shelf&quot; becomes a separate row</text><text x="36" y="496" font-size="17">Comma inside note also splits</text><rect x="20" y="564" width="320" height="148" class="mint"/><text x="36" y="600" font-size="21" class="accent">Strict CSV reference</text><text x="36" y="641" font-size="16">2 records; multiline note retained</text><text x="36" y="671" font-size="16">Escaped quote and comma retained</text><rect x="20" y="758" width="320" height="158" class="neutral"/><text x="36" y="794" font-size="17">Separate unfinished-quote probe</text><text x="36" y="834" font-size="17">P100,&quot;front</text><text x="36" y="865" font-size="17">Splitter accepts; strict CSV errors</text><rect x="20" y="962" width="320" height="110" class="mint"/><text x="36" y="998" font-size="18" class="accent">Decision: reject literal splitting</text><text x="36" y="1039" font-size="17">Evaluate parser in target runtime</text><text x="20" y="1120" font-size="16">Arrows: probe input into comparison</text><text x="20" y="1153" font-size="17">Fixtures do not certify an importer.</text></svg>
