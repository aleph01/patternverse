<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1005" viewBox="0 0 360 1005" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Make the import boundary and overwrite decision explicit</title><desc id="desc">Fictional retained behavior and permitted changes are separate from D-01. Before the decision, reject retains quantity 4 and replace would store 8. Accepted policy rejects the file, but implementation still needs verification.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1005" class="paper"/><text x="20" y="32" font-size="20">CSV import: set the boundary</text><rect x="20" y="72" width="320" height="168" class="neutral"/><text x="36" y="108" font-size="20">Keep working</text><text x="36" y="150" font-size="19">Manual entry</text><text x="36" y="185" font-size="19">Existing validation</text><text x="36" y="220" font-size="18">Existing form checks</text><text x="20" y="274" font-size="18" class="accent">Reuse existing validation</text><rect x="20" y="300" width="320" height="168" class="boundary"/><text x="36" y="336" font-size="20" class="accent">Permitted change</text><text x="36" y="376" font-size="19">CSV preview</text><text x="36" y="411" font-size="19">Import confirmation</text><text x="36" y="446" font-size="18">Reuse validation</text><rect x="20" y="518" width="320" height="220" class="pending"/><text x="36" y="554" font-size="20">D-01: open decision</text><text x="36" y="597" font-size="19">Existing P100 = 4</text><text x="36" y="631" font-size="19">Incoming P100 = 8</text><text x="36" y="677" font-size="20">Reject → 4</text><text x="196" y="712" font-size="20">Replace → 8</text><rect x="20" y="785" width="320" height="136" class="mint"/><text x="36" y="821" font-size="20" class="accent">D-01: accepted</text><text x="36" y="859" font-size="18">Reject file on existing SKU.</text><text x="36" y="894" font-size="20">P100 stays 4.</text><text x="20" y="975" font-size="19">Accepted ≠ implemented</text></svg>
