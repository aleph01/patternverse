<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1294" viewBox="0 0 360 1294" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Separate deployment, admission, observations and a stop decision</title><desc id="desc">Artifact A7 stays installed while F7 permits only P7 and P8. Constructed I7 reports completion despite forbidden overwrites, driving a pause and disable decision. New admissions and queued J8 are blocked in reference functions; committed data remains and real propagation and in-flight cancellation were not tested.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="360" height="1294" class="paper"/><text x="20" y="32" font-size="20">Deployment and exposure differ</text><text x="20" y="68" font-size="16">Fictional R7 · no live rollout performed</text><rect x="20" y="106" width="320" height="140" class="neutral"/><text x="36" y="142" font-size="20">Deployment · A7 installed</text><text x="36" y="184" font-size="17">Source MAIN7 · schema D1</text><text x="36" y="216" font-size="17">Installed does not mean admitted.</text><rect x="20" y="292" width="320" height="172" class="mint"/><text x="36" y="328" font-size="20" class="accent">Separate control · F7 exposure</text><text x="36" y="370" font-size="17">Admit authorized P7 and P8.</text><text x="36" y="402" font-size="17">P9 stays excluded.</text><text x="36" y="434" font-size="17">Workers recheck before starting.</text><path d="M180 476v24m-5 -6l5 6l5 -6" class="line"/><text x="20" y="530" font-size="16">Admitted work supplies observations</text><rect x="20" y="556" width="320" height="172" class="pending"/><text x="36" y="592" font-size="20">Constructed I7 · P7</text><text x="36" y="634" font-size="17">Status says completed.</text><text x="36" y="666" font-size="17">P100: 4 → 99; P900: 8 → 70</text><text x="36" y="698" font-size="17">Create-only rule forbids both.</text><path d="M180 740v24m-5 -6l5 6l5 -6" class="line"/><text x="20" y="794" font-size="16">Integrity violation determines stop</text><rect x="20" y="820" width="320" height="172" class="mint"/><text x="36" y="856" font-size="20" class="accent">Pause expansion; disable F7</text><text x="36" y="898" font-size="17">No new P7/P8 admissions.</text><text x="36" y="930" font-size="17">Queued J8 cannot start.</text><text x="36" y="962" font-size="17">Verify propagation and in-flight work.</text><rect x="20" y="1038" width="320" height="172" class="neutral"/><text x="36" y="1074" font-size="20">What disabling leaves intact</text><text x="36" y="1116" font-size="17">Artifact A7 remains installed.</text><text x="36" y="1148" font-size="17">Committed P100:99; P900:70</text><text x="36" y="1180" font-size="17">Repair is a separate decision.</text><text x="20" y="1260" font-size="16">Missing evidence → hold expansion.</text></svg>
