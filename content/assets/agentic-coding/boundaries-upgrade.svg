<svg xmlns="http://www.w3.org/2000/svg" width="720" height="657" viewBox="0 0 720 657" role="img" aria-labelledby="title desc" data-agentic-style="light-editorial">
<title id="title">Investigate a dependency break without silently expanding scope</title><desc id="desc">A fictional client API changes from token value to callback. The logical decision fork is conditional on a bounded investigation, not a measured timeline. Compatibility work may continue; authentication redesign requires a separate explicit scope decision.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.neutral{fill:var(--neutral)}.mint{fill:var(--mint);stroke:var(--accent);stroke-width:1}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}.line{fill:none;stroke:var(--ink);stroke-width:1.1}
.accent{fill:var(--accent)}.boundary{fill:none;stroke:var(--accent);stroke-width:1.3}
.pending{fill:none;stroke:var(--ink);stroke-width:1.1;stroke-dasharray:5 4}
</style><rect width="720" height="657" class="paper"/><text x="28" y="34" font-size="21">Upgrade client; preserve session rules.</text><rect x="28" y="74" width="300" height="94" class="neutral"/><rect x="392" y="74" width="300" height="94" class="neutral"/><text x="44" y="108" font-size="19">Client v1</text><text x="44" y="143" font-size="20">Token value</text><text x="408" y="108" font-size="19">Client v2</text><text x="408" y="143" font-size="20">Token callback</text><path d="M328 126H392" class="line"/><rect x="28" y="218" width="664" height="92" class="mint"/><text x="44" y="252" font-size="20" class="accent">Bounded adapter investigation</text><text x="44" y="287" font-size="20">Can existing credential behavior be preserved?</text><path d="M360 310V348M178 392V348H550V392" class="line"/><text x="116" y="381" font-size="18">Yes</text><text x="491" y="381" font-size="18">No</text><rect x="28" y="410" width="300" height="122" class="boundary"/><text x="44" y="447" font-size="20" class="accent">Continue upgrade</text><text x="44" y="489" font-size="19">Check session behavior</text><rect x="392" y="410" width="300" height="122" class="pending"/><text x="408" y="447" font-size="20">Return a decision</text><text x="408" y="489" font-size="19">Defer or revise scope</text><text x="28" y="586" font-size="20">An auth redesign is still outside the task.</text><text x="28" y="627" font-size="19">Proposing expansion does not accept it.</text></svg>
