<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Choose the interaction by the kind of help needed</title>
  <desc id="desc">An illustrative comparison of three Team Topologies interaction modes. For a capability gap, facilitation means one team helps another practise, with capability and work ownership remaining with the receiving team. For shared uncertainty, collaboration means teams discover an answer together for a defined period. For a recurring need, X-as-a-Service means one team provides a supported capability that another consumes. These are interaction modes rather than additional team types, and the relationship should be reviewed when the need changes.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">What kind of help does the team need?</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Choose the relationship by its purpose, not by the helper’s title.</text>
    <rect x="60" y="190" width="330" height="355" rx="16" fill="#DCEDE8"/>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="435" y="190" width="330" height="355" rx="16"/>
      <rect x="810" y="190" width="330" height="355" rx="16"/>
    </g>
    <g text-anchor="middle" font-size="23" fill="#52646D">
      <text x="225" y="239">A capability gap</text>
      <text x="600" y="239">Shared uncertainty</text>
      <text x="975" y="239">A recurring need</text>
    </g>
    <g text-anchor="middle" font-size="28" font-weight="700">
      <text x="225" y="295" fill="#176E69">Facilitation</text>
      <text x="600" y="295" fill="#183343">Collaboration</text>
      <text x="975" y="295" fill="#183343">X-as-a-Service</text>
    </g>
    <g text-anchor="middle" font-size="23" fill="#183343">
      <text x="225" y="365">One team helps another</text>
      <text x="225" y="405">practise and learn</text>
      <text x="600" y="365">Teams discover together</text>
      <text x="600" y="405">for a defined period</text>
      <text x="975" y="365">One provides; one uses</text>
      <text x="975" y="405">a supported capability</text>
    </g>
    <g text-anchor="middle" font-size="23" font-weight="700" fill="#176E69">
      <text x="225" y="475">Recipient gains ability</text>
      <text x="600" y="475">A clearer shared answer</text>
      <text x="975" y="475">Supported consumption</text>
    </g>
    <g text-anchor="middle" font-size="21" fill="#52646D">
      <text x="225" y="513">Ownership stays with it</text>
      <text x="600" y="513">Agree what follows</text>
      <text x="975" y="513">Provider maintains the offer</text>
    </g>
    <rect x="60" y="610" width="1080" height="90" rx="16" fill="#183343"/>
    <text x="600" y="663" text-anchor="middle" font-size="27" font-weight="700" fill="#FFFFFF">Choose by the need. Review when the need changes.</text>
    <text x="60" y="744" font-size="22" fill="#52646D">These are interaction modes, not three new team types. Illustrative comparison.</text>
  </g>
</svg>
