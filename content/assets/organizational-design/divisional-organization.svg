<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Divisions contain the capabilities needed for their business</title>
  <desc id="desc">A corporate center sets enterprise direction above two product divisions. Each division combines engineering, operations, and sales around a distinct customer outcome. Shared services support both through agreements. Solid lines show organizational grouping and dashed green lines show shared support. The equipment businesses are hypothetical, not a P&amp;G or Toyota organization chart.</desc>
  <rect width="1200" height="720" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Capabilities grouped around each business.</text>
    <rect x="350" y="101" width="500" height="99" rx="14" fill="#183343"/>
    <text x="600" y="141" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">Corporate center</text>
    <text x="600" y="177" text-anchor="middle" font-size="23" fill="#FFFFFF">Direction · capital · common commitments</text>
    <path d="M600 200V224M310 224H890M310 224V258M890 224V258" fill="none" stroke="#898983" stroke-width="4"/>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="258" width="500" height="240" rx="16"/>
      <rect x="640" y="258" width="500" height="240" rx="16"/>
    </g>
    <g text-anchor="middle" fill="#183343" font-size="28" font-weight="700">
      <text x="310" y="302">Household equipment division</text>
      <text x="890" y="302">Industrial equipment division</text>
    </g>
    <g fill="#DCEDE8">
      <rect x="85" y="329" width="450" height="62" rx="10"/>
      <rect x="665" y="329" width="450" height="62" rx="10"/>
    </g>
    <g fill="#176E69" text-anchor="middle" font-size="24" font-weight="700">
      <text x="310" y="369">Engineering · Operations · Sales</text>
      <text x="890" y="369">Engineering · Operations · Sales</text>
    </g>
    <g fill="#52646D" text-anchor="middle" font-size="24">
      <text x="310" y="430">Own priorities + accountable leader</text>
      <text x="310" y="467">Result for household customers</text>
      <text x="890" y="430">Own priorities + accountable leader</text>
      <text x="890" y="467">Result for industrial customers</text>
    </g>
    <path d="M310 498V550M890 498V550" fill="none" stroke="#176E69" stroke-width="4" stroke-dasharray="9 8"/>
    <rect x="60" y="550" width="1080" height="85" rx="16" fill="#DCEDE8"/>
    <text x="600" y="585" text-anchor="middle" font-size="25" font-weight="700" fill="#176E69">SHARED SERVICES</text>
    <text x="600" y="618" text-anchor="middle" font-size="23" fill="#183343">Agree scope, capacity, priorities, and how exceptions are resolved.</text>
    <text x="60" y="680" font-size="22" fill="#52646D">Illustrative structure. A division can use shared capabilities while owning its business result.</text>
  </g>
</svg>
