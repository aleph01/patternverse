<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Keep specialist depth behind a usable boundary</title>
  <desc id="desc">A delivery team owns a customer workflow and its integration. A specialist team owns the demanding subsystem's implementation, evaluation, and maintenance. Between them, a defined interface makes inputs, outputs, assumptions, limits, failures, and version expectations explicit. Teams collaborate to shape new boundaries, then use the supported interface with limited routine coordination. This is a hypothetical arrangement, not a Mimecast or DoorDash organization chart.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Keep specialist depth behind a usable boundary.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">The consumer owns the workflow; specialists own the subsystem and its behaviour.</text>
    <rect x="60" y="190" width="300" height="250" rx="16" fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2"/>
    <rect x="440" y="225" width="320" height="180" rx="16" fill="#DCEDE8"/>
    <rect x="840" y="190" width="300" height="250" rx="16" fill="#183343"/>
    <g text-anchor="middle" font-size="28" font-weight="700">
      <text x="210" y="239" fill="#183343">Delivery team</text>
      <text x="600" y="269" fill="#176E69">Defined interface</text>
      <text x="990" y="239" fill="#FFFFFF">Specialist team</text>
    </g>
    <g text-anchor="middle" font-size="23">
      <g fill="#52646D">
        <text x="210" y="302">Customer workflow</text>
        <text x="210" y="350">Integration + outcomes</text>
        <text x="210" y="398">Product priorities</text>
      </g>
      <g fill="#183343">
        <text x="600" y="310">Inputs + outputs</text>
        <text x="600" y="347">Assumptions + limits</text>
        <text x="600" y="384">Failures + versions</text>
      </g>
      <g fill="#FFFFFF">
        <text x="990" y="302">Subsystem internals</text>
        <text x="990" y="350">Specialist evaluation</text>
        <text x="990" y="398">Maintenance + lifecycle</text>
      </g>
    </g>
    <path d="M360 315H440M760 315H840" fill="none" stroke="#176E69" stroke-width="4"/>
    <g fill="#176E69">
      <path d="M360 315L375 307V323ZM440 315L425 307V323Z"/>
      <path d="M760 315L775 307V323ZM840 315L825 307V323Z"/>
    </g>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="515" width="500" height="130" rx="14"/>
      <rect x="640" y="515" width="500" height="130" rx="14"/>
    </g>
    <g text-anchor="middle">
      <g fill="#176E69" font-size="25" font-weight="700">
        <text x="310" y="558">Shape the boundary together</text>
        <text x="890" y="558">Use the supported capability</text>
      </g>
      <g fill="#52646D" font-size="23">
        <text x="310" y="599">New needs + changed assumptions</text>
        <text x="890" y="599">Limited routine coordination</text>
      </g>
    </g>
    <text x="60" y="708" font-size="23" fill="#183343">Revisit the boundary if ordinary consumer changes constantly require specialist intervention.</text>
    <text x="60" y="745" font-size="21" fill="#52646D">Connections show capability use and responsibility, not reporting lines. Hypothetical arrangement.</text>
  </g>
</svg>
