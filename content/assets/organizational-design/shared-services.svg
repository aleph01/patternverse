<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">One provider, explicit service commitments</title>
  <desc id="desc">Three divisions retain their business decisions and submit approved requests to one shared service provider. A service agreement defines scope, inputs, timing, and priorities. Completed work returns to the divisions. Provider and customer representatives review quality, delays, costs, and changes. This is a hypothetical arrangement, not a Siemens or UK government organization chart.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">One provider. Explicit service commitments.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Business units keep their decisions; the provider owns agreed delivery.</text>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="150" width="300" height="120" rx="16"/>
      <rect x="450" y="150" width="300" height="120" rx="16"/>
      <rect x="840" y="150" width="300" height="120" rx="16"/>
    </g>
    <g text-anchor="middle" fill="#183343" font-size="28" font-weight="700">
      <text x="210" y="193">Division A</text>
      <text x="600" y="193">Division B</text>
      <text x="990" y="193">Division C</text>
    </g>
    <g text-anchor="middle" fill="#52646D" font-size="23">
      <text x="210" y="237">Business decisions + inputs</text>
      <text x="600" y="237">Business decisions + inputs</text>
      <text x="990" y="237">Business decisions + inputs</text>
    </g>
    <g fill="none" stroke="#176E69" stroke-width="4" stroke-linejoin="round">
      <path d="M210 270V380M600 270V380M990 270V380"/>
    </g>
    <g fill="#176E69">
      <path d="M210 270L202 285H218ZM600 270L592 285H608ZM990 270L982 285H998Z"/>
      <path d="M210 380L202 365H218ZM600 380L592 365H608ZM990 380L982 365H998Z"/>
    </g>
    <g fill="#F6F4EF">
      <rect x="275" y="293" width="650" height="64" rx="10"/>
    </g>
    <g text-anchor="middle" fill="#176E69" font-size="23">
      <text x="600" y="315">Approved requests ↓</text>
      <text x="600" y="346">↑ Completed work + status</text>
    </g>
    <rect x="60" y="380" width="1080" height="85" rx="14" fill="#DCEDE8"/>
    <text x="600" y="414" text-anchor="middle" font-size="25" font-weight="700" fill="#176E69">Service agreement</text>
    <text x="600" y="447" text-anchor="middle" font-size="23" fill="#183343">Scope · required inputs · timing · capacity and priority rules</text>
    <path d="M600 465V495" fill="none" stroke="#176E69" stroke-width="4"/>
    <rect x="250" y="495" width="700" height="125" rx="16" fill="#183343"/>
    <g text-anchor="middle" fill="#FFFFFF">
      <text x="600" y="538" font-size="28" font-weight="700">Shared service provider</text>
      <text x="600" y="577" font-size="23">Service owner · pooled staff · common process and tools</text>
      <text x="600" y="606" font-size="23">Responsible for delivery, quality, and improvement</text>
    </g>
    <path d="M600 620V652" fill="none" stroke="#898983" stroke-width="3"/>
    <rect x="60" y="652" width="1080" height="65" rx="12" fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2"/>
    <text x="600" y="692" text-anchor="middle" font-size="23" fill="#52646D">Joint review: quality · delays · total cost · exceptions · changes</text>
  </g>
</svg>
