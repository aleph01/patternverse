<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Transfer capability, then reduce assistance</title>
  <desc id="desc">A continuing enabling team brings specialist knowledge and facilitation to a bounded engagement with a delivery team. The delivery team owns its service throughout. Three activities identify a capability gap, practise on real work together, and demonstrate capability with less help. A review leads to reduced assistance, a revised learning goal, or action on a structural obstacle. The diagram is hypothetical and is not a Target or retailer organization chart.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Transfer capability. Reduce assistance.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">The delivery team keeps ownership while specialists help it learn.</text>
    <rect x="60" y="150" width="500" height="120" rx="16" fill="#183343"/>
    <g text-anchor="middle" fill="#FFFFFF">
      <text x="310" y="194" font-size="28" font-weight="700">Enabling team</text>
      <text x="310" y="237" font-size="23">Specialist knowledge + facilitation</text>
    </g>
    <rect x="640" y="150" width="500" height="120" rx="16" fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2"/>
    <g text-anchor="middle" fill="#183343">
      <text x="890" y="194" font-size="28" font-weight="700">Delivery team</text>
      <text x="890" y="237" font-size="23">Owns its service throughout</text>
    </g>
    <path d="M310 270V325M890 270V325" fill="none" stroke="#176E69" stroke-width="3" stroke-dasharray="9 7"/>
    <rect x="60" y="325" width="1080" height="260" rx="18" fill="#DCEDE8"/>
    <text x="90" y="369" font-size="27" font-weight="700" fill="#176E69">Bounded engagement: shared goal + review points</text>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="90" y="407" width="270" height="130" rx="14"/>
      <rect x="465" y="407" width="270" height="130" rx="14"/>
      <rect x="840" y="407" width="270" height="130" rx="14"/>
    </g>
    <g text-anchor="middle" fill="#183343" font-size="26" font-weight="700">
      <text x="225" y="451">Understand the gap</text>
      <text x="600" y="451">Practise together</text>
      <text x="975" y="451">Demonstrate ability</text>
    </g>
    <g text-anchor="middle" fill="#52646D" font-size="23">
      <text x="225" y="500">Define the capability</text>
      <text x="600" y="500">Apply it to real work</text>
      <text x="975" y="500">Perform with less help</text>
    </g>
    <path d="M360 472H465M735 472H840" fill="none" stroke="#176E69" stroke-width="4"/>
    <g fill="#176E69">
      <path d="M465 472L450 464V480ZM840 472L825 464V480Z"/>
    </g>
    <path d="M600 585V630" fill="none" stroke="#898983" stroke-width="3"/>
    <rect x="60" y="630" width="1080" height="70" rx="14" fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2"/>
    <text x="600" y="672" text-anchor="middle" font-size="24" fill="#183343">Review: reduce help · revise the goal · address a structural obstacle</text>
    <text x="60" y="744" font-size="21" fill="#52646D">The enabling team may continue; its daily involvement with a particular team should have a purpose and an end.</text>
  </g>
</svg>
