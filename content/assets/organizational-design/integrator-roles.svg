<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Someone keeps the combined result coherent</title>
  <desc id="desc">Design, production, and delivery keep their specialist responsibilities and communicate directly. An integrator works across their commitments, maintaining the shared picture, dependencies, and tradeoffs within an explicit mandate. Information and agreements move in both directions. A named authority settles choices beyond the integrator's mandate. Links show coordination, not reporting lines. This furniture-launch illustration is not Toyota or Google's organization chart.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Someone keeps the combined result coherent.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Specialist ownership stays clear; dependencies receive sustained attention.</text>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="180" width="300" height="140" rx="18"/>
      <rect x="450" y="180" width="300" height="140" rx="18"/>
      <rect x="840" y="180" width="300" height="140" rx="18"/>
      <rect x="880" y="450" width="260" height="150" rx="18"/>
    </g>
    <g text-anchor="middle" fill="#183343" font-size="28" font-weight="700">
      <text x="210" y="233">Design</text>
      <text x="600" y="233">Production</text>
      <text x="990" y="233">Delivery</text>
    </g>
    <g text-anchor="middle" fill="#52646D" font-size="24">
      <text x="210" y="284">Specialist delivery</text>
      <text x="600" y="284">Specialist delivery</text>
      <text x="990" y="284">Specialist delivery</text>
    </g>
    <path d="M360 250H450M750 250H840" fill="none" stroke="#898983" stroke-width="3"/>
    <path d="M210 320V385H990V320M600 320V385M415 385V450" fill="none" stroke="#176E69" stroke-width="3"/>
    <path d="M210 320L203 334H217ZM600 320L593 334H607ZM990 320L983 334H997ZM415 450L408 436H422Z" fill="#176E69"/>
    <text x="780" y="421" text-anchor="middle" font-size="23" fill="#52646D">Share constraints + agree commitments</text>
    <rect x="60" y="450" width="710" height="150" rx="18" fill="#DCEDE8" stroke="#176E69" stroke-width="3"/>
    <g text-anchor="middle">
      <text x="415" y="496" font-size="28" font-weight="700" fill="#176E69">Integrator</text>
      <text x="415" y="540" font-size="25" fill="#183343">Shared picture · dependencies · tradeoffs</text>
      <text x="415" y="580" font-size="23" fill="#52646D">Coordinate within an explicit mandate</text>
      <text x="1010" y="496" font-size="25" font-weight="700" fill="#183343">Named authority</text>
      <text x="1010" y="540" font-size="22" fill="#52646D">Resolve choices</text>
      <text x="1010" y="580" font-size="22" fill="#52646D">beyond the mandate</text>
    </g>
    <path d="M770 525H880" fill="none" stroke="#898983" stroke-width="3"/>
    <path d="M880 525L866 518V532Z" fill="#898983"/>
    <text x="60" y="678" font-size="23" fill="#52646D">Units retain specialist delivery and communicate directly.</text>
    <text x="60" y="743" font-size="20" fill="#52646D">Illustrative mechanism. Links show coordination, not reporting lines. Review mandates as work changes.</text>
  </g>
</svg>
