<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Work closely for discovery, then choose what follows</title>
  <desc id="desc">Two continuing teams with their own responsibilities enter a bounded joint engagement. They agree one discovery question, protected capacity, decision rights, evidence, and a review date. At review they choose separate delivery, a supported service interface, a revised boundary, or explicit renewal. Exit readiness includes owners, support, unfinished work, and the next interaction. This is a hypothetical mechanism diagram, not a Rockwell Automation organization chart.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Work closely for discovery. Choose what follows.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Intensive joint work is an investment with a purpose and a review point.</text>
    <g font-size="25" font-weight="700" text-anchor="middle" fill="#183343">
      <text x="210" y="177">Continuing teams</text>
      <text x="600" y="177">Bounded joint work</text>
      <text x="990" y="177">Review + transition</text>
    </g>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="220" width="300" height="110" rx="14"/>
      <rect x="60" y="410" width="300" height="110" rx="14"/>
      <rect x="840" y="220" width="300" height="300" rx="16"/>
    </g>
    <g text-anchor="middle">
      <g fill="#183343" font-size="28" font-weight="700">
        <text x="210" y="263">Team A</text>
        <text x="210" y="453">Team B</text>
      </g>
      <g fill="#52646D" font-size="23">
        <text x="210" y="306">Own responsibilities</text>
        <text x="210" y="496">Own responsibilities</text>
        <text x="210" y="377">Shared uncertainty</text>
      </g>
    </g>
    <rect x="435" y="220" width="330" height="300" rx="16" fill="#DCEDE8"/>
    <g text-anchor="middle">
      <text x="600" y="268" font-size="27" font-weight="700" fill="#176E69">Shared discovery</text>
      <g fill="#183343" font-size="23">
        <text x="600" y="327">One question</text>
        <text x="600" y="376">Capacity + decision rights</text>
        <text x="600" y="425">Evidence + review date</text>
      </g>
      <text x="600" y="484" font-size="23" fill="#176E69">Both teams contribute</text>
    </g>
    <path d="M360 370H435M765 370H840" fill="none" stroke="#176E69" stroke-width="4"/>
    <g fill="#176E69">
      <path d="M435 370L420 362V378ZM840 370L825 362V378Z"/>
    </g>
    <g text-anchor="middle">
      <text x="990" y="268" font-size="26" font-weight="700" fill="#183343">Choose next mode</text>
      <g fill="#52646D" font-size="23">
        <text x="990" y="327">Separate delivery</text>
        <text x="990" y="376">Supported service</text>
        <text x="990" y="425">Revised boundary</text>
        <text x="990" y="474">Renew explicitly</text>
      </g>
    </g>
    <text x="60" y="574" font-size="23" fill="#52646D">The review chooses the next arrangement; a date alone does not settle ownership.</text>
    <rect x="60" y="625" width="1080" height="70" rx="14" fill="#183343"/>
    <text x="600" y="668" text-anchor="middle" font-size="24" fill="#FFFFFF">Exit readiness: owners · support · unfinished work · next interaction</text>
    <text x="60" y="744" font-size="21" fill="#52646D">Renewal needs a remaining question, committed capacity, and a new review date. Hypothetical arrangement.</text>
  </g>
</svg>
