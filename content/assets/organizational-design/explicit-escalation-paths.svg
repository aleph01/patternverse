<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A known route, an accepted handoff, a returned outcome</title>
  <desc id="desc">An issue owner recognizes a trigger and sends impact, context, and a specific request to a named receiving role. The role acknowledges and confirms responsibility, then provides help or an authorized decision with a next-action owner. Missing acknowledgement uses a fallback contact; an issue still unresolved or beyond the receiver's remit uses an agreed wider route. Outcomes and follow-up return to the issue owner and affected people. This is an illustrative mechanism, not Google or NASA's exact escalation procedure.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">A known route. An accepted handoff. A returned outcome.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Receipt, responsibility, and resolution are separate checks.</text>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="230" width="290" height="200" rx="18"/>
      <rect x="850" y="230" width="290" height="200" rx="18"/>
      <rect x="60" y="535" width="340" height="115" rx="16"/>
      <rect x="620" y="535" width="520" height="115" rx="16"/>
    </g>
    <rect x="455" y="230" width="290" height="200" rx="18" fill="#DCEDE8" stroke="#176E69" stroke-width="3"/>
    <g text-anchor="middle" font-size="27" font-weight="700" fill="#183343">
      <text x="205" y="279">Issue owner</text>
      <text x="600" y="279" fill="#176E69">Receiving role</text>
      <text x="995" y="279">Help or decision</text>
      <text x="230" y="580">No response?</text>
      <text x="880" y="580">Unresolved or beyond remit?</text>
    </g>
    <g text-anchor="middle" font-size="23" fill="#52646D">
      <text x="205" y="333">Trigger + impact</text>
      <text x="205" y="387">Specific request</text>
      <text x="600" y="333">Acknowledge</text>
      <text x="600" y="387">Confirm responsibility</text>
      <text x="995" y="333">Authority clear</text>
      <text x="995" y="387">Next action + owner</text>
      <text x="230" y="625">Use fallback contact</text>
      <text x="880" y="625">Use the agreed wider route</text>
    </g>
    <path d="M350 330H455M745 330H850" fill="none" stroke="#176E69" stroke-width="4"/>
    <path d="M455 330L440 322V338ZM850 330L835 322V338Z" fill="#176E69"/>
    <path d="M600 430V480H230V535M995 430V535M995 230V155H205V230" fill="none" stroke="#898983" stroke-width="3"/>
    <path d="M230 535L223 521H237ZM995 535L988 521H1002ZM205 230L198 216H212Z" fill="#898983"/>
    <text x="600" y="193" text-anchor="middle" font-size="22" fill="#52646D">Return the outcome + follow-up</text>
    <text x="60" y="708" font-size="22" fill="#52646D">Keep agreed responsibilities until a handoff is accepted; make any authority change explicit.</text>
    <text x="60" y="745" font-size="20" fill="#52646D">Illustrative mechanism. Acknowledgement confirms receipt, not resolution.</text>
  </g>
</svg>
