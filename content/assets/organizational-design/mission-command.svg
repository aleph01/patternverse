<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Clear intent, bounded local judgment</title>
  <desc id="desc">Leadership sets purpose, the desired result, priorities, boundaries, resources, and reserved decisions. Three regional teams receive authority to choose and adapt their own methods within delegated limits. Teams coordinate and report; updates and exceptions return to leadership. Matters beyond delegated authority are escalated and required controls remain. Competence, trust, and shared understanding support the arrangement. This is an illustrative mechanism diagram, not the organization chart of Santa Fe or Netflix.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Clear intent. Bounded local judgment.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Leadership sets direction; capable teams adapt the method.</text>
    <rect x="270" y="150" width="660" height="110" rx="16" fill="#183343"/>
    <g text-anchor="middle" fill="#FFFFFF">
      <text x="600" y="193" font-size="27" font-weight="700">Purpose · desired result · priorities</text>
      <text x="600" y="234" font-size="23">Boundaries · resources · reserved decisions</text>
    </g>
    <path d="M600 260V335" fill="none" stroke="#176E69" stroke-width="4"/>
    <path d="M600 335L592 320H608Z" fill="#176E69"/>
    <rect x="60" y="335" width="1080" height="240" rx="18" fill="#DCEDE8"/>
    <text x="600" y="378" text-anchor="middle" font-size="27" font-weight="700" fill="#176E69">Local discretion within delegated limits</text>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="90" y="405" width="300" height="95" rx="14"/>
      <rect x="450" y="405" width="300" height="95" rx="14"/>
      <rect x="810" y="405" width="300" height="95" rx="14"/>
    </g>
    <g text-anchor="middle" fill="#183343" font-size="26" font-weight="700">
      <text x="240" y="444">Regional team A</text>
      <text x="600" y="444">Regional team B</text>
      <text x="960" y="444">Regional team C</text>
    </g>
    <g text-anchor="middle" fill="#52646D" font-size="22">
      <text x="240" y="479">Local choice of method</text>
      <text x="600" y="479">Local choice of method</text>
      <text x="960" y="479">Local choice of method</text>
    </g>
    <text x="600" y="548" text-anchor="middle" font-size="25" fill="#183343">Choose · adapt · coordinate · report</text>
    <path d="M1140 455H1170V205H930" fill="none" stroke="#898983" stroke-width="3" stroke-dasharray="9 7"/>
    <path d="M930 205L945 197V213Z" fill="#898983"/>
    <g text-anchor="middle" fill="#52646D" font-size="22">
      <text x="1040" y="151">Updates +</text>
      <text x="1040" y="181">exceptions</text>
    </g>
    <rect x="60" y="625" width="1080" height="70" rx="14" fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2"/>
    <text x="600" y="668" text-anchor="middle" font-size="26" fill="#183343">Escalate beyond authority; retain required controls.</text>
    <text x="60" y="744" font-size="21" fill="#52646D">Competence + trust + shared understanding make discretion usable. Illustrative arrangement.</text>
  </g>
</svg>
