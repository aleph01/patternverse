<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Keep authority near usable knowledge</title>
  <desc id="desc">People near the work examine knowledge, capability, mandate, and effects on others. When equipped and authorized, they decide locally and inform those affected. Missing expertise calls for support closer to the work. A choice beyond their authority goes to a wider authorized decision-maker with the relevant facts. The branches describe responses to different needs, not an automatic approval chain. This is an illustrative mechanism, not Toyota or Timpson's organizational chart.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Keep authority near usable knowledge.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Choose the nearest capable decision-maker who can account for the effects.</text>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="230" width="280" height="300" rx="18"/>
      <rect x="420" y="230" width="330" height="300" rx="18"/>
      <rect x="870" y="340" width="270" height="130" rx="16"/>
      <rect x="870" y="520" width="270" height="130" rx="16"/>
    </g>
    <rect x="870" y="160" width="270" height="130" rx="16" fill="#DCEDE8" stroke="#176E69" stroke-width="3"/>
    <g text-anchor="middle" fill="#183343">
      <text x="200" y="286" font-size="25" font-weight="700">People near the work</text>
      <text x="200" y="356" font-size="24">Encounter the facts</text>
      <text x="200" y="412" font-size="24">See the result</text>
      <text x="200" y="468" font-size="24">Recognize the choice</text>
      <text x="585" y="286" font-size="27" font-weight="700">Check the decision</text>
      <text x="585" y="348" font-size="24">Knowledge</text>
      <text x="585" y="394" font-size="24">Capability</text>
      <text x="585" y="440" font-size="24">Mandate</text>
      <text x="585" y="486" font-size="24">Effects on others</text>
    </g>
    <g text-anchor="middle" font-size="24" font-weight="700">
      <text x="1005" y="205" fill="#176E69">Equipped + authorized</text>
      <text x="1005" y="385" fill="#183343">Expertise missing</text>
      <text x="1005" y="565" fill="#183343">Beyond authority</text>
    </g>
    <g text-anchor="middle" font-size="23" fill="#52646D">
      <text x="1005" y="253">Decide locally + inform</text>
      <text x="1005" y="433">Bring support closer</text>
      <text x="1005" y="613">Wider authorized choice</text>
    </g>
    <path d="M340 380H420M750 380H810V585H870M810 380V405H870M810 380V225H870" fill="none" stroke="#898983" stroke-width="3"/>
    <path d="M420 380L406 373V387ZM870 405L856 398V412ZM870 585L856 578V592Z" fill="#898983"/>
    <path d="M810 225H870" fill="none" stroke="#176E69" stroke-width="4"/>
    <path d="M870 225L855 217V233Z" fill="#176E69"/>
    <text x="60" y="708" font-size="22" fill="#52646D">Consultation can inform a local choice without becoming another approval.</text>
    <text x="60" y="745" font-size="20" fill="#52646D">Illustrative mechanism. Different needs call for different routes; these are not successive approval stages.</text>
  </g>
</svg>
