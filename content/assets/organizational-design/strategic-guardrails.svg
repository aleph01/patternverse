<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Room for local choices, with a clear route for review</title>
  <desc id="desc">Firm limits and decision principles define space for different local choices within existing authority. An unclear case or proposal beyond delegated limits triggers wider review. An authorized owner interprets the guardrail, refuses a departure, permits an exception where allowed, or revises the guardrail. Decisions and reasoning are recorded, shared, and reviewed, feeding guidance back to teams. A delayed response is not approval. This is an illustrative mechanism diagram, not an IKEA or Basecamp approval chart.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Room for local choices. A clear route for review.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Protect the strategic boundary without prescribing every method.</text>
    <g text-anchor="middle" font-size="25" font-weight="700" fill="#183343">
      <text x="390" y="164">Firm limits + decision principles</text>
      <text x="990" y="164">Review trigger</text>
    </g>
    <rect x="60" y="195" width="660" height="330" rx="18" fill="#DCEDE8" stroke="#176E69" stroke-width="3"/>
    <g text-anchor="middle">
      <text x="390" y="246" font-size="28" font-weight="700" fill="#176E69">Teams decide locally</text>
      <text x="390" y="288" font-size="23" fill="#183343">Different choices within existing authority</text>
    </g>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="90" y="330" width="180" height="90" rx="14"/>
      <rect x="300" y="330" width="180" height="90" rx="14"/>
      <rect x="510" y="330" width="180" height="90" rx="14"/>
      <rect x="840" y="195" width="300" height="330" rx="18"/>
    </g>
    <g text-anchor="middle" font-size="26" font-weight="700" fill="#183343">
      <text x="180" y="384">Option A</text>
      <text x="390" y="384">Option B</text>
      <text x="600" y="384">Option C</text>
      <text x="990" y="246">Authorized owner</text>
    </g>
    <text x="390" y="480" text-anchor="middle" font-size="23" fill="#52646D">Unclear or beyond delegated limits? Seek review.</text>
    <path d="M720 365H840" fill="none" stroke="#176E69" stroke-width="4"/>
    <path d="M840 365L825 357V373Z" fill="#176E69"/>
    <g text-anchor="middle" font-size="23" fill="#52646D">
      <text x="990" y="310">Interpret the boundary</text>
      <text x="990" y="363">Refuse a departure</text>
      <text x="990" y="416">Permit an exception*</text>
      <text x="990" y="469">Revise the guardrail</text>
    </g>
    <g fill="none" stroke="#898983" stroke-width="3">
      <path d="M990 525V585M390 585V525"/>
    </g>
    <g fill="#898983">
      <path d="M990 585L983 571H997ZM390 525L383 539H397Z"/>
    </g>
    <rect x="60" y="585" width="1080" height="90" rx="16" fill="#183343"/>
    <text x="600" y="638" text-anchor="middle" font-size="25" fill="#FFFFFF">Record decisions → share the reasoning → review the guardrails</text>
    <text x="60" y="718" font-size="21" fill="#52646D">*Only where exceptions are permitted. Silence is not approval.</text>
    <text x="60" y="748" font-size="20" fill="#52646D">Illustrative arrangement. Staying within a guardrail does not create additional decision authority.</text>
  </g>
</svg>
