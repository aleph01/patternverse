<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Project and functional authority meet at staff assignments</title>
  <desc id="desc">Two functional leaders, Engineering and Operations, direct their specialist disciplines down columns. Project A and Project B leaders direct scope and delivery across rows. Four staff-assignment cells lie at the intersections. The leaders must agree capacity, decision rights, and escalation. This is a hypothetical function-by-project matrix, not a NASA or ABB organization chart.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Two dimensions of authority. One workable commitment.</text>
    <text x="390" y="130" font-size="23" font-weight="700" fill="#52646D">FUNCTIONAL LEADERS</text>
    <g fill="#183343">
      <rect x="390" y="150" width="300" height="100" rx="14"/>
      <rect x="790" y="150" width="300" height="100" rx="14"/>
    </g>
    <g fill="#FFFFFF" text-anchor="middle">
      <text x="540" y="191" font-size="28" font-weight="700">Engineering</text>
      <text x="940" y="191" font-size="28" font-weight="700">Operations</text>
      <text x="540" y="228" font-size="23">Skills + standards</text>
      <text x="940" y="228" font-size="23">Skills + standards</text>
    </g>
    <text x="60" y="280" font-size="23" font-weight="700" fill="#176E69">PROJECT LEADERS</text>
    <path d="M540 250V585M940 250V585" fill="none" stroke="#898983" stroke-width="4"/>
    <path d="M290 357H1090M290 532H1090" fill="none" stroke="#176E69" stroke-width="4"/>
    <g fill="#176E69">
      <rect x="60" y="305" width="230" height="105" rx="14"/>
      <rect x="60" y="480" width="230" height="105" rx="14"/>
    </g>
    <g fill="#FFFFFF" text-anchor="middle">
      <text x="175" y="347" font-size="28" font-weight="700">Project A</text>
      <text x="175" y="385" font-size="23">Scope + delivery</text>
      <text x="175" y="522" font-size="28" font-weight="700">Project B</text>
      <text x="175" y="560" font-size="23">Scope + delivery</text>
    </g>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="390" y="305" width="300" height="105" rx="14"/>
      <rect x="790" y="305" width="300" height="105" rx="14"/>
      <rect x="390" y="480" width="300" height="105" rx="14"/>
      <rect x="790" y="480" width="300" height="105" rx="14"/>
    </g>
    <g text-anchor="middle" font-size="25" font-weight="700" fill="#183343">
      <text x="540" y="347">Assigned staff</text>
      <text x="940" y="347">Assigned staff</text>
      <text x="540" y="522">Assigned staff</text>
      <text x="940" y="522">Assigned staff</text>
    </g>
    <g text-anchor="middle" font-size="23" fill="#52646D">
      <text x="540" y="385">Agreed capacity</text>
      <text x="940" y="385">Agreed capacity</text>
      <text x="540" y="560">Agreed capacity</text>
      <text x="940" y="560">Agreed capacity</text>
    </g>
    <rect x="60" y="628" width="1080" height="80" rx="16" fill="#DCEDE8"/>
    <text x="600" y="661" text-anchor="middle" font-size="25" font-weight="700" fill="#176E69">MANAGERS RECONCILE THE DEMANDS</text>
    <text x="600" y="694" text-anchor="middle" font-size="23" fill="#183343">Agree decisions, capacity, priorities, and escalation.</text>
    <text x="60" y="742" font-size="21" fill="#52646D">Illustrative allocation of authority. Staff retain a functional home while contributing to projects.</text>
  </g>
</svg>
