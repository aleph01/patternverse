<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Functional homes and coordination across departments</title>
  <desc id="desc">Leadership connects three specialist functions: engineering, operations, and sales. Solid gray lines show functional reporting. A dashed green line connects the functions around a shared delivery outcome. Coordination does not create a second reporting manager. This is a hypothetical arrangement.</desc>
  <rect width="1200" height="660" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Specialist homes. Connected delivery.</text>
    <rect x="450" y="101" width="300" height="70" rx="14" fill="#183343"/>
    <text x="600" y="146" text-anchor="middle" font-size="28" fill="#FFFFFF">Leadership</text>
    <path d="M600 171V210M230 210H970M230 210V252M600 210V252M970 210V252" fill="none" stroke="#898983" stroke-width="4"/>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="100" y="252" width="260" height="190" rx="16"/>
      <rect x="470" y="252" width="260" height="190" rx="16"/>
      <rect x="840" y="252" width="260" height="190" rx="16"/>
    </g>
    <g fill="#183343" font-size="28" font-weight="700" text-anchor="middle">
      <text x="230" y="299">Engineering</text>
      <text x="600" y="299">Operations</text>
      <text x="970" y="299">Sales</text>
    </g>
    <g fill="#52646D" font-size="23" text-anchor="middle">
      <text x="230" y="341">Design expertise</text>
      <text x="230" y="376">Methods + mentoring</text>
      <text x="600" y="341">Production expertise</text>
      <text x="600" y="376">Capacity + quality</text>
      <text x="970" y="341">Customer expertise</text>
      <text x="970" y="376">Demand + commitments</text>
    </g>
    <path d="M230 408H970" fill="none" stroke="#176E69" stroke-width="4" stroke-dasharray="9 8"/>
    <g fill="#176E69">
      <circle cx="230" cy="408" r="7"/>
      <circle cx="600" cy="408" r="7"/>
      <circle cx="970" cy="408" r="7"/>
    </g>
    <rect x="100" y="473" width="1000" height="84" rx="16" fill="#DCEDE8"/>
    <text x="600" y="507" text-anchor="middle" font-size="25" font-weight="700" fill="#176E69">SHARED DELIVERY OUTCOME</text>
    <text x="600" y="541" text-anchor="middle" font-size="24" fill="#183343">Agree priorities, contributions, and decisions across the functions.</text>
    <path d="M100 597H150" stroke="#898983" stroke-width="4"/>
    <text x="165" y="605" font-size="22" fill="#52646D">Functional reporting</text>
    <path d="M560 597H610" stroke="#176E69" stroke-width="4" stroke-dasharray="9 8"/>
    <text x="625" y="605" font-size="22" fill="#52646D">Coordination across functions</text>
    <text x="100" y="638" font-size="20" fill="#52646D">Illustrative arrangement. Coordination adds no second reporting line.</text>
  </g>
</svg>
