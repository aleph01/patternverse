<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Member self-government and defined shared powers</title>
  <desc id="desc">Three equal member organizations retain their own governance, priorities, and local delivery. Two-way connectors link each to shared institutions with a defined joint mandate for representation, decisions, services, and common standards. The connectors show participation and accountability, not an unrestricted command hierarchy. This is a hypothetical federation, not a MONDRAGON or IFRC organization chart.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Local self-government. Defined shared powers.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Members shape the common mandate and remain accountable for their commitments.</text>
    <rect x="350" y="150" width="500" height="140" rx="16" fill="#183343"/>
    <g text-anchor="middle" fill="#FFFFFF">
      <text x="600" y="190" font-size="28" font-weight="700">Shared institutions</text>
      <text x="600" y="229" font-size="23">Member representation + joint decisions</text>
      <text x="600" y="267" font-size="23">Agreed services + common standards</text>
    </g>
    <g fill="none" stroke="#176E69" stroke-width="4" stroke-linejoin="round">
      <path d="M450 290V355H210V440"/>
      <path d="M600 290V440"/>
      <path d="M750 290V355H990V440"/>
    </g>
    <g fill="#176E69">
      <path d="M450 290L442 305H458ZM600 290L592 305H608ZM750 290L742 305H758Z"/>
      <path d="M210 440L202 425H218ZM600 440L592 425H608ZM990 440L982 425H998Z"/>
    </g>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="440" width="300" height="180" rx="16"/>
      <rect x="450" y="440" width="300" height="180" rx="16"/>
      <rect x="840" y="440" width="300" height="180" rx="16"/>
    </g>
    <g text-anchor="middle" fill="#183343" font-size="28" font-weight="700">
      <text x="210" y="484">Member A</text>
      <text x="600" y="484">Member B</text>
      <text x="990" y="484">Member C</text>
    </g>
    <g text-anchor="middle" fill="#52646D" font-size="23">
      <text x="210" y="529">Own governance</text>
      <text x="210" y="565">Local priorities</text>
      <text x="210" y="600">Local delivery</text>
      <text x="600" y="529">Own governance</text>
      <text x="600" y="565">Local priorities</text>
      <text x="600" y="600">Local delivery</text>
      <text x="990" y="529">Own governance</text>
      <text x="990" y="565">Local priorities</text>
      <text x="990" y="600">Local delivery</text>
    </g>
    <rect x="60" y="660" width="1080" height="60" rx="16" fill="#DCEDE8"/>
    <text x="600" y="698" text-anchor="middle" font-size="23" fill="#183343">Shared powers are defined; local responsibilities remain with each member.</text>
    <text x="60" y="747" font-size="20" fill="#52646D">Illustrative federation. Two-way links express participation and accountability within an agreed mandate.</text>
  </g>
</svg>
