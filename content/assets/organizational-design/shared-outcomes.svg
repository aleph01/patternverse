<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">One shared result, distinct commitments</title>
  <desc id="desc">In a hypothetical broadband provider, sales owns promise accuracy, installation owns suitable capacity, and support identifies unresolved failures. Their distinct commitments point to customers obtaining a working connection by the agreed date, with repeat visits, cost, and difficult cases also considered. A joint review examines the result and constraints. Authorized leaders adjust priorities, capacity, or the plan, feeding revised commitments back to the units. The graphic illustrates a mechanism rather than either real example’s organization chart.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">One shared result. Distinct commitments.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Separate units align their choices without surrendering their responsibilities.</text>
    <rect x="60" y="150" width="1080" height="110" rx="16" fill="#183343"/>
    <g text-anchor="middle" fill="#FFFFFF">
      <text x="600" y="194" font-size="28" font-weight="700">Working connection by the agreed date</text>
      <text x="600" y="235" font-size="23">Also examine: repeat visits · cost · difficult-to-serve customers</text>
    </g>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="330" width="300" height="140" rx="16"/>
      <rect x="450" y="330" width="300" height="140" rx="16"/>
      <rect x="840" y="330" width="300" height="140" rx="16"/>
    </g>
    <g text-anchor="middle" fill="#183343" font-size="28" font-weight="700">
      <text x="210" y="375">Sales</text>
      <text x="600" y="375">Installation</text>
      <text x="990" y="375">Support</text>
    </g>
    <g text-anchor="middle" fill="#52646D" font-size="23">
      <text x="210" y="425">Promise accuracy</text>
      <text x="600" y="425">Suitable capacity</text>
      <text x="990" y="425">Unresolved failures</text>
    </g>
    <g fill="none" stroke="#176E69" stroke-width="4">
      <path d="M210 330V260M600 330V260M990 330V260"/>
      <path d="M210 550V470M600 550V470M990 550V470"/>
    </g>
    <g fill="#176E69">
      <path d="M210 260L202 275H218ZM600 260L592 275H608ZM990 260L982 275H998Z"/>
      <path d="M210 470L202 485H218ZM600 470L592 485H608ZM990 470L982 485H998Z"/>
    </g>
    <rect x="60" y="550" width="1080" height="120" rx="16" fill="#DCEDE8"/>
    <path d="M1140 205H1170V610H1140" fill="none" stroke="#898983" stroke-width="3" stroke-dasharray="9 7"/>
    <path d="M1140 610L1154 602V618Z" fill="#898983"/>
    <g text-anchor="middle">
      <text x="600" y="595" font-size="28" font-weight="700" fill="#176E69">Joint review: result + constraints</text>
      <text x="600" y="638" font-size="24" fill="#183343">Authorized leaders adjust priorities, capacity, or the plan.</text>
    </g>
    <text x="60" y="735" font-size="22" fill="#52646D">Evidence informs revised commitments. Hypothetical broadband-provider example.</text>
  </g>
</svg>
