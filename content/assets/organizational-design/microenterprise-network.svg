<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Small accountable units connected around a customer outcome</title>
  <desc id="desc">Three hypothetical microenterprises contribute a maintenance offer, specialist repairs, and energy advice to dependable building maintenance. Each has an accountable owner, defined authority, and visible economics. Horizontal links represent agreements between units. Dashed links provide access to shared capabilities, while common rules govern direction, quality, costs, and disputes. The outcome box is not a command center. This is not a Haier or Kyocera organization chart.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Small units. Explicit connections. A shared result.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Entrepreneurial responsibility requires both usable authority and dependable relationships.</text>
    <rect x="60" y="150" width="1080" height="90" rx="14" fill="#183343"/>
    <text x="600" y="186" text-anchor="middle" font-size="27" font-weight="700" fill="#FFFFFF">Customer outcome</text>
    <text x="600" y="222" text-anchor="middle" font-size="23" fill="#FFFFFF">Dependable building maintenance</text>
    <path d="M600 240V280M210 280H990M210 280V335M600 280V335M990 280V335" fill="none" stroke="#898983" stroke-width="3"/>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="335" width="300" height="210" rx="16"/>
      <rect x="450" y="335" width="300" height="210" rx="16"/>
      <rect x="840" y="335" width="300" height="210" rx="16"/>
    </g>
    <g text-anchor="middle" fill="#183343" font-size="27" font-weight="700">
      <text x="210" y="383">Maintenance offer</text>
      <text x="600" y="383">Specialist repairs</text>
      <text x="990" y="383">Energy advice</text>
    </g>
    <g text-anchor="middle" fill="#52646D" font-size="23">
      <text x="210" y="431">Accountable owner</text>
      <text x="210" y="474">Defined authority</text>
      <text x="210" y="517">Visible economics</text>
      <text x="600" y="431">Accountable owner</text>
      <text x="600" y="474">Defined authority</text>
      <text x="600" y="517">Visible economics</text>
      <text x="990" y="431">Accountable owner</text>
      <text x="990" y="474">Defined authority</text>
      <text x="990" y="517">Visible economics</text>
    </g>
    <path d="M360 445H450M750 445H840" fill="none" stroke="#176E69" stroke-width="4"/>
    <g fill="#176E69">
      <path d="M360 445L375 437V453ZM450 445L435 437V453Z"/>
      <path d="M750 445L765 437V453ZM840 445L825 437V453Z"/>
    </g>
    <path d="M210 545V600M600 545V600M990 545V600" fill="none" stroke="#176E69" stroke-width="3" stroke-dasharray="9 7"/>
    <rect x="60" y="600" width="1080" height="70" rx="14" fill="#DCEDE8"/>
    <text x="600" y="643" text-anchor="middle" font-size="24" fill="#176E69">Shared capabilities: scheduling · technology · finance · specialist support</text>
    <text x="60" y="717" font-size="23" fill="#183343">Common rules: direction · quality · cost allocation · dispute resolution</text>
    <text x="60" y="748" font-size="21" fill="#52646D">Solid green links: unit agreements. Dashed links: shared capability access. Hypothetical arrangement.</text>
  </g>
</svg>
