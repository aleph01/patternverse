<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Distinct operating arrangements, shared leadership</title>
  <desc id="desc">Shared senior leadership sets direction and makes resource decisions for established operations and an exploratory venture. Established operations emphasize delivery, quality, cost, and improvement. The venture tests demand, feasibility, and its delivery model. Dashed links show selective sharing of expertise, customer access, and delivery capability. Reviews can continue, scale, stop, or transfer the venture; transfer is not automatic. This is a hypothetical arrangement, not an IBM or USA Today organization chart.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Different operating needs. Shared leadership.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Protect exploratory work and connect it to capabilities it can use.</text>
    <rect x="300" y="145" width="600" height="120" rx="16" fill="#183343"/>
    <g text-anchor="middle" fill="#FFFFFF">
      <text x="600" y="189" font-size="28" font-weight="700">Shared senior leadership</text>
      <text x="600" y="229" font-size="23">Direction · resources · conflict resolution</text>
    </g>
    <path d="M450 265V305H310V345M750 265V305H890V345" fill="none" stroke="#898983" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#898983">
      <path d="M450 265L442 280H458ZM750 265L742 280H758Z"/>
      <path d="M310 345L302 330H318ZM890 345L882 330H898Z"/>
    </g>
    <rect x="60" y="345" width="500" height="215" rx="16" fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2"/>
    <rect x="640" y="345" width="500" height="215" rx="16" fill="#DCEDE8"/>
    <g text-anchor="middle" font-size="28" font-weight="700">
      <text x="310" y="390" fill="#183343">Established operations</text>
      <text x="890" y="390" fill="#176E69">Exploratory venture</text>
    </g>
    <g text-anchor="middle" fill="#52646D" font-size="23">
      <text x="310" y="434">Deliver + improve</text>
      <text x="310" y="473">Reliability · quality · cost</text>
      <text x="310" y="524">Methods suited to understood work</text>
      <text x="890" y="434">Test assumptions + develop options</text>
      <text x="890" y="473">Demand · feasibility · learning</text>
      <text x="890" y="524">Dedicated resources + review points</text>
    </g>
    <g fill="none" stroke="#176E69" stroke-width="3" stroke-dasharray="9 7">
      <path d="M310 560V600M890 560V600"/>
    </g>
    <rect x="60" y="600" width="1080" height="65" rx="12" fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2"/>
    <text x="600" y="640" text-anchor="middle" font-size="23" fill="#176E69">Selected connections: expertise · customer access · delivery capability</text>
    <text x="60" y="717" font-size="24" font-weight="700" fill="#183343">Venture reviews: continue · scale · stop · transfer</text>
    <text x="60" y="747" font-size="21" fill="#52646D">Different measures support different tasks. Shared assets and commitments need named owners.</text>
  </g>
</svg>
