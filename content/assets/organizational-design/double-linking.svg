<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Two people belong to both circles</title>
  <desc id="desc">Two overlapping frames represent Circle A and Circle B, each with its own domain and other members. Two distinct representatives occupy the overlap. One is selected by Circle A and the other by Circle B. Both are full governance members of both circles, participating in decisions rather than simply passing messages. This is an illustrative peer arrangement, not a specific organization's chart; nested arrangements can use leader and delegate roles with different selection rules.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Two people belong to both circles.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Shared membership gives each group influence inside the other’s decisions.</text>
    <rect x="60" y="190" width="690" height="420" rx="24" fill="#FFFFFF"/>
    <rect x="450" y="190" width="690" height="420" rx="24" fill="#FFFFFF"/>
    <rect x="450" y="190" width="300" height="420" fill="#DCEDE8"/>
    <rect x="60" y="190" width="690" height="420" rx="24" fill="none" stroke="#183343" stroke-width="3"/>
    <rect x="450" y="190" width="690" height="420" rx="24" fill="none" stroke="#176E69" stroke-width="3"/>
    <g text-anchor="middle">
      <text x="255" y="260" font-size="28" font-weight="700" fill="#183343">Circle A</text>
      <text x="945" y="260" font-size="28" font-weight="700" fill="#176E69">Circle B</text>
      <text x="600" y="242" font-size="23" font-weight="700" fill="#176E69">Members of both</text>
      <text x="255" y="309" font-size="24" fill="#52646D">Own domain</text>
      <text x="945" y="309" font-size="24" fill="#52646D">Own domain</text>
    </g>
    <g fill="#52646D">
      <circle cx="210" cy="405" r="18"/>
      <circle cx="300" cy="405" r="18"/>
      <circle cx="900" cy="405" r="18"/>
      <circle cx="990" cy="405" r="18"/>
    </g>
    <g text-anchor="middle" fill="#52646D" font-size="23">
      <text x="255" y="470">Other members</text>
      <text x="945" y="470">Other members</text>
    </g>
    <g fill="#FFFFFF" stroke="#176E69" stroke-width="2">
      <rect x="475" y="285" width="250" height="130" rx="16"/>
      <rect x="475" y="445" width="250" height="130" rx="16"/>
    </g>
    <g fill="#176E69">
      <circle cx="600" cy="321" r="14"/>
      <circle cx="600" cy="481" r="14"/>
    </g>
    <g text-anchor="middle">
      <text x="600" y="365" font-size="24" font-weight="700" fill="#183343">Selected by A</text>
      <text x="600" y="398" font-size="22" fill="#52646D">Decides in A + B</text>
      <text x="600" y="525" font-size="24" font-weight="700" fill="#183343">Selected by B</text>
      <text x="600" y="558" font-size="22" fill="#52646D">Decides in A + B</text>
    </g>
    <text x="60" y="678" font-size="24" fill="#183343">Both bring context and participate; neither speaks or decides alone for a circle.</text>
    <text x="60" y="735" font-size="20" fill="#52646D">Illustrative peer arrangement. Nested circles may use leader + delegate roles with different selection rules.</text>
  </g>
</svg>
