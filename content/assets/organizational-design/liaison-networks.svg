<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Named contacts keep units connected</title>
  <desc id="desc">Three separate units each contain a named liaison. The liaisons connect across unit boundaries to exchange questions and context and maintain follow-up. Each unit keeps ownership of delivery and decisions. The connections show working relationships rather than reporting lines, mandatory message routing, or shared governance membership. This is an original illustrative peer network, not CERN or Adobe's organization chart.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Named contacts keep units connected.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Units retain their responsibilities; liaisons maintain working relationships.</text>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="175" width="300" height="245" rx="20"/>
      <rect x="450" y="175" width="300" height="245" rx="20"/>
      <rect x="840" y="175" width="300" height="245" rx="20"/>
    </g>
    <g text-anchor="middle" fill="#183343" font-size="28" font-weight="700">
      <text x="210" y="225">Unit A</text>
      <text x="600" y="225">Unit B</text>
      <text x="990" y="225">Unit C</text>
    </g>
    <g text-anchor="middle" fill="#52646D" font-size="23">
      <text x="210" y="270">Own delivery + decisions</text>
      <text x="600" y="270">Own delivery + decisions</text>
      <text x="990" y="270">Own delivery + decisions</text>
    </g>
    <path d="M210 355V480H990V355M600 355V480" fill="none" stroke="#176E69" stroke-width="3"/>
    <g fill="#DCEDE8" stroke="#176E69" stroke-width="2">
      <rect x="90" y="310" width="240" height="75" rx="16"/>
      <rect x="480" y="310" width="240" height="75" rx="16"/>
      <rect x="870" y="310" width="240" height="75" rx="16"/>
    </g>
    <g text-anchor="middle" fill="#176E69" font-size="25" font-weight="700">
      <text x="210" y="357">Named liaison</text>
      <text x="600" y="357">Named liaison</text>
      <text x="990" y="357">Named liaison</text>
    </g>
    <rect x="300" y="445" width="600" height="70" rx="16" fill="#DCEDE8" stroke="#176E69" stroke-width="2"/>
    <text x="600" y="489" text-anchor="middle" font-size="25" fill="#176E69">Questions · context · follow-up</text>
    <text x="60" y="589" font-size="24" fill="#183343">Find the right owner. Clarify the issue. Confirm the next action.</text>
    <text x="60" y="638" font-size="24" fill="#52646D">People can still work directly across units.</text>
    <text x="60" y="731" font-size="20" fill="#52646D">Illustrative peer network. Connections are working relationships, not reporting lines or approval powers.</text>
  </g>
</svg>
