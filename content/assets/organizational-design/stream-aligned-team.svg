<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">One stable team owns the flow and its feedback</title>
  <desc id="desc">One stream-aligned team owns an account-access stream through understanding needs, delivering changes, and operating the service. These are activities within one team, not separate departments. User feedback and operating evidence return to the team. Shared services and focused specialist help support its work through explicit interfaces. The illustration is hypothetical, not a Docker or Financial Times organization chart, and does not reproduce a Team Topologies book diagram.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">One team owns the flow and its feedback.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Continuing responsibility for account access, from user need to reliable operation.</text>
    <rect x="60" y="150" width="1080" height="360" rx="18" fill="#DCEDE8"/>
    <text x="90" y="195" font-size="28" font-weight="700" fill="#176E69">One stable team — one manageable stream</text>
    <text x="90" y="235" font-size="23" fill="#183343">Product · design · engineering · testing · operational capability</text>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="90" y="275" width="270" height="125" rx="14"/>
      <rect x="465" y="275" width="270" height="125" rx="14"/>
      <rect x="840" y="275" width="270" height="125" rx="14"/>
    </g>
    <g text-anchor="middle" fill="#183343" font-size="28" font-weight="700">
      <text x="225" y="321">Understand</text>
      <text x="600" y="321">Deliver</text>
      <text x="975" y="321">Operate</text>
    </g>
    <g text-anchor="middle" fill="#52646D" font-size="23">
      <text x="225" y="365">Needs + evidence</text>
      <text x="600" y="365">Build · test · release</text>
      <text x="975" y="365">Service health + support</text>
    </g>
    <path d="M360 338H465M735 338H840M975 400V470H225V400" fill="none" stroke="#176E69" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#176E69">
      <path d="M465 338L450 330V346ZM840 338L825 330V346ZM225 400L217 415H233Z"/>
    </g>
    <text x="600" y="451" text-anchor="middle" font-size="23" fill="#176E69">User feedback + operating evidence</text>
    <path d="M310 510V585M890 510V585" fill="none" stroke="#898983" stroke-width="3" stroke-dasharray="9 7"/>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="585" width="500" height="75" rx="14"/>
      <rect x="640" y="585" width="500" height="75" rx="14"/>
    </g>
    <g text-anchor="middle" fill="#183343" font-size="24">
      <text x="310" y="631">Shared services · clear interfaces</text>
      <text x="890" y="631">Focused specialist help</text>
    </g>
    <text x="60" y="708" font-size="23" fill="#52646D">Support helps the team deliver without a chain of routine handoffs.</text>
    <text x="60" y="744" font-size="21" fill="#52646D">The three activities sit within one team. The arrangement is hypothetical.</text>
  </g>
</svg>
