<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">One reference supports different kinds of work</title>
  <desc id="desc">Customer service, warehouse, and finance contribute to and use a shared returns map. Each group focuses on different local questions: customer promises, parcel handovers, or refund conditions. The common stages Requested, Received, and Refunded remain recognizable across their uses. Two-way connections indicate contributions and questions, not reporting lines. This is a hypothetical retailer illustration, not a representation of the Berkeley museum or NASA.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">One reference supports different kinds of work.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Groups coordinate around common features while retaining useful local detail.</text>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="180" width="300" height="140" rx="18"/>
      <rect x="450" y="180" width="300" height="140" rx="18"/>
      <rect x="840" y="180" width="300" height="140" rx="18"/>
    </g>
    <g text-anchor="middle" fill="#183343" font-size="27" font-weight="700">
      <text x="210" y="233">Customer service</text>
      <text x="600" y="233">Warehouse</text>
      <text x="990" y="233">Finance</text>
    </g>
    <g text-anchor="middle" fill="#52646D" font-size="24">
      <text x="210" y="280">Customer promises</text>
      <text x="600" y="280">Parcel handovers</text>
      <text x="990" y="280">Refund conditions</text>
    </g>
    <path d="M210 320V405M600 320V405M990 320V405" fill="none" stroke="#176E69" stroke-width="3"/>
    <path d="M210 320L203 334H217ZM210 405L203 391H217ZM600 320L593 334H607ZM600 405L593 391H607ZM990 320L983 334H997ZM990 405L983 391H997Z" fill="#176E69"/>
    <rect x="150" y="405" width="900" height="170" rx="20" fill="#DCEDE8" stroke="#176E69" stroke-width="3"/>
    <text x="600" y="450" text-anchor="middle" font-size="28" font-weight="700" fill="#176E69">Shared returns map</text>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="210" y="480" width="180" height="60" rx="12"/>
      <rect x="510" y="480" width="180" height="60" rx="12"/>
      <rect x="810" y="480" width="180" height="60" rx="12"/>
    </g>
    <g text-anchor="middle" fill="#183343" font-size="25">
      <text x="300" y="519">Requested</text>
      <text x="600" y="519">Received</text>
      <text x="900" y="519">Refunded</text>
    </g>
    <path d="M390 510H510M690 510H810" fill="none" stroke="#176E69" stroke-width="3"/>
    <path d="M510 510L496 503V517ZM810 510L796 503V517Z" fill="#176E69"/>
    <text x="60" y="638" font-size="24" fill="#183343">Common stages stay recognizable; each group adds the detail it needs.</text>
    <text x="60" y="731" font-size="20" fill="#52646D">Illustrative returns map. People resolve disputed meanings and authorize changes to commitments.</text>
  </g>
</svg>
