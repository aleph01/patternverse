<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Different contributions, one shared view of progress</title>
  <desc id="desc">Three units contribute local evidence to a small common set covering intended results, important drivers, and tradeoffs. A joint review considers the evidence and its context, chooses actions with named owners, and returns decisions to the units. This illustrative mechanism is not a Mobil or GDS reporting chart. Measures inform questions and do not establish causal attribution.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Different contributions. One shared view of progress.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Select evidence for strategic decisions, then interpret it together.</text>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="155" width="320" height="100" rx="16"/>
      <rect x="440" y="155" width="320" height="100" rx="16"/>
      <rect x="820" y="155" width="320" height="100" rx="16"/>
    </g>
    <g text-anchor="middle" fill="#183343" font-size="27" font-weight="700">
      <text x="220" y="198">Unit A</text>
      <text x="600" y="198">Unit B</text>
      <text x="980" y="198">Unit C</text>
    </g>
    <g text-anchor="middle" fill="#52646D" font-size="23">
      <text x="220" y="234">Local evidence</text>
      <text x="600" y="234">Local evidence</text>
      <text x="980" y="234">Local evidence</text>
    </g>
    <path d="M220 255V285H980V255M600 255V315" fill="none" stroke="#898983" stroke-width="3"/>
    <path d="M600 315L592 300H608Z" fill="#898983"/>
    <rect x="60" y="315" width="710" height="260" rx="18" fill="#DCEDE8" stroke="#176E69" stroke-width="3"/>
    <text x="415" y="360" text-anchor="middle" font-size="28" font-weight="700" fill="#176E69">Small shared strategic set</text>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="85" y="390" width="205" height="145" rx="12"/>
      <rect x="312" y="390" width="205" height="145" rx="12"/>
      <rect x="540" y="390" width="205" height="145" rx="12"/>
      <rect x="870" y="315" width="270" height="260" rx="18"/>
    </g>
    <g text-anchor="middle" font-size="26" font-weight="700" fill="#183343">
      <text x="188" y="433">Results</text>
      <text x="415" y="433">Drivers</text>
      <text x="643" y="433">Tradeoffs</text>
      <text x="1005" y="360">Joint review</text>
    </g>
    <g text-anchor="middle" font-size="23" fill="#52646D">
      <text x="188" y="479">What changed</text>
      <text x="188" y="510">for whom?</text>
      <text x="415" y="479">What might</text>
      <text x="415" y="510">explain it?</text>
      <text x="643" y="479">At what cost</text>
      <text x="643" y="510">or harm?</text>
      <text x="1005" y="419">Consider context</text>
      <text x="1005" y="465">Choose actions</text>
      <text x="1005" y="511">Name owners</text>
    </g>
    <path d="M770 445H870" fill="none" stroke="#176E69" stroke-width="4"/>
    <path d="M870 445L854 437V453Z" fill="#176E69"/>
    <path d="M1005 575V615H25V130H980V155M220 130V155M600 130V155" fill="none" stroke="#898983" stroke-width="3"/>
    <path d="M220 155L213 141H227ZM600 155L593 141H607ZM980 155L973 141H987Z" fill="#898983"/>
    <text x="600" y="652" text-anchor="middle" font-size="24" fill="#183343">Decisions return to local work; the next review checks what happened.</text>
    <text x="60" y="710" font-size="22" fill="#52646D">Common evidence does not require identical local targets.</text>
    <text x="60" y="745" font-size="20" fill="#52646D">Illustrative mechanism. Measures inform questions; they do not establish causal attribution.</text>
  </g>
</svg>
