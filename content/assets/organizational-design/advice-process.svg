<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Required advice, retained decision ownership</title>
  <desc id="desc">Affected people contribute consequences and experience; relevant experts contribute knowledge and constraints. Both advise a named decision owner who considers the input and makes the choice within their authority. The owner then shares reasons, organizes action, and reviews the result, with feedback returning to the participants. Advice is required, but it does not automatically create an approval right. This is an illustrative mechanism, not Equal Experts or Happy's exact process.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Required advice. Retained decision ownership.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Bring affected experience and relevant expertise into a clearly owned choice.</text>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="170" width="400" height="130" rx="18"/>
      <rect x="60" y="370" width="400" height="130" rx="18"/>
    </g>
    <g text-anchor="middle" fill="#183343" font-size="28" font-weight="700">
      <text x="260" y="219">Affected people</text>
      <text x="260" y="419">Relevant experts</text>
    </g>
    <g text-anchor="middle" fill="#52646D" font-size="24">
      <text x="260" y="266">Consequences + experience</text>
      <text x="260" y="466">Knowledge + constraints</text>
    </g>
    <rect x="670" y="170" width="470" height="330" rx="18" fill="#DCEDE8" stroke="#176E69" stroke-width="3"/>
    <g text-anchor="middle">
      <text x="905" y="219" font-size="28" font-weight="700" fill="#176E69">Named decision owner</text>
      <text x="905" y="282" font-size="25" fill="#183343">Seek advice before commitment</text>
      <text x="905" y="342" font-size="25" fill="#183343">Consider + revise</text>
      <text x="905" y="402" font-size="25" fill="#183343">Decide within authority</text>
      <text x="905" y="462" font-size="23" fill="#52646D">Agreement is not required</text>
    </g>
    <path d="M460 235H565V435H460M565 335H670" fill="none" stroke="#176E69" stroke-width="4"/>
    <path d="M670 335L655 327V343Z" fill="#176E69"/>
    <path d="M905 500V575" fill="none" stroke="#898983" stroke-width="3"/>
    <path d="M905 575L898 561H912Z" fill="#898983"/>
    <rect x="60" y="575" width="1080" height="90" rx="16" fill="#183343"/>
    <text x="600" y="629" text-anchor="middle" font-size="26" fill="#FFFFFF">Share reasons → organize action → review the result</text>
    <path d="M60 620H25V235H60M25 435H60" fill="none" stroke="#898983" stroke-width="3"/>
    <path d="M60 235L46 228V242ZM60 435L46 428V442Z" fill="#898983"/>
    <text x="60" y="714" font-size="22" fill="#52646D">Advice informs the choice; required approvals remain separate.</text>
    <text x="60" y="748" font-size="20" fill="#52646D">Illustrative mechanism. Meaningful consultation and accountability continue even when recommendations differ.</text>
  </g>
</svg>
