<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A standing mandate with explicit boundaries</title>
  <desc id="desc">An authorized delegator entrusts a person or group with continuing authority over a domain, specifying purpose, scope, resources, and reserved powers. The holder makes recurring decisions, organizes delivery, and improves work inside the remit. Evidence returns to the delegator for review. Dependencies with neighboring domains are coordinated in both directions; issues beyond the remit use an agreed authority route. This is an illustrative mechanism, not either example's organization chart.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">A standing mandate with explicit boundaries.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Entrust an area of work, then maintain the agreement as conditions change.</text>
    <rect x="60" y="150" width="710" height="110" rx="16" fill="#183343"/>
    <g text-anchor="middle" fill="#FFFFFF">
      <text x="415" y="193" font-size="28" font-weight="700">Authorized delegator</text>
      <text x="415" y="234" font-size="23">Purpose · scope · resources · reserved powers</text>
    </g>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="890" y="150" width="250" height="110" rx="16"/>
      <rect x="890" y="340" width="250" height="230" rx="18"/>
    </g>
    <path d="M415 260V340" fill="none" stroke="#176E69" stroke-width="4"/>
    <path d="M415 340L407 325H423Z" fill="#176E69"/>
    <rect x="60" y="340" width="710" height="230" rx="18" fill="#DCEDE8" stroke="#176E69" stroke-width="3"/>
    <g text-anchor="middle">
      <text x="415" y="386" font-size="28" font-weight="700" fill="#176E69">Domain held by a person or group</text>
      <text x="415" y="433" font-size="25" fill="#183343">Make recurring decisions</text>
      <text x="415" y="479" font-size="25" fill="#183343">Organize delivery</text>
      <text x="415" y="525" font-size="25" fill="#183343">Improve the work within the remit</text>
      <text x="1015" y="193" font-size="26" font-weight="700" fill="#183343">Beyond remit?</text>
      <text x="1015" y="234" font-size="23" fill="#52646D">Use agreed route</text>
      <text x="1015" y="386" font-size="26" font-weight="700" fill="#183343">Other domains</text>
      <text x="1015" y="438" font-size="23" fill="#52646D">Coordinate</text>
      <text x="1015" y="474" font-size="23" fill="#52646D">dependencies</text>
      <text x="1015" y="525" font-size="23" fill="#52646D">Respect their remit</text>
    </g>
    <path d="M770 420H890M890 480H770" fill="none" stroke="#176E69" stroke-width="4"/>
    <path d="M890 420L875 412V428ZM770 480L785 472V488Z" fill="#176E69"/>
    <path d="M770 365H825V205H890M60 480H25V205H60" fill="none" stroke="#898983" stroke-width="3"/>
    <path d="M890 205L876 198V212ZM60 205L46 198V212Z" fill="#898983"/>
    <rect x="60" y="615" width="1080" height="65" rx="14" fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2"/>
    <text x="600" y="656" text-anchor="middle" font-size="25" fill="#183343">Review results, boundaries, capacity, and effects on neighbors.</text>
    <text x="60" y="718" font-size="22" fill="#52646D">Evidence informs oversight; mandate changes require the authorized owner.</text>
    <text x="60" y="748" font-size="20" fill="#52646D">Illustrative arrangement. A domain mandate does not authorize control over neighboring domains.</text>
  </g>
</svg>
