<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Different markets draw on shared product capabilities</title>
  <desc id="desc">A food-producer unit and a logistics-operator unit each own customer understanding and coordinated offers. Through joint planning, both draw on shared sensors, controls, and monitoring software units. Two-way links express customer needs influencing products and product capabilities constraining commitments. The joint-planning band represents a process, not an additional department. This is a hypothetical industrial technology company, not a P&amp;G or Ericsson organization chart.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Different markets. Shared product capabilities.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Customer needs shape products; product capabilities shape commitments.</text>
    <text x="60" y="151" font-size="23" font-weight="700" fill="#176E69">FRONT — organized around customers</text>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="175" width="500" height="130" rx="16"/>
      <rect x="640" y="175" width="500" height="130" rx="16"/>
    </g>
    <g text-anchor="middle" fill="#183343" font-size="28" font-weight="700">
      <text x="310" y="219">Food producers</text>
      <text x="890" y="219">Logistics operators</text>
    </g>
    <g text-anchor="middle" fill="#52646D" font-size="23">
      <text x="310" y="258">Customer understanding</text>
      <text x="310" y="288">Coordinated offers + customer plans</text>
      <text x="890" y="258">Customer understanding</text>
      <text x="890" y="288">Coordinated offers + customer plans</text>
    </g>
    <g fill="none" stroke="#176E69" stroke-width="4">
      <path d="M310 305V365M890 305V365M210 460V555M600 460V555M990 460V555"/>
    </g>
    <g fill="#176E69">
      <path d="M310 305L302 320H318ZM890 305L882 320H898Z"/>
      <path d="M310 365L302 350H318ZM890 365L882 350H898Z"/>
      <path d="M210 460L202 475H218ZM600 460L592 475H608ZM990 460L982 475H998Z"/>
      <path d="M210 555L202 540H218ZM600 555L592 540H608ZM990 555L982 540H998Z"/>
    </g>
    <rect x="60" y="365" width="1080" height="95" rx="14" fill="#DCEDE8"/>
    <text x="600" y="401" text-anchor="middle" font-size="27" font-weight="700" fill="#176E69">Joint planning + explicit decision rights</text>
    <text x="600" y="438" text-anchor="middle" font-size="23" fill="#183343">Offers · product priorities · capacity · exceptions</text>
    <text x="250" y="511" font-size="23" font-weight="700" fill="#176E69">BACK — shared offerings</text>
    <g fill="#183343">
      <rect x="60" y="555" width="300" height="125" rx="16"/>
      <rect x="450" y="555" width="300" height="125" rx="16"/>
      <rect x="840" y="555" width="300" height="125" rx="16"/>
    </g>
    <g text-anchor="middle" fill="#FFFFFF">
      <g font-size="27" font-weight="700">
        <text x="210" y="600">Sensors</text>
        <text x="600" y="600">Controls</text>
        <text x="990" y="600">Monitoring software</text>
      </g>
      <g font-size="23">
        <text x="210" y="639">Product ownership</text>
        <text x="600" y="639">Product ownership</text>
        <text x="990" y="639">Product ownership</text>
        <text x="210" y="668">Used across markets</text>
        <text x="600" y="668">Used across markets</text>
        <text x="990" y="668">Used across markets</text>
      </g>
    </g>
    <text x="60" y="729" font-size="23" fill="#52646D">Two-way links show interdependence. The planning band is a process, not a department.</text>
  </g>
</svg>
