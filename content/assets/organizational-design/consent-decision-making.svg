<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Test the proposal, integrate objections, then proceed</title>
  <desc id="desc">An authorized group understands a clear proposal with purpose, mandate, owners, and review. Members are explicitly asked for qualifying objections. If none remain, the group adopts the proposal. A qualifying objection leads to resolving the issue and revising the proposal, then checking again. An unresolved objection requires deferral, withdrawal, or the agreed escalation route. This illustrative mechanism is not a complete Sociocracy 3.0 procedure or either example's exact process.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Test the proposal. Integrate objections. Then proceed.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">A preference can differ; a reasoned objection needs a response.</text>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="230" width="280" height="180" rx="18"/>
      <rect x="440" y="230" width="320" height="180" rx="18"/>
      <rect x="440" y="530" width="320" height="110" rx="16"/>
    </g>
    <rect x="880" y="230" width="260" height="180" rx="18" fill="#DCEDE8" stroke="#176E69" stroke-width="3"/>
    <g text-anchor="middle" font-size="27" font-weight="700" fill="#183343">
      <text x="200" y="280">Clear proposal</text>
      <text x="600" y="280">Ask for objections</text>
      <text x="1010" y="280" fill="#176E69">Adopt</text>
      <text x="600" y="574">Resolve + revise</text>
    </g>
    <g text-anchor="middle" font-size="24" fill="#52646D">
      <text x="200" y="326">Purpose + mandate</text>
      <text x="200" y="372">Owners + review</text>
      <text x="600" y="326">Test reasons against</text>
      <text x="600" y="372">the agreed purpose</text>
      <text x="1010" y="326">Name owners</text>
      <text x="1010" y="372">Set review</text>
      <text x="600" y="618">Then check again</text>
    </g>
    <path d="M340 320H440M600 410V530M440 585H390V320H440" fill="none" stroke="#898983" stroke-width="3"/>
    <path d="M440 320L426 313V327ZM600 530L593 516H607Z" fill="#898983"/>
    <path d="M760 320H880" fill="none" stroke="#176E69" stroke-width="4"/>
    <path d="M880 320L865 312V328Z" fill="#176E69"/>
    <g text-anchor="middle" font-size="20" fill="#176E69">
      <text x="820" y="276">None</text>
      <text x="820" y="301">remain</text>
    </g>
    <text x="625" y="477" font-size="22" fill="#52646D">Qualifying objection</text>
    <text x="60" y="708" font-size="22" fill="#52646D">Unresolved objection? Defer, withdraw, or use the agreed escalation route.</text>
    <text x="60" y="745" font-size="20" fill="#52646D">Illustrative mechanism. Check participation rules and mandate; a quiet room alone does not establish consent.</text>
  </g>
</svg>
