<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Negotiate commitments, then test the plan through review</title>
  <desc id="desc">Leadership and frontline evidence inform a few strategic priorities. Two-way catchball connects proposals with agreed commitments among teams, functions, and leaders, including owners, measures, and resources. Teams execute and recurring reviews compare evidence with the plan. Authorized adjustments to methods, support, capacity, or priorities feed back into planning. Within-period review and end-of-period reflection inform the next cycle. This is an illustrative mechanism diagram, not either example’s organization chart.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Agree the work. Test the plan. Learn and adjust.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">A focused strategy becomes a continuing management cycle.</text>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="165" width="470" height="165" rx="16"/>
      <rect x="670" y="445" width="470" height="165" rx="16"/>
      <rect x="60" y="445" width="470" height="165" rx="16"/>
    </g>
    <rect x="670" y="165" width="470" height="165" rx="16" fill="#DCEDE8"/>
    <g text-anchor="middle" font-size="28" font-weight="700">
      <text x="295" y="213" fill="#183343">Propose a few priorities</text>
      <text x="905" y="213" fill="#176E69">Agree commitments</text>
      <text x="905" y="493" fill="#183343">Execute and check</text>
      <text x="295" y="493" fill="#183343">Act on what is learned</text>
    </g>
    <g text-anchor="middle" font-size="23" fill="#52646D">
      <text x="295" y="265">Leadership + frontline evidence</text>
      <text x="295" y="305">Long-term direction + annual focus</text>
      <text x="905" y="265">Teams + functions + leaders</text>
      <text x="905" y="305">Owners · measures · resources</text>
      <text x="905" y="545">Teams test methods; reviews</text>
      <text x="905" y="585">compare results with the plan.</text>
      <text x="295" y="545">Authorized changes to methods,</text>
      <text x="295" y="585">support, capacity, or priorities.</text>
    </g>
    <g stroke="#176E69" stroke-width="4" fill="none">
      <path d="M530 225H670M670 285H530"/>
      <path d="M905 330V445M670 525H530M295 445V330"/>
    </g>
    <g fill="#176E69">
      <path d="M670 225L655 217V233ZM530 285L545 277V293Z"/>
      <path d="M905 445L897 430H913ZM530 525L545 517V533ZM295 330L287 345H303Z"/>
    </g>
    <text x="600" y="262" text-anchor="middle" font-size="24" font-weight="700" fill="#176E69">Catchball</text>
    <rect x="60" y="655" width="1080" height="50" rx="12" fill="#183343"/>
    <text x="600" y="688" text-anchor="middle" font-size="24" fill="#FFFFFF">Within-period reviews → reflection → next planning cycle</text>
    <text x="60" y="744" font-size="21" fill="#52646D">Illustrative cycle. Catchball negotiates commitments; review tests their effects.</text>
  </g>
</svg>
