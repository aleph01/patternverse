<svg xmlns="http://www.w3.org/2000/svg" width="360" height="707" viewBox="0 0 360 707" role="img" aria-labelledby="title desc"><title id="title">The three broad Meta Model categories</title><desc id="desc">Deletions recover missing detail. Generalizations examine rules and limits. Distortions examine inferred relationships and meanings.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#243d36}</style><rect width="360" height="707" fill="#fcfaf5"/><rect x="12" y="18" width="336" height="196" rx="7" fill="#e7eee3"/><text x="27" y="48" font-size="22">Deletions</text><text x="27" y="80" font-size="16">Recover missing detail</text><text x="27" y="107" font-size="16">01 · Missing object</text><text x="27" y="134" font-size="16">02 · Unclear referent</text><text x="27" y="161" font-size="16">03 · Unspecified action</text><text x="27" y="188" font-size="16">04 · Missing comparison</text><rect x="12" y="242" width="336" height="169" rx="7" fill="#f4e9cc"/><text x="27" y="272" font-size="22">Generalizations</text><text x="27" y="304" font-size="16">Examine rules and limits</text><text x="27" y="331" font-size="16">05 · Universal claims</text><text x="27" y="358" font-size="16">06 · Possibility / “can’t”</text><text x="27" y="385" font-size="16">07 · Necessity / “must”</text><rect x="12" y="439" width="336" height="250" rx="7" fill="#f4e2d9"/><text x="27" y="469" font-size="22">Distortions</text><text x="27" y="501" font-size="16">Examine inferred connections</text><text x="27" y="528" font-size="16">08 · Attributed thoughts</text><text x="27" y="555" font-size="16">09 · Causal links</text><text x="27" y="582" font-size="16">10 · Event equals meaning</text><text x="27" y="609" font-size="16">11 · Process as a noun</text><text x="27" y="636" font-size="16">12 · Unattributed judgment</text><text x="27" y="663" font-size="16">13 · Built-in assumption</text></svg>
