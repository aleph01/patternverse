<svg xmlns="http://www.w3.org/2000/svg" width="360" height="356" viewBox="0 0 360 356" role="img" aria-labelledby="title desc"><title id="title">Separate observation and two inferences</title><desc id="desc">A rewrite request is observed. The manager’s attributed judgment and risk to the role require more information.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#243d36}</style><rect width="360" height="356" fill="#fcfaf5"/><rect x="12" y="18" width="336" height="88" rx="7" fill="#e7eee3"/><text x="27" y="48" font-size="22">Observed event</text><text x="27" y="80" font-size="16">“Please rewrite this.”</text><rect x="12" y="134" width="336" height="88" rx="7" fill="#f4e9cc"/><text x="27" y="164" font-size="22">Attributed thought</text><text x="27" y="196" font-size="16">“They think I’m incapable.”</text><rect x="12" y="250" width="336" height="88" rx="7" fill="#f4e2d9"/><text x="27" y="280" font-size="22">Further meaning</text><text x="27" y="312" font-size="16">“My role is at risk.”</text></svg>
