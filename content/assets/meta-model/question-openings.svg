<svg xmlns="http://www.w3.org/2000/svg" width="900" height="305" viewBox="0 0 900 305" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">Three routes from a compressed statement to a useful question</title><desc id="map-desc">They never listen contains a missing referent, a universal claim, and an undefined action. Ask who, in which situations, and what listening would look like.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#243d36}</style><rect width="100%" height="100%" fill="#fcfaf5"/>
<rect x="250" y="5" width="400" height="61" rx="9" fill="#243d36"/><text x="450" y="44" text-anchor="middle" style="fill:#fcfaf5;font-size:25px;font-family:Georgia,serif">“They never listen.”</text>
<path d="M450 66V96H145V123M450 96V123M450 96H755V123" stroke="#a9b7aa" stroke-width="2" fill="none"/>
<rect x="10" y="123" width="270" height="137" rx="9" fill="#e7eee3"/><rect x="315" y="123" width="270" height="137" rx="9" fill="#f4e9cc"/><rect x="620" y="123" width="270" height="137" rx="9" fill="#e7eee3"/>
<text x="33" y="153" style="font-size:13px;letter-spacing:2px">MISSING DETAIL</text><text x="33" y="189" style="font-size:24px;font-family:Georgia,serif">Who is “they”?</text><text x="33" y="226" style="font-size:17px">Recover the referent.</text>
<text x="338" y="153" style="font-size:13px;letter-spacing:2px">SCOPE OF THE RULE</text><text x="338" y="189" style="font-size:24px;font-family:Georgia,serif">In every situation?</text><text x="338" y="226" style="font-size:17px">Find the relevant range.</text>
<text x="643" y="153" style="font-size:13px;letter-spacing:2px">UNSPECIFIED ACTION</text><text x="643" y="189" style="font-size:24px;font-family:Georgia,serif">What would listening</text><text x="643" y="220" style="font-size:24px;font-family:Georgia,serif">look like here?</text>
<text x="450" y="294" text-anchor="middle" style="font-size:16px">One sentence can offer several routes. Choose the one that matters.</text>
</svg>
