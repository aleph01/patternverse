<svg xmlns="http://www.w3.org/2000/svg" width="360" height="553" viewBox="0 0 360 553" role="img" aria-labelledby="title desc"><title id="title">Three openings in “They never listen”</title><desc id="desc">Two deletion questions recover who and what. A generalization question examines the word never.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#243d36}</style><rect width="360" height="553" fill="#fcfaf5"/><rect x="12" y="18" width="336" height="88" rx="7" fill="#e7eee3"/><text x="27" y="48" font-size="22">“They never listen.”</text><text x="27" y="80" font-size="16">One statement, several openings.</text><rect x="12" y="134" width="336" height="115" rx="7" fill="#e7eee3"/><text x="27" y="164" font-size="22">Missing detail</text><text x="27" y="196" font-size="16">Who is “they”?</text><text x="27" y="223" font-size="16">Recover the referent.</text><rect x="12" y="277" width="336" height="115" rx="7" fill="#f4e9cc"/><text x="27" y="307" font-size="22">Scope of the rule</text><text x="27" y="339" font-size="16">In every situation?</text><text x="27" y="366" font-size="16">Find the relevant range.</text><rect x="12" y="420" width="336" height="115" rx="7" fill="#e7eee3"/><text x="27" y="450" font-size="22">Unspecified action</text><text x="27" y="482" font-size="16">What would listening</text><text x="27" y="509" font-size="16">look like here?</text></svg>
