<svg xmlns="http://www.w3.org/2000/svg" width="360" height="580" viewBox="0 0 360 580" role="img" aria-labelledby="title desc"><title id="title">From a broad verdict to a possible request</title><desc id="desc">Specific observations and desired responses clarify what someone could ask for in the next meeting.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#243d36}</style><rect width="360" height="580" fill="#fcfaf5"/><rect x="12" y="18" width="336" height="115" rx="7" fill="#e7eee3"/><text x="27" y="48" font-size="22">Broad verdict</text><text x="27" y="80" font-size="16">“They never take my</text><text x="27" y="107" font-size="16">ideas seriously.”</text><rect x="12" y="161" width="336" height="115" rx="7" fill="#e7eee3"/><text x="27" y="191" font-size="22">Specific incident</text><text x="27" y="223" font-size="16">A handover suggestion</text><text x="27" y="250" font-size="16">was passed over.</text><rect x="12" y="304" width="336" height="115" rx="7" fill="#e7eee3"/><text x="27" y="334" font-size="22">Desired response</text><text x="27" y="366" font-size="16">Ask a question or</text><text x="27" y="393" font-size="16">explain the decision.</text><rect x="12" y="447" width="336" height="115" rx="7" fill="#e7eee3"/><text x="27" y="477" font-size="22">Possible request</text><text x="27" y="509" font-size="16">Agree a way to respond</text><text x="27" y="536" font-size="16">to suggestions.</text></svg>
