<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="inference-title inference-desc"><title id="inference-title">Observation, attributed thought, and meaning are distinct</title><desc id="inference-desc">A manager asked for a rewrite. One interpretation is that the manager thinks the author is incompetent. A further meaning is that the author's role is at risk. Each transition needs its own evidence.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#243d36}</style><rect width="100%" height="100%" fill="#fcfaf5"/><rect x="0" y="15" width="266" height="99" rx="8" fill="#e7eee3"/><rect x="317" y="15" width="266" height="99" rx="8" fill="#f4e9cc"/><rect x="634" y="15" width="266" height="99" rx="8" fill="#f4e2d9"/><path d="M275 65H305M296 57L305 65L296 73M592 65H622M613 57L622 65L613 73" stroke="#8a9d8d" stroke-width="2" fill="none"/><text x="18" y="42" style="font-size:12px;letter-spacing:1px">OBSERVED EVENT</text><text x="18" y="73" style="font-size:20px">“Please rewrite this.”</text><text x="335" y="42" style="font-size:12px;letter-spacing:1px">ATTRIBUTED THOUGHT</text><text x="335" y="73" style="font-size:20px">“They think I’m incapable.”</text><text x="652" y="42" style="font-size:12px;letter-spacing:1px">FURTHER MEANING</text><text x="652" y="73" style="font-size:20px">“My role is at risk.”</text><text x="450" y="145" text-anchor="middle" style="font-size:16px">The event is established. The two inferences require additional information.</text></svg>
