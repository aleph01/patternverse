<svg xmlns="http://www.w3.org/2000/svg" width="900" height="246" viewBox="0 0 900 246" role="img" aria-labelledby="ladder-title ladder-desc"><title id="ladder-title">A concern becomes more specific through three clarifications</title><desc id="ladder-desc">Broad verdict: they never take my ideas seriously. Incident: one suggestion was passed over. Desired response: a question or an explanation. Possible request: agree how suggestions receive a response in the weekly meeting.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#243d36}</style><rect width="100%" height="100%" fill="#fcfaf5"/><path d="M32 29V208" stroke="#b8c4b6" stroke-width="2"/><circle cx="32" cy="30" r="7" fill="#476a57"/><circle cx="32" cy="89" r="7" fill="#476a57"/><circle cx="32" cy="148" r="7" fill="#476a57"/><circle cx="32" cy="207" r="7" fill="#476a57"/><text x="56" y="35" style="font-size:13px;letter-spacing:1px">BROAD VERDICT</text><text x="270" y="35" style="font-size:20px">“They never take my ideas seriously.”</text><text x="56" y="94" style="font-size:13px;letter-spacing:1px">SPECIFIC INCIDENT</text><text x="270" y="94" style="font-size:20px">A handover suggestion was passed over.</text><text x="56" y="153" style="font-size:13px;letter-spacing:1px">DESIRED RESPONSE</text><text x="270" y="153" style="font-size:20px">Ask a question or explain the decision.</text><text x="56" y="212" style="font-size:13px;letter-spacing:1px">POSSIBLE REQUEST</text><text x="270" y="212" style="font-size:20px">Agree a way to respond to suggestions.</text></svg>
