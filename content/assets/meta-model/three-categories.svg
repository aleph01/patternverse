<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="categories-title categories-desc">
<title id="categories-title">The Meta Model and its three broad categories</title>
<desc id="categories-desc">The Meta Model branches into deletions, generalizations, and distortions. Four question types recover missing detail; three examine rules and limits; six examine inferred relationships and meanings. The thirteen distinctions are the teaching organization used in this guide.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#243d36}</style><rect width="100%" height="100%" fill="#fcfaf5"/>
<rect x="300" y="5" width="300" height="58" rx="9" fill="#243d36"/><text x="450" y="43" text-anchor="middle" style="fill:#fcfaf5;font-size:27px;font-family:Georgia,serif">The Meta Model</text>
<path d="M450 63V86H145V110M450 86V110M450 86H755V110" stroke="#a9b7aa" stroke-width="2" fill="none"/>
<rect x="10" y="110" width="270" height="254" rx="9" fill="#e7eee3"/><rect x="315" y="110" width="270" height="254" rx="9" fill="#f4e9cc"/><rect x="620" y="110" width="270" height="254" rx="9" fill="#f4e2d9"/>
<text x="30" y="148" style="font-size:27px;font-family:Georgia,serif">Deletions</text><text x="30" y="178" style="font-size:17px">Recover missing detail</text><path d="M30 194H260" stroke="#c2cec0"/>
<text x="30" y="222" style="font-size:16px">01 · Missing object</text><text x="30" y="249" style="font-size:16px">02 · Unclear referent</text><text x="30" y="276" style="font-size:16px">03 · Unspecified action</text><text x="30" y="303" style="font-size:16px">04 · Missing comparison</text>
<text x="335" y="148" style="font-size:27px;font-family:Georgia,serif">Generalizations</text><text x="335" y="178" style="font-size:17px">Examine rules and limits</text><path d="M335 194H565" stroke="#daceaa"/>
<text x="335" y="222" style="font-size:16px">05 · Universal claims</text><text x="335" y="249" style="font-size:16px">06 · Possibility / “can’t”</text><text x="335" y="276" style="font-size:16px">07 · Necessity / “must”</text>
<text x="640" y="148" style="font-size:27px;font-family:Georgia,serif">Distortions</text><text x="640" y="178" style="font-size:17px">Examine inferred connections</text><path d="M640 194H870" stroke="#dec7bb"/>
<text x="640" y="222" style="font-size:16px">08 · Attributed thoughts</text><text x="640" y="247" style="font-size:16px">09 · Causal links</text><text x="640" y="272" style="font-size:16px">10 · Event equals meaning</text><text x="640" y="297" style="font-size:16px">11 · Process as a noun</text><text x="640" y="322" style="font-size:16px">12 · Unattributed judgment</text><text x="640" y="347" style="font-size:16px">13 · Built-in assumption</text>
</svg>
