<svg xmlns="http://www.w3.org/2000/svg" width="560" height="410" viewBox="0 0 560 410" role="img" aria-labelledby="title desc" data-architecture-style="light-editorial">
<title id="title">Trade depth for useful edges</title>
<desc id="desc">Two axonometric building forms compare a deep block with shallow connected wings around an open garden, showing their different exposed edges. Original conceptual drawing; not to scale.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--stone:#f1f2ef;--line:#a6aca3;--mint:#edf5f0;--green:#00855b;--deep:#00855b}
svg{background:#fff;color:var(--ink)}
path,rect,circle,ellipse{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:21.777778px;font-weight:400;letter-spacing:0}
.on-accent{fill:#fff}
.paper{fill:var(--paper)}.existing{fill:var(--stone);stroke:var(--line);stroke-width:1.1}
.landscape{fill:var(--mint)}.tree{fill:var(--paper);stroke:var(--ink);stroke-width:1.1}
.intervention{fill:var(--green);stroke:var(--deep);stroke-width:.8}
.highlight-plane{fill:var(--mint);stroke:var(--green);stroke-width:1.3}
.line{fill:none;stroke:var(--ink);stroke-width:1.3}.wall-line{fill:none;stroke:var(--ink);stroke-width:1.8}
.fine,.leader{fill:none;stroke:var(--line);stroke-width:1.1}
.boundary{fill:none;stroke:var(--line);stroke-width:1.1}.disturbed{fill:url(#hatch);stroke:var(--line);stroke-width:.8}
.path-surface{fill:var(--stone);stroke:none}.route{fill:none;stroke:var(--green);stroke-width:1.4}
.outline-green{fill:none;stroke:var(--deep);stroke-width:1.6}
.wall{fill:var(--stone);stroke:var(--line);stroke-width:1}
.room{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
.garden,.retained{fill:var(--mint);stroke:var(--line);stroke-width:.8}
.new,.seat,.shade{fill:var(--green);stroke:var(--deep);stroke-width:.8}
.flow{fill:none;stroke:var(--green);stroke-width:1.4}
.thermal,.retained-line{fill:none;stroke:var(--deep);stroke-width:1.6}
.glass{fill:var(--mint);stroke:var(--deep);stroke-width:1}
.service{fill:var(--paper);stroke:var(--deep);stroke-width:1.2}
.light{fill:var(--mint)}
.person{fill:var(--ink);stroke:none}.plan-head{fill:var(--paper);stroke:var(--ink);stroke-width:1.1}
.warning{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-dasharray:5 4}
.dashed{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 4}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.1"/></marker>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="9" height="9"><path d="M-2 2L2 -2M0 9L9 0M7 11L11 7" stroke="var(--line)" stroke-width=".7"/></pattern>
</defs>
<rect width="560" height="410" class="paper"/>
<path d="M242 234.35L148 276.65L148 218.64999999999998L242 176.35Z" class="existing"/><path d="M148 276.65L48 231.65L48 173.65L148 218.64999999999998Z" class="existing"/><path d="M142 131.35L242 176.35L148 218.64999999999998L48 173.65Z" class="paper"/><path d="M142 131.35L242 176.35L148 218.64999999999998L48 173.65Z" class="line"/><path d="M242,234.35L242,176.35M148,276.65L148,218.64999999999998M48,231.65L48,173.65" class="fine"/><path d="M416 179.45L538 234.35L422 286.55L300 231.65Z" class="boundary"/><path d="M416 224.45L488 256.85L422 286.55L350 254.15Z" class="landscape"/><path d="M466 201.95L350 254.15L350 196.15L466 143.95Z" class="existing"/><path d="M350 254.15L300 231.65L300 173.65L350 196.15Z" class="existing"/><path d="M416 121.44999999999999L466 143.95L350 196.15L300 173.65Z" class="paper"/><path d="M416 121.44999999999999L466 143.95L350 196.15L300 173.65Z" class="line"/><path d="M466,201.95L466,143.95M350,254.15L350,196.15M300,231.65L300,173.65" class="fine"/><path d="M538 234.35L488 256.85L488 198.85000000000002L538 176.35Z" class="existing"/><path d="M488 256.85L416 224.45L416 166.45L488 198.85000000000002Z" class="existing"/><path d="M466 143.95L538 176.35L488 198.85000000000002L416 166.45Z" class="paper"/><path d="M466 143.95L538 176.35L488 198.85000000000002L416 166.45Z" class="line"/><path d="M538,234.35L538,176.35M488,256.85L488,198.85000000000002M416,224.45L416,166.45" class="fine"/><path d="M416 120.44999999999999L466 142.95L350 195.15L300 172.65Z" class="highlight-plane"/><text x="145" y="323" text-anchor="middle">Deep block</text><text x="414" y="323" text-anchor="middle">Shallow wings</text><text x="280" y="381" text-anchor="middle">More edge changes more than daylight.</text>
</svg>
