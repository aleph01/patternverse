<text x="234" y="63" class="heading">Near</text>
<text x="525" y="63" class="heading">Far</text>
<path d="M265 81V199M566 81V199" class="hair"/>
<text x="42" y="402" class="small">Camera</text><path d="M83 378V307" class="hair"/>
