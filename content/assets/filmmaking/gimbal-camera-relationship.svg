<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-film-style="light-editorial" data-view="section-comparison">
<title id="title">Choose what moves with the set</title>
<desc id="desc">The set moves on a support while the camera either remains separate or rides with it. Relative movement changes the apparent horizon and the way the audience reads the action. Original conceptual illustration; not a documented film setup.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b;--deep:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:26px;font-weight:400;letter-spacing:0}
.heading{font-size:28px}.small,.caption{font-size:26px}
.legacy text{font-size:20.222222px}.legacy.compact text{font-size:21.777778px}
path,rect,circle,ellipse{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.stone{fill:var(--stone)}
.existing,.wall{fill:var(--stone);stroke:var(--line);stroke-width:1.1}
.line{fill:none;stroke:var(--ink);stroke-width:1.3}
.hair,.fine,.leader,.boundary{fill:none;stroke:var(--line);stroke-width:1.1}
.wall-line{fill:none;stroke:var(--ink);stroke-width:1.8}
.landscape,.mint,.light{fill:var(--mint)}
.intervention,.new,.seat{fill:var(--green);stroke:none}
.outline-green,.accent{fill:none;stroke:var(--green);stroke-width:1.5}
.glassed,.glassed-line{fill:none;stroke:var(--green);stroke-width:1.2}
.glass{fill:var(--mint);stroke:var(--green);stroke-width:1.1}
.dashed{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 5}
.figure,.ink{fill:var(--ink);stroke:none}.figure-accent{fill:var(--green);stroke:none}
.plan-head{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.ghost{fill:none;stroke:var(--green);stroke-width:1.2;stroke-dasharray:3 4}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--green)" stroke-width="1.1"/></marker>
<marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.1"/></marker>
</defs>
<rect width="720" height="560" class="paper"/>
<g class="legacy" transform="translate(0 8) scale(1.2857142857)"><text x="146" y="43" text-anchor="middle">Camera stays</text><text x="416" y="43" text-anchor="middle">Camera rides</text><g transform="translate(146 183)"><g transform="rotate(-15)"><rect x="-75" y="-43" width="150" height="98" class="existing"/><g transform="translate(0 48) scale(0.71)" class="figure"><path d="M-7-76C-15-79-15-92-7-96C1-100 10-95 10-88L15-84 10-81C10-75 5-72 0-73L-1-67C9-64 13-55 14-43L5-38 3-28 10-2 1 0-8-23-10-1-19 0-18-32-20-52C-21-63-15-68-8-69Z"/><path d="M4-61Q12-61 14-51L17 -39L28 -49L34 -44L21 -32Q15 -29 10 -36L3-49Z"/></g></g></g><circle cx="146" cy="254" r="11" class="glassed"/><path d="M89 290L146 254L203 290" class="fine" /><g transform="translate(416 183)"><g transform="rotate(-15)"><rect x="-75" y="-43" width="150" height="98" class="existing"/><g transform="translate(0 48) scale(0.71)" class="figure"><path d="M-7-76C-15-79-15-92-7-96C1-100 10-95 10-88L15-84 10-81C10-75 5-72 0-73L-1-67C9-64 13-55 14-43L5-38 3-28 10-2 1 0-8-23-10-1-19 0-18-32-20-52C-21-63-15-68-8-69Z"/><path d="M4-61Q12-61 14-51L17 -39L28 -49L34 -44L21 -32Q15 -29 10 -36L3-49Z"/></g><g transform="translate(-48 -9) rotate(0)"><rect x="-22" y="-13" width="36" height="26" class="figure"/><path d="M14 -9L27 -16V16L14 9Z" class="figure" /></g></g></g><circle cx="416" cy="254" r="11" class="glassed"/><path d="M359 290L416 254L473 290" class="fine" /><g transform="translate(52 235) rotate(0)"><rect x="-22" y="-13" width="36" height="26" class="figure"/><path d="M14 -9L27 -16V16L14 9Z" class="figure" /></g><path d="M79 235L112 206" class="fine" /><path d="M228 160Q254 199 223 234" class="outline-green" marker-end="url(#arrow)"/><path d="M499 160Q525 199 494 234" class="outline-green" marker-end="url(#arrow)"/><text x="280" y="376" text-anchor="middle">Relative camera motion changes the perceived movement.</text></g>
</svg>
