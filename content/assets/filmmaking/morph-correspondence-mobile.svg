<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-film-style="light-editorial" data-view="frame-sequence">
<title id="title">Move corresponding features while blending appearance</title>
<desc id="desc">Corresponding eyes, mouth and silhouette move toward intermediate positions while the appearance blends. The invented faces explain landmark movement without warping film imagery. Original conceptual illustration; not a documented film setup.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b;--deep:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:26px;font-weight:400;letter-spacing:0}
.heading{font-size:28px}.small,.caption{font-size:26px}
.legacy text{font-size:20.222222px}.legacy.compact text{font-size:21.777778px}
path,rect,circle,ellipse{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.stone{fill:var(--stone)}
.existing,.wall{fill:var(--stone);stroke:var(--line);stroke-width:1.1}
.line{fill:none;stroke:var(--ink);stroke-width:1.3}
.hair,.fine,.leader,.boundary{fill:none;stroke:var(--line);stroke-width:1.1}
.wall-line{fill:none;stroke:var(--ink);stroke-width:1.8}
.landscape,.mint,.light{fill:var(--mint)}
.intervention,.new,.seat{fill:var(--green);stroke:none}
.outline-green,.accent{fill:none;stroke:var(--green);stroke-width:1.5}
.glassed,.glassed-line{fill:none;stroke:var(--green);stroke-width:1.2}
.glass{fill:var(--mint);stroke:var(--green);stroke-width:1.1}
.dashed{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 5}
.figure,.ink{fill:var(--ink);stroke:none}.figure-accent{fill:var(--green);stroke:none}
.plan-head{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.ghost{fill:none;stroke:var(--green);stroke-width:1.2;stroke-dasharray:3 4}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--green)" stroke-width="1.1"/></marker>
<marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.1"/></marker>
</defs>
<rect width="720" height="560" class="paper"/>
<g class="legacy compact" transform="translate(0 8) scale(1.2857142857)"><text x="106" y="43" text-anchor="middle">Source</text><ellipse cx="106" cy="175" rx="36" ry="58" class="landscape"/><ellipse cx="106" cy="175" rx="36" ry="58" class="line"/><circle cx="92" cy="164" r="3" class="intervention"/><circle cx="120" cy="164" r="3" class="intervention"/><path d="M92 194Q106 205 120 194" class="outline-green" /><text x="281" y="43" text-anchor="middle">Intermediate</text><ellipse cx="281" cy="175" rx="46" ry="49" class="landscape"/><ellipse cx="281" cy="175" rx="46" ry="49" class="line"/><circle cx="259.5" cy="164" r="3" class="intervention"/><circle cx="302.5" cy="164" r="3" class="intervention"/><path d="M267 194Q281 205 295 194" class="outline-green" /><text x="456" y="43" text-anchor="middle">Target</text><ellipse cx="456" cy="175" rx="56" ry="40" class="landscape"/><ellipse cx="456" cy="175" rx="56" ry="40" class="line"/><circle cx="427" cy="164" r="3" class="intervention"/><circle cx="485" cy="164" r="3" class="intervention"/><path d="M442 194Q456 205 470 194" class="outline-green" /><path d="M93 287H470" class="fine" /><path d="M123 287H269" class="outline-green" marker-end="url(#arrow)"/><path d="M299 287H445" class="outline-green" marker-end="url(#arrow)"/><text x="280" y="357" text-anchor="middle">Move corresponding features</text><text x="280" y="389" text-anchor="middle">as appearance blends.</text></g>
</svg>
