<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-film-style="light-editorial" data-view="optical-plan">
<title id="title">Follow the reflection</title>
<desc id="desc">A partly reflective sheet sends light from a hidden subject toward the camera while transmitting the visible set. The two contributions overlap in the viewed image. Original conceptual illustration; not a documented film setup.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b;--deep:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:26px;font-weight:400;letter-spacing:0}
.heading{font-size:28px}.small,.caption{font-size:26px}
.legacy text{font-size:20.222222px}.legacy.compact text{font-size:21.777778px}
path,rect,circle,ellipse{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.stone{fill:var(--stone)}
.existing,.wall{fill:var(--stone);stroke:var(--line);stroke-width:1.1}
.line{fill:none;stroke:var(--ink);stroke-width:1.3}
.hair,.fine,.leader,.boundary{fill:none;stroke:var(--line);stroke-width:1.1}
.wall-line{fill:none;stroke:var(--ink);stroke-width:1.8}
.landscape,.mint,.light{fill:var(--mint)}
.intervention,.new,.seat{fill:var(--green);stroke:none}
.outline-green,.accent{fill:none;stroke:var(--green);stroke-width:1.5}
.glassed,.glassed-line{fill:none;stroke:var(--green);stroke-width:1.2}
.glass{fill:var(--mint);stroke:var(--green);stroke-width:1.1}
.dashed{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 5}
.figure,.ink{fill:var(--ink);stroke:none}.figure-accent{fill:var(--green);stroke:none}
.plan-head{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.ghost{fill:none;stroke:var(--green);stroke-width:1.2;stroke-dasharray:3 4}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--green)" stroke-width="1.1"/></marker>
<marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.1"/></marker>
</defs>
<rect width="720" height="560" class="paper"/>
<text x="42" y="53" text-anchor="start" class="heading">A hidden performer</text><text x="604" y="53" text-anchor="end" class="heading">Visible set</text><rect x="463" y="169" width="185" height="253" class="boundary"/><rect x="577" y="188" width="48" height="31" class="existing"/><g transform="translate(360 146) rotate(180) scale(0.72)"><path d="M-40 24Q-33 7-15 6H15Q33 7 40 24V35Q0 49-40 35Z" class="figure" /><ellipse cx="0" cy="0" rx="21" ry="25" class="plan-head"/><path d="M-5-22L0-30L5-22" class="figure" /></g><g transform="translate(518 300) rotate(-90) scale(0.72)"><path d="M-40 24Q-33 7-15 6H15Q33 7 40 24V35Q0 49-40 35Z" class="ghost" /><ellipse cx="0" cy="0" rx="21" ry="25" class="ghost"/><path d="M-5-22L0-30L5-22" class="ghost" /></g><g transform="translate(85 300) rotate(0) scale(1)"><path d="M-25-14H9V14H-25ZM9-8L25-14V14L9 8Z" class="figure" /></g><path d="M280 380L440 220" class="glassed" /><path d="M360 194V300H115" class="accent" marker-end="url(#arrow)"/><path d="M360 300H570" class="dashed" /><path d="M570 314H115" class="hair" /><path d="M302 75H360V97" class="hair" /><text x="42" y="395" text-anchor="start" class="small">Camera</text><path d="M93 373V328" class="hair" /><text x="291" y="453" text-anchor="start" class="small">Partly reflective glass</text><path d="M344 425L302 361" class="hair" /><text x="514" y="392" text-anchor="middle" class="small">Virtual image</text><text x="42" y="530" text-anchor="start" class="caption">Reflected light joins the view through the glass.</text>
</svg>
