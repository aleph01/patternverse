<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-film-style="light-editorial" data-view="one-exposure-and-next-frame">
<title id="title">Accumulate light inside one frame</title>
<desc id="desc">Three instants contribute light to a single open exposure. The accumulated first frame and a slightly changed second frame form successive animation images. Original conceptual illustration; not a documented film setup.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b;--deep:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:26px;font-weight:400;letter-spacing:0}
.heading{font-size:28px}.small,.caption{font-size:26px}
.legacy text{font-size:20.222222px}.legacy.compact text{font-size:21.777778px}
path,rect,circle,ellipse{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.stone{fill:var(--stone)}
.existing,.wall{fill:var(--stone);stroke:var(--line);stroke-width:1.1}
.line{fill:none;stroke:var(--ink);stroke-width:1.3}
.hair,.fine,.leader,.boundary{fill:none;stroke:var(--line);stroke-width:1.1}
.wall-line{fill:none;stroke:var(--ink);stroke-width:1.8}
.landscape,.mint,.light{fill:var(--mint)}
.intervention,.new,.seat{fill:var(--green);stroke:none}
.outline-green,.accent{fill:none;stroke:var(--green);stroke-width:1.5}
.glassed,.glassed-line{fill:none;stroke:var(--green);stroke-width:1.2}
.glass{fill:var(--mint);stroke:var(--green);stroke-width:1.1}
.dashed{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 5}
.figure,.ink{fill:var(--ink);stroke:none}.figure-accent{fill:var(--green);stroke:none}
.plan-head{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.ghost{fill:none;stroke:var(--green);stroke-width:1.2;stroke-dasharray:3 4}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--green)" stroke-width="1.1"/></marker>
<marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.1"/></marker>
</defs>
<rect width="720" height="560" class="paper"/>
<text x="42" y="50" text-anchor="start">One frame stays exposed</text><path d="M42 83V70H678V83" class="hair" /><text x="136" y="123" text-anchor="middle">Early</text><rect x="42" y="149" width="188" height="125" class="boundary"/><rect x="145" y="205" width="6" height="22" class="intervention"/><rect x="121" y="205" width="6" height="22" class="intervention"/><path d="M108 286H165" class="hair" /><text x="360" y="123" text-anchor="middle">Middle</text><rect x="266" y="149" width="188" height="125" class="boundary"/><rect x="392" y="186" width="6" height="60" class="intervention"/><rect x="322" y="186" width="6" height="60" class="intervention"/><path d="M332 286H389" class="hair" /><text x="584" y="123" text-anchor="middle">Late</text><rect x="490" y="149" width="188" height="125" class="boundary"/><rect x="639" y="167" width="6" height="98" class="intervention"/><rect x="523" y="167" width="6" height="98" class="intervention"/><path d="M556 286H613" class="hair" /><text x="42" y="332" text-anchor="start">Movement builds a streak during exposure.</text><rect x="108" y="377" width="156" height="112" class="boundary"/><path d="M176 423V445M196 423V445" class="accent" /><path d="M171 419V449M201 419V449" class="accent" /><path d="M166 415V453M206 415V453" class="accent" /><path d="M161 411V457M211 411V457" class="accent" /><path d="M156 407V461M216 407V461" class="accent" /><path d="M151 403V465M221 403V465" class="accent" /><path d="M146 399V469M226 399V469" class="accent" /><path d="M141 395V473M231 395V473" class="accent" /><path d="M136 391V477M236 391V477" class="accent" /><path d="M131 387V481M241 387V481" class="accent" /><text x="186" y="531" text-anchor="middle">Frame 1</text><rect x="456" y="377" width="156" height="112" class="boundary"/><path d="M524 427V441M544 427V441" class="accent" /><path d="M519 423V445M549 423V445" class="accent" /><path d="M514 419V449M554 419V449" class="accent" /><path d="M509 415V453M559 415V453" class="accent" /><path d="M504 411V457M564 411V457" class="accent" /><path d="M499 407V461M569 407V461" class="accent" /><path d="M494 403V465M574 403V465" class="accent" /><path d="M489 399V469M579 399V469" class="accent" /><path d="M484 395V473M584 395V473" class="accent" /><path d="M479 391V477M589 391V477" class="accent" /><text x="534" y="531" text-anchor="middle">Frame 2</text>
</svg>
