<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-film-style="light-editorial" data-view="exposure-sequence">
<title id="title">Build motion between exposures</title>
<desc id="desc">A puppet’s pose changes between individual recorded exposures. Joints can move and parts can be replaced; the finished sequence contains the photographed states, not the animator’s interventions. Original conceptual illustration; not a documented film setup.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b;--deep:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:26px;font-weight:400;letter-spacing:0}
.heading{font-size:28px}.small,.caption{font-size:26px}
.legacy text{font-size:20.222222px}.legacy.compact text{font-size:21.777778px}
path,rect,circle,ellipse{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.stone{fill:var(--stone)}
.existing,.wall{fill:var(--stone);stroke:var(--line);stroke-width:1.1}
.line{fill:none;stroke:var(--ink);stroke-width:1.3}
.hair,.fine,.leader,.boundary{fill:none;stroke:var(--line);stroke-width:1.1}
.wall-line{fill:none;stroke:var(--ink);stroke-width:1.8}
.landscape,.mint,.light{fill:var(--mint)}
.intervention,.new,.seat{fill:var(--green);stroke:none}
.outline-green,.accent{fill:none;stroke:var(--green);stroke-width:1.5}
.glassed,.glassed-line{fill:none;stroke:var(--green);stroke-width:1.2}
.glass{fill:var(--mint);stroke:var(--green);stroke-width:1.1}
.dashed{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 5}
.figure,.ink{fill:var(--ink);stroke:none}.figure-accent{fill:var(--green);stroke:none}
.plan-head{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.ghost{fill:none;stroke:var(--green);stroke-width:1.2;stroke-dasharray:3 4}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--green)" stroke-width="1.1"/></marker>
<marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.1"/></marker>
</defs>
<rect width="720" height="560" class="paper"/>
<g class="legacy compact" transform="translate(0 8) scale(1.2857142857)"><text x="41" y="43" text-anchor="start">Changes happen between exposures</text><rect x="40" y="83" width="145" height="171" class="boundary"/><g transform="translate(112 236) scale(1.06)" class="figure-accent"><path d="M-7-76C-15-79-15-92-7-96C1-100 10-95 10-88L15-84 10-81C10-75 5-72 0-73L-1-67C9-64 13-55 14-43L5-38 3-28 10-2 1 0-8-23-10-1-19 0-18-32-20-52C-21-63-15-68-8-69Z"/><path d="M4-61Q12-61 14-51L17 -39L28 -49L34 -44L21 -32Q15 -29 10 -36L3-49Z"/></g><text x="112" y="292" text-anchor="middle">Frame 1</text><rect x="215" y="83" width="145" height="171" class="boundary"/><g transform="translate(287 236) scale(1.06)" class="figure-accent"><path d="M-7-76C-15-79-15-92-7-96C1-100 10-95 10-88L15-84 10-81C10-75 5-72 0-73L-1-67C9-64 13-55 14-43L5-38 3-28 10-2 1 0-8-23-10-1-19 0-18-32-20-52C-21-63-15-68-8-69Z"/><path d="M4-61Q12-61 14-51L17 -44L23 -67L29 -62L21 -37Q15 -34 10 -41L3-49Z"/></g><text x="287" y="292" text-anchor="middle">Frame 2</text><rect x="390" y="83" width="145" height="171" class="boundary"/><g transform="translate(462 236) scale(1.06)" class="figure-accent"><path d="M-7-76C-15-79-15-92-7-96C1-100 10-95 10-88L15-84 10-81C10-75 5-72 0-73L-1-67C9-64 13-55 14-43L5-38 3-28 10-2 1 0-8-23-10-1-19 0-18-32-20-52C-21-63-15-68-8-69Z"/><path d="M4-61Q12-61 14-51L17 -49L18 -85L24 -80L21 -42Q15 -39 10 -46L3-49Z"/></g><text x="462" y="292" text-anchor="middle">Frame 3</text><text x="280" y="357" text-anchor="middle">Pose a joint or replace a</text><text x="280" y="389" text-anchor="middle">part; record one frame.</text></g>
</svg>
