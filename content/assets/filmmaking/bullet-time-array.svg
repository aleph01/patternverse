<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-film-style="light-editorial" data-view="multiple-cameras-and-exposure-timing">
<title id="title">Separate viewpoint from event time</title>
<desc id="desc">Several physical cameras surround one performer. A timing strip distinguishes simultaneous exposures from staggered exposures before their viewpoints are sequenced. Original conceptual illustration; not a documented film setup.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b;--deep:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:26px;font-weight:400;letter-spacing:0}
.heading{font-size:28px}.small,.caption{font-size:26px}
.legacy text{font-size:20.222222px}.legacy.compact text{font-size:21.777778px}
path,rect,circle,ellipse{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.stone{fill:var(--stone)}
.existing,.wall{fill:var(--stone);stroke:var(--line);stroke-width:1.1}
.line{fill:none;stroke:var(--ink);stroke-width:1.3}
.hair,.fine,.leader,.boundary{fill:none;stroke:var(--line);stroke-width:1.1}
.wall-line{fill:none;stroke:var(--ink);stroke-width:1.8}
.landscape,.mint,.light{fill:var(--mint)}
.intervention,.new,.seat{fill:var(--green);stroke:none}
.outline-green,.accent{fill:none;stroke:var(--green);stroke-width:1.5}
.glassed,.glassed-line{fill:none;stroke:var(--green);stroke-width:1.2}
.glass{fill:var(--mint);stroke:var(--green);stroke-width:1.1}
.dashed{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 5}
.figure,.ink{fill:var(--ink);stroke:none}.figure-accent{fill:var(--green);stroke:none}
.plan-head{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.ghost{fill:none;stroke:var(--green);stroke-width:1.2;stroke-dasharray:3 4}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--green)" stroke-width="1.1"/></marker>
<marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.1"/></marker>
</defs>
<rect width="720" height="560" class="paper"/>
<text x="42" y="53" text-anchor="start">Several cameras around one event</text><path d="M137.8370599535143 229.88304800910925L360 270" class="hair" /><g transform="translate(137.8370599535143 229.88304800910925) rotate(100.23585147400645)"><g transform="translate(0 0) rotate(-90)"><path d="M-23-13H8V13H-23ZM8-8L24-13V13L8 8Z" class="figure" /></g></g><text x="137.8370599535143" y="202.88304800910925" text-anchor="middle">1</text><path d="M197.3654403270941 160.39844891608513L360 270" class="hair" /><g transform="translate(197.3654403270941 160.39844891608513) rotate(123.97654403625687)"><g transform="translate(0 0) rotate(-90)"><path d="M-23-13H8V13H-23ZM8-8L24-13V13L8 8Z" class="figure" /></g></g><text x="197.3654403270941" y="133.39844891608513" text-anchor="middle">2</text><path d="M300.4716196264202 120.2814969251944L360 270" class="hair" /><g transform="translate(300.4716196264202 120.2814969251944) rotate(158.31713121345354)"><g transform="translate(0 0) rotate(-90)"><path d="M-23-13H8V13H-23ZM8-8L24-13V13L8 8Z" class="figure" /></g></g><text x="300.4716196264202" y="93.2814969251944" text-anchor="middle">3</text><path d="M419.52838037357975 120.2814969251944L360 270" class="hair" /><g transform="translate(419.52838037357975 120.2814969251944) rotate(201.6828687865464)"><g transform="translate(0 0) rotate(-90)"><path d="M-23-13H8V13H-23ZM8-8L24-13V13L8 8Z" class="figure" /></g></g><text x="419.52838037357975" y="93.2814969251944" text-anchor="middle">4</text><path d="M522.6345596729059 160.39844891608516L360 270" class="hair" /><g transform="translate(522.6345596729059 160.39844891608516) rotate(236.02345596374315)"><g transform="translate(0 0) rotate(-90)"><path d="M-23-13H8V13H-23ZM8-8L24-13V13L8 8Z" class="figure" /></g></g><text x="522.6345596729059" y="133.39844891608516" text-anchor="middle">5</text><path d="M582.1629400464857 229.8830480091093L360 270" class="hair" /><g transform="translate(582.1629400464857 229.8830480091093) rotate(259.76414852599356)"><g transform="translate(0 0) rotate(-90)"><path d="M-23-13H8V13H-23ZM8-8L24-13V13L8 8Z" class="figure" /></g></g><text x="582.1629400464857" y="202.8830480091093" text-anchor="middle">6</text><circle cx="360" cy="270" r="24" class="intervention"/><text x="252" y="360" text-anchor="start">Together</text><text x="476" y="360" text-anchor="start">Staggered</text><path d="M242 389H431" class="accent" marker-end="url(#arrow)"/><path d="M476 389H665" class="accent" marker-end="url(#arrow)"/><text x="42" y="435" text-anchor="start">Camera 1</text><path d="M242 427H431M476 427H665" class="hair" /><circle cx="300" cy="427" r="8" class="intervention"/><circle cx="501" cy="427" r="8" class="intervention"/><text x="42" y="483" text-anchor="start">Camera 2</text><path d="M242 475H431M476 475H665" class="hair" /><circle cx="300" cy="475" r="8" class="intervention"/><circle cx="563" cy="475" r="8" class="intervention"/><text x="42" y="531" text-anchor="start">Camera 3</text><path d="M242 523H431M476 523H665" class="hair" /><circle cx="300" cy="523" r="8" class="intervention"/><circle cx="625" cy="523" r="8" class="intervention"/><text x="42" y="389" text-anchor="start">Time →</text>
</svg>
