<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-film-style="light-editorial" data-view="cutaway">
<title id="title">Open the set for the camera</title>
<desc id="desc">An exploded cutaway shows a wall panel lifted away from a room. A camera outside the open side photographs the interior while framing conceals the missing wall. Original conceptual illustration; not a documented film setup.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b;--deep:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:26px;font-weight:400;letter-spacing:0}
.heading{font-size:28px}.small,.caption{font-size:26px}
.legacy text{font-size:20.222222px}.legacy.compact text{font-size:21.777778px}
path,rect,circle,ellipse{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.stone{fill:var(--stone)}
.existing,.wall{fill:var(--stone);stroke:var(--line);stroke-width:1.1}
.line{fill:none;stroke:var(--ink);stroke-width:1.3}
.hair,.fine,.leader,.boundary{fill:none;stroke:var(--line);stroke-width:1.1}
.wall-line{fill:none;stroke:var(--ink);stroke-width:1.8}
.landscape,.mint,.light{fill:var(--mint)}
.intervention,.new,.seat{fill:var(--green);stroke:none}
.outline-green,.accent{fill:none;stroke:var(--green);stroke-width:1.5}
.glassed,.glassed-line{fill:none;stroke:var(--green);stroke-width:1.2}
.glass{fill:var(--mint);stroke:var(--green);stroke-width:1.1}
.dashed{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 5}
.figure,.ink{fill:var(--ink);stroke:none}.figure-accent{fill:var(--green);stroke:none}
.plan-head{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.ghost{fill:none;stroke:var(--green);stroke-width:1.2;stroke-dasharray:3 4}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--green)" stroke-width="1.1"/></marker>
<marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.1"/></marker>
</defs>
<rect width="720" height="560" class="paper"/>


<!-- The room is an oblique cutaway; the right wall is exploded vertically. -->
<path d="M90 340L306 258 630 380 414 462Z" class="stone" stroke="var(--line)" stroke-width="1.2"/>
<path d="M90 340V195L306 113V258M90 195L414 317" class="hair"/>
<path d="M306 113L630 235V380M306 258L630 380" class="hair"/>
<path d="M143 320L234 285 320 317 229 352Z" class="paper" stroke="var(--line)"/>
<path d="M143 320V283L234 248V285M143 283L229 315V352M234 248L320 280V317L229 352" class="hair"/>
<path d="M414 462L630 380" class="accent" stroke-dasharray="5 6"/>
<path d="M414 317V462M630 235V380" class="hair" stroke-dasharray="3 6"/>
<path d="M414 270L630 188V63L414 145Z" class="mint" stroke="var(--green)" stroke-width="1.8"/>
<path d="M425 263V153L619 79" class="hair"/>
<path d="M651 370V209" class="accent" marker-end="url(#arrow)"/>
<path d="M596 411L320 280 344 354Z" class="mint"/>
<path d="M596 411L320 280M596 411L344 354" class="hair"/>
<g transform="translate(354 362) scale(0.9)" fill="var(--ink)"><path d="M-7-77C-15-80-15-94-7-98C1-103 10-98 10-91L15-86 10-83C10-77 5-74 0-75L-1-68C9-65 13-56 14-44L29-50 31-44 12-35C7-34 4-42 1-47L3-29 10-2 1 0-8-24-10-1-19 0-18-33-20-53C-21-64-15-69-8-70Z"/></g><g transform="translate(613 417) rotate(-158) scale(0.8)"><path d="M-35-17H0V17H-35Q-39 17-39 13V-13Q-39-17-35-17ZM0-10L18-17V17L0 10Z" class="ink"/><path d="M-22 17V35M-22 27L-35 45M-22 27L-8 45" class="hair"/></g>
<text x="42" y="54" class="heading">A room on screen</text>
<path d="M42 72H202L241 126" class="hair"/>
<text x="650" y="41" text-anchor="end" class="small">Wall lifted clear</text>
<text x="650" y="493" text-anchor="end" class="small">Camera outside the set</text>
<path d="M606 472V453" class="hair"/>
<text x="42" y="538" class="caption">Remove the wall. Keep the room in the frame.</text>


</svg>
