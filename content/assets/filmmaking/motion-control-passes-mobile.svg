<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-film-style="light-editorial" data-view="successive-passes-and-frames">
<title id="title">Match the move, combine the passes</title>
<desc id="desc">Two passes record one actor in different places while the same camera repeats a straight path and timing. Dashed camera symbols mark earlier positions. Matching frames combine both roles. Original conceptual illustration; not a documented film setup.</desc>
<style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b;--deep:#00855b}
svg{background:#fff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:26px;font-weight:400;letter-spacing:0}
.heading{font-size:28px}.small,.caption{font-size:26px}
.legacy text{font-size:20.222222px}.legacy.compact text{font-size:21.777778px}
path,rect,circle,ellipse{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.stone{fill:var(--stone)}
.existing,.wall{fill:var(--stone);stroke:var(--line);stroke-width:1.1}
.line{fill:none;stroke:var(--ink);stroke-width:1.3}
.hair,.fine,.leader,.boundary{fill:none;stroke:var(--line);stroke-width:1.1}
.wall-line{fill:none;stroke:var(--ink);stroke-width:1.8}
.landscape,.mint,.light{fill:var(--mint)}
.intervention,.new,.seat{fill:var(--green);stroke:none}
.outline-green,.accent{fill:none;stroke:var(--green);stroke-width:1.5}
.glassed,.glassed-line{fill:none;stroke:var(--green);stroke-width:1.2}
.glass{fill:var(--mint);stroke:var(--green);stroke-width:1.1}
.dashed{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:5 5}
.figure,.ink{fill:var(--ink);stroke:none}.figure-accent{fill:var(--green);stroke:none}
.plan-head{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.ghost{fill:none;stroke:var(--green);stroke-width:1.2;stroke-dasharray:3 4}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--green)" stroke-width="1.1"/></marker>
<marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--ink)" stroke-width="1.1"/></marker>
</defs>
<rect width="720" height="560" class="paper"/>
<text x="42" y="53" text-anchor="start">Pass 1</text><rect x="42" y="85" width="288" height="215" class="boundary"/><rect x="192" y="119" width="92" height="42" class="existing"/><circle cx="142" cy="202" r="17" class="intervention"/><g transform="translate(90 245) rotate(-90)"><path d="M-23-13H8V13H-23ZM8-8L24-13V13L8 8Z" class="ghost" /></g><path d="M120 245H224" class="accent" marker-end="url(#arrow)"/><g transform="translate(260 245) rotate(-90)"><path d="M-23-13H8V13H-23ZM8-8L24-13V13L8 8Z" class="figure" /></g><text x="42" y="342" text-anchor="start">Actor, role A</text><text x="390" y="53" text-anchor="start">Pass 2</text><rect x="390" y="85" width="288" height="215" class="boundary"/><rect x="540" y="119" width="92" height="42" class="existing"/><circle cx="575" cy="202" r="17" class="intervention"/><g transform="translate(438 245) rotate(-90)"><path d="M-23-13H8V13H-23ZM8-8L24-13V13L8 8Z" class="ghost" /></g><path d="M468 245H572" class="accent" marker-end="url(#arrow)"/><g transform="translate(608 245) rotate(-90)"><path d="M-23-13H8V13H-23ZM8-8L24-13V13L8 8Z" class="figure" /></g><text x="390" y="342" text-anchor="start">Same actor, role B</text><text x="42" y="391" text-anchor="start">One camera; repeat the path and timing.</text><rect x="42" y="420" width="188" height="91" class="boundary"/><rect x="142" y="438" width="58" height="23" class="existing"/><circle cx="100" cy="481" r="13" class="intervention"/><text x="136" y="548" text-anchor="middle">Role A</text><rect x="266" y="420" width="188" height="91" class="boundary"/><rect x="366" y="438" width="58" height="23" class="existing"/><circle cx="381" cy="481" r="13" class="intervention"/><text x="360" y="548" text-anchor="middle">Role B</text><rect x="490" y="420" width="188" height="91" class="boundary"/><rect x="590" y="438" width="58" height="23" class="existing"/><circle cx="548" cy="481" r="13" class="intervention"/><circle cx="605" cy="481" r="13" class="intervention"/><text x="584" y="548" text-anchor="middle">Combined</text>
</svg>
