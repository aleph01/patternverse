<svg xmlns="http://www.w3.org/2000/svg" width="360" height="510" viewBox="0 0 360 510" role="img" aria-labelledby="title desc" data-photography-style="light-editorial"><title id="title">Focus distance and the width of the acceptable sharp range are distinct choices</title><desc id="desc">Focus distance and the width of the acceptable sharp range are distinct choices. Native conceptual distance diagram with fading range edges. Not an optical calculation or a prescription for exact near/far limits. Light editorial presentation: fixed white paper, regular Helvetica labels, fine charcoal lines and restrained green accents.</desc><metadata>{&quot;file&quot;:&quot;photography/foundations-focus-range-mobile.svg&quot;,&quot;kind&quot;:&quot;native-svg-diagram&quot;,&quot;creator&quot;:&quot;Patternverse photography collection; embedded creators credited in sources&quot;,&quot;teaching_objective&quot;:&quot;Focus distance and the width of the acceptable sharp range are distinct choices&quot;,&quot;source_files&quot;:[],&quot;license&quot;:&quot;Original SVG layout; embedded sources retain their stated rights&quot;,&quot;license_url&quot;:null,&quot;attribution&quot;:&quot;Patternverse photography collection&quot;,&quot;modifications&quot;:&quot;Native conceptual distance diagram with fading range edges. Not an optical calculation or a prescription for exact near/far limits. Light editorial presentation: fixed white paper, regular Helvetica labels, fine charcoal lines and restrained green accents.&quot;,&quot;regenerate&quot;:&quot;node scripts/build-photography-examples.mjs&quot;,&quot;retrieved_or_created&quot;:&quot;2026-10-25&quot;,&quot;width&quot;:360,&quot;height&quot;:510,&quot;sources&quot;:[]}</metadata><style>
:root{color-scheme:only light;--paper:#fff;--ink:#252c28;--panel:#f1f2ef;--line:#a6aca3;--mint:#edf5f0;--accent:#00855b}
svg{background:#fff;color:var(--ink)}
text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}
.paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.1}
.line{fill:none;stroke:var(--ink);stroke-width:1.3}
.fine{fill:none;stroke:var(--line);stroke-width:1.1}
.route{fill:none;stroke:var(--accent);stroke-width:1.4}
.subject{fill:var(--mint);stroke:var(--accent);stroke-width:1.3}
.camera{fill:var(--ink);stroke:none}
.source{fill:var(--panel);stroke:var(--ink);stroke-width:1.1}
</style><rect width="360" height="510" fill="#fff"/><g fill="#252c28"><defs><linearGradient id="range"><stop stop-color="#00855b" stop-opacity="0"/><stop offset=".25" stop-color="#00855b" stop-opacity=".14"/><stop offset=".75" stop-color="#00855b" stop-opacity=".14"/><stop offset="1" stop-color="#00855b" stop-opacity="0"/></linearGradient></defs><text x="12" y="28" font-size="18">Focus places the range.</text><text x="12" y="56" font-size="18">Depth of field changes its width.</text><text x="12" y="98" font-size="18">Same focus, narrower range</text><rect x="162.96000000000004" y="110" width="77.28" height="52" fill="url(#range)"/><path d="M36 146 H340" stroke="#a6aca3" stroke-width="1.1"/><path d="M201.60000000000002 108 V168" stroke="#252c28" stroke-width="1.6"/><circle cx="129.6" cy="138" r="8" fill="white" stroke="#252c28" stroke-width="1.1"/><circle cx="201.60000000000002" cy="138" r="8" fill="white" stroke="#252c28" stroke-width="1.1"/><circle cx="280.8" cy="138" r="8" fill="white" stroke="#252c28" stroke-width="1.1"/><text x="12" y="190" font-size="15">Near</text><text x="294" y="190" font-size="15">Far</text><text x="12" y="223" font-size="18">Same focus, wider range</text><rect x="105.84000000000003" y="235" width="191.51999999999998" height="52" fill="url(#range)"/><path d="M36 271 H340" stroke="#a6aca3" stroke-width="1.1"/><path d="M201.60000000000002 233 V293" stroke="#252c28" stroke-width="1.6"/><circle cx="129.6" cy="263" r="8" fill="white" stroke="#252c28" stroke-width="1.1"/><circle cx="201.60000000000002" cy="263" r="8" fill="white" stroke="#252c28" stroke-width="1.1"/><circle cx="280.8" cy="263" r="8" fill="white" stroke="#252c28" stroke-width="1.1"/><text x="12" y="315" font-size="15">Near</text><text x="294" y="315" font-size="15">Far</text><text x="12" y="348" font-size="18">Move focus to a farther subject</text><rect x="242.16000000000003" y="360" width="77.28" height="52" fill="url(#range)"/><path d="M36 396 H340" stroke="#a6aca3" stroke-width