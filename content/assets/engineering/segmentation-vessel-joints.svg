<svg xmlns="http://www.w3.org/2000/svg" width="560" height="580" viewBox="0 0 560 580" role="img" aria-labelledby="title desc" data-engineering-style="light-editorial">
<title id="title">More divisions also mean more interfaces</title>
<desc id="desc">A continuous vessel shell and a four-section alternative show the same required process envelope. Three additional flange pairs are highlighted in the divided shell. A magnified schematic joint identifies the gasket and clamping bolts. Existing closures and nozzles are omitted from both comparisons; no pressure rating is calculated.</desc>
<style>:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b}svg{background:var(--paper);color:var(--ink)}path,rect,circle,ellipse,line{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:20.222222px;font-weight:400}.paper{fill:var(--paper);stroke:var(--ink);stroke-width:1.3}.existing{fill:var(--stone);stroke:var(--line);stroke-width:1.1}.line{fill:none;stroke:var(--ink);stroke-width:1.3}.heavy{fill:none;stroke:var(--ink);stroke-width:1.8}.fine,.leader{fill:none;stroke:var(--line);stroke-width:1.1}.ghost{fill:none;stroke:var(--line);stroke-width:1.1;stroke-dasharray:5 4}.highlight{fill:var(--mint);stroke:var(--green);stroke-width:1.3}.accent{fill:var(--green);stroke:var(--green);stroke-width:1.1}.action{fill:none;stroke:var(--green);stroke-width:1.5}.solid{fill:var(--ink);stroke:none}.gasket{fill:none;stroke:var(--green);stroke-width:2.6}.center{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:8 4 2 4}</style>
