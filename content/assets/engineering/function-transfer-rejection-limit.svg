<svg xmlns="http://www.w3.org/2000/svg" width="560" height="680" viewBox="0 0 560 680" role="img" aria-labelledby="title desc" data-engineering-style="light-editorial">
<title id="title">Good contact cannot cure inadequate heat rejection</title><desc id="desc">Calculated thermal network after transfer onto a poor 4 K/W chassis. Device heat of 12 W passes through a 2 K/W junction-and-interface path before joining 8 W at the chassis. The total 20 W crosses the chassis-to-ambient path to 35 degrees Celsius surroundings. Chassis and junction temperatures calculate to 115 and 139 degrees Celsius. With the same poor chassis before transfer, the independent 3 K/W sink kept the junction at 95 degrees Celsius. The declared 110 degree criterion is a teaching target, not a device rating. Rectangles denote lumped thermal resistances; arrows denote heat flow. No thermal capacitance or transient physics is modeled.</desc>
<style>:root{color-scheme:only light;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b}svg{background:#fff;color:var(--ink)}path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:20.222222px;font-weight:400}.paper{fill:#fff;stroke:var(--ink);stroke-width:1.3}.existing{fill:var(--stone);stroke:var(--line);stroke-width:1.1}.line{fill:none;stroke:var(--ink);stroke-width:1.3}.fine,.leader{fill:none;stroke:var(--line);stroke-width:1.1}.ghost{fill:none;stroke:var(--line);stroke-width:1.1;stroke-dasharray:5 4}.highlight{fill:var(--mint);stroke:var(--green);stroke-width:1.3}.accent{fill:none;stroke:var(--green);stroke-width:1.6}.action{fill:none;stroke:var(--green);stroke-width:1.5}.slow{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:7 4}.hatch{fill:url(#hatch);stroke:var(--ink);stroke-width:1.1}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#00855b" stroke-width="1.3"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 7L7 0M5 9L9 5" stroke="#a6aca3" stroke-width=".7"/></pattern></defs>
<rect width="560" height="680" fill="#fff"/>
<text x="40" y="42" text-anchor="start">The receiver still has to reject heat</text><g transform="translate(0 0)" data-device-w="12" data-other-w="8" data-chassis-k-per-w="4"><path d="M280 100V143" class="action" marker-end="url(#arrow)"/><circle cx="280" cy="150" r="4" class="paper"/><path d="M280 154V190M280 245V336" class="line"/><rect x="265" y="190" width="30" height="55" class="existing"/><circle cx="280" cy="340" r="4" class="paper"/><path d="M470 340H287" class="action" marker-end="url(#arrow)"/><path d="M280 344V400M280 455V516" class="line"/><rect x="265" y="400" width="30" height="55" class="highlight"/><path d="M230 382V480" class="action" marker-end="url(#arrow)"/><circle cx="280" cy="520" r="4" class="paper"/></g><text x="40" y="158" text-anchor="start">Junction 139°C</text><text x="320" y="122" text-anchor="start">Device 12 W</text><text x="325" y="214" text-anchor="start">Device + mount</text><text x="325" y="242" text-anchor="start">2 K/W</text><text x="40" y="348" text-anchor="start">Chassis 115°C</text><text x="412" y="296" text-anchor="start">Other heat</text><text x="412" y="326" text-anchor="start">8 W</text><text x="325" y="421" text-anchor="start">Chassis to air</text><text x="325" y="449" text-anchor="start">4 K/W</text><text x="110" y="435" text-anchor="start">20 W</text><text x="40" y="528" text-anchor="start">Ambient 35°C</text><text x="40" y="595" text-anchor="start">Before removal: junction 95°C</text><text x="40" y="636" text-anchor="start">After: 139°C exceeds 110°C target</text>
</svg>
