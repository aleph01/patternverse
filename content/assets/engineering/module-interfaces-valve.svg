<svg xmlns="http://www.w3.org/2000/svg" width="560" height="660" viewBox="0 0 560 660" role="img" aria-labelledby="title desc" data-engineering-style="light-editorial">
<title id="title">Preserve the complete valve-station boundary</title><desc id="desc">An exploded station retains its pipe ends and shows gasket positions, matching mating faces, a common flow axis, and a reserved envelope for the valve and actuator. A separate face view identifies an illustrative four-hole project pattern. The nominal valve length is 200 mm, and two nominal 2 mm compressed gaskets require a 204 mm installed gap. This is not a standard flange drawing or pressure-equipment specification.</desc>
<style>:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b}svg{background:var(--paper);color:var(--ink)}path,rect,ellipse,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:20.222222px;font-weight:400}.paper{fill:#fff;stroke:var(--ink);stroke-width:1.3}.existing{fill:var(--stone);stroke:var(--line);stroke-width:1.1}.line{fill:none;stroke:var(--ink);stroke-width:1.3}.fine,.leader{fill:none;stroke:var(--line);stroke-width:1.1}.center{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:8 4 2 4}.envelope{fill:var(--mint);fill-opacity:.45;stroke:var(--green);stroke-width:1.1;stroke-dasharray:5 4}.highlight{fill:var(--mint);stroke:var(--green);stroke-width:1.3}.accent{fill:none;stroke:var(--green);stroke-width:1.6}.point{fill:#fff;stroke:var(--green);stroke-width:1.5}.reference{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-dasharray:5 3}.solid{fill:var(--ink);stroke:none}</style>
<rect width="560" height="660" fill="#ffffff"/>
<text x="40" y="35" text-anchor="start">Retained pipe</text><path d="M129 42V172L106 205" class="leader"/><rect x="205" y="112" width="150" height="228" rx="0" class="envelope"/><text x="280" y="91" text-anchor="middle">Reserved envelope</text><rect x="32" y="239" width="70" height="32" rx="0" class="existing"/><rect x="458" y="239" width="70" height="32" rx="0" class="existing"/><ellipse cx="100" cy="255" rx="12" ry="48" class="paper"/><ellipse cx="460" cy="255" rx="12" ry="48" class="paper"/><ellipse cx="155" cy="255" rx="4" ry="42" class="highlight"/><ellipse cx="405" cy="255" rx="4" ry="42" class="highlight"/><path d="M210 234H240L251 217H309L320 234H350V276H320L309 293H251L240 276H210Z" class="existing"/><rect x="275" y="174" width="10" height="43" rx="0" class="paper"/><rect x="249" y="149" width="62" height="25" rx="0" class="paper"/><path d="M240 149H339" class="line"/><ellipse cx="210" cy="255" rx="12" ry="48" class="paper"/><ellipse cx="350" cy="255" rx="12" ry="48" class="paper"/><ellipse cx="100" cy="222" rx="3" ry="5" class="paper"/><ellipse cx="100" cy="288" rx="3" ry="5" class="paper"/><ellipse cx="210" cy="222" rx="3" ry="5" class="paper"/><ellipse cx="210" cy="288" rx="3" ry="5" class="paper"/><ellipse cx="350" cy="222" rx="3" ry="5" class="paper"/><ellipse cx="350" cy="288" rx="3" ry="5" class="paper"/><ellipse cx="460" cy="222" rx="3" ry="5" class="paper"/><ellipse cx="460" cy="288" rx="3" ry="5" class="paper"/><path d="M24 255H536" class="center"/><text x="421" y="347" text-anchor="start">Axis</text><path d="M462 338H494V265" class="leader"/><text x="395" y="173" text-anchor="start">Gasket</text><path d="M416 182V198L406 212" class="leader"/><path d="M210 311V380M350 311V380M210 374H350M210 367V381M350 367V381" class="fine"/><text x="280" y="405" text-anchor="middle">200 mm face-to-face</text><circle cx="120" cy="505" r="48" class="existing"/><circle cx="120" cy="505" r="25" class="paper"/><circle cx="120" cy="470" r="5" class="paper"/><circle cx="155" cy="505" r="5" class="paper"/><circle cx="120" cy="540" r="5" class="paper"/><circle cx="85" cy="505" r="5" class="paper"/><text x="120" y="584" text-anchor="middle">Pattern F1</text><text x="240" y="478" text-anchor="start">Installed gap</text><text x="240" y="514" text-anchor="start">200 + 2 + 2 = 204 mm</text><text x="240" y="556" text-anchor="start">2 mm per gasket</text><text x="40" y="632" text-anchor="start">Project fixture; exploded gaps not to scale</text>
