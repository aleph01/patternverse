<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1010" viewBox="0 0 560 1010" role="img" aria-labelledby="title desc" data-engineering-style="light-editorial">
<title id="title">Integration changes which unit must be renewed</title><desc id="desc">Two original schematic enclosure sections compare renewal scope for a locally worn retaining lip. In the upper case the whole enclosure is the renewed element because the assumed service policy offers no local repair. The previous lip outline is dashed and wear is exaggerated. Below, the sound enclosure remains while a separate retaining insert is withdrawn after release; empty fastener passages and dashed mounting axes indicate its retained seat. The insert is shown displaced vertically. Green identifies the renewed unit. No wear rate, cycle life, or service-time result is calculated.</desc>
<style>:root{color-scheme:only light;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b}svg{background:#fff;color:var(--ink)}path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:21.777778px;font-weight:400}.paper{fill:#fff;stroke:var(--ink);stroke-width:1.3}.existing{fill:var(--stone);stroke:var(--line);stroke-width:1.1}.line{fill:none;stroke:var(--ink);stroke-width:1.3}.fine,.leader{fill:none;stroke:var(--line);stroke-width:1.1}.ghost{fill:none;stroke:var(--line);stroke-width:1.1;stroke-dasharray:5 4}.highlight{fill:var(--mint);stroke:var(--green);stroke-width:1.3}.accent{fill:none;stroke:var(--green);stroke-width:1.6}.action{fill:none;stroke:var(--green);stroke-width:1.5}.slow{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:7 4}.hatch{fill:url(#hatch);stroke:var(--ink);stroke-width:1.1}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#00855b" stroke-width="1.3"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 7L7 0M5 9L9 5" stroke="#a6aca3" stroke-width=".7"/></pattern></defs>
<rect width="560" height="1010" fill="#fff"/>
<text x="40" y="42" text-anchor="start">Renew whole enclosure</text><path d="M50 140H68V300H210V210Q210 180 224 181L230 188L224 193L229 199L225 210V300H255V290H305V300H335V210Q335 195 325 195H315V190L325 180Q350 180 350 210V300H492V140H510V320H50Z" class="highlight"/><path d="M224 181H235L245 190V195H235L229 199" class="ghost"/><text x="357" y="105" text-anchor="start">Worn lip</text><path d="M392 118L235 185" class="leader"/><text x="280" y="371" text-anchor="middle">No local repair in this service scenario</text><text x="40" y="499" text-anchor="start">Renew retaining insert</text><g transform="translate(0 560)"><path d="M50 140H68V300H185V315H375V300H492V140H510V320H50Z" class="existing"/><rect x="192" y="315" width="6" height="5" class="paper"/><rect x="362" y="315" width="6" height="5" class="paper"/></g><g transform="translate(0 360)"><path d="M185 315V300H210V210Q210 180 235 180L245 190V195H235Q225 195 225 210V300H255V290H305V300H335V210Q335 195 325 195H315V190L325 180Q350 180 350 210V300H375V315Z" class="highlight"/><rect x="192" y="300" width="6" height="15" class="paper"/><rect x="362" y="300" width="6" height="15" class="paper"/></g><path d="M195 675V875M365 675V875" class="ghost"/><path d="M280 820V695" class="action" marker-end="url(#arrow)"/><text x="40" y="935" text-anchor="start">Green: renewed element</text><text x="40" y="971" text-anchor="start">Arrow: withdrawal after release</text>
</svg>
