(#arrow)"/><circle cx="233" cy="220" r="30" class="highlight"/><circle cx="220" cy="220" r="4" class="paper"/><circle cx="267" cy="220" r="4" class="paper"/><path d="M271 220H350" class="line"/><path d="M302 271H338" class="action" marker-start="url(#arrow)" marker-end="url(#arrow)"/></g><g transform="translate(0 380)"><rect x="330" y="190" width="90" height="60" class="existing"/><rect x="340" y="198" width="72" height="44" class="paper"/><rect x="350" y="200" width="8" height="40" class="hatch"/><path d="M330 220H350" class="line"/><path d="M358 220H365L369 211L377 229L385 211L393 229L401 211L405 220H412" class="line"/><path d="M370 115V155H410V115M370 127H410M390 155V190M420 205H505" class="line"/><circle cx="390" cy="175" r="3" class="paper"/><path d="M385 169L390 173L395 169" class="fine"/><circle cx="450" cy="205" r="3" class="paper"/><path d="M444 200L448 205L444 210" class="fine"/></g><text x="367" y="482" text-anchor="start">Reservoir</text><text x="434" y="548" text-anchor="start">Oil circuit</text><text x="347" y="692" text-anchor="start">Pump retained</text><text x="40" y="482" text-anchor="start">Machine shaft</text><path d="M107 493V550" class="leader"/><text x="40" y="734" text-anchor="start">Eccentric + follower</text><path d="M211 720L234 633" class="leader"/><text x="40" y="787" text-anchor="start">Arrows: rotary or reciprocating drive motion</text><text x="40" y="827" text-anchor="start">No machine motion → no pumping strokes</text>
