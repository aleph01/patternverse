<svg xmlns="http://www.w3.org/2000/svg" width="560" height="865" viewBox="0 0 560 865" role="img" aria-labelledby="title desc" data-engineering-style="light-editorial">
<title id="title">Machine motion replaces the auxiliary actuator</title><desc id="desc">Matched original mechanism schematics retain the main machine shaft, plunger pump with spring return, reservoir, and lubrication circuit. Above, a separate linear actuator strokes the pump while the existing shaft remains disconnected from it. Below, an eccentric on the existing shaft contacts a roller follower linked to the same plunger, replacing the dedicated actuator. Arrows show rotary and reciprocating drive motion; lines at the reservoir and outlet are fluid connections without flow arrows. The mechanism is shown at one schematic phase, not as a kinematic or pressure simulation. Stroke volume, drive load, and pump capacity are not inferred from the drawing.</desc>
<style>:root{color-scheme:only light;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b}svg{background:#fff;color:var(--ink)}path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:20.222222px;font-weight:400}.paper{fill:#fff;stroke:var(--ink);stroke-width:1.3}.existing{fill:var(--stone);stroke:var(--line);stroke-width:1.1}.line{fill:none;stroke:var(--ink);stroke-width:1.3}.fine,.leader{fill:none;stroke:var(--line);stroke-width:1.1}.ghost{fill:none;stroke:var(--line);stroke-width:1.1;stroke-dasharray:5 4}.highlight{fill:var(--mint);stroke:var(--green);stroke-width:1.3}.accent{fill:none;stroke:var(--green);stroke-width:1.6}.action{fill:none;stroke:var(--green);stroke-width:1.5}.slow{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:7 4}.hatch{fill:url(#hatch);stroke:var(--ink);stroke-width:1.1}</style>
