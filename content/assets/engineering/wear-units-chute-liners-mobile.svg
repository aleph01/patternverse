<svg xmlns="http://www.w3.org/2000/svg" width="560" height="705" viewBox="0 0 560 705" role="img" aria-labelledby="title desc" data-engineering-style="light-editorial">
<title id="title">Place the wear boundary in a renewable chute liner</title><desc id="desc">An original axonometric chute fragment shows six liner positions and a retained shell. One green panel is lifted clear of its seat and fastening points. The arrow means removal. A separate schematic section shows the liner, supporting shell, and an accessible retaining nut. Panel sizing, fastening detail, and capacity are not specified.</desc>
<style>:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b}svg{background:#fff;color:var(--ink)}path,rect,ellipse,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:21.777778px;font-weight:400}.paper{fill:#fff;stroke:var(--ink);stroke-width:1.3}.existing{fill:var(--stone);stroke:var(--line);stroke-width:1.1}.line{fill:none;stroke:var(--ink);stroke-width:1.3}.heavy{fill:none;stroke:var(--ink);stroke-width:1.8}.fine,.leader{fill:none;stroke:var(--line);stroke-width:1.1}.ghost{fill:none;stroke:var(--line);stroke-width:1.1;stroke-dasharray:5 4}.center{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:8 4 2 4}.highlight{fill:var(--mint);stroke:var(--green);stroke-width:1.3}.accent{fill:none;stroke:var(--green);stroke-width:1.6}.action{fill:none;stroke:var(--green);stroke-width:1.5}.hatch{fill:url(#hatch);stroke:var(--ink);stroke-width:1.1}</style>
