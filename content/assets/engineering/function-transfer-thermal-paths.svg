<svg xmlns="http://www.w3.org/2000/svg" width="560" height="865" viewBox="0 0 560 865" role="img" aria-labelledby="title desc" data-engineering-style="light-editorial">
<title id="title">An existing chassis takes over the dedicated heat sink’s job</title><desc id="desc">Two original open-chassis sections retain 12 W device dissipation, 8 W other chassis heating, and 35 degrees Celsius ambient. Before transfer, the separate finned sink carries device heat through its own modeled ambient path; the chassis carries 8 W. Afterward, the device is mounted thermally to the existing chassis and the sink is removed. The chassis now carries 20 W. With declared 2 K/W local device-and-interface resistance, 3 K/W separate sink resistance, and 2 K/W effective chassis resistance, junction temperatures are 95 and 99 degrees Celsius and chassis temperatures 51 and 75. These are lumped model outputs, not simulated temperature fields or measured product values.</desc>
<style>:root{color-scheme:only light;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b}svg{background:#fff;color:var(--ink)}path,rect,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:20.222222px;font-weight:400}.paper{fill:#fff;stroke:var(--ink);stroke-width:1.3}.existing{fill:var(--stone);stroke:var(--line);stroke-width:1.1}.line{fill:none;stroke:var(--ink);stroke-width:1.3}.fine,.leader{fill:none;stroke:var(--line);stroke-width:1.1}.ghost{fill:none;stroke:var(--line);stroke-width:1.1;stroke-dasharray:5 4}.highlight{fill:var(--mint);stroke:var(--green);stroke-width:1.3}.accent{fill:none;stroke:var(--green);stroke-width:1.6}.action{fill:none;stroke:var(--green);stroke-width:1.5}.slow{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:7 4}.hatch{fill:url(#hatch);stroke:var(--ink);stroke-width:1.1}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#00855b" stroke-width="1.3"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 7L7 0M5 9L9 5" stroke="#a6aca3" stroke-width=".7"/></pattern></defs>
<rect width="560" height="865" fill="#fff"/>
<text x="40" y="42" text-anchor="start">Before: dedicated sink</text><text x="368" y="42" text-anchor="start">Ambient 35°C</text><g transform="translate(0 0)"><path d="M50 100H68V280H490V100H508V298H50Z" class="existing"/><rect x="110" y="230" width="48" height="35" class="paper"/><rect x="124" y="265" width="20" height="15" class="highlight"/><path d="M134 265V330" class="action" marker-end="url(#arrow)"/><rect x="275" y="180" width="40" height="40" class="paper"/><rect x="315" y="180" width="5" height="40" class="highlight"/><rect x="320" y="145" width="12" height="110" class="existing"/><rect x="332" y="145" width="65" height="7" class="existing"/><rect x="332" y="165" width="65" height="7" class="existing"/><rect x="332" y="185" width="65" height="7" class="existing"/><rect x="332" y="205" width="65" height="7" class="existing"/><rect x="332" y="225" width="65" height="7" class="existing"/><rect x="332" y="245" width="65" height="7" class="existing"/><path d="M284 220V240H264M306 220V245H295" class="line"/><path d="M289 200H319" class="action" marker-end="url(#arrow)"/><path d="M348 200H446" class="action" marker-end="url(#arrow)"/></g><text x="134" y="253" text-anchor="middle">8 W</text><text x="271" y="264" text-anchor="start">12 W</text><text x="340" y="115" text-anchor="start">Sink</text><path d="M358 122V141" class="leader"/><text x="323" y="340" text-anchor="start">Chassis: 2 K/W</text><text x="40" y="376" text-anchor="start">Junction 95°C</text><text x="323" y="376" text-anchor="start">Chassis 51°C</text><text x="40" y="447" text-anchor="start">After: chassis receives heat</text><g transform="translate(0 400)"><path d="M50 100H68V280H490V100H508V298H50Z" class="highlight"/><rect x="110" y="230" width="48" height="35" class="paper"/><rect x="124" y="265" width="20" height="15" class="highlight"/><path d="M134 265V330" class="action" marker-end="url(#arrow)"/><rect x="445" y="180" width="40" height="40" class="paper"/><rect x="485" y="180" width="5" height="40" class="highlight"/><path d="M454 220V240H434M476 220V245H465" class="line"/><path d="M461 200H538" class="action" marker-end="url(#arrow)"/></g><text x="134" y="653" text-anchor="middle">8 W</text><text x="440" y="664" text-anchor="start">12 W</text><text x="323" y="740" text-anchor="start">Chassis: 2 K/W</text><text x="40" y="776" text-anchor="start">Junction 99°C</text><text x="323" y="776" text-anchor="start">Chassis 75°C</text><text x="40" y="832" text-anchor="start">Arrows: heat flow · schematic sections</text>
