<svg xmlns="http://www.w3.org/2000/svg" width="560" height="575" viewBox="0 0 560 575" role="img" aria-labelledby="title desc" data-engineering-style="light-editorial">
<title id="title">Divide the conveyor around a complete service task</title>
<desc id="desc">A straight nine-metre illustrative route has three nominal three-metre service sections. The middle section is moved into a side aisle with its own belt and drive. The outer sections remain supported. Two transfer boundaries require coordination. The only arrow shows removal direction.</desc>
<style>:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b}svg{background:var(--paper);color:var(--ink)}path,rect,circle,ellipse,line{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:20.222222px;font-weight:400}.paper{fill:var(--paper);stroke:var(--ink);stroke-width:1.3}.existing{fill:var(--stone);stroke:var(--line);stroke-width:1.1}.line{fill:none;stroke:var(--ink);stroke-width:1.3}.heavy{fill:none;stroke:var(--ink);stroke-width:1.8}.fine,.leader{fill:none;stroke:var(--line);stroke-width:1.1}.ghost{fill:none;stroke:var(--line);stroke-width:1.1;stroke-dasharray:5 4}.highlight{fill:var(--mint);stroke:var(--green);stroke-width:1.3}.accent{fill:var(--green);stroke:var(--green);stroke-width:1.1}.action{fill:none;stroke:var(--green);stroke-width:1.5}.solid{fill:var(--ink);stroke:none}.gasket{fill:none;stroke:var(--green);stroke-width:2.6}.center{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:8 4 2 4}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#00855b" stroke-width="1.3"/></marker></defs>
<rect width="560" height="575" fill="#ffffff"/>
<text x="40" y="40" text-anchor="start" class="">Three service sections</text><path d="M40 78H520M40 72V84M520 72V84" class="fine"/><text x="280" y="67" text-anchor="middle" class="">Nominal 9 m route</text><g transform="translate(40 150)"><rect x="0" y="0" width="140" height="64" rx="8" class="existing"/><rect x="10" y="10" width="120" height="42" rx="17" class="paper"/><ellipse cx="25" cy="31" rx="10" ry="20" class="existing"/><ellipse cx="115" cy="31" rx="10" ry="20" class="existing"/><path d="M25 11H115M25 51H115" class="fine"/><rect x="7" y="-8" width="13" height="8" rx="0" class="paper"/><rect x="7" y="64" width="13" height="8" rx="0" class="paper"/><rect x="120" y="-8" width="13" height="8" rx="0" class="paper"/><rect x="120" y="64" width="13" height="8" rx="0" class="paper"/><rect x="105" y="68" width="24" height="20" rx="3" class="existing"/><rect x="129" y="73" width="9" height="10" rx="0" class="paper"/></g><g transform="translate(380 150)"><rect x="0" y="0" width="140" height="64" rx="8" class="existing"/><rect x="10" y="10" width="120" height="42" rx="17" class="paper"/><ellipse cx="25" cy="31" rx="10" ry="20" class="existing"/><ellipse cx="115" cy="31" rx="10" ry="20" class="existing"/><path d="M25 11H115M25 51H115" class="fine"/><rect x="7" y="-8" width="13" height="8" rx="0" class="paper"/><rect x="7" y="64" width="13" height="8" rx="0" class="paper"/><rect x="120" y="-8" width="13" height="8" rx="0" class="paper"/><rect x="120" y="64" width="13" height="8" rx="0" class="paper"/><rect x="105" y="68" width="24" height="20" rx="3" class="existing"/><rect x="129" y="73" width="9" height="10" rx="0" class="paper"/></g><rect x="210" y="150" width="140" height="64" rx="8" class="ghost"/><path d="M195 149V110H365V149" class="leader"/><text x="280" y="102" text-anchor="middle" class="">Two product transfers</text><text x="110" y="268" text-anchor="middle" class="">Section 1</text><text x="450" y="268" text-anchor="middle" class="">Section 3</text><path d="M280 233V350" class="action" marker-end="url(#arrow)"/><text x="310" y="316" text-anchor="start" class="">Removal</text><g transform="translate(210 380)"><rect x="0" y="0" width="140" height="64" rx="8" class="highlight"/><rect x="10" y="10" width="120" height="42" rx="17" class="paper"/><ellipse cx="25" cy="31" rx="10" ry="20" class="highlight"/><ellipse cx="115" cy="31" rx="10" ry="20" class="highlight"/><path d="M25 11H115M25 51H115" class="fine"/><rect x="7" y="-8" width="13" height="8" rx="0" class="paper"/><rect x="7" y="64" width="13" height="8" rx="0" class="paper"/><rect x="120" y="-8" width="13" height="8" rx="0" class="paper"/><rect x="120" y="64" width="13" height="8" rx="0" class="paper"/><rect x="105" y="68" width="24" height="20" rx="3" class="highlight"/><rect x="129" y="73" width="9" height="10" rx="0" class="paper"/></g><text x="280" y="495" text-anchor="middle" class="">Section 2: own belt and drive</text><text x="40" y="545" text-anchor="start" class="">Outer sections retain their supports</text>
</svg>
