<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" role="img" aria-labelledby="title desc" data-engineering-style="light-editorial">
<title id="title">A renewable insert needs a complete extraction route</title><desc id="desc">Two matched schematic plans retain a rigid 180 mm-wide insert and guides that require straight withdrawal. A 120 mm opening blocks its shoulders, marked by crosses. With a 220 mm opening the same insert is shown displaced along the withdrawal path, leaving 40 mm total nominal width clearance. No structural capacity or handling allowance is calculated.</desc>
<style>:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b}svg{background:#fff;color:var(--ink)}path,rect,ellipse,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:21.777778px;font-weight:400}.paper{fill:#fff;stroke:var(--ink);stroke-width:1.3}.existing{fill:var(--stone);stroke:var(--line);stroke-width:1.1}.line{fill:none;stroke:var(--ink);stroke-width:1.3}.heavy{fill:none;stroke:var(--ink);stroke-width:1.8}.fine,.leader{fill:none;stroke:var(--line);stroke-width:1.1}.ghost{fill:none;stroke:var(--line);stroke-width:1.1;stroke-dasharray:5 4}.center{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:8 4 2 4}.highlight{fill:var(--mint);stroke:var(--green);stroke-width:1.3}.accent{fill:none;stroke:var(--green);stroke-width:1.6}.action{fill:none;stroke:var(--green);stroke-width:1.5}.hatch{fill:url(#hatch);stroke:var(--ink);stroke-width:1.1}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#00855b" stroke-width="1.3"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 7L7 0M5 9L9 5" stroke="#a6aca3" stroke-width=".7"/></pattern></defs>
<rect width="560" height="640" fill="#fff"/>
<text x="280" y="38" text-anchor="middle">Same rigid 180 mm insert</text><text x="150" y="99" text-anchor="middle">Trapped</text><text x="410" y="99" text-anchor="middle">Clear route</text><path d="M40 328V163H260V328" class="line"/><path d="M40 328H114M186 328H260" class="heavy"/><path d="M96 188V338M204 188V338" class="fine"/><rect x="96" y="258" width="108" height="70" rx="0" class="highlight"/><path d="M150 178V250" class="action" marker-end="url(#arrow)"/><path d="M99 323l10 10M99 333l10 -10" class="heavy"/><path d="M191 323l10 10M191 333l10 -10" class="heavy"/><path d="M300 328V163H520V328" class="line"/><path d="M300 328H344M476 328H520" class="heavy"/><path d="M356 188V338M464 188V338" class="fine"/><rect x="356" y="213" width="108" height="70" rx="0" class="ghost"/><path d="M410 290V353" class="action" marker-end="url(#arrow)"/><rect x="356" y="366" width="108" height="70" rx="0" class="highlight"/><text x="150" y="476" text-anchor="middle">Opening</text><text x="410" y="476" text-anchor="middle">Opening</text><text x="150" y="508" text-anchor="middle">120 mm</text><text x="410" y="508" text-anchor="middle">220 mm</text><text x="280" y="566" text-anchor="middle">Guides prevent rotation</text><text x="280" y="601" text-anchor="middle">40 mm total clearance at right</text>
</svg>
