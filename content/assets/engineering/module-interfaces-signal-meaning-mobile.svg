<svg xmlns="http://www.w3.org/2000/svg" width="560" height="660" viewBox="0 0 560 660" role="img" aria-labelledby="title desc" data-engineering-style="light-editorial">
<title id="title">A valid current can carry the wrong pressure meaning</title><desc id="desc">Two linear teaching mappings share a current axis from 4 to 20 mA and a pressure axis from 0 to 1000 kPa gauge. At 12 mA, Head C represents 500 kPa but the unchanged receiver reports 50 kPa. The solid green and dashed ink lines distinguish the two mappings without relying on color. No measurement noise, device accuracy, or fault-detection performance is modeled.</desc>
<style>:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b}svg{background:var(--paper);color:var(--ink)}path,rect,ellipse,circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:21.777778px;font-weight:400}.paper{fill:#fff;stroke:var(--ink);stroke-width:1.3}.existing{fill:var(--stone);stroke:var(--line);stroke-width:1.1}.line{fill:none;stroke:var(--ink);stroke-width:1.3}.fine,.leader{fill:none;stroke:var(--line);stroke-width:1.1}.center{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:8 4 2 4}.envelope{fill:var(--mint);fill-opacity:.45;stroke:var(--green);stroke-width:1.1;stroke-dasharray:5 4}.highlight{fill:var(--mint);stroke:var(--green);stroke-width:1.3}.accent{fill:none;stroke:var(--green);stroke-width:1.6}.point{fill:#fff;stroke:var(--green);stroke-width:1.5}.reference{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-dasharray:5 3}.solid{fill:var(--ink);stroke:none}</style>
<rect width="560" height="660" fill="#ffffff"/>
<text x="40" y="35" text-anchor="start">Same current, different meaning</text><path d="M40 74h20" class="accent"/><text x="70" y="81" text-anchor="start">Head C: 0–1000 kPa</text><path d="M40 109h20" class="reference"/><text x="70" y="116" text-anchor="start">Receiver: 0–100 kPa</text><text x="40" y="150" text-anchor="start">kPa gauge</text><path d="M88 180V505H480" class="line"/><path d="M83 505H480" class="fine"/><text x="75" y="511" text-anchor="end">0</text><path d="M83 342.5H480" class="fine"/><text x="75" y="348.5" text-anchor="end">500</text><path d="M83 180H480" class="fine"/><text x="75" y="186" text-anchor="end">1000</text><path d="M88 505v6" class="line"/><text x="88" y="537" text-anchor="middle">4</text><path d="M284 505v6" class="line"/><text x="284" y="537" text-anchor="middle">12</text><path d="M480 505v6" class="line"/><text x="480" y="537" text-anchor="middle">20</text><path d="M88 505L480 180" class="accent"/><path d="M88 505L480 472.5" class="reference"/><path d="M284 180V505" class="center"/><circle cx="284" cy="342.5" r="5" class="point"/><circle cx="284" cy="488.75" r="5" class="paper"/><path d="M289 342.5L309 370.5" class="leader"/><text x="315" y="378.5" text-anchor="start">500 kPa</text><path d="M289 488.75L309 468.75" class="leader"/><text x="315" y="463.75" text-anchor="start">50 kPa</text><text x="284" y="577" text-anchor="middle">Current (mA)</text><text x="40" y="624" text-anchor="start">12 mA lies within both current ranges</text>
</svg>
