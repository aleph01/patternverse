<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1720" viewBox="0 0 660 1720" role="img" aria-labelledby="title desc"><title id="title">Stacked before-and-after comparison: report metrics</title><desc id="desc">Before above, after below. Identical content, colors, and positions within each design; only the demonstrated sizes change.</desc><defs><g id="artwork"><metadata>Original Patternverse teaching illustration. Fictional content and data; no measured attention or performance results are claimed. Authored as editable SVG for the Graphic Design verse.</metadata><rect width="1320" height="850" fill="#f7f4ec"/><text x="30" y="45" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17352f" text-anchor="start">BEFORE · Three competing headlines</text><rect x="30" y="74" width="610" height="680" fill="none" stroke="#c7cec4" stroke-width="2"/><text x="64" y="120" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#17352f" text-anchor="start">DELIVERY REVIEW / Q2</text><text x="64" y="267" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="500" fill="#17352f" text-anchor="start">78%</text><text x="64" y="314" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#17352f" text-anchor="start">Projects delivered on time</text><text x="64" y="452" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="500" fill="#17352f" text-anchor="start">12</text><text x="64" y="499" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#17352f" text-anchor="start">Projects delivered late</text><text x="64" y="637" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="500" fill="#17352f" text-anchor="start">9 days</text><text x="64" y="684" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#17352f" text-anchor="start">Median delay for late projects</text><text x="680" y="45" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17352f" text-anchor="start">AFTER · Lead finding, then context</text><rect x="680" y="74" width="610" height="680" fill="none" stroke="#c7cec4" stroke-width="2"/><text x="714" y="120" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#17352f" text-anchor="start">DELIVERY REVIEW / Q2</text><text x="714" y="267" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="500" fill="#17352f" text-anchor="start">78%</text><text x="714" y="314" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#17352f" text-anchor="start">Projects delivered on time</text><text x="714" y="452" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="500" fill="#17352f" text-anchor="start">12</text><text x="714" y="499" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#17352f" text-anchor="start">Projects delivered late</text><text x="714" y="637" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="500" fill="#17352f" text-anchor="start">9 days</text><text x="714" y="684" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#17352f" text-anchor="start">Median delay for late projects</text><text x="30" y="801" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#52665d" text-anchor="start">All metric values: 64</text><text x="680" y="801" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#52665d" text-anchor="start">Lead metric: 104 · Supporting metrics: 48</text><text x="30" y="837" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#52665d" text-anchor="start">Illustrative data · Type sizes are demonstration units, not prescribed production sizes.</text></g></defs><svg width="660" height="850" viewBox="0 0 660 850"><use href="#artwork"/></svg><svg y="870" width="660" height="850" viewBox="650 0 660 850"><use href="#artwork"/></svg></svg>