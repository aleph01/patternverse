<svg xmlns="http://www.w3.org/2000/svg" width="660" height="660" viewBox="0 0 660 660" role="img" aria-labelledby="title description"><title id="title">A span is not automatically a grid break</title><desc id="description">One declared two-column grid has tracks 228 units wide at x65 and x317, separated by 24 units. A module on a track and an allowed two-column span follow the system. A 228-unit module at x191 departs from the stated track-start rule. This last placement could become an allowed variant in a different grid.</desc><rect width="660" height="660" fill="#f7f5ee"/><text x="40" y="45" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#17352f">A span is not automatically a grid break</text><text x="40" y="77" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#17352f">An exception depends on the layout’s stated rules.</text><text x="65" y="120" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#17352f">1 / One-column module: follows the grid</text><rect x="65" y="140" width="228" height="90" fill="#e0e5de"/><rect x="317" y="140" width="228" height="90" fill="#e0e5de"/><path d="M65 140v90" stroke="#17352f" stroke-opacity="0.4" stroke-dasharray="4 4"/><path d="M293 140v90" stroke="#17352f" stroke-opacity="0.4" stroke-dasharray="4 4"/><path d="M317 140v90" stroke="#17352f" stroke-opacity="0.4" stroke-dasharray="4 4"/><path d="M545 140v90" stroke="#17352f" stroke-opacity="0.4" stroke-dasharray="4 4"/><rect x="65" y="156" width="228" height="58" fill="#17352f"/><text x="81" y="192" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fffdf6">One track</text><text x="65" y="300" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#17352f">2 / Allowed two-column span: still the grid</text><rect x="65" y="320" width="228" height="90" fill="#e0e5de"/><rect x="317" y="320" width="228" height="90" fill="#e0e5de"/><path d="M65 320v90" stroke="#17352f" stroke-opacity="0.4" stroke-dasharray="4 4"/><path d="M293 320v90" stroke="#17352f" stroke-opacity="0.4" stroke-dasharray="4 4"/><path d="M317 320v90" stroke="#17352f" stroke-opacity="0.4" stroke-dasharray="4 4"/><path d="M545 320v90" stroke="#17352f" stroke-opacity="0.4" stroke-dasharray="4 4"/><rect x="65" y="336" width="480" height="58" fill="#17352f"/><text x="81" y="372" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fffdf6">Two-track span</text><text x="65" y="480" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#17352f">3 / Offset module: outside this rule</text><rect x="65" y="500" width="228" height="90" fill="#e0e5de"/><rect x="317" y="500" width="228" height="90" fill="#e0e5de"/><path d="M65 500v90" stroke="#17352f" stroke-opacity="0.4" stroke-dasharray="4 4"/><path d="M293 500v90" stroke="#17352f" stroke-opacity="0.4" stroke-dasharray="4 4"/><path d="M317 500v90" stroke="#17352f" stroke-opacity="0.4" stroke-dasharray="4 4"/><path d="M545 500v90" stroke="#17352f" stroke-opacity="0.4" stroke-dasharray="4 4"/><rect x="191" y="516" width="228" height="58" fill="#17352f"/><text x="207" y="552" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fffdf6">Offset module</text><text x="65" y="630" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#17352f">Original explanatory diagram · Not a performance test</text></svg>
