<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="850" viewBox="0 0 1320 850" role="img" aria-labelledby="title desc"><title id="title">Event poster: equal emphasis becomes a clear hierarchy</title><desc id="desc">Before: the event name, date, and details are all 32 units. After: the event name is 76, date 36, and details 24. Content, typeface, color, alignment, and text baselines are unchanged.</desc><metadata>Original Patternverse teaching illustration. Fictional content and data; no measured attention or performance results are claimed. Authored as editable SVG for the Graphic Design verse.</metadata><rect width="1320" height="850" fill="#f7f4ec"/><text x="30" y="45" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17352f" text-anchor="start">BEFORE · Everything has equal emphasis</text><rect x="30" y="74" width="610" height="680" fill="none" stroke="#c7cec4" stroke-width="2"/><text x="64" y="120" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#17352f" text-anchor="start">CITY ARTS / EVENING SERIES</text><text x="64" y="223" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" fill="#17352f" text-anchor="start">NIGHT</text><text x="64" y="307" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" fill="#17352f" text-anchor="start">GARDEN</text><text x="64" y="387" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#17352f" text-anchor="start">Art, sound and late openings</text><text x="64" y="495" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#17352f" text-anchor="start">SAT 18 MAY · 18:00–23:00</text><text x="64" y="578" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#17352f" text-anchor="start">Riverside Glasshouse</text><text x="64" y="626" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#17352f" text-an