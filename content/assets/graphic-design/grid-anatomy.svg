<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img" aria-labelledby="title description"><title id="title">Four tracks, flexible spans</title><desc id="description">A 480-unit live area contains four 102-unit tracks and three 24-unit gutters. A full-width region spans all four tracks, two modules each span two tracks, and a main region spans three tracks beside a one-track aside. The guides are explanatory and do not print on the finished examples.</desc><rect width="600" height="430" fill="#fffdf6"/><text data-element="diagram-title" x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#17352f">Four tracks, flexible spans</text><rect x="60" y="70" width="102" height="290" fill="#05ce78" fill-opacity="0.09"/><text data-element="track-0" x="106" y="91" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#17352f">1</text><rect x="186" y="70" width="102" height="290" fill="#05ce78" fill-opacity="0.09"/><text data-element="track-1" x="232" y="91" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#17352f">2</text><rect x="312" y="70" width="102" height="290" fill="#05ce78" fill-opacity="0.09"/><text data-element="track-2" x="358" y="91" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#17352f">3</text><rect x="438" y="70" width="102" height="290" fill="#05ce78" fill-opacity="0.09"/><text data-element="track-3" x="484" y="91" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#17352f">4</text><g fill="none" stroke="#17352f" stroke-width="2"><path d="M60 110H540V150H60ZM60 180H288V235H60ZM312 180H540V235H312ZM60 265H414V335H60ZM438 265H540V335H438Z"/></g><text data-element="span-four" x="245" y="136" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#17352f">4 tracks</text><text data-element="span-two-a" x="135" y="214" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#17352f">2 tracks</text><text data-element="span-two-b" x="387" y="214" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#17352f">2 tracks</text><text data-element="span-three" x="200" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#17352f">3 tracks</text><text data-element="span-one" x="480" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#17352f">1</text><text data-element="diagram-formula" x="30" y="391" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#17352f">4 × 102 + 3 × 24 = 480 units</text><text data-element="diagram-note" x="30" y="417" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#17352f">Guides explain the structure; they are not printed rules.</text></svg>
