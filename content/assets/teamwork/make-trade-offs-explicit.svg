<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc">
<title id="title">Make Trade-offs Explicit: a new priority changes the commitment</title>
<desc id="desc">Hypothetical launch project with twelve writer-editor production days available before launch, after routine work and separate contingency. Original estimates are eight days for essential launch materials, two for a case study, and two for extra social copy: twelve days. A new partner guide adds four, making sixteen, or four more than available. An agreed alternative keeps essential materials and the partner guide, totaling twelve days, and defers the case study and extra social copy. This preserves the launch date at the cost of fewer campaign assets. A launch sponsor owns the decision; the plan is reviewed if the guide estimate increases or its review date slips. Numbers are illustrative estimates, not guarantees. Quality remains part of retained work and review dependencies must be checked separately.</desc>
<defs><pattern id="overflow" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fff0d2"/><path d="M-2 2L2 -2M0 10L10 0M8 12L12 8" stroke="#8a5a12" stroke-width="1.3"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#152c39}.body{font-size:21px}.small{font-size:18px}.label{font-size:24px;font-weight:700}.muted{fill:#4d626f}.white{fill:#ffffff}</style>
<rect width="1400" height="1120" fill="#fafbf8"/>
<text x="52" y="66" font-size="39" font-weight="700">A new priority changes the commitment</text>
<text x="52" y="108" class="body muted">Hypothetical launch project · One shared writer-editor · Effort shown in production days</text>
<text x="52" y="152" class="body">Available before launch: 12 days, after routine work and separate contingency</text>

<rect x="40" y="190" width="1320" height="180" rx="15" fill="#ffffff" stroke="#ccd6da"/>
<text x="64" y="226" class="label" >1. Original commitments</text>
<text x="840" y="254" class="small muted" text-anchor="middle">12-day capacity</text>
<rect x="240" y="268" width="400" height="56" fill="#176e65" stroke="#ffffff" stroke-width="2"/>
<text x="440.0" y="291" class="small white" text-anchor="middle">Essential materials</text>
<text x="440.0" y="314" class="small white" text-anchor="middle">8 d</text>
<rect x="640" y="268" width="100" height="56" fill="#e1e8eb" stroke="#ffffff" stroke-width="2"/>
<text x="690.0" y="291" class="small" text-anchor="middle">Case study</text>
<text x="690.0" y="314" class="small" text-anchor="middle">2 d</text>
<rect x="740" y="268" width="100" height="56" fill="#e1e8eb" stroke="#ffffff" stroke-width="2"/>
<text x="790.0" y="291" class="small" text-anchor="middle">Social copy</text>
<text x="790.0" y="314" class="small" text-anchor="middle">2 d</text>
<line x1="840" y1="259" x2="840" y2="333" stroke="#152c39" stroke-width="2" stroke-dasharray="5 4"/>
<text x="1120" y="293" class="label" >12 d planned</text>
<text x="64" y="351" class="small muted" >The plan uses the stated production capacity.</text>
<rect x="40" y="395" width="1320" height="180" rx="15" fill="#ffffff" stroke="#ccd6da"/>
<text x="64" y="431" class="label" >2. Add the urgent partner guide</text>
<text x="840" y="459" class="small muted" text-anchor="middle">12-day capacity</text>
<rect x="240" y="473" width="400" height="56" fill="#176e65" stroke="#ffffff" stroke-width="2"/>
<text x="440.0" y="496" class="small white" text-anchor="middle">Essential materials</text>
<text x="440.0" y="519" class="small white" text-anchor="middle">8 d</text>
<rect x="640" y="473" width="100" height="56" fill="#e1e8eb" stroke="#ffffff" stroke-width="2"/>
<text x="690.0" y="496" class="small" text-anchor="middle">Case study</text>
<text x="690.0" y="519" class="small" text-anchor="middle">2 d</text>
<rect x="740" y="473" width="100" height="56" fill="#e1e8eb" stroke="#ffffff" stroke-width="2"/>
<text x="790.0" y="496" class="small" text-anchor="middle">Social copy</text>
<text x="790.0" y="519" class="small" text-anchor="middle">2 d</text>
<rect x="840" y="473" width="200" height="56" fill="url(#overflow)" stroke="#ffffff" stroke-width="2"/>
<text x="940.0" y="496" class="small" text-anchor="middle">Partner guide</text>
<text x="940.0" y="519" class="small" text-anchor="middle">4 d</text>
<line x1="840" y1="464" x2="840" y2="538" stroke="#152c39" stroke-width="2" stroke-dasharray="5 4"/>
<text x="1120" y="498" class="label" >16 d planned</text>
<text x="1120" y="526" class="small" >4 d above capacity</text>
<text x="64" y="556" class="small muted" >Keeping every item adds four days of estimated work without adding capacity.</text>
<rect x="40" y="600" width="1320" height="180" rx="15" fill="#ffffff" stroke="#ccd6da"/>
<text x="64" y="636" class="label" >3. Agree a revised commitment</text>
<text x="840" y="664" class="small muted" text-anchor="middle">12-day capacity</text>
<rect x="240" y="678" width="400" height="56" fill="#176e65" stroke="#ffffff" stroke-width="2"/>
<text x="440.0" y="701" class="small white" text-anchor="middle">Essential materials</text>
<text x="440.0" y="724" class="small white" text-anchor="middle">8 d</text>
<rect x="640" y="678" width="200" height="56" fill="#345e84" stroke="#ffffff" stroke-width="2"/>
<text x="740.0" y="701" class="small white" text-anchor="middle">Partner guide</text>
<text x="740.0" y="724" class="small white" text-anchor="middle">4 d</text>
<line x1="840" y1="669" x2="840" y2="743" stroke="#152c39" stroke-width="2" stroke-dasharray="5 4"/>
<text x="1120" y="703" class="label" >12 d planned</text>
<text x="64" y="761" class="small muted" >Keep the launch date and partner guide; defer the case study and extra social copy.</text>
<rect x="40" y="810" width="1320" height="148" rx="13" fill="#edf5f2" stroke="#93aca6"/>
<text x="64" y="846" class="label" >Record the exchange</text>
<text x="64" y="882" class="body" >Cost: fewer campaign assets at launch. Decision owner: launch sponsor.</text>
<text x="64" y="920" class="body" >Revisit if the guide estimate grows beyond four days or its review date slips.</text>
<text x="52" y="1000" class="small muted" >Illustrative estimates only: a plan that fits the estimate still contains uncertainty.</text>
<text x="52" y="1031" class="small muted" >Required quality stays within retained work. Review dependencies must be checked separately.</text>
<text x="52" y="1062" class="small muted" >The same item count can represent different effort; compare the capacity actually needed.</text>
</svg>