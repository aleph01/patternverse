<text x="52" y="897" class="small muted" >Hypothetical illustration: all requests arrive before block 1; guides have equal value and effort.</text>
<text x="52" y="926" class="small muted" >One editor works one block at a time; no dependencies, interruptions, or switching costs.</text>
<text x="52" y="955" class="small muted" >Queued work remains visible. A limit of one illustrates this case; it is not a rule for every team.</text>
