<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc">
<title id="title">Limit Work in Progress: finish earlier with the same effort</title>
<desc id="desc">Hypothetical comparison of one editor producing three guides. Every guide needs three equal work blocks; all requests arrive before block one. Alternating among guides completes A, B, and C at blocks seven, eight, and nine. Finishing one guide before starting the next completes them at blocks three, six, and nine. Both schedules use nine blocks with no switching penalty. Solid blocks are active work, diagonal hatching is waiting after starting, dots are waiting before starting, and a dash means already delivered. The first two guides arrive earlier with a WIP limit of one; the last finishes at the same time.</desc>
<defs>
 <pattern id="waiting" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#edf0f2"/><path d="M-2 2L2 -2M0 9L9 0M7 11L11 7" stroke="#8b97a1" stroke-width="1.3"/></pattern>
 <pattern id="queued" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3f6fa"/><circle cx="5" cy="5" r="1.1" fill="#94a2b3"/></pattern>
</defs>
