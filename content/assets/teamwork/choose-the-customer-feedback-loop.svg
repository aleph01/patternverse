<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc">
<title id="title">Choose evidence that can change the decision</title>
<desc id="desc">Hypothetical equipment rental team asks why customers wait at collection. Two complementary activities inform a decision: observation and short interviews reveal a ready-for-collection message being sent before the equipment is ready; booking, readiness, and arrival records help assess how often this occurs. The team defers an express-check-in app and changes when the notification is sent. It then checks collection waits, total time from reservation to collection, and customers' understanding. A return arrow leads back to the question, showing that evidence and follow-up form a repeating loop. There are no measured results or numerical claims.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#4d626f" stroke-width="1.5"/></marker></defs>
<rect width="1400" height="1250" fill="#fafbf8"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#152c39">
<text x="60" y="70" font-size="39" font-weight="700">Choose evidence that can change the decision</text>
<text x="60" y="113" font-size="23" fill="#4d626f">Hypothetical equipment rental service · Match the method to the uncertainty</text>
<rect x="60" y="155" width="1280" height="110" rx="14" fill="#fff" stroke="#ccd6da" stroke-width="2"/>
<text x="90" y="195" font-size="21" font-weight="700" fill="#4d626f">START WITH THE QUESTION</text>
<text x="90" y="237" font-size="29">Why do customers wait at equipment collection?</text>
<path d="M700 265 V300 H365 V327 M700 300 H1035 V327" fill="none" stroke="#4d626f" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M365 300 V327" fill="none" stroke="#4d626f" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="340" width="610" height="245" rx="14" fill="#edf2f8" stroke="#7090ae" stroke-width="2"/>
<rect x="730" y="340" width="610" height="245" rx="14" fill="#edf2f8" stroke="#7090ae" stroke-width="2"/>
<text x="90" y="385" font-size="27" font-weight="700">Understand the breakdown</text>
<text x="90" y="431" font-size="24">Observe collection; interview customers</text><text x="90" y="465" font-size="24">and staff about what happens.</text>
<text x="90" y="518" font-size="24">Finding: “ready” messages arrive</text><text x="90" y="552" font-size="24">before equipment is actually ready.</text>
<text x="760" y="385" font-size="27" font-weight="700">Check its extent</text>
<text x="760" y="431" font-size="24">Compare booking, readiness,</text><text x="760" y="465" font-size="24">and arrival records.</text>
<text x="760" y="518" font-size="24">Assess how often this happens</text><text x="760" y="552" font-size="24">across the service.</text>
<path d="M365 585 V615 H1035 V585 M700 615 V642" fill="none" stroke="#4d626f" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="250" y="655" width="900" height="150" rx="14" fill="#edf5f2" stroke="#176e65" stroke-width="2.5"/>
<text x="280" y="699" font-size="21" font-weight="700" fill="#4d626f">MAKE A DECISION AND ACT</text>
<text x="280" y="742" font-size="27">Defer the app. Send the collection message</text><text x="280" y="779" font-size="27">when the equipment is ready.</text>
<path d="M700 805 V847" fill="none" stroke="#4d626f" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="250" y="860" width="900" height="190" rx="14" fill="#fff" stroke="#ccd6da" stroke-width="2"/>
<text x="280" y="903" font-size="21" font-weight="700" fill="#4d626f">CHECK WHAT HAPPENED</text>
<text x="280" y="946" font-size="25">Track collection waits and total reservation-to-collection time.</text>
<text x="280" y="986" font-size="25">Ask whether customers understand when to arrive.</text>
<text x="280" y="1024" font-size="23" fill="#4d626f">A shorter queue should not conceal a longer overall delay.</text>
<path d="M1150 955 H1370 V210 H1350" fill="none" stroke="#4d626f" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="60" y="1120" font-size="25" font-weight="700">Use what you learn to choose the next question.</text>
<text x="60" y="1171" font-size="21" fill="#4d626f">Fictional example · Complementary methods, not a fixed sequence for every team</text>
<text x="60" y="1203" font-size="21" fill="#4d626f">The diagram shows an investigation and follow-up plan; it contains no measured results.</text>
</g></svg>