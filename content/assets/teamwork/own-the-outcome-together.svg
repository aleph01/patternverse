<text x="530" y="699" class="body" >for the practice task</text>
<line x1="700" y1="595" x2="700" y2="567" stroke="#617783" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="950" y="605" width="380" height="112" rx="9" fill="#f8faf9" stroke="#93aca6"/>
<text x="970" y="639" class="label" >Sam · Manager</text>
