<text x="90" y="793" class="label" >Delivery readiness</text>
<text x="90" y="832" class="body" >Accounts, instructions, and support route</text>
<text x="90" y="865" class="body" >checked against agreed completion criteria.</text>
<rect x="710" y="757" width="620" height="130" rx="9" fill="#ffffff" stroke="#aab8bf"/>
<text x="730" y="793" class="label" >Outcome follow-up</text>
<text x="730" y="832" class="body" >Observe the supported practice task;</text>
<text x="730" y="865" class="body" >ask where the starter gets stuck.</text>
<text x="70" y="937" class="body" >Sam coordinates follow-up; specialist decisions stay with their role holders.</text>
<text x="52" y="1031" class="label" >If the task fails: name the blocker → assign the next action → recheck with the starter.</text>
<text x="52" y="1080" class="small muted" >Hypothetical people and events. The diagram shows responsibilities, not a timetable or measured benefit.</text>
<text x="52" y="1111" class="small muted" >Shared follow-through requires time, authority, and a clear boundary; external dependencies may need escalation.</text>
</svg>