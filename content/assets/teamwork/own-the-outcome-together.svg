<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160" role="img" aria-labelledby="title desc">
<title id="title">Own the Outcome Together: clear contributions, one shared result</title>
<desc id="desc">Hypothetical first-week onboarding. Separate task checks show HR sending a checklist, IT creating accounts, and a manager booking a welcome meeting, yet a new starter cannot complete a practice task because access is missing. A shared outcome connects named commitments: Maya in HR publishes a clear help route, Leon in IT verifies task permissions, and Sam the manager chooses a practice task and arranges a buddy. The shared intended result is completing a practice task with agreed support and knowing where to get help. Delivery readiness checks setup and instructions; outcome follow-up observes what the starter can actually do and where they get stuck. Sam coordinates follow-up while specialist decisions remain with role holders. If the task fails, the team names the blocker, assigns a next action, and rechecks. This conceptual comparison is not a measured improvement or guaranteed outcome.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#617783" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#152c39}.body{font-size:21px}.small{font-size:18px}.label{font-size:24px;font-weight:700}.muted{fill:#4d626f}</style>
