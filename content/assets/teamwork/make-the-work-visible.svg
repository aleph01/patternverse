<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1250" viewBox="0 0 1400 1250" role="img" aria-labelledby="title desc">
<title id="title">From in progress to a useful next decision</title>
<desc id="desc">A fictional communications team replaces one label, six packs in progress, with a workflow view. Two packs, H and I, have not started. Six packs have started but are not published: A is drafting and is three days old; B is drafting, six days old, and blocked by missing venue information; C, D, and E await review and are seven, five, and four days old; F is publishing and is two days old. G is already published. Age means calendar days since work started, including waiting, not time in the current stage. The visible review queue prompts a decision to help clear review before starting another pack. A snapshot suggests an investigation; it does not prove a permanent bottleneck.</desc>
<rect width="1400" height="1250" fill="#fafbf8"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#152c39">
<text x="60" y="70" font-size="39" font-weight="700">From “in progress” to a useful next decision</text>
<text x="60" y="113" font-size="23" fill="#4d626f">Hypothetical communications team · Same work, more useful distinctions</text>
<rect x="60" y="155" width="1280" height="95" rx="14" fill="#fff" stroke="#ccd6da" stroke-width="2"/>
<text x="90" y="192" font-size="20" font-weight="700" fill="#4d626f">PREVIOUS STATUS REPORT</text>
<text x="90" y="231" font-size="29">Six information packs: “In progress”</text>
<rect x="320" y="284" width="760" height="46" rx="8" fill="#edf2f8"/>
<text x="700" y="315" text-anchor="middle" font-size="23" font-weight="700">Started, not yet published: 6 packs</text>
<rect x="60" y="355" width="240" height="590" rx="12" fill="#f0f3f2" stroke="#ccd6da" stroke-width="2"/><text x="80" y="394" font-size="24" font-weight="700">Ready to</text><text x="80" y="424" font-size="24" font-weight="700">start</text><rect x="320" y="355" width="240" height="590" rx="12" fill="#f0f3f2" stroke="#ccd6da" stroke-width="2"/><text x="340" y="394" font-size="24" font-weight="700">Drafting</text><rect x="580" y="355" width="240" height="590" rx="12" fill="#f0f3f2" stroke="#ccd6da" stroke-width="2"/><text x="600" y="394" font-size="24" font-weight="700">Awaiting</text><text x="600" y="424" font-size="24" font-weight="700">review</text><rect x="840" y="355" width="240" height="590" rx="12" fill="#f0f3f2" stroke="#ccd6da" stroke-width="2"/><text x="860" y="394" font-size="24" font-weight="700">Publishing</text><rect x="1100" y="355" width="240" height="590" rx="12" fill="#edf5f2" stroke="#ccd6da" stroke-width="2"/><text x="1120" y="394" font-size="24" font-weight="700">Published</text><rect x="74" y="450" width="212" height="112" rx="9" fill="#fff" stroke="#b6c5ca" stroke-width="2"/><text x="90" y="488" font-size="25" font-weight="700">Pack H</text><text x="90" y="527" font-size="21" fill="#4d626f">Not started</text><rect x="74" y="590" width="212" height="112" rx="9" fill="#fff" stroke="#b6c5ca" stroke-width="2"/><text x="90" y="628" font-size="25" font-weight="700">Pack I</text><text x="90" y="667" font-size="21" fill="#4d626f">Not started</text><rect x="334" y="450" width="212" height="112" rx="9" fill="#fff" stroke="#b6c5ca" stroke-width="2"/><text x="350" y="488" font-size="25" font-weight="700">Pack A</text><text x="350" y="527" font-size="21" fill="#4d626f">Age: 3 days</text><rect x="334" y="590" width="212" height="170" rx="9" fill="#fff0d2" stroke="#8a5a12" stroke-width="2" stroke-dasharray="7 5"/><text x="350" y="628" font-size="25" font-weight="700">Pack B</text><text x="350" y="667" font-size="21" fill="#4d626f">Age: 6 days</text><text x="350" y="702" font-size="19" font-weight="700">BLOCKED</text><text x="350" y="733" font-size="21">Missing venue</text><rect x="594" y="450" width="212" height="112" rx="9" fill="#fff" stroke="#b6c5ca" stroke-width="2"/><text x="610" y="488" font-size="25" font-weight="700">Pack C</text><text x="610" y="527" font-size="21" fill="#4d626f">Age: 7 days</text><rect x="594" y="590" width="212" height="112" rx="9" fill="#fff" stroke="#b6c5ca" stroke-width="2"/><text x="610" y="628" font-size="25" font-weight="700">Pack D</text><text x="610" y="667" font-size="21" fill="#4d626f">Age: 5 days</text><rect x="594" y="730" width="212" height="112" rx="9" fill="#fff" stroke="#b6c5ca" stroke-width="2"/><text x="610" y="768" font-size="25" font-weight="700">Pack E</text><text x="610" y="807" font-size="21" fill="#4d626f">Age: 4 days</text><rect x="854" y="450" width="212" height="112" rx="9" fill="#fff" stroke="#b6c5ca" stroke-width="2"/><text x="870" y="488" font-size="25" font-weight="700">Pack F</text><text x="870" y="527" font-size="21" fill="#4d626f">Age: 2 days</text><rect x="1114" y="450" width="212" height="112" rx="9" fill="#fff" stroke="#b6c5ca" stroke-width="2"/><text x="1130" y="488" font-size="25" font-weight="700">Pack G</text><text x="1130" y="527" font-size="21" fill="#4d626f">Available now</text><rect x="60" y="987" width="1280" height="125" rx="12" fill="#edf5f2" stroke="#176e65" stroke-width="2.5"/>
<text x="90" y="1033" font-size="27" font-weight="700">Next decision: help clear review before starting another pack.</text>
<text x="90" y="1077" font-size="24">Name who will help, and agree what can wait.</text>
<text x="60" y="1161" font-size="21" fill="#4d626f">Age = calendar days since starting, including waiting. Blocked work remains in its stage.</text>
<text x="60" y="1203" font-size="21" fill="#4d626f">All items and ages are fictional · A snapshot is not proof of a permanent bottleneck.</text>
</g></svg>