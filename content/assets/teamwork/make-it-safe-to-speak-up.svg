<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160" role="img" aria-labelledby="title desc">
<title id="title">The response teaches people what happens next</title>
<desc id="desc">A hypothetical launch review compares two responses to Rina's concern that customers may lose saved attachments. In the dismissed path, the lead says it was already covered and it is too late to reopen it. No investigation or explained decision follows; Rina and observers may hold back next time. In the examined path, the lead thanks Rina, asks what she saw, checks the evidence, assigns an action, and explains the decision. This gives people evidence that candid input is welcome, even if a proposed solution is declined. These are possible effects, not measured predictions.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#4d626f" stroke-width="1.5"/></marker></defs>
<rect width="1400" height="1160" fill="#fafbf8"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#152c39">
<text x="60" y="70" font-size="39" font-weight="700">The response teaches people what happens next</text>
<text x="60" y="112" font-size="23" fill="#4d626f">Hypothetical launch review · Same concern, two possible responses</text>
<rect x="180" y="155" width="1040" height="135" rx="14" fill="#fff" stroke="#ccd6da" stroke-width="2"/>
<text x="215" y="198" font-size="21" font-weight="700" fill="#4d626f">RINA RAISES A CONCERN</text>
<text x="215" y="242" font-size="28">“I think customers can lose their saved attachments.”</text>
<path d="M700 290 L700 322 L365 322 L365 349" fill="none" stroke="#4d626f" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M700 322 L1035 322 L1035 349" fill="none" stroke="#4d626f" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="360" width="610" height="570" rx="14" fill="#fff0d2" stroke="#8a5a12" stroke-width="2" stroke-dasharray="9 6"/>
<rect x="730" y="360" width="610" height="570" rx="14" fill="#edf5f2" stroke="#176e65" stroke-width="2"/>
<text x="92" y="408" font-size="28" font-weight="700">A · Concern dismissed</text>
<text x="762" y="408" font-size="28" font-weight="700">B · Concern examined</text>
<text x="92" y="459" font-size="20" font-weight="700" fill="#4d626f">RESPONSE</text>
<text x="92" y="501" font-size="25">“We covered this already.</text>
<text x="92" y="537" font-size="25">We’re too late to reopen it.”</text>
<text x="762" y="459" font-size="20" font-weight="700" fill="#4d626f">RESPONSE</text>
<text x="762" y="501" font-size="25">“Thanks for raising it.</text>
<text x="762" y="537" font-size="25">What did you see?”</text>
<path d="M92 566 H638 M762 566 H1308" stroke="#b7c4c8" stroke-width="1.5"/>
<text x="92" y="606" font-size="20" font-weight="700" fill="#4d626f">WHAT FOLLOWS</text>
<text x="92" y="650" font-size="25">No investigation or</text>
<text x="92" y="686" font-size="25">explained decision.</text>
<text x="762" y="606" font-size="20" font-weight="700" fill="#4d626f">WHAT FOLLOWS</text>
<text x="762" y="650" font-size="25">Check evidence; assign an action.</text>
<text x="762" y="686" font-size="25">Explain the decision and follow up.</text>
<path d="M92 720 H638 M762 720 H1308" stroke="#b7c4c8" stroke-width="1.5"/>
<text x="92" y="760" font-size="20" font-weight="700" fill="#4d626f">POSSIBLE EFFECT</text>
<text x="92" y="805" font-size="25">Rina and observers may</text>
<text x="92" y="841" font-size="25">hold back next time.</text>
<text x="762" y="760" font-size="20" font-weight="700" fill="#4d626f">EVIDENCE FOR THE TEAM</text>
<text x="762" y="805" font-size="25">Candid input receives</text>
<text x="762" y="841" font-size="25">respectful attention and action.</text>
<text x="92" y="895" font-size="20" fill="#4d626f">Silence can hide useful information.</text>
<text x="762" y="895" font-size="20" fill="#4d626f">Repeated follow-through builds credibility.</text>
<rect x="60" y="964" width="1280" height="109" rx="12" fill="#fff" stroke="#ccd6da" stroke-width="2"/>
<text x="92" y="1007" font-size="27" font-weight="700">Respect the person. Test the claim. Explain the decision.</text>
<text x="92" y="1046" font-size="23">A concern can receive a fair hearing even when a proposed solution is declined.</text>
<text x="60" y="1115" font-size="20" fill="#4d626f">Fictional example · Possible effects, not a forecast · Quality standards and accountability still apply</text>
</g></svg>