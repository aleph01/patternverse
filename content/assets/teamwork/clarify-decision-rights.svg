<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Participation, authority, and execution are different roles</title>
  <desc id="desc">For a defined choice within a stated authority boundary, a recommendation gathers input, an authorized person or body decides, and named owners implement with committed resources. Required approval checks only a specified condition. A proposal beyond the decision-maker's remit goes to a named authority for resolution, rather than assuming an exception is permitted. This is an illustrative arrangement, not GitLab or Apache's process.</desc>
  <rect width="1200" height="760" fill="#F6F4EF"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="62" font-size="32" font-weight="700" fill="#183343">Participation, authority, and execution are different roles.</text>
    <text x="60" y="105" font-size="24" fill="#52646D">Define the choice before debating the options.</text>
    <rect x="60" y="145" width="1080" height="90" rx="16" fill="#183343"/>
    <text x="600" y="199" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">Defined choice + explicit authority boundary</text>
    <path d="M600 235V300" fill="none" stroke="#898983" stroke-width="3"/>
    <path d="M600 300L593 286H607Z" fill="#898983"/>
    <g fill="#FFFFFF" stroke="#D7DDD9" stroke-width="2">
      <rect x="60" y="300" width="300" height="200" rx="18"/>
      <rect x="840" y="300" width="300" height="200" rx="18"/>
      <rect x="60" y="555" width="480" height="110" rx="16"/>
      <rect x="660" y="555" width="480" height="110" rx="16"/>
    </g>
    <rect x="450" y="300" width="300" height="200" rx="18" fill="#DCEDE8" stroke="#176E69" stroke-width="3"/>
    <g text-anchor="middle" font-size="28" font-weight="700" fill="#183343">
      <text x="210" y="349">Prepare</text>
      <text x="600" y="349" fill="#176E69">Decide</text>
      <text x="990" y="349">Implement</text>
    </g>
    <g text-anchor="middle" font-size="23" fill="#52646D">
      <text x="210" y="401">Gather relevant input</text>
      <text x="210" y="437">Compare options</text>
      <text x="210" y="473">Recommend</text>
      <text x="600" y="401">Authorized role or body</text>
      <text x="600" y="437">Use agreed</text>
      <text x="600" y="473">decision rule</text>
      <text x="990" y="401">Named owners</text>
      <text x="990" y="437">Committed resources</text>
      <text x="990" y="473">Recorded decision</text>
    </g>
    <path d="M360 400H450M750 400H840" fill="none" stroke="#176E69" stroke-width="4"/>
    <path d="M450 400L435 392V408ZM840 400L825 392V408Z" fill="#176E69"/>
    <path d="M300 555V525H550V500M700 500V525H900V555" fill="none" stroke="#898983" stroke-width="3"/>
    <path d="M550 500L543 514H557ZM900 555L893 541H907Z" fill="#898983"/>
    <g text-anchor="middle" fill="#183343" font-size="26" font-weight="700">
      <text x="300" y="597">Required approval</text>
      <text x="900" y="597">Beyond the remit?</text>
    </g>
    <g text-anchor="middle" fill="#52646D" font-size="23">
      <text x="300" y="640">Checks only its specified condition</text>
      <text x="900" y="640">Named authority resolves the issue</text>
    </g>
    <text x="60" y="713" font-size="22" fill="#52646D">Input informs the choice. Required approval has a defined scope.</text>
    <text x="60" y="747" font-size="20" fill="#52646D">Illustrative arrangement. Roles can overlap; a written chart alone cannot grant authority.</text>
  </g>
</svg>
