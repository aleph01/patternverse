<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc">
<title id="title">Deliver Small Slices: one narrow scenario through the necessary parts</title>
<desc id="desc">Hypothetical workshop-booking service. Component milestones separately complete booking screens, booking rules, records, and confirmations or staff views; a usable reservation requires integration of the necessary parts. A small value slice instead supports one complete scenario: an existing member reserves one place at one free workshop. This slice includes interaction, rules, saved records, and confirmation or staff visibility. Future scope is provisional and reuses working parts. A feedback loop connects the usable slice to observing bookings, discovering that people book for colleagues, and choosing that next capability. This is a scope diagram, not a timeline or estimate. Required quality, accessibility, privacy, and capacity checks apply to the delivered slice.</desc>
<defs>
 <pattern id="future" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#f5f7f8"/><circle cx="6" cy="6" r="1" fill="#a9b5be"/></pattern>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#617783" stroke-width="1.5"/></marker>
</defs>
