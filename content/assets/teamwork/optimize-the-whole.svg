<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc">
<title id="title">Optimize the Whole: improve the journey from request to result</title>
<desc id="desc">Hypothetical replacement laptop request. Four hands-on steps are separated by three waits. Baseline hands-on steps take one, one, two, and one working hours; waits take 32, eight, and 16 hours, totaling 61 hours. Automating authorization from one hour to half an hour leaves all waits unchanged and totals 60.5 hours. An alternative redesign retains all five hands-on hours but reduces waits to eight, two, and four hours, totaling 19 hours. Bars use the same scale. These invented timings illustrate a mechanism, not a forecast or measured result. Quality, cost, and staffing overhead are not quantified.</desc>
<defs><pattern id="wait" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#eef1f2"/><path d="M-2 2L2 -2M0 10L10 0M8 12L12 8" stroke="#8c9ca7" stroke-width="1.4"/></pattern></defs>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#152c39}.small {font-size:18px}.body {font-size:21px}.muted {fill:#4d626f}.label {font-size:23px;font-weight:700}</style>
<rect width="1400" height="1050" fill="#fafbf8"/>
<text x="52" y="66" font-size="39" font-weight="700">Improve the journey from request to result</text>
<text x="52" y="108" class="body muted">A hypothetical replacement laptop request · All durations are working hours</text>
<text x="52" y="155" class="body">Check request → Authorize → Configure → Hand over</text>
<rect x="52" y="180" width="30" height="23" rx="3" fill="#176e65"/><text x="94" y="198" class="small">Hands-on work</text>
<rect x="320" y="180" width="30" height="23" rx="3" fill="url(#wait)" stroke="#8c9ca7"/><text x="362" y="198" class="small">Waiting between steps</text>
<text x="816" y="198" class="small muted">Every bar uses the same time scale.</text>

<rect x="40" y="225" width="1320" height="190" rx="15" fill="#ffffff" stroke="#ccd6da"/>
<text x="64" y="261" class="label" >1. Existing journey</text>
<text x="225" y="289" class="small muted" text-anchor="middle">0</text>
<line x1="225" y1="295" x2="225" y2="345" stroke="#e1e7e9"/>
<text x="365" y="289" class="small muted" text-anchor="middle">10</text>
<line x1="365" y1="295" x2="365" y2="345" stroke="#e1e7e9"/>
<text x="505" y="289" class="small muted" text-anchor="middle">20</text>
<line x1="505" y1="295" x2="505" y2="345" stroke="#e1e7e9"/>
<text x="645" y="289" class="small muted" text-anchor="middle">30</text>
<line x1="645" y1="295" x2="645" y2="345" stroke="#e1e7e9"/>
<text x="785" y="289" class="small muted" text-anchor="middle">40</text>
<line x1="785" y1="295" x2="785" y2="345" stroke="#e1e7e9"/>
<text x="925" y="289" class="small muted" text-anchor="middle">50</text>
<line x1="925" y1="295" x2="925" y2="345" stroke="#e1e7e9"/>
<text x="1065" y="289" class="small muted" text-anchor="middle">60</text>
<line x1="1065" y1="295" x2="1065" y2="345" stroke="#e1e7e9"/>
<text x="64" y="330" class="small muted" >Elapsed time</text>
<rect x="225" y="302" width="14" height="43" fill="#176e65" stroke="#ffffff" stroke-width="1"/>
<rect x="239" y="302" width="448" height="43" fill="url(#wait)" stroke="#ffffff" stroke-width="1"/>
<text x="463.0" y="330" class="small" text-anchor="middle">32h</text>
<rect x="687" y="302" width="14" height="43" fill="#176e65" stroke="#ffffff" stroke-width="1"/>
<rect x="701" y="302" width="112" height="43" fill="url(#wait)" stroke="#ffffff" stroke-width="1"/>
<text x="757.0" y="330" class="small" text-anchor="middle">8h</text>
<rect x="813" y="302" width="28" height="43" fill="#176e65" stroke="#ffffff" stroke-width="1"/>
<rect x="841" y="302" width="224" height="43" fill="url(#wait)" stroke="#ffffff" stroke-width="1"/>
<text x="953.0" y="330" class="small" text-anchor="middle">16h</text>
<rect x="1065" y="302" width="14" height="43" fill="#176e65" stroke="#ffffff" stroke-width="1"/>
<text x="1160" y="328" class="label" >61 h</text>
<text x="225" y="375" class="small" >Hands-on: 5 h   ·   Waiting: 56 h</text>
<text x="225" y="401" class="small muted" >The request waits for batch authorization, IT capacity, and pickup.</text>
<rect x="40" y="435" width="1320" height="190" rx="15" fill="#ffffff" stroke="#ccd6da"/>
<text x="64" y="471" class="label" >2. Improve one step: faster authorization</text>
<text x="225" y="499" class="small muted" text-anchor="middle">0</text>
<line x1="225" y1="505" x2="225" y2="555" stroke="#e1e7e9"/>
<text x="365" y="499" class="small muted" text-anchor="middle">10</text>
<line x1="365" y1="505" x2="365" y2="555" stroke="#e1e7e9"/>
<text x="505" y="499" class="small muted" text-anchor="middle">20</text>
<line x1="505" y1="505" x2="505" y2="555" stroke="#e1e7e9"/>
<text x="645" y="499" class="small muted" text-anchor="middle">30</text>
<line x1="645" y1="505" x2="645" y2="555" stroke="#e1e7e9"/>
<text x="785" y="499" class="small muted" text-anchor="middle">40</text>
<line x1="785" y1="505" x2="785" y2="555" stroke="#e1e7e9"/>
<text x="925" y="499" class="small muted" text-anchor="middle">50</text>
<line x1="925" y1="505" x2="925" y2="555" stroke="#e1e7e9"/>
<text x="1065" y="499" class="small muted" text-anchor="middle">60</text>
<line x1="1065" y1="505" x2="1065" y2="555" stroke="#e1e7e9"/>
<text x="64" y="540" class="small muted" >Elapsed time</text>
<rect x="225" y="512" width="14" height="43" fill="#176e65" stroke="#ffffff" stroke-width="1"/>
<rect x="239" y="512" width="448" height="43" fill="url(#wait)" stroke="#ffffff" stroke-width="1"/>
<text x="463.0" y="540" class="small" text-anchor="middle">32h</text>
<rect x="687" y="512" width="7.0" height="43" fill="#176e65" stroke="#ffffff" stroke-width="1"/>
<rect x="694.0" y="512" width="112" height="43" fill="url(#wait)" stroke="#ffffff" stroke-width="1"/>
<text x="750.0" y="540" class="small" text-anchor="middle">8h</text>
<rect x="806.0" y="512" width="28" height="43" fill="#176e65" stroke="#ffffff" stroke-width="1"/>
<rect x="834.0" y="512" width="224" height="43" fill="url(#wait)" stroke="#ffffff" stroke-width="1"/>
<text x="946.0" y="540" class="small" text-anchor="middle">16h</text>
<rect x="1058.0" y="512" width="14" height="43" fill="#176e65" stroke="#ffffff" stroke-width="1"/>
<text x="1160" y="538" class="label" >60.5 h</text>
<text x="225" y="585" class="small" >Hands-on: 4.5 h   ·   Waiting: 56 h</text>
<text x="225" y="611" class="small muted" >Authorization takes half the time. The full journey saves 0.5 h.</text>
<rect x="40" y="645" width="1320" height="190" rx="15" fill="#ffffff" stroke="#ccd6da"/>
<text x="64" y="681" class="label" >3. Alternative redesign: coordinate the handoffs</text>
<text x="225" y="709" class="small muted" text-anchor="middle">0</text>
<line x1="225" y1="715" x2="225" y2="765" stroke="#e1e7e9"/>
<text x="365" y="709" class="small muted" text-anchor="middle">10</text>
<line x1="365" y1="715" x2="365" y2="765" stroke="#e1e7e9"/>
<text x="505" y="709" class="small muted" text-anchor="middle">20</text>
<line x1="505" y1="715" x2="505" y2="765" stroke="#e1e7e9"/>
<text x="645" y="709" class="small muted" text-anchor="middle">30</text>
<line x1="645" y1="715" x2="645" y2="765" stroke="#e1e7e9"/>
<text x="785" y="709" class="small muted" text-anchor="middle">40</text>
<line x1="785" y1="715" x2="785" y2="765" stroke="#e1e7e9"/>
<text x="925" y="709" class="small muted" text-anchor="middle">50</text>
<line x1="925" y1="715" x2="925" y2="765" stroke="#e1e7e9"/>
<text x="1065" y="709" class="small muted" text-anchor="middle">60</text>
<line x1="1065" y1="715" x2="1065" y2="765" stroke="#e1e7e9"/>
<text x="64" y="750" class="small muted" >Elapsed time</text>
<rect x="225" y="722" width="14" height="43" fill="#176e65" stroke="#ffffff" stroke-width="1"/>
<rect x="239" y="722" width="112" height="43" fill="url(#wait)" stroke="#ffffff" stroke-width="1"/>
<text x="295.0" y="750" class="small" text-anchor="middle">8h</text>
<rect x="351" y="722" width="14" height="43" fill="#176e65" stroke="#ffffff" stroke-width="1"/>
<rect x="365" y="722" width="28" height="43" fill="url(#wait)" stroke="#ffffff" stroke-width="1"/>
<text x="379.0" y="750" class="small" text-anchor="middle">2h</text>
<rect x="393" y="722" width="28" height="43" fill="#176e65" stroke="#ffffff" stroke-width="1"/>
<rect x="421" y="722" width="56" height="43" fill="url(#wait)" stroke="#ffffff" stroke-width="1"/>
<text x="449.0" y="750" class="small" text-anchor="middle">4h</text>
<rect x="477" y="722" width="14" height="43" fill="#176e65" stroke="#ffffff" stroke-width="1"/>
<text x="1160" y="748" class="label" >19 h</text>
<text x="225" y="795" class="small" >Hands-on: 5 h   ·   Waiting: 14 h</text>
<text x="225" y="821" class="small muted" >Review smaller batches, coordinate with IT, and offer more frequent pickup.</text>
<text x="52" y="885" class="label" >A useful local saving and a better overall journey are different results.</text>
<text x="52" y="930" class="small muted" >Illustrative timings only: 61 → 60.5 h for a faster step; 61 → 19 h for the alternative redesign.</text>
<text x="52" y="961" class="small muted" >Assumes a laptop is in stock, sequential work, and no rework; all four hands-on steps remain.</text>
<text x="52" y="992" class="small muted" >Demand variation, staffing overhead, quality, and total cost must be checked separately in a real trial.</text>
</svg>