<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160" role="img" aria-labelledby="title desc">
<title id="title">Check Shared Understanding: expose and repair an interpretation</title>
<desc id="desc">Hypothetical guide handoff in five turns. Maya asks for the guide ready for Friday. Leon interprets this as sending a final guide to all partners Friday morning. Maya clarifies that she needs an internal draft by noon Friday, with separate approval before external distribution. Leon restates the corrected scope, audience, timing, and approval condition and confirms that timing works for him. Maya confirms and says she will review Friday afternoon. The example distinguishes understanding, agreement, and capacity to commit. Confirming interpretation does not establish that the task is complete or the plan is correct. Fictional people and timing; no measured benefit is claimed.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#152c39}.body{font-size:22px}.small{font-size:18px}.label{font-size:23px;font-weight:700}.muted{fill:#4d626f}</style>
<rect width="1400" height="1160" fill="#fafbf8"/>
<text x="52" y="66" font-size="39" font-weight="700">Check the interpretation before work proceeds</text>
<text x="52" y="108" class="body muted">A hypothetical guide handoff · Surface the mismatch, clarify, and check again</text>

<rect x="120" y="160" width="940" height="125" rx="12" fill="#edf5f2" stroke="#93aca6" stroke-width="1.7" />
<circle cx="70" cy="198" r="23" fill="#ffffff" stroke="#93aca6" stroke-width="1.7"/>
<text x="70" y="206" class="label" text-anchor="middle">1</text>
<text x="144" y="192" class="label" >Maya · Request</text>
<text x="144" y="231" class="body" >Can you get the guide ready for Friday?</text>
<text x="1100" y="218" class="small muted" >Missing: draft or final?</text>
<text x="1100" y="247" class="small muted" >Internal or external?</text>
<rect x="120" y="305" width="940" height="125" rx="12" fill="#fff0d2" stroke="#8a5a12" stroke-width="1.7" stroke-dasharray="6 4"/>
<circle cx="70" cy="343" r="23" fill="#ffffff" stroke="#8a5a12" stroke-width="1.7"/>
<text x="70" y="351" class="label" text-anchor="middle">2</text>
<text x="144" y="337" class="label" >Leon · Interpretation</text>
<text x="144" y="376" class="body" >I’ll send the final guide to all partners</text>
<text x="144" y="407" class="body" >on Friday morning.</text>
<text x="1100" y="363" class="small muted" >An assumption</text>
<text x="1100" y="392" class="small muted" >becomes visible.</text>
<rect x="120" y="450" width="940" height="125" rx="12" fill="#edf5f2" stroke="#93aca6" stroke-width="1.7" />
<circle cx="70" cy="488" r="23" fill="#ffffff" stroke="#93aca6" stroke-width="1.7"/>
<text x="70" y="496" class="label" text-anchor="middle">3</text>
<text x="144" y="482" class="label" >Maya · Clarification</text>
<text x="144" y="521" class="body" >My request was too vague. I need an internal draft by noon Friday.</text>
<text x="144" y="552" class="body" >Please wait for separate approval before external distribution.</text>
<text x="1100" y="508" class="small muted" >Explains the intended</text>
<text x="1100" y="537" class="small muted" >scope and boundary.</text>
<rect x="120" y="595" width="940" height="125" rx="12" fill="#edf2f8" stroke="#7090ae" stroke-width="1.7" />
<circle cx="70" cy="633" r="23" fill="#ffffff" stroke="#7090ae" stroke-width="1.7"/>
<text x="70" y="641" class="label" text-anchor="middle">4</text>
<text x="144" y="627" class="label" >Leon · Recheck</text>
<text x="144" y="666" class="body" >Internal draft for our team by noon Friday; external distribution</text>
<text x="144" y="697" class="body" >waits for your approval. That timing works for me.</text>
<text x="1100" y="653" class="small muted" >Restates the action</text>
<text x="1100" y="682" class="small muted" >and confirms capacity.</text>
<rect x="120" y="740" width="940" height="125" rx="12" fill="#edf5f2" stroke="#176e65" stroke-width="1.7" />
<circle cx="70" cy="778" r="23" fill="#ffffff" stroke="#176e65" stroke-width="1.7"/>
<text x="70" y="786" class="label" text-anchor="middle">5</text>
<text x="144" y="772" class="label" >Maya · Confirmation</text>
<text x="144" y="811" class="body" >Yes. I’ll review it Friday afternoon</text>
<text x="144" y="842" class="body" >and confirm the next step.</text>
<text x="1100" y="798" class="small muted" >Closes this</text>
<text x="1100" y="827" class="small muted" >communication loop.</text>
<text x="52" y="929" class="label" >Keep three questions distinct</text>
<rect x="52" y="950" width="392" height="90" rx="10" fill="#ffffff" stroke="#aab8bf"/>
<text x="72" y="983" class="label" >Understanding</text>
<text x="72" y="1016" class="body" >What does this mean?</text>
<rect x="504" y="950" width="392" height="90" rx="10" fill="#ffffff" stroke="#aab8bf"/>
<text x="524" y="983" class="label" >Agreement</text>
<text x="524" y="1016" class="body" >Is the plan acceptable?</text>
<rect x="956" y="950" width="392" height="90" rx="10" fill="#ffffff" stroke="#aab8bf"/>
<text x="976" y="983" class="label" >Commitment</text>
<text x="976" y="1016" class="body" >Can I deliver it?</text>
<text x="52" y="1082" class="small muted" >Confirmation establishes an agreed interpretation; task completion still needs its own check.</text>
<text x="52" y="1113" class="small muted" >Fictional people and timing. This illustrates a communication repair, not a measured result or guaranteed outcome.</text>
</svg>