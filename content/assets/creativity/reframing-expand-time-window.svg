<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">The deadline sits within a wider sequence</title><desc id="desc">A timeline places changing expectations and urgent requests before a missed deadline. After it, anticipated criticism may delay the next warning. The expectation is marked as a hypothesis.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="720" height="470" fill="#ffffff"/><text x="24" y="101" text-anchor="start" class="small"><tspan x="24" dy="0">01</tspan></text><rect x="24" y="115" width="208" height="112" class="change"/><text x="128" y="154" text-anchor="middle" class=""><tspan x="128" dy="0">Before</tspan><tspan x="128" dy="23">Changed expectations</tspan><tspan x="128" dy="23">Two urgent requests</tspan></text><path d="M237 171L251 171" class="accent" marker-end="url(#arrow)"/><text x="256" y="101" text-anchor="start" class="small"><tspan x="256" dy="0">02</tspan></text><rect x="256" y="115" width="208" height="112" class="change"/><text x="360" y="165.5" text-anchor="middle" class=""><tspan x="360" dy="0">Visible event</tspan><tspan x="360" dy="23">Missed deadline</tspan></text><path d="M469 171L483 171" class="accent" marker-end="url(#arrow)"/><text x="488" y="101" text-anchor="start" class="small"><tspan x="488" dy="0">03</tspan></text><rect x="488" y="115" width="208" height="112" class="change"/><text x="592" y="131" text-anchor="middle" class=""><tspan x="592" dy="0">Anticipated</tspan><tspan x="592" dy="23">afterward</tspan><tspan x="592" dy="23">Criticism?</tspan><tspan x="592" dy="23">Delayed next</tspan><tspan x="592" dy="23">warning?</tspan></text><text x="24" y="312" text-anchor="start" class="muted"><tspan x="24" dy="0">The deadline remains a fact.</tspan><tspan x="24" dy="23">The surrounding sequence changes what to investigate.</tspan></text><text x="24" y="414" text-anchor="start" class="small"><tspan x="24" dy="0">Question marks mark hypotheses, not observed motives.</tspan></text></svg>
