<svg xmlns="http://www.w3.org/2000/svg" width="360" height="660" viewBox="0 0 360 660" role="img" aria-labelledby="title desc"><title id="title">The deadline sits within a wider sequence</title><desc id="desc">A timeline places changing expectations and urgent requests before a missed deadline. After it, anticipated criticism may delay the next warning. The expectation is marked as a hypothesis.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="360" height="660" fill="#ffffff"/><text x="22" y="26" text-anchor="start" class="small"><tspan x="22" dy="0">01</tspan></text><rect x="22" y="40" width="316" height="86" class="change"/><text x="180" y="66" text-anchor="middle" class=""><tspan x="180" dy="0">Before</tspan><tspan x="180" dy="23">Changed expectations</tspan><tspan x="180" dy="23">Two urgent requests</tspan></text><path d="M180 134L180 172" class="accent" marker-end="url(#arrow)"/><text x="22" y="166" text-anchor="start" class="small"><tspan x="22" dy="0">02</tspan></text><rect x="22" y="180" width="316" height="86" class="change"/><text x="180" y="217.5" text-anchor="middle" class=""><tspan x="180" dy="0">Visible event</tspan><tspan x="180" dy="23">Missed deadline</tspan></text><path d="M180 274L180 312" class="accent" marker-end="url(#arrow)"/><text x="22" y="306" text-anchor="start" class="small"><tspan x="22" dy="0">03</tspan></text><rect x="22" y="320" width="316" height="86" class="change"/><text x="180" y="346" text-anchor="middle" class=""><tspan x="180" dy="0">Anticipated afterward</tspan><tspan x="180" dy="23">Criticism?</tspan><tspan x="180" dy="23">Delayed next warning?</tspan></text><text x="22" y="536" text-anchor="start" class="muted"><tspan x="22" dy="0">Question marks mark hypotheses,</tspan><tspan x="22" dy="23">not observed motives.</tspan></text></svg>
