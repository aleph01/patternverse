<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">Return through a different route</title><desc id="desc">The room-booking website leads to the purpose of reliable access to suitable rooms. That purpose also leads to clearer descriptions, standing allocations, and drop-in space.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="720" height="470" fill="#ffffff"/><rect x="228" y="48" width="264" height="80" class="change"/><text x="360" y="82.5" text-anchor="middle" class=""><tspan x="360" dy="0">Reliable access to</tspan><tspan x="360" dy="23">suitable rooms</tspan></text><path d="M100 255L270 141" class="accent" marker-end="url(#arrow)"/><text x="24" y="175" text-anchor="start" class="small"><tspan x="24" dy="0">What does it enable?</tspan></text><rect x="24" y="268" width="152" height="90" class="context"/><text x="100" y="307.5" text-anchor="middle" class=""><tspan x="100" dy="0">Better booking</tspan><tspan x="100" dy="23">website</tspan></text><path d="M365 140L276 254" class="accent" marker-end="url(#arrow)"/><rect x="200" y="268" width="152" height="90" class="change"/><text x="276" y="307.5" text-anchor="middle" class=""><tspan x="276" dy="0">Clear room</tspan><tspan x="276" dy="23">descriptions</tspan></text><path d="M365 140L452 254" class="accent" marker-end="url(#arrow)"/><rect x="376" y="268" width="152" height="90" class="change"/><text x="452" y="307.5" text-anchor="middle" class=""><tspan x="452" dy="0">Standing</tspan><tspan x="452" dy="23">allocations</tspan></text><path d="M365 140L628 254" class="accent" marker-end="url(#arrow)"/><rect x="552" y="268" width="152" height="90" class="change"/><text x="628" y="307.5" text-anchor="middle" class=""><tspan x="628" dy="0">Drop-in</tspan><tspan x="628" dy="23">space</tspan></text><text x="24" y="414" text-anchor="start" class="muted"><tspan x="24" dy="0">Keep the purpose; reconsider the route.</tspan></text></svg>
