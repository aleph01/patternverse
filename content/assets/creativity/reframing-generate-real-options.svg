<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">Three vendors may still be one idea</title><desc id="desc">Vendor A, Vendor B, and an internal dashboard share the assumption of preserving a report. Other options question whether to simplify, partly automate, or retire the report.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="720" height="470" fill="#ffffff"/><text x="24" y="34" text-anchor="start" class="small"><tspan x="24" dy="0">Same premise / keep the report</tspan></text><rect x="24" y="49" width="324" height="360" class="context"/><rect x="44" y="80" width="284" height="74" class="context"/><text x="186" y="123" text-anchor="middle" class=""><tspan x="186" dy="0">Vendor A</tspan></text><rect x="44" y="180" width="284" height="74" class="context"/><text x="186" y="223" text-anchor="middle" class=""><tspan x="186" dy="0">Vendor B</tspan></text><rect x="44" y="280" width="284" height="74" class="context"/><text x="186" y="323" text-anchor="middle" class=""><tspan x="186" dy="0">Internal dashboard</tspan></text><text x="380" y="34" text-anchor="start" class="small"><tspan x="380" dy="0">Different accounts of the need</tspan></text><rect x="380" y="80" width="316" height="74" class="change"/><text x="538" y="123" text-anchor="middle" class=""><tspan x="538" dy="0">Simplify the report</tspan></text><rect x="380" y="180" width="316" height="74" class="change"/><text x="538" y="223" text-anchor="middle" class=""><tspan x="538" dy="0">Automate one repeated step</tspan></text><rect x="380" y="280" width="316" height="74" class="change"/><text x="538" y="323" text-anchor="middle" class=""><tspan x="538" dy="0">Retire an unused report</tspan></text><text x="24" y="447" text-anchor="start" class="small"><tspan x="24" dy="0">A longer list is not necessarily a wider search.</tspan></text></svg>
