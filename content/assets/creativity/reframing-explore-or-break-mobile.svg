<svg xmlns="http://www.w3.org/2000/svg" width="360" height="630" viewBox="0 0 360 630" role="img" aria-labelledby="title desc"><title id="title">Inspect the meeting or question its premise</title><desc id="desc">The concern that meetings run too long leads to two moves. Exploration inspects which agenda item expands; breaking the frame asks which decisions need a live meeting at all.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="360" height="630" fill="#ffffff"/><rect x="22" y="28" width="316" height="70" class="context"/><text x="180" y="69" text-anchor="middle" class=""><tspan x="180" dy="0">“Our meetings run too long.”</tspan></text><text x="22" y="152" text-anchor="start" class="small"><tspan x="22" dy="0">Explore / keep the premise</tspan></text><rect x="22" y="170" width="316" height="96" class="change"/><text x="180" y="212.5" text-anchor="middle" class=""><tspan x="180" dy="0">Which agenda item</tspan><tspan x="180" dy="23">expands unpredictably?</tspan></text><text x="22" y="328" text-anchor="start" class="small"><tspan x="22" dy="0">Break / question the premise</tspan></text><rect x="22" y="346" width="316" height="96" class="change"/><text x="180" y="388.5" text-anchor="middle" class=""><tspan x="180" dy="0">Which decisions need</tspan><tspan x="180" dy="23">a live meeting at all?</tspan></text><text x="22" y="508" text-anchor="start" class="muted"><tspan x="22" dy="0">Compare the evidence</tspan><tspan x="22" dy="23">each question would require.</tspan></text></svg>
