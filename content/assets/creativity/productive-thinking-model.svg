<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">A courtyard proposal can return to an earlier question</title><desc id="desc">Six thinking jobs connect the courtyard concern to a trial: understand use, describe success, frame a question, generate options, develop a proposal, and align resources. A dashed return from the storage question reopens development.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="720" height="470" fill="#ffffff"/><text x="24" y="60" text-anchor="start" class="small"><tspan x="24" dy="0">01 / Understand</tspan></text><rect x="24" y="78" width="208" height="86" class="context"/><text x="128" y="115.5" text-anchor="middle" class=""><tspan x="128" dy="0">Why is the courtyard</tspan><tspan x="128" dy="23">unused?</tspan></text><text x="256" y="60" text-anchor="start" class="small"><tspan x="256" dy="0">02 / Success</tspan></text><rect x="256" y="78" width="208" height="86" class="context"/><text x="360" y="104" text-anchor="middle" class=""><tspan x="360" dy="0">Comfort</tspan><tspan x="360" dy="23">access</tspan><tspan x="360" dy="23">upkeep</tspan></text><text x="488" y="60" text-anchor="start" class="small"><tspan x="488" dy="0">03 / Question</tspan></text><rect x="488" y="78" width="208" height="86" class="context"/><text x="592" y="115.5" text-anchor="middle" class=""><tspan x="592" dy="0">How can residents</tspan><tspan x="592" dy="23">spend time here?</tspan></text><text x="24" y="270" text-anchor="start" class="small"><tspan x="24" dy="0">04 / Generate</tspan></text><rect x="24" y="288" width="208" height="86" class="context"/><text x="128" y="314" text-anchor="middle" class=""><tspan x="128" dy="0">Seating</tspan><tspan x="128" dy="23">activity</tspan><tspan x="128" dy="23">planting</tspan></text><text x="256" y="270" text-anchor="start" class="small"><tspan x="256" dy="0">05 / Develop</tspan></text><rect x="256" y="288" width="208" height="86" class="change"/><text x="360" y="325.5" text-anchor="middle" class=""><tspan x="360" dy="0">Small seating</tspan><tspan x="360" dy="23">hosted trial</tspan></text><text x="488" y="270" text-anchor="start" class="small"><tspan x="488" dy="0">06 / Resources</tspan></text><rect x="488" y="288" width="208" height="86" class="change"/><text x="592" y="314" text-anchor="middle" class=""><tspan x="592" dy="0">Owner</tspan><tspan x="592" dy="23">storage</tspan><tspan x="592" dy="23">permission</tspan></text><path d="M236 121L251 121" class="accent" marker-end="url(#arrow)"/><path d="M468 121L483 121" class="accent" marker-end="url(#arrow)"/><path d="M696 164V237H128V276" class="accent"/><path d="M128 276V281" class="accent" marker-end="url(#arrow)"/><path d="M236 331L251 331" class="accent" marker-end="url(#arrow)"/><path d="M468 331L483 331" class="accent" marker-end="url(#arrow)"/><path d="M592 382V410H360V382" class="accent dashed" marker-end="url(#arrow)"/><text x="372" y="439" text-anchor="start" class="small"><tspan x="372" dy="0">No storage? Revisit development.</tspan></text></svg>
