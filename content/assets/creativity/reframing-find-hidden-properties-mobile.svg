<svg xmlns="http://www.w3.org/2000/svg" width="360" height="620" viewBox="0 0 360 620" role="img" aria-labelledby="title desc"><title id="title">The same crate has more than one useful property</title><desc id="desc">The same shipping crate is drawn as a storage container and as a possible raised display surface. The new use relies on its shape and stiffness and still requires a stability check.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="360" height="620" fill="#ffffff"/><text x="22" y="35" text-anchor="start" class="small"><tspan x="22" dy="0">Usual label / storage</tspan></text><rect x="108" y="78" width="144" height="94" class="context"/><path d="M108 101L252 101" class="line"/><path d="M108 125L252 125" class="line"/><path d="M108 149L252 149" class="line"/><path d="M130 78L130 172" class="line"/><path d="M230 78L230 172" class="line"/><rect x="138" y="56" width="38" height="22" class="paper"/><rect x="184" y="47" width="38" height="31" class="paper"/><text x="22" y="262" text-anchor="start" class="small"><tspan x="22" dy="0">Other property / raised surface</tspan></text><rect x="108" y="332" width="144" height="94" class="context"/><path d="M108 355L252 355" class="line"/><path d="M108 379L252 379" class="line"/><path d="M108 403L252 403" class="line"/><path d="M130 332L130 426" class="line"/><path d="M230 332L230 426" class="line"/><rect x="145" y="296" width="70" height="36" class="change"/><path d="M75 428L285 428" class="line"/><text x="22" y="499" text-anchor="start" class="muted"><tspan x="22" dy="0">Same object; another possible use.</tspan><tspan x="22" dy="23">Check strength and stability.</tspan></text></svg>
