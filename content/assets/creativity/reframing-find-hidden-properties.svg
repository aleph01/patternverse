<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">The same crate has more than one useful property</title><desc id="desc">The same shipping crate is drawn as a storage container and as a possible raised display surface. The new use relies on its shape and stiffness and still requires a stability check.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="720" height="470" fill="#ffffff"/><text x="24" y="49" text-anchor="start" class="small"><tspan x="24" dy="0">Usual label / storage</tspan></text><text x="388" y="49" text-anchor="start" class="small"><tspan x="388" dy="0">Other property / raised surface</tspan></text><rect x="112" y="153" width="144" height="94" class="context"/><path d="M112 176L256 176" class="line"/><path d="M112 200L256 200" class="line"/><path d="M112 224L256 224" class="line"/><path d="M134 153L134 247" class="line"/><path d="M234 153L234 247" class="line"/><rect x="140" y="130" width="38" height="23" class="paper"/><rect x="188" y="120" width="38" height="33" class="paper"/><rect x="464" y="153" width="144" height="94" class="context"/><path d="M464 176L608 176" class="line"/><path d="M464 200L608 200" class="line"/><path d="M464 224L608 224" class="line"/><path d="M486 153L486 247" class="line"/><path d="M586 153L586 247" class="line"/><rect x="501" y="117" width="70" height="36" class="change"/><path d="M80 251L288 251" class="line"/><path d="M432 251L640 251" class="line"/><path d="M302 200L405 200" class="accent" marker-end="url(#arrow)"/><text x="24" y="345" text-anchor="start" class="muted"><tspan x="24" dy="0">Describe what the crate can do, not only what it is called.</tspan><tspan x="24" dy="23">A possible use still needs a real-world check.</tspan></text></svg>
