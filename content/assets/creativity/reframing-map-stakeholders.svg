<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">A release includes more than developers</title><desc id="desc">A release is connected to developers implementing, a product owner changing scope, reviewers approving, support handling defects, and customers waiting. The labels describe roles rather than assign blame.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="720" height="470" fill="#ffffff"/><path d="M128 143L360 238" class="line"/><path d="M360 143L360 238" class="line"/><path d="M592 143L360 238" class="line"/><path d="M128 294L360 238" class="line"/><path d="M592 294L360 238" class="line"/><rect x="256" y="204" width="208" height="70" class="context"/><text x="360" y="245" text-anchor="middle" class=""><tspan x="360" dy="0">Release</tspan></text><rect x="24" y="48" width="208" height="90" class="context"/><text x="128" y="87.5" text-anchor="middle" class=""><tspan x="128" dy="0">Developers</tspan><tspan x="128" dy="23">Implement changes</tspan></text><rect x="256" y="48" width="208" height="90" class="change"/><text x="360" y="87.5" text-anchor="middle" class=""><tspan x="360" dy="0">Product owner</tspan><tspan x="360" dy="23">Changes scope</tspan></text><rect x="488" y="48" width="208" height="90" class="change"/><text x="592" y="87.5" text-anchor="middle" class=""><tspan x="592" dy="0">Reviewers</tspan><tspan x="592" dy="23">Approve releases</tspan></text><rect x="24" y="302" width="208" height="90" class="change"/><text x="128" y="341.5" text-anchor="middle" class=""><tspan x="128" dy="0">Support</tspan><tspan x="128" dy="23">Handles defects</tspan></text><rect x="488" y="302" width="208" height="90" class="change"/><text x="592" y="341.5" text-anchor="middle" class=""><tspan x="592" dy="0">Customers</tspan><tspan x="592" dy="23">Wait for capability</tspan></text><text x="24" y="447" text-anchor="start" class="small"><tspan x="24" dy="0">Connections indicate involvement, not a proven cause of delay.</tspan></text></svg>
