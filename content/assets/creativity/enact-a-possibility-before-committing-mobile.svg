<svg xmlns="http://www.w3.org/2000/svg" width="360" height="700" viewBox="0 0 360 700" role="img" aria-labelledby="title desc"><title id="title">Try a welcome desk before committing to the arrangement</title><desc id="desc">Two simplified event entrance plans compare one host dividing attention between a visitor, a list, and a waiting person with two roles: initial contact and booking lookup. A separate map and queue marker are added in the second scene.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="360" height="700" fill="#ffffff"/><text x="22" y="30" text-anchor="start" class="small"><tspan x="22" dy="0">First scene</tspan></text><rect x="22" y="47" width="316" height="235" class="context"/><rect x="46" y="107" width="268" height="40" class="paper"/><circle cx="150" cy="82" r="12" class="paper"/><text x="37" y="267" text-anchor="start" class="small"><tspan x="37" dy="0">Unclear waiting place</tspan></text><circle cx="180" cy="190" r="12" class="paper"/><circle cx="62" cy="225" r="12" class="paper"/><rect x="208" y="112" width="35" height="27" class="paper"/><path d="M150 96L180 174" class="line"/><path d="M150 96L226 109" class="line"/><path d="M150 96L62 209" class="line"/><text x="36" y="62" text-anchor="start" class="small"><tspan x="36" dy="0">One host</tspan></text><text x="22" y="333" text-anchor="start" class="small"><tspan x="22" dy="0">Revised scene</tspan></text><rect x="22" y="350" width="316" height="235" class="context"/><rect x="46" y="410" width="268" height="40" class="paper"/><circle cx="150" cy="385" r="12" class="change"/><text x="37" y="570" text-anchor="start" class="small"><tspan x="37" dy="0">Clear wait marker</tspan></text><circle cx="180" cy="493" r="12" class="paper"/><circle cx="62" cy="528" r="12" class="paper"/><rect x="208" y="415" width="35" height="27" class="paper"/><circle cx="235" cy="385" r="12" class="change"/><path d="M150 399L180 477" class="accent"/><path d="M235 399L226 412" class="accent"/><rect x="270" y="499" width="45" height="32" class="change"/><text x="270" y="547" text-anchor="start" class="small"><tspan x="270" dy="0">Map</tspan></text><path d="M47 547L84 547" class="accent"/><text x="36" y="365" text-anchor="start" class="small"><tspan x="36" dy="0">Contact</tspan></text><text x="213" y="365" text-anchor="start" class="small"><tspan x="213" dy="0">Lookup</tspan></text><text x="22" y="637" text-anchor="start" class="muted"><tspan x="22" dy="0">Circles indicate people; lines show attention.</tspan></text></svg>
