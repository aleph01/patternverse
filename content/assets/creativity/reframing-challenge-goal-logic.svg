<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">Check the arrows in a meeting plan</title><desc id="desc">The proposed chain links more meetings to better communication to fewer mistakes. Under each arrow is a question: are decisions recorded, and which mistakes involve missing information?</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="720" height="470" fill="#ffffff"/><rect x="24" y="90" width="192" height="92" class="context"/><text x="120" y="130.5" text-anchor="middle" class=""><tspan x="120" dy="0">More</tspan><tspan x="120" dy="23">meetings</tspan></text><path d="M232 136L249 136" class="accent dashed" marker-end="url(#arrow)"/><rect x="264" y="90" width="192" height="92" class="change"/><text x="360" y="130.5" text-anchor="middle" class=""><tspan x="360" dy="0">Better</tspan><tspan x="360" dy="23">communication</tspan></text><path d="M472 136L489 136" class="accent dashed" marker-end="url(#arrow)"/><rect x="504" y="90" width="192" height="92" class="context"/><text x="600" y="130.5" text-anchor="middle" class=""><tspan x="600" dy="0">Fewer</tspan><tspan x="600" dy="23">mistakes</tspan></text><path d="M240 164L240 244" class="line"/><path d="M480 164L480 244" class="line"/><text x="24" y="292" text-anchor="start" class=""><tspan x="24" dy="0">Are decisions recorded</tspan><tspan x="24" dy="23">and available when needed?</tspan></text><text x="388" y="292" text-anchor="start" class=""><tspan x="388" dy="0">Which mistakes involve</tspan><tspan x="388" dy="23">missing information?</tspan></text><text x="24" y="409" text-anchor="start" class="muted"><tspan x="24" dy="0">Dashed arrows are proposed links; check their conditions.</tspan></text></svg>
