<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img" aria-labelledby="title desc"><title id="title">One promotion can serve several purposes</title><desc id="desc">A promotion branches into income, responsibility, and recognition. Each branch points to a different possible purpose: financial security, consequential work, and feeling valued.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="360" height="650" fill="#ffffff"/><rect x="22" y="30" width="316" height="70" class="context"/><text x="180" y="71" text-anchor="middle" class=""><tspan x="180" dy="0">Get promoted</tspan></text><path d="M42 113L42 557" class="accent"/><path d="M42 176L75 176" class="accent" marker-end="url(#arrow)"/><rect x="87" y="137" width="251" height="88" class="change"/><text x="212.5" y="175.5" text-anchor="middle" class=""><tspan x="212.5" dy="0">Income</tspan><tspan x="212.5" dy="23">Financial security</tspan></text><path d="M42 331L75 331" class="accent" marker-end="url(#arrow)"/><rect x="87" y="292" width="251" height="88" class="change"/><text x="212.5" y="330.5" text-anchor="middle" class=""><tspan x="212.5" dy="0">Responsibility</tspan><tspan x="212.5" dy="23">Consequential work</tspan></text><path d="M42 486L75 486" class="accent" marker-end="url(#arrow)"/><rect x="87" y="447" width="251" height="88" class="change"/><text x="212.5" y="485.5" text-anchor="middle" class=""><tspan x="212.5" dy="0">Recognition</tspan><tspan x="212.5" dy="23">Feeling valued</tspan></text></svg>
