<svg xmlns="http://www.w3.org/2000/svg" width="360" height="680" viewBox="0 0 360 680" role="img" aria-labelledby="title desc"><title id="title">Three vendors may still be one idea</title><desc id="desc">Vendor A, Vendor B, and an internal dashboard share the assumption of preserving a report. Other options question whether to simplify, partly automate, or retire the report.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="360" height="680" fill="#ffffff"/><text x="22" y="30" text-anchor="start" class="small"><tspan x="22" dy="0">Same premise / keep the report</tspan></text><rect x="22" y="49" width="316" height="233" class="context"/><rect x="42" y="68" width="276" height="52" class="context"/><text x="180" y="100" text-anchor="middle" class=""><tspan x="180" dy="0">Vendor A</tspan></text><rect x="42" y="135" width="276" height="52" class="context"/><text x="180" y="167" text-anchor="middle" class=""><tspan x="180" dy="0">Vendor B</tspan></text><rect x="42" y="202" width="276" height="52" class="context"/><text x="180" y="234" text-anchor="middle" class=""><tspan x="180" dy="0">Internal dashboard</tspan></text><text x="22" y="332" text-anchor="start" class="small"><tspan x="22" dy="0">Different accounts of the need</tspan></text><rect x="22" y="352" width="316" height="75" class="change"/><text x="180" y="395.5" text-anchor="middle" class=""><tspan x="180" dy="0">Simplify the report</tspan></text><rect x="22" y="452" width="316" height="75" class="change"/><text x="180" y="495.5" text-anchor="middle" class=""><tspan x="180" dy="0">Automate one repeated step</tspan></text><rect x="22" y="552" width="316" height="75" class="change"/><text x="180" y="595.5" text-anchor="middle" class=""><tspan x="180" dy="0">Retire a report nobody uses</tspan></text></svg>
