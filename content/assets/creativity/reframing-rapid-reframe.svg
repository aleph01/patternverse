<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">The same backlog suggests different checks</title><desc id="desc">One concern, always being behind, branches into work arriving faster than it can finish and one request type blocking the rest. Each frame points to a different observation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="720" height="470" fill="#ffffff"/><rect x="212" y="28" width="296" height="68" class="context"/><text x="360" y="68" text-anchor="middle" class=""><tspan x="360" dy="0">“I am always behind.”</tspan></text><path d="M290 108L186 165" class="accent" marker-end="url(#arrow)"/><path d="M430 108L534 165" class="accent" marker-end="url(#arrow)"/><rect x="24" y="178" width="324" height="90" class="change"/><text x="186" y="217.5" text-anchor="middle" class=""><tspan x="186" dy="0">More work arrives</tspan><tspan x="186" dy="23">than can be completed</tspan></text><rect x="372" y="178" width="324" height="90" class="change"/><text x="534" y="217.5" text-anchor="middle" class=""><tspan x="534" dy="0">One request type</tspan><tspan x="534" dy="23">blocks the rest</tspan></text><path d="M186 280L186 316" class="accent" marker-end="url(#arrow)"/><path d="M534 280L534 316" class="accent" marker-end="url(#arrow)"/><rect x="24" y="330" width="324" height="78" class="context"/><text x="186" y="363.5" text-anchor="middle" class=""><tspan x="186" dy="0">Count incoming</tspan><tspan x="186" dy="23">and completed requests</tspan></text><rect x="372" y="330" width="324" height="78" class="context"/><text x="534" y="375" text-anchor="middle" class=""><tspan x="534" dy="0">Inspect waits by category</tspan></text><text x="24" y="447" text-anchor="start" class="small"><tspan x="24" dy="0">Frames propose different mechanisms; observations can change them.</tspan></text></svg>
