<svg xmlns="http://www.w3.org/2000/svg" width="360" height="680" viewBox="0 0 360 680" role="img" aria-labelledby="title desc"><title id="title">Check the arrows in a meeting plan</title><desc id="desc">The proposed chain links more meetings to better communication to fewer mistakes. Under each arrow is a question: are decisions recorded, and which mistakes involve missing information?</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="360" height="680" fill="#ffffff"/><rect x="22" y="28" width="316" height="70" class="context"/><text x="180" y="69" text-anchor="middle" class=""><tspan x="180" dy="0">More meetings</tspan></text><path d="M180 112L180 172" class="accent dashed" marker-end="url(#arrow)"/><text x="22" y="137" text-anchor="start" class="small"><tspan x="22" dy="0">Are decisions</tspan><tspan x="22" dy="23">recorded?</tspan></text><rect x="22" y="186" width="316" height="70" class="change"/><text x="180" y="227" text-anchor="middle" class=""><tspan x="180" dy="0">Better communication</tspan></text><path d="M180 270L180 330" class="accent dashed" marker-end="url(#arrow)"/><text x="22" y="295" text-anchor="start" class="small"><tspan x="22" dy="0">Which mistakes lack</tspan><tspan x="22" dy="23">information?</tspan></text><rect x="22" y="344" width="316" height="70" class="context"/><text x="180" y="385" text-anchor="middle" class=""><tspan x="180" dy="0">Fewer mistakes</tspan></text><text x="22" y="486" text-anchor="start" class="muted"><tspan x="22" dy="0">Dashed arrows are proposed links.</tspan><tspan x="22" dy="23">Each can hold only under</tspan><tspan x="22" dy="23">particular conditions.</tspan></text></svg>
