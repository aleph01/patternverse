<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">One promotion can serve several purposes</title><desc id="desc">A promotion branches into income, responsibility, and recognition. Each branch points to a different possible purpose: financial security, consequential work, and feeling valued.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="720" height="470" fill="#ffffff"/><rect x="232" y="34" width="256" height="72" class="context"/><text x="360" y="76" text-anchor="middle" class=""><tspan x="360" dy="0">Get promoted</tspan></text><path d="M360 119L128 212" class="accent" marker-end="url(#arrow)"/><rect x="24" y="226" width="208" height="102" class="change"/><text x="128" y="271.5" text-anchor="middle" class=""><tspan x="128" dy="0">Income</tspan><tspan x="128" dy="23">Financial security</tspan></text><path d="M360 119L360 212" class="accent" marker-end="url(#arrow)"/><rect x="256" y="226" width="208" height="102" class="change"/><text x="360" y="271.5" text-anchor="middle" class=""><tspan x="360" dy="0">Responsibility</tspan><tspan x="360" dy="23">Consequential work</tspan></text><path d="M360 119L592 212" class="accent" marker-end="url(#arrow)"/><rect x="488" y="226" width="208" height="102" class="change"/><text x="592" y="271.5" text-anchor="middle" class=""><tspan x="592" dy="0">Recognition</tspan><tspan x="592" dy="23">Feeling valued</tspan></text><text x="24" y="409" text-anchor="start" class="muted"><tspan x="24" dy="0">Ask what the target enables. Do not assume which branch matters most.</tspan></text></svg>
