<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">Try a welcome desk before committing to the arrangement</title><desc id="desc">Two simplified event entrance plans compare one host dividing attention between a visitor, a list, and a waiting person with two roles: initial contact and booking lookup. A separate map and queue marker are added in the second scene.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="720" height="470" fill="#ffffff"/><text x="24" y="34" text-anchor="start" class="small"><tspan x="24" dy="0">First scene / divided attention</tspan></text><rect x="24" y="54" width="324" height="235" class="context"/><rect x="48" y="114" width="276" height="40" class="paper"/><circle cx="156" cy="89" r="12" class="paper"/><text x="39" y="274" text-anchor="start" class="small"><tspan x="39" dy="0">Unclear waiting place</tspan></text><circle cx="186" cy="197" r="12" class="paper"/><circle cx="64" cy="232" r="12" class="paper"/><rect x="214" y="119" width="35" height="27" class="paper"/><path d="M156 103L186 181" class="line"/><path d="M156 103L232 116" class="line"/><path d="M156 103L64 216" class="line"/><text x="38" y="69" text-anchor="start" class="small"><tspan x="38" dy="0">One host</tspan></text><text x="372" y="34" text-anchor="start" class="small"><tspan x="372" dy="0">Revised scene / separate roles</tspan></text><rect x="372" y="54" width="324" height="235" class="context"/><rect x="396" y="114" width="276" height="40" class="paper"/><circle cx="504" cy="89" r="12" class="change"/><text x="387" y="274" text-anchor="start" class="small"><tspan x="387" dy="0">Clear wait marker</tspan></text><circle cx="534" cy="197" r="12" class="paper"/><circle cx="412" cy="232" r="12" class="paper"/><rect x="562" y="119" width="35" height="27" class="paper"/><circle cx="589" cy="89" r="12" class="change"/><path d="M504 103L534 181" class="accent"/><path d="M589 103L580 116" class="accent"/><rect x="628" y="203" width="45" height="32" class="change"/><text x="628" y="251" text-anchor="start" class="small"><tspan x="628" dy="0">Map</tspan></text><path d="M397 251L434 251" class="accent"/><text x="386" y="69" text-anchor="start" class="small"><tspan x="386" dy="0">Contact</tspan></text><text x="567" y="69" text-anchor="start" class="small"><tspan x="567" dy="0">Lookup</tspan></text><text x="24" y="353" text-anchor="start" class="muted"><tspan x="24" dy="0">A waiting marker and a separate map change the arrangement.</tspan><tspan x="24" dy="23">Try exceptions rather than rehearsing every difficulty away.</tspan></text><text x="24" y="432" text-anchor="start" class="small"><tspan x="24" dy="0">Circles indicate people; lines show attention.</tspan></text></svg>
