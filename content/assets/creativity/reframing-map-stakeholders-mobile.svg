<svg xmlns="http://www.w3.org/2000/svg" width="360" height="750" viewBox="0 0 360 750" role="img" aria-labelledby="title desc"><title id="title">A release includes more than developers</title><desc id="desc">A release is connected to developers implementing, a product owner changing scope, reviewers approving, support handling defects, and customers waiting. The labels describe roles rather than assign blame.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="360" height="750" fill="#ffffff"/><text x="22" y="25" text-anchor="start" class="small"><tspan x="22" dy="0">Whose role is missing from</tspan><tspan x="22" dy="23">“developers are delaying”?</tspan></text><path d="M40 66L40 686" class="line"/><path d="M40 104L75 104" class="line"/><rect x="87" y="67" width="251" height="86" class="context"/><text x="212.5" y="104.5" text-anchor="middle" class=""><tspan x="212.5" dy="0">Developers</tspan><tspan x="212.5" dy="23">Implement changes</tspan></text><path d="M40 240L75 240" class="line"/><rect x="87" y="203" width="251" height="86" class="change"/><text x="212.5" y="240.5" text-anchor="middle" class=""><tspan x="212.5" dy="0">Product owner</tspan><tspan x="212.5" dy="23">Changes scope</tspan></text><path d="M40 376L75 376" class="line"/><rect x="87" y="339" width="251" height="86" class="change"/><text x="212.5" y="376.5" text-anchor="middle" class=""><tspan x="212.5" dy="0">Reviewers</tspan><tspan x="212.5" dy="23">Approve releases</tspan></text><path d="M40 512L75 512" class="line"/><rect x="87" y="475" width="251" height="86" class="change"/><text x="212.5" y="512.5" text-anchor="middle" class=""><tspan x="212.5" dy="0">Support</tspan><tspan x="212.5" dy="23">Handles defects</tspan></text><path d="M40 648L75 648" class="line"/><rect x="87" y="611" width="251" height="86" class="change"/><text x="212.5" y="648.5" text-anchor="middle" class=""><tspan x="212.5" dy="0">Customers</tspan><tspan x="212.5" dy="23">Wait for capability</tspan></text></svg>
