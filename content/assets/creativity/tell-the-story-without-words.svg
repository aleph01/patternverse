<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">A drawing opens another interpretation</title><desc id="desc">A wordless drawing places one person between two blocks. A revised drawing shows people within both blocks and several possible connections. Tentative interpretations sit outside the drawings.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="720" height="470" fill="#ffffff"/><text x="24" y="34" text-anchor="start" class="small"><tspan x="24" dy="0">First drawing</tspan></text><rect x="24" y="54" width="324" height="200" class="paper"/><rect x="49" y="114" width="80" height="90" class="context"/><rect x="243" y="114" width="80" height="90" class="context"/><circle cx="186" cy="148" r="6" class="paper"/><path d="M186 155v18m-12-10h24m-12 10l-10 13m10-13 10 13" class="line"/><path d="M129 169L171 169" class="line"/><path d="M201 169L243 169" class="line"/><text x="372" y="34" text-anchor="start" class="small"><tspan x="372" dy="0">Revised drawing</tspan></text><rect x="372" y="54" width="324" height="200" class="paper"/><rect x="397" y="114" width="80" height="90" class="context"/><rect x="591" y="114" width="80" height="90" class="context"/><circle cx="438" cy="142" r="6" class="paper"/><path d="M438 149v18m-12-10h24m-12 10l-10 13m10-13 10 13" class="line"/><circle cx="630" cy="142" r="6" class="paper"/><path d="M630 149v18m-12-10h24m-12 10l-10 13m10-13 10 13" class="line"/><circle cx="534" cy="170" r="6" class="paper"/><path d="M534 177v18m-12-10h24m-12 10l-10 13m10-13 10 13" class="line"/><path d="M452 161L616 161" class="accent"/><path d="M452 178L521 196" class="accent"/><path d="M547 196L616 178" class="accent"/><text x="24" y="302" text-anchor="start" class="muted"><tspan x="24" dy="0">“One person seems to do</tspan><tspan x="24" dy="23">the connecting work.”</tspan></text><text x="372" y="302" text-anchor="start" class="muted"><tspan x="372" dy="0">“Who else could connect,</tspan><tspan x="372" dy="23">and what would support them?”</tspan></text><text x="24" y="415" text-anchor="start" class="small"><tspan x="24" dy="0">Interpretations are conversation starters, not hidden truths.</tspan></text></svg>
