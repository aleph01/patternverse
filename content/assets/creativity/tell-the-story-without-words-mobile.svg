<svg xmlns="http://www.w3.org/2000/svg" width="360" height="710" viewBox="0 0 360 710" role="img" aria-labelledby="title desc"><title id="title">A drawing opens another interpretation</title><desc id="desc">A wordless drawing places one person between two blocks. A revised drawing shows people within both blocks and several possible connections. Tentative interpretations sit outside the drawings.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="360" height="710" fill="#ffffff"/><text x="22" y="30" text-anchor="start" class="small"><tspan x="22" dy="0">First drawing</tspan></text><rect x="22" y="47" width="316" height="200" class="paper"/><rect x="47" y="107" width="80" height="90" class="context"/><rect x="233" y="107" width="80" height="90" class="context"/><circle cx="180" cy="141" r="6" class="paper"/><path d="M180 148v18m-12-10h24m-12 10l-10 13m10-13 10 13" class="line"/><path d="M127 162L165 162" class="line"/><path d="M195 162L233 162" class="line"/><text x="22" y="280" text-anchor="start" class="muted"><tspan x="22" dy="0">“One person seems to do</tspan><tspan x="22" dy="23">the connecting work.”</tspan></text><text x="22" y="371" text-anchor="start" class="small"><tspan x="22" dy="0">Revised drawing</tspan></text><rect x="22" y="388" width="316" height="200" class="paper"/><rect x="47" y="448" width="80" height="90" class="context"/><rect x="233" y="448" width="80" height="90" class="context"/><circle cx="88" cy="476" r="6" class="paper"/><path d="M88 483v18m-12-10h24m-12 10l-10 13m10-13 10 13" class="line"/><circle cx="272" cy="476" r="6" class="paper"/><path d="M272 483v18m-12-10h24m-12 10l-10 13m10-13 10 13" class="line"/><circle cx="180" cy="504" r="6" class="paper"/><path d="M180 511v18m-12-10h24m-12 10l-10 13m10-13 10 13" class="line"/><path d="M102 495L258 495" class="accent"/><path d="M102 512L167 530" class="accent"/><path d="M193 530L258 512" class="accent"/><text x="22" y="626" text-anchor="start" class="muted"><tspan x="22" dy="0">“Who else could connect,</tspan><tspan x="22" dy="23">and what would support them?”</tspan></text></svg>
