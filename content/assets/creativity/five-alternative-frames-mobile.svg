<svg xmlns="http://www.w3.org/2000/svg" width="360" height="805" viewBox="0 0 360 805" role="img" aria-labelledby="title desc"><title id="title">Five accounts of the same quiet reading group</title><desc id="desc">The same observation, few members speaking, is viewed through five possible frames: turn-taking, the opening question, discussion climate, the purpose of the gathering, and participation conditions. Each points to a different inquiry.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="360" height="805" fill="#ffffff"/><text x="22" y="28" text-anchor="start" class="muted"><tspan x="22" dy="0">Few members speak.</tspan><tspan x="22" dy="23">Current account: insufficient preparation.</tspan></text><rect x="22" y="117" width="316" height="102" class="change"/><text x="38" y="146" text-anchor="start" class=""><tspan x="38" dy="0">1 / Turn-taking</tspan></text><text x="38" y="179" text-anchor="start" class="muted"><tspan x="38" dy="0">Who gets a chance to enter?</tspan></text><rect x="22" y="247" width="316" height="102" class="change"/><text x="38" y="276" text-anchor="start" class=""><tspan x="38" dy="0">2 / Opening question</tspan></text><text x="38" y="309" text-anchor="start" class="muted"><tspan x="38" dy="0">Which prompts invite</tspan><tspan x="38" dy="23">a response?</tspan></text><rect x="22" y="377" width="316" height="102" class="change"/><text x="38" y="406" text-anchor="start" class=""><tspan x="38" dy="0">3 / Discussion climate</tspan></text><text x="38" y="439" text-anchor="start" class="muted"><tspan x="38" dy="0">Does speaking feel like a test?</tspan></text><rect x="22" y="507" width="316" height="102" class="change"/><text x="38" y="536" text-anchor="start" class=""><tspan x="38" dy="0">4 / Purpose of the gathering</tspan></text><text x="38" y="569" text-anchor="start" class="muted"><tspan x="38" dy="0">What makes the gathering</tspan><tspan x="38" dy="23">worthwhile?</tspan></text><rect x="22" y="637" width="316" height="102" class="change"/><text x="38" y="666" text-anchor="start" class=""><tspan x="38" dy="0">5 / Participation conditions</tspan></text><text x="38" y="699" text-anchor="start" class="muted"><tspan x="38" dy="0">Can people hear and attend?</tspan></text></svg>
