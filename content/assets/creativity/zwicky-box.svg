<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">Construct a different archive experience</title><desc id="desc">Three dimensions each offer two choices: setting, encounter, and contribution. Walking route, audio excerpts, and remembered places combine into a listening trail; the kitchen-table combination becomes a conversation pack.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="720" height="470" fill="#ffffff"/><text x="24" y="58" text-anchor="start" class="small"><tspan x="24" dy="0">Setting</tspan></text><rect x="24" y="74" width="208" height="52" class="change"/><text x="128" y="106" text-anchor="middle" class=""><tspan x="128" dy="0">Walking route</tspan></text><rect x="24" y="138" width="208" height="52" class="context"/><text x="128" y="170" text-anchor="middle" class=""><tspan x="128" dy="0">Kitchen table</tspan></text><text x="256" y="58" text-anchor="start" class="small"><tspan x="256" dy="0">Encounter</tspan></text><rect x="256" y="74" width="208" height="52" class="change"/><text x="360" y="106" text-anchor="middle" class=""><tspan x="360" dy="0">Audio excerpts</tspan></text><rect x="256" y="138" width="208" height="52" class="context"/><text x="360" y="170" text-anchor="middle" class=""><tspan x="360" dy="0">Printed exchange</tspan></text><text x="488" y="58" text-anchor="start" class="small"><tspan x="488" dy="0">Contribution</tspan></text><rect x="488" y="74" width="208" height="52" class="change"/><text x="592" y="106" text-anchor="middle" class=""><tspan x="592" dy="0">Remembered places</tspan></text><rect x="488" y="138" width="208" height="52" class="context"/><text x="592" y="170" text-anchor="middle" class=""><tspan x="592" dy="0">Questions</tspan></text><text x="24" y="256" text-anchor="start" class="small"><tspan x="24" dy="0">Two complete combinations</tspan></text><rect x="24" y="280" width="324" height="99" class="change"/><text x="186" y="324" text-anchor="middle" class=""><tspan x="186" dy="0">Listening trail</tspan><tspan x="186" dy="23">Route + audio + memories</tspan></text><rect x="372" y="280" width="324" height="99" class="context"/><text x="534" y="324" text-anchor="middle" class=""><tspan x="534" dy="0">Conversation pack</tspan><tspan x="534" dy="23">Table + print + questions</tspan></text><text x="24" y="427" text-anchor="start" class="muted"><tspan x="24" dy="0">Check permission, access, resources, and compatibility.</tspan></text></svg>
