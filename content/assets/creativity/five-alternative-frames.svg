<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">Five accounts of the same quiet reading group</title><desc id="desc">The same observation, few members speaking, is viewed through five possible frames: turn-taking, the opening question, discussion climate, the purpose of the gathering, and participation conditions. Each points to a different inquiry.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="720" height="470" fill="#ffffff"/><text x="24" y="30" text-anchor="start" class=""><tspan x="24" dy="0">Same observation: few members speak.</tspan></text><text x="24" y="60" text-anchor="start" class="small"><tspan x="24" dy="0">Current account: insufficient preparation</tspan></text><text x="24" y="93" text-anchor="start" class="small"><tspan x="24" dy="0">Alternative frame</tspan></text><text x="324" y="93" text-anchor="start" class="small"><tspan x="324" dy="0">A different inquiry</tspan></text><rect x="24" y="107" width="278" height="51" class="change"/><text x="163" y="138.5" text-anchor="middle" class=""><tspan x="163" dy="0">1 / Turn-taking</tspan></text><text x="324" y="138" text-anchor="start" class="muted"><tspan x="324" dy="0">Who gets a chance to enter?</tspan></text><rect x="24" y="168" width="278" height="51" class="change"/><text x="163" y="199.5" text-anchor="middle" class=""><tspan x="163" dy="0">2 / Opening question</tspan></text><text x="324" y="199" text-anchor="start" class="muted"><tspan x="324" dy="0">Which prompts invite a response?</tspan></text><rect x="24" y="229" width="278" height="51" class="change"/><text x="163" y="260.5" text-anchor="middle" class=""><tspan x="163" dy="0">3 / Discussion climate</tspan></text><text x="324" y="260" text-anchor="start" class="muted"><tspan x="324" dy="0">Does speaking feel like a test?</tspan></text><rect x="24" y="290" width="278" height="51" class="change"/><text x="163" y="321.5" text-anchor="middle" class=""><tspan x="163" dy="0">4 / Purpose of the gathering</tspan></text><text x="324" y="321" text-anchor="start" class="muted"><tspan x="324" dy="0">What makes the gathering worthwhile?</tspan></text><rect x="24" y="351" width="278" height="51" class="change"/><text x="163" y="382.5" text-anchor="middle" class=""><tspan x="163" dy="0">5 / Participation conditions</tspan></text><text x="324" y="382" text-anchor="start" class="muted"><tspan x="324" dy="0">Can people hear and attend?</tspan></text><text x="24" y="450" text-anchor="start" class="small"><tspan x="24" dy="0">Different questions, not established causes.</tspan></text></svg>
