<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" role="img" aria-labelledby="title desc"><title id="title">A courtyard proposal can return to an earlier question</title><desc id="desc">Six thinking jobs connect the courtyard concern to a trial: understand use, describe success, frame a question, generate options, develop a proposal, and align resources. A dashed return from the storage question reopens development.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="360" height="900" fill="#ffffff"/><text x="22" y="36" text-anchor="start" class="small"><tspan x="22" dy="0">01 / Understand</tspan></text><rect x="22" y="54" width="316" height="64" class="context"/><text x="180" y="92" text-anchor="middle" class=""><tspan x="180" dy="0">Why is the courtyard unused?</tspan></text><path d="M180 124L180 151" class="accent" marker-end="url(#arrow)"/><text x="22" y="160" text-anchor="start" class="small"><tspan x="22" dy="0">02 / Success</tspan></text><rect x="22" y="178" width="316" height="64" class="context"/><text x="180" y="216" text-anchor="middle" class=""><tspan x="180" dy="0">Comfort, access, upkeep</tspan></text><path d="M180 248L180 275" class="accent" marker-end="url(#arrow)"/><text x="22" y="284" text-anchor="start" class="small"><tspan x="22" dy="0">03 / Question</tspan></text><rect x="22" y="302" width="316" height="64" class="context"/><text x="180" y="328.5" text-anchor="middle" class=""><tspan x="180" dy="0">How can residents spend time</tspan><tspan x="180" dy="23">here?</tspan></text><path d="M180 372L180 399" class="accent" marker-end="url(#arrow)"/><text x="22" y="408" text-anchor="start" class="small"><tspan x="22" dy="0">04 / Generate</tspan></text><rect x="22" y="426" width="316" height="64" class="context"/><text x="180" y="464" text-anchor="middle" class=""><tspan x="180" dy="0">Seating, activity, planting</tspan></text><path d="M180 496L180 523" class="accent" marker-end="url(#arrow)"/><text x="22" y="532" text-anchor="start" class="small"><tspan x="22" dy="0">05 / Develop</tspan></text><rect x="22" y="550" width="316" height="64" class="change"/><text x="180" y="588" text-anchor="middle" class=""><tspan x="180" dy="0">Small seating + hosted trial</tspan></text><path d="M180 620L180 647" class="accent" marker-end="url(#arrow)"/><text x="22" y="656" text-anchor="start" class="small"><tspan x="22" dy="0">06 / Resources</tspan></text><rect x="22" y="674" width="316" height="64" class="change"/><text x="180" y="712" text-anchor="middle" class=""><tspan x="180" dy="0">Owner, storage, permission</tspan></text><path d="M22 706H12V582H22" class="accent dashed" marker-end="url(#arrow)"/><text x="50" y="808" text-anchor="start" class="muted"><tspan x="50" dy="0">No storage?</tspan><tspan x="50" dy="23">Revisit the proposal.</tspan></text></svg>
