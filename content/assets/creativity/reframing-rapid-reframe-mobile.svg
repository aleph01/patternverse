<svg xmlns="http://www.w3.org/2000/svg" width="360" height="680" viewBox="0 0 360 680" role="img" aria-labelledby="title desc"><title id="title">The same backlog suggests different checks</title><desc id="desc">One concern, always being behind, branches into work arriving faster than it can finish and one request type blocking the rest. Each frame points to a different observation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="360" height="680" fill="#ffffff"/><rect x="22" y="28" width="316" height="66" class="context"/><text x="180" y="67" text-anchor="middle" class=""><tspan x="180" dy="0">“I am always behind.”</tspan></text><path d="M180 106L180 146" class="accent" marker-end="url(#arrow)"/><rect x="22" y="160" width="316" height="84" class="change"/><text x="180" y="196.5" text-anchor="middle" class=""><tspan x="180" dy="0">More work arrives</tspan><tspan x="180" dy="23">than can be completed</tspan></text><path d="M180 257L180 291" class="accent" marker-end="url(#arrow)"/><rect x="22" y="305" width="316" height="70" class="context"/><text x="180" y="334.5" text-anchor="middle" class=""><tspan x="180" dy="0">Count incoming</tspan><tspan x="180" dy="23">and completed requests</tspan></text><text x="22" y="422" text-anchor="start" class="small"><tspan x="22" dy="0">Another frame for the same concern</tspan></text><rect x="22" y="441" width="316" height="78" class="change"/><text x="180" y="474.5" text-anchor="middle" class=""><tspan x="180" dy="0">One request type</tspan><tspan x="180" dy="23">blocks the rest</tspan></text><path d="M180 532L180 566" class="accent" marker-end="url(#arrow)"/><rect x="22" y="580" width="316" height="70" class="context"/><text x="180" y="621" text-anchor="middle" class=""><tspan x="180" dy="0">Inspect waits by category</tspan></text></svg>
