<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">Inspect the meeting or question its premise</title><desc id="desc">The concern that meetings run too long leads to two moves. Exploration inspects which agenda item expands; breaking the frame asks which decisions need a live meeting at all.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6aca3" stroke-width="1.5"/></marker></defs><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#252c28}.small{font-size:13px}.muted{font-size:16px}.line,.accent{fill:none;stroke:#a6aca3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#00855b}.dashed{stroke-dasharray:5 5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.paper{fill:#fff;stroke:#a6aca3;stroke-width:1}.change{fill:#edf5f0;stroke:#00855b;stroke-width:1.5}</style><rect width="720" height="470" fill="#ffffff"/><rect x="178" y="32" width="364" height="72" class="context"/><text x="360" y="74" text-anchor="middle" class=""><tspan x="360" dy="0">“Our meetings run too long.”</tspan></text><path d="M278 117L186 182" class="accent" marker-end="url(#arrow)"/><path d="M442 117L534 182" class="accent" marker-end="url(#arrow)"/><text x="24" y="216" text-anchor="start" class="small"><tspan x="24" dy="0">Explore / keep the premise</tspan></text><text x="372" y="216" text-anchor="start" class="small"><tspan x="372" dy="0">Break / question the premise</tspan></text><rect x="24" y="234" width="324" height="108" class="change"/><text x="186" y="282.5" text-anchor="middle" class=""><tspan x="186" dy="0">Which agenda item</tspan><tspan x="186" dy="23">expands unpredictably?</tspan></text><rect x="372" y="234" width="324" height="108" class="change"/><text x="534" y="282.5" text-anchor="middle" class=""><tspan x="534" dy="0">Which decisions need</tspan><tspan x="534" dy="23">a live meeting at all?</tspan></text><text x="24" y="409" text-anchor="start" class="muted"><tspan x="24" dy="0">Compare the evidence each question would require.</tspan></text></svg>
