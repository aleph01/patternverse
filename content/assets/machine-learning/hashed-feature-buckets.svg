<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">The same six channels in four and eight hash buckets</title><desc id="desc">Four buckets put social in zero, email in one, referral, direct and affiliate in two, and search in three. Eight buckets separate direct into two while referral and affiliate remain together in six. Three colliding pairs become one. The green fill and outline identify shared positions. Assignments are computed by the explorer's FNV-1a hash.</desc><rect width="720" height="590" fill="#fff"/><text x="20" y="44" font-size="24" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">4 buckets</text><text x="20" y="77" font-size="18" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">3 colliding pairs</text><text x="36" y="148" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><rect x="62" y="100" width="278" height="84" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="78" y="149" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">social</text><text x="36" y="232" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1</text><rect x="62" y="184" width="278" height="84" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="78" y="233" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">email</text><text x="36" y="316" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2</text><rect x="62" y="268" width="278" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.1"/><text x="78" y="295" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">referral</text><text x="78" y="317" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">direct</text><text x="78" y="339" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">affiliate</text><text x="36" y="400" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">3</text><rect x="62" y="352" width="278" height="84" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="78" y="401" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">search</text><text x="372" y="44" font-size="24" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">8 buckets</text><text x="372" y="77" font-size="18" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1 colliding pair</text><text x="388" y="127" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><rect x="414" y="100" width="278" height="42" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="430" y="128" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">—</text><text x="388" y="169" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1</text><rect x="414" y="142" width="278" height="42" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="430" y="170" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">email</text><text x="388" y="211" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2</text><rect x="414" y="184" width="278" height="42" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="430" y="212" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">direct</text><text x="388" y="253" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">3</text><rect x="414" y="226" width="278" height="42" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="430" y="254" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">search</text><text x="388" y="295" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">4</text><rect x="414" y="268" width="278" height="42" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="430" y="296" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">social</text><text x="388" y="337" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">5</text><rect x="414" y="310" width="278" height="42" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="430" y="338" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">—</text><text x="388" y="379" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">6</text><rect x="414" y="352" width="278" height="42" fill="#edf5f0" stroke="#00855b" stroke-width="1.1"/><text x="430" y="380" font-size="19" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">referral · affiliate</text><text x="388" y="421" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">7</text><rect x="414" y="394" width="278" height="42" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="430" y="422" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">—</text><text x="20" y="494" font-size="21" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same keys. Same hash. More positions separate some names.</text><text x="20" y="535" font-size="19" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Green marks shared positions; referral and affiliate still collide.</text><text x="20" y="570" font-size="17" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">FNV-1a over channel=name; bucket = hash modulo bucket count.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
