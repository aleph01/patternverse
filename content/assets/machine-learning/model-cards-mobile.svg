<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1360" viewBox="0 0 360 1360" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">A model card binds a release to evidence and use boundaries</title><desc id="desc">Fictional route-assist version 1.2 has 920 correct of 1,000 tickets, or 92 percent. Short tickets are 855 of 900, or 95 percent; long tickets are 65 of 100, or 65 percent. Evidence report E17 describes English queue suggestions confirmed by an agent. Long tickets require manual routing pending evaluation. Spanish is not evaluated; automatic case closure is outside intended use. Version 1.3 changes weights and the input limit and needs its own evidence. Documentation does not enforce restrictions or certify deployment.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1360" fill="#fff"/><text x="16" y="36" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A score needs</text><text x="16" y="70" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">a scope.</text><text x="16" y="103" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional model card · evidence and boundaries</text><rect x="16" y="125" width="328" height="125" fill="#f1f2ef" stroke="#a6aca3"/><text x="28" y="155" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">route-assist 1.2</text><text x="28" y="184" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Card revision 3 · owner: Support ML</text><text x="28" y="212" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fixed tokenizer · 128-token limit</text><text x="28" y="237" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Highest-scoring queue → agent confirmation</text><rect x="16" y="280" width="328" height="190" fill="#f1f2ef" stroke="#a6aca3"/><text x="28" y="310" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">The claim</text><text x="28" y="347" font-size="20" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">92% accuracy</text><text x="28" y="380" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Matched reviewer-assigned queues</text><text x="28" y="412" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">on English holdout tickets.</text><text x="28" y="444" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Evidence reference: E17</text><rect x="16" y="500" width="328" height="295" fill="#f1f2ef" stroke="#a6aca3"/><text x="28" y="530" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">The evidence</text><text x="28" y="557" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">E17 · one held-out ticket per customer</text><text x="28" y="590" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">All tickets</text><text x="332" text-anchor="end" y="590" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">92%</text><rect x="28" y="599" width="230" height="8" fill="#edf5f0"/><rect x="28" y="599" width="211.60000000000002" height="8" fill="#00855b"/><text x="28" y="625" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">920 / 1,000 correct</text><text x="28" y="658" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Short tickets</text><text x="332" text-anchor="end" y="658" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">95%</text><rect x="28" y="667" width="230" height="8" fill="#edf5f0"/><rect x="28" y="667" width="218.5" height="8" fill="#00855b"/><text x="28" y="693" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">855 / 900 correct</text><text x="28" y="726" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Long tickets</text><text x="332" text-anchor="end" y="726" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">65%</text><rect x="28" y="735" width="230" height="8" fill="#edf5f0"/><rect x="28" y="735" width="149.5" height="8" fill="#00855b"/><text x="28" y="761" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">65 / 100 correct</text><rect x="16" y="825" width="328" height="250" fill="#f1f2ef" stroke="#a6aca3"/><text x="28" y="855" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Boundaries travel with the score</text><text x="28" y="889" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Intended: English queue suggestions</text><text x="28" y="917" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">with agent confirmation.</text><text x="28" y="945" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Long tickets: route manually pending</text><text x="28" y="973" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">further evaluation.</text><text x="28" y="1001" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Spanish tickets: not evaluated.</text><text x="28" y="1029" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Automatic closure: outside intended use.</text><rect x="16" y="1105" width="328" height="150" fill="#fff" stroke="#a6aca3" stroke-dasharray="5 4"/><text x="28" y="1135" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">New release → new evidence</text><text x="28" y="1167" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1.3: new weights · 256-token limit</text><text x="28" y="1199" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Evaluation pending. E17 describes 1.2.</text><text x="28" y="1231" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Copying the card does not validate 1.3.</text><text x="16" y="1300" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional counts; observed point estimates.</text><text x="16" y="1328" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Documentation does not enforce restrictions.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
