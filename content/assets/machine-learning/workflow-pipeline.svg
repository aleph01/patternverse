<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Workflow Pipeline: dependencies determine eligibility</title><desc id="desc">Validate runs at minutes 0 to 2, Prepare 2 to 5 and Train 5 to 13. Evaluate 13 to 17 and Package 13 to 15 run in parallel. Release waits until both finish and runs 17 to 18 with a passing report. The run uses two execution slots and 20 task-minutes of work; durations are fictional.</desc><rect width="720" height="450" fill="#fff"/><g transform="translate(20,20)"><defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#a6aca3"/></marker></defs><rect width="680" height="410" fill="#fff"/><text x="0" y="24" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2 slots · 18 min elapsed</text><text x="0" y="48" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Each step occupies one slot.</text><path d="M96 210 H124" fill="none" stroke="#a6aca3" marker-end="url(#arrow)"/><path d="M220 210 H248" fill="none" stroke="#a6aca3" marker-end="url(#arrow)"/><path d="M344 210 H358 V118 H374" fill="none" stroke="#a6aca3" marker-end="url(#arrow)"/><path d="M358 210 V302 H374" fill="none" stroke="#a6aca3" marker-end="url(#arrow)"/><path d="M504 118 H526 V210 H550" fill="none" stroke="#a6aca3" marker-end="url(#arrow)"/><path d="M504 302 H526 V210 H550" fill="none" stroke="#a6aca3" marker-end="url(#arrow)"/><rect x="0" y="170" width="96" height="80" fill="#fff" stroke="#a6aca3"/><text x="8" y="193" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Validate</text><text x="8" y="215" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0–2 min</text><text x="8" y="236" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Complete</text><rect x="124" y="170" width="96" height="80" fill="#fff" stroke="#a6aca3"/><text x="132" y="193" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Prepare</text><text x="132" y="215" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2–5 min</text><text x="132" y="236" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Complete</text><rect x="248" y="170" width="96" height="80" fill="#fff" stroke="#a6aca3"/><text x="256" y="193" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Train</text><text x="256" y="215" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">5–13 min</text><text x="256" y="236" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Complete</text><rect x="374" y="78" width="130" height="80" fill="#fff" stroke="#a6aca3"/><text x="382" y="101" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Evaluate</text><text x="382" y="123" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">13–17 min</text><text x="382" y="144" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Report: pass</text><rect x="374" y="262" width="130" height="80" fill="#fff" stroke="#a6aca3"/><text x="382" y="285" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Package</text><text x="382" y="307" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">13–15 min</text><text x="382" y="328" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Complete</text><rect x="550" y="170" width="130" height="80" fill="#edf5f0" stroke="#a6aca3"/><text x="558" y="193" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Release</text><text x="558" y="215" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">17–18 min</text><text x="558" y="236" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Complete</text><text x="0" y="384" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Arrows show prerequisites; clocks show scheduled minutes.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
