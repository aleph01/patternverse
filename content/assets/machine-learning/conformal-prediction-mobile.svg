<svg xmlns="http://www.w3.org/2000/svg" width="360" height="930" viewBox="0 0 360 930" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">A finite-sample conformal rank determines an interval radius</title><desc id="desc">Nine sorted absolute residuals are one, two, two, three, four, four, five, seven, nine minutes. At a ninety-percent target, the corrected rank is nine, giving radius nine and interval thirty-one to forty-nine around a prediction of forty. Separate fictional evaluation covers nine of ten overall: eight of eight routine cases and one of two complex cases. The new-point outcome is unknown and no population guarantee is demonstrated by this example.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="930" fill="#fff"/><text x="16" y="34" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A corrected rank.</text><text x="16" y="67" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">An interval radius.</text><text x="16" y="98" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">90% target · nine calibration records.</text><svg x="16" y="120" width="328" height="441" viewBox="0 0 328 441"><title>Sort residuals, select a corrected rank, construct an interval</title><desc>The selected order statistic sets the interval radius. If the rank exceeds the sample count, the radius is infinite. The new-point outcome is unknown.</desc><text x="12" y="26" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Calibration errors · n = 9</text><rect x="8" y="42" width="94" height="52" fill="var(--panel, #f1f2ef)"/><text x="20" y="66" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">1</text><text x="20" y="86" font-size="12" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">rank 1</text><rect x="114" y="42" width="94" height="52" fill="var(--panel, #f1f2ef)"/><text x="126" y="66" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">2</text><text x="126" y="86" font-size="12" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">rank 2</text><rect x="220" y="42" width="94" height="52" fill="var(--panel, #f1f2ef)"/><text x="232" y="66" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">2</text><text x="232" y="86" font-size="12" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">rank 3</text><rect x="8" y="104" width="94" height="52" fill="var(--panel, #f1f2ef)"/><text x="20" y="128" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">3</text><text x="20" y="148" font-size="12" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">rank 4</text><rect x="114" y="104" width="94" height="52" fill="var(--panel, #f1f2ef)"/><text x="126" y="128" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">4</text><text x="126" y="148" font-size="12" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">rank 5</text><rect x="220" y="104" width="94" height="52" fill="var(--panel, #f1f2ef)"/><text x="232" y="128" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">4</text><text x="232" y="148" font-size="12" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">rank 6</text><rect x="8" y="166" width="94" height="52" fill="var(--panel, #f1f2ef)"/><text x="20" y="190" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">5</text><text x="20" y="210" font-size="12" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">rank 7</text><rect x="114" y="166" width="94" height="52" fill="var(--panel, #f1f2ef)"/><text x="126" y="190" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">7</text><text x="126" y="210" font-size="12" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">rank 8</text><rect x="220" y="166" width="94" height="52" fill="var(--band, #edf5f0)"/><text x="232" y="190" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">9</text><text x="232" y="210" font-size="12" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">rank 9</text><text x="12" y="246" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">k = ceil(10 × 90 / 100) = 9</text><text x="12" y="273" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">q = 9 minutes</text><rect x="0" y="301" width="328" height="128" fill="var(--panel, #f1f2ef)"/><text x="12" y="329" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">New point prediction: 40 min</text><text x="12" y="360" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">[31, 49] minutes</text><text x="12" y="388" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Interval width: 18 minutes</text><text x="12" y="414" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Outcome unknown · excluded from evaluation</text></svg><rect x="16" y="600" width="328" height="155" fill="#f1f2ef"/><text x="28" y="629" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Separate evaluation · 10 cases</text><text x="28" y="660" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">All: 9/10 (90%)</text><text x="28" y="689" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Routine: 8/8 (100%)</text><text x="28" y="718" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Complex: 1/2 (50%)</text><text x="16" y="804" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Overall coverage can hide subgroup misses.</text><text x="16" y="835" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">The new point has no observed outcome.</text><text x="16" y="878" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional data; exchangeability is assumed</text><text x="16" y="903" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">by the theorem, not proved by this example.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
