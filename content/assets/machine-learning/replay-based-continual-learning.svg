<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1310" viewBox="0 0 720 1310" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Replay stored examples to counter forgetting during new updates</title><desc id="desc">Four frozen memory records A3, A4, B3, B4 accompany twelve updates on new cohort C. A three-weight linear model starts at one, minus one, zero. Current and memory mean gradients receive equal weight at learning rate 0.25. Old mean squared error ends at 0.0619 and new error at 0.0079. The matched current-only control has step size 0.125 and old error 0.1103. The plot shows old and new replay errors and old error for this matched control. These are deterministic fixture errors without held-out evaluation.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="1310" fill="#fff"/><text x="20" y="42" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Keep old examples in the learning loop.</text><text x="20" y="82" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Old A (1,0,0) → 1; old B (0,1,0) → −1; new C (1,1,1) → 1.</text><svg x="20" y="125" width="680" height="860" viewBox="0 0 680 860"><title id="diagram-title">A frozen historical memory changes the new update trajectory</title><desc id="diagram-desc">Computed memory contents, weighted gradient mechanism, model weights, old and new mean squared errors, and a current-only control with the same new-data step size.</desc><rect x="0" y="0" width="680" height="132" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="29" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Historical memory: 4 records</text><text x="14" y="60" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A: 2 slots; B: 2 slots</text><text x="14" y="89" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A3 · A4 · B3 · B4</text><text x="14" y="117" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Current C = (1, 1, 1), target 1. Buffer frozen during C.</text><text x="333" y="154" font-size="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">↓</text><rect x="0" y="162" width="680" height="120" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="191" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Weighted gradient update</text><text x="14" y="222" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">g = 0.5 × gnew + 0.5 × gmemory</text><text x="14" y="253" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">w ← w − 0.25 × g</text><text x="0" y="329" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Update 12 of 12</text><text x="0" y="358" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weights (1.2487, -0.7513, 0.4138)</text><text x="0" y="380" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Mean squared error</text><line x1="65" y1="627" x2="635" y2="627" stroke="#a6aca3"/><text x="0" y="631" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.0</text><line x1="65" y1="512" x2="635" y2="512" stroke="#a6aca3"/><text x="0" y="516" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.5</text><line x1="65" y1="397" x2="635" y2="397" stroke="#a6aca3"/><text x="0" y="401" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1.0</text><text x="62" y="650" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><text x="347" y="650" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">6</text><text x="632" y="650" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">12</text><path d="M 65 627 L 112.5 623.40625 L 160 618.2261962890625 L 207.5 614.4183106422424 L 255 612.154444584623 L 302.5 611.0210764136646 L 350 610.6098739820933 L 397.5 610.629960015068 L 445 610.896103075782 L 492.5 611.2963705934341 L 540 611.7650311278832 L 587.5 612.2641791345835 L 635 612.7722691005721" fill="none" stroke="#00855b" stroke-width="3"/><path d="M 65 397 L 112.5 537.15625 L 160 589.041015625 L 207.5 609.1836948394775 L 255 617.5045500770211 L 302.5 621.2037409091427 L 350 622.9824431707244 L 397.5 623.9066251685019 L 445 624.4239802570354 L 492.5 624.7357432704428 L 540 624.9384409538038 L 587.5 625.0809906789123 L 635 625.189245568734" fill="none" stroke="#252c28" stroke-width="2.5" stroke-dasharray="8 5"/><path d="M 65 627 L 112.5 623.40625 L 160 617.51025390625 L 207.5 612.3995132446289 L 255 608.6483694314957 L 302.5 606.0863534156233 L 350 604.4001124945062 L 397.5 603.3130162503717 L 445 602.6206140398047 L 492.5 602.1827974011758 L 540 601.9071833860074 L 587.5 601.7341517296423 L 635 601.6257050315686" fill="none" stroke="#626962" stroke-width="2.5" stroke-dasharray="2 5"/><line x1="635" y1="397" x2="635" y2="627" stroke="#626962" stroke-dasharray="3 4"/><circle cx="635" cy="612.7722691005721" r="4" fill="#252c28"/><circle cx="635" cy="625.189245568734" r="4" fill="#252c28"/><text x="315" y="670" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">C updates</text><text x="0" y="704" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Solid: old MSE · replay</text><text x="0" y="729" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Dashed: new MSE · replay</text><text x="0" y="754" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Dotted: old MSE · matched current-only</text><text x="0" y="793" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Old 0.0619; new 0.0079</text><text x="0" y="822" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Control old 0.1103</text><text x="0" y="843" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Training-fixture errors; no held-out estimate.</text></svg><rect x="20" y="1020" width="680" height="200" fill="#f1f2ef"/><text x="32" y="1050" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">After the same twelve C updates</text><text x="32" y="1086" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Current only (step 0.25): old 0.1111; new below 10⁻¹²</text><text x="32" y="1123" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Matched current only (step 0.125): old 0.1103; new 0.0000126</text><text x="32" y="1160" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Replay (ρ = 0.5, step 0.25): old 0.0619; new 0.0079</text><text x="32" y="1197" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Corrective memory feedback reduces old error beyond slowing the new update.</text><text x="20" y="1280" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Four frozen memory slots, equal A/B quotas. All errors describe the teaching fixture.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
