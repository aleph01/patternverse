<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Explainable Predictions: reference and contributions reconstruct an estimate</title><desc id="desc">A fixed model predicts twenty-four minutes for a five-kilometre rush-hour trip. A short off-peak reference gives a fourteen-minute baseline; distance adds six attributed minutes and rush hour adds four. These are model attributions under the declared reference rule, not real-world causal effects.</desc><rect width="360" height="780" fill="#fff"/><g transform="translate(16,20)"><rect width="328" height="740" fill="#fff"/><text x="0" y="25" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="23" text-anchor="start">Explain the trip estimate</text><text x="0" y="55" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="start">5 km · rush hour · reference S</text><text x="0" y="91" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="start">Output minutes</text><line x1="12" y1="121" x2="300" y2="121" stroke="#a6aca3"/><line x1="12" y1="116" x2="12" y2="126" stroke="#a6aca3"/><text x="12" y="111" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="middle">0</text><line x1="84" y1="116" x2="84" y2="126" stroke="#a6aca3"/><text x="84" y="111" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="middle">8</text><line x1="156" y1="116" x2="156" y2="126" stroke="#a6aca3"/><text x="156" y="111" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="middle">16</text><line x1="228" y1="116" x2="228" y2="126" stroke="#a6aca3"/><text x="228" y="111" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="middle">24</text><line x1="300" y1="116" x2="300" y2="126" stroke="#a6aca3"/><text x="300" y="111" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="middle">32</text><text x="0" y="155" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="19" text-anchor="start">Reference 14 min</text><rect x="12" y="170" width="126" height="18" fill="#f1f2ef" stroke="#a6aca3"/><line x1="138" y1="188" x2="138" y2="235" stroke="#a6aca3" stroke-dasharray="3 4"/><line x1="138" y1="266" x2="138" y2="275" stroke="#a6aca3" stroke-dasharray="3 4"/><text x="0" y="260" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="19" text-anchor="start">Distance +6 min</text><rect x="138" y="275" width="54" height="18" fill="#00855b" stroke="#00855b"/><line x1="192" y1="293" x2="192" y2="340" stroke="#a6aca3" stroke-dasharray="3 4"/><line x1="192" y1="371" x2="192" y2="380" stroke="#a6aca3" stroke-dasharray="3 4"/><text x="0" y="365" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="19" text-anchor="start">Rush hour +4 min</text><rect x="192" y="380" width="36" height="18" fill="#00855b" stroke="#00855b"/><line x1="228" y1="398" x2="228" y2="445" stroke="#a6aca3" stroke-dasharray="3 4"/><line x1="228" y1="476" x2="228" y2="485" stroke="#a6aca3" stroke-dasharray="3 4"/><text x="0" y="470" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="19" text-anchor="start">Prediction 24 min</text><rect x="12" y="485" width="216" height="18" fill="#f1f2ef" stroke="#a6aca3"/><text x="0" y="562" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="22" text-anchor="start">14 + 6 + 4 = 24 min</text><text x="0" y="606" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="start">Mean distance: 2 km</text><text x="0" y="633" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="start">Mean rush indicator: 0</text><text x="0" y="682" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="start">Green adds minutes</text><text x="0" y="710" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="start">Dark gray removes minutes</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
