<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Feature Store: shared meaning and different cutoffs</title><desc id="desc">Definition v1 counts available orders over sixty minutes. Historical retrieval at 09:40 gives seven orders. At serving time 10:05, the online copy published at 10:00 contains twelve orders and is five minutes old; recomputing from the source at 10:05 gives twenty. Values are computed from fictional events.</desc><rect width="360" height="780" fill="#fff"/><g transform="translate(16,20)"><defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#a6aca3"/></marker></defs><rect width="328" height="740" fill="#fff"/><text x="0" y="24" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Shared definition v1</text><text x="0" y="50" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Count available orders over 60 min</text><text x="0" y="75" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same logic; different cutoffs.</text><path d="M164 86 H4 V191 H18" fill="none" stroke="#a6aca3" marker-end="url(#arrow)"/><path d="M4 191 V387 H18" fill="none" stroke="#a6aca3" marker-end="url(#arrow)"/><rect x="18" y="120" width="310" height="142" fill="#f1f2ef" stroke="#a6aca3"/><text x="30" y="148" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Historical retrieval</text><text x="30" y="178" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Decision 09:40</text><text x="30" y="219" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">4 + 3 = 7</text><text x="30" y="247" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Window 60 min</text><rect x="18" y="310" width="310" height="155" fill="#edf5f0" stroke="#a6aca3"/><text x="30" y="338" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Online snapshot</text><text x="30" y="368" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Published 10:00</text><text x="30" y="409" font-size="24" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">4 + 3 + 5 = 12</text><text x="30" y="437" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Age 5 min at 10:05</text><text x="18" y="496" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Ready for M1</text><text x="0" y="536" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fresh at 10:05 · 20 orders</text><text x="0" y="574" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Online · 12</text><rect x="116" y="562" width="190" height="12" fill="#f1f2ef"/><rect x="116" y="562" width="114" height="12" fill="#00855b"/><text x="0" y="618" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fresh · 20</text><rect x="116" y="606" width="190" height="12" fill="#f1f2ef"/><rect x="116" y="606" width="190" height="12" fill="#626962"/><text x="0" y="684" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Freshness is a consumer policy.</text><text x="0" y="707" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Counts are inputs, not predictions.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
