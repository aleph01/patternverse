<svg xmlns="http://www.w3.org/2000/svg" width="360" height="820" viewBox="0 0 360 820" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Heuristic benchmark: compare the same deliveries</title><desc id="desc">At the default threshold and assigned penalties, the rule gets 17 of 20 right and costs 7 units. The candidate gets 18 right but costs 10 units. Each missed late delivery costs five units; each false alert costs one.</desc><rect width="360" height="820" fill="#fff"/><text x="16" y="28" font-size="25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">More correct.</text><text x="16" y="59" font-size="25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">More costly.</text><g transform="translate(16,88)"><title id="comparison-title">Same deliveries, different error costs</title><desc id="comparison-desc">The reference gets 17 of 20 right, misses 1 late deliveries, and costs 7 assigned units. The candidate gets 18 right, misses 2, and costs 10 assigned units. Gray bars count false-alert cost and green bars count missed-delivery cost.</desc><rect width="328" height="710" fill="#fff"/><text x="0" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="24" fill="#252c28">Compare the error types</text><text x="0" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#252c28">20 deliveries · 4 late · same prediction time</text><text x="0" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#252c28">Rule benchmark</text><text x="0" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#252c28">17/20 correct · 85%</text><text x="0" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" fill="#252c28">1 late missed</text><text x="0" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" fill="#252c28">2 false alerts</text><line x1="0" y1="244" x2="280" y2="244" stroke="#a6aca3" stroke-width="1"/><rect x="0" y="220" width="56" height="24" fill="#8c938b"/><rect x="56" y="220" width="140" height="24" fill="#00855b"/><text x="0" y="277" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="23" fill="#252c28">7 cost units</text><text x="0" y="305" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#252c28">1 × 5 + 2 × 1 = 7</text><text x="0" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#252c28">Candidate · score ≥ 0.50</text><text x="0" y="408" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#252c28">18/20 correct · 90%</text><text x="0" y="438" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" fill="#252c28">2 late missed</text><text x="0" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" fill="#252c28">0 false alerts</text><line x1="0" y1="514" x2="280" y2="514" stroke="#a6aca3" stroke-width="1"/><rect x="0" y="490" width="280" height="24" fill="#00855b"/><text x="0" y="547" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="23" fill="#252c28">10 cost units</text><text x="0" y="575" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#252c28">2 × 5 + 0 × 1 = 10</text><rect x="0" y="607" width="14" height="14" fill="#8c938b"/><text x="24" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#252c28">False-alert cost</text><rect x="0" y="636" width="14" height="14" fill="#00855b"/><text x="24" y="649" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#252c28">Missed-delivery cost</text><text x="0" y="682" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#252c28">Shared bar scale: 0–10 cost units.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
