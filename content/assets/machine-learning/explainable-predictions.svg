<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Explainable Predictions: reference and contributions reconstruct an estimate</title><desc id="desc">A fixed model predicts twenty-four minutes for a five-kilometre rush-hour trip. A short off-peak reference gives a fourteen-minute baseline; distance adds six attributed minutes and rush hour adds four. These are model attributions under the declared reference rule, not real-world causal effects.</desc><rect width="720" height="580" fill="#fff"/><g transform="translate(20,20)"><rect width="680" height="540" fill="#fff"/><text x="0" y="25" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="25" text-anchor="start">Explain the trip estimate</text><text x="0" y="55" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="start">5 km · rush hour · reference S</text><text x="0" y="117" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="start">Minutes</text><line x1="45" y1="400" x2="650" y2="400" stroke="#e2e5df"/><text x="30" y="405" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="end">0</text><line x1="45" y1="337.5" x2="650" y2="337.5" stroke="#e2e5df"/><text x="30" y="342.5" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="end">8</text><line x1="45" y1="275" x2="650" y2="275" stroke="#e2e5df"/><text x="30" y="280" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="end">16</text><line x1="45" y1="212.5" x2="650" y2="212.5" stroke="#e2e5df"/><text x="30" y="217.5" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="end">24</text><line x1="45" y1="150" x2="650" y2="150" stroke="#e2e5df"/><text x="30" y="155" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="end">32</text><rect x="80" y="290.625" width="80" height="109.375" fill="#f1f2ef" stroke="#a6aca3"/><text x="120" y="279.625" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="19" text-anchor="middle">14</text><text x="120" y="427" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="middle">Reference</text><line x1="160" y1="290.625" x2="230" y2="290.625" stroke="#a6aca3" stroke-dasharray="3 4"/><rect x="230" y="243.75" width="80" height="46.875" fill="#00855b" stroke="#00855b"/><text x="270" y="232.75" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="19" text-anchor="middle">+6</text><text x="270" y="427" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="middle">Distance</text><line x1="310" y1="243.75" x2="380" y2="243.75" stroke="#a6aca3" stroke-dasharray="3 4"/><rect x="380" y="212.5" width="80" height="31.25" fill="#00855b" stroke="#00855b"/><text x="420" y="201.5" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="19" text-anchor="middle">+4</text><text x="420" y="427" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="middle">Rush hour</text><line x1="460" y1="212.5" x2="530" y2="212.5" stroke="#a6aca3" stroke-dasharray="3 4"/><rect x="530" y="212.5" width="80" height="187.5" fill="#f1f2ef" stroke="#a6aca3"/><text x="570" y="201.5" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="19" text-anchor="middle">24</text><text x="570" y="427" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="middle">Prediction</text><text x="0" y="462" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="start">Green adds minutes · dark gray removes minutes</text><text x="0" y="493" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="start">Reference mean: 2 km · rush indicator 0</text><text x="0" y="529" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="22" text-anchor="start">14 + 6 + 4 = 24 min</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
