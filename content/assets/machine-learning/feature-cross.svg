<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Feature Cross: one weather effect or a pair-specific adjustment</title><desc id="desc">Two fits use the same fictional trip cells: bike dry twenty, bike wet forty, car dry thirty and car wet thirty-five minutes. Separate indicators fit one twelve-and-a-half-minute wet effect for both vehicles. Adding car times wet fits twenty minutes for bikes and five for cars, with a minus-fifteen-minute interaction coefficient. Four crossed coefficients fit four supplied cells; this is not evidence of generalization.</desc><rect width="720" height="530" fill="#fff"/><g transform="translate(20,20)"><rect width="680" height="490" fill="#fff"/><text x="0" y="24" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fits on the same synthetic cells · minutes</text><text x="0" y="49" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Green marks the inspected pair.</text><text x="0" y="84" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Separate indicators</text><text x="90" y="119" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Dry</text><text x="212" y="119" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Wet</text><text x="0" y="164" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Bike</text><rect x="74" y="134" width="118" height="78" fill="#fff" stroke="#a6aca3"/><text x="84" y="165" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">23.75</text><text x="84" y="194" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target 20</text><rect x="196" y="134" width="118" height="78" fill="#fff" stroke="#a6aca3"/><text x="206" y="165" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">36.25</text><text x="206" y="194" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target 40</text><text x="0" y="258" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Car</text><rect x="74" y="228" width="118" height="78" fill="#fff" stroke="#a6aca3"/><text x="84" y="259" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">26.25</text><text x="84" y="288" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target 30</text><rect x="196" y="228" width="118" height="78" fill="#edf5f0" stroke="#00855b"/><text x="206" y="259" font-size="24" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">38.75</text><text x="206" y="288" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target 35</text><text x="0" y="338" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Bike wet change: 12.5 min</text><text x="0" y="364" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Car wet change: 12.5 min</text><text x="350" y="84" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Add car × wet</text><text x="440" y="119" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Dry</text><text x="562" y="119" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Wet</text><text x="350" y="164" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Bike</text><rect x="424" y="134" width="118" height="78" fill="#fff" stroke="#a6aca3"/><text x="434" y="165" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">20</text><text x="434" y="194" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target 20</text><rect x="546" y="134" width="118" height="78" fill="#fff" stroke="#a6aca3"/><text x="556" y="165" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">40</text><text x="556" y="194" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target 40</text><text x="350" y="258" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Car</text><rect x="424" y="228" width="118" height="78" fill="#fff" stroke="#a6aca3"/><text x="434" y="259" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">30</text><text x="434" y="288" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target 30</text><rect x="546" y="228" width="118" height="78" fill="#edf5f0" stroke="#00855b"/><text x="556" y="259" font-size="24" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">35</text><text x="556" y="288" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target 35</text><text x="350" y="338" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Bike wet change: 20 min</text><text x="350" y="364" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Car wet change: 5 min</text><text x="0" y="418" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Inspected Car + wet · c × w = 1</text><text x="0" y="447" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Cross coefficient: -15 min</text><text x="0" y="477" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Four crossed coefficients fit four cells; held-out evidence is still needed.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
