<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1530" viewBox="0 0 360 1530" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Three training objectives trade sample-average loss against worst-group loss</title><desc id="desc">A fictional constant predictor 5 plus theta fits 90 routine requests at five minutes and ten older-channel requests split between six and eight minutes. Average loss chooses theta 0.20, equal group weighting 1, and worst-group loss 1.25. The worst-group fit predicts 6.25 minutes and gives both groups MSE 1.5625, compared with ERM mean MSE 0.46 and worst MSE 4.24. Curves show the two group mean squared losses and their maximum; the selected dot lies at the exact minimax solution. Mixture projections reweight these training losses and are not measured deployment results.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1530" fill="#fff"/><text x="16" y="35" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Fit the weakest group.</text><text x="16" y="70" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">See the average cost.</text><text x="16" y="103" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional records; exact scalar fits.</text><svg x="16" y="125" width="328" height="1080" viewBox="0 0 328 1080"><title id="flow-title">Three objectives choose different points on the same group-loss curves</title><desc id="flow-desc">Cards report each fitted prediction, sample mean loss, worst-group loss, and a hypothetical mixture projection. Dashed grey and solid green curves are group A and B mean squared losses. The dotted dark curve is their maximum. A vertical marker locates the selected fitted model on that upper envelope.</desc><rect x="0" y="0" width="328" height="190" fill="#f1f2ef" stroke="#00855b" stroke-width="1"/><text x="12" y="29" font-size="17" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Mean loss (ERM)</text><text x="12" y="65" font-size="15" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Prediction: 5.20 min</text><text x="12" y="95" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Sample mean: 0.4600</text><text x="12" y="124" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Worst group: 4.2400</text><text x="12" y="153" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Projected mean: 3.4000</text><text x="12" y="178" font-size="12" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same records; different objective</text><rect x="0" y="210" width="328" height="190" fill="#f1f2ef" stroke="#00855b" stroke-width="1"/><text x="12" y="239" font-size="17" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Equal-group weight</text><text x="12" y="275" font-size="15" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Prediction: 6.00 min</text><text x="12" y="305" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Sample mean: 1.1000</text><text x="12" y="334" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Worst group: 2.0000</text><text x="12" y="363" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Projected mean: 1.8000</text><text x="12" y="388" font-size="12" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same records; different objective</text><rect x="0" y="420" width="328" height="190" fill="#f1f2ef" stroke="#00855b" stroke-width="3"/><text x="12" y="449" font-size="17" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Worst-group loss</text><text x="12" y="485" font-size="15" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Prediction: 6.25 min</text><text x="12" y="515" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Sample mean: 1.5625</text><text x="12" y="544" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Worst group: 1.5625</text><text x="12" y="573" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Projected mean: 1.5625</text><text x="12" y="598" font-size="12" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Selected fit</text><line x1="44" y1="920" x2="312" y2="920" stroke="#a6aca3"/><text x="37" y="924" font-size="12" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><line x1="44" y1="800" x2="312" y2="800" stroke="#a6aca3"/><text x="37" y="804" font-size="12" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">4</text><line x1="44" y1="680" x2="312" y2="680" stroke="#a6aca3"/><text x="37" y="684" font-size="12" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">8</text><text x="44" y="940" font-size="12" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><text x="97.6" y="940" font-size="12" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.5</text><text x="151.2" y="940" font-size="12" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1</text><text x="204.8" y="940" font-size="12" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1.5</text><text x="258.4" y="940" font-size="12" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2</text><text x="312" y="940" font-size="12" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2.5</text><line x1="44" y1="680" x2="44" y2="920" stroke="#252c28"/><text x="44" y="665" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">MSE (minutes²)</text><text x="44" y="964" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Shared correction θ (minutes)</text><polyline points="44.00,920.00 46.68,919.98 49.36,919.92 52.04,919.83 54.72,919.70 57.40,919.53 60.08,919.33 62.76,919.08 65.44,918.80 68.12,918.48 70.80,918.13 73.48,917.73 76.16,917.30 78.84,916.83 81.52,916.33 84.20,915.78 86.88,915.20 89.56,914.58 92.24,913.92 94.92,913.23 97.60,912.50 100.28,911.73 102.96,910.92 105.64,910.08 108.32,909.20 111.00,908.28 113.68,907.33 116.36,906.33 119.04,905.30 121.72,904.23 124.40,903.13 127.08,901.98 129.76,900.80 132.44,899.58 135.12,898.33 137.80,897.03 140.48,895.70 143.16,894.33 145.84,892.92 148.52,891.48 151.20,890.00 153.88,888.48 156.56,886.92 159.24,885.33 161.92,883.70 164.60,882.03 167.28,880.33 169.96,878.58 172.64,876.80 175.32,874.98 178.00,873.13 180.68,871.23 183.36,869.30 186.04,867.33 188.72,865.33 191.40,863.28 194.08,861.20 196.76,859.08 199.44,856.92 202.12,854.73 204.80,852.50 207.48,850.23 210.16,847.92 212.84,845.58 215.52,843.20 218.20,840.78 220.88,838.33 223.56,835.83 226.24,833.30 228.92,830.73 231.60,828.13 234.28,825.48 236.96,822.80 239.64,820.08 242.32,817.33 245.00,814.53 247.68,811.70 25