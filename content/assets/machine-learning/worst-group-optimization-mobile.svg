oup B mean loss</text><line x1="44" y1="1028" x2="66" y2="1028" stroke="#252c28" stroke-width="2" stroke-dasharray="2 5"/><text x="73" y="1032" font-size="12" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Maximum group loss</text><text x="44" y="1065" font-size="12" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Dot: selected fit on the maximum-loss curve.</text></svg><rect x="16" y="1240" width="328" height="200" fill="#f1f2ef"/><text x="28" y="1270" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">The same 100 training records</text><text x="28" y="1304" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A: 90 × 5 min</text><text x="28" y="1330" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">B: 5 × 6 min + 5 × 8 min</text><text x="28" y="1357" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Minimax: 6.25 min for both groups.</text><text x="28" y="1388" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Mean MSE = worst MSE = 1.5625</text><text x="28" y="1418" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">ERM: mean 0.4600; worst 4.2400.</text><text x="16" y="1480" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Projection: 80% B; group data fixed.</text><text x="16" y="1510" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">No held-out or population result is measured.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
