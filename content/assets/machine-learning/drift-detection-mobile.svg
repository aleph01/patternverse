<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Drift Detection: compare input shares separately from prediction quality</title><desc id="desc">Web and app shares change from eighty and twenty percent to twenty and eighty percent. The largest share gap is sixty percentage points, exceeding a ten-point threshold with enough current tickets. Separate fully labeled accuracy remains seventy-five percent in both fictional windows.</desc><rect width="360" height="800" fill="#fff"/><g transform="translate(16,20)"><rect width="328" height="760" fill="#fff"/><text x="0" y="25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="24" text-anchor="start" fill="#252c28">Inputs and outcomes</text><text x="0" y="55" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="start" fill="#626962">Reference 100 · current 100 tickets</text><line x1="64" y1="112" x2="290" y2="112" stroke="#a6aca3"/><line x1="64" y1="108" x2="64" y2="116" stroke="#a6aca3"/><text x="64" y="101" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="middle" fill="#626962">0%</text><line x1="177" y1="108" x2="177" y2="116" stroke="#a6aca3"/><text x="177" y="101" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="middle" fill="#626962">50%</text><line x1="290" y1="108" x2="290" y2="116" stroke="#a6aca3"/><text x="290" y="101" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="middle" fill="#626962">100%</text><text x="0" y="163" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" text-anchor="start" fill="#252c28">Web</text><rect x="64" y="151" width="180.8" height="13" fill="#8c938b"/><rect x="64" y="176" width="45.2" height="13" fill="#00855b"/><text x="251.8" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" text-anchor="start" fill="#626962">80%</text><text x="116.2" y="187" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" text-anchor="start" fill="#00855b">20%</text><text x="0" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" text-anchor="start" fill="#252c28">App</text><rect x="64" y="246" width="45.2" height="13" fill="#8c938b"/><rect x="64" y="271" width="180.8" height="13" fill="#00855b"/><text x="116.2" y="257" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" text-anchor="start" fill="#626962">20%</text><text x="251.8" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" text-anchor="start" fill="#00855b">80%</text><text x="0" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" text-anchor="start" fill="#626962">Gray: reference · green: current</text><text x="0" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="23" text-anchor="start" fill="#252c28">Largest share gap 60 pp</text><text x="0" y="404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="21" text-anchor="start" fill="#252c28">Investigate input shift</text><text x="0" y="443" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" text-anchor="start" fill="#252c28">Alert if gap &gt; 10 pp</text><text x="0" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="start" fill="#252c28">Needs at least 50 current tickets</text><line x1="0" y1="501" x2="328" y2="501" stroke="#a6aca3"/><text x="0" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="19" text-anchor="start" fill="#252c28">Accuracy · all labels provided</text><text x="0" y="577" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" text-anchor="start" fill="#252c28">Reference 75/100 = 75%</text><text x="0" y="610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" text-anchor="start" fill="#00855b">Current 75/100 = 75%</text><text x="0" y="648" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="20" text-anchor="start" fill="#252c28">Accuracy change 0 pp</text><text x="0" y="698" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" text-anchor="start" fill="#626962">Input change and prediction quality</text><text x="0" y="724" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" text-anchor="start" fill="#626962">are separate measurements.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
