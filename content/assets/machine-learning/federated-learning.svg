<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Federated learning combines compatible local models from a common starting point</title><desc id="desc">A fictional server sends scalar model zero to clients A, B, and C. They hold four, two, and two local examples. After two full-batch gradient steps, they return models point one nine, one point two eight, and minus point one nine. Weighting by the included example counts gives shared model point three six seven five. Two centralized steps on the same records give point four one zero six two five. Global training loss decreases while client C loss increases. All values are displayed for explanation; no privacy protocol is simulated.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="1050" fill="#fff"/><text x="20" y="42" font-size="29" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Train locally. Combine updates.</text><text x="20" y="78" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A common starting model → separate local steps → weighted aggregation.</text><svg x="20" y="125" width="680" height="510" viewBox="0 0 680 510"><title id="flow-title">Local training from one common model followed by weighted aggregation</title><desc id="flow-desc">Attempt 1 starts at 0.00000. 3 clients participate; the shared result is 0.36750. Raw records remain at clients in the illustrated architecture. No privacy mechanism is simulated.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00855b"/></marker></defs><rect x="230" y="0" width="220" height="70" fill="#f1f2ef"/><text x="242" y="26" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Start round 1</text><text x="242" y="53" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Shared w 0.00000</text><path d="M 340 70 V 100 H 104 V 126" fill="none" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 104 275 V 331" fill="none" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><rect x="0" y="130" width="208" height="145" fill="#f1f2ef"/><text x="12" y="155" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A · 4 examples</text><text x="12" y="181" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2 full-batch steps</text><text x="12" y="207" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Local w 0.19000</text><text x="12" y="233" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weight 4/8 = 0.500</text><text x="12" y="259" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Records remain local</text><path d="M 340 70 V 100 H 340 V 126" fill="none" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 340 275 V 331" fill="none" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><rect x="236" y="130" width="208" height="145" fill="#f1f2ef"/><text x="248" y="155" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">B · 2 examples</text><text x="248" y="181" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2 full-batch steps</text><text x="248" y="207" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Local w 1.28000</text><text x="248" y="233" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weight 2/8 = 0.250</text><text x="248" y="259" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Records remain local</text><path d="M 340 70 V 100 H 576 V 126" fill="none" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 576 275 V 331" fill="none" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><rect x="472" y="130" width="208" height="145" fill="#f1f2ef"/><text x="484" y="155" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">C · 2 examples</text><text x="484" y="181" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2 full-batch steps</text><text x="484" y="207" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Local w -0.19000</text><text x="484" y="233" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weight 2/8 = 0.250</text><text x="484" y="259" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Records remain local</text><rect x="0" y="335" width="680" height="140" fill="#edf5f0"/><text x="12" y="361" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Aggregate returned models</text><text x="12" y="386" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Example-weighted w 0.36750</text><text x="12" y="411" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">8 examples · 3 participating clients</text><text x="12" y="436" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Parameter values this round: 3 down + 3 up</text><text x="12" y="461" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Plain averaging adds no privacy guarantee.</text></svg><rect x="20" y="680" width="680" height="190" fill="#f1f2ef"/><text x="32" y="708" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Local steps change the path</text><text x="32" y="741" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Federated w 0.367500</text><text x="32" y="774" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Centralized w 0.410625</text><text x="32" y="807" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same eight records; same learning rate.</text><text x="32" y="840" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">One local step matches at 0.225000.</text><text x="20" y="925" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Global training loss falls to 1.9163; client C rises from 0.5000 to 0.9350.</text><text x="20" y="975" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Three parameter downloads + three uploads in this round; protocol overhead is excluded.</text><text x="20" y="1020" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional scalar model · synchronous clients · no secure aggregation or differential privacy.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
