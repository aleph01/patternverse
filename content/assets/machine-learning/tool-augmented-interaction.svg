<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">A proposed call is checked, executed, and observed through a tool loop</title><desc id="desc">The fictional default reads five tripods and checks a scripted call to reserve three. An authorized confirmed request creates R1 once and leaves two available. A delivered receipt can inform the next model turn. If the first successful write response is lost, the client sees UNKNOWN although the simulated server holds R1. Reusing the same request key returns that receipt without another reservation. Model inference, real authentication, and real bookings are not performed.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="960" fill="#fff"/><text x="20" y="42" font-size="29" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Propose. Check. Execute. Observe.</text><text x="20" y="80" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">One loop, separate responsibilities. No language model or real booking runs.</text><svg x="20" y="125" width="680" height="590" viewBox="0 0 680 590"><title id="flow-title">A tool request passes through the application and returns an observed result</title><desc id="flow-desc">Scripted model proposal, host checks, local service execution, and result delivery are separate stages. The result can inform a later model turn; no language model runs here.</desc><rect x="0" y="0" width="330" height="180" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="29" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">1. Model proposes</text><text x="12" y="66" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">reserve_inventory</text><text x="12" y="98" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">item: tripod · quantity: 3</text><text x="12" y="140" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Scripted proposal; no model runs.</text><rect x="350" y="0" width="330" height="180" fill="#f1f2ef" stroke="#00855b"/><text x="362" y="29" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">2. Application checks</text><text x="362" y="66" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Arguments → permission → confirmation</text><text x="362" y="98" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Attach key: demo-17</text><text x="362" y="140" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">The application controls execution.</text><rect x="350" y="245" width="330" height="180" fill="#f1f2ef" stroke="#00855b"/><text x="362" y="274" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">3. Tool executes locally</text><text x="362" y="311" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Available stock: 2</text><text x="362" y="343" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Reservations created: 1</text><text x="362" y="385" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A repeated key does not repeat the write.</text><rect x="0" y="245" width="330" height="180" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="274" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">4. Return observation</text><text x="12" y="311" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Client: SUCCESS</text><text x="12" y="343" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Receipt: R1</text><text x="12" y="385" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Result can inform the next model turn.</text><text x="333" y="90" font-size="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">→</text><text x="507" y="225" font-size="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">↓</text><text x="333" y="335" font-size="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">←</text><text x="2" y="225" font-size="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">↑</text><text x="0" y="495" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Proposed ≠ executed ≠ observed</text><text x="0" y="528" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Tool attempts: 2; write attempts: 1</text><text x="0" y="561" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">The service can commit even when its acknowledgement is lost.</text></svg><rect x="20" y="760" width="680" height="145" fill="#f1f2ef"/><text x="32" y="790" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A result must actually arrive</text><text x="32" y="824" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">request_key: demo-17</text><text x="32" y="855" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Receipt: R1 · reserved 3 · remaining 2</text><text x="32" y="888" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">If the acknowledgement is lost: client UNKNOWN; simulated server still has R1.</text><text x="20" y="944" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A repeated request key deduplicates only under the service contract, for the same logical intent.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
