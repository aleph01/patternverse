<svg xmlns="http://www.w3.org/2000/svg" width="720" height="860" viewBox="0 0 720 860" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">A schema makes input violations visible before training</title><desc id="desc">Six fictional delivery records are validated against strict contract version one in training mode. Only D01 passes. D02 has a string distance, D03 a negative distance, D04 an unapproved service, D05 a null distance and invalid hour, and D06 a missing label. Five rows are flagged and six violations hold the complete batch. Three violations concern distance and one each concerns service, hour, and label. Passing a schema does not certify semantic correctness.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="860" fill="#fff"/><text x="20" y="42" font-size="29" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Check expectations before training.</text><text x="20" y="76" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">v1 training · strict types · six fictional records.</text><svg x="20" y="120" width="680" height="402" viewBox="0 0 680 402"><text x="0" y="25" font-size="18" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Same input; explicit expectations.</text><text x="0" y="48" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">v1 · training · strict types</text><rect x="0" y="62" width="220" height="74" fill="#edf5f0"/><text x="9" y="83" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">D01 · pass</text><text x="9" y="106" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">All field checks pass</text><text x="9" y="125" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">distance = 12</text><rect x="230" y="62" width="220" height="74" fill="#f1f2ef"/><text x="239" y="83" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">D02 · 1 violation</text><text x="239" y="106" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">distance: type</text><text x="239" y="125" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">value = "12"</text><rect x="460" y="62" width="220" height="74" fill="#f1f2ef"/><text x="469" y="83" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">D03 · 1 violation</text><text x="469" y="106" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">distance: range</text><text x="469" y="125" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">value = -3</text><rect x="0" y="146" width="220" height="74" fill="#f1f2ef"/><text x="9" y="167" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">D04 · 1 violation</text><text x="9" y="190" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">service: domain</text><text x="9" y="209" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">value = "drone"</text><rect x="230" y="146" width="220" height="74" fill="#f1f2ef"/><text x="239" y="167" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">D05 · 2 violations</text><text x="239" y="190" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">distance: type</text><text x="239" y="209" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">null; hour = 24</text><rect x="460" y="146" width="220" height="74" fill="#f1f2ef"/><text x="469" y="167" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">D06 · 1 violation</text><text x="469" y="190" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">label: missing</text><text x="469" y="209" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">value = absent</text><rect x="0" y="254" width="680" height="126" fill="#f1f2ef"/><text x="12" y="280" font-size="16" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">1/6 pass · 5 flagged</text><text x="12" y="307" font-size="15" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">6 violations · 0 conversions</text><text x="12" y="336" font-size="17" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">HOLD WHOLE BATCH</text><text x="12" y="361" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Passing rows are not released separately.</text></svg><rect x="20" y="552" width="680" height="178" fill="#f1f2ef"/><text x="32" y="580" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Field violations, not row counts</text><text x="32" y="609" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">distance_km: 3</text><text x="32" y="637" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">service: 1</text><text x="32" y="665" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">pickup_hour: 1</text><text x="32" y="693" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">delivered_late: 1</text><text x="20" y="778" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">D05 violates two field rules. No rows are silently dropped or repaired.</text><text x="20" y="824" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Passing these checks does not establish correct units, labels, or predictive usefulness.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
