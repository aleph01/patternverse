<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1030" viewBox="0 0 360 1030" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">A staged canary release rolls back when candidate failures exceed its limit</title><desc id="desc">A fictional ten-percent first window serves ten candidate requests and passes. A twenty-five-percent second window serves twenty-five candidate requests; three fail, exceeding a five-percent serving failure limit. Future requests return to the incumbent. Thirty-five of two hundred requests have already reached the candidate. The combined second-window failure rate is five percent, hiding the candidate twelve-percent failure rate. No rollback lag is assumed.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1030" fill="#fff"/><text x="16" y="34" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Release in stages.</text><text x="16" y="68" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Keep a return path.</text><text x="16" y="100" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A canary serves real user requests.</text><svg x="16" y="125" width="328" height="620" viewBox="0 0 328 620"><title id="flow-title">Real exposure, an evidence gate, and the next routing decision</title><desc id="flow-desc">35 candidate requests have already been served. ROLL BACK. The next candidate share is 0 percent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00855b"/></marker></defs><rect x="0" y="0" width="328" height="140" fill="#f1f2ef"/><text x="12" y="27" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Start with 10%</text><text x="12" y="56" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">10 candidate requests</text><text x="12" y="85" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">90 incumbent requests</text><text x="12" y="114" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Both serve real users</text><path d="M 164 148 V 170" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><rect x="0" y="180" width="328" height="140" fill="#f1f2ef"/><text x="12" y="207" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Window 2 · 25%</text><text x="12" y="236" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">3/25 serving failures</text><text x="12" y="265" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">ROLL BACK</text><text x="12" y="294" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Boundary check complete</text><path d="M 164 328 V 350" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><rect x="0" y="360" width="328" height="140" fill="#f1f2ef"/><text x="12" y="387" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Next requests: 0%</text><text x="12" y="416" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Incumbent serves all</text><text x="12" y="445" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">No added rollback exposure</text><text x="12" y="474" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Prior effects remain</text><rect x="0" y="540" width="328" height="80" fill="#edf5f0"/><text x="12" y="569" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">35 candidate requests already served</text><text x="12" y="599" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">200 total requests · 3 candidate serving failures</text></svg><rect x="16" y="790" width="328" height="155" fill="#f1f2ef"/><text x="28" y="818" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Separate the release metrics</text><text x="28" y="851" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Window 2: combined 5/100 = 5%</text><text x="28" y="884" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Candidate alone: 3/25 = 12%</text><text x="28" y="917" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">The candidate breaches its 5% failure limit.</text><text x="16" y="984" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional gates; no confidence guarantee.</text><text x="16" y="1015" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">No extra rollback window in this preview.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
