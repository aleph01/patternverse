<svg xmlns="http://www.w3.org/2000/svg" width="360" height="810" viewBox="0 0 360 810" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Reframing: one mean or probabilities over outcome bands</title><desc id="desc">Six fictional durations at eight, ten, twelve, twenty-eight, thirty and thirty-two minutes produce a squared-error constant of twenty minutes. Three bands retain probability masses one-half, zero and one-half. The deadline at twenty-five minutes aligns with the final band boundary. These are fitted sample summaries, not future reliability.</desc><rect width="360" height="810" fill="#fff"/><g transform="translate(16,20)"><rect width="328" height="770" fill="#fff"/><text x="0" y="24" font-size="20" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same outcomes, different targets</text><text x="0" y="51" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional delivery durations · minutes</text><text x="0" y="94" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Observed durations</text><circle cx="60" cy="132" r="4" fill="#626962"/><circle cx="75" cy="132" r="4" fill="#626962"/><circle cx="90" cy="132" r="4" fill="#626962"/><circle cx="210" cy="132" r="4" fill="#626962"/><circle cx="225" cy="132" r="4" fill="#626962"/><circle cx="240" cy="132" r="4" fill="#626962"/><path d="M0 144 L300 144" stroke="#a6aca3" fill="none"/><text x="0" y="168" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><text x="278" y="168" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">40</text><text x="0" y="196" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Gray line: deadline 25 min</text><text x="0" y="232" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fit one squared-error value</text><text x="0" y="263" font-size="22" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Mean 20 min</text><path d="M0 342 L300 342" stroke="#a6aca3" fill="none"/><path d="M0 342 L0 348" stroke="#a6aca3" fill="none"/><text x="0" y="367" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><path d="M75 342 L75 348" stroke="#a6aca3" fill="none"/><text x="65" y="367" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">10</text><path d="M150 342 L150 348" stroke="#a6aca3" fill="none"/><text x="140" y="367" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">20</text><path d="M225 342 L225 348" stroke="#a6aca3" fill="none"/><text x="215" y="367" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">30</text><path d="M300 342 L300 348" stroke="#a6aca3" fill="none"/><text x="290" y="367" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">40</text><path d="M150 292 L150 342" stroke="#00855b" fill="none"/><circle cx="150" cy="292" r="5" fill="#00855b"/><path d="M187.5 276 L187.5 347" stroke="#a6aca3" fill="none"/><text x="0" y="403" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Mean ≥ 25? No</text><text x="0" y="429" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A point is not a tail probability.</text><text x="0" y="480" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fit probability mass by band</text><rect x="1" y="540" width="110.5" height="50" fill="#edf5f0" stroke="#00855b"/><text x="42.25" y="530" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.5</text><rect x="113.5" y="590" width="73" height="0" fill="#edf5f0" stroke="#00855b"/><text x="136" y="580" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><rect x="188.5" y="540" width="110.5" height="50" fill="#edf5f0" stroke="#00855b"/><text x="229.75" y="530" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.5</text><path d="M0 590 L300 590" stroke="#a6aca3" fill="none"/><path d="M0 590 L0 596" stroke="#a6aca3" fill="none"/><text x="0" y="615" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><path d="M75 590 L75 596" stroke="#a6aca3" fill="none"/><text x="65" y="615" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">10</text><path d="M150 590 L150 596" stroke="#a6aca3" fill="none"/><text x="140" y="615" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">20</text><path d="M225 590 L225 596" stroke="#a6aca3" fill="none"/><text x="215" y="615" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">30</text><path d="M300 590 L300 596" stroke="#a6aca3" fill="none"/><text x="290" y="615" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">40</text><path d="M187.5 514 L187.5 595" stroke="#a6aca3" fill="none"/><text x="0" y="651" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">At least 25 min:</text><text x="0" y="677" font-size="18" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fitted mass 0.5</text><text x="0" y="721" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Bar height shows probability mass.</text><text x="0" y="748" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Training summaries are not future reliability.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
