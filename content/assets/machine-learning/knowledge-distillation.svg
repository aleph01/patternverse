<svg xmlns="http://www.w3.org/2000/svg" width="720" height="770" viewBox="0 0 720 770" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Knowledge distillation with softened teacher distributions</title><desc id="desc">Teacher scores [4, 2, 0] produce probabilities [86.7, 11.7, 1.6] percent at temperature one and [66.5, 24.5, 9.0] percent at temperature two. A one-case student combines teacher matching and a true Delivery label. After ten computed steps, its deployment probability for Delivery is 84.7 percent and total loss is 0.128.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="770" fill="#fff"/><text x="20" y="40" font-size="29" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Transfer more than the top answer.</text><text x="20" y="73" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A frozen teacher supplies a distribution; labels can supply a separate signal.</text><rect x="20" y="115" width="680" height="65" fill="#f1f2ef"/><text x="32" y="145" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Teacher logits: [4, 2, 0]</text><text x="32" y="169" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Class order: Delivery, Billing, Account.</text><g transform="translate(20,220)"><rect width="328" height="200" fill="var(--panel, #f1f2ef)"/><text x="12" y="29" font-size="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Teacher · training T = 1</text><text x="12" y="62" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Delivery</text><rect x="98" y="47" width="155" height="20" fill="var(--line, #a6aca3)"/><rect x="98" y="47" width="134.3560664905868" height="20" fill="var(--accent, #00855b)"/><text x="262" y="62" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">86.7%</text><text x="12" y="109" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Billing</text><rect x="98" y="94" width="155" height="20" fill="var(--line, #a6aca3)"/><rect x="98" y="94" width="18.183116313060737" height="20" fill="var(--accent, #00855b)"/><text x="262" y="109" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">11.7%</text><text x="12" y="156" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Account</text><rect x="98" y="141" width="155" height="20" fill="var(--line, #a6aca3)"/><rect x="98" y="141" width="2.4608171963523477" height="20" fill="var(--accent, #00855b)"/><text x="262" y="156" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">1.6%</text></g><g transform="translate(372,220)"><rect width="328" height="200" fill="var(--panel, #f1f2ef)"/><text x="12" y="29" font-size="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Teacher · training T = 2</text><text x="12" y="62" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Delivery</text><rect x="98" y="47" width="155" height="20" fill="var(--line, #a6aca3)"/><rect x="98" y="47" width="103.11234814509736" height="20" fill="var(--accent, #00855b)"/><text x="262" y="62" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">66.5%</text><text x="12" y="109" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Billing</text><rect x="98" y="94" width="155" height="20" fill="var(--line, #a6aca3)"/><rect x="98" y="94" width="37.932913013493625" height="20" fill="var(--accent, #00855b)"/><text x="262" y="109" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">24.5%</text><text x="12" y="156" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Account</text><rect x="98" y="141" width="155" height="20" fill="var(--line, #a6aca3)"/><rect x="98" y="141" width="13.954738841408968" height="20" fill="var(--accent, #00855b)"/><text x="262" y="156" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">9.0%</text></g><text x="20" y="460" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Higher T softens the distribution; ordering stays.</text><text x="20" y="486" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Soft targets are not new data or verified truth.</text><rect x="20" y="525" width="680" height="100" fill="#f1f2ef"/><text x="32" y="553" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">True label: Delivery</text><text x="32" y="581" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">↓ Combine label loss and teacher loss</text><text x="32" y="609" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">(1 − α) CE + α T² KL(teacher || student)</text><rect x="20" y="635" width="680" height="90" fill="#f1f2ef"/><text x="32" y="663" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Student after 10 actual steps</text><text x="32" y="691" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Delivery at T = 1: 84.7% · loss 0.128</text><text x="32" y="717" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Training T = 2; α = 0.5; learning rate = 0.5.</text><text x="20" y="754" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">One fictional training case with three free student scores. No generalization or speedup claim.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
