<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1360" viewBox="0 0 360 1360" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Task demonstrations change the inference context while model weights stay fixed</title><desc id="desc">The fictional library prompt selects D2, D1, and D3 using Jaccard word-overlap scores five tenths, two tenths, and two twelfths. Their request-label pairs precede a new request about renewing Dune. The exact prompt contains 369 Unicode characters and demonstrates two of three labels. A conceptual model would condition on these inputs with unchanged weights. Neither the illustration nor explorer performs inference or reports prediction quality.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1360" fill="#fff"/><text x="16" y="35" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A few examples.</text><text x="16" y="70" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">The same weights.</text><text x="16" y="103" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Prompt construction only; no model run.</text><svg x="16" y="125" width="328" height="810" viewBox="0 0 328 810"><title id="flow-title">Demonstration selection and prompt assembly precede inference with fixed weights</title><desc id="flow-desc">The fictional selector ranks six examples by Jaccard word overlap, selects k, and optionally reverses them. The exact prompt combines instructions, selected input-label pairs, and the new query. A conceptual model would condition on that context without updating weights. No model is executed here.</desc><rect x="0" y="0" width="328" height="225" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="29" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">1. Choose examples</text><text x="12" y="58" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">3 of 6 selected</text><text x="12" y="89" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">D2 → RENEW; 0.5000</text><text x="12" y="112" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">D1 → RENEW; 0.2000</text><text x="12" y="135" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">D3 → HOLD; 0.1667</text><rect x="0" y="250" width="328" height="190" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="279" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">2. Assemble context</text><text x="12" y="314" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Instructions + 3 examples</text><text x="12" y="346" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">New request follows</text><text x="12" y="378" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">369 characters</text><text x="12" y="411" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2/3 labels demonstrated</text><rect x="0" y="465" width="328" height="180" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="494" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">3. Use fixed weights</text><text x="12" y="529" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">θ is not updated</text><text x="12" y="561" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Response would depend</text><text x="12" y="586" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">on this context.</text><text x="12" y="620" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Model not executed here.</text><rect x="0" y="685" width="328" height="105" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="714" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Context changes; θ stays fixed</text><text x="12" y="746" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Prompt order: ranked</text><text x="12" y="774" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Counts do not measure prediction quality.</text></svg><rect x="16" y="980" width="328" height="245" fill="#f1f2ef"/><text x="28" y="1010" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Inside the assembled prompt</text><text x="28" y="1044" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Request: Renew my loan of Dune.</text><text x="28" y="1072" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Label: RENEW</text><text x="28" y="1100" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Other selected examples omitted in this excerpt.</text><text x="28" y="1140" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">New request: Can I renew Dune for</text><text x="28" y="1164" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">another week?</text><text x="28" y="1200" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Label:</text><text x="16" y="1265" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">369 Unicode characters; not model tokens.</text><text x="16" y="1300" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">No response or accuracy is simulated.</text><text x="16" y="1335" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Word overlap is a lexical selection heuristic.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
