<svg xmlns="http://www.w3.org/2000/svg" width="720" height="570" viewBox="0 0 720 570" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Reframing: one mean or probabilities over outcome bands</title><desc id="desc">Six fictional durations at eight, ten, twelve, twenty-eight, thirty and thirty-two minutes produce a squared-error constant of twenty minutes. Three bands retain probability masses one-half, zero and one-half. The deadline at twenty-five minutes aligns with the final band boundary. These are fitted sample summaries, not future reliability.</desc><rect width="720" height="570" fill="#fff"/><g transform="translate(20,20)"><rect width="680" height="530" fill="#fff"/><text x="0" y="24" font-size="20" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same outcomes, different targets</text><text x="0" y="51" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional delivery durations · minutes</text><text x="0" y="94" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Observed durations</text><circle cx="130" cy="132" r="4" fill="#626962"/><circle cx="162.5" cy="132" r="4" fill="#626962"/><circle cx="195" cy="132" r="4" fill="#626962"/><circle cx="454.99999999999994" cy="132" r="4" fill="#626962"/><circle cx="487.5" cy="132" r="4" fill="#626962"/><circle cx="520" cy="132" r="4" fill="#626962"/><path d="M0 144 L650 144" stroke="#a6aca3" fill="none"/><text x="0" y="168" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><text x="628" y="168" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">40</text><text x="0" y="196" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Gray line: deadline 25 min</text><text x="0" y="239" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fit one squared-error value</text><text x="0" y="270" font-size="22" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Mean 20 min</text><path d="M0 349 L300 349" stroke="#a6aca3" fill="none"/><path d="M0 349 L0 355" stroke="#a6aca3" fill="none"/><text x="0" y="374" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><path d="M75 349 L75 355" stroke="#a6aca3" fill="none"/><text x="65" y="374" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">10</text><path d="M150 349 L150 355" stroke="#a6aca3" fill="none"/><text x="140" y="374" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">20</text><path d="M225 349 L225 355" stroke="#a6aca3" fill="none"/><text x="215" y="374" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">30</text><path d="M300 349 L300 355" stroke="#a6aca3" fill="none"/><text x="290" y="374" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">40</text><path d="M150 299 L150 349" stroke="#00855b" fill="none"/><circle cx="150" cy="299" r="5" fill="#00855b"/><path d="M187.5 283 L187.5 354" stroke="#a6aca3" fill="none"/><text x="0" y="410" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Mean ≥ 25? No</text><text x="0" y="436" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A point is not a tail probability.</text><text x="350" y="239" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fit probability mass by band</text><rect x="351" y="299" width="110.5" height="50" fill="#edf5f0" stroke="#00855b"/><text x="392.25" y="289" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.5</text><rect x="463.5" y="349" width="73" height="0" fill="#edf5f0" stroke="#00855b"/><text x="486" y="339" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><rect x="538.5" y="299" width="110.5" height="50" fill="#edf5f0" stroke="#00855b"/><text x="579.75" y="289" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.5</text><path d="M350 349 L650 349" stroke="#a6aca3" fill="none"/><path d="M350 349 L350 355" stroke="#a6aca3" fill="none"/><text x="350" y="374" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><path d="M425 349 L425 355" stroke="#a6aca3" fill="none"/><text x="415" y="374" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">10</text><path d="M500 349 L500 355" stroke="#a6aca3" fill="none"/><text x="490" y="374" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">20</text><path d="M575 349 L575 355" stroke="#a6aca3" fill="none"/><text x="565" y="374" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">30</text><path d="M650 349 L650 355" stroke="#a6aca3" fill="none"/><text x="640" y="374" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">40</text><path d="M537.5 273 L537.5 354" stroke="#a6aca3" fill="none"/><text x="350" y="410" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">At least 25 min:</text><text x="350" y="436" font-size="18" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fitted mass 0.5</text><text x="0" y="481" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Bar height shows probability mass; widths show duration ranges.</text><text x="0" y="508" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Training summaries are not future reliability.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
