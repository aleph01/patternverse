<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1380" viewBox="0 0 360 1380" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Reconcile a hierarchy without confusing coherence and accuracy</title><desc id="desc">Seven fictional base forecasts have gaps ten, ten and minus ten units. Equal-weight reconciliation changes total 120 to 115.7143, North 70 to 69.5238 and South 40 to 46.1905, with four adjusted stores summing to these regions. All gaps become zero. If actual store outcomes equal the original store forecasts, store mean absolute error increases from zero to 3.3333, illustrating that coherence does not guarantee individual-series accuracy. Bottom-up retains store values and instead gives total 110.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1380" fill="#fff"/><text x="16" y="36" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Make the forecasts</text><text x="16" y="73" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">add up.</text><text x="16" y="105" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Equal-weight reconciliation; fictional data.</text><svg x="16" y="125" width="328" height="1000" viewBox="0 0 328 1000"><title id="diagram-title">From disagreeing forecasts to one coherent hierarchy</title><desc id="diagram-desc">Each node shows its base forecast and computed reconciled forecast for the same next week. Three parent-minus-children gaps and a store-error counterexample separate coherence from accuracy.</desc><text x="0" y="25" font-size="18" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">One week. Seven linked forecasts.</text><text x="0" y="54" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Each node: base → reconciled (rounded)</text><line x1="164" y1="180" x2="82" y2="225" stroke="#a6aca3" stroke-width="2"/><line x1="164" y1="180" x2="246" y2="225" stroke="#a6aca3" stroke-width="2"/><line x1="82" y1="320" x2="41" y2="375" stroke="#a6aca3" stroke-width="2"/><line x1="82" y1="320" x2="123" y2="375" stroke="#a6aca3" stroke-width="2"/><line x1="246" y1="320" x2="205" y2="375" stroke="#a6aca3" stroke-width="2"/><line x1="246" y1="320" x2="287" y2="375" stroke="#a6aca3" stroke-width="2"/><rect x="84" y="85" width="160" height="95" fill="#f1f2ef" stroke="#a6aca3"/><text x="164" y="111" font-size="14" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Total</text><text x="164" y="137" font-size="13" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">120</text><text x="164" y="163" font-size="13" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">→ 115.71</text><rect x="7" y="225" width="150" height="95" fill="#f1f2ef" stroke="#a6aca3"/><text x="82" y="251" font-size="14" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">North</text><text x="82" y="277" font-size="13" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">70</text><text x="82" y="303" font-size="13" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">→ 69.52</text><rect x="171" y="225" width="150" height="95" fill="#f1f2ef" stroke="#a6aca3"/><text x="246" y="251" font-size="14" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">South</text><text x="246" y="277" font-size="13" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">40</text><text x="246" y="303" font-size="13" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">→ 46.19</text><rect x="3" y="375" width="76" height="95" fill="#f1f2ef" stroke="#a6aca3"/><text x="41" y="401" font-size="14" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">N1</text><text x="41" y="427" font-size="13" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">30</text><text x="41" y="453" font-size="13" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">→ 34.76</text><rect x="85" y="375" width="76" height="95" fill="#f1f2ef" stroke="#a6aca3"/><text x="123" y="401" font-size="14" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">N2</text><text x="123" y="427" font-size="13" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">30</text><text x="123" y="453" font-size="13" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">→ 34.76</text><rect x="167" y="375" width="76" height="95" fill="#f1f2ef" stroke="#a6aca3"/><text x="205" y="401" font-size="14" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">S1</text><text x="205" y="427" font-size="13" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">20</text><text x="205" y="453" font-size="13" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">→ 18.1</text><rect x="249" y="375" width="76" height="95" fill="#f1f2ef" stroke="#a6aca3"/><text x="287" y="401" font-size="14" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">S2</text><text x="287" y="427" font-size="13" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">30</text><text x="287" y="453" font-size="13" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">→ 28.1</text><rect x="0" y="520" width="328" height="190" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="549" font-size="17" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Parent minus children</text><text x="14" y="576" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Before → after reconciliation</text><text x="14" y="608" font-size="12" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Total − North − South</text><text x="314" y="608" font-size="13" text-anchor="end" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">10 → 0</text><text x="14" y="644" font-size="12" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">North − N1 − N2</text><text x="314" y="644" font-size="13" text-anchor="end" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">10 → 0</text><text x="14" y="680" font-size="12" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">South − S1 − S2</text><text x="314" y="680" font-size="13" text-anchor="end" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">-10 → 0</text><text x="0" y="750" font-size="17" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Coherent does not mean more accurate</text><text x="0" y="782" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Hypothetical store outcomes equal their</text><text x="0" y="807" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">base forecasts; they do not enter the solve.</text><text x="0" y="847" font-size="15" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Store MAE: 0.0000 → 3.3333</text><text x="0" y="982" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional point forecasts; no accuracy guarantee.</text></svg><rect x="16" y="1170" width="328" height="140" fill="#f1f2ef"/><text x="28" y="1199" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Another coherent answer: bottom-up</text><text x="28" y="1232" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Keep stores (30, 30, 20, 30).</text><text x="28" y="1261" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">North 60; South 50; Total 110.</text><text x="28" y="1290" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Different assumptions, different adjustments.</text><text x="16" y="1340" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Unrounded values obey the sums.</text><text x="16" y="1364" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Node values round to two decimals.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
