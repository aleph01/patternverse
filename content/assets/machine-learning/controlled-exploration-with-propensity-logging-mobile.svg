<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1160" viewBox="0 0 360 1160" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Controlled exploration links selected actions to logged probabilities and importance weights</title><desc id="desc">In a fictional ten-row replay, epsilon point three over three eligible actions assigns A probability point eight and B and C point one each. Request R09 selects B and receives reward one. The target also chooses B, so its importance weight is ten. Four rows match the target; weighted rewards sum to twelve point five and weights sum to thirteen point seven five. IPS is one point two five and self-normalized IPS is approximately point nine zero nine. A weight cap of two changes capped IPS to point four five. These are unstable illustrative estimates, not confidence guarantees.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1160" fill="#fff"/><text x="16" y="34" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Explore deliberately.</text><text x="16" y="68" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Keep the probabilities.</text><text x="16" y="100" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Only selected rewards become visible.</text><svg x="16" y="125" width="328" height="730" viewBox="0 0 328 730"><title id="flow-title">Sample an action, log its propensity, and weight its observed reward</title><desc id="flow-desc">There are 4 matching rows. IPS is 1.250, and self-normalized IPS is 0.909.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00855b"/></marker></defs><rect x="0" y="0" width="328" height="170" fill="#f1f2ef"/><text x="12" y="25" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Sampling policy</text><text x="12" y="52" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A 0.800</text><rect x="88" y="41" width="225" height="12" fill="#edf5f0"/><rect x="88" y="41" width="179.99999999999997" height="12" fill="#00855b"/><text x="12" y="85" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">B 0.100</text><rect x="88" y="74" width="225" height="12" fill="#edf5f0"/><rect x="88" y="74" width="22.499999999999996" height="12" fill="#00855b"/><text x="12" y="118" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">C 0.100</text><rect x="88" y="107" width="225" height="12" fill="#edf5f0"/><rect x="88" y="107" width="22.499999999999996" height="12" fill="#00855b"/><text x="12" y="153" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">ε 0.30 · K 3</text><path d="M 164 178 V 190" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><rect x="0" y="200" width="328" height="170" fill="#f1f2ef"/><text x="12" y="226" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Record selected action</text><text x="12" y="256" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">R09 · Complex</text><text x="12" y="286" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Chosen B · reward 1</text><text x="12" y="316" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Propensity 0.100</text><text x="12" y="346" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">v1 · eligible A/B/C</text><path d="M 164 378 V 390" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><rect x="0" y="400" width="328" height="170" fill="#f1f2ef"/><text x="12" y="426" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Reweight for target</text><text x="12" y="456" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target chooses B</text><text x="12" y="486" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weight 10.000</text><text x="12" y="516" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Reward contribution 10.000</text><text x="12" y="546" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Rare actions can dominate</text><rect x="0" y="600" width="328" height="100" fill="#edf5f0"/><text x="12" y="627" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">IPS 1.250 · SNIPS 0.909</text><text x="12" y="656" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">4 matches / 10 decisions · max weight 10.000</text><text x="12" y="684" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weighted rewards 12.500 / 10 for IPS</text></svg><rect x="16" y="900" width="328" height="155" fill="#f1f2ef"/><text x="28" y="928" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A large weight is fragile evidence</text><text x="28" y="961" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weights sum to 13.750</text><text x="28" y="994" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weight concentration: 1.806</text><text x="28" y="1027" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Cap 2 → capped IPS 0.450</text><text x="16" y="1100" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional ten-row replay; no confidence interval.</text><text x="16" y="1134" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Zero support blocks evaluation.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
