<svg xmlns="http://www.w3.org/2000/svg" width="360" height="865" viewBox="0 0 360 865" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Embedding: select a row, then learn from a target</title><desc id="desc">ID 1 selects Camp Cooking vector (0, 1). Against fixed context (1, 0), score zero gives model probability 0.500 and click loss 0.693 nats. The computed next step changes the row to (0.5, 1), probability 0.622 and loss 0.474 nats. Other rows stay fixed. Starting coordinates are fictional; no recommendation quality is measured.</desc><rect width="360" height="865" fill="#fff"/><g transform="translate(16,20)"><title id="lookup-title">An ID selects a row whose coordinates can learn</title><desc id="lookup-desc">Selected Camp Cooking, vector (0, 1), dot score 0, model probability 0.500, training loss 0.693 nats. The next step would change this row to (0.5, 1).</desc><rect width="328" height="825" fill="#fff"/><text x="0" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="24" fill="#252c28" text-anchor="start">Look up a row.</text><text x="0" y="57" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="24" fill="#252c28" text-anchor="start">Learn from a target.</text><text x="0" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#252c28" text-anchor="start">Fixed context q = (1, 0)</text><text x="0" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#252c28" text-anchor="start">Embedding table · 2 coordinates</text><text x="8" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#252c28" text-anchor="start">ID</text><text x="42" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#252c28" text-anchor="start">Title</text><text x="211" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#252c28" text-anchor="middle">First</text><text x="284" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#252c28" text-anchor="middle">Second</text><rect x="0" y="172" width="328" height="40" fill="#fff" stroke="#a6aca3" stroke-width="1"/><text x="8" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#252c28" text-anchor="start">0</text><text x="42" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#252c28" text-anchor="start">Hiking Guide</text><text x="211" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28" text-anchor="middle">1</text><text x="284" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28" text-anchor="middle">0</text><rect x="0" y="212" width="328" height="40" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="8" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#252c28" text-anchor="start">1</text><text x="42" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#252c28" text-anchor="start">Camp Cooking</text><text x="211" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28" text-anchor="middle">0</text><text x="284" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28" text-anchor="middle">1</text><rect x="0" y="252" width="328" height="40" fill="#fff" stroke="#a6aca3" stroke-width="1"/><text x="8" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#252c28" text-anchor="start">2</text><text x="42" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#252c28" text-anchor="start">Desk Lighting</text><text x="211" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28" text-anchor="middle">-1</text><text x="284" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28" text-anchor="middle">0</text><rect x="0" y="292" width="328" height="40" fill="#fff" stroke="#a6aca3" stroke-width="1"/><text x="8" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#252c28" text-anchor="start">3</text><text x="42" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#252c28" text-anchor="start">Weekend Trails</text><text x="211" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28" text-anchor="middle">4</text><text x="284" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28" text-anchor="middle">3</text><rect x="0" y="332" width="328" height="40" fill="#fff" stroke="#a6aca3" stroke-width="1"/><text x="8" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#252c28" text-anchor="start">4</text><text x="42" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" fill="#252c28" text-anchor="start">UNK</text><text x="211" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28" text-anchor="middle">0</text><text x="284" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28" text-anchor="middle">0</text><text x="0" y="438" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="21" fill="#252c28" text-anchor="start">ID 1 · Camp Cooking</text><text x="0" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="19" fill="#252c28" text-anchor="start">Selected e = (0, 1)</text><text x="0" y="505" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" fill="#252c28" text-anchor="start">Dot: 1 × 0 + 0 × 1 = 0</text><text x="0" y="538" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="19" fill="#252c28" text-anchor="start">Model p = 0.500</text><text x="0" y="571" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" fill="#252c28" text-anchor="start">Target: clicked (1)</text><text x="0" y="604" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="19" fill="#252c28" text-anchor="start">Loss = 0.693 nats</text><text x="0" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#252c28" text-anchor="start">Applied updates: 0/12</text><text x="0" y="685" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#252c28" text-anchor="start">Next step · preview</text><text x="0" y="720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="21" fill="#252c28" text-anchor="start">Next e = (0.5, 1)</text><text x="0" y="755" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#252c28" text-anchor="start">p 0.622 · loss 0.474 nats</text><text x="0" y="796" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" fill="#252c28" text-anchor="start">Learning rate 1; context stays fixed.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
