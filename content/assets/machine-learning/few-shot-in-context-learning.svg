<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Task demonstrations change the inference context while model weights stay fixed</title><desc id="desc">The fictional library prompt selects D2, D1, and D3 using Jaccard word-overlap scores five tenths, two tenths, and two twelfths. Their request-label pairs precede a new request about renewing Dune. The exact prompt contains 369 Unicode characters and demonstrates two of three labels. A conceptual model would condition on these inputs with unchanged weights. Neither the illustration nor explorer performs inference or reports prediction quality.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="1000" fill="#fff"/><text x="20" y="42" font-size="29" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A few examples. The same weights.</text><text x="20" y="80" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Select demonstrations → assemble context → condition a fixed model.</text><svg x="20" y="125" width="680" height="440" viewBox="0 0 680 440"><title id="flow-title">Demonstration selection and prompt assembly precede inference with fixed weights</title><desc id="flow-desc">The fictional selector ranks six examples by Jaccard word overlap, selects k, and optionally reverses them. The exact prompt combines instructions, selected input-label pairs, and the new query. A conceptual model would condition on that context without updating weights. No model is executed here.</desc><rect x="0" y="0" width="210" height="225" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="29" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">1. Choose examples</text><text x="12" y="58" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">3 of 6 selected</text><text x="12" y="89" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">D2 → RENEW; 0.5000</text><text x="12" y="112" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">D1 → RENEW; 0.2000</text><text x="12" y="135" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">D3 → HOLD; 0.1667</text><rect x="235" y="0" width="210" height="190" fill="#f1f2ef" stroke="#00855b"/><text x="247" y="29" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">2. Assemble context</text><text x="247" y="64" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Instructions + 3 examples</text><text x="247" y="96" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">New request follows</text><text x="247" y="128" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">369 characters</text><text x="247" y="161" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2/3 labels demonstrated</text><rect x="470" y="0" width="210" height="180" fill="#f1f2ef" stroke="#00855b"/><text x="482" y="29" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">3. Use fixed weights</text><text x="482" y="64" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">θ is not updated</text><text x="482" y="96" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Response would depend</text><text x="482" y="121" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">on this context.</text><text x="482" y="155" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Model not executed here.</text><rect x="0" y="285" width="680" height="105" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="314" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Context changes; θ stays fixed</text><text x="12" y="346" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Prompt order: ranked · selected labels: HOLD, RENEW</text><text x="12" y="374" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Selection and character counts do not measure prediction quality.</text></svg><rect x="20" y="620" width="680" height="245" fill="#f1f2ef"/><text x="32" y="650" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Inside the assembled prompt</text><text x="32" y="684" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Request: Renew my loan of Dune.</text><text x="32" y="712" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Label: RENEW</text><text x="32" y="740" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Other selected examples omitted in this excerpt.</text><text x="32" y="780" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">New request: Can I renew Dune for another week?</text><text x="32" y="816" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Label:</text><text x="20" y="900" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">369 Unicode characters · 2/3 labels demonstrated · no inference performed.</text><text x="20" y="940" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Reversing order preserves this selected set and length but changes the sequence.</text><text x="20" y="978" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional library examples; word overlap does not measure semantic fit or prediction quality.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
