<svg xmlns="http://www.w3.org/2000/svg" width="720" height="910" viewBox="0 0 720 910" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Calibrate probabilities without changing the predicted classes</title><desc id="desc">Twenty calibration cases fit temperature 1.5850, mapping probabilities 0.1 and 0.9 to 0.2 and 0.8. Twenty different evaluation cases have positive fractions 0.3 and 0.7. Reliability points move closer to the diagonal. Brier loss falls from 0.2500 to 0.2200 and log loss from 0.7645 to 0.6390, but accuracy remains fourteen of twenty at threshold 0.5. All data are fictional and the mapped values remain imperfect.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="910" fill="#fff"/><text x="20" y="42" font-size="29" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Better probabilities. Same classes.</text><text x="20" y="76" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fit on one set. Evaluate on different cases.</text><rect x="20" y="120" width="680" height="110" fill="#f1f2ef"/><text x="32" y="149" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Fit T = 1.5850</text><text x="32" y="178" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">20 calibration cases · 2/10 and 8/10 issues</text><text x="32" y="207" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">p: 0.1 / 0.9 → 0.2 / 0.8</text><svg x="20" y="270" width="680" height="355" viewBox="0 0 680 355"><title>Reliability on separate evaluation cases</title><desc>Compare mean positive-class probability with observed event frequency in each nonempty bin. Raw circles are gray; mapped square outlines are green. Points near the diagonal show empirical agreement within those bins.</desc><rect x="74" y="25" width="560" height="240" fill="var(--panel, #f1f2ef)"/><line x1="74" y1="265" x2="634" y2="25" stroke="var(--muted, #626962)" stroke-dasharray="5 4" stroke-width="1.5"/><line x1="74" y1="265" x2="634" y2="265" stroke="var(--line, #a6aca3)" stroke-width="0.5"/><text x="69" y="287" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)" font-weight="400">0</text><text x="47" y="269" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)" font-weight="400">0</text><line x1="74" y1="145" x2="634" y2="145" stroke="var(--line, #a6aca3)" stroke-width="0.5"/><text x="349" y="287" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)" font-weight="400">0.5</text><text x="47" y="149" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)" font-weight="400">0.5</text><line x1="74" y1="25" x2="634" y2="25" stroke="var(--line, #a6aca3)" stroke-width="0.5"/><text x="629" y="287" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)" font-weight="400">1</text><text x="47" y="29" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)" font-weight="400">1</text><text x="74" y="316" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)" font-weight="400">Mean predicted P(issue)</text><text x="16" y="245" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)" transform="rotate(-90 16 245)" font-weight="400">Observed positive fraction</text><circle cx="130" cy="193" r="6" fill="#8c938b"/><circle cx="578" cy="97" r="6" fill="#8c938b"/><rect x="178.99999999999997" y="186" width="14" height="14" fill="none" stroke="var(--accent, #00855b)" stroke-width="2.5"/><rect x="515" y="90" width="14" height="14" fill="none" stroke="var(--accent, #00855b)" stroke-width="2.5"/><circle cx="18" cy="338" r="5" fill="#8c938b"/><text x="30" y="343" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)" font-weight="400">Raw</text><rect x="95" y="332" width="12" height="12" fill="none" stroke="var(--accent, #00855b)" stroke-width="2"/><text x="116" y="343" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)" font-weight="400">Mapped</text><text x="240" y="343" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)" font-weight="400">Dashed: ideal</text></svg><rect x="20" y="660" width="680" height="150" fill="#f1f2ef"/><text x="32" y="689" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Separate evaluation · 20 cases</text><text x="32" y="719" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Brier: 0.2500 → 0.2200</text><text x="32" y="748" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Log loss: 0.7645 → 0.6390</text><text x="32" y="779" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Accuracy at 0.5: 14/20 → 14/20</text><text x="20" y="854" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Five equal-width bins; 10 cases per point. Mapped values still differ from 0.3 and 0.7.</text><text x="20" y="887" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional data. No population guarantee. Temperature constrained to [0.25, 10].</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
