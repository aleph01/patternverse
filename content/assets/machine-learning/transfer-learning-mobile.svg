<svg xmlns="http://www.w3.org/2000/svg" width="360" height="850" viewBox="0 0 360 850" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Transfer Learning: frozen features and fine-tuning</title><desc id="desc">After one computed update, the frozen encoder stays at (a, b) = (1, 0), with training loss 0.250000. Fine-tuning changes its direction to (1, 0.25), with training loss 0.140625. The head remains w = 1 on this step. The four training rows and starting parameters are fictional; no held-out result or source pretraining is measured.</desc><rect width="360" height="850" fill="#fff"/><g transform="translate(16,20)"><rect width="328" height="810" fill="#fff"/><g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="400"><text x="0" y="24" font-size="17" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same starting encoder: h = x₁</text><text x="0" y="51" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Head w = 1 · then train on target rows</text><text x="0" y="78" font-size="15" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">After 1 computed training step</text><line x1="0" y1="101" x2="328" y2="101" stroke="#a6aca3"/><text x="10" y="132" font-size="19" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Frozen features</text><text x="10" y="159" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Only the head can change</text><line x1="36" y1="257" x2="174" y2="257" stroke="#a6aca3"/><line x1="52" y1="277" x2="52" y2="185" stroke="#a6aca3"/><text x="168" y="280" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">a</text><text x="35" y="190" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">b</text><line x1="52" y1="257" x2="104" y2="257" stroke="#626962" stroke-width="2"/><circle cx="104" cy="257" r="4" fill="#626962"/><text x="10" y="309" font-size="15" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">a = 1.000 · b = 0.000</text><text x="10" y="334" font-size="15" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Head w = 1.000</text><text x="10" y="371" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Training loss 0.250000</text><rect x="10" y="387" width="280" height="12" fill="#f1f2ef"/><rect x="10" y="387" width="280" height="12" fill="#626962"/><text x="10" y="421" font-size="13" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Loss bar: 0 to 0.25 · half MSE</text><line x1="0" y1="447" x2="328" y2="447" stroke="#a6aca3"/><text x="10" y="478" font-size="19" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fine-tuning</text><text x="10" y="505" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Encoder and head can change</text><line x1="36" y1="603" x2="174" y2="603" stroke="#a6aca3"/><line x1="52" y1="623" x2="52" y2="531" stroke="#a6aca3"/><text x="168" y="626" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">a</text><text x="35" y="536" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">b</text><line x1="52" y1="603" x2="104" y2="590" stroke="#00855b" stroke-width="2"/><circle cx="104" cy="590" r="4" fill="#00855b"/><text x="10" y="655" font-size="15" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">a = 1.000 · b = 0.250</text><text x="10" y="680" font-size="15" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Head w = 1.000</text><text x="10" y="717" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Training loss 0.140625</text><rect x="10" y="733" width="280" height="12" fill="#f1f2ef"/><rect x="10" y="733" width="157.5" height="12" fill="#00855b"/><text x="10" y="767" font-size="13" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Loss bar: 0 to 0.25 · half MSE</text></g></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
