<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1250" viewBox="0 0 360 1250" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Retain a shared task cue while removing a camera marker</title><desc id="desc">Each of two fictional cameras supplies four normal and four defective examples. The encoder removes the camera marker and retains cue q. The task threshold gets eight of eight correct in each domain. Equal encoded domain counts limit optimal empirical domain lookup to eight of sixteen correct. This balanced example is not a transfer guarantee.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1250" fill="#fff"/><text x="16" y="36" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Keep the defect cue.</text><text x="16" y="72" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Remove the camera.</text><text x="16" y="105" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Sixteen fictional observations.</text><svg x="16" y="125" width="328" height="760" viewBox="0 0 328 760"><title id="diagram-title">A shared cue, two cameras, and two prediction tasks</title><desc id="diagram-desc">Computed encoded counts and task diagnostics from sixteen fictional camera observations.</desc><rect x="0" y="0" width="328" height="142" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="29" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Inputs: eight records per camera</text><text x="14" y="60" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Source: (q, −1); target: (q, +1)</text><text x="14" y="88" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">q = −1 or +1; y = normal or defect</text><text x="14" y="119" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target labels: evaluation only.</text><text x="156" y="168" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">↓</text><rect x="0" y="185" width="328" height="95" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="215" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Encoder: Cue only</text><text x="14" y="246" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">z = q</text><text x="158" y="299" font-size="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">↓</text><rect x="0" y="303" width="328" height="110" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="332" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Task head: Cue q &gt; 0</text><text x="14" y="363" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Source: 8/8 correct</text><text x="14" y="391" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target check: 8/8 correct</text><rect x="0" y="428" width="328" height="92" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="457" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Domain classifier</text><text x="14" y="487" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">8/16 correct (50%)</text><text x="0" y="552" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Encoded counts by domain</text><text x="0" y="579" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">S (top) = source; T (bottom) = target.</text><text x="0" y="612" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">z=[-1]</text><rect x="104" y="595" width="60" height="8" fill="#00855b"/><rect x="104" y="606" width="60" height="8" fill="#edf5f0"/><text x="238" y="612" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">S 4 · T 4</text><text x="0" y="657" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">z=[1]</text><rect x="104" y="640" width="60" height="8" fill="#00855b"/><rect x="104" y="651" width="60" height="8" fill="#edf5f0"/><text x="238" y="657" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">S 4 · T 4</text><text x="0" y="690" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Encoded distributions: equal.</text><text x="0" y="715" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Domain difference: 0.00 (0 = equal; 1 = disjoint).</text><text x="0" y="740" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">No guarantee of target task accuracy.</text></svg><rect x="16" y="930" width="328" height="235" fill="#f1f2ef"/><text x="28" y="960" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">What the bars mean</text><text x="28" y="995" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">z = −1: 4 normal S + 4 normal T.</text><text x="28" y="1024" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">z = +1: 4 defect S + 4 defect T.</text><text x="28" y="1060" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">The task keeps its shared rule.</text><text x="28" y="1089" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">The domain lookup must guess.</text><text x="28" y="1125" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Different class proportions can</text><text x="28" y="1150" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">make the two objectives conflict.</text><text x="16" y="1200" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Empirical fixture only; no neural training</text><text x="16" y="1225" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">or transfer guarantee.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
