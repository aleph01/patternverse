<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Checkpoints: preserve training state, not only weights</title><desc id="desc">A snapshot after three scalar updates contains weight 0.666, momentum minus 2.26, three completed updates and next target three. Complete restoration reproduces next weight 1.0124. Restoring only the weight resets momentum and data position and instead gives 0.6994. These are synthetic training calculations, not prediction-quality measurements.</desc><rect width="720" height="580" fill="#fff"/><g transform="translate(20,20)"><rect width="680" height="540" fill="#fff"/><text x="0" y="24" font-size="20" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Compare training continuations</text><text x="0" y="52" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Checkpoint after 3 updates · toy run</text><text x="0" y="90" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Saved state</text><rect x="0" y="108" width="150" height="70" fill="#f1f2ef" stroke="#a6aca3"/><text x="12" y="131" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weight w</text><text x="12" y="161" font-size="22" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.666</text><rect x="170" y="108" width="150" height="70" fill="#f1f2ef" stroke="#a6aca3"/><text x="182" y="131" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Momentum v</text><text x="182" y="161" font-size="22" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">-2.26</text><rect x="340" y="108" width="150" height="70" fill="#f1f2ef" stroke="#a6aca3"/><text x="352" y="131" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Next target</text><text x="352" y="161" font-size="22" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">3</text><rect x="510" y="108" width="150" height="70" fill="#f1f2ef" stroke="#a6aca3"/><text x="522" y="131" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Updates done</text><text x="522" y="161" font-size="22" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">3</text><path d="M340 190 L340 224" fill="none" stroke="#a6aca3"/><path d="M160 224 L510 224" fill="none" stroke="#a6aca3"/><path d="M160 224 L160 238" fill="none" stroke="#a6aca3"/><path d="M510 224 L510 238" fill="none" stroke="#a6aca3"/><text x="0" y="270" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Complete restore</text><text x="0" y="300" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">v -2.26 · next target 3</text><text x="0" y="326" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Start w 0.666</text><path d="M120 338 L120 361" fill="none" stroke="#a6aca3"/><text x="0" y="396" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">After 1 update:</text><text x="0" y="430" font-size="26" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">w 1.0124</text><text x="350" y="270" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weights only</text><text x="350" y="300" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">v 0 · next target 1</text><text x="350" y="326" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Start w 0.666</text><path d="M470 338 L470 361" fill="none" stroke="#a6aca3"/><text x="350" y="396" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">After 1 update:</text><text x="350" y="430" font-size="26" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">w 0.6994</text><text x="0" y="490" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Chosen minus reference w: -0.313</text><text x="0" y="523" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Recovering a weight alone does not preserve the next update.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
