<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1180" viewBox="0 0 360 1180" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Decision-focused learning compared with prediction-error fitting</title><desc id="desc">Jobs A, B, C use 2, 2, 3 units and have true benefits 6, 5, 10. At capacity four, the best subset A plus B is worth eleven. MSE fitting selects theta 0.1, MSE 0.2475, and job C with regret one. Regret fitting selects theta 1.1, MSE 1.7808, and jobs A plus B with regret zero. Both fit the same 21 candidates to one training case.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1180" fill="#fff"/><text x="16" y="33" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Lower error can</text><text x="16" y="64" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">mean worse decisions.</text><text x="16" y="91" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">An exact three-job training example.</text><rect x="16" y="110" width="328" height="180" fill="#f1f2ef"/><text x="28" y="140" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Budget: 4 units · best true benefit: 11</text><text x="28" y="175" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Job</text><text x="126" y="175" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Units</text><text x="236" y="175" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">True benefit</text><text x="28" y="205" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A</text><text x="126" y="205" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">2</text><text x="236" y="205" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">6</text><text x="28" y="233" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">B</text><text x="126" y="233" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">2</text><text x="236" y="233" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">5</text><text x="28" y="261" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">C</text><text x="126" y="261" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">3</text><text x="236" y="261" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">10</text><svg x="16" y="350" width="328" height="480" viewBox="0 0 328 480"><title>Two fits to the same predictor family and training case</title><desc>Both fits solve the same exact capacity problem. Bars show the true benefit of the action chosen from predictions, relative to the best true feasible benefit.</desc><g transform="translate(0,0)"><rect width="328" height="230" fill="var(--panel, #f1f2ef)"/><text x="12" y="29" font-size="19" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Fit for prediction MSE</text><text x="12" y="56" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Selected θ: 0.1</text><text x="12" y="82" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Prediction MSE: 0.2475</text><text x="12" y="111" font-size="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Choose: C</text><text x="12" y="141" font-size="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">True benefit: 10</text><text x="12" y="169" font-size="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Regret: 1</text><rect x="12" y="190" width="304" height="20" fill="var(--line, #a6aca3)"/><rect x="12" y="190" width="276.3636363636364" height="20" fill="#8c938b"/></g><g transform="translate(0,240)"><rect width="328" height="230" fill="var(--panel, #f1f2ef)"/><text x="12" y="29" font-size="19" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Fit for decision regret</text><text x="12" y="56" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Selected θ: 1.1</text><text x="12" y="82" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Prediction MSE: 1.7808</text><text x="12" y="111" font-size="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Choose: A + B</text><text x="12" y="141" font-size="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">True benefit: 11</text><text x="12" y="169" font-size="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Regret: 0</text><rect x="12" y="190" width="304" height="20" fill="var(--line, #a6aca3)"/><rect x="12" y="190" width="304" height="20" fill="var(--accent, #00855b)"/></g></svg><rect x="16" y="895" width="328" height="130" fill="#f1f2ef"/><text x="28" y="924" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Both search 21 candidate values.</text><text x="28" y="954" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Decisions use predicted benefits.</text><text x="28" y="983" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Regret uses true benefits.</text><text x="16" y="1090" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">One fictional training instance.</text><text x="16" y="1118" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">No held-out generalization is measured.</text><text x="16" y="1150" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Additive benefits; indivisible jobs; exact solves.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
