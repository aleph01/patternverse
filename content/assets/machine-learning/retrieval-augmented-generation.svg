<svg xmlns="http://www.w3.org/2000/svg" width="720" height="940" viewBox="0 0 720 940" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Retrieved evidence enters the context; answer support still needs checking</title><desc id="desc">For a fictional Cedar Hall cancellation question, current public passages P1 and P5 score 2.8669 and 2.2906. P1 states a 24-hour cancellation cutoff; P5 concerns booking duration. Metadata filtering excludes superseded P2 and staff-only P4. An illustrated human-authored draft cites P1. Generation and semantic support checking are conceptual, not executed.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="940" fill="#fff"/><text x="20" y="42" font-size="29" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Retrieve evidence. Check the answer.</text><text x="20" y="80" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Question → eligible passages → context → generation → claim checking.</text><svg x="20" y="125" width="680" height="430" viewBox="0 0 680 430"><title id="flow-title">Retrieve eligible passages, assemble sources, then generate and check an answer</title><desc id="flow-desc">The first two stages are computed. Generation and claim checking are conceptual and are not executed. Source scores do not establish answer support.</desc><rect x="0" y="0" width="210" height="245" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="30" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">1. Retrieve evidence</text><text x="12" y="62" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">4/6 eligible; top 2 requested</text><text x="12" y="100" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">P1 · score 2.8669</text><text x="12" y="130" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">P5 · score 2.2906</text><text x="12" y="229" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Scores do not establish support.</text><rect x="235" y="0" width="210" height="205" fill="#f1f2ef" stroke="#00855b"/><text x="247" y="30" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">2. Assemble context</text><text x="247" y="65" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Question + source passages</text><text x="247" y="98" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Keep IDs and revisions</text><text x="247" y="132" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">P1 → P5</text><text x="247" y="171" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0 superseded in context</text><rect x="470" y="0" width="210" height="205" fill="#f1f2ef" stroke="#00855b"/><text x="482" y="30" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">3. Generate + check</text><text x="482" y="65" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Draft from evidence</text><text x="482" y="98" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Check claim ↔ source</text><text x="482" y="135" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Model not run here.</text><text x="482" y="174" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Citations need support.</text><text x="0" y="315" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Retrieved text is evidence to inspect, not a verified answer.</text><text x="0" y="345" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Permission and version filters precede context assembly; relevance is a separate question.</text></svg><rect x="20" y="590" width="680" height="240" fill="#f1f2ef"/><text x="32" y="620" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">From source to supported claim</text><text x="32" y="655" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">[P1] Members may cancel a room booking without a fee until 24 hours before its</text><text x="32" y="679" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">start.</text><text x="32" y="718" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Human-authored answer draft:</text><text x="32" y="746" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Cancel without a fee at least 24 hours before the booking starts [P1].</text><text x="20" y="875" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">P5 is retrieved too, but its booking-duration rule does not support the cancellation claim.</text><text x="20" y="916" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Current public evidence: P1 at 2.8669; P5 at 2.2906. Citation presence is not verification.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
