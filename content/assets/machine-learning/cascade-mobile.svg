<svg xmlns="http://www.w3.org/2000/svg" width="360" height="770" viewBox="0 0 360 770" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Cascade: routing, early misses and avoided later work</title><desc id="desc">Eight fictional parts reach a gate with threshold 0.30. Parts A, B, C, E and F continue, while D, G and H stop. D is a reviewed defect that the later model never sees. The cascade finds three of four defects. Gate work eight milliseconds plus later work sixty milliseconds totals sixty-eight, versus ninety-six for the later model alone. Supplied costs are not measured latency.</desc><rect width="360" height="770" fill="#fff"/><g transform="translate(16,20)"><rect width="328" height="730" fill="#fff"/><text x="0" y="24" font-size="20" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Gate, then inspect survivors</text><text x="0" y="52" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Continue if score ≥ 0.30</text><text x="0" y="78" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Green = reviewed defect, not an input.</text><text x="0" y="118" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Stage 1 · all 8 parts</text><text x="0" y="146" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1 ms each · 8 ms work</text><rect x="0" y="164" width="32" height="36" fill="#edf5f0" stroke="#00855b"/><text x="11" y="188" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A</text><rect x="40" y="164" width="32" height="36" fill="#edf5f0" stroke="#00855b"/><text x="51" y="188" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">B</text><rect x="80" y="164" width="32" height="36" fill="#edf5f0" stroke="#00855b"/><text x="91" y="188" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">C</text><rect x="120" y="164" width="32" height="36" fill="#edf5f0" stroke="#00855b"/><text x="131" y="188" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">D</text><rect x="160" y="164" width="32" height="36" fill="#f1f2ef" stroke="#a6aca3"/><text x="171" y="188" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">E</text><rect x="200" y="164" width="32" height="36" fill="#f1f2ef" stroke="#a6aca3"/><text x="211" y="188" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F</text><rect x="240" y="164" width="32" height="36" fill="#f1f2ef" stroke="#a6aca3"/><text x="251" y="188" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">G</text><rect x="280" y="164" width="32" height="36" fill="#f1f2ef" stroke="#a6aca3"/><text x="291" y="188" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">H</text><path d="M156 214 L156 238" fill="none" stroke="#a6aca3"/><path d="M156 238 L318 238" fill="none" stroke="#a6aca3"/><path d="M318 238 L318 444" fill="none" stroke="#a6aca3"/><path d="M318 258 L300 258" fill="none" stroke="#a6aca3"/><path d="M318 444 L156 444" fill="none" stroke="#a6aca3"/><text x="0" y="274" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Stage 2 · 5 parts</text><text x="0" y="302" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">12 ms each · 60 ms work</text><rect x="0" y="322" width="32" height="36" fill="#edf5f0" stroke="#00855b"/><text x="11" y="346" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A</text><rect x="40" y="322" width="32" height="36" fill="#edf5f0" stroke="#00855b"/><text x="51" y="346" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">B</text><rect x="80" y="322" width="32" height="36" fill="#edf5f0" stroke="#00855b"/><text x="91" y="346" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">C</text><rect x="120" y="322" width="32" height="36" fill="#f1f2ef" stroke="#a6aca3"/><text x="131" y="346" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">E</text><rect x="160" y="322" width="32" height="36" fill="#f1f2ef" stroke="#a6aca3"/><text x="171" y="346" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F</text><text x="0" y="386" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Flagged: A B C</text><text x="0" y="460" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Stopped · 3 parts</text><text x="0" y="488" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Set ordinary; skip stage 2</text><rect x="0" y="508" width="32" height="36" fill="#edf5f0" stroke="#00855b"/><text x="11" y="532" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">D</text><rect x="40" y="508" width="32" height="36" fill="#f1f2ef" stroke="#a6aca3"/><text x="51" y="532" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">G</text><rect x="80" y="508" width="32" height="36" fill="#f1f2ef" stroke="#a6aca3"/><text x="91" y="532" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">H</text><text x="0" y="582" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Missed here: D</text><text x="0" y="640" font-size="20" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Work: 8 + 60 = 68 ms</text><text x="0" y="671" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Defects found: 3/4 · later alone 4/4</text><text x="0" y="710" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Early exits can hide recoverable defects.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
