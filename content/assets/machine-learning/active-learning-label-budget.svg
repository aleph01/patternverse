<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Active learning with the same labeling budget</title><desc id="desc">Before querying, both fitted cutoffs are 50 and both classify 174 of 200 separate test scores correctly. With two extra labels per strategy, uncertainty selection fits 62.5 and gets 199 correct; seeded random selection fits 53 and gets 180 correct. The simulator's true cutoff is 63.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="650" fill="#fff"/><text x="20" y="37" font-size="29" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Choose what to label next</text><text x="20" y="68" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Two strategies start with two labels, then each requests two more.</text><g transform="translate(20,120)"><text font-size="20" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Before querying</text><text y="25" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2 training labels per strategy</text><svg y="43" width="328" height="370" viewBox="0 0 328 370"><title>Two fitted classifiers after 0 query rounds</title><desc>Shaded intervals contain cutoffs consistent with revealed labels. Solid lines show fitted cutoffs; dashed lines show the simulator truth.</desc><rect x="0" y="2" width="328" height="174" fill="var(--panel, #f1f2ef)"/><text x="12" y="27" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Uncertainty selection</text><text x="12" y="51" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Possible cutoff: (0, 100]</text><text x="12" y="74" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Fitted cutoff: 50</text><text x="12" y="97" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Test: 174/200 correct (87.0%)</text><rect x="18" y="112" width="292" height="26" fill="var(--band, #edf5f0)"/><line x1="18" x2="310" y1="133" y2="133" stroke="var(--line, #a6aca3)"/><line x1="201.96" x2="201.96" y1="106" y2="142" stroke="var(--ink, #252c28)" stroke-width="2" stroke-dasharray="4 3"/><line x1="164" x2="164" y1="110" y2="138" stroke="var(--accent, #00855b)" stroke-width="3"/><text x="18" y="160" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">0</text><text x="91" y="160" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">25</text><text x="164" y="160" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">50</text><text x="237" y="160" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">75</text><text x="310" y="160" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">100</text><rect x="0" y="186" width="328" height="174" fill="var(--panel, #f1f2ef)"/><text x="12" y="211" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Random selection</text><text x="12" y="235" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Possible cutoff: (0, 100]</text><text x="12" y="258" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Fitted cutoff: 50</text><text x="12" y="281" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Test: 174/200 correct (87.0%)</text><rect x="18" y="296" width="292" height="26" fill="var(--band, #edf5f0)"/><line x1="18" x2="310" y1="317" y2="317" stroke="var(--line, #a6aca3)"/><line x1="201.96" x2="201.96" y1="290" y2="326" stroke="var(--ink, #252c28)" stroke-width="2" stroke-dasharray="4 3"/><line x1="164" x2="164" y1="294" y2="322" stroke="var(--accent, #00855b)" stroke-width="3"/><text x="18" y="344" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">0</text><text x="91" y="344" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">25</text><text x="164" y="344" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">50</text><text x="237" y="344" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">75</text><text x="310" y="344" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">100</text></svg></g><g transform="translate(372,120)"><text font-size="20" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">After two queries</text><text y="25" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">4 training labels per strategy</text><svg y="43" width="328" height="370" viewBox="0 0 328 370"><title>Two fitted classifiers after 2 query rounds</title><desc>Shaded intervals contain cutoffs consistent with revealed labels. Solid lines show fitted cutoffs; dashed lines show the simulator truth.</desc><rect x="0" y="2" width="328" height="174" fill="var(--panel, #f1f2ef)"/><text x="12" y="27" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Uncertainty selection</text><text x="12" y="51" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Possible cutoff: (50, 75]</text><text x="12" y="74" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Fitted cutoff: 62.5</text><text x="12" y="97" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Test: 199/200 correct (99.5%)</text><rect x="164" y="112" width="73" height="26" fill="var(--band, #edf5f0)"/><line x1="18" x2="310" y1="133" y2="133" stroke="var(--line, #a6aca3)"/><line x1="201.96" x2="201.96" y1="106" y2="142" stroke="var(--ink, #252c28)" stroke-width="2" stroke-dasharray="4 3"/><line x1="200.5" x2="200.5" y1="110" y2="138" stroke="var(--accent, #00855b)" stroke-width="3"/><text x="18" y="160" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">0</text><text x="91" y="160" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">25</text><text x="164" y="160" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">50</text><text x="237" y="160" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">75</text><text x="310" y="160" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">100</text><rect x="0" y="186" width="328" height="174" fill="var(--panel, #f1f2ef)"/><text x="12" y="211" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Random selection</text><text x="12" y="235" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Possible cutoff: (6, 100]</text><text x="12" y="258" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Fitted cutoff: 53</text><text x="12" y="281" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Test: 180/200 correct (90.0%)</text><rect x="35.519999999999996" y="296" width="274.48" height="26" fill="var(--band, #edf5f0)"/><line x1="18" x2="310" y1="317" y2="317" stroke="var(--line, #a6aca3)"/><line x1="201.96" x2="201.96" y1="290" y2="326" stroke="var(--ink, #252c28)" stroke-width="2" stroke-dasharray="4 3"/><line x1="172.76" x2="172.76" y1="294" y2="322" stroke="var(--accent, #00855b)" stroke-width="3"/><text x="18" y="344" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">0</text><text x="91" y="344" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">25</text><text x="164" y="344" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">50</text><text x="237" y="344" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">75</text><text x="310" y="344" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)" text-anchor="middle">100</text></svg></g><text x="20" y="580" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Solid: fitted cutoff. Dashed: truth. Shading: possible cutoffs after labeling.</text><text x="20" y="610" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Synthetic, noiseless scenario; true cutoff 63, random seed 2026, 200 separate test scores.</text><text x="20" y="635" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">These intervals describe model consistency, not statistical confidence.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
