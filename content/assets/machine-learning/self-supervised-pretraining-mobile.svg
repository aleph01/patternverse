<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1250" viewBox="0 0 360 1250" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Self-supervised pretraining and separate task adaptation</title><desc id="desc">Raw words create masked and next-token targets. Optimizing this prediction task learns model parameters. A separate labeled delivery-complaint example is used for adaptation, and independent intent evaluation is required. Token targets do not create intent annotations.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1250" fill="#fff"/><text x="16" y="33" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Create targets.</text><text x="16" y="64" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Transfer parameters.</text><text x="16" y="91" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">The pretraining task is not the final task.</text><rect x="16" y="110" width="328" height="95" fill="#f1f2ef"/><text x="28" y="138" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Raw example · no intent annotation</text><text x="28" y="174" font-size="20" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">the parcel arrived late</text><rect x="16" y="245" width="328" height="173" fill="#f1f2ef"/><text x="28" y="273" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Masked-token prediction</text><text x="28" y="311" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">the [MASK] arrived</text><text x="28" y="337" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">late</text><text x="28" y="374" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Target from text: parcel</text><text x="28" y="400" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Selected word hidden; context remains.</text><rect x="16" y="450" width="328" height="173" fill="#f1f2ef"/><text x="28" y="478" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Next-token prediction</text><text x="28" y="516" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">the parcel arrived</text><text x="28" y="579" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Target from text: late</text><text x="28" y="605" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Future words withheld.</text><rect x="16" y="665" width="328" height="100" fill="#f1f2ef"/><text x="28" y="694" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">↓ Optimize the pretraining objective</text><text x="28" y="722" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Learn encoder + word-prediction head.</text><text x="28" y="748" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Toy corpus: 5 lines → 20 token targets.</text><text x="16" y="804" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">↓ Reuse parameters for a new task</text><rect x="16" y="825" width="328" height="130" fill="#f1f2ef"/><text x="28" y="853" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Reuse encoder; add intent head</text><text x="28" y="884" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">“my parcel is late”</text><text x="28" y="912" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">→ Delivery complaint</text><rect x="16" y="1015" width="328" height="110" fill="#f1f2ef"/><text x="28" y="1044" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">↓ Adapt, then evaluate</text><text x="28" y="1073" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Freeze encoder or fine-tune it.</text><text x="28" y="1101" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Test intent recognition independently.</text><text x="16" y="1170" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Lower word loss does not prove task accuracy.</text><text x="16" y="1202" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Illustrative neural workflow; fictional message labels.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
