<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">A datasheet connects collection choices to a specific dataset release</title><desc id="desc">Fictional pump-sounds 1.0 starts with 12,000 clips. Sequential non-overlapping exclusions remove 300 unreadable files, 900 duplicate copies, and 800 clips with unverified run conditions. The release contains 10,000 ten-second clips from forty pumps, totaling 100,000 seconds of audio. Training, validation, and test contain separate groups of 28, six, and six pumps with 7,000, 1,500, and 1,500 clips. Labels describe controlled normal or induced-fault conditions, not future breakdowns. Release 1.1 corrects 150 labels, or 1.5 percent, while retaining identifiers and schema. Documentation does not grant rights or establish deployment validity.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="1040" fill="#fff"/><text x="20" y="43" font-size="29" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Files need a history.</text><text x="20" y="80" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Record units, selection rules, labels, and use conditions travel together.</text><rect x="20" y="130" width="680" height="100" fill="#f1f2ef" stroke="#a6aca3"/><text x="32" y="161" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">pump-sounds 1.0</text><text x="32" y="192" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">12,000 candidate clips · 40 pumps</text><text x="32" y="218" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">10 seconds · 16 kHz mono · indoor recordings</text><rect x="20" y="265" width="305" height="230" fill="#f1f2ef" stroke="#a6aca3"/><text x="32" y="295" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Collection ledger C12</text><text x="32" y="330" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Start: 12,000 clips</text><text x="32" y="363" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">−300 unreadable files</text><text x="32" y="395" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">−900 duplicate copies</text><text x="32" y="427" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">−800 unverified condition</text><text x="32" y="469" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Release: 10,000 clips</text><rect x="345" y="265" width="355" height="190" fill="#f1f2ef" stroke="#a6aca3"/><text x="357" y="295" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">What the release represents</text><text x="357" y="330" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">10,000 clips from 40 pumps</text><text x="357" y="362" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">100,000 seconds of audio</text><text x="357" y="394" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">27 hours, 46 minutes, 40 seconds</text><text x="357" y="430" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Repeated clips remain related observations.</text><rect x="20" y="540" width="680" height="155" fill="#f1f2ef" stroke="#a6aca3"/><text x="32" y="570" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Keep each pump in one split</text><text x="32" y="607" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Training</text><text x="32" y="633" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">28 pumps · 7,000 clips</text><text x="252" y="607" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Validation</text><text x="252" y="633" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">6 pumps · 1,500 clips</text><text x="472" y="607" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Test</text><text x="472" y="633" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">6 pumps · 1,500 clips</text><rect x="20" y="730" width="680" height="230" fill="#f1f2ef" stroke="#a6aca3"/><text x="32" y="760" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Meaning, boundaries, maintenance</text><text x="32" y="795" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Labels describe controlled normal or induced bearing-fault run conditions.</text><text x="32" y="824" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Natural failures and outdoor conditions are not represented.</text><text x="32" y="853" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Owner: Reliability Data · pipeline P4 · pump-split manifest S1</text><text x="32" y="882" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Release 1.1 corrects 150 labels (1.5%); identifiers and schema stay fixed.</text><text x="32" y="911" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Record changes and notify downstream users.</text><text x="20" y="1007" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional counts · documentation does not grant rights or establish deployment validity.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
