<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1220" viewBox="0 0 720 1220" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Quantization can shrink storage while changing a model decision</title><desc id="desc">A fictional two-output classifier quantizes six weights to four-bit symmetric codes with one shared scale. Small A weights round to zero; B codes are seven, minus five, two. Input D2 has eight-bit codes 119,102,51. Integer sums zero and 425 give scores about 0.0500 and 0.0762 after floating output scaling and bias addition, changing the original float winner A to B. A number line shows the first A weight 0.12 rounding to zero. Per-output scales restore A in this example. Weight codes alone occupy three bytes, but the custom parameter record occupies nineteen bytes with one scale or twenty-three with two, versus thirty-two FP32 weight-and-bias bytes. No task accuracy or device performance is measured.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="1220" fill="#fff"/><text x="20" y="42" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A smaller grid can change the winner.</text><text x="20" y="82" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Six weights. Integer dot products. Floating-point output scaling and biases.</text><svg x="20" y="125" width="680" height="800" viewBox="0 0 680 800"><title id="diagram-title">Rounding weights and inputs changes a small model output</title><desc id="diagram-desc">Computed input codes, weight codes and scales, a local quantization grid for the first A weight, integer accumulators, floating-point output scores, and prediction agreement.</desc><rect x="0" y="0" width="680" height="110" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="29" font-size="18" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Input D2 → 8-bit codes</text><text x="14" y="61" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">x = (0.4650, 0.4000, 0.2000)</text><text x="14" y="91" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">qx = (119, 102, 51); input scale 0.003922</text><text x="334" y="132" font-size="22" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">↓</text><rect x="0" y="140" width="680" height="140" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="168" font-size="17" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">4-bit weights · shared scale</text><text x="14" y="198" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">sA = 0.285714; sB = 0.285714</text><text x="14" y="228" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A codes: (0, 0, 0)</text><text x="14" y="258" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">B codes: (7, -5, 2)</text><text x="0" y="320" font-size="16" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">First A weight: 0.1200 → 0.0000</text><line x1="40" y1="412" x2="640" y2="412" stroke="#a6aca3"/><line x1="100" y1="405" x2="100" y2="419" stroke="#626962"/><text x="100" y="375" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">q=-2</text><text x="100" y="444" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">-0.5714</text><line x1="220" y1="405" x2="220" y2="419" stroke="#626962"/><text x="220" y="375" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">q=-1</text><text x="220" y="444" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">-0.2857</text><line x1="340" y1="405" x2="340" y2="419" stroke="#626962"/><text x="340" y="375" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">q=0</text><text x="340" y="444" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.0000</text><line x1="460" y1="405" x2="460" y2="419" stroke="#626962"/><text x="460" y="375" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">q=1</text><text x="460" y="444" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.2857</text><line x1="580" y1="405" x2="580" y2="419" stroke="#626962"/><text x="580" y="375" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">q=2</text><text x="580" y="444" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.5714</text><line x1="390.39999662041674" y1="393" x2="340" y2="412" stroke="#00855b" stroke-width="2"/><path d="M 390.39999662041674 385 l 6 7 l -6 7 l -6 -7 Z" fill="#252c28"/><circle cx="340" cy="412" r="5" fill="#00855b"/><text x="0" y="480" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Diamond: original; circle: reconstructed.</text><rect x="0" y="525" width="680" height="150" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="554" font-size="17" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Scores: float → quantized</text><text x="14" y="586" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A sum 0: 0.0818 → 0.0500</text><text x="14" y="617" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">B sum 425: 0.0300 → 0.0762</text><text x="14" y="649" font-size="15" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Winner: float A → quantized B</text><text x="0" y="709" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Selected input coordinates clipped: 0</text><text x="0" y="738" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Agreement with float reference: 2/4</text><text x="0" y="782" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">No task-accuracy or latency estimate.</text></svg><rect x="20" y="970" width="680" height="160" fill="#f1f2ef"/><text x="32" y="1000" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Count more than the weight codes</text><text x="32" y="1034" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">FP32 weights and biases: 32 bytes. Packed 4-bit weight codes alone: 3 bytes.</text><text x="32" y="1066" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Shared grid: 3 code + 4 weight-scale + 8 bias + 4 input-scale bytes = 19.</text><text x="32" y="1098" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Per-output scales: 23 bytes; D2 winner A instead of B.</text><text x="20" y="1188" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Custom packed record; implicit zero points. No model-file, RAM, or speedup estimate.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
