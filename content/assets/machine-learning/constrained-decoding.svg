<svg xmlns="http://www.w3.org/2000/svg" width="720" height="940" viewBox="0 0 720 940" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">A legal token mask enforces structure without establishing the intended label</title><desc id="desc">For the fictional prefix of a label object, five of ten handcrafted tokens retain 49 percent of the base probability. HOLD has base probability 20 percent and masked probability 20 over 49, about 40.82 percent. Greedy selection emits HOLD, a closing brace, and EOS. The resulting object is accepted but disagrees with the human reference RENEW. A combined RENEW-and-brace token also illustrates whole-token matching. No model inference or task accuracy measurement runs.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="940" fill="#fff"/><text x="20" y="42" font-size="29" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Valid structure. Meaning still matters.</text><text x="20" y="80" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Prefix → whole-token legality → mask and normalize → choose a continuation.</text><svg x="20" y="125" width="680" height="470" viewBox="0 0 680 470"><title id="flow-title">Check the complete token piece, mask, and select a continuation</title><desc id="flow-desc">A finite output language defines legal prefixes. The first-step mask removes disallowed tokens and renormalizes the remaining weights. A greedy trace may finish a structurally valid object without choosing the human reference label.</desc><rect x="0" y="0" width="210" height="225" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="29" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">1. Track the prefix</text><text x="12" y="68" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">{"label":</text><text x="12" y="105" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A completion exists.</text><text x="12" y="140" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Check whole token pieces,</text><text x="12" y="164" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">not just the first character.</text><text x="12" y="202" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">EOS needs a complete object.</text><rect x="235" y="0" width="210" height="225" fill="#f1f2ef" stroke="#00855b"/><text x="247" y="29" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">2. Mask + normalize</text><text x="247" y="68" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">5/10 grammar-legal tokens</text><text x="247" y="105" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Retained: 49.00%</text><text x="247" y="140" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Mask enabled</text><text x="247" y="177" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Effective distribution</text><text x="247" y="201" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">sums to 1.</text><rect x="470" y="0" width="210" height="225" fill="#f1f2ef" stroke="#00855b"/><text x="482" y="29" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">3. Greedy selection</text><text x="482" y="68" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">First: T1 at 40.82%</text><text x="482" y="105" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">FINISHED</text><text x="482" y="140" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">New tokens: 3</text><text x="482" y="176" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Text accepted: yes</text><text x="482" y="202" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">EOS emitted: yes</text><rect x="0" y="300" width="680" height="125" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="329" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Structure and meaning differ</text><text x="12" y="363" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Human reference: RENEW</text><text x="12" y="394" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A permitted token or accepted object does not establish the right label for the request.</text></svg><rect x="20" y="645" width="680" height="190" fill="#f1f2ef"/><text x="32" y="675" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Computed complete output</text><text x="32" y="711" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">{"label":"HOLD"}</text><text x="32" y="745" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Human reference: RENEW</text><text x="32" y="784" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">T1 starts at 20%; masking gives 20/49 ≈ 40.82%.</text><text x="32" y="815" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">The mask excludes invalid strings; it does not choose the intended task label.</text><text x="20" y="882" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Combined token T8 contains the value and closing brace: "RENEW"}</text><text x="20" y="924" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">EOS is allowed only after a complete object. A token limit can still interrupt generation.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
