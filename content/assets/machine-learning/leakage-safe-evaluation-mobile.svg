<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1110" viewBox="0 0 360 1110" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Two evaluation splits with equal row counts</title><desc id="desc">Eight fictional customers have two visits each. Holding out second visits shares eight customer IDs and the fitted ID lookup gets eight of eight correct. Holding out customers E through H shares no IDs and gets four of eight correct. Both train and test on eight rows, and both majority baselines get four of eight. The appropriate evaluation depends on whether the claim concerns known or unseen customers.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1110" fill="#fff"/><text x="16" y="34" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Which customers</text><text x="16" y="66" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">are unseen?</text><text x="16" y="94" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same row counts. Different questions.</text><rect x="16" y="115" width="328" height="130" fill="#f1f2ef"/><text x="28" y="144" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Claim: predict for unseen customers.</text><text x="28" y="174" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">8 customers · 2 visits per customer</text><text x="28" y="201" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">IDs:       A  B  C  D  E  F  G  H</text><text x="28" y="228" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Labels:  0  1  0  1  0  1  0  1</text><svg x="16" y="275" width="328" height="560" viewBox="0 0 328 560"><title>Equal row counts, different identity boundaries</title><desc>Visit holdout shares customers across training and test. Whole-customer holdout separates them. Correctness is calculated from actual fitted predictors.</desc><g transform="translate(0,0)"><rect width="328" height="270" fill="var(--panel, #f1f2ef)"/><text x="12" y="29" font-size="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Hold out second visits</text><text x="12" y="55" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">8 train rows · 8 test rows</text><text x="12" y="81" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Shared customer IDs: 8</text><text x="12" y="108" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Train IDs: A B C D E F G H</text><text x="12" y="132" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Test IDs: A B C D E F G H</text><text x="12" y="164" font-size="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">ID lookup: 8/8 (100.0%)</text><text x="12" y="191" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Majority baseline: 4/8 (50.0%)</text><text x="12" y="218" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Unseen test IDs: 0/8</text><rect x="12" y="240" width="304" height="18" fill="var(--line, #a6aca3)"/><rect x="12" y="240" width="304" height="18" fill="#8c938b"/></g><g transform="translate(0,280)"><rect width="328" height="270" fill="var(--panel, #f1f2ef)"/><text x="12" y="29" font-size="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Hold out customers</text><text x="12" y="55" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">8 train rows · 8 test rows</text><text x="12" y="81" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Shared customer IDs: 0</text><text x="12" y="108" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Train IDs: A B C D</text><text x="12" y="132" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Test IDs: E F G H</text><text x="12" y="164" font-size="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">ID lookup: 4/8 (50.0%)</text><text x="12" y="191" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Majority baseline: 4/8 (50.0%)</text><text x="12" y="218" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="var(--ink, #252c28)">Unseen test IDs: 4/4</text><rect x="12" y="240" width="304" height="18" fill="var(--line, #a6aca3)"/><rect x="12" y="240" width="152" height="18" fill="var(--accent, #00855b)"/></g></svg><rect x="16" y="865" width="328" height="150" fill="#f1f2ef"/><text x="28" y="894" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Fit: store training ID labels.</text><text x="28" y="924" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Unfamiliar ID? Use training majority.</text><text x="28" y="953" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Only the second design tests</text><text x="28" y="978" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">IDs absent from fitting.</text><text x="28" y="1003" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Ties predict zero; labels stay constant.</text><text x="16" y="1050" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional data. Four grouped test customers.</text><text x="16" y="1076" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Identity separation alone does not test</text><text x="16" y="1098" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">time drift or feature availability.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
