<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1180" viewBox="0 0 360 1180" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Off-policy evaluation combines reward predictions and weighted residual corrections</title><desc id="desc">A fictional eight-row sample has direct reward-model average point seven. The mean importance-weighted residual correction is minus point four six eight seven five, giving doubly robust estimate point two three one two five. A rare observed B failure has weight five and individual corrected row minus three point two. The corresponding exact toy expectation is point six two five; only the invented potential outcomes make that expectation directly computable. No confidence interval or deployment effect is claimed.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1180" fill="#fff"/><text x="16" y="34" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Estimate a policy.</text><text x="16" y="68" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Check the evidence.</text><text x="16" y="100" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Model predictions meet logged outcomes.</text><svg x="16" y="125" width="328" height="740" viewBox="0 0 328 740"><title id="flow-title">Combine a target reward prediction with a weighted model-error correction</title><desc id="flow-desc">Direct estimate 0.700. Average correction -0.469 gives doubly robust estimate 0.231.</desc><rect x="0" y="0" width="328" height="150" fill="#f1f2ef"/><text x="12" y="27" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Model baseline</text><text x="12" y="57" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Average target prediction</text><text x="12" y="87" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">DM 0.700</text><text x="12" y="117" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">8 fixed contexts</text><text x="154" y="178" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">+</text><rect x="0" y="190" width="328" height="150" fill="#f1f2ef"/><text x="12" y="217" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Correct model errors</text><text x="12" y="247" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Use observed residuals</text><text x="12" y="277" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Mean correction -0.469</text><text x="12" y="307" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weight by target / logger</text><text x="154" y="368" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">=</text><rect x="0" y="380" width="328" height="150" fill="#f1f2ef"/><text x="12" y="407" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Combine the evidence</text><text x="12" y="437" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">DM + mean correction</text><text x="12" y="467" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">DR 0.231</text><text x="12" y="497" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A small log can be unstable</text><rect x="0" y="570" width="328" height="140" fill="#edf5f0"/><text x="12" y="598" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">R08 · Complex · chosen B</text><text x="12" y="628" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">q(B) 0.800 · r 0 · p used 0.200</text><text x="12" y="658" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Row DR: 0.800 + 5.000 × (0 − 0.800)</text><text x="12" y="688" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">= -3.200 before averaging all eight rows</text></svg><rect x="16" y="910" width="328" height="155" fill="#f1f2ef"/><text x="28" y="938" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A sample differs from its expectation</text><text x="28" y="971" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Sample DR 0.23125</text><text x="28" y="1004" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Exact toy expected DR 0.62500</text><text x="28" y="1037" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Known only in this synthetic world.</text><text x="16" y="1120" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Correct propensities; approximate reward model.</text><text x="16" y="1154" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Eight fictional rows; no confidence interval.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
