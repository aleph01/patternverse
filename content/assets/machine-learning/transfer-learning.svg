<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Transfer Learning: frozen features and fine-tuning</title><desc id="desc">After one computed update, the frozen encoder stays at (a, b) = (1, 0), with training loss 0.250000. Fine-tuning changes its direction to (1, 0.25), with training loss 0.140625. The head remains w = 1 on this step. The four training rows and starting parameters are fictional; no held-out result or source pretraining is measured.</desc><rect width="720" height="520" fill="#fff"/><g transform="translate(20,20)"><rect width="680" height="480" fill="#fff"/><g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="400"><text x="0" y="24" font-size="20" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same starting encoder: h = x₁</text><text x="0" y="51" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Head w = 1 · then train on target rows</text><text x="0" y="78" font-size="15" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">After 1 computed training step</text><line x1="0" y1="101" x2="680" y2="101" stroke="#a6aca3"/><text x="0" y="138" font-size="19" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Frozen features</text><text x="0" y="165" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Only the head can change</text><line x1="26" y1="263" x2="164" y2="263" stroke="#a6aca3"/><line x1="42" y1="283" x2="42" y2="191" stroke="#a6aca3"/><text x="158" y="286" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">a</text><text x="25" y="196" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">b</text><line x1="42" y1="263" x2="94" y2="263" stroke="#626962" stroke-width="2"/><circle cx="94" cy="263" r="4" fill="#626962"/><text x="0" y="315" font-size="15" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">a = 1.000 · b = 0.000</text><text x="0" y="340" font-size="15" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Head w = 1.000</text><text x="0" y="377" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Training loss 0.250000</text><rect x="0" y="393" width="280" height="12" fill="#f1f2ef"/><rect x="0" y="393" width="280" height="12" fill="#626962"/><text x="0" y="427" font-size="13" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Loss bar: 0 to 0.25 · half MSE</text><line x1="325" y1="120" x2="325" y2="439" stroke="#a6aca3"/><text x="355" y="138" font-size="19" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fine-tuning</text><text x="355" y="165" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Encoder and head can change</text><line x1="381" y1="263" x2="519" y2="263" stroke="#a6aca3"/><line x1="397" y1="283" x2="397" y2="191" stroke="#a6aca3"/><text x="513" y="286" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">a</text><text x="380" y="196" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">b</text><line x1="397" y1="263" x2="449" y2="250" stroke="#00855b" stroke-width="2"/><circle cx="449" cy="250" r="4" fill="#00855b"/><text x="355" y="315" font-size="15" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">a = 1.000 · b = 0.250</text><text x="355" y="340" font-size="15" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Head w = 1.000</text><text x="355" y="377" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Training loss 0.140625</text><rect x="355" y="393" width="280" height="12" fill="#f1f2ef"/><rect x="355" y="393" width="157.5" height="12" fill="#00855b"/><text x="355" y="427" font-size="13" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Loss bar: 0 to 0.25 · half MSE</text></g></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
