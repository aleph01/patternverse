<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Off-policy evaluation combines reward predictions and weighted residual corrections</title><desc id="desc">A fictional eight-row sample has direct reward-model average point seven. The mean importance-weighted residual correction is minus point four six eight seven five, giving doubly robust estimate point two three one two five. A rare observed B failure has weight five and individual corrected row minus three point two. The corresponding exact toy expectation is point six two five; only the invented potential outcomes make that expectation directly computable. No confidence interval or deployment effect is claimed.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="800" fill="#fff"/><text x="20" y="42" font-size="29" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Estimate a policy. Check the evidence.</text><text x="20" y="78" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Doubly robust estimation corrects a reward model using observed feedback.</text><svg x="20" y="125" width="680" height="360" viewBox="0 0 680 360"><title id="flow-title">Combine a target reward prediction with a weighted model-error correction</title><desc id="flow-desc">Direct estimate 0.700. Average correction -0.469 gives doubly robust estimate 0.231.</desc><rect x="0" y="0" width="208" height="150" fill="#f1f2ef"/><text x="12" y="27" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Model baseline</text><text x="12" y="57" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Average target prediction</text><text x="12" y="87" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">DM 0.700</text><text x="12" y="117" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">8 fixed contexts</text><text x="214" y="83" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">+</text><rect x="236" y="0" width="208" height="150" fill="#f1f2ef"/><text x="248" y="27" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Correct model errors</text><text x="248" y="57" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Use observed residuals</text><text x="248" y="87" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Mean correction -0.469</text><text x="248" y="117" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weight by target / logger</text><text x="450" y="83" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">=</text><rect x="472" y="0" width="208" height="150" fill="#f1f2ef"/><text x="484" y="27" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Combine the evidence</text><text x="484" y="57" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">DM + mean correction</text><text x="484" y="87" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">DR 0.231</text><text x="484" y="117" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A small log can be unstable</text><rect x="0" y="195" width="680" height="140" fill="#edf5f0"/><text x="12" y="223" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">R08 · Complex · chosen B</text><text x="12" y="253" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">q(B) 0.800 · r 0 · p used 0.200</text><text x="12" y="283" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Row DR: 0.800 + 5.000 × (0 − 0.800)</text><text x="12" y="313" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">= -3.200 before averaging all eight rows</text></svg><rect x="20" y="530" width="680" height="155" fill="#f1f2ef"/><text x="32" y="558" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A sample differs from its expectation</text><text x="32" y="591" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Sample DR 0.23125</text><text x="32" y="624" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Exact toy expected DR 0.62500</text><text x="32" y="657" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Known only in this synthetic world.</text><text x="20" y="735" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">IPS 0.31250 · DM 0.70000 · a rare outcome can drive the correction.</text><text x="20" y="775" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Eight fictional rows · correct propensities · approximate model · no confidence interval.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
