<svg xmlns="http://www.w3.org/2000/svg" width="360" height="790" viewBox="0 0 360 790" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Multimodal Input: associate observations before fusion</title><desc id="desc">A report and photograph for claim C17 supply synthetic signals 0.80 and 0.20. After an ID check, their weights 0.40 and 0.60 yield contributions 0.32 and 0.12. A combined score 0.44 is below the priority threshold 0.60. No encoder or accuracy experiment is run.</desc><rect width="360" height="790" fill="#fff"/><g transform="translate(16,20)"><rect width="328" height="750" fill="#fff"/><text x="0" y="24" font-size="20" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Different inputs, one claim</text><text x="0" y="49" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Supplied signals · no encoder runs</text><text x="0" y="88" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Written report</text><text x="0" y="114" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Claim C17</text><rect x="0" y="131" width="116" height="66" fill="#f1f2ef"/><text x="10" y="158" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">“The box</text><text x="10" y="180" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">is crushed.”</text><path d="M132 165 L164 165" fill="none" stroke="#a6aca3"/><text x="174" y="153" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Branch signal</text><text x="174" y="186" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.80</text><text x="0" y="265" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Photograph</text><text x="0" y="291" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Claim C17</text><rect x="0" y="308" width="116" height="66" fill="#f1f2ef" stroke="#a6aca3"/><path d="M25 325 L65 320 L91 339 L88 363 L28 363 Z M25 325 L52 343 L91 339 M52 343 L52 363" fill="none" stroke="#a6aca3"/><path d="M132 342 L164 342" fill="none" stroke="#a6aca3"/><text x="174" y="330" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Branch signal</text><text x="174" y="363" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.20</text><path d="M310 165 L318 165" fill="none" stroke="#a6aca3"/><path d="M318 165 L318 431" fill="none" stroke="#a6aca3"/><path d="M310 342 L318 342" fill="none" stroke="#a6aca3"/><path d="M318 431 L164 431" fill="none" stroke="#a6aca3"/><path d="M164 431 L164 443" fill="none" stroke="#a6aca3"/><text x="0" y="451" font-size="17" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">IDs agree · combine both signals</text><text x="0" y="496" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Score 0.44 · Standard review</text><rect x="0" y="513" width="308" height="32" fill="#f1f2ef" stroke="#a6aca3"/><rect x="0" y="513" width="98.56000000000002" height="32" fill="#00855b"/><rect x="98.56000000000002" y="513" width="36.96" height="32" fill="#b7c8ba"/><path d="M184.79999999999998 505 L184.79999999999998 555" fill="none" stroke="#252c28"/><text x="0" y="571" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><text x="284" y="571" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1.0</text><text x="146.79999999999998" y="593" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.60 priority</text><text x="0" y="626" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Report contribution 0.32</text><text x="0" y="652" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Photo contribution 0.12</text><text x="0" y="735" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Routes are not verified outcomes.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
