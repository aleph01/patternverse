<svg xmlns="http://www.w3.org/2000/svg" width="360" height="820" viewBox="0 0 360 820" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Workflow Pipeline: dependencies determine eligibility</title><desc id="desc">Validate runs at minutes 0 to 2, Prepare 2 to 5 and Train 5 to 13. Evaluate 13 to 17 and Package 13 to 15 run in parallel. Release waits until both finish and runs 17 to 18 with a passing report. The run uses two execution slots and 20 task-minutes of work; durations are fictional.</desc><rect width="360" height="820" fill="#fff"/><g transform="translate(16,20)"><defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#a6aca3"/></marker></defs><rect width="328" height="780" fill="#fff"/><text x="0" y="24" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2 slots · 18 min elapsed</text><text x="0" y="48" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Each step occupies one slot.</text><path d="M164 156 V188" fill="none" stroke="#a6aca3" marker-end="url(#arrow)"/><path d="M164 268 V300" fill="none" stroke="#a6aca3" marker-end="url(#arrow)"/><path d="M164 380 V412 H77 V444" fill="none" stroke="#a6aca3" marker-end="url(#arrow)"/><path d="M164 412 H251 V444" fill="none" stroke="#a6aca3" marker-end="url(#arrow)"/><path d="M77 524 V556 H164 V588" fill="none" stroke="#a6aca3" marker-end="url(#arrow)"/><path d="M251 524 V556 H164 V588" fill="none" stroke="#a6aca3" marker-end="url(#arrow)"/><rect x="18" y="76" width="292" height="80" fill="#fff" stroke="#a6aca3"/><text x="26" y="99" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Validate</text><text x="26" y="121" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0–2 min</text><text x="26" y="142" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Complete</text><rect x="18" y="188" width="292" height="80" fill="#fff" stroke="#a6aca3"/><text x="26" y="211" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Prepare</text><text x="26" y="233" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2–5 min</text><text x="26" y="254" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Complete</text><rect x="18" y="300" width="292" height="80" fill="#fff" stroke="#a6aca3"/><text x="26" y="323" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Train</text><text x="26" y="345" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">5–13 min</text><text x="26" y="366" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Complete</text><rect x="0" y="444" width="154" height="80" fill="#fff" stroke="#a6aca3"/><text x="8" y="467" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Evaluate</text><text x="8" y="489" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">13–17 min</text><text x="8" y="510" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Report: pass</text><rect x="174" y="444" width="154" height="80" fill="#fff" stroke="#a6aca3"/><text x="182" y="467" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Package</text><text x="182" y="489" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">13–15 min</text><text x="182" y="510" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Complete</text><rect x="18" y="588" width="292" height="80" fill="#edf5f0" stroke="#a6aca3"/><text x="26" y="611" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Release</text><text x="26" y="633" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">17–18 min</text><text x="26" y="654" font-size="14" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Complete</text><text x="0" y="716" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Arrows show prerequisites.</text><text x="0" y="739" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Clocks show scheduled minutes.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
