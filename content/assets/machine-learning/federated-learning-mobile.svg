<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1290" viewBox="0 0 360 1290" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Federated learning combines compatible local models from a common starting point</title><desc id="desc">A fictional server sends scalar model zero to clients A, B, and C. They hold four, two, and two local examples. After two full-batch gradient steps, they return models point one nine, one point two eight, and minus point one nine. Weighting by the included example counts gives shared model point three six seven five. Two centralized steps on the same records give point four one zero six two five. Global training loss decreases while client C loss increases. All values are displayed for explanation; no privacy protocol is simulated.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1290" fill="#fff"/><text x="16" y="34" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Train locally.</text><text x="16" y="68" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Combine updates.</text><text x="16" y="100" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">One round; three separate data holders.</text><svg x="16" y="125" width="328" height="750" viewBox="0 0 328 750"><title id="flow-title">Local training from one common model followed by weighted aggregation</title><desc id="flow-desc">Attempt 1 starts at 0.00000. 3 clients participate; the shared result is 0.36750. Raw records remain at clients in the illustrated architecture. No privacy mechanism is simulated.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00855b"/></marker></defs><rect x="0" y="0" width="328" height="70" fill="#f1f2ef"/><text x="12" y="26" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Start round 1</text><text x="12" y="53" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Shared w 0.00000</text><path d="M 164 70 V 88 H 12 V 463" fill="none" stroke="#00855b" stroke-width="2"/><path d="M 316 173 V 576" fill="none" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 12 173 H 25" fill="none" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 304 173 H 316" fill="none" stroke="#00855b" stroke-width="2"/><rect x="28" y="110" width="276" height="126" fill="#f1f2ef"/><text x="40" y="132" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A · 4 examples</text><text x="40" y="155" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2 full-batch steps</text><text x="40" y="178" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Local w 0.19000</text><text x="40" y="201" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weight 4/8 = 0.500</text><text x="40" y="224" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Records remain local</text><path d="M 12 318 H 25" fill="none" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 304 318 H 316" fill="none" stroke="#00855b" stroke-width="2"/><rect x="28" y="255" width="276" height="126" fill="#f1f2ef"/><text x="40" y="277" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">B · 2 examples</text><text x="40" y="300" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2 full-batch steps</text><text x="40" y="323" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Local w 1.28000</text><text x="40" y="346" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weight 2/8 = 0.250</text><text x="40" y="369" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Records remain local</text><path d="M 12 463 H 25" fill="none" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 304 463 H 316" fill="none" stroke="#00855b" stroke-width="2"/><rect x="28" y="400" width="276" height="126" fill="#f1f2ef"/><text x="40" y="422" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">C · 2 examples</text><text x="40" y="445" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2 full-batch steps</text><text x="40" y="468" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Local w -0.19000</text><text x="40" y="491" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weight 2/8 = 0.250</text><text x="40" y="514" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Records remain local</text><rect x="0" y="580" width="328" height="140" fill="#edf5f0"/><text x="12" y="606" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Aggregate returned models</text><text x="12" y="631" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Example-weighted w 0.36750</text><text x="12" y="656" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">8 examples · 3 participating clients</text><text x="12" y="681" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Parameter values this round: 3 down + 3 up</text><text x="12" y="706" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Plain averaging adds no privacy guarantee.</text></svg><rect x="16" y="920" width="328" height="190" fill="#f1f2ef"/><text x="28" y="948" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Local steps change the path</text><text x="28" y="981" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Federated w 0.367500</text><text x="28" y="1014" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Centralized w 0.410625</text><text x="28" y="1047" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same eight records; same learning rate.</text><text x="28" y="1080" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">One local step matches at 0.225000.</text><text x="16" y="1160" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Global training loss 1.9163</text><text x="16" y="1194" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Client C loss: 0.5000 → 0.9350</text><text x="16" y="1240" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional scalar model; values shown for teaching.</text><text x="16" y="1272" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">No secure aggregation or privacy noise.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
