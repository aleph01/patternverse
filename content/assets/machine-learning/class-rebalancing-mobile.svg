<svg xmlns="http://www.w3.org/2000/svg" width="360" height="860" viewBox="0 0 360 860" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Class Rebalancing: same records, different training influence</title><desc id="desc">The original 900 ordinary and 100 defect records receive equal total class weight when defect weight is nine. Independently fitted group scores change from 0.012, 0.198, 0.886 to 0.100, 0.690, 0.986. The middle group crosses threshold 0.5. Data are invented; these are training calculations, not held-out performance.</desc><rect width="360" height="860" fill="#fff"/><g transform="translate(16,20)"><rect width="328" height="820" fill="#fff"/><g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="400"><text x="0" y="24" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same records, different influence</text><text x="0" y="65" font-size="17" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Original record counts</text><text x="0" y="91" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">900 ordinary · 100 defect</text><rect x="0" y="105" width="312" height="20" fill="#00855b"/><rect x="0" y="105" width="280.8" height="20" fill="#a6aca3"/><text x="0" y="170" font-size="17" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Total training weight</text><text x="0" y="196" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">900 ordinary · 900 defect</text><rect x="0" y="210" width="312" height="20" fill="#00855b"/><rect x="0" y="210" width="156" height="20" fill="#a6aca3"/><line x1="0" y1="272" x2="328" y2="272" stroke="#a6aca3"/><text x="0" y="296" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Gray: no weights · Green: selected weights</text><text x="0" y="321" font-size="15" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fitted scores · threshold 0.50</text><text x="0" y="360" font-size="17" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Low signal</text><text x="0" y="383" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">810 ordinary · 10 defect</text><line x1="10" y1="408" x2="312" y2="408" stroke="#a6aca3"/><line x1="161" y1="394" x2="161" y2="422" stroke="#626962" stroke-dasharray="3 3"/><line x1="13.682926829268293" y1="408" x2="40.2" y2="408" stroke="#00855b"/><circle cx="13.682926829268293" cy="408" r="5" fill="#a6aca3"/><circle cx="40.2" cy="408" r="4" fill="#00855b"/><text x="0" y="442" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.012 → 0.100</text><text x="0" y="500" font-size="17" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Middle signal</text><text x="0" y="523" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">81 ordinary · 20 defect</text><line x1="10" y1="548" x2="312" y2="548" stroke="#a6aca3"/><line x1="161" y1="534" x2="161" y2="562" stroke="#626962" stroke-dasharray="3 3"/><line x1="69.8019801980198" y1="548" x2="218.27586206896552" y2="548" stroke="#00855b"/><circle cx="69.8019801980198" cy="548" r="5" fill="#a6aca3"/><circle cx="218.27586206896552" cy="548" r="4" fill="#00855b"/><text x="0" y="582" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.198 → 0.690</text><text x="0" y="640" font-size="17" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">High signal</text><text x="0" y="663" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">9 ordinary · 70 defect</text><line x1="10" y1="688" x2="312" y2="688" stroke="#a6aca3"/><line x1="161" y1="674" x2="161" y2="702" stroke="#626962" stroke-dasharray="3 3"/><line x1="277.59493670886076" y1="688" x2="307.7464788732394" y2="688" stroke="#00855b"/><circle cx="277.59493670886076" cy="688" r="5" fill="#a6aca3"/><circle cx="307.7464788732394" cy="688" r="4" fill="#00855b"/><text x="0" y="722" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.886 → 0.986</text><text x="0" y="790" font-size="13" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Score axis: 0 to 1 · line marks threshold</text></g></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
