<svg xmlns="http://www.w3.org/2000/svg" width="720" height="750" viewBox="0 0 720 750" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Different behavioral expectations detect different failures</title><desc id="desc">The synthetic rule ignores negation and uses a name shortcut. A not-good negative labeled case fails at score 0.7311. Adding Mira changes 0.7311 to 0.8808 and fails score invariance within 0.02. Replacing good with not good leaves the score unchanged and passes the weaker non-increasing relation. Across seven selected cases the rule passes two of three label tests, zero of two invariance tests, and two of two directional tests.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="750" fill="#fff"/><text x="20" y="42" font-size="29" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">What should change? What should stay?</text><text x="20" y="76" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Three expectations reveal different model behaviors.</text><rect x="20" y="120" width="680" height="110" fill="#f1f2ef"/><text x="32" y="149" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Fictional sentiment rule</text><text x="32" y="179" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Ignores “not”; name shortcut weight = 1.</text><text x="32" y="207" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Positive score ≥ 0.5 → positive label.</text><svg x="20" y="260" width="680" height="270" viewBox="0 0 680 270"><title>Known label, invariance, and direction are different tests</title><desc>One case from each test family, calculated using the selected rule. Full inputs and all seven assertions appear in the table.</desc><g transform="translate(0,0)"><rect width="216" height="260" fill="var(--panel, #f1f2ef)"/><text x="12" y="28" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Known label</text><text x="12" y="66" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">“not good”</text><text x="12" y="98" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Expected: negative</text><text x="12" y="133" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Score: 0.7311</text><text x="12" y="163" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Label: positive</text><text x="12" y="208" font-size="20" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">FAIL</text><text x="12" y="239" font-size="13" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Simple negation case</text></g><g transform="translate(232,0)"><rect width="216" height="260" fill="var(--panel, #f1f2ef)"/><text x="12" y="28" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Stable score</text><text x="12" y="66" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">“good” → “Mira: good”</text><text x="12" y="100" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">0.7311 → 0.8808</text><text x="12" y="133" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">|Δs|: 0.1497</text><text x="12" y="163" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Limit: 0.0200</text><text x="12" y="208" font-size="20" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">FAIL</text><text x="12" y="239" font-size="13" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Score stability, not label</text></g><g transform="translate(464,0)"><rect width="216" height="260" fill="var(--panel, #f1f2ef)"/><text x="12" y="28" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Non-increasing score</text><text x="12" y="66" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">“good” → “not good”</text><text x="12" y="100" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">0.7311 → 0.7311</text><text x="12" y="133" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Δs: 0.0000</text><text x="12" y="163" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Expected: Δs ≤ 0</text><text x="12" y="208" font-size="20" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">PASS</text><text x="12" y="239" font-size="13" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Equal scores are allowed</text></g></svg><rect x="20" y="560" width="680" height="100" fill="#f1f2ef"/><text x="32" y="589" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">All seven selected cases</text><text x="32" y="619" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Label: 2/3 · Invariance: 0/2 · Direction: 2/2</text><text x="32" y="645" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">The displayed cards show one case from each family.</text><text x="20" y="704" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Passing a relation can permit wrong answers. Keep labeled tests alongside paired checks.</text><text x="20" y="734" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Constructed scores, not calibrated probabilities or deployment accuracy.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
