<svg xmlns="http://www.w3.org/2000/svg" width="360" height="860" viewBox="0 0 360 860" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Ensembling: different errors can cancel, shared errors remain</title><desc id="desc">Each of three invented forecasters has mean absolute error four orders across six cases. Their equal mean has zero error when the errors cancel, but mean absolute error four orders when the errors are shared. Signed errors are shown per case; green highlights the combined row. No models are trained and no population performance is measured.</desc><rect width="360" height="860" fill="#fff"/><g transform="translate(16,20)"><rect width="328" height="820" fill="#fff"/><g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="400"><text x="0" y="24" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Different mistakes can cancel</text><text x="0" y="51" font-size="15" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Signed error = forecast − actual</text><text x="0" y="78" font-size="15" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Equal mean · six invented cases</text><line x1="0" y1="98" x2="328" y2="98" stroke="#a6aca3"/><text x="0" y="128" font-size="19" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Different errors</text><text x="78" y="160" font-size="13" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1</text><text x="116" y="160" font-size="13" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2</text><text x="154" y="160" font-size="13" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">3</text><text x="192" y="160" font-size="13" fill="#626962" font-family="Helvetica Neue, Helv