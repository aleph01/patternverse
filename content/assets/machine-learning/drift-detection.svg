<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Drift Detection: compare input shares separately from prediction quality</title><desc id="desc">Web and app shares change from eighty and twenty percent to twenty and eighty percent. The largest share gap is sixty percentage points, exceeding a ten-point threshold with enough current tickets. Separate fully labeled accuracy remains seventy-five percent in both fictional windows.</desc><rect width="720" height="610" fill="#fff"/><g transform="translate(20,20)"><rect width="680" height="570" fill="#fff"/><text x="0" y="25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="25" text-anchor="start" fill="#252c28">Compare inputs, then check outcomes</text><text x="0" y="55" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="start" fill="#626962">Reference 100 · current 100 tickets</text><line x1="100" y1="123" x2="380" y2="123" stroke="#a6aca3"/><line x1="100" y1="119" x2="100" y2="127" stroke="#a6aca3"/><text x="100" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="middle" fill="#626962">0%</text><line x1="240" y1="119" x2="240" y2="127" stroke="#a6aca3"/><text x="240" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="middle" fill="#626962">50%</text><line x1="380" y1="119" x2="380" y2="127" stroke="#a6aca3"/><text x="380" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="14" text-anchor="middle" fill="#626962">100%</text><text x="0" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" text-anchor="start" fill="#252c28">Web</text><rect x="100" y="170" width="224" height="13" fill="#8c938b"/><rect x="100" y="195" width="56" height="13" fill="#00855b"/><text x="331" y="181" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" text-anchor="start" fill="#626962">80%</text><text x="163" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" text-anchor="start" fill="#00855b">20%</text><text x="0" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" text-anchor="start" fill="#252c28">App</text><rect x="100" y="270" width="56" height="13" fill="#8c938b"/><rect x="100" y="295" width="224" height="13" fill="#00855b"/><text x="163" y="281" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" text-anchor="start" fill="#626962">20%</text><text x="331" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" text-anchor="start" fill="#00855b">80%</text><text x="440" y="123" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="20" text-anchor="start" fill="#252c28">Accuracy · all labels</text><text x="440" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="start" fill="#252c28">Reference 75/100 = 75%</text><text x="440" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" text-anchor="start" fill="#00855b">Current 75/100 = 75%</text><text x="440" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="23" text-anchor="start" fill="#252c28">Change 0 pp</text><text x="440" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" text-anchor="start" fill="#626962">M1 fixed · teaching labels</text><text x="0" y="355" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="25" text-anchor="start" fill="#252c28">Largest share gap 60 pp</text><text x="0" y="402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="24" text-anchor="start" fill="#252c28">Investigate input shift</text><text x="0" y="442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" text-anchor="start" fill="#252c28">Rule: gap &gt; 10 pp · current count ≥ 50</text><line x1="0" y1="465" x2="660" y2="465" stroke="#a6aca3"/><text x="0" y="497" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" text-anchor="start" fill="#252c28">Input change and prediction quality are separate measurements.</text><text x="0" y="537" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" text-anchor="start" fill="#626962">Gray: reference · green: current</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
