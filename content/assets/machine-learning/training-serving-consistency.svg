<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Training-Serving Consistency: preserve the transform and its state</title><desc id="desc">For the same 20 km express request, saved transform T1 with mean 10 km and scale 10 km gives features [1, 0, 1, 0] and model p 0.731. Refitting numeric statistics on live distances 20 and 40 km changes the mean to 30 km, giving features [-1, 0, 1, 0] and p 0.269 under the same fixed model. Inputs and model weights are fictional; numeric statistics and all outputs are computed.</desc><rect width="720" height="510" fill="#fff"/><g transform="translate(20,20)"><rect width="680" height="470" fill="#fff"/><g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="400"><text x="0" y="24" font-size="21" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same request, same model</text><text x="0" y="53" font-size="17" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">20 km · express</text><text x="0" y="80" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Change preprocessing; observe feature parity</text><line x1="0" y1="100" x2="680" y2="100" stroke="#a6aca3"/><text x="0" y="140" font-size="18" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Saved training path · T1</text><text x="0" y="169" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Mean 10.0 km · scale 10.0 km</text><text x="0" y="194" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Slots: standard, express</text><line x1="14" y1="208" x2="14" y2="230" stroke="#a6aca3"/><text x="26" y="227" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Apply transform</text><text x="0" y="261" font-size="18" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">[1.0, 0.0, 1.0, 0.0]</text><text x="0" y="288" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">[z, slot 0, slot 1, unknown]</text><line x1="14" y1="301" x2="14" y2="323" stroke="#a6aca3"/><text x="26" y="321" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same fixed model M1</text><text x="0" y="359" font-size="17" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Score 1.000 · p 0.731</text><text x="0" y="389" font-size="15" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Flag at threshold 0.5</text><line x1="337" y1="120" x2="337" y2="411" stroke="#a6aca3"/><text x="355" y="140" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Live-batch refit</text><text x="355" y="169" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Mean 30.0 km · scale 10.0 km</text><text x="355" y="194" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Slots: standard, express</text><line x1="369" y1="208" x2="369" y2="230" stroke="#a6aca3"/><text x="381" y="227" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Apply transform</text><text x="355" y="261" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">[-1.0, 0.0, 1.0, 0.0]</text><text x="355" y="288" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">[z, slot 0, slot 1, unknown]</text><line x1="369" y1="301" x2="369" y2="323" stroke="#a6aca3"/><text x="381" y="321" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same fixed model M1</text><text x="355" y="359" font-size="17" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Score -1.000 · p 0.269</text><text x="355" y="389" font-size="15" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">No flag at threshold 0.5</text><text x="0" y="451" font-size="17" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Feature parity: mismatch on this request</text></g></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
