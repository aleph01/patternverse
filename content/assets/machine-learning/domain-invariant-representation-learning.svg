<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1025" viewBox="0 0 720 1025" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Retain a shared task cue while removing a camera marker</title><desc id="desc">Each of two fictional cameras supplies four normal and four defective examples. The encoder removes the camera marker and retains cue q. The task threshold gets eight of eight correct in each domain. Equal encoded domain counts limit optimal empirical domain lookup to eight of sixteen correct. This balanced example is not a transfer guarantee.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="1025" fill="#fff"/><text x="20" y="42" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Keep the defect cue. Remove the camera.</text><text x="20" y="82" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Balanced cameras share the same cue-to-label rule.</text><svg x="20" y="125" width="680" height="630" viewBox="0 0 680 630"><title id="diagram-title">A shared cue, two cameras, and two prediction tasks</title><desc id="diagram-desc">Computed encoded counts and task diagnostics from sixteen fictional camera observations.</desc><rect x="0" y="0" width="680" height="115" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="29" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Inputs: eight records per camera</text><text x="14" y="60" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Source: (q, −1); target: (q, +1)</text><text x="14" y="88" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">q = −1 or +1; y = normal or defect</text><text x="332" y="143" font-size="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">↓</text><rect x="0" y="160" width="680" height="95" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="190" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Encoder: Cue only</text><text x="14" y="221" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">z = q</text><text x="160" y="274" font-size="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">↓</text><text x="506" y="274" font-size="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">↓</text><rect x="0" y="278" width="334" height="110" fill="#f1f2ef" stroke="#a6aca3"/><rect x="346" y="278" width="334" height="110" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="306" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Task: Cue q &gt; 0</text><text x="14" y="336" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Source: 8/8 correct</text><text x="14" y="365" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target check: 8/8 correct</text><text x="360" y="306" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Domain classifier</text><text x="360" y="338" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">8/16 correct (50%)</text><text x="0" y="423" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Encoded counts by domain</text><text x="0" y="450" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">S (top) = source; T (bottom) = target.</text><text x="0" y="483" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">z=[-1]</text><rect x="180" y="466" width="140" height="8" fill="#00855b"/><rect x="180" y="477" width="140" height="8" fill="#edf5f0"/><text x="490" y="483" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">S 4 · T 4</text><text x="0" y="528" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">z=[1]</text><rect x="180" y="511" width="140" height="8" fill="#00855b"/><rect x="180" y="522" width="140" height="8" fill="#edf5f0"/><text x="490" y="528" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">S 4 · T 4</text><text x="0" y="560" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Encoded distributions: equal.</text><text x="0" y="585" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Domain difference: 0.00 (0 = equal; 1 = disjoint).</text><text x="0" y="610" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">No guarantee of target task accuracy.</text></svg><rect x="20" y="795" width="680" height="150" fill="#f1f2ef"/><text x="32" y="825" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">What the bars mean</text><text x="32" y="858" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">z = −1: 4 normal S + 4 normal T. z = +1: 4 defect S + 4 defect T.</text><text x="32" y="891" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">The task keeps its shared rule; the domain lookup must guess.</text><text x="32" y="923" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Different class proportions can make the task and alignment objectives conflict.</text><text x="20" y="997" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Empirical fixture only; no neural training or transfer guarantee.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
