<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1430" viewBox="0 0 360 1430" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">A datasheet connects collection choices to a specific dataset release</title><desc id="desc">Fictional pump-sounds 1.0 starts with 12,000 clips. Sequential non-overlapping exclusions remove 300 unreadable files, 900 duplicate copies, and 800 clips with unverified run conditions. The release contains 10,000 ten-second clips from forty pumps, totaling 100,000 seconds of audio. Training, validation, and test contain separate groups of 28, six, and six pumps with 7,000, 1,500, and 1,500 clips. Labels describe controlled normal or induced-fault conditions, not future breakdowns. Release 1.1 corrects 150 labels, or 1.5 percent, while retaining identifiers and schema. Documentation does not grant rights or establish deployment validity.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1430" fill="#fff"/><text x="16" y="36" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Files need</text><text x="16" y="70" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">a history.</text><text x="16" y="103" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional collection → documented release</text><rect x="16" y="130" width="328" height="100" fill="#f1f2ef" stroke="#a6aca3"/><text x="28" y="161" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">pump-sounds 1.0</text><text x="28" y="192" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">12,000 candidate clips · 40 pumps</text><text x="28" y="218" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">10 seconds · 16 kHz mono · indoor recordings</text><rect x="16" y="260" width="328" height="230" fill="#f1f2ef" stroke="#a6aca3"/><text x="28" y="290" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Collection ledger C12</text><text x="28" y="325" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Start: 12,000 clips</text><text x="28" y="358" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">−300 unreadable files</text><text x="28" y="390" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">−900 duplicate copies</text><text x="28" y="422" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">−800 unverified condition</text><text x="28" y="464" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Release: 10,000 clips</text><rect x="16" y="520" width="328" height="190" fill="#f1f2ef" stroke="#a6aca3"/><text x="28" y="550" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">What the release represents</text><text x="28" y="585" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">10,000 clips from 40 pumps</text><text x="28" y="617" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">100,000 seconds of audio</text><text x="28" y="649" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">27 hours, 46 minutes, 40 seconds</text><text x="28" y="685" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Repeated clips remain related observations.</text><rect x="16" y="740" width="328" height="270" fill="#f1f2ef" stroke="#a6aca3"/><text x="28" y="770" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Keep each pump in one split</text><text x="28" y="812" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Training</text><text x="28" y="838" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">28 pumps · 7,000 clips</text><text x="28" y="876" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Validation</text><text x="28" y="902" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">6 pumps · 1,500 clips</text><text x="28" y="940" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Test</text><text x="28" y="966" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">6 pumps · 1,500 clips</text><rect x="16" y="1040" width="328" height="290" fill="#f1f2ef" stroke="#a6aca3"/><text x="28" y="1070" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Meaning and maintenance</text><text x="28" y="1105" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Labels describe controlled run conditions:</text><text x="28" y="1134" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">normal or an induced bearing fault.</text><text x="28" y="1163" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Natural failures and outdoor conditions</text><text x="28" y="1192" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">are not represented.</text><text x="28" y="1221" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Owner: Reliability Data · pipeline P4</text><text x="28" y="1250" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1.1 corrects 150 labels (1.5%).</text><text x="28" y="1279" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Record changes and notify downstream users.</text><text x="16" y="1372" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional counts; no model performance claimed.</text><text x="16" y="1400" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Documentation does not grant or enforce rights.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
