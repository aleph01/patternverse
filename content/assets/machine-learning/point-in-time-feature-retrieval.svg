<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Historical feature retrieval checks event time and availability separately</title><desc id="desc">At ten o’clock UTC for merchant A, with a sixty-minute age limit, F01 and F03 qualify. F03 is newest and gives fifty. F02 and F04 arrive later, F05 is a future event, F06 belongs to merchant B, and F07 is too old. An event-only query selects corrected F04 with sixty-five; latest-in-archive selects F05 with ninety. The retained archive is queried at ten-thirty, not used as the historical cutoff.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="980" fill="#fff"/><text x="20" y="42" font-size="29" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Replay what was available then.</text><text x="20" y="76" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Merchant A · decision at 10:00 UTC · maximum age 60 minutes.</text><svg x="20" y="120" width="680" height="561" viewBox="0 0 680 561"><text x="0" y="25" font-size="18" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Two clocks, one historical decision.</text><text x="0" y="49" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Key A · cutoff 10:00 · age ≤ 60 min</text><text x="10" y="88" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Row · key · value</text><text x="185" y="88" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Event time</text><text x="320" y="88" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Ready time</text><text x="458" y="88" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Historical eligibility</text><rect x="0" y="110" width="680" height="39" fill="#f1f2ef"/><text x="10" y="135" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F01 · A · 40</text><text x="185" y="135" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">09:00</text><text x="320" y="135" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">09:02</text><text x="458" y="135" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Eligible, older</text><rect x="0" y="157" width="680" height="39" fill="#f1f2ef"/><text x="10" y="182" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F02 · A · 70</text><text x="185" y="182" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">09:30</text><text x="320" y="182" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">10:20</text><text x="458" y="182" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Available later</text><rect x="0" y="204" width="680" height="39" fill="#edf5f0"/><text x="10" y="229" font-size="14" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">F03 · A · 50</text><text x="185" y="229" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">09:45</text><text x="320" y="229" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">09:47</text><text x="458" y="229" font-size="14" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">SELECTED</text><rect x="0" y="251" width="680" height="39" fill="#f1f2ef"/><text x="10" y="276" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F04 · A · 65</text><text x="185" y="276" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">09:45</text><text x="320" y="276" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">10:10</text><text x="458" y="276" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Available later</text><rect x="0" y="298" width="680" height="39" fill="#f1f2ef"/><text x="10" y="323" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F05 · A · 90</text><text x="185" y="323" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">10:05</text><text x="320" y="323" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">10:06</text><text x="458" y="323" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Future event</text><rect x="0" y="345" width="680" height="39" fill="#f1f2ef"/><text x="10" y="370" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F06 · B · 999</text><text x="185" y="370" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">09:58</text><text x="320" y="370" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">09:59</text><text x="458" y="370" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Different entity</text><rect x="0" y="392" width="680" height="39" fill="#f1f2ef"/><text x="10" y="417" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F07 · A · 20</text><text x="185" y="417" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">08:00</text><text x="320" y="417" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">08:01</text><text x="458" y="417" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Too old</text><rect x="0" y="451" width="680" height="90" fill="#f1f2ef"/><text x="12" y="477" font-size="17" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Historical result: F03 = 50</text><text x="12" y="504" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2 eligible snapshots; keep this decision row.</text><text x="12" y="527" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Choose newest event, then ready time and revision.</text></svg><rect x="20" y="710" width="680" height="155" fill="#f1f2ef"/><text x="32" y="738" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Same archive. Three answers.</text><text x="32" y="769" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Replay known then: F03 = 50</text><text x="32" y="798" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Event cutoff only: F04 = 65</text><text x="32" y="827" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Latest in archive: F05 = 90</text><text x="20" y="909" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F04 corrects F03 at 10:10. An old event time does not make it known at 10:00.</text><text x="20" y="952" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional snapshots. Ready time means usable on the prediction path, not just ingested.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
