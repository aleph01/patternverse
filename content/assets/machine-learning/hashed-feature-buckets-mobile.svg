<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">The same six channels in four and eight hash buckets</title><desc id="desc">Four buckets put social in zero, email in one, referral, direct and affiliate in two, and search in three. Eight buckets separate direct into two while referral and affiliate remain together in six. Three colliding pairs become one. The green fill and outline identify shared positions. Assignments are computed by the explorer's FNV-1a hash.</desc><rect width="360" height="1000" fill="#fff"/><text x="20" y="32" font-size="24" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">4 buckets</text><text x="20" y="65" font-size="18" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">3 colliding pairs</text><text x="36" y="132" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><rect x="62" y="88" width="278" height="76" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="78" y="133" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">social</text><text x="36" y="208" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1</text><rect x="62" y="164" width="278" height="76" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="78" y="209" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">email</text><text x="36" y="284" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2</text><rect x="62" y="240" width="278" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.1"/><text x="78" y="263" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">referral</text><text x="78" y="285" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">direct</text><text x="78" y="307" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">affiliate</text><text x="36" y="360" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">3</text><rect x="62" y="316" width="278" height="76" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="78" y="361" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">search</text><text x="20" y="454" font-size="24" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">8 buckets</text><text x="20" y="487" font-size="18" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1 colliding pair</text><text x="36" y="537" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><rect x="62" y="510" width="278" height="42" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="78" y="538" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">—</text><text x="36" y="579" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1</text><rect x="62" y="552" width="278" height="42" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="78" y="580" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">email</text><text x="36" y="621" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2</text><rect x="62" y="594" width="278" height="42" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="78" y="622" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">direct</text><text x="36" y="663" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">3</text><rect x="62" y="636" width="278" height="42" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="78" y="664" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">search</text><text x="36" y="705" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">4</text><rect x="62" y="678" width="278" height="42" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="78" y="706" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">social</text><text x="36" y="747" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">5</text><rect x="62" y="720" width="278" height="42" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="78" y="748" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">—</text><text x="36" y="789" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">6</text><rect x="62" y="762" width="278" height="42" fill="#edf5f0" stroke="#00855b" stroke-width="1.1"/><text x="78" y="790" font-size="19" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">referral · affiliate</text><text x="36" y="831" font-size="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">7</text><rect x="62" y="804" width="278" height="42" fill="#fff" stroke="#a6aca3" stroke-width="1.1"/><text x="78" y="832" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">—</text><text x="20" y="900" font-size="20" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same keys. Same hash.</text><text x="20" y="936" font-size="18" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">More positions separate some names.</text><text x="20" y="972" font-size="17" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Green: names sharing one position.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
