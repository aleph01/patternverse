<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1210" viewBox="0 0 360 1210" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Weak supervision: noisy votes and copied evidence</title><desc id="desc">Three text rules label three of four fictional tickets and conflict on ticket A. With assigned weights, counting an exact copied refund rule flips A from 40 percent to 57.1 percent Refund share. Counting the copy once restores 40 percent. Aggregated targets train a separate predictor that needs independent evaluation.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1210" fill="#fff"/><text x="16" y="33" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Noisy clues become</text><text x="16" y="64" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">training labels</text><text x="16" y="90" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Preserve missing votes and disagreements.</text><rect x="16" y="110" width="328" height="175" fill="#f1f2ef"/><text x="28" y="139" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Three imperfect sources</text><text x="28" y="174" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">R: “refund” → Refund · weight 2</text><text x="28" y="209" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">B: “charged twice” → Refund · weight 1</text><text x="28" y="244" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">D: “delivered” → Other · weight 3</text><text x="28" y="270" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Nonmatch → abstain. Weights are assigned.</text><text x="28" y="304" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Four fictional tickets</text><rect x="16" y="310" width="328" height="228" fill="#f1f2ef"/><text x="28" y="338" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A: “Refund please; tracking</text><text x="28" y="360" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">says delivered.”</text><text x="28" y="390" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Ticket</text><text x="111" y="390" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">R</text><text x="191" y="390" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">B</text><text x="271" y="390" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">D</text><text x="28" y="416" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A</text><text x="111" y="416" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Refund</text><text x="191" y="416" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">—</text><text x="271" y="416" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Other</text><text x="28" y="441" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">B</text><text x="111" y="441" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Refund</text><text x="191" y="441" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Refund</text><text x="271" y="441" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">—</text><text x="28" y="466" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">C</text><text x="111" y="466" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">—</text><text x="191" y="466" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">—</text><text x="271" y="466" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Other</text><text x="28" y="491" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">D</text><text x="111" y="491" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">—</text><text x="191" y="491" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">—</text><text x="271" y="491" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">—</text><text x="28" y="523" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Coverage 3/4 · overlap 2/4 · conflict 1/4</text><text x="16" y="573" font-size="19" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Ticket A · copied R enabled</text><svg x="16" y="593" width="328" height="360" viewBox="0 0 328 360"><title>Weighted vote comparison for the editable ticket</title><desc>Green is Refund weight, gray is Other weight. Percentages are vote shares, not probabilities.</desc><g transform="translate(0,0)"><rect x="0" y="2" width="328" height="170" fill="var(--panel, #f1f2ef)"/><text x="12" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="var(--ink, #252c28)">Count every column</text><text x="12" y="54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="var(--ink, #252c28)">4 Refund weight / 7 total</text><text x="12" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="var(--ink, #252c28)">57.1% → Refund</text><rect x="12" y="103" width="304" height="22" fill="var(--line, #a6aca3)"/><rect x="12" y="103" width="173.7142857142857" height="22" fill="var(--accent, #00855b)"/><rect x="185.7142857142857" y="103" width="130.2857142857143" height="22" fill="#8c938b"/><text x="12" y="151" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="var(--ink, #252c28)">Green: Refund · Gray: Other</text></g><g transform="translate(0,180)"><rect x="0" y="2" width="328" height="170" fill="var(--panel, #f1f2ef)"/><text x="12" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="var(--ink, #252c28)">Count copy once</text><text x="12" y="54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="var(--ink, #252c28)">2 Refund weight / 5 total</text><text x="12" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="var(--ink, #252c28)">40.0% → Other</text><rect x="12" y="103" width="304" height="22" fill="var(--line, #a6aca3)"/><rect x="12" y="103" width="121.60000000000001" height="22" fill="var(--accent, #00855b)"/><rect x="133.60000000000002" y="103" width="182.39999999999998" height="22" fill="#8c938b"/><text x="12" y="151" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="var(--ink, #252c28)">Green: Refund · Gray: Other</text></g></svg><text x="16" y="978" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A copied rule adds no independent evidence.</text><text x="16" y="1002" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Vote share is not a probability or accuracy.</text><rect x="16" y="1040" width="328" height="38" fill="#f1f2ef"/><text x="28" y="1065" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Aggregated targets</text><rect x="16" y="1088" width="328" height="38" fill="#f1f2ef"/><text x="28" y="1113" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">↓ Train a separate predictor</text><rect x="16" y="1136" width="328" height="38" fill="#f1f2ef"/><text x="28" y="1161" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">↓ Evaluate with reviewed labels</text><text x="16" y="1200" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Synthetic teaching example; no model performance claimed.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
