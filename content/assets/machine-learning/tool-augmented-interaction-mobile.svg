<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1460" viewBox="0 0 360 1460" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">A proposed call is checked, executed, and observed through a tool loop</title><desc id="desc">The fictional default reads five tripods and checks a scripted call to reserve three. An authorized confirmed request creates R1 once and leaves two available. A delivered receipt can inform the next model turn. If the first successful write response is lost, the client sees UNKNOWN although the simulated server holds R1. Reusing the same request key returns that receipt without another reservation. Model inference, real authentication, and real bookings are not performed.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1460" fill="#fff"/><text x="16" y="35" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Propose. Check.</text><text x="16" y="70" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Execute. Observe.</text><text x="16" y="103" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional equipment desk; scripted model.</text><svg x="16" y="125" width="328" height="1020" viewBox="0 0 328 1020"><title id="flow-title">A tool request passes through the application and returns an observed result</title><desc id="flow-desc">Scripted model proposal, host checks, local service execution, and result delivery are separate stages. The result can inform a later model turn; no language model runs here.</desc><rect x="0" y="0" width="328" height="180" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="29" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">1. Model proposes</text><text x="12" y="66" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">reserve_inventory</text><text x="12" y="98" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">item: tripod · quantity: 3</text><text x="12" y="140" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Scripted proposal; no model runs.</text><rect x="0" y="220" width="328" height="180" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="249" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">2. Application checks</text><text x="12" y="286" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Arguments → permission → confirmation</text><text x="12" y="318" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Attach key: demo-17</text><text x="12" y="360" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">The application controls execution.</text><rect x="0" y="440" width="328" height="180" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="469" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">3. Tool executes locally</text><text x="12" y="506" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Available stock: 2</text><text x="12" y="538" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Reservations created: 1</text><text x="12" y="580" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A repeated key does not repeat the write.</text><rect x="0" y="660" width="328" height="180" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="689" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">4. Return observation</text><text x="12" y="726" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Client: SUCCESS</text><text x="12" y="758" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Receipt: R1</text><text x="12" y="800" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Result can inform the next model turn.</text><text x="155" y="209" font-size="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">↓</text><text x="155" y="429" font-size="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">↓</text><text x="155" y="649" font-size="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">↓</text><text x="0" y="905" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Proposed ≠ executed ≠ observed</text><text x="0" y="938" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Tool attempts: 2; write attempts: 1</text><text x="0" y="971" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Only a delivered result is a client observation.</text></svg><rect x="16" y="1190" width="328" height="180" fill="#f1f2ef"/><text x="28" y="1220" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A result must actually arrive</text><text x="28" y="1254" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">request_key: demo-17</text><text x="28" y="1285" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Receipt: R1 · reserved 3 · remaining 2</text><text x="28" y="1318" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Lost acknowledgement:</text><text x="28" y="1347" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">client UNKNOWN; server still has R1.</text><text x="16" y="1410" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same-key retry returns R1; no second write.</text><text x="16" y="1444" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Atomic service contract assumed; local state only.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
