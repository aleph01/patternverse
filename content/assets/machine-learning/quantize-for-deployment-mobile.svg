<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1340" viewBox="0 0 360 1340" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Quantization can shrink storage while changing a model decision</title><desc id="desc">A fictional two-output classifier quantizes six weights to four-bit symmetric codes with one shared scale. Small A weights round to zero; B codes are seven, minus five, two. Input D2 has eight-bit codes 119,102,51. Integer sums zero and 425 give scores about 0.0500 and 0.0762 after floating output scaling and bias addition, changing the original float winner A to B. A number line shows the first A weight 0.12 rounding to zero. Per-output scales restore A in this example. Weight codes alone occupy three bytes, but the custom parameter record occupies nineteen bytes with one scale or twenty-three with two, versus thirty-two FP32 weight-and-bias bytes. No task accuracy or device performance is measured.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1340" fill="#fff"/><text x="16" y="36" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Smaller numbers.</text><text x="16" y="73" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Different winner.</text><text x="16" y="105" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A fictional classifier; computed conversion.</text><svg x="16" y="125" width="328" height="900" viewBox="0 0 328 900"><title id="diagram-title">Rounding weights and inputs changes a small model output</title><desc id="diagram-desc">Computed input codes, weight codes and scales, a local quantization grid for the first A weight, integer accumulators, floating-point output scores, and prediction agreement.</desc><rect x="0" y="0" width="328" height="145" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="29" font-size="18" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Input D2 → 8-bit codes</text><text x="14" y="61" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">x = (0.4650, 0.4000, 0.2000)</text><text x="14" y="91" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">qx = (119, 102, 51)</text><text x="14" y="121" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Input scale 0.003922, zero point 0.</text><text x="158" y="167" font-size="22" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">↓</text><rect x="0" y="175" width="328" height="140" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="203" font-size="17" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">4-bit weights · shared scale</text><text x="14" y="233" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">sA = 0.285714; sB = 0.285714</text><text x="14" y="263" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A codes: (0, 0, 0)</text><text x="14" y="293" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">B codes: (7, -5, 2)</text><text x="0" y="355" font-size="16" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">First A weight: 0.1200 → 0.0000</text><line x1="40" y1="447" x2="288" y2="447" stroke="#a6aca3"/><line x1="64.8" y1="440" x2="64.8" y2="454" stroke="#626962"/><text x="64.8" y="410" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">q=-2</text><text x="64.8" y="479" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">-0.5714</text><line x1="114.39999999999999" y1="440" x2="114.39999999999999" y2="454" stroke="#626962"/><text x="114.39999999999999" y="410" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">q=-1</text><text x="114.39999999999999" y="479" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">-0.2857</text><line x1="164" y1="440" x2="164" y2="454" stroke="#626962"/><text x="164" y="410" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">q=0</text><text x="164" y="479" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.0000</text><line x1="213.6" y1="440" x2="213.6" y2="454" stroke="#626962"/><text x="213.6" y="410" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">q=1</text><text x="213.6" y="479" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.2857</text><line x1="263.20000000000005" y1="440" x2="263.20000000000005" y2="454" stroke="#626962"/><text x="263.20000000000005" y="410" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">q=2</text><text x="263.20000000000005" y="479" font-size="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.5714</text><line x1="184.8319986031056" y1="428" x2="164" y2="447" stroke="#00855b" stroke-width="2"/><path d="M 184.8319986031056 420 l 6 7 l -6 7 l -6 -7 Z" fill="#252c28"/><circle cx="164" cy="447" r="5" fill="#00855b"/><text x="0" y="515" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Diamond: original; circle: reconstructed.</text><rect x="0" y="560" width="328" height="195" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="589" font-size="17" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Scores: float → quantized</text><text x="14" y="621" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A sum 0: 0.0818 → 0.0500</text><text x="14" y="652" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">B sum 425: 0.0300 → 0.0762</text><text x="14" y="684" font-size="15" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Winner: float A → quantized B</text><text x="14" y="721" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Scores above: float → quantized path.</text><text x="0" y="789" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Selected input coordinates clipped: 0</text><text x="0" y="818" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Agreement with float reference: 2/4</text><text x="0" y="882" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">No task-accuracy or latency estimate.</text></svg><rect x="16" y="1070" width="328" height="185" fill="#f1f2ef"/><text x="28" y="1100" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Count more than the weight codes</text><text x="28" y="1134" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Shared grid: 3 + 4 + 8 + 4 = 19 bytes</text><text x="28" y="1164" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Two grids: 3 + 8 + 8 + 4 = 23 bytes</text><text x="28" y="1196" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Codes + weight scales + biases + input scale.</text><text x="28" y="1228" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Two-grid winner on D2: A.</text><text x="16" y="1294" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Custom packed record; implicit zero points.</text><text x="16" y="1320" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">No graph-file, RAM, or speedup estimate.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
