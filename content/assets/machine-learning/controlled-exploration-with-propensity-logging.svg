<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Controlled exploration links selected actions to logged probabilities and importance weights</title><desc id="desc">In a fictional ten-row replay, epsilon point three over three eligible actions assigns A probability point eight and B and C point one each. Request R09 selects B and receives reward one. The target also chooses B, so its importance weight is ten. Four rows match the target; weighted rewards sum to twelve point five and weights sum to thirteen point seven five. IPS is one point two five and self-normalized IPS is approximately point nine zero nine. A weight cap of two changes capped IPS to point four five. These are unstable illustrative estimates, not confidence guarantees.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="760" fill="#fff"/><text x="20" y="42" font-size="29" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Explore deliberately. Keep the probabilities.</text><text x="20" y="78" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Knowing what was selected includes knowing how likely it was.</text><svg x="20" y="125" width="680" height="340" viewBox="0 0 680 340"><title id="flow-title">Sample an action, log its propensity, and weight its observed reward</title><desc id="flow-desc">There are 4 matching rows. IPS is 1.250, and self-normalized IPS is 0.909.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00855b"/></marker></defs><rect x="0" y="0" width="208" height="170" fill="#f1f2ef"/><text x="12" y="25" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Sampling policy</text><text x="12" y="52" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A 0.800</text><rect x="88" y="41" width="105" height="12" fill="#edf5f0"/><rect x="88" y="41" width="84" height="12" fill="#00855b"/><text x="12" y="85" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">B 0.100</text><rect x="88" y="74" width="105" height="12" fill="#edf5f0"/><rect x="88" y="74" width="10.5" height="12" fill="#00855b"/><text x="12" y="118" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">C 0.100</text><rect x="88" y="107" width="105" height="12" fill="#edf5f0"/><rect x="88" y="107" width="10.5" height="12" fill="#00855b"/><text x="12" y="153" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">ε 0.30 · K 3</text><path d="M 213 85 H 230" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><rect x="236" y="0" width="208" height="170" fill="#f1f2ef"/><text x="248" y="26" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Record selected action</text><text x="248" y="56" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">R09 · Complex</text><text x="248" y="86" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Chosen B · reward 1</text><text x="248" y="116" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Propensity 0.100</text><text x="248" y="146" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">v1 · eligible A/B/C</text><path d="M 449 85 H 466" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><rect x="472" y="0" width="208" height="170" fill="#f1f2ef"/><text x="484" y="26" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Reweight for target</text><text x="484" y="56" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target chooses B</text><text x="484" y="86" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weight 10.000</text><text x="484" y="116" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Reward contribution 10.000</text><text x="484" y="146" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Rare actions can dominate</text><rect x="0" y="210" width="680" height="100" fill="#edf5f0"/><text x="12" y="237" font-size="20" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">IPS 1.250 · SNIPS 0.909</text><text x="12" y="266" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">4 matches / 10 decisions · max weight 10.000</text><text x="12" y="294" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weighted rewards 12.500 / 10 for IPS</text></svg><rect x="20" y="510" width="680" height="155" fill="#f1f2ef"/><text x="32" y="538" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A large weight is fragile evidence</text><text x="32" y="571" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weights sum to 13.750</text><text x="32" y="604" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weight concentration: 1.806</text><text x="32" y="637" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Cap 2 → capped IPS 0.450</text><text x="20" y="709" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Raw IPS can exceed the binary reward range in a small, unevenly weighted sample.</text><text x="20" y="741" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional ten-row replay · complete rewards · fixed target · no confidence interval.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
