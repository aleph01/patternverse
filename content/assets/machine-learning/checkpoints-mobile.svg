<svg xmlns="http://www.w3.org/2000/svg" width="360" height="790" viewBox="0 0 360 790" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Checkpoints: preserve training state, not only weights</title><desc id="desc">A snapshot after three scalar updates contains weight 0.666, momentum minus 2.26, three completed updates and next target three. Complete restoration reproduces next weight 1.0124. Restoring only the weight resets momentum and data position and instead gives 0.6994. These are synthetic training calculations, not prediction-quality measurements.</desc><rect width="360" height="790" fill="#fff"/><g transform="translate(16,20)"><rect width="328" height="750" fill="#fff"/><text x="0" y="24" font-size="20" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Recover a training trajectory</text><text x="0" y="52" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Checkpoint after 3 updates · toy run</text><text x="0" y="90" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Saved state</text><rect x="0" y="108" width="150" height="70" fill="#f1f2ef" stroke="#a6aca3"/><text x="12" y="131" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weight w</text><text x="12" y="161" font-size="22" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.666</text><rect x="172" y="108" width="150" height="70" fill="#f1f2ef" stroke="#a6aca3"/><text x="184" y="131" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Momentum v</text><text x="184" y="161" font-size="22" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">-2.26</text><rect x="0" y="188" width="150" height="70" fill="#f1f2ef" stroke="#a6aca3"/><text x="12" y="211" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Next target</text><text x="12" y="241" font-size="22" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">3</text><rect x="172" y="188" width="150" height="70" fill="#f1f2ef" stroke="#a6aca3"/><text x="184" y="211" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Updates done</text><text x="184" y="241" font-size="22" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">3</text><text x="0" y="307" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Complete restore</text><text x="0" y="337" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">v -2.26 · next target 3</text><text x="0" y="363" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Start w 0.666</text><path d="M120 375 L120 398" fill="none" stroke="#a6aca3"/><text x="0" y="433" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">After 1 update:</text><text x="0" y="467" font-size="26" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">w 1.0124</text><text x="0" y="498" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weights only</text><text x="0" y="528" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">v 0 · next target 1</text><text x="0" y="554" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Start w 0.666</text><path d="M120 566 L120 589" fill="none" stroke="#a6aca3"/><text x="0" y="624" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">After 1 update:</text><text x="0" y="658" font-size="26" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">w 0.6994</text><text x="0" y="699" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">w difference: -0.313</text><text x="0" y="730" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Teaching trajectory, not model quality.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
