<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1340" viewBox="0 0 360 1340" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Select a model by the worst allowed input, not only its original input</title><desc id="desc">Eight fictional points have a broad shape cue and a fine pattern cue. At L-infinity radius 0.25, minimizing clean logistic loss among three models chooses weights zero and five, with clean accuracy eight of eight and robust accuracy zero of eight. Minimizing exact worst-case mean loss chooses weights one and zero, with six of eight for both rates. The plot shows the broad-cue boundary, a permitted square around positive record P1 at one and 0.2, and an exact attack moving it to 0.75 and 0.2. Its signed margin decreases from one to 0.75. These are training-fixture results.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1340" fill="#fff"/><text x="16" y="36" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Train for the</text><text x="16" y="73" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">whole neighborhood.</text><text x="16" y="105" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Eight fictional records. Three fixed models.</text><svg x="16" y="125" width="328" height="750" viewBox="0 0 328 750"><title id="diagram-title">A worst-case input in its allowed neighborhood</title><desc id="diagram-desc">Computed selected-model boundary, four unique fictional input locations with counts, allowed perturbation region, exact adversarial point, and signed margins.</desc><rect x="0" y="0" width="328" height="165" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="30" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Broad cue: w = (1, 0)</text><text x="14" y="62" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Clean 75%; robust 75%</text><text x="14" y="94" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Inspected P1: x = (1.00, 0.20), y = +1</text><text x="14" y="124" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Budget 0.25; coordinate box (L∞)</text><text x="0" y="197" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">x₂: fine pattern score</text><rect x="28" y="225" width="280" height="280" fill="#fff" stroke="#a6aca3"/><line x1="80.5" y1="225" x2="80.5" y2="505" stroke="#a6aca3"/><line x1="28" y1="452.5" x2="308" y2="452.5" stroke="#a6aca3"/><text x="75.5" y="528" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">-1</text><text x="6" y="456.5" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">-1</text><line x1="168" y1="225" x2="168" y2="505" stroke="#a6aca3"/><line x1="28" y1="365" x2="308" y2="365" stroke="#a6aca3"/><text x="163" y="528" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><text x="6" y="369" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><line x1="255.5" y1="225" x2="255.5" y2="505" stroke="#a6aca3"/><line x1="28" y1="277.5" x2="308" y2="277.5" stroke="#a6aca3"/><text x="250.5" y="528" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1</text><text x="6" y="281.5" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1</text><rect x="233.625" y="325.625" width="43.75" height="43.75" fill="#edf5f0" fill-opacity="0.65" stroke="#00855b"/><line x1="168" y1="505" x2="168" y2="225" stroke="#252c28" stroke-width="2" stroke-dasharray="6 5"/><circle cx="255.5" cy="347.5" r="5" fill="#00855b" stroke="#00855b" stroke-width="2"/><text x="263.5" y="336.5" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">+ ×3</text><circle cx="80.5" cy="347.5" r="5" fill="#00855b" stroke="#00855b" stroke-width="2"/><text x="42.5" y="336.5" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">+ ×1</text><circle cx="80.5" cy="382.5" r="5" fill="#fff" stroke="#00855b" stroke-width="2"/><text x="42.5" y="404.5" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">− ×3</text><circle cx="255.5" cy="382.5" r="5" fill="#fff" stroke="#00855b" stroke-width="2"/><text x="263.5" y="404.5" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">− ×1</text><circle cx="255.5" cy="347.5" r="9" fill="none" stroke="#252c28"/><line x1="255.5" y1="347.5" x2="233.625" y2="347.5" stroke="#252c28" stroke-width="2"/><path d="M 233.625 341.5 l 6 6 l -6 6 l -6 -6 Z" fill="#252c28"/><text x="50" y="555" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">x₁: broad shape score</text><text x="0" y="587" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Dashed: decision boundary. Diamond: attack.</text><text x="0" y="612" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Filled +; open −. Labels show class × count.</text><text x="0" y="646" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">P1 attack δ = (-0.25, 0.00)</text><text x="0" y="673" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Signed margin: 1.00 → 0.75</text><text x="0" y="700" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Worst-case point: (0.75, 0.20)</text><text x="0" y="733" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">All rates describe these eight records only.</text></svg><rect x="16" y="920" width="328" height="150" fill="#f1f2ef"/><text x="28" y="949" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Clean-loss winner</text><text x="28" y="980" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fragile cue: w = (0, 5)</text><text x="28" y="1011" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Clean 8/8; robust 0/8</text><text x="28" y="1044" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Worst mean loss 0.8259</text><rect x="16" y="1090" width="328" height="150" fill="#f1f2ef"/><text x="28" y="1119" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Worst-loss winner</text><text x="28" y="1150" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Broad cue: w = (1, 0)</text><text x="28" y="1181" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Clean 6/8; robust 6/8</text><text x="28" y="1214" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Worst mean loss 0.6656</text><text x="16" y="1295" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">L∞ radius 0.25; exact linear attacks.</text><text x="16" y="1320" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Training-fixture rates; no deployment estimate.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
