<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1070" viewBox="0 0 360 1070" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">An overall gain can hide a slice regression</title><desc id="desc">On twenty fictional cases, A gets sixteen correct and B seventeen. Desktop accuracy falls from fourteen of sixteen to thirteen of sixteen; mobile rises from two of four to four of four. Tablet has zero examples and no measured performance. Both models are evaluated on the same fixed records. No population conclusion or causal explanation is established.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1070" fill="#fff"/><text x="16" y="34" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Overall improves.</text><text x="16" y="67" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Desktop regresses.</text><text x="16" y="97" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">The same cases tell both stories.</text><rect x="16" y="120" width="328" height="145" fill="#f1f2ef"/><text x="28" y="149" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Overall · 20 fictional tickets</text><text x="28" y="178" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A: 16/20 = 80.0%</text><text x="28" y="207" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">B: 17/20 = 85.0%</text><text x="28" y="239" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A = current (green) · B = candidate (gray)</text><svg x="16" y="295" width="328" height="510" viewBox="0 0 328 510"><title>Two fixed prediction sets compared on the shown slices</title><g transform="translate(0,0)"><rect width="328" height="158" fill="var(--panel, #f1f2ef)"/><text x="12" y="27" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Desktop · rows 16</text><text x="12" y="55" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">A: 14/16 = 87.5%</text><rect x="12" y="65" width="304" height="12" fill="var(--line, #a6aca3)"/><rect x="12" y="65" width="266" height="12" fill="var(--accent, #00855b)"/><text x="12" y="112" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">B: 13/16 = 81.3%</text><rect x="12" y="122" width="304" height="12" fill="var(--line, #a6aca3)"/><rect x="12" y="122" width="247" height="12" fill="#8c938b"/></g><g transform="translate(0,170)"><rect width="328" height="158" fill="var(--panel, #f1f2ef)"/><text x="12" y="27" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Mobile · rows 4</text><text x="12" y="55" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">A: 2/4 = 50.0%</text><rect x="12" y="65" width="304" height="12" fill="var(--line, #a6aca3)"/><rect x="12" y="65" width="152" height="12" fill="var(--accent, #00855b)"/><text x="12" y="112" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">B: 4/4 = 100.0%</text><rect x="12" y="122" width="304" height="12" fill="var(--line, #a6aca3)"/><rect x="12" y="122" width="304" height="12" fill="#8c938b"/></g><g transform="translate(0,340)"><rect width="328" height="158" fill="var(--panel, #f1f2ef)"/><text x="12" y="27" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Tablet · rows 0</text><text x="12" y="55" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">A: N/A · denominator 0</text><text x="12" y="112" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">B: N/A · denominator 0</text></g></svg><rect x="16" y="830" width="328" height="120" fill="#f1f2ef"/><text x="28" y="859" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">One overall gain; uneven changes.</text><text x="28" y="888" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Desktop: one fewer correct case.</text><text x="28" y="915" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Mobile: two more correct cases.</text><text x="28" y="940" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Tablet: no evidence, not zero accuracy.</text><text x="16" y="988" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Small fictional counts; no population claim.</text><text x="16" y="1014" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">The 100% mobile result uses four cases.</text><text x="16" y="1042" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A slice difference does not establish a cause.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
