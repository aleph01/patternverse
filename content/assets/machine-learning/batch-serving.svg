<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Batch Serving: score, publish and look up prepared predictions</title><desc id="desc">Four candidate prediction records pass an exact-key publication check. Run R8 uses inputs cut off at 08:00 and publishes at 08:20. At 08:30, a lookup for merchant A returns nine items with an input-cutoff age of thirty minutes and publication age ten minutes.</desc><rect width="720" height="610" fill="#fff"/><g transform="translate(20,20)"><rect width="680" height="570" fill="#fff"/><text x="0" y="25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="25" fill="#252c28">Score now, consume later</text><text x="0" y="55" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" fill="#626962">Target: 12:00–18:00 · all times UTC</text><text x="0" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#252c28">Candidate R8 · cutoff 08:00</text><text x="0" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" fill="#626962">Scheduled finish 08:20</text><text x="0" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" fill="#252c28">Key</text><text x="80" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" fill="#252c28">Orders</text><text x="175" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" fill="#252c28">Predicted items</text><text x="0" y="209" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28">A</text><text x="80" y="209" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28">4</text><text x="175" y="209" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28">9</text><text x="0" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28">B</text><text x="80" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28">7</text><text x="175" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28">15</text><text x="0" y="285" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28">C</text><text x="80" y="285" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28">0</text><text x="175" y="285" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28">1</text><text x="0" y="323" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28">D</text><text x="80" y="323" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28">2</text><text x="175" y="323" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#252c28">5</text><line x1="0" y1="342" x2="300" y2="342" stroke="#a6aca3"/><text x="0" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#00855b">4/4 keys · R8 activated</text><text x="0" y="402" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#252c28">Active reference → R8</text><path d="M305 389 H332 V114 H353" fill="none" stroke="#a6aca3"/><text x="365" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="21" fill="#252c28">Consumer reads R8</text><text x="365" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#252c28">Input cutoff 08:00</text><text x="365" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#252c28">Published 08:20</text><text x="365" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#252c28">Lookup 08:30 · merchant A</text><text x="365" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="24" fill="#00855b">Cutoff age 30 min</text><text x="365" y="293" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#00855b">9 items</text><text x="365" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#626962">Publication age 10 min</text><text x="365" y="365" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#252c28">Age policy: at most 120 min</text><line x1="0" y1="440" x2="660" y2="440" stroke="#a6aca3"/><text x="0" y="477" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" fill="#252c28">Prepared answer; no model call at lookup.</text><text x="0" y="517" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16" fill="#626962">Coverage and age govern this lookup; neither establishes prediction quality.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
