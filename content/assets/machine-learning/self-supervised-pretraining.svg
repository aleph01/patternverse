<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Self-supervised pretraining and separate task adaptation</title><desc id="desc">Raw words create masked and next-token targets. Optimizing this prediction task learns model parameters. A separate labeled delivery-complaint example is used for adaptation, and independent intent evaluation is required. Token targets do not create intent annotations.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="800" fill="#fff"/><text x="20" y="40" font-size="30" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Create targets. Transfer parameters.</text><text x="20" y="73" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">The pretraining task and the final task have different targets.</text><rect x="20" y="110" width="680" height="95" fill="#f1f2ef"/><text x="32" y="138" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Raw example · no intent annotation</text><text x="32" y="174" font-size="20" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">the parcel arrived late</text><rect x="20" y="245" width="328" height="173" fill="#f1f2ef"/><text x="32" y="273" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Masked-token prediction</text><text x="32" y="311" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">the [MASK] arrived</text><text x="32" y="337" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">late</text><text x="32" y="374" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Target from text: parcel</text><text x="32" y="400" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Selected word hidden; context remains.</text><rect x="372" y="245" width="328" height="173" fill="#f1f2ef"/><text x="384" y="273" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Next-token prediction</text><text x="384" y="311" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">the parcel arrived</text><text x="384" y="374" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Target from text: late</text><text x="384" y="400" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Future words withheld.</text><rect x="20" y="470" width="680" height="78" fill="#f1f2ef"/><text x="32" y="499" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">↓ Optimize the pretraining objective</text><text x="32" y="527" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Learn encoder + word-prediction head.</text><text x="20" y="575" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Toy corpus: 5 lines → 20 token targets. No intent labels are created.</text><text x="20" y="599" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">↓ Reuse parameters for a new task</text><rect x="20" y="620" width="680" height="105" fill="#f1f2ef"/><text x="32" y="648" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Reuse encoder; add intent head</text><text x="32" y="679" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">“my parcel is late”</text><text x="32" y="707" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">→ Delivery complaint</text><text x="20" y="746" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Adapt with task labels → test intent recognition independently.</text><text x="20" y="780" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Illustrative neural workflow. Lower word loss does not prove intent accuracy.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
