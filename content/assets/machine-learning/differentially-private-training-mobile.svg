<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1260" viewBox="0 0 360 1260" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Clipping, Gaussian perturbation, and privacy accounting are distinct steps</title><desc id="desc">Four fictional two-dimensional gradients are clipped at norm one. Their sum is minus point four, one point three. Fixed replay noise one, minus two gives mean point one five, minus point one seven five, and parameter update minus point zero one five, point zero one seven five. This deterministic replay is not private. Separately, fresh Gaussian noise with standard deviation four, replace-one-record sensitivity two, and delta one in one hundred thousand gives converted epsilon bound two point five two four three for one full-batch access and five point two nine eight five for four accesses.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1260" fill="#fff"/><text x="16" y="35" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Bound. Perturb.</text><text x="16" y="70" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Account.</text><text x="16" y="103" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">One fictional update; a separate privacy ledger.</text><svg x="16" y="125" width="328" height="850" viewBox="0 0 328 850"><title id="flow-title">One clipped, perturbed model update and its separate privacy ledger</title><desc id="flow-desc">Four fictional gradients are clipped individually. Their sum receives fixed replay noise, then is divided by four and multiplied by minus the learning rate. The privacy ledger applies to fresh random Gaussian noise, not this deterministic replay.</desc><rect x="0" y="0" width="328" height="220" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="29" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">1. Clip each record</text><text x="12" y="57" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">L2 bound C = 1</text><text x="12" y="91" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A (3, 4) →</text><text x="161" y="107" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">(0.6, 0.8)</text><text x="12" y="122" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">B (0, 2) →</text><text x="161" y="138" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">(0, 1)</text><text x="12" y="153" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">C (-2, 0) →</text><text x="161" y="169" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">(-1, 0)</text><text x="12" y="184" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">D (0, -0.5) →</text><text x="161" y="200" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">(0, -0.5)</text><rect x="0" y="245" width="328" height="200" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="274" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">2. Add noise to sum</text><text x="12" y="307" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Sum (-0.4, 1.3)</text><text x="12" y="339" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Noise SD = 4</text><text x="12" y="371" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Replay (1, -2)</text><text x="12" y="410" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Result (0.6, -0.7)</text><rect x="0" y="470" width="328" height="170" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="499" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">3. Divide and update</text><text x="12" y="532" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Mean (0.15, -0.175)</text><text x="12" y="564" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">w = −0.1 × mean</text><text x="12" y="603" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">(-0.015, 0.0175)</text><rect x="0" y="685" width="328" height="145" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="713" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Ledger: T = 1; full batch</text><text x="12" y="744" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Replace one record → sensitivity 2C = 2</text><text x="12" y="776" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">ρ = 0.125; ε bound = 2.5243</text><text x="12" y="806" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">δ = 0.00001; fresh Gaussian randomness required.</text></svg><rect x="16" y="1010" width="328" height="125" fill="#f1f2ef"/><text x="28" y="1040" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Repeated access costs privacy</text><text x="28" y="1072" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1 access: ε bound 2.5243</text><text x="28" y="1104" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">4 accesses: ε bound 5.2985</text><text x="16" y="1170" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fixed public noise values teach the arithmetic.</text><text x="16" y="1203" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">They provide no privacy protection.</text><text x="16" y="1236" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Bound assumes fresh Gaussian noise; δ = 0.00001.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
