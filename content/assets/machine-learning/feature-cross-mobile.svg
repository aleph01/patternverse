<svg xmlns="http://www.w3.org/2000/svg" width="360" height="890" viewBox="0 0 360 890" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Feature Cross: one weather effect or a pair-specific adjustment</title><desc id="desc">Two fits use the same fictional trip cells: bike dry twenty, bike wet forty, car dry thirty and car wet thirty-five minutes. Separate indicators fit one twelve-and-a-half-minute wet effect for both vehicles. Adding car times wet fits twenty minutes for bikes and five for cars, with a minus-fifteen-minute interaction coefficient. Four crossed coefficients fit four supplied cells; this is not evidence of generalization.</desc><rect width="360" height="890" fill="#fff"/><g transform="translate(16,20)"><rect width="328" height="850" fill="#fff"/><text x="0" y="24" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fits on synthetic cells</text><text x="0" y="49" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Green marks the inspected pair.</text><text x="0" y="88" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Separate indicators</text><text x="90" y="123" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Dry</text><text x="212" y="123" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Wet</text><text x="0" y="168" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Bike</text><rect x="74" y="138" width="118" height="78" fill="#fff" stroke="#a6aca3"/><text x="84" y="169" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">23.75</text><text x="84" y="198" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target 20</text><rect x="196" y="138" width="118" height="78" fill="#fff" stroke="#a6aca3"/><text x="206" y="169" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">36.25</text><text x="206" y="198" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target 40</text><text x="0" y="262" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Car</text><rect x="74" y="232" width="118" height="78" fill="#fff" stroke="#a6aca3"/><text x="84" y="263" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">26.25</text><text x="84" y="292" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target 30</text><rect x="196" y="232" width="118" height="78" fill="#edf5f0" stroke="#00855b"/><text x="206" y="263" font-size="24" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">38.75</text><text x="206" y="292" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target 35</text><text x="0" y="342" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Bike wet change: 12.5 min</text><text x="0" y="368" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Car wet change: 12.5 min</text><text x="0" y="435" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Add car × wet</text><text x="90" y="470" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Dry</text><text x="212" y="470" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Wet</text><text x="0" y="515" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Bike</text><rect x="74" y="485" width="118" height="78" fill="#fff" stroke="#a6aca3"/><text x="84" y="516" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">20</text><text x="84" y="545" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target 20</text><rect x="196" y="485" width="118" height="78" fill="#fff" stroke="#a6aca3"/><text x="206" y="516" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">40</text><text x="206" y="545" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target 40</text><text x="0" y="609" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Car</text><rect x="74" y="579" width="118" height="78" fill="#fff" stroke="#a6aca3"/><text x="84" y="610" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">30</text><text x="84" y="639" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target 30</text><rect x="196" y="579" width="118" height="78" fill="#edf5f0" stroke="#00855b"/><text x="206" y="610" font-size="24" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">35</text><text x="206" y="639" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Target 35</text><text x="0" y="689" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Bike wet change: 20 min</text><text x="0" y="715" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Car wet change: 5 min</text><text x="0" y="763" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Inspected Car + wet · cw = 1</text><text x="0" y="791" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Cross coefficient: -15 min</text><text x="0" y="824" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Supplied cells are not a test set.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
