<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Cascade: routing, early misses and avoided later work</title><desc id="desc">Eight fictional parts reach a gate with threshold 0.30. Parts A, B, C, E and F continue, while D, G and H stop. D is a reviewed defect that the later model never sees. The cascade finds three of four defects. Gate work eight milliseconds plus later work sixty milliseconds totals sixty-eight, versus ninety-six for the later model alone. Supplied costs are not measured latency.</desc><rect width="720" height="590" fill="#fff"/><g transform="translate(20,20)"><rect width="680" height="550" fill="#fff"/><text x="0" y="24" font-size="20" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Gate, then inspect survivors</text><text x="0" y="52" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Continue if score ≥ 0.30</text><text x="0" y="78" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Green cells = reviewed defects for evaluation, not gate inputs.</text><text x="0" y="118" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Stage 1 · all 8 parts</text><text x="0" y="146" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1 ms each · 8 ms work</text><rect x="0" y="164" width="36" height="36" fill="#edf5f0" stroke="#00855b"/><text x="13" y="188" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A</text><rect x="42" y="164" width="36" height="36" fill="#edf5f0" stroke="#00855b"/><text x="55" y="188" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">B</text><rect x="84" y="164" width="36" height="36" fill="#edf5f0" stroke="#00855b"/><text x="97" y="188" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">C</text><rect x="126" y="164" width="36" height="36" fill="#edf5f0" stroke="#00855b"/><text x="139" y="188" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">D</text><rect x="168" y="164" width="36" height="36" fill="#f1f2ef" stroke="#a6aca3"/><text x="181" y="188" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">E</text><rect x="210" y="164" width="36" height="36" fill="#f1f2ef" stroke="#a6aca3"/><text x="223" y="188" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F</text><rect x="252" y="164" width="36" height="36" fill="#f1f2ef" stroke="#a6aca3"/><text x="265" y="188" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">G</text><rect x="294" y="164" width="36" height="36" fill="#f1f2ef" stroke="#a6aca3"/><text x="307" y="188" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">H</text><path d="M165 214 L165 246" fill="none" stroke="#a6aca3"/><path d="M160 246 L530 246" fill="none" stroke="#a6aca3"/><path d="M160 246 L160 266" fill="none" stroke="#a6aca3"/><path d="M530 246 L530 266" fill="none" stroke="#a6aca3"/><text x="0" y="288" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Stage 2 · 5 parts</text><text x="0" y="316" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">12 ms each · 60 ms work</text><rect x="0" y="336" width="36" height="36" fill="#edf5f0" stroke="#00855b"/><text x="13" y="360" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A</text><rect x="42" y="336" width="36" height="36" fill="#edf5f0" stroke="#00855b"/><text x="55" y="360" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">B</text><rect x="84" y="336" width="36" height="36" fill="#edf5f0" stroke="#00855b"/><text x="97" y="360" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">C</text><rect x="126" y="336" width="36" height="36" fill="#f1f2ef" stroke="#a6aca3"/><text x="139" y="360" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">E</text><rect x="168" y="336" width="36" height="36" fill="#f1f2ef" stroke="#a6aca3"/><text x="181" y="360" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F</text><text x="0" y="400" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Flagged: A B C</text><text x="370" y="288" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Stopped · 3 parts</text><text x="370" y="316" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Set ordinary; skip stage 2</text><rect x="370" y="336" width="36" height="36" fill="#edf5f0" stroke="#00855b"/><text x="383" y="360" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">D</text><rect x="412" y="336" width="36" height="36" fill="#f1f2ef" stroke="#a6aca3"/><text x="425" y="360" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">G</text><rect x="454" y="336" width="36" height="36" fill="#f1f2ef" stroke="#a6aca3"/><text x="467" y="360" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">H</text><text x="370" y="410" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Missed here: D</text><text x="0" y="467" font-size="20" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Work: 8 + 60 = 68 ms</text><text x="0" y="498" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Defects found: 3/4 · later alone 4/4</text><text x="0" y="530" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Later stages cannot recover cases discarded before reaching them.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
