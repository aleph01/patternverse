<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1430" viewBox="0 0 360 1430" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Retrieved evidence enters the context; answer support still needs checking</title><desc id="desc">For a fictional Cedar Hall cancellation question, current public passages P1 and P5 score 2.8669 and 2.2906. P1 states a 24-hour cancellation cutoff; P5 concerns booking duration. Metadata filtering excludes superseded P2 and staff-only P4. An illustrated human-authored draft cites P1. Generation and semantic support checking are conceptual, not executed.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1430" fill="#fff"/><text x="16" y="35" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Retrieve evidence.</text><text x="16" y="70" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Check the answer.</text><text x="16" y="103" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional handbook; no model executed.</text><svg x="16" y="125" width="328" height="825" viewBox="0 0 328 825"><title id="flow-title">Retrieve eligible passages, assemble sources, then generate and check an answer</title><desc id="flow-desc">The first two stages are computed. Generation and claim checking are conceptual and are not executed. Source scores do not establish answer support.</desc><rect x="0" y="0" width="328" height="245" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="30" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">1. Retrieve evidence</text><text x="12" y="62" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">4/6 eligible; top 2 requested</text><text x="12" y="100" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">P1 · score 2.8669</text><text x="12" y="130" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">P5 · score 2.2906</text><text x="12" y="229" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Scores do not establish support.</text><rect x="0" y="275" width="328" height="205" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="305" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">2. Assemble context</text><text x="12" y="340" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Question + source passages</text><text x="12" y="373" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Keep IDs and revisions</text><text x="12" y="407" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">P1 → P5</text><text x="12" y="446" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0 superseded in context</text><rect x="0" y="510" width="328" height="205" fill="#f1f2ef" stroke="#00855b"/><text x="12" y="540" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">3. Generate + check</text><text x="12" y="575" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Draft from evidence</text><text x="12" y="608" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Check claim ↔ source</text><text x="12" y="645" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Model not run here.</text><text x="12" y="684" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Citations need support.</text><text x="0" y="765" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Retrieval is not verification.</text><text x="0" y="795" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Permissions and versions are separate gates.</text></svg><rect x="16" y="990" width="328" height="310" fill="#f1f2ef"/><text x="28" y="1020" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">From source to supported claim</text><text x="28" y="1055" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">[P1] Members may cancel a room</text><text x="28" y="1079" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">booking without a fee until 24</text><text x="28" y="1103" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">hours before its start.</text><text x="28" y="1142" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Human-authored answer draft:</text><text x="28" y="1170" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Cancel without a fee at least 24</text><text x="28" y="1194" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">hours before the booking starts</text><text x="28" y="1218" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">[P1].</text><text x="16" y="1345" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">P5 concerns duration, not the cutoff.</text><text x="16" y="1380" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A citation must support its claim.</text><text x="16" y="1415" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Scores measure word relevance, not truth.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
