<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Model Versioning: restore the complete release</title><desc id="desc">For the same 30 kilometre input, complete R1 uses transform T1, weights W1 and policy P1 to predict 30 minutes and trigger review. Restoring W1 alone into R2 keeps T2 and P2, predicting 25 minutes without review. Both paths execute deterministic fictional formulas.</desc><rect width="720" height="500" fill="#fff"/><g transform="translate(20,20)"><rect width="680" height="460" fill="#fff"/><text x="220" y="24" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same request · 30 km</text><path d="M340 34 V48 H8 V105 M340 48 H358 V105" fill="none" stroke="#a6aca3"/><text x="26" y="84" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Complete R1</text><path d="M8 127 L8 191" fill="none" stroke="#a6aca3"/><circle cx="8" cy="118" r="3" fill="#00855b"/><text x="26" y="122" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Transform T1</text><text x="26" y="144" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">z = (30 − 10) / 10 = 2</text><path d="M8 203 L8 267" fill="none" stroke="#a6aca3"/><circle cx="8" cy="194" r="3" fill="#00855b"/><text x="26" y="198" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weights W1</text><text x="26" y="220" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">20 + 5 × 2 = 30 min</text><path d="M8 279 L8 343" fill="none" stroke="#a6aca3"/><circle cx="8" cy="270" r="3" fill="#00855b"/><text x="26" y="274" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Review rule P1</text><text x="26" y="296" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Review when estimate ≥ 30 min</text><text x="26" y="354" font-size="22" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">30 min · Review</text><rect x="26" y="374" width="280" height="12" fill="#f1f2ef"/><rect x="26" y="374" width="210" height="12" fill="#00855b"/><text x="26" y="409" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><text x="268" y="409" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">40 min</text><text x="376" y="84" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Assembled · mixed components</text><path d="M358 127 L358 191" fill="none" stroke="#a6aca3"/><circle cx="358" cy="118" r="3" fill="#626962"/><text x="376" y="122" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Transform T2</text><text x="376" y="144" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">z = (30 − 20) / 10 = 1</text><path d="M358 203 L358 267" fill="none" stroke="#a6aca3"/><circle cx="358" cy="194" r="3" fill="#626962"/><text x="376" y="198" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weights W1</text><text x="376" y="220" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">20 + 5 × 1 = 25 min</text><path d="M358 279 L358 343" fill="none" stroke="#a6aca3"/><circle cx="358" cy="270" r="3" fill="#626962"/><text x="376" y="274" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Review rule P2</text><text x="376" y="296" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Review when estimate ≥ 32 min</text><text x="376" y="354" font-size="22" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">25 min · No review</text><rect x="376" y="374" width="280" height="12" fill="#f1f2ef"/><rect x="376" y="374" width="175" height="12" fill="#626962"/><text x="376" y="409" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><text x="618" y="409" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">40 min</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
