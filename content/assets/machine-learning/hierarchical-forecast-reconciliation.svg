<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1160" viewBox="0 0 720 1160" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Reconcile a hierarchy without confusing coherence and accuracy</title><desc id="desc">Seven fictional base forecasts have gaps ten, ten and minus ten units. Equal-weight reconciliation changes total 120 to 115.7143, North 70 to 69.5238 and South 40 to 46.1905, with four adjusted stores summing to these regions. All gaps become zero. If actual store outcomes equal the original store forecasts, store mean absolute error increases from zero to 3.3333, illustrating that coherence does not guarantee individual-series accuracy. Bottom-up retains store values and instead gives total 110.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="1160" fill="#fff"/><text x="20" y="42" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Make seven forecasts add up.</text><text x="20" y="82" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Equal-weight least squares adjusts all levels together; fictional weekly demand.</text><svg x="20" y="125" width="680" height="800" viewBox="0 0 680 800"><title id="diagram-title">From disagreeing forecasts to one coherent hierarchy</title><desc id="diagram-desc">Each node shows its base forecast and computed reconciled forecast for the same next week. Three parent-minus-children gaps and a store-error counterexample separate coherence from accuracy.</desc><text x="0" y="25" font-size="22" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">One week. Seven linked forecasts.</text><text x="0" y="54" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Each node: base → reconciled (rounded)</text><line x1="340" y1="167" x2="170" y2="205" stroke="#a6aca3" stroke-width="2"/><line x1="340" y1="167" x2="510" y2="205" stroke="#a6aca3" stroke-width="2"/><line x1="170" y1="287" x2="85" y2="325" stroke="#a6aca3" stroke-width="2"/><line x1="170" y1="287" x2="255" y2="325" stroke="#a6aca3" stroke-width="2"/><line x1="510" y1="287" x2="425" y2="325" stroke="#a6aca3" stroke-width="2"/><line x1="510" y1="287" x2="595" y2="325" stroke="#a6aca3" stroke-width="2"/><rect x="220" y="85" width="240" height="82" fill="#f1f2ef" stroke="#a6aca3"/><text x="340" y="111" font-size="17" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Total</text><text x="340" y="143" font-size="15" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">120 → 115.71</text><rect x="50" y="205" width="240" height="82" fill="#f1f2ef" stroke="#a6aca3"/><text x="170" y="231" font-size="17" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">North</text><text x="170" y="263" font-size="15" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">70 → 69.52</text><rect x="390" y="205" width="240" height="82" fill="#f1f2ef" stroke="#a6aca3"/><text x="510" y="231" font-size="17" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">South</text><text x="510" y="263" font-size="15" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">40 → 46.19</text><rect x="10" y="325" width="150" height="82" fill="#f1f2ef" stroke="#a6aca3"/><text x="85" y="351" font-size="17" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">N1</text><text x="85" y="383" font-size="15" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">30 → 34.76</text><rect x="180" y="325" width="150" height="82" fill="#f1f2ef" stroke="#a6aca3"/><text x="255" y="351" font-size="17" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">N2</text><text x="255" y="383" font-size="15" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">30 → 34.76</text><rect x="350" y="325" width="150" height="82" fill="#f1f2ef" stroke="#a6aca3"/><text x="425" y="351" font-size="17" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">S1</text><text x="425" y="383" font-size="15" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">20 → 18.1</text><rect x="520" y="325" width="150" height="82" fill="#f1f2ef" stroke="#a6aca3"/><text x="595" y="351" font-size="17" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">S2</text><text x="595" y="383" font-size="15" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">30 → 28.1</text><rect x="0" y="465" width="680" height="190" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="494" font-size="17" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Parent minus children</text><text x="14" y="521" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Before → after reconciliation</text><text x="14" y="553" font-size="15" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Total − North − South</text><text x="666" y="553" font-size="15" text-anchor="end" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">10 → 0</text><text x="14" y="589" font-size="15" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">North − N1 − N2</text><text x="666" y="589" font-size="15" text-anchor="end" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">10 → 0</text><text x="14" y="625" font-size="15" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">South − S1 − S2</text><text x="666" y="625" font-size="15" text-anchor="end" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">-10 → 0</text><text x="0" y="695" font-size="17" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Coherent does not mean more accurate</text><text x="0" y="727" font-size="14" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Hypothetical actual stores equal their base forecasts; not used in the solve.</text><text x="0" y="762" font-size="16" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Store MAE: 0.0000 → 3.3333</text><text x="0" y="782" font-size="13" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional point forecasts; no accuracy guarantee.</text></svg><rect x="20" y="965" width="680" height="140" fill="#f1f2ef"/><text x="32" y="994" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Another coherent answer: bottom-up</text><text x="32" y="1029" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Retain stores (30, 30, 20, 30); sum to North 60, South 50, Total 110.</text><text x="32" y="1066" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Coherence alone does not select the most useful forecasting method.</text><text x="20" y="1138" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Unrounded values obey sums; node values round to two decimals.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
