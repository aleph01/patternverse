<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1020" viewBox="0 0 360 1020" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Selective prediction separates automated decisions from deferred work</title><desc id="desc">A threshold of 0.80 accepts eight of twelve fictional tickets, with two errors and four deferred cases. Both tied scores of 0.80 are accepted. Routine has six of eight accepted and zero accepted errors; complex has two of four accepted and two accepted errors. If every deferred case receives a correct two-unit review and each automatic error costs ten, total cost is twenty-eight units. No population guarantee is established.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1020" fill="#fff"/><text x="16" y="34" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Answer some.</text><text x="16" y="67" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Defer the rest.</text><text x="16" y="98" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Twelve tickets · threshold 0.80.</text><svg x="16" y="120" width="328" height="532" viewBox="0 0 328 532"><text x="0" y="25" font-size="18" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">One gate; unchanged predictions.</text><text x="0" y="48" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Score ≥ 0.80 accepts; ties stay together.</text><rect x="0" y="62" width="102" height="62" fill="#edf5f0"/><text x="7" y="81" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">T01 · 0.99</text><text x="7" y="102" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">ACCEPT</text><rect x="112" y="62" width="102" height="62" fill="#edf5f0"/><text x="119" y="81" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">T02 · 0.97</text><text x="119" y="102" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">ACCEPT</text><rect x="224" y="62" width="102" height="62" fill="#edf5f0"/><text x="231" y="81" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">T03 · 0.95</text><text x="231" y="102" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">ACCEPT</text><text x="231" y="117" font-size="11" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">wrong label</text><rect x="0" y="134" width="102" height="62" fill="#edf5f0"/><text x="7" y="153" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">T04 · 0.90</text><text x="7" y="174" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">ACCEPT</text><rect x="112" y="134" width="102" height="62" fill="#edf5f0"/><text x="119" y="153" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">T05 · 0.90</text><text x="119" y="174" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">ACCEPT</text><rect x="224" y="134" width="102" height="62" fill="#edf5f0"/><text x="231" y="153" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">T06 · 0.85</text><text x="231" y="174" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">ACCEPT</text><rect x="0" y="206" width="102" height="62" fill="#edf5f0"/><text x="7" y="225" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">T07 · 0.80</text><text x="7" y="246" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">ACCEPT</text><text x="7" y="261" font-size="11" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">wrong label</text><rect x="112" y="206" width="102" height="62" fill="#edf5f0"/><text x="119" y="225" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">T08 · 0.80</text><text x="119" y="246" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">ACCEPT</text><rect x="224" y="206" width="102" height="62" fill="#f1f2ef"/><text x="231" y="225" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">T09 · 0.75</text><text x="231" y="246" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">DEFER</text><rect x="0" y="278" width="102" height="62" fill="#f1f2ef"/><text x="7" y="297" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">T10 · 0.70</text><text x="7" y="318" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">DEFER</text><rect x="112" y="278" width="102" height="62" fill="#f1f2ef"/><text x="119" y="297" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">T11 · 0.60</text><text x="119" y="318" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">DEFER</text><rect x="224" y="278" width="102" height="62" fill="#f1f2ef"/><text x="231" y="297" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">T12 · 0.55</text><text x="231" y="318" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">DEFER</text><rect x="0" y="364" width="328" height="140" fill="#f1f2ef"/><text x="12" y="389" font-size="16" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">8/12 automated · 66.7%</text><text x="12" y="415" font-size="15" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Errors: 2/8 · 25.0%</text><text x="12" y="443" font-size="15" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">4 deferred for review</text><text x="12" y="470" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Capacity: 4 · excess: 0</text></svg><rect x="16" y="710" width="328" height="140" fill="#f1f2ef"/><text x="28" y="738" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Same gate, different group results</text><text x="28" y="769" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Routine: 6/8 accepted · 0/6 wrong</text><text x="28" y="800" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Complex: 2/4 accepted · 2/2 wrong</text><text x="16" y="892" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Review: 4 tickets × 2 units = 8 units.</text><text x="16" y="920" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Errors: 2 × 10 = 20. Total: 28 units.</text><text x="16" y="964" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional data; perfect review assumed.</text><text x="16" y="992" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Observed rates are not guarantees.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
