<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1500" viewBox="0 0 360 1500" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Replay stored examples to counter forgetting during new updates</title><desc id="desc">Four frozen memory records A3, A4, B3, B4 accompany twelve updates on new cohort C. A three-weight linear model starts at one, minus one, zero. Current and memory mean gradients receive equal weight at learning rate 0.25. Old mean squared error ends at 0.0619 and new error at 0.0079. The matched current-only control has step size 0.125 and old error 0.1103. The plot shows old and new replay errors and old error for this matched control. These are deterministic fixture errors without held-out evaluation.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1500" fill="#fff"/><text x="16" y="36" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Keep old examples</text><text x="16" y="73" font-size="27" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">in the learning loop.</text><text x="16" y="105" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A fictional linear model; exact updates.</text><svg x="16" y="125" width="328" height="970" viewBox="0 0 328 970"><title id="diagram-title">A frozen historical memory changes the new update trajectory</title><desc id="diagram-desc">Computed memory contents, weighted gradient mechanism, model weights, old and new mean squared errors, and a current-only control with the same new-data step size.</desc><rect x="0" y="0" width="328" height="175" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="29" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Historical memory: 4 records</text><text x="14" y="60" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A: 2 slots; B: 2 slots</text><text x="14" y="91" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A3 · A4 · B3 · B4</text><text x="14" y="119" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"/><text x="14" y="149" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Current C = (1, 1, 1), target 1.</text><text x="157" y="197" font-size="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">↓</text><rect x="0" y="205" width="328" height="140" fill="#f1f2ef" stroke="#a6aca3"/><text x="14" y="234" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Weighted gradient update</text><text x="14" y="265" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">g = 0.5 × gnew + 0.5 × gmemory</text><text x="14" y="296" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">w ← w − 0.25 × g</text><text x="14" y="326" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Memory mean uses all retained records.</text><text x="0" y="392" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Update 12 of 12</text><text x="0" y="421" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">w₁ 1.2487; w₂ -0.7513</text><text x="0" y="446" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">w₃ 0.4138</text><text x="0" y="473" font-size="14" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Mean squared error</text><line x1="44" y1="725" x2="314" y2="725" stroke="#a6aca3"/><text x="0" y="729" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.0</text><line x1="44" y1="607.5" x2="314" y2="607.5" stroke="#a6aca3"/><text x="0" y="611.5" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.5</text><line x1="44" y1="490" x2="314" y2="490" stroke="#a6aca3"/><text x="0" y="494" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1.0</text><text x="41" y="748" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><text x="176" y="748" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">6</text><text x="311" y="748" font-size="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">12</text><path d="M 44 725 L 66.5 721.328125 L 89 716.0354614257812 L 111.5 712.1447956562042 L 134 709.8317151190713 L 156.5 708.6737085096138 L 179 708.2535668947476 L 201.5 708.274089580613 L 224 708.5460183600381 L 246.5 708.9549873454653 L 269 709.4338361524024 L 291.5 709.9438352027266 L 314 710.4629706027584" fill="none" stroke="#00855b" stroke-width="3"/><path d="M 44 490 L 66.5 633.203125 L 89 686.2158203125 L 111.5 706.796383857727 L 134 715.2981272526085 L 156.5 719.0777352767327 L 179 720.8951049787836 L 201.5 721.8393778895563 L 224 722.3679798278405 L 246.5 722.686520298061 L 269 722.8936244527996 L 291.5 723.0392730849755 L 314 723.1498813419673" fill="none" stroke="#252c28" stroke-width="2.5" stroke-dasharray="8 5"/><path d="M 44 725 L 66.5 721.328125 L 89 715.303955078125 L 111.5 710.0821113586426 L 134 706.249420940876 L 156.5 703.6317089246586 L 179 701.9088105922128 L 201.5 700.7980818210319 L 224 700.090627388496 L 246.5 699.6432929968535 L 269 699.3616873726597 L 291.5 699.1848941585476 L 314 699.0740899235592" fill="none" stroke="#626962" stroke-width="2.5" stroke-dasharray="2 5"/><line x1="314" y1="490" x2="314" y2="725" stroke="#626962" stroke-dasharray="3 4"/><circle cx="314" cy="710.4629706027584" r="4" fill="#252c28"/><circle cx="314" cy="723.1498813419673" r="4" fill="#252c28"/><text x="144" y="768" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">C updates</text><text x="0" y="802" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Solid: old MSE · replay</text><text x="0" y="827" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Dashed: new MSE · replay</text><text x="0" y="852" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Dotted: old MSE · matched current-only</text><text x="0" y="891" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Old 0.0619; new 0.0079</text><text x="0" y="920" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Control old 0.1103</text><text x="0" y="953" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Training-fixture errors; no held-out estimate.</text></svg><rect x="16" y="1140" width="328" height="270" fill="#f1f2ef"/><text x="28" y="1170" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">After the same twelve C updates</text><text x="28" y="1206" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Current only, step 0.25:</text><text x="28" y="1231" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">old 0.1111; new below 10⁻¹²</text><text x="28" y="1270" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Matched current only, step 0.125:</text><text x="28" y="1295" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">old 0.1103; new 0.0000126</text><text x="28" y="1334" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Replay ρ = 0.5, step 0.25:</text><text x="28" y="1359" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">old 0.0619; new 0.0079</text><text x="28" y="1391" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Old A (1,0,0) → 1; B (0,1,0) → −1.</text><text x="16" y="1455" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Four memory slots, with equal A/B quotas.</text><text x="16" y="1480" font-size="13" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Frozen memory; no held-out performance claim.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
