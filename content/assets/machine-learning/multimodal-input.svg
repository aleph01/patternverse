<svg xmlns="http://www.w3.org/2000/svg" width="720" height="550" viewBox="0 0 720 550" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Multimodal Input: associate observations before fusion</title><desc id="desc">A report and photograph for claim C17 supply synthetic signals 0.80 and 0.20. After an ID check, their weights 0.40 and 0.60 yield contributions 0.32 and 0.12. A combined score 0.44 is below the priority threshold 0.60. No encoder or accuracy experiment is run.</desc><rect width="720" height="550" fill="#fff"/><g transform="translate(20,20)"><rect width="680" height="510" fill="#fff"/><text x="0" y="24" font-size="20" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Different inputs, one claim</text><text x="0" y="49" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Supplied signals · no encoder runs</text><text x="0" y="88" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Written report</text><text x="0" y="114" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Claim C17</text><rect x="0" y="131" width="116" height="66" fill="#f1f2ef"/><text x="10" y="158" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">“The box</text><text x="10" y="180" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">is crushed.”</text><path d="M132 165 L164 165" fill="none" stroke="#a6aca3"/><text x="174" y="153" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Branch signal</text><text x="174" y="186" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.80</text><text x="350" y="88" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Photograph</text><text x="350" y="114" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Claim C17</text><rect x="350" y="131" width="116" height="66" fill="#f1f2ef" stroke="#a6aca3"/><path d="M375 148 L415 143 L441 162 L438 186 L378 186 Z M375 148 L402 166 L441 162 M402 166 L402 186" fill="none" stroke="#a6aca3"/><path d="M482 165 L514 165" fill="none" stroke="#a6aca3"/><text x="524" y="153" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Branch signal</text><text x="524" y="186" font-size="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.20</text><path d="M155 210 L155 243" fill="none" stroke="#a6aca3"/><path d="M505 210 L505 243" fill="none" stroke="#a6aca3"/><path d="M155 243 L505 243" fill="none" stroke="#a6aca3"/><path d="M340 243 L340 269" fill="none" stroke="#a6aca3"/><text x="0" y="277" font-size="17" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">IDs agree · combine both signals</text><text x="0" y="322" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Score 0.44 · Standard review</text><rect x="0" y="339" width="640" height="32" fill="#f1f2ef" stroke="#a6aca3"/><rect x="0" y="339" width="204.80000000000004" height="32" fill="#00855b"/><rect x="204.80000000000004" y="339" width="76.8" height="32" fill="#b7c8ba"/><path d="M384 331 L384 381" fill="none" stroke="#252c28"/><text x="0" y="397" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><text x="616" y="397" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">1.0</text><text x="346" y="419" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.60 priority</text><text x="0" y="452" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Report contribution 0.32</text><text x="350" y="452" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Photo contribution 0.12</text><text x="0" y="495" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weights and threshold are teaching choices, not measured performance.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
