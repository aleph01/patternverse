<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Hyperparameter Tuning: fit, validate and select within a budget</title><desc id="desc">Two ridge candidates are fitted on training records and compared using validation mean squared error. Lambda two is selected with error 0.625; two remaining settings are not tried within this budget. Independent test evidence is outside selection.</desc><rect width="720" height="580" fill="#fff"/><g transform="translate(20,20)"><rect width="680" height="540" fill="#fff"/><text x="0" y="24" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="24">Fit → validate → select</text><text x="0" y="52" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16">2 completed trials · panel A</text><text x="0" y="92" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16">Training records → fit w</text><text x="345" y="92" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16">Validation records → MSE</text><line x1="0" y1="110" x2="660" y2="110" stroke="#a6aca3" stroke-width="1"/><text x="0" y="145" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15">Setting</text><text x="105" y="145" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15">Fitted w</text><text x="235" y="145" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15">Validation MSE · lower is better</text><text x="0" y="188" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18">λ 0</text><text x="105" y="188" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18">1.8</text><text x="235" y="188" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18">1.6</text><rect x="330" y="173" width="300" height="18" fill="#f1f2ef"/><rect x="330" y="173" width="192.00000000000003" height="18" fill="#626962"/><text x="0" y="246" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18">λ 2</text><text x="105" y="246" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18">1.5</text><text x="235" y="246" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18">0.625</text><rect x="330" y="231" width="300" height="18" fill="#f1f2ef"/><rect x="330" y="231" width="75" height="18" fill="#00855b"/><text x="0" y="304" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18">λ 8</text><text x="105" y="304" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18">—</text><text x="235" y="304" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16">Not tried</text><line x1="330" y1="298" x2="630" y2="298" stroke="#a6aca3" stroke-width="1"/><text x="0" y="362" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18">λ 26</text><text x="105" y="362" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18">—</text><text x="235" y="362" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="16">Not tried</text><line x1="330" y1="356" x2="630" y2="356" stroke="#a6aca3" stroke-width="1"/><line x1="0" y1="405" x2="660" y2="405" stroke="#a6aca3" stroke-width="1"/><text x="0" y="442" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="22">Selected λ 2 · w 1.5 · validation MSE 0.625</text><text x="0" y="480" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15">Only completed trials can win. Bars share a 0–2.5 MSE scale.</text><text x="0" y="516" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15">Independent test evidence stays outside this comparison; none is supplied here.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
