<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1060" viewBox="0 0 360 1060" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Historical feature retrieval checks event time and availability separately</title><desc id="desc">At ten o’clock UTC for merchant A, with a sixty-minute age limit, F01 and F03 qualify. F03 is newest and gives fifty. F02 and F04 arrive later, F05 is a future event, F06 belongs to merchant B, and F07 is too old. An event-only query selects corrected F04 with sixty-five; latest-in-archive selects F05 with ninety. The retained archive is queried at ten-thirty, not used as the historical cutoff.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1060" fill="#fff"/><text x="16" y="34" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Replay what was</text><text x="16" y="67" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">available then.</text><text x="16" y="98" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Merchant A · decision at 10:00 UTC.</text><svg x="16" y="120" width="328" height="648" viewBox="0 0 328 648"><text x="0" y="25" font-size="18" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Two clocks, one historical decision.</text><text x="0" y="49" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Key A · cutoff 10:00 · age ≤ 60 min</text><text x="0" y="76" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Event and ready times must both be ≤ cutoff.</text><rect x="0" y="94" width="160" height="98" fill="#f1f2ef"/><text x="8" y="115" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F01 · A · value 40</text><text x="8" y="137" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Event 09:00</text><text x="8" y="156" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Ready 09:02</text><text x="8" y="177" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Eligible, older</text><rect x="168" y="94" width="160" height="98" fill="#f1f2ef"/><text x="176" y="115" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F02 · A · value 70</text><text x="176" y="137" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Event 09:30</text><text x="176" y="156" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Ready 10:20</text><text x="176" y="177" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Available later</text><rect x="0" y="202" width="160" height="98" fill="#edf5f0"/><text x="8" y="223" font-size="13" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">F03 · A · value 50</text><text x="8" y="245" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Event 09:45</text><text x="8" y="264" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Ready 09:47</text><text x="8" y="285" font-size="12" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">SELECTED</text><rect x="168" y="202" width="160" height="98" fill="#f1f2ef"/><text x="176" y="223" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F04 · A · value 65</text><text x="176" y="245" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Event 09:45</text><text x="176" y="264" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Ready 10:10</text><text x="176" y="285" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Available later</text><rect x="0" y="310" width="160" height="98" fill="#f1f2ef"/><text x="8" y="331" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F05 · A · value 90</text><text x="8" y="353" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Event 10:05</text><text x="8" y="372" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Ready 10:06</text><text x="8" y="393" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Future event</text><rect x="168" y="310" width="160" height="98" fill="#f1f2ef"/><text x="176" y="331" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F06 · B · value 999</text><text x="176" y="353" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Event 09:58</text><text x="176" y="372" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Ready 09:59</text><text x="176" y="393" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Different entity</text><rect x="0" y="418" width="160" height="98" fill="#f1f2ef"/><text x="8" y="439" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F07 · A · value 20</text><text x="8" y="461" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Event 08:00</text><text x="8" y="480" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Ready 08:01</text><text x="8" y="501" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Too old</text><rect x="0" y="538" width="328" height="90" fill="#f1f2ef"/><text x="12" y="564" font-size="17" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Historical result: F03 = 50</text><text x="12" y="591" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2 eligible snapshots; keep this decision row.</text><text x="12" y="614" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Choose newest event, then ready time and revision.</text></svg><rect x="16" y="795" width="328" height="155" fill="#f1f2ef"/><text x="28" y="823" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Same archive. Three answers.</text><text x="28" y="854" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Replay known then: F03 = 50</text><text x="28" y="883" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Event cutoff only: F04 = 65</text><text x="28" y="912" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Latest in archive: F05 = 90</text><text x="16" y="992" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">F04 corrects F03 after the decision.</text><text x="16" y="1024" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional snapshots; no model is fitted.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
