<svg xmlns="http://www.w3.org/2000/svg" width="720" height="950" viewBox="0 0 720 950" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">An overall gain can hide a slice regression</title><desc id="desc">On twenty fictional cases, A gets sixteen correct and B seventeen. Desktop accuracy falls from fourteen of sixteen to thirteen of sixteen; mobile rises from two of four to four of four. Tablet has zero examples and no measured performance. Both models are evaluated on the same fixed records. No population conclusion or causal explanation is established.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="950" fill="#fff"/><text x="20" y="42" font-size="29" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Overall improves. Desktop regresses.</text><text x="20" y="76" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Evaluate the same predictions on meaningful subsets.</text><rect x="20" y="120" width="680" height="115" fill="#f1f2ef"/><text x="32" y="149" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Overall · 20 fictional tickets</text><text x="32" y="180" font-size="18" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">A: 16/20 = 80.0% → B: 17/20 = 85.0%</text><text x="32" y="210" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A = current (green) · B = candidate (gray)</text><svg x="20" y="265" width="680" height="510" viewBox="0 0 680 510"><title>Two fixed prediction sets compared on the shown slices</title><g transform="translate(0,0)"><rect width="680" height="158" fill="var(--panel, #f1f2ef)"/><text x="12" y="27" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Desktop · rows 16</text><text x="12" y="55" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">A: 14/16 = 87.5%</text><rect x="12" y="65" width="656" height="12" fill="var(--line, #a6aca3)"/><rect x="12" y="65" width="574" height="12" fill="var(--accent, #00855b)"/><text x="12" y="112" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">B: 13/16 = 81.3%</text><rect x="12" y="122" width="656" height="12" fill="var(--line, #a6aca3)"/><rect x="12" y="122" width="533" height="12" fill="#8c938b"/></g><g transform="translate(0,170)"><rect width="680" height="158" fill="var(--panel, #f1f2ef)"/><text x="12" y="27" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Mobile · rows 4</text><text x="12" y="55" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">A: 2/4 = 50.0%</text><rect x="12" y="65" width="656" height="12" fill="var(--line, #a6aca3)"/><rect x="12" y="65" width="328" height="12" fill="var(--accent, #00855b)"/><text x="12" y="112" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">B: 4/4 = 100.0%</text><rect x="12" y="122" width="656" height="12" fill="var(--line, #a6aca3)"/><rect x="12" y="122" width="656" height="12" fill="#8c938b"/></g><g transform="translate(0,340)"><rect width="680" height="158" fill="var(--panel, #f1f2ef)"/><text x="12" y="27" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">Tablet · rows 0</text><text x="12" y="55" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">A: N/A · denominator 0</text><text x="12" y="112" font-size="16" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="var(--ink, #252c28)">B: N/A · denominator 0</text></g></svg><rect x="20" y="800" width="680" height="90" fill="#f1f2ef"/><text x="32" y="829" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">One overall gain; uneven changes.</text><text x="32" y="858" font-size="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Desktop loses one correct case; mobile gains two. Tablet has no evidence.</text><text x="20" y="922" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Small fictional counts; the 100% mobile result uses four cases. No population claim.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
