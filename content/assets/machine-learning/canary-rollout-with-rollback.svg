<svg xmlns="http://www.w3.org/2000/svg" width="720" height="730" viewBox="0 0 720 730" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">A staged canary release rolls back when candidate failures exceed its limit</title><desc id="desc">A fictional ten-percent first window serves ten candidate requests and passes. A twenty-five-percent second window serves twenty-five candidate requests; three fail, exceeding a five-percent serving failure limit. Future requests return to the incumbent. Thirty-five of two hundred requests have already reached the candidate. The combined second-window failure rate is five percent, hiding the candidate twelve-percent failure rate. No rollback lag is assumed.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="730" fill="#fff"/><text x="20" y="42" font-size="30" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Release in stages. Keep a return path.</text><text x="20" y="78" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">A canary serves real user requests; rollback changes future routing.</text><svg x="20" y="125" width="680" height="300" viewBox="0 0 680 300"><title id="flow-title">Real exposure, an evidence gate, and the next routing decision</title><desc id="flow-desc">35 candidate requests have already been served. ROLL BACK. The next candidate share is 0 percent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00855b"/></marker></defs><rect x="0" y="0" width="208" height="140" fill="#f1f2ef"/><text x="12" y="27" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Start with 10%</text><text x="12" y="56" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">10 candidate requests</text><text x="12" y="85" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">90 incumbent requests</text><text x="12" y="114" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Both serve real users</text><path d="M 213 70 H 230" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><rect x="236" y="0" width="208" height="140" fill="#f1f2ef"/><text x="248" y="27" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Window 2 · 25%</text><text x="248" y="56" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">3/25 serving failures</text><text x="248" y="85" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">ROLL BACK</text><text x="248" y="114" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Boundary check complete</text><path d="M 449 70 H 466" stroke="#00855b" stroke-width="2" marker-end="url(#arrow)"/><rect x="472" y="0" width="208" height="140" fill="#f1f2ef"/><text x="484" y="27" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Next requests: 0%</text><text x="484" y="56" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Incumbent serves all</text><text x="484" y="85" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">No added rollback exposure</text><text x="484" y="114" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Prior effects remain</text><rect x="0" y="180" width="680" height="80" fill="#edf5f0"/><text x="12" y="209" font-size="20" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">35 candidate requests already served</text><text x="12" y="239" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">200 total requests · 3 candidate serving failures</text></svg><rect x="20" y="470" width="680" height="155" fill="#f1f2ef"/><text x="32" y="498" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Separate the release metrics</text><text x="32" y="531" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Window 2: combined 5/100 = 5%</text><text x="32" y="564" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Candidate alone: 3/25 = 12%</text><text x="32" y="597" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">The candidate breaches its 5% failure limit.</text><text x="20" y="671" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Thirty-five candidate requests have already been served; recovery cannot undo them.</text><text x="20" y="710" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional replay · complete labels · warm incumbent · no in-flight work or rollback lag.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
