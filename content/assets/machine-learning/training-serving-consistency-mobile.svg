<svg xmlns="http://www.w3.org/2000/svg" width="360" height="810" viewBox="0 0 360 810" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Training-Serving Consistency: preserve the transform and its state</title><desc id="desc">For the same 20 km express request, saved transform T1 with mean 10 km and scale 10 km gives features [1, 0, 1, 0] and model p 0.731. Refitting numeric statistics on live distances 20 and 40 km changes the mean to 30 km, giving features [-1, 0, 1, 0] and p 0.269 under the same fixed model. Inputs and model weights are fictional; numeric statistics and all outputs are computed.</desc><rect width="360" height="810" fill="#fff"/><g transform="translate(16,20)"><rect width="328" height="770" fill="#fff"/><g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="400"><text x="0" y="24" font-size="19" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same request, same model</text><text x="0" y="53" font-size="17" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">20 km · express</text><text x="0" y="80" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Change preprocessing; observe feature parity</text><line x1="0" y1="100" x2="328" y2="100" stroke="#a6aca3"/><text x="0" y="135" font-size="18" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Saved training path · T1</text><text x="0" y="164" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Mean 10.0 km · scale 10.0 km</text><text x="0" y="189" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Slots: standard, express</text><line x1="14" y1="203" x2="14" y2="225" stroke="#a6aca3"/><text x="26" y="222" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Apply transform</text><text x="0" y="256" font-size="18" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">[1.0, 0.0, 1.0, 0.0]</text><text x="0" y="283" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">[z, slot 0, slot 1, unknown]</text><line x1="14" y1="296" x2="14" y2="318" stroke="#a6aca3"/><text x="26" y="316" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same fixed model M1</text><text x="0" y="354" font-size="17" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Score 1.000 · p 0.731</text><text x="0" y="384" font-size="15" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Flag at threshold 0.5</text><line x1="0" y1="410" x2="328" y2="410" stroke="#a6aca3"/><text x="0" y="447" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Live-batch refit</text><text x="0" y="476" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Mean 30.0 km · scale 10.0 km</text><text x="0" y="501" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Slots: standard, express</text><line x1="14" y1="515" x2="14" y2="537" stroke="#a6aca3"/><text x="26" y="534" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Apply transform</text><text x="0" y="568" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">[-1.0, 0.0, 1.0, 0.0]</text><text x="0" y="595" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">[z, slot 0, slot 1, unknown]</text><line x1="14" y1="608" x2="14" y2="630" stroke="#a6aca3"/><text x="26" y="628" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same fixed model M1</text><text x="0" y="666" font-size="17" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Score -1.000 · p 0.269</text><text x="0" y="696" font-size="15" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">No flag at threshold 0.5</text><text x="0" y="749" font-size="15" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Feature parity: mismatch on this request</text></g></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
