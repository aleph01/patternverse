<svg xmlns="http://www.w3.org/2000/svg" width="720" height="810" viewBox="0 0 720 810" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">A shadow observes live requests without gaining serving authority</title><desc id="desc">Twelve fictional requests receive incumbent responses. Copies reach two separate shadow workers with a one-hundred-fifty-millisecond deadline. Ten shadow results arrive on time; two miss the deadline. Eight timely pairs have labels, with two incumbent errors and one candidate error. Five of ten timely predictions disagree. Shadow outputs go only to offline comparison, never to users. The simulation assumes complete incumbent isolation and does not cancel work after deadlines.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="720" height="810" fill="#fff"/><text x="20" y="42" font-size="29" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Observe the candidate. Keep serving separate.</text><text x="20" y="76" font-size="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Twelve copied requests · two isolated shadow workers · 150-ms deadline.</text><svg x="20" y="120" width="680" height="365" viewBox="0 0 680 365"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#00855b"/></marker></defs><text x="0" y="25" font-size="18" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">The incumbent stays in control.</text><rect x="0" y="52" width="158" height="70" fill="#f1f2ef"/><text x="10" y="80" font-size="15" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">12 live requests</text><text x="10" y="105" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same request IDs</text><path d="M158 86H237" stroke="#00855b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="240" y="52" width="188" height="70" fill="#edf5f0"/><text x="250" y="80" font-size="16" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Incumbent model</text><text x="250" y="105" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">12 responses · max 25 ms</text><path d="M428 86H497" stroke="#00855b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="500" y="52" width="180" height="70" fill="#edf5f0"/><text x="510" y="80" font-size="16" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">User responses</text><text x="510" y="105" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Incumbent only</text><path d="M199 86V227H237" stroke="#00855b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="0" y="217" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Copy branch</text><rect x="240" y="181" width="188" height="99" fill="#f1f2ef"/><text x="250" y="207" font-size="16" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Shadow · 2 workers</text><text x="250" y="234" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">12 mirrored · 10 on time</text><text x="250" y="259" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2 deadline misses</text><path d="M428 227H497" stroke="#00855b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="500" y="181" width="180" height="99" fill="#f1f2ef"/><text x="510" y="207" font-size="16" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Offline comparison</text><text x="510" y="234" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">8 labeled pairs</text><text x="510" y="259" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0 shadow user responses</text><text x="0" y="321" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Deadline 150 ms · 970 shadow worker-ms, including late work.</text><text x="0" y="351" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Complete isolation is assumed. Timeouts do not cancel queued or running shadow work.</text></svg><rect x="20" y="530" width="680" height="175" fill="#f1f2ef"/><text x="32" y="558" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Paired evidence, with missingness</text><text x="32" y="590" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">10/12 shadow results on time</text><text x="32" y="621" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">8 labeled pairs · live errors 2</text><text x="32" y="652" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Shadow errors 1 · 5/10 disagree</text><text x="32" y="681" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2 deadline misses remain visible.</text><text x="20" y="748" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional replay. Deadline misses can change which requests enter the comparison.</text><text x="20" y="785" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Complete isolation is assumed; shadow outputs never control user responses.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
