<svg xmlns="http://www.w3.org/2000/svg" width="360" height="700" viewBox="0 0 360 700" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Multilabel: several label decisions for one input</title><desc id="desc">Ticket C has Billing score 0.70, Access score 0.20 and Delivery score 0.60. Separate threshold comparisons at 0.50 include Billing and Delivery, giving prediction one, zero, one. The fully reviewed target matches that set. Scores are fictional inputs; no model is trained.</desc><rect width="360" height="700" fill="#fff"/><g transform="translate(16,20)"><rect width="328" height="660" fill="#fff"/><text x="0" y="24" font-size="20" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Ticket C · separate label decisions</text><text x="0" y="52" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Gray line = each label’s threshold.</text><text x="0" y="114" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Billing</text><rect x="0" y="128" width="230" height="30" fill="#f1f2ef" stroke="#a6aca3"/><rect x="0" y="128" width="161" height="30" fill="#00855b"/><path d="M115 121 L115 165" fill="none" stroke="#252c28"/><text x="245" y="151" font-size="20" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.70</text><text x="0" y="188" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Include · threshold 0.50</text><text x="0" y="230" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Access</text><rect x="0" y="244" width="230" height="30" fill="#f1f2ef" stroke="#a6aca3"/><rect x="0" y="244" width="46" height="30" fill="#b7c8ba"/><path d="M115 237 L115 281" fill="none" stroke="#252c28"/><text x="245" y="267" font-size="20" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.20</text><text x="0" y="304" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Omit · threshold 0.50</text><text x="0" y="346" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Delivery</text><rect x="0" y="360" width="230" height="30" fill="#f1f2ef" stroke="#a6aca3"/><rect x="0" y="360" width="138" height="30" fill="#00855b"/><path d="M115 353 L115 397" fill="none" stroke="#252c28"/><text x="245" y="383" font-size="20" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0.60</text><text x="0" y="420" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Include · threshold 0.50</text><text x="0" y="485" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Selected labels</text><text x="0" y="515" font-size="20" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Billing + Delivery</text><text x="0" y="549" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Prediction [1, 0, 1]</text><text x="0" y="579" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Reviewed [1, 0, 1]</text><text x="0" y="636" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Supplied scores · no model is trained.</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
