<svg xmlns="http://www.w3.org/2000/svg" width="360" height="840" viewBox="0 0 360 840" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">Model Versioning: restore the complete release</title><desc id="desc">For the same 30 kilometre input, complete R1 uses transform T1, weights W1 and policy P1 to predict 30 minutes and trigger review. Restoring W1 alone into R2 keeps T2 and P2, predicting 25 minutes without review. Both paths execute deterministic fictional formulas.</desc><rect width="360" height="840" fill="#fff"/><g transform="translate(16,20)"><rect width="328" height="800" fill="#fff"/><text x="0" y="24" font-size="18" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same request · 30 km</text><text x="26" y="64" font-size="16" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Complete R1</text><path d="M8 107 L8 153" fill="none" stroke="#a6aca3"/><circle cx="8" cy="98" r="3" fill="#00855b"/><text x="26" y="102" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Transform T1</text><text x="26" y="124" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">z = (30 − 10) / 10 = 2</text><path d="M8 165 L8 211" fill="none" stroke="#a6aca3"/><circle cx="8" cy="156" r="3" fill="#00855b"/><text x="26" y="160" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weights W1</text><text x="26" y="182" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">20 + 5 × 2 = 30 min</text><path d="M8 223 L8 269" fill="none" stroke="#a6aca3"/><circle cx="8" cy="214" r="3" fill="#00855b"/><text x="26" y="218" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Review rule P1</text><text x="26" y="240" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Review when estimate ≥ 30 min</text><text x="26" y="280" font-size="22" fill="#00855b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">30 min · Review</text><rect x="26" y="300" width="272" height="12" fill="#f1f2ef"/><rect x="26" y="300" width="204" height="12" fill="#00855b"/><text x="26" y="335" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><text x="260" y="335" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">40 min</text><text x="0" y="418" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Same request reused · 30 km</text><text x="26" y="456" font-size="16" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Assembled · mixed components</text><path d="M8 499 L8 545" fill="none" stroke="#a6aca3"/><circle cx="8" cy="490" r="3" fill="#626962"/><text x="26" y="494" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Transform T2</text><text x="26" y="516" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">z = (30 − 20) / 10 = 1</text><path d="M8 557 L8 603" fill="none" stroke="#a6aca3"/><circle cx="8" cy="548" r="3" fill="#626962"/><text x="26" y="552" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Weights W1</text><text x="26" y="574" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">20 + 5 × 1 = 25 min</text><path d="M8 615 L8 661" fill="none" stroke="#a6aca3"/><circle cx="8" cy="606" r="3" fill="#626962"/><text x="26" y="610" font-size="16" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Review rule P2</text><text x="26" y="632" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Review when estimate ≥ 32 min</text><text x="26" y="672" font-size="22" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">25 min · No review</text><rect x="26" y="692" width="272" height="12" fill="#f1f2ef"/><rect x="26" y="692" width="170" height="12" fill="#626962"/><text x="26" y="727" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">0</text><text x="260" y="727" font-size="14" fill="#626962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">40 min</text></g><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
