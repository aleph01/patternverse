<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1070" viewBox="0 0 360 1070" role="img" aria-labelledby="title desc" data-ml-style="light-editorial"><title id="title">A shadow observes live requests without gaining serving authority</title><desc id="desc">Twelve fictional requests receive incumbent responses. Copies reach two separate shadow workers with a one-hundred-fifty-millisecond deadline. Ten shadow results arrive on time; two miss the deadline. Eight timely pairs have labels, with two incumbent errors and one candidate error. Five of ten timely predictions disagree. Shadow outputs go only to offline comparison, never to users. The simulation assumes complete incumbent isolation and does not cancel work after deadlines.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#252c28}</style><rect width="360" height="1070" fill="#fff"/><text x="16" y="34" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Observe the candidate.</text><text x="16" y="67" font-size="26" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Keep serving separate.</text><text x="16" y="98" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Twelve copied requests · 150-ms deadline.</text><svg x="16" y="120" width="328" height="620" viewBox="0 0 328 620"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#00855b"/></marker></defs><text x="0" y="25" font-size="18" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">The incumbent stays in control.</text><rect x="12" y="44" width="292" height="58" fill="#f1f2ef"/><text x="24" y="69" font-size="16" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">12 incoming requests</text><text x="24" y="91" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Copies carry the same request IDs.</text><path d="M158 102V132" stroke="#00855b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="12" y="134" width="292" height="72" fill="#edf5f0"/><text x="24" y="160" font-size="16" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Incumbent model</text><text x="24" y="186" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">12 responses · max 25 ms</text><path d="M158 206V236" stroke="#00855b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="12" y="238" width="292" height="62" fill="#edf5f0"/><text x="24" y="264" font-size="16" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Responses reach users</text><text x="24" y="287" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">12 incumbent · 0 shadow</text><path d="M304 73H316V391H304" stroke="#00855b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="12" y="334" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Copy branch · isolated from responses</text><rect x="12" y="348" width="292" height="90" fill="#f1f2ef"/><text x="24" y="374" font-size="16" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Shadow · 2 workers</text><text x="24" y="400" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">12 mirrored · 10 on time</text><text x="24" y="422" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2 deadline misses · 970 worker-ms</text><path d="M158 438V468" stroke="#00855b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="12" y="470" width="292" height="92" fill="#f1f2ef"/><text x="24" y="496" font-size="16" fill="#252c28" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Offline comparison only</text><text x="24" y="522" font-size="14" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">8 timely labeled pairs</text><text x="24" y="545" font-size="13" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Shadow outputs never control a user response.</text><text x="0" y="600" font-size="12" fill="#252c28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Isolation and non-cancellation are assumptions here.</text></svg><rect x="16" y="775" width="328" height="175" fill="#f1f2ef"/><text x="28" y="803" font-size="17" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Paired evidence, with missingness</text><text x="28" y="835" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">10/12 shadow results on time</text><text x="28" y="866" font-size="15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">8 labeled pairs · live errors 2</text><text x="28" y="897" font-size="15" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">Shadow errors 1 · 5/10 disagree</text><text x="28" y="926" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">2 deadline misses remain visible.</text><text x="16" y="996" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Fictional replay; isolation is assumed.</text><text x="16" y="1030" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400">Shadow results cannot establish business lift.</text><style>:root{color-scheme:only light;--ink:#252c28;--muted:#626962;--paper:#fff;--panel:#f1f2ef;--line:#a6aca3;--band:#edf5f0;--accent:#00855b;--shared:#edf5f0;--shared-line:#00855b}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif!important;font-weight:400!important;letter-spacing:0}path,rect,circle,ellipse,line,polyline,polygon{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style></svg>
