<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Marketplace: turn fragmented supply and demand into completed trades</title><desc id="desc">Independent sellers bring offers and buyers bring demand. A shared marketplace helps them discover relevant offers, agree terms and pay, and fulfil and resolve the trade. The marketplace earns fees for enabling the exchange. Hypothetical transaction: a buyer pays one hundred dollars, the marketplace retains a ten dollar transaction fee, and ninety dollars is payable to the seller before other deductions. Taxes, shipping, returns, payment fees, and additional charges are omitted. The marketplace fee is revenue before its costs, not profit.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">MARKETPLACE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183343">Make it easier for buyers and sellers to trade.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">A transaction-focused form of the Multi-Sided Platform pattern.</text><rect x="64" y="290" width="430" height="220" rx="22" fill="#FFFFFF"/><text x="89" y="318" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">SELLERS</text><text x="89" y="378" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Bring goods or services</text><text x="89" y="452" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Want suitable buyers</text><rect x="1106" y="290" width="430" height="220" rx="22" fill="#FFFFFF"/><text x="1131" y="318" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">BUYERS</text><text x="1131" y="378" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Bring demand</text><text x="1131" y="452" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Want suitable offers</text><rect x="585" y="267" width="430" height="266" rx="22" fill="#176E69"/><text x="613" y="296" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">MARKETPLACE</text><text x="613" y="358" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#FFFFFF">Discover and compare</text><text x="613" y="415" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#FFFFFF">Agree terms and pay</text><text x="613" y="477" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#FFFFFF">Fulfil and resolve</text><line x1="502" y1="400" x2="574" y2="400" stroke="#176E69" stroke-width="5"/><polygon points="574,400 559,391 559,409" fill="#176E69"/><line x1="574" y1="400" x2="502" y2="400" stroke="#176E69" stroke-width="5"/><polygon points="502,400 517,391 517,409" fill="#176E69"/><line x1="1026" y1="400" x2="1095" y2="400" stroke="#176E69" stroke-width="5"/><polygon points="1095,400 1080,391 1080,409" fill="#176E69"/><line x1="1095" y1="400" x2="1026" y2="400" stroke="#176E69" stroke-width="5"/><polygon points="1026,400 1041,391 1041,409" fill="#176E69"/><rect x="64" y="587" width="1472" height="114" rx="22" fill="#DCEDE8"/><text x="93" y="611" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#176E69">The shared venue improves the route from an offer to a completed trade.</text><text x="93" y="660" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Some marketplaces provide discovery; others also coordinate payment and fulfilment.</text><rect x="64" y="748" width="468" height="205" rx="22" fill="#FFFFFF"/><text x="87" y="773" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">BUYER PAYS</text><text x="87" y="822" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">$100</text><text x="87" y="902" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Illustrative transaction value</text><rect x="566" y="748" width="468" height="205" rx="22" fill="#FFFFFF"/><text x="589" y="773" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">MARKETPLACE RETAINS</text><text x="589" y="822" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">$10</text><text x="589" y="902" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">10% fee, before its costs</text><rect x="1068" y="748" width="468" height="205" rx="22" fill="#FFFFFF"/><text x="1091" y="773" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">SELLER RECEIVES</text><text x="1091" y="822" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">$90</text><text x="1091" y="902" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Before other deductions</text><text x="64" y="1008" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">$100 transaction value ≠ $100 in marketplace fee revenue.</text><text x="64" y="1060" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Hypothetical figures, not company rates. Taxes, shipping, returns, and other fees omitted.</text><text x="64" y="1101" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Operating the marketplace does not require buying every item offered by its sellers.</text></svg>