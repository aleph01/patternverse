<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Deposit-Return System: give the return a clear financial value</title><desc id="desc">At issue, a customer pays the product or service price plus a refundable deposit. After use, an eligible item is returned and validated, and the returner receives the agreed refund. Recovered items can be prepared for reuse, remanufactured, or recycled. The deposit is an incentive to return the item, separate from the price or service fee.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">DEPOSIT-RETURN SYSTEM</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Give the return a clear financial value.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Pay a deposit at issue. Recover it when an eligible item comes back.</text><rect x="64" y="300" width="440" height="310" rx="22" fill="#FFFFFF"/><text x="88" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">1 / ISSUE</text><text x="88" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Separate the deposit</text><text x="88" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Pay the product or service</text><text x="88" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">price plus a refundable</text><text x="88" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">deposit for the eligible item.</text><rect x="580" y="300" width="440" height="310" rx="22" fill="#DCEDE8"/><text x="604" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">2 / USE</text><text x="604" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Keep it returnable</text><text x="604" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Use the product; keep the</text><text x="604" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">item identifiable and within</text><text x="604" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">the return conditions.</text><rect x="1096" y="300" width="440" height="310" rx="22" fill="#FFFFFF"/><text x="1120" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">3 / RETURN</text><text x="1120" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Validate and refund</text><text x="1120" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Return the eligible item.</text><text x="1120" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Check it and pay back</text><text x="1120" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">the agreed deposit amount.</text><line x1="521" y1="452" x2="563" y2="452" stroke="#176E69" stroke-width="5"/><polygon points="563,452 548,443 548,461" fill="#176E69"/><line x1="1037" y1="452" x2="1079" y2="452" stroke="#176E69" stroke-width="5"/><polygon points="1079,452 1064,443 1064,461" fill="#176E69"/><polyline points="1316,630 1316,710 284,710 284,630" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="284,630 275.0,646.0 293.0,646.0" fill="#176E69"/><text x="402" y="746" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">The refundable payment goes back to the returner.</text><rect x="64" y="839" width="724" height="191" rx="22" fill="#DCEDE8"/><text x="89" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">REUSE OR REMANUFACTURE</text><text x="89" y="924" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Prepare the recovered item</text><text x="89" y="970" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">for another period of service.</text><rect x="812" y="839" width="724" height="191" rx="22" fill="#DCEDE8"/><text x="837" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">RECYCLE</text><text x="837" y="924" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Recover the materials for</text><text x="837" y="970" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">a new manufacturing cycle.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">The deposit encourages recovery. The recovery route determines what happens next.</text></svg>