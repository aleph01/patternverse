<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Licensing: earn from defined rights to use</title><desc id="desc">The licensor retains ownership of intellectual property and grants a licensee defined rights to use it. The licensee applies those rights in a product, service, or operation and pays agreed fees or royalties in return. The agreement defines permitted uses, territory, duration, exclusivity, and other conditions. Illustration of a commercial license, not a transfer of IP ownership.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">LICENSING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="51" font-weight="700" fill="#183343">Earn from defined rights to use.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Let another business apply your intellectual property under agreed terms.</text><rect x="64" y="290" width="596" height="390" rx="22" fill="#DCEDE8"/><text x="96" y="325" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">LICENSOR</text><text x="96" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#183343">Owns the IP</text><text x="96" y="469" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#52646D">Technology, a brand,</text><text x="96" y="515" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#52646D">or creative work</text><text x="96" y="607" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176E69">Retains IP ownership</text><rect x="940" y="290" width="596" height="390" rx="22" fill="#FFFFFF"/><text x="972" y="325" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">LICENSEE</text><text x="972" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#183343">Uses agreed rights</text><text x="972" y="469" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#52646D">Applies the IP in a product,</text><text x="972" y="515" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#52646D">service, or operation</text><text x="972" y="607" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176E69">Commercializes the offering</text><text x="700" y="376" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#176E69">Rights to use</text><line x1="682" y1="432" x2="918" y2="432" stroke="#176E69" stroke-width="5"/><polygon points="918,432 903,423 903,441" fill="#176E69"/><text x="688" y="521" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#176E69">Fees / royalties</text><line x1="918" y1="577" x2="682" y2="577" stroke="#176E69" stroke-width="5"/><polygon points="682,577 697,568 697,586" fill="#176E69"/><rect x="64" y="739" width="1472" height="265" rx="22" fill="#FFFFFF"/><text x="94" y="770" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">THE AGREEMENT DEFINES THE BOUNDARIES</text><text x="94" y="832" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">What and how</text><text x="94" y="891" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Permitted activities,</text><text x="94" y="934" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">products, and conditions</text><text x="582" y="832" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Where and when</text><text x="582" y="891" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Territory and duration</text><text x="582" y="934" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">of the granted rights</text><text x="1070" y="832" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Who else</text><text x="1070" y="891" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Exclusive or</text><text x="1070" y="934" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">non-exclusive scope</text><text x="64" y="1062" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Payment can be fixed, usage-based, sales-based, or a combination.</text><text x="64" y="1110" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Illustrative commercial license. Rights and responsibilities depend on the agreement.</text></svg>