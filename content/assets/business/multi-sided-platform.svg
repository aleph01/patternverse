<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Multi-Sided Platform: coordinate value across distinct participant groups</title><desc id="desc">Illustrative three-sided delivery platform. Customers want goods delivered, merchants offer goods, and couriers provide delivery. Each group connects to a shared platform that coordinates discovery, matching, payment, rules, trust, and support. Lines represent coordination, not physical delivery routes or money flows. A two-sided platform also qualifies; more sides are not automatically better.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">MULTI-SIDED PLATFORM</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Create value by connecting different sides.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Illustrative delivery platform: three distinct roles, one coordinated exchange.</text><rect x="64" y="315" width="430" height="238" rx="22" fill="#FFFFFF"/><text x="89" y="344" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">CUSTOMERS</text><text x="89" y="406" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Want goods delivered</text><text x="89" y="479" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Gain choice and convenience</text><rect x="1106" y="315" width="430" height="238" rx="22" fill="#FFFFFF"/><text x="1131" y="344" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">MERCHANTS</text><text x="1131" y="406" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Offer goods</text><text x="1131" y="479" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Gain access to orders</text><rect x="585" y="292" width="430" height="292" rx="22" fill="#176E69"/><text x="613" y="320" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">PLATFORM</text><text x="613" y="382" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#FFFFFF">Discover and match</text><text x="613" y="440" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#FFFFFF">Coordinate payment</text><text x="613" y="504" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#FFFFFF">Rules, trust, and support</text><line x1="503" y1="437" x2="574" y2="437" stroke="#176E69" stroke-width="5"/><polygon points="574,437 559,428 559,446" fill="#176E69"/><line x1="574" y1="437" x2="503" y2="437" stroke="#176E69" stroke-width="5"/><polygon points="503,437 518,428 518,446" fill="#176E69"/><line x1="1026" y1="437" x2="1095" y2="437" stroke="#176E69" stroke-width="5"/><polygon points="1095,437 1080,428 1080,446" fill="#176E69"/><line x1="1095" y1="437" x2="1026" y2="437" stroke="#176E69" stroke-width="5"/><polygon points="1026,437 1041,428 1041,446" fill="#176E69"/><rect x="585" y="711" width="430" height="198" rx="22" fill="#DCEDE8"/><text x="613" y="738" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">COURIERS</text><text x="613" y="790" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Provide delivery</text><text x="613" y="851" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Gain earning opportunities</text><path d="M800 598 V697" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="800,598 791,613 809,613" fill="#176E69"/><polygon points="800,697 791,682 809,682" fill="#176E69"/><text x="64" y="961" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">Every side needs a reason to join—and a reason to return.</text><text x="64" y="1026" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">More participants help when they improve relevant choices and successful interactions.</text><text x="64" y="1085" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Lines show coordination, not goods or money flows. Two-sided platforms also qualify.</text></svg>