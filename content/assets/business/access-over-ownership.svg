<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Access over Ownership: pay for the right to use</title><desc id="desc">A conceptual comparison for physical equipment. Ownership means buying and retaining an asset, arranging its maintenance and storage, and retaining eventual resale value. Access provides defined rights to use an asset under agreed terms; maintenance may be included and the asset normally returns at the end. Access can be exclusive or shared, with billing per use, per period, or a combination. Specific responsibilities and rights depend on the contract.</desc><rect width="1600" height="1100" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">ACCESS OVER OWNERSHIP</text><text x="64" y="102" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="50" font-weight="700" fill="#183343">Pay for the right to use.</text><text x="64" y="181" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A conceptual comparison for physical equipment.</text><rect x="64" y="254" width="720" height="573" rx="22" fill="#FFFFFF"/><text x="94" y="285" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#183343">Ownership</text><text x="94" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">The customer retains the asset.</text><text x="94" y="415" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#52646D">GET</text><text x="94" y="448" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Buy a specific asset</text><text x="94" y="512" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#52646D">USE</text><text x="94" y="545" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Plan around your own equipment</text><text x="94" y="609" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#52646D">MANAGE</text><text x="94" y="642" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Arrange care and storage</text><text x="94" y="706" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#52646D">AFTER USE</text><text x="94" y="739" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Keep, sell, or dispose of it</text><rect x="816" y="254" width="720" height="573" rx="22" fill="#FFFFFF"/><text x="846" y="285" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#183343">Access</text><text x="846" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">The customer receives usage rights.</text><text x="846" y="415" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#52646D">GET</text><text x="846" y="448" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Use an asset for an agreed period</text><text x="846" y="512" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#52646D">USE</text><text x="846" y="545" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Follow booking or usage terms</text><text x="846" y="609" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#52646D">MANAGE</text><text x="846" y="642" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Care may be included in the service</text><text x="846" y="706" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#52646D">AFTER USE</text><text x="846" y="739" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Normally return it at the end</text><rect x="64" y="872" width="1472" height="119" rx="22" fill="#DCEDE8"/><text x="94" y="899" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#176E69">Access can be exclusive or shared.</text><text x="94" y="951" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Billing can be per use, per period, or a combination.</text><text x="64" y="1040" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Specific rights, maintenance duties, availability, and return terms depend on the agreement.</text></svg>