<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Vertical Integration: bring connected stages into one business</title><desc id="desc">Illustrative selective integration. A value chain runs from inputs through components, assembly, distribution, and sales and service. Components, assembly, and distribution are shaded inside one business boundary, while input suppliers and downstream sales and service remain outside. Backward integration brings earlier stages inside; forward integration brings later stages inside. The example illustrates organizational scope rather than a recommended integration level.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">VERTICAL INTEGRATION / INTEGRATOR</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Bring connected stages into one business.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Illustrative selective integration: operate several value-chain stages under common control.</text><rect x="350" y="295" width="900" height="349" rx="22" fill="#DCEDE8"/><text x="374" y="322" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">ONE BUSINESS OWNS AND OPERATES THESE STAGES</text><rect x="64" y="410" width="232" height="200" rx="22" fill="#FFFFFF"/><text x="82" y="450" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Inputs</text><text x="82" y="561" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#52646D">External suppliers</text><rect x="374" y="410" width="232" height="200" rx="22" fill="#176E69"/><text x="392" y="450" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#FFFFFF">Components</text><text x="392" y="561" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">Internal operation</text><rect x="684" y="410" width="232" height="200" rx="22" fill="#176E69"/><text x="702" y="450" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#FFFFFF">Assembly</text><text x="702" y="561" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">Internal operation</text><rect x="994" y="410" width="232" height="200" rx="22" fill="#176E69"/><text x="1012" y="450" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#FFFFFF">Distribution</text><text x="1012" y="561" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">Internal operation</text><rect x="1304" y="410" width="232" height="200" rx="22" fill="#FFFFFF"/><text x="1322" y="450" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Sales</text><text x="1322" y="493" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">and service</text><text x="1322" y="561" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#52646D">External channel</text><line x1="309" y1="510" x2="361" y2="510" stroke="#176E69" stroke-width="5"/><polygon points="361,510 346,501 346,519" fill="#176E69"/><line x1="619" y1="510" x2="671" y2="510" stroke="#176E69" stroke-width="5"/><polygon points="671,510 656,501 656,519" fill="#176E69"/><line x1="929" y1="510" x2="981" y2="510" stroke="#176E69" stroke-width="5"/><polygon points="981,510 966,501 966,519" fill="#176E69"/><line x1="1239" y1="510" x2="1291" y2="510" stroke="#176E69" stroke-width="5"/><polygon points="1291,510 1276,501 1276,519" fill="#176E69"/><text x="64" y="688" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">TWO DIRECTIONS OF EXPANSION</text><rect x="64" y="743" width="724" height="193" rx="22" fill="#FFFFFF"/><text x="91" y="773" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">BACKWARD INTEGRATION</text><text x="91" y="829" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Bring earlier stages inside</text><text x="91" y="890" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Inputs, components, or production</text><rect x="812" y="743" width="724" height="193" rx="22" fill="#FFFFFF"/><text x="839" y="773" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">FORWARD INTEGRATION</text><text x="839" y="829" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Bring later stages inside</text><text x="839" y="890" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Distribution, selling, or service</text><rect x="64" y="984" width="1472" height="77" rx="22" fill="#DCEDE8"/><text x="91" y="1008" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">More control brings responsibility for capacity, investment, and execution.</text><text x="64" y="1100" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">The integration boundary varies. External suppliers and partners can remain important.</text></svg>