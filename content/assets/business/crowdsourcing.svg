<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Crowdsourcing: many contributions, a useful result</title><desc id="desc">A distributed group contributes ideas, observations, or knowledge and task results. Contributions pass through selection, verification, and integration into a product, information service, or shared resource. Credit, rewards, and feedback return to contributors. Clear tasks, meaningful reasons to participate, and accountable review support the process. Contribution types are alternatives, and the output is not automatic.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CROWDSOURCING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Many contributions. A useful result.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Invite a distributed group to help create, discover, or improve something.</text><text x="64" y="250" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">POSSIBLE CONTRIBUTIONS</text><rect x="64" y="300" width="430" height="130" rx="22" fill="#FFFFFF"/><text x="88" y="324" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Ideas</text><text x="88" y="380" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Proposals and solutions</text><rect x="64" y="470" width="430" height="130" rx="22" fill="#FFFFFF"/><text x="88" y="494" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Observations</text><text x="88" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Local reports and measurements</text><rect x="64" y="640" width="430" height="130" rx="22" fill="#FFFFFF"/><text x="88" y="664" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Knowledge or tasks</text><text x="88" y="720" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Content, edits, and small jobs</text><polyline points="510,365 552,365 552,535 594,535" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="594,535 578.0,526.0 578.0,544.0" fill="#176E69"/><line x1="510" y1="535" x2="594" y2="535" stroke="#176E69" stroke-width="5"/><polygon points="594,535 579,526 579,544" fill="#176E69"/><polyline points="510,705 552,705 552,535 594,535" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="594,535 578.0,526.0 578.0,544.0" fill="#176E69"/><rect x="610" y="405" width="432" height="260" rx="22" fill="#DCEDE8"/><text x="637" y="435" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">REVIEW AND COORDINATION</text><text x="637" y="493" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Select, verify, integrate</text><text x="637" y="555" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Apply standards and resolve</text><text x="637" y="599" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">duplicates or conflicting input.</text><line x1="1059" y1="535" x2="1117" y2="535" stroke="#176E69" stroke-width="5"/><polygon points="1117,535 1102,526 1102,544" fill="#176E69"/><rect x="1136" y="405" width="400" height="260" rx="22" fill="#FFFFFF"/><text x="1163" y="435" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">USABLE OUTPUT</text><text x="1163" y="493" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Build something useful</text><text x="1163" y="555" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">A product, information</text><text x="1163" y="599" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">service, or shared resource.</text><polyline points="1336,685 1336,815 279,815 279,789" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="279,789 270.0,805.0 288.0,805.0" fill="#176E69"/><text x="637" y="751" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">Credit, rewards, and feedback</text><rect x="64" y="878" width="440" height="163" rx="22" fill="#DCEDE8"/><text x="88" y="900" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">A clear task</text><text x="88" y="954" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Specify the contribution</text><text x="88" y="995" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and how it will be used.</text><rect x="580" y="878" width="440" height="163" rx="22" fill="#DCEDE8"/><text x="604" y="900" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">A reason to join</text><text x="604" y="954" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Offer payment, recognition,</text><text x="604" y="995" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">learning, or shared benefit.</text><rect x="1096" y="878" width="440" height="163" rx="22" fill="#DCEDE8"/><text x="1120" y="900" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Accountable review</text><text x="1120" y="954" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Assign responsibility for</text><text x="1120" y="995" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">quality and integration.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Participation creates possibilities. Review and integration turn them into value.</text></svg>