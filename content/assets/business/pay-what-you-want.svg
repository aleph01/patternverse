<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc"><title id="title">Pay What You Want: different payments for the same offer</title><desc id="desc">A hypothetical example with one hundred customers receiving the same digital product. Forty choose to pay zero dollars, forty pay five dollars, and twenty pay fifteen dollars. Total revenue is five hundred dollars, or five dollars per customer including zero payments. With one dollar delivery cost per customer, four hundred dollars remain before fixed costs, fees, and taxes. This is an illustrative calculation, not an observed payment distribution or forecast.</desc><rect width="1600" height="1160" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">PAY WHAT YOU WANT</text><text x="64" y="102" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183343">Same offer. Different voluntary payments.</text><text x="64" y="181" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">One hypothetical digital product, received by all 100 customers.</text><rect x="64" y="259" width="464" height="273" rx="22" fill="#FFFFFF"/><text x="91" y="288" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">40 customers</text><text x="91" y="352" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#176E69">$0 each</text><text x="91" y="441" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">$0 revenue</text><rect x="568" y="259" width="464" height="273" rx="22" fill="#FFFFFF"/><text x="595" y="288" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">40 customers</text><text x="595" y="352" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#176E69">$5 each</text><text x="595" y="441" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">$200 revenue</text><rect x="1072" y="259" width="464" height="273" rx="22" fill="#FFFFFF"/><text x="1099" y="288" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">20 customers</text><text x="1099" y="352" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#176E69">$15 each</text><text x="1099" y="441" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">$300 revenue</text><text x="64" y="573" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#183343">$0 + $200 + $300 = $500 total revenue</text><rect x="64" y="650" width="1472" height="139" rx="22" fill="#DCEDE8"/><text x="94" y="678" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#176E69">$500 ÷ 100 customers = $5 average payment</text><text x="94" y="739" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Include zero payments when assessing the model.</text><rect x="64" y="829" width="1472" height="172" rx="22" fill="#176E69"/><text x="94" y="855" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">If delivery costs $1 per customer:</text><text x="94" y="906" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#FFFFFF">$500 revenue − $100 delivery cost = $400</text><text x="94" y="963" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">Remaining before fixed costs, fees, and taxes.</text><text x="64" y="1040" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">The payment mix must support the cost of serving everyone.</text><text x="64" y="1092" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Illustrative numbers, not company data, an expected distribution, or a forecast.</text></svg>