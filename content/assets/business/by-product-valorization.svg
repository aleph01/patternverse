<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">By-product Valorization: create a second offering from the same process</title><desc id="desc">A primary production process produces a main product for its original customers and a secondary stream. The secondary stream is separated, stabilized, characterized, refined as needed, and qualified for another useful application. It can then supply another market. Commercial success depends on preserving useful properties, meeting customer specifications, and comparing the new route with the stream’s existing net value. A higher selling price alone does not establish higher returns.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">BY-PRODUCT VALORIZATION</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#183343">Create a second offering from the same process.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">A secondary output becomes a useful product or an input for another application.</text><rect x="64" y="345" width="440" height="300" rx="22" fill="#FFFFFF"/><text x="88" y="375" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">PRIMARY PROCESS</text><text x="88" y="435" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Produce the main offer</text><text x="88" y="499" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">The process also creates</text><text x="88" y="544" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">a secondary stream with</text><text x="88" y="589" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">potentially useful properties.</text><rect x="1096" y="300" width="440" height="170" rx="22" fill="#FFFFFF"/><text x="1120" y="326" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">PRIMARY OUTPUT</text><text x="1120" y="376" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Main product</text><text x="1120" y="429" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">For the original customers</text><line x1="521" y1="420" x2="1079" y2="420" stroke="#176E69" stroke-width="5"/><polygon points="1079,420 1064,411 1064,429" fill="#176E69"/><text x="702" y="369" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">Main output</text><polyline points="521,575 548,575 548,675 563,675" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="563,675 547.0,666.0 547.0,684.0" fill="#176E69"/><rect x="580" y="565" width="440" height="220" rx="22" fill="#DCEDE8"/><text x="604" y="590" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">SECONDARY STREAM</text><text x="604" y="642" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Separate and refine</text><text x="604" y="700" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Stabilize, characterize, and</text><text x="604" y="744" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">qualify for a useful application.</text><line x1="1037" y1="675" x2="1079" y2="675" stroke="#176E69" stroke-width="5"/><polygon points="1079,675 1064,666 1064,684" fill="#176E69"/><rect x="1096" y="565" width="440" height="220" rx="22" fill="#FFFFFF"/><text x="1120" y="590" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">ADDITIONAL OFFERING</text><text x="1120" y="642" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Supply another market</text><text x="1120" y="700" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">An ingredient, fertilizer, fuel,</text><text x="1120" y="744" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">or other useful product.</text><rect x="64" y="879" width="440" height="162" rx="22" fill="#DCEDE8"/><text x="88" y="900" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Preserve useful properties</text><text x="88" y="953" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Keep the stream separate</text><text x="88" y="996" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">and stabilize it early.</text><rect x="580" y="879" width="440" height="162" rx="22" fill="#DCEDE8"/><text x="604" y="900" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Meet specifications</text><text x="604" y="953" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Match composition, quality,</text><text x="604" y="996" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">and consistency to the use.</text><rect x="1096" y="879" width="440" height="162" rx="22" fill="#DCEDE8"/><text x="1120" y="900" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Compare net returns</text><text x="1120" y="953" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Account for yield, processing,</text><text x="1120" y="996" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">logistics, and remaining residues.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Compare with the stream’s existing net value, not an assumed value of zero.</text></svg>