<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Productized Service: a defined offer with repeatable delivery</title><desc id="desc">An illustrative website audit package costs 1500 dollars and includes up to ten public pages, usability and technical checks, a prioritized report, and one review call, delivered in five business days after complete inputs. A repeatable workflow qualifies the request and collects inputs, reviews the website and checks quality, then delivers and discusses findings. Extra pages, implementation, or new research are quoted separately. All terms are hypothetical.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PRODUCTIZED SERVICE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Turn repeatable work into a clear offer.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Standardize scope and delivery while allowing bounded customer variation.</text><rect x="64" y="282" width="660" height="511" rx="22" fill="#176E69"/><text x="95" y="315" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">ILLUSTRATIVE SERVICE PACKAGE</text><text x="95" y="368" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">Website audit</text><text x="95" y="445" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#FFFFFF">Up to 10 public pages</text><text x="95" y="494" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#FFFFFF">Usability + technical checks</text><text x="95" y="543" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#FFFFFF">Prioritized written report</text><text x="95" y="592" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#FFFFFF">One review call</text><text x="95" y="668" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">$1,500 per audit</text><text x="95" y="734" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#FFFFFF">5 business days after complete inputs</text><text x="812" y="289" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">REPEATABLE DELIVERY</text><rect x="812" y="346" width="724" height="123" rx="22" fill="#FFFFFF"/><text x="839" y="369" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">1. Qualify + collect inputs</text><text x="839" y="424" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Confirm fit, access, and requirements</text><rect x="812" y="508" width="724" height="123" rx="22" fill="#FFFFFF"/><text x="839" y="531" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">2. Review + check quality</text><text x="839" y="586" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Use a defined method and checklist</text><rect x="812" y="670" width="724" height="123" rx="22" fill="#FFFFFF"/><text x="839" y="693" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">3. Deliver + discuss findings</text><text x="839" y="748" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Report and one scheduled review call</text><line x1="1174" y1="478" x2="1174" y2="499" stroke="#176E69" stroke-width="5"/><polygon points="1174,499 1165,484 1183,484" fill="#176E69"/><line x1="1174" y1="640" x2="1174" y2="661" stroke="#176E69" stroke-width="5"/><polygon points="1174,661 1165,646 1183,646" fill="#176E69"/><rect x="64" y="836" width="1472" height="125" rx="22" fill="#DCEDE8"/><text x="93" y="861" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">OUTSIDE THE PACKAGE</text><text x="93" y="908" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Extra pages, implementation, or new research: quoted separately.</text><text x="64" y="1008" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">A clear scope is backed by a repeatable way to deliver it.</text><text x="64" y="1095" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Illustrative package, price, and timing; not a real company offer.</text></svg>