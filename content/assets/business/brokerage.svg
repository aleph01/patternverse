<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Brokerage and Matchmaking: find the right counterpart</title><desc id="desc">Illustrative brokerage process. A client brings a specific need, criteria, budget, and timing. The broker searches, qualifies possibilities, introduces suitable counterparties, and may help negotiate. The client and selected counterparty decide whether to agree terms. The broker earns fees according to the engagement. A shortlist does not guarantee an agreement.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">BROKERAGE / MATCHMAKING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="51" font-weight="700" fill="#183343">Find the right counterpart.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Illustrative process: turn a broad search into a workable agreement.</text><rect x="64" y="294" width="430" height="279" rx="22" fill="#FFFFFF"/><text x="92" y="326" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">CLIENT</text><text x="92" y="393" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">A specific need</text><text x="92" y="468" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Criteria · budget · timing</text><text x="92" y="520" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Defines what would fit</text><rect x="585" y="266" width="430" height="335" rx="22" fill="#176E69"/><text x="613" y="300" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">BROKER</text><text x="613" y="366" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#FFFFFF">Search and qualify</text><text x="613" y="439" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#FFFFFF">Find relevant options</text><text x="613" y="486" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#FFFFFF">Check mutual interest</text><text x="613" y="544" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#FFFFFF">Introduce · help negotiate</text><rect x="1106" y="294" width="430" height="279" rx="22" fill="#FFFFFF"/><text x="1134" y="326" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">SHORTLIST</text><text x="1134" y="393" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Suitable options</text><text x="1134" y="468" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Willing · able · relevant</text><text x="1134" y="520" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Counterparties to consider</text><line x1="508" y1="434" x2="572" y2="434" stroke="#176E69" stroke-width="5"/><polygon points="572,434 557,425 557,443" fill="#176E69"/><line x1="1028" y1="434" x2="1093" y2="434" stroke="#176E69" stroke-width="5"/><polygon points="1093,434 1078,425 1078,443" fill="#176E69"/><text x="64" y="657" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">THE PARTIES DECIDE</text><rect x="64" y="710" width="1472" height="178" rx="22" fill="#DCEDE8"/><text x="94" y="741" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">Client + selected counterparty</text><line x1="692" y1="765" x2="821" y2="765" stroke="#176E69" stroke-width="5"/><polygon points="821,765 806,756 806,774" fill="#176E69"/><text x="866" y="741" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">Agree terms</text><text x="94" y="826" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">The broker facilitates the agreement; the parties provide the underlying exchange.</text><rect x="64" y="936" width="1472" height="89" rx="22" fill="#FFFFFF"/><text x="94" y="962" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Broker compensation follows the agreed engagement.</text><text x="64" y="1061" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Fees may be fixed, retained, or linked to completion. A shortlist does not guarantee a deal.</text><text x="64" y="1100" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Representation and payment arrangements should be clear to the parties involved.</text></svg>