<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Bounties: reward the verified result</title><desc id="desc">A sponsor defines a target, reward and rules. Independent participants try different approaches. Submissions are validated against the criteria and eligibility rules. Qualifying results receive rewards according to the published award rules. Participation does not guarantee an award; evaluation and adoption still have costs.</desc><rect width="1600" height="1100" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">BOUNTIES</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="53" font-weight="700" fill="#183343">Reward the verified result.</text><text x="64" y="188" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Set the target and the terms; let participants explore different routes.</text><rect x="64" y="266" width="1472" height="123" rx="22" fill="#176E69"/><text x="94" y="291" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#FFFFFF">Sponsor defines the challenge</text><text x="94" y="345" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">Target  +  reward  +  scope  +  acceptance and award rules</text><polyline points="296,402 296,442" fill="none" stroke="#176E69" stroke-width="4"/><path d="M296 452l-10 -14h20z" fill="#176E69"/><polyline points="800,402 800,442" fill="none" stroke="#176E69" stroke-width="4"/><path d="M800 452l-10 -14h20z" fill="#176E69"/><polyline points="1304,402 1304,442" fill="none" stroke="#176E69" stroke-width="4"/><path d="M1304 452l-10 -14h20z" fill="#176E69"/><rect x="64" y="470" width="464" height="117" rx="22" fill="#DCEDE8"/><text x="89" y="493" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">Independent approach A</text><text x="89" y="543" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Participants choose how to try</text><polyline points="296,602 296,636" fill="none" stroke="#176E69" stroke-width="4"/><rect x="568" y="470" width="464" height="117" rx="22" fill="#DCEDE8"/><text x="593" y="493" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">Independent approach B</text><text x="593" y="543" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Participants choose how to try</text><polyline points="800,602 800,636" fill="none" stroke="#176E69" stroke-width="4"/><rect x="1072" y="470" width="464" height="117" rx="22" fill="#DCEDE8"/><text x="1097" y="493" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">Independent approach C</text><text x="1097" y="543" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Participants choose how to try</text><polyline points="1304,602 1304,636" fill="none" stroke="#176E69" stroke-width="4"/><polyline points="296,636 1304,636" fill="none" stroke="#176E69" stroke-width="4"/><polyline points="800,636 800,670" fill="none" stroke="#176E69" stroke-width="4"/><path d="M800 680l-10 -14h20z" fill="#176E69"/><rect x="250" y="698" width="1100" height="117" rx="22" fill="#FFFFFF"/><text x="280" y="719" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Validate the submitted result</text><text x="280" y="770" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Check evidence, eligibility, and the published criteria</text><polyline points="800,829 800,858" fill="none" stroke="#176E69" stroke-width="4"/><path d="M800 868l-10 -14h20z" fill="#176E69"/><rect x="250" y="886" width="1100" height="83" rx="22" fill="#DCEDE8"/><text x="280" y="910" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#176E69">Pay according to the award rules</text><text x="64" y="1007" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Participation does not guarantee an award.</text><text x="64" y="1048" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">The sponsor still funds evaluation, administration, and adoption.</text></svg>