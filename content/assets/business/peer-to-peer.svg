<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Peer-to-Peer: participants supply the offer</title><desc id="desc">Illustrative second-hand sale. One individual offers a bicycle and another buys it. The peers exchange an item and payment, supported by a platform that coordinates discovery, payment, reputation, and support. Arrows represent the economic exchange, not the physical route of money. A participant may be a buyer in one transaction and a seller in another.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PEER-TO-PEER</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Turn participants into providers.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Illustrative second-hand sale: one person’s unused item becomes another person’s purchase.</text><rect x="64" y="299" width="430" height="264" rx="22" fill="#FFFFFF"/><text x="92" y="329" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">PEER A</text><text x="92" y="391" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Offers a bicycle</text><text x="92" y="465" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Supplies the item</text><text x="92" y="511" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Receives the sale proceeds</text><rect x="1106" y="299" width="430" height="264" rx="22" fill="#FFFFFF"/><text x="1134" y="329" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">PEER B</text><text x="1134" y="391" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Buys the bicycle</text><text x="1134" y="465" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Chooses the offer</text><text x="1134" y="511" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Pays for the item</text><text x="666" y="335" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">Bicycle</text><line x1="515" y1="395" x2="1084" y2="395" stroke="#176E69" stroke-width="5"/><polygon points="1084,395 1069,386 1069,404" fill="#176E69"/><line x1="1084" y1="475" x2="515" y2="475" stroke="#176E69" stroke-width="5"/><polygon points="515,475 530,466 530,484" fill="#176E69"/><text x="654" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">Payment</text><polyline points="279,575 279,769 496,769" fill="none" stroke="#52646D" stroke-width="3"/><polyline points="1321,575 1321,769 1104,769" fill="none" stroke="#52646D" stroke-width="3"/><text x="73" y="652" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Coordination</text><text x="1342" y="652" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Coordination</text><rect x="510" y="655" width="580" height="240" rx="22" fill="#176E69"/><text x="544" y="686" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">PLATFORM</text><text x="544" y="749" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Discovery · payment</text><text x="544" y="800" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Reputation · support</text><text x="544" y="853" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#FFFFFF">Makes the exchange easier to complete</text><rect x="64" y="941" width="1472" height="90" rx="22" fill="#DCEDE8"/><text x="91" y="968" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">A buyer in one transaction can be a seller in another.</text><text x="64" y="1060" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Arrows show the economic exchange. Payments may be processed through the platform.</text><text x="64" y="1101" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Peer-to-peer describes the participants; the platform can still be centrally operated.</text></svg>