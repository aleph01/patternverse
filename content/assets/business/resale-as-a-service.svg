<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Resale as a Service: offer resale through specialist infrastructure</title><desc id="desc">A brand or retailer defines a resale proposition and contracts with a specialist provider. A previous owner trades in, consigns or lists an item; a next owner buys through the branded channel. The specialist enables listings, transactions, payouts and agreed operations. In a managed model the provider or logistics partner handles goods; in a peer-to-peer model the seller supplies the buyer directly. The central arrows represent the resale transaction rather than a mandatory physical shipping route.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">RESALE AS A SERVICE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#183343">Offer resale through specialist infrastructure.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A brand buys the capabilities needed to support a secondhand channel.</text><rect x="64" y="270" width="1472" height="150" rx="22" fill="#DCEDE8"/><text x="88" y="293" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">BRAND / RETAILER</text><text x="88" y="347" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Defines the proposition, policies, and customer experience.</text><polyline points="800,440 800,510" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="800,510 809.0,494.0 791.0,494.0" fill="#176E69"/><text x="840" y="463" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Commercial agreement</text><rect x="64" y="530" width="440" height="270" rx="22" fill="#FFFFFF"/><text x="88" y="553" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PREVIOUS OWNER</text><text x="88" y="605" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Supplies used products</text><text x="88" y="670" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Trade in, consign,</text><text x="88" y="717" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">or list an eligible item.</text><rect x="580" y="530" width="440" height="270" rx="22" fill="#DCEDE8"/><text x="604" y="553" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">RESALE SPECIALIST</text><text x="604" y="605" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Enables the channel</text><text x="604" y="670" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Listings, checkout, payouts;</text><text x="604" y="717" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">agreed operations and support.</text><rect x="1096" y="530" width="440" height="270" rx="22" fill="#FFFFFF"/><text x="1120" y="553" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">NEXT OWNER</text><text x="1120" y="605" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Buys secondhand</text><text x="1120" y="670" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Choose and purchase through</text><text x="1120" y="717" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">the branded resale channel.</text><line x1="521" y1="665" x2="563" y2="665" stroke="#176E69" stroke-width="5"/><polygon points="563,665 548,656 548,674" fill="#176E69"/><line x1="1037" y1="665" x2="1079" y2="665" stroke="#176E69" stroke-width="5"/><polygon points="1079,665 1064,656 1064,674" fill="#176E69"/><rect x="64" y="866" width="724" height="164" rx="22" fill="#FFFFFF"/><text x="88" y="889" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">MANAGED MODEL</text><text x="88" y="936" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Provider or logistics partner handles</text><text x="88" y="981" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">intake, preparation, and fulfillment.</text><rect x="812" y="866" width="724" height="164" rx="22" fill="#FFFFFF"/><text x="836" y="889" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">PEER-TO-PEER MODEL</text><text x="836" y="936" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Seller supplies the buyer directly;</text><text x="836" y="981" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">the service supports the transaction.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">The arrows show the transaction. The physical route depends on the service model.</text></svg>