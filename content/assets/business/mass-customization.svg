<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc"><title id="title">Mass Customization: standardize the system, customize the result</title><desc id="desc">Illustrative modular storage system. A shared platform provides standardized interfaces and production methods. Customers choose among three widths, two interior layouts and three finishes. If every combination is compatible, these options create eighteen configurations. Compatibility rules and repeatable fulfillment support variety without redesigning each order.</desc><rect width="1600" height="1080" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">MASS CUSTOMIZATION</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#183343">Standardize the system. Customize the result.</text><text x="64" y="187" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">An illustrative modular storage system: meaningful choices, repeatable work.</text><rect x="64" y="273" width="1472" height="112" rx="22" fill="#176E69"/><text x="92" y="296" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#FFFFFF">Shared platform</text><text x="92" y="348" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#FFFFFF">Standard interfaces, components, and production methods</text><polyline points="296,399 296,430" fill="none" stroke="#176E69" stroke-width="4"/><path d="M296 440l-10 -14h20z" fill="#176E69"/><polyline points="800,399 800,430" fill="none" stroke="#176E69" stroke-width="4"/><path d="M800 440l-10 -14h20z" fill="#176E69"/><polyline points="1304,399 1304,430" fill="none" stroke="#176E69" stroke-width="4"/><path d="M1304 440l-10 -14h20z" fill="#176E69"/><rect x="64" y="458" width="464" height="230" rx="22" fill="#DCEDE8"/><text x="90" y="483" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#176E69">3 widths</text><rect x="568" y="458" width="464" height="230" rx="22" fill="#DCEDE8"/><text x="594" y="483" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#176E69">2 interior layouts</text><rect x="1072" y="458" width="464" height="230" rx="22" fill="#DCEDE8"/><text x="1098" y="483" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#176E69">3 finishes</text><rect x="113" y="559" width="46" height="96" rx="3" fill="#66878B"/><rect x="223" y="559" width="70" height="96" rx="3" fill="#66878B"/><rect x="357" y="559" width="94" height="96" rx="3" fill="#66878B"/><rect x="659" y="552" width="110" height="105" rx="3" fill="#FFFFFF"/><polyline points="659,552 769,552 769,657 659,657 659,552" fill="none" stroke="#183343" stroke-width="3"/><polyline points="659,586 769,586" fill="none" stroke="#183343" stroke-width="3"/><polyline points="659,620 769,620" fill="none" stroke="#183343" stroke-width="3"/><rect x="842" y="552" width="110" height="105" rx="3" fill="#FFFFFF"/><polyline points="842,552 952,552 952,657 842,657 842,552" fill="none" stroke="#183343" stroke-width="3"/><polyline points="897,552 897,657" fill="none" stroke="#183343" stroke-width="3"/><polyline points="897,587 952,587" fill="none" stroke="#183343" stroke-width="3"/><polyline points="897,621 952,621" fill="none" stroke="#183343" stroke-width="3"/><rect x="1111" y="559" width="93" height="96" rx="10" fill="#FFFFFF"/><rect x="1242" y="559" width="93" height="96" rx="10" fill="#C3A783"/><rect x="1373" y="559" width="93" height="96" rx="10" fill="#456668"/><rect x="64" y="745" width="1472" height="106" rx="16" fill="#FFFFFF"/><text x="92" y="779" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#183343">3 widths × 2 layouts × 3 finishes = 18 configurations</text><rect x="64" y="893" width="1472" height="88" rx="16" fill="#E6E9E9"/><text x="92" y="920" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Compatibility rules + repeatable fulfillment</text><text x="64" y="1030" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Illustrative choices, not company data. Assumes all combinations are compatible.</text></svg>