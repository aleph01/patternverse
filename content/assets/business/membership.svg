<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Membership: a continuing relationship with defined benefits</title><desc id="desc">Joining or meeting eligibility requirements creates recognized member status. Depending on the program, that status can provide access, preferential prices and service, or participation through events, community, and governance. Purchases and extras may still be charged separately. Membership defines status and benefits, while subscription defines recurring payment or entitlement. Not every membership includes every benefit.</desc><rect width="1600" height="1100" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">MEMBERSHIP</text><text x="64" y="102" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183343">A continuing relationship. Defined benefits.</text><text x="64" y="181" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Member status connects a person or organization to an ongoing offer.</text><rect x="64" y="252" width="1472" height="128" rx="22" fill="#DCEDE8"/><text x="94" y="282" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#176E69">Join or qualify → Recognized member status</text><text x="94" y="342" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Eligibility, duration, fees, and obligations follow the program terms.</text><text x="64" y="429" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#52646D">POSSIBLE BENEFITS — DEPENDING ON THE MEMBERSHIP</text><rect x="64" y="479" width="464" height="241" rx="22" fill="#FFFFFF"/><text x="90" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Access</text><text x="90" y="588" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Spaces, services, catalogs,</text><text x="90" y="639" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">or member-only opportunities</text><rect x="568" y="479" width="464" height="241" rx="22" fill="#FFFFFF"/><text x="594" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Preferential terms</text><text x="594" y="588" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Discounts, priority, rewards,</text><text x="594" y="639" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">or additional service</text><rect x="1072" y="479" width="464" height="241" rx="22" fill="#FFFFFF"/><text x="1098" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Participation</text><text x="1098" y="588" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Events, community, or a voice</text><text x="1098" y="639" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">in decisions where included</text><rect x="64" y="767" width="1472" height="130" rx="22" fill="#176E69"/><text x="94" y="797" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">Purchases and extras may still be charged separately.</text><text x="94" y="855" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#FFFFFF">A membership fee does not necessarily include every product or service.</text><text x="64" y="945" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Membership defines status and benefits.</text><text x="64" y="997" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#52646D">Subscription defines recurring payment or entitlement.</text><text x="64" y="1054" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Conceptual model. Membership can be recurring, one-time, or free; benefits vary.</text></svg>