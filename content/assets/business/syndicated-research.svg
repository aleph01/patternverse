<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Syndicated Research: a shared research base licensed to multiple customers</title><desc id="desc">A research provider designs a study or ongoing program, collects and validates evidence, and analyzes the findings. The same underlying research supports licensed access for multiple clients with different decisions, such as market planning, product strategy, and channel decisions. Customer fees support the shared research program. The model depends on shared questions, consistent methods, and non-exclusive access. Client packages and support can differ without commissioning the core research again for each buyer.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">SYNDICATED RESEARCH</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">One research base. Multiple customers.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Spread the cost of a study or research program across buyers with related questions.</text><text x="64" y="310" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">SHARED RESEARCH PROGRAM</text><rect x="64" y="400" width="570" height="280" rx="22" fill="#DCEDE8"/><text x="92" y="430" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">RESEARCH PROVIDER</text><text x="92" y="488" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Design, collect, and analyze</text><text x="92" y="551" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">A common method and evidence base,</text><text x="92" y="597" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">maintained or updated as appropriate.</text><text x="1026" y="250" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">LICENSED ACCESS FOR EACH CLIENT</text><rect x="1026" y="300" width="510" height="130" rx="22" fill="#FFFFFF"/><text x="1052" y="322" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CLIENT A</text><text x="1052" y="372" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Market planning</text><rect x="1026" y="475" width="510" height="130" rx="22" fill="#FFFFFF"/><text x="1052" y="497" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CLIENT B</text><text x="1052" y="547" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Product strategy</text><rect x="1026" y="650" width="510" height="130" rx="22" fill="#FFFFFF"/><text x="1052" y="672" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CLIENT C</text><text x="1052" y="722" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Channel decisions</text><polyline points="651,540 812,540 812,365 1008,365" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1008,365 992.0,356.0 992.0,374.0" fill="#176E69"/><line x1="651" y1="540" x2="1008" y2="540" stroke="#176E69" stroke-width="5"/><polygon points="1008,540 993,531 993,549" fill="#176E69"/><polyline points="651,540 812,540 812,715 1008,715" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1008,715 992.0,706.0 992.0,724.0" fill="#176E69"/><polyline points="1281,800 1281,849 349,849 349,700" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="349,700 340.0,716.0 358.0,716.0" fill="#176E69"/><text x="493" y="791" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#176E69">Customer fees support the shared research program</text><rect x="64" y="898" width="440" height="143" rx="22" fill="#DCEDE8"/><text x="88" y="916" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Shared questions</text><text x="88" y="966" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Several buyers need insight</text><text x="88" y="1004" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">into the same market or topic.</text><rect x="580" y="898" width="440" height="143" rx="22" fill="#DCEDE8"/><text x="604" y="916" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Consistent methods</text><text x="604" y="966" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Use defined measures, scope,</text><text x="604" y="1004" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">sources, and update periods.</text><rect x="1096" y="898" width="440" height="143" rx="22" fill="#DCEDE8"/><text x="1120" y="916" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Non-exclusive access</text><text x="1120" y="966" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Buyers license access; others</text><text x="1120" y="1004" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">can buy the research too.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Client packages and support can differ while the underlying research is reused.</text></svg>