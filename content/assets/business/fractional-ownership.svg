<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc"><title id="title">Fractional Ownership: own a share and define the rights</title><desc id="desc">A hypothetical one-million-dollar asset is owned equally by four owners. Each has a twenty-five percent interest and contributes two hundred fifty thousand dollars toward its purchase. Twenty-four thousand dollars of annual shared expenses are divided equally, six thousand dollars per owner. Usage, decisions, and exit each require explicit rules; the ownership fraction does not automatically define every right. Figures exclude transaction, financing, management, and usage fees.</desc><rect width="1600" height="1150" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">FRACTIONAL OWNERSHIP</text><text x="64" y="102" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Own a share. Define the rights.</text><text x="64" y="181" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A hypothetical $1,000,000 asset, divided into four equal ownership interests.</text><rect x="64" y="259" width="344" height="224" rx="22" fill="#FFFFFF"/><text x="89" y="285" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Owner A</text><text x="89" y="341" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#176E69">25%</text><text x="89" y="418" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">$250,000 purchase</text><rect x="440" y="259" width="344" height="224" rx="22" fill="#FFFFFF"/><text x="465" y="285" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Owner B</text><text x="465" y="341" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#176E69">25%</text><text x="465" y="418" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">$250,000 purchase</text><rect x="816" y="259" width="344" height="224" rx="22" fill="#FFFFFF"/><text x="841" y="285" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Owner C</text><text x="841" y="341" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#176E69">25%</text><text x="841" y="418" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">$250,000 purchase</text><rect x="1192" y="259" width="344" height="224" rx="22" fill="#FFFFFF"/><text x="1217" y="285" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Owner D</text><text x="1217" y="341" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#176E69">25%</text><text x="1217" y="418" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">$250,000 purchase</text><rect x="64" y="529" width="1472" height="141" rx="22" fill="#DCEDE8"/><text x="94" y="558" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#176E69">$24,000 annual shared expenses ÷ 4 = $6,000 each</text><text x="94" y="617" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Ownership brings ongoing obligations as well as a stake in the asset.</text><text x="64" y="715" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#52646D">THREE SETS OF RULES TO AGREE</text><rect x="64" y="768" width="464" height="213" rx="22" fill="#FFFFFF"/><text x="90" y="797" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Use, if included</text><text x="90" y="865" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Who can use the asset,</text><text x="90" y="917" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">when, and on what terms?</text><rect x="568" y="768" width="464" height="213" rx="22" fill="#FFFFFF"/><text x="594" y="797" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Decisions</text><text x="594" y="865" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Who votes, who manages,</text><text x="594" y="917" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">and who approves spending?</text><rect x="1072" y="768" width="464" height="213" rx="22" fill="#FFFFFF"/><text x="1098" y="797" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Exit</text><text x="1098" y="865" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">How can a share be sold,</text><text x="1098" y="917" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">priced, or transferred?</text><text x="64" y="1027" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">The ownership fraction does not automatically determine every right.</text><text x="64" y="1080" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative equal allocations; transaction, financing, management, and usage fees excluded.</text></svg>