<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Take-or-Pay: demand can fall while a minimum payment remains</title><desc id="desc">Hypothetical monthly contract with a minimum of one hundred units at ten dollars each. If the buyer takes sixty units, six hundred dollars for units taken plus a four hundred dollar shortfall payment equals the one thousand dollar minimum. If the buyer takes one hundred thirty units, assuming additional supply is available at the same rate, payment is thirteen hundred dollars. Real contracts can use a different shortfall rate or a fixed capacity fee. No later delivery rights for paid shortfalls are assumed in this example.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">TAKE-OR-PAY</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Commit to a minimum, even if demand falls.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">The buyer accepts a payment floor; the supplier gains more predictable revenue.</text><rect x="64" y="260" width="1472" height="139" rx="22" fill="#176E69"/><text x="94" y="284" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">ILLUSTRATIVE MONTHLY AGREEMENT</text><text x="94" y="337" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#FFFFFF">Minimum 100 units × $10 per unit = $1,000 payment floor</text><rect x="64" y="452" width="716" height="367" rx="22" fill="#FFFFFF"/><text x="90" y="480" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">LOWER DEMAND</text><text x="90" y="540" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">60 units taken × $10 = $600</text><text x="90" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#183343">40-unit shortfall × $10 = $400</text><text x="90" y="663" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">No need to take the unused 40 units.</text><text x="90" y="743" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#176E69">$1,000 total payment</text><rect x="820" y="452" width="716" height="367" rx="22" fill="#FFFFFF"/><text x="846" y="480" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">HIGHER DEMAND</text><text x="846" y="540" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">130 units taken × $10 = $1,300</text><text x="846" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#183343">No shortfall payment</text><text x="846" y="663" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Additional supply assumed available.</text><text x="846" y="743" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#176E69">$1,300 total payment</text><rect x="64" y="868" width="1472" height="110" rx="22" fill="#DCEDE8"/><text x="93" y="893" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#176E69">The commitment protects a minimum payment, not a guaranteed profit.</text><text x="93" y="940" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Supplier performance duties, costs, and customer credit risk still matter.</text><text x="64" y="1021" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Hypothetical figures, not company terms. Shortfall rates and extra-unit prices can differ.</text><text x="64" y="1062" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Some agreements protect only a fixed fee, with variable costs charged on delivery.</text><text x="64" y="1103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Later delivery rights for paid shortfalls depend on the agreement; none are assumed here.</text></svg>