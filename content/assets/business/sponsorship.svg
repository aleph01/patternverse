<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Sponsorship: support exchanged for defined association rights and benefits</title><desc id="desc">A sponsor provides cash or useful in-kind support to an event, team, or creator. The rights holder provides agreed rights and benefits in return. A sponsorship package may include naming rights, visibility, audience experiences, and category exclusivity. Activation is the additional work used to make the partnership effective. Rights vary by agreement.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">SPONSORSHIP</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#183343">Support in exchange for a defined association.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A partnership can include recognition, access, experiences, and exclusivity.</text><rect x="64" y="263" width="520" height="284" rx="22" fill="#FFFFFF"/><text x="89" y="294" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">SPONSOR</text><text x="89" y="352" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Brand or business</text><text x="89" y="427" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Seeks a relevant association</text><text x="89" y="483" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">and opportunities to use it.</text><rect x="1016" y="263" width="520" height="284" rx="22" fill="#DCEDE8"/><text x="1041" y="294" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">RIGHTS HOLDER</text><text x="1041" y="352" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Event, team, or creator</text><text x="1041" y="427" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Delivers the agreed rights</text><text x="1041" y="483" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">and sponsorship benefits.</text><text x="650" y="302" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">Cash / in-kind support</text><line x1="604" y1="351" x2="996" y2="351" stroke="#176E69" stroke-width="5"/><polygon points="996,351 981,342 981,360" fill="#176E69"/><text x="692" y="431" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">Rights + benefits</text><line x1="996" y1="482" x2="604" y2="482" stroke="#176E69" stroke-width="5"/><polygon points="604,482 619,473 619,491" fill="#176E69"/><text x="64" y="598" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">POSSIBLE RIGHTS AND BENEFITS</text><rect x="64" y="651" width="338" height="186" rx="22" fill="#FFFFFF"/><text x="85" y="677" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">NAMING</text><text x="85" y="733" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Title or venue</text><text x="85" y="786" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">association</text><rect x="442" y="651" width="338" height="186" rx="22" fill="#FFFFFF"/><text x="463" y="677" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">VISIBILITY</text><text x="463" y="733" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Branding and</text><text x="463" y="786" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">acknowledgments</text><rect x="820" y="651" width="338" height="186" rx="22" fill="#FFFFFF"/><text x="841" y="677" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">ACCESS</text><text x="841" y="733" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Hospitality and</text><text x="841" y="786" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">experiences</text><rect x="1198" y="651" width="338" height="186" rx="22" fill="#FFFFFF"/><text x="1219" y="677" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">EXCLUSIVITY</text><text x="1219" y="733" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Within an agreed</text><text x="1219" y="786" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">category and scope</text><rect x="64" y="885" width="1472" height="139" rx="22" fill="#176E69"/><text x="94" y="914" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="41" font-weight="700" fill="#FFFFFF">Securing rights is only the beginning.</text><text x="94" y="978" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">Activation is the extra work that brings the partnership to its intended audience.</text><text x="64" y="1073" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Rights vary by agreement. The sponsorship fee and activation costs are separate.</text></svg>