<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Long Tail</title><desc id="desc">Illustrative demand bars show a small number of popular offerings and many individually smaller niches. Shared discovery and economical fulfillment connect those niches to customers. Values are conceptual, not market data.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">LONG TAIL</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Serve many small niches together.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">A broad assortment works when discovery and fulfillment remain economical.</text><text x="64" y="280" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">ILLUSTRATIVE DEMAND PER OFFERING</text><rect x="100" y="375" width="65" height="350" rx="6" fill="#176E69"/><rect x="205" y="445" width="65" height="280" rx="6" fill="#176E69"/><rect x="310" y="515" width="65" height="210" rx="6" fill="#176E69"/><rect x="490" y="580" width="28" height="145" rx="4" fill="#78A69A"/><rect x="536" y="586" width="28" height="139" rx="4" fill="#78A69A"/><rect x="582" y="592" width="28" height="133" rx="4" fill="#78A69A"/><rect x="628" y="598" width="28" height="127" rx="4" fill="#78A69A"/><rect x="674" y="604" width="28" height="121" rx="4" fill="#78A69A"/><rect x="720" y="610" width="28" height="115" rx="4" fill="#78A69A"/><rect x="766" y="616" width="28" height="109" rx="4" fill="#78A69A"/><rect x="812" y="622" width="28" height="103" rx="4" fill="#78A69A"/><rect x="858" y="628" width="28" height="97" rx="4" fill="#78A69A"/><rect x="904" y="634" width="28" height="91" rx="4" fill="#78A69A"/><rect x="950" y="640" width="28" height="85" rx="4" fill="#78A69A"/><rect x="996" y="646" width="28" height="79" rx="4" fill="#78A69A"/><rect x="1042" y="652" width="28" height="73" rx="4" fill="#78A69A"/><rect x="1088" y="658" width="28" height="67" rx="4" fill="#78A69A"/><rect x="1134" y="664" width="28" height="61" rx="4" fill="#78A69A"/><rect x="1180" y="670" width="28" height="55" rx="4" fill="#78A69A"/><rect x="1226" y="676" width="28" height="49" rx="4" fill="#78A69A"/><rect x="1272" y="682" width="28" height="43" rx="4" fill="#78A69A"/><rect x="1318" y="688" width="28" height="37" rx="4" fill="#78A69A"/><rect x="1364" y="694" width="28" height="31" rx="4" fill="#78A69A"/><rect x="1410" y="700" width="28" height="25" rx="4" fill="#78A69A"/><rect x="1456" y="703" width="28" height="22" rx="4" fill="#78A69A"/><text x="100" y="747" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#183343">Popular offerings</text><text x="490" y="747" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#183343">Many individually smaller niches</text><rect x="64" y="810" width="1472" height="208" rx="22" fill="#DCEDE8"/><text x="90" y="843" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Shared discovery + economical availability</text><text x="90" y="911" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Connect scattered demand without carrying excessive cost per offering.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">A tail can be worthwhile without outselling the head. Bars are illustrative.</text></svg>