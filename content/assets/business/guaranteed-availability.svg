<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Guaranteed Availability: sell readiness backed by an operating system</title><desc id="desc">The customer pays for a defined availability commitment. The provider monitors, maintains, repairs, and supplies backup capacity to keep an agreed function ready to use. Equipment can fail while backup preserves service. Hypothetical calculation: eight hundred agreed service hours minus two unavailable hours, divided by eight hundred, equals ninety-nine point seven five percent availability. A ninety-nine point five percent target over that window permits four unavailable hours under the agreed measurement rules. This is illustrative, not a company guarantee.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">GUARANTEED AVAILABILITY</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Sell the ability to keep working.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A defined service commitment, backed by maintenance and recovery capacity.</text><rect x="64" y="294" width="430" height="330" rx="22" fill="#FFFFFF"/><text x="91" y="322" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">CUSTOMER</text><text x="91" y="385" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Pays for dependable</text><text x="91" y="430" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">access to a function</text><text x="91" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Agrees service hours,</text><text x="91" y="552" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">scope, and remedies</text><rect x="585" y="294" width="430" height="330" rx="22" fill="#DCEDE8"/><text x="612" y="322" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">PROVIDER</text><text x="612" y="385" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Monitor and prevent</text><text x="612" y="450" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Maintain and repair</text><text x="612" y="515" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Switch to backup</text><text x="612" y="578" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Measure and report</text><rect x="1106" y="294" width="430" height="330" rx="22" fill="#176E69"/><text x="1133" y="322" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">AGREED AVAILABILITY</text><text x="1133" y="385" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#FFFFFF">Working capacity</text><text x="1133" y="430" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#FFFFFF">when it is needed</text><text x="1133" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#FFFFFF">Measured against</text><text x="1133" y="552" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#FFFFFF">the agreed conditions</text><line x1="502" y1="453" x2="574" y2="453" stroke="#176E69" stroke-width="5"/><polygon points="574,453 559,444 559,462" fill="#176E69"/><line x1="1023" y1="453" x2="1095" y2="453" stroke="#176E69" stroke-width="5"/><polygon points="1095,453 1080,444 1080,462" fill="#176E69"/><rect x="64" y="680" width="1472" height="133" rx="22" fill="#FFFFFF"/><text x="91" y="705" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">A machine can fail while the service continues.</text><text x="91" y="763" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Backup preserves the function while the original equipment is repaired.</text><rect x="64" y="866" width="1472" height="166" rx="22" fill="#E6E9E9"/><text x="91" y="891" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#176E69">Illustrative availability: (800 − 2) ÷ 800 = 99.75%</text><text x="91" y="953" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">800 agreed service hours; 2 unavailable hours, counted under the agreed rules.</text><text x="91" y="997" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">A 99.5% target over that window permits 4 unavailable hours.</text><text x="64" y="1077" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Hypothetical figures, not company terms. Scope, exclusions, and remedies matter.</text></svg>