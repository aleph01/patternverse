<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Extension Ecosystem: many builders extend a common core</title><desc id="desc">Three independent developers supply reporting, booking, and automation extensions. Supported extension points, access rules, and compatibility connect them to a common core product providing accounts, data, and essential workflows. Three customers choose different combinations of the core and extensions. Distribution and billing can be centralized or decentralized.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">EXTENSION ECOSYSTEM</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Many builders. One extensible core.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Let outside developers add capabilities through supported extension points.</text><text x="64" y="246" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">THIRD-PARTY EXTENSIONS</text><rect x="64" y="292" width="460" height="151" rx="22" fill="#FFFFFF"/><text x="91" y="322" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">DEVELOPER A</text><text x="91" y="379" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Reporting app</text><line x1="294" y1="460" x2="294" y2="488" stroke="#176E69" stroke-width="5"/><polygon points="294,488 285,473 303,473" fill="#176E69"/><rect x="570" y="292" width="460" height="151" rx="22" fill="#FFFFFF"/><text x="597" y="322" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">DEVELOPER B</text><text x="597" y="379" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Booking app</text><line x1="800" y1="460" x2="800" y2="488" stroke="#176E69" stroke-width="5"/><polygon points="800,488 791,473 809,473" fill="#176E69"/><rect x="1076" y="292" width="460" height="151" rx="22" fill="#FFFFFF"/><text x="1103" y="322" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">DEVELOPER C</text><text x="1103" y="379" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Automation app</text><line x1="1306" y1="460" x2="1306" y2="488" stroke="#176E69" stroke-width="5"/><polygon points="1306,488 1297,473 1315,473" fill="#176E69"/><rect x="64" y="506" width="1472" height="61" rx="22" fill="#DCEDE8"/><text x="94" y="523" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">Supported extension points + access rules + compatibility</text><rect x="64" y="595" width="1472" height="155" rx="22" fill="#176E69"/><text x="94" y="623" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">CORE PRODUCT</text><text x="94" y="682" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">Shared foundation: accounts, data, and essential workflows</text><line x1="294" y1="767" x2="294" y2="813" stroke="#176E69" stroke-width="5"/><polygon points="294,813 285,798 303,798" fill="#176E69"/><rect x="64" y="831" width="460" height="150" rx="22" fill="#FFFFFF"/><text x="91" y="860" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">CUSTOMER 1</text><text x="91" y="919" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Core + reporting</text><line x1="800" y1="767" x2="800" y2="813" stroke="#176E69" stroke-width="5"/><polygon points="800,813 791,798 809,798" fill="#176E69"/><rect x="570" y="831" width="460" height="150" rx="22" fill="#FFFFFF"/><text x="597" y="860" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">CUSTOMER 2</text><text x="597" y="919" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Core + booking</text><line x1="1306" y1="767" x2="1306" y2="813" stroke="#176E69" stroke-width="5"/><polygon points="1306,813 1297,798 1315,798" fill="#176E69"/><rect x="1076" y="831" width="460" height="150" rx="22" fill="#FFFFFF"/><text x="1103" y="860" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">CUSTOMER 3</text><text x="1103" y="919" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Core + automation</text><text x="64" y="1027" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Each customer chooses which capabilities to add.</text><text x="64" y="1095" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative software ecosystem. Distribution and billing can be centralized or decentralized.</text></svg>