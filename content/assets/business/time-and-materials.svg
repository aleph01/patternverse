<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Time and Materials: agreed rates, variable quantities</title><desc id="desc">Illustrative invoice: twenty approved hours at one hundred dollars per hour equals two thousand dollars. Materials costing three hundred dollars with an agreed ten percent markup are billed at three hundred thirty dollars. The total bill is two thousand three hundred thirty dollars, excluding taxes and other charges. Four additional approved hours would add four hundred dollars. Review spending alongside progress and the forecast for remaining work. An estimate is not a fixed fee.</desc><rect width="1600" height="1100" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">TIME AND MATERIALS</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Agree the rates. Pay for the work used.</text><text x="64" y="188" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Unit prices are agreed; the bill reflects authorized time and materials.</text><rect x="64" y="278" width="712" height="267" rx="22" fill="#E6E9E9"/><rect x="824" y="278" width="712" height="267" rx="22" fill="#DCEDE8"/><text x="94" y="308" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Time</text><text x="94" y="372" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#183343">20 hours × $100/hour</text><text x="94" y="439" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#183343">$2,000</text><text x="854" y="308" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#176E69">Materials</text><text x="854" y="372" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">$300 + agreed 10% markup</text><text x="854" y="439" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#176E69">$330</text><rect x="64" y="592" width="1472" height="137" rx="22" fill="#176E69"/><text x="94" y="620" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#FFFFFF">Illustrative invoice</text><text x="94" y="672" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">$2,000 + $330 = $2,330</text><rect x="64" y="775" width="1472" height="96" rx="18" fill="#FFFFFF"/><text x="94" y="808" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">4 more approved hours at $100/hour would add $400.</text><text x="64" y="922" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176E69">Review spending alongside progress and the forecast for remaining work.</text><text x="64" y="980" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">An estimate is not a fixed fee.</text><text x="64" y="1044" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Hypothetical invoice, not company rates. Excludes taxes and other charges.</text></svg>