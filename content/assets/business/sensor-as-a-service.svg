<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Sensor as a Service: repeated sensing, delivered as a service</title><desc id="desc">Physical sensors measure conditions, connectivity carries readings to a monitoring service, and the service presents checked readings, trends, and alerts for customer action. The service agreement assigns responsibility for installation, calibration, power, connectivity, maintenance, and replacement. Hardware may be bundled into service fees or purchased separately. Measurement and alerts do not by themselves guarantee a response or a particular outcome.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">SENSOR AS A SERVICE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Repeated sensing, delivered as a service.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Combine physical sensors with connectivity, usable readings, and defined support.</text><rect x="64" y="300" width="308" height="265" rx="22" fill="#DCEDE8"/><text x="84" y="329" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">MEASURE</text><text x="84" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Physical sensors</text><text x="84" y="466" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Temperature, vibration,</text><text x="84" y="513" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">location, or other signals</text><rect x="452" y="300" width="308" height="265" rx="22" fill="#FFFFFF"/><text x="472" y="329" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CONNECT</text><text x="472" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Data connection</text><text x="472" y="466" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Transmit readings</text><text x="472" y="513" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">at agreed intervals</text><rect x="840" y="300" width="308" height="265" rx="22" fill="#FFFFFF"/><text x="860" y="329" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">INTERPRET</text><text x="860" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Monitoring service</text><text x="860" y="466" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Check readings; present</text><text x="860" y="513" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">trends and alerts</text><rect x="1228" y="300" width="308" height="265" rx="22" fill="#FFFFFF"/><text x="1248" y="329" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">RESPOND</text><text x="1248" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Customer action</text><text x="1248" y="466" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Investigate, adjust,</text><text x="1248" y="513" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">or arrange service</text><line x1="389" y1="433" x2="435" y2="433" stroke="#176E69" stroke-width="5"/><polygon points="435,433 420,424 420,442" fill="#176E69"/><line x1="777" y1="433" x2="823" y2="433" stroke="#176E69" stroke-width="5"/><polygon points="823,433 808,424 808,442" fill="#176E69"/><line x1="1165" y1="433" x2="1211" y2="433" stroke="#176E69" stroke-width="5"/><polygon points="1211,433 1196,424 1196,442" fill="#176E69"/><rect x="64" y="640" width="1472" height="291" rx="22" fill="#DCEDE8"/><text x="94" y="671" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">AGREE WHO KEEPS THE MEASUREMENT WORKING</text><text x="94" y="738" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Set up correctly</text><text x="94" y="806" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Installation, placement,</text><text x="94" y="851" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">and calibration</text><text x="582" y="738" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Keep it connected</text><text x="582" y="806" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Power, communications,</text><text x="582" y="851" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">and device health</text><text x="1070" y="738" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Maintain over time</text><text x="1070" y="806" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Checks, field visits,</text><text x="1070" y="851" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">and replacement</text><rect x="64" y="978" width="1472" height="84" rx="22" fill="#FFFFFF"/><text x="94" y="1005" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Hardware may be bundled into fees or purchased separately.</text><text x="64" y="1100" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Scope varies. A reading or alert does not, by itself, guarantee a response or outcome.</text></svg>