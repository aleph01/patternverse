<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Bundling: different favorites, one package</title><desc id="desc">Hypothetical willingness to pay. Customer 1 values product A at 9 dollars and B at 3 dollars. Customer 2 values A at 3 dollars and B at 9 dollars. Each values the bundle at 12 dollars. With products sold only separately at 8 dollars each, each customer buys one product, yielding 16 dollars total revenue. With only the bundle offered at 11 dollars, both buy it, yielding 22 dollars total revenue. Values are assumed additive. Costs are excluded; this is not a profit comparison.</desc><rect width="1600" height="1100" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">BUNDLING</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="53" font-weight="700" fill="#183343">Different favorites. One package.</text><text x="64" y="187" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Combining offerings can bring together different sources of customer value.</text><text x="64" y="269" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#52646D">HYPOTHETICAL WILLINGNESS TO PAY</text><rect x="64" y="317" width="1472" height="253" rx="22" fill="#FFFFFF"/><rect x="64" y="317" width="1472" height="70" rx="16" fill="#E6E9E9"/><text x="90" y="337" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Customer</text><text x="520" y="337" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Product A</text><text x="855" y="337" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Product B</text><text x="1210" y="337" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">A + B total</text><text x="90" y="413" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Customer 1</text><text x="566" y="413" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#176E69">$9</text><text x="901" y="413" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#176E69">$3</text><text x="1264" y="413" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#176E69">$12</text><text x="90" y="493" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Customer 2</text><text x="566" y="493" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#176E69">$3</text><text x="901" y="493" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#176E69">$9</text><text x="1264" y="493" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#176E69">$12</text><text x="64" y="626" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#52646D">TWO ALTERNATIVE OFFERS</text><rect x="64" y="677" width="712" height="221" rx="22" fill="#E6E9E9"/><text x="90" y="704" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Separate products: $8 each</text><text x="90" y="765" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Each buyer chooses one product.</text><text x="90" y="831" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#176E69">$16 total revenue</text><rect x="824" y="677" width="712" height="221" rx="22" fill="#DCEDE8"/><text x="850" y="704" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Bundle only: $11</text><text x="850" y="765" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Both buyers choose the package.</text><text x="850" y="831" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#176E69">$22 total revenue</text><text x="64" y="955" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Illustrative prices and additive values; purchases occur as shown. Costs excluded.</text><rect x="64" y="1010" width="1472" height="65" rx="16" fill="#176E69"/><text x="88" y="1029" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">More revenue does not automatically mean more profit.</text></svg>