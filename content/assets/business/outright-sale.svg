<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc"><title id="title">Outright Sale: transfer the product and its ownership</title><desc id="desc">A seller supplies a product and transfers ownership to the customer in exchange for a purchase price. The seller retains applicable warranty, product, and agreed support obligations. The customer receives use and remaining resale value and generally manages care and operating costs. Payment timing and additional services are separate design choices. Exact responsibilities and transfer timing depend on the terms.</desc><rect width="1600" height="1080" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">OUTRIGHT SALE</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Sell the product. Transfer ownership.</text><text x="64" y="187" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">The customer buys an asset; the seller earns from the sale.</text><rect x="64" y="288" width="430" height="255" rx="22" fill="#E6E9E9"/><rect x="1106" y="288" width="430" height="255" rx="22" fill="#DCEDE8"/><text x="94" y="321" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#183343">Seller</text><text x="1136" y="321" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#176E69">Customer</text><text x="94" y="400" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Makes or sources</text><text x="94" y="448" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">the product.</text><text x="1136" y="400" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Acquires and owns</text><text x="1136" y="448" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">the product.</text><text x="616" y="319" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Product + ownership</text><path d="M527 377H1063" stroke="#176E69" stroke-width="4"/><path d="M1073 377l-14 -10v20z" fill="#176E69"/><text x="684" y="436" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Purchase price</text><path d="M1073 494H537" stroke="#176E69" stroke-width="4"/><path d="M527 494l14 -10v20z" fill="#176E69"/><rect x="64" y="620" width="712" height="230" rx="22" fill="#FFFFFF"/><rect x="824" y="620" width="712" height="230" rx="22" fill="#FFFFFF"/><text x="94" y="651" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Seller continues to provide</text><text x="94" y="718" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Applicable warranty obligations</text><text x="94" y="769" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Support included in the agreement</text><text x="854" y="651" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#176E69">Customer manages ownership</text><text x="854" y="718" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Use, care, and operating costs</text><text x="854" y="769" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Remaining value and eventual resale</text><rect x="64" y="899" width="1472" height="91" rx="18" fill="#DCEDE8"/><text x="94" y="928" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#176E69">Payment timing and additional services are separate design choices.</text><text x="64" y="1032" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Conceptual model. Exact responsibilities and ownership transfer depend on the terms.</text></svg>