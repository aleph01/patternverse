<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc"><title id="title">Bottom of the Pyramid: make the whole journey affordable</title><desc id="desc">Four barriers to access are upfront expense, distance and time, use and upkeep, and income timing. Corresponding design responses are lower entry cost, nearby access, reliable operation, and suitable payments. Customer benefit and sustainable delivery economics are both necessary.</desc><rect width="1600" height="940" fill="#F6F4EF"/><text x="64" y="55" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">BOTTOM OF THE PYRAMID</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Make the whole journey affordable.</text><text x="64" y="181" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#52646D">Design around the barriers customers face in obtaining and using a benefit.</text><text x="64" y="255" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#52646D">BARRIERS TO ACCESS</text><rect x="64" y="303" width="320" height="197" rx="22" fill="#E6E9E9" stroke="#E6E9E9" stroke-width="2"/><text x="86" y="331" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Upfront expense</text><text x="86" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Too much to</text><text x="86" y="425" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">pay at once.</text><path d="M224 513V542" stroke="#52646D" stroke-width="4"/><path d="M224 552l-9 -13h18z" fill="#52646D"/><rect x="64" y="566" width="320" height="194" rx="22" fill="#DCEDE8" stroke="#DCEDE8" stroke-width="2"/><text x="86" y="595" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">Lower entry cost</text><text x="86" y="650" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183343">Efficient design;</text><text x="86" y="684" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183343">manageable entry.</text><rect x="448" y="303" width="320" height="197" rx="22" fill="#E6E9E9" stroke="#E6E9E9" stroke-width="2"/><text x="470" y="331" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Distance and time</text><text x="470" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Travel and waiting</text><text x="470" y="425" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">add to the cost.</text><path d="M608 513V542" stroke="#52646D" stroke-width="4"/><path d="M608 552l-9 -13h18z" fill="#52646D"/><rect x="448" y="566" width="320" height="194" rx="22" fill="#DCEDE8" stroke="#DCEDE8" stroke-width="2"/><text x="470" y="595" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">Nearby access</text><text x="470" y="650" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183343">Local delivery and</text><text x="470" y="684" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183343">trusted partners.</text><rect x="832" y="303" width="320" height="197" rx="22" fill="#E6E9E9" stroke="#E6E9E9" stroke-width="2"/><text x="854" y="331" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Use and upkeep</text><text x="854" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Power, repair,</text><text x="854" y="425" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">and durability.</text><path d="M992 513V542" stroke="#52646D" stroke-width="4"/><path d="M992 552l-9 -13h18z" fill="#52646D"/><rect x="832" y="566" width="320" height="194" rx="22" fill="#DCEDE8" stroke="#DCEDE8" stroke-width="2"/><text x="854" y="595" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">Reliable operation</text><text x="854" y="650" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183343">Fit the conditions</text><text x="854" y="684" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183343">of everyday use.</text><rect x="1216" y="303" width="320" height="197" rx="22" fill="#E6E9E9" stroke="#E6E9E9" stroke-width="2"/><text x="1238" y="331" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Income timing</text><text x="1238" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Cash arrives</text><text x="1238" y="425" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">unevenly.</text><path d="M1376 513V542" stroke="#52646D" stroke-width="4"/><path d="M1376 552l-9 -13h18z" fill="#52646D"/><rect x="1216" y="566" width="320" height="194" rx="22" fill="#DCEDE8" stroke="#DCEDE8" stroke-width="2"/><text x="1238" y="595" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">Suitable payments</text><text x="1238" y="650" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183343">Match cash flow;</text><text x="1238" y="684" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183343">show the full cost.</text><text x="64" y="812" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">Customer benefit + sustainable delivery economics</text><text x="64" y="874" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">A lower upfront payment can still carry a higher total cost.</text></svg>