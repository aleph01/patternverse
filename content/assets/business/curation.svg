<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc"><title id="title">Curation: make abundance worth navigating</title><desc id="desc">A broad pool of options is evaluated using audience, quality, relevance and fit criteria. A selected set is presented with context and reasons. Customer outcomes and feedback refine future selection. The intended value is less search, better fit and useful discovery, supported by clear criteria and commercial incentives.</desc><rect width="1600" height="1080" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">CURATION</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="51" font-weight="700" fill="#183343">Make abundance worth navigating.</text><text x="64" y="187" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#52646D">Select for a purpose. Explain the choice. Learn what works.</text><rect x="64" y="290" width="360" height="382" rx="22" fill="#E6E9E9"/><text x="88" y="317" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Available options</text><rect x="90" y="386" width="42" height="42" rx="7" fill="#9DB2B2"/><rect x="151" y="386" width="42" height="42" rx="7" fill="#C6D0CF"/><rect x="212" y="386" width="42" height="42" rx="7" fill="#A9BFC1"/><rect x="273" y="386" width="42" height="42" rx="7" fill="#9DB2B2"/><rect x="334" y="386" width="42" height="42" rx="7" fill="#C6D0CF"/><rect x="90" y="447" width="42" height="42" rx="7" fill="#C6D0CF"/><rect x="151" y="447" width="42" height="42" rx="7" fill="#A9BFC1"/><rect x="212" y="447" width="42" height="42" rx="7" fill="#9DB2B2"/><rect x="273" y="447" width="42" height="42" rx="7" fill="#C6D0CF"/><rect x="334" y="447" width="42" height="42" rx="7" fill="#A9BFC1"/><rect x="90" y="508" width="42" height="42" rx="7" fill="#A9BFC1"/><rect x="151" y="508" width="42" height="42" rx="7" fill="#9DB2B2"/><rect x="212" y="508" width="42" height="42" rx="7" fill="#C6D0CF"/><rect x="273" y="508" width="42" height="42" rx="7" fill="#A9BFC1"/><rect x="334" y="508" width="42" height="42" rx="7" fill="#9DB2B2"/><rect x="90" y="569" width="42" height="42" rx="7" fill="#9DB2B2"/><rect x="151" y="569" width="42" height="42" rx="7" fill="#C6D0CF"/><rect x="212" y="569" width="42" height="42" rx="7" fill="#A9BFC1"/><rect x="273" y="569" width="42" height="42" rx="7" fill="#9DB2B2"/><rect x="334" y="569" width="42" height="42" rx="7" fill="#C6D0CF"/><polyline points="447,485 506,485" fill="none" stroke="#176E69" stroke-width="4"/><path d="M516 485l-14 -9v18z" fill="#176E69"/><rect x="540" y="290" width="480" height="382" rx="22" fill="#DCEDE8"/><text x="566" y="317" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176E69">Selection criteria</text><text x="566" y="388" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Who is this for?</text><text x="566" y="448" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">What meets the standard?</text><text x="566" y="508" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">What fits the need?</text><text x="566" y="568" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">What adds discovery?</text><polyline points="1043,485 1102,485" fill="none" stroke="#176E69" stroke-width="4"/><path d="M1112 485l-14 -9v18z" fill="#176E69"/><rect x="1136" y="290" width="400" height="382" rx="22" fill="#FFFFFF"/><text x="1160" y="317" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Chosen + explained</text><rect x="1160" y="384" width="53" height="53" rx="9" fill="#176E69"/><polyline points="1235,396 1507,396" fill="none" stroke="#A9BFC1" stroke-width="7"/><polyline points="1235,420 1458,420" fill="none" stroke="#CCD6D4" stroke-width="5"/><rect x="1160" y="469" width="53" height="53" rx="9" fill="#176E69"/><polyline points="1235,481 1507,481" fill="none" stroke="#A9BFC1" stroke-width="7"/><polyline points="1235,505 1458,505" fill="none" stroke="#CCD6D4" stroke-width="5"/><rect x="1160" y="554" width="53" height="53" rx="9" fill="#176E69"/><polyline points="1235,566 1507,566" fill="none" stroke="#A9BFC1" stroke-width="7"/><polyline points="1235,590 1458,590" fill="none" stroke="#CCD6D4" stroke-width="5"/><polyline points="1336,688 1336,739 780,739 780,700" fill="none" stroke="#176E69" stroke-width="4"/><path d="M780 685l-10 15h20z" fill="#176E69"/><text x="64" y="769" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Outcomes and feedback refine the next selection.</text><text x="64" y="839" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#52646D">THE VALUE CUSTOMERS SEEK</text><rect x="64" y="883" width="1472" height="92" rx="22" fill="#176E69"/><text x="94" y="909" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">Less search. Better fit. Useful discovery.</text><text x="64" y="1024" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Trust depends on clear standards, relevant choices, and honest commercial incentives.</text></svg>