<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">Outcome-Based Pricing: share verified savings</title><desc id="desc">Hypothetical shared-savings arrangement. An adjusted baseline of one hundred thousand dollars minus comparable actual costs of eighty thousand dollars yields twenty thousand dollars of savings. After measurement and quality checks, a twenty percent supplier share is four thousand dollars and the customer retains sixteen thousand dollars before other costs. Only qualifying verified savings generate this variable fee.</desc><rect width="1600" height="1120" fill="#F6F4EF"/><text x="64" y="48" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">OUTCOME-BASED PRICING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Agree the result. Verify it. Share the value.</text><text x="64" y="181" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A hypothetical shared-savings agreement, with a 20% supplier share.</text><rect x="64" y="254" width="416" height="208" rx="22" fill="#FFFFFF"/><text x="87" y="282" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Adjusted baseline</text><text x="87" y="331" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#176E69">$100,000</text><text x="87" y="408" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#52646D">Expected cost without the change</text><rect x="592" y="254" width="416" height="208" rx="22" fill="#FFFFFF"/><text x="615" y="282" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Comparable actual cost</text><text x="615" y="331" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#176E69">$80,000</text><text x="615" y="408" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#52646D">Cost after the intervention</text><rect x="1120" y="254" width="416" height="208" rx="22" fill="#FFFFFF"/><text x="1143" y="282" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Measured difference</text><text x="1143" y="331" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#176E69">$20,000</text><text x="1143" y="408" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#52646D">Subject to agreed checks</text><text x="502" y="333" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#183343">−</text><text x="1029" y="333" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#183343">=</text><rect x="64" y="505" width="1472" height="147" rx="22" fill="#E6E9E9"/><text x="94" y="534" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">VERIFICATION GATE</text><text x="94" y="579" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Comparable activity • agreed adjustments • required quality maintained</text><text x="94" y="623" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Only qualifying, verified savings generate the variable fee.</text><rect x="64" y="702" width="1472" height="247" rx="22" fill="#FFFFFF"/><text x="94" y="728" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">$20,000 verified savings</text><rect x="94" y="792" width="282" height="49" rx="0" fill="#176E69"/><rect x="376" y="792" width="1128" height="49" rx="0" fill="#DCEDE8"/><text x="94" y="868" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176E69">Supplier: $4,000</text><text x="706" y="868" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Customer retains: $16,000</text><text x="94" y="914" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#52646D">20% performance fee</text><text x="706" y="914" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#52646D">80% of verified savings, before other costs</text><text x="64" y="1002" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Illustrative figures, not company data. Other fees and project costs may apply.</text><text x="64" y="1051" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Baseline, attribution, quality, and measurement rules are agreed in advance.</text></svg>