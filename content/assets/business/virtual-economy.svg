<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Virtual Economy: build a market inside a digital environment</title><desc id="desc">Illustrative creator-supported virtual economy. Creators supply digital items, access, and experiences that participants acquire and use. Virtual spending is allocated under platform rules, including platform fees and eligible creator earnings. The operator governs issuance, supply, permissions, and rewards. Participants may buy virtual units. Real-money payouts exist only where supported and eligibility requirements are met. Platforms can also supply their own goods.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">VIRTUAL ECONOMY</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#183343">Build a market inside a digital environment.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Illustrative creator-supported model. Platforms can also supply their own goods.</text><rect x="64" y="285" width="430" height="254" rx="22" fill="#FFFFFF"/><text x="91" y="317" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">CREATORS</text><text x="91" y="391" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Make digital offerings</text><text x="91" y="477" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Receive eligible earnings</text><rect x="585" y="285" width="430" height="254" rx="22" fill="#176E69"/><text x="612" y="317" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">OFFERINGS</text><text x="612" y="391" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Items and access</text><text x="612" y="477" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">Experiences and services</text><rect x="1106" y="285" width="430" height="254" rx="22" fill="#FFFFFF"/><text x="1133" y="317" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">PARTICIPANTS</text><text x="1133" y="391" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Acquire and use them</text><text x="1133" y="477" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Express, play, participate</text><line x1="507" y1="412" x2="572" y2="412" stroke="#176E69" stroke-width="5"/><polygon points="572,412 557,403 557,421" fill="#176E69"/><line x1="1028" y1="412" x2="1093" y2="412" stroke="#176E69" stroke-width="5"/><polygon points="1093,412 1078,403 1078,421" fill="#176E69"/><text x="372" y="590" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#176E69">Virtual spending is allocated under platform rules</text><line x1="1321" y1="660" x2="279" y2="660" stroke="#176E69" stroke-width="5"/><polygon points="279,660 294,651 294,669" fill="#176E69"/><text x="319" y="694" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#52646D">Platform fees + eligible creator earnings</text><rect x="64" y="780" width="1472" height="128" rx="22" fill="#DCEDE8"/><text x="92" y="805" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">OPERATOR</text><text x="92" y="850" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Governs issuance, supply, permissions, fees, and rewards.</text><rect x="64" y="948" width="1472" height="133" rx="22" fill="#FFFFFF"/><text x="92" y="972" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">REAL-MONEY BOUNDARIES</text><text x="92" y="1018" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#183343">Participants may buy units. Payouts require a supported route and eligibility.</text><text x="64" y="1110" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">A virtual balance is not automatically withdrawable money or a right to resell an item.</text></svg>