<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Open Source: open the code, sell added value</title><desc id="desc">An open-source project grants rights to use, modify, and redistribute software under its license. Users may run and adapt it independently or choose a commercial offering such as hosting, support, or separately licensed premium features. Commercial revenue can fund development and maintenance. Adoption does not guarantee revenue, and contributions are voluntary. Illustrative commercial architecture rather than a requirement of open-source licensing.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">OPEN SOURCE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="51" font-weight="700" fill="#183343">Open the code. Sell added value.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Combine broad software freedoms with a distinct reason for customers to pay.</text><rect x="300" y="260" width="1000" height="190" rx="22" fill="#DCEDE8"/><text x="332" y="290" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">OPEN-SOURCE PROJECT</text><text x="332" y="347" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#183343">Rights to use, modify, and redistribute</text><text x="332" y="408" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Subject to the project’s license</text><polyline points="800,472 800,532 404,532 404,590" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="404,590 413.0,574.0 395.0,574.0" fill="#176E69"/><polyline points="800,532 1196,532 1196,590" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1196,590 1205.0,574.0 1187.0,574.0" fill="#176E69"/><rect x="64" y="615" width="680" height="235" rx="22" fill="#FFFFFF"/><text x="91" y="645" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">INDEPENDENT USE</text><text x="91" y="703" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Run and adapt the software</text><text x="91" y="763" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Self-manage or choose</text><text x="91" y="807" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">another provider</text><rect x="856" y="615" width="680" height="235" rx="22" fill="#FFFFFF"/><text x="883" y="645" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">COMMERCIAL OFFER</text><text x="883" y="703" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Pay for hosting or support</text><text x="883" y="763" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Or for separately licensed</text><text x="883" y="807" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">premium features</text><rect x="64" y="905" width="1472" height="128" rx="22" fill="#DCEDE8"/><text x="94" y="931" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">FUNDING THE WORK</text><text x="94" y="981" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Commercial income can fund development, maintenance, and operations.</text><text x="64" y="1087" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative business model. Adoption does not guarantee revenue; contributions are voluntary.</text></svg>