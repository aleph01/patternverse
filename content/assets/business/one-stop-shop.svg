<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">One-Stop Shop: bring the pieces of the job together</title><desc id="desc">A customer with a broader job accesses one customer-facing destination bringing together products, services and help. Useful integration connects choices, information and handoffs. Delivery can involve in-house teams, partners or both. Intended benefits include less searching, less repetition and clearer handoffs. Scope and responsibility must be defined; one destination need not mean one contract.</desc><rect width="1600" height="1050" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">ONE-STOP SHOP</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Bring the pieces of the job together.</text><text x="64" y="187" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">The value is easier completion through one customer-facing destination.</text><rect x="64" y="306" width="360" height="332" rx="22" fill="#176E69"/><text x="88" y="337" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">The broader job</text><text x="88" y="409" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#FFFFFF">Complete a project</text><text x="88" y="472" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">Find the products,</text><text x="88" y="511" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">services, and help</text><text x="88" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">needed to finish.</text><path d="M448 472H516" stroke="#176E69" stroke-width="4"/><path d="M526 472l-14 -9v18z" fill="#176E69"/><rect x="550" y="306" width="986" height="332" rx="22" fill="#E6E9E9"/><text x="578" y="336" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">One destination</text><rect x="578" y="412" width="302" height="124" rx="16" fill="#DCEDE8"/><text x="598" y="432" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176E69">Products</text><text x="598" y="487" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Relevant selection</text><rect x="892" y="412" width="302" height="124" rx="16" fill="#DCEDE8"/><text x="912" y="432" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176E69">Services</text><text x="912" y="487" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Related capabilities</text><rect x="1206" y="412" width="302" height="124" rx="16" fill="#DCEDE8"/><text x="1226" y="432" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176E69">Help</text><text x="1226" y="487" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Guidance and support</text><text x="578" y="578" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Connect choices, information, and handoffs.</text><text x="64" y="687" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Behind the destination: in-house teams, partners, or both.</text><text x="64" y="765" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#52646D">THE VALUE CUSTOMERS SEEK</text><rect x="64" y="811" width="464" height="99" rx="16" fill="#FFFFFF"/><text x="89" y="843" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Less searching</text><rect x="568" y="811" width="464" height="99" rx="16" fill="#FFFFFF"/><text x="593" y="843" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Less repetition</text><rect x="1072" y="811" width="464" height="99" rx="16" fill="#FFFFFF"/><text x="1097" y="843" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Clearer handoffs</text><rect x="64" y="956" width="1472" height="72" rx="16" fill="#DCEDE8"/><text x="88" y="978" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#176E69">Define scope and responsibility: one destination may involve several contracts.</text></svg>