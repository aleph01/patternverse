<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc"><title id="title">No Frills: simplify the system behind the price</title><desc id="desc">Possible design choices include focused scope, fewer variants, simpler fulfillment, and self-service. Simpler operations reduce the cost to serve and can support meaningful customer savings. Reliable core function and clear terms remain essential.</desc><rect width="1600" height="940" fill="#F6F4EF"/><text x="64" y="55" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">NO FRILLS</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Simplify the system behind the price.</text><text x="64" y="181" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#52646D">Keep the core benefit clear; remove costs customers will gladly avoid.</text><text x="64" y="255" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#52646D">POSSIBLE DESIGN CHOICES</text><rect x="64" y="303" width="320" height="197" rx="22" fill="#E6E9E9" stroke="#E6E9E9" stroke-width="2"/><text x="86" y="331" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#183343">Focused scope</text><text x="86" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">One clear job.</text><text x="86" y="425" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Defined boundaries.</text><path d="M224 513V542" stroke="#52646D" stroke-width="4"/><path d="M224 552l-9 -13h18z" fill="#52646D"/><rect x="448" y="303" width="320" height="197" rx="22" fill="#E6E9E9" stroke="#E6E9E9" stroke-width="2"/><text x="470" y="331" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#183343">Fewer variants</text><text x="470" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Less stock variety.</text><text x="470" y="425" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Repeatable work.</text><path d="M608 513V542" stroke="#52646D" stroke-width="4"/><path d="M608 552l-9 -13h18z" fill="#52646D"/><rect x="832" y="303" width="320" height="197" rx="22" fill="#E6E9E9" stroke="#E6E9E9" stroke-width="2"/><text x="854" y="331" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#183343">Simple fulfillment</text><text x="854" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Less handling.</text><text x="854" y="425" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Compact logistics.</text><path d="M992 513V542" stroke="#52646D" stroke-width="4"/><path d="M992 552l-9 -13h18z" fill="#52646D"/><rect x="1216" y="303" width="320" height="197" rx="22" fill="#E6E9E9" stroke="#E6E9E9" stroke-width="2"/><text x="1238" y="331" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#183343">Self-service</text><text x="1238" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Selected tasks</text><text x="1238" y="425" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">done by customers.</text><path d="M1376 513V542" stroke="#52646D" stroke-width="4"/><path d="M1376 552l-9 -13h18z" fill="#52646D"/><rect x="64" y="566" width="1472" height="112" rx="22" fill="#DCEDE8" stroke="#DCEDE8" stroke-width="2"/><text x="94" y="592" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#176E69">Lower cost to serve through simpler operations</text><path d="M800 692V720" stroke="#52646D" stroke-width="4"/><path d="M800 730l-9 -13h18z" fill="#52646D"/><rect x="64" y="746" width="1472" height="88" rx="16" fill="#FFFFFF" stroke="#CFD8D5" stroke-width="2"/><text x="94" y="769" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Pass meaningful savings to the customer.</text><text x="64" y="882" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Protect reliable function and clear terms; compare the total cost of purchase.</text></svg>