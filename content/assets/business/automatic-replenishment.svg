<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Automatic Replenishment: actual use triggers the next refill</title><desc id="desc">A customer first authorizes replenishment rules covering the item, supplier, quantity, and purchase or service terms. The operational cycle senses stock or usage, decides whether replenishment is needed after checking rules and pending orders, triggers an order or service shipment, then replenishes the supply. Receipt updates stock and outstanding orders. The diagram shows demand-driven fulfilment, not a fixed delivery calendar.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">AUTOMATIC REPLENISHMENT / OBJECT SELF-SERVICE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Let actual use trigger the next refill.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Connected objects report demand; an authorized system initiates replenishment.</text><rect x="64" y="276" width="1472" height="155" rx="22" fill="#FFFFFF"/><text x="95" y="308" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">CUSTOMER AUTHORIZES THE RULES</text><text x="95" y="367" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Item, supplier, quantity, and purchase or service terms</text><polyline points="800,446 800,501" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="800,501 809.0,485.0 791.0,485.0" fill="#176E69"/><rect x="64" y="518" width="1472" height="402" rx="22" fill="#DCEDE8"/><rect x="94" y="556" width="308" height="204" rx="22" fill="#FFFFFF"/><text x="118" y="582" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Sense</text><text x="118" y="646" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Measure stock</text><text x="118" y="681" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">or estimate use</text><text x="118" y="716" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">from the object</text><rect x="462" y="556" width="308" height="204" rx="22" fill="#FFFFFF"/><text x="486" y="582" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Decide</text><text x="486" y="646" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Check demand,</text><text x="486" y="681" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">agreed rules, and</text><text x="486" y="716" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">pending orders</text><rect x="830" y="556" width="308" height="204" rx="22" fill="#176E69"/><text x="854" y="582" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#FFFFFF">Trigger</text><text x="854" y="646" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#FFFFFF">Initiate an order</text><text x="854" y="681" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#FFFFFF">or a shipment</text><text x="854" y="716" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#FFFFFF">under the service</text><rect x="1198" y="556" width="308" height="204" rx="22" fill="#FFFFFF"/><text x="1222" y="582" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Replenish</text><text x="1222" y="646" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Deliver supplies;</text><text x="1222" y="681" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">record receipt</text><text x="1222" y="716" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and update stock</text><line x1="417" y1="655" x2="449" y2="655" stroke="#176E69" stroke-width="5"/><polygon points="449,655 434,646 434,664" fill="#176E69"/><line x1="785" y1="655" x2="817" y2="655" stroke="#176E69" stroke-width="5"/><polygon points="817,655 802,646 802,664" fill="#176E69"/><line x1="1153" y1="655" x2="1185" y2="655" stroke="#176E69" stroke-width="5"/><polygon points="1185,655 1170,646 1170,664" fill="#176E69"/><polyline points="1352,779 1352,869 248,869 248,779" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="248,779 239.0,795.0 257.0,795.0" fill="#176E69"/><text x="438" y="816" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">Receipt updates stock and outstanding orders</text><rect x="64" y="971" width="1472" height="82" rx="22" fill="#176E69"/><text x="93" y="997" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Replenish from actual demand, with a clear route to pause or intervene.</text><text x="64" y="1095" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Illustrative process. Shipment timing and billing cadence can follow different rules.</text></svg>