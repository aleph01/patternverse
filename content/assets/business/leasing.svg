<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170" role="img" aria-labelledby="title desc"><title id="title">Leasing: dedicated use with a defined commitment</title><desc id="desc">A hypothetical equipment lease. The lessor provides an asset and retains legal ownership during the lease. The lessee uses it under agreed terms and makes thirty-six monthly payments of five hundred dollars, totaling eighteen thousand dollars. At the end, possible paths depend on the contract: return the asset, renew if agreed, or buy if a purchase option exists. Lease payments do not automatically transfer ownership. Figures exclude upfront payments, fees, taxes, services, and any purchase price.</desc><rect width="1600" height="1170" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">LEASING</text><text x="64" y="102" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Dedicated use. A defined commitment.</text><text x="64" y="181" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A hypothetical equipment lease with a 36-month term.</text><rect x="64" y="255" width="678" height="204" rx="22" fill="#FFFFFF"/><text x="94" y="282" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#183343">Lessor</text><text x="94" y="345" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Provides the asset</text><text x="94" y="402" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Retains legal ownership during the lease</text><rect x="858" y="255" width="678" height="204" rx="22" fill="#FFFFFF"/><text x="888" y="282" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#183343">Lessee</text><text x="888" y="345" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Uses the asset under agreed terms</text><text x="888" y="402" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Makes scheduled payments</text><line x1="772" y1="355" x2="830" y2="355" stroke="#176E69" stroke-width="5"/><polygon points="830,355 815,346 815,364" fill="#176E69"/><rect x="64" y="504" width="1472" height="139" rx="22" fill="#DCEDE8"/><text x="94" y="533" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#176E69">36 months × $500 = $18,000 scheduled payments</text><text x="94" y="592" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#183343">Those payments do not automatically transfer ownership.</text><text x="64" y="691" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#52646D">POSSIBLE END PATHS — DEPENDING ON THE CONTRACT</text><rect x="64" y="745" width="464" height="238" rx="22" fill="#FFFFFF"/><text x="91" y="775" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#183343">Return</text><text x="91" y="841" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">Hand back the asset.</text><text x="91" y="909" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Meet condition and return terms.</text><rect x="568" y="745" width="464" height="238" rx="22" fill="#FFFFFF"/><text x="595" y="775" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#183343">Renew</text><text x="595" y="841" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">Continue if agreed.</text><text x="595" y="909" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">New terms or notice may apply.</text><rect x="1072" y="745" width="464" height="238" rx="22" fill="#FFFFFF"/><text x="1099" y="775" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#183343">Buy</text><text x="1099" y="841" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">Only if an option exists.</text><text x="1099" y="909" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Pay the required purchase price.</text><text x="64" y="1030" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#183343">Use limits, care, insurance, and early exit responsibilities follow the agreement.</text><text x="64" y="1082" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative figures, not company terms. Total excludes upfront payments, fees, taxes,</text><text x="64" y="1121" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">services, and any end-of-term purchase price. Not every lease offers all three paths.</text></svg>