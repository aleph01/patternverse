<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Resale and Recommerce: a useful product reaches its next owner</title><desc id="desc">A prior owner sells, trades in, or consigns a product that retains functional or collectible value. The resale process establishes and communicates condition and price, with cleaning or repair as needed. A next owner purchases the product for another period of use. A business can buy and resell inventory, sell on consignment, or connect buyers and sellers through a marketplace. Preparation work can be performed by the seller, reseller, or a service partner, and not every resale requires refurbishment.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">RESALE / RECOMMERCE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">A useful product reaches its next owner.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Recover value through another sale, with a clear account of what the buyer receives.</text><rect x="64" y="300" width="440" height="310" rx="22" fill="#FFFFFF"/><text x="88" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">PRIOR OWNER</text><text x="88" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Release a useful product</text><text x="88" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Sell, trade in, or consign</text><text x="88" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">a product with remaining</text><text x="88" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">functional or collectible value.</text><rect x="580" y="300" width="440" height="310" rx="22" fill="#DCEDE8"/><text x="604" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">RESALE PROCESS</text><text x="604" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Make condition clear</text><text x="604" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Inspect, describe, and price;</text><text x="604" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">clean or repair when needed.</text><text x="604" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Work can involve partners.</text><rect x="1096" y="300" width="440" height="310" rx="22" fill="#FFFFFF"/><text x="1120" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">NEXT OWNER</text><text x="1120" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Buy for another use</text><text x="1120" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Understand the condition,</text><text x="1120" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">price, and support offered;</text><text x="1120" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">take ownership of the item.</text><line x1="521" y1="452" x2="563" y2="452" stroke="#176E69" stroke-width="5"/><polygon points="563,452 548,443 548,461" fill="#176E69"/><line x1="1037" y1="452" x2="1079" y2="452" stroke="#176E69" stroke-width="5"/><polygon points="1079,452 1064,443 1064,461" fill="#176E69"/><polyline points="1316,634 1316,728 284,728 284,634" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="284,634 275.0,650.0 293.0,650.0" fill="#176E69"/><text x="493" y="658" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">Products may pass through several owners.</text><text x="64" y="795" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">THREE COMMERCIAL STRUCTURES</text><rect x="64" y="847" width="440" height="184" rx="22" fill="#DCEDE8"/><text x="88" y="871" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Inventory resale</text><text x="88" y="929" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Buy products and earn</text><text x="88" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">a margin when they sell.</text><rect x="580" y="847" width="440" height="184" rx="22" fill="#DCEDE8"/><text x="604" y="871" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Consignment</text><text x="604" y="929" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Sell on an owner’s behalf</text><text x="604" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and retain an agreed share.</text><rect x="1096" y="847" width="440" height="184" rx="22" fill="#DCEDE8"/><text x="1120" y="871" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Marketplace</text><text x="1120" y="929" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Connect sellers and buyers;</text><text x="1120" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">charge for the service.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Condition, saleable yield, and time to sell determine the economics.</text></svg>