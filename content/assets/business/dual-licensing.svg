<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Dual Licensing: one codebase, two licensing routes</title><desc id="desc">A rights holder offers the same underlying software through alternative licensing routes. The open-source route grants rights under an open-source license and requires compliance with its conditions. The commercial route supplies alternative permissions and obligations in exchange for an agreed payment. Commercial use may be permitted under the open-source route. The choice concerns license terms rather than necessarily different features. Third-party components can retain separate requirements.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">DUAL LICENSING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">One codebase. Two licensing routes.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Offer alternative terms for the same underlying software.</text><rect x="300" y="260" width="1000" height="185" rx="22" fill="#DCEDE8"/><text x="332" y="290" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">RIGHTS HOLDER</text><text x="332" y="348" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">Offers the software under alternative licenses</text><text x="332" y="402" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Must have authority to grant each set of rights</text><polyline points="800,472 800,533 414,533 414,589" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="414,589 423.0,573.0 405.0,573.0" fill="#176E69"/><polyline points="800,533 1186,533 1186,589" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1186,589 1195.0,573.0 1177.0,573.0" fill="#176E69"/><rect x="64" y="615" width="700" height="250" rx="22" fill="#FFFFFF"/><text x="94" y="646" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">OPEN-SOURCE ROUTE</text><text x="94" y="708" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#183343">Use under its conditions</text><text x="94" y="777" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Permissions and obligations follow</text><text x="94" y="821" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">the selected open-source license.</text><rect x="836" y="615" width="700" height="250" rx="22" fill="#F0E3D3"/><text x="866" y="646" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">COMMERCIAL ROUTE</text><text x="866" y="708" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#183343">Pay for alternative terms</text><text x="866" y="777" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Permissions and obligations follow</text><text x="866" y="821" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">the commercial agreement.</text><rect x="64" y="922" width="1472" height="121" rx="22" fill="#DCEDE8"/><text x="94" y="951" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Commercial use can also be permitted under the open-source route.</text><text x="94" y="999" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">The choice concerns terms, rather than necessarily additional features.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative model. Components and dependencies may retain separate license requirements.</text></svg>