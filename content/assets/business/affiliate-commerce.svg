<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Affiliate Commerce: earn from a qualifying referral</title><desc id="desc">Illustrative affiliate commerce arrangement. An affiliate recommends an offer, a customer follows a tracked referral and orders from the merchant, and the merchant handles the sale and fulfilment. The merchant pays an affiliate commission after an eligible action is validated under the programme terms. An optional affiliate network can handle tracking, validation, and payment. The commercial relationship should be clear to the customer.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">AFFILIATE COMMERCE / AFFILIATION</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="51" font-weight="700" fill="#183343">Earn from a qualifying referral.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Illustrative purchase-based model: the affiliate refers; the merchant makes the sale.</text><rect x="64" y="294" width="430" height="254" rx="22" fill="#176E69"/><text x="91" y="326" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">AFFILIATE</text><text x="91" y="399" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Recommends an offer</text><text x="91" y="485" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#FFFFFF">Provides a tracked referral</text><rect x="585" y="294" width="430" height="254" rx="22" fill="#FFFFFF"/><text x="612" y="326" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">CUSTOMER</text><text x="612" y="399" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Chooses to follow it</text><text x="612" y="485" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Orders from the merchant</text><rect x="1106" y="294" width="430" height="254" rx="22" fill="#FFFFFF"/><text x="1133" y="326" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">MERCHANT</text><text x="1133" y="399" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Makes the sale</text><text x="1133" y="485" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Handles fulfilment and service</text><line x1="507" y1="421" x2="572" y2="421" stroke="#176E69" stroke-width="5"/><polygon points="572,421 557,412 557,430" fill="#176E69"/><line x1="1028" y1="421" x2="1093" y2="421" stroke="#176E69" stroke-width="5"/><polygon points="1093,421 1078,412 1078,430" fill="#176E69"/><text x="64" y="601" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">THE COMMISSION</text><text x="320" y="657" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#176E69">Paid for an eligible, attributed customer action</text><line x1="1321" y1="731" x2="279" y2="731" stroke="#176E69" stroke-width="5"/><polygon points="279,731 294,722 294,740" fill="#176E69"/><text x="420" y="764" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Merchant pays commission to the affiliate</text><rect x="64" y="853" width="1472" height="145" rx="22" fill="#DCEDE8"/><text x="91" y="879" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">PROGRAMME TERMS DEFINE THE PAID RESULT</text><text x="91" y="936" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Attribution · eligible actions · exclusions · reversals · payout</text><text x="64" y="1046" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">An affiliate network may handle tracking, validation, and payment.</text><text x="64" y="1098" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">The commercial relationship should be clear to the customer.</text></svg>