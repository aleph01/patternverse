<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170" role="img" aria-labelledby="title desc"><title id="title">Shared Access: many customers use a managed resource pool</title><desc id="desc">Hypothetical workspace: thirty members share ten workstations through capacity-limited bookings. At nine hours, six requests receive six places, leaving four free. At thirteen hours, eight requests receive eight places, leaving two free. At seventeen hours, twelve requests compete for ten places; ten are allocated and two need another option. Membership does not provide a dedicated place at every moment. This is not company data or a recommended capacity ratio.</desc><rect width="1600" height="1170" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">SHARED ACCESS</text><text x="64" y="102" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183343">Many customers. A managed resource pool.</text><text x="64" y="181" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A hypothetical workspace with capacity-limited bookings.</text><rect x="64" y="252" width="1472" height="120" rx="22" fill="#DCEDE8"/><text x="94" y="277" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#176E69">30 members share 10 workstations.</text><text x="94" y="332" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Customers book available capacity rather than keeping a dedicated desk.</text><rect x="94" y="409" width="23" height="23" rx="4" fill="#176E69"/><text x="131" y="406" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Allocated</text><rect x="320" y="409" width="23" height="23" rx="4" fill="#DCEDE8"/><text x="357" y="406" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Available</text><text x="690" y="406" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Each square = one workstation</text><rect x="64" y="477" width="1472" height="139" rx="22" fill="#FFFFFF"/><text x="94" y="521" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">09:00</text><rect x="350" y="522" width="46" height="46" rx="7" fill="#176E69"/><rect x="407" y="522" width="46" height="46" rx="7" fill="#176E69"/><rect x="464" y="522" width="46" height="46" rx="7" fill="#176E69"/><rect x="521" y="522" width="46" height="46" rx="7" fill="#176E69"/><rect x="578" y="522" width="46" height="46" rx="7" fill="#176E69"/><rect x="635" y="522" width="46" height="46" rx="7" fill="#176E69"/><rect x="692" y="522" width="46" height="46" rx="7" fill="#DCEDE8"/><rect x="749" y="522" width="46" height="46" rx="7" fill="#DCEDE8"/><rect x="806" y="522" width="46" height="46" rx="7" fill="#DCEDE8"/><rect x="863" y="522" width="46" height="46" rx="7" fill="#DCEDE8"/><text x="979" y="511" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">6 requests → 6 allocated</text><text x="979" y="562" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">4 places remain</text><rect x="64" y="648" width="1472" height="139" rx="22" fill="#FFFFFF"/><text x="94" y="692" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">13:00</text><rect x="350" y="693" width="46" height="46" rx="7" fill="#176E69"/><rect x="407" y="693" width="46" height="46" rx="7" fill="#176E69"/><rect x="464" y="693" width="46" height="46" rx="7" fill="#176E69"/><rect x="521" y="693" width="46" height="46" rx="7" fill="#176E69"/><rect x="578" y="693" width="46" height="46" rx="7" fill="#176E69"/><rect x="635" y="693" width="46" height="46" rx="7" fill="#176E69"/><rect x="692" y="693" width="46" height="46" rx="7" fill="#176E69"/><rect x="749" y="693" width="46" height="46" rx="7" fill="#176E69"/><rect x="806" y="693" width="46" height="46" rx="7" fill="#DCEDE8"/><rect x="863" y="693" width="46" height="46" rx="7" fill="#DCEDE8"/><text x="979" y="682" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">8 requests → 8 allocated</text><text x="979" y="733" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">2 places remain</text><rect x="64" y="819" width="1472" height="139" rx="22" fill="#FFFFFF"/><text x="94" y="863" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">17:00</text><rect x="350" y="864" width="46" height="46" rx="7" fill="#176E69"/><rect x="407" y="864" width="46" height="46" rx="7" fill="#176E69"/><rect x="464" y="864" width="46" height="46" rx="7" fill="#176E69"/><rect x="521" y="864" width="46" height="46" rx="7" fill="#176E69"/><rect x="578" y="864" width="46" height="46" rx="7" fill="#176E69"/><rect x="635" y="864" width="46" height="46" rx="7" fill="#176E69"/><rect x="692" y="864" width="46" height="46" rx="7" fill="#176E69"/><rect x="749" y="864" width="46" height="46" rx="7" fill="#176E69"/><rect x="806" y="864" width="46" height="46" rx="7" fill="#176E69"/><rect x="863" y="864" width="46" height="46" rx="7" fill="#176E69"/><text x="979" y="853" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">12 requests → 10 allocated</text><text x="979" y="904" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">2 requests need another option</text><text x="64" y="1005" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Membership does not provide a dedicated place at every moment.</text><text x="64" y="1060" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative demand and capacity, not company data or a recommended member-to-desk ratio.</text><text x="64" y="1105" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Booking, capacity, and fallback rules define the service promise.</text></svg>