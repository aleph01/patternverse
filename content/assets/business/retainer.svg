<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc"><title id="title">Retainer: reserve capacity before the work arrives</title><desc id="desc">Hypothetical capacity retainer: fifteen hundred dollars per month reserves ten hours of eligible work. Extra work requires approval and costs one hundred eighty dollars per hour. A quiet month with six hours costs fifteen hundred dollars; a month with ten hours also costs fifteen hundred dollars; a surge month with fourteen hours costs two thousand two hundred twenty dollars including four extra hours. Unused hours expire in this illustrative agreement. Other retainers may pay for availability or an ongoing scope instead of hours.</desc><rect width="1600" height="1150" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">RETAINER</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Reserve capacity before the work arrives.</text><text x="64" y="188" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">One illustrative capacity retainer; other forms pay for access or an ongoing scope.</text><rect x="64" y="267" width="1472" height="153" rx="22" fill="#176E69"/><text x="94" y="297" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#FFFFFF">$1,500/month reserves 10 hours of eligible work.</text><text x="94" y="357" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">Approved extra work: $180/hour. Unused hours expire in this example.</text><rect x="64" y="479" width="464" height="324" rx="22" fill="#FFFFFF"/><text x="90" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Quiet month</text><text x="90" y="576" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#52646D">6 hours used</text><text x="90" y="640" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#176E69">$1,500</text><text x="90" y="725" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Reserved fee still applies.</text><rect x="568" y="479" width="464" height="324" rx="22" fill="#FFFFFF"/><text x="594" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Standard month</text><text x="594" y="576" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#52646D">10 hours used</text><text x="594" y="640" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#176E69">$1,500</text><text x="594" y="725" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Within the allowance.</text><rect x="1072" y="479" width="464" height="324" rx="22" fill="#FFFFFF"/><text x="1098" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Surge month</text><text x="1098" y="576" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#52646D">14 hours used</text><text x="1098" y="640" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#176E69">$2,220</text><text x="1098" y="725" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Includes 4 approved extra hours.</text><rect x="64" y="854" width="1472" height="124" rx="18" fill="#DCEDE8"/><text x="94" y="885" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#176E69">The fee secures a commitment; actual demand can vary.</text><text x="94" y="936" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Scope, availability, scheduling, and overages need explicit terms.</text><text x="64" y="1035" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Hypothetical prices and workload, not company rates. Excludes taxes and other charges.</text><text x="64" y="1081" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Rollover, refunds, and additional fees depend on the particular agreement.</text></svg>