<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Crowdfunding: many contributions fund one undertaking</title><desc id="desc">Many supporters contribute to a campaign with an offer, a target, and funding rules. Subject to those rules, money is collected to fund a project or business. Four common forms differ in what supporters receive: rewards, equity, loan repayments, or no financial return for donations. Funding does not guarantee delivery or investment returns.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CROWDFUNDING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183343">Many contributions. One funded undertaking.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">The funding mechanism is shared. What supporters receive depends on the offer.</text><rect x="64" y="263" width="440" height="217" rx="22" fill="#FFFFFF"/><text x="89" y="293" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">MANY SUPPORTERS</text><text x="89" y="353" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Contribute amounts</text><text x="89" y="405" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">toward a shared goal.</text><rect x="580" y="263" width="440" height="217" rx="22" fill="#FFFFFF"/><text x="605" y="293" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CAMPAIGN</text><text x="605" y="353" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Explains the offer,</text><text x="605" y="405" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">target, and funding rules.</text><rect x="1096" y="263" width="440" height="217" rx="22" fill="#FFFFFF"/><text x="1121" y="293" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PROJECT OR BUSINESS</text><text x="1121" y="353" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Uses collected funds</text><text x="1121" y="405" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">and fulfils its obligations.</text><line x1="520" y1="373" x2="564" y2="373" stroke="#176E69" stroke-width="5"/><polygon points="564,373 549,364 549,382" fill="#176E69"/><line x1="1036" y1="373" x2="1080" y2="373" stroke="#176E69" stroke-width="5"/><polygon points="1080,373 1065,364 1065,382" fill="#176E69"/><text x="64" y="531" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">FOUR COMMON FORMS</text><rect x="64" y="590" width="716" height="178" rx="22" fill="#DCEDE8"/><text x="89" y="614" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">REWARDS</text><text x="89" y="665" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">A product, service, or other reward.</text><text x="89" y="717" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">No ownership stake from the pledge.</text><rect x="820" y="590" width="716" height="178" rx="22" fill="#E6E9E9"/><text x="845" y="614" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">EQUITY</text><text x="845" y="665" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">An ownership stake in the business.</text><text x="845" y="717" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Returns depend on its future and the terms.</text><rect x="64" y="804" width="716" height="178" rx="22" fill="#DCEDE8"/><text x="89" y="828" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">LENDING</text><text x="89" y="879" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Contractual repayments of a loan.</text><text x="89" y="931" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Interest may apply; repayment can fail.</text><rect x="820" y="804" width="716" height="178" rx="22" fill="#E6E9E9"/><text x="845" y="828" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">DONATIONS</text><text x="845" y="879" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Support for a project or cause.</text><text x="845" y="931" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">No financial return is promised.</text><text x="64" y="1030" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Funding rules vary by campaign and platform.</text><text x="64" y="1081" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Reaching a target does not guarantee delivery, repayment, or investment returns.</text></svg>