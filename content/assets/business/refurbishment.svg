<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Refurbishment: restore a product to a declared standard</title><desc id="desc">Used, returned, or off-lease products are inspected and selected for refurbishment. Suitable units are cleaned, repaired, renewed, or updated as appropriate to a defined target. The complete product is tested, its condition is graded and disclosed, and it is supplied with agreed support for another period of use. Unsuitable units follow a separate recovery route. Refurbishment does not universally mean every part is new or every product is cosmetically perfect.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">REFURBISHMENT</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Restore a product to a declared standard.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Prepare used, returned, or off-lease products for another period of useful service.</text><rect x="64" y="300" width="440" height="310" rx="22" fill="#FFFFFF"/><text x="88" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">ASSESS</text><text x="88" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Select suitable units</text><text x="88" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Inspect condition, estimate</text><text x="88" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">the work, and define a</text><text x="88" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">restoration target.</text><rect x="580" y="300" width="440" height="310" rx="22" fill="#DCEDE8"/><text x="604" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">RESTORE</text><text x="604" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Renew where needed</text><text x="604" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Clean, repair, or replace;</text><text x="604" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">update where appropriate;</text><text x="604" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">renew appearance as agreed.</text><rect x="1096" y="300" width="440" height="310" rx="22" fill="#FFFFFF"/><text x="1120" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">VERIFY</text><text x="1120" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Test, grade, and supply</text><text x="1120" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Check the complete product.</text><text x="1120" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Describe function and wear;</text><text x="1120" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">provide the agreed support.</text><line x1="521" y1="452" x2="563" y2="452" stroke="#176E69" stroke-width="5"/><polygon points="563,452 548,443 548,461" fill="#176E69"/><line x1="1037" y1="452" x2="1079" y2="452" stroke="#176E69" stroke-width="5"/><polygon points="1079,452 1064,443 1064,461" fill="#176E69"/><polyline points="284,630 284,690 563,690" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="563,690 547.0,681.0 547.0,699.0" fill="#176E69"/><text x="587" y="675" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Unsuitable units follow a separate recovery route.</text><text x="64" y="788" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">MAKE THREE THINGS CLEAR</text><rect x="64" y="840" width="440" height="191" rx="22" fill="#DCEDE8"/><text x="88" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Working standard</text><text x="88" y="929" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Which functions and parts</text><text x="88" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">are tested or renewed.</text><rect x="580" y="840" width="440" height="191" rx="22" fill="#DCEDE8"/><text x="604" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Honest grading</text><text x="604" y="929" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">What wear remains and</text><text x="604" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">how appearance is described.</text><rect x="1096" y="840" width="440" height="191" rx="22" fill="#DCEDE8"/><text x="1120" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Support promise</text><text x="1120" y="929" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">What warranty, returns,</text><text x="1120" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">or service is included.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">The work, acceptance tests, and support define the offering behind the label.</text></svg>