<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Embedded Finance: put financial services inside the existing workflow</title><desc id="desc">A customer is using a product to run a business, make a purchase or book a trip. The platform integrates a relevant financial feature such as payments, an account, financing or insurance. An authorized financial provider or appropriately authorized affiliate performs its assigned financial-service activities. The diagram shows service relationships rather than the route of money. The arrangement must define responsibilities, customer terms and ongoing support.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">EMBEDDED FINANCE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183343">Put finance where the customer is working.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Integrate a relevant financial service into a product people already use.</text><rect x="64" y="300" width="440" height="330" rx="22" fill="#FFFFFF"/><text x="88" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CUSTOMER</text><text x="88" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">A task to complete</text><text x="88" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Run a business, buy an item,</text><text x="88" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">book a trip, or receive</text><text x="88" y="560" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">earnings from work.</text><rect x="580" y="300" width="440" height="330" rx="22" fill="#DCEDE8"/><text x="604" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">EXISTING PLATFORM</text><text x="604" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">A financial feature</text><text x="604" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Payments, an account, credit,</text><text x="604" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">or insurance integrated into</text><text x="604" y="560" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">the customer’s workflow.</text><rect x="1096" y="300" width="440" height="330" rx="22" fill="#FFFFFF"/><text x="1120" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">FINANCIAL PROVIDER</text><text x="1120" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Defined responsibilities</text><text x="1120" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Provides the financial service</text><text x="1120" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and performs the activities</text><text x="1120" y="560" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">assigned under the model.</text><line x1="521" y1="465" x2="563" y2="465" stroke="#176E69" stroke-width="5"/><polygon points="563,465 548,456 548,474" fill="#176E69"/><line x1="1037" y1="465" x2="1079" y2="465" stroke="#176E69" stroke-width="5"/><polygon points="1079,465 1064,456 1064,474" fill="#176E69"/><text x="64" y="690" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">The customer encounters the financial option in the context of an existing task.</text><text x="64" y="747" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Arrows show service connections. Money can follow a different route.</text><rect x="64" y="840" width="440" height="191" rx="22" fill="#DCEDE8"/><text x="88" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CONTEXT</text><text x="88" y="928" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Offer the service when</text><text x="88" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">the need is relevant.</text><rect x="580" y="840" width="440" height="191" rx="22" fill="#DCEDE8"/><text x="604" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">AUTHORIZATION</text><text x="604" y="928" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Use appropriately authorized</text><text x="604" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">providers or group entities.</text><rect x="1096" y="840" width="440" height="191" rx="22" fill="#DCEDE8"/><text x="1120" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CONTINUING SERVICE</text><text x="1120" y="928" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Make terms, responsibilities,</text><text x="1120" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and support routes clear.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Integration changes access and distribution; it does not remove financial obligations.</text></svg>