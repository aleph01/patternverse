<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">Blended Value: one business, a wider view of value</title><desc id="desc">One business model creates linked financial, social and environmental effects. Financial performance includes revenue, margins and cash flow. Social performance concerns work, access and wellbeing. Environmental performance concerns materials, waste and emissions. Measure benefits and harms, consider who gains and who bears costs, and make tradeoffs explicit.</desc><rect width="1600" height="1040" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">BLENDED VALUE</text><text x="64" y="109" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">One business. A wider view of value.</text><text x="64" y="186" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Design and assess financial, social, and environmental effects together.</text><rect x="340" y="281" width="920" height="145" rx="22" fill="#176E69"/><text x="375" y="310" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#FFFFFF">One business model</text><text x="375" y="371" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">What you sell, source, make, and support</text><polyline points="800,426 800,478" fill="none" stroke="#176E69" stroke-width="4"/><polyline points="296,478 1304,478" fill="none" stroke="#176E69" stroke-width="4"/><polyline points="296,478 296,523" fill="none" stroke="#176E69" stroke-width="4"/><path d="M296 533l-10 -14h20z" fill="#176E69"/><polyline points="800,478 800,523" fill="none" stroke="#176E69" stroke-width="4"/><path d="M800 533l-10 -14h20z" fill="#176E69"/><polyline points="1304,478 1304,523" fill="none" stroke="#176E69" stroke-width="4"/><path d="M1304 533l-10 -14h20z" fill="#176E69"/><rect x="64" y="552" width="464" height="191" rx="22" fill="#DCEDE8"/><text x="90" y="579" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#176E69">Financial</text><text x="90" y="641" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Revenue and margins</text><text x="90" y="680" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Cash flow and viability</text><rect x="568" y="552" width="464" height="191" rx="22" fill="#DCEDE8"/><text x="594" y="579" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#176E69">Social</text><text x="594" y="641" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Work and access</text><text x="594" y="680" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Health and wellbeing</text><rect x="1072" y="552" width="464" height="191" rx="22" fill="#DCEDE8"/><text x="1098" y="579" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#176E69">Environmental</text><text x="1098" y="641" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Materials and waste</text><text x="1098" y="680" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Energy and emissions</text><text x="64" y="785" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#52646D">THREE LINKED DIMENSIONS OF PERFORMANCE</text><rect x="64" y="839" width="1472" height="116" rx="16" fill="#FFFFFF"/><text x="88" y="861" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Measure benefits and harms. Make tradeoffs explicit.</text><text x="88" y="914" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Ask who gains, who bears the costs, and what changes over time.</text><text x="64" y="997" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">A gain in one dimension does not erase harm in another.</text></svg>