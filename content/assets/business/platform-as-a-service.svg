<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Platform as a Service: deploy applications on a managed platform</title><desc id="desc">In a typical Platform as a Service arrangement, the customer manages application code and dependencies, application configuration, data decisions, and access settings. The provider operates a managed application platform, including runtime services, deployment mechanisms, platform maintenance, and underlying infrastructure. The application is deployed to that environment. Exact responsibilities, including custom-container maintenance, vary by service and configuration.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PLATFORM AS A SERVICE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Deploy apps on a managed platform.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Keep control of your application while the provider operates the platform beneath it.</text><rect x="64" y="270" width="1472" height="245" rx="22" fill="#FFFFFF"/><text x="96" y="303" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">CUSTOMER MANAGES</text><text x="96" y="365" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#183343">Application behavior and configuration</text><text x="96" y="443" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#52646D">Code, application dependencies, data decisions, and access settings</text><polyline points="800,536 800,611" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="800,611 809.0,595.0 791.0,595.0" fill="#176E69"/><text x="849" y="554" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Deploy to the managed environment</text><rect x="64" y="635" width="1472" height="292" rx="22" fill="#DCEDE8"/><text x="96" y="668" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">PROVIDER OPERATES</text><text x="96" y="730" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#183343">Application platform and infrastructure</text><text x="96" y="805" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#52646D">Runtime services, deployment mechanisms, and platform maintenance</text><text x="96" y="867" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#52646D">Underlying servers, network hardware, and datacenter facilities</text><rect x="64" y="971" width="1472" height="91" rx="22" fill="#FFFFFF"/><text x="96" y="1001" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">The customer buys a place to run an application, rather than a finished app.</text><text x="64" y="1101" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Typical division. Responsibilities vary by service, configuration, and custom-container use.</text></svg>