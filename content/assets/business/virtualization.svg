<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Virtualization: provide the function through software</title><desc id="desc">Three illustrative applications show a physical arrangement replaced or supplemented by a virtual implementation. A meeting room becomes a virtual meeting for remote collaboration; dedicated hardware becomes a virtual server whose capacity can be provisioned through software; a physical test rig is supplemented by a simulated system for exploring selected scenarios earlier. Physical infrastructure still exists. Access, allocation, or interaction changes, and simulations require appropriate validation.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">VIRTUALIZATION</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Provide the function through software.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Change how people access, configure, or interact with a useful capability.</text><text x="64" y="278" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PHYSICAL ARRANGEMENT</text><text x="580" y="278" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">VIRTUAL IMPLEMENTATION</text><text x="1096" y="278" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CUSTOMER VALUE</text><rect x="64" y="335" width="440" height="155" rx="22" fill="#FFFFFF"/><rect x="580" y="335" width="440" height="155" rx="22" fill="#DCEDE8"/><rect x="1096" y="335" 