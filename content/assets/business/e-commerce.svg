<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">E-Commerce: connect digital ordering with fulfilment</title><desc id="desc">Illustrative e-commerce journey. A customer selects an offering, places an order electronically, and receives goods or services. Fulfilment may involve shipping, store collection, or digital access. Availability information, payment arrangements, order processing, and service support the journey. Electronic ordering defines the channel; payment and delivery need not happen online, and inventory ownership and revenue models can vary.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">E-COMMERCE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Connect digital ordering with fulfilment.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Illustrative journey: customers order electronically; delivery can take different forms.</text><rect x="64" y="282" width="430" height="246" rx="22" fill="#FFFFFF"/><text x="91" y="313" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">SELECT</text><text x="91" y="385" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Find the right offering</text><text x="91" y="469" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Search · compare · configure</text><rect x="585" y="282" width="430" height="246" rx="22" fill="#176E69"/><text x="612" y="313" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">ORDER</text><text x="612" y="385" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Place the order</text><text x="612" y="469" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#FFFFFF">Confirm items and terms</text><rect x="1106" y="282" width="430" height="246" rx="22" fill="#FFFFFF"/><text x="1133" y="313" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">RECEIVE</text><text x="1133" y="385" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Get the offering</text><text x="1133" y="469" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Delivery, collection, or access</text><line x1="507" y1="405" x2="572" y2="405" stroke="#176E69" stroke-width="5"/><polygon points="572,405 557,396 557,414" fill="#176E69"/><line x1="1028" y1="405" x2="1093" y2="405" stroke="#176E69" stroke-width="5"/><polygon points="1093,405 1078,396 1078,414" fill="#176E69"/><text x="64" y="582" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">EXAMPLES OF FULFILMENT</text><rect x="64" y="637" width="430" height="142" rx="22" fill="#DCEDE8"/><text x="91" y="665" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">SHIP</text><text x="91" y="728" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#183343">Deliver physical goods</text><rect x="585" y="637" width="430" height="142" rx="22" fill="#DCEDE8"/><text x="612" y="665" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">COLLECT</text><text x="612" y="728" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#183343">Pick up at a store or location</text><rect x="1106" y="637" width="430" height="142" rx="22" fill="#DCEDE8"/><text x="1133" y="665" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">DIGITAL ACCESS</text><text x="1133" y="728" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#183343">Download, activate, or stream</text><rect x="64" y="833" width="1472" height="155" rx="22" fill="#FFFFFF"/><text x="91" y="858" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">THE OPERATING SYSTEM BEHIND THE ORDER</text><text x="91" y="914" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Availability · payment arrangements · order processing · service</text><text x="64" y="1039" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Payment and delivery need not happen online.</text><text x="64" y="1090" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">The ordering channel does not determine who owns inventory or how the business earns revenue.</text></svg>