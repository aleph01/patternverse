<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Shared Savings: split an agreed, verified cost reduction</title><desc id="desc">Hypothetical annual example. An adjusted baseline of one million dollars minus actual comparable operating costs of eight hundred thousand dollars yields two hundred thousand dollars in eligible savings before the provider fee. The provider receives forty percent, or eighty thousand dollars, and the customer retains sixty percent, or one hundred twenty thousand dollars, before any separately charged project or financing costs. The baseline uses comparable demand, prices, scope, and service quality. Provider revenue is not provider profit.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">SHARED SAVINGS</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183343">Earn a share of the cost reduction you create.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Agree the baseline and quality requirements before changing the operation.</text><rect x="64" y="265" width="716" height="260" rx="22" fill="#FFFFFF"/><text x="90" y="291" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">ADJUSTED ANNUAL BASELINE</text><text x="90" y="345" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="53" font-weight="700" fill="#183343">$1,000,000</text><text x="90" y="427" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Agreed cost without the improvement,</text><text x="90" y="471" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">adjusted for relevant conditions</text><rect x="820" y="265" width="716" height="260" rx="22" fill="#FFFFFF"/><text x="846" y="291" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">ACTUAL COMPARABLE COST</text><text x="846" y="345" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="53" font-weight="700" fill="#183343">$800,000</text><text x="846" y="427" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Operating cost after the improvement,</text><text x="846" y="471" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">before the provider’s savings fee</text><rect x="64" y="567" width="1472" height="151" rx="22" fill="#DCEDE8"/><text x="94" y="593" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#176E69">$1,000,000 − $800,000 = $200,000 eligible savings</text><text x="94" y="662" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Verified under the agreed rules, while required service quality is maintained.</text><rect x="64" y="762" width="716" height="207" rx="22" fill="#FFFFFF"/><text x="90" y="787" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">PROVIDER SHARE</text><text x="90" y="838" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">$80,000</text><text x="90" y="915" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">40% of eligible savings</text><rect x="820" y="762" width="716" height="207" rx="22" fill="#176E69"/><text x="846" y="787" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">CUSTOMER RETAINS</text><text x="846" y="838" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">$120,000</text><text x="846" y="915" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">60% of eligible savings</text><text x="64" y="1009" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Hypothetical annual figures, not company data. The split is illustrative.</text><text x="64" y="1053" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Customer retention is before separately charged project or financing costs.</text><text x="64" y="1097" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">The provider’s share is revenue, from which its own costs must be paid.</text></svg>