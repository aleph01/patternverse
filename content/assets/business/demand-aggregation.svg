<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Demand Aggregation: combine small purchases into a larger commitment</title><desc id="desc">Hypothetical group purchase of identical boxes. Twenty businesses each need ten boxes. An organizer combines the demand into a two hundred box order and negotiates a supplier price of forty dollars per box. Adding a two dollar organizer fee gives a buyer price of forty-two dollars per box, compared with an available individual price of fifty dollars. Each buyer saves eighty dollars on ten boxes, with sixteen hundred dollars saved across the group. Taxes and delivery are excluded. Savings depend on actual commitments and equivalent specifications.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">DEMAND AGGREGATION / GROUP BUYING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183343">Small purchases. One larger commitment.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Hypothetical purchase: identical products, coordinated timing, agreed quantities.</text><rect x="64" y="263" width="440" height="217" rx="22" fill="#FFFFFF"/><text x="89" y="293" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">BUYERS</text><text x="89" y="353" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">20 businesses</text><text x="89" y="413" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Each needs 10 boxes.</text><rect x="580" y="263" width="440" height="217" rx="22" fill="#FFFFFF"/><text x="605" y="293" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">ORGANIZER</text><text x="605" y="353" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">200 boxes together</text><text x="605" y="413" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Combines and negotiates.</text><rect x="1096" y="263" width="440" height="217" rx="22" fill="#FFFFFF"/><text x="1121" y="293" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">SUPPLIER</text><text x="1121" y="353" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Offers $40 per box</text><text x="1121" y="413" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">For the combined order.</text><line x1="520" y1="373" x2="564" y2="373" stroke="#176E69" stroke-width="5"/><polygon points="564,373 549,364 549,382" fill="#176E69"/><line x1="1036" y1="373" x2="1080" y2="373" stroke="#176E69" stroke-width="5"/><polygon points="1080,373 1065,364 1065,382" fill="#176E69"/><rect x="64" y="530" width="1472" height="146" rx="22" fill="#176E69"/><text x="94" y="558" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#FFFFFF">Buyer price: $40 supplier price + $2 organizer fee = $42 per box</text><text x="94" y="620" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">Available individual price: $50 per box. Group saving after the fee: $8 per box.</text><rect x="64" y="729" width="716" height="205" rx="22" fill="#DCEDE8"/><text x="90" y="756" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">EACH BUYER SAVES</text><text x="90" y="805" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#183343">$80</text><text x="90" y="883" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">10 boxes × $8 saving.</text><rect x="820" y="729" width="716" height="205" rx="22" fill="#DCEDE8"/><text x="846" y="756" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">THE GROUP SAVES</text><text x="846" y="805" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#183343">$1,600</text><text x="846" y="883" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">200 boxes × $8 saving.</text><text x="64" y="984" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">The group must turn interest into purchases the supplier can rely on.</text><text x="64" y="1043" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Illustrative figures, not company data. Taxes and delivery excluded from both prices.</text><text x="64" y="1086" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Compare equivalent products and total costs. More volume does not guarantee savings.</text></svg>