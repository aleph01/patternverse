<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Orchestrator: coordinate independent specialists</title><desc id="desc">A core orchestrator defines an offering and coordinates independent component, production, fulfilment, and service partners. Customers receive a combined offering and send demand and feedback. Connecting lines represent coordination, not ownership or the physical route of goods.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">ORCHESTRATOR</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Coordinate the whole. Specialize in the core.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Combine independent specialists into one coherent offering.</text><rect x="240" y="282" width="640" height="223" rx="22" fill="#176E69"/><text x="273" y="311" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">ORCHESTRATOR</text><text x="273" y="365" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Core expertise + coordination</text><text x="273" y="427" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">Design • standards • schedules • exceptions</text><rect x="1160" y="282" width="376" height="223" rx="22" fill="#FFFFFF"/><text x="1190" y="313" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#176E69">CUSTOMER</text><text x="1190" y="373" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Receives the</text><text x="1190" y="415" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">combined offering</text><polyline points="900,347 1140,347" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1140,347 1124.0,338.0 1124.0,356.0" fill="#176E69"/><text x="910" y="307" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">Offering</text><polyline points="1140,451 900,451" fill="none" stroke="#52646D" stroke-width="5"/><polygon points="900,451 916.0,460.0 916.0,442.0" fill="#52646D"/><text x="906" y="470" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#52646D">Demand + feedback</text><polyline points="560,505 560,586" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="560,586 569.0,570.0 551.0,570.0" fill="#176E69"/><line x1="236" y1="586" x2="1362" y2="586" stroke="#176E69" stroke-width="5"/><polyline points="236,586 236,677" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="236,677 245.0,661.0 227.0,661.0" fill="#176E69"/><polyline points="611,586 611,677" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="611,677 620.0,661.0 602.0,661.0" fill="#176E69"/><polyline points="986,586 986,677" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="986,677 995.0,661.0 977.0,661.0" fill="#176E69"/><polyline points="1361,586 1361,677" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1361,677 1370.0,661.0 1352.0,661.0" fill="#176E69"/><text x="64" y="543" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">INDEPENDENT PARTNERS</text><rect x="64" y="692" width="347" height="190" rx="22" fill="#FFFFFF"/><text x="89" y="723" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Components</text><text x="89" y="783" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Specialist inputs</text><text x="89" y="824" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and materials</text><rect x="439" y="692" width="347" height="190" rx="22" fill="#FFFFFF"/><text x="464" y="723" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Production</text><text x="464" y="783" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Manufacturing</text><text x="464" y="824" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and assembly</text><rect x="814" y="692" width="347" height="190" rx="22" fill="#FFFFFF"/><text x="839" y="723" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Fulfilment</text><text x="839" y="783" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Storage, transport,</text><text x="839" y="824" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and delivery</text><rect x="1189" y="692" width="347" height="190" rx="22" fill="#FFFFFF"/><text x="1214" y="723" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Service</text><text x="1214" y="783" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Installation, support,</text><text x="1214" y="824" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">or maintenance</text><rect x="64" y="932" width="1472" height="115" rx="22" fill="#DCEDE8"/><text x="91" y="957" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">The value lies in making the pieces work together.</text><text x="91" y="1007" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Partner selection, shared information, incentives, and quality control remain essential.</text><text x="64" y="1095" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative network. Links show coordination, not ownership or the physical route of goods.</text></svg>