<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Patent Pool and Collective Licensing: many rights holders, one licensing route</title><desc id="desc">Three rights holders authorize a pool or collective administrator to license specified rights to several licensees. The administrator defines coverage, licenses uses, collects payments, and allocates receipts under agreed rules. A collective route covers only the specified rights, uses, territories, and terms. Patent pools and copyright collecting organizations have different legal arrangements; this diagram illustrates their shared coordination mechanism.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PATENT POOL / COLLECTIVE LICENSING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Many rights holders. One licensing route.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Coordinate permissions and payments through a shared licensing mechanism.</text><rect x="64" y="290" width="340" height="140" rx="22" fill="#FFFFFF"/><text x="86" y="315" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">RIGHTS HOLDER A</text><text x="86" y="375" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Authorizes covered rights</text><rect x="64" y="480" width="340" height="140" rx="22" fill="#FFFFFF"/><text x="86" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">RIGHTS HOLDER B</text><text x="86" y="565" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Authorizes covered rights</text><rect x="64" y="670" width="340" height="140" rx="22" fill="#FFFFFF"/><text x="86" y="695" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">RIGHTS HOLDER C</text><text x="86" y="755" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Authorizes covered rights</text><rect x="1196" y="290" width="340" height="140" rx="22" fill="#FFFFFF"/><text x="1220" y="315" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">LICENSEE 1</text><text x="1220" y="375" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Uses covered rights</text><rect x="1196" y="480" width="340" height="140" rx="22" fill="#FFFFFF"/><text x="1220" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">LICENSEE 2</text><text x="1220" y="565" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Uses covered rights</text><rect x="1196" y="670" width="340" height="140" rx="22" fill="#FFFFFF"/><text x="1220" y="695" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">LICENSEE 3</text><text x="1220" y="755" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Uses covered rights</text><rect x="570" y="405" width="460" height="290" rx="22" fill="#DCEDE8"/><text x="598" y="438" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">POOL / ADMINISTRATOR</text><text x="598" y="499" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Defines coverage</text><text x="598" y="565" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#52646D">Licenses, collects,</text><text x="598" y="612" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#52646D">and allocates receipts</text><polyline points="426,360 490,360 490,550 548,550" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="548,550 532.0,541.0 532.0,559.0" fill="#176E69"/><polyline points="1052,550 1112,550 1112,360 1174,360" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1174,360 1158.0,351.0 1158.0,369.0" fill="#176E69"/><polyline points="426,550 490,550 490,550 548,550" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="548,550 532.0,541.0 532.0,559.0" fill="#176E69"/><polyline points="1052,550 1112,550 1112,550 1174,550" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1174,550 1158.0,541.0 1158.0,559.0" fill="#176E69"/><polyline points="426,740 490,740 490,550 548,550" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="548,550 532.0,541.0 532.0,559.0" fill="#176E69"/><polyline points="1052,550 1112,550 1112,740 1174,740" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1174,740 1158.0,731.0 1158.0,749.0" fill="#176E69"/><rect x="64" y="870" width="1472" height="169" rx="22" fill="#FFFFFF"/><text x="94" y="900" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">COVERAGE HAS BOUNDARIES</text><text x="94" y="958" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Only specified rights, uses, territories, and terms are covered.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Payments collected from licensees are allocated under agreed rules. Structures vary.</text></svg>