<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Contribute-to-Benchmark: share a contribution, receive useful context</title><desc id="desc">An organization and its peers contribute defined measures and context to a shared benchmarking service. The service validates and standardizes contributions, creates suitable peer groups, and returns comparisons such as the participant result, peer median, range, and trend. Repeated contributions can refresh the comparison. Useful benchmarking depends on consistent definitions, comparable cohorts, and appropriate reporting controls. A performance gap does not prove its cause or attainable savings.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CONTRIBUTE-TO-BENCHMARK</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Contribute data. Receive useful context.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Participants help build the reference they use to understand their own performance.</text><rect x="64" y="300" width="440" height="294" rx="22" fill="#FFFFFF"/><text x="88" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">YOU AND PEERS</text><text x="88" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Contribute measures</text><text x="88" y="458" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Defined metrics and</text><text x="88" y="503" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">context such as size,</text><text x="88" y="548" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">sector, and period</text><rect x="580" y="300" width="440" height="294" rx="22" fill="#DCEDE8"/><text x="604" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">SHARED SERVICE</text><text x="604" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Build peer groups</text><text x="604" y="458" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Check and standardize</text><text x="604" y="503" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">contributions; create</text><text x="604" y="548" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">suitable comparisons</text><rect x="1096" y="300" width="440" height="294" rx="22" fill="#FFFFFF"/><text x="1120" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">PARTICIPANT REPORT</text><text x="1120" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">See where you stand</text><text x="1120" y="458" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Your result alongside</text><text x="1120" y="503" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">a peer median, range,</text><text x="1120" y="548" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">or performance trend</text><line x1="521" y1="443" x2="563" y2="443" stroke="#176E69" stroke-width="5"/><polygon points="563,443 548,434 548,452" fill="#176E69"/><line x1="1037" y1="443" x2="1079" y2="443" stroke="#176E69" stroke-width="5"/><polygon points="1079,443 1064,434 1064,452" fill="#176E69"/><polyline points="1316,617 1316,696 284,696 284,617" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="284,617 275.0,633.0 293.0,633.0" fill="#176E69"/><text x="435" y="634" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176E69">Refresh contributions and comparisons over time</text><text x="64" y="754" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">WHAT MAKES THE COMPARISON USEFUL</text><rect x="64" y="807" width="440" height="208" rx="22" fill="#DCEDE8"/><text x="88" y="838" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Same definitions</text><text x="88" y="907" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Comparable measures,</text><text x="88" y="954" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">units, and time periods</text><rect x="580" y="807" width="440" height="208" rx="22" fill="#DCEDE8"/><text x="604" y="838" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Relevant peers</text><text x="604" y="907" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Account for differences</text><text x="604" y="954" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">in scale and operating context</text><rect x="1096" y="807" width="440" height="208" rx="22" fill="#DCEDE8"/><text x="1120" y="838" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Protected outputs</text><text x="1120" y="907" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Reporting controls for</text><text x="1120" y="954" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">confidential contributions</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">A performance gap identifies something to investigate; it does not establish the cause.</text></svg>