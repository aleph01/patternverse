<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc"><title id="title">Rent instead of Buy: one asset serves successive customers</title><desc id="desc">A hypothetical rental business retains ownership of an asset. Customer A rents it for three days at fifty dollars per day, generating one hundred fifty dollars. The asset is returned, inspected, cleaned, and serviced before Customer B rents it for two days at fifty dollars per day, generating one hundred dollars. Total rental revenue is two hundred fifty dollars before acquisition, financing, servicing, logistics, idle time, losses, and other costs.</desc><rect width="1600" height="1130" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">RENT INSTEAD OF BUY</text><text x="64" y="102" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">One asset. Successive rental periods.</text><text x="64" y="181" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Customers pay for temporary use; the provider retains ownership.</text><rect x="64" y="273" width="464" height="321" rx="22" fill="#FFFFFF"/><text x="91" y="305" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Customer A</text><text x="91" y="386" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="400" fill="#183343">3 days × $50</text><text x="91" y="453" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#176E69">$150 revenue</text><text x="91" y="520" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Return at the agreed time.</text><rect x="568" y="273" width="464" height="321" rx="22" fill="#FFFFFF"/><text x="595" y="305" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Return &amp; prepare</text><text x="595" y="386" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#183343">Inspect, clean, service</text><text x="595" y="453" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#176E69">Ready for the next rental</text><text x="595" y="520" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Allow time between bookings.</text><rect x="1072" y="273" width="464" height="321" rx="22" fill="#FFFFFF"/><text x="1099" y="305" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Customer B</text><text x="1099" y="386" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="400" fill="#183343">2 days × $50</text><text x="1099" y="453" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#176E69">$100 revenue</text><text x="1099" y="520" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Return at the agreed time.</text><line x1="538" y1="435" x2="558" y2="435" stroke="#176E69" stroke-width="5"/><polygon points="558,435 543,426 543,444" fill="#176E69"/><line x1="1042" y1="435" x2="1062" y2="435" stroke="#176E69" stroke-width="5"/><polygon points="1062,435 1047,426 1047,444" fill="#176E69"/><rect x="64" y="642" width="1472" height="140" rx="22" fill="#DCEDE8"/><text x="94" y="671" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#176E69">Ownership remains with the provider across rentals.</text><text x="94" y="731" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Its condition, availability, and eventual resale value still matter.</text><rect x="64" y="828" width="1472" height="143" rx="22" fill="#176E69"/><text x="94" y="855" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">$150 + $100 = $250 rental revenue</text><text x="94" y="920" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">Revenue across bookings must support the asset’s full costs.</text><text x="64" y="1012" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Costs include acquisition, financing, servicing, logistics, idle time, and losses.</text><text x="64" y="1062" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Hypothetical rates and bookings, not company data or a profitability forecast.</text></svg>