<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Per-Seat Pricing</title><desc id="desc">In a fictional service, 500 billable seats at 20 dollars per month produce 10,000 dollars in monthly revenue. Define entitlement, user counting, role changes, and billing rules separately.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PER-SEAT PRICING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Charge for enabled participation.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">A defined user entitlement becomes the commercial unit.</text><rect x="64" y="320" width="440" height="370" rx="22" fill="#FFFFFF"/><text x="88" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">COUNT ENTITLEMENTS</text><text x="88" y="420" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">500 billable seats</text><text x="88" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">State whether the rule</text><text x="88" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">uses named, active, or</text><text x="88" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">concurrent users.</text><rect x="580" y="320" width="440" height="370" rx="22" fill="#DCEDE8"/><text x="604" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">APPLY THE RATE</text><text x="604" y="420" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">$20 per seat / month</text><text x="604" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">The selected plan and</text><text x="604" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">seat type determine</text><text x="604" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">the applicable rate.</text><rect x="1096" y="320" width="440" height="370" rx="22" fill="#FFFFFF"/><text x="1120" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CALCULATE</text><text x="1120" y="420" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">$10,000 / month</text><text x="1120" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Manage additions, removals,</text><text x="1120" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">guest access, and changes</text><text x="1120" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">under explicit rules.</text><line x1="521" y1="500" x2="563" y2="500" stroke="#176E69" stroke-width="5"/><polygon points="563,500 548,491 548,509" fill="#176E69"/><line x1="1037" y1="500" x2="1079" y2="500" stroke="#176E69" stroke-width="5"/><polygon points="1079,500 1064,491 1064,509" fill="#176E69"/><rect x="64" y="810" width="1472" height="208" rx="22" fill="#DCEDE8"/><text x="90" y="843" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Participation and consumption are different.</text><text x="90" y="911" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A paid seat grants access; it does not prove engagement or successful use.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Fictional figures. Different roles and optional usage charges can change the bill.</text></svg>