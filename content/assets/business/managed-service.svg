<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Managed Service: ongoing operation within an agreed scope</title><desc id="desc">The customer retains objectives, policies, approvals, and agreed inputs. A service agreement defines scope, service levels, and authority. Within that scope, the provider repeatedly runs the operation, monitors its condition, responds to issues, and reviews and improves delivery. Responsibilities and coverage depend on the service agreement.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">MANAGED SERVICE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Take ongoing responsibility for the operation.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Run a defined function over time, within agreed responsibilities and service levels.</text><rect x="64" y="267" width="1472" height="143" rx="22" fill="#FFFFFF"/><text x="95" y="293" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">CUSTOMER RETAINS</text><text x="95" y="346" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Objectives, policies, approvals, and agreed inputs</text><text x="64" y="448" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Agreed scope · service levels · authority</text><polyline points="800,427 800,492" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="800,492 809.0,476.0 791.0,476.0" fill="#176E69"/><rect x="64" y="510" width="1472" height="410" rx="22" fill="#DCEDE8"/><text x="95" y="542" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">PROVIDER OPERATES THE AGREED FUNCTION</text><rect x="94" y="615" width="308" height="160" rx="22" fill="#FFFFFF"/><text x="118" y="641" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Run</text><text x="118" y="701" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Perform recurring</text><text x="118" y="736" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">operational work</text><rect x="462" y="615" width="308" height="160" rx="22" fill="#FFFFFF"/><text x="486" y="641" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Monitor</text><text x="486" y="701" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Track condition</text><text x="486" y="736" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and service quality</text><rect x="830" y="615" width="308" height="160" rx="22" fill="#FFFFFF"/><text x="854" y="641" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Respond</text><text x="854" y="701" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Handle issues</text><text x="854" y="736" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and exceptions</text><rect x="1198" y="615" width="308" height="160" rx="22" fill="#FFFFFF"/><text x="1222" y="641" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Improve</text><text x="1222" y="701" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Review performance</text><text x="1222" y="736" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and refine delivery</text><line x1="417" y1="691" x2="449" y2="691" stroke="#176E69" stroke-width="5"/><polygon points="449,691 434,682 434,700" fill="#176E69"/><line x1="785" y1="691" x2="817" y2="691" stroke="#176E69" stroke-width="5"/><polygon points="817,691 802,682 802,700" fill="#176E69"/><line x1="1153" y1="691" x2="1185" y2="691" stroke="#176E69" stroke-width="5"/><polygon points="1185,691 1170,682 1170,700" fill="#176E69"/><polyline points="1352,792 1352,864 248,864 248,793" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="248,793 239.0,809.0 257.0,809.0" fill="#176E69"/><text x="490" y="813" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">Repeat throughout the service period</text><rect x="64" y="973" width="1472" height="80" rx="22" fill="#176E69"/><text x="93" y="998" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Tools support the work. The provider manages the operation.</text><text x="64" y="1095" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Illustrative model. Responsibilities and coverage are defined in the service agreement.</text></svg>