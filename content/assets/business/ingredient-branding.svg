<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Ingredient Branding: make a valuable contribution visible</title><desc id="desc">An ingredient supplier supplies a component, material, or technology and builds its reputation. The host brand incorporates the ingredient into a finished product and identifies the ingredient brand. A customer recognizes the contribution as a reason to choose the product. The host brand represents the complete offering, while the ingredient brand represents a specific contribution. The ingredient reputation is not a guarantee of every aspect of the product.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">INGREDIENT BRANDING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="50" font-weight="700" fill="#183343">Make a hidden contribution visible.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Give customers a recognizable reason to value what is inside the finished product.</text><rect x="520" y="282" width="560" height="523" rx="22" fill="#FFFFFF"/><text x="552" y="318" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">HOST BRAND</text><text x="552" y="376" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#183343">Finished product</text><rect x="552" y="487" width="496" height="158" rx="22" fill="#176E69"/><text x="579" y="514" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">INGREDIENT BRAND</text><text x="579" y="574" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#FFFFFF">Component, material,</text><text x="579" y="613" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#FFFFFF">or technology</text><rect x="552" y="686" width="496" height="79" rx="22" fill="#DCEDE8"/><text x="577" y="712" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Featuring the ingredient brand</text><rect x="64" y="415" width="360" height="221" rx="22" fill="#DCEDE8"/><text x="87" y="449" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Ingredient supplier</text><text x="87" y="519" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Supplies the input</text><text x="87" y="563" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Builds its reputation</text><rect x="1180" y="415" width="356" height="221" rx="22" fill="#DCEDE8"/><text x="1203" y="449" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Customer</text><text x="1203" y="519" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Sees the ingredient</text><text x="1203" y="563" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">as a reason to choose</text><line x1="441" y1="529" x2="502" y2="529" stroke="#176E69" stroke-width="5"/><polygon points="502,529 487,520 487,538" fill="#176E69"/><line x1="1097" y1="529" x2="1162" y2="529" stroke="#176E69" stroke-width="5"/><polygon points="1162,529 1147,520 1147,538" fill="#176E69"/><rect x="64" y="859" width="1472" height="193" rx="22" fill="#DCEDE8"/><text x="94" y="890" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">TWO BRANDS, DISTINCT ROLES</text><text x="94" y="946" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Host brand: the complete product and customer experience</text><text x="94" y="999" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#52646D">Ingredient brand: a specific contribution customers recognize</text><text x="64" y="1095" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#52646D">Illustrative structure. The ingredient’s reputation supports a defined benefit, not every aspect of the product.</text></svg>