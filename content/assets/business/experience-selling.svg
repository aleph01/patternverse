<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc"><title id="title">Experience Selling: design something worth being part of</title><desc id="desc">A core product or service combines with a designed encounter through setting, human interaction, story or ritual, and participation. Together they can create enjoyment, belonging, achievement or a lasting memory. Revenue can take the form of paid access, a product-and-experience bundle, or a price premium. Additional revenue must justify the cost of delivery.</desc><rect width="1600" height="1060" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">EXPERIENCE SELLING</text><text x="64" y="107" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Create something worth being part of.</text><text x="64" y="183" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">The encounter becomes part of the value customers choose and pay for.</text><rect x="64" y="278" width="515" height="250" rx="22" fill="#E6E9E9"/><text x="94" y="311" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">Core offering</text><text x="94" y="381" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#183343">A product or service</text><text x="94" y="437" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">What the customer gets</text><text x="624" y="367" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="65" font-weight="700" fill="#176E69">+</text><rect x="724" y="278" width="812" height="250" rx="22" fill="#DCEDE8"/><text x="754" y="311" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#176E69">Designed encounter</text><text x="754" y="381" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#183343">Setting + human interaction</text><text x="754" y="432" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#183343">Story, ritual, or participation</text><path d="M800 550V583" stroke="#176E69" stroke-width="4"/><path d="M800 593l-10 -14h20z" fill="#176E69"/><rect x="64" y="612" width="1472" height="116" rx="22" fill="#176E69"/><text x="94" y="636" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Value in the experience itself</text><text x="94" y="683" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">Enjoyment  /  belonging  /  achievement  /  lasting memory</text><text x="64" y="780" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#52646D">POSSIBLE REVENUE FORMS</text><rect x="64" y="828" width="464" height="126" rx="16" fill="#FFFFFF"/><text x="86" y="852" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Paid access</text><text x="86" y="904" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">A ticket, session, or event</text><rect x="568" y="828" width="464" height="126" rx="16" fill="#FFFFFF"/><text x="590" y="852" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Product + experience</text><text x="590" y="904" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">One combined purchase</text><rect x="1072" y="828" width="464" height="126" rx="16" fill="#FFFFFF"/><text x="1094" y="852" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Price premium</text><text x="1094" y="904" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">A more valued offering</text><text x="64" y="1003" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Additional revenue must justify the staff, space, time, and care required to deliver it.</text></svg>