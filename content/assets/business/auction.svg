<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Auction: the rules turn bids into a result</title><desc id="desc">Two hypothetical single-item sealed-bid auctions use the same submitted bids to illustrate payment rules. Bidder A submits one hundred dollars, B submits one hundred twenty, and C submits one hundred fifty. All bidders are eligible, and the reserve is ninety dollars. In the first-price format, C wins and pays one hundred fifty dollars. In the second-price format, C wins and pays one hundred twenty dollars. Fees and taxes are excluded. The comparison isolates payment rules; actual bidding strategies differ across formats.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">AUCTION</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="50" font-weight="700" fill="#183343">The rules turn bids into a result.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Hypothetical sealed bids: one item, all bidders eligible, reserve price $90.</text><rect x="64" y="290" width="430" height="260" rx="22" fill="#FFFFFF"/><text x="92" y="320" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">BIDDER A</text><text x="92" y="378" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="#183343">$100</text><text x="92" y="493" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Submitted bid</text><rect x="585" y="290" width="430" height="260" rx="22" fill="#FFFFFF"/><text x="613" y="320" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">BIDDER B</text><text x="613" y="378" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="#183343">$120</text><text x="613" y="493" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Submitted bid</text><rect x="1106" y="290" width="430" height="260" rx="22" fill="#176E69"/><text x="1134" y="320" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">BIDDER C</text><text x="1134" y="378" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="#FFFFFF">$150</text><text x="1134" y="493" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">Highest submitted bid</text><rect x="64" y="592" width="1472" height="72" rx="22" fill="#DCEDE8"/><text x="92" y="613" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">C wins in both examples. The payment rule changes what C pays.</text><rect x="64" y="712" width="724" height="265" rx="22" fill="#FFFFFF"/><text x="92" y="743" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">FIRST-PRICE</text><text x="92" y="797" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="70" font-weight="700" fill="#183343">$150</text><text x="92" y="918" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Winner pays their own bid</text><rect x="812" y="712" width="724" height="265" rx="22" fill="#FFFFFF"/><text x="840" y="743" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">SECOND-PRICE</text><text x="840" y="797" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="70" font-weight="700" fill="#183343">$120</text><text x="840" y="918" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Winner pays the next-highest bid</text><text x="64" y="1030" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Illustrative formats. Fees and taxes excluded.</text><text x="64" y="1083" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">The same submitted bids isolate the payment rule; actual bidding strategies differ by format.</text></svg>