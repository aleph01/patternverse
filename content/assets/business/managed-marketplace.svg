<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Managed Marketplace: take on the work that makes a transaction dependable</title><desc id="desc">Illustrative managed resale marketplace. Sellers supply eligible goods. The marketplace performs or actively controls significant transaction work so buyers receive a clearer offer and coordinated support. Possible managed activities include inspecting or vetting supply, preparing descriptions and grades, coordinating payment and delivery, and resolving returns or disputes. Activities vary by business; the operator need not perform all of them or buy the goods.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">MANAGED MARKETPLACE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Take on the work that makes the trade work.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Illustrative resale model: manage selected steps that buyers and sellers struggle with.</text><rect x="64" y="293" width="430" height="222" rx="22" fill="#FFFFFF"/><text x="89" y="321" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">SELLERS</text><text x="89" y="383" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Supply eligible goods</text><text x="89" y="458" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Hand over selected selling tasks</text><rect x="1106" y="293" width="430" height="222" rx="22" fill="#FFFFFF"/><text x="1131" y="321" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">BUYERS</text><text x="1131" y="383" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Choose a clearer offer</text><text x="1131" y="458" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Receive coordinated support</text><rect x="585" y="267" width="430" height="274" rx="22" fill="#176E69"/><text x="613" y="296" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">MANAGED MARKETPLACE</text><text x="613" y="360" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#FFFFFF">Performs or controls</text><text x="613" y="412" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#FFFFFF">key transaction work</text><text x="613" y="480" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">Adds operating capability</text><line x1="502" y1="404" x2="574" y2="404" stroke="#176E69" stroke-width="5"/><polygon points="574,404 559,395 559,413" fill="#176E69"/><line x1="1026" y1="404" x2="1095" y2="404" stroke="#176E69" stroke-width="5"/><polygon points="1095,404 1080,395 1080,413" fill="#176E69"/><text x="64" y="585" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Possible activities the operator manages</text><rect x="64" y="658" width="350" height="205" rx="22" fill="#DCEDE8"/><text x="87" y="684" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">ASSESS</text><text x="87" y="748" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Vet providers</text><text x="87" y="795" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">or inspect goods</text><rect x="438" y="658" width="350" height="205" rx="22" fill="#DCEDE8"/><text x="461" y="684" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">PREPARE</text><text x="461" y="748" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Grade, describe,</text><text x="461" y="795" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">or standardize offers</text><rect x="812" y="658" width="350" height="205" rx="22" fill="#DCEDE8"/><text x="835" y="684" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">COORDINATE</text><text x="835" y="748" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Arrange payment</text><text x="835" y="795" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">and fulfilment</text><rect x="1186" y="658" width="350" height="205" rx="22" fill="#DCEDE8"/><text x="1209" y="684" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">RESOLVE</text><text x="1209" y="748" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Handle support,</text><text x="1209" y="795" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">returns, or disputes</text><rect x="64" y="915" width="1472" height="98" rx="22" fill="#FFFFFF"/><text x="93" y="941" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#183343">More operating responsibility can build trust—and adds real cost.</text><text x="64" y="1054" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Activities vary. The operator may perform work itself or manage specialist partners.</text><text x="64" y="1098" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Managing a sale does not require buying the goods. Warranty responsibilities remain explicit.</text></svg>