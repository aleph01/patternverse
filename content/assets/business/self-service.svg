<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Self-Service: customers complete selected steps</title><desc id="desc">Two illustrative ordering flows show the division of work. In assisted ordering, a customer describes the order, an employee enters the details, and the company prepares the order. In self-service ordering, the customer selects options and enters and confirms the order, while the company still prepares it. Clear choices, confirmation, and help when needed support the customer.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">SELF-SERVICE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Let customers complete selected steps.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Move suitable tasks to the customer, with clear tools and a route to help.</text><text x="64" y="280" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">ASSISTED ORDERING</text><rect x="64" y="337" width="460" height="190" rx="22" fill="#176E69"/><text x="92" y="370" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">CUSTOMER</text><text x="92" y="435" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Describes order</text><rect x="570" y="337" width="460" height="190" rx="22" fill="#FFFFFF"/><text x="598" y="370" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183343">EMPLOYEE</text><text x="598" y="435" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Enters details</text><rect x="1076" y="337" width="460" height="190" rx="22" fill="#FFFFFF"/><text x="1104" y="370" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183343">COMPANY</text><text x="1104" y="435" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Prepares order</text><line x1="538" y1="432" x2="556" y2="432" stroke="#176E69" stroke-width="5"/><polygon points="556,432 541,423 541,441" fill="#176E69"/><line x1="1044" y1="432" x2="1062" y2="432" stroke="#176E69" stroke-width="5"/><polygon points="1062,432 1047,423 1047,441" fill="#176E69"/><text x="64" y="587" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">SELF-SERVICE ORDERING</text><rect x="64" y="644" width="460" height="190" rx="22" fill="#176E69"/><text x="92" y="677" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">CUSTOMER</text><text x="92" y="742" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Selects options</text><rect x="570" y="644" width="460" height="190" rx="22" fill="#176E69"/><text x="598" y="677" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">CUSTOMER</text><text x="598" y="742" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Enters &amp; confirms</text><rect x="1076" y="644" width="460" height="190" rx="22" fill="#FFFFFF"/><text x="1104" y="677" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183343">COMPANY</text><text x="1104" y="742" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Prepares order</text><line x1="538" y1="739" x2="556" y2="739" stroke="#176E69" stroke-width="5"/><polygon points="556,739 541,730 541,748" fill="#176E69"/><line x1="1044" y1="739" x2="1062" y2="739" stroke="#176E69" stroke-width="5"/><polygon points="1062,739 1047,730 1047,748" fill="#176E69"/><rect x="64" y="920" width="1472" height="122" rx="22" fill="#DCEDE8"/><text x="93" y="946" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Make the task easier to complete successfully.</text><text x="93" y="999" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Clear choices + confirmation + help when needed</text><text x="64" y="1095" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Teal: customer task. White: provider task. Illustrative ordering flow.</text></svg>