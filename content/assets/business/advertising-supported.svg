<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Advertising Supported: ad opportunities become revenue when monetized</title><desc id="desc">Hypothetical CPM example. A publisher has one million available ad impressions. Sixty percent are sold and delivered as billable impressions, giving six hundred thousand paid impressions. At five dollars per thousand paid impressions, gross advertising revenue is three thousand dollars before intermediary fees, revenue sharing, and operating costs. Advertising can support free access or supplement user payments.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">ADVERTISING SUPPORTED</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#183343">An audience creates opportunities to sell ads.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Hypothetical CPM example: advertisers pay for each 1,000 billable impressions.</text><rect x="64" y="263" width="440" height="270" rx="22" fill="#FFFFFF"/><text x="89" y="293" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#176E69">AVAILABLE AD IMPRESSIONS</text><text x="89" y="348" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#183343">1,000,000</text><text x="89" y="426" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Opportunities to show ads.</text><text x="89" y="477" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Some may remain unsold.</text><rect x="580" y="263" width="440" height="270" rx="22" fill="#FFFFFF"/><text x="605" y="293" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#176E69">PAID IMPRESSIONS</text><text x="605" y="348" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#183343">600,000</text><text x="605" y="426" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">60% sold and delivered</text><text x="605" y="477" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">as billable impressions.</text><rect x="1096" y="263" width="440" height="270" rx="22" fill="#FFFFFF"/><text x="1121" y="293" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#176E69">GROSS AD REVENUE</text><text x="1121" y="348" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#183343">$3,000</text><text x="1121" y="426" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">At $5 per 1,000</text><text x="1121" y="477" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">paid impressions.</text><line x1="520" y1="385" x2="564" y2="385" stroke="#176E69" stroke-width="5"/><polygon points="564,385 549,376 549,394" fill="#176E69"/><line x1="1036" y1="385" x2="1080" y2="385" stroke="#176E69" stroke-width="5"/><polygon points="1080,385 1065,376 1065,394" fill="#176E69"/><rect x="64" y="581" width="1472" height="144" rx="22" fill="#176E69"/><text x="94" y="610" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#FFFFFF">600,000 ÷ 1,000 × $5 = $3,000</text><text x="94" y="679" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">Before intermediary fees, revenue sharing, content, and operating costs.</text><rect x="64" y="775" width="716" height="191" rx="22" fill="#DCEDE8"/><text x="90" y="801" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">FREE ACCESS</text><text x="90" y="853" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Advertising supplies revenue</text><text x="90" y="909" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">without a user access fee.</text><rect x="820" y="775" width="716" height="191" rx="22" fill="#DCEDE8"/><text x="846" y="801" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">PAID ACCESS + ADS</text><text x="846" y="853" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Advertising adds another revenue source</text><text x="846" y="909" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">alongside subscriptions or purchases.</text><text x="64" y="1014" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">More ad space does not automatically mean more advertiser demand.</text><text x="64" y="1075" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Illustrative figures, not company data or market rates. Actual pricing and billing vary.</text></svg>