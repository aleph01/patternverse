<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Preorder Funding: collect before making and delivering</title><desc id="desc">Hypothetical example with 100 orders priced at 100 dollars each. Full upfront payment brings in 10000 dollars before production. Production and fulfilment cost 8000 dollars. The remaining 2000 dollars is before other costs, taxes, and refunds. With the same 100 orders, a 25 dollar deposit brings in only 2500 dollars before delivery, while payment collected at shipment brings in zero dollars before production.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PREORDER FUNDING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183343">Customer cash arrives before delivery costs.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Hypothetical example: 100 orders at $100 each, paid in full upfront.</text><rect x="64" y="263" width="440" height="217" rx="22" fill="#FFFFFF"/><text x="89" y="293" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">BEFORE PRODUCTION</text><text x="89" y="353" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Collect $10,000</text><text x="89" y="413" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">100 customers pay $100.</text><rect x="580" y="263" width="440" height="217" rx="22" fill="#FFFFFF"/><text x="605" y="293" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">MAKE AND DELIVER</text><text x="605" y="353" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Spend $8,000</text><text x="605" y="413" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Production + fulfilment.</text><rect x="1096" y="263" width="440" height="217" rx="22" fill="#FFFFFF"/><text x="1121" y="293" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">AFTER DELIVERY</text><text x="1121" y="353" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">$2,000 remains</text><text x="1121" y="413" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Before other costs.</text><line x1="520" y1="373" x2="564" y2="373" stroke="#176E69" stroke-width="5"/><polygon points="564,373 549,364 549,382" fill="#176E69"/><line x1="1036" y1="373" x2="1080" y2="373" stroke="#176E69" stroke-width="5"/><polygon points="1080,373 1065,364 1065,382" fill="#176E69"/><rect x="64" y="528" width="1472" height="144" rx="22" fill="#176E69"/><text x="94" y="556" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">Early cash can fund the work. The delivery obligation remains.</text><text x="94" y="620" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">The $10,000 collected is not all profit.</text><text x="64" y="724" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">SAME 100 ORDERS — DIFFERENT CASH AVAILABLE BEFORE PRODUCTION</text><rect x="64" y="782" width="464" height="210" rx="22" fill="#DCEDE8"/><text x="89" y="808" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">FULL PREPAYMENT</text><text x="89" y="855" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#183343">$10,000</text><text x="89" y="941" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">$100 collected per order.</text><rect x="568" y="782" width="464" height="210" rx="22" fill="#DCEDE8"/><text x="593" y="808" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">$25 DEPOSIT</text><text x="593" y="855" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#183343">$2,500</text><text x="593" y="941" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">The balance arrives later.</text><rect x="1072" y="782" width="464" height="210" rx="22" fill="#E6E9E9"/><text x="1097" y="808" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CHARGE AT SHIPMENT</text><text x="1097" y="855" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#183343">$0</text><text x="1097" y="941" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">No production funding yet.</text><text x="64" y="1040" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Illustrative figures, not company data. Assumes early payments are available to use.</text><text x="64" y="1085" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Excludes other costs, taxes, and refunds. Actual payout and refund terms matter.</text></svg>