<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Modular Upgrade Revenue: improve the part, keep the platform</title><desc id="desc">An initial product combines a retained platform with an original module. A later paid upgrade replaces the module to increase performance while preserving the platform. Another optional compatible upgrade adds a new capability. Revenue comes from useful upgrade modules and any associated installation or service, supported by compatibility and continuing customer value.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">MODULAR UPGRADE REVENUE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Improve the part. Keep the platform.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Earn from compatible improvements to a product the customer already owns.</text><rect x="64" y="300" width="440" height="390" rx="22" fill="#FFFFFF"/><text x="88" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">INITIAL PURCHASE</text><text x="88" y="381" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">A working product</text><rect x="92" y="447" width="384" height="157" rx="14" fill="#DCEDE8"/><rect x="115" y="461" width="338" height="64" rx="10" fill="#176E69"/><text x="134" y="478" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">Original module</text><text x="125" y="554" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Retained platform</text><text x="88" y="634" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Base product revenue</text><rect x="580" y="300" width="440" height="390" rx="22" fill="#FFFFFF"/><text x="604" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">OPTIONAL UPGRADE</text><text x="604" y="381" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">More performance</text><rect x="608" y="447" width="384" height="157" rx="14" fill="#DCEDE8"/><rect x="631" y="461" width="338" height="64" rx="10" fill="#A15B32"/><text x="650" y="478" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">Upgraded module</text><text x="641" y="554" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Retained platform</text><text x="604" y="634" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Upgrade module revenue</text><rect x="1096" y="300" width="440" height="390" rx="22" fill="#FFFFFF"/><text x="1120" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">OPTIONAL UPGRADE</text><text x="1120" y="381" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">New capability</text><rect x="1124" y="447" width="384" height="157" rx="14" fill="#DCEDE8"/><rect x="1147" y="461" width="338" height="64" rx="10" fill="#565786"/><text x="1166" y="478" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">Another upgrade</text><text x="1157" y="554" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Retained platform</text><text x="1120" y="634" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Further upgrade revenue</text><line x1="521" y1="520" x2="563" y2="520" stroke="#176E69" stroke-width="5"/><polygon points="563,520 548,511 548,529" fill="#176E69"/><line x1="1037" y1="520" x2="1079" y2="520" stroke="#176E69" stroke-width="5"/><polygon points="1079,520 1064,511 1064,529" fill="#176E69"/><text x="244" y="741" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Illustrative path: each upgrade is a separate choice and must be compatible.</text><rect x="64" y="840" width="440" height="191" rx="22" fill="#DCEDE8"/><text x="88" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">COMPATIBILITY</text><text x="88" y="928" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183343">Defined interfaces and</text><text x="88" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">clear upgrade requirements.</text><rect x="580" y="840" width="440" height="191" rx="22" fill="#DCEDE8"/><text x="604" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">CUSTOMER VALUE</text><text x="604" y="928" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183343">A useful improvement</text><text x="604" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">at an acceptable total cost.</text><rect x="1096" y="840" width="440" height="191" rx="22" fill="#DCEDE8"/><text x="1120" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">REVENUE</text><text x="1120" y="928" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183343">Paid modules and any</text><text x="1120" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">installation or service fees.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">The platform can last longer while the business earns from improvements over time.</text></svg>