<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Layer Player: one layer across many value chains</title><desc id="desc">Three independent value chains for retail, software, and travel run from upstream activities through a common payment-processing specialist to downstream delivery. The specialist serves the same functional layer for all three businesses. Sharing a provider does not mean sharing customer data or combining the businesses.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">LAYER PLAYER</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">One layer. Many value chains.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Specialize in a recurring function that many different businesses need.</text><rect x="64" y="264" width="460" height="652" rx="22" fill="#E6E9E9"/><text x="89" y="294" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183343">RETAIL BUSINESS</text><rect x="84" y="357" width="420" height="105" rx="22" fill="#FFFFFF"/><text x="107" y="392" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Selects products</text><line x1="294" y1="482" x2="294" y2="534" stroke="#176E69" stroke-width="5"/><polygon points="294,534 285,519 303,519" fill="#176E69"/><rect x="84" y="787" width="420" height="105" rx="22" fill="#FFFFFF"/><text x="107" y="822" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Delivers orders</text><line x1="294" y1="714" x2="294" y2="769" stroke="#176E69" stroke-width="5"/><polygon points="294,769 285,754 303,754" fill="#176E69"/><rect x="570" y="264" width="460" height="652" rx="22" fill="#E6E9E9"/><text x="595" y="294" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183343">SOFTWARE BUSINESS</text><rect x="590" y="357" width="420" height="105" rx="22" fill="#FFFFFF"/><text x="613" y="392" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Builds software</text><line x1="800" y1="482" x2="800" y2="534" stroke="#176E69" stroke-width="5"/><polygon points="800,534 791,519 809,519" fill="#176E69"/><rect x="590" y="787" width="420" height="105" rx="22" fill="#FFFFFF"/><text x="613" y="822" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Provides software</text><line x1="800" y1="714" x2="800" y2="769" stroke="#176E69" stroke-width="5"/><polygon points="800,769 791,754 809,754" fill="#176E69"/><rect x="1076" y="264" width="460" height="652" rx="22" fill="#E6E9E9"/><text x="1101" y="294" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183343">TRAVEL BUSINESS</text><rect x="1096" y="357" width="420" height="105" rx="22" fill="#FFFFFF"/><text x="1119" y="392" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Organizes trips</text><line x1="1306" y1="482" x2="1306" y2="534" stroke="#176E69" stroke-width="5"/><polygon points="1306,534 1297,519 1315,519" fill="#176E69"/><rect x="1096" y="787" width="420" height="105" rx="22" fill="#FFFFFF"/><text x="1119" y="822" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Delivers travel</text><line x1="1306" y1="714" x2="1306" y2="769" stroke="#176E69" stroke-width="5"/><polygon points="1306,769 1297,754 1315,754" fill="#176E69"/><rect x="64" y="550" width="1472" height="145" rx="22" fill="#176E69"/><text x="99" y="578" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">ONE SPECIALIST PROVIDER · PAYMENT PROCESSING</text><text x="99" y="636" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">The same functional layer supports several independent value chains.</text><rect x="64" y="961" width="1472" height="91" rx="22" fill="#DCEDE8"/><text x="93" y="987" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Build depth in the capability. Grow breadth across customers.</text><text x="64" y="1094" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Illustrative payment layer. Businesses remain separate; shared provision does not imply shared data.</text></svg>