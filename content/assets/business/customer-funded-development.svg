<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Customer-Funded Development: build with funding from an intended customer</title><desc id="desc">An intended customer funds agreed development work. A supplier builds and demonstrates progress, then delivers the agreed capability. Development funding can be upfront, tied to milestones, or provided through a funded pilot or co-development agreement. Progress evidence and feedback inform later payments and development decisions. Scope, acceptance, payment timing, rights, and reuse need agreement. Customer funding can cover part of development, and the supplier may still need cash between payments.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CUSTOMER-FUNDED DEVELOPMENT</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Build with funding from the customer.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">An intended buyer helps finance the work needed to create a new capability.</text><rect x="64" y="300" width="440" height="310" rx="22" fill="#FFFFFF"/><text x="88" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">CUSTOMER</text><text x="88" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Fund agreed work</text><text x="88" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Pay for development that</text><text x="88" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">addresses a real need.</text><text x="88" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Funding may cover part of it.</text><rect x="580" y="300" width="440" height="310" rx="22" fill="#DCEDE8"/><text x="604" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">SUPPLIER</text><text x="604" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Build and demonstrate</text><text x="604" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Develop, test, and show</text><text x="604" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">progress against the</text><text x="604" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">agreed scope and milestones.</text><rect x="1096" y="300" width="440" height="310" rx="22" fill="#FFFFFF"/><text x="1120" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">RESULT</text><text x="1120" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Deliver the capability</text><text x="1120" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">The customer receives the</text><text x="1120" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">agreed product, service,</text><text x="1120" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">access, or development output.</text><line x1="521" y1="452" x2="563" y2="452" stroke="#176E69" stroke-width="5"/><polygon points="563,452 548,443 548,461" fill="#176E69"/><line x1="1037" y1="452" x2="1079" y2="452" stroke="#176E69" stroke-width="5"/><polygon points="1079,452 1064,443 1064,461" fill="#176E69"/><rect x="64" y="659" width="1472" height="105" rx="22" fill="#FFFFFF"/><text x="92" y="683" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#176E69">Funding can arrive upfront, at milestones, or through a funded pilot.</text><text x="92" y="730" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Progress evidence and customer feedback support decisions about the next stage.</text><text x="64" y="807" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">THE AGREEMENT CONNECTS THREE THINGS</text><rect x="64" y="857" width="440" height="174" rx="22" fill="#DCEDE8"/><text x="88" y="879" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Scope and acceptance</text><text x="88" y="935" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">What will be developed,</text><text x="88" y="980" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and how it will be assessed.</text><rect x="580" y="857" width="440" height="174" rx="22" fill="#DCEDE8"/><text x="604" y="879" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Payment timing</text><text x="604" y="935" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">When money arrives, and</text><text x="604" y="980" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">who finances cash gaps.</text><rect x="1096" y="857" width="440" height="174" rx="22" fill="#DCEDE8"/><text x="1120" y="879" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Rights and reuse</text><text x="1120" y="935" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">What each party can use,</text><text x="1120" y="980" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">own, license, or sell later.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Development fees and cash available today are different: payment timing still matters.</text></svg>