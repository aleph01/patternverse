<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Franchising: replicate a business system through local operators</title><desc id="desc">A franchisor develops a shared brand and operating system and supplies training and support to multiple franchisees. Independently owned franchise businesses invest in and operate local units under agreed standards, and pay fees and royalties. Illustrative network: one franchisee may operate several units, and funding, property ownership, and responsibilities vary.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">FRANCHISING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="51" font-weight="700" fill="#183343">Replicate a business system.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A shared brand and format, operated by independent franchise businesses.</text><rect x="420" y="260" width="760" height="185" rx="22" fill="#DCEDE8"/><text x="452" y="290" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">FRANCHISOR</text><text x="452" y="344" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">Develops and maintains the system</text><text x="452" y="402" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Brand, methods, standards, and network support</text><text x="376" y="485" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#176E69">Brand + operating system + training + support</text><polyline points="800,535 284,535 284,624" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="284,624 293.0,608.0 275.0,608.0" fill="#176E69"/><polyline points="800,535 800,535 800,624" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="800,624 809.0,608.0 791.0,608.0" fill="#176E69"/><polyline points="800,535 1316,535 1316,624" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1316,624 1325.0,608.0 1307.0,608.0" fill="#176E69"/><rect x="64" y="650" width="440" height="245" rx="22" fill="#FFFFFF"/><text x="88" y="680" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">FRANCHISE BUSINESS A</text><text x="88" y="736" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Invests and operates</text><text x="88" y="793" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Serves local customers</text><text x="88" y="838" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Follows agreed standards</text><rect x="580" y="650" width="440" height="245" rx="22" fill="#FFFFFF"/><text x="604" y="680" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">FRANCHISE BUSINESS B</text><text x="604" y="736" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Invests and operates</text><text x="604" y="793" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Serves local customers</text><text x="604" y="838" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Follows agreed standards</text><rect x="1096" y="650" width="440" height="245" rx="22" fill="#FFFFFF"/><text x="1120" y="680" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">FRANCHISE BUSINESS C</text><text x="1120" y="736" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Invests and operates</text><text x="1120" y="793" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Serves local customers</text><text x="1120" y="838" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Follows agreed standards</text><rect x="64" y="946" width="1472" height="99" rx="22" fill="#DCEDE8"/><text x="94" y="978" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Franchisees pay agreed fees and royalties to participate in the system.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative structure. One franchisee may operate several units; responsibilities vary.</text></svg>