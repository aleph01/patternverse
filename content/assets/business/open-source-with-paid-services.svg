<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Open Source with Paid Services: charge for the work around the software</title><desc id="desc">Open-source software provides rights to use, modify, and share under its license. Optional commercial services help customers set up the software through deployment, integration, migration, and training; operate it through hosting, monitoring, backups, and updates; or obtain assistance through troubleshooting and specialist advice. Customers pay for an agreed service scope and commitments. These services may be sold separately or together.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">OPEN SOURCE WITH PAID SERVICES</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Charge for the work around the software.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Customers buy expertise, operation, and agreed service commitments.</text><rect x="300" y="260" width="1000" height="185" rx="22" fill="#DCEDE8"/><text x="332" y="290" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">OPEN-SOURCE SOFTWARE</text><text x="332" y="348" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#183343">Rights to use, modify, and share</text><text x="332" y="402" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Under the software’s license</text><text x="461" y="485" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">OPTIONAL COMMERCIAL SERVICES</text><polyline points="800,545 284,545 284,624" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="284,624 293.0,608.0 275.0,608.0" fill="#176E69"/><polyline points="800,545 800,545 800,624" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="800,624 809.0,608.0 791.0,608.0" fill="#176E69"/><polyline points="800,545 1316,545 1316,624" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1316,624 1325.0,608.0 1307.0,608.0" fill="#176E69"/><rect x="64" y="650" width="440" height="245" rx="22" fill="#FFFFFF"/><text x="89" y="681" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">SET UP</text><text x="89" y="740" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Deploy and integrate</text><text x="89" y="799" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Migration, configuration,</text><text x="89" y="843" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and training</text><rect x="580" y="650" width="440" height="245" rx="22" fill="#FFFFFF"/><text x="605" y="681" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">OPERATE</text><text x="605" y="740" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Host and maintain</text><text x="605" y="799" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Monitoring, backups,</text><text x="605" y="843" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and updates</text><rect x="1096" y="650" width="440" height="245" rx="22" fill="#FFFFFF"/><text x="1121" y="681" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">ASSIST</text><text x="1121" y="740" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Support and advise</text><text x="1121" y="799" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Troubleshooting and</text><text x="1121" y="843" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">specialist guidance</text><rect x="64" y="946" width="1472" height="99" rx="22" fill="#DCEDE8"/><text x="94" y="978" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">The commercial offer defines the work, coverage, price, and responsibilities.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative service categories. Providers may offer them separately or in combination.</text></svg>