<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Open Core: open the foundation, sell the extensions</title><desc id="desc">A useful open-source core provides rights to use, modify, and redistribute under its license. Users can adopt the core on its own, or buy a commercial edition that combines the same foundation with separately licensed additional features. Example extensions include organization-wide controls, specialist integrations, and administration tools. Feature boundaries and rights must be explicit. Illustrative architecture, not a particular product.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">OPEN CORE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Open the foundation. Sell the extensions.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A useful open-source product, with additional capabilities sold separately.</text><rect x="64" y="290" width="700" height="290" rx="22" fill="#FFFFFF"/><text x="94" y="320" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">CORE ON ITS OWN</text><text x="94" y="385" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Adopt and adapt the product</text><text x="94" y="451" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Use the open foundation without</text><text x="94" y="495" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">purchasing commercial extensions</text><rect x="836" y="290" width="700" height="290" rx="22" fill="#F0E3D3"/><text x="866" y="320" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">COMMERCIAL EDITION</text><text x="866" y="385" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Add separately licensed features</text><text x="866" y="451" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">For example: organizational controls,</text><text x="866" y="495" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">specialist integrations, or administration</text><polyline points="414,671 414,602" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="414,602 405.0,618.0 423.0,618.0" fill="#176E69"/><polyline points="1186,671 1186,602" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1186,602 1177.0,618.0 1195.0,618.0" fill="#176E69"/><rect x="64" y="694" width="1472" height="235" rx="22" fill="#DCEDE8"/><text x="94" y="724" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">SHARED OPEN-SOURCE CORE</text><text x="94" y="786" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="41" font-weight="700" fill="#183343">A useful foundation under an open-source license</text><text x="94" y="857" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#52646D">Rights to use, modify, and redistribute under that license</text><rect x="64" y="975" width="1472" height="78" rx="22" fill="#FFFFFF"/><text x="94" y="999" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">State clearly which components are open and which require commercial rights.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative product architecture. Hosting and support can be sold alongside either edition.</text></svg>