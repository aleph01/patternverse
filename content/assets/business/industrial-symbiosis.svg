<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Industrial Symbiosis: connect surplus with useful demand</title><desc id="desc">An illustrative industrial plant sells its main product as usual while supplying three separate businesses with qualified surplus resources: heat for process or space heating, materials for production, and suitably treated water for industrial use. These are examples of possible exchanges, not a claim about one real facility. Each link needs appropriate recovery or treatment, agreed specifications, commercial terms and supply arrangements. Reciprocal flows are not required.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">INDUSTRIAL SYMBIOSIS</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Connect surplus with useful demand.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Link one operation’s surplus resources to another business’s input needs.</text><rect x="64" y="360" width="440" height="500" rx="22" fill="#DCEDE8"/><text x="88" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">BUSINESS A</text><text x="88" y="449" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">Industrial plant</text><text x="88" y="525" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Produces its main product.</text><text x="88" y="580" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Also has usable surplus:</text><text x="88" y="635" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">heat, materials, or water.</text><text x="88" y="744" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Main product continues</text><text x="88" y="789" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">to its usual customers.</text><rect x="1020" y="300" width="516" height="190" rx="22" fill="#FFFFFF"/><text x="1044" y="320" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#176E69">BUSINESS B</text><text x="1044" y="361" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Heat user</text><text x="1044" y="413" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Use recovered heat for</text><text x="1044" y="453" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">process or space heating.</text><rect x="1020" y="550" width="516" height="190" rx="22" fill="#FFFFFF"/><text x="1044" y="570" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#176E69">BUSINESS C</text><text x="1044" y="611" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Material user</text><text x="1044" y="663" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Use a qualified residual</text><text x="1044" y="703" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">stream in production.</text><rect x="1020" y="800" width="516" height="190" rx="22" fill="#FFFFFF"/><text x="1044" y="820" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#176E69">BUSINESS D</text><text x="1044" y="861" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Water user</text><text x="1044" y="913" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Use suitably treated water</text><text x="1044" y="953" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">for an industrial purpose.</text><polyline points="524,450 715,450 715,395 1000,395" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1000,395 984.0,386.0 984.0,404.0" fill="#176E69"/><polyline points="524,615 715,615 715,645 1000,645" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1000,645 984.0,636.0 984.0,654.0" fill="#176E69"/><polyline points="524,780 715,780 715,895 1000,895" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1000,895 984.0,886.0 984.0,904.0" fill="#176E69"/><text x="750" y="345" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">HEAT</text><text x="750" y="595" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">MATERIALS</text><text x="750" y="845" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">WATER</text><text x="64" y="956" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Illustrative exchanges; each stream needs appropriate recovery or treatment.</text><rect x="64" y="1006" width="1472" height="60" rx="22" fill="#DCEDE8"/><text x="88" y="1024" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Agree quality, timing, price, responsibilities, and backup arrangements.</text><text x="64" y="1100" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">The exchange can be one-way. Participants do not need to send resources back to each other.</text></svg>