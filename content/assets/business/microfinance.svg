<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Microfinance: financial services fitted to small and uneven cash flows</title><desc id="desc">Four financial needs and possible tools. Inventory needed before sales can be supported by a small loan with scheduled repayments. Future expenses can be supported by small savings deposits. Sending and receiving money can use local or digital payment services. Covered losses can be managed with insurance under its stated terms. Microcredit is one part of microfinance, and loans create repayment obligations.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">MICROFINANCE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183343">Fit finance to small and uneven cash flows.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Adapt the amounts, access, and schedules to the people using the service.</text><rect x="64" y="270" width="716" height="235" rx="22" fill="#FFFFFF"/><text x="90" y="294" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">CREDIT</text><text x="90" y="341" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Stock needed before sales arrive.</text><text x="90" y="399" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#176E69">Small loan</text><text x="90" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Repay on an agreed schedule.</text><rect x="820" y="270" width="716" height="235" rx="22" fill="#FFFFFF"/><text x="846" y="294" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">SAVINGS</text><text x="846" y="341" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Money needed for a later expense.</text><text x="846" y="399" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#176E69">Small deposits</text><text x="846" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Build a balance for future use.</text><rect x="64" y="548" width="716" height="235" rx="22" fill="#FFFFFF"/><text x="90" y="572" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">PAYMENTS</text><text x="90" y="619" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Money must move between people.</text><text x="90" y="677" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#176E69">Local or digital transfers</text><text x="90" y="738" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Send, receive, and pay bills.</text><rect x="820" y="548" width="716" height="235" rx="22" fill="#FFFFFF"/><text x="846" y="572" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">INSURANCE</text><text x="846" y="619" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">A covered loss could erase savings.</text><text x="846" y="677" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#176E69">Premiums for defined cover</text><text x="846" y="738" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Claims depend on the policy terms.</text><rect x="64" y="834" width="1472" height="132" rx="22" fill="#176E69"/><text x="94" y="863" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#FFFFFF">Affordable access + suitable terms + reliable service</text><text x="94" y="922" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">Providers may offer services directly or through authorized partners.</text><text x="64" y="1013" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Microcredit is one part of microfinance.</text><text x="64" y="1070" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A loan provides cash today and creates repayments tomorrow.</text></svg>