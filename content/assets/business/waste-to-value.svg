<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Waste-to-Value: connect a discarded resource with a valuable use</title><desc id="desc">A waste, surplus, or by-product stream is collected, checked, sorted, and prepared for a useful next application. Suitable material becomes a product, recovered raw material, or a useful input. Unusable residue still requires management. Revenue and any genuinely avoided costs must exceed collection, preparation, processing, delivery, and residue costs. Three routes are repurposing a material, recovering raw material, and redistributing usable surplus before it is wasted.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">WASTE-TO-VALUE / TRASH-TO-CASH</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#183343">Find a useful next life for a discarded resource.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Connect waste, surplus, or by-products with an application customers will pay for.</text><rect x="64" y="300" width="440" height="293" rx="22" fill="#FFFFFF"/><text x="88" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">RESOURCE STREAM</text><text x="88" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Recover what is useful</text><text x="88" y="458" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Used materials, surplus,</text><text x="88" y="503" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">production offcuts,</text><text x="88" y="548" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">or industrial by-products.</text><rect x="580" y="300" width="440" height="293" rx="22" fill="#DCEDE8"/><text x="604" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">VALUE-CREATING WORK</text><text x="604" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Check and prepare</text><text x="604" y="458" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Collect, sort, and verify;</text><text x="604" y="503" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">clean, transform, or match</text><text x="604" y="548" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">to a suitable next use.</text><rect x="1096" y="300" width="440" height="293" rx="22" fill="#FFFFFF"/><text x="1120" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">CUSTOMER VALUE</text><text x="1120" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Supply a useful output</text><text x="1120" y="458" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">A finished product,</text><text x="1120" y="503" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">recovered raw material,</text><text x="1120" y="548" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">or a useful production input.</text><line x1="521" y1="446" x2="563" y2="446" stroke="#176E69" stroke-width="5"/><polygon points="563,446 548,437 548,455" fill="#176E69"/><line x1="1037" y1="446" x2="1079" y2="446" stroke="#176E69" stroke-width="5"/><polygon points="1079,446 1064,437 1064,455" fill="#176E69"/><polyline points="800,613 800,662 983,662" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="983,662 967.0,653.0 967.0,671.0" fill="#176E69"/><text x="1004" y="647" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#52646D">Manage unusable residue</text><rect x="64" y="719" width="1472" height="96" rx="22" fill="#FFFFFF"/><text x="92" y="743" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#176E69">The business case depends on saleable yield and the full cost of recovery.</text><text x="64" y="861" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">THREE ROUTES TO VALUE</text><rect x="64" y="910" width="440" height="139" rx="22" fill="#DCEDE8"/><text x="88" y="927" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Repurpose</text><text x="88" y="976" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Truck tarps become</text><text x="88" y="1013" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">durable bags.</text><rect x="580" y="910" width="440" height="139" rx="22" fill="#DCEDE8"/><text x="604" y="927" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Recover material</text><text x="604" y="976" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Nylon waste becomes</text><text x="604" y="1013" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">regenerated nylon.</text><rect x="1096" y="910" width="440" height="139" rx="22" fill="#DCEDE8"/><text x="1120" y="927" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Redistribute surplus</text><text x="1120" y="976" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Unsold edible food reaches</text><text x="1120" y="1013" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">buyers before it is wasted.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">A recovered resource still needs a buyer, suitable quality, and workable logistics.</text></svg>