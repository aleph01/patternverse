<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Open Business Model: create and capture value across business boundaries</title><desc id="desc">Three routes illustrate an open business model. Bring in external technology or know-how and combine it with your own capabilities. Let partners use your technology in their offerings through external routes to market. Build together by combining capabilities with a partner. Agree how each side benefits through product sales, licensing, revenue sharing, or access to new markets. Openness can be selective, contractual, and paid.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">OPEN BUSINESS MODEL</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Create value across business boundaries.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Bring ideas in, take technology out, or build an offering together.</text><text x="64" y="246" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">THREE ROUTES</text><text x="64" y="334" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">BRING IN</text><text x="64" y="381" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#52646D">External knowledge</text><rect x="340" y="306" width="500" height="143" rx="22" fill="#FFFFFF"/><text x="365" y="334" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">External partner</text><text x="365" y="397" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Technology or know-how</text><rect x="1036" y="306" width="500" height="143" rx="22" fill="#176E69"/><text x="1061" y="334" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#FFFFFF">Your offering</text><text x="1061" y="397" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#FFFFFF">Combine with your capabilities</text><line x1="860" y1="374" x2="1016" y2="374" stroke="#176E69" stroke-width="5"/><polygon points="1016,374 1001,365 1001,383" fill="#176E69"/><text x="64" y="535" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">LET OUT</text><text x="64" y="582" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#52646D">External routes</text><rect x="340" y="507" width="500" height="143" rx="22" fill="#176E69"/><text x="365" y="535" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#FFFFFF">Your technology</text><text x="365" y="598" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#FFFFFF">An asset others can use</text><rect x="1036" y="507" width="500" height="143" rx="22" fill="#FFFFFF"/><text x="1061" y="535" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Partner offering</text><text x="1061" y="598" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Apply it in another business</text><line x1="860" y1="575" x2="1016" y2="575" stroke="#176E69" stroke-width="5"/><polygon points="1016,575 1001,566 1001,584" fill="#176E69"/><text x="64" y="736" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">BUILD TOGETHER</text><text x="64" y="783" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#52646D">Shared development</text><rect x="340" y="708" width="500" height="143" rx="22" fill="#176E69"/><text x="365" y="736" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#FFFFFF">Your capabilities</text><text x="365" y="799" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#FFFFFF">Contribute skills and assets</text><rect x="1036" y="708" width="500" height="143" rx="22" fill="#FFFFFF"/><text x="1061" y="736" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Partner capabilities</text><text x="1061" y="799" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Combine complementary strengths</text><line x1="860" y1="776" x2="1016" y2="776" stroke="#176E69" stroke-width="5"/><polygon points="1016,776 1001,767 1001,785" fill="#176E69"/><line x1="1016" y1="814" x2="860" y2="814" stroke="#176E69" stroke-width="5"/><polygon points="860,814 875,805 875,823" fill="#176E69"/><rect x="64" y="913" width="1472" height="140" rx="22" fill="#DCEDE8"/><text x="94" y="940" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">AGREE HOW EACH SIDE BENEFITS</text><text x="94" y="995" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Product sales · licensing · revenue sharing · access to new markets</text><text x="64" y="1095" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Openness can be selective, contractual, and paid. It does not require public access.</text></svg>