<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Joint Venture: combine contributions in a jointly controlled business</title><desc id="desc">Two independent partners contribute to an illustrative jointly owned company. Partner A owns 60 percent and provides technology and capital; Partner B owns 40 percent and provides market access and operations. The joint venture has a defined business and shared control under the agreement. Returns and funding obligations follow agreed terms, with distributions depending on available cash. Ownership, voting rights, and distributions need not match.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">JOINT VENTURE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Build a business together. Share control.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Combine complementary contributions while the partners remain independent.</text><rect x="64" y="282" width="620" height="166" rx="22" fill="#FFFFFF"/><text x="93" y="316" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#176E69">PARTNER A · 60%</text><text x="93" y="379" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Technology + capital</text><rect x="916" y="282" width="620" height="166" rx="22" fill="#FFFFFF"/><text x="945" y="316" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#176E69">PARTNER B · 40%</text><text x="945" y="379" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Market access + operations</text><polyline points="374,464 374,508 617,508 617,547" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="617,547 626.0,531.0 608.0,531.0" fill="#176E69"/><polyline points="1226,464 1226,508 983,508 983,547" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="983,547 992.0,531.0 974.0,531.0" fill="#176E69"/><rect x="382" y="562" width="836" height="188" rx="22" fill="#176E69"/><text x="413" y="591" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">JOINT VENTURE</text><text x="413" y="650" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#FFFFFF">Defined business + shared control</text><text x="413" y="710" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">Operating decisions follow the agreed governance.</text><polyline points="800,765 800,812" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="800,812 809.0,796.0 791.0,796.0" fill="#176E69"/><rect x="64" y="829" width="1472" height="125" rx="22" fill="#DCEDE8"/><text x="94" y="856" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">RETURNS + FUNDING OBLIGATIONS</text><text x="94" y="909" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Shared under agreed terms; distributions depend on available cash.</text><text x="64" y="1009" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Agree governance, contributions, funding, IP, and exit before starting.</text><text x="64" y="1095" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative company structure. Ownership, voting rights, and distributions need not match.</text></svg>