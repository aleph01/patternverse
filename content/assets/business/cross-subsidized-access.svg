<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Cross-Subsidized Access: contribution from one group covers another group funding gap</title><desc id="desc">Hypothetical example with a delivery cost of sixty dollars per person. One hundred customers pay one hundred twenty dollars each, creating twelve thousand dollars of revenue and six thousand dollars of contribution after delivery costs. Another hundred customers pay twenty dollars each, creating two thousand dollars of revenue and a four thousand dollar shortfall after delivery costs. The first group contribution covers that shortfall, leaving two thousand dollars toward shared overhead and reserves. Delivery costs exclude shared overhead.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CROSS-SUBSIDIZED ACCESS / ROBIN HOOD</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183343">Use surplus from one group to widen access.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Hypothetical example: delivery costs $60 per person in both groups.</text><rect x="64" y="270" width="716" height="282" rx="22" fill="#FFFFFF"/><text x="90" y="298" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">FULL-PRICE CUSTOMERS</text><text x="90" y="357" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">100 × $120 = $12,000 revenue</text><text x="90" y="423" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">100 × $60 = $6,000 delivery cost</text><text x="90" y="494" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#176E69">+$6,000 contribution</text><rect x="820" y="270" width="716" height="282" rx="22" fill="#FFFFFF"/><text x="846" y="298" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">SUBSIDIZED CUSTOMERS</text><text x="846" y="357" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">100 × $20 = $2,000 revenue</text><text x="846" y="423" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">100 × $60 = $6,000 delivery cost</text><text x="846" y="494" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#176E69">−$4,000 funding gap</text><rect x="64" y="603" width="1472" height="156" rx="22" fill="#DCEDE8"/><text x="94" y="636" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#176E69">$6,000 contribution − $4,000 subsidy = $2,000</text><text x="94" y="710" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#183343">The higher-paying group covers the other group’s delivery shortfall.</text><rect x="64" y="810" width="1472" height="138" rx="22" fill="#176E69"/><text x="94" y="840" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">$2,000 remains toward shared overhead and reserves.</text><text x="94" y="905" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#FFFFFF">Financial viability depends on the whole mix of prices, costs, and customers.</text><text x="64" y="1001" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Different prices alone do not establish that a cross-subsidy exists.</text><text x="64" y="1060" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Illustrative figures, not company data. Delivery costs exclude shared overhead.</text><text x="64" y="1102" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Any additional expenses and taxes must also be covered.</text></svg>