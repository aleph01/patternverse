<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc"><title id="title">Customer-Funded Working Capital: collect before the related bill falls due</title><desc id="desc">Hypothetical retailer. Day zero: receive eighty dollars of inventory on thirty-day supplier credit, with no cash paid. Day five: sell it and collect one hundred dollars from the customer. Day thirty: pay the supplier eighty dollars. Customer cash arrives twenty-five days before supplier payment. Twenty dollars remain after paying for inventory but before other costs. The hundred dollars collected is not all profit. This example excludes all other cash flows.</desc><rect width="1600" height="1150" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CUSTOMER-FUNDED WORKING CAPITAL / CASH MACHINE</text><text x="64" y="102" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Collect first. Pay the related costs later.</text><text x="64" y="181" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A hypothetical retailer using agreed 30-day supplier payment terms.</text><rect x="64" y="263" width="464" height="279" rx="22" fill="#FFFFFF"/><text x="91" y="292" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">DAY 0</text><text x="91" y="342" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Receive inventory</text><text x="91" y="408" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#176E69">$80 owed; $0 paid</text><text x="91" y="486" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Supplier bill is due on day 30.</text><rect x="568" y="263" width="464" height="279" rx="22" fill="#FFFFFF"/><text x="595" y="292" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">DAY 5</text><text x="595" y="342" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Sell and collect</text><text x="595" y="408" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#176E69">+$100 cash</text><text x="595" y="486" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Customer payment has settled.</text><rect x="1072" y="263" width="464" height="279" rx="22" fill="#FFFFFF"/><text x="1099" y="292" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">DAY 30</text><text x="1099" y="342" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Pay the supplier</text><text x="1099" y="408" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#176E69">−$80 cash</text><text x="1099" y="486" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">The inventory bill is settled.</text><line x1="538" y1="405" x2="558" y2="405" stroke="#176E69" stroke-width="5"/><polygon points="558,405 543,396 543,414" fill="#176E69"/><line x1="1042" y1="405" x2="1062" y2="405" stroke="#176E69" stroke-width="5"/><polygon points="1062,405 1047,396 1047,414" fill="#176E69"/><rect x="64" y="590" width="1472" height="166" rx="22" fill="#DCEDE8"/><text x="94" y="622" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#176E69">Cash arrives 25 days before the supplier is paid.</text><text x="94" y="695" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">On day 5: $100 cash collected, with an $80 supplier bill still outstanding.</text><rect x="64" y="804" width="1472" height="148" rx="22" fill="#176E69"/><text x="94" y="835" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">After paying for inventory, $20 remains.</text><text x="94" y="906" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#FFFFFF">That is before overhead and other costs; the $100 receipt was not all profit.</text><text x="64" y="1005" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">The benefit comes from the timing of cash receipts and payments.</text><text x="64" y="1060" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative figures and dates, not company data. Excludes other expenses, fees, taxes,</text><text x="64" y="1100" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">returns, and cash flows. Agreed supplier credit is part of this example.</text></svg>