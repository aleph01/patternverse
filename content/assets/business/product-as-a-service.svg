<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc"><title id="title">Product as a Service: a managed lifecycle supports ongoing use</title><desc id="desc">A conceptual lifecycle has four stages: provide and configure the product; support operation through monitoring and replenishment where included; maintain, repair, or replace under the service terms; and recover the product for reuse or recycling if agreed. The service promise defines capacity, quality, response times, responsibilities, and exclusions. Payment can follow time, usage, or performance, but the billing method does not define service responsibility.</desc><rect width="1600" height="1130" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">PRODUCT AS A SERVICE</text><text x="64" y="102" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183343">The product enables a continuing service.</text><text x="64" y="181" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A managed lifecycle supports the capability the customer needs.</text><rect x="64" y="265" width="344" height="260" rx="22" fill="#FFFFFF"/><text x="88" y="294" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">01</text><text x="88" y="347" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Provide product</text><text x="88" y="416" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Install and configure</text><text x="88" y="462" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">for agreed requirements.</text><line x1="416" y1="395" x2="432" y2="395" stroke="#176E69" stroke-width="5"/><polygon points="432,395 417,386 417,404" fill="#176E69"/><rect x="440" y="265" width="344" height="260" rx="22" fill="#FFFFFF"/><text x="464" y="294" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">02</text><text x="464" y="347" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Support operation</text><text x="464" y="416" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Monitor and replenish</text><text x="464" y="462" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">where included.</text><line x1="792" y1="395" x2="808" y2="395" stroke="#176E69" stroke-width="5"/><polygon points="808,395 793,386 793,404" fill="#176E69"/><rect x="816" y="265" width="344" height="260" rx="22" fill="#FFFFFF"/><text x="840" y="294" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">03</text><text x="840" y="347" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Keep it working</text><text x="840" y="416" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Maintain, repair, replace</text><text x="840" y="462" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">under the service terms.</text><line x1="1168" y1="395" x2="1184" y2="395" stroke="#176E69" stroke-width="5"/><polygon points="1184,395 1169,386 1169,404" fill="#176E69"/><rect x="1192" y="265" width="344" height="260" rx="22" fill="#FFFFFF"/><text x="1216" y="294" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">04</text><text x="1216" y="347" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Recover value</text><text x="1216" y="416" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Take back for reuse</text><text x="1216" y="462" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">or recycling, if agreed.</text><rect x="64" y="573" width="1472" height="151" rx="22" fill="#DCEDE8"/><text x="94" y="604" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#176E69">Define the service promise</text><text x="94" y="670" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#183343">Capacity • quality • response times • responsibilities • exclusions</text><rect x="64" y="775" width="1472" height="171" rx="22" fill="#176E69"/><text x="94" y="805" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">Payment can follow time, usage, or performance.</text><text x="94" y="882" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">The billing method does not define the service responsibility.</text><text x="64" y="1001" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">The provider takes on agreed work to sustain useful product capability.</text><text x="64" y="1055" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Illustrative lifecycle. Ownership, service scope, supplies, and take-back duties</text><text x="64" y="1092" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">depend on the agreement; not every offer includes every element.</text></svg>