<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="title desc"><title id="title">Reverse Innovation: let local solutions travel</title><desc id="desc">A familiar expansion model develops an offering for a wealthier market and adapts it for an emerging market. Reverse innovation develops for emerging-market needs, establishes local adoption, and then adapts for a need in a wealthier market. Transferable strengths may include affordability, portability, simplicity and resilience. Standards, service and distribution must fit the destination.</desc><rect width="1600" height="1110" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">REVERSE INNOVATION</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="53" font-weight="700" fill="#183343">Let local solutions travel.</text><text x="64" y="187" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Solve emerging-market needs, then find where that solution matters elsewhere.</text><text x="64" y="276" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#52646D">A FAMILIAR EXPANSION MODEL</text><rect x="64" y="322" width="658" height="128" rx="22" fill="#E6E9E9"/><text x="88" y="346" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Develop for a wealthier market</text><text x="88" y="399" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Start with its needs and assumptions</text><path d="M744 386H842" stroke="#52646D" stroke-width="4"/><path d="M852 386l-14 -9v18z" fill="#52646D"/><rect x="874" y="322" width="662" height="128" rx="22" fill="#E6E9E9"/><text x="898" y="346" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Adapt for an emerging market</text><text x="898" y="399" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Modify the existing offering</text><text x="64" y="516" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">REVERSE INNOVATION</text><rect x="64" y="565" width="432" height="193" rx="22" fill="#176E69"/><text x="86" y="590" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Develop locally relevant value</text><text x="86" y="649" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">Start with emerging-market</text><text x="86" y="685" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">needs and conditions</text><path d="M516 660H552" stroke="#176E69" stroke-width="4"/><path d="M562 660l-14 -9v18z" fill="#176E69"/><rect x="584" y="565" width="432" height="193" rx="22" fill="#DCEDE8"/><text x="606" y="590" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">Establish local adoption</text><text x="606" y="649" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Make it work for the people</text><text x="606" y="685" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">it was designed to serve</text><path d="M1036 660H1072" stroke="#176E69" stroke-width="4"/><path d="M1082 660l-14 -9v18z" fill="#176E69"/><rect x="1104" y="565" width="432" height="193" rx="22" fill="#DCEDE8"/><text x="1126" y="590" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">Adapt for a new market</text><text x="1126" y="649" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Find a matching need in</text><text x="1126" y="685" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">a wealthier market</text><text x="64" y="808" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#52646D">STRENGTHS THAT MAY TRAVEL</text><rect x="64" y="854" width="320" height="83" rx="16" fill="#FFFFFF"/><text x="88" y="877" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Affordability</text><rect x="448" y="854" width="320" height="83" rx="16" fill="#FFFFFF"/><text x="472" y="877" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Portability</text><rect x="832" y="854" width="320" height="83" rx="16" fill="#FFFFFF"/><text x="856" y="877" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Simplicity</text><rect x="1216" y="854" width="320" height="83" rx="16" fill="#FFFFFF"/><text x="1240" y="877" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Resilience</text><rect x="64" y="982" width="1472" height="76" rx="16" fill="#DCEDE8"/><text x="88" y="1006" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Preserve the useful design; adapt standards, service, and distribution.</text></svg>