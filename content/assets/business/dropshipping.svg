<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Dropshipping: separate the sale from the shipment</title><desc id="desc">Illustrative retailer-led dropshipping arrangement. First, the customer places an order and pays the seller. Second, the seller sends a supplier order and pays under agreed terms. Third, the supplier picks, packs, and ships directly to the customer, bypassing the seller. The seller manages the customer-facing sale and service; the supplier holds the stock and fulfils the shipment. Inventory, payment, and returns terms vary by agreement.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">DROPSHIPPING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Separate the sale from the shipment.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Illustrative retailer-led model: supplier inventory fulfils the customer’s order.</text><rect x="64" y="296" width="430" height="246" rx="22" fill="#FFFFFF"/><text x="91" y="326" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">CUSTOMER</text><text x="91" y="398" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Buys from the seller</text><text x="91" y="480" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Receives supplier shipment</text><rect x="1106" y="296" width="430" height="246" rx="22" fill="#FFFFFF"/><text x="1133" y="326" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">SELLER</text><text x="1133" y="398" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Markets and takes order</text><text x="1133" y="480" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Manages customer service</text><text x="592" y="340" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">1. Order + payment</text><line x1="507" y1="419" x2="1093" y2="419" stroke="#176E69" stroke-width="5"/><polygon points="1093,419 1078,410 1078,428" fill="#176E69"/><rect x="585" y="710" width="430" height="241" rx="22" fill="#176E69"/><text x="613" y="740" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">SUPPLIER</text><text x="613" y="808" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#FFFFFF">Holds stock · picks · packs</text><text x="613" y="884" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#FFFFFF">Ships to the customer</text><polyline points="1321,557 1490,582 1490,839 1028,839" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1028,839 1045.0,848.0 1045.0,830.0" fill="#176E69"/><text x="1118" y="603" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">2. Supplier order</text><text x="1095" y="655" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Payment under agreed terms</text><polyline points="601,695 311,557" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="311,557 322.48335861207744,572.4315415622169 330.21781164689315,556.1779808368796" fill="#176E69"/><text x="64" y="603" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">3. Direct delivery</text><text x="64" y="655" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Goods bypass the seller</text><rect x="64" y="1000" width="1472" height="83" rx="22" fill="#DCEDE8"/><text x="91" y="1025" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">The seller coordinates the promise; the supplier fulfils the shipment.</text><text x="64" y="1110" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Inventory still exists at the supplier. Payment, returns, and service arrangements vary.</text></svg>