<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc"><title id="title">Solution Provider: take responsibility for making it work</title><desc id="desc">Customer needs are translated into agreed scope and acceptance criteria. The provider leads design, supply, integration and verification, with named responsibility for components and handoffs. The result is a working solution within the agreed scope. Support and operation continue where included. Asset ownership and payment method can vary.</desc><rect width="1600" height="1060" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">SOLUTION PROVIDER</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Take responsibility for making it work.</text><text x="64" y="187" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Connect products, expertise, and services around an agreed customer result.</text><rect x="64" y="274" width="1472" height="90" rx="16" fill="#FFFFFF"/><text x="92" y="301" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Customer need → agreed scope and acceptance criteria</text><path d="M800 376V401" stroke="#176E69" stroke-width="4"/><path d="M800 411l-10 -14h20z" fill="#176E69"/><rect x="64" y="430" width="1472" height="301" rx="22" fill="#E6E9E9"/><text x="90" y="455" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Provider leads integration and delivery</text><rect x="88" y="517" width="344" height="118" rx="16" fill="#DCEDE8"/><text x="110" y="537" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#176E69">Design</text><text x="110" y="590" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Understand the job</text><rect x="448" y="517" width="344" height="118" rx="16" fill="#DCEDE8"/><text x="470" y="537" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#176E69">Supply</text><text x="470" y="590" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Coordinate inputs</text><rect x="808" y="517" width="344" height="118" rx="16" fill="#DCEDE8"/><text x="830" y="537" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#176E69">Integrate</text><text x="830" y="590" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Make parts work</text><rect x="1168" y="517" width="344" height="118" rx="16" fill="#DCEDE8"/><text x="1190" y="537" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#176E69">Verify</text><text x="1190" y="590" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Test against criteria</text><text x="90" y="679" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Named responsibility for components and handoffs</text><path d="M800 744V772" stroke="#176E69" stroke-width="4"/><path d="M800 782l-10 -14h20z" fill="#176E69"/><rect x="64" y="800" width="1472" height="104" rx="22" fill="#176E69"/><text x="92" y="830" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">A working solution within the agreed scope</text><text x="64" y="945" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Support, operation, and improvement continue where included.</text><text x="64" y="1011" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Asset ownership and the payment method can vary.</text></svg>