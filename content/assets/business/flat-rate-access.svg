<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Flat-Rate Access</title><desc id="desc">A fixed fee purchases access within an explicit boundary. Multiple included uses do not create extra per-use charges, while excluded services retain separate prices and terms.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">FLAT-RATE ACCESS</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Sell a defined scope for a fixed price.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Make the access boundary as clear as the price.</text><rect x="64" y="320" width="440" height="370" rx="22" fill="#FFFFFF"/><text x="88" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PAY ONCE FOR THE SCOPE</text><text x="88" y="420" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">A fixed access fee</text><text x="88" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Pay for the agreed period</text><text x="88" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">or entitlement rather than</text><text x="88" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">each included action.</text><rect x="580" y="320" width="440" height="370" rx="22" fill="#DCEDE8"/><text x="604" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">DEFINE THE BOUNDARY</text><text x="604" y="420" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Clear access rights</text><text x="604" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Specify dates, locations,</text><text x="604" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">catalog, participants,</text><text x="604" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and service conditions.</text><rect x="1096" y="320" width="440" height="370" rx="22" fill="#FFFFFF"/><text x="1120" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">USE WITHIN THE SCOPE</text><text x="1120" y="420" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Repeated included use</text><text x="1120" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">No extra charge for</text><text x="1120" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">each included use.</text><text x="1120" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Exclusions still matter.</text><line x1="521" y1="500" x2="563" y2="500" stroke="#176E69" stroke-width="5"/><polygon points="563,500 548,491 548,509" fill="#176E69"/><line x1="1037" y1="500" x2="1079" y2="500" stroke="#176E69" stroke-width="5"/><polygon points="1079,500 1064,491 1064,509" fill="#176E69"/><rect x="64" y="810" width="1472" height="208" rx="22" fill="#DCEDE8"/><text x="90" y="843" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Predictable spending needs sustainable capacity.</text><text x="90" y="911" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Forecast heavy users, peak demand, and costs that grow with consumption.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Flat rate does not mean unlimited in every respect, and need not auto-renew.</text></svg>