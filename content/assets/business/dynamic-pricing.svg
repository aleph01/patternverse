<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc"><title id="title">Dynamic Pricing: adjust the price as conditions change</title><desc id="desc">Demand, available capacity, time, and competition inform a pricing policy with limits. The business displays a price, observes results, and updates later offers. Three hypothetical conditions for an equivalent service show a quiet period at seventy dollars, normal demand at one hundred dollars, and scarce capacity at one hundred forty dollars. Prices can move down or up. These are illustrative scenarios, not company data.</desc><rect width="1600" height="1130" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">DYNAMIC PRICING</text><text x="64" y="102" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Adjust the price as conditions change.</text><text x="64" y="181" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Prices respond to conditions; the core offer can remain the same.</text><rect x="64" y="260" width="464" height="249" rx="22" fill="#FFFFFF"/><text x="90" y="290" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Read the signals</text><text x="90" y="358" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Demand and booking pace</text><text x="90" y="403" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Remaining capacity</text><text x="90" y="448" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Time and competitor prices</text><rect x="568" y="260" width="464" height="249" rx="22" fill="#FFFFFF"/><text x="594" y="290" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Apply pricing rules</text><text x="594" y="358" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Price floor and ceiling</text><text x="594" y="403" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Limits on price changes</text><text x="594" y="448" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Business goals and review</text><rect x="1072" y="260" width="464" height="249" rx="22" fill="#FFFFFF"/><text x="1098" y="290" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Present the offer</text><text x="1098" y="358" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Show the current price</text><text x="1098" y="403" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">State the purchase terms</text><text x="1098" y="448" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Honor the agreed booking</text><line x1="538" y1="384" x2="558" y2="384" stroke="#176E69" stroke-width="5"/><polygon points="558,384 543,375 543,393" fill="#176E69"/><line x1="1042" y1="384" x2="1062" y2="384" stroke="#176E69" stroke-width="5"/><polygon points="1062,384 1047,375 1047,393" fill="#176E69"/><rect x="64" y="551" width="1472" height="110" rx="18" fill="#DCEDE8"/><text x="94" y="576" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#176E69">Observe results and update later offers</text><text x="94" y="626" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183343">Bookings • margin • availability • customer response</text><line x1="1495" y1="691" x2="105" y2="691" stroke="#176E69" stroke-width="5"/><polygon points="105,691 120,682 120,700" fill="#176E69"/><text x="64" y="736" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#52646D">ILLUSTRATIVE CONDITIONS FOR AN EQUIVALENT SERVICE</text><rect x="64" y="791" width="464" height="204" rx="22" fill="#FFFFFF"/><text x="89" y="814" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Quiet period</text><text x="89" y="863" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#176E69">$70</text><text x="89" y="944" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Lower price can attract demand.</text><rect x="568" y="791" width="464" height="204" rx="22" fill="#FFFFFF"/><text x="593" y="814" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Normal demand</text><text x="593" y="863" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#176E69">$100</text><text x="593" y="944" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">A reference price for comparison.</text><rect x="1072" y="791" width="464" height="204" rx="22" fill="#FFFFFF"/><text x="1097" y="814" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Scarce capacity</text><text x="1097" y="863" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#176E69">$140</text><text x="1097" y="944" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Higher price can moderate demand.</text><text x="64" y="1038" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Prices can move down or up. Higher prices do not guarantee more supply.</text><text x="64" y="1082" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Hypothetical prices and scenarios, not company rates or a revenue forecast.</text></svg>