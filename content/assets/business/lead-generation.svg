<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Lead Generation: turn interest into sales opportunities</title><desc id="desc">Hypothetical pay-per-lead example. A lead generator attracts one thousand visitors and captures one hundred valid leads. A business follows up and wins ten customers. At twenty dollars per lead, it spends two thousand dollars, equivalent to two hundred dollars in lead fees per new customer. This excludes sales labour and other acquisition costs. Conversion rates and lead prices are illustrative, not company data or guarantees.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">LEAD GENERATION</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Turn interest into sales opportunities.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Hypothetical pay-per-lead example: the business pays for an opportunity to win a customer.</text><rect x="64" y="270" width="951" height="68" rx="22" fill="#DCEDE8"/><text x="88" y="291" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">LEAD GENERATOR: ATTRACT · CAPTURE · QUALIFY</text><rect x="1106" y="270" width="430" height="68" rx="22" fill="#E6E9E9"/><text x="1128" y="291" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183343">BUSINESS: FOLLOW UP · SELL</text><rect x="64" y="375" width="430" height="259" rx="22" fill="#FFFFFF"/><text x="92" y="407" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="#183343">1,000</text><text x="92" y="507" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Visitors</text><text x="92" y="583" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Explore relevant information</text><rect x="585" y="375" width="430" height="259" rx="22" fill="#176E69"/><text x="613" y="407" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="#FFFFFF">100</text><text x="613" y="507" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Valid leads</text><text x="613" y="583" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#FFFFFF">Meet the agreed lead criteria</text><rect x="1106" y="375" width="430" height="259" rx="22" fill="#FFFFFF"/><text x="1134" y="407" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="#183343">10</text><text x="1134" y="507" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">New customers</text><text x="1134" y="583" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Choose to buy after follow-up</text><line x1="507" y1="506" x2="572" y2="506" stroke="#176E69" stroke-width="5"/><polygon points="572,506 557,497 557,515" fill="#176E69"/><line x1="1028" y1="506" x2="1093" y2="506" stroke="#176E69" stroke-width="5"/><polygon points="1093,506 1078,497 1078,515" fill="#176E69"/><text x="64" y="688" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">THE HANDOFF</text><text x="64" y="738" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">The business receives leads and takes responsibility for pursuing the sale.</text><rect x="64" y="823" width="710" height="153" rx="22" fill="#DCEDE8"/><rect x="800" y="823" width="736" height="153" rx="22" fill="#FFFFFF"/><text x="91" y="846" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">LEAD SPEND</text><text x="91" y="894" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#183343">100 leads × $20 = $2,000</text><text x="827" y="846" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">LEAD FEES PER NEW CUSTOMER</text><text x="827" y="894" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#183343">$2,000 ÷ 10 = $200</text><text x="64" y="1034" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Numbers are illustrative. A valid lead does not guarantee a sale.</text><text x="64" y="1085" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">The $200 covers lead fees only; sales labour and other acquisition costs are additional.</text></svg>