<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc"><title id="title">Credits: fund a balance, choose how to use it</title><desc id="desc">A hypothetical pack costs fifty dollars and provides one hundred credits, equivalent to fifty cents per credit. Two standard tasks at ten credits each use twenty credits, equivalent to ten dollars. One advanced task at thirty credits uses thirty credits, equivalent to fifteen dollars. Fifty credits remain. This example assumes one purchased pack, no additional fees, and no expiration during the illustrated period.</desc><rect width="1600" height="1150" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">CREDITS</text><text x="64" y="102" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Fund a balance. Choose how to use it.</text><text x="64" y="181" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A hypothetical prepaid pack separates payment from individual purchases.</text><rect x="64" y="254" width="680" height="169" rx="22" fill="#FFFFFF"/><text x="94" y="281" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#52646D">PAY $50</text><text x="94" y="332" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#176E69">Receive 100 credits</text><line x1="772" y1="340" x2="830" y2="340" stroke="#176E69" stroke-width="5"/><polygon points="830,340 815,331 815,349" fill="#176E69"/><rect x="858" y="254" width="678" height="169" rx="22" fill="#DCEDE8"/><text x="888" y="281" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#52646D">EFFECTIVE CREDIT PRICE</text><text x="888" y="332" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#176E69">$50 ÷ 100 = $0.50 per credit</text><text x="64" y="473" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#52646D">SPEND THE SAME BALANCE ON DIFFERENT SERVICES</text><rect x="64" y="525" width="720" height="252" rx="22" fill="#FFFFFF"/><text x="94" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Two standard tasks</text><text x="94" y="607" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#52646D">2 × 10 credits</text><text x="94" y="661" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#176E69">20 credits used</text><text x="94" y="727" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">$10 effective cost</text><rect x="816" y="525" width="720" height="252" rx="22" fill="#FFFFFF"/><text x="846" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">One advanced task</text><text x="846" y="607" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#52646D">1 × 30 credits</text><text x="846" y="661" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#176E69">30 credits used</text><text x="846" y="727" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">$15 effective cost</text><rect x="64" y="821" width="1472" height="158" rx="22" fill="#176E69"/><text x="94" y="850" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="41" font-weight="700" fill="#FFFFFF">50 credits remain</text><text x="94" y="916" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#FFFFFF">100 starting credits − 20 − 30 = 50 available for later use</text><text x="64" y="1022" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Two prices matter: money per credit, and credits required per purchase.</text><text x="64" y="1076" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative rates, not company data. Assumes no extra fees or expiry during this period.</text></svg>