<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Direct to Customer: operate the route to the customer</title><desc id="desc">Illustrative comparison of sales routes. An intermediated route connects a producer, wholesaler, retailer, and customer. A direct route connects the producer to a brand-operated sales channel and then the customer; the producer and its channel are grouped within the same brand. Direct selling brings responsibility for customer acquisition, orders, fulfilment, and service. Specialist partners can still provide software, payments, and delivery. A business may use both routes.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">DIRECT TO CUSTOMER / NO MIDDLE MAN</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Operate the route to your customer.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Illustrative sales routes. A business can combine direct and intermediary channels.</text><text x="64" y="260" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">INTERMEDIATED ROUTE</text><rect x="64" y="316" width="290" height="143" rx="22" fill="#FFFFFF"/><text x="92" y="370" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Producer</text><rect x="458" y="316" width="290" height="143" rx="22" fill="#FFFFFF"/><text x="486" y="370" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Wholesaler</text><rect x="852" y="316" width="290" height="143" rx="22" fill="#FFFFFF"/><text x="880" y="370" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Retailer</text><rect x="1246" y="316" width="290" height="143" rx="22" fill="#FFFFFF"/><text x="1274" y="370" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Customer</text><line x1="367" y1="387" x2="445" y2="387" stroke="#176E69" stroke-width="5"/><polygon points="445,387 430,378 430,396" fill="#176E69"/><line x1="761" y1="387" x2="839" y2="387" stroke="#176E69" stroke-width="5"/><polygon points="839,387 824,378 824,396" fill="#176E69"/><line x1="1155" y1="387" x2="1233" y2="387" stroke="#176E69" stroke-width="5"/><polygon points="1233,387 1218,378 1218,396" fill="#176E69"/><text x="64" y="526" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">DIRECT ROUTE</text><rect x="64" y="585" width="951" height="263" rx="22" fill="#DCEDE8"/><text x="89" y="605" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">THE BRAND OPERATES THE SALES CHANNEL</text><rect x="86" y="659" width="402" height="165" rx="22" fill="#FFFFFF"/><text x="111" y="683" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Producer / brand</text><text x="111" y="751" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Supplies the offering</text><rect x="593" y="659" width="400" height="165" rx="22" fill="#176E69"/><text x="618" y="683" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Own sales channel</text><text x="618" y="751" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">Site · store · sales team</text><rect x="1106" y="659" width="430" height="165" rx="22" fill="#FFFFFF"/><text x="1134" y="683" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Customer</text><text x="1134" y="751" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Buys from the brand</text><line x1="503" y1="738" x2="578" y2="738" stroke="#176E69" stroke-width="5"/><polygon points="578,738 563,729 563,747" fill="#176E69"/><line x1="1028" y1="738" x2="1093" y2="738" stroke="#176E69" stroke-width="5"/><polygon points="1093,738 1078,729 1078,747" fill="#176E69"/><rect x="64" y="905" width="1472" height="121" rx="22" fill="#FFFFFF"/><text x="91" y="927" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">The selling work becomes the brand’s responsibility.</text><text x="91" y="985" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Customer acquisition · orders · fulfilment · service</text><text x="64" y="1067" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Specialist partners can still provide software, payments, or delivery.</text><text x="64" y="1107" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Arrows show sales routes, not necessarily the physical path of the goods.</text></svg>