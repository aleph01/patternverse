<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Reverse Razor and Blade</title><desc id="desc">Conventional razor and blade combines a lower entry price and higher follow-on charges. The reverse combines a higher entry price and lower follow-on charges. A hypothetical conventional system costs fifty dollars plus one dollar per use; a reverse system costs two hundred fifty dollars plus twenty cents per use. Both cost three hundred dollars after two hundred fifty uses. At five hundred uses the conventional system costs five hundred fifty dollars and the reverse costs three hundred fifty dollars. Figures illustrate customer spending, not company margins or actual product prices, and exclude other costs.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">REVERSE RAZOR AND BLADE</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#183343">Earn on the core. Make ongoing use affordable.</text><text x="64" y="187" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Shift the offer toward upfront value and lower follow-on charges.</text><rect x="64" y="278" width="1472" height="143" rx="22" fill="#E6E9E9"/><text x="94" y="302" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#52646D">Razor and Blade</text><text x="94" y="356" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Lower entry price</text><path d="M615 374H765" stroke="#176E69" stroke-width="4"/><path d="M775 374l-14 -10v20z" fill="#176E69"/><text x="836" y="356" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#176E69">Higher follow-on charges</text><rect x="64" y="451" width="1472" height="143" rx="22" fill="#DCEDE8"/><text x="94" y="475" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#52646D">Reverse Razor and Blade</text><text x="94" y="529" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Higher entry price</text><path d="M615 547H765" stroke="#176E69" stroke-width="4"/><path d="M775 547l-14 -10v20z" fill="#176E69"/><text x="836" y="529" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#176E69">Lower follow-on charges</text><rect x="64" y="649" width="1472" height="345" rx="20" fill="#FFFFFF"/><text x="94" y="679" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Illustrative customer spending</text><text x="790" y="747" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#52646D">At purchase</text><text x="1047" y="747" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#52646D">250 uses</text><text x="1306" y="747" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#52646D">500 uses</text><text x="94" y="806" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Conventional: $50 + $1 per use</text><text x="790" y="806" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">$50</text><text x="1047" y="806" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">$300</text><text x="1306" y="806" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">$550</text><text x="94" y="875" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#176E69">Reverse: $250 + $0.20 per use</text><text x="790" y="875" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#176E69">$250</text><text x="1047" y="875" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#176E69">$300</text><text x="1306" y="875" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#176E69">$350</text><text x="94" y="944" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">In this example, the higher initial price pays back after 250 uses.</text><text x="64" y="1036" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Hypothetical prices, not company data. Shows customer spending, not business profit.</text><text x="64" y="1080" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Assumes equal useful life and performance; excludes all other costs.</text></svg>