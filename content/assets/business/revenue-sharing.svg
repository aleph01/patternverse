<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Revenue Sharing</title><desc id="desc">A fictional arrangement collects 100,000 dollars, excludes 5,000 in transaction taxes and 5,000 in refunds, then splits the 90,000 dollar base 30/70 into 27,000 and 63,000 dollars. Each participant still bears assigned costs.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">REVENUE SHARING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Divide a clearly defined revenue base.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">The calculation base matters as much as the headline percentage.</text><rect x="64" y="320" width="440" height="370" rx="22" fill="#FFFFFF"/><text x="88" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CUSTOMER RECEIPTS</text><text x="88" y="420" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">$100,000 collected</text><text x="88" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Identify covered activity</text><text x="88" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and the parties that</text><text x="88" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">contribute to it.</text><rect x="580" y="320" width="440" height="370" rx="22" fill="#DCEDE8"/><text x="604" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">ELIGIBLE REVENUE</text><text x="604" y="420" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">$90,000 base</text><text x="604" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Exclude $5,000 in taxes</text><text x="604" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and $5,000 in refunds</text><text x="604" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">under this example.</text><rect x="1096" y="320" width="440" height="370" rx="22" fill="#FFFFFF"/><text x="1120" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">AGREED 30% / 70% SPLIT</text><text x="1120" y="420" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">$27,000 / $63,000</text><text x="1120" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Platform and creator</text><text x="1120" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">receive their shares.</text><text x="1120" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Each bears assigned costs.</text><line x1="521" y1="500" x2="563" y2="500" stroke="#176E69" stroke-width="5"/><polygon points="563,500 548,491 548,509" fill="#176E69"/><line x1="1037" y1="500" x2="1079" y2="500" stroke="#176E69" stroke-width="5"/><polygon points="1079,500 1064,491 1064,509" fill="#176E69"/><rect x="64" y="810" width="1472" height="208" rx="22" fill="#DCEDE8"/><text x="90" y="843" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">A revenue share is not a profit share.</text><text x="90" y="911" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Define deductions, attribution, reporting, settlement, and later reversals.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Fictional figures. The two shares add to the same $90,000 base.</text></svg>