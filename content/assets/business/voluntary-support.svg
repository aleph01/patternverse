<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Voluntary Support: a minority funds work available to everyone</title><desc id="desc">A creator or project produces open work for an audience. Some audience members and outside patrons choose to provide voluntary financial support, funding continued work. Non-contributors retain access. Hypothetical monthly example: ten thousand audience members, three percent supporting at eight dollars each, produces twenty-four hundred dollars in gross recurring support before all costs.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">VOLUNTARY SUPPORT / DONATIONS AND PATRONAGE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Some people fund what everyone can use.</text><text x="64" y="181" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Payment sustains the work; access to the core work remains open.</text><rect x="64" y="289" width="430" height="218" rx="22" fill="#FFFFFF"/><text x="89" y="318" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">CREATOR / PROJECT</text><text x="89" y="380" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Produces and maintains</text><text x="89" y="429" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">valuable work</text><rect x="585" y="289" width="430" height="218" rx="22" fill="#FFFFFF"/><text x="610" y="318" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">OPEN WORK</text><text x="610" y="380" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Articles, software, art,</text><text x="610" y="429" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">knowledge, or services</text><rect x="1106" y="289" width="430" height="218" rx="22" fill="#FFFFFF"/><text x="1131" y="318" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">AUDIENCE</text><text x="1131" y="380" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Uses and benefits</text><text x="1131" y="429" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">without needing to pay</text><line x1="502" y1="399" x2="574" y2="399" stroke="#176E69" stroke-width="5"/><polygon points="574,399 559,390 559,408" fill="#176E69"/><line x1="1023" y1="399" x2="1095" y2="399" stroke="#176E69" stroke-width="5"/><polygon points="1095,399 1080,390 1080,408" fill="#176E69"/><rect x="1106" y="598" width="430" height="194" rx="22" fill="#DCEDE8"/><text x="1131" y="624" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">SOME CHOOSE TO GIVE</text><text x="1131" y="680" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Readers, users, fans,</text><text x="1131" y="726" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">and outside patrons</text><path d="M1321 519 V585" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1321,585 1312,570 1330,570" fill="#176E69"/><rect x="64" y="598" width="951" height="194" rx="22" fill="#176E69"/><text x="93" y="626" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">VOLUNTARY FUNDING</text><text x="93" y="681" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">One-time gifts or recurring contributions</text><text x="93" y="742" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#FFFFFF">Supports continued work for the whole audience.</text><line x1="1093" y1="695" x2="1026" y2="695" stroke="#176E69" stroke-width="5"/><polygon points="1026,695 1041,686 1041,704" fill="#176E69"/><path d="M279 585 V520" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="279,520 270,535 288,535" fill="#176E69"/><text x="64" y="841" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Non-contributors retain access to the core work.</text><rect x="64" y="920" width="1472" height="132" rx="22" fill="#E6E9E9"/><text x="92" y="942" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#176E69">10,000 audience × 3% supporters × $8/month = $2,400/month</text><text x="92" y="1004" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Hypothetical gross recurring support, before fees and all operating costs.</text><text x="64" y="1090" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Recognition and modest perks can accompany support without closing core access.</text></svg>