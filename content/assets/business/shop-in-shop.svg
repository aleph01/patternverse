<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Shop-in-Shop: a distinct retail destination inside a host store</title><desc id="desc">Illustrative spatial arrangement. A host store contains its own assortment and services alongside a clearly identified shop-in-shop with a distinct identity, curated assortment, and specialist experience. The host can contribute location, traffic, and infrastructure; the partner can contribute a brand, assortment, know-how, and standards. Ownership, staffing, checkout, returns, and investment responsibilities vary by agreement. This is a conceptual arrangement, not an actual store floor plan.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">SHOP-IN-SHOP</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">A distinct shop inside a larger store.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Illustrative arrangement: combine a host location with a recognizable specialist destination.</text><rect x="64" y="273" width="970" height="626" rx="22" fill="#FFFFFF"/><text x="96" y="304" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">HOST STORE</text><text x="96" y="354" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">The surrounding retail environment</text><rect x="96" y="423" width="390" height="143" rx="22" fill="#E6E9E9"/><text x="120" y="448" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Host assortment</text><text x="120" y="511" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Other shopping needs</text><rect x="96" y="609" width="390" height="143" rx="22" fill="#E6E9E9"/><text x="120" y="634" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Host services</text><text x="120" y="697" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Shared visit and facilities</text><rect x="542" y="423" width="458" height="329" rx="22" fill="#176E69"/><text x="570" y="452" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">SHOP-IN-SHOP</text><text x="570" y="518" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Distinct identity</text><text x="570" y="590" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#FFFFFF">Curated assortment</text><text x="570" y="660" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#FFFFFF">Specialist experience</text><line x1="498" y1="587" x2="529" y2="587" stroke="#176E69" stroke-width="5"/><polygon points="529,587 514,578 514,596" fill="#176E69"/><text x="96" y="817" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">One visit · connected customer needs</text><rect x="1086" y="273" width="450" height="626" rx="22" fill="#DCEDE8"/><text x="1114" y="309" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">HOST CAN CONTRIBUTE</text><text x="1114" y="373" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Location and traffic</text><text x="1114" y="427" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Store infrastructure</text><text x="1114" y="567" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PARTNER CAN CONTRIBUTE</text><text x="1114" y="631" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Brand and assortment</text><text x="1114" y="685" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Know-how and standards</text><rect x="64" y="946" width="1472" height="112" rx="22" fill="#FFFFFF"/><text x="91" y="968" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Agree who handles inventory, staffing, checkout, returns, and investment.</text><text x="91" y="1022" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">The physical format can support different commercial and operating arrangements.</text><text x="64" y="1105" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Conceptual layout. A shop-in-shop does not automatically imply a lease or separate checkout.</text></svg>