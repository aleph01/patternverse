<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Cross-Selling: add a useful companion</title><desc id="desc">Cross-selling connects an initial purchase to a related need and an optional complementary offer. A laptop creates a need to carry it safely, which can be addressed by a compatible carrying case. Cross-selling adds a different product or service; upselling moves to a higher-value version of the original purchase. Complementary offers may be made during checkout or later.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CROSS-SELLING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="51" font-weight="700" fill="#183343">Add a useful companion.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Connect the customer’s purchase to a relevant additional need.</text><rect x="64" y="276" width="1472" height="361" rx="22" fill="#DCEDE8"/><text x="94" y="307" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">THE CONNECTION</text><rect x="94" y="375" width="412" height="222" rx="22" fill="#FFFFFF"/><text x="117" y="397" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#176E69">INITIAL PURCHASE</text><text x="117" y="445" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Laptop</text><text x="117" y="513" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">The customer chooses</text><text x="117" y="553" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">a computer</text><rect x="594" y="375" width="412" height="222" rx="22" fill="#FFFFFF"/><text x="617" y="397" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#176E69">RELATED NEED</text><text x="617" y="445" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Carry it safely</text><text x="617" y="513" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">The purchase creates</text><text x="617" y="553" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">a practical next need</text><rect x="1094" y="375" width="412" height="222" rx="22" fill="#FFFFFF"/><text x="1117" y="397" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#176E69">ADDITIONAL OFFER</text><text x="1117" y="445" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Compatible case</text><text x="1117" y="513" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">An optional product</text><text x="1117" y="553" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">addresses that need</text><line x1="521" y1="483" x2="579" y2="483" stroke="#176E69" stroke-width="5"/><polygon points="579,483 564,474 564,492" fill="#176E69"/><line x1="1021" y1="483" x2="1079" y2="483" stroke="#176E69" stroke-width="5"/><polygon points="1079,483 1064,474 1064,492" fill="#176E69"/><text x="64" y="692" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">TWO DIFFERENT WAYS TO GROW A SALE</text><rect x="64" y="746" width="724" height="200" rx="22" fill="#FFFFFF"/><text x="92" y="777" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">CROSS-SELLING</text><text x="92" y="833" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Laptop + carrying case</text><text x="92" y="896" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Add a complementary product or service</text><rect x="812" y="746" width="724" height="200" rx="22" fill="#FFFFFF"/><text x="840" y="777" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">UPSELLING</text><text x="840" y="833" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Laptop → higher-spec laptop</text><text x="840" y="896" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Choose a higher-value version</text><rect x="64" y="981" width="1472" height="75" rx="22" fill="#DCEDE8"/><text x="94" y="1005" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">The offer can happen during purchase, after purchase, or later in the relationship.</text><text x="64" y="1095" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative example. Relevance, compatibility, and timing determine whether the offer helps.</text></svg>