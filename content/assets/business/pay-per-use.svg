<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Pay per Use</title><desc id="desc">In a fictional document service, 100,000 billable documents at 10 cents each produce 10,000 dollars in revenue before costs. Define the unit and rules, record usage, and give customers timely cost visibility.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PAY PER USE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Connect the bill to measured activity.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Define the charging unit and make accumulated use visible.</text><rect x="64" y="320" width="440" height="370" rx="22" fill="#FFFFFF"/><text x="88" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">MEASURE</text><text x="88" y="420" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">100,000 documents</text><text x="88" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Count the activity</text><text x="88" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">that meets the agreed</text><text x="88" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">billing definition.</text><rect x="580" y="320" width="440" height="370" rx="22" fill="#DCEDE8"/><text x="604" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">APPLY THE RATE</text><text x="604" y="420" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">$0.10 per document</text><text x="604" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Apply rates, allowances,</text><text x="604" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and adjustment rules</text><text x="604" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">to measured activity.</text><rect x="1096" y="320" width="440" height="370" rx="22" fill="#FFFFFF"/><text x="1120" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CALCULATE</text><text x="1120" y="420" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">$10,000 revenue</text><text x="1120" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">The bill changes with use.</text><text x="1120" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Delivery and fixed costs</text><text x="1120" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">still need to be paid.</text><line x1="521" y1="500" x2="563" y2="500" stroke="#176E69" stroke-width="5"/><polygon points="563,500 548,491 548,509" fill="#176E69"/><line x1="1037" y1="500" x2="1079" y2="500" stroke="#176E69" stroke-width="5"/><polygon points="1079,500 1064,491 1064,509" fill="#176E69"/><rect x="64" y="810" width="1472" height="208" rx="22" fill="#DCEDE8"/><text x="90" y="843" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">A reliable meter is part of the product.</text><text x="90" y="911" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Explain failed work, rounding, retries, limits, and additional charges.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Fictional figures. Revenue is not profit; low usage can leave fixed costs uncovered.</text></svg>