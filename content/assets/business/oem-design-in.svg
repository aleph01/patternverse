<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">OEM Design-In: become part of the approved product design</title><desc id="desc">An illustrative supplier sequence starts with understanding OEM requirements, then integrating and validating an input, obtaining selection in the approved product design, and supplying against actual production orders if the product launches. Engineering and qualification investments can precede revenue. Repeat orders may follow the product lifecycle, but volumes and supplier shares can change. A design win is an opportunity rather than guaranteed production revenue.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">OEM DESIGN-IN</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Become part of the product’s design.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Win a place in the approved configuration, then support production over time.</text><text x="64" y="282" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">ENGINEERING + QUALIFICATION</text><text x="1130" y="282" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">IF THE PRODUCT LAUNCHES</text><rect x="64" y="350" width="347" height="225" rx="22" fill="#FFFFFF"/><text x="86" y="386" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Engage early</text><text x="86" y="465" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Understand the</text><text x="86" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">OEM’s requirements</text><rect x="439" y="350" width="347" height="225" rx="22" fill="#FFFFFF"/><text x="461" y="386" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Design + validate</text><text x="461" y="465" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Integrate, test,</text><text x="461" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and qualify the input</text><rect x="814" y="350" width="347" height="225" rx="22" fill="#176E69"/><text x="836" y="386" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Approved design</text><text x="836" y="465" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">Component included</text><text x="836" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">in the product design</text><rect x="1189" y="350" width="347" height="225" rx="22" fill="#FFFFFF"/><text x="1211" y="386" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Production</text><text x="1211" y="465" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Supply against</text><text x="1211" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">actual production orders</text><line x1="418" y1="446" x2="431" y2="446" stroke="#176E69" stroke-width="5"/><polygon points="431,446 416,437 416,455" fill="#176E69"/><line x1="793" y1="446" x2="806" y2="446" stroke="#176E69" stroke-width="5"/><polygon points="806,446 791,437 791,455" fill="#176E69"/><line x1="1168" y1="446" x2="1181" y2="446" stroke="#176E69" stroke-width="5"/><polygon points="1181,446 1166,437 1166,455" fill="#176E69"/><rect x="64" y="663" width="722" height="211" rx="22" fill="#FFFFFF"/><text x="91" y="695" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">EARLY COMMITMENT</text><text x="91" y="757" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Engineering, samples, tooling,</text><text x="91" y="813" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">and qualification can precede revenue.</text><rect x="814" y="663" width="722" height="211" rx="22" fill="#FFFFFF"/><text x="841" y="695" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">REPEAT BUSINESS</text><text x="841" y="757" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Orders can follow the product lifecycle.</text><text x="841" y="813" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Volumes and supplier shares can change.</text><rect x="64" y="943" width="1472" height="110" rx="22" fill="#DCEDE8"/><text x="93" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">A design win creates an opportunity; production orders create sales.</text><text x="64" y="1095" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Illustrative sequence. Milestones, commitments, and terminology vary by industry.</text></svg>