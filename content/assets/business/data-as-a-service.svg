<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Data as a Service: sell usable data, kept useful over time</title><desc id="desc">Source data from licensed feeds, observations, and records is cleaned, standardized, and maintained. A data service delivers access through an API, feed, dataset, or cloud connection. Customers use the data in applications, analysis, and workflows. Updates and corrections require continued maintenance. Useful data needs clear meaning, timeliness, and coverage; access alone does not guarantee suitability for a particular decision.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">DATA AS A SERVICE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Sell usable data, kept useful over time.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Customers pay for coverage, quality, access, and ongoing maintenance.</text><rect x="64" y="300" width="308" height="265" rx="22" fill="#FFFFFF"/><text x="84" y="329" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">SOURCE</text><text x="84" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Acquire inputs</text><text x="84" y="466" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Licensed feeds,</text><text x="84" y="513" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">observations, records</text><rect x="452" y="300" width="308" height="265" rx="22" fill="#DCEDE8"/><text x="472" y="329" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">MAINTAIN</text><text x="472" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Clean + refresh</text><text x="472" y="466" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Standardize, check,</text><text x="472" y="513" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">and correct data</text><rect x="840" y="300" width="308" height="265" rx="22" fill="#FFFFFF"/><text x="860" y="329" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">DELIVER</text><text x="860" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Provide access</text><text x="860" y="466" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">API, feed, dataset,</text><text x="860" y="513" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">or cloud connection</text><rect x="1228" y="300" width="308" height="265" rx="22" fill="#FFFFFF"/><text x="1248" y="329" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">USE</text><text x="1248" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Apply in context</text><text x="1248" y="466" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Applications, analysis,</text><text x="1248" y="513" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">and workflows</text><line x1="389" y1="433" x2="435" y2="433" stroke="#176E69" stroke-width="5"/><polygon points="435,433 420,424 420,442" fill="#176E69"/><line x1="777" y1="433" x2="823" y2="433" stroke="#176E69" stroke-width="5"/><polygon points="823,433 808,424 808,442" fill="#176E69"/><line x1="1165" y1="433" x2="1211" y2="433" stroke="#176E69" stroke-width="5"/><polygon points="1211,433 1196,424 1196,442" fill="#176E69"/><polyline points="994,588 994,677 606,677 606,588" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="606,588 597.0,604.0 615.0,604.0" fill="#176E69"/><text x="674" y="615" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Updates and corrections</text><text x="64" y="748" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">CONTEXT MAKES THE DATA USABLE</text><rect x="64" y="800" width="440" height="208" rx="22" fill="#DCEDE8"/><text x="88" y="831" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Meaning</text><text x="88" y="900" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Definitions, units,</text><text x="88" y="947" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">and methodology</text><rect x="580" y="800" width="440" height="208" rx="22" fill="#DCEDE8"/><text x="604" y="831" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Timeliness</text><text x="604" y="900" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">When it was observed,</text><text x="604" y="947" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">updated, or forecast</text><rect x="1096" y="800" width="440" height="208" rx="22" fill="#DCEDE8"/><text x="1120" y="831" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Coverage</text><text x="1120" y="900" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">What is included,</text><text x="1120" y="947" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">missing, or uncertain</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Delivery is one part of the offer. Quality, coverage, and maintenance make it useful.</text></svg>