<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Leverage Customer Data: turn customer activity into better decisions</title><desc id="desc">Customer purchases, searches, usage, and feedback provide signals for a defined purpose. Organized and interpreted signals inform a changed decision, such as recommendations, inventory planning, or risk assessment. Measure customer and business outcomes, then use the results to improve the next decision. Observations are not automatically evidence of a causal benefit. Data use requires appropriate authority and safeguards.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">LEVERAGE CUSTOMER DATA</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183343">Turn customer activity into better decisions.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Use relevant signals, change a decision, and measure the result.</text><rect x="64" y="300" width="308" height="265" rx="22" fill="#FFFFFF"/><text x="84" y="329" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">OBSERVE</text><text x="84" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Customer activity</text><text x="84" y="466" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Purchases, searches,</text><text x="84" y="513" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">usage, and feedback</text><rect x="452" y="300" width="308" height="265" rx="22" fill="#DCEDE8"/><text x="472" y="329" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">INTERPRET</text><text x="472" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Relevant signals</text><text x="472" y="466" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Organize information</text><text x="472" y="513" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">for a defined purpose</text><rect x="840" y="300" width="308" height="265" rx="22" fill="#FFFFFF"/><text x="860" y="329" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">APPLY</text><text x="860" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Changed decision</text><text x="860" y="466" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Recommend, stock,</text><text x="860" y="513" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">assist, or assess risk</text><rect x="1228" y="300" width="308" height="265" rx="22" fill="#FFFFFF"/><text x="1248" y="329" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">EVALUATE</text><text x="1248" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Measured outcome</text><text x="1248" y="466" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Check customer value</text><text x="1248" y="513" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">and business impact</text><line x1="389" y1="433" x2="435" y2="433" stroke="#176E69" stroke-width="5"/><polygon points="435,433 420,424 420,442" fill="#176E69"/><line x1="777" y1="433" x2="823" y2="433" stroke="#176E69" stroke-width="5"/><polygon points="823,433 808,424 808,442" fill="#176E69"/><line x1="1165" y1="433" x2="1211" y2="433" stroke="#176E69" stroke-width="5"/><polygon points="1211,433 1196,424 1196,442" fill="#176E69"/><polyline points="1382,588 1382,677 218,677 218,588" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="218,588 209.0,604.0 227.0,604.0" fill="#176E69"/><text x="454" y="615" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176E69">Use the results to improve the next decision</text><text x="64" y="748" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">THREE APPLICATIONS</text><rect x="64" y="800" width="440" height="208" rx="22" fill="#DCEDE8"/><text x="88" y="831" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Personalize</text><text x="88" y="900" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Help customers find</text><text x="88" y="947" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">relevant options</text><rect x="580" y="800" width="440" height="208" rx="22" fill="#DCEDE8"/><text x="604" y="831" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Plan</text><text x="604" y="900" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Match resources to</text><text x="604" y="947" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">expected demand</text><rect x="1096" y="800" width="440" height="208" rx="22" fill="#DCEDE8"/><text x="1120" y="831" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Assess risk</text><text x="1120" y="900" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Balance detection</text><text x="1120" y="947" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">and false alarms</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Judge the approach by better customer and business outcomes.</text></svg>