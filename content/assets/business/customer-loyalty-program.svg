<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Customer Loyalty Program: make returning more rewarding</title><desc id="desc">An illustrative customer loop records qualifying purchases or visits, shows progress through points, stamps, or status, provides rewards or benefits, and aims to encourage another qualifying purchase. The business must assess additional contribution less reward and program operating costs. Higher spending by members alone does not establish that the program caused the spending. Different reward mechanisms can be used separately or together.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CUSTOMER LOYALTY PROGRAM</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="51" font-weight="700" fill="#183343">Make returning more rewarding.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Recognize qualifying activity, show progress, and provide useful benefits.</text><rect x="64" y="281" width="1472" height="434" rx="22" fill="#DCEDE8"/><text x="95" y="313" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">THE CUSTOMER LOOP</text><rect x="94" y="378" width="308" height="204" rx="22" fill="#FFFFFF"/><text x="117" y="408" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Buy or visit</text><text x="117" y="486" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Record eligible</text><text x="117" y="531" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">activity</text><rect x="462" y="378" width="308" height="204" rx="22" fill="#FFFFFF"/><text x="485" y="408" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Make progress</text><text x="485" y="486" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Accumulate points,</text><text x="485" y="531" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">stamps, or status</text><rect x="830" y="378" width="308" height="204" rx="22" fill="#FFFFFF"/><text x="853" y="408" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Receive value</text><text x="853" y="486" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Redeem rewards or</text><text x="853" y="531" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">unlock benefits</text><rect x="1198" y="378" width="308" height="204" rx="22" fill="#FFFFFF"/><text x="1221" y="408" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Choose again</text><text x="1221" y="486" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Give the customer</text><text x="1221" y="531" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">a reason to return</text><line x1="417" y1="474" x2="449" y2="474" stroke="#176E69" stroke-width="5"/><polygon points="449,474 434,465 434,483" fill="#176E69"/><line x1="785" y1="474" x2="817" y2="474" stroke="#176E69" stroke-width="5"/><polygon points="817,474 802,465 802,483" fill="#176E69"/><line x1="1153" y1="474" x2="1185" y2="474" stroke="#176E69" stroke-width="5"/><polygon points="1185,474 1170,465 1170,483" fill="#176E69"/><polyline points="1352,600 1352,669 248,669 248,600" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="248,600 239.0,616.0 257.0,616.0" fill="#176E69"/><text x="482" y="613" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">Encourage the next qualifying purchase</text><rect x="64" y="769" width="1472" height="164" rx="22" fill="#FFFFFF"/><text x="94" y="800" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">THE BUSINESS TEST</text><text x="94" y="858" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Additional contribution − reward costs − program operating costs</text><rect x="64" y="967" width="1472" height="87" rx="22" fill="#DCEDE8"/><text x="94" y="995" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">More member spending does not, by itself, prove the program caused it.</text><text x="64" y="1095" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative loop. Points, status, stamps, and benefits can be used separately or together.</text></svg>