<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc"><title id="title">Barter: exchange what you offer for what you need</title><desc id="desc">Hypothetical direct barter between a design studio and a boutique hotel. The studio provides a defined design package and receives two off-peak room-nights. Both parties agree on an exchange value of eight hundred dollars per side; no eight-hundred-dollar cash payment passes between them. Illustrative additional delivery costs are two hundred fifty dollars for the studio and one hundred twenty dollars for the hotel. These costs exclude overhead, opportunity costs, and other charges.</desc><rect width="1600" height="1150" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">BARTER</text><text x="64" y="102" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183343">Exchange what you offer for what you need.</text><text x="64" y="181" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A hypothetical direct swap between two businesses.</text><rect x="64" y="254" width="678" height="218" rx="22" fill="#FFFFFF"/><text x="94" y="282" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#183343">Design studio</text><text x="94" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Offers: a defined design package</text><text x="94" y="409" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Wants: accommodation</text><rect x="858" y="254" width="678" height="218" rx="22" fill="#FFFFFF"/><text x="888" y="282" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#183343">Boutique hotel</text><text x="888" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Offers: two off-peak room-nights</text><text x="888" y="409" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Wants: design work</text><text x="538" y="513" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Design package delivered</text><line x1="155" y1="573" x2="1445" y2="573" stroke="#176E69" stroke-width="5"/><polygon points="1445,573 1430,564 1430,582" fill="#176E69"/><text x="500" y="620" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Two room-nights provided in return</text><line x1="1445" y1="678" x2="155" y2="678" stroke="#176E69" stroke-width="5"/><polygon points="155,678 170,669 170,687" fill="#176E69"/><rect x="64" y="725" width="1472" height="122" rx="22" fill="#DCEDE8"/><text x="94" y="749" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#176E69">Agreed exchange value: $800 per side</text><text x="94" y="805" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">No $800 cash payment passes between these parties.</text><rect x="64" y="885" width="678" height="139" rx="22" fill="#FFFFFF"/><text x="94" y="909" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#52646D">Studio: delivery cost</text><text x="94" y="953" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#176E69">$250</text><rect x="858" y="885" width="678" height="139" rx="22" fill="#FFFFFF"/><text x="888" y="909" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#52646D">Hotel: delivery cost</text><text x="888" y="953" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#176E69">$120</text><text x="64" y="1060" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183343">Both still incur costs and give up capacity. Exchange value is not profit.</text><text x="64" y="1103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative amounts; delivery costs exclude overhead, opportunity costs, and other charges.</text></svg>