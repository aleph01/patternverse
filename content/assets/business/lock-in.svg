<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Lock-in: the cost of changing providers</title><desc id="desc">A customer can move from an established setup to an alternative, but must first migrate data and workflows, learn and test the replacement, and replace incompatible assets or settle commitments. In a hypothetical example, a 6,000 dollar one-off switching cost takes three years to recover from 2,000 dollars in annual savings, assuming otherwise equal costs and service.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">LOCK-IN</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="51" font-weight="700" fill="#183343">The cost of changing providers.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">An alternative must justify both its ongoing cost and the transition.</text><rect x="64" y="269" width="440" height="185" rx="22" fill="#FFFFFF"/><text x="94" y="301" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">ESTABLISHED SETUP</text><text x="94" y="355" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Works with what</text><text x="94" y="399" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">you already use</text><rect x="1096" y="269" width="440" height="185" rx="22" fill="#FFFFFF"/><text x="1126" y="301" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">ALTERNATIVE</text><text x="1126" y="355" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Offers a reason</text><text x="1126" y="399" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">to change</text><line x1="526" y1="364" x2="1074" y2="364" stroke="#176E69" stroke-width="5"/><polygon points="1074,364 1059,355 1059,373" fill="#176E69"/><text x="609" y="313" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">TRANSITION REQUIRED</text><rect x="64" y="508" width="1472" height="257" rx="22" fill="#DCEDE8"/><text x="94" y="538" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">SWITCHING COSTS CAN INCLUDE</text><rect x="94" y="591" width="436" height="143" rx="22" fill="#FFFFFF"/><text x="115" y="610" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Migrate</text><text x="115" y="660" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Data, workflows,</text><text x="115" y="697" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and integrations</text><rect x="582" y="591" width="436" height="143" rx="22" fill="#FFFFFF"/><text x="603" y="610" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Learn and test</text><text x="603" y="660" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">New routines, training,</text><text x="603" y="697" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and transition risk</text><rect x="1070" y="591" width="436" height="143" rx="22" fill="#FFFFFF"/><text x="1091" y="610" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Replace or settle</text><text x="1091" y="660" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Incompatible assets</text><text x="1091" y="697" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and exit commitments</text><rect x="64" y="812" width="1472" height="222" rx="22" fill="#FFFFFF"/><text x="94" y="842" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">HYPOTHETICAL ECONOMICS</text><text x="94" y="900" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">$6,000 switching cost ÷ $2,000 annual savings = 3 years</text><text x="94" y="966" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Simple payback, assuming otherwise equal service and costs.</text><text x="64" y="1095" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Switching remains possible. Its cost changes when moving becomes worthwhile.</text></svg>