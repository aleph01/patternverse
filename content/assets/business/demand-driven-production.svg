<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Demand-driven production: from push to pull</title><desc id="desc">A sequence comparison. Push releases production from a forecast, then stocks and sells finished goods. Pull starts with an order or actual consumption, sends a signal, makes or replenishes the required goods, then delivers. Hybrid systems prepare common inputs in advance and wait for demand before committing to a specific finished product. Pull can still use planned capacity and stock buffers.</desc><rect width="1600" height="1100" fill="#F6F4EF"/><text x="64" y="51" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">FROM PUSH TO PULL</text><text x="64" y="104" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#183343">Demand-driven production</text><text x="64" y="184" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="400" fill="#52646D">Let an order or actual use authorize the next production step.</text><text x="64" y="286" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#52646D">PUSH</text><text x="179" y="286" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Production released by a forecast</text><rect x="64" y="346" width="320" height="140" rx="22" fill="#E6E9E9"/><text x="86" y="372" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Forecast</text><text x="86" y="425" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#52646D">Estimate future sales</text><path d="M398 416H424" stroke="#52646D" stroke-width="4"/><path d="M434 416l-14 -9v18z" fill="#52646D"/><rect x="448" y="346" width="320" height="140" rx="22" fill="#E6E9E9"/><text x="470" y="372" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Produce</text><text x="470" y="425" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#52646D">Commit to finished goods</text><path d="M782 416H808" stroke="#52646D" stroke-width="4"/><path d="M818 416l-14 -9v18z" fill="#52646D"/><rect x="832" y="346" width="320" height="140" rx="22" fill="#E6E9E9"/><text x="854" y="372" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Stock</text><text x="854" y="425" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#52646D">Hold until needed</text><path d="M1166 416H1192" stroke="#52646D" stroke-width="4"/><path d="M1202 416l-14 -9v18z" fill="#52646D"/><rect x="1216" y="346" width="320" height="140" rx="22" fill="#E6E9E9"/><text x="1238" y="372" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Sell / deliver</text><text x="1238" y="425" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#52646D">Find the buyer</text><text x="64" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Risk: the quantity or product mix may differ from what customers buy.</text><text x="64" y="606" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">PULL</text><text x="179" y="606" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Production released by a demand signal</text><rect x="64" y="666" width="320" height="140" rx="22" fill="#176E69"/><text x="86" y="692" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#FFFFFF">Order / use</text><text x="86" y="745" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#FFFFFF">Demand is observed</text><path d="M398 736H424" stroke="#176E69" stroke-width="4"/><path d="M434 736l-14 -9v18z" fill="#176E69"/><rect x="448" y="666" width="320" height="140" rx="22" fill="#DCEDE8"/><text x="470" y="692" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176E69">Signal</text><text x="470" y="745" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#52646D">Specify what is needed</text><path d="M782 736H808" stroke="#176E69" stroke-width="4"/><path d="M818 736l-14 -9v18z" fill="#176E69"/><rect x="832" y="666" width="320" height="140" rx="22" fill="#DCEDE8"/><text x="854" y="692" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176E69">Make / refill</text><text x="854" y="745" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#52646D">Authorize the next batch</text><path d="M1166 736H1192" stroke="#176E69" stroke-width="4"/><path d="M1202 736l-14 -9v18z" fill="#176E69"/><rect x="1216" y="666" width="320" height="140" rx="22" fill="#DCEDE8"/><text x="1238" y="692" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176E69">Deliver</text><text x="1238" y="745" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#52646D">Fulfill or replenish</text><text x="64" y="830" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Requirement: respond reliably within the time the customer can accept.</text><rect x="64" y="914" width="1472" height="107" rx="16" fill="#FFFFFF"/><text x="88" y="934" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">A common hybrid</text><text x="88" y="974" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183343">Prepare shared inputs</text><path d="M402 990H450" stroke="#176E69" stroke-width="4"/><path d="M460 990l-14 -9v18z" fill="#176E69"/><text x="480" y="974" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183343">Confirm demand</text><path d="M733 990H781" stroke="#176E69" stroke-width="4"/><path d="M791 990l-14 -9v18z" fill="#176E69"/><text x="811" y="974" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183343">Finish the specific product</text><text x="64" y="1050" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Pull can still use forecasts for capacity planning and carefully sized stock buffers.</text></svg>