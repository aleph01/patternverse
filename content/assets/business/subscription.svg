<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Subscription: recurring payment, continuing value</title><desc id="desc">Across three illustrative subscription periods the customer pays for access, deliveries, or ongoing service. The provider continues to deliver the agreed value in every period. Renewal follows the subscription terms. Billing frequency, commitment length, and cancellation rules are separate choices. Recurring fees bring recurring delivery costs and obligations. The illustration is conceptual and shows no company prices or retention data.</desc><rect width="1600" height="1100" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">SUBSCRIPTION</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Recurring payment. Continuing value.</text><text x="64" y="188" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Each period carries a promise: access, deliveries, or ongoing service.</text><rect x="64" y="286" width="464" height="311" rx="22" fill="#FFFFFF"/><text x="92" y="315" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Period 1</text><rect x="88" y="380" width="416" height="76" rx="12" fill="#E6E9E9"/><text x="109" y="405" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Customer pays</text><rect x="88" y="475" width="416" height="84" rx="12" fill="#DCEDE8"/><text x="109" y="503" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Provider delivers</text><rect x="568" y="286" width="464" height="311" rx="22" fill="#FFFFFF"/><text x="596" y="315" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Period 2</text><rect x="592" y="380" width="416" height="76" rx="12" fill="#E6E9E9"/><text x="613" y="405" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Customer pays</text><rect x="592" y="475" width="416" height="84" rx="12" fill="#DCEDE8"/><text x="613" y="503" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Provider delivers</text><rect x="1072" y="286" width="464" height="311" rx="22" fill="#FFFFFF"/><text x="1100" y="315" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Period 3</text><rect x="1096" y="380" width="416" height="76" rx="12" fill="#E6E9E9"/><text x="1117" y="405" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Customer pays</text><rect x="1096" y="475" width="416" height="84" rx="12" fill="#DCEDE8"/><text x="1117" y="503" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Provider delivers</text><path d="M535 440H550" stroke="#176E69" stroke-width="4"/><path d="M560 440l-14 -10v20z" fill="#176E69"/><path d="M1039 440H1054" stroke="#176E69" stroke-width="4"/><path d="M1064 440l-14 -10v20z" fill="#176E69"/><text x="64" y="634" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Continuation and renewal follow the agreed terms.</text><rect x="64" y="712" width="1472" height="143" rx="22" fill="#176E69"/><text x="94" y="742" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">The promise can take different forms.</text><text x="94" y="800" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#FFFFFF">Content access  •  Software capabilities  •  Product replenishment  •  Support</text><text x="64" y="908" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Billing frequency ≠ commitment length ≠ cancellation rules</text><text x="64" y="970" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Recurring fees bring recurring delivery costs and obligations.</text><text x="64" y="1043" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Conceptual model. Periods are illustrative; no prices or retention rates are implied.</text></svg>