<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">White Label: one core, several branded offers</title><desc id="desc">A supplier develops or delivers a reusable product, software platform, or service. Independent sellers configure, package, or present that capability under Brand A, Brand B, and Brand C. Each seller serves its audience with its own positioning and customer offer. The supplier earns agreed supply or platform fees. Illustrative structure; customization and support responsibilities vary.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">WHITE LABEL</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="51" font-weight="700" fill="#183343">One core. Several branded offers.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Separate the underlying capability from the brand customers buy.</text><rect x="420" y="260" width="760" height="185" rx="22" fill="#FFFFFF"/><text x="452" y="290" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">SUPPLIER</text><text x="452" y="344" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#183343">Develops or delivers the core</text><text x="452" y="402" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">A reusable product, software platform, or service</text><text x="325" y="485" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#176E69">Configured, packaged, or presented for each seller</text><polyline points="800,545 284,545 284,624" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="284,624 293.0,608.0 275.0,608.0" fill="#176E69"/><polyline points="800,545 800,545 800,624" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="800,624 809.0,608.0 791.0,608.0" fill="#176E69"/><polyline points="800,545 1316,545 1316,624" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1316,624 1325.0,608.0 1307.0,608.0" fill="#176E69"/><rect x="64" y="650" width="440" height="245" rx="22" fill="#DCEDE8"/><text x="89" y="681" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">BRAND A</text><text x="89" y="740" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Shared underlying core</text><text x="89" y="799" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Seller’s own positioning</text><text x="89" y="843" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and customer offer</text><rect x="580" y="650" width="440" height="245" rx="22" fill="#E6E8EF"/><text x="605" y="681" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">BRAND B</text><text x="605" y="740" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Shared underlying core</text><text x="605" y="799" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Seller’s own positioning</text><text x="605" y="843" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and customer offer</text><rect x="1096" y="650" width="440" height="245" rx="22" fill="#F0E3D3"/><text x="1121" y="681" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">BRAND C</text><text x="1121" y="740" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Shared underlying core</text><text x="1121" y="799" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Seller’s own positioning</text><text x="1121" y="843" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and customer offer</text><rect x="64" y="946" width="1472" height="99" rx="22" fill="#FFFFFF"/><text x="94" y="978" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">The supplier earns agreed supply fees, platform fees, or usage charges.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Illustrative structure. Customization, provider visibility, and responsibilities vary.</text></svg>