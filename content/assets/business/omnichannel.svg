<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Omnichannel: keep the journey connected</title><desc id="desc">Illustrative customer journey moves from comparing on a website to ordering in an app, collecting in a store, and resolving an issue through support. Relevant order details, availability, fulfilment status, and service history connect these steps. Staff and processes support the handoffs. This is a possible journey rather than a required sequence; information access follows appropriate permissions.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">OMNICHANNEL</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="51" font-weight="700" fill="#183343">Keep the journey connected.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Illustrative journey: the customer changes channels while the relevant context carries forward.</text><rect x="64" y="294" width="290" height="225" rx="22" fill="#FFFFFF"/><text x="88" y="322" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">WEBSITE</text><text x="88" y="384" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#183343">Compare</text><text x="88" y="471" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Explore the options</text><polyline points="209,529 209,669" fill="none" stroke="#52646D" stroke-width="3"/><rect x="458" y="294" width="290" height="225" rx="22" fill="#FFFFFF"/><text x="482" y="322" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">APP</text><text x="482" y="384" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#183343">Order</text><text x="482" y="471" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Confirm the purchase</text><polyline points="603,529 603,669" fill="none" stroke="#52646D" stroke-width="3"/><rect x="852" y="294" width="290" height="225" rx="22" fill="#FFFFFF"/><text x="876" y="322" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">STORE</text><text x="876" y="384" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#183343">Collect</text><text x="876" y="471" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Receive the order</text><polyline points="997,529 997,669" fill="none" stroke="#52646D" stroke-width="3"/><rect x="1246" y="294" width="290" height="225" rx="22" fill="#FFFFFF"/><text x="1270" y="322" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">SUPPORT</text><text x="1270" y="384" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#183343">Resolve</text><text x="1270" y="471" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Continue with context</text><polyline points="1391,529 1391,669" fill="none" stroke="#52646D" stroke-width="3"/><line x1="367" y1="406" x2="445" y2="406" stroke="#176E69" stroke-width="5"/><polygon points="445,406 430,397 430,415" fill="#176E69"/><line x1="761" y1="406" x2="839" y2="406" stroke="#176E69" stroke-width="5"/><polygon points="839,406 824,397 824,415" fill="#176E69"/><line x1="1155" y1="406" x2="1233" y2="406" stroke="#176E69" stroke-width="5"/><polygon points="1233,406 1218,397 1218,415" fill="#176E69"/><rect x="64" y="669" width="1472" height="181" rx="22" fill="#176E69"/><text x="93" y="698" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">CONNECTED CONTEXT</text><text x="93" y="757" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#FFFFFF">Order details · availability · fulfilment status · service history</text><text x="93" y="815" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">Available where relevant, with appropriate permissions</text><rect x="64" y="901" width="1472" height="116" rx="22" fill="#DCEDE8"/><text x="92" y="924" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">People and processes make the handoff work.</text><text x="92" y="978" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Staff can act on the information and continue the customer’s task.</text><text x="64" y="1062" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">This is one possible journey. Customers can use fewer channels or follow a different sequence.</text><text x="64" y="1105" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Connected channels can offer different capabilities while supporting a coherent experience.</text></svg>