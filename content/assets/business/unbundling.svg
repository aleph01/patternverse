<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090" role="img" aria-labelledby="title desc"><title id="title">Unbundling: separate the offer, preserve the choice</title><desc id="desc">Illustrative offer, not company data. A product, delivery and setup are sold as a package for 45 dollars. The unbundled alternatives cost 30 dollars for the product, 15 dollars for optional delivery, and 10 dollars for optional setup. Product alone costs 30 dollars; product with delivery costs 45 dollars; all three cost 55 dollars. Buying fewer components can save money while buying all components separately can cost more.</desc><rect width="1600" height="1090" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">UNBUNDLING</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183343">Separate the offer. Preserve the choice.</text><text x="64" y="186" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="400" fill="#52646D">An illustrative offer: a product, delivery, and setup.</text><rect x="64" y="271" width="1472" height="138" rx="22" fill="#E6E9E9"/><text x="94" y="299" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#183343">Combined package: $45</text><text x="94" y="357" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Product + delivery + setup</text><polyline points="800,409 800,455" fill="none" stroke="#176E69" stroke-width="4"/><polyline points="296,455 1304,455" fill="none" stroke="#176E69" stroke-width="4"/><polyline points="296,455 296,491" fill="none" stroke="#176E69" stroke-width="4"/><path d="M296 501l-10 -14h20z" fill="#176E69"/><polyline points="800,455 800,491" fill="none" stroke="#176E69" stroke-width="4"/><path d="M800 501l-10 -14h20z" fill="#176E69"/><polyline points="1304,455 1304,491" fill="none" stroke="#176E69" stroke-width="4"/><path d="M1304 501l-10 -14h20z" fill="#176E69"/><rect x="64" y="519" width="464" height="174" rx="22" fill="#DCEDE8"/><text x="90" y="544" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#176E69">Product</text><text x="90" y="597" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Core purchase</text><text x="90" y="641" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">$30</text><rect x="568" y="519" width="464" height="174" rx="22" fill="#DCEDE8"/><text x="594" y="544" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#176E69">Delivery</text><text x="594" y="597" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Optional service</text><text x="594" y="641" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">$15</text><rect x="1072" y="519" width="464" height="174" rx="22" fill="#DCEDE8"/><text x="1098" y="544" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#176E69">Setup</text><text x="1098" y="597" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Optional service</text><text x="1098" y="641" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">$10</text><text x="64" y="743" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#52646D">DIFFERENT NEEDS, DIFFERENT TOTALS</text><rect x="64" y="790" width="464" height="126" rx="16" fill="#FFFFFF"/><text x="90" y="812" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Product only</text><text x="90" y="861" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#176E69">$30</text><rect x="568" y="790" width="464" height="126" rx="16" fill="#FFFFFF"/><text x="594" y="812" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Product + delivery</text><text x="594" y="861" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#176E69">$45</text><rect x="1072" y="790" width="464" height="126" rx="16" fill="#FFFFFF"/><text x="1098" y="812" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">All three</text><text x="1098" y="861" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#176E69">$55</text><text x="64" y="963" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Illustrative prices, not company data. Compare the full cost of the chosen combination.</text><rect x="64" y="1011" width="1472" height="59" rx="16" fill="#176E69"/><text x="88" y="1028" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Fewer components can cost less; buying every part separately can cost more.</text></svg>