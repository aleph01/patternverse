<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Repair and Maintenance: preserve or restore useful function</title><desc id="desc">A product in use is assessed through inspection, monitoring, or diagnosis. Maintenance preserves function through scheduled or condition-led service. Repair restores function by correcting a fault. Both paths lead to verification, documentation, and a return to useful service. Continued use leads to further assessment as needed. Skills, spare parts, diagnostic information, and service history support the process. Revenue can come from individual jobs, defined contracts, or parts and tools that enable others to repair.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">REPAIR AND MAINTENANCE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Earn by keeping products useful.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Preserve working function, restore lost function, and verify the result.</text><rect x="64" y="410" width="440" height="230" rx="22" fill="#FFFFFF"/><text x="88" y="440" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">PRODUCT IN USE</text><text x="88" y="490" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Assess condition</text><text x="88" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Observe wear, monitor use,</text><text x="88" y="595" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">or investigate a fault.</text><rect x="580" y="300" width="440" height="184" rx="22" fill="#DCEDE8"/><text x="604" y="318" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">MAINTENANCE</text><text x="604" y="362" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Preserve function</text><text x="604" y="410" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Scheduled or condition-led</text><text x="604" y="443" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">service and component care.</text><rect x="580" y="580" width="440" height="184" rx="22" fill="#DCEDE8"/><text x="604" y="598" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">REPAIR</text><text x="604" y="642" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Restore function</text><text x="604" y="690" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Identify and correct a fault</text><text x="604" y="723" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">with suitable parts and work.</text><polyline points="521,525 548,525 548,382 563,382" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="563,382 547.0,373.0 547.0,391.0" fill="#176E69"/><polyline points="521,525 548,525 548,662 563,662" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="563,662 547.0,653.0 547.0,671.0" fill="#176E69"/><rect x="1096" y="410" width="440" height="230" rx="22" fill="#FFFFFF"/><text x="1120" y="440" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">VERIFIED RESULT</text><text x="1120" y="490" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Check and return to use</text><text x="1120" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Verify the work and record</text><text x="1120" y="595" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">the product’s condition.</text><polyline points="1037,382 1060,382 1060,525 1079,525" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1079,525 1063.0,516.0 1063.0,534.0" fill="#176E69"/><polyline points="1037,662 1060,662 1060,525 1079,525" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1079,525 1063.0,516.0 1063.0,534.0" fill="#176E69"/><polyline points="1316,660 1316,820 284,820 284,660" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="284,660 275.0,676.0 293.0,676.0" fill="#176E69"/><text x="460" y="775" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">Use → assess → service → verify → use</text><rect x="64" y="889" width="1472" height="145" rx="22" fill="#DCEDE8"/><text x="92" y="917" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">Skills, spare parts, diagnostic information, and service history</text><text x="92" y="984" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Earn through individual jobs, defined contracts, or tools and parts that enable others to repair.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Contract scope defines the labor, parts, response times, and risks included.</text></svg>