<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Fiscal Hosting: share the infrastructure behind a project</title><desc id="desc">Supporters and funders send eligible funding to an established fiscal host. The host receives funds, maintains project-level records, reviews requests and pays approved vendors, contributors or other eligible recipients. The project team plans its work and submits spending requests and receipts. Funds are managed through the host rather than paid into a separate project bank account. The hosting agreement defines control, responsibilities, fees and exit arrangements.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">FISCAL HOSTING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Share the infrastructure behind a project.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Receive funding and pay approved expenses through an established organization.</text><rect x="64" y="300" width="440" height="330" rx="22" fill="#FFFFFF"/><text x="88" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">FUNDING IN</text><text x="88" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Supporters and funders</text><text x="88" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Send donations, grants,</text><text x="88" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">or other eligible funding</text><text x="88" y="560" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">through the host.</text><rect x="580" y="300" width="440" height="330" rx="22" fill="#DCEDE8"/><text x="604" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">FINANCIAL HOME</text><text x="604" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Fiscal host</text><text x="604" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Receives and records funds.</text><text x="604" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Tracks project balances.</text><text x="604" y="560" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Reviews and pays expenses.</text><rect x="1096" y="300" width="440" height="330" rx="22" fill="#FFFFFF"/><text x="1120" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PAYMENTS OUT</text><text x="1120" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Eligible recipients</text><text x="1120" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Vendors, contributors,</text><text x="1120" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and other approved payees</text><text x="1120" y="560" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">receive payments.</text><line x1="521" y1="465" x2="563" y2="465" stroke="#176E69" stroke-width="5"/><polygon points="563,465 548,456 548,474" fill="#176E69"/><line x1="1037" y1="465" x2="1079" y2="465" stroke="#176E69" stroke-width="5"/><polygon points="1079,465 1064,456 1064,474" fill="#176E69"/><polyline points="800,808 800,652" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="800,652 791.0,668.0 809.0,668.0" fill="#176E69"/><text x="838" y="705" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Spending requests and receipts</text><rect x="580" y="830" width="440" height="180" rx="22" fill="#FFFFFF"/><text x="604" y="853" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">PROJECT TEAM</text><text x="604" y="909" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">Plans the work and</text><text x="604" y="954" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#183343">requests spending.</text><text x="64" y="867" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Funding is administered</text><text x="64" y="915" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">through the host’s</text><text x="64" y="963" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">financial infrastructure.</text><text x="1096" y="867" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">The host checks requests</text><text x="1096" y="915" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">against the agreement</text><text x="1096" y="963" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and applicable obligations.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Agreements define control, responsibilities, fees, and exit arrangements.</text></svg>