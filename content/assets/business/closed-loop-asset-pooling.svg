<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Closed-Loop Asset Pooling: earn from repeated circulation</title><desc id="desc">A pool operator issues ready-to-use assets to a sender. Assets carry goods to a receiver. Empty assets are collected, inspected and serviced, then reissued to the next user. The pool operator coordinates inventory, custody and availability across the cycle. A user receives a suitable asset from the pool rather than necessarily the same physical item.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CLOSED-LOOP ASSET POOLING</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Earn from repeated circulation.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Manage the asset through use, recovery, servicing, and its next assignment.</text><rect x="64" y="280" width="440" height="250" rx="22" fill="#DCEDE8"/><text x="88" y="305" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">1 / ISSUE</text><text x="88" y="358" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Ready-to-use pool</text><text x="88" y="428" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Supply suitable assets</text><text x="88" y="473" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">where they are needed.</text><rect x="1096" y="280" width="440" height="250" rx="22" fill="#FFFFFF"/><text x="1120" y="305" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">2 / USE</text><text x="1120" y="358" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Sender to receiver</text><text x="1120" y="428" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Assets carry goods</text><text x="1120" y="473" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">through the network.</text><rect x="1096" y="670" width="440" height="250" rx="22" fill="#FFFFFF"/><text x="1120" y="695" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">3 / RECOVER</text><text x="1120" y="748" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Collect empty assets</text><text x="1120" y="818" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Record custody and returns;</text><text x="1120" y="863" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">bring assets back promptly.</text><rect x="64" y="670" width="440" height="250" rx="22" fill="#DCEDE8"/><text x="88" y="695" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">4 / PREPARE</text><text x="88" y="748" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Inspect and service</text><text x="88" y="818" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Clean, refill, or repair</text><text x="88" y="863" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">as the asset requires.</text><polyline points="525,405 1075,405" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1075,405 1059.0,396.0 1059.0,414.0" fill="#176E69"/><polyline points="1316,550 1316,650" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1316,650 1325.0,634.0 1307.0,634.0" fill="#176E69"/><polyline points="1075,795 525,795" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="525,795 541.0,804.0 541.0,786.0" fill="#176E69"/><polyline points="284,650 284,550" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="284,550 275.0,566.0 293.0,566.0" fill="#176E69"/><rect x="560" y="491" width="480" height="227" rx="22" fill="#FFFFFF"/><text x="588" y="518" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">POOL OPERATOR</text><text x="588" y="573" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Coordinates stock, custody,</text><text x="588" y="613" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">service, and availability.</text><text x="588" y="668" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Reissue to the next suitable user.</text><rect x="64" y="982" width="1472" height="72" rx="22" fill="#DCEDE8"/><text x="89" y="1005" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">One managed fleet. Many uses. A suitable asset each time, rather than the same item.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">The loop must work operationally: return rates, turnaround time, and location all matter.</text></svg>