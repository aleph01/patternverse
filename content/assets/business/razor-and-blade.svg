<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Razor and Blade: easy entry, repeat purchases</title><desc id="desc">An accessible durable starter product enables repeated use, which creates demand for compatible consumables. In an illustrative subsidized version, a starter contributes minus twenty dollars and each refill purchase contributes five dollars after variable costs. Four refill purchases recover the starter subsidy, before acquisition, support, fixed costs and financing. Further purchases can contribute to those costs and profit. Repeat purchases are not guaranteed.</desc><rect width="1600" height="1100" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">RAZOR AND BLADE / BAIT AND HOOK</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#183343">Make entry easy. Earn through continued use.</text><text x="64" y="188" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">A durable starter creates demand for compatible repeat purchases.</text><rect x="64" y="293" width="464" height="233" rx="22" fill="#E6E9E9"/><text x="90" y="323" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Starter product</text><text x="90" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Buy the handle, printer,</text><text x="90" y="433" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">or coffee machine.</text><rect x="568" y="293" width="464" height="233" rx="22" fill="#DCEDE8"/><text x="594" y="323" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Repeated use</text><text x="594" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Shave, print, or brew;</text><text x="594" y="433" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">consume the supplies.</text><rect x="1072" y="293" width="464" height="233" rx="22" fill="#DCEDE8"/><text x="1098" y="323" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Refill purchases</text><text x="1098" y="389" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Buy compatible blades,</text><text x="1098" y="433" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">ink, or coffee capsules.</text><polyline points="535,410 550,410" fill="none" stroke="#176E69" stroke-width="4"/><path d="M560 410l-14 -10v20z" fill="#176E69"/><polyline points="1039,410 1054,410" fill="none" stroke="#176E69" stroke-width="4"/><path d="M1064 410l-14 -10v20z" fill="#176E69"/><polyline points="1304,542 1304,578 800,578 800,550" fill="none" stroke="#176E69" stroke-width="4"/><path d="M800 536l-10 14h20z" fill="#176E69"/><text x="875" y="596" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#176E69">Use → replace → use again</text><rect x="64" y="669" width="1472" height="300" rx="20" fill="#FFFFFF"/><text x="94" y="695" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Illustrative payback: a subsidized starter</text><text x="94" y="763" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">−$20</text><text x="425" y="763" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="400" fill="#52646D">+</text><text x="495" y="763" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#176E69">4 × $5</text><text x="970" y="763" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="400" fill="#52646D">=</text><text x="1050" y="763" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">$0</text><text x="94" y="830" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Starter contribution</text><text x="495" y="830" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Refill contribution</text><text x="1050" y="830" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Subsidy recovered</text><text x="94" y="899" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Contribution is after variable costs; $5 is not the refill selling price.</text><text x="64" y="1004" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Hypothetical figures. Excludes acquisition, support, fixed costs, and financing.</text><text x="64" y="1049" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Further purchases can contribute to those costs and profit; repeat buying is not guaranteed.</text></svg>