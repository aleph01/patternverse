<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090" role="img" aria-labelledby="title desc"><title id="title">Freemium: useful for free, more valuable when paid</title><desc id="desc">People enter a useful ongoing free tier. Some remain free, while others choose a paid tier for more capacity, capabilities, or a better experience. Paid contribution and any free-tier revenue must cover the costs of serving free users and the shared business costs. Remaining free is a valid customer outcome. This is a conceptual diagram, not a measured conversion funnel.</desc><rect width="1600" height="1090" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">FREEMIUM</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Useful for free. More valuable when paid.</text><text x="64" y="187" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Remove the payment barrier, then charge for a meaningful step up.</text><rect x="270" y="269" width="1060" height="167" rx="22" fill="#176E69"/><text x="304" y="298" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#FFFFFF">Useful, ongoing free tier</text><text x="304" y="358" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#FFFFFF">Experience the core value without paying to start.</text><polyline points="800,450 800,485 420,485 420,507" fill="none" stroke="#176E69" stroke-width="4"/><polyline points="800,485 1180,485 1180,507" fill="none" stroke="#176E69" stroke-width="4"/><polyline points="420,507 420,526" fill="none" stroke="#176E69" stroke-width="4"/><path d="M420 536l-10 -14h20z" fill="#176E69"/><polyline points="1180,507 1180,526" fill="none" stroke="#176E69" stroke-width="4"/><path d="M1180 536l-10 -14h20z" fill="#176E69"/><rect x="64" y="550" width="712" height="250" rx="22" fill="#E6E9E9"/><text x="94" y="581" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#183343">Remain free</text><text x="94" y="641" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">The free tier meets the current need.</text><text x="94" y="698" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Some users may refer or collaborate;</text><text x="94" y="741" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">these benefits are not automatic.</text><rect x="824" y="550" width="712" height="250" rx="22" fill="#DCEDE8"/><text x="854" y="581" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#176E69">Choose paid</text><text x="854" y="641" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A stronger need justifies an upgrade.</text><text x="854" y="698" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">More capacity • Extra capabilities</text><text x="854" y="741" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Better experience • Business controls</text><rect x="64" y="849" width="1472" height="137" rx="18" fill="#FFFFFF"/><text x="94" y="875" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">The business must support both groups.</text><text x="94" y="928" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Paid contribution + any free-tier revenue must cover free-tier and shared costs.</text><text x="64" y="1031" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Conceptual model. Branch sizes do not represent conversion rates.</text></svg>