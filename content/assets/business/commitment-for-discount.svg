<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Commitment or Discount: a lower rate in exchange for less flexibility</title><desc id="desc">Hypothetical comparison of the same service. A flexible plan costs one hundred dollars per month and can end after each month. A twelve-month commitment costs eighty dollars per month, billed monthly, with a full nine hundred sixty dollar annual obligation and no early exit in this example. For twelve months of need, the flexible plan costs twelve hundred dollars and the commitment costs nine hundred sixty, saving two hundred forty dollars. For only six months of need, the flexible plan costs six hundred dollars while the annual commitment still costs nine hundred sixty. Taxes and other charges are excluded.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">COMMITMENT OR DISCOUNT</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Trade flexibility for a lower price.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">The same service, offered with two different obligations.</text><rect x="64" y="267" width="716" height="336" rx="22" fill="#FFFFFF"/><text x="90" y="295" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">FLEXIBLE TERMS</text><text x="90" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">$100/month</text><text x="90" y="428" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">End after any paid month</text><text x="90" y="474" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Pay only for months retained</text><text x="90" y="542" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#176E69">$1,200 for 12 months</text><rect x="820" y="267" width="716" height="336" rx="22" fill="#DCEDE8"/><text x="846" y="295" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">12-MONTH COMMITMENT</text><text x="846" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">$80/month</text><text x="846" y="428" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Billed monthly; committed for a year</text><text x="846" y="474" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Full annual obligation: $960</text><text x="846" y="542" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#176E69">$960 for 12 months</text><rect x="64" y="647" width="1472" height="119" rx="22" fill="#176E69"/><text x="94" y="673" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">Need it for the full year? The commitment saves $240.</text><text x="94" y="729" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#FFFFFF">$1,200 flexible cost − $960 committed cost = $240 saving</text><rect x="64" y="811" width="1472" height="171" rx="22" fill="#FFFFFF"/><text x="94" y="838" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">Need it for only 6 months?</text><text x="94" y="896" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">Flexible: $600     |     Committed: $960 still owed in total</text><text x="94" y="950" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">The lower monthly rate does not guarantee the lower total cost.</text><text x="64" y="1040" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Hypothetical prices, not company offers. Taxes and other charges excluded.</text><text x="64" y="1084" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Example assumes no early exit from the annual obligation; actual terms vary.</text></svg>