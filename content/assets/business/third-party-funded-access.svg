<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Third-Party-Funded Access: the payer and user have different roles</title><desc id="desc">A third-party payer, such as an advertiser or employer, pays a provider. The provider gives users free or lower-price access. Advertisers can buy ad placement and audience reach. Employers can purchase education access and learning support for eligible staff. The provider must deliver value to both users and payers. Funding can cover all or part of access and may coexist with user payments.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">THIRD-PARTY-FUNDED ACCESS / HIDDEN REVENUE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#183343">The person using it is not the only possible payer.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">A service for users. A separate reason for someone else to pay.</text><rect x="64" y="280" width="410" height="250" rx="22" fill="#FFFFFF"/><text x="88" y="306" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">THIRD-PARTY PAYER</text><text x="88" y="362" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Advertiser or employer</text><text x="88" y="423" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Pays for a defined</text><text x="88" y="471" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">commercial benefit.</text><rect x="595" y="280" width="410" height="250" rx="22" fill="#DCEDE8"/><text x="619" y="306" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PROVIDER</text><text x="619" y="362" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Runs the service</text><text x="619" y="423" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Receives revenue and</text><text x="619" y="471" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">delivers the user offer.</text><rect x="1126" y="280" width="410" height="250" rx="22" fill="#FFFFFF"/><text x="1150" y="306" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">USER</text><text x="1150" y="362" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Receives access</text><text x="1150" y="423" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Free or lower-price use,</text><text x="1150" y="471" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">under the offer terms.</text><line x1="490" y1="393" x2="575" y2="393" stroke="#176E69" stroke-width="5"/><polygon points="575,393 560,384 560,402" fill="#176E69"/><text x="493" y="349" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#176E69">Pays</text><line x1="1021" y1="393" x2="1106" y2="393" stroke="#176E69" stroke-width="5"/><polygon points="1106,393 1091,384 1091,402" fill="#176E69"/><text x="1026" y="349" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#176E69">Access</text><text x="64" y="587" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">WHAT THE PAYER RECEIVES</text><rect x="64" y="638" width="1472" height="100" rx="22" fill="#FFFFFF"/><text x="90" y="658" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#176E69">ADVERTISING</text><text x="500" y="669" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Ad placement and access to an audience.</text><rect x="64" y="763" width="1472" height="100" rx="22" fill="#FFFFFF"/><text x="90" y="783" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#176E69">EMPLOYER FUNDING</text><text x="500" y="794" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Education access and support for eligible staff.</text><rect x="64" y="914" width="1472" height="110" rx="22" fill="#176E69"/><text x="94" y="947" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">Both the user offer and the payer offer must work.</text><text x="64" y="1070" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Third-party funding can cover all or part of access and coexist with user payments.</text></svg>