<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Reserved Capacity: pay to keep an agreed amount available</title><desc id="desc">Hypothetical production window with ten matching machine slots. Customer A has reserved four slots and currently uses three. One additional slot stays ready for A; the remaining six can be booked by others. In this dedicated allocation example, the provider cannot sell the fourth slot to someone else without A releasing it or otherwise preserving the agreed access. Reservation fees may include usage or be combined with separate usage charges. Capacity is not ownership of a machine.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">RESERVED CAPACITY</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Pay to keep room for when you need it.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">The product is an agreed right to capacity in a defined place and time window.</text><text x="64" y="257" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Illustrative production window: 10 matching machine slots</text><rect x="64" y="338" width="130" height="170" rx="16" fill="#176E69"/><text x="85" y="365" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">A</text><text x="79" y="449" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#FFFFFF">in use</text><rect x="212" y="338" width="130" height="170" rx="16" fill="#176E69"/><text x="233" y="365" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">A</text><text x="227" y="449" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#FFFFFF">in use</text><rect x="360" y="338" width="130" height="170" rx="16" fill="#176E69"/><text x="381" y="365" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">A</text><text x="375" y="449" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#FFFFFF">in use</text><rect x="508" y="338" width="130" height="170" rx="16" fill="#DCEDE8"/><text x="529" y="365" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#183343">A</text><text x="523" y="449" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183343">ready</text><rect x="656" y="338" width="130" height="170" rx="16" fill="#E6E9E9"/><text x="677" y="365" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#183343">Other</text><text x="671" y="449" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183343">bookable</text><rect x="804" y="338" width="130" height="170" rx="16" fill="#E6E9E9"/><text x="825" y="365" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#183343">Other</text><text x="819" y="449" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183343">bookable</text><rect x="952" y="338" width="130" height="170" rx="16" fill="#E6E9E9"/><text x="973" y="365" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#183343">Other</text><text x="967" y="449" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183343">bookable</text><rect x="1100" y="338" width="130" height="170" rx="16" fill="#E6E9E9"/><text x="1121" y="365" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#183343">Other</text><text x="1115" y="449" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183343">bookable</text><rect x="1248" y="338" width="130" height="170" rx="16" fill="#E6E9E9"/><text x="1269" y="365" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#183343">Other</text><text x="1263" y="449" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183343">bookable</text><rect x="1396" y="338" width="130" height="170" rx="16" fill="#E6E9E9"/><text x="1417" y="365" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#183343">Other</text><text x="1411" y="449" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#183343">bookable</text><path d="M64 533 V545 H638 V533" fill="none" stroke="#52646D" stroke-width="3"/><path d="M656 533 V545 H1526 V533" fill="none" stroke="#52646D" stroke-width="3"/><text x="64" y="577" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">4 slots reserved for A</text><text x="740" y="577" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#52646D">6 slots available to other customers</text><rect x="64" y="662" width="1472" height="151" rx="22" fill="#DCEDE8"/><text x="94" y="690" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="41" font-weight="700" fill="#176E69">A uses 3 slots. The fourth stays ready for A.</text><text x="94" y="758" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">Low current use does not automatically release the reserved entitlement.</text><rect x="64" y="864" width="1472" height="128" rx="22" fill="#FFFFFF"/><text x="94" y="891" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Reservation payment may include usage or sit alongside usage charges.</text><text x="94" y="950" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">The agreement defines quantity, timing, matching requirements, and release rules.</text><text x="64" y="1044" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Hypothetical dedicated allocation, not company terms. Capacity remains provider-owned.</text><text x="64" y="1088" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Pooled delivery is possible if the provider still meets the promised access commitment.</text></svg>