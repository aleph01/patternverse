<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Guaranteed Buyback: agree an exit value before purchase</title><desc id="desc">Hypothetical cash buyback. A customer pays one thousand dollars today and can sell an eligible product back for three hundred dollars after twenty-four months, provided the agreed conditions are met. If an available market offer at that time is two hundred dollars, the customer can choose the three hundred dollar buyback. If the market offer is four hundred dollars and the contract permits an outside sale, the customer can choose the market offer instead. These are alternatives, not cumulative payments. Purchase price minus the buyback payment is seven hundred dollars before all other costs.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">GUARANTEED BUYBACK</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Agree the exit before the purchase.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A future price floor reduces uncertainty about what the product will be worth.</text><rect x="64" y="273" width="430" height="229" rx="22" fill="#FFFFFF"/><text x="89" y="301" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">BUY TODAY</text><text x="89" y="362" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">$1,000</text><text x="89" y="448" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Original purchase price</text><rect x="585" y="273" width="430" height="229" rx="22" fill="#FFFFFF"/><text x="610" y="301" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">USE THE PRODUCT</text><text x="610" y="362" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">24 months</text><text x="610" y="448" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Agreed holding period</text><rect x="1106" y="273" width="430" height="229" rx="22" fill="#FFFFFF"/><text x="1131" y="301" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">OPTION TO SELL BACK</text><text x="1131" y="362" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">$300</text><text x="1131" y="448" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">If the agreed conditions are met</text><line x1="502" y1="388" x2="574" y2="388" stroke="#176E69" stroke-width="5"/><polygon points="574,388 559,379 559,397" fill="#176E69"/><line x1="1023" y1="388" x2="1095" y2="388" stroke="#176E69" stroke-width="5"/><polygon points="1095,388 1080,379 1080,397" fill="#176E69"/><text x="64" y="554" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">At the agreed date, the customer chooses an eligible exit.</text><rect x="64" y="628" width="716" height="227" rx="22" fill="#DCEDE8"/><text x="90" y="654" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">IF THE MARKET OFFER IS LOWER</text><text x="90" y="714" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Market: $200   |   Buyback: $300</text><text x="90" y="788" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Choose the promised $300 buyback.</text><rect x="820" y="628" width="716" height="227" rx="22" fill="#FFFFFF"/><text x="846" y="654" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">IF THE MARKET OFFER IS HIGHER</text><text x="846" y="714" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Market: $400   |   Buyback: $300</text><text x="846" y="788" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Sell for $400 if the contract permits.</text><rect x="64" y="906" width="1472" height="117" rx="22" fill="#176E69"/><text x="92" y="929" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">With buyback: $1,000 − $300 = $700 acquisition outlay</text><text x="92" y="984" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">Before programme fees, financing, maintenance, taxes, and other costs.</text><text x="64" y="1060" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Hypothetical cash offer, not company terms. Condition and return windows apply.</text><text x="64" y="1101" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">The two exit routes are alternatives. The customer does not receive both payments.</text></svg>