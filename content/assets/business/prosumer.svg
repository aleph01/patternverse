<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Prosumer: the same participant consumes and produces</title><desc id="desc">The same person or household can consume content, services, or energy and also produce content, provide services, or generate energy. Value flows in both directions between the participant and a shared system. The business provides tools, distribution, quality controls, and settlement. Some production is used directly by the participant, while some enters a shared market. Examples are watching and publishing content, traveling and hosting, and consuming and generating electricity. Not every customer has to produce.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PROSUMER</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">One participant. Both sides of value.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">People use an offering and also help produce what the system provides.</text><text x="64" y="258" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">THE SAME PERSON OR HOUSEHOLD</text><rect x="64" y="309" width="558" height="338" rx="22" fill="#DCEDE8"/><text x="92" y="339" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CONSUMER ROLE</text><text x="92" y="387" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Watch, stay, or use energy</text><text x="92" y="449" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Receive value from the system.</text><text x="92" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PRODUCER ROLE</text><text x="92" y="549" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Create, host, or generate</text><text x="92" y="607" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Contribute useful supply.</text><rect x="982" y="309" width="554" height="338" rx="22" fill="#FFFFFF"/><text x="1010" y="339" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">SHARED SYSTEM</text><text x="1010" y="387" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">Enable both roles</text><text x="1010" y="459" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Tools and access</text><text x="1010" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Distribution and quality controls</text><text x="1010" y="561" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Payments, credits, or settlement</text><line x1="964" y1="421" x2="640" y2="421" stroke="#176E69" stroke-width="5"/><polygon points="640,421 655,412 655,430" fill="#176E69"/><text x="667" y="372" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">Value received</text><line x1="640" y1="573" x2="964" y2="573" stroke="#176E69" stroke-width="5"/><polygon points="964,573 949,564 949,582" fill="#176E69"/><text x="667" y="522" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#176E69">Value contributed</text><text x="64" y="704" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Some production serves the participant directly; some enters a shared market.</text><text x="64" y="797" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">THREE FORMS OF PROSUMPTION</text><rect x="64" y="846" width="440" height="190" rx="22" fill="#DCEDE8"/><text x="88" y="873" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Content</text><text x="88" y="935" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Watch other people’s videos</text><text x="88" y="980" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and publish your own.</text><rect x="580" y="846" width="440" height="190" rx="22" fill="#DCEDE8"/><text x="604" y="873" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Services</text><text x="604" y="935" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Book a stay when traveling</text><text x="604" y="980" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and host guests yourself.</text><rect x="1096" y="846" width="440" height="190" rx="22" fill="#DCEDE8"/><text x="1120" y="873" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Energy</text><text x="1120" y="935" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Use electricity at home</text><text x="1120" y="980" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and generate solar power.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Participation can be occasional. Not every customer needs to become a producer.</text></svg>