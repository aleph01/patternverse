<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Consignment: ownership and selling are separated</title><desc id="desc">Illustrative retail consignment. An owner entrusts an item to a selling business without that business buying it upfront. The business holds and markets the item to a customer who pays one hundred dollars. Once the sale qualifies for settlement, seventy dollars goes to the owner and thirty dollars is retained by the selling business as a thirty percent commission. Both amounts are before their respective costs. If the item remains unsold, it is handled under the consignment agreement. Taxes, returns, discounts and additional fees are omitted from the example.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CONSIGNMENT</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Separate ownership from the work of selling.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">The owner supplies the goods. A specialist supplies the route to the customer.</text><rect x="64" y="275" width="430" height="306" rx="22" fill="#FFFFFF"/><text x="89" y="303" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">OWNER / CONSIGNOR</text><text x="89" y="363" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Owns the item</text><text x="89" y="410" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#183343">Entrusts it for sale</text><text x="89" y="492" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">No sale to the intermediary</text><text x="89" y="531" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">just because it receives stock</text><rect x="585" y="275" width="430" height="306" rx="22" fill="#FFFFFF"/><text x="610" y="303" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">SELLER / CONSIGNEE</text><text x="610" y="363" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Holds and markets it</text><text x="610" y="410" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#183343">Finds a customer</text><text x="610" y="492" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Does not purchase the</text><text x="610" y="531" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">consigned item upfront</text><rect x="1106" y="275" width="430" height="306" rx="22" fill="#FFFFFF"/><text x="1131" y="303" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">CUSTOMER</text><text x="1131" y="363" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Buys the item</text><text x="1131" y="410" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#183343">Pays $100</text><text x="1131" y="492" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Receives the product</text><text x="1131" y="531" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">under the sale terms</text><line x1="502" y1="410" x2="574" y2="410" stroke="#176E69" stroke-width="5"/><polygon points="574,410 559,401 559,419" fill="#176E69"/><line x1="1023" y1="410" x2="1095" y2="410" stroke="#176E69" stroke-width="5"/><polygon points="1095,410 1080,401 1080,419" fill="#176E69"/><rect x="64" y="628" width="1472" height="115" rx="22" fill="#DCEDE8"/><text x="93" y="651" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#176E69">After the sale qualifies for settlement, divide the $100 proceeds.</text><text x="93" y="703" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">The agreement determines returns, deductions, and the payment date.</text><rect x="64" y="787" width="716" height="194" rx="22" fill="#FFFFFF"/><text x="90" y="811" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">OWNER RECEIVES</text><text x="90" y="858" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">$70</text><text x="90" y="932" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183343">70% payout, before owner’s costs</text><rect x="820" y="787" width="716" height="194" rx="22" fill="#176E69"/><text x="846" y="811" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">SELLING BUSINESS RETAINS</text><text x="846" y="858" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">$30</text><text x="846" y="932" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">30% commission, before its costs</text><text x="64" y="1020" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#183343">Unsold goods remain subject to the agreement: return, extension, or other handling.</text><text x="64" y="1063" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Hypothetical retail example, not company rates. Taxes and additional fees omitted.</text><text x="64" y="1104" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Industrial consignment can trigger purchase on withdrawal or use, rather than resale.</text></svg>