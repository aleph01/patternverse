<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Brands Consortium: independent brands share selected capabilities</title><desc id="desc">Three independently controlled brands retain their own identities and operations. Bidirectional links connect them to a consortium with agreed rules, contributions, and shared services. Illustrative capabilities include marketing and referrals, shared technology or purchasing arrangements, and standards and reciprocal benefits. Members choose the scope of cooperation; the consortium does not own the brands.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">BRANDS CONSORTIUM</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#183343">Independent brands. Shared capabilities.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Pool selected resources and benefits while retaining distinct businesses.</text><rect x="64" y="282" width="460" height="160" rx="22" fill="#FFFFFF"/><text x="91" y="315" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">BRAND A</text><text x="91" y="381" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Own identity + operations</text><line x1="294" y1="460" x2="294" y2="539" stroke="#176E69" stroke-width="5"/><polygon points="294,460 285,475 303,475" fill="#176E69"/><polygon points="294,539 285,524 303,524" fill="#176E69"/><rect x="570" y="282" width="460" height="160" rx="22" fill="#FFFFFF"/><text x="597" y="315" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">BRAND B</text><text x="597" y="381" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Own identity + operations</text><line x1="800" y1="460" x2="800" y2="539" stroke="#176E69" stroke-width="5"/><polygon points="800,460 791,475 809,475" fill="#176E69"/><polygon points="800,539 791,524 809,524" fill="#176E69"/><rect x="1076" y="282" width="460" height="160" rx="22" fill="#FFFFFF"/><text x="1103" y="315" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#176E69">BRAND C</text><text x="1103" y="381" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Own identity + operations</text><line x1="1306" y1="460" x2="1306" y2="539" stroke="#176E69" stroke-width="5"/><polygon points="1306,460 1297,475 1315,475" fill="#176E69"/><polygon points="1306,539 1297,524 1315,524" fill="#176E69"/><rect x="64" y="556" width="1472" height="310" rx="22" fill="#DCEDE8"/><text x="94" y="587" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">CONSORTIUM · AGREED RULES, CONTRIBUTIONS, AND SHARED SERVICES</text><rect x="94" y="655" width="432" height="176" rx="22" fill="#FFFFFF"/><text x="117" y="684" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Marketing &amp; reach</text><text x="117" y="742" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Joint visibility</text><text x="117" y="783" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and referrals</text><rect x="584" y="655" width="432" height="176" rx="22" fill="#FFFFFF"/><text x="607" y="684" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Technology &amp; buying</text><text x="607" y="742" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Shared tools or</text><text x="607" y="783" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">purchasing arrangements</text><rect x="1074" y="655" width="432" height="176" rx="22" fill="#FFFFFF"/><text x="1097" y="684" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">Standards &amp; benefits</text><text x="1097" y="742" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Quality criteria</text><text x="1097" y="783" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and agreed reciprocity</text><rect x="64" y="942" width="1472" height="112" rx="22" fill="#176E69"/><text x="94" y="974" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#FFFFFF">Keep each brand distinctive. Build selected capabilities together.</text><text x="64" y="1095" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Illustrative model. Members choose the scope of cooperation; the consortium does not own the brands.</text></svg>