<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1070" viewBox="0 0 1600 1070" role="img" aria-labelledby="title desc"><title id="title">Core plus Add-Ons: start complete, extend by choice</title><desc id="desc">Three illustrative configurations share the same working core. The first has no extras. The second adds assisted setup to save time. The third adds advanced tools and expert support. Extras are optional and separately priced. The total price combines the core and selected add-ons; extras can involve one-time or recurring charges.</desc><rect width="1600" height="1070" fill="#F6F4EF"/><text x="64" y="52" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">CORE PLUS ADD-ONS</text><text x="64" y="108" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#183343">Start complete. Extend by choice.</text><text x="64" y="188" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Illustrative configurations: the same core, different optional extras.</text><text x="68" y="280" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Core only</text><rect x="64" y="342" width="432" height="442" rx="22" fill="#E6E9E9"/><rect x="64" y="627" width="432" height="157" rx="22" fill="#176E69"/><text x="88" y="653" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#FFFFFF">Working core</text><text x="88" y="711" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">Delivers its stated benefit</text><text x="588" y="280" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Save time</text><rect x="584" y="342" width="432" height="442" rx="22" fill="#E6E9E9"/><rect x="584" y="627" width="432" height="157" rx="22" fill="#176E69"/><text x="608" y="653" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#FFFFFF">Working core</text><text x="608" y="711" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">Delivers its stated benefit</text><text x="1108" y="280" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Add capability</text><rect x="1104" y="342" width="432" height="442" rx="22" fill="#E6E9E9"/><rect x="1104" y="627" width="432" height="157" rx="22" fill="#176E69"/><text x="1128" y="653" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#FFFFFF">Working core</text><text x="1128" y="711" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#FFFFFF">Delivers its stated benefit</text><text x="88" y="492" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#52646D">No extras required</text><rect x="596" y="480" width="408" height="112" rx="16" fill="#DCEDE8"/><text x="616" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Assisted setup</text><text x="616" y="548" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Optional; separately priced</text><rect x="1116" y="354" width="408" height="112" rx="16" fill="#DCEDE8"/><text x="1136" y="374" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Advanced tools</text><text x="1136" y="422" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Optional; separately priced</text><rect x="1116" y="480" width="408" height="112" rx="16" fill="#DCEDE8"/><text x="1136" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#176E69">Expert support</text><text x="1136" y="548" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52646D">Optional; separately priced</text><text x="64" y="837" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#52646D">A COMPLETE CORE FOR ITS INTENDED CUSTOMER</text><rect x="64" y="887" width="1472" height="87" rx="16" fill="#FFFFFF"/><text x="88" y="912" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#183343">Total price = core + selected add-ons</text><text x="64" y="1021" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Some extras are one-time purchases; others carry recurring charges.</text></svg>