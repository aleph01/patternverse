<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Interruptible Capacity: flexible work gives way when firm demand rises</title><desc id="desc">Hypothetical capacity allocation with ten slots. Initially, three serve firm demand, five serve interruptible work, and two are spare. Later, firm demand rises to seven, leaving three interruptible slots and no spare capacity. Two interruptible tasks are paused or requeued under the agreed terms. Firm describes the higher-priority allocation in this illustration, not immunity from outages. Customers accept interruption rights in exchange for lower prices or agreed compensation.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">INTERRUPTIBLE CAPACITY</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Sell access you may need to reclaim.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#52646D">Customers accept interruption rights in exchange for a price benefit.</text><text x="64" y="266" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Before: 3 firm slots + 5 interruptible slots + 2 spare slots</text><rect x="64" y="332" width="130" height="128" rx="16" fill="#176E69"/><text x="82" y="363" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">FIRM</text><text x="83" y="415" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#FFFFFF">priority</text><rect x="212" y="332" width="130" height="128" rx="16" fill="#176E69"/><text x="230" y="363" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">FIRM</text><text x="231" y="415" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#FFFFFF">priority</text><rect x="360" y="332" width="130" height="128" rx="16" fill="#176E69"/><text x="378" y="363" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">FIRM</text><text x="379" y="415" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#FFFFFF">priority</text><rect x="508" y="332" width="130" height="128" rx="16" fill="#DCEDE8"/><text x="526" y="363" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183343">FLEX</text><text x="527" y="415" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183343">flexible</text><rect x="656" y="332" width="130" height="128" rx="16" fill="#DCEDE8"/><text x="674" y="363" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183343">FLEX</text><text x="675" y="415" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183343">flexible</text><rect x="804" y="332" width="130" height="128" rx="16" fill="#DCEDE8"/><text x="822" y="363" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183343">FLEX</text><text x="823" y="415" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183343">flexible</text><rect x="952" y="332" width="130" height="128" rx="16" fill="#DCEDE8"/><text x="970" y="363" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183343">FLEX</text><text x="971" y="415" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183343">flexible</text><rect x="1100" y="332" width="130" height="128" rx="16" fill="#DCEDE8"/><text x="1118" y="363" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183343">FLEX</text><text x="1119" y="415" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183343">flexible</text><rect x="1248" y="332" width="130" height="128" rx="16" fill="#E6E9E9"/><text x="1266" y="363" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183343">SPARE</text><text x="1267" y="415" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183343">unused</text><rect x="1396" y="332" width="130" height="128" rx="16" fill="#E6E9E9"/><text x="1414" y="363" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183343">SPARE</text><text x="1415" y="415" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183343">unused</text><rect x="64" y="609" width="130" height="128" rx="16" fill="#176E69"/><text x="82" y="640" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">FIRM</text><text x="83" y="692" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#FFFFFF">priority</text><rect x="212" y="609" width="130" height="128" rx="16" fill="#176E69"/><text x="230" y="640" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">FIRM</text><text x="231" y="692" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#FFFFFF">priority</text><rect x="360" y="609" width="130" height="128" rx="16" fill="#176E69"/><text x="378" y="640" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">FIRM</text><text x="379" y="692" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#FFFFFF">priority</text><rect x="508" y="609" width="130" height="128" rx="16" fill="#176E69"/><text x="526" y="640" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">FIRM</text><text x="527" y="692" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#FFFFFF">priority</text><rect x="656" y="609" width="130" height="128" rx="16" fill="#176E69"/><text x="674" y="640" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">FIRM</text><text x="675" y="692" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#FFFFFF">priority</text><rect x="804" y="609" width="130" height="128" rx="16" fill="#176E69"/><text x="822" y="640" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">FIRM</text><text x="823" y="692" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#FFFFFF">priority</text><rect x="952" y="609" width="130" height="128" rx="16" fill="#176E69"/><text x="970" y="640" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">FIRM</text><text x="971" y="692" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#FFFFFF">priority</text><rect x="1100" y="609" width="130" height="128" rx="16" fill="#DCEDE8"/><text x="1118" y="640" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183343">FLEX</text><text x="1119" y="692" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183343">flexible</text><rect x="1248" y="609" width="130" height="128" rx="16" fill="#DCEDE8"/><text x="1266" y="640" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183343">FLEX</text><text x="1267" y="692" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183343">flexible</text><rect x="1396" y="609" width="130" height="128" rx="16" fill="#DCEDE8"/><text x="1414" y="640" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183343">FLEX</text><text x="1415" y="692" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183343">flexible</text><text x="64" y="538" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">After firm demand rises: 7 firm slots + 3 interruptible slots</text><rect x="64" y="795" width="1472" height="150" rx="22" fill="#DCEDE8"/><text x="94" y="823" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#176E69">2 flexible tasks give way: pause, stop, or requeue.</text><text x="94" y="892" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#183343">Restart depends on available capacity and the agreed terms.</text><text x="64" y="996" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">The customer buys lower-cost access with less certainty of continuity.</text><text x="64" y="1053" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Hypothetical allocation, not company data. “Firm” means higher priority in this example.</text><text x="64" y="1096" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Actual triggers, notice, restart rights, and compensation vary by agreement.</text></svg>