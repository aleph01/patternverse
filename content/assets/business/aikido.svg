<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc"><title id="title">Aikido: reverse a costly industry assumption</title><desc id="desc">An illustrative software example connects a feature-rich industry norm to customer setup burden and an opposite promise of one essential job, ready immediately. Focused product, simple pricing, and fast onboarding support that promise.</desc><rect width="1600" height="840" fill="#F6F4EF"/><text x="64" y="58" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">AIKIDO / OPPOSITE POSITIONING</text><text x="64" y="111" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Find value on the other side of a convention.</text><text x="64" y="183" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">Illustrative example: software for customers who want less setup.</text><rect x="64" y="264" width="456" height="226" rx="22" fill="#E6E9E9" stroke="#E6E9E9" stroke-width="2"/><text x="92" y="296" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#52646D">INDUSTRY ASSUMPTION</text><text x="92" y="349" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">More features</text><text x="92" y="401" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">mean more value.</text><rect x="572" y="264" width="456" height="226" rx="22" fill="#ECE7DE" stroke="#ECE7DE" stroke-width="2"/><text x="600" y="296" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#52646D">CUSTOMER BURDEN</text><text x="600" y="349" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">More setup.</text><text x="600" y="401" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">More to learn.</text><rect x="1080" y="264" width="456" height="226" rx="22" fill="#DCEDE8" stroke="#DCEDE8" stroke-width="2"/><text x="1108" y="296" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#52646D">OPPOSITE PROMISE</text><text x="1108" y="349" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">One essential job.</text><text x="1108" y="401" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#183343">Ready immediately.</text><path d="M532 377H552" stroke="#52646D" stroke-width="4"/><path d="M562 377l-13 -9v18z" fill="#52646D"/><path d="M1040 377H1060" stroke="#52646D" stroke-width="4"/><path d="M1070 377l-13 -9v18z" fill="#52646D"/><text x="64" y="548" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">The product and operation must support the promise.</text><rect x="64" y="624" width="456" height="92" rx="16" fill="#FFFFFF" stroke="#CFD8D5" stroke-width="2"/><text x="92" y="652" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176E69">Focused product</text><rect x="572" y="624" width="456" height="92" rx="16" fill="#FFFFFF" stroke="#CFD8D5" stroke-width="2"/><text x="600" y="652" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176E69">Simple pricing</text><rect x="1080" y="624" width="456" height="92" rx="16" fill="#FFFFFF" stroke="#CFD8D5" stroke-width="2"/><text x="1108" y="652" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176E69">Fast onboarding</text><text x="64" y="767" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">A useful reversal serves a real customer need.</text></svg>