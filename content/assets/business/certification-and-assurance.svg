<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Certification and Assurance: make claims testable and credible</title><desc id="desc">Define a claim, its criteria and the subject and period covered. An independent assessor collects and tests evidence, then communicates a conclusion with its scope and limitations. Depending on the engagement, the output can be a certificate, authorized mark or assurance report. Findings can require corrective action, affect the conclusion or prevent certification. Payment funds assessment work rather than guaranteeing a favorable result. Surveillance or fresh reporting maintains relevance where required.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CERTIFICATION &amp; ASSURANCE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Make claims testable and credible.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Turn specified requirements and evidence into an independent, bounded conclusion.</text><rect x="64" y="300" width="440" height="310" rx="22" fill="#FFFFFF"/><text x="88" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">DEFINE</text><text x="88" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Specify the claim</text><text x="88" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Set criteria, subject, locations,</text><text x="88" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and relevant date or period.</text><text x="88" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">State exactly what is covered.</text><rect x="580" y="300" width="440" height="310" rx="22" fill="#DCEDE8"/><text x="604" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">ASSESS</text><text x="604" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Examine evidence</text><text x="604" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Gather and test evidence.</text><text x="604" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Apply the specified criteria.</text><text x="604" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Document findings and limits.</text><rect x="1096" y="300" width="440" height="310" rx="22" fill="#FFFFFF"/><text x="1120" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">COMMUNICATE</text><text x="1120" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Report the conclusion</text><text x="1120" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Communicate the result.</text><text x="1120" y="505" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Specify scope and conclusion.</text><text x="1120" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">State relevant exceptions.</text><line x1="521" y1="452" x2="563" y2="452" stroke="#176E69" stroke-width="5"/><polygon points="563,452 548,443 548,461" fill="#176E69"/><line x1="1037" y1="452" x2="1079" y2="452" stroke="#176E69" stroke-width="5"/><polygon points="1079,452 1064,443 1064,461" fill="#176E69"/><text x="64" y="683" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Findings can require correction, affect the opinion, or prevent certification.</text><text x="64" y="740" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">A fee pays for assessment work. The conclusion follows the evidence.</text><rect x="64" y="840" width="440" height="191" rx="22" fill="#DCEDE8"/><text x="88" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CERTIFICATION</text><text x="88" y="928" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Confirms defined requirements</text><text x="88" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">for the stated scope.</text><rect x="580" y="840" width="440" height="191" rx="22" fill="#DCEDE8"/><text x="604" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">ASSURANCE REPORT</text><text x="604" y="928" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Presents an independent</text><text x="604" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">conclusion on the evidence.</text><rect x="1096" y="840" width="440" height="191" rx="22" fill="#DCEDE8"/><text x="1120" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">ONGOING WORK</text><text x="1120" y="928" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Surveillance or new reports</text><text x="1120" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">where the scheme requires.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Read the scope, criteria, date, and conclusion to understand what the result supports.</text></svg>