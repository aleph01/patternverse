<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Monetize Existing Capabilities: one capability supports two markets</title><desc id="desc">Conceptual example of a manufacturer with a testing laboratory, equipment, and skilled staff. The laboratory continues testing the its own products, supporting its existing business. By defining scope, prices, reports, and support, the company also offers testing services to other firms for additional revenue. Existing capability provides a head start, while external sales still require investment and delivery capacity.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">MONETIZE EXISTING CAPABILITIES / MAKE MORE OF IT</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">One capability. More than one market.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Conceptual example: a manufacturer opens its testing expertise to outside customers.</text><rect x="64" y="253" width="1472" height="146" rx="22" fill="#FFFFFF"/><text x="94" y="278" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CAPABILITY DEVELOPED FOR THE ORIGINAL BUSINESS</text><text x="94" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#183343">A testing lab, equipment, and skilled staff</text><polyline points="800,399 800,444 422,444 422,485" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="422,485 413,470 431,470" fill="#176E69"/><polyline points="800,444 1178,444 1178,485" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="1178,485 1169,470 1187,470" fill="#176E69"/><rect x="64" y="500" width="716" height="252" rx="22" fill="#FFFFFF"/><text x="90" y="527" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">ORIGINAL USE</text><text x="90" y="581" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#183343">Test your own products</text><text x="90" y="648" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Internal quality assurance</text><text x="90" y="700" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Supports the existing business.</text><rect x="820" y="500" width="716" height="252" rx="22" fill="#DCEDE8"/><text x="846" y="527" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">EXTERNAL OFFER</text><text x="846" y="581" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#183343">Sell testing services</text><text x="846" y="648" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Defined scope, prices, reports, support</text><text x="846" y="700" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#183343">Other firms pay per test or contract.</text><rect x="64" y="806" width="1472" height="143" rx="22" fill="#176E69"/><text x="94" y="834" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">Existing expertise provides a head start.</text><text x="94" y="899" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">External sales still require investment, support, and delivery capacity.</text><text x="64" y="1001" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#183343">The new customer buys a useful result from a capability you already developed.</text><text x="64" y="1062" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Conceptual example. External demand and returns must justify the additional costs</text><text x="64" y="1102" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and any capacity diverted from the original business.</text></svg>