<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Broad-Assortment Retail: serve several needs in one basket</title><desc id="desc">Illustrative household shopping mission. Food, cleaning, personal care, and pet care categories feed into one mixed basket and checkout. The retailer coordinates selection, buying, replenishment, and selling. Breadth covers different needs; depth adds alternatives within each category. The example shows a conceptual assortment rather than a particular company or store.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">BROAD-ASSORTMENT RETAIL / SUPERMARKET</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Serve several needs in one basket.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Illustrative household shop: breadth across categories, with manageable choice in each.</text><rect x="64" y="259" width="1472" height="93" rx="22" fill="#FFFFFF"/><text x="92" y="286" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#183343">CUSTOMER MISSION: complete the household shopping</text><rect x="64" y="412" width="350" height="165" rx="22" fill="#DCEDE8"/><text x="88" y="442" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">FOOD</text><text x="88" y="515" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#183343">Fruit · bread · milk</text><polyline points="239,588 239,653" fill="none" stroke="#52646D" stroke-width="3"/><rect x="438" y="412" widt