l needs · one basket · one checkout</text><rect x="64" y="947" width="1472" height="89" rx="22" fill="#FFFFFF"/><text x="91" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#183343">Retailer coordinates selection, buying, replenishment, and selling.</text><text x="64" y="1087" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Breadth covers different needs; depth adds alternatives within each category.</text></svg>