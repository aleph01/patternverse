<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Merchant of Record: put the customer sale with a specialist seller</title><desc id="desc">The supplier provides a product under a reseller arrangement with the Merchant of Record. The customer buys from and pays the Merchant of Record for the covered transaction. The Merchant of Record handles agreed transaction duties, remits applicable transaction taxes and pays the supplier after contractual deductions. The supplier may deliver the product or service directly and remain responsible for licensing and product support. The arrows show commercial relationships, not mandatory physical delivery routes.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">MERCHANT OF RECORD</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#183343">Put the sale with a specialist seller.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">The provider becomes the seller for covered transactions under a defined agreement.</text><rect x="64" y="300" width="440" height="330" rx="22" fill="#FFFFFF"/><text x="88" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PRODUCT BUSINESS</text><text x="88" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Supplier</text><text x="88" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Builds or supplies the product.</text><text x="88" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Provides licenses and support</text><text x="88" y="560" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">as the arrangement requires.</text><rect x="580" y="300" width="440" height="330" rx="22" fill="#DCEDE8"/><text x="604" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">CUSTOMER SALE</text><text x="604" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Merchant of Record</text><text x="604" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Acts as seller to the customer.</text><text x="604" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Collects payment and handles</text><text x="604" y="560" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">agreed transaction duties.</text><rect x="1096" y="300" width="440" height="330" rx="22" fill="#FFFFFF"/><text x="1120" y="330" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PURCHASER</text><text x="1120" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Customer</text><text x="1120" y="460" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Pays the MoR for the order.</text><text x="1120" y="510" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Receives product or access</text><text x="1120" y="560" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">and purchase documents.</text><line x1="521" y1="465" x2="563" y2="465" stroke="#176E69" stroke-width="5"/><polygon points="563,465 548,456 548,474" fill="#176E69"/><line x1="1037" y1="465" x2="1079" y2="465" stroke="#176E69" stroke-width="5"/><polygon points="1079,465 1064,456 1064,474" fill="#176E69"/><polyline points="800,650 800,710 284,710 284,650" fill="none" stroke="#176E69" stroke-width="5"/><polygon points="284,650 275.0,666.0 293.0,666.0" fill="#176E69"/><text x="342" y="748" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Supplier payout follows agreed deductions and settlement terms.</text><rect x="64" y="840" width="440" height="191" rx="22" fill="#DCEDE8"/><text x="88" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">TRANSACTION TAXES</text><text x="88" y="928" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Collected amounts go to</text><text x="88" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">relevant tax authorities.</text><rect x="580" y="840" width="440" height="191" rx="22" fill="#DCEDE8"/><text x="604" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PRODUCT FULFILLMENT</text><text x="604" y="928" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Supplier may deliver directly</text><text x="604" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">and provide product support.</text><rect x="1096" y="840" width="440" height="191" rx="22" fill="#DCEDE8"/><text x="1120" y="866" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">COMMERCIAL TERMS</text><text x="1120" y="928" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#183343">Fees, refunds, and reserves</text><text x="1120" y="975" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">affect the supplier’s payout.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">Arrows show resale relationships. Delivery can go directly from supplier to customer.</text></svg>