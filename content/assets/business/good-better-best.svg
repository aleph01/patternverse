<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Good–Better–Best</title><desc id="desc">Three packages progress from essential capability through broader coordination to advanced control. Each has a distinct use case and price. The levels are illustrative, not a provider price list.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">GOOD–BETTER–BEST</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">Offer a coherent progression of value.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Each level should serve a real need and justify its price.</text><rect x="64" y="320" width="440" height="370" rx="22" fill="#FFFFFF"/><text x="88" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">GOOD</text><text x="88" y="420" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Essential capability</text><text x="88" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">A useful foundation for</text><text x="88" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">a focused task or</text><text x="88" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">a smaller customer.</text><rect x="580" y="320" width="440" height="370" rx="22" fill="#DCEDE8"/><text x="604" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">BETTER</text><text x="604" y="420" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Broader coordination</text><text x="604" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Additional capabilities</text><text x="604" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">for teams or more</text><text x="604" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">demanding situations.</text><rect x="1096" y="320" width="440" height="370" rx="22" fill="#FFFFFF"/><text x="1120" y="350" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">BEST</text><text x="1120" y="420" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#183343">Advanced control</text><text x="1120" y="500" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Greater scope, assurance,</text><text x="1120" y="550" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">or service for customers</text><text x="1120" y="600" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">who need the difference.</text><line x1="521" y1="500" x2="563" y2="500" stroke="#176E69" stroke-width="5"/><polygon points="563,500 548,491 548,509" fill="#176E69"/><line x1="1037" y1="500" x2="1079" y2="500" stroke="#176E69" stroke-width="5"/><polygon points="1079,500 1064,491 1064,509" fill="#176E69"/><rect x="64" y="810" width="1472" height="208" rx="22" fill="#DCEDE8"/><text x="90" y="843" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">Different needs → meaningful packages</text><text x="90" y="911" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#52646D">The entry level must work; higher levels need a credible additional benefit.</text><text x="64" y="1091" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#52646D">Three levels are a shorthand. More packages can increase comparison effort.</text></svg>