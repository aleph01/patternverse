<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc"><title id="title">Product as Point of Sale: the next purchase starts at the product</title><desc id="desc">Illustrative sequence. A need arises while using a product. A built-in or product-linked buying interface lets the customer review and confirm a relevant purchase. A commerce service then charges and fulfils the order. Fulfilment can provide digital content, physical consumables, or activated upgrades. Customer confirmation distinguishes the illustrated pattern from automatic replenishment.</desc><rect width="1600" height="1140" fill="#F6F4EF"/><text x="64" y="46" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#176E69">PRODUCT AS POINT OF SALE</text><text x="64" y="103" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#183343">The next purchase starts at the product.</text><text x="64" y="182" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Illustrative journey: bring a relevant buying route to the place where a need arises.</text><rect x="64" y="270" width="951" height="356" rx="22" fill="#DCEDE8"/><text x="89" y="293" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">PRODUCT OR PRODUCT-LINKED INTERFACE</text><rect x="86" y="366" width="402" height="233" rx="22" fill="#FFFFFF"/><text x="111" y="394" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">USE</text><text x="111" y="458" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#183343">A need arises</text><text x="111" y="544" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">During the product’s use</text><rect x="593" y="366" width="400" height="233" rx="22" fill="#176E69"/><text x="618" y="394" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">BUY</text><text x="618" y="458" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Review and confirm</text><text x="618" y="544" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#FFFFFF">Customer approves purchase</text><rect x="1106" y="366" width="430" height="233" rx="22" fill="#FFFFFF"/><text x="1133" y="394" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">FULFIL</text><text x="1133" y="458" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#183343">Provide the purchase</text><text x="1133" y="544" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#52646D">Deliver or activate</text><line x1="503" y1="482" x2="578" y2="482" stroke="#176E69" stroke-width="5"/><polygon points="578,482 563,473 563,491" fill="#176E69"/><line x1="1028" y1="482" x2="1093" y2="482" stroke="#176E69" stroke-width="5"/><polygon points="1093,482 1078,473 1078,491" fill="#176E69"/><text x="64" y="681" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#176E69">POSSIBLE FOLLOW-ON OFFERINGS</text><rect x="64" y="736" width="430" height="157" rx="22" fill="#FFFFFF"/><text x="91" y="766" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">CONTENT</text><text x="91" y="832" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183343">Download a book or game</text><rect x="585" y="736" width="430" height="157" rx="22" fill="#FFFFFF"/><text x="612" y="766" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">CONSUMABLES</text><text x="612" y="832" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183343">Deliver a replacement supply</text><rect x="1106" y="736" width="430" height="157" rx="22" fill="#FFFFFF"/><text x="1133" y="766" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#176E69">UPGRADES</text><text x="1133" y="832" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183343">Activate an optional feature</text><rect x="64" y="949" width="1472" height="87" rx="22" fill="#DCEDE8"/><text x="92" y="976" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#183343">The product becomes a continuing route to relevant purchases.</text><text x="64" y="1071" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52646D">The buying route can be built in or opened through a product-specific link or scan.</text><text x="64" y="1110" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52646D">Customer confirmation distinguishes this journey from automatic replenishment.</text></svg>