<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-labelledby="title desc">
<title id="title">Care, support, and separate responsibilities</title>
<desc id="desc">A compact comparison separates the person experiencing alcohol use disorder and their access to care from supporters' concerns, limits, needs, and access to support. Specific help may be agreed voluntarily. Safety and autonomy apply throughout.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;font-weight:400;fill:#252c28}.heading{font-size:18px}.small{font-size:14px}.line{fill:none;stroke:#a6aca3;stroke-width:1.5}.green{fill:none;stroke:#00855b;stroke-width:1.5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}</style>
<rect width="360" height="760" fill="#fff"/>
<rect x="16" y="20" width="328" height="180" class="context"/>
<text x="36" y="54" class="heading">Person experiencing AUD</text>
<path d="M36 73H324" class="line"/>
<text x="36" y="106">Describe what is happening</text>
<text x="36" y="139">Discuss choices about care</text>
<text x="36" y="172">Own specific actions</text>
<path d="M180 212V235" class="green" marker-end="url(#arrow)"/>
<rect x="16" y="249" width="328" height="59" fill="#fff" stroke="#a6aca3"/>
<text x="180" y="284" text-anchor="middle">Alcohol assessment and treatment</text>
<rect x="16" y="345" width="328" height="180" class="context"/>
<text x="36" y="379" class="heading">Family or supporters</text>
<path d="M36 398H324" class="line"/>
<text x="36" y="431">State concerns and limits</text>
<text x="36" y="464">Choose what help to offer</text>
<text x="36" y="497">Attend to their own needs</text>
<path d="M180 537V560" class="green" marker-end="url(#arrow)"/>
<rect x="16" y="574" width="328" height="59" fill="#fff" stroke="#a6aca3"/>
<text x="180" y="609" text-anchor="middle">Support and safety planning</text>
<rect x="16" y="665" width="328" height="40" fill="#edf5f0" stroke="#00855b" stroke-width="1.5"/>
<text x="180" y="690" text-anchor="middle">Specific help may be agreed</text>
<text x="180" y="730" text-anchor="middle" class="small">Safety and autonomy apply throughout.</text>
<text x="180" y="750" text-anchor="middle" class="small">Joint discussion is optional.</text>
</svg>
