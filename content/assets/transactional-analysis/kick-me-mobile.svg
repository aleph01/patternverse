<svg xmlns="http://www.w3.org/2000/svg" width="360" height="850" viewBox="0 0 360 850" role="img" aria-labelledby="title desc">
  <title id="title">A possible rejection loop: compact version</title>
  <desc id="desc">Three stages run down the page: rejection expected, repeated digs, rejecting reply. A dashed return shows that the ending may reinforce the expectation. Two green panels suggest asking directly and choosing a boundary without humiliation. Each person remains responsible for their conduct.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker></defs>
  <rect width="360" height="850" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="22" y="39" font-size="22">A possible rejection loop</text>
    <text x="22" y="69" font-size="16">An interpretation to examine.</text>
    <text x="22" y="93" font-size="16">Never a verdict about a person.</text>
    <g fill="#f1f2ef" stroke="#a6aca3" stroke-width="1">
      <rect x="48" y="125" width="287" height="85" rx="5"/>
      <rect x="48" y="250" width="287" height="85" rx="5"/>
      <rect x="48" y="375" width="287" height="85" rx="5"/>
    </g>
    <path d="M191 211 V240" stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/><path d="M191 336 V365" stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M48 418 H22 V167 H41" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="4 5" fill="none" marker-end="url(#arrow)"/>
    <text x="68" y="157" font-size="19">Rejection expected</text>
    <text x="68" y="186" font-size="17">“They don’t want me.”</text>
    <text x="68" y="282" font-size="19">Repeated digs</text>
    <text x="68" y="311" font-size="17">Tension grows.</text>
    <text x="68" y="407" font-size="19">Rejecting reply</text>
    <text x="68" y="436" font-size="17">“Leave, then.”</text>
    <text x="48" y="489" font-size="15">The expectation seems confirmed.</text>
    <g fill="#edf5f0" stroke="#00855b" stroke-width="1">
      <rect x="22" y="519" width="313" height="103" rx="5"/>
      <rect x="22" y="641" width="313" height="103" rx="5"/>
    </g>
    <text x="40" y="550" font-size="19" fill="#00855b">Check the expectation</text>
    <text x="40" y="581" font-size="17">“Was I meant to be included?”</text>
    <text x="40" y="606" font-size="15">Ask before concluding.</text>
    <text x="40" y="672" font-size="19" fill="#00855b">Choose a specific boundary</text>
    <text x="40" y="703" font-size="17">“No personal digs. We can pause.”</text>
    <text x="40" y="728" font-size="15">A limit without humiliation.</text>
    <text x="22" y="781" font-size="16">No reply is inevitable. Each person</text>
    <text x="22" y="805" font-size="16">is responsible for their conduct.</text>
    <text x="22" y="833" font-size="14" fill="#667064">Green marks possibilities, not promises.</text>
  </g>
</svg>
