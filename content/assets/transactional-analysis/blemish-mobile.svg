<svg xmlns="http://www.w3.org/2000/svg" width="360" height="870" viewBox="0 0 360 870" role="img" aria-labelledby="title desc">
  <title id="title">One detail becomes a verdict: compact</title>
  <desc id="desc">Search for a fault, find a detail, dismiss the person: one possible sequence. The green opening checks what the detail is relevant to and keeps conclusions within the evidence. Firm boundaries remain possible without deciding someone's human worth.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker></defs>
  <rect width="360" height="870" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="22" y="39" font-size="23">When one detail</text><text x="22" y="70" font-size="23">becomes a verdict</text>
    <text x="22" y="103" font-size="15" fill="#667064">An illustration. Motives are hypotheses.</text>
    <g fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"><rect x="22" y="131" width="316" height="94" rx="5"/><rect x="22" y="267" width="316" height="94" rx="5"/><rect x="22" y="403" width="316" height="94" rx="5"/></g>
    <g stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"><path d="M180 225 V255"/><path d="M180 361 V391"/></g>
    <text x="40" y="164" font-size="20">Search</text><text x="40" y="200" font-size="18">“Something must be wrong.”</text>
    <text x="40" y="300" font-size="20">Find a detail</text><text x="40" y="336" font-size="18">“Hasn’t seen that film.”</text>
    <text x="40" y="436" font-size="20">Dismiss</text><text x="40" y="472" font-size="18">“Nothing to offer.”</text>
    <rect x="22" y="535" width="316" height="147" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="40" y="568" font-size="21" fill="#00855b">Check relevance and scope</text>
    <text x="40" y="606" font-size="18">“What is this detail relevant to?”</text>
    <text x="40" y="642" font-size="16">Keep the conclusion within</text><text x="40" y="666" font-size="16">the evidence.</text>
    <text x="22" y="722" font-size="16">Specific risks can justify specific limits.</text>
    <text x="22" y="762" font-size="16">A boundary does not require a verdict</text><text x="22" y="787" font-size="16">on someone’s worth.</text>
    <text x="22" y="827" font-size="14" fill="#667064">An opening, not an obligation to trust</text><text x="22" y="850" font-size="14" fill="#667064">or continue contact.</text>
  </g>
</svg>
