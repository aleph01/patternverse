<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550" role="img" aria-labelledby="title desc">
  <title id="title">A possible rejection loop, with two openings</title>
  <desc id="desc">An expectation of rejection, repeated personal digs, and a rejecting reply form a hypothetical reinforcing loop. One opening is to check the expectation directly. Another is to set a specific boundary without humiliation. Each person remains responsible for their conduct.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker>
    <marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#00855b" stroke-width="1.2"/></marker>
  </defs>
  <rect width="760" height="550" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="34" y="43" font-size="24">A possible rejection loop</text>
    <text x="34" y="72" font-size="16" fill="#667064">An interpretation to examine, never a verdict about a person.</text>
    <path d="M625 168 V113 H135 V168" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
    <rect x="212" y="99" width="336" height="28" fill="#ffffff"/>
    <text x="380" y="119" font-size="16" text-anchor="middle">The expectation seems confirmed</text>
    <g fill="#f1f2ef" stroke="#a6aca3" stroke-width="1">
      <rect x="34" y="168" width="202" height="112" rx="5"/>
      <rect x="279" y="168" width="202" height="112" rx="5"/>
      <rect x="524" y="168" width="202" height="112" rx="5"/>
    </g>
    <path d="M237 224 H269" stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/><path d="M482 224 H514" stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <text x="135" y="205" font-size="18" text-anchor="middle">Rejection expected</text>
    <text x="135" y="239" font-size="16" text-anchor="middle">“They don’t want me.”</text>
    <text x="380" y="205" font-size="18" text-anchor="middle">Repeated digs</text>
    <text x="380" y="239" font-size="16" text-anchor="middle">Tension grows.</text>
    <text x="625" y="205" font-size="18" text-anchor="middle">Rejecting reply</text>
    <text x="625" y="239" font-size="16" text-anchor="middle">“Leave, then.”</text>
    <path d="M135 280 V333" stroke="#00855b" stroke-width="1.3" fill="none" marker-end="url(#green-arrow)"/><path d="M625 280 V333" stroke="#00855b" stroke-width="1.3" fill="none" marker-end="url(#green-arrow)"/>
    <g fill="#edf5f0" stroke="#00855b" stroke-width="1">
      <rect x="34" y="343" width="327" height="116" rx="5"/>
      <rect x="399" y="343" width="327" height="116" rx="5"/>
    </g>
    <text x="54" y="375" font-size="19" fill="#00855b">Check the expectation</text>
    <text x="54" y="408" font-size="17">“Was I meant to be included?”</text>
    <text x="54" y="436" font-size="15">Ask before concluding.</text>
    <text x="419" y="375" font-size="19" fill="#00855b">Choose a specific boundary</text>
    <text x="419" y="408" font-size="17">“No personal digs. We can pause.”</text>
    <text x="419" y="436" font-size="15">A limit without humiliation.</text>
    <text x="34" y="502" font-size="16">No reply is inevitable. Each person is responsible for their conduct.</text>
    <text x="34" y="528" font-size="15" fill="#667064">Green marks possible openings, not guaranteed outcomes.</text>
  </g>
</svg>
