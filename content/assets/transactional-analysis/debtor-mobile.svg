<svg xmlns="http://www.w3.org/2000/svg" width="360" height="750" viewBox="0 0 360 750" role="img" aria-labelledby="title desc">
<title id="title">Two questions deserve separate attention</title>
<desc id="desc">A compact comparison separates the payment question from the conduct question after a repayment conversation becomes accusatory. Both can be addressed without assuming that one answer decides the other.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:400;font-size:16px;fill:#252c28}.heading{font-size:18px}.small{font-size:14px}.line{fill:none;stroke:#a6aca3;stroke-width:1.5}.accent{fill:none;stroke:#00855b;stroke-width:1.5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}</style>
<rect width="360" height="750" fill="#fff"/>
<rect x="16" y="20" width="328" height="76" class="context"/>
<text x="180" y="51" text-anchor="middle">A repayment conversation</text>
<text x="180" y="77" text-anchor="middle">shifts into accusations.</text>
<rect x="16" y="130" width="328" height="163" fill="#fff" stroke="#a6aca3"/>
<text x="36" y="164" class="heading">The payment question</text>
<path d="M36 181H324" class="line"/>
<text x="36" y="212">Is the amount agreed?</text>
<text x="36" y="242">What was the agreement?</text>
<text x="36" y="272">What is realistically possible?</text>
<rect x="16" y="323" width="328" height="163" fill="#fff" stroke="#a6aca3"/>
<text x="36" y="357" class="heading">The conduct question</text>
<path d="M36 374H324" class="line"/>
<text x="36" y="405">How was payment requested?</text>
<text x="36" y="435">Was there pressure or harm?</text>
<text x="36" y="465">What boundary is needed?</text>
<path d="M180 500V535" class="accent" marker-end="url(#arrow)"/>
<rect x="16" y="550" width="328" height="93" fill="#edf5f0" stroke="#00855b" stroke-width="1.5"/>
<text x="180" y="587" text-anchor="middle" class="heading">Address both questions.</text>
<text x="180" y="618" text-anchor="middle">Neither answer settles the other.</text>
<text x="180" y="690" text-anchor="middle" class="small">Clarifying the relationship does not</text>
<text x="180" y="713" text-anchor="middle" class="small">change the financial facts.</text>
</svg>
