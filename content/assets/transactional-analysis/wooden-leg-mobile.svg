<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1170" viewBox="0 0 360 1170" role="img" aria-labelledby="title desc"><title id="title">Wooden Leg: taking constraints seriously without a contest of wills</title><desc id="desc">Compact comparison. A constraint is raised. One reaction accepts a blanket exemption; another rejects the constraint and demands change. The proposed opening understands the aim and actual limits and agrees support, a feasible step, or an honest stop. No capacity or motive is inferred. An honest limit is legitimate.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="24" y="43" font-size="23" fill="#252c28" text-anchor="start">Taking the constraint</text><text x="24" y="75" font-size="23" fill="#252c28" text-anchor="start">seriously</text><text x="24" y="115" font-size="16" fill="#252c28" text-anchor="start">Berne’s proposed dilemma;</text><text x="24" y="139" font-size="16" fill="#252c28" text-anchor="start">not a verdict on disability.</text><rect x="53" y="184" width="254" height="94" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="237.0" font-size="18" fill="#252c28" text-anchor="middle">A constraint is raised</text><text x="180" y="334" font-size="13" fill="#252c28" text-anchor="middle">ONE POSSIBLE REACTION</text><rect x="39" y="354" width="282" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="401.0" font-size="18" fill="#252c28" text-anchor="middle">Accept a blanket</text><text x="180.0" y="427.0" font-size="18" fill="#252c28" text-anchor="middle">exemption</text><text x="180" y="518" font-size="13" fill="#252c28" text-anchor="middle">ANOTHER POSSIBLE REACTION</text><rect x="39" y="538" width="282" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="585.0" font-size="18" fill="#252c28" text-anchor="middle">Reject the constraint</text><text x="180.0" y="611.0" font-size="18" fill="#252c28" text-anchor="middle">and demand change</text><path d="M307 231 H338 V720 H180 V765" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="39" y="771" width="282" height="172" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="811.0" font-size="18" fill="#252c28" text-anchor="middle">Understand the aim</text><text x="180.0" y="837.0" font-size="18" fill="#252c28" text-anchor="middle">and actual limits.</text><text x="180.0" y="863.0" font-size="18" fill="#252c28" text-anchor="middle">Agree support,</text><text x="180.0" y="889.0" font-size="18" fill="#252c28" text-anchor="middle">a feasible step,</text><text x="180.0" y="915.0" font-size="18" fill="#252c28" text-anchor="middle">or an honest stop.</text><text x="180" y="1010" font-size="17" fill="#252c28" text-anchor="middle">An honest limit</text><text x="180" y="1037" font-size="17" fill="#252c28" text-anchor="middle">is a legitimate outcome.</text></g></svg>