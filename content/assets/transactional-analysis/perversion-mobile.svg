<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1030" viewBox="0 0 360 1030" role="img" aria-labelledby="title desc"><title id="title">When the prelude is the point: different expectations</title><desc id="desc">Compact layout: one shared activity can carry different expectations. One person wants it for itself; the other expects another activity afterward. The proposed opening is to clarify wishes and consent separately, with no obligation to continue.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="25" y="42" font-size="23" fill="#252c28" text-anchor="start">When the “prelude”</text><text x="25" y="73" font-size="23" fill="#252c28" text-anchor="start">is the point</text><text x="25" y="113" font-size="16" fill="#252c28" text-anchor="start">A difference in expectations;</text><text x="25" y="136" font-size="16" fill="#252c28" text-anchor="start">not a diagnosis.</text><rect x="55" y="178" width="250" height="78" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="223.0" font-size="18" fill="#252c28" text-anchor="middle">The same activity</text><text x="180" y="283" font-size="16" fill="#252c28" text-anchor="middle">Possible expectations</text><rect x="55" y="304" width="250" height="90" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="342.0" font-size="18" fill="#252c28" text-anchor="middle">One person:</text><text x="180.0" y="368.0" font-size="18" fill="#252c28" text-anchor="middle">wanted for itself</text><rect x="55" y="420" width="250" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="454.0" font-size="18" fill="#252c28" text-anchor="middle">The other:</text><text x="180.0" y="480.0" font-size="18" fill="#252c28" text-anchor="middle">expected to lead</text><text x="180.0" y="506.0" font-size="18" fill="#252c28" text-anchor="middle">to something else</text><path d="M305 217 H335 V608 H180 V644" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="39" y="650" width="282" height="118" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="689.0" font-size="18" fill="#252c28" text-anchor="middle">“What do we each want?”</text><text x="180.0" y="715.0" font-size="18" fill="#252c28" text-anchor="middle">Agree separately;</text><text x="180.0" y="741.0" font-size="18" fill="#252c28" text-anchor="middle">either may stop.</text><text x="180" y="831" font-size="18" fill="#00855b" text-anchor="middle">Wishes are not obligations.</text><text x="180" y="919" font-size="17" fill="#252c28" text-anchor="middle">A mismatch alone</text><text x="180" y="946" font-size="17" fill="#252c28" text-anchor="middle">does not establish a game.</text></g></svg>