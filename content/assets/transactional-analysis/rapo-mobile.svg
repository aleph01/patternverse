<svg xmlns="http://www.w3.org/2000/svg" width="360" height="960" viewBox="0 0 360 960" role="img" aria-labelledby="title desc"><title id="title">Rapo: separate refusal from ridicule</title><desc id="desc">Compact version. An invitation, an approach, and public ridicule form one possible social sequence, not proof of hidden motives. A green branch asks people to stop if contact is declined, and address ridicule separately.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="25" y="42" font-size="23" fill="#252c28" text-anchor="start">Separate refusal</text><text x="25" y="73" font-size="23" fill="#252c28" text-anchor="start">from ridicule</text><text x="25" y="113" font-size="16" fill="#252c28" text-anchor="start">A Patternverse adaptation</text><text x="25" y="136" font-size="16" fill="#252c28" text-anchor="start">of the social interaction.</text><rect x="55" y="178" width="250" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="221.0" font-size="18" fill="#252c28" text-anchor="middle">An invitation</text><path d="M180 252 V286" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="55" y="292" width="250" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="335.0" font-size="18" fill="#252c28" text-anchor="middle">An approach</text><path d="M180 366 V400" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="55" y="406" width="250" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="449.0" font-size="18" fill="#252c28" text-anchor="middle">Public ridicule</text><text x="180" y="525" font-size="16" fill="#252c28" text-anchor="middle">One possible sequence;</text><text x="180" y="550" font-size="16" fill="#252c28" text-anchor="middle">motives remain uncertain.</text><path d="M305 329 H335 V601 H180 V639" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="39" y="645" width="282" height="112" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="681.0" font-size="18" fill="#252c28" text-anchor="middle">If contact is declined: stop.</text><text x="180.0" y="707.0" font-size="18" fill="#252c28" text-anchor="middle">Address ridicule</text><text x="180.0" y="733.0" font-size="18" fill="#252c28" text-anchor="middle">separately.</text><text x="180" y="830" font-size="16" fill="#252c28" text-anchor="middle">An invitation does not establish</text><text x="180" y="857" font-size="16" fill="#252c28" text-anchor="middle">consent to further contact.</text></g></svg>