<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" role="img" aria-labelledby="title desc"><title id="title">Peasant: admiration, recognition, and room for honest feedback</title><desc id="desc">A common arrangement of admiration and special recognition branches into Berne’s two historical interpretations. In the innocent form, faith in the expert sustains the relationship. In the dissembled form, admiration precedes discrediting the expert. A green alternative welcomes appreciation while making room for disagreement and results. Praise or a complaint alone proves neither interpretation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">Admiration needs room for honest feedback</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">Berne’s two interpretations—not a test for hidden motives.</text><rect x="220" y="128" width="360" height="96" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="400.0" y="169.0" font-size="18" fill="#252c28" text-anchor="middle">Admiration meets</text><text x="400.0" y="195.0" font-size="18" fill="#252c28" text-anchor="middle">special recognition</text><path d="M400 224 V274 H72 V326" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M400 274 H728 V326" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="194" y="311" font-size="14" fill="#252c28" text-anchor="middle">BERNE: “INNOCENT”</text><text x="606" y="311" font-size="14" fill="#252c28" text-anchor="middle">BERNE: “DISSEMBLED”</text><rect x="44" y="332" width="300" height="110" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="380.0" font-size="18" fill="#252c28" text-anchor="middle">Faith in the expert</text><text x="194.0" y="406.0" font-size="18" fill="#252c28" text-anchor="middle">sustains the relationship</text><rect x="456" y="332" width="300" height="110" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="606.0" y="380.0" font-size="18" fill="#252c28" text-anchor="middle">Admiration precedes</text><text x="606.0" y="406.0" font-size="18" fill="#252c28" text-anchor="middle">discrediting the expert</text><path d="M400 274 V510" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="106" y="516" width="588" height="110" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="400.0" y="564.0" font-size="18" fill="#252c28" text-anchor="middle">Welcome appreciation.</text><text x="400.0" y="590.0" font-size="18" fill="#252c28" text-anchor="middle">Make room for disagreement and results.</text><text x="400" y="669" font-size="16" fill="#252c28" text-anchor="middle">Praise or a complaint alone proves neither interpretation.</text></g></svg>