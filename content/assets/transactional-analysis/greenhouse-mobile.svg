<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1060" viewBox="0 0 360 1060" role="img" aria-labelledby="title desc"><title id="title">Greenhouse: sharing, admiration, and room for curiosity</title><desc id="desc">Compact version: feeling presented, admiration expected, questions ruled out, and the same ritual repeats. An alternative is to agree what response is welcome, including listening first and exploring later by agreement. Gentleness alone is not a game.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="24" y="43" font-size="24" fill="#252c28" text-anchor="start">When sharing</text><text x="24" y="75" font-size="24" fill="#252c28" text-anchor="start">becomes an exhibit</text><text x="24" y="113" font-size="16" fill="#252c28" text-anchor="start">A possible group pattern;</text><text x="24" y="137" font-size="16" fill="#252c28" text-anchor="start">not a verdict on any feeling.</text><rect x="53" y="181" width="254" height="94" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="221.0" font-size="18" fill="#252c28" text-anchor="middle">A feeling</text><text x="180.0" y="247.0" font-size="18" fill="#252c28" text-anchor="middle">is presented</text><path d="M180 275 V314" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="53" y="320" width="254" height="94" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="360.0" font-size="18" fill="#252c28" text-anchor="middle">Admiration</text><text x="180.0" y="386.0" font-size="18" fill="#252c28" text-anchor="middle">becomes expected</text><path d="M180 414 V453" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="53" y="459" width="254" height="94" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="499.0" font-size="18" fill="#252c28" text-anchor="middle">Questions become</text><text x="180.0" y="525.0" font-size="18" fill="#252c28" text-anchor="middle">off limits</text><path d="M53 506 H24 V228 H47" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="180" y="592" font-size="16" fill="#252c28" text-anchor="middle">The same ritual repeats</text><path d="M307 228 H335 V659 H180 V698" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="39" y="704" width="282" height="146" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="744.0" font-size="18" fill="#252c28" text-anchor="middle">Agree what response</text><text x="180.0" y="770.0" font-size="18" fill="#252c28" text-anchor="middle">is welcome.</text><text x="180.0" y="796.0" font-size="18" fill="#252c28" text-anchor="middle">Listening now; exploration</text><text x="180.0" y="822.0" font-size="18" fill="#252c28" text-anchor="middle">when agreed.</text><text x="180" y="925" font-size="17" fill="#252c28" text-anchor="middle">A request for gentleness</text><text x="180" y="952" font-size="17" fill="#252c28" text-anchor="middle">alone does not establish</text><text x="180" y="979" font-size="17" fill="#252c28" text-anchor="middle">this pattern.</text></g></svg>