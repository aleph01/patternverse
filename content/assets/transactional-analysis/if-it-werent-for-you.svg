<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" role="img" aria-labelledby="title desc">
  <title id="title">Check freedom and readiness separately</title>
  <desc id="desc">When a restriction is questioned or removed, two separate questions remain. Is the option genuinely available, including time, money, access, care, and safety? Does the person want it, and what feels difficult? Both inform a possible next step. Fear does not erase coercion, and freedom includes declining to act.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker></defs>
  <rect width="760" height="570" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="34" y="43" font-size="24">Check freedom and readiness separately</text>
    <text x="34" y="74" font-size="16" fill="#667064">Two kinds of information can matter at the same time.</text>
    <rect x="202" y="106" width="356" height="74" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="380" y="136" text-anchor="middle" font-size="18">A restriction is questioned</text><text x="380" y="161" text-anchor="middle" font-size="18">or removed</text>
    <g stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"><path d="M365 180 V207 H197 V234"/><path d="M395 180 V207 H563 V234"/></g>
    <g fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"><rect x="34" y="247" width="327" height="141" rx="5"/><rect x="399" y="247" width="327" height="141" rx="5"/></g>
    <text x="54" y="281" font-size="20">Is the option truly available?</text>
    <text x="54" y="320" font-size="17">Time, money, access, care, safety.</text><text x="54" y="353" font-size="16">What restrictions still remain?</text>
    <text x="419" y="281" font-size="20">What do I want or fear?</text>
    <text x="419" y="320" font-size="17">Interest, uncertainty, mixed feelings.</text><text x="419" y="353" font-size="16">What support might I want?</text>
    <g stroke="#00855b" stroke-width="1.2" fill="none"><path d="M197 388 V412 H380 V434"/><path d="M563 388 V412 H380"/></g>
    <rect x="34" y="434" width="692" height="58" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="380" y="470" text-anchor="middle" font-size="20" fill="#00855b">Name the obstacle and choose whether to take a next step</text>
    <text x="34" y="530" font-size="16">Fear does not erase coercion. Freedom includes the choice not to proceed.</text>
    <text x="34" y="556" font-size="14" fill="#667064">A way to clarify the situation, not a test of hidden motives.</text>
  </g>
</svg>
