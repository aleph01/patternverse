<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">When the prelude is the point: different expectations</title><desc id="desc">The same activity may be wanted for itself by one person and expected to lead to something else by another. A green opening invites both to name their wishes, agree separately, or stop. A difference in expectations does not prove deception or pathology.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">When the “prelude” is the point</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">A possible difference in expectations—not a diagnosis.</text><rect x="240" y="133" width="280" height="78" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="380.0" y="178.0" font-size="18" fill="#252c28" text-anchor="middle">The same activity</text><path d="M285 211 V248 H178 V283" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M475 211 V248 H582 V283" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="48" y="289" width="260" height="100" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="178.0" y="332.0" font-size="18" fill="#252c28" text-anchor="middle">One person:</text><text x="178.0" y="358.0" font-size="18" fill="#252c28" text-anchor="middle">wanted for itself</text><rect x="452" y="289" width="260" height="100" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="582.0" y="319.0" font-size="18" fill="#252c28" text-anchor="middle">The other:</text><text x="582.0" y="345.0" font-size="18" fill="#252c28" text-anchor="middle">expected to lead</text><text x="582.0" y="371.0" font-size="18" fill="#252c28" text-anchor="middle">to something else</text><path d="M380 211 V437" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="150" y="443" width="460" height="100" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="380.0" y="486.0" font-size="18" fill="#252c28" text-anchor="middle">“What do we each want?”</text><text x="380.0" y="512.0" font-size="18" fill="#252c28" text-anchor="middle">Agree separately; either may stop.</text><text x="380" y="585" font-size="17" fill="#252c28" text-anchor="middle">A mismatch alone does not establish a game.</text></g></svg>