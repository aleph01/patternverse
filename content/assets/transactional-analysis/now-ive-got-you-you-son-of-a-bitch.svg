<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">An error is found. What follows?</title>
  <desc id="desc">A late file leads to two possible directions. A wider attack turns the error into a verdict on the person and adds earlier grievances. A green alternative keeps accountability specific to the impact, repair, and an appropriate consequence. The diagram describes possible responses, not hidden motives.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker>
    <marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#00855b" stroke-width="1.2"/></marker>
  </defs>
  <rect width="760" height="560" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="34" y="43" font-size="24">An error is found. What follows?</text>
    <text x="34" y="73" font-size="16" fill="#667064">The response can stay specific or expand into a personal verdict.</text>
    <rect x="240" y="106" width="280" height="95" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="380" y="141" text-anchor="middle" font-size="19">A specific error</text>
    <text x="380" y="173" text-anchor="middle" font-size="17">The file arrived late.</text>
    <path d="M365 201 V235 H197 V269" stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M395 201 V235 H563 V269" stroke="#00855b" stroke-width="1.3" fill="none" marker-end="url(#green)"/>
    <rect x="34" y="280" width="327" height="173" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="54" y="315" font-size="20">The wider attack</text>
    <text x="54" y="353" font-size="18">“This proves you’re useless.”</text>
    <text x="54" y="391" font-size="16">One error becomes a verdict.</text>
    <text x="54" y="420" font-size="16">Earlier grievances join in.</text>
    <rect x="399" y="280" width="327" height="173" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="419" y="315" font-size="20" fill="#00855b">Specific accountability</text>
    <text x="419" y="353" font-size="18">“The delay cost us an hour.”</text>
    <text x="419" y="391" font-size="16">Agree a repair or consequence.</text>
    <text x="419" y="420" font-size="16">A boundary can still be firm.</text>
    <text x="34" y="495" font-size="16">Responsibility for the error and for the response remain distinct.</text>
    <text x="34" y="526" font-size="15" fill="#667064">Possible directions, not a test of motives or a promise of cooperation.</text>
  </g>
</svg>
