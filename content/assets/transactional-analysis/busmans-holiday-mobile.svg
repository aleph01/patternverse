<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1160" viewBox="0 0 360 1160" role="img" aria-labelledby="title desc"><title id="title">Busman’s Holiday: familiar skills, chosen contribution</title><desc id="desc">Compact layout: familiar skill, different context, and free choice combine into a welcome contribution. Clear scope, local guidance and room to stop protect the agreement. Useful work and possible enjoyment or renewal follow. Both contributor and hosts have a say; renewal is not guaranteed.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="24" y="43" font-size="23" fill="#252c28" text-anchor="start">Familiar work,</text><text x="24" y="75" font-size="23" fill="#252c28" text-anchor="start">a different experience</text><text x="24" y="115" font-size="16" fill="#252c28" text-anchor="start">A constructive possibility;</text><text x="24" y="139" font-size="16" fill="#252c28" text-anchor="start">not a promise of recovery.</text><rect x="53" y="183" width="254" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="226.0" font-size="18" fill="#252c28" text-anchor="middle">Familiar skill</text><rect x="53" y="281" width="254" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="324.0" font-size="18" fill="#252c28" text-anchor="middle">Different context</text><rect x="53" y="379" width="254" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="422.0" font-size="18" fill="#252c28" text-anchor="middle">Free choice</text><path d="M307 220 H335 V489 H180" fill="none" stroke="#a6aca3" stroke-width="1.4"/><path d="M307 318 H335 M307 416 H335" fill="none" stroke="#a6aca3" stroke-width="1.4"/><path d="M180 489 V530" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="39" y="536" width="282" height="172" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="589.0" font-size="18" fill="#252c28" text-anchor="middle">A welcome, agreed</text><text x="180.0" y="615.0" font-size="18" fill="#252c28" text-anchor="middle">contribution</text><text x="180.0" y="641.0" font-size="18" fill="#252c28" text-anchor="middle">Clear scope, local guidance,</text><text x="180.0" y="667.0" font-size="18" fill="#252c28" text-anchor="middle">room to stop</text><path d="M180 708 V766" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="39" y="772" width="282" height="120" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="812.0" font-size="18" fill="#252c28" text-anchor="middle">Useful work</text><text x="180.0" y="838.0" font-size="18" fill="#252c28" text-anchor="middle">Possible enjoyment</text><text x="180.0" y="864.0" font-size="18" fill="#252c28" text-anchor="middle">or renewal</text><text x="180" y="969" font-size="16" fill="#252c28" text-anchor="middle">The contributor and the hosts</text><text x="180" y="995" font-size="16" fill="#252c28" text-anchor="middle">both get a say.</text></g></svg>