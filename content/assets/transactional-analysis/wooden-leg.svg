<svg xmlns="http://www.w3.org/2000/svg" width="800" height="690" viewBox="0 0 800 690" role="img" aria-labelledby="title desc"><title id="title">Wooden Leg: taking constraints seriously without a contest of wills</title><desc id="desc">A constraint is raised. Two possible reactions in Berne’s account are accepting a blanket exemption or rejecting the constraint and demanding change. A green alternative is to understand the aim and actual limits, then agree support, a feasible step, or an honest stop. The diagram makes no assessment of capacity or motive. An honest limit is a legitimate outcome.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">Taking the constraint seriously</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">Berne’s proposed dilemma—not a verdict on disability.</text><rect x="220" y="128" width="360" height="90" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="400.0" y="179.0" font-size="18" fill="#252c28" text-anchor="middle">A constraint is raised</text><path d="M400 218 V266 H72 V318" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M400 266 H728 V318" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="194" y="303" font-size="13" fill="#252c28" text-anchor="middle">ONE POSSIBLE REACTION</text><text x="606" y="303" font-size="13" fill="#252c28" text-anchor="middle">ANOTHER POSSIBLE REACTION</text><rect x="44" y="324" width="300" height="110" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="372.0" font-size="18" fill="#252c28" text-anchor="middle">Accept a blanket</text><text x="194.0" y="398.0" font-size="18" fill="#252c28" text-anchor="middle">exemption</text><rect x="456" y="324" width="300" height="110" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="606.0" y="372.0" font-size="18" fill="#252c28" text-anchor="middle">Reject the constraint</text><text x="606.0" y="398.0" font-size="18" fill="#252c28" text-anchor="middle">and demand change</text><path d="M400 266 V500" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="70" y="506" width="660" height="116" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="400.0" y="557.0" font-size="18" fill="#252c28" text-anchor="middle">Understand the aim and actual limits.</text><text x="400.0" y="583.0" font-size="18" fill="#252c28" text-anchor="middle">Agree support, a feasible step, or an honest stop.</text><text x="400" y="664" font-size="17" fill="#252c28" text-anchor="middle">An honest limit is a legitimate outcome.</text></g></svg>