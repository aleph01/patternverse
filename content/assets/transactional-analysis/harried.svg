<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
  <title id="title">Several roles, one time window</title>
  <desc id="desc">Preparing a meal, collecting a child, and hosting guests all demand one person's time between four and six. Green alternatives illustrate simplifying the meal, transferring collection responsibility, and changing the visit. Scheduling alone is insufficient when the total load remains unworkable.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker>
  </defs>
  <rect width="760" height="590" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="34" y="43" font-size="24">Several roles, one time window</text>
    <text x="34" y="74" font-size="16" fill="#667064">An illustration of conflicting demands, not a diagnosis.</text>
    <rect x="34" y="106" width="692" height="42" rx="4" fill="#f1f2ef"/>
    <text x="380" y="133" text-anchor="middle" font-size="17">4–6 pm: all three roles call for attention</text>
    <g fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"><rect x="34" y="172" width="212" height="75" rx="5"/><rect x="274" y="172" width="212" height="75" rx="5"/><rect x="514" y="172" width="212" height="75" rx="5"/></g>
    <text x="140" y="216" text-anchor="middle" font-size="19">Prepare the meal</text><text x="380" y="216" text-anchor="middle" font-size="19">Collect the child</text><text x="620" y="216" text-anchor="middle" font-size="19">Host the guests</text>
    <g stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"><path d="M140 247 L315 305"/><path d="M380 247 V305"/><path d="M620 247 L445 305"/></g>
    <rect x="294" y="317" width="172" height="53" rx="5" fill="#ffffff" stroke="#252c28"/>
    <text x="380" y="350" text-anchor="middle" font-size="19">One person</text>
    <text x="34" y="412" font-size="18" fill="#00855b">Possible changes to the arrangement</text>
    <g fill="#edf5f0" stroke="#00855b" stroke-width="1"><rect x="34" y="432" width="212" height="87" rx="5"/><rect x="274" y="432" width="212" height="87" rx="5"/><rect x="514" y="432" width="212" height="87" rx="5"/></g>
    <text x="54" y="461" font-size="18" fill="#00855b">Reduce</text><text x="54" y="493" font-size="16">A simpler meal</text>
    <text x="294" y="461" font-size="18" fill="#00855b">Transfer ownership</text><text x="294" y="493" font-size="16">Someone else collects</text>
    <text x="534" y="461" font-size="18" fill="#00855b">Change the plan</text><text x="534" y="493" font-size="16">A different visit time</text>
    <text x="34" y="555" font-size="16">Sequencing helps only if the total load is feasible and support is available.</text>
    <text x="34" y="580" font-size="14" fill="#667064">These examples are possibilities, not proof that someone could have done less.</text>
  </g>
</svg>
