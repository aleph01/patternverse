<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><title id="title">Rapo: separate refusal from ridicule</title><desc id="desc">A possible nonviolent social sequence moves from an invitation to an approach and public ridicule. A green opening says to stop if contact is declined, while addressing ridicule separately. Rejection alone does not establish a hidden motive or game.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">Separate refusal from ridicule</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">A Patternverse adaptation of the social interaction.</text><rect x="36" y="142" width="186" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="129.0" y="191.0" font-size="18" fill="#252c28" text-anchor="middle">An invitation</text><rect x="287" y="142" width="186" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="380.0" y="191.0" font-size="18" fill="#252c28" text-anchor="middle">An approach</text><rect x="538" y="142" width="186" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="631.0" y="191.0" font-size="18" fill="#252c28" text-anchor="middle">Public ridicule</text><path d="M222 185 H283" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M473 185 H534" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="380" y="279" font-size="17" fill="#252c28" text-anchor="middle">One possible sequence; not a test of someone’s motives.</text><path d="M380 228 V251" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><path d="M380 300 V354" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="110" y="360" width="540" height="106" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="380.0" y="406.0" font-size="18" fill="#252c28" text-anchor="middle">If contact is declined: stop.</text><text x="380.0" y="432.0" font-size="18" fill="#252c28" text-anchor="middle">Ridicule can be addressed separately.</text><text x="380" y="520" font-size="17" fill="#252c28" text-anchor="middle">An invitation does not establish consent to further contact.</text></g></svg>