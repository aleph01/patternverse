<svg xmlns="http://www.w3.org/2000/svg" width="760" height="575" viewBox="0 0 760 575" role="img" aria-labelledby="title desc"><title id="title">How Do You Get Out of Here: approaching an exit and making support concrete</title><desc id="desc">A wish to leave is followed by an approaching exit and a setback that delays the move. A dashed return shows that familiar structure continues. A green opening asks what becomes harder as departure approaches and clarifies needs, barriers, and support. A setback does not prove a wish to stay.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">When leaving becomes real</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">A possible pattern—not a test of readiness or motive.</text><text x="380" y="108" font-size="17" fill="#252c28" text-anchor="middle">Familiar structure continues</text><rect x="36" y="142" width="186" height="90" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="129.0" y="180.0" font-size="18" fill="#252c28" text-anchor="middle">A wish</text><text x="129.0" y="206.0" font-size="18" fill="#252c28" text-anchor="middle">to leave</text><rect x="287" y="142" width="186" height="90" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="380.0" y="180.0" font-size="18" fill="#252c28" text-anchor="middle">An exit</text><text x="380.0" y="206.0" font-size="18" fill="#252c28" text-anchor="middle">approaches</text><rect x="538" y="142" width="186" height="90" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="631.0" y="180.0" font-size="18" fill="#252c28" text-anchor="middle">A setback</text><text x="631.0" y="206.0" font-size="18" fill="#252c28" text-anchor="middle">delays the move</text><path d="M222 187 H283" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M473 187 H534" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M631 142 V118 H129 V138" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M380 232 V354" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="75" y="360" width="610" height="112" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="380.0" y="409.0" font-size="18" fill="#252c28" text-anchor="middle">“What becomes harder as leaving gets closer?”</text><text x="380.0" y="435.0" font-size="18" fill="#252c28" text-anchor="middle">Clarify needs, barriers, and support.</text><text x="380" y="533" font-size="17" fill="#252c28" text-anchor="middle">A setback does not prove a wish to stay.</text></g></svg>