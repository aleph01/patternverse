<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
  <title id="title">Affection does not promise escalation</title>
  <desc id="desc">A possible conflict sequence moves from welcomed affection through assumed permission to argument and distance. A green opening checks what contact is wanted before changing it. Equally valid possibilities are this contact only, more if both want it, or stopping. A refusal is not evidence of a game.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker>
    <marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#00855b" stroke-width="1.2"/></marker>
  </defs>
  <rect width="760" height="590" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="34" y="43" font-size="24">Affection does not promise escalation</text>
    <text x="34" y="74" font-size="16" fill="#667064">One possible conflict sequence, not proof of hidden intentions.</text>
    <g fill="#f1f2ef" stroke="#a6aca3" stroke-width="1">
      <rect x="34" y="120" width="152" height="100" rx="5"/><rect x="214" y="120" width="152" height="100" rx="5"/><rect x="394" y="120" width="152" height="100" rx="5"/><rect x="574" y="120" width="152" height="100" rx="5"/>
    </g>
    <g stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"><path d="M187 170 H205"/><path d="M367 170 H385"/><path d="M547 170 H565"/></g>
    <text x="110" y="159" text-anchor="middle" font-size="19">Affection</text><text x="110" y="190" text-anchor="middle" font-size="16">welcomed</text>
    <text x="290" y="159" text-anchor="middle" font-size="19">Assumption</text><text x="290" y="190" text-anchor="middle" font-size="16">“This means sex.”</text>
    <text x="470" y="159" text-anchor="middle" font-size="19">Argument</text><text x="470" y="190" text-anchor="middle" font-size="16">accusations</text>
    <text x="650" y="159" text-anchor="middle" font-size="19">Distance</text><text x="650" y="190" text-anchor="middle" font-size="16">contact ends</text>
    <path d="M110 220 V286" stroke="#00855b" stroke-width="1.3" fill="none" marker-end="url(#green)"/>
    <rect x="34" y="300" width="692" height="97" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="54" y="334" font-size="20" fill="#00855b">Check before changing the contact</text>
    <text x="54" y="370" font-size="19">“What, if anything, would you like next?”</text>
    <g stroke="#00855b" stroke-width="1" fill="none"><path d="M380 397 V418 H140 V439"/><path d="M380 418 V439"/><path d="M380 418 H620 V439"/></g>
    <g fill="#edf5f0" stroke="#00855b" stroke-width="1"><rect x="34" y="439" width="212" height="62" rx="5"/><rect x="274" y="439" width="212" height="62" rx="5"/><rect x="514" y="439" width="212" height="62" rx="5"/></g>
    <text x="140" y="476" text-anchor="middle" font-size="18">This contact only</text><text x="380" y="476" text-anchor="middle" font-size="18">More, if both want it</text><text x="620" y="476" text-anchor="middle" font-size="18">Stop</text>
    <text x="34" y="542" font-size="16">Each answer can change. A refusal requires no justification.</text>
    <text x="34" y="574" font-size="15" fill="#667064">Green marks options, not a route to obtaining sex.</text>
  </g>
</svg>
