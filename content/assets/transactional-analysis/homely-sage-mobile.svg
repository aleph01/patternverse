<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1080" viewBox="0 0 360 1080" role="img" aria-labelledby="title desc"><title id="title">Homely Sage: useful help has a scope</title><desc id="desc">Compact version: listen, clarify what would be useful, and consider two alternatives. Within competence, offer specific limited help. Beyond competence, name the limit and help find an appropriate person. Either offer may be declined.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="25" y="43" font-size="25" fill="#252c28" text-anchor="start">Useful help</text><text x="25" y="74" font-size="25" fill="#252c28" text-anchor="start">has a scope</text><text x="25" y="115" font-size="16" fill="#252c28" text-anchor="start">Approachable does not mean</text><text x="25" y="139" font-size="16" fill="#252c28" text-anchor="start">having every answer.</text><rect x="39" y="180" width="282" height="80" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="226.0" font-size="18" fill="#252c28" text-anchor="middle">Listen before advising</text><path d="M180 260 V301" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="39" y="307" width="282" height="90" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="345.0" font-size="18" fill="#252c28" text-anchor="middle">“What would be</text><text x="180.0" y="371.0" font-size="18" fill="#252c28" text-anchor="middle">useful to you?”</text><path d="M180 397 V439" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="180" y="468" font-size="16" fill="#252c28" text-anchor="middle">Two possible contributions</text><rect x="39" y="500" width="282" height="112" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="536.0" font-size="18" fill="#252c28" text-anchor="middle">Within current competence</text><text x="180.0" y="562.0" font-size="18" fill="#252c28" text-anchor="middle">Offer specific,</text><text x="180.0" y="588.0" font-size="18" fill="#252c28" text-anchor="middle">limited help.</text><text x="180" y="653" font-size="17" fill="#252c28" text-anchor="middle">or</text><rect x="39" y="688" width="282" height="138" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="737.0" font-size="18" fill="#252c28" text-anchor="middle">Beyond current competence</text><text x="180.0" y="763.0" font-size="18" fill="#252c28" text-anchor="middle">Name the limit;</text><text x="180.0" y="789.0" font-size="18" fill="#252c28" text-anchor="middle">help find the right person.</text><text x="180" y="891" font-size="20" fill="#00855b" text-anchor="middle">Either offer</text><text x="180" y="920" font-size="20" fill="#00855b" text-anchor="middle">may be declined.</text><text x="180" y="1000" font-size="16" fill="#252c28" text-anchor="middle">No guaranteed solution.</text></g></svg>