<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1060" viewBox="0 0 360 1060" role="img" aria-labelledby="title desc"><title id="title">When helping becomes a grievance</title><desc id="desc">Compact layout: help is offered, no benefit is reported, and failure is read as ingratitude. The cycle may repeat. An alternative is to check fit, consent, and constraints, then revise, refer, or stop by agreement. Unsuccessful help alone is not evidence of a game.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="24" y="43" font-size="23" fill="#252c28" text-anchor="start">When helping becomes</text><text x="24" y="75" font-size="23" fill="#252c28" text-anchor="start">a grievance</text><text x="24" y="113" font-size="16" fill="#252c28" text-anchor="start">A possible interaction;</text><text x="24" y="137" font-size="16" fill="#252c28" text-anchor="start">not a test of anyone’s motives.</text><rect x="53" y="181" width="254" height="94" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="221.0" font-size="18" fill="#252c28" text-anchor="middle">Help is</text><text x="180.0" y="247.0" font-size="18" fill="#252c28" text-anchor="middle">offered</text><path d="M180 275 V314" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="53" y="320" width="254" height="94" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="360.0" font-size="18" fill="#252c28" text-anchor="middle">No benefit</text><text x="180.0" y="386.0" font-size="18" fill="#252c28" text-anchor="middle">is reported</text><path d="M180 414 V453" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="53" y="459" width="254" height="94" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="499.0" font-size="18" fill="#252c28" text-anchor="middle">Failure is read</text><text x="180.0" y="525.0" font-size="18" fill="#252c28" text-anchor="middle">as ingratitude</text><path d="M53 506 H24 V228 H47" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="180" y="590" font-size="16" fill="#252c28" text-anchor="middle">Another offer;</text><text x="180" y="614" font-size="16" fill="#252c28" text-anchor="middle">the same ending</text><path d="M307 228 H335 V659 H180 V698" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="39" y="704" width="282" height="146" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="744.0" font-size="18" fill="#252c28" text-anchor="middle">Check fit, consent,</text><text x="180.0" y="770.0" font-size="18" fill="#252c28" text-anchor="middle">and constraints.</text><text x="180.0" y="796.0" font-size="18" fill="#252c28" text-anchor="middle">Revise, refer, or stop</text><text x="180.0" y="822.0" font-size="18" fill="#252c28" text-anchor="middle">by agreement.</text><text x="180" y="925" font-size="17" fill="#252c28" text-anchor="middle">Unsuccessful help alone</text><text x="180" y="952" font-size="17" fill="#252c28" text-anchor="middle">does not establish a game.</text></g></svg>