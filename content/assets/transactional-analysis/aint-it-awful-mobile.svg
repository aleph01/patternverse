<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" role="img" aria-labelledby="title desc">
  <title id="title">Pastime and game: compact comparison</title>
  <desc id="desc">Berne distinguishes complaint-based pastimes from a game in which he proposes covert gratification from misfortune. This is a historical interpretation, not a diagnosis. Ask what support is wanted, and do not infer that receiving comfort means suffering is wanted or invented.</desc>
  <rect width="360" height="900" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="22" y="39" font-size="23">Berne’s distinction:</text><text x="22" y="70" font-size="23">pastime and game</text>
    <text x="22" y="103" font-size="15" fill="#667064">Historical categories, not diagnoses.</text>
    <rect x="22" y="131" width="316" height="208" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="40" y="165" font-size="22">Pastime</text>
    <text x="40" y="202" font-size="18">Shared judgments</text><text x="40" y="232" font-size="18">Distressing stories</text><text x="40" y="262" font-size="18">Complaints about “them”</text>
    <text x="40" y="303" font-size="16">Conversation continues without</text><text x="40" y="327" font-size="16">a distinct game payoff.</text>
    <rect x="22" y="362" width="316" height="221" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="40" y="397" font-size="21">Game, in Berne’s account</text>
    <text x="40" y="434" font-size="18">Outward distress</text><text x="40" y="464" font-size="18">A covert gratification from</text><text x="40" y="494" font-size="18">misfortune is hypothesised</text>
    <text x="40" y="540" font-size="16">The proposed function cannot</text><text x="40" y="565" font-size="16">be read from distress alone.</text>
    <rect x="22" y="612" width="316" height="125" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="40" y="646" font-size="21" fill="#00855b">Ask what support is wanted</text>
    <text x="40" y="684" font-size="18">Listening, practical help,</text><text x="40" y="711" font-size="18">company, or a pause?</text>
    <text x="22" y="777" font-size="16">Receiving comfort does not establish</text><text x="22" y="802" font-size="16">that suffering is wanted or invented.</text>
    <text x="22" y="845" font-size="14" fill="#667064">An opening for clearer support,</text><text x="22" y="869" font-size="14" fill="#667064">not a treatment or a test of motives.</text>
  </g>
</svg>
