<svg xmlns="http://www.w3.org/2000/svg" width="360" height="820" viewBox="0 0 360 820" role="img" aria-labelledby="title desc">
  <title id="title">An error is found: two possible directions</title>
  <desc id="desc">From a late file, one branch leads to a personal verdict and earlier grievances. A green branch leads to specific accountability: identify impact and agree a repair or appropriate consequence. Each person remains responsible for their conduct.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker>
    <marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#00855b" stroke-width="1.2"/></marker>
  </defs>
  <rect width="360" height="820" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="22" y="40" font-size="23">An error is found.</text>
    <text x="22" y="71" font-size="23">What follows?</text>
    <text x="22" y="105" font-size="16" fill="#667064">Two possible directions.</text>
    <rect x="54" y="133" width="284" height="90" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="74" y="166" font-size="19">A specific error</text>
    <text x="74" y="198" font-size="17">The file arrived late.</text>
    <path d="M196 223 V270" stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M54 178 H22 V559 H43" stroke="#00855b" stroke-width="1.3" fill="none" marker-end="url(#green)"/>
    <rect x="54" y="283" width="284" height="176" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="74" y="316" font-size="20">The wider attack</text>
    <text x="74" y="354" font-size="17">“This proves you’re useless.”</text>
    <text x="74" y="393" font-size="16">One error becomes a verdict.</text>
    <text x="74" y="423" font-size="16">Earlier grievances join in.</text>
    <rect x="54" y="503" width="284" height="177" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="74" y="537" font-size="20" fill="#00855b">Specific accountability</text>
    <text x="74" y="575" font-size="17">“The delay cost us an hour.”</text>
    <text x="74" y="614" font-size="16">Agree a repair or consequence.</text>
    <text x="74" y="644" font-size="16">A boundary can still be firm.</text>
    <text x="22" y="725" font-size="16">Responsibility for the error and</text>
    <text x="22" y="749" font-size="16">for the response remain distinct.</text>
    <text x="22" y="784" font-size="14" fill="#667064">Possible directions, not a test of motives</text>
    <text x="22" y="805" font-size="14" fill="#667064">or a promise of cooperation.</text>
  </g>
</svg>
