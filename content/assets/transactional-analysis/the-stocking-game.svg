<svg xmlns="http://www.w3.org/2000/svg" width="760" height="565" viewBox="0 0 760 565" role="img" aria-labelledby="title desc"><title id="title">The Stocking Game: attention, interpretation, and a practical opening</title><desc id="desc">A practical issue draws attention; someone responds; the response is treated as evidence about that person’s motives. This is an interpretive hypothesis, not proof of intention. A green branch asks what help is wanted and addresses conduct without guessing motives.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">When a response becomes evidence</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">An interpretive hypothesis—not proof of intention.</text><rect x="36" y="142" width="186" height="96" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="129.0" y="183.0" font-size="18" fill="#252c28" text-anchor="middle">A practical issue</text><text x="129.0" y="209.0" font-size="18" fill="#252c28" text-anchor="middle">draws attention</text><rect x="287" y="142" width="186" height="96" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="380.0" y="183.0" font-size="18" fill="#252c28" text-anchor="middle">Someone</text><text x="380.0" y="209.0" font-size="18" fill="#252c28" text-anchor="middle">responds</text><rect x="538" y="142" width="186" height="96" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="631.0" y="183.0" font-size="18" fill="#252c28" text-anchor="middle">“That shows</text><text x="631.0" y="209.0" font-size="18" fill="#252c28" text-anchor="middle">how you think.”</text><path d="M222 190 H283" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M473 190 H534" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M380 238 V338" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="110" y="344" width="540" height="112" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="380.0" y="393.0" font-size="18" fill="#252c28" text-anchor="middle">“What help would be useful?”</text><text x="380.0" y="419.0" font-size="18" fill="#252c28" text-anchor="middle">Address conduct without guessing motives.</text><text x="380" y="512" font-size="17" fill="#252c28" text-anchor="middle">Appearance does not establish intent or consent.</text></g></svg>