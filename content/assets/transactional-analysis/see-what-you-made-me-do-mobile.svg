<svg xmlns="http://www.w3.org/2000/svg" width="360" height="810" viewBox="0 0 360 810" role="img" aria-labelledby="title desc">
  <title id="title">Two versions of the responsibility shift: compact</title>
  <desc id="desc">An interruption followed by a mistake is used to blame another person. A suggestion followed by disappointment is used to blame the adviser. Two green panels offer a direct request for quiet with responsibility for shouting, and acknowledgment of one's own decision. These are possibilities, not evidence of motives.</desc>
  <defs><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs>
  <rect width="360" height="810" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="22" y="39" font-size="23">Two versions of the</text><text x="22" y="70" font-size="23">responsibility shift</text>
    <text x="22" y="103" font-size="15" fill="#667064">Illustrations, not proof of hidden motives.</text>
    <rect x="22" y="130" width="316" height="115" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="40" y="163" font-size="18">Interruption → mistake</text>
    <text x="40" y="202" font-size="19">“You made me do it.”</text>
    <text x="40" y="228" font-size="15">Blame assigned to the other person.</text>
    <path d="M180 245 V276" fill="none" stroke="#00855b" stroke-width="1.2" marker-end="url(#green)"/>
    <rect x="22" y="289" width="316" height="114" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="40" y="320" font-size="20" fill="#00855b">State the need</text>
    <text x="40" y="354" font-size="18">“I need quiet.</text><text x="40" y="381" font-size="18">I shouldn’t have shouted.”</text>
    <rect x="22" y="443" width="316" height="115" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="40" y="476" font-size="18">Suggestion → disappointment</text>
    <text x="40" y="515" font-size="19">“You got me into this.”</text>
    <text x="40" y="541" font-size="15">Blame assigned to the adviser.</text>
    <path d="M180 558 V589" fill="none" stroke="#00855b" stroke-width="1.2" marker-end="url(#green)"/>
    <rect x="22" y="602" width="316" height="114" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="40" y="633" font-size="20" fill="#00855b">Own the decision</text>
    <text x="40" y="667" font-size="18">“You advised; I chose.</text><text x="40" y="694" font-size="18">What can we change?”</text>
    <text x="22" y="753" font-size="15">Influence, decision-making authority,</text>
    <text x="22" y="776" font-size="15">and conduct deserve separate attention.</text>
    <text x="22" y="800" font-size="14" fill="#667064">Green marks possibilities, not promises.</text>
  </g>
</svg>
