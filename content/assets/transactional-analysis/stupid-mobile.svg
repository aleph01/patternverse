<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1080" viewBox="0 0 360 1080" role="img" aria-labelledby="title desc"><title id="title">Stupid: when difficulty becomes a verdict</title><desc id="desc">Compact version: a difficulty becomes a self-insult; laughter, contempt or helplessness seems to confirm it, and the role repeats. The proposed opening is to stay specific about the difficulty and agree useful support without a verdict on ability. Errors and support needs alone are not evidence of a game.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="24" y="43" font-size="23" fill="#252c28" text-anchor="start">When difficulty becomes</text><text x="24" y="75" font-size="23" fill="#252c28" text-anchor="start">a verdict</text><text x="24" y="113" font-size="16" fill="#252c28" text-anchor="start">A possible recurring exchange;</text><text x="24" y="137" font-size="16" fill="#252c28" text-anchor="start">not an assessment of ability.</text><rect x="53" y="181" width="254" height="94" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="221.0" font-size="18" fill="#252c28" text-anchor="middle">A difficulty becomes</text><text x="180.0" y="247.0" font-size="18" fill="#252c28" text-anchor="middle">a self-insult</text><path d="M180 275 V314" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="53" y="320" width="254" height="94" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="360.0" font-size="18" fill="#252c28" text-anchor="middle">Laughter, contempt,</text><text x="180.0" y="386.0" font-size="18" fill="#252c28" text-anchor="middle">or helplessness</text><path d="M180 414 V453" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="53" y="459" width="254" height="94" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="499.0" font-size="18" fill="#252c28" text-anchor="middle">The self-label</text><text x="180.0" y="525.0" font-size="18" fill="#252c28" text-anchor="middle">seems confirmed</text><path d="M53 506 H24 V228 H47" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="180" y="596" font-size="16" fill="#252c28" text-anchor="middle">The same role is renewed</text><path d="M307 228 H335 V659 H180 V698" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="39" y="704" width="282" height="172" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="744.0" font-size="18" fill="#252c28" text-anchor="middle">Stay specific about</text><text x="180.0" y="770.0" font-size="18" fill="#252c28" text-anchor="middle">the difficulty.</text><text x="180.0" y="796.0" font-size="18" fill="#252c28" text-anchor="middle">Agree useful support</text><text x="180.0" y="822.0" font-size="18" fill="#252c28" text-anchor="middle">without a verdict</text><text x="180.0" y="848.0" font-size="18" fill="#252c28" text-anchor="middle">on ability.</text><text x="180" y="951" font-size="16" fill="#252c28" text-anchor="middle">Mistakes and support needs</text><text x="180" y="977" font-size="16" fill="#252c28" text-anchor="middle">alone do not establish a game.</text></g></svg>