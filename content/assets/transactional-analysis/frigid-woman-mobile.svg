<svg xmlns="http://www.w3.org/2000/svg" width="360" height="860" viewBox="0 0 360 860" role="img" aria-labelledby="title desc">
  <title id="title">Affection does not promise escalation: compact</title>
  <desc id="desc">Welcomed affection does not establish permission for sex. An assumption about escalation can contribute to argument and distance. A green panel offers an opening to check what is wanted: this contact only, more if both want it, or stopping. Any answer may change.</desc>
  <defs><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs>
  <rect width="360" height="860" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="22" y="39" font-size="23">Affection does not</text><text x="22" y="70" font-size="23">promise escalation</text>
    <text x="22" y="103" font-size="15" fill="#667064">One possible sequence, not proof of motives.</text>
    <rect x="54" y="131" width="284" height="77" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="74" y="163" font-size="19">Affection welcomed</text><text x="74" y="189" font-size="16">A kiss is welcome now.</text>
    <path d="M196 208 V246" fill="none" stroke="#a6aca3" stroke-width="1.2"/>
    <rect x="54" y="246" width="284" height="83" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="74" y="278" font-size="19">An assumption enters:</text><text x="74" y="308" font-size="18">“This means sex.”</text>
    <text x="54" y="366" font-size="16">Argument and distance can follow.</text>
    <path d="M54 170 H22 V493 H43" fill="none" stroke="#00855b" stroke-width="1.3" marker-end="url(#green)"/>
    <rect x="54" y="414" width="284" height="133" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="74" y="445" font-size="19" fill="#00855b">Check before changing</text><text x="74" y="471" font-size="19" fill="#00855b">the contact</text>
    <text x="74" y="506" font-size="18">“What, if anything,</text><text x="74" y="532" font-size="18">would you like next?”</text>
    <g fill="#edf5f0" stroke="#00855b" stroke-width="1"><rect x="54" y="571" width="284" height="45" rx="5"/><rect x="54" y="629" width="284" height="45" rx="5"/><rect x="54" y="687" width="284" height="45" rx="5"/></g>
    <text x="74" y="600" font-size="18">This contact only</text><text x="74" y="658" font-size="18">More, if both want it</text><text x="74" y="716" font-size="18">Stop</text>
    <text x="22" y="773" font-size="16">Each answer can change. A refusal</text><text x="22" y="798" font-size="16">requires no justification.</text>
    <text x="22" y="833" font-size="14" fill="#667064">Options, not a route to obtaining sex.</text>
  </g>
</svg>
