<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
  <title id="title">Berne's distinction: pastime and game</title>
  <desc id="desc">A comparison of Berne's historical categories. In a pastime, shared judgment, distressing stories, or complaints keep a conversation going, without a distinct payoff in his account. In the game form, he hypothesises gratification from misfortune beneath outward distress. A green opening asks what support is wanted. Receiving comfort does not establish that suffering is wanted or invented.</desc>
  <rect width="760" height="590" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="34" y="43" font-size="24">Berne’s distinction: pastime and game</text>
    <text x="34" y="74" font-size="16" fill="#667064">Historical categories to understand, not diagnoses to assign.</text>
    <g fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"><rect x="34" y="115" width="327" height="244" rx="5"/><rect x="399" y="115" width="327" height="244" rx="5"/></g>
    <text x="54" y="151" font-size="22">Pastime</text>
    <text x="54" y="191" font-size="18">Shared judgments</text><text x="54" y="223" font-size="18">Distressing stories</text><text x="54" y="255" font-size="18">Complaints about “them”</text>
    <path d="M54 278 H341" stroke="#a6aca3" stroke-width="1"/>
    <text x="54" y="309" font-size="16">Conversation continues without</text><text x="54" y="335" font-size="16">a distinct game payoff.</text>
    <text x="419" y="151" font-size="22">Game, in Berne’s account</text>
    <text x="419" y="191" font-size="18">Outward distress</text><text x="419" y="223" font-size="18">A covert gratification from</text><text x="419" y="255" font-size="18">misfortune is hypothesised</text>
    <path d="M419 278 H706" stroke="#a6aca3" stroke-width="1"/>
    <text x="419" y="309" font-size="16">The proposed function cannot</text><text x="419" y="335" font-size="16">be read from distress alone.</text>
    <rect x="34" y="401" width="692" height="104" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="54" y="437" font-size="21" fill="#00855b">Ask what support is wanted</text>
    <text x="54" y="476" font-size="19">Listening, practical help, company, or a pause?</text>
    <text x="34" y="545" font-size="16">Receiving comfort does not establish that suffering is wanted or invented.</text>
    <text x="34" y="573" font-size="14" fill="#667064">An opening for clearer support, not a treatment or a test of motives.</text>
  </g>
</svg>
