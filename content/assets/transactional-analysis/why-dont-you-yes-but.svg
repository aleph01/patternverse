<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><title id="title">Why Don't You—Yes But: interrupting the advice contest</title><desc id="desc">A problem leads to a solution and an objection. A dashed arrow returns to another solution. Advisers may eventually give up. A green branch asks what kind of help is wanted rather than continuing the contest. An objection alone does not establish a game.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">When help becomes a contest</text><text x="36" y="79" font-size="17" fill="#252c28" text-anchor="start">A possible pattern; motives remain uncertain.</text><text x="504" y="108" font-size="17" fill="#252c28" text-anchor="middle">Another solution</text><rect x="36" y="142" width="186" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="129.0" y="178.0" font-size="18" fill="#252c28" text-anchor="middle">A problem</text><text x="129.0" y="204.0" font-size="18" fill="#252c28" text-anchor="middle">is raised</text><rect x="287" y="142" width="186" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="380.0" y="178.0" font-size="18" fill="#252c28" text-anchor="middle">A solution</text><text x="380.0" y="204.0" font-size="18" fill="#252c28" text-anchor="middle">is offered</text><rect x="538" y="142" width="186" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="631.0" y="178.0" font-size="18" fill="#252c28" text-anchor="middle">A reason</text><text x="631.0" y="204.0" font-size="18" fill="#252c28" text-anchor="middle">it won’t work</text><path d="M222 185 H283" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M473 185 H534" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M631 142 V118 H380 V138" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M631 228 V354" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="647" y="290" font-size="16" fill="#252c28" text-anchor="start">Eventually</text><rect x="538" y="360" width="186" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="631.0" y="396.0" font-size="18" fill="#252c28" text-anchor="middle">Silence</text><text x="631.0" y="422.0" font-size="18" fill="#252c28" text-anchor="middle">or irritation</text><path d="M380 228 V354" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="36" y="360" width="437" height="110" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="254.5" y="408.0" font-size="18" fill="#252c28" text-anchor="middle">“What would be useful from me?”</text><text x="254.5" y="434.0" font-size="18" fill="#252c28" text-anchor="middle">Agree what help is wanted.</text><text x="255" y="499" font-size="17" fill="#00855b" text-anchor="middle">Listening · Information · A specific task</text><text x="380" y="539" font-size="17" fill="#252c28" text-anchor="middle">A real constraint changes the plan. It does not prove a game.</text></g></svg>