<svg xmlns="http://www.w3.org/2000/svg" width="800" height="630" viewBox="0 0 800 630" role="img" aria-labelledby="title desc"><title id="title">Stupid: when difficulty becomes a verdict</title><desc id="desc">An interpretive sequence: a difficulty becomes a self-insult; others respond with laughter, contempt, or helplessness; the self-label seems confirmed. A dashed return marks repetition. A green opening keeps discussion specific and agrees useful support. Mistakes and support needs alone do not establish a game or reveal someone’s ability.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">When difficulty becomes a verdict</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">A possible recurring exchange—not an assessment of ability.</text><rect x="36" y="139" width="220" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="146.0" y="186.0" font-size="18" fill="#252c28" text-anchor="middle">A difficulty becomes</text><text x="146.0" y="212.0" font-size="18" fill="#252c28" text-anchor="middle">a self-insult</text><rect x="290" y="139" width="220" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="400.0" y="186.0" font-size="18" fill="#252c28" text-anchor="middle">Laughter, contempt,</text><text x="400.0" y="212.0" font-size="18" fill="#252c28" text-anchor="middle">or helplessness</text><rect x="544" y="139" width="220" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="654.0" y="186.0" font-size="18" fill="#252c28" text-anchor="middle">The self-label</text><text x="654.0" y="212.0" font-size="18" fill="#252c28" text-anchor="middle">seems confirmed</text><path d="M256 193 H284" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M510 193 H538" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M654 247 V313 H146 V253" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="400" y="302" font-size="16" fill="#252c28" text-anchor="middle">The same role is renewed</text><path d="M36 193 H14 V448 H74" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="80" y="388" width="640" height="120" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="400.0" y="441.0" font-size="18" fill="#252c28" text-anchor="middle">Stay specific about the difficulty.</text><text x="400.0" y="467.0" font-size="18" fill="#252c28" text-anchor="middle">Agree useful support without a verdict on ability.</text><text x="400" y="565" font-size="17" fill="#252c28" text-anchor="middle">Mistakes and support needs alone</text><text x="400" y="591" font-size="17" fill="#252c28" text-anchor="middle">do not establish a game.</text></g></svg>