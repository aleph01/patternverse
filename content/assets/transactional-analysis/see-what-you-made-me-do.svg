<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
  <title id="title">Two versions of the responsibility shift</title>
  <desc id="desc">Two illustrative sequences: an interruption, a mistake, then the claim 'You made me do it'; a suggestion, a disappointing result, then 'You got me into this'. Green alternatives name a need for quiet while owning an outburst, and distinguish advice from one's own decision. Influence and responsibility require separate examination.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker></defs>
  <rect width="760" height="600" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="34" y="43" font-size="24">Two versions of the responsibility shift</text>
    <text x="34" y="74" font-size="16" fill="#667064">An illustrative sequence is not proof of a hidden motive.</text>
    <text x="135" y="120" text-anchor="middle" font-size="16">Another person’s input</text>
    <text x="380" y="120" text-anchor="middle" font-size="16">Unwelcome outcome</text>
    <text x="625" y="120" text-anchor="middle" font-size="16">Blame assigned</text>
    <g fill="#f1f2ef" stroke="#a6aca3" stroke-width="1">
      <rect x="34" y="142" width="202" height="83" rx="5"/><rect x="279" y="142" width="202" height="83" rx="5"/><rect x="524" y="142" width="202" height="83" rx="5"/>
      <rect x="34" y="251" width="202" height="83" rx="5"/><rect x="279" y="251" width="202" height="83" rx="5"/><rect x="524" y="251" width="202" height="83" rx="5"/>
    </g>
    <g fill="none" stroke="#a6aca3" stroke-width="1.2" marker-end="url(#arrow)"><path d="M237 184 H269"/><path d="M482 184 H514"/><path d="M237 293 H269"/><path d="M482 293 H514"/></g>
    <text x="135" y="190" text-anchor="middle" font-size="18">An interruption</text>
    <text x="380" y="190" text-anchor="middle" font-size="18">A mistake</text>
    <text x="625" y="180" text-anchor="middle" font-size="17">“You made</text><text x="625" y="204" text-anchor="middle" font-size="17">me do it.”</text>
    <text x="135" y="299" text-anchor="middle" font-size="18">A suggestion</text>
    <text x="380" y="299" text-anchor="middle" font-size="18">A disappointing result</text>
    <text x="625" y="289" text-anchor="middle" font-size="17">“You got me</text><text x="625" y="313" text-anchor="middle" font-size="17">into this.”</text>
    <text x="34" y="380" font-size="17" fill="#00855b">Possible openings</text>
    <g fill="#edf5f0" stroke="#00855b" stroke-width="1"><rect x="34" y="398" width="327" height="127" rx="5"/><rect x="399" y="398" width="327" height="127" rx="5"/></g>
    <text x="54" y="430" font-size="20" fill="#00855b">State the need</text>
    <text x="54" y="465" font-size="18">“I need quiet.</text><text x="54" y="492" font-size="18">I shouldn’t have shouted.”</text>
    <text x="419" y="430" font-size="20" fill="#00855b">Own the decision</text>
    <text x="419" y="465" font-size="18">“You advised; I chose.</text><text x="419" y="492" font-size="18">What can we change?”</text>
    <text x="34" y="566" font-size="16">Influence, decision-making authority, and conduct deserve separate attention.</text>
  </g>
</svg>
