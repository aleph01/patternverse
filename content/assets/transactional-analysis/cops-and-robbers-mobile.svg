<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1010" viewBox="0 0 360 1010" role="img" aria-labelledby="title desc"><title id="title">Cops and Robbers: the chase and the hypothesised ending</title><desc id="desc">Compact version. Rule-breaking leads to concealment and challenge, then discovery or confrontation. A dashed return shows possible repetition. Berne hypothesises that capture helps complete the pattern, but discovery alone cannot establish this. The green alternative addresses harm, fair procedures, and needs directly.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="25" y="42" font-size="22" fill="#252c28" text-anchor="start">When the chase becomes</text><text x="25" y="73" font-size="22" fill="#252c28" text-anchor="start">part of the reward</text><text x="25" y="113" font-size="16" fill="#252c28" text-anchor="start">Berne’s hypothesis includes</text><text x="25" y="136" font-size="16" fill="#252c28" text-anchor="start">the ending: being caught.</text><rect x="63" y="178" width="262" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="221.0" font-size="18" fill="#252c28" text-anchor="middle">A rule is broken</text><path d="M194 252 V286" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="63" y="292" width="262" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="328.0" font-size="18" fill="#252c28" text-anchor="middle">Concealment</text><text x="194.0" y="354.0" font-size="18" fill="#252c28" text-anchor="middle">and challenge</text><path d="M194 378 V412" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="63" y="418" width="262" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="454.0" font-size="18" fill="#252c28" text-anchor="middle">Discovery or</text><text x="194.0" y="480.0" font-size="18" fill="#252c28" text-anchor="middle">confrontation</text><path d="M63 461 H28 V215 H59" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="63" y="545" font-size="17" fill="#252c28" text-anchor="start">A familiar ending may</text><text x="63" y="570" font-size="17" fill="#252c28" text-anchor="start">sustain repetition.</text><path d="M325 335 H343 V627 H194 V662" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="40" y="668" width="280" height="118" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="707.0" font-size="18" fill="#252c28" text-anchor="middle">Address harm.</text><text x="180.0" y="733.0" font-size="18" fill="#252c28" text-anchor="middle">Use fair procedures.</text><text x="180.0" y="759.0" font-size="18" fill="#252c28" text-anchor="middle">Explore needs directly.</text><text x="180" y="856" font-size="16" fill="#252c28" text-anchor="middle">Discovery alone does not show</text><text x="180" y="882" font-size="16" fill="#252c28" text-anchor="middle">a wish to be caught.</text></g></svg>