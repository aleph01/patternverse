<svg xmlns="http://www.w3.org/2000/svg" width="360" height="810" viewBox="0 0 360 810" role="img" aria-labelledby="title desc">
  <title id="title">A choice can stand; repair can still happen: compact</title>
  <desc id="desc">The statement 'Go without me' follows a hurtful exchange. One branch uses the words to blame the other person for everything. A green alternative respects the answer while apologising for snapping. A changed answer is not required.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker>
    <marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#00855b" stroke-width="1.2"/></marker>
  </defs>
  <rect width="360" height="810" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="22" y="39" font-size="23">A choice can stand.</text><text x="22" y="70" font-size="23">Repair can still happen.</text>
    <text x="22" y="104" font-size="15" fill="#667064">An illustration, not a test of intentions.</text>
    <rect x="54" y="132" width="284" height="91" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="74" y="166" font-size="17">After a hurtful exchange:</text><text x="74" y="199" font-size="20">“Go without me.”</text>
    <path d="M196 223 V267" stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M54 178 H22 V569 H43" stroke="#00855b" stroke-width="1.3" fill="none" marker-end="url(#green)"/>
    <rect x="54" y="280" width="284" height="173" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="74" y="312" font-size="19">Words become a verdict</text>
    <text x="74" y="350" font-size="18">“You said it. All your fault.”</text>
    <text x="74" y="389" font-size="16">The earlier hurt disappears</text><text x="74" y="415" font-size="16">from the account.</text>
    <rect x="54" y="496" width="284" height="180" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="74" y="527" font-size="19" fill="#00855b">Respect the choice;</text><text x="74" y="552" font-size="19" fill="#00855b">own a part</text>
    <text x="74" y="589" font-size="18">“I’ll respect your choice.</text><text x="74" y="617" font-size="18">I’m sorry I snapped.”</text>
    <text x="74" y="650" font-size="15">No changed answer is required.</text>
    <text x="22" y="716" font-size="16">Accepting a refusal is not, by itself,</text><text x="22" y="741" font-size="16">evidence of a game.</text>
    <text x="22" y="777" font-size="14" fill="#667064">An opening for clearer contact,</text><text x="22" y="799" font-size="14" fill="#667064">not guaranteed reconciliation.</text>
  </g>
</svg>
