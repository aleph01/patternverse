<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1040" viewBox="0 0 360 1040" role="img" aria-labelledby="title desc"><title id="title">Let's You and Him Fight: the contest and the separate choice</title><desc id="desc">Compact layout: a person encourages rivalry between two others, while choosing another person or outcome elsewhere. Either rival can decline the contest. Roles do not establish motive, gender, or equal responsibility.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="25" y="42" font-size="23" fill="#252c28" text-anchor="start">A contest that does not</text><text x="25" y="72" font-size="23" fill="#252c28" text-anchor="start">decide the outcome</text><text x="25" y="111" font-size="16" fill="#252c28" text-anchor="start">Berne’s game version;</text><text x="25" y="134" font-size="16" fill="#252c28" text-anchor="start">one possible opening for change.</text><rect x="49" y="178" width="262" height="82" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="212.0" font-size="18" fill="#252c28" text-anchor="middle">Person encouraging</text><text x="180.0" y="238.0" font-size="18" fill="#252c28" text-anchor="middle">rivalry</text><path d="M180 260 V299" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="198" y="288" font-size="14" fill="#252c28" text-anchor="start">Chooses elsewhere</text><rect x="49" y="305" width="262" height="80" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="338.0" font-size="18" fill="#252c28" text-anchor="middle">Another person</text><text x="180.0" y="364.0" font-size="18" fill="#252c28" text-anchor="middle">or outcome</text><path d="M49 215 H25 V491 H49" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M311 215 H335 V491 H312" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="49" y="452" width="119" height="78" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="108.5" y="497.0" font-size="18" fill="#252c28" text-anchor="middle">Rival 1</text><rect x="193" y="452" width="119" height="78" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="252.5" y="497.0" font-size="18" fill="#252c28" text-anchor="middle">Rival 2</text><path d="M168 480 H189" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M193 500 H172" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="180" y="563" font-size="17" fill="#252c28" text-anchor="middle">A conflict between rivals</text><path d="M108 530 V540 H25 V625 H180 V655" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="39" y="662" width="282" height="112" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="698.0" font-size="18" fill="#252c28" text-anchor="middle">“I won’t compete for this.”</text><text x="180.0" y="724.0" font-size="18" fill="#252c28" text-anchor="middle">Clarify choices</text><text x="180.0" y="750.0" font-size="18" fill="#252c28" text-anchor="middle">without a contest.</text><text x="180" y="817" font-size="18" fill="#00855b" text-anchor="middle">Either rival can decline.</text><text x="180" y="889" font-size="16" fill="#252c28" text-anchor="middle">Roles do not establish gender,</text><text x="180" y="914" font-size="16" fill="#252c28" text-anchor="middle">motives, or equal responsibility.</text><text x="180" y="987" font-size="15" fill="#252c28" text-anchor="middle">An interpretation, not proof of intent.</text></g></svg>