<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1040" viewBox="0 0 360 1040" role="img" aria-labelledby="title desc"><title id="title">Uproar: obtaining distance through conflict</title><desc id="desc">Compact version: a complaint becomes attack and counterattack, ending in retreat and distance. A dashed return indicates possible repetition with the difficult issue unspoken. A green alternative requests space directly; any return is conditional on safety.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="25" y="42" font-size="23" fill="#252c28" text-anchor="start">When a quarrel makes</text><text x="25" y="73" font-size="23" fill="#252c28" text-anchor="start">distance possible</text><text x="25" y="113" font-size="16" fill="#252c28" text-anchor="start">A possible function;</text><text x="25" y="136" font-size="16" fill="#252c28" text-anchor="start">motives remain uncertain.</text><rect x="63" y="178" width="262" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="221.0" font-size="18" fill="#252c28" text-anchor="middle">A small complaint</text><path d="M194 252 V286" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="63" y="292" width="262" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="328.0" font-size="18" fill="#252c28" text-anchor="middle">Attack and</text><text x="194.0" y="354.0" font-size="18" fill="#252c28" text-anchor="middle">counterattack</text><path d="M194 378 V412" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="63" y="418" width="262" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="467.0" font-size="18" fill="#252c28" text-anchor="middle">Retreat and distance</text><path d="M63 461 H28 V215 H59" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="63" y="545" font-size="17" fill="#252c28" text-anchor="start">The difficult issue</text><text x="63" y="570" font-size="17" fill="#252c28" text-anchor="start">remains unspoken.</text><path d="M325 335 H343 V627 H194 V662" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="40" y="668" width="280" height="110" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="703.0" font-size="18" fill="#252c28" text-anchor="middle">“I need some space.”</text><text x="180.0" y="729.0" font-size="18" fill="#252c28" text-anchor="middle">Make room without</text><text x="180.0" y="755.0" font-size="18" fill="#252c28" text-anchor="middle">an argument.</text><text x="180" y="833" font-size="17" fill="#252c28" text-anchor="middle">A safe pause can include</text><text x="180" y="859" font-size="17" fill="#252c28" text-anchor="middle">a plan to return.</text><text x="180" y="972" font-size="15" fill="#252c28" text-anchor="middle">Leaving danger is a different situation.</text></g></svg>