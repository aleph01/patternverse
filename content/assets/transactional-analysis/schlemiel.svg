<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" role="img" aria-labelledby="title desc"><title id="title">Schlemiel: apology and the unfinished repair</title><desc id="desc">A possible repeating sequence: damage, apology, then immediate absolution while impact remains unaddressed. A green branch from the apology keeps repair and boundaries open. Repeated accidents alone do not establish a game.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">When “sorry” is expected to settle everything</text><text x="36" y="79" font-size="17" fill="#252c28" text-anchor="start">One possible interaction — not a test of someone’s motives.</text><rect x="36" y="142" width="180" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="126.0" y="178.0" font-size="18" fill="#252c28" text-anchor="middle">Something</text><text x="126.0" y="204.0" font-size="18" fill="#252c28" text-anchor="middle">is damaged</text><rect x="290" y="142" width="180" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="380.0" y="178.0" font-size="18" fill="#252c28" text-anchor="middle">An apology</text><text x="380.0" y="204.0" font-size="18" fill="#252c28" text-anchor="middle">is offered</text><rect x="544" y="142" width="180" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="634.0" y="178.0" font-size="18" fill="#252c28" text-anchor="middle">“It’s fine.”</text><text x="634.0" y="204.0" font-size="18" fill="#252c28" text-anchor="middle">Immediate reset</text><path d="M216 185 H286" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M470 185 H540" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M634 142 V118 H126 V138" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="380" y="108" font-size="17" fill="#252c28" text-anchor="middle">Impact unaddressed; conditions unchanged</text><path d="M380 228 V348" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="174" y="353" width="412" height="112" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="380.0" y="402.0" font-size="18" fill="#252c28" text-anchor="middle">“I hear your apology.”</text><text x="380.0" y="428.0" font-size="18" fill="#252c28" text-anchor="middle">“We still need to address the damage.”</text><text x="380" y="493" font-size="18" fill="#00855b" text-anchor="middle">Assess impact · Discuss repair · Set a boundary</text><text x="380" y="539" font-size="17" fill="#252c28" text-anchor="middle">Forgiveness and future access remain separate decisions.</text></g></svg>