<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1190" viewBox="0 0 360 1190" role="img" aria-labelledby="title desc"><title id="title">Peasant: admiration, recognition, and room for honest feedback</title><desc id="desc">Compact comparison of Berne’s interpretations. Admiration and special recognition may sustain attachment to an expert, or may precede making the expert look foolish. An alternative invites appreciation alongside disagreement and review of results. These are historical interpretations, not tests of motives.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="24" y="43" font-size="23" fill="#252c28" text-anchor="start">Admiration needs room</text><text x="24" y="75" font-size="23" fill="#252c28" text-anchor="start">for honest feedback</text><text x="24" y="115" font-size="16" fill="#252c28" text-anchor="start">Two historical interpretations;</text><text x="24" y="139" font-size="16" fill="#252c28" text-anchor="start">not a test for hidden motives.</text><rect x="53" y="184" width="254" height="104" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="229.0" font-size="18" fill="#252c28" text-anchor="middle">Admiration meets</text><text x="180.0" y="255.0" font-size="18" fill="#252c28" text-anchor="middle">special recognition</text><text x="180" y="342" font-size="14" fill="#252c28" text-anchor="middle">BERNE: “INNOCENT”</text><rect x="39" y="362" width="282" height="110" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="410.0" font-size="18" fill="#252c28" text-anchor="middle">Faith in the expert</text><text x="180.0" y="436.0" font-size="18" fill="#252c28" text-anchor="middle">sustains the relationship</text><text x="180" y="527" font-size="14" fill="#252c28" text-anchor="middle">BERNE: “DISSEMBLED”</text><rect x="39" y="547" width="282" height="110" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="595.0" font-size="18" fill="#252c28" text-anchor="middle">Admiration precedes</text><text x="180.0" y="621.0" font-size="18" fill="#252c28" text-anchor="middle">discrediting the expert</text><path d="M307 236 H338 V736 H180 V783" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="39" y="789" width="282" height="146" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="829.0" font-size="18" fill="#252c28" text-anchor="middle">Welcome appreciation.</text><text x="180.0" y="855.0" font-size="18" fill="#252c28" text-anchor="middle">Make room for</text><text x="180.0" y="881.0" font-size="18" fill="#252c28" text-anchor="middle">disagreement</text><text x="180.0" y="907.0" font-size="18" fill="#252c28" text-anchor="middle">and results.</text><text x="180" y="1010" font-size="16" fill="#252c28" text-anchor="middle">Praise or a complaint alone</text><text x="180" y="1036" font-size="16" fill="#252c28" text-anchor="middle">proves neither interpretation.</text></g></svg>