<svg xmlns="http://www.w3.org/2000/svg" width="760" height="635" viewBox="0 0 760 635" role="img" aria-labelledby="title desc"><title id="title">Let’s Pull a Fast One on Joey: the reversal of the apparent alliance</title><desc id="desc">In the apparent arrangement, you and a recruiter are partners targeting Joey. In the reversal, the recruiter’s scheme targets you. A green branch proposes pausing before joining the apparent alliance, verifying the deal, and rejecting deception. This is one scam structure, not an explanation of all fraud.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">From apparent partner to actual target</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">Berne’s central switch in Let’s Pull a Fast One on Joey.</text><text x="36" y="124" font-size="18" fill="#252c28" text-anchor="start">Apparent arrangement</text><rect x="36" y="145" width="285" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="178.5" y="181.0" font-size="18" fill="#252c28" text-anchor="middle">You + recruiter</text><text x="178.5" y="207.0" font-size="18" fill="#252c28" text-anchor="middle">apparent partners</text><rect x="439" y="145" width="285" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="581.5" y="181.0" font-size="18" fill="#252c28" text-anchor="middle">Joey</text><text x="581.5" y="207.0" font-size="18" fill="#252c28" text-anchor="middle">supposed target</text><path d="M321 188 H435" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="380" y="173" font-size="16" fill="#252c28" text-anchor="middle">target</text><text x="36" y="286" font-size="18" fill="#252c28" text-anchor="start">The reversal</text><rect x="36" y="307" width="285" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="178.5" y="356.0" font-size="18" fill="#252c28" text-anchor="middle">Recruiter’s scheme</text><rect x="439" y="307" width="285" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="581.5" y="343.0" font-size="18" fill="#252c28" text-anchor="middle">You</text><text x="581.5" y="369.0" font-size="18" fill="#252c28" text-anchor="middle">actual target</text><path d="M321 350 H435" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="380" y="335" font-size="16" fill="#252c28" text-anchor="middle">targets</text><path d="M36 188 H16 V430 H380 V449" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="125" y="455" width="510" height="100" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="380.0" y="498.0" font-size="18" fill="#252c28" text-anchor="middle">Pause before joining the “we”.</text><text x="380.0" y="524.0" font-size="18" fill="#252c28" text-anchor="middle">Verify the deal; reject deception.</text><text x="380" y="602" font-size="17" fill="#252c28" text-anchor="middle">This structure does not describe every scam.</text></g></svg>