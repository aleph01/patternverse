<svg xmlns="http://www.w3.org/2000/svg" width="800" height="670" viewBox="0 0 800 670" role="img" aria-labelledby="title desc"><title id="title">Homely Sage: useful help has a scope</title><desc id="desc">An original Patternverse adaptation: listen and clarify what help is wanted. Offer help within current competence or acknowledge a limit and help find the right person. The person asking retains the choice; neither route guarantees a solution.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="40" y="48" font-size="26" fill="#252c28" text-anchor="start">Useful help has a scope</text><text x="40" y="80" font-size="18" fill="#252c28" text-anchor="start">An approachable person need not have every answer.</text><rect x="240" y="121" width="320" height="75" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="400.0" y="164.5" font-size="18" fill="#252c28" text-anchor="middle">Listen before advising</text><path d="M400 196 V225" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="200" y="231" width="400" height="82" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="400.0" y="278.0" font-size="18" fill="#252c28" text-anchor="middle">“What would be useful to you?”</text><path d="M295 313 V348 H205 V382" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M505 313 V348 H595 V382" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="50" y="388" width="310" height="115" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="205.0" y="438.5" font-size="18" fill="#252c28" text-anchor="middle">Within current competence</text><text x="205.0" y="464.5" font-size="18" fill="#252c28" text-anchor="middle">Offer specific, limited help.</text><rect x="440" y="388" width="310" height="115" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="595.0" y="425.5" font-size="18" fill="#252c28" text-anchor="middle">Beyond current competence</text><text x="595.0" y="451.5" font-size="18" fill="#252c28" text-anchor="middle">Name the limit;</text><text x="595.0" y="477.5" font-size="18" fill="#252c28" text-anchor="middle">help find the right person.</text><text x="400" y="556" font-size="19" fill="#00855b" text-anchor="middle">Either offer may be declined.</text><text x="400" y="611" font-size="17" fill="#252c28" text-anchor="middle">Listening, practical help and referral are different contributions.</text></g></svg>