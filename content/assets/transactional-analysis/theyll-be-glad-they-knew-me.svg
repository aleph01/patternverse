<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc"><title id="title">They will be glad: achievement and hoped-for recognition</title><desc id="desc">A comparison of two possible priorities behind an achievement. If the work matters most, supporters feeling pleased is an additional satisfaction. In Berne’s game distinction, making former supporters glad is the primary aim. Green highlights that hoped-for appreciative relationship, not a guaranteed reaction. Motives cannot be inferred from success alone.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="40" y="48" font-size="26" fill="#252c28" text-anchor="start">Achievement—and who it is for</text><text x="40" y="82" font-size="17" fill="#252c28" text-anchor="start">Berne’s distinction concerns the relative importance of two aims.</text><rect x="200" y="124" width="400" height="90" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="400.0" y="162.0" font-size="18" fill="#252c28" text-anchor="middle">An achievement</text><text x="400.0" y="188.0" font-size="18" fill="#252c28" text-anchor="middle">pursued by honorable means</text><path d="M300 214 V253 H210 V293" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M500 214 V253 H590 V293" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="45" y="299" width="330" height="130" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="210.0" y="344.0" font-size="18" fill="#252c28" text-anchor="middle">The work matters most.</text><text x="210.0" y="370.0" font-size="18" fill="#252c28" text-anchor="middle">Supporters’ pleasure</text><text x="210.0" y="396.0" font-size="18" fill="#252c28" text-anchor="middle">is an additional satisfaction.</text><rect x="425" y="299" width="330" height="130" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="590.0" y="344.0" font-size="18" fill="#252c28" text-anchor="middle">Making supporters glad</text><text x="590.0" y="370.0" font-size="18" fill="#252c28" text-anchor="middle">matters most.</text><text x="590.0" y="396.0" font-size="18" fill="#252c28" text-anchor="middle">“Their kindness was justified.”</text><text x="210" y="470" font-size="18" fill="#252c28" text-anchor="middle">Secondary satisfaction</text><text x="590" y="470" font-size="18" fill="#00855b" text-anchor="middle">The game distinction</text><text x="400" y="550" font-size="17" fill="#252c28" text-anchor="middle">Green marks a hoped-for relationship, not a promised response.</text><text x="400" y="602" font-size="18" fill="#252c28" text-anchor="middle">Success alone does not reveal someone’s motives.</text></g></svg>