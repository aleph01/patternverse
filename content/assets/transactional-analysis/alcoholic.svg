<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img" aria-labelledby="title desc">
<title id="title">Care, support, and separate responsibilities</title>
<desc id="desc">Two columns distinguish the person experiencing alcohol use disorder from family or supporters. Each has choices and access to support. A green connection marks help they may agree on. Safety and autonomy apply throughout. The drawing does not explain the cause of alcohol use disorder or promise recovery.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:400;font-size:17px;fill:#252c28}.heading{font-size:19px}.small{font-size:15px}.muted{fill:#69716b}.line{fill:none;stroke:#a6aca3;stroke-width:1.5}.green{fill:none;stroke:#00855b;stroke-width:1.5}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}</style>
<rect width="720" height="490" fill="#fff"/>
<rect x="24" y="30" width="324" height="188" class="context"/>
<text x="46" y="67" class="heading">Person experiencing AUD</text>
<path d="M46 87H326" class="line"/>
<text x="46" y="122">Describe what is happening</text>
<text x="46" y="156">Discuss choices about care</text>
<text x="46" y="190">Own specific actions</text>
<rect x="372" y="30" width="324" height="188" class="context"/>
<text x="394" y="67" class="heading">Family or supporters</text>
<path d="M394 87H674" class="line"/>
<text x="394" y="122">State concerns and limits</text>
<text x="394" y="156">Choose what help to offer</text>
<text x="394" y="190">Attend to their own needs</text>
<path d="M186 231V316" class="green" marker-end="url(#arrow)"/>
<path d="M534 231V316" class="green" marker-end="url(#arrow)"/>
<path d="M186 258H534" class="green" stroke-dasharray="4 4"/>
<rect x="266" y="239" width="188" height="38" fill="#edf5f0" stroke="#00855b" stroke-width="1.5"/>
<text x="360" y="263" text-anchor="middle" class="small">Help they may agree on</text>
<rect x="24" y="331" width="324" height="81" fill="#fff" stroke="#a6aca3"/>
<text x="186" y="364" text-anchor="middle">Alcohol assessment</text>
<text x="186" y="390" text-anchor="middle">and treatment</text>
<rect x="372" y="331" width="324" height="81" fill="#fff" stroke="#a6aca3"/>
<text x="534" y="364" text-anchor="middle">Support and</text>
<text x="534" y="390" text-anchor="middle">safety planning</text>
<path d="M24 444H696" class="green"/>
<text x="360" y="472" text-anchor="middle" class="small muted">Safety and autonomy apply throughout. Joint discussion is optional.</text>
</svg>
