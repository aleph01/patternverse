<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1040" viewBox="0 0 360 1040" role="img" aria-labelledby="title desc"><title id="title">Cavalier: two kinds of appreciation, freely shared</title><desc id="desc">Compact version: a quality is praised with some artistry. The recipient may enjoy both the praise and the phrasing. If welcome, appreciation can go both ways; either person can finish and no response or return compliment is owed. This is an interpretation, not a test of intent.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="24" y="43" font-size="24" fill="#252c28" text-anchor="start">Two kinds</text><text x="24" y="75" font-size="24" fill="#252c28" text-anchor="start">of appreciation</text><text x="24" y="115" font-size="16" fill="#252c28" text-anchor="start">Appreciating a person</text><text x="24" y="139" font-size="16" fill="#252c28" text-anchor="start">and a way with words.</text><rect x="39" y="190" width="282" height="116" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="241.0" font-size="18" fill="#252c28" text-anchor="middle">A quality is praised</text><text x="180.0" y="267.0" font-size="18" fill="#252c28" text-anchor="middle">with some artistry.</text><path d="M180 306 V370" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="39" y="376" width="282" height="142" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="427.0" font-size="18" fill="#252c28" text-anchor="middle">The recipient may enjoy</text><text x="180.0" y="453.0" font-size="18" fill="#252c28" text-anchor="middle">both the praise</text><text x="180.0" y="479.0" font-size="18" fill="#252c28" text-anchor="middle">and the phrasing.</text><path d="M180 518 V582" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="39" y="588" width="282" height="172" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="641.0" font-size="18" fill="#252c28" text-anchor="middle">If welcome, appreciation</text><text x="180.0" y="667.0" font-size="18" fill="#252c28" text-anchor="middle">can go both ways.</text><text x="180.0" y="693.0" font-size="18" fill="#252c28" text-anchor="middle">Either may finish;</text><text x="180.0" y="719.0" font-size="18" fill="#252c28" text-anchor="middle">no response is owed.</text><text x="180" y="835" font-size="16" fill="#252c28" text-anchor="middle">No return compliment is owed.</text><text x="180" y="913" font-size="16" fill="#252c28" text-anchor="middle">An interpretation;</text><text x="180" y="939" font-size="16" fill="#252c28" text-anchor="middle">not a test of intent.</text></g></svg>