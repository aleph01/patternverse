<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1160" viewBox="0 0 360 1160" role="img" aria-labelledby="title desc"><title id="title">Happy to Help: contribution, purpose, and terms</title><desc id="desc">Compact version with three separate questions: what actually helps, what else the helper might want, and what is expected in return. A shared opening is to acknowledge the benefit, agree terms and preserve the right to decline. Motives may remain uncertain; appreciation creates no unagreed obligation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="24" y="43" font-size="23" fill="#252c28" text-anchor="start">Useful help can carry</text><text x="24" y="75" font-size="23" fill="#252c28" text-anchor="start">another purpose</text><text x="24" y="115" font-size="16" fill="#252c28" text-anchor="start">Three questions;</text><text x="24" y="139" font-size="16" fill="#252c28" text-anchor="start">no verdict about motives.</text><rect x="39" y="184" width="282" height="100" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="227.0" font-size="18" fill="#252c28" text-anchor="middle">Benefit</text><text x="180.0" y="253.0" font-size="18" fill="#252c28" text-anchor="middle">What actually helps?</text><rect x="39" y="310" width="282" height="126" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="353.0" font-size="18" fill="#252c28" text-anchor="middle">Aims</text><text x="180.0" y="379.0" font-size="18" fill="#252c28" text-anchor="middle">What else might</text><text x="180.0" y="405.0" font-size="18" fill="#252c28" text-anchor="middle">the helper want?</text><rect x="39" y="462" width="282" height="126" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="518.0" font-size="18" fill="#252c28" text-anchor="middle">Terms</text><text x="180.0" y="544.0" font-size="18" fill="#252c28" text-anchor="middle">What is expected in return?</text><path d="M321 234 H339 V632 H180 M321 373 H339 M321 525 H339" fill="none" stroke="#a6aca3" stroke-width="1.4"/><path d="M180 632 V674" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="39" y="680" width="282" height="172" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="733.0" font-size="18" fill="#252c28" text-anchor="middle">Acknowledge the benefit.</text><text x="180.0" y="759.0" font-size="18" fill="#252c28" text-anchor="middle">Agree the terms;</text><text x="180.0" y="785.0" font-size="18" fill="#252c28" text-anchor="middle">preserve the right</text><text x="180.0" y="811.0" font-size="18" fill="#252c28" text-anchor="middle">to decline.</text><text x="180" y="925" font-size="16" fill="#252c28" text-anchor="middle">Motives may remain uncertain.</text><text x="180" y="990" font-size="16" fill="#252c28" text-anchor="middle">Appreciation does not establish</text><text x="180" y="1016" font-size="16" fill="#252c28" text-anchor="middle">an unagreed obligation.</text></g></svg>