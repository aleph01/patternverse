<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">When one detail becomes a verdict</title>
  <desc id="desc">A possible sequence moves from searching for a disqualifying fault, to finding a gap in someone's film knowledge, to dismissing the whole person. A green opening asks what the detail is relevant to and keeps the conclusion within the evidence. Specific risks can justify firm limits without a verdict on human worth.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker>
    <marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#00855b" stroke-width="1.2"/></marker>
  </defs>
  <rect width="760" height="560" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="34" y="43" font-size="24">When one detail becomes a verdict</text>
    <text x="34" y="74" font-size="16" fill="#667064">An illustrative sequence. Motives remain hypotheses.</text>
    <g fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"><rect x="34" y="120" width="202" height="127" rx="5"/><rect x="279" y="120" width="202" height="127" rx="5"/><rect x="524" y="120" width="202" height="127" rx="5"/></g>
    <g stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"><path d="M237 184 H269"/><path d="M482 184 H514"/></g>
    <text x="135" y="155" text-anchor="middle" font-size="20">Search</text><text x="135" y="192" text-anchor="middle" font-size="17">“Something must</text><text x="135" y="218" text-anchor="middle" font-size="17">be wrong.”</text>
    <text x="380" y="155" text-anchor="middle" font-size="20">Find a detail</text><text x="380" y="192" text-anchor="middle" font-size="17">“Hasn’t seen</text><text x="380" y="218" text-anchor="middle" font-size="17">that film.”</text>
    <text x="625" y="155" text-anchor="middle" font-size="20">Dismiss</text><text x="625" y="205" text-anchor="middle" font-size="17">“Nothing to offer.”</text>
    <path d="M380 247 V307" stroke="#00855b" stroke-width="1.3" fill="none" marker-end="url(#green)"/>
    <rect x="34" y="321" width="692" height="127" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="54" y="356" font-size="21" fill="#00855b">Check relevance and scope</text>
    <text x="54" y="392" font-size="19">“What is this detail relevant to?”</text>
    <text x="54" y="425" font-size="17">Keep the conclusion within the evidence.</text>
    <text x="34" y="492" font-size="16">Specific risks can justify specific limits.</text>
    <text x="34" y="522" font-size="16">A boundary does not require a verdict on someone’s worth.</text>
    <text x="34" y="548" font-size="14" fill="#667064">A possible opening, not an obligation to trust or continue contact.</text>
  </g>
</svg>
