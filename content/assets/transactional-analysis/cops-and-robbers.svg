<svg xmlns="http://www.w3.org/2000/svg" width="760" height="575" viewBox="0 0 760 575" role="img" aria-labelledby="title desc"><title id="title">Cops and Robbers: the chase and the hypothesised ending</title><desc id="desc">Rule-breaking is followed by concealment and challenge, then discovery or confrontation. A dashed return marks possible repetition. In Berne’s hypothesis, discovery helps complete the pattern. A green opening directs attention to harm, fair procedures, and direct needs. Discovery alone does not establish a wish to be caught.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">When the chase becomes part of the reward</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">Berne’s hypothesis includes the ending: being caught.</text><text x="380" y="108" font-size="17" fill="#252c28" text-anchor="middle">A familiar ending may sustain repetition</text><rect x="36" y="142" width="186" height="90" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="129.0" y="180.0" font-size="18" fill="#252c28" text-anchor="middle">A rule</text><text x="129.0" y="206.0" font-size="18" fill="#252c28" text-anchor="middle">is broken</text><rect x="287" y="142" width="186" height="90" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="380.0" y="180.0" font-size="18" fill="#252c28" text-anchor="middle">Concealment</text><text x="380.0" y="206.0" font-size="18" fill="#252c28" text-anchor="middle">and challenge</text><rect x="538" y="142" width="186" height="90" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="631.0" y="180.0" font-size="18" fill="#252c28" text-anchor="middle">Discovery or</text><text x="631.0" y="206.0" font-size="18" fill="#252c28" text-anchor="middle">confrontation</text><path d="M222 187 H283" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M473 187 H534" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M631 142 V118 H129 V138" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M380 232 V354" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="110" y="360" width="540" height="112" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="380.0" y="409.0" font-size="18" fill="#252c28" text-anchor="middle">Address harm. Use fair procedures.</text><text x="380.0" y="435.0" font-size="18" fill="#252c28" text-anchor="middle">Explore needs without a contest.</text><text x="380" y="533" font-size="17" fill="#252c28" text-anchor="middle">Discovery alone does not show a wish to be caught.</text></g></svg>