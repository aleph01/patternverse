<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1040" viewBox="0 0 360 1040" role="img" aria-labelledby="title desc"><title id="title">Let’s Pull a Fast One on Joey: the reversal of the apparent alliance</title><desc id="desc">Compact layout. Apparent partners—you and the recruiter—target Joey. In the actual arrangement, the recruiter’s scheme targets you. A green opening asks you to pause before joining the alliance, verify, and reject deception. The pattern does not describe all scams.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="25" y="42" font-size="23" fill="#252c28" text-anchor="start">From apparent partner</text><text x="25" y="73" font-size="23" fill="#252c28" text-anchor="start">to actual target</text><text x="25" y="130" font-size="18" fill="#252c28" text-anchor="start">Apparent arrangement</text><rect x="40" y="158" width="280" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="194.0" font-size="18" fill="#252c28" text-anchor="middle">You + recruiter</text><text x="180.0" y="220.0" font-size="18" fill="#252c28" text-anchor="middle">apparent partners</text><path d="M180 244 V278" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="40" y="284" width="280" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="327.0" font-size="18" fill="#252c28" text-anchor="middle">Joey: supposed target</text><text x="25" y="418" font-size="18" fill="#252c28" text-anchor="start">The reversal</text><rect x="40" y="446" width="280" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="489.0" font-size="18" fill="#252c28" text-anchor="middle">Recruiter’s scheme</text><path d="M180 520 V554" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="40" y="560" width="280" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="603.0" font-size="18" fill="#252c28" text-anchor="middle">You: actual target</text><path d="M320 201 H340 V689 H180 V722" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="40" y="728" width="280" height="118" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="767.0" font-size="18" fill="#252c28" text-anchor="middle">Pause before joining</text><text x="180.0" y="793.0" font-size="18" fill="#252c28" text-anchor="middle">the “we”.</text><text x="180.0" y="819.0" font-size="18" fill="#252c28" text-anchor="middle">Verify; reject deception.</text><text x="180" y="930" font-size="17" fill="#252c28" text-anchor="middle">This structure does not</text><text x="180" y="956" font-size="17" fill="#252c28" text-anchor="middle">describe every scam.</text></g></svg>