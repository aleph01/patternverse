<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
  <title id="title">One remark, three different parts</title>
  <desc id="desc">A partly true anecdote, 'You went to the wrong station,' is followed by a demeaning judgment, 'You need supervising,' and an affectionate request for agreement, 'Remember, sweetheart?' A green opening separates the true event from the unacceptable judgment: 'The station part is true. Please leave out the put-down.' Agreement or laughter does not establish consent to humiliation.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker></defs>
  <rect width="760" height="590" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="34" y="43" font-size="24">One remark, three different parts</text>
    <text x="34" y="74" font-size="16" fill="#667064">An affectionate word does not settle what the whole remark is doing.</text>
    <g fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"><rect x="34" y="122" width="212" height="156" rx="5"/><rect x="274" y="122" width="212" height="156" rx="5"/><rect x="514" y="122" width="212" height="156" rx="5"/></g>
    <text x="54" y="155" font-size="19">The event</text><text x="54" y="194" font-size="18">“You went to the</text><text x="54" y="221" font-size="18">wrong station.”</text><text x="54" y="255" font-size="15">May be accurate.</text>
    <text x="294" y="155" font-size="19">The put-down</text><text x="294" y="194" font-size="18">“You need</text><text x="294" y="221" font-size="18">supervising.”</text><text x="294" y="255" font-size="15">A judgment, not a fact.</text>
    <text x="534" y="155" font-size="19">The invitation</text><text x="534" y="194" font-size="18">“Remember,</text><text x="534" y="221" font-size="18">sweetheart?”</text><text x="534" y="255" font-size="15">Agreement is requested.</text>
    <path d="M34 310 H726" fill="none" stroke="#a6aca3" stroke-width="1"/>
    <text x="380" y="341" text-anchor="middle" font-size="17">An audience can make disagreement feel socially costly.</text>
    <rect x="34" y="379" width="692" height="116" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="54" y="414" font-size="20" fill="#00855b">Separate the event from the judgment</text>
    <text x="54" y="451" font-size="19">“The station part is true. Please leave out the put-down.”</text>
    <text x="54" y="478" font-size="15">One possible response when speaking up is safe.</text>
    <text x="34" y="537" font-size="16">A smile, laugh, or agreement does not establish consent to humiliation.</text>
    <text x="34" y="568" font-size="14" fill="#667064">The speaker remains responsible for the remark; the target owes no clever reply.</text>
  </g>
</svg>
