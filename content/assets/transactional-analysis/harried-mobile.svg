<svg xmlns="http://www.w3.org/2000/svg" width="360" height="870" viewBox="0 0 360 870" role="img" aria-labelledby="title desc">
  <title id="title">Several roles, one time window: compact</title>
  <desc id="desc">Three simultaneous demands converge on one person. Possible changes are reducing the meal's complexity, transferring responsibility for child collection, or changing the visit time. These options require actual discretion and support; they are not evidence that overload was chosen.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker></defs>
  <rect width="360" height="870" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="22" y="39" font-size="23">Several roles,</text><text x="22" y="70" font-size="23">one time window</text>
    <text x="22" y="103" font-size="15" fill="#667064">Conflicting demands, not a diagnosis.</text>
    <rect x="22" y="131" width="316" height="42" rx="4" fill="#f1f2ef"/>
    <text x="40" y="158" font-size="17">4–6 pm: all three need attention</text>
    <g fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"><rect x="22" y="194" width="95" height="84" rx="5"/><rect x="132" y="194" width="95" height="84" rx="5"/><rect x="243" y="194" width="95" height="84" rx="5"/></g>
    <text x="69" y="228" text-anchor="middle" font-size="16">Prepare</text><text x="69" y="253" text-anchor="middle" font-size="16">the meal</text>
    <text x="179" y="228" text-anchor="middle" font-size="16">Collect</text><text x="179" y="253" text-anchor="middle" font-size="16">the child</text>
    <text x="290" y="228" text-anchor="middle" font-size="16">Host</text><text x="290" y="253" text-anchor="middle" font-size="16">the guests</text>
    <g stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"><path d="M69 278 L142 329"/><path d="M179 278 V329"/><path d="M290 278 L217 329"/></g>
    <rect x="103" y="341" width="153" height="50" rx="5" fill="#ffffff" stroke="#252c28"/>
    <text x="179" y="373" text-anchor="middle" font-size="19">One person</text>
    <text x="22" y="438" font-size="19" fill="#00855b">Possible changes</text>
    <g fill="#edf5f0" stroke="#00855b" stroke-width="1"><rect x="22" y="459" width="316" height="76" rx="5"/><rect x="22" y="551" width="316" height="76" rx="5"/><rect x="22" y="643" width="316" height="76" rx="5"/></g>
    <text x="40" y="488" font-size="19" fill="#00855b">Reduce</text><text x="40" y="516" font-size="17">A simpler meal</text>
    <text x="40" y="580" font-size="19" fill="#00855b">Transfer ownership</text><text x="40" y="608" font-size="17">Someone else collects</text>
    <text x="40" y="672" font-size="19" fill="#00855b">Change the plan</text><text x="40" y="700" font-size="17">A different visit time</text>
    <text x="22" y="760" font-size="16">Sequencing helps only if the total load</text><text x="22" y="785" font-size="16">is feasible and support is available.</text>
    <text x="22" y="822" font-size="14" fill="#667064">Possibilities, not proof that someone</text><text x="22" y="845" font-size="14" fill="#667064">could have done less.</text>
  </g>
</svg>
