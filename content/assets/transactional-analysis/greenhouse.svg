<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">Greenhouse: sharing, admiration, and room for curiosity</title><desc id="desc">A possible recurring group pattern: a feeling is presented, admiration becomes expected, and questions become off limits. The ritual repeats. A green alternative invites agreement about the response that is welcome: listening now and exploration when agreed. A request for gentleness alone does not establish this pattern.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">When sharing becomes an exhibit</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">A possible group pattern—not a verdict on any feeling.</text><rect x="36" y="139" width="200" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="136.0" y="186.0" font-size="18" fill="#252c28" text-anchor="middle">A feeling</text><text x="136.0" y="212.0" font-size="18" fill="#252c28" text-anchor="middle">is presented</text><rect x="280" y="139" width="200" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="380.0" y="186.0" font-size="18" fill="#252c28" text-anchor="middle">Admiration</text><text x="380.0" y="212.0" font-size="18" fill="#252c28" text-anchor="middle">becomes expected</text><rect x="524" y="139" width="200" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="624.0" y="186.0" font-size="18" fill="#252c28" text-anchor="middle">Questions become</text><text x="624.0" y="212.0" font-size="18" fill="#252c28" text-anchor="middle">off limits</text><path d="M236 193 H274" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M480 193 H518" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M624 247 V313 H136 V253" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="380" y="302" font-size="16" fill="#252c28" text-anchor="middle">The same ritual repeats</text><path d="M36 193 H14 V448 H74" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="80" y="388" width="600" height="120" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="380.0" y="441.0" font-size="18" fill="#252c28" text-anchor="middle">Agree what response is welcome.</text><text x="380.0" y="467.0" font-size="18" fill="#252c28" text-anchor="middle">Listening now; exploration when agreed.</text><text x="380" y="559" font-size="17" fill="#252c28" text-anchor="middle">A request for gentleness alone</text><text x="380" y="584" font-size="17" fill="#252c28" text-anchor="middle">does not establish this pattern.</text></g></svg>