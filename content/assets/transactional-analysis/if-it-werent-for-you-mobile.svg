<svg xmlns="http://www.w3.org/2000/svg" width="360" height="850" viewBox="0 0 360 850" role="img" aria-labelledby="title desc">
  <title id="title">Freedom and readiness: compact version</title>
  <desc id="desc">After a restriction is questioned or removed, examine actual access and personal wishes separately. Practical restrictions and fear may coexist. A green panel invites choosing whether to take a next step; there is no obligation to act.</desc>
  <rect width="360" height="850" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="22" y="39" font-size="23">Check freedom and</text><text x="22" y="70" font-size="23">readiness separately</text>
    <text x="22" y="103" font-size="15" fill="#667064">Both kinds of information can matter.</text>
    <rect x="22" y="130" width="316" height="80" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="40" y="163" font-size="18">A restriction is questioned</text><text x="40" y="189" font-size="18">or removed</text>
    <path d="M180 210 V242" stroke="#a6aca3" stroke-width="1.2" fill="none"/>
    <rect x="22" y="242" width="316" height="139" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="40" y="275" font-size="20">Is the option truly available?</text>
    <text x="40" y="312" font-size="17">Time, money, access, care, safety.</text><text x="40" y="347" font-size="16">What restrictions still remain?</text>
    <rect x="22" y="407" width="316" height="139" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="40" y="440" font-size="20">What do I want or fear?</text>
    <text x="40" y="477" font-size="17">Interest, uncertainty, mixed feelings.</text><text x="40" y="512" font-size="16">What support might I want?</text>
    <path d="M180 546 V577" stroke="#00855b" stroke-width="1.2" fill="none"/>
    <rect x="22" y="577" width="316" height="113" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="40" y="609" font-size="20" fill="#00855b">Name the obstacle.</text><text x="40" y="639" font-size="19" fill="#00855b">Choose whether to take</text><text x="40" y="666" font-size="19" fill="#00855b">a next step.</text>
    <text x="22" y="730" font-size="16">Fear does not erase coercion.</text><text x="22" y="758" font-size="16">Freedom includes the choice</text><text x="22" y="783" font-size="16">not to proceed.</text>
    <text x="22" y="820" font-size="14" fill="#667064">A way to clarify the situation,</text><text x="22" y="841" font-size="14" fill="#667064">not a test of hidden motives.</text>
  </g>
</svg>
