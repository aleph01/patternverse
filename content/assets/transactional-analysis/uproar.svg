<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" role="img" aria-labelledby="title desc"><title id="title">Uproar: obtaining distance through conflict</title><desc id="desc">A complaint leads to attack and counterattack, then retreat and distance. The difficult issue remains unspoken and the sequence may recur. A green opening shows asking for space directly. A plan to return applies only when it is safe.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">When a quarrel makes distance possible</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">A possible function—not proof of anyone’s motives.</text><text x="380" y="108" font-size="17" fill="#252c28" text-anchor="middle">The difficult issue remains unspoken</text><rect x="36" y="142" width="186" height="90" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="129.0" y="180.0" font-size="18" fill="#252c28" text-anchor="middle">A small</text><text x="129.0" y="206.0" font-size="18" fill="#252c28" text-anchor="middle">complaint</text><rect x="287" y="142" width="186" height="90" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="380.0" y="180.0" font-size="18" fill="#252c28" text-anchor="middle">Attack and</text><text x="380.0" y="206.0" font-size="18" fill="#252c28" text-anchor="middle">counterattack</text><rect x="538" y="142" width="186" height="90" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="631.0" y="180.0" font-size="18" fill="#252c28" text-anchor="middle">Retreat</text><text x="631.0" y="206.0" font-size="18" fill="#252c28" text-anchor="middle">and distance</text><path d="M222 187 H283" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M473 187 H534" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M631 142 V118 H129 V138" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M129 232 V354" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><path d="M631 232 V354" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="36" y="360" width="438" height="108" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="255.0" y="407.0" font-size="18" fill="#252c28" text-anchor="middle">“I need some space.”</text><text x="255.0" y="433.0" font-size="18" fill="#252c28" text-anchor="middle">Make room without an argument.</text><rect x="538" y="360" width="186" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="631.0" y="407.0" font-size="18" fill="#252c28" text-anchor="middle">Relief now;</text><text x="631.0" y="433.0" font-size="18" fill="#252c28" text-anchor="middle">issue unresolved</text><text x="380" y="530" font-size="18" fill="#252c28" text-anchor="middle">A safe pause can include a plan to return.</text></g></svg>