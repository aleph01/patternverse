<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" role="img" aria-labelledby="title desc">
<title id="title">Keep the payment question and the conduct question distinct</title>
<desc id="desc">A repayment conversation shifts into accusations. Two columns separate questions about the amount, agreement, and realistic next steps from questions about pressure, harm, and boundaries. Green connectors bring both questions to attention without implying that either answer settles the other.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#00855b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:400;font-size:17px;fill:#252c28}.heading{font-size:19px}.small{font-size:15px}.line{fill:none;stroke:#a6aca3;stroke-width:1.5}.accent{fill:none;stroke:#00855b;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}</style>
<rect width="720" height="510" fill="#fff"/>
<rect x="24" y="24" width="672" height="70" class="context"/>
<text x="360" y="55" text-anchor="middle">A repayment conversation</text>
<text x="360" y="80" text-anchor="middle">shifts into accusations.</text>
<path d="M360 106V120M186 120H534M186 120V136M534 120V136" class="line"/>
<rect x="24" y="149" width="324" height="159" fill="#fff" stroke="#a6aca3"/>
<text x="46" y="183" class="heading">The payment question</text>
<path d="M46 200H326" class="line"/>
<text x="46" y="232">Is the amount agreed?</text>
<text x="46" y="260">What was the agreement?</text>
<text x="46" y="288">What is realistically possible?</text>
<rect x="372" y="149" width="324" height="159" fill="#fff" stroke="#a6aca3"/>
<text x="394" y="183" class="heading">The conduct question</text>
<path d="M394 200H674" class="line"/>
<text x="394" y="232">How was payment requested?</text>
<text x="394" y="260">Was there pressure or harm?</text>
<text x="394" y="288">What boundary is needed?</text>
<path d="M186 322V340H360M534 322V340H360M360 340V358" class="accent"/>
<path d="M360 353V359" class="accent" marker-end="url(#arrow)"/>
<rect x="105" y="373" width="510" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.5"/>
<text x="360" y="405" text-anchor="middle" class="heading">Address both questions.</text>
<text x="360" y="434" text-anchor="middle">Neither answer settles the other.</text>
<text x="360" y="493" text-anchor="middle" class="small" fill="#69716b">Clarifying the relationship does not change the financial facts.</text>
</svg>
