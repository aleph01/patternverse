<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1130" viewBox="0 0 360 1130" role="img" aria-labelledby="title desc"><title id="title">Psychiatry: from protecting identities to reviewing care</title><desc id="desc">Compact arrangement: possible clinician investment in proving healing power and possible client investment in proving help cannot work. If identities become the issue, a proposed opening is to ask what useful care would look like, reviewing benefit, burden, fit and next steps. These are hypotheses, not inferences from expertise or continuing symptoms.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="24" y="43" font-size="22" fill="#252c28" text-anchor="start">When treatment becomes</text><text x="24" y="75" font-size="22" fill="#252c28" text-anchor="start">a test of identity</text><text x="24" y="115" font-size="16" fill="#252c28" text-anchor="start">Berne’s hypothesis;</text><text x="24" y="139" font-size="16" fill="#252c28" text-anchor="start">not a test of anyone’s motives.</text><text x="180" y="193" font-size="13" fill="#252c28" text-anchor="middle">POSSIBLE CLINICIAN POSITION</text><rect x="53" y="213" width="254" height="94" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="253.0" font-size="18" fill="#252c28" text-anchor="middle">Proving one’s</text><text x="180.0" y="279.0" font-size="18" fill="#252c28" text-anchor="middle">healing power</text><text x="180" y="358" font-size="13" fill="#252c28" text-anchor="middle">POSSIBLE CLIENT POSITION</text><rect x="53" y="378" width="254" height="94" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="418.0" font-size="18" fill="#252c28" text-anchor="middle">Proving help</text><text x="180.0" y="444.0" font-size="18" fill="#252c28" text-anchor="middle">cannot work</text><path d="M307 260 H333 V516 H180 V547" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M307 425 H333" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="39" y="553" width="282" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="600.0" font-size="18" fill="#252c28" text-anchor="middle">Possible shift:</text><text x="180.0" y="626.0" font-size="18" fill="#252c28" text-anchor="middle">identities become the issue</text><path d="M180 661 V718" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="39" y="724" width="282" height="146" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="764.0" font-size="18" fill="#252c28" text-anchor="middle">What would useful care</text><text x="180.0" y="790.0" font-size="18" fill="#252c28" text-anchor="middle">look like?</text><text x="180.0" y="816.0" font-size="18" fill="#252c28" text-anchor="middle">Review benefit, burden,</text><text x="180.0" y="842.0" font-size="18" fill="#252c28" text-anchor="middle">fit, and next steps.</text><text x="180" y="952" font-size="17" fill="#252c28" text-anchor="middle">Expertise and persistent</text><text x="180" y="978" font-size="17" fill="#252c28" text-anchor="middle">symptoms alone</text><text x="180" y="1004" font-size="17" fill="#252c28" text-anchor="middle">do not establish a game.</text></g></svg>