<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc"><title id="title">Cavalier: two kinds of appreciation, freely shared</title><desc id="desc">Two participants in a possible Cavalier exchange. The speaker crafts a compliment that appreciates the recipient. The recipient may enjoy the phrasing and offer appreciation of the artistry. A green field emphasizes that any shared pleasure remains optional, either person can finish, and no response is owed. The diagram is an interpretation, not a test of intent.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">Two kinds of appreciation</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">A compliment can recognize a person and display a craft.</text><rect x="44" y="170" width="230" height="110" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="159.0" y="218.0" font-size="18" fill="#252c28" text-anchor="middle">Speaker</text><text x="159.0" y="244.0" font-size="18" fill="#252c28" text-anchor="middle">crafts a compliment</text><rect x="526" y="170" width="230" height="110" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="641.0" y="218.0" font-size="18" fill="#252c28" text-anchor="middle">Recipient</text><text x="641.0" y="244.0" font-size="18" fill="#252c28" text-anchor="middle">may respond</text><path d="M274 205 H520" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><text x="400" y="184" font-size="17" fill="#00855b" text-anchor="middle">Artful praise</text><path d="M526 250 H280" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><text x="400" y="288" font-size="16" fill="#252c28" text-anchor="middle">May enjoy the phrasing</text><text x="159" y="337" font-size="16" fill="#252c28" text-anchor="middle">The artistry may be appreciated.</text><text x="641" y="337" font-size="16" fill="#252c28" text-anchor="middle">The person may feel appreciated.</text><rect x="80" y="390" width="640" height="116" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="400.0" y="441.0" font-size="18" fill="#252c28" text-anchor="middle">Share the pleasure, if welcome.</text><text x="400.0" y="467.0" font-size="18" fill="#252c28" text-anchor="middle">Either may finish; no response is owed.</text><text x="400" y="565" font-size="16" fill="#252c28" text-anchor="middle">An interpretation of the exchange—not a test of intent.</text></g></svg>