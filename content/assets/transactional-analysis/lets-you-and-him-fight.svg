<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc"><title id="title">Let's You and Him Fight: the contest and the separate choice</title><desc id="desc">A person encourages two rivals to compete, while choosing another person or outcome elsewhere. A green branch shows that a rival can decline the contest and seek clarity. The arrangement is interpretive, not proof of intent.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">A contest that does not decide the outcome</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">Berne’s game version, with a possible opening for change.</text><rect x="68" y="134" width="260" height="80" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="198.0" y="167.0" font-size="18" fill="#252c28" text-anchor="middle">Person encouraging</text><text x="198.0" y="193.0" font-size="18" fill="#252c28" text-anchor="middle">rivalry</text><rect x="510" y="134" width="250" height="80" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="635.0" y="167.0" font-size="18" fill="#252c28" text-anchor="middle">Another person</text><text x="635.0" y="193.0" font-size="18" fill="#252c28" text-anchor="middle">or outcome</text><path d="M328 174 H506" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="419" y="153" font-size="16" fill="#252c28" text-anchor="middle">Chooses elsewhere</text><path d="M148 214 V260 H168 V296" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M248 214 V252 H450 V296" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="68" y="300" width="200" height="80" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="168.0" y="346.0" font-size="18" fill="#252c28" text-anchor="middle">Rival 1</text><rect x="350" y="300" width="200" height="80" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="450.0" y="346.0" font-size="18" fill="#252c28" text-anchor="middle">Rival 2</text><path d="M268 340 H346" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M350 352 H272" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="309" y="324" font-size="15" fill="#252c28" text-anchor="middle">Conflict</text><path d="M168 380 V436" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="68" y="440" width="482" height="92" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="309.0" y="479.0" font-size="18" fill="#252c28" text-anchor="middle">“I won’t compete for this.”</text><text x="309.0" y="505.0" font-size="18" fill="#252c28" text-anchor="middle">Clarify choices without a contest.</text><text x="309" y="561" font-size="18" fill="#00855b" text-anchor="middle">Either rival can decline.</text><text x="400" y="600" font-size="17" fill="#252c28" text-anchor="middle">Roles do not establish gender, motives, or equal responsibility.</text></g></svg>