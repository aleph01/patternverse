<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">When helping becomes a grievance</title><desc id="desc">A possible recurring interaction: help is offered, no benefit is reported, and failure is read as ingratitude. Another offer can repeat the same ending. A green alternative is to check fit, consent, and constraints, then revise, refer, or stop by agreement. Unsuccessful help alone does not establish a game.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">When helping becomes a grievance</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">A possible interaction—not a test of anyone’s motives.</text><rect x="36" y="139" width="200" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="136.0" y="186.0" font-size="18" fill="#252c28" text-anchor="middle">Help is</text><text x="136.0" y="212.0" font-size="18" fill="#252c28" text-anchor="middle">offered</text><rect x="280" y="139" width="200" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="380.0" y="186.0" font-size="18" fill="#252c28" text-anchor="middle">No benefit</text><text x="380.0" y="212.0" font-size="18" fill="#252c28" text-anchor="middle">is reported</text><rect x="524" y="139" width="200" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="624.0" y="186.0" font-size="18" fill="#252c28" text-anchor="middle">Failure is read</text><text x="624.0" y="212.0" font-size="18" fill="#252c28" text-anchor="middle">as ingratitude</text><path d="M236 193 H274" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M480 193 H518" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M624 247 V313 H136 V253" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="380" y="302" font-size="16" fill="#252c28" text-anchor="middle">Another offer; the same ending</text><path d="M36 193 H14 V448 H74" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="80" y="388" width="600" height="120" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="380.0" y="441.0" font-size="18" fill="#252c28" text-anchor="middle">Check fit, consent, and constraints.</text><text x="380.0" y="467.0" font-size="18" fill="#252c28" text-anchor="middle">Revise, refer, or stop by agreement.</text><text x="380" y="559" font-size="17" fill="#252c28" text-anchor="middle">Unsuccessful help alone</text><text x="380" y="584" font-size="17" fill="#252c28" text-anchor="middle">does not establish a game.</text></g></svg>