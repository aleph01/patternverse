<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1130" viewBox="0 0 360 1130" role="img" aria-labelledby="title desc"><title id="title">They will be glad: achievement and hoped-for recognition</title><desc id="desc">Compact comparison of priorities: the work may matter most, with supporters’ pleasure as an additional satisfaction; or making former supporters glad may be the main aim, Berne’s game distinction. The green relationship is hoped for, not guaranteed, and success alone does not reveal motives.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="25" y="42" font-size="24" fill="#252c28" text-anchor="start">Achievement—and</text><text x="25" y="74" font-size="24" fill="#252c28" text-anchor="start">who it is for</text><text x="25" y="118" font-size="16" fill="#252c28" text-anchor="start">Two possible priorities;</text><text x="25" y="142" font-size="16" fill="#252c28" text-anchor="start">not a diagnosis from success.</text><rect x="39" y="181" width="282" height="91" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="219.5" font-size="18" fill="#252c28" text-anchor="middle">An achievement</text><text x="180.0" y="245.5" font-size="18" fill="#252c28" text-anchor="middle">by honorable means</text><path d="M180 272 V314" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="180" y="343" font-size="17" fill="#252c28" text-anchor="middle">Which aim matters most?</text><rect x="39" y="377" width="282" height="128" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="421.0" font-size="18" fill="#252c28" text-anchor="middle">The work matters most.</text><text x="180.0" y="447.0" font-size="18" fill="#252c28" text-anchor="middle">Supporters’ pleasure</text><text x="180.0" y="473.0" font-size="18" fill="#252c28" text-anchor="middle">is an additional satisfaction.</text><text x="180" y="545" font-size="17" fill="#252c28" text-anchor="middle">Secondary satisfaction</text><text x="180" y="601" font-size="17" fill="#252c28" text-anchor="middle">or</text><rect x="39" y="640" width="282" height="142" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="678.0" font-size="18" fill="#252c28" text-anchor="middle">Making supporters glad</text><text x="180.0" y="704.0" font-size="18" fill="#252c28" text-anchor="middle">matters most.</text><text x="180.0" y="730.0" font-size="18" fill="#252c28" text-anchor="middle">“Their kindness</text><text x="180.0" y="756.0" font-size="18" fill="#252c28" text-anchor="middle">was justified.”</text><text x="180" y="823" font-size="18" fill="#00855b" text-anchor="middle">The game distinction</text><text x="180" y="903" font-size="16" fill="#00855b" text-anchor="middle">A hoped-for relationship;</text><text x="180" y="930" font-size="16" fill="#00855b" text-anchor="middle">no promised reaction.</text><text x="180" y="1023" font-size="17" fill="#252c28" text-anchor="middle">Success alone does not</text><text x="180" y="1050" font-size="17" fill="#252c28" text-anchor="middle">reveal someone’s motives.</text></g></svg>