<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" role="img" aria-labelledby="title desc">
  <title id="title">One remark, three parts: compact version</title>
  <desc id="desc">Separate a factual event, a put-down, and an endearment asking for agreement. A green example accepts the event while objecting to the judgment. Speaking up is optional and depends on safety; the speaker remains responsible for the remark.</desc>
  <rect width="360" height="900" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="22" y="39" font-size="23">One remark,</text><text x="22" y="70" font-size="23">three different parts</text>
    <text x="22" y="104" font-size="15" fill="#667064">Look at more than the affectionate word.</text>
    <g fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"><rect x="22" y="133" width="316" height="107" rx="5"/><rect x="22" y="257" width="316" height="107" rx="5"/><rect x="22" y="381" width="316" height="107" rx="5"/></g>
    <text x="40" y="164" font-size="19">The event</text><text x="40" y="199" font-size="18">“You went to the wrong station.”</text><text x="40" y="225" font-size="15">May be accurate.</text>
    <text x="40" y="288" font-size="19">The put-down</text><text x="40" y="323" font-size="18">“You need supervising.”</text><text x="40" y="349" font-size="15">A judgment, not a fact.</text>
    <text x="40" y="412" font-size="19">The invitation</text><text x="40" y="447" font-size="18">“Remember, sweetheart?”</text><text x="40" y="473" font-size="15">Agreement is requested.</text>
    <text x="22" y="524" font-size="16">An audience can make disagreement</text><text x="22" y="549" font-size="16">feel socially costly.</text>
    <rect x="22" y="580" width="316" height="157" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="40" y="612" font-size="20" fill="#00855b">Separate event and judgment</text>
    <text x="40" y="650" font-size="18">“The station part is true.</text><text x="40" y="678" font-size="18">Please leave out the put-down.”</text>
    <text x="40" y="713" font-size="14">An option when speaking up is safe.</text>
    <text x="22" y="777" font-size="16">A smile, laugh, or agreement does not</text><text x="22" y="802" font-size="16">establish consent to humiliation.</text>
    <text x="22" y="841" font-size="14" fill="#667064">The speaker owns the remark.</text><text x="22" y="865" font-size="14" fill="#667064">The target owes no clever reply.</text>
  </g>
</svg>
