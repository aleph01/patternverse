<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" role="img" aria-labelledby="title desc"><title id="title">Busman’s Holiday: familiar skills, chosen contribution</title><desc id="desc">Three ingredients in a Patternverse adaptation of Busman’s Holiday: familiar skill, a different context, and free choice. They meet in a welcome, agreed contribution with clear scope, local guidance, and room to stop. Useful work and enjoyment or renewal are possible outcomes, not guaranteed. The diagram does not prescribe working during leave.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">Familiar work, a different experience</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">A constructive possibility—not a promise of recovery.</text><rect x="36" y="138" width="220" height="96" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="146.0" y="192.0" font-size="18" fill="#252c28" text-anchor="middle">Familiar skill</text><rect x="290" y="138" width="220" height="96" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="400.0" y="192.0" font-size="18" fill="#252c28" text-anchor="middle">Different context</text><rect x="544" y="138" width="220" height="96" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="654.0" y="192.0" font-size="18" fill="#252c28" text-anchor="middle">Free choice</text><path d="M146 234 V284 H400 V326" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M400 234 V278" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M654 234 V284 H400" fill="none" stroke="#a6aca3" stroke-width="1.4"/><rect x="136" y="332" width="528" height="116" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="400.0" y="383.0" font-size="18" fill="#252c28" text-anchor="middle">A welcome, agreed contribution</text><text x="400.0" y="409.0" font-size="18" fill="#252c28" text-anchor="middle">Clear scope, local guidance, room to stop</text><path d="M400 448 V502" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="170" y="508" width="460" height="100" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="400.0" y="551.0" font-size="18" fill="#252c28" text-anchor="middle">Useful work</text><text x="400.0" y="577.0" font-size="18" fill="#252c28" text-anchor="middle">Possible enjoyment or renewal</text><text x="400" y="661" font-size="17" fill="#252c28" text-anchor="middle">The contributor and the hosts both get a say.</text></g></svg>