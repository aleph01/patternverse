<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1120" viewBox="0 0 360 1120" role="img" aria-labelledby="title desc"><title id="title">Indigence: when the helping arrangement stays put</title><desc id="desc">Compact layout: around a stated aim of suitable work, applications are discussed but none submitted and the service records activity as progress. The arrangement repeats. An alternative is to clarify goals, barriers and support, agree a next step, and review. The observations alone do not establish a game, and support can remain necessary during progress.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="24" y="43" font-size="23" fill="#252c28" text-anchor="start">When the helping</text><text x="24" y="75" font-size="23" fill="#252c28" text-anchor="start">arrangement stays put</text><text x="24" y="115" font-size="16" fill="#252c28" text-anchor="start">One possible pattern;</text><text x="24" y="139" font-size="16" fill="#252c28" text-anchor="start">not an explanation of poverty.</text><text x="180" y="184" font-size="17" fill="#252c28" text-anchor="middle">Stated aim: suitable work</text><text x="62" y="235" font-size="14" fill="#252c28" text-anchor="start">CLIENT</text><rect x="53" y="250" width="254" height="106" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="296.0" font-size="18" fill="#252c28" text-anchor="middle">Applications discussed;</text><text x="180.0" y="322.0" font-size="18" fill="#252c28" text-anchor="middle">none submitted</text><path d="M180 356 V410" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="62" y="408" font-size="14" fill="#252c28" text-anchor="start">SERVICE</text><rect x="53" y="425" width="254" height="106" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="471.0" font-size="18" fill="#252c28" text-anchor="middle">Activity recorded</text><text x="180.0" y="497.0" font-size="18" fill="#252c28" text-anchor="middle">as progress</text><path d="M53 478 H24 V303 H47" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="180" y="573" font-size="16" fill="#252c28" text-anchor="middle">The same arrangement</text><text x="180" y="598" font-size="16" fill="#252c28" text-anchor="middle">is renewed</text><path d="M180 383 H335 V662 H180 V701" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="39" y="707" width="282" height="146" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="747.0" font-size="18" fill="#252c28" text-anchor="middle">Clarify the goal,</text><text x="180.0" y="773.0" font-size="18" fill="#252c28" text-anchor="middle">barriers, and support.</text><text x="180.0" y="799.0" font-size="18" fill="#252c28" text-anchor="middle">Agree a next step</text><text x="180.0" y="825.0" font-size="18" fill="#252c28" text-anchor="middle">and review what happens.</text><text x="180" y="920" font-size="16" fill="#252c28" text-anchor="middle">These observations alone</text><text x="180" y="945" font-size="16" fill="#252c28" text-anchor="middle">do not establish a game.</text><text x="180" y="1004" font-size="16" fill="#252c28" text-anchor="middle">Support may remain necessary</text><text x="180" y="1029" font-size="16" fill="#252c28" text-anchor="middle">even when change occurs.</text></g></svg>