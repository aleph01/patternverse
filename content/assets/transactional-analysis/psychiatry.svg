<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">Psychiatry: from protecting identities to reviewing care</title><desc id="desc">A role arrangement illustrating Berne’s hypothesis. A clinician may become invested in proving healing power, while a client may become invested in proving that help cannot work. A possible shift is that identities become the issue. A green opening asks what useful care would look like and invites review of benefit, burden, fit and next steps. Expertise and persistent symptoms alone establish no game.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">When treatment becomes a test of identity</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">Berne’s hypothesis—not a test of anyone’s motives.</text><text x="194" y="136" font-size="13" fill="#252c28" text-anchor="middle">POSSIBLE CLINICIAN POSITION</text><text x="606" y="136" font-size="13" fill="#252c28" text-anchor="middle">POSSIBLE CLIENT POSITION</text><rect x="44" y="156" width="300" height="100" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="199.0" font-size="18" fill="#252c28" text-anchor="middle">Proving one’s</text><text x="194.0" y="225.0" font-size="18" fill="#252c28" text-anchor="middle">healing power</text><rect x="456" y="156" width="300" height="100" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="606.0" y="199.0" font-size="18" fill="#252c28" text-anchor="middle">Proving help</text><text x="606.0" y="225.0" font-size="18" fill="#252c28" text-anchor="middle">cannot work</text><path d="M194 256 V295 H400 V326" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M606 256 V295 H400" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="250" y="332" width="300" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="400.0" y="379.0" font-size="18" fill="#252c28" text-anchor="middle">Possible shift:</text><text x="400.0" y="405.0" font-size="18" fill="#252c28" text-anchor="middle">identities become the issue</text><path d="M400 440 V490" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="86" y="496" width="628" height="116" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="400.0" y="547.0" font-size="18" fill="#252c28" text-anchor="middle">What would useful care look like?</text><text x="400.0" y="573.0" font-size="18" fill="#252c28" text-anchor="middle">Review benefit, burden, fit, and next steps.</text><text x="400" y="663" font-size="17" fill="#252c28" text-anchor="middle">Expertise and persistent symptoms alone</text><text x="400" y="689" font-size="17" fill="#252c28" text-anchor="middle">do not establish a game.</text></g></svg>