<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc"><title id="title">Happy to Help: contribution, purpose, and terms</title><desc id="desc">Three separate questions about help: benefit, or what actually helps; aims, or what else the helper might want; and terms, or what is expected in return. A green field invites acknowledging the benefit, agreeing the terms, and preserving the right to decline. Motives may remain uncertain. Appreciation does not establish an unagreed obligation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">Useful help can carry another purpose</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">Three questions; no verdict about anyone’s motives.</text><rect x="36" y="150" width="220" height="140" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="146.0" y="213.0" font-size="18" fill="#252c28" text-anchor="middle">Benefit</text><text x="146.0" y="239.0" font-size="18" fill="#252c28" text-anchor="middle">What actually helps?</text><rect x="290" y="150" width="220" height="140" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="400.0" y="200.0" font-size="18" fill="#252c28" text-anchor="middle">Aims</text><text x="400.0" y="226.0" font-size="18" fill="#252c28" text-anchor="middle">What else might</text><text x="400.0" y="252.0" font-size="18" fill="#252c28" text-anchor="middle">the helper want?</text><rect x="544" y="150" width="220" height="140" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="654.0" y="200.0" font-size="18" fill="#252c28" text-anchor="middle">Terms</text><text x="654.0" y="226.0" font-size="18" fill="#252c28" text-anchor="middle">What is expected</text><text x="654.0" y="252.0" font-size="18" fill="#252c28" text-anchor="middle">in return?</text><path d="M146 290 V340 H654 V290 M400 290 V340" fill="none" stroke="#a6aca3" stroke-width="1.4"/><path d="M400 340 V390" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="70" y="396" width="660" height="116" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="400.0" y="447.0" font-size="18" fill="#252c28" text-anchor="middle">Acknowledge the benefit.</text><text x="400.0" y="473.0" font-size="18" fill="#252c28" text-anchor="middle">Agree the terms; preserve the right to decline.</text><text x="400" y="563" font-size="17" fill="#252c28" text-anchor="middle">Motives may remain uncertain.</text><text x="400" y="602" font-size="16" fill="#252c28" text-anchor="middle">Appreciation does not establish an unagreed obligation.</text></g></svg>