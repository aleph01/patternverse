<svg xmlns="http://www.w3.org/2000/svg" width="360" height="920" viewBox="0 0 360 920" role="img" aria-labelledby="title desc">
  <title id="title">The third person's role: compact version</title>
  <desc id="desc">An informal trial directs a complaint and defence toward a third person for a verdict. A green alternative makes the role explicit: support, facilitation, investigation, or decision. This does not assume equal responsibility or require direct confrontation.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker>
    <marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#00855b" stroke-width="1.2"/></marker>
  </defs>
  <rect width="360" height="920" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="22" y="39" font-size="23">What is the third person</text><text x="22" y="70" font-size="23">being asked to do?</text>
    <text x="22" y="104" font-size="15" fill="#667064">A role arrangement, not proof of motives.</text>
    <text x="22" y="148" font-size="20">An informal trial</text>
    <g fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"><rect x="100" y="175" width="160" height="82" rx="5"/><rect x="22" y="335" width="140" height="70" rx="5"/><rect x="198" y="335" width="140" height="70" rx="5"/></g>
    <text x="180" y="207" text-anchor="middle" font-size="18">Third person</text><text x="180" y="236" text-anchor="middle" font-size="16">“Who is right?”</text>
    <g stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"><path d="M92 335 L145 269"/><path d="M268 335 L215 269"/></g>
    <text x="92" y="376" text-anchor="middle" font-size="18">Complaint</text><text x="268" y="376" text-anchor="middle" font-size="18">Defence</text>
    <text x="22" y="440" font-size="16">New details become more</text><text x="22" y="465" font-size="16">material for the case.</text>
    <path d="M22 491 H338" stroke="#f1f2ef" stroke-width="1.5"/>
    <text x="22" y="527" font-size="20" fill="#00855b">A defined helping role</text>
    <rect x="100" y="550" width="160" height="69" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="180" y="579" text-anchor="middle" font-size="18">Third person</text><text x="180" y="603" text-anchor="middle" font-size="16">“What help?”</text>
    <path d="M180 619 V649" stroke="#00855b" stroke-width="1.3" fill="none" marker-end="url(#green)"/>
    <rect x="22" y="661" width="316" height="82" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="180" y="693" text-anchor="middle" font-size="18" fill="#00855b">Support or facilitate?</text><text x="180" y="722" text-anchor="middle" font-size="18" fill="#00855b">Investigate or decide?</text>
    <text x="22" y="779" font-size="16">Purpose, limits, and next step</text><text x="22" y="804" font-size="16">become explicit.</text>
    <text x="22" y="849" font-size="15">A complaint may need a formal decision.</text>
    <text x="22" y="881" font-size="14" fill="#667064">No assumption of equal responsibility.</text><text x="22" y="904" font-size="14" fill="#667064">No requirement for direct confrontation.</text>
  </g>
</svg>
