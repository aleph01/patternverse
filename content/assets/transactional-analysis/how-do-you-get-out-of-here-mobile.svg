<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1010" viewBox="0 0 360 1010" role="img" aria-labelledby="title desc"><title id="title">How Do You Get Out of Here: approaching an exit and making support concrete</title><desc id="desc">Compact version. A wish to leave leads to an approaching exit, then a setback delays the move. Familiar structure continues. A green branch explores what becomes harder and clarifies needs, barriers, and support. This is not a test of readiness or motive.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="25" y="42" font-size="23" fill="#252c28" text-anchor="start">When leaving</text><text x="25" y="73" font-size="23" fill="#252c28" text-anchor="start">becomes real</text><text x="25" y="113" font-size="16" fill="#252c28" text-anchor="start">A possible pattern;</text><text x="25" y="136" font-size="16" fill="#252c28" text-anchor="start">not a test of readiness or motive.</text><rect x="63" y="178" width="262" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="221.0" font-size="18" fill="#252c28" text-anchor="middle">A wish to leave</text><path d="M194 252 V286" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="63" y="292" width="262" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="335.0" font-size="18" fill="#252c28" text-anchor="middle">An exit approaches</text><path d="M194 366 V400" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="63" y="406" width="262" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="442.0" font-size="18" fill="#252c28" text-anchor="middle">A setback</text><text x="194.0" y="468.0" font-size="18" fill="#252c28" text-anchor="middle">delays the move</text><path d="M63 449 H28 V215 H59" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="63" y="533" font-size="17" fill="#252c28" text-anchor="start">Familiar structure</text><text x="63" y="558" font-size="17" fill="#252c28" text-anchor="start">continues.</text><path d="M325 329 H343 V615 H194 V650" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="40" y="656" width="280" height="144" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="695.0" font-size="18" fill="#252c28" text-anchor="middle">“What becomes harder</text><text x="180.0" y="721.0" font-size="18" fill="#252c28" text-anchor="middle">as leaving gets closer?”</text><text x="180.0" y="747.0" font-size="18" fill="#252c28" text-anchor="middle">Clarify needs, barriers,</text><text x="180.0" y="773.0" font-size="18" fill="#252c28" text-anchor="middle">and support.</text><text x="180" y="870" font-size="17" fill="#252c28" text-anchor="middle">A setback does not prove</text><text x="180" y="897" font-size="17" fill="#252c28" text-anchor="middle">a wish to stay.</text></g></svg>