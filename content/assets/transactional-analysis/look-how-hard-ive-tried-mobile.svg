<svg xmlns="http://www.w3.org/2000/svg" width="360" height="880" viewBox="0 0 360 880" role="img" aria-labelledby="title desc">
  <title id="title">Participation and purpose: compact version</title>
  <desc id="desc">The possible sequence is displayed effort, stalled work, then a claim of blamelessness after another person gives up. A green opening clarifies the freely chosen goal and commitments. Unsuccessful effort is not itself evidence of a game.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker></defs>
  <rect width="360" height="880" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="22" y="39" font-size="23">When participation</text><text x="22" y="70" font-size="23">becomes a defence</text>
    <text x="22" y="103" font-size="15" fill="#667064">An illustration, not a test of sincerity.</text>
    <g fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"><rect x="22" y="131" width="316" height="97" rx="5"/><rect x="22" y="269" width="316" height="97" rx="5"/><rect x="22" y="407" width="316" height="97" rx="5"/></g>
    <g stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"><path d="M180 228 V257"/><path d="M180 366 V395"/></g>
    <text x="40" y="162" font-size="20">Participation</text><text x="40" y="194" font-size="18">“I went to sessions.”</text><text x="40" y="216" font-size="14">Effort is displayed.</text>
    <text x="40" y="300" font-size="20">Stalled work</text><text x="40" y="332" font-size="18">“Nothing changes.”</text><text x="40" y="354" font-size="14">The goal stays unclear.</text>
    <text x="40" y="438" font-size="20">Vindication</text><text x="40" y="470" font-size="18">“You gave up. I tried.”</text><text x="40" y="492" font-size="14">Blamelessness is claimed.</text>
    <rect x="22" y="542" width="316" height="172" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="40" y="575" font-size="21" fill="#00855b">Make the goal explicit</text>
    <text x="40" y="613" font-size="18">Repair, explore uncertainty,</text><text x="40" y="640" font-size="18">or plan an ending?</text>
    <text x="40" y="675" font-size="16">What is each person freely</text><text x="40" y="700" font-size="16">willing to work on?</text>
    <text x="22" y="751" font-size="16">Review commitments, barriers,</text><text x="22" y="776" font-size="16">and impact with appropriate support.</text>
    <text x="22" y="812" font-size="16">Lack of success does not prove</text><text x="22" y="837" font-size="16">lack of effort.</text>
    <text x="22" y="867" font-size="14" fill="#667064">No obligation to remain in a relationship.</text>
  </g>
</svg>
