<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">When participation becomes a defence</title>
  <desc id="desc">An illustrative sequence moves from pointing to attendance, through stalled work, to claiming blamelessness when the other person ends the process. A green opening makes the goal explicit: repair, explore uncertainty, or plan an ending. Lack of success is not proof of insincerity.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker>
    <marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#00855b" stroke-width="1.2"/></marker>
  </defs>
  <rect width="760" height="560" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="34" y="43" font-size="24">When participation becomes a defence</text>
    <text x="34" y="74" font-size="16" fill="#667064">An illustrative sequence, not a test of sincerity.</text>
    <g fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"><rect x="34" y="119" width="202" height="125" rx="5"/><rect x="279" y="119" width="202" height="125" rx="5"/><rect x="524" y="119" width="202" height="125" rx="5"/></g>
    <g stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"><path d="M237 181 H269"/><path d="M482 181 H514"/></g>
    <text x="135" y="153" text-anchor="middle" font-size="19">Participation</text><text x="135" y="188" text-anchor="middle" font-size="17">“I went to sessions.”</text><text x="135" y="220" text-anchor="middle" font-size="15">Effort is displayed.</text>
    <text x="380" y="153" text-anchor="middle" font-size="19">Stalled work</text><text x="380" y="188" text-anchor="middle" font-size="17">“Nothing changes.”</text><text x="380" y="220" text-anchor="middle" font-size="15">The goal stays unclear.</text>
    <text x="625" y="153" text-anchor="middle" font-size="19">Vindication</text><text x="625" y="188" text-anchor="middle" font-size="17">“You gave up. I tried.”</text><text x="625" y="220" text-anchor="middle" font-size="15">Blamelessness is claimed.</text>
    <path d="M135 244 V302" stroke="#00855b" stroke-width="1.3" fill="none" marker-end="url(#green)"/>
    <rect x="34" y="316" width="692" height="125" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="54" y="350" font-size="21" fill="#00855b">Make the goal explicit</text>
    <text x="54" y="385" font-size="19">Repair, explore uncertainty, or plan an ending?</text>
    <text x="54" y="419" font-size="17">What is each person freely willing to work on?</text>
    <text x="34" y="484" font-size="16">Review commitments, barriers, and impact with appropriate support.</text>
    <text x="34" y="519" font-size="16">Lack of success does not prove lack of effort.</text>
    <text x="34" y="545" font-size="14" fill="#667064">Clarifying a goal does not oblige anyone to remain in a relationship.</text>
  </g>
</svg>
