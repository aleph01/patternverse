<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc">
  <title id="title">What is the third person being asked to do?</title>
  <desc id="desc">On the left, a complaint and a defence are directed toward a third person asked to give a verdict. On the right, the third person clarifies the helping role: support, facilitation, investigation, or decision. Green marks a possible opening for agreeing a purpose and next step, not an obligation to mediate.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker>
    <marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#00855b" stroke-width="1.2"/></marker>
  </defs>
  <rect width="760" height="580" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="34" y="43" font-size="24">What is the third person being asked to do?</text>
    <text x="34" y="74" font-size="16" fill="#667064">A role arrangement to examine, not proof of anyone’s motives.</text>
    <text x="190" y="119" text-anchor="middle" font-size="19">An informal trial</text>
    <text x="570" y="119" text-anchor="middle" font-size="19" fill="#00855b">A defined helping role</text>
    <path d="M380 105 V474" fill="none" stroke="#f1f2ef" stroke-width="1.5"/>
    <g fill="#f1f2ef" stroke="#a6aca3" stroke-width="1">
      <rect x="110" y="147" width="160" height="82" rx="5"/>
      <rect x="34" y="324" width="140" height="76" rx="5"/>
      <rect x="206" y="324" width="140" height="76" rx="5"/>
      <rect x="490" y="147" width="160" height="82" rx="5"/>
    </g>
    <text x="190" y="180" text-anchor="middle" font-size="18">Third person</text><text x="190" y="208" text-anchor="middle" font-size="16">“Who is right?”</text>
    <text x="104" y="368" text-anchor="middle" font-size="18">Complaint</text><text x="276" y="368" text-anchor="middle" font-size="18">Defence</text>
    <g stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"><path d="M104 324 L157 240"/><path d="M276 324 L223 240"/></g>
    <text x="570" y="180" text-anchor="middle" font-size="18">Third person</text><text x="570" y="208" text-anchor="middle" font-size="16">“What help?”</text>
    <path d="M570 229 V311" stroke="#00855b" stroke-width="1.3" fill="none" marker-end="url(#green)"/>
    <rect x="414" y="324" width="312" height="76" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="570" y="353" text-anchor="middle" font-size="18" fill="#00855b">Support or facilitate?</text><text x="570" y="381" text-anchor="middle" font-size="18" fill="#00855b">Investigate or decide?</text>
    <text x="34" y="439" font-size="16">New details become more</text><text x="34" y="465" font-size="16">material for the case.</text>
    <text x="414" y="439" font-size="16">Purpose, limits, and next step</text><text x="414" y="465" font-size="16">become explicit.</text>
    <text x="34" y="518" font-size="16">A legitimate complaint may need an investigation and a decision.</text>
    <text x="34" y="552" font-size="15" fill="#667064">A shared process does not imply equal responsibility or require confrontation.</text>
  </g>
</svg>
