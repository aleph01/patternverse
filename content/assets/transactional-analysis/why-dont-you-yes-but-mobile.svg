<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1060" viewBox="0 0 360 1060" role="img" aria-labelledby="title desc"><title id="title">Why Don't You—Yes But: interrupting the advice contest</title><desc id="desc">Compact version: a problem, a solution, and an objection. The suggestion and objection may repeat until advisers give up. A green alternative asks what help is wanted. The diagram does not infer hidden motives.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="28" y="42" font-size="23" fill="#252c28" text-anchor="start">When help becomes</text><text x="28" y="72" font-size="23" fill="#252c28" text-anchor="start">a contest</text><text x="28" y="111" font-size="16" fill="#252c28" text-anchor="start">A possible pattern;</text><text x="28" y="133" font-size="16" fill="#252c28" text-anchor="start">motives remain uncertain.</text><rect x="63" y="171" width="262" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="214.0" font-size="18" fill="#252c28" text-anchor="middle">A problem is raised</text><path d="M194 245 V279" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="63" y="285" width="262" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="328.0" font-size="18" fill="#252c28" text-anchor="middle">A solution is offered</text><path d="M194 359 V393" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="63" y="399" width="262" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="442.0" font-size="18" fill="#252c28" text-anchor="middle">A reason it won’t work</text><path d="M63 436 H28 V322 H58" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="194" y="522" font-size="16" fill="#252c28" text-anchor="middle">After repeated rounds</text><path d="M194 473 V496" fill="none" stroke="#a6aca3" stroke-width="1.4"/><path d="M194 536 V562" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="63" y="566" width="262" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="609.0" font-size="18" fill="#252c28" text-anchor="middle">Silence or irritation</text><path d="M325 322 H343 V701 H194 V725" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="40" y="732" width="280" height="108" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="766.0" font-size="18" fill="#252c28" text-anchor="middle">“What would be</text><text x="180.0" y="792.0" font-size="18" fill="#252c28" text-anchor="middle">useful from me?”</text><text x="180.0" y="818.0" font-size="18" fill="#252c28" text-anchor="middle">Agree what help is wanted.</text><text x="180" y="879" font-size="17" fill="#00855b" text-anchor="middle">Listening · Information</text><text x="180" y="905" font-size="17" fill="#00855b" text-anchor="middle">A specific task</text><text x="180" y="968" font-size="16" fill="#252c28" text-anchor="middle">A real constraint changes the plan.</text><text x="180" y="995" font-size="16" fill="#252c28" text-anchor="middle">It does not prove a game.</text></g></svg>