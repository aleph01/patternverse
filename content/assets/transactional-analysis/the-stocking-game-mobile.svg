<svg xmlns="http://www.w3.org/2000/svg" width="360" height="940" viewBox="0 0 360 940" role="img" aria-labelledby="title desc"><title id="title">The Stocking Game: attention, interpretation, and a practical opening</title><desc id="desc">Compact version. Attention to a practical issue is followed by a response, then a claim about someone’s motives. A green alternative clarifies the practical request and addresses conduct, without treating appearance as evidence of intention or consent.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="25" y="42" font-size="23" fill="#252c28" text-anchor="start">When a response</text><text x="25" y="73" font-size="23" fill="#252c28" text-anchor="start">becomes evidence</text><text x="25" y="113" font-size="16" fill="#252c28" text-anchor="start">An interpretive hypothesis;</text><text x="25" y="136" font-size="16" fill="#252c28" text-anchor="start">not proof of intention.</text><rect x="55" y="178" width="250" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="214.0" font-size="18" fill="#252c28" text-anchor="middle">A practical issue</text><text x="180.0" y="240.0" font-size="18" fill="#252c28" text-anchor="middle">draws attention</text><path d="M180 264 V298" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="55" y="304" width="250" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="347.0" font-size="18" fill="#252c28" text-anchor="middle">Someone responds</text><path d="M180 378 V412" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="55" y="418" width="250" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="180.0" y="454.0" font-size="18" fill="#252c28" text-anchor="middle">“That shows</text><text x="180.0" y="480.0" font-size="18" fill="#252c28" text-anchor="middle">how you think.”</text><path d="M305 341 H335 V581 H180 V619" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="39" y="625" width="282" height="118" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="664.0" font-size="18" fill="#252c28" text-anchor="middle">“What help would be useful?”</text><text x="180.0" y="690.0" font-size="18" fill="#252c28" text-anchor="middle">Address conduct</text><text x="180.0" y="716.0" font-size="18" fill="#252c28" text-anchor="middle">without guessing motives.</text><text x="180" y="818" font-size="16" fill="#252c28" text-anchor="middle">Appearance does not establish</text><text x="180" y="845" font-size="16" fill="#252c28" text-anchor="middle">intent or consent.</text></g></svg>