<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550" role="img" aria-labelledby="title desc">
  <title id="title">A choice can stand. Repair can still happen.</title>
  <desc id="desc">After a hurtful exchange, one person says 'Go without me.' One possible response uses those words to assign all blame. A green alternative respects the choice while apologising for one's own harsh remark. Accepting a refusal is not itself evidence of a game.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker>
    <marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#00855b" stroke-width="1.2"/></marker>
  </defs>
  <rect width="760" height="550" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28">
    <text x="34" y="43" font-size="24">A choice can stand. Repair can still happen.</text>
    <text x="34" y="74" font-size="16" fill="#667064">An illustrative contrast, not a test of someone’s hidden intentions.</text>
    <rect x="221" y="106" width="318" height="96" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="380" y="140" text-anchor="middle" font-size="17">After a hurtful exchange:</text>
    <text x="380" y="175" text-anchor="middle" font-size="20">“Go without me.”</text>
    <path d="M365 202 V232 H197 V264" stroke="#a6aca3" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
    <path d="M395 202 V232 H563 V264" stroke="#00855b" stroke-width="1.3" fill="none" marker-end="url(#green)"/>
    <rect x="34" y="278" width="327" height="164" rx="5" fill="#f1f2ef" stroke="#a6aca3"/>
    <text x="54" y="312" font-size="20">Turn the words into a verdict</text>
    <text x="54" y="350" font-size="18">“You said it. All your fault.”</text>
    <text x="54" y="390" font-size="16">The earlier hurt disappears</text>
    <text x="54" y="416" font-size="16">from the account.</text>
    <rect x="399" y="278" width="327" height="164" rx="5" fill="#edf5f0" stroke="#00855b"/>
    <text x="419" y="312" font-size="20" fill="#00855b">Respect the choice; own a part</text>
    <text x="419" y="350" font-size="18">“I’ll respect your choice.</text>
    <text x="419" y="379" font-size="18">I’m sorry I snapped.”</text>
    <text x="419" y="416" font-size="16">No changed answer is required.</text>
    <text x="34" y="483" font-size="16">Accepting a refusal is not, by itself, evidence of a game.</text>
    <text x="34" y="518" font-size="15" fill="#667064">Green marks an opening for clearer contact, not guaranteed reconciliation.</text>
  </g>
</svg>
