<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" role="img" aria-labelledby="title desc"><title id="title">Schlemiel: apology and the unfinished repair</title><desc id="desc">Compact version. Damage is followed by apology and an immediate reset. A dashed return indicates possible repetition while impact remains unaddressed. A green alternative keeps repair and boundaries open; forgiveness is a separate decision.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="28" y="42" font-size="22" fill="#252c28" text-anchor="start">When “sorry” is expected</text><text x="28" y="70" font-size="22" fill="#252c28" text-anchor="start">to settle everything</text><text x="28" y="106" font-size="16" fill="#252c28" text-anchor="start">One possible interaction;</text><text x="28" y="128" font-size="16" fill="#252c28" text-anchor="start">motives remain uncertain.</text><rect x="63" y="168" width="262" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="211.0" font-size="18" fill="#252c28" text-anchor="middle">Something is damaged</text><path d="M194 242 V276" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="63" y="282" width="262" height="74" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="325.0" font-size="18" fill="#252c28" text-anchor="middle">An apology is offered</text><path d="M194 356 V390" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="63" y="396" width="262" height="86" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="194.0" y="432.0" font-size="18" fill="#252c28" text-anchor="middle">“It’s fine.”</text><text x="194.0" y="458.0" font-size="18" fill="#252c28" text-anchor="middle">Immediate reset</text><path d="M63 439 H28 V205 H58" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="63" y="518" font-size="17" fill="#252c28" text-anchor="start">Impact unaddressed;</text><text x="63" y="542" font-size="17" fill="#252c28" text-anchor="start">conditions unchanged</text><path d="M325 319 H342 V592 H198 V617" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="40" y="624" width="280" height="108" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="180.0" y="658.0" font-size="18" fill="#252c28" text-anchor="middle">“I hear your apology.”</text><text x="180.0" y="684.0" font-size="18" fill="#252c28" text-anchor="middle">“We still need to</text><text x="180.0" y="710.0" font-size="18" fill="#252c28" text-anchor="middle">address the damage.”</text><text x="180" y="770" font-size="17" fill="#00855b" text-anchor="middle">Assess impact · Discuss repair</text><text x="180" y="795" font-size="17" fill="#00855b" text-anchor="middle">Set a boundary</text><text x="180" y="848" font-size="16" fill="#252c28" text-anchor="middle">Forgiveness and future access</text><text x="180" y="871" font-size="16" fill="#252c28" text-anchor="middle">remain separate decisions.</text></g></svg>