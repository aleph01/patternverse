<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Indigence: when the helping arrangement stays put</title><desc id="desc">A possible pattern around the stated aim of suitable work. Applications are discussed but none submitted; the service records activity as progress. A dashed return shows the same arrangement being renewed. A green opening invites clarification of the goal, barriers and support, followed by an agreed next step and review. These observations alone do not establish a game. Support may remain necessary even when change occurs.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" fill="#252c28"><text x="36" y="48" font-size="25" fill="#252c28" text-anchor="start">When the helping arrangement stays put</text><text x="36" y="80" font-size="17" fill="#252c28" text-anchor="start">One possible pattern—not an explanation of poverty.</text><text x="380" y="130" font-size="18" fill="#252c28" text-anchor="middle">Stated aim: suitable work</text><text x="66" y="177" font-size="14" fill="#252c28" text-anchor="start">CLIENT</text><text x="444" y="177" font-size="14" fill="#252c28" text-anchor="start">SERVICE</text><rect x="48" y="194" width="268" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="182.0" y="241.0" font-size="18" fill="#252c28" text-anchor="middle">Applications discussed;</text><text x="182.0" y="267.0" font-size="18" fill="#252c28" text-anchor="middle">none submitted</text><rect x="428" y="194" width="284" height="108" rx="8" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1"/><text x="570.0" y="241.0" font-size="18" fill="#252c28" text-anchor="middle">Activity recorded</text><text x="570.0" y="267.0" font-size="18" fill="#252c28" text-anchor="middle">as progress</text><path d="M316 236 H422" fill="none" stroke="#a6aca3" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M570 302 V359 H182 V308" fill="none" stroke="#a6aca3" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="380" y="348" font-size="16" fill="#252c28" text-anchor="middle">The same arrangement is renewed</text><path d="M48 248 H16 V481 H58" fill="none" stroke="#00855b" stroke-width="1.4"  marker-end="url(#green)"/><rect x="64" y="421" width="632" height="120" rx="8" fill="#edf5f0" stroke="#00855b" stroke-width="1"/><text x="380.0" y="474.0" font-size="18" fill="#252c28" text-anchor="middle">Clarify the goal, barriers, and support.</text><text x="380.0" y="500.0" font-size="18" fill="#252c28" text-anchor="middle">Agree a next step and review what happens.</text><text x="380" y="585" font-size="16" fill="#252c28" text-anchor="middle">These observations alone do not establish a game.</text><text x="380" y="616" font-size="16" fill="#252c28" text-anchor="middle">Support may remain necessary even when change occurs.</text></g></svg>