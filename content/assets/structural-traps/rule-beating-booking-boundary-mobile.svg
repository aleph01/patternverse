<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1598" viewBox="0 0 360 1598" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Separate requests can hide one commitment</title><desc id="desc">Hypothetical qualitative illustration. Related small requests for one planned purchase each pass a narrow amount check. The enclosing boundary shows their shared requirement. Linking that requirement and reviewing its total changes what is checked, with explanation and appeal for mistaken grouping. Change: Review the related overall requirement, with proportionate linkage and a legitimate exception route. Limitation: Genuine separate needs must not be merged arbitrarily. Review costs time; complete rules may already prohibit splitting.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Separate requests can hide one</tspan><tspan x="24" dy="28.35">commitment</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">One planned purchase, fragmented</tspan><tspan x="24" dy="24.3">records</tspan></text><rect x="16" y="206.75000000000003" width="328" height="474.0" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="24" y="242.75000000000003" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="269.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Small request</tspan></text><text x="40" y="298.45" fill="#626962" font-size="17"><tspan x="40" dy="0">Passes the narrow amount check.</tspan></text><rect x="24" y="404.75" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="431.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Related request</tspan></text><text x="40" y="460.45" fill="#626962" font-size="17"><tspan x="40" dy="0">Also passes separately.</tspan></text><rect x="24" y="566.75" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="593.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Another fragment</tspan></text><text x="40" y="622.45" fill="#626962" font-size="17"><tspan x="40" dy="0">Same overall requirement.</tspan></text><rect x="24" y="706.75" width="312" height="140.89999999999998" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="732.75" fill="#252c28" font-size="17"><tspan x="40" dy="0">Passing each amount check does</tspan><tspan x="40" dy="22.950000000000003">not establish compliance with a full</tspan><tspan x="40" dy="22.950000000000003">anti-splitting policy. The aggregate</tspan><tspan x="40" dy="22.950000000000003">commitment has escaped the</tspan><tspan x="40" dy="22.950000000000003">intended review.</tspan></text><text x="24" y="873.65" fill="#252c28" font-size="18"><tspan x="24" dy="0">Change the checked boundary</tspan></text><rect x="24" y="903.05" width="312" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="930.05" fill="#252c28" font-size="19"><tspan x="40" dy="0">Link the real requirement</tspan></text><text x="40" y="958.75" fill="#626962" font-size="17"><tspan x="40" dy="0">Explain grouping; allow correction</tspan><tspan x="40" dy="22.950000000000003">and appeal.</tspan></text><path d="M 180 1004.8 V 1080.8" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="1080.8" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1107.8" fill="#252c28" font-size="19"><tspan x="40" dy="0">Review total commitment</tspan></text><text x="40" y="1136.5" fill="#626962" font-size="17"><tspan x="40" dy="0">Approve, revise, defer, or reject the</tspan><tspan x="40" dy="22.950000000000003">complete plan.</tspan></text><text x="24" y="1224.55" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper cards are related records, not equal</tspan><tspan x="24" dy="21.6">spending quantities. The enclosing line</tspan><tspan x="24" dy="21.6">identifies one requirement. Lower arrows</tspan><tspan x="24" dy="21.6">show revised review steps, not money</tspan><tspan x="24" dy="21.6">flows.</tspan></text><rect x="24" y="1349.75" width="312" height="117.94999999999982" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1375.75" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Review the related overall</tspan><tspan x="40" dy="22.950000000000003">requirement, with proportionate</tspan><tspan x="40" dy="22.950000000000003">linkage and a legitimate exception</tspan><tspan x="40" dy="22.950000000000003">route.</tspan></text><text x="24" y="1493.6999999999998" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Genuine separate needs must not</tspan><tspan x="24" dy="22.950000000000003">be merged arbitrarily. Review costs</tspan><tspan x="24" dy="22.950000000000003">time; complete rules may already</tspan><tspan x="24" dy="22.950000000000003">prohibit splitting.</tspan></text></g></svg>
