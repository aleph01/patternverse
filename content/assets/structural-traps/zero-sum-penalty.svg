<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1002" viewBox="0 0 840 1002" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">One wants a match; the other wants a mismatch</title><desc id="desc">Hypothetical qualitative illustration. Lena’s shot and Marco’s dive each have Left and Right choices. Matching directions favor a save; different directions favor a goal. Marco wants to match while Lena wants to avoid a match. Physical execution is uncertain, so cells describe relative chances rather than certain results. The comparisons show alternative choices, not successive moves; neither participant observes the other’s current choice. Change: Keep choices privately unpredictable while recognizing the opposed objectives. Limitation: No strategy guarantees this kick. Unequal directional effectiveness changes suitable mixing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4" /></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4" /></marker></defs><rect width="100%" height="100%" fill="#ffffff" />
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">One wants a match; the other wants a mismatch</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="139.1" fill="#626962" font-size="17"><tspan x="24" dy="0">Lena ↓</tspan></text><text x="136" y="139.1" fill="#252c28" font-size="17"><tspan x="136" dy="0">Marco: Left</tspan></text><text x="506" y="139.1" fill="#252c28" font-size="17"><tspan x="506" dy="0">Marco: Right</tspan></text><text x="24" y="197.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Left</tspan></text><rect x="124" y="165.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="140" y="192.1" fill="#252c28" font-size="19"><tspan x="140" dy="0">Directions match</tspan></text><text x="140" y="220.79999999999998" fill="#626962" font-size="17"><tspan x="140" dy="0">Save more likely; Marco favors</tspan><tspan x="140" dy="22.950000000000003">matching.</tspan></text><rect x="494" y="165.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="510" y="192.1" fill="#252c28" font-size="19"><tspan x="510" dy="0">Directions differ</tspan></text><text x="510" y="220.79999999999998" fill="#626962" font-size="17"><tspan x="510" dy="0">Goal more likely; Lena favors</tspan><tspan x="510" dy="22.950000000000003">avoiding the dive.</tspan></text><text x="24" y="499.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Right</tspan></text><rect x="124" y="467.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="140" y="494.1" fill="#252c28" font-size="19"><tspan x="140" dy="0">Directions differ</tspan></text><text x="140" y="522.8" fill="#626962" font-size="17"><tspan x="140" dy="0">Goal more likely; Lena favors</tspan><tspan x="140" dy="22.950000000000003">avoiding the dive.</tspan></text><rect x="494" y="467.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="510" y="494.1" fill="#252c28" font-size="19"><tspan x="510" dy="0">Directions match</tspan></text><text x="510" y="522.8" fill="#626962" font-size="17"><tspan x="510" dy="0">Save more likely; Marco favors</tspan><tspan x="510" dy="22.950000000000003">matching.</tspan></text><rect x="24" y="733.1" width="792" height="72.05000000000007" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="759.1" fill="#252c28" font-size="17"><tspan x="40" dy="0">A predictable direction lets the opponent choose the favorable response. Private unpredictability</tspan><tspan x="40" dy="22.950000000000003">does not guarantee this kick.</tspan></text><text x="24" y="831.1500000000001" fill="#626962" font-size="16"><tspan x="24" dy="0">Rows are Lena’s shot; columns are Marco’s dive. Cells compare chances, not utility scores or certain</tspan><tspan x="24" dy="21.6">outcomes.</tspan></text><rect x="24" y="891.5500000000001" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2" /><text x="40" y="917.5500000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Keep choices privately unpredictable while recognizing the opposed objectives.</tspan></text><text x="24" y="966.6500000000001" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: No strategy guarantees this kick. Unequal directional effectiveness changes suitable mixing.</tspan></text></g></svg>
