<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1487" viewBox="0 0 360 1487" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">The normal cycle needs an initial seed</title><desc id="desc">Hypothetical qualitative illustration. Battery charge enables the starter and engine; the running engine enables later alternator charging. Without starting charge, the ordinary route has no first step. Compatible external energy enables the engine before its charging system can operate. Change: Supply a compatible starting source available before ordinary operation. Limitation: Assumes discharge only. Assistance costs resources; faults and the cause of discharge still need attention.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">The normal cycle needs an</tspan><tspan x="24" dy="28.35">initial seed</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Ordinary starting route · missing initial</tspan><tspan x="24" dy="24.3">charge</tspan></text><rect x="24" y="214.75000000000003" width="274" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Usable battery charge</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Powers the starter to turn the</tspan><tspan x="40" dy="22.950000000000003">engine.</tspan></text><rect x="24" y="416.5" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="443.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Running engine</tspan></text><text x="40" y="472.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Drives the alternator, which</tspan><tspan x="40" dy="22.950000000000003">can replenish charge.</tspan></text><path d="M 161 316.5 V 416.5" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="181" y="345.5" fill="#626962" font-size="16"><tspan x="181" dy="0">enables</tspan><tspan x="181" dy="21.6">starting</tspan></text><path d="M 298 467.375 H 336 V 265.625 H 298" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="554.25" fill="#626962" font-size="16"><tspan x="24" dy="0">Return: later engine-driven charging</tspan><tspan x="24" dy="21.6">replenishes stored energy.</tspan></text><text x="24" y="620.65" fill="#252c28" font-size="18"><tspan x="24" dy="0">External seed · same car and</tspan><tspan x="24" dy="24.3">operating requirement</tspan></text><rect x="24" y="674.3499999999999" width="312" height="86" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="701.3499999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Compatible external energy</tspan></text><text x="40" y="730.05" fill="#626962" font-size="17"><tspan x="40" dy="0">Available before the engine runs.</tspan></text><path d="M 180 760.3499999999999 V 836.3499999999999" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="836.3499999999999" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="863.3499999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Engine can start</tspan></text><text x="40" y="892.05" fill="#626962" font-size="17"><tspan x="40" dy="0">Assume the fault is discharged</tspan><tspan x="40" dy="22.950000000000003">charge only.</tspan></text><path d="M 180 938.0999999999999 V 1014.0999999999999" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="1014.0999999999999" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1041.1" fill="#252c28" font-size="19"><tspan x="40" dy="0">Charging can operate</tspan></text><text x="40" y="1069.8" fill="#626962" font-size="17"><tspan x="40" dy="0">A start is not proof of a sound</tspan><tspan x="40" dy="22.950000000000003">charging system.</tspan></text><text x="24" y="1157.85" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows show enabling</tspan><tspan x="24" dy="21.6">dependencies at different times; lower</tspan><tspan x="24" dy="21.6">arrows show the conditional starting</tspan><tspan x="24" dy="21.6">sequence. This is not a repair procedure.</tspan></text><rect x="24" y="1261.4499999999998" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1287.4499999999998" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Supply a compatible</tspan><tspan x="40" dy="22.950000000000003">starting source available before</tspan><tspan x="40" dy="22.950000000000003">ordinary operation.</tspan></text><text x="24" y="1382.4499999999998" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Assumes discharge only.</tspan><tspan x="24" dy="22.950000000000003">Assistance costs resources; faults and</tspan><tspan x="24" dy="22.950000000000003">the cause of discharge still need</tspan><tspan x="24" dy="22.950000000000003">attention.</tspan></text></g></svg>
