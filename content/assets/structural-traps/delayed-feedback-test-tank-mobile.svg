<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1604" viewBox="0 0 360 1604" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">The correction is still on its way</title><desc id="desc">Hypothetical qualitative illustration. Ada turns the shower mixer warmer. Earlier cool water still in the pipe arrives before the changed mixture. Repeating a large warmer turn can stack correction and later make the spray too hot. An alternative modest-adjustment procedure waits to assess the first change before repeating it; physical transit delay remains. One overshoot is shown here. Oscillation requires repeated reversals; delay alone does not establish it. Change: Coordinate adjustment size and timing with the physical response delay. Limitation: Supply and equipment are held steady here. Waiting takes time; changing delays, disturbances, and safe limits need separate control.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">The correction is still on its way</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="132.7" fill="#252c28" font-size="18"><tspan x="24" dy="0">A mixer change takes time to reach</tspan><tspan x="24" dy="24.3">the outlet</tspan></text><rect x="24" y="186.4" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="213.4" fill="#252c28" font-size="19"><tspan x="40" dy="0">Turn toward warmer</tspan></text><text x="40" y="242.1" fill="#626962" font-size="17"><tspan x="40" dy="0">Newly mixed water enters the pipe.</tspan></text><path d="M 180 272.4 V 348.4" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="348.4" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="375.4" fill="#252c28" font-size="19"><tspan x="40" dy="0">Earlier cool water arrives</tspan></text><text x="40" y="404.09999999999997" fill="#626962" font-size="17"><tspan x="40" dy="0">The first change is still in transit.</tspan></text><path d="M 180 434.4 V 510.4" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="510.4" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="537.4" fill="#252c28" font-size="19"><tspan x="40" dy="0">Changed water arrives later</tspan></text><text x="40" y="566.1" fill="#626962" font-size="17"><tspan x="40" dy="0">Its temperature reflects the earlier</tspan><tspan x="40" dy="22.950000000000003">setting.</tspan></text><text x="24" y="654.15" fill="#252c28" font-size="18"><tspan x="24" dy="0">While the earlier cool water still</tspan><tspan x="24" dy="24.3">arrives</tspan></text><rect x="24" y="707.8499999999999" width="312" height="127.39999999999998" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="734.8499999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">The first turn has not been felt</tspan><tspan x="40" dy="25.650000000000002">yet</tspan></text><text x="40" y="789.1999999999999" fill="#626962" font-size="17"><tspan x="40" dy="0">Same mixer, pipe, supply, and initial</tspan><tspan x="40" dy="22.950000000000003">condition.</tspan></text><rect x="62" y="911.2499999999999" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="78" y="938.2499999999999" fill="#252c28" font-size="19"><tspan x="78" dy="0">Repeat a large warmer turn</tspan></text><text x="78" y="966.9499999999999" fill="#626962" font-size="17"><tspan x="78" dy="0">Stacked correction can make</tspan><tspan x="78" dy="22.950000000000003">the later spray too hot.</tspan></text><rect x="62" y="1045.0" width="274" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="78" y="1072.0" fill="#252c28" font-size="19"><tspan x="78" dy="0">Let the first change arrive</tspan></text><text x="78" y="1100.7" fill="#626962" font-size="17"><tspan x="78" dy="0">Assess its effect before</tspan><tspan x="78" dy="22.950000000000003">another modest correction.</tspan></text><path d="M 180.0 835.2499999999999 V 867.2499999999999 H 36 V 1095.875" fill="none" stroke="#252c28" stroke-width="1.4"/><path d="M 36 962.1249999999999 H 62" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 36 1095.875 H 62" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><text x="24" y="1188.75" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows show mixing and arrival</tspan><tspan x="24" dy="21.6">order. Lower branches are alternative</tspan><tspan x="24" dy="21.6">decision procedures from the same</tspan><tspan x="24" dy="21.6">condition. No spacing represents elapsed</tspan><tspan x="24" dy="21.6">time or temperature. One overshoot is</tspan><tspan x="24" dy="21.6">shown here. Oscillation requires repeated</tspan><tspan x="24" dy="21.6">reversals; delay alone does not establish</tspan><tspan x="24" dy="21.6">it.</tspan></text><rect x="24" y="1378.75" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1404.75" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Coordinate adjustment</tspan><tspan x="40" dy="22.950000000000003">size and timing with the physical</tspan><tspan x="40" dy="22.950000000000003">response delay.</tspan></text><text x="24" y="1499.75" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Supply and equipment are held</tspan><tspan x="24" dy="22.950000000000003">steady here. Waiting takes time;</tspan><tspan x="24" dy="22.950000000000003">changing delays, disturbances, and</tspan><tspan x="24" dy="22.950000000000003">safe limits need separate control.</tspan></text></g></svg>
