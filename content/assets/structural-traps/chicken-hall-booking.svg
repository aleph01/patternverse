<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1025" viewBox="0 0 840 1025" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Each relies on the other giving way</title><desc id="desc">Hypothetical qualitative illustration. Ada and Karim choose press ahead or yield. One pressing while the other yields gives the presser priority; both pressing creates collision risk and is stipulated to be the least-preferred combination for both. Both yielding represents mutual caution under the stipulated middle ranking. Double outlines mark the two asymmetric equilibria. Controlled entry changes the available actions. Change: Replace unrestricted competing entry with authorized, reliable priority control. Limitation: Control and usable waiting space are assumed. Equipment can fail; the diagram is not a traffic-engineering specification.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Each relies on the other giving way</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="139.1" fill="#626962" font-size="17"><tspan x="24" dy="0">Ada ↓</tspan></text><text x="136" y="139.1" fill="#252c28" font-size="17"><tspan x="136" dy="0">Karim: Press</tspan></text><text x="506" y="139.1" fill="#252c28" font-size="17"><tspan x="506" dy="0">Karim: Yield</tspan></text><text x="24" y="197.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Press</tspan></text><rect x="124" y="165.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="140" y="192.1" fill="#252c28" font-size="19"><tspan x="140" dy="0">Both press ahead</tspan></text><text x="140" y="220.79999999999998" fill="#626962" font-size="17"><tspan x="140" dy="0">Collision risk; the least-preferred</tspan><tspan x="140" dy="22.950000000000003">combination for both in this model.</tspan></text><rect x="494" y="165.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="510" y="192.1" fill="#252c28" font-size="19"><tspan x="510" dy="0">Ada passes first</tspan></text><text x="510" y="220.79999999999998" fill="#626962" font-size="17"><tspan x="510" dy="0">Karim gives way.</tspan></text><rect x="498" y="169.1" width="314" height="218" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><text x="24" y="499.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Yield</tspan></text><rect x="124" y="467.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="140" y="494.1" fill="#252c28" font-size="19"><tspan x="140" dy="0">Karim passes first</tspan></text><text x="140" y="522.8" fill="#626962" font-size="17"><tspan x="140" dy="0">Ada gives way.</tspan></text><rect x="128" y="471.1" width="314" height="218" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><rect x="494" y="467.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="510" y="494.1" fill="#252c28" font-size="19"><tspan x="510" dy="0">Both use caution</tspan></text><text x="510" y="522.8" fill="#626962" font-size="17"><tspan x="510" dy="0">Neither claims priority; the middle</tspan><tspan x="510" dy="22.950000000000003">ranking is stipulated.</tspan></text><rect x="24" y="733.1" width="792" height="72.05000000000007" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="759.1" fill="#252c28" font-size="17"><tspan x="40" dy="0">Changed setting: an authorized entry control admits one direction at a time, then the other. It</tspan><tspan x="40" dy="22.950000000000003">removes unrestricted competing entry.</tspan></text><text x="24" y="831.1500000000001" fill="#626962" font-size="16"><tspan x="24" dy="0">Cells or cards compare alternative simultaneous choices, not vehicle movements. Double outlines mark the</tspan><tspan x="24" dy="21.6">original asymmetric equilibria. Collision risk is not quantified.</tspan></text><rect x="24" y="891.5500000000001" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="917.5500000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Replace unrestricted competing entry with authorized, reliable priority control.</tspan></text><text x="24" y="966.6500000000001" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Control and usable waiting space are assumed. Equipment can fail; the diagram is not a</tspan><tspan x="24" dy="22.950000000000003">traffic-engineering specification.</tspan></text></g></svg>
