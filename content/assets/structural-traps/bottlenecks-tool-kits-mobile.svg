<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1876" viewBox="0 0 360 1876" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Taking orders is faster than preparing drinks</title><desc id="desc">Hypothetical qualitative illustration. Paid orders queue before a limiting preparation station. More ticket storage cannot prepare drinks. An independently equipped trained barista can expand preparation, after which handover may become the next limit. The local queue and whole-process unfinished orders have different exit boundaries. Change: Increase usable preparation capacity or change accepted load, then reassess the whole process. Limitation: Staff and equipment cost money. Same machine access may prevent parallel work; quality and handover capacity remain.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Taking orders is faster than</tspan><tspan x="24" dy="28.35">preparing drinks</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Orders follow one required process</tspan></text><rect x="24" y="190.45000000000002" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="217.45000000000002" fill="#252c28" font-size="19"><tspan x="40" dy="0">Take payment</tspan></text><text x="40" y="246.15" fill="#626962" font-size="17"><tspan x="40" dy="0">Faster stage.</tspan></text><path d="M 180 276.45000000000005 V 352.45000000000005" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="352.45000000000005" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="379.45000000000005" fill="#252c28" font-size="19"><tspan x="40" dy="0">Paid orders waiting</tspan></text><text x="40" y="408.15000000000003" fill="#626962" font-size="17"><tspan x="40" dy="0">Queue before preparation.</tspan></text><path d="M 180 438.45000000000005 V 514.45" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="514.45" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="541.45" fill="#252c28" font-size="19"><tspan x="40" dy="0">Prepare drinks</tspan></text><text x="40" y="570.1500000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">Current limiting stage.</tspan></text><path d="M 180 600.45 V 676.45" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="676.45" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="703.45" fill="#252c28" font-size="19"><tspan x="40" dy="0">Hand over drinks</tspan></text><text x="40" y="732.1500000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">Required before completion.</tspan></text><rect x="24" y="804.45" width="312" height="140.89999999999998" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="830.45" fill="#252c28" font-size="17"><tspan x="40" dy="0">Queue stock: paid orders enter;</tspan><tspan x="40" dy="22.950000000000003">preparation starts remove them.</tspan><tspan x="40" dy="22.950000000000003">Whole-process stock ends only at</tspan><tspan x="40" dy="22.950000000000003">handover. More ticket space adds</tspan><tspan x="40" dy="22.950000000000003">no preparation capacity.</tspan></text><text x="24" y="971.35" fill="#252c28" font-size="18"><tspan x="24" dy="0">Change preparation capacity, then</tspan><tspan x="24" dy="24.3">check the next limit</tspan></text><rect x="24" y="1025.05" width="312" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1052.05" fill="#252c28" font-size="19"><tspan x="40" dy="0">Equip another barista</tspan></text><text x="40" y="1080.75" fill="#626962" font-size="17"><tspan x="40" dy="0">Usable parallel station; same</tspan><tspan x="40" dy="22.950000000000003">quality.</tspan></text><path d="M 180 1126.8 V 1202.8" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="1202.8" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1229.8" fill="#252c28" font-size="19"><tspan x="40" dy="0">More preparation possible</tspan></text><text x="40" y="1258.5" fill="#626962" font-size="17"><tspan x="40" dy="0">Backlog falls only if completion</tspan><tspan x="40" dy="22.950000000000003">exceeds new orders.</tspan></text><path d="M 180 1304.55 V 1380.55" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="1380.55" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1407.55" fill="#252c28" font-size="19"><tspan x="40" dy="0">Check handover capacity</tspan></text><text x="40" y="1436.25" fill="#626962" font-size="17"><tspan x="40" dy="0">A different stage can become</tspan><tspan x="40" dy="22.950000000000003">limiting.</tspan></text><text x="24" y="1524.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows transfer work. Lower arrows</tspan><tspan x="24" dy="21.6">show conditional intervention</tspan><tspan x="24" dy="21.6">consequences, not measured rates. No</tspan><tspan x="24" dy="21.6">box size represents a quantity.</tspan></text><rect x="24" y="1627.8999999999999" width="312" height="117.94999999999982" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1653.8999999999999" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Increase usable</tspan><tspan x="40" dy="22.950000000000003">preparation capacity or change</tspan><tspan x="40" dy="22.950000000000003">accepted load, then reassess the</tspan><tspan x="40" dy="22.950000000000003">whole process.</tspan></text><text x="24" y="1771.8499999999997" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Staff and equipment cost money.</tspan><tspan x="24" dy="22.950000000000003">Same machine access may prevent</tspan><tspan x="24" dy="22.950000000000003">parallel work; quality and handover</tspan><tspan x="24" dy="22.950000000000003">capacity remain.</tspan></text></g></svg>
