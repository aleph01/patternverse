<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1341" viewBox="0 0 360 1341" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Each prefers implicating against either choice</title><desc id="desc">Hypothetical qualitative illustration. Noor and Leo each choose silence or implication without seeing the other’s choice. Each prefers implicating against silence and against implication. Both implicating is the double-outlined equilibrium although both prefer mutual silence. No sentence lengths are invented. Change: An enforceable consequence or future interaction would change the game; a promise alone does not. Limitation: The original one-shot rankings stay decisive. No practical intervention in an actual investigation is prescribed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Each prefers implicating against</tspan><tspan x="24" dy="28.35">either choice</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Leo chooses Silent</tspan></text><rect x="24" y="190.45000000000002" width="274" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="217.45000000000002" fill="#252c28" font-size="19"><tspan x="40" dy="0">Both stay silent</tspan></text><text x="40" y="246.15" fill="#626962" font-size="17"><tspan x="40" dy="0">Noor: Silent. Better for each</tspan><tspan x="40" dy="22.950000000000003">than both implicating.</tspan></text><rect x="24" y="328.2" width="274" height="127.39999999999998" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="355.2" fill="#252c28" font-size="19"><tspan x="40" dy="0">Noor implicates; Leo stays</tspan><tspan x="40" dy="25.650000000000002">silent</tspan></text><text x="40" y="409.54999999999995" fill="#626962" font-size="17"><tspan x="40" dy="0">Noor: Implicate. Noor’s best;</tspan><tspan x="40" dy="22.950000000000003">Leo’s worst.</tspan></text><text x="24" y="491.59999999999997" fill="#252c28" font-size="18"><tspan x="24" dy="0">Leo chooses Implicate</tspan></text><rect x="24" y="521.0" width="274" height="127.39999999999998" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="548.0" fill="#252c28" font-size="19"><tspan x="40" dy="0">Noor stays silent; Leo</tspan><tspan x="40" dy="25.650000000000002">implicates</tspan></text><text x="40" y="602.35" fill="#626962" font-size="17"><tspan x="40" dy="0">Noor: Silent. Noor’s worst;</tspan><tspan x="40" dy="22.950000000000003">Leo’s best.</tspan></text><rect x="24" y="684.4" width="274" height="124.70000000000005" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="711.4" fill="#252c28" font-size="19"><tspan x="40" dy="0">Both implicate</tspan></text><text x="40" y="740.1" fill="#626962" font-size="17"><tspan x="40" dy="0">Noor: Implicate. The unique</tspan><tspan x="40" dy="22.950000000000003">equilibrium; worse for each</tspan><tspan x="40" dy="22.950000000000003">than mutual silence.</tspan></text><rect x="28" y="688.4" width="266" height="116.70000000000005" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><rect x="24" y="845.1" width="312" height="140.9000000000001" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="871.1" fill="#252c28" font-size="17"><tspan x="40" dy="0">For either choice by Leo, Noor</tspan><tspan x="40" dy="22.950000000000003">prefers implicating. For either</tspan><tspan x="40" dy="22.950000000000003">choice by Noor, Leo prefers</tspan><tspan x="40" dy="22.950000000000003">implicating. These compare</tspan><tspan x="40" dy="22.950000000000003">alternatives, not later moves.</tspan></text><text x="24" y="1012.0000000000001" fill="#626962" font-size="16"><tspan x="24" dy="0">Cells compare simultaneous alternatives,</tspan><tspan x="24" dy="21.6">not a sequence. Double outline marks</tspan><tspan x="24" dy="21.6">Nash equilibrium. “Best” and “worst” refer</tspan><tspan x="24" dy="21.6">only to the stated personal rankings.</tspan></text><rect x="24" y="1115.6000000000001" width="312" height="117.94999999999982" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1141.6000000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: An enforceable</tspan><tspan x="40" dy="22.950000000000003">consequence or future interaction</tspan><tspan x="40" dy="22.950000000000003">would change the game; a promise</tspan><tspan x="40" dy="22.950000000000003">alone does not.</tspan></text><text x="24" y="1259.55" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: The original one-shot rankings</tspan><tspan x="24" dy="22.950000000000003">stay decisive. No practical intervention</tspan><tspan x="24" dy="22.950000000000003">in an actual investigation is prescribed.</tspan></text></g></svg>
