<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1326" viewBox="0 0 360 1326" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Teaching to the test can crowd out other learning</title><desc id="desc">Hypothetical qualitative illustration. Alternative pre-teaching reward rules influence Jo’s allocation of finite teaching time between tested exercises and broader discussion and writing. A narrow bonus can favor real tested gains while displacing valuable untested work. Revised terms moderate the bonus and protect broader teaching. Change: Moderate the narrow reward and protect valuable learning outside the measure. Limitation: Less concentrated test preparation can lower reported gains. Broader learning and the effects of review still need evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Teaching to the test can crowd</tspan><tspan x="24" dy="28.35">out other learning</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Alternative terms · agreed before</tspan><tspan x="24" dy="24.3">teaching</tspan></text><rect x="24" y="214.75000000000003" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Narrow test bonus</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Rewards tested results strongly.</tspan></text><rect x="24" y="376.75" width="312" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="403.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Revised terms</tspan></text><text x="40" y="432.45" fill="#626962" font-size="17"><tspan x="40" dy="0">Moderate bonus; protect broader</tspan><tspan x="40" dy="22.950000000000003">teaching.</tspan></text><rect x="24" y="520.5" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="547.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Jo’s finite teaching time</tspan></text><text x="40" y="576.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Time devoted to one duty is</tspan><tspan x="40" dy="22.950000000000003">unavailable to the other.</tspan></text><rect x="62" y="698.25" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="78" y="725.25" fill="#252c28" font-size="19"><tspan x="78" dy="0">Tested exercises</tspan></text><text x="78" y="753.95" fill="#626962" font-size="17"><tspan x="78" dy="0">Real gains can improve</tspan><tspan x="78" dy="22.950000000000003">reported results.</tspan></text><rect x="62" y="832.0" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="78" y="859.0" fill="#252c28" font-size="19"><tspan x="78" dy="0">Discussion and writing</tspan></text><text x="78" y="887.7" fill="#626962" font-size="17"><tspan x="78" dy="0">Valuable work outside the</tspan><tspan x="78" dy="22.950000000000003">test’s narrow scope.</tspan></text><path d="M 180.0 622.25 V 654.25 H 36 V 882.875" fill="none" stroke="#252c28" stroke-width="1.4"/><path d="M 36 749.125 H 62" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 36 882.875 H 62" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 24 257.75 H 12 V 571.375 H 24" fill="none" stroke="#252c28" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M 336 427.625 H 348 V 571.375 H 336" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><text x="24" y="975.75" fill="#626962" font-size="16"><tspan x="24" dy="0">Dashed and green inputs are alternative</tspan><tspan x="24" dy="21.6">reward rules, not simultaneous payments.</tspan><tspan x="24" dy="21.6">Branches allocate finite attention; their</tspan><tspan x="24" dy="21.6">sizes show no quantities or learning</tspan><tspan x="24" dy="21.6">effects.</tspan></text><rect x="24" y="1100.95" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1126.95" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Moderate the narrow</tspan><tspan x="40" dy="22.950000000000003">reward and protect valuable</tspan><tspan x="40" dy="22.950000000000003">learning outside the measure.</tspan></text><text x="24" y="1221.95" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Less concentrated test</tspan><tspan x="24" dy="22.950000000000003">preparation can lower reported gains.</tspan><tspan x="24" dy="22.950000000000003">Broader learning and the effects of</tspan><tspan x="24" dy="22.950000000000003">review still need evidence.</tspan></text></g></svg>
