<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2659" viewBox="0 0 360 2659" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Withdrawals can exhaust support and damage its renewal</title><desc id="desc">Hypothetical stock-and-flow and causal comparison. Regrowth adds to the forage reserve; grazing removes it. Rosa’s growing herd commitments increase grazing pressure. When grazing exceeds regrowth, the reserve supplies the difference. A reinforcing damage loop links lower reserve, reduced protective cover, weakened regrowth capacity, and less replenishment. Exhausted or damaged support can force a severe reduction in herd or output. Early limits on commitments can preserve renewal, with lower short-term production.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.3"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.3"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Withdrawals can exhaust</tspan><tspan x="24" dy="28.35">support and damage its</tspan><tspan x="24" dy="28.35">renewal</tspan></text><text x="24" y="124.95" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · causal</tspan><tspan x="24" dy="21.6">relationships</tspan></text><rect x="24" y="180.55" width="312" height="225.8" rx="3" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="209.55" fill="#252c28" font-size="18"><tspan x="40" dy="0">Growing commitments increase</tspan><tspan x="40" dy="24.3">grazing pressure</tspan></text><text x="40" y="265.35" fill="#626962" font-size="17"><tspan x="40" dy="0">Rosa expands the herd after</tspan><tspan x="40" dy="22.950000000000003">successful seasons. When</tspan><tspan x="40" dy="22.950000000000003">grazing exceeds regrowth, the</tspan><tspan x="40" dy="22.950000000000003">reserve supplies the gap;</tspan><tspan x="40" dy="22.950000000000003">stopping expansion can leave</tspan><tspan x="40" dy="22.950000000000003">that deficit in place.</tspan></text><text x="24" y="438.35" fill="#252c28" font-size="18"><tspan x="24" dy="0">Forage transfers · stock and</tspan><tspan x="24" dy="24.3">flows</tspan></text><rect x="24" y="503.15000000000003" width="274" height="144" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="531.1500000000001" fill="#252c28" font-size="19"><tspan x="40" dy="0">Regrowth · inflow</tspan></text><text x="40" y="559.9000000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">New forage enters the</tspan><tspan x="40" dy="22.950000000000003">reserve.</tspan></text><rect x="24" y="737.1500000000001" width="274" height="144" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="765.1500000000001" fill="#252c28" font-size="19"><tspan x="40" dy="0">Forage reserve · stock</tspan></text><text x="40" y="793.9000000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">Accumulated support for</tspan><tspan x="40" dy="22.950000000000003">Rosa’s herd.</tspan></text><rect x="24" y="971.1500000000001" width="274" height="144" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="999.1500000000001" fill="#252c28" font-size="19"><tspan x="40" dy="0">Grazing · outflow</tspan></text><text x="40" y="1027.9" fill="#626962" font-size="17"><tspan x="40" dy="0">The herd removes forage</tspan><tspan x="40" dy="22.950000000000003">from the reserve.</tspan></text><path d="M 161 647.1500000000001 V 737.1500000000001" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="181" y="672.1500000000001" fill="#626962" font-size="16"><tspan x="181" dy="0">adds</tspan></text><path d="M 161 881.1500000000001 V 971.1500000000001" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="181" y="906.1500000000001" fill="#626962" font-size="16"><tspan x="181" dy="0">takes</tspan></text><text x="24" y="1161.15" fill="#252c28" font-size="18"><tspan x="24" dy="0">Damage to renewal · reinforcing</tspan><tspan x="24" dy="24.3">causal loop</tspan></text><rect x="24" y="1225.95" width="274" height="144" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1253.95" fill="#252c28" font-size="19"><tspan x="40" dy="0">Forage reserve</tspan></text><text x="40" y="1282.7" fill="#626962" font-size="17"><tspan x="40" dy="0">Stored vegetation supports</tspan><tspan x="40" dy="22.950000000000003">cover.</tspan></text><rect x="24" y="1459.95" width="274" height="144" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1487.95" fill="#252c28" font-size="19"><tspan x="40" dy="0">Protective cover</tspan></text><text x="40" y="1516.7" fill="#626962" font-size="17"><tspan x="40" dy="0">Remaining cover supports</tspan><tspan x="40" dy="22.950000000000003">renewal.</tspan></text><rect x="24" y="1693.95" width="274" height="144" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1721.95" fill="#252c28" font-size="19"><tspan x="40" dy="0">Regrowth capacity</tspan></text><text x="40" y="1750.7" fill="#626962" font-size="17"><tspan x="40" dy="0">The pasture’s ability to</tspan><tspan x="40" dy="22.950000000000003">renew forage.</tspan></text><path d="M 161 1369.95 V 1459.95" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="181" y="1394.95" fill="#626962" font-size="16"><tspan x="181" dy="0">supports cover</tspan></text><path d="M 161 1603.95 V 1693.95" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="181" y="1628.95" fill="#626962" font-size="16"><tspan x="181" dy="0">supports</tspan><tspan x="181" dy="21.6">renewal</tspan></text><path d="M 161 1837.95 V 1855.95 H 336 V 1209.95 H 161 V 1225.95" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="24" y="1889.95" fill="#626962" font-size="16"><tspan x="24" dy="0">Return: regrowth replenishes the</tspan><tspan x="24" dy="21.6">reserve.</tspan></text><rect x="24" y="1961.55" width="312" height="225.79999999999995" rx="3" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1990.55" fill="#252c28" font-size="18"><tspan x="40" dy="0">When support is exhausted or</tspan><tspan x="40" dy="24.3">damaged</tspan></text><text x="40" y="2046.35" fill="#626962" font-size="17"><tspan x="40" dy="0">Insufficient forage can force a</tspan><tspan x="40" dy="22.950000000000003">severe reduction in the herd or</tspan><tspan x="40" dy="22.950000000000003">its output: collapse. Renewal</tspan><tspan x="40" dy="22.950000000000003">damage can make the former herd</tspan><tspan x="40" dy="22.950000000000003">size unsupportable even after</tspan><tspan x="40" dy="22.950000000000003">grazing is reduced.</tspan></text><text x="24" y="2219.35" fill="#626962" font-size="16"><tspan x="24" dy="0">First panel: arrows transfer forage.</tspan><tspan x="24" dy="21.6">Second panel: arrows are</tspan><tspan x="24" dy="21.6">hypothesized causal effects, not</tspan><tspan x="24" dy="21.6">chronology.</tspan></text><rect x="24" y="2318.15" width="312" height="155.9000000000001" rx="3" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="2346.15" fill="#252c28" font-size="18"><tspan x="40" dy="0">Change the relationship</tspan></text><text x="40" y="2376.65" fill="#252c28" font-size="18"><tspan x="40" dy="0">Limit new commitments before</tspan><tspan x="40" dy="24.3">damage, monitor renewal, and</tspan><tspan x="40" dy="24.3">fund any needed reduction or</tspan><tspan x="40" dy="24.3">restoration.</tspan></text><text x="24" y="2510.05" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Reserve use can be</tspan><tspan x="24" dy="22.950000000000003">sustainable when later</tspan><tspan x="24" dy="22.950000000000003">replenishment restores it. Damage</tspan><tspan x="24" dy="22.950000000000003">is an explicit hypothesis here;</tspan><tspan x="24" dy="22.950000000000003">collapse and irreversible loss are</tspan><tspan x="24" dy="22.950000000000003">not inevitable.</tspan></text></g></svg>
