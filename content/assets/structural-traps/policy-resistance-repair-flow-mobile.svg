<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1888" viewBox="0 0 360 1888" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">A wider road can attract more driving</title><desc id="desc">Hypothetical qualitative illustration. Added road capacity can reduce journey time, making driving more attractive and adding peak demand. The resulting congestion offsets part of the initial relief. A proposed peak charge with usable alternatives changes choices and requires wider monitoring. Change: Plan for behavioral responses and change incentives or feasible alternatives where authorized. Limitation: Access, affordability, diversion, implementation, and long-term development can limit or reverse the intended benefit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">A wider road can attract more</tspan><tspan x="24" dy="28.35">driving</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><rect x="24" y="161.05" width="312" height="117.95000000000005" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="187.05" fill="#252c28" font-size="17"><tspan x="40" dy="0">Initial intervention: added usable</tspan><tspan x="40" dy="22.950000000000003">road capacity can reduce journey</tspan><tspan x="40" dy="22.950000000000003">time. That change enters the</tspan><tspan x="40" dy="22.950000000000003">response loop below.</tspan></text><text x="24" y="305.00000000000006" fill="#252c28" font-size="18"><tspan x="24" dy="0">Balancing response · opposite effects</tspan><tspan x="24" dy="24.3">are written out</tspan></text><rect x="24" y="358.70000000000005" width="274" height="124.69999999999999" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="385.70000000000005" fill="#252c28" font-size="19"><tspan x="40" dy="0">Perceived journey time</tspan></text><text x="40" y="414.40000000000003" fill="#626962" font-size="17"><tspan x="40" dy="0">Longer journeys discourage</tspan><tspan x="40" dy="22.950000000000003">some peak driving; shorter</tspan><tspan x="40" dy="22.950000000000003">journeys attract it.</tspan></text><rect x="24" y="583.4000000000001" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="610.4000000000001" fill="#252c28" font-size="19"><tspan x="40" dy="0">Peak driving demand</tspan></text><text x="40" y="639.1000000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">More vehicles using the road</tspan><tspan x="40" dy="22.950000000000003">can lengthen journeys.</tspan></text><path d="M 161 483.40000000000003 V 583.4000000000001" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="181" y="512.4000000000001" fill="#626962" font-size="16"><tspan x="181" dy="0">longer time</tspan><tspan x="181" dy="21.6">discourages</tspan><tspan x="181" dy="21.6">driving</tspan></text><path d="M 298 634.2750000000001 H 336 V 421.05000000000007 H 298" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="721.1500000000001" fill="#626962" font-size="16"><tspan x="24" dy="0">Return: more driving increases journey</tspan><tspan x="24" dy="21.6">time, offsetting initial relief.</tspan></text><rect x="24" y="787.5500000000001" width="312" height="163.85000000000002" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="813.5500000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Fast responses: route and</tspan><tspan x="40" dy="22.950000000000003">departure changes. Slower</tspan><tspan x="40" dy="22.950000000000003">responses: new trips, commercial</tspan><tspan x="40" dy="22.950000000000003">activity, and location choices. A</tspan><tspan x="40" dy="22.950000000000003">rebound alone does not prove</tspan><tspan x="40" dy="22.950000000000003">induced demand.</tspan></text><text x="24" y="977.4000000000001" fill="#252c28" font-size="18"><tspan x="24" dy="0">Proposed package · changes choices</tspan><tspan x="24" dy="24.3">and their costs</tspan></text><rect x="24" y="1031.1" width="312" height="86" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1058.1" fill="#252c28" font-size="19"><tspan x="40" dy="0">Authorized peak charge</tspan></text><text x="40" y="1086.8" fill="#626962" font-size="17"><tspan x="40" dy="0">With genuinely usable alternatives.</tspan></text><path d="M 180 1117.1 V 1193.1" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="1193.1" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1220.1" fill="#252c28" font-size="19"><tspan x="40" dy="0">Travel choices respond</tspan></text><text x="40" y="1248.8" fill="#626962" font-size="17"><tspan x="40" dy="0">Some users pay, reschedule,</tspan><tspan x="40" dy="22.950000000000003">reroute, or change mode.</tspan></text><path d="M 180 1294.85 V 1370.85" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="1370.85" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1397.85" fill="#252c28" font-size="19"><tspan x="40" dy="0">Review regional effects</tspan></text><text x="40" y="1426.55" fill="#626962" font-size="17"><tspan x="40" dy="0">Check access, diversion, and</tspan><tspan x="40" dy="22.950000000000003">delayed responses.</tspan></text><text x="24" y="1514.6" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows show hypothesized causal</tspan><tspan x="24" dy="21.6">effects; the return label describes</tspan><tspan x="24" dy="21.6">opposition to the initial relief. Lower</tspan><tspan x="24" dy="21.6">arrows show a proposed policy sequence,</tspan><tspan x="24" dy="21.6">not measured effects.</tspan></text><rect x="24" y="1639.8" width="312" height="117.94999999999982" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1665.8" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Plan for behavioral</tspan><tspan x="40" dy="22.950000000000003">responses and change incentives or</tspan><tspan x="40" dy="22.950000000000003">feasible alternatives where</tspan><tspan x="40" dy="22.950000000000003">authorized.</tspan></text><text x="24" y="1783.7499999999998" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Access, affordability, diversion,</tspan><tspan x="24" dy="22.950000000000003">implementation, and long-term</tspan><tspan x="24" dy="22.950000000000003">development can limit or reverse the</tspan><tspan x="24" dy="22.950000000000003">intended benefit.</tspan></text></g></svg>
