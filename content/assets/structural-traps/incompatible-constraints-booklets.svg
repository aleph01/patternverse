<svg xmlns="http://www.w3.org/2000/svg" width="840" height="727" viewBox="0 0 840 727" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">The last usable train leaves before work permits departure</title><desc id="desc">Hypothetical qualitative illustration. Originally the last train meeting the arrival requirement leaves before Mara is allowed to leave work. The revised authorization moves her permitted departure before the same train, with work covered. The train and performance time do not change. Change: Authorize a covered earlier finish, or explicitly change another requirement. Limitation: Coverage has a cost. A feasible timetable is not a guarantee of punctual arrival.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">The last usable train leaves before work permits departure</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Original order · no qualifying journey</tspan></text><rect x="24.0" y="140.5" width="366.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="167.5" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Last usable train leaves</tspan></text><text x="40.0" y="196.2" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Only this train meets the arrival</tspan><tspan x="40.0" dy="22.950000000000003">requirement.</tspan></text><rect x="450.0" y="140.5" width="366.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="466.0" y="167.5" fill="#252c28" font-size="19"><tspan x="466.0" dy="0">Work permits departure</tspan></text><text x="466.0" y="196.2" fill="#626962" font-size="17"><tspan x="466.0" dy="0">Too late to take that train.</tspan></text><path d="M 390.0 191.375 H 450.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="284.25" width="792" height="72.05000000000001" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="310.25" fill="#252c28" font-size="17"><tspan x="40" dy="0">A later train misses the required arrival. Other permitted, affordable routes are excluded by the</tspan><tspan x="40" dy="22.950000000000003">stated example.</tspan></text><text x="24" y="382.3" fill="#252c28" font-size="18"><tspan x="24" dy="0">Revised authorization · same train and performance</tspan></text><rect x="24.0" y="411.7" width="224.0" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="438.7" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Covered early finish</tspan></text><text x="40.0" y="467.4" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Manager authorizes</tspan><tspan x="40.0" dy="22.950000000000003">leaving work earlier.</tspan></text><rect x="308.0" y="411.7" width="224.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="438.7" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Take the same train</tspan></text><text x="324.0" y="467.4" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Permitted departure</tspan><tspan x="324.0" dy="22.950000000000003">now precedes it.</tspan></text><rect x="592.0" y="411.7" width="224.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="438.7" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Arrive before the start</tspan></text><text x="608.0" y="467.4" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Punctual running is still</tspan><tspan x="608.0" dy="22.950000000000003">assumed.</tspan></text><path d="M 248.0 462.575 H 308.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><path d="M 532.0 462.575 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="555.45" fill="#626962" font-size="16"><tspan x="24" dy="0">Arrows show chronology only. Different rows are alternative authorizations, not consecutive attempts; spacing</tspan><tspan x="24" dy="21.6">is not a time scale.</tspan></text><rect x="24" y="615.85" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="641.85" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Authorize a covered earlier finish, or explicitly change another requirement.</tspan></text><text x="24" y="690.95" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Coverage has a cost. A feasible timetable is not a guarantee of punctual arrival.</tspan></text></g></svg>
