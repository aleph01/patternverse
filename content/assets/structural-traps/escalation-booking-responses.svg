<svg xmlns="http://www.w3.org/2000/svg" width="840" height="943" viewBox="0 0 840 943" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">A defensive buildup can prompt another buildup</title><desc id="desc">Hypothetical qualitative illustration. Eastland’s perceived shortfall prompts arms procurement, which contributes to Westland’s perceived threat and procurement, feeding Eastland’s concern. Orders await delivery; deliveries and retirements change arms held. A proposed reciprocal limit includes pending deliveries and credible verification. Change: Replace automatic matching with defined, observable reciprocal limits where feasible. Limitation: Verification costs resources; breach, other threats, and unequal power can prevent restraint or make it costly.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">A defensive buildup can prompt another buildup</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Hypothesized reciprocal response · not a history</tspan></text><rect x="24" y="140.5" width="330" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="167.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Eastland perceives a shortfall</tspan></text><text x="40" y="196.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Westland’s buildup becomes its</tspan><tspan x="40" dy="22.950000000000003">reference.</tspan></text><rect x="486" y="140.5" width="330" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="502" y="167.5" fill="#252c28" font-size="19"><tspan x="502" dy="0">Eastland orders more arms</tspan></text><text x="502" y="196.2" fill="#626962" font-size="17"><tspan x="502" dy="0">Deliveries follow after a delay.</tspan></text><rect x="486" y="332.25" width="330" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="502" y="359.25" fill="#252c28" font-size="19"><tspan x="502" dy="0">Westland perceives a threat</tspan></text><text x="502" y="387.95" fill="#626962" font-size="17"><tspan x="502" dy="0">Eastland’s buildup becomes its</tspan><tspan x="502" dy="22.950000000000003">reference.</tspan></text><rect x="24" y="332.25" width="330" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="359.25" fill="#252c28" font-size="19"><tspan x="40" dy="0">Westland orders more arms</tspan></text><text x="40" y="387.95" fill="#626962" font-size="17"><tspan x="40" dy="0">Its later buildup feeds Eastland’s</tspan><tspan x="40" dy="22.950000000000003">concern.</tspan></text><path d="M 354 191.375 H 486" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 651.0 226.5 V 332.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 486 383.125 H 354" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 189.0 332.25 V 242.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="478.0" width="792" height="72.05000000000007" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="504.0" fill="#252c28" font-size="17"><tspan x="40" dy="0">Orders are a pipeline. Deliveries add to arms held; retirement removes them. Pausing new orders</tspan><tspan x="40" dy="22.950000000000003">does not itself reduce that stock.</tspan></text><text x="24" y="576.0500000000001" fill="#252c28" font-size="18"><tspan x="24" dy="0">Changed response relationship · conditional on compliance</tspan></text><rect x="24.0" y="605.45" width="366.0" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="632.45" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Define reciprocal limits</tspan></text><text x="40.0" y="661.1500000000001" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Include covered stock and pending</tspan><tspan x="40.0" dy="22.950000000000003">deliveries.</tspan></text><rect x="450.0" y="605.45" width="366.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="466.0" y="632.45" fill="#252c28" font-size="19"><tspan x="466.0" dy="0">Verify restraint</tspan></text><text x="466.0" y="661.1500000000001" fill="#626962" font-size="17"><tspan x="466.0" dy="0">Use agreed observation and breach</tspan><tspan x="466.0" dy="22.950000000000003">procedures.</tspan></text><path d="M 390.0 656.325 H 450.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><text x="24" y="749.2" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows are hypothesized causal effects, not chronology or material transfers. Lower arrows show the</tspan><tspan x="24" dy="21.6">proposed agreement process. Arms held accumulate through delivery minus retirement.</tspan></text><rect x="24" y="809.6" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="835.6" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Replace automatic matching with defined, observable reciprocal limits where feasible.</tspan></text><text x="24" y="884.7" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Verification costs resources; breach, other threats, and unequal power can prevent restraint or</tspan><tspan x="24" dy="22.950000000000003">make it costly.</tspan></text></g></svg>
