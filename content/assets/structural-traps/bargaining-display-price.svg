<svg xmlns="http://www.w3.org/2000/svg" width="840" height="648" viewBox="0 0 840 648" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">A possible sale leaves the price unsettled</title><desc id="desc">Hypothetical qualitative illustration. Prices below Dev’s acceptance minimum fail for the seller; prices above Mira’s maximum fail for the buyer. The interval between permits agreement on the same known bicycle. A higher price within that overlap favors Dev and a lower price favors Mira. Change: Establish real alternatives and select acceptable enforceable terms within the overlap. Limitation: Private limits may be hard to learn. No overlap requires a changed package or no sale; fairness remains open.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">A possible sale leaves the price unsettled</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><rect x="24" y="111.1" width="792" height="72.05000000000001" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="137.1" fill="#252c28" font-size="17"><tspan x="40" dy="0">Same bicycle, known condition and included items. Dev accepts at or above his minimum; Mira</tspan><tspan x="40" dy="22.950000000000003">accepts at or below her maximum.</tspan></text><rect x="24.0" y="209.15" width="224.0" height="104.45000000000002" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="236.15" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Below Dev’s</tspan><tspan x="40.0" dy="25.650000000000002">minimum</tspan></text><text x="40.0" y="290.5" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Dev rejects.</tspan></text><rect x="308.0" y="209.15" width="224.0" height="104.45000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="324.0" y="236.15" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Mutually acceptable</tspan><tspan x="324.0" dy="25.650000000000002">range</tspan></text><text x="324.0" y="290.5" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Both can accept.</tspan></text><rect x="592.0" y="209.15" width="224.0" height="104.45000000000002" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="236.15" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Above Mira’s</tspan><tspan x="608.0" dy="25.650000000000002">maximum</tspan></text><text x="608.0" y="290.5" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Mira rejects.</tspan></text><rect x="24" y="355.6" width="792" height="72.05000000000001" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="381.6" fill="#252c28" font-size="17"><tspan x="40" dy="0">Read in increasing price order. Regions show acceptance only, not monetary distances. A higher</tspan><tspan x="40" dy="22.950000000000003">price inside the overlap favors Dev; a lower one favors Mira.</tspan></text><text x="24" y="453.65000000000003" fill="#626962" font-size="16"><tspan x="24" dy="0">Cards are alternative price regions, not chronological steps or utility quantities. Green marks the agreement</tspan><tspan x="24" dy="21.6">region; the words also identify it.</tspan></text><rect x="24" y="514.0500000000001" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="540.0500000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Establish real alternatives and select acceptable enforceable terms within the overlap.</tspan></text><text x="24" y="589.1500000000001" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Private limits may be hard to learn. No overlap requires a changed package or no sale; fairness</tspan><tspan x="24" dy="22.950000000000003">remains open.</tspan></text></g></svg>
