<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1739" viewBox="0 0 360 1739" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Reserve control before the camera is sent</title><desc id="desc">Hypothetical qualitative illustration. In the unsecured sale Ira sends the camera before Sam chooses whether to pay. In the revised arrangement an independent holder reserves payment before dispatch and releases it after verified satisfactory delivery. Sam cannot unilaterally divert that payment; Ira still funds earlier costs. Change: Reserve payment under reliable independent control before dispatch, with clear release and failure rules. Limitation: No named platform is modeled. Satisfactory delivery must be verifiable; secure later payment does not fund earlier costs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Reserve control before the</tspan><tspan x="24" dy="28.35">camera is sent</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Unsecured proposal · seller moves</tspan><tspan x="24" dy="24.3">first</tspan></text><rect x="24" y="214.75000000000003" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Ira dispatches the camera</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Pays packing and postage.</tspan></text><path d="M 180 300.75 V 376.75" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="376.75" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="403.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Sam receives it</tspan></text><text x="40" y="432.45" fill="#626962" font-size="17"><tspan x="40" dy="0">Camera and payment are under his</tspan><tspan x="40" dy="22.950000000000003">control.</tspan></text><path d="M 180 478.5 V 554.5" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="554.5" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="581.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Sam chooses whether to pay</tspan></text><text x="40" y="610.2" fill="#626962" font-size="17"><tspan x="40" dy="0">The promise leaves a later option to</tspan><tspan x="40" dy="22.950000000000003">withhold.</tspan></text><text x="24" y="698.25" fill="#252c28" font-size="18"><tspan x="24" dy="0">Protected payment · before the</tspan><tspan x="24" dy="24.3">vulnerable action</tspan></text><rect x="24" y="751.9499999999999" width="312" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="778.9499999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Reserve payment</tspan></text><text x="40" y="807.65" fill="#626962" font-size="17"><tspan x="40" dy="0">Independent custody before</tspan><tspan x="40" dy="22.950000000000003">dispatch.</tspan></text><path d="M 180 853.6999999999999 V 929.6999999999999" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="929.6999999999999" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="956.6999999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Ira dispatches</tspan></text><text x="40" y="985.4" fill="#626962" font-size="17"><tspan x="40" dy="0">Still funds costs before release.</tspan></text><path d="M 180 1015.6999999999999 V 1091.6999999999998" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="1091.6999999999998" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1118.6999999999998" fill="#252c28" font-size="19"><tspan x="40" dy="0">Verify satisfactory delivery</tspan></text><text x="40" y="1147.3999999999999" fill="#626962" font-size="17"><tspan x="40" dy="0">Then release under the agreed rule.</tspan></text><rect x="24" y="1219.6999999999998" width="312" height="140.89999999999986" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1245.6999999999998" fill="#252c28" font-size="17"><tspan x="40" dy="0">Sam cannot unilaterally cancel</tspan><tspan x="40" dy="22.950000000000003">release after verified satisfactory</tspan><tspan x="40" dy="22.950000000000003">delivery. Non-delivery does not pay</tspan><tspan x="40" dy="22.950000000000003">Ira; defined return and dispute rules</tspan><tspan x="40" dy="22.950000000000003">are still required.</tspan></text><text x="24" y="1386.5999999999997" fill="#626962" font-size="16"><tspan x="24" dy="0">Arrows show transaction chronology. The</tspan><tspan x="24" dy="21.6">lower row is an alternative arrangement;</tspan><tspan x="24" dy="21.6">verification authorizes release rather than</tspan><tspan x="24" dy="21.6">guaranteeing it.</tspan></text><rect x="24" y="1490.1999999999996" width="312" height="117.94999999999982" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1516.1999999999996" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Reserve payment under</tspan><tspan x="40" dy="22.950000000000003">reliable independent control before</tspan><tspan x="40" dy="22.950000000000003">dispatch, with clear release and</tspan><tspan x="40" dy="22.950000000000003">failure rules.</tspan></text><text x="24" y="1634.1499999999994" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: No named platform is modeled.</tspan><tspan x="24" dy="22.950000000000003">Satisfactory delivery must be verifiable;</tspan><tspan x="24" dy="22.950000000000003">secure later payment does not fund</tspan><tspan x="24" dy="22.950000000000003">earlier costs.</tspan></text></g></svg>
