<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1219" viewBox="0 0 840 1219" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Payment comes before a discretionary response</title><desc id="desc">Hypothetical qualitative illustration. After a full payment, Omar can send or withhold the described goods. A separable small order lowers Maya’s affordable exposure but leaves the same two responses available. The practical trial assumes uncertainty about his preferences, unlike the known-selfish-preferences benchmark. Change: Use relevant evidence and an affordable separable trial where appropriate, or change control through protection. Limitation: Maya can still lose the exposed payment. No universal trust threshold or guarantee of future honesty follows.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Payment comes before a discretionary response</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Full order paid before dispatch</tspan></text><rect x="260" y="140.5" width="320" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="276" y="167.5" fill="#252c28" font-size="19"><tspan x="276" dy="0">Maya pays; Omar controls</tspan><tspan x="276" dy="25.650000000000002">dispatch</tspan></text><text x="276" y="221.85" fill="#626962" font-size="17"><tspan x="276" dy="0">No effective payment protection in</tspan><tspan x="276" dy="22.950000000000003">this benchmark.</tspan></text><rect x="24" y="363.9" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="390.9" fill="#252c28" font-size="19"><tspan x="40" dy="0">Send the described goods</tspan></text><text x="40" y="419.59999999999997" fill="#626962" font-size="17"><tspan x="40" dy="0">A voluntary response; shipping</tspan><tspan x="40" dy="22.950000000000003">risk can remain.</tspan></text><rect x="516" y="363.9" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="532" y="390.9" fill="#252c28" font-size="19"><tspan x="532" dy="0">Withhold the goods</tspan></text><text x="532" y="419.59999999999997" fill="#626962" font-size="17"><tspan x="532" dy="0">Maya can still lose the exposed</tspan><tspan x="532" dy="22.950000000000003">payment.</tspan></text><path d="M 420.0 267.9 V 323.9" fill="none" stroke="#252c28" stroke-width="1.4"/><path d="M 420.0 323.9 H 174.0 V 363.9" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 420.0 323.9 H 666.0 V 363.9" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="507.65" fill="#252c28" font-size="18"><tspan x="24" dy="0">Separable small order</tspan></text><rect x="260" y="537.05" width="320" height="127.39999999999998" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="276" y="564.05" fill="#252c28" font-size="19"><tspan x="276" dy="0">Maya pays; Omar controls</tspan><tspan x="276" dy="25.650000000000002">dispatch</tspan></text><text x="276" y="618.4" fill="#626962" font-size="17"><tspan x="276" dy="0">Smaller affordable exposure;</tspan><tspan x="276" dy="22.950000000000003">preferences uncertain.</tspan></text><rect x="24" y="760.4499999999999" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="787.4499999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Send the described goods</tspan></text><text x="40" y="816.15" fill="#626962" font-size="17"><tspan x="40" dy="0">A voluntary response; shipping</tspan><tspan x="40" dy="22.950000000000003">risk can remain.</tspan></text><rect x="516" y="760.4499999999999" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="532" y="787.4499999999999" fill="#252c28" font-size="19"><tspan x="532" dy="0">Withhold the goods</tspan></text><text x="532" y="816.15" fill="#626962" font-size="17"><tspan x="532" dy="0">Maya can still lose the exposed</tspan><tspan x="532" dy="22.950000000000003">payment.</tspan></text><path d="M 420.0 664.4499999999999 V 720.4499999999999" fill="none" stroke="#252c28" stroke-width="1.4"/><path d="M 420.0 720.4499999999999 H 174.0 V 760.4499999999999" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 420.0 720.4499999999999 H 666.0 V 760.4499999999999" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="904.1999999999999" width="792" height="72.05000000000007" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="930.1999999999999" fill="#252c28" font-size="17"><tspan x="40" dy="0">A smaller purchase does not remove discretion or reverse the known-selfish-preferences</tspan><tspan x="40" dy="22.950000000000003">benchmark. A successful trial is evidence about that transaction, not enforced future honesty.</tspan></text><text x="24" y="1002.25" fill="#626962" font-size="16"><tspan x="24" dy="0">Each fork is a sequence: payment first, then the seller’s choice. The two panels are alternative order sizes, not</tspan><tspan x="24" dy="21.6">automatically promised repeat business.</tspan></text><rect x="24" y="1062.65" width="792" height="72.04999999999995" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1088.65" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Use relevant evidence and an affordable separable trial where appropriate, or change</tspan><tspan x="40" dy="22.950000000000003">control through protection.</tspan></text><text x="24" y="1160.7" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Maya can still lose the exposed payment. No universal trust threshold or guarantee of future</tspan><tspan x="24" dy="22.950000000000003">honesty follows.</tspan></text></g></svg>
