<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1552" viewBox="0 0 360 1552" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Buyers need sellers; sellers need buyers</title><desc id="desc">Hypothetical qualitative illustration. Few suitable listings discourage buyers; few serious buyers discourage sellers. Nora concentrates available bicycles and relevant buyers within one district, then checks real trades and later activity. Change: Build one usable local buyer–seller network before expanding. Limitation: Suitable goods, willing buyers, reliable collection, and activity after support ends still need testing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Buyers need sellers; sellers</tspan><tspan x="24" dy="28.35">need buyers</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Each side waits for the other</tspan></text><rect x="24" y="190.45000000000002" width="274" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="217.45000000000002" fill="#252c28" font-size="19"><tspan x="40" dy="0">Few suitable listings</tspan></text><text x="40" y="246.15" fill="#626962" font-size="17"><tspan x="40" dy="0">Buyers find little worth</tspan><tspan x="40" dy="22.950000000000003">returning for.</tspan></text><rect x="24" y="392.2" width="274" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="419.2" fill="#252c28" font-size="19"><tspan x="40" dy="0">Few serious buyers</tspan></text><text x="40" y="447.9" fill="#626962" font-size="17"><tspan x="40" dy="0">Sellers see little reason to list.</tspan></text><path d="M 161 292.2 V 392.2" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="181" y="321.2" fill="#626962" font-size="16"><tspan x="181" dy="0">discourages</tspan><tspan x="181" dy="21.6">buyers</tspan></text><path d="M 298 435.2 H 336 V 241.325 H 298" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="514.2" fill="#626962" font-size="16"><tspan x="24" dy="0">Return: few buyers discourage listing.</tspan></text><text x="24" y="559.0" fill="#252c28" font-size="18"><tspan x="24" dy="0">One local launch · bicycles in one</tspan><tspan x="24" dy="24.3">district</tspan></text><rect x="24" y="612.6999999999999" width="312" height="86" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="639.6999999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Recruit available bikes</tspan></text><text x="40" y="668.4" fill="#626962" font-size="17"><tspan x="40" dy="0">Current, usable local listings.</tspan></text><path d="M 180 698.6999999999999 V 774.6999999999999" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="774.6999999999999" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="801.6999999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Bring relevant buyers</tspan></text><text x="40" y="830.4" fill="#626962" font-size="17"><tspan x="40" dy="0">Match real needs and collection</tspan><tspan x="40" dy="22.950000000000003">distance.</tspan></text><path d="M 180 876.4499999999999 V 952.4499999999999" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="952.4499999999999" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="979.4499999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Check completed trades</tspan></text><text x="40" y="1008.15" fill="#626962" font-size="17"><tspan x="40" dy="0">Then test continued activity.</tspan></text><rect x="24" y="1080.4499999999998" width="312" height="117.94999999999982" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1106.4499999999998" fill="#252c28" font-size="17"><tspan x="40" dy="0">Concentration changes matching</tspan><tspan x="40" dy="22.950000000000003">opportunities. It does not turn a</tspan><tspan x="40" dy="22.950000000000003">signup or pledge of interest into a</tspan><tspan x="40" dy="22.950000000000003">purchase.</tspan></text><text x="24" y="1224.3999999999996" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows are hypothesized</tspan><tspan x="24" dy="21.6">participation responses. Lower arrows</tspan><tspan x="24" dy="21.6">show launch actions and checks; no</tspan><tspan x="24" dy="21.6">transaction count or growth rate is</tspan><tspan x="24" dy="21.6">implied.</tspan></text><rect x="24" y="1349.5999999999997" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1375.5999999999997" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Build one usable local</tspan><tspan x="40" dy="22.950000000000003">buyer–seller network before</tspan><tspan x="40" dy="22.950000000000003">expanding.</tspan></text><text x="24" y="1470.5999999999997" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Suitable goods, willing buyers,</tspan><tspan x="24" dy="22.950000000000003">reliable collection, and activity after</tspan><tspan x="24" dy="22.950000000000003">support ends still need testing.</tspan></text></g></svg>
