<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1667" viewBox="0 0 360 1667" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Poor service can hide demand from the investment test</title><desc id="desc">Hypothetical feedback map. Long delivery quotes suppress Tess’s bookings. Weak bookings reduce the case for investment; usable finishing capacity arrives only after approval, equipping, and training. Inadequate capacity sustains delivery delay. Backlog recovery additionally requires completions above new bookings long enough to clear inherited work. Change: Test delay-sensitive demand and time investment for preparation. Limitation: Inquiries are not orders or proof that expansion pays; returning demand can consume the added capacity.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.3" /></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.3" /></marker></defs>
<rect width="100%" height="100%" fill="#ffffff" />
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Poor service can hide demand</tspan><tspan x="24" dy="28.35">from the investment test</tspan></text><text x="24" y="94.6" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><rect x="24" y="174.2" width="274" height="144" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="202.2" fill="#252c28" font-size="19"><tspan x="40" dy="0">Delivery delay</tspan></text><text x="40" y="230.95" fill="#626962" font-size="17"><tspan x="40" dy="0">Tess’s finishing queue</tspan><tspan x="40" dy="22.950000000000003">lengthens quotes</tspan></text><rect x="24" y="380.2" width="274" height="144" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="408.2" fill="#252c28" font-size="19"><tspan x="40" dy="0">Bookings</tspan></text><text x="40" y="436.95" fill="#626962" font-size="17"><tspan x="40" dy="0">Some customers decline</tspan><tspan x="40" dy="22.950000000000003">long waits</tspan></text><rect x="24" y="586.2" width="274" height="144" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="614.2" fill="#252c28" font-size="19"><tspan x="40" dy="0">Case for investment</tspan></text><text x="40" y="642.95" fill="#626962" font-size="17"><tspan x="40" dy="0">Owner relies on signed</tspan><tspan x="40" dy="22.950000000000003">orders</tspan></text><rect x="24" y="840.2" width="274" height="144" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="868.2" fill="#252c28" font-size="19"><tspan x="40" dy="0">Usable finishing</tspan><tspan x="40" dy="25.650000000000002">capacity</tspan></text><text x="40" y="922.6" fill="#626962" font-size="17"><tspan x="40" dy="0">Equipped and prepared</tspan><tspan x="40" dy="22.950000000000003">operators</tspan></text><path d="M 161 318.2 V 380.2" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)" /><text x="181" y="343.2" fill="#626962" font-size="15"><tspan x="181" dy="0">reduces</tspan></text><path d="M 161 524.2 V 586.2" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)" /><text x="181" y="549.2" fill="#626962" font-size="15"><tspan x="181" dy="0">supports</tspan></text><path d="M 161 730.2 V 840.2" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)" /><text x="181" y="749.2" fill="#626962" font-size="15"><tspan x="181" dy="0">after approval,</tspan><tspan x="181" dy="20.25">equipping, and</tspan><tspan x="181" dy="20.25">training</tspan></text><path d="M 161 984.2 V 1004.2 H 336 V 158.2 H 161 V 174.2" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)" /><text x="24" y="1039.2" fill="#626962" font-size="16"><tspan x="24" dy="0">Return: capacity reduces delay.</tspan></text><text x="24" y="1088.8000000000002" fill="#626962" font-size="17"><tspan x="24" dy="0">Arrows: hypothesized effects, not</tspan><tspan x="24" dy="22.950000000000003">chronology. The growth slowdown</tspan><tspan x="24" dy="22.950000000000003">can be a response to poor service,</tspan><tspan x="24" dy="22.950000000000003">which then becomes a reason not to</tspan><tspan x="24" dy="22.950000000000003">improve service.</tspan></text><rect x="24" y="1214.8500000000001" width="312" height="95.0" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="1240.8500000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Recovery requires completions</tspan><tspan x="40" dy="22.950000000000003">above new bookings long enough</tspan><tspan x="40" dy="22.950000000000003">to clear inherited work.</tspan></text><rect x="24" y="1347.8500000000001" width="312" height="180.20000000000005" rx="3" fill="#edf5f0" stroke="#00855b" stroke-width="1.2" /><text x="40" y="1375.8500000000001" fill="#252c28" font-size="18"><tspan x="40" dy="0">Change the relationship</tspan></text><text x="40" y="1406.3500000000001" fill="#252c28" font-size="18"><tspan x="40" dy="0">Test delay-sensitive demand</tspan><tspan x="40" dy="24.3">and time investment for</tspan><tspan x="40" dy="24.3">preparation, rather than</tspan><tspan x="40" dy="24.3">waiting only for deterred</tspan><tspan x="40" dy="24.3">bookings.</tspan></text><text x="24" y="1564.0500000000002" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Inquiries are not</tspan><tspan x="24" dy="22.950000000000003">guaranteed orders. Extra capacity</tspan><tspan x="24" dy="22.950000000000003">may fail if price, product, or</tspan><tspan x="24" dy="22.950000000000003">quality explains the decline.</tspan></text></g></svg>
