<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1390" viewBox="0 0 360 1390" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">A private time saving can impose greater shared delay</title><desc id="desc">Hypothetical qualitative illustration. A commuter switching to the shortcut saves personal time while existing shortcut users together incur more added delay. A load-dependent charge can attach that external cost to the decision. Roads, travelers, and the departure window stay fixed in the illustration. Change: Attach imposed delay to the route choice, or allocate access through a feasible alternative. Limitation: Measurement, collection, differing means, access, and diversion matter. No road capacity is added.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">A private time saving can</tspan><tspan x="24" dy="28.35">impose greater shared delay</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">One commuter switches from detour</tspan><tspan x="24" dy="24.3">to shortcut</tspan></text><rect x="24" y="214.75000000000003" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Switching commuter</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Saves personal journey time.</tspan></text><rect x="24" y="376.75" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="403.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Existing shortcut users</tspan></text><text x="40" y="432.45" fill="#626962" font-size="17"><tspan x="40" dy="0">Combined added delay exceeds</tspan><tspan x="40" dy="22.950000000000003">that saving.</tspan></text><rect x="24" y="520.5" width="312" height="140.89999999999998" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="546.5" fill="#252c28" font-size="17"><tspan x="40" dy="0">The driver counts the private saving</tspan><tspan x="40" dy="22.950000000000003">but does not automatically bear the</tspan><tspan x="40" dy="22.950000000000003">delay imposed on others. These are</tspan><tspan x="40" dy="22.950000000000003">stipulated comparisons, not</tspan><tspan x="40" dy="22.950000000000003">measured travel times.</tspan></text><text x="24" y="687.4" fill="#252c28" font-size="18"><tspan x="24" dy="0">Change the switching decision · same</tspan><tspan x="24" dy="24.3">roads and travelers</tspan></text><rect x="24" y="741.0999999999999" width="312" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="768.0999999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Load-dependent charge</tspan></text><text x="40" y="796.8" fill="#626962" font-size="17"><tspan x="40" dy="0">Reflect the extra delay imposed on</tspan><tspan x="40" dy="22.950000000000003">others.</tspan></text><path d="M 180 842.8499999999999 V 918.8499999999999" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="918.8499999999999" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="945.8499999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Compare time and charge</tspan></text><text x="40" y="974.55" fill="#626962" font-size="17"><tspan x="40" dy="0">The earlier saving may no longer</tspan><tspan x="40" dy="22.950000000000003">favor switching.</tspan></text><text x="24" y="1062.6" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper cards compare consequences of</tspan><tspan x="24" dy="21.6">one switch, not successive trips. Lower</tspan><tspan x="24" dy="21.6">arrows show the proposed change to</tspan><tspan x="24" dy="21.6">decision costs. No card size represents</tspan><tspan x="24" dy="21.6">elapsed time.</tspan></text><rect x="24" y="1187.8" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1213.8" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Attach imposed delay to</tspan><tspan x="40" dy="22.950000000000003">the route choice, or allocate access</tspan><tspan x="40" dy="22.950000000000003">through a feasible alternative.</tspan></text><text x="24" y="1308.8" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Measurement, collection, differing</tspan><tspan x="24" dy="22.950000000000003">means, access, and diversion matter.</tspan><tspan x="24" dy="22.950000000000003">No road capacity is added.</tspan></text></g></svg>
