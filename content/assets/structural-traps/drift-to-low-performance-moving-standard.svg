<svg xmlns="http://www.w3.org/2000/svg" width="840" height="857" viewBox="0 0 840 857" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">A relaxed response promise can hide unchanged waiting</title><desc id="desc">Hypothetical qualitative illustration. The same actual waiting time misses an original promise but appears more acceptable under a relaxed one. Accepted delay can reduce recovery priority, worsen actual waiting, and invite another relaxation. Restoring a justified reference and usable coverage changes that response. Change: Separate forecasts from the justified service promise and resource a feasible recovery. Limitation: A target adds no capacity. Training, backlogs, changing needs, and unaffordable promises require explicit decisions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">A relaxed response promise can hide unchanged waiting</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Hold actual waiting fixed; compare two standards</tspan></text><rect x="24.0" y="140.5" width="366.0" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="167.5" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Original response promise</tspan></text><text x="40.0" y="196.2" fill="#626962" font-size="17"><tspan x="40.0" dy="0">The unchanged actual wait misses it.</tspan></text><rect x="450.0" y="140.5" width="366.0" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="466.0" y="167.5" fill="#252c28" font-size="19"><tspan x="466.0" dy="0">Relaxed response promise</tspan></text><text x="466.0" y="196.2" fill="#626962" font-size="17"><tspan x="466.0" dy="0">The same wait looks more acceptable.</tspan></text><rect x="24" y="268.5" width="792" height="72.05000000000001" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="294.5" fill="#252c28" font-size="17"><tspan x="40" dy="0">No customer is helped sooner by changing the benchmark. A forecast reports expected waiting; a</tspan><tspan x="40" dy="22.950000000000003">standard states the service people should be able to expect.</tspan></text><text x="24" y="366.55" fill="#252c28" font-size="18"><tspan x="24" dy="0">Hypothesized erosion route</tspan></text><rect x="24.0" y="395.95" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="422.95" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Longer waits</tspan><tspan x="40.0" dy="25.650000000000002">accepted</tspan></text><text x="40.0" y="477.29999999999995" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Less recognized</tspan><tspan x="40.0" dy="22.950000000000003">shortfall.</tspan></text><rect x="308.0" y="395.95" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="422.95" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Recovery loses</tspan><tspan x="324.0" dy="25.650000000000002">priority</tspan></text><text x="324.0" y="477.29999999999995" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Coverage stays</tspan><tspan x="324.0" dy="22.950000000000003">inadequate.</tspan></text><rect x="592.0" y="395.95" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="422.95" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Actual waiting</tspan><tspan x="608.0" dy="25.650000000000002">worsens</tspan></text><text x="608.0" y="477.29999999999995" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Another relaxation</tspan><tspan x="608.0" dy="22.950000000000003">appears reasonable.</tspan></text><path d="M 248.0 459.65 H 308.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 532.0 459.65 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="565.35" width="792" height="72.05000000000007" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="591.35" fill="#252c28" font-size="17"><tspan x="40" dy="0">The last step feeds another lowering of the response standard. A stable, justified reference needs</tspan><tspan x="40" dy="22.950000000000003">usable coverage; preserving an impossible promise would be a different mistake.</tspan></text><text x="24" y="663.4000000000001" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper cards are alternative comparisons, not later waiting measurements. Lower arrows show a hypothesized</tspan><tspan x="24" dy="21.6">causal path; its final step feeds further standard revision.</tspan></text><rect x="24" y="723.8000000000001" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="749.8000000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Separate forecasts from the justified service promise and resource a feasible recovery.</tspan></text><text x="24" y="798.9000000000001" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: A target adds no capacity. Training, backlogs, changing needs, and unaffordable promises</tspan><tspan x="24" dy="22.950000000000003">require explicit decisions.</tspan></text></g></svg>
