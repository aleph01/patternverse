<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1483" viewBox="0 0 360 1483" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">The last usable train leaves before work permits departure</title><desc id="desc">Hypothetical qualitative illustration. Originally the last train meeting the arrival requirement leaves before Mara is allowed to leave work. The revised authorization moves her permitted departure before the same train, with work covered. The train and performance time do not change. Change: Authorize a covered earlier finish, or explicitly change another requirement. Limitation: Coverage has a cost. A feasible timetable is not a guarantee of punctual arrival.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">The last usable train leaves</tspan><tspan x="24" dy="28.35">before work permits departure</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Original order · no qualifying journey</tspan></text><rect x="24" y="190.45000000000002" width="312" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="217.45000000000002" fill="#252c28" font-size="19"><tspan x="40" dy="0">Last usable train leaves</tspan></text><text x="40" y="246.15" fill="#626962" font-size="17"><tspan x="40" dy="0">Only this train meets the arrival</tspan><tspan x="40" dy="22.950000000000003">requirement.</tspan></text><path d="M 180 292.2 V 368.2" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="368.2" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="395.2" fill="#252c28" font-size="19"><tspan x="40" dy="0">Work permits departure</tspan></text><text x="40" y="423.9" fill="#626962" font-size="17"><tspan x="40" dy="0">Too late to take that train.</tspan></text><rect x="24" y="496.2" width="312" height="117.9500000000001" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="522.2" fill="#252c28" font-size="17"><tspan x="40" dy="0">A later train misses the required</tspan><tspan x="40" dy="22.950000000000003">arrival. Other permitted, affordable</tspan><tspan x="40" dy="22.950000000000003">routes are excluded by the stated</tspan><tspan x="40" dy="22.950000000000003">example.</tspan></text><text x="24" y="640.1500000000001" fill="#252c28" font-size="18"><tspan x="24" dy="0">Revised authorization · same train</tspan><tspan x="24" dy="24.3">and performance</tspan></text><rect x="24" y="693.85" width="312" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="720.85" fill="#252c28" font-size="19"><tspan x="40" dy="0">Covered early finish</tspan></text><text x="40" y="749.5500000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">Manager authorizes leaving work</tspan><tspan x="40" dy="22.950000000000003">earlier.</tspan></text><path d="M 180 795.6 V 871.6" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="871.6" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="898.6" fill="#252c28" font-size="19"><tspan x="40" dy="0">Take the same train</tspan></text><text x="40" y="927.3000000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">Permitted departure now precedes</tspan><tspan x="40" dy="22.950000000000003">it.</tspan></text><path d="M 180 973.35 V 1049.35" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="1049.35" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1076.35" fill="#252c28" font-size="19"><tspan x="40" dy="0">Arrive before the start</tspan></text><text x="40" y="1105.05" fill="#626962" font-size="17"><tspan x="40" dy="0">Punctual running is still assumed.</tspan></text><text x="24" y="1177.35" fill="#626962" font-size="16"><tspan x="24" dy="0">Arrows show chronology only. Different</tspan><tspan x="24" dy="21.6">rows are alternative authorizations, not</tspan><tspan x="24" dy="21.6">consecutive attempts; spacing is not a</tspan><tspan x="24" dy="21.6">time scale.</tspan></text><rect x="24" y="1280.9499999999998" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1306.9499999999998" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Authorize a covered earlier</tspan><tspan x="40" dy="22.950000000000003">finish, or explicitly change another</tspan><tspan x="40" dy="22.950000000000003">requirement.</tspan></text><text x="24" y="1401.9499999999998" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Coverage has a cost. A feasible</tspan><tspan x="24" dy="22.950000000000003">timetable is not a guarantee of punctual</tspan><tspan x="24" dy="22.950000000000003">arrival.</tspan></text></g></svg>
