<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2087" viewBox="0 0 360 2087" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Relief can displace learning while capability erodes</title><desc id="desc">Hypothetical qualitative feedback map. Unresolved faults prompt expert takeovers and guided local practice. Takeovers reduce current faults quickly but can displace practice. Practice builds usable capability over time; capability reduces unresolved faults. Turnover, disuse, and outdated procedures erode capability. Less practice slows gains; capability declines only when losses exceed gains. The connected return paths show fast balancing relief, delayed balancing capability development, and reinforcing reliance through displaced practice. Change: Make suitable repairs guided local work and protect practice through the learning delay. Limitation: Teaching initially costs time. Keep specialist support for urgent, complex, or high-consequence cases until local competence is demonstrated.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4" /></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4" /></marker></defs><rect width="100%" height="100%" fill="#ffffff" />
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Relief can displace learning</tspan><tspan x="24" dy="28.35">while capability erodes</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><rect x="24" y="161.05" width="274" height="144" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="188.05" fill="#252c28" font-size="19"><tspan x="40" dy="0">Unresolved local faults</tspan></text><text x="40" y="216.75" fill="#626962" font-size="17"><tspan x="40" dy="0">Recurring cases need</tspan><tspan x="40" dy="22.950000000000003">equipment working.</tspan></text><rect x="24" y="435.05" width="274" height="144" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="462.05" fill="#252c28" font-size="19"><tspan x="40" dy="0">Expert takeovers</tspan></text><text x="40" y="490.75" fill="#626962" font-size="17"><tspan x="40" dy="0">Tomas repairs current faults.</tspan></text><rect x="24" y="709.05" width="274" height="144" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="736.05" fill="#252c28" font-size="19"><tspan x="40" dy="0">Guided local practice</tspan></text><text x="40" y="764.75" fill="#626962" font-size="17"><tspan x="40" dy="0">Technicians diagnose and do</tspan><tspan x="40" dy="22.950000000000003">suitable work.</tspan></text><rect x="24" y="983.05" width="274" height="170" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="1010.05" fill="#252c28" font-size="19"><tspan x="40" dy="0">Usable local capability</tspan></text><text x="40" y="1038.75" fill="#626962" font-size="17"><tspan x="40" dy="0">Skills and usable procedures</tspan><tspan x="40" dy="22.950000000000003">persist. Gains must replace</tspan><tspan x="40" dy="22.950000000000003">losses.</tspan></text><rect x="24" y="1283.05" width="274" height="144" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="1310.05" fill="#252c28" font-size="19"><tspan x="40" dy="0">Capability losses</tspan></text><text x="40" y="1338.75" fill="#626962" font-size="17"><tspan x="40" dy="0">Turnover, disuse, and outdated</tspan><tspan x="40" dy="22.950000000000003">procedures.</tspan></text><path d="M 161.0 305.05 V 435.05" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)" /><text x="181" y="341.05" fill="#626962" font-size="16"><tspan x="181" dy="0">Prompt expert</tspan><tspan x="181" dy="21.6">calls</tspan></text><path d="M 24 507.05 H 8 V 233.05 H 24" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)" /><path d="M 298 257.05 H 328 V 781.05 H 298" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)" /><path d="M 161.0 579.05 V 709.05" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)" /><text x="181" y="609.05" fill="#626962" font-size="16"><tspan x="181" dy="0">Displace</tspan><tspan x="181" dy="21.6">unless</tspan><tspan x="181" dy="21.6">protected</tspan></text><path d="M 161.0 853.05 V 983.05" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)" /><text x="181" y="889.05" fill="#626962" font-size="16"><tspan x="181" dy="0">Builds over</tspan><tspan x="181" dy="21.6">time</tspan></text><path d="M 298 1068.05 H 352 V 233.05 H 298" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)" /><path d="M 161.0 1283.05 V 1153.05" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)" /><text x="181" y="1183.05" fill="#626962" font-size="16"><tspan x="181" dy="0">Losses erode</tspan><tspan x="181" dy="21.6">capability</tspan></text><text x="24" y="1469.05" fill="#626962" font-size="16"><tspan x="24" dy="0">Left return: takeovers reduce current faults</tspan><tspan x="24" dy="21.6">(fast balancing). Right bypass: faults</tspan><tspan x="24" dy="21.6">prompt local practice. Outer return:</tspan><tspan x="24" dy="21.6">capability reduces faults (delayed</tspan><tspan x="24" dy="21.6">balancing). Displaced practice closes a</tspan><tspan x="24" dy="21.6">reinforcing reliance path.</tspan></text><rect x="24" y="1615.85" width="312" height="95.0" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="1641.85" fill="#252c28" font-size="17"><tspan x="40" dy="0">Less practice can mean slower</tspan><tspan x="40" dy="22.950000000000003">gains. Capability falls only when</tspan><tspan x="40" dy="22.950000000000003">losses exceed gains.</tspan></text><text x="24" y="1736.85" fill="#626962" font-size="16"><tspan x="24" dy="0">Solid arrows show hypothesized causal</tspan><tspan x="24" dy="21.6">effects, not chronology or material</tspan><tspan x="24" dy="21.6">transfers. Capability is specific to the</tspan><tspan x="24" dy="21.6">defined fault classes; these links need</tspan><tspan x="24" dy="21.6">evidence.</tspan></text><rect x="24" y="1862.05" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2" /><text x="40" y="1888.05" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Make suitable repairs</tspan><tspan x="40" dy="22.950000000000003">guided local work and protect</tspan><tspan x="40" dy="22.950000000000003">practice through the learning delay.</tspan></text><text x="24" y="1983.05" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Teaching initially costs time. Keep</tspan><tspan x="24" dy="22.950000000000003">specialist support for urgent, complex,</tspan><tspan x="24" dy="22.950000000000003">or high-consequence cases until local</tspan><tspan x="24" dy="22.950000000000003">competence is demonstrated.</tspan></text></g></svg>
