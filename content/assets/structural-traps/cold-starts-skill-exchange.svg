<svg xmlns="http://www.w3.org/2000/svg" width="840" height="843" viewBox="0 0 840 843" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Buyers need sellers; sellers need buyers</title><desc id="desc">Hypothetical qualitative illustration. Few suitable listings discourage buyers; few serious buyers discourage sellers. Nora concentrates available bicycles and relevant buyers within one district, then checks real trades and later activity. Change: Build one usable local buyer–seller network before expanding. Limitation: Suitable goods, willing buyers, reliable collection, and activity after support ends still need testing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Buyers need sellers; sellers need buyers</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Each side waits for the other</tspan></text><rect x="24" y="140.5" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="167.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Few suitable listings</tspan></text><text x="40" y="196.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Buyers find little worth returning</tspan><tspan x="40" dy="22.950000000000003">for.</tspan></text><rect x="516" y="140.5" width="300" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="532" y="167.5" fill="#252c28" font-size="19"><tspan x="532" dy="0">Few serious buyers</tspan></text><text x="532" y="196.2" fill="#626962" font-size="17"><tspan x="532" dy="0">Sellers see little reason to list.</tspan></text><path d="M 324 191.375 H 516" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="342" y="158.375" fill="#626962" font-size="16"><tspan x="342" dy="0">discourages buyers</tspan></text><path d="M 666.0 226.5 V 274.25 H 174.0 V 242.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="220" y="307.25" fill="#626962" font-size="16"><tspan x="220" dy="0">Return: few buyers discourage listing.</tspan></text><text x="24" y="352.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">One local launch · bicycles in one district</tspan></text><rect x="24.0" y="381.45" width="224.0" height="127.4" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="408.45" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Recruit available</tspan><tspan x="40.0" dy="25.650000000000002">bikes</tspan></text><text x="40.0" y="462.79999999999995" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Current, usable local</tspan><tspan x="40.0" dy="22.950000000000003">listings.</tspan></text><rect x="308.0" y="381.45" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="408.45" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Bring relevant buyers</tspan></text><text x="324.0" y="437.15" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Match real needs and</tspan><tspan x="324.0" dy="22.950000000000003">collection distance.</tspan></text><rect x="592.0" y="381.45" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="408.45" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Check completed</tspan><tspan x="608.0" dy="25.650000000000002">trades</tspan></text><text x="608.0" y="462.79999999999995" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Then test continued</tspan><tspan x="608.0" dy="22.950000000000003">activity.</tspan></text><path d="M 248.0 445.15 H 308.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><path d="M 532.0 445.15 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="550.85" width="792" height="72.05000000000007" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="576.85" fill="#252c28" font-size="17"><tspan x="40" dy="0">Concentration changes matching opportunities. It does not turn a signup or pledge of interest into</tspan><tspan x="40" dy="22.950000000000003">a purchase.</tspan></text><text x="24" y="648.9000000000001" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows are hypothesized participation responses. Lower arrows show launch actions and checks; no</tspan><tspan x="24" dy="21.6">transaction count or growth rate is implied.</tspan></text><rect x="24" y="709.3000000000001" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="735.3000000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Build one usable local buyer–seller network before expanding.</tspan></text><text x="24" y="784.4000000000001" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Suitable goods, willing buyers, reliable collection, and activity after support ends still need</tspan><tspan x="24" dy="22.950000000000003">testing.</tspan></text></g></svg>
