<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1016" viewBox="0 0 840 1016" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Fit-out changes the cost of walking away</title><desc id="desc">Hypothetical qualitative illustration. After location-specific fit-out, the initial lease expires and Orion proposes renewal. Lina can accept or leave with weak outside value for dedicated fixtures. A more costly portable design can preserve a stronger moving option if real premises and affordable relocation exist. Change: Protect usable outside value or secure credible terms before committing specific investment. Limitation: Portability costs more; some fit-out stays sunk. Real alternatives and sufficient returns remain necessary.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Fit-out changes the cost of walking away</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Before spending · anticipate the later renewal choice</tspan></text><rect x="24.0" y="140.5" width="366.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="167.5" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Dedicated shop fit-out</tspan></text><text x="40.0" y="196.2" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Much of its value is lost on moving.</tspan></text><rect x="450.0" y="140.5" width="366.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="466.0" y="167.5" fill="#252c28" font-size="19"><tspan x="466.0" dy="0">Initial lease expires</tspan></text><text x="466.0" y="196.2" fill="#626962" font-size="17"><tspan x="466.0" dy="0">Unprotected renewal terms are proposed</tspan><tspan x="466.0" dy="22.950000000000003">later.</tspan></text><path d="M 390.0 191.375 H 450.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="260" y="284.25" width="320" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="276" y="311.25" fill="#252c28" font-size="19"><tspan x="276" dy="0">Orion proposes renewal terms</tspan></text><text x="276" y="339.95" fill="#626962" font-size="17"><tspan x="276" dy="0">The existing lease has been</tspan><tspan x="276" dy="22.950000000000003">honored.</tspan></text><rect x="24" y="482.0" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="509.0" fill="#252c28" font-size="19"><tspan x="40" dy="0">Lina accepts</tspan></text><text x="40" y="537.7" fill="#626962" font-size="17"><tspan x="40" dy="0">May retain more value than</tspan><tspan x="40" dy="22.950000000000003">walking away.</tspan></text><rect x="516" y="482.0" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="532" y="509.0" fill="#252c28" font-size="19"><tspan x="532" dy="0">Lina leaves</tspan></text><text x="532" y="537.7" fill="#626962" font-size="17"><tspan x="532" dy="0">Dedicated fixtures have weak</tspan><tspan x="532" dy="22.950000000000003">outside value.</tspan></text><path d="M 420.0 386.0 V 442.0" fill="none" stroke="#252c28" stroke-width="1.4"/><path d="M 420.0 442.0 H 174.0 V 482.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 420.0 442.0 H 666.0 V 482.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="625.75" fill="#252c28" font-size="18"><tspan x="24" dy="0">Change the fallback before fitting out</tspan></text><rect x="24.0" y="655.15" width="366.0" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="682.15" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Portable fittings</tspan></text><text x="40.0" y="710.85" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Cost more initially; real other premises are</tspan><tspan x="40.0" dy="22.950000000000003">available.</tspan></text><rect x="450.0" y="655.15" width="366.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="466.0" y="682.15" fill="#252c28" font-size="19"><tspan x="466.0" dy="0">Stronger moving option</tspan></text><text x="466.0" y="710.85" fill="#626962" font-size="17"><tspan x="466.0" dy="0">Can improve renewal bargaining; some</tspan><tspan x="466.0" dy="22.950000000000003">costs stay sunk.</tspan></text><path d="M 390.0 706.025 H 450.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><text x="24" y="798.9" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows show investment and later renewal timing; the fork shows accept or reject. Lower arrows</tspan><tspan x="24" dy="21.6">compare a different design, not an automatic third option after spending.</tspan></text><rect x="24" y="859.3" width="792" height="72.05000000000007" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="885.3" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Protect usable outside value or secure credible terms before committing specific</tspan><tspan x="40" dy="22.950000000000003">investment.</tspan></text><text x="24" y="957.35" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Portability costs more; some fit-out stays sunk. Real alternatives and sufficient returns remain</tspan><tspan x="24" dy="22.950000000000003">necessary.</tspan></text></g></svg>
