<svg xmlns="http://www.w3.org/2000/svg" width="840" height="867" viewBox="0 0 840 867" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Pledges must become enough usable funding</title><desc id="desc">Hypothetical qualitative illustration. Ari, Bea, and Cam’s agreed pledges are all required in this plan for Maya’s free-to-watch film. Valid sufficient pledges permit collection; only sufficient actual collection permits production. A missing pledge blocks collection; a shortfall triggers this hypothetical campaign’s return rule. Dev can watch without pledging. Change: Protect failed pledges, coordinate enough real backing, and check collected funds before production. Limitation: Payment failures, production risk, unequal contributions, and administration remain. These extra conditions are not attributed to every platform.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Pledges must become enough usable funding</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">A free-to-watch film · accepted pledge shares</tspan></text><rect x="24.0" y="140.5" width="224.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="167.5" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Ari’s pledge</tspan></text><text x="40.0" y="196.2" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Valid and affordable.</tspan></text><rect x="308.0" y="140.5" width="224.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="167.5" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Bea’s pledge</tspan></text><text x="324.0" y="196.2" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Valid and affordable.</tspan></text><rect x="592.0" y="140.5" width="224.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="167.5" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Cam’s pledge</tspan></text><text x="608.0" y="196.2" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Also required at these</tspan><tspan x="608.0" dy="22.950000000000003">shares.</tspan></text><rect x="24" y="284.25" width="792" height="72.05000000000001" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="310.25" fill="#252c28" font-size="17"><tspan x="40" dy="0">ALL three shares are needed for this plan. Dev may watch without pledging. No single backer can</tspan><tspan x="40" dy="22.950000000000003">fund the film alone.</tspan></text><rect x="24.0" y="382.3" width="224.0" height="127.4" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="409.3" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Valid pledges cover</tspan><tspan x="40.0" dy="25.650000000000002">budget?</tspan></text><text x="40.0" y="463.65" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Only then begin</tspan><tspan x="40.0" dy="22.950000000000003">collection.</tspan></text><rect x="308.0" y="382.3" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="409.3" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Enough actually</tspan><tspan x="324.0" dy="25.650000000000002">collected?</tspan></text><text x="324.0" y="463.65" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Only then authorize</tspan><tspan x="324.0" dy="22.950000000000003">production.</tspan></text><rect x="592.0" y="382.3" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="409.3" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Film if completed</tspan></text><text x="608.0" y="438.0" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Funding is not delivery.</tspan></text><path d="M 248.0 446.0 H 308.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><path d="M 532.0 446.0 H 592.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="551.7" width="792" height="72.05000000000007" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="577.7" fill="#252c28" font-size="17"><tspan x="40" dy="0">Missing pledge: no collection. Collection shortfall: no production; return collected money under this</tspan><tspan x="40" dy="22.950000000000003">campaign’s agreed rule.</tspan></text><text x="24" y="649.7500000000001" fill="#626962" font-size="16"><tspan x="24" dy="0">The pledge shares are jointly required at this plan’s agreed amounts. Arrows below show conditional</tspan><tspan x="24" dy="21.6">authorization steps, not a guarantee that the next step succeeds.</tspan></text><rect x="24" y="710.1500000000001" width="792" height="72.05000000000007" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="736.1500000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Protect failed pledges, coordinate enough real backing, and check collected funds before</tspan><tspan x="40" dy="22.950000000000003">production.</tspan></text><text x="24" y="808.2000000000002" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Payment failures, production risk, unequal contributions, and administration remain. These extra</tspan><tspan x="24" dy="22.950000000000003">conditions are not attributed to every platform.</tspan></text></g></svg>
