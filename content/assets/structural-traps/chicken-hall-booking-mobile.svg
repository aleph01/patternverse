<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1280" viewBox="0 0 360 1280" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Each relies on the other giving way</title><desc id="desc">Hypothetical qualitative illustration. Ada and Karim choose press ahead or yield. One pressing while the other yields gives the presser priority; both pressing creates collision risk and is stipulated to be the least-preferred combination for both. Both yielding represents mutual caution under the stipulated middle ranking. Double outlines mark the two asymmetric equilibria. Controlled entry changes the available actions. Change: Replace unrestricted competing entry with authorized, reliable priority control. Limitation: Control and usable waiting space are assumed. Equipment can fail; the diagram is not a traffic-engineering specification.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Each relies on the other giving</tspan><tspan x="24" dy="28.35">way</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Karim chooses Press</tspan></text><rect x="24" y="190.45000000000002" width="274" height="124.69999999999996" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="217.45000000000002" fill="#252c28" font-size="19"><tspan x="40" dy="0">Both press ahead</tspan></text><text x="40" y="246.15" fill="#626962" font-size="17"><tspan x="40" dy="0">Ada: Press. Collision risk; the</tspan><tspan x="40" dy="22.950000000000003">least-preferred combination for</tspan><tspan x="40" dy="22.950000000000003">both in this model.</tspan></text><rect x="24" y="351.15" width="274" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="378.15" fill="#252c28" font-size="19"><tspan x="40" dy="0">Karim passes first</tspan></text><text x="40" y="406.84999999999997" fill="#626962" font-size="17"><tspan x="40" dy="0">Ada: Yield. Ada gives way.</tspan></text><rect x="28" y="355.15" width="266" height="78" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><text x="24" y="473.15" fill="#252c28" font-size="18"><tspan x="24" dy="0">Karim chooses Yield</tspan></text><rect x="24" y="502.54999999999995" width="274" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="529.55" fill="#252c28" font-size="19"><tspan x="40" dy="0">Ada passes first</tspan></text><text x="40" y="558.25" fill="#626962" font-size="17"><tspan x="40" dy="0">Ada: Press. Karim gives way.</tspan></text><rect x="28" y="506.54999999999995" width="266" height="78" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><rect x="24" y="624.55" width="274" height="124.70000000000005" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="651.55" fill="#252c28" font-size="19"><tspan x="40" dy="0">Both use caution</tspan></text><text x="40" y="680.25" fill="#626962" font-size="17"><tspan x="40" dy="0">Ada: Yield. Neither claims</tspan><tspan x="40" dy="22.950000000000003">priority; the middle ranking is</tspan><tspan x="40" dy="22.950000000000003">stipulated.</tspan></text><rect x="24" y="785.25" width="312" height="117.95000000000005" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="811.25" fill="#252c28" font-size="17"><tspan x="40" dy="0">Changed setting: an authorized</tspan><tspan x="40" dy="22.950000000000003">entry control admits one direction</tspan><tspan x="40" dy="22.950000000000003">at a time, then the other. It removes</tspan><tspan x="40" dy="22.950000000000003">unrestricted competing entry.</tspan></text><text x="24" y="929.2" fill="#626962" font-size="16"><tspan x="24" dy="0">Cells or cards compare alternative</tspan><tspan x="24" dy="21.6">simultaneous choices, not vehicle</tspan><tspan x="24" dy="21.6">movements. Double outlines mark the</tspan><tspan x="24" dy="21.6">original asymmetric equilibria. Collision</tspan><tspan x="24" dy="21.6">risk is not quantified.</tspan></text><rect x="24" y="1054.4" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1080.4" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Replace unrestricted</tspan><tspan x="40" dy="22.950000000000003">competing entry with authorized,</tspan><tspan x="40" dy="22.950000000000003">reliable priority control.</tspan></text><text x="24" y="1175.4" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Control and usable waiting space</tspan><tspan x="24" dy="22.950000000000003">are assumed. Equipment can fail; the</tspan><tspan x="24" dy="22.950000000000003">diagram is not a traffic-engineering</tspan><tspan x="24" dy="22.950000000000003">specification.</tspan></text></g></svg>
