<svg xmlns="http://www.w3.org/2000/svg" width="840" height="844" viewBox="0 0 840 844" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Expert advice can serve a different objective</title><desc id="desc">Hypothetical qualitative illustration. Nina keeps most of a higher sale price; Eli receives only a small share and bears extra selling effort. His recommendation informs her acceptance decision, while market conditions also affect the sale. An independent paid assessment adds evidence before she chooses. Change: Improve the evidence supporting the principal’s retained decision and review the terms inducing advice. Limitation: Independent assessment is costly and fallible. Better information guarantees neither a higher price nor aligned interests.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Expert advice can serve a different objective</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Shared sale; different reasons to accept an offer</tspan></text><rect x="24.0" y="140.5" width="366.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="167.5" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Nina · homeowner</tspan></text><text x="40.0" y="196.2" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Keeps most of an extra sale gain; bears</tspan><tspan x="40.0" dy="22.950000000000003">waiting risk.</tspan></text><rect x="450.0" y="140.5" width="366.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="466.0" y="167.5" fill="#252c28" font-size="19"><tspan x="466.0" dy="0">Eli · agent</tspan></text><text x="466.0" y="196.2" fill="#626962" font-size="17"><tspan x="466.0" dy="0">Receives a small share; further selling</tspan><tspan x="466.0" dy="22.950000000000003">costs his time.</tspan></text><rect x="24.0" y="284.25" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="311.25" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Eli’s recommendation</tspan></text><text x="40.0" y="339.95" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Nina cannot see all its</tspan><tspan x="40.0" dy="22.950000000000003">evidence.</tspan></text><rect x="308.0" y="284.25" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="311.25" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Nina’s accept-or-wait</tspan><tspan x="324.0" dy="25.650000000000002">decision</tspan></text><text x="324.0" y="365.59999999999997" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Advice influences a</tspan><tspan x="324.0" dy="22.950000000000003">decision she still owns.</tspan></text><rect x="592.0" y="284.25" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="311.25" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Eventual sale</tspan><tspan x="608.0" dy="25.650000000000002">outcome</tspan></text><text x="608.0" y="365.59999999999997" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Buyers and market</tspan><tspan x="608.0" dy="22.950000000000003">conditions also matter.</tspan></text><path d="M 248.0 347.95 H 308.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 532.0 347.95 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="453.65" fill="#252c28" font-size="18"><tspan x="24" dy="0">Add usable evidence before deciding</tspan></text><rect x="24.0" y="483.04999999999995" width="366.0" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="510.04999999999995" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Independent assessment</tspan></text><text x="40.0" y="538.75" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Disclosed fee independent of accepting</tspan><tspan x="40.0" dy="22.950000000000003">this offer.</tspan></text><rect x="450.0" y="483.04999999999995" width="366.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="466.0" y="510.04999999999995" fill="#252c28" font-size="19"><tspan x="466.0" dy="0">Compare real alternatives</tspan></text><text x="466.0" y="538.75" fill="#626962" font-size="17"><tspan x="466.0" dy="0">Inform Nina’s decision; disagreement</tspan><tspan x="466.0" dy="22.950000000000003">remains.</tspan></text><path d="M 390.0 533.925 H 450.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><text x="24" y="626.8" fill="#626962" font-size="16"><tspan x="24" dy="0">Role cards compare incentives. Arrows show advice informing a decision and a later uncertain result; the</tspan><tspan x="24" dy="21.6">green route adds evidence before that decision.</tspan></text><rect x="24" y="687.1999999999999" width="792" height="72.05000000000007" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="713.1999999999999" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Improve the evidence supporting the principal’s retained decision and review the terms</tspan><tspan x="40" dy="22.950000000000003">inducing advice.</tspan></text><text x="24" y="785.25" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Independent assessment is costly and fallible. Better information guarantees neither a higher</tspan><tspan x="24" dy="22.950000000000003">price nor aligned interests.</tspan></text></g></svg>
