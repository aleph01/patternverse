<svg xmlns="http://www.w3.org/2000/svg" width="840" height="870" viewBox="0 0 840 870" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Short calls can leave the real problem unresolved</title><desc id="desc">Hypothetical qualitative illustration. A shortest-call objective favors brief explanations and early endings even when call times are accurate. Some problems remain and generate repeat contact. A revised resolution objective authorizes necessary work and links contacts to cases, while preserving safety, accessibility, and difficult cases. Change: Make substantive resolution govern decisions, with meaningful access and quality constraints. Limitation: Longer calls can increase waiting. No single score settles capacity, hard-case access, or the meaning of resolution.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Short calls can leave the real problem unresolved</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Same staff time · different decision rules</tspan></text><rect x="24.0" y="140.5" width="224.0" height="150.35" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="167.5" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Minimize call duration</tspan></text><text x="40.0" y="196.2" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Short explanations and</tspan><tspan x="40.0" dy="22.950000000000003">checks improve the</tspan><tspan x="40.0" dy="22.950000000000003">score.</tspan></text><rect x="308.0" y="140.5" width="224.0" height="150.35" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="167.5" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Calls end sooner</tspan></text><text x="324.0" y="196.2" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Recorded call times can</tspan><tspan x="324.0" dy="22.950000000000003">be accurate.</tspan></text><rect x="592.0" y="140.5" width="224.0" height="150.35000000000002" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="167.5" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Some problems</tspan><tspan x="608.0" dy="25.650000000000002">remain</tspan></text><text x="608.0" y="221.85" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Repeat contact does</tspan><tspan x="608.0" dy="22.950000000000003">not mean a new</tspan><tspan x="608.0" dy="22.950000000000003">problem.</tspan></text><path d="M 248.0 215.675 H 308.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 532.0 215.675 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="332.85" width="792" height="72.05000000000001" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="358.85" fill="#252c28" font-size="17"><tspan x="40" dy="0">This is the stipulated harmful path, not a claim that all short calls are poor service. No individual</tspan><tspan x="40" dy="22.950000000000003">bonus or false reporting is required.</tspan></text><text x="24" y="430.90000000000003" fill="#252c28" font-size="18"><tspan x="24" dy="0">Let substantive resolution guide the decision</tspan></text><rect x="24.0" y="460.3" width="224.0" height="150.35000000000008" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="487.3" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Authorize needed</tspan><tspan x="40.0" dy="25.650000000000002">resolution work</tspan></text><text x="40.0" y="541.6500000000001" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Protect safety,</tspan><tspan x="40.0" dy="22.950000000000003">accessibility, and hard</tspan><tspan x="40.0" dy="22.950000000000003">cases.</tspan></text><rect x="308.0" y="460.3" width="224.0" height="150.35" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="487.3" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Link calls to cases</tspan></text><text x="324.0" y="516.0" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Check users can</tspan><tspan x="324.0" dy="22.950000000000003">complete the task.</tspan></text><rect x="592.0" y="460.3" width="224.0" height="150.35000000000008" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="487.3" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Review resolution</tspan><tspan x="608.0" dy="25.650000000000002">and access</tspan></text><text x="608.0" y="541.6500000000001" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Longer calls can leave</tspan><tspan x="608.0" dy="22.950000000000003">less time for new</tspan><tspan x="608.0" dy="22.950000000000003">callers.</tspan></text><path d="M 248.0 535.475 H 308.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><path d="M 532.0 535.475 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="652.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows show a stipulated consequence of the old objective. Lower arrows show an alternative</tspan><tspan x="24" dy="21.6">procedure, not a measured before-and-after trajectory.</tspan></text><rect x="24" y="713.05" width="792" height="72.05000000000007" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="739.05" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Make substantive resolution govern decisions, with meaningful access and quality</tspan><tspan x="40" dy="22.950000000000003">constraints.</tspan></text><text x="24" y="811.1" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Longer calls can increase waiting. No single score settles capacity, hard-case access, or the</tspan><tspan x="24" dy="22.950000000000003">meaning of resolution.</tspan></text></g></svg>
