<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2178" viewBox="0 0 360 2178" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Growth loads the service that sustains growth</title><desc id="desc">Hypothetical qualitative illustration. Satisfied regulars recommend the restaurant and new satisfied visitors add to its customer base. More peak demand can overload the kitchen, worsen service, and weaken return visits and recommendations. Reservation limits and usable kitchen capability address the restraint rather than promoting harder. Change: Control accepted load while building the capability or revising the service growth requires. Limitation: Some customers cannot book; investment costs and delay remain. Another constraint can replace the kitchen.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Growth loads the service that</tspan><tspan x="24" dy="28.35">sustains growth</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Growth loop · hypothesized</tspan><tspan x="24" dy="24.3">reinforcing feedback</tspan></text><rect x="24" y="214.75000000000003" width="274" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Satisfied regulars</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Return and recommend the</tspan><tspan x="40" dy="22.950000000000003">restaurant.</tspan></text><rect x="24" y="416.5" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="443.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">New satisfied visitors</tspan></text><text x="40" y="472.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Some become regular</tspan><tspan x="40" dy="22.950000000000003">customers.</tspan></text><path d="M 161 316.5 V 416.5" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="181" y="345.5" fill="#626962" font-size="16"><tspan x="181" dy="0">brings visitors</tspan></text><path d="M 298 467.375 H 336 V 265.625 H 298" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="554.25" fill="#626962" font-size="16"><tspan x="24" dy="0">Return: new regulars add to the</tspan><tspan x="24" dy="21.6">recommending base.</tspan></text><text x="24" y="620.65" fill="#252c28" font-size="18"><tspan x="24" dy="0">Limiting loop · growth loads the</tspan><tspan x="24" dy="24.3">service</tspan></text><rect x="24" y="674.3499999999999" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="701.3499999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">More peak demand</tspan></text><text x="40" y="730.05" fill="#626962" font-size="17"><tspan x="40" dy="0">Existing and new customers arrive.</tspan></text><path d="M 180 760.3499999999999 V 836.3499999999999" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="836.3499999999999" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="863.3499999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Kitchen overload</tspan></text><text x="40" y="892.05" fill="#626962" font-size="17"><tspan x="40" dy="0">Longer waits and inconsistent</tspan><tspan x="40" dy="22.950000000000003">meals.</tspan></text><path d="M 180 938.0999999999999 V 1014.0999999999999" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="1014.0999999999999" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1041.1" fill="#252c28" font-size="19"><tspan x="40" dy="0">Weaker repeat demand</tspan></text><text x="40" y="1069.8" fill="#626962" font-size="17"><tspan x="40" dy="0">Fewer recommendations and return</tspan><tspan x="40" dy="22.950000000000003">visits.</tspan></text><rect x="24" y="1157.85" width="312" height="140.89999999999986" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1183.85" fill="#252c28" font-size="17"><tspan x="40" dy="0">Return to the upper loop: fewer</tspan><tspan x="40" dy="22.950000000000003">new regulars and more departures</tspan><tspan x="40" dy="22.950000000000003">restrain the customer base. Slower</tspan><tspan x="40" dy="22.950000000000003">additions alone do not mean the</tspan><tspan x="40" dy="22.950000000000003">base is shrinking.</tspan></text><text x="24" y="1324.7499999999998" fill="#252c28" font-size="18"><tspan x="24" dy="0">Address support while controlling the</tspan><tspan x="24" dy="24.3">pace</tspan></text><rect x="24" y="1378.4499999999998" width="312" height="104.45000000000005" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1405.4499999999998" fill="#252c28" font-size="19"><tspan x="40" dy="0">Cap reservations during</tspan><tspan x="40" dy="25.650000000000002">preparation</tspan></text><text x="40" y="1459.8" fill="#626962" font-size="17"><tspan x="40" dy="0">Some customers cannot book.</tspan></text><path d="M 180 1482.8999999999999 V 1558.8999999999999" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="1558.8999999999999" width="312" height="86" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1585.8999999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Build usable kitchen capability</tspan></text><text x="40" y="1614.6" fill="#626962" font-size="17"><tspan x="40" dy="0">Equipment and training take time.</tspan></text><path d="M 180 1644.8999999999999 V 1720.8999999999999" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="1720.8999999999999" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1747.8999999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Reassess growth and service</tspan></text><text x="40" y="1776.6" fill="#626962" font-size="17"><tspan x="40" dy="0">Another limit can appear.</tspan></text><text x="24" y="1848.8999999999999" fill="#626962" font-size="16"><tspan x="24" dy="0">Arrows show hypothesized causal effects.</tspan><tspan x="24" dy="21.6">The written return closes the limiting loop.</tspan><tspan x="24" dy="21.6">Customer base is a stock; visits are a flow.</tspan><tspan x="24" dy="21.6">No lengths show growth rates.</tspan></text><rect x="24" y="1952.4999999999998" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1978.4999999999998" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Control accepted load</tspan><tspan x="40" dy="22.950000000000003">while building the capability or</tspan><tspan x="40" dy="22.950000000000003">revising the service growth requires.</tspan></text><text x="24" y="2073.5" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Some customers cannot book;</tspan><tspan x="24" dy="22.950000000000003">investment costs and delay remain.</tspan><tspan x="24" dy="22.950000000000003">Another constraint can replace the</tspan><tspan x="24" dy="22.950000000000003">kitchen.</tspan></text></g></svg>
