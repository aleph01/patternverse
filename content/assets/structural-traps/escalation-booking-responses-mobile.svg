<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1715" viewBox="0 0 360 1715" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">A defensive buildup can prompt another buildup</title><desc id="desc">Hypothetical qualitative illustration. Eastland’s perceived shortfall prompts arms procurement, which contributes to Westland’s perceived threat and procurement, feeding Eastland’s concern. Orders await delivery; deliveries and retirements change arms held. A proposed reciprocal limit includes pending deliveries and credible verification. Change: Replace automatic matching with defined, observable reciprocal limits where feasible. Limitation: Verification costs resources; breach, other threats, and unequal power can prevent restraint or make it costly.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">A defensive buildup can prompt</tspan><tspan x="24" dy="28.35">another buildup</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Hypothesized reciprocal response ·</tspan><tspan x="24" dy="24.3">not a history</tspan></text><rect x="24" y="214.75000000000003" width="274" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Eastland perceives a</tspan><tspan x="40" dy="25.650000000000002">shortfall</tspan></text><text x="40" y="296.1" fill="#626962" font-size="17"><tspan x="40" dy="0">Westland’s buildup becomes</tspan><tspan x="40" dy="22.950000000000003">its reference.</tspan></text><rect x="24" y="390.15000000000003" width="274" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="417.15000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Eastland orders more arms</tspan></text><text x="40" y="445.85" fill="#626962" font-size="17"><tspan x="40" dy="0">Deliveries follow after a delay.</tspan></text><rect x="24" y="524.1500000000001" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="551.1500000000001" fill="#252c28" font-size="19"><tspan x="40" dy="0">Westland perceives a threat</tspan></text><text x="40" y="579.8500000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">Eastland’s buildup becomes</tspan><tspan x="40" dy="22.950000000000003">its reference.</tspan></text><rect x="24" y="673.9000000000001" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="700.9000000000001" fill="#252c28" font-size="19"><tspan x="40" dy="0">Westland orders more arms</tspan></text><text x="40" y="729.6000000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">Its later buildup feeds</tspan><tspan x="40" dy="22.950000000000003">Eastland’s concern.</tspan></text><path d="M 161.0 342.15000000000003 V 390.15000000000003" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 161.0 476.15000000000003 V 524.1500000000001" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 161.0 625.9000000000001 V 673.9000000000001" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 298 724.7750000000001 H 336 V 278.45000000000005 H 298" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="823.6500000000001" width="312" height="117.95000000000005" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="849.6500000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Orders are a pipeline. Deliveries</tspan><tspan x="40" dy="22.950000000000003">add to arms held; retirement</tspan><tspan x="40" dy="22.950000000000003">removes them. Pausing new orders</tspan><tspan x="40" dy="22.950000000000003">does not itself reduce that stock.</tspan></text><text x="24" y="967.6000000000001" fill="#252c28" font-size="18"><tspan x="24" dy="0">Changed response relationship ·</tspan><tspan x="24" dy="24.3">conditional on compliance</tspan></text><rect x="24" y="1021.3000000000001" width="312" height="101.75000000000011" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1048.3000000000002" fill="#252c28" font-size="19"><tspan x="40" dy="0">Define reciprocal limits</tspan></text><text x="40" y="1077.0000000000002" fill="#626962" font-size="17"><tspan x="40" dy="0">Include covered stock and pending</tspan><tspan x="40" dy="22.950000000000003">deliveries.</tspan></text><path d="M 180 1123.0500000000002 V 1199.0500000000002" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="1199.0500000000002" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1226.0500000000002" fill="#252c28" font-size="19"><tspan x="40" dy="0">Verify restraint</tspan></text><text x="40" y="1254.7500000000002" fill="#626962" font-size="17"><tspan x="40" dy="0">Use agreed observation and breach</tspan><tspan x="40" dy="22.950000000000003">procedures.</tspan></text><text x="24" y="1342.8000000000002" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows are hypothesized causal</tspan><tspan x="24" dy="21.6">effects, not chronology or material</tspan><tspan x="24" dy="21.6">transfers. Lower arrows show the</tspan><tspan x="24" dy="21.6">proposed agreement process. Arms held</tspan><tspan x="24" dy="21.6">accumulate through delivery minus</tspan><tspan x="24" dy="21.6">retirement.</tspan></text><rect x="24" y="1489.6000000000001" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1515.6000000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Replace automatic</tspan><tspan x="40" dy="22.950000000000003">matching with defined, observable</tspan><tspan x="40" dy="22.950000000000003">reciprocal limits where feasible.</tspan></text><text x="24" y="1610.6000000000001" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Verification costs resources;</tspan><tspan x="24" dy="22.950000000000003">breach, other threats, and unequal</tspan><tspan x="24" dy="22.950000000000003">power can prevent restraint or make it</tspan><tspan x="24" dy="22.950000000000003">costly.</tspan></text></g></svg>
