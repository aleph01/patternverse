<svg xmlns="http://www.w3.org/2000/svg" width="840" height="824" viewBox="0 0 840 824" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Reserve control before the camera is sent</title><desc id="desc">Hypothetical qualitative illustration. In the unsecured sale Ira sends the camera before Sam chooses whether to pay. In the revised arrangement an independent holder reserves payment before dispatch and releases it after verified satisfactory delivery. Sam cannot unilaterally divert that payment; Ira still funds earlier costs. Change: Reserve payment under reliable independent control before dispatch, with clear release and failure rules. Limitation: No named platform is modeled. Satisfactory delivery must be verifiable; secure later payment does not fund earlier costs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Reserve control before the camera is sent</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Unsecured proposal · seller moves first</tspan></text><rect x="24.0" y="140.5" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="167.5" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Ira dispatches the</tspan><tspan x="40.0" dy="25.650000000000002">camera</tspan></text><text x="40.0" y="221.85" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Pays packing and</tspan><tspan x="40.0" dy="22.950000000000003">postage.</tspan></text><rect x="308.0" y="140.5" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="167.5" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Sam receives it</tspan></text><text x="324.0" y="196.2" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Camera and payment</tspan><tspan x="324.0" dy="22.950000000000003">are under his control.</tspan></text><rect x="592.0" y="140.5" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="167.5" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Sam chooses</tspan><tspan x="608.0" dy="25.650000000000002">whether to pay</tspan></text><text x="608.0" y="221.85" fill="#626962" font-size="17"><tspan x="608.0" dy="0">The promise leaves a</tspan><tspan x="608.0" dy="22.950000000000003">later option to withhold.</tspan></text><path d="M 248.0 204.2 H 308.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 532.0 204.2 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="309.9" fill="#252c28" font-size="18"><tspan x="24" dy="0">Protected payment · before the vulnerable action</tspan></text><rect x="24.0" y="339.29999999999995" width="224.0" height="127.4" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="366.29999999999995" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Reserve payment</tspan></text><text x="40.0" y="394.99999999999994" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Independent custody</tspan><tspan x="40.0" dy="22.950000000000003">before dispatch.</tspan></text><rect x="308.0" y="339.29999999999995" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="366.29999999999995" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Ira dispatches</tspan></text><text x="324.0" y="394.99999999999994" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Still funds costs before</tspan><tspan x="324.0" dy="22.950000000000003">release.</tspan></text><rect x="592.0" y="339.29999999999995" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="366.29999999999995" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Verify satisfactory</tspan><tspan x="608.0" dy="25.650000000000002">delivery</tspan></text><text x="608.0" y="420.6499999999999" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Then release under the</tspan><tspan x="608.0" dy="22.950000000000003">agreed rule.</tspan></text><path d="M 248.0 402.99999999999994 H 308.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><path d="M 532.0 402.99999999999994 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="508.69999999999993" width="792" height="72.05000000000007" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="534.6999999999999" fill="#252c28" font-size="17"><tspan x="40" dy="0">Sam cannot unilaterally cancel release after verified satisfactory delivery. Non-delivery does not pay</tspan><tspan x="40" dy="22.950000000000003">Ira; defined return and dispute rules are still required.</tspan></text><text x="24" y="606.75" fill="#626962" font-size="16"><tspan x="24" dy="0">Arrows show transaction chronology. The lower row is an alternative arrangement; verification authorizes</tspan><tspan x="24" dy="21.6">release rather than guaranteeing it.</tspan></text><rect x="24" y="667.15" width="792" height="72.05000000000007" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="693.15" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Reserve payment under reliable independent control before dispatch, with clear release</tspan><tspan x="40" dy="22.950000000000003">and failure rules.</tspan></text><text x="24" y="765.2" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: No named platform is modeled. Satisfactory delivery must be verifiable; secure later payment</tspan><tspan x="24" dy="22.950000000000003">does not fund earlier costs.</tspan></text></g></svg>
