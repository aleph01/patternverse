<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1773" viewBox="0 0 360 1773" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Short calls can leave the real problem unresolved</title><desc id="desc">Hypothetical qualitative illustration. A shortest-call objective favors brief explanations and early endings even when call times are accurate. Some problems remain and generate repeat contact. A revised resolution objective authorizes necessary work and links contacts to cases, while preserving safety, accessibility, and difficult cases. Change: Make substantive resolution govern decisions, with meaningful access and quality constraints. Limitation: Longer calls can increase waiting. No single score settles capacity, hard-case access, or the meaning of resolution.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Short calls can leave the real</tspan><tspan x="24" dy="28.35">problem unresolved</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Same staff time · different decision</tspan><tspan x="24" dy="24.3">rules</tspan></text><rect x="24" y="214.75000000000003" width="312" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Minimize call duration</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Short explanations and checks</tspan><tspan x="40" dy="22.950000000000003">improve the score.</tspan></text><path d="M 180 316.5 V 392.5" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="392.5" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="419.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Calls end sooner</tspan></text><text x="40" y="448.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Recorded call times can be</tspan><tspan x="40" dy="22.950000000000003">accurate.</tspan></text><path d="M 180 494.25 V 570.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="570.25" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="597.25" fill="#252c28" font-size="19"><tspan x="40" dy="0">Some problems remain</tspan></text><text x="40" y="625.95" fill="#626962" font-size="17"><tspan x="40" dy="0">Repeat contact does not mean a</tspan><tspan x="40" dy="22.950000000000003">new problem.</tspan></text><rect x="24" y="714.0" width="312" height="117.95000000000005" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="740.0" fill="#252c28" font-size="17"><tspan x="40" dy="0">This is the stipulated harmful path,</tspan><tspan x="40" dy="22.950000000000003">not a claim that all short calls are</tspan><tspan x="40" dy="22.950000000000003">poor service. No individual bonus or</tspan><tspan x="40" dy="22.950000000000003">false reporting is required.</tspan></text><text x="24" y="857.95" fill="#252c28" font-size="18"><tspan x="24" dy="0">Let substantive resolution guide the</tspan><tspan x="24" dy="24.3">decision</tspan></text><rect x="24" y="911.65" width="312" height="127.39999999999998" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="938.65" fill="#252c28" font-size="19"><tspan x="40" dy="0">Authorize needed resolution</tspan><tspan x="40" dy="25.650000000000002">work</tspan></text><text x="40" y="993.0" fill="#626962" font-size="17"><tspan x="40" dy="0">Protect safety, accessibility, and</tspan><tspan x="40" dy="22.950000000000003">hard cases.</tspan></text><path d="M 180 1039.05 V 1115.05" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="1115.05" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1142.05" fill="#252c28" font-size="19"><tspan x="40" dy="0">Link calls to cases</tspan></text><text x="40" y="1170.75" fill="#626962" font-size="17"><tspan x="40" dy="0">Check users can complete the task.</tspan></text><path d="M 180 1201.05 V 1277.05" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="1277.05" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1304.05" fill="#252c28" font-size="19"><tspan x="40" dy="0">Review resolution and access</tspan></text><text x="40" y="1332.75" fill="#626962" font-size="17"><tspan x="40" dy="0">Longer calls can leave less time for</tspan><tspan x="40" dy="22.950000000000003">new callers.</tspan></text><text x="24" y="1420.8" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows show a stipulated</tspan><tspan x="24" dy="21.6">consequence of the old objective. Lower</tspan><tspan x="24" dy="21.6">arrows show an alternative procedure, not</tspan><tspan x="24" dy="21.6">a measured before-and-after trajectory.</tspan></text><rect x="24" y="1524.3999999999999" width="312" height="117.94999999999982" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1550.3999999999999" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Make substantive</tspan><tspan x="40" dy="22.950000000000003">resolution govern decisions, with</tspan><tspan x="40" dy="22.950000000000003">meaningful access and quality</tspan><tspan x="40" dy="22.950000000000003">constraints.</tspan></text><text x="24" y="1668.3499999999997" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Longer calls can increase waiting.</tspan><tspan x="24" dy="22.950000000000003">No single score settles capacity,</tspan><tspan x="24" dy="22.950000000000003">hard-case access, or the meaning of</tspan><tspan x="24" dy="22.950000000000003">resolution.</tspan></text></g></svg>
