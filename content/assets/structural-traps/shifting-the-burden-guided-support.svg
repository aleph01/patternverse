<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1319" viewBox="0 0 840 1319" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Relief can displace learning while capability erodes</title><desc id="desc">Hypothetical qualitative feedback map. Unresolved faults prompt expert takeovers and guided local practice. Takeovers reduce current faults quickly but can displace practice. Practice builds usable capability over time; capability reduces unresolved faults. Turnover, disuse, and outdated procedures erode capability. Less practice slows gains; capability declines only when losses exceed gains. The connected return paths show fast balancing relief, delayed balancing capability development, and reinforcing reliance through displaced practice. Change: Make suitable repairs guided local work and protect practice through the learning delay. Limitation: Teaching initially costs time. Keep specialist support for urgent, complex, or high-consequence cases until local competence is demonstrated.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4" /></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4" /></marker></defs><rect width="100%" height="100%" fill="#ffffff" />
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Relief can displace learning while capability erodes</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><rect x="280" y="131.1" width="280" height="160" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="296" y="158.1" fill="#252c28" font-size="19"><tspan x="296" dy="0">Unresolved local faults</tspan></text><text x="296" y="186.79999999999998" fill="#626962" font-size="17"><tspan x="296" dy="0">Recurring cases need</tspan><tspan x="296" dy="22.950000000000003">equipment working.</tspan></text><rect x="24" y="441.1" width="250" height="160" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="468.1" fill="#252c28" font-size="19"><tspan x="40" dy="0">Expert takeovers</tspan></text><text x="40" y="496.8" fill="#626962" font-size="17"><tspan x="40" dy="0">Tomas repairs current</tspan><tspan x="40" dy="22.950000000000003">faults.</tspan></text><rect x="566" y="441.1" width="250" height="160" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="582" y="468.1" fill="#252c28" font-size="19"><tspan x="582" dy="0">Guided local practice</tspan></text><text x="582" y="496.8" fill="#626962" font-size="17"><tspan x="582" dy="0">Technicians diagnose and</tspan><tspan x="582" dy="22.950000000000003">do suitable work.</tspan></text><rect x="24" y="761.1" width="250" height="180" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="788.1" fill="#252c28" font-size="19"><tspan x="40" dy="0">Capability losses</tspan></text><text x="40" y="816.8000000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">Turnover, disuse, and</tspan><tspan x="40" dy="22.950000000000003">outdated procedures.</tspan></text><rect x="566" y="761.1" width="250" height="180" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="582" y="788.1" fill="#252c28" font-size="19"><tspan x="582" dy="0">Usable local capability</tspan></text><text x="582" y="816.8000000000001" fill="#626962" font-size="17"><tspan x="582" dy="0">Skills and usable</tspan><tspan x="582" dy="22.950000000000003">procedures persist. Gains</tspan><tspan x="582" dy="22.950000000000003">must replace losses.</tspan></text><path d="M 420.0 291.1 V 381.1 H 149.0 V 441.1" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)" /><text x="24" y="361.1" fill="#626962" font-size="16"><tspan x="24" dy="0">Faults prompt expert calls</tspan></text><path d="M 24 521.1 H 8 V 211.1 H 280" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)" /><text x="24" y="156.1" fill="#626962" font-size="16"><tspan x="24" dy="0">Fast return: takeovers reduce</tspan><tspan x="24" dy="21.6">unresolved faults.</tspan></text><path d="M 560 246.1 H 691.0 V 441.1" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)" /><text x="705" y="327.1" fill="#626962" font-size="16"><tspan x="705" dy="0">Faults prompt</tspan><tspan x="705" dy="21.6">local learning</tspan></text><path d="M 274 521.1 H 566" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)" /><text x="310" y="456.1" fill="#626962" font-size="16"><tspan x="310" dy="0">Takeovers displace practice</tspan><tspan x="310" dy="21.6">unless protected</tspan></text><path d="M 691.0 601.1 V 761.1" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)" /><text x="705" y="654.1" fill="#626962" font-size="16"><tspan x="705" dy="0">Builds over</tspan><tspan x="705" dy="21.6">time</tspan></text><path d="M 274 851.1 H 566" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)" /><text x="310" y="826.1" fill="#626962" font-size="16"><tspan x="310" dy="0">Losses erode capability</tspan></text><path d="M 816 851.1 H 832 V 176.1 H 560" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)" /><text x="24" y="989.1" fill="#626962" font-size="16"><tspan x="24" dy="0">Left return: takeovers reduce current faults (fast balancing). Right bypass: faults prompt local practice. Outer</tspan><tspan x="24" dy="21.6">return: capability reduces faults (delayed balancing). Displaced practice closes a reinforcing reliance path.</tspan></text><rect x="24" y="1049.5" width="792" height="49.09999999999991" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="1075.5" fill="#252c28" font-size="17"><tspan x="40" dy="0">Less practice can mean slower gains. Capability falls only when losses exceed gains.</tspan></text><text x="24" y="1124.6" fill="#626962" font-size="16"><tspan x="24" dy="0">Solid arrows show hypothesized causal effects, not chronology or material transfers. Capability is specific to</tspan><tspan x="24" dy="21.6">the defined fault classes; these links need evidence.</tspan></text><rect x="24" y="1184.9999999999998" width="792" height="49.09999999999991" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2" /><text x="40" y="1210.9999999999998" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Make suitable repairs guided local work and protect practice through the learning delay.</tspan></text><text x="24" y="1260.0999999999997" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Teaching initially costs time. Keep specialist support for urgent, complex, or high-consequence</tspan><tspan x="24" dy="22.950000000000003">cases until local competence is demonstrated.</tspan></text></g></svg>
