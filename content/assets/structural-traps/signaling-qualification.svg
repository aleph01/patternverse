<svg xmlns="http://www.w3.org/2000/svg" width="840" height="828" viewBox="0 0 840 828" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">A qualification is informative only if incentives support it</title><desc id="desc">Hypothetical qualitative illustration. In the proposed separating profile, a capable applicant finds an authentic educational qualification worthwhile if hired, while a less-capable applicant finds imitation too costly. Mara observes qualification rather than private ability and responds consistently with those choices. Change: Check imitation incentives and access, or obtain direct relevant evidence instead. Limitation: Expense alone proves little. Changed rewards, subsidies, unequal access, or other equilibria can undo separation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">A qualification is informative only if incentives support it</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Private ability → observable qualification → hiring decision</tspan></text><text x="24" y="140.5" fill="#252c28" font-size="18"><tspan x="24" dy="0">Alternative applicant · capable for this job</tspan></text><rect x="24.0" y="169.9" width="224.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="196.9" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Capable applicant</tspan></text><text x="40.0" y="225.6" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Qualification cost is</tspan><tspan x="40.0" dy="22.950000000000003">worthwhile if hired.</tspan></text><rect x="308.0" y="169.9" width="224.0" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="324.0" y="196.9" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Obtains qualification</tspan></text><text x="324.0" y="225.6" fill="#626962" font-size="17"><tspan x="324.0" dy="0">An authentic observable</tspan><tspan x="324.0" dy="22.950000000000003">credential.</tspan></text><rect x="592.0" y="169.9" width="224.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="196.9" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Mara hires</tspan></text><text x="608.0" y="225.6" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Her inference fits these</tspan><tspan x="608.0" dy="22.950000000000003">stipulated incentives.</tspan></text><path d="M 248.0 220.775 H 308.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 532.0 220.775 H 592.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><text x="24" y="313.65" fill="#252c28" font-size="18"><tspan x="24" dy="0">Alternative applicant · not yet capable for this job</tspan></text><rect x="24.0" y="343.04999999999995" width="224.0" height="150.35" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="370.04999999999995" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Less-capable</tspan><tspan x="40.0" dy="25.650000000000002">applicant</tspan></text><text x="40.0" y="424.3999999999999" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Imitation costs more</tspan><tspan x="40.0" dy="22.950000000000003">than this opportunity is</tspan><tspan x="40.0" dy="22.950000000000003">worth.</tspan></text><rect x="308.0" y="343.04999999999995" width="224.0" height="150.35" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="370.04999999999995" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Does not imitate</tspan></text><text x="324.0" y="398.74999999999994" fill="#626962" font-size="17"><tspan x="324.0" dy="0">The lack of credential is</tspan><tspan x="324.0" dy="22.950000000000003">observable.</tspan></text><rect x="592.0" y="343.04999999999995" width="224.0" height="150.35" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="370.04999999999995" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Mara declines</tspan></text><text x="608.0" y="398.74999999999994" fill="#626962" font-size="17"><tspan x="608.0" dy="0">This inference needs the</tspan><tspan x="608.0" dy="22.950000000000003">stated access and cost</tspan><tspan x="608.0" dy="22.950000000000003">assumptions.</tspan></text><path d="M 248.0 418.22499999999997 H 308.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 532.0 418.22499999999997 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="535.4" width="792" height="72.05000000000007" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="561.4" fill="#252c28" font-size="17"><tspan x="40" dy="0">The private ability labels are for the reader, not information Mara sees. The signal need not directly</tspan><tspan x="40" dy="22.950000000000003">test the job task; real education can also build skills. Equal access cannot be assumed.</tspan></text><text x="24" y="633.45" fill="#626962" font-size="16"><tspan x="24" dy="0">Arrows show private type, chosen observable action, then employer response. They are not a claim about an</tspan><tspan x="24" dy="21.6">actual qualification or a ranking of people’s overall worth.</tspan></text><rect x="24" y="693.85" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="719.85" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Check imitation incentives and access, or obtain direct relevant evidence instead.</tspan></text><text x="24" y="768.95" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Expense alone proves little. Changed rewards, subsidies, unequal access, or other equilibria can</tspan><tspan x="24" dy="22.950000000000003">undo separation.</tspan></text></g></svg>
