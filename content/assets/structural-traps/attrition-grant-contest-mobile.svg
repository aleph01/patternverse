<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1568" viewBox="0 0 360 1568" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Each pays while waiting for the other to close</title><desc id="desc">Hypothetical qualitative illustration. Iris and Noah each pay net operating losses while both shops remain. First exit ends coexistence costs and leaves the survivor opportunity to the other. A verified outside job and feasible closure improve Iris’s exit option; she exits in the stipulated continuation. Change: Compare forward-looking costs with a genuine exit option; improve that option where feasible. Limitation: Closure costs and lost survivor opportunity remain. A suitable alternative may be unavailable; survivor viability is assumed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Each pays while waiting for the</tspan><tspan x="24" dy="28.35">other to close</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Same period of coexistence · each</tspan><tspan x="24" dy="24.3">chooses when to exit</tspan></text><rect x="24" y="214.75000000000003" width="312" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Iris keeps her shop open</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Pays net losses while Noah</tspan><tspan x="40" dy="22.950000000000003">remains.</tspan></text><rect x="24" y="392.5" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="419.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Noah keeps his shop open</tspan></text><text x="40" y="448.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Pays net losses while Iris remains.</tspan></text><rect x="24" y="520.5" width="312" height="117.95000000000005" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="546.5" fill="#252c28" font-size="17"><tspan x="40" dy="0">First exit ends coexistence costs for</tspan><tspan x="40" dy="22.950000000000003">both. The survivor opportunity goes</tspan><tspan x="40" dy="22.950000000000003">to the remaining shop; earlier losses</tspan><tspan x="40" dy="22.950000000000003">stay lost.</tspan></text><text x="24" y="664.45" fill="#252c28" font-size="18"><tspan x="24" dy="0">Change Iris’s exit option ·</tspan><tspan x="24" dy="24.3">hypothetical continuation</tspan></text><rect x="24" y="718.15" width="312" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="745.15" fill="#252c28" font-size="19"><tspan x="40" dy="0">Verified outside job</tspan></text><text x="40" y="773.85" fill="#626962" font-size="17"><tspan x="40" dy="0">Feasible closure and equipment</tspan><tspan x="40" dy="22.950000000000003">disposal.</tspan></text><path d="M 180 819.9 V 895.9" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="895.9" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="922.9" fill="#252c28" font-size="19"><tspan x="40" dy="0">Iris chooses to exit</tspan></text><text x="40" y="951.6" fill="#626962" font-size="17"><tspan x="40" dy="0">Stops future operating losses after</tspan><tspan x="40" dy="22.950000000000003">closure costs.</tspan></text><path d="M 180 997.65 V 1073.65" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="1073.65" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1100.65" fill="#252c28" font-size="19"><tspan x="40" dy="0">Noah remains</tspan></text><text x="40" y="1129.3500000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">Viability depends on the stated</tspan><tspan x="40" dy="22.950000000000003">survivor assumption.</tspan></text><text x="24" y="1217.4" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper cards are simultaneous cost</tspan><tspan x="24" dy="21.6">streams. Lower arrows show one</tspan><tspan x="24" dy="21.6">hypothetical exit sequence, not an</tspan><tspan x="24" dy="21.6">equilibrium forecast or a general business</tspan><tspan x="24" dy="21.6">prescription.</tspan></text><rect x="24" y="1342.6000000000001" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1368.6000000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Compare forward-looking</tspan><tspan x="40" dy="22.950000000000003">costs with a genuine exit option;</tspan><tspan x="40" dy="22.950000000000003">improve that option where feasible.</tspan></text><text x="24" y="1463.6000000000001" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Closure costs and lost survivor</tspan><tspan x="24" dy="22.950000000000003">opportunity remain. A suitable</tspan><tspan x="24" dy="22.950000000000003">alternative may be unavailable; survivor</tspan><tspan x="24" dy="22.950000000000003">viability is assumed.</tspan></text></g></svg>
