<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1036" viewBox="0 0 840 1036" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Effort and financial loss fall on different parties</title><desc id="desc">Hypothetical qualitative illustration. Under full financial protection, Tess bears packing effort but the pool pays the covered repair loss. Under the proposed deductible Tess still bears effort and also the initial part of a covered loss; the pool bears the remainder. Packing stays private and damage stays uncertain. More care is conditional on the private loss reduction outweighing effort. Change: Reconnect preventable loss to the decision, or reduce prevention effort directly. Limitation: More care is conditional on incentives and acceptable terms. Tess may bear more risk and be worse off.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Effort and financial loss fall on different parties</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Full financial protection</tspan></text><text x="34.0" y="160.5" fill="#252c28" font-size="17"><tspan x="34.0" dy="0">Party</tspan></text><text x="298.0" y="160.5" fill="#252c28" font-size="17"><tspan x="298.0" dy="0">Packing effort</tspan></text><text x="562.0" y="160.5" fill="#252c28" font-size="17"><tspan x="562.0" dy="0">Covered repair loss</tspan></text><rect x="24.0" y="200.5" width="264.0" height="82" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="34.0" y="230.5" fill="#252c28" font-size="17"><tspan x="34.0" dy="0">Tess</tspan></text><rect x="288.0" y="200.5" width="264.0" height="82" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="298.0" y="230.5" fill="#252c28" font-size="17"><tspan x="298.0" dy="0">Bears effort</tspan></text><rect x="552.0" y="200.5" width="264.0" height="82" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="562.0" y="230.5" fill="#252c28" font-size="17"><tspan x="562.0" dy="0">None paid</tspan></text><rect x="24.0" y="282.5" width="264.0" height="82" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="34.0" y="312.5" fill="#252c28" font-size="17"><tspan x="34.0" dy="0">Pool</tspan></text><rect x="288.0" y="282.5" width="264.0" height="82" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="298.0" y="312.5" fill="#252c28" font-size="17"><tspan x="298.0" dy="0">Does not pack</tspan></text><rect x="552.0" y="282.5" width="264.0" height="82" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="562.0" y="312.5" fill="#252c28" font-size="17"><tspan x="562.0" dy="0">Repair bill</tspan></text><text x="24" y="408.5" fill="#252c28" font-size="18"><tspan x="24" dy="0">Proposed deductible</tspan></text><text x="34.0" y="457.9" fill="#252c28" font-size="17"><tspan x="34.0" dy="0">Party</tspan></text><text x="298.0" y="457.9" fill="#252c28" font-size="17"><tspan x="298.0" dy="0">Packing effort</tspan></text><text x="562.0" y="457.9" fill="#252c28" font-size="17"><tspan x="562.0" dy="0">Covered repair loss</tspan></text><rect x="24.0" y="497.9" width="264.0" height="82" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="34.0" y="527.9" fill="#252c28" font-size="17"><tspan x="34.0" dy="0">Tess</tspan></text><rect x="288.0" y="497.9" width="264.0" height="82" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="298.0" y="527.9" fill="#252c28" font-size="17"><tspan x="298.0" dy="0">Bears effort</tspan></text><rect x="552.0" y="497.9" width="264.0" height="82" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="562.0" y="527.9" fill="#252c28" font-size="17"><tspan x="562.0" dy="0">Initial part</tspan></text><rect x="24.0" y="579.9" width="264.0" height="82" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="34.0" y="609.9" fill="#252c28" font-size="17"><tspan x="34.0" dy="0">Pool</tspan></text><rect x="288.0" y="579.9" width="264.0" height="82" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="298.0" y="609.9" fill="#252c28" font-size="17"><tspan x="298.0" dy="0">Does not pack</tspan></text><rect x="552.0" y="579.9" width="264.0" height="82" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="562.0" y="609.9" fill="#252c28" font-size="17"><tspan x="562.0" dy="0">Remaining covered loss</tspan></text><text x="24" y="705.9" fill="#252c28" font-size="18"><tspan x="24" dy="0">Action stays private; damage stays uncertain</tspan></text><rect x="24.0" y="735.3" width="366.0" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="762.3" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Tess chooses packing</tspan></text><text x="40.0" y="791.0" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Care still costs effort.</tspan></text><rect x="450.0" y="735.3" width="366.0" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="466.0" y="762.3" fill="#252c28" font-size="19"><tspan x="466.0" dy="0">Risk can change</tspan></text><text x="466.0" y="791.0" fill="#626962" font-size="17"><tspan x="466.0" dy="0">Good care does not rule out damage.</tspan></text><path d="M 390.0 778.3 H 450.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="863.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Rows allocate burdens. Lower arrows show the order from private action to uncertain outcome.</tspan></text><rect x="24" y="902.0999999999999" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="928.0999999999999" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Reconnect preventable loss to the decision, or reduce prevention effort directly.</tspan></text><text x="24" y="977.1999999999999" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: More care is conditional on incentives and acceptable terms. Tess may bear more risk and be</tspan><tspan x="24" dy="22.950000000000003">worse off.</tspan></text></g></svg>
