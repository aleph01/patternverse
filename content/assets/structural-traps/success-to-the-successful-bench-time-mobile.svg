<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1881" viewBox="0 0 360 1881" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Results earn the means to produce more results</title><desc id="desc">Hypothetical qualitative illustration. A has more grant support and a larger research record; B has less support and a smaller record under the illustration’s comparable-potential assumption. A funder rewarding raw results feeds support back toward A from a fixed pool, leaving less for B. A usable trial changes the allocation rule. Change: Evaluate opportunity and quality, and protect a usable trial rather than automatically rewarding raw totals. Limitation: Fixed funding means opportunity cost. Recruiting, research delay, quality, and inherited reputation still matter.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Results earn the means to</tspan><tspan x="24" dy="28.35">produce more results</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">One fixed grant pool · coupled</tspan><tspan x="24" dy="24.3">feedback</tspan></text><rect x="24" y="214.75000000000003" width="274" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">A · more grant support</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Builds usable research</tspan><tspan x="40" dy="22.950000000000003">capability.</tspan></text><rect x="24" y="380.5" width="274" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="407.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">A · larger record</tspan></text><text x="40" y="436.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Results take time to appear.</tspan></text><rect x="24" y="530.5" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="557.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">One next-award decision</tspan></text><text x="40" y="586.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Raw totals favor A; more for A</tspan><tspan x="40" dy="22.950000000000003">leaves less for B.</tspan></text><rect x="24" y="696.25" width="274" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="723.25" fill="#252c28" font-size="19"><tspan x="40" dy="0">B · less grant support</tspan></text><text x="40" y="751.95" fill="#626962" font-size="17"><tspan x="40" dy="0">Less capability can be built.</tspan></text><rect x="24" y="846.25" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="873.25" fill="#252c28" font-size="19"><tspan x="40" dy="0">B · smaller record</tspan></text><text x="40" y="901.95" fill="#626962" font-size="17"><tspan x="40" dy="0">Feeds the same next-award</tspan><tspan x="40" dy="22.950000000000003">decision.</tspan></text><path d="M 161 316.5 V 380.5" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 161 466.5 V 530.5" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 161 632.25 V 696.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 161 782.25 V 846.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 298 581.375 H 336 V 265.625 H 298" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 24 897.125 H 12 V 581.375 H 24" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="990.0" width="312" height="163.8499999999999" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1016.0" fill="#252c28" font-size="17"><tspan x="40" dy="0">Both result records feed one</tspan><tspan x="40" dy="22.950000000000003">allocation decision. Its two return</tspan><tspan x="40" dy="22.950000000000003">paths change future support from</tspan><tspan x="40" dy="22.950000000000003">the same fixed pool. Comparable</tspan><tspan x="40" dy="22.950000000000003">potential is assumed, not inferred</tspan><tspan x="40" dy="22.950000000000003">from raw counts.</tspan></text><text x="24" y="1179.85" fill="#252c28" font-size="18"><tspan x="24" dy="0">Replace automatic winner bonuses</tspan></text><rect x="24" y="1209.25" width="312" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1236.25" fill="#252c28" font-size="19"><tspan x="40" dy="0">A usable trial for B</tspan></text><text x="40" y="1264.95" fill="#626962" font-size="17"><tspan x="40" dy="0">Protected support and realistic</tspan><tspan x="40" dy="22.950000000000003">review timing.</tspan></text><path d="M 180 1311.0 V 1387.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="1387.0" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1414.0" fill="#252c28" font-size="19"><tspan x="40" dy="0">Assess quality and opportunity</tspan></text><text x="40" y="1442.7" fill="#626962" font-size="17"><tspan x="40" dy="0">No guarantee B becomes the better</tspan><tspan x="40" dy="22.950000000000003">team.</tspan></text><text x="24" y="1530.75" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows show support enabling</tspan><tspan x="24" dy="21.6">results; the explicit feedback statement</tspan><tspan x="24" dy="21.6">returns results to the next allocation for</tspan><tspan x="24" dy="21.6">both teams. Lower arrows show the</tspan><tspan x="24" dy="21.6">proposed trial and review.</tspan></text><rect x="24" y="1655.95" width="312" height="117.94999999999982" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1681.95" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Evaluate opportunity and</tspan><tspan x="40" dy="22.950000000000003">quality, and protect a usable trial</tspan><tspan x="40" dy="22.950000000000003">rather than automatically rewarding</tspan><tspan x="40" dy="22.950000000000003">raw totals.</tspan></text><text x="24" y="1799.8999999999999" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Fixed funding means opportunity</tspan><tspan x="24" dy="22.950000000000003">cost. Recruiting, research delay, quality,</tspan><tspan x="24" dy="22.950000000000003">and inherited reputation still matter.</tspan></text></g></svg>
