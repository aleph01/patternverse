<svg xmlns="http://www.w3.org/2000/svg" width="840" height="847" viewBox="0 0 840 847" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Taking orders is faster than preparing drinks</title><desc id="desc">Hypothetical qualitative illustration. Paid orders queue before a limiting preparation station. More ticket storage cannot prepare drinks. An independently equipped trained barista can expand preparation, after which handover may become the next limit. The local queue and whole-process unfinished orders have different exit boundaries. Change: Increase usable preparation capacity or change accepted load, then reassess the whole process. Limitation: Staff and equipment cost money. Same machine access may prevent parallel work; quality and handover capacity remain.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Taking orders is faster than preparing drinks</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Orders follow one required process</tspan></text><rect x="24.0" y="140.5" width="171.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="167.5" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Take payment</tspan></text><text x="40.0" y="196.2" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Faster stage.</tspan></text><rect x="231.0" y="140.5" width="171.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="247.0" y="167.5" fill="#252c28" font-size="19"><tspan x="247.0" dy="0">Paid orders</tspan><tspan x="247.0" dy="25.650000000000002">waiting</tspan></text><text x="247.0" y="221.85" fill="#626962" font-size="17"><tspan x="247.0" dy="0">Queue before</tspan><tspan x="247.0" dy="22.950000000000003">preparation.</tspan></text><rect x="438.0" y="140.5" width="171.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="454.0" y="167.5" fill="#252c28" font-size="19"><tspan x="454.0" dy="0">Prepare drinks</tspan></text><text x="454.0" y="196.2" fill="#626962" font-size="17"><tspan x="454.0" dy="0">Current limiting</tspan><tspan x="454.0" dy="22.950000000000003">stage.</tspan></text><rect x="645.0" y="140.5" width="171.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="661.0" y="167.5" fill="#252c28" font-size="19"><tspan x="661.0" dy="0">Hand over</tspan><tspan x="661.0" dy="25.650000000000002">drinks</tspan></text><text x="661.0" y="221.85" fill="#626962" font-size="17"><tspan x="661.0" dy="0">Required before</tspan><tspan x="661.0" dy="22.950000000000003">completion.</tspan></text><path d="M 195.0 204.2 H 231.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 402.0 204.2 H 438.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 609.0 204.2 H 645.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="309.9" width="792" height="72.05000000000001" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="335.9" fill="#252c28" font-size="17"><tspan x="40" dy="0">Queue stock: paid orders enter; preparation starts remove them. Whole-process stock ends only at</tspan><tspan x="40" dy="22.950000000000003">handover. More ticket space adds no preparation capacity.</tspan></text><text x="24" y="407.95" fill="#252c28" font-size="18"><tspan x="24" dy="0">Change preparation capacity, then check the next limit</tspan></text><rect x="24.0" y="437.34999999999997" width="224.0" height="150.35" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="464.34999999999997" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Equip another barista</tspan></text><text x="40.0" y="493.04999999999995" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Usable parallel station;</tspan><tspan x="40.0" dy="22.950000000000003">same quality.</tspan></text><rect x="308.0" y="437.34999999999997" width="224.0" height="150.35" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="464.34999999999997" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">More preparation</tspan><tspan x="324.0" dy="25.650000000000002">possible</tspan></text><text x="324.0" y="518.6999999999999" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Backlog falls only if</tspan><tspan x="324.0" dy="22.950000000000003">completion exceeds</tspan><tspan x="324.0" dy="22.950000000000003">new orders.</tspan></text><rect x="592.0" y="437.34999999999997" width="224.0" height="150.35" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="464.34999999999997" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Check handover</tspan><tspan x="608.0" dy="25.650000000000002">capacity</tspan></text><text x="608.0" y="518.6999999999999" fill="#626962" font-size="17"><tspan x="608.0" dy="0">A different stage can</tspan><tspan x="608.0" dy="22.950000000000003">become limiting.</tspan></text><path d="M 248.0 512.525 H 308.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><path d="M 532.0 512.525 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="629.6999999999999" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows transfer work. Lower arrows show conditional intervention consequences, not measured rates.</tspan><tspan x="24" dy="21.6">No box size represents a quantity.</tspan></text><rect x="24" y="690.0999999999999" width="792" height="72.05000000000007" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="716.0999999999999" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Increase usable preparation capacity or change accepted load, then reassess the whole</tspan><tspan x="40" dy="22.950000000000003">process.</tspan></text><text x="24" y="788.15" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Staff and equipment cost money. Same machine access may prevent parallel work; quality and</tspan><tspan x="24" dy="22.950000000000003">handover capacity remain.</tspan></text></g></svg>
