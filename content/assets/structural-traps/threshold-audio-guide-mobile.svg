<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1782" viewBox="0 0 360 1782" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Pledges must become enough usable funding</title><desc id="desc">Hypothetical qualitative illustration. Ari, Bea, and Cam’s agreed pledges are all required in this plan for Maya’s free-to-watch film. Valid sufficient pledges permit collection; only sufficient actual collection permits production. A missing pledge blocks collection; a shortfall triggers this hypothetical campaign’s return rule. Dev can watch without pledging. Change: Protect failed pledges, coordinate enough real backing, and check collected funds before production. Limitation: Payment failures, production risk, unequal contributions, and administration remain. These extra conditions are not attributed to every platform.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Pledges must become enough</tspan><tspan x="24" dy="28.35">usable funding</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">A free-to-watch film · accepted</tspan><tspan x="24" dy="24.3">pledge shares</tspan></text><rect x="24" y="214.75000000000003" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Ari’s pledge</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Valid and affordable.</tspan></text><rect x="24" y="376.75" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="403.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Bea’s pledge</tspan></text><text x="40" y="432.45" fill="#626962" font-size="17"><tspan x="40" dy="0">Valid and affordable.</tspan></text><rect x="24" y="538.75" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="565.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Cam’s pledge</tspan></text><text x="40" y="594.45" fill="#626962" font-size="17"><tspan x="40" dy="0">Also required at these shares.</tspan></text><rect x="24" y="666.75" width="312" height="117.95000000000005" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="692.75" fill="#252c28" font-size="17"><tspan x="40" dy="0">ALL three shares are needed for</tspan><tspan x="40" dy="22.950000000000003">this plan. Dev may watch without</tspan><tspan x="40" dy="22.950000000000003">pledging. No single backer can</tspan><tspan x="40" dy="22.950000000000003">fund the film alone.</tspan></text><rect x="24" y="810.7" width="312" height="86" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="837.7" fill="#252c28" font-size="19"><tspan x="40" dy="0">Valid pledges cover budget?</tspan></text><text x="40" y="866.4000000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">Only then begin collection.</tspan></text><path d="M 180 896.7 V 972.7" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="972.7" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="999.7" fill="#252c28" font-size="19"><tspan x="40" dy="0">Enough actually collected?</tspan></text><text x="40" y="1028.4" fill="#626962" font-size="17"><tspan x="40" dy="0">Only then authorize production.</tspan></text><path d="M 180 1058.7 V 1134.7" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="1134.7" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1161.7" fill="#252c28" font-size="19"><tspan x="40" dy="0">Film if completed</tspan></text><text x="40" y="1190.4" fill="#626962" font-size="17"><tspan x="40" dy="0">Funding is not delivery.</tspan></text><rect x="24" y="1262.7" width="312" height="117.94999999999982" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1288.7" fill="#252c28" font-size="17"><tspan x="40" dy="0">Missing pledge: no collection.</tspan><tspan x="40" dy="22.950000000000003">Collection shortfall: no production;</tspan><tspan x="40" dy="22.950000000000003">return collected money under this</tspan><tspan x="40" dy="22.950000000000003">campaign’s agreed rule.</tspan></text><text x="24" y="1406.6499999999999" fill="#626962" font-size="16"><tspan x="24" dy="0">The pledge shares are jointly required at</tspan><tspan x="24" dy="21.6">this plan’s agreed amounts. Arrows below</tspan><tspan x="24" dy="21.6">show conditional authorization steps, not</tspan><tspan x="24" dy="21.6">a guarantee that the next step succeeds.</tspan></text><rect x="24" y="1510.2499999999998" width="312" height="117.94999999999982" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1536.2499999999998" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Protect failed pledges,</tspan><tspan x="40" dy="22.950000000000003">coordinate enough real backing,</tspan><tspan x="40" dy="22.950000000000003">and check collected funds before</tspan><tspan x="40" dy="22.950000000000003">production.</tspan></text><text x="24" y="1654.1999999999996" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Payment failures, production risk,</tspan><tspan x="24" dy="22.950000000000003">unequal contributions, and</tspan><tspan x="24" dy="22.950000000000003">administration remain. These extra</tspan><tspan x="24" dy="22.950000000000003">conditions are not attributed to every</tspan><tspan x="24" dy="22.950000000000003">platform.</tspan></text></g></svg>
