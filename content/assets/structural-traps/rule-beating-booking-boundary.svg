<svg xmlns="http://www.w3.org/2000/svg" width="840" height="812" viewBox="0 0 840 812" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Separate requests can hide one commitment</title><desc id="desc">Hypothetical qualitative illustration. Related small requests for one planned purchase each pass a narrow amount check. The enclosing boundary shows their shared requirement. Linking that requirement and reviewing its total changes what is checked, with explanation and appeal for mistaken grouping. Change: Review the related overall requirement, with proportionate linkage and a legitimate exception route. Limitation: Genuine separate needs must not be merged arbitrarily. Review costs time; complete rules may already prohibit splitting.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Separate requests can hide one commitment</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">One planned purchase, fragmented records</tspan></text><rect x="16" y="132.5" width="808" height="165.75" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="24.0" y="168.5" width="224.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="195.5" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Small request</tspan></text><text x="40.0" y="224.2" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Passes the narrow</tspan><tspan x="40.0" dy="22.950000000000003">amount check.</tspan></text><rect x="308.0" y="168.5" width="224.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="195.5" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Related request</tspan></text><text x="324.0" y="224.2" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Also passes separately.</tspan></text><rect x="592.0" y="168.5" width="224.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="195.5" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Another fragment</tspan></text><text x="608.0" y="224.2" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Same overall</tspan><tspan x="608.0" dy="22.950000000000003">requirement.</tspan></text><rect x="24" y="324.25" width="792" height="72.05000000000001" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="350.25" fill="#252c28" font-size="17"><tspan x="40" dy="0">Passing each amount check does not establish compliance with a full anti-splitting policy. The</tspan><tspan x="40" dy="22.950000000000003">aggregate commitment has escaped the intended review.</tspan></text><text x="24" y="422.3" fill="#252c28" font-size="18"><tspan x="24" dy="0">Change the checked boundary</tspan></text><rect x="24.0" y="451.7" width="366.0" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="478.7" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Link the real requirement</tspan></text><text x="40.0" y="507.4" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Explain grouping; allow correction and</tspan><tspan x="40.0" dy="22.950000000000003">appeal.</tspan></text><rect x="450.0" y="451.7" width="366.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="466.0" y="478.7" fill="#252c28" font-size="19"><tspan x="466.0" dy="0">Review total commitment</tspan></text><text x="466.0" y="507.4" fill="#626962" font-size="17"><tspan x="466.0" dy="0">Approve, revise, defer, or reject the</tspan><tspan x="466.0" dy="22.950000000000003">complete plan.</tspan></text><path d="M 390.0 502.575 H 450.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><text x="24" y="595.45" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper cards are related records, not equal spending quantities. The enclosing line identifies one requirement.</tspan><tspan x="24" dy="21.6">Lower arrows show revised review steps, not money flows.</tspan></text><rect x="24" y="655.85" width="792" height="72.05000000000007" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="681.85" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Review the related overall requirement, with proportionate linkage and a legitimate</tspan><tspan x="40" dy="22.950000000000003">exception route.</tspan></text><text x="24" y="753.9000000000001" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Genuine separate needs must not be merged arbitrarily. Review costs time; complete rules may</tspan><tspan x="24" dy="22.950000000000003">already prohibit splitting.</tspan></text></g></svg>
