<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1286" viewBox="0 0 360 1286" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">One wants a match; the other wants a mismatch</title><desc id="desc">Hypothetical qualitative illustration. Lena’s shot and Marco’s dive each have Left and Right choices. Matching directions favor a save; different directions favor a goal. Marco wants to match while Lena wants to avoid a match. Physical execution is uncertain, so cells describe relative chances rather than certain results. The comparisons show alternative choices, not successive moves; neither participant observes the other’s current choice. Change: Keep choices privately unpredictable while recognizing the opposed objectives. Limitation: No strategy guarantees this kick. Unequal directional effectiveness changes suitable mixing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4" /></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4" /></marker></defs><rect width="100%" height="100%" fill="#ffffff" />
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">One wants a match; the other</tspan><tspan x="24" dy="28.35">wants a mismatch</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Marco chooses Left</tspan></text><rect x="24" y="190.45000000000002" width="274" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="217.45000000000002" fill="#252c28" font-size="19"><tspan x="40" dy="0">Directions match</tspan></text><text x="40" y="246.15" fill="#626962" font-size="17"><tspan x="40" dy="0">Lena: Left. Save more likely;</tspan><tspan x="40" dy="22.950000000000003">Marco favors matching.</tspan></text><rect x="24" y="328.2" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="355.2" fill="#252c28" font-size="19"><tspan x="40" dy="0">Directions differ</tspan></text><text x="40" y="383.9" fill="#626962" font-size="17"><tspan x="40" dy="0">Lena: Right. Goal more likely;</tspan><tspan x="40" dy="22.950000000000003">Lena favors avoiding the dive.</tspan></text><text x="24" y="465.95" fill="#252c28" font-size="18"><tspan x="24" dy="0">Marco chooses Right</tspan></text><rect x="24" y="495.34999999999997" width="274" height="101.74999999999994" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="522.3499999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Directions differ</tspan></text><text x="40" y="551.05" fill="#626962" font-size="17"><tspan x="40" dy="0">Lena: Left. Goal more likely;</tspan><tspan x="40" dy="22.950000000000003">Lena favors avoiding the dive.</tspan></text><rect x="24" y="633.0999999999999" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="660.0999999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Directions match</tspan></text><text x="40" y="688.8" fill="#626962" font-size="17"><tspan x="40" dy="0">Lena: Right. Save more likely;</tspan><tspan x="40" dy="22.950000000000003">Marco favors matching.</tspan></text><rect x="24" y="770.8499999999999" width="312" height="117.95000000000005" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="796.8499999999999" fill="#252c28" font-size="17"><tspan x="40" dy="0">A predictable direction lets the</tspan><tspan x="40" dy="22.950000000000003">opponent choose the favorable</tspan><tspan x="40" dy="22.950000000000003">response. Private unpredictability</tspan><tspan x="40" dy="22.950000000000003">does not guarantee this kick.</tspan></text><text x="24" y="914.8" fill="#626962" font-size="16"><tspan x="24" dy="0">Each group fixes one possible dive by</tspan><tspan x="24" dy="21.6">Marco and compares Lena’s shots. These</tspan><tspan x="24" dy="21.6">are alternative cases, not successive</tspan><tspan x="24" dy="21.6">moves: neither player observes the other’s</tspan><tspan x="24" dy="21.6">current choice. The cards compare</tspan><tspan x="24" dy="21.6">chances, not utility scores or certain</tspan><tspan x="24" dy="21.6">outcomes.</tspan></text><rect x="24" y="1083.2" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2" /><text x="40" y="1109.2" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Keep choices privately</tspan><tspan x="40" dy="22.950000000000003">unpredictable while recognizing the</tspan><tspan x="40" dy="22.950000000000003">opposed objectives.</tspan></text><text x="24" y="1204.2" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: No strategy guarantees this kick.</tspan><tspan x="24" dy="22.950000000000003">Unequal directional effectiveness</tspan><tspan x="24" dy="22.950000000000003">changes suitable mixing.</tspan></text></g></svg>
