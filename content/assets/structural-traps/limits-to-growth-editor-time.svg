<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1065" viewBox="0 0 840 1065" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Growth loads the service that sustains growth</title><desc id="desc">Hypothetical qualitative illustration. Satisfied regulars recommend the restaurant and new satisfied visitors add to its customer base. More peak demand can overload the kitchen, worsen service, and weaken return visits and recommendations. Reservation limits and usable kitchen capability address the restraint rather than promoting harder. Change: Control accepted load while building the capability or revising the service growth requires. Limitation: Some customers cannot book; investment costs and delay remain. Another constraint can replace the kitchen.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Growth loads the service that sustains growth</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Growth loop · hypothesized reinforcing feedback</tspan></text><rect x="24" y="140.5" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="167.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Satisfied regulars</tspan></text><text x="40" y="196.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Return and recommend the</tspan><tspan x="40" dy="22.950000000000003">restaurant.</tspan></text><rect x="516" y="140.5" width="300" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="532" y="167.5" fill="#252c28" font-size="19"><tspan x="532" dy="0">New satisfied visitors</tspan></text><text x="532" y="196.2" fill="#626962" font-size="17"><tspan x="532" dy="0">Some become regular customers.</tspan></text><path d="M 324 191.375 H 516" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="342" y="158.375" fill="#626962" font-size="16"><tspan x="342" dy="0">brings visitors</tspan></text><path d="M 666.0 226.5 V 274.25 H 174.0 V 242.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="220" y="307.25" fill="#626962" font-size="16"><tspan x="220" dy="0">Return: new regulars add to the recommending base.</tspan></text><text x="24" y="352.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Limiting loop · growth loads the service</tspan></text><rect x="24.0" y="381.45" width="224.0" height="150.35" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="408.45" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">More peak demand</tspan></text><text x="40.0" y="437.15" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Existing and new</tspan><tspan x="40.0" dy="22.950000000000003">customers arrive.</tspan></text><rect x="308.0" y="381.45" width="224.0" height="150.35" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="408.45" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Kitchen overload</tspan></text><text x="324.0" y="437.15" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Longer waits and</tspan><tspan x="324.0" dy="22.950000000000003">inconsistent meals.</tspan></text><rect x="592.0" y="381.45" width="224.0" height="150.35" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="408.45" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Weaker repeat</tspan><tspan x="608.0" dy="25.650000000000002">demand</tspan></text><text x="608.0" y="462.79999999999995" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Fewer</tspan><tspan x="608.0" dy="22.950000000000003">recommendations and</tspan><tspan x="608.0" dy="22.950000000000003">return visits.</tspan></text><path d="M 248.0 456.625 H 308.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 532.0 456.625 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="573.8" width="792" height="72.05000000000007" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="599.8" fill="#252c28" font-size="17"><tspan x="40" dy="0">Return to the upper loop: fewer new regulars and more departures restrain the customer base.</tspan><tspan x="40" dy="22.950000000000003">Slower additions alone do not mean the base is shrinking.</tspan></text><text x="24" y="671.85" fill="#252c28" font-size="18"><tspan x="24" dy="0">Address support while controlling the pace</tspan></text><rect x="24.0" y="701.25" width="224.0" height="127.4" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="728.25" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Cap reservations</tspan><tspan x="40.0" dy="25.650000000000002">during preparation</tspan></text><text x="40.0" y="782.6" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Some customers</tspan><tspan x="40.0" dy="22.950000000000003">cannot book.</tspan></text><rect x="308.0" y="701.25" width="224.0" height="127.4" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="324.0" y="728.25" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Build usable kitchen</tspan><tspan x="324.0" dy="25.650000000000002">capability</tspan></text><text x="324.0" y="782.6" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Equipment and training</tspan><tspan x="324.0" dy="22.950000000000003">take time.</tspan></text><rect x="592.0" y="701.25" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="728.25" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Reassess growth and</tspan><tspan x="608.0" dy="25.650000000000002">service</tspan></text><text x="608.0" y="782.6" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Another limit can</tspan><tspan x="608.0" dy="22.950000000000003">appear.</tspan></text><path d="M 248.0 764.95 H 308.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><path d="M 532.0 764.95 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="870.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Arrows show hypothesized causal effects. The written return closes the limiting loop. Customer base is a</tspan><tspan x="24" dy="21.6">stock; visits are a flow. No lengths show growth rates.</tspan></text><rect x="24" y="931.05" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="957.05" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Control accepted load while building the capability or revising the service growth requires.</tspan></text><text x="24" y="1006.15" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Some customers cannot book; investment costs and delay remain. Another constraint can</tspan><tspan x="24" dy="22.950000000000003">replace the kitchen.</tspan></text></g></svg>
