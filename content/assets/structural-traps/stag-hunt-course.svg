<svg xmlns="http://www.w3.org/2000/svg" width="840" height="950" viewBox="0 0 840 950" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">The better hunt needs both participants</title><desc id="desc">Hypothetical qualitative illustration. Asha and Ben choose stag or hare without observing the other’s choice. Both stag and both hare are double-outlined equilibria. Each prefers stag against stag, but hare against hare. A lone stag hunter loses the dependable fallback. Change: Build credible assurance about the same joint plan; protection against failure would instead change payoffs. Limitation: Technical hunting risk is set aside. Promises alone may fail; the qualitative rankings do not establish risk dominance.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">The better hunt needs both participants</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="139.1" fill="#626962" font-size="17"><tspan x="24" dy="0">Asha ↓</tspan></text><text x="136" y="139.1" fill="#252c28" font-size="17"><tspan x="136" dy="0">Ben: Stag</tspan></text><text x="506" y="139.1" fill="#252c28" font-size="17"><tspan x="506" dy="0">Ben: Hare</tspan></text><text x="24" y="197.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Stag</tspan></text><rect x="124" y="165.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="140" y="192.1" fill="#252c28" font-size="19"><tspan x="140" dy="0">Both choose stag</tspan></text><text x="140" y="220.79999999999998" fill="#626962" font-size="17"><tspan x="140" dy="0">Both obtain the preferred shared</tspan><tspan x="140" dy="22.950000000000003">result.</tspan></text><rect x="128" y="169.1" width="314" height="218" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><rect x="494" y="165.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="510" y="192.1" fill="#252c28" font-size="19"><tspan x="510" dy="0">Asha chooses stag alone</tspan></text><text x="510" y="220.79999999999998" fill="#626962" font-size="17"><tspan x="510" dy="0">Asha loses the fallback; Ben gets a</tspan><tspan x="510" dy="22.950000000000003">hare.</tspan></text><text x="24" y="499.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Hare</tspan></text><rect x="124" y="467.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="140" y="494.1" fill="#252c28" font-size="19"><tspan x="140" dy="0">Ben chooses stag alone</tspan></text><text x="140" y="522.8" fill="#626962" font-size="17"><tspan x="140" dy="0">Ben loses the fallback; Asha gets a</tspan><tspan x="140" dy="22.950000000000003">hare.</tspan></text><rect x="494" y="467.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="510" y="494.1" fill="#252c28" font-size="19"><tspan x="510" dy="0">Both choose hare</tspan></text><text x="510" y="522.8" fill="#626962" font-size="17"><tspan x="510" dy="0">Dependable for each; less rewarding</tspan><tspan x="510" dy="22.950000000000003">than the shared stag.</tspan></text><rect x="498" y="471.1" width="314" height="218" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><text x="24" y="733.1" fill="#626962" font-size="16"><tspan x="24" dy="0">Cells compare simultaneous alternatives, not hunting chronology. Double outlines mark Nash equilibria. The</tspan><tspan x="24" dy="21.6">story is a stylized teaching model, not a field observation.</tspan></text><rect x="24" y="793.5" width="792" height="72.05000000000007" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="819.5" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Build credible assurance about the same joint plan; protection against failure would</tspan><tspan x="40" dy="22.950000000000003">instead change payoffs.</tspan></text><text x="24" y="891.5500000000001" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Technical hunting risk is set aside. Promises alone may fail; the qualitative rankings do not</tspan><tspan x="24" dy="22.950000000000003">establish risk dominance.</tspan></text></g></svg>
