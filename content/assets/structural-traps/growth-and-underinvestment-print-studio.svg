<svg xmlns="http://www.w3.org/2000/svg" width="840" height="886" viewBox="0 0 840 886" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Poor service can hide demand from the investment test</title><desc id="desc">Hypothetical feedback map. Long delivery quotes suppress Tess’s bookings. Weak bookings reduce the case for investment; usable finishing capacity arrives only after approval, equipping, and training. Inadequate capacity sustains delivery delay. Backlog recovery additionally requires completions above new bookings long enough to clear inherited work. Change: Test delay-sensitive demand and time investment for preparation. Limitation: Inquiries are not orders or proof that expansion pays; returning demand can consume the added capacity.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.3" /></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.3" /></marker></defs>
<rect width="100%" height="100%" fill="#ffffff" />
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Poor service can hide demand from the investment test</tspan></text><text x="24" y="66.25" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><rect x="24" y="126.25" width="300" height="132" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="154.25" fill="#252c28" font-size="19"><tspan x="40" dy="0">Delivery delay</tspan></text><text x="40" y="183.0" fill="#626962" font-size="17"><tspan x="40" dy="0">Tess’s finishing queue</tspan><tspan x="40" dy="22.950000000000003">lengthens quotes</tspan></text><rect x="516" y="126.25" width="300" height="132" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="532" y="154.25" fill="#252c28" font-size="19"><tspan x="532" dy="0">Bookings</tspan></text><text x="532" y="183.0" fill="#626962" font-size="17"><tspan x="532" dy="0">Some customers decline long</tspan><tspan x="532" dy="22.950000000000003">waits</tspan></text><rect x="516" y="358.25" width="300" height="132" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="532" y="386.25" fill="#252c28" font-size="19"><tspan x="532" dy="0">Case for investment</tspan></text><text x="532" y="415.0" fill="#626962" font-size="17"><tspan x="532" dy="0">Owner relies on signed orders</tspan></text><rect x="24" y="358.25" width="300" height="132" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="386.25" fill="#252c28" font-size="19"><tspan x="40" dy="0">Usable finishing capacity</tspan></text><text x="40" y="415.0" fill="#626962" font-size="17"><tspan x="40" dy="0">Equipped and prepared</tspan><tspan x="40" dy="22.950000000000003">operators</tspan></text><path d="M 324 192.25 H 516" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)" /><text x="342" y="167.25" fill="#626962" font-size="16"><tspan x="342" dy="0">reduces</tspan></text><path d="M 666 258.25 V 358.25" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)" /><text x="686" y="300.25" fill="#626962" font-size="16"><tspan x="686" dy="0">supports</tspan></text><path d="M 516 424.25 H 324" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)" /><text x="342" y="446.25" fill="#626962" font-size="16"><tspan x="342" dy="0">after approval,</tspan><tspan x="342" dy="21.6">equipping, and</tspan><tspan x="342" dy="21.6">training</tspan></text><path d="M 174 358.25 V 258.25" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)" /><text x="24" y="300.25" fill="#626962" font-size="16"><tspan x="24" dy="0">reduces delay</tspan></text><text x="24" y="541.25" fill="#626962" font-size="17"><tspan x="24" dy="0">Arrows: hypothesized effects, not chronology. The growth slowdown can be a response to</tspan><tspan x="24" dy="22.950000000000003">poor service, which then becomes a reason not to improve service.</tspan></text><rect x="24" y="598.45" width="792" height="49.10000000000002" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2" /><text x="40" y="624.45" fill="#252c28" font-size="17"><tspan x="40" dy="0">Recovery requires completions above new bookings long enough to clear inherited work.</tspan></text><rect x="24" y="685.5500000000001" width="792" height="107.29999999999995" rx="3" fill="#edf5f0" stroke="#00855b" stroke-width="1.2" /><text x="40" y="713.5500000000001" fill="#252c28" font-size="18"><tspan x="40" dy="0">Change the relationship</tspan></text><text x="40" y="744.0500000000001" fill="#252c28" font-size="18"><tspan x="40" dy="0">Test delay-sensitive demand and time investment for preparation, rather than</tspan><tspan x="40" dy="24.3">waiting only for deterred bookings.</tspan></text><text x="24" y="828.85" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Inquiries are not guaranteed orders. Extra capacity may fail if price, product,</tspan><tspan x="24" dy="22.950000000000003">or quality explains the decline.</tspan></text></g></svg>
