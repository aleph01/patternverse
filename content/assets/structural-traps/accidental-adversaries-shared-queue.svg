<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1188" viewBox="0 0 840 1188" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Local safeguards can undermine a beneficial partnership</title><desc id="desc">A hypothetical beneficial loop links Mira’s credible client plans with Owen’s reliable delivery. A separate harmful loop links unchecked promises to delivery disruption, withheld dates, negotiation pressure, and further unchecked promises. Local safeguards damage a partnership that could help both sides; neither needs to seek superiority. Shared provisional options and capacity checks address the harmful cross-effects.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.3"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.3"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Local safeguards can undermine a beneficial partnership</tspan></text><text x="24" y="68.25" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · causal relationships</tspan></text><text x="24" y="102.25" fill="#252c28" font-size="18"><tspan x="24" dy="0">The partnership worth preserving · reinforcing</tspan></text><rect x="24" y="182.75" width="320" height="152" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="210.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Mira’s credible client plans</tspan></text><text x="40" y="239.5" fill="#626962" font-size="17"><tspan x="40" dy="0">Feasible promises help Owen</tspan><tspan x="40" dy="22.950000000000003">schedule work.</tspan></text><rect x="496" y="182.75" width="320" height="152" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="512" y="210.75" fill="#252c28" font-size="19"><tspan x="512" dy="0">Owen’s reliable delivery</tspan></text><text x="512" y="239.5" fill="#626962" font-size="17"><tspan x="512" dy="0">Completed work supports</tspan><tspan x="512" dy="22.950000000000003">credible future plans.</tspan></text><path d="M 322 182.75 V 160.75 H 518 V 182.75" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="336.0" y="134.75" fill="#626962" font-size="16"><tspan x="336.0" dy="0">support reliable</tspan><tspan x="336.0" dy="21.6">delivery</tspan></text><path d="M 656.0 334.75 V 358.75 H 184.0 V 334.75" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="220" y="390.75" fill="#626962" font-size="16"><tspan x="220" dy="0">Return: reliable delivery supports credible</tspan><tspan x="220" dy="21.6">plans.</tspan></text><text x="24" y="494.35" fill="#252c28" font-size="18"><tspan x="24" dy="0">The damaging cross-effects · reinforcing</tspan></text><rect x="24" y="528.85" width="300" height="132" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="556.85" fill="#252c28" font-size="19"><tspan x="40" dy="0">Mira’s unchecked promises</tspan></text><text x="40" y="585.6" fill="#626962" font-size="17"><tspan x="40" dy="0">Dates are given without a</tspan><tspan x="40" dy="22.950000000000003">capacity check.</tspan></text><rect x="516" y="528.85" width="300" height="132" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="532" y="556.85" fill="#252c28" font-size="19"><tspan x="532" dy="0">Owen’s delivery disruption</tspan></text><text x="532" y="585.6" fill="#626962" font-size="17"><tspan x="532" dy="0">Restarts displace agreed</tspan><tspan x="532" dy="22.950000000000003">commitments.</tspan></text><rect x="516" y="760.85" width="300" height="132" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="532" y="788.85" fill="#252c28" font-size="19"><tspan x="532" dy="0">Dates withheld until late</tspan></text><text x="532" y="817.6" fill="#626962" font-size="17"><tspan x="532" dy="0">Owen protects the schedule.</tspan></text><rect x="24" y="760.85" width="300" height="132" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="788.85" fill="#252c28" font-size="19"><tspan x="40" dy="0">Mira’s negotiation</tspan><tspan x="40" dy="25.650000000000002">pressure</tspan></text><text x="40" y="843.25" fill="#626962" font-size="17"><tspan x="40" dy="0">Few credible options remain</tspan><tspan x="40" dy="22.950000000000003">for clients.</tspan></text><path d="M 324 594.85 H 516" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="344" y="568.85" fill="#626962" font-size="16"><tspan x="344" dy="0">increase</tspan><tspan x="344" dy="21.6">disruption</tspan></text><path d="M 666 660.85 V 760.85" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="684" y="699.85" fill="#626962" font-size="16"><tspan x="684" dy="0">encourages</tspan><tspan x="684" dy="21.6">withholding</tspan></text><path d="M 516 826.85 H 324" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="344" y="855.85" fill="#626962" font-size="16"><tspan x="344" dy="0">increases pressure</tspan></text><path d="M 174 760.85 V 660.85" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="24" y="699.85" fill="#626962" font-size="16"><tspan x="24" dy="0">prompts</tspan><tspan x="24" dy="21.6">unchecked</tspan><tspan x="24" dy="21.6">promises</tspan></text><text x="24" y="932.85" fill="#626962" font-size="16"><tspan x="24" dy="0">Arrows: hypothesized causal effects, not chronology. Reinforcing amplifies change; balancing</tspan><tspan x="24" dy="21.6">counteracts it.</tspan></text><rect x="24" y="988.45" width="792" height="107.29999999999995" rx="3" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1016.45" fill="#252c28" font-size="18"><tspan x="40" dy="0">Change the relationship</tspan></text><text x="40" y="1046.95" fill="#252c28" font-size="18"><tspan x="40" dy="0">Share provisional options early, confirm capacity before promising, and name</tspan><tspan x="40" dy="24.3">what changes displace.</tspan></text><text x="24" y="1131.75" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Joint understanding creates no extra hours. Genuine excess demand still requires</tspan><tspan x="24" dy="22.950000000000003">changes to staffing, scope, timing, or commitments.</tspan></text></g></svg>
