<svg xmlns="http://www.w3.org/2000/svg" width="840" height="804" viewBox="0 0 840 804" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Teaching to the test can crowd out other learning</title><desc id="desc">Hypothetical qualitative illustration. Alternative pre-teaching reward rules influence Jo’s allocation of finite teaching time between tested exercises and broader discussion and writing. A narrow bonus can favor real tested gains while displacing valuable untested work. Revised terms moderate the bonus and protect broader teaching. Change: Moderate the narrow reward and protect valuable learning outside the measure. Limitation: Less concentrated test preparation can lower reported gains. Broader learning and the effects of review still need evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Teaching to the test can crowd out other learning</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Alternative terms · agreed before teaching</tspan></text><rect x="24.0" y="140.5" width="366.0" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="167.5" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Narrow test bonus</tspan></text><text x="40.0" y="196.2" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Rewards tested results strongly.</tspan></text><rect x="450.0" y="140.5" width="366.0" height="86" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="466.0" y="167.5" fill="#252c28" font-size="19"><tspan x="466.0" dy="0">Revised terms</tspan></text><text x="466.0" y="196.2" fill="#626962" font-size="17"><tspan x="466.0" dy="0">Moderate bonus; protect broader teaching.</tspan></text><rect x="260" y="268.5" width="320" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="276" y="295.5" fill="#252c28" font-size="19"><tspan x="276" dy="0">Jo’s finite teaching time</tspan></text><text x="276" y="324.2" fill="#626962" font-size="17"><tspan x="276" dy="0">Time devoted to one duty is</tspan><tspan x="276" dy="22.950000000000003">unavailable to the other.</tspan></text><rect x="24" y="466.25" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="493.25" fill="#252c28" font-size="19"><tspan x="40" dy="0">Tested exercises</tspan></text><text x="40" y="521.95" fill="#626962" font-size="17"><tspan x="40" dy="0">Real gains can improve reported</tspan><tspan x="40" dy="22.950000000000003">results.</tspan></text><rect x="516" y="466.25" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="532" y="493.25" fill="#252c28" font-size="19"><tspan x="532" dy="0">Discussion and writing</tspan></text><text x="532" y="521.95" fill="#626962" font-size="17"><tspan x="532" dy="0">Valuable work outside the test’s</tspan><tspan x="532" dy="22.950000000000003">narrow scope.</tspan></text><path d="M 420.0 370.25 V 426.25" fill="none" stroke="#252c28" stroke-width="1.4"/><path d="M 420.0 426.25 H 174.0 V 466.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 420.0 426.25 H 666.0 V 466.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 207.0 226.5 V 244.5 H 420.0 V 268.5" fill="none" stroke="#252c28" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M 633.0 226.5 V 244.5 H 420.0 V 268.5" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><text x="24" y="610.0" fill="#626962" font-size="16"><tspan x="24" dy="0">Dashed and green inputs are alternative reward rules, not simultaneous payments. Branches allocate finite</tspan><tspan x="24" dy="21.6">attention; their sizes show no quantities or learning effects.</tspan></text><rect x="24" y="670.4" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="696.4" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Moderate the narrow reward and protect valuable learning outside the measure.</tspan></text><text x="24" y="745.5" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Less concentrated test preparation can lower reported gains. Broader learning and the effects of</tspan><tspan x="24" dy="22.950000000000003">review still need evidence.</tspan></text></g></svg>
