<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1649" viewBox="0 0 360 1649" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Occupied space closes a waiting cycle</title><desc id="desc">Hypothetical qualitative illustration. A holds A and requests B; B holds B and requests C; C holds C and requests D; D holds D and requests A. No ordinary forward move is available. Authorized removal of A to a safe bay frees A, allowing D, C, and B to move before A can re-enter. Change: Create a safe release, then prevent new entry from closing the cycle again. Limitation: Safe geometry, authority, and compliance are assumed. No road-control specification is supplied.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Occupied space closes a</tspan><tspan x="24" dy="28.35">waiting cycle</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Closed waiting cycle · resource map,</tspan><tspan x="24" dy="24.3">not road geometry</tspan></text><rect x="24" y="214.75000000000003" width="274" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Car A holds space A</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Needs space B before moving.</tspan></text><path d="M 161 300.75 V 368.75" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="178" y="326.75" fill="#626962" font-size="16"><tspan x="178" dy="0">requests B</tspan></text><rect x="24" y="368.75" width="274" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="395.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Car B holds space B</tspan></text><text x="40" y="424.45" fill="#626962" font-size="17"><tspan x="40" dy="0">Needs space C before moving.</tspan></text><path d="M 161 454.75 V 522.75" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="178" y="480.75" fill="#626962" font-size="16"><tspan x="178" dy="0">requests C</tspan></text><rect x="24" y="522.75" width="274" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="549.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Car C holds space C</tspan></text><text x="40" y="578.45" fill="#626962" font-size="17"><tspan x="40" dy="0">Needs space D before moving.</tspan></text><path d="M 161 608.75 V 676.75" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="178" y="634.75" fill="#626962" font-size="16"><tspan x="178" dy="0">requests D</tspan></text><rect x="24" y="676.75" width="274" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="703.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Car D holds space D</tspan></text><text x="40" y="732.45" fill="#626962" font-size="17"><tspan x="40" dy="0">Needs space A before moving.</tspan></text><path d="M 298 719.75 H 336 V 257.75 H 298" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="794.75" fill="#626962" font-size="16"><tspan x="24" dy="0">Return: D requests A</tspan></text><text x="24" y="837.55" fill="#252c28" font-size="18"><tspan x="24" dy="0">Authorized recovery · keep new entry</tspan><tspan x="24" dy="24.3">out</tspan></text><rect x="24" y="891.2499999999999" width="312" height="86" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="918.2499999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Move A into a safe bay</tspan></text><text x="40" y="946.9499999999999" fill="#626962" font-size="17"><tspan x="40" dy="0">Requires a verified extra movement.</tspan></text><path d="M 180 977.2499999999999 V 1053.25" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="1053.25" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1080.25" fill="#252c28" font-size="19"><tspan x="40" dy="0">D, then C, then B move</tspan></text><text x="40" y="1108.95" fill="#626962" font-size="17"><tspan x="40" dy="0">Each releases space for the next.</tspan></text><path d="M 180 1139.25 V 1215.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="1215.25" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1242.25" fill="#252c28" font-size="19"><tspan x="40" dy="0">A enters when clear</tspan></text><text x="40" y="1270.95" fill="#626962" font-size="17"><tspan x="40" dy="0">A has lost its earlier place.</tspan></text><text x="24" y="1343.25" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows: requests to the next holder.</tspan><tspan x="24" dy="21.6">Lower arrows: recovery chronology. Each</tspan><tspan x="24" dy="21.6">space has one occupant; there is no</tspan><tspan x="24" dy="21.6">ordinary escape in the initial model.</tspan></text><rect x="24" y="1446.85" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1472.85" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Create a safe release, then</tspan><tspan x="40" dy="22.950000000000003">prevent new entry from closing the</tspan><tspan x="40" dy="22.950000000000003">cycle again.</tspan></text><text x="24" y="1567.85" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Safe geometry, authority, and</tspan><tspan x="24" dy="22.950000000000003">compliance are assumed. No</tspan><tspan x="24" dy="22.950000000000003">road-control specification is supplied.</tspan></text></g></svg>
