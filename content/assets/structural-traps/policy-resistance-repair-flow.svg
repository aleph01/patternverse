<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1031" viewBox="0 0 840 1031" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">A wider road can attract more driving</title><desc id="desc">Hypothetical qualitative illustration. Added road capacity can reduce journey time, making driving more attractive and adding peak demand. The resulting congestion offsets part of the initial relief. A proposed peak charge with usable alternatives changes choices and requires wider monitoring. Change: Plan for behavioral responses and change incentives or feasible alternatives where authorized. Limitation: Access, affordability, diversion, implementation, and long-term development can limit or reverse the intended benefit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">A wider road can attract more driving</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><rect x="24" y="111.1" width="792" height="72.05000000000001" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="137.1" fill="#252c28" font-size="17"><tspan x="40" dy="0">Initial intervention: added usable road capacity can reduce journey time. That change enters the</tspan><tspan x="40" dy="22.950000000000003">response loop below.</tspan></text><text x="24" y="209.15" fill="#252c28" font-size="18"><tspan x="24" dy="0">Balancing response · opposite effects are written out</tspan></text><rect x="24" y="238.55" width="300" height="124.69999999999999" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="265.55" fill="#252c28" font-size="19"><tspan x="40" dy="0">Perceived journey time</tspan></text><text x="40" y="294.25" fill="#626962" font-size="17"><tspan x="40" dy="0">Longer journeys discourage some</tspan><tspan x="40" dy="22.950000000000003">peak driving; shorter journeys</tspan><tspan x="40" dy="22.950000000000003">attract it.</tspan></text><rect x="516" y="238.55" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="532" y="265.55" fill="#252c28" font-size="19"><tspan x="532" dy="0">Peak driving demand</tspan></text><text x="532" y="294.25" fill="#626962" font-size="17"><tspan x="532" dy="0">More vehicles using the road can</tspan><tspan x="532" dy="22.950000000000003">lengthen journeys.</tspan></text><path d="M 324 300.9 H 516" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="342" y="267.9" fill="#626962" font-size="16"><tspan x="342" dy="0">longer time</tspan><tspan x="342" dy="21.6">discourages driving</tspan></text><path d="M 666.0 340.3 V 395.25 H 174.0 V 363.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="220" y="428.25" fill="#626962" font-size="16"><tspan x="220" dy="0">Return: more driving increases journey time, offsetting</tspan><tspan x="220" dy="21.6">initial relief.</tspan></text><rect x="24" y="494.65000000000003" width="792" height="72.05000000000013" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="520.6500000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Fast responses: route and departure changes. Slower responses: new trips, commercial activity,</tspan><tspan x="40" dy="22.950000000000003">and location choices. A rebound alone does not prove induced demand.</tspan></text><text x="24" y="592.7000000000002" fill="#252c28" font-size="18"><tspan x="24" dy="0">Proposed package · changes choices and their costs</tspan></text><rect x="24.0" y="622.1000000000001" width="224.0" height="150.35" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="649.1000000000001" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Authorized peak</tspan><tspan x="40.0" dy="25.650000000000002">charge</tspan></text><text x="40.0" y="703.4500000000002" fill="#626962" font-size="17"><tspan x="40.0" dy="0">With genuinely usable</tspan><tspan x="40.0" dy="22.950000000000003">alternatives.</tspan></text><rect x="308.0" y="622.1000000000001" width="224.0" height="150.35000000000002" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="649.1000000000001" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Travel choices</tspan><tspan x="324.0" dy="25.650000000000002">respond</tspan></text><text x="324.0" y="703.4500000000002" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Some users pay,</tspan><tspan x="324.0" dy="22.950000000000003">reschedule, reroute, or</tspan><tspan x="324.0" dy="22.950000000000003">change mode.</tspan></text><rect x="592.0" y="622.1000000000001" width="224.0" height="150.35000000000002" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="649.1000000000001" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Review regional</tspan><tspan x="608.0" dy="25.650000000000002">effects</tspan></text><text x="608.0" y="703.4500000000002" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Check access,</tspan><tspan x="608.0" dy="22.950000000000003">diversion, and delayed</tspan><tspan x="608.0" dy="22.950000000000003">responses.</tspan></text><path d="M 248.0 697.2750000000001 H 308.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><path d="M 532.0 697.2750000000001 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="814.4500000000002" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows show hypothesized causal effects; the return label describes opposition to the initial relief.</tspan><tspan x="24" dy="21.6">Lower arrows show a proposed policy sequence, not measured effects.</tspan></text><rect x="24" y="874.8500000000001" width="792" height="72.05000000000007" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="900.8500000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Plan for behavioral responses and change incentives or feasible alternatives where</tspan><tspan x="40" dy="22.950000000000003">authorized.</tspan></text><text x="24" y="972.9000000000002" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Access, affordability, diversion, implementation, and long-term development can limit or reverse</tspan><tspan x="24" dy="22.950000000000003">the intended benefit.</tspan></text></g></svg>
