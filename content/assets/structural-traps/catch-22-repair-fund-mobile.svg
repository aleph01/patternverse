<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1447" viewBox="0 0 360 1447" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Experience needs an accepted first opportunity</title><desc id="desc">Hypothetical qualitative illustration. Lea needs previous paid experience for a first paid role, while that role supplies accepted experience. A new paid supervised entry route supplies assessed work without demanding prior employment, making later consideration possible. Change: Accept a funded first-entry route instead of requiring prior employment for every start. Limitation: The employer must accept the evidence. Supervision costs resources; satisfactory work and a later vacancy are not guaranteed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Experience needs an accepted</tspan><tspan x="24" dy="28.35">first opportunity</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">The first-job loop · accepted</tspan><tspan x="24" dy="24.3">experience only</tspan></text><rect x="24" y="214.75000000000003" width="274" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Previous paid experience</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Required by these employers.</tspan></text><rect x="24" y="400.75" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="427.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">A first paid role</tspan></text><text x="40" y="456.45" fill="#626962" font-size="17"><tspan x="40" dy="0">The available way to gain</tspan><tspan x="40" dy="22.950000000000003">accepted experience.</tspan></text><path d="M 161 300.75 V 400.75" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="181" y="329.75" fill="#626962" font-size="16"><tspan x="181" dy="0">qualifies for a</tspan><tspan x="181" dy="21.6">role</tspan></text><path d="M 298 451.625 H 336 V 257.75 H 298" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="538.5" fill="#626962" font-size="16"><tspan x="24" dy="0">Return: the role supplies accepted</tspan><tspan x="24" dy="21.6">experience.</tspan></text><text x="24" y="604.9" fill="#252c28" font-size="18"><tspan x="24" dy="0">New accepted entry route</tspan></text><rect x="24" y="634.3" width="312" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="661.3" fill="#252c28" font-size="19"><tspan x="40" dy="0">Paid supervised entry</tspan></text><text x="40" y="690.0" fill="#626962" font-size="17"><tspan x="40" dy="0">No prior job required; funded</tspan><tspan x="40" dy="22.950000000000003">supervision.</tspan></text><path d="M 180 736.05 V 812.05" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="812.05" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="839.05" fill="#252c28" font-size="19"><tspan x="40" dy="0">Assessed real work</tspan></text><text x="40" y="867.75" fill="#626962" font-size="17"><tspan x="40" dy="0">Satisfactory work counts as</tspan><tspan x="40" dy="22.950000000000003">experience.</tspan></text><path d="M 180 913.8 V 989.8" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="989.8" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1016.8" fill="#252c28" font-size="19"><tspan x="40" dy="0">Eligible for consideration</tspan></text><text x="40" y="1045.5" fill="#626962" font-size="17"><tspan x="40" dy="0">A later job is not guaranteed.</tspan></text><text x="24" y="1117.8" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows show qualifying</tspan><tspan x="24" dy="21.6">dependencies, not effects over time.</tspan><tspan x="24" dy="21.6">Lower arrows show an authorized entry</tspan><tspan x="24" dy="21.6">sequence.</tspan></text><rect x="24" y="1221.3999999999999" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1247.3999999999999" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Accept a funded first-entry</tspan><tspan x="40" dy="22.950000000000003">route instead of requiring prior</tspan><tspan x="40" dy="22.950000000000003">employment for every start.</tspan></text><text x="24" y="1342.3999999999999" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: The employer must accept the</tspan><tspan x="24" dy="22.950000000000003">evidence. Supervision costs resources;</tspan><tspan x="24" dy="22.950000000000003">satisfactory work and a later vacancy</tspan><tspan x="24" dy="22.950000000000003">are not guaranteed.</tspan></text></g></svg>
