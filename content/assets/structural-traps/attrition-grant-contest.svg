<svg xmlns="http://www.w3.org/2000/svg" width="840" height="780" viewBox="0 0 840 780" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Each pays while waiting for the other to close</title><desc id="desc">Hypothetical qualitative illustration. Iris and Noah each pay net operating losses while both shops remain. First exit ends coexistence costs and leaves the survivor opportunity to the other. A verified outside job and feasible closure improve Iris’s exit option; she exits in the stipulated continuation. Change: Compare forward-looking costs with a genuine exit option; improve that option where feasible. Limitation: Closure costs and lost survivor opportunity remain. A suitable alternative may be unavailable; survivor viability is assumed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Each pays while waiting for the other to close</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Same period of coexistence · each chooses when to exit</tspan></text><rect x="24.0" y="140.5" width="366.0" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="167.5" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Iris keeps her shop open</tspan></text><text x="40.0" y="196.2" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Pays net losses while Noah remains.</tspan></text><rect x="450.0" y="140.5" width="366.0" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="466.0" y="167.5" fill="#252c28" font-size="19"><tspan x="466.0" dy="0">Noah keeps his shop open</tspan></text><text x="466.0" y="196.2" fill="#626962" font-size="17"><tspan x="466.0" dy="0">Pays net losses while Iris remains.</tspan></text><rect x="24" y="268.5" width="792" height="72.05000000000001" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="294.5" fill="#252c28" font-size="17"><tspan x="40" dy="0">First exit ends coexistence costs for both. The survivor opportunity goes to the remaining shop;</tspan><tspan x="40" dy="22.950000000000003">earlier losses stay lost.</tspan></text><text x="24" y="366.55" fill="#252c28" font-size="18"><tspan x="24" dy="0">Change Iris’s exit option · hypothetical continuation</tspan></text><rect x="24.0" y="395.95" width="224.0" height="124.7" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="422.95" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Verified outside job</tspan></text><text x="40.0" y="451.65" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Feasible closure and</tspan><tspan x="40.0" dy="22.950000000000003">equipment disposal.</tspan></text><rect x="308.0" y="395.95" width="224.0" height="124.7" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="422.95" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Iris chooses to exit</tspan></text><text x="324.0" y="451.65" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Stops future operating</tspan><tspan x="324.0" dy="22.950000000000003">losses after closure</tspan><tspan x="324.0" dy="22.950000000000003">costs.</tspan></text><rect x="592.0" y="395.95" width="224.0" height="124.7" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="422.95" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Noah remains</tspan></text><text x="608.0" y="451.65" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Viability depends on the</tspan><tspan x="608.0" dy="22.950000000000003">stated survivor</tspan><tspan x="608.0" dy="22.950000000000003">assumption.</tspan></text><path d="M 248.0 458.3 H 308.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><path d="M 532.0 458.3 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="562.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper cards are simultaneous cost streams. Lower arrows show one hypothetical exit sequence, not an</tspan><tspan x="24" dy="21.6">equilibrium forecast or a general business prescription.</tspan></text><rect x="24" y="623.05" width="792" height="72.05000000000007" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="649.05" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Compare forward-looking costs with a genuine exit option; improve that option where</tspan><tspan x="40" dy="22.950000000000003">feasible.</tspan></text><text x="24" y="721.1" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Closure costs and lost survivor opportunity remain. A suitable alternative may be unavailable;</tspan><tspan x="24" dy="22.950000000000003">survivor viability is assumed.</tspan></text></g></svg>
