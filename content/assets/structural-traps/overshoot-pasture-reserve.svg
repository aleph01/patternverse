<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1273" viewBox="0 0 840 1273" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Withdrawals can exhaust support and damage its renewal</title><desc id="desc">Hypothetical stock-and-flow and causal comparison. Regrowth adds to the forage reserve; grazing removes it. Rosa’s growing herd commitments increase grazing pressure. When grazing exceeds regrowth, the reserve supplies the difference. A reinforcing damage loop links lower reserve, reduced protective cover, weakened regrowth capacity, and less replenishment. Exhausted or damaged support can force a severe reduction in herd or output. Early limits on commitments can preserve renewal, with lower short-term production.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.3"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.3"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Withdrawals can exhaust support and damage its renewal</tspan></text><text x="24" y="68.25" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · causal relationships</tspan></text><rect x="24" y="102.25" width="792" height="109.69999999999999" rx="3" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="131.25" fill="#252c28" font-size="18"><tspan x="40" dy="0">Growing commitments increase grazing pressure</tspan></text><text x="40" y="162.75" fill="#626962" font-size="17"><tspan x="40" dy="0">Rosa expands the herd after successful seasons. When grazing exceeds regrowth, the</tspan><tspan x="40" dy="22.950000000000003">reserve supplies the gap; stopping expansion can leave that deficit in place.</tspan></text><text x="24" y="243.95" fill="#252c28" font-size="18"><tspan x="24" dy="0">Forage transfers · stock and flows</tspan></text><rect x="24" y="288.45" width="220" height="152" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="316.45" fill="#252c28" font-size="19"><tspan x="40" dy="0">Regrowth · inflow</tspan></text><text x="40" y="345.2" fill="#626962" font-size="17"><tspan x="40" dy="0">New forage enters</tspan><tspan x="40" dy="22.950000000000003">the reserve.</tspan></text><rect x="310" y="288.45" width="220" height="152" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="326" y="316.45" fill="#252c28" font-size="19"><tspan x="326" dy="0">Forage reserve ·</tspan><tspan x="326" dy="25.650000000000002">stock</tspan></text><text x="326" y="370.84999999999997" fill="#626962" font-size="17"><tspan x="326" dy="0">Accumulated support</tspan><tspan x="326" dy="22.950000000000003">for Rosa’s herd.</tspan></text><rect x="596" y="288.45" width="220" height="152" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="612" y="316.45" fill="#252c28" font-size="19"><tspan x="612" dy="0">Grazing · outflow</tspan></text><text x="612" y="345.2" fill="#626962" font-size="17"><tspan x="612" dy="0">The herd removes</tspan><tspan x="612" dy="22.950000000000003">forage from the</tspan><tspan x="612" dy="22.950000000000003">reserve.</tspan></text><path d="M 244 354.45 H 310" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="252" y="329.45" fill="#626962" font-size="16"><tspan x="252" dy="0">adds</tspan></text><path d="M 530 354.45 H 596" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="538" y="329.45" fill="#626962" font-size="16"><tspan x="538" dy="0">takes</tspan></text><text x="24" y="482.45" fill="#252c28" font-size="18"><tspan x="24" dy="0">Damage to renewal · reinforcing causal loop</tspan></text><rect x="24" y="562.95" width="220" height="152" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="590.95" fill="#252c28" font-size="19"><tspan x="40" dy="0">Forage reserve</tspan></text><text x="40" y="619.7" fill="#626962" font-size="17"><tspan x="40" dy="0">Stored vegetation</tspan><tspan x="40" dy="22.950000000000003">supports cover.</tspan></text><rect x="310" y="562.95" width="220" height="152" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="326" y="590.95" fill="#252c28" font-size="19"><tspan x="326" dy="0">Protective cover</tspan></text><text x="326" y="619.7" fill="#626962" font-size="17"><tspan x="326" dy="0">Remaining cover</tspan><tspan x="326" dy="22.950000000000003">supports renewal.</tspan></text><rect x="596" y="562.95" width="220" height="152" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="612" y="590.95" fill="#252c28" font-size="19"><tspan x="612" dy="0">Regrowth capacity</tspan></text><text x="612" y="619.7" fill="#626962" font-size="17"><tspan x="612" dy="0">The pasture’s</tspan><tspan x="612" dy="22.950000000000003">ability to renew</tspan><tspan x="612" dy="22.950000000000003">forage.</tspan></text><path d="M 222 562.95 V 540.95 H 332 V 562.95" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="193.0" y="514.95" fill="#626962" font-size="16"><tspan x="193.0" dy="0">supports cover</tspan></text><path d="M 508 562.95 V 540.95 H 618 V 562.95" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="479.0" y="514.95" fill="#626962" font-size="16"><tspan x="479.0" dy="0">supports renewal</tspan></text><path d="M 706.0 714.95 V 738.95 H 134.0 V 714.95" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="220" y="770.95" fill="#626962" font-size="16"><tspan x="220" dy="0">Return: regrowth replenishes the reserve.</tspan></text><rect x="24" y="852.95" width="792" height="132.64999999999998" rx="3" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="881.95" fill="#252c28" font-size="18"><tspan x="40" dy="0">When support is exhausted or damaged</tspan></text><text x="40" y="913.45" fill="#626962" font-size="17"><tspan x="40" dy="0">Insufficient forage can force a severe reduction in the herd or its output:</tspan><tspan x="40" dy="22.950000000000003">collapse. Renewal damage can make the former herd size unsupportable even after</tspan><tspan x="40" dy="22.950000000000003">grazing is reduced.</tspan></text><text x="24" y="1017.6" fill="#626962" font-size="16"><tspan x="24" dy="0">First panel: arrows transfer forage. Second panel: arrows are hypothesized causal effects,</tspan><tspan x="24" dy="21.6">not chronology.</tspan></text><rect x="24" y="1073.2" width="792" height="107.29999999999995" rx="3" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1101.2" fill="#252c28" font-size="18"><tspan x="40" dy="0">Change the relationship</tspan></text><text x="40" y="1131.7" fill="#252c28" font-size="18"><tspan x="40" dy="0">Limit new commitments before damage, monitor renewal, and fund any needed</tspan><tspan x="40" dy="24.3">reduction or restoration.</tspan></text><text x="24" y="1216.5" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Reserve use can be sustainable when later replenishment restores it. Damage is</tspan><tspan x="24" dy="22.950000000000003">an explicit hypothesis here; collapse and irreversible loss are not inevitable.</tspan></text></g></svg>
