<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1641" viewBox="0 0 360 1641" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Private catches share the depletion cost</title><desc id="desc">Hypothetical qualitative illustration. Net natural production adds living biomass to the shared fish stock in this case. One fisher and other fishers take catches from that same stock. Combined harvesting exceeds net natural addition. A proposed assessment and shared catch limit change withdrawal rights, not the certainty of renewal. Change: Join withdrawal rights to a revisable shared limit, monitoring, and changing ecological conditions. Limitation: Monitoring costs resources; fishers lose some current take. A catch limit guarantees neither renewal nor recovery.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Private catches share the</tspan><tspan x="24" dy="28.35">depletion cost</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Private catches draw from one living</tspan><tspan x="24" dy="24.3">stock</tspan></text><rect x="24" y="214.75000000000003" width="312" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Net natural addition</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Reproduction and growth after</tspan><tspan x="40" dy="22.950000000000003">natural losses; positive here.</tspan></text><path d="M 180 316.5 V 392.5" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="392.5" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="419.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Fish in the lake</tspan></text><text x="40" y="448.2" fill="#626962" font-size="17"><tspan x="40" dy="0">One living biomass stock shared by</tspan><tspan x="40" dy="22.950000000000003">users.</tspan></text><rect x="24" y="554.25" width="140" height="127.39999999999998" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="581.25" fill="#252c28" font-size="19"><tspan x="40" dy="0">One fisher’s</tspan><tspan x="40" dy="25.650000000000002">catch</tspan></text><text x="40" y="635.6" fill="#626962" font-size="17"><tspan x="40" dy="0">Private food</tspan><tspan x="40" dy="22.950000000000003">or income.</tspan></text><rect x="196" y="554.25" width="140" height="153.04999999999995" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="212" y="581.25" fill="#252c28" font-size="19"><tspan x="212" dy="0">Other</tspan><tspan x="212" dy="25.650000000000002">fishers’</tspan><tspan x="212" dy="25.650000000000002">catches</tspan></text><text x="212" y="661.25" fill="#626962" font-size="17"><tspan x="212" dy="0">Use the</tspan><tspan x="212" dy="22.950000000000003">same stock.</tspan></text><path d="M 180.0 494.25 V 526.25 H 94.0 V 554.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 180.0 526.25 H 266.0 V 554.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="749.3" width="312" height="163.85000000000002" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="775.3" fill="#252c28" font-size="17"><tspan x="40" dy="0">In this hypothetical case combined</tspan><tspan x="40" dy="22.950000000000003">catches exceed net natural</tspan><tspan x="40" dy="22.950000000000003">addition, so the stock falls. Renewal</tspan><tspan x="40" dy="22.950000000000003">changes with population and</tspan><tspan x="40" dy="22.950000000000003">habitat; no fixed sustainable yield is</tspan><tspan x="40" dy="22.950000000000003">shown.</tspan></text><text x="24" y="939.15" fill="#252c28" font-size="18"><tspan x="24" dy="0">A revisable shared limit</tspan></text><rect x="24" y="968.55" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="995.55" fill="#252c28" font-size="19"><tspan x="40" dy="0">Assess stock and renewal</tspan></text><text x="40" y="1024.25" fill="#626962" font-size="17"><tspan x="40" dy="0">Uncertainty and outside users</tspan><tspan x="40" dy="22.950000000000003">matter.</tspan></text><path d="M 180 1070.3 V 1146.3" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="1146.3" width="312" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1173.3" fill="#252c28" font-size="19"><tspan x="40" dy="0">Agree and enforce catches</tspan></text><text x="40" y="1202.0" fill="#626962" font-size="17"><tspan x="40" dy="0">Revise the limit when conditions</tspan><tspan x="40" dy="22.950000000000003">change.</tspan></text><text x="24" y="1290.05" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows transfer fish biomass; net</tspan><tspan x="24" dy="21.6">addition already accounts for natural</tspan><tspan x="24" dy="21.6">losses. Lower arrows show governance</tspan><tspan x="24" dy="21.6">steps, not fish flows. No width represents</tspan><tspan x="24" dy="21.6">a catch quantity.</tspan></text><rect x="24" y="1415.25" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1441.25" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Join withdrawal rights to a</tspan><tspan x="40" dy="22.950000000000003">revisable shared limit, monitoring,</tspan><tspan x="40" dy="22.950000000000003">and changing ecological conditions.</tspan></text><text x="24" y="1536.25" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Monitoring costs resources;</tspan><tspan x="24" dy="22.950000000000003">fishers lose some current take. A catch</tspan><tspan x="24" dy="22.950000000000003">limit guarantees neither renewal nor</tspan><tspan x="24" dy="22.950000000000003">recovery.</tspan></text></g></svg>
