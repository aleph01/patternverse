<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1648" viewBox="0 0 360 1648" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Overtime can clear work and create later rework</title><desc id="desc">Hypothetical qualitative illustration. Backlog pressure prompts extended work, whose extra completions initially reduce pressure. Repeated insufficient recovery can contribute to fatigue, undiscovered errors, and later corrections that refill the backlog. The return burden exceeds initial relief by assumption in this case. Change: Break the fatigue-and-error path while covering continuing work and inherited corrections. Limitation: Recovery and discovery take time. Added qualified coverage, slower promises, or reduced commitments have costs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Overtime can clear work and</tspan><tspan x="24" dy="28.35">create later rework</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Fast relief · balancing response</tspan></text><rect x="24" y="190.45000000000002" width="274" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="217.45000000000002" fill="#252c28" font-size="19"><tspan x="40" dy="0">Visible backlog pressure</tspan></text><text x="40" y="246.15" fill="#626962" font-size="17"><tspan x="40" dy="0">More unfinished work prompts</tspan><tspan x="40" dy="22.950000000000003">extra hours.</tspan></text><rect x="24" y="392.2" width="274" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="419.2" fill="#252c28" font-size="19"><tspan x="40" dy="0">Repeated extended work</tspan></text><text x="40" y="447.9" fill="#626962" font-size="17"><tspan x="40" dy="0">Initially increases completions.</tspan></text><path d="M 161 292.2 V 392.2" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="181" y="321.2" fill="#626962" font-size="16"><tspan x="181" dy="0">prompts</tspan><tspan x="181" dy="21.6">overtime</tspan></text><path d="M 298 435.2 H 336 V 241.325 H 298" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="514.2" fill="#626962" font-size="16"><tspan x="24" dy="0">Return: extra completions reduce the</tspan><tspan x="24" dy="21.6">backlog at first.</tspan></text><text x="24" y="580.6" fill="#252c28" font-size="18"><tspan x="24" dy="0">Delayed harm from that same remedy</tspan></text><rect x="24" y="610.0" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="637.0" fill="#252c28" font-size="19"><tspan x="40" dy="0">Inadequate recovery</tspan></text><text x="40" y="665.7" fill="#626962" font-size="17"><tspan x="40" dy="0">Fatigue can impair work.</tspan></text><path d="M 180 696.0 V 772.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="772.0" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="799.0" fill="#252c28" font-size="19"><tspan x="40" dy="0">Undiscovered errors</tspan></text><text x="40" y="827.7" fill="#626962" font-size="17"><tspan x="40" dy="0">Latent work waits for discovery.</tspan></text><path d="M 180 858.0 V 934.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="934.0" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="961.0" fill="#252c28" font-size="19"><tspan x="40" dy="0">Corrections return</tspan></text><text x="40" y="989.7" fill="#626962" font-size="17"><tspan x="40" dy="0">Rework adds to the backlog.</tspan></text><rect x="24" y="1062.0" width="312" height="186.79999999999995" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1088.0" fill="#252c28" font-size="17"><tspan x="40" dy="0">Return to backlog pressure:</tspan><tspan x="40" dy="22.950000000000003">delayed corrections can prompt</tspan><tspan x="40" dy="22.950000000000003">more extended work. This case</tspan><tspan x="40" dy="22.950000000000003">assumes the return burden</tspan><tspan x="40" dy="22.950000000000003">outweighs initial relief; ordinary</tspan><tspan x="40" dy="22.950000000000003">errors or new demand alone would</tspan><tspan x="40" dy="22.950000000000003">not prove the link.</tspan></text><text x="24" y="1274.8" fill="#626962" font-size="16"><tspan x="24" dy="0">Arrows are hypothesized causal effects,</tspan><tspan x="24" dy="21.6">not measured rates. The lower route</tspan><tspan x="24" dy="21.6">returns to backlog pressure; latent errors</tspan><tspan x="24" dy="21.6">and known unfinished work are different</tspan><tspan x="24" dy="21.6">accumulations.</tspan></text><rect x="24" y="1400.0" width="312" height="117.94999999999982" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1426.0" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Break the</tspan><tspan x="40" dy="22.950000000000003">fatigue-and-error path while</tspan><tspan x="40" dy="22.950000000000003">covering continuing work and</tspan><tspan x="40" dy="22.950000000000003">inherited corrections.</tspan></text><text x="24" y="1543.9499999999998" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Recovery and discovery take</tspan><tspan x="24" dy="22.950000000000003">time. Added qualified coverage, slower</tspan><tspan x="24" dy="22.950000000000003">promises, or reduced commitments</tspan><tspan x="24" dy="22.950000000000003">have costs.</tspan></text></g></svg>
