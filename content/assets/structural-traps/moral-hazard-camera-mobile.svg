<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1600" viewBox="0 0 360 1600" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Effort and financial loss fall on different parties</title><desc id="desc">Hypothetical qualitative illustration. Under full financial protection, Tess bears packing effort but the pool pays the covered repair loss. Under the proposed deductible Tess still bears effort and also the initial part of a covered loss; the pool bears the remainder. Packing stays private and damage stays uncertain. More care is conditional on the private loss reduction outweighing effort. Change: Reconnect preventable loss to the decision, or reduce prevention effort directly. Limitation: More care is conditional on incentives and acceptable terms. Tess may bear more risk and be worse off.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Effort and financial loss fall on</tspan><tspan x="24" dy="28.35">different parties</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Full financial protection</tspan></text><text x="34.0" y="210.45000000000002" fill="#252c28" font-size="17"><tspan x="34.0" dy="0">Party</tspan></text><text x="138.0" y="210.45000000000002" fill="#252c28" font-size="17"><tspan x="138.0" dy="0">Packing</tspan><tspan x="138.0" dy="22.950000000000003">effort</tspan></text><text x="242.0" y="210.45000000000002" fill="#252c28" font-size="17"><tspan x="242.0" dy="0">Covered</tspan><tspan x="242.0" dy="22.950000000000003">repair</tspan><tspan x="242.0" dy="22.950000000000003">loss</tspan></text><rect x="24.0" y="290.45000000000005" width="104.0" height="112" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="34.0" y="320.45000000000005" fill="#252c28" font-size="17"><tspan x="34.0" dy="0">Tess</tspan></text><rect x="128.0" y="290.45000000000005" width="104.0" height="112" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="138.0" y="320.45000000000005" fill="#252c28" font-size="17"><tspan x="138.0" dy="0">Bears</tspan><tspan x="138.0" dy="22.950000000000003">effort</tspan></text><rect x="232.0" y="290.45000000000005" width="104.0" height="112" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="242.0" y="320.45000000000005" fill="#252c28" font-size="17"><tspan x="242.0" dy="0">None</tspan><tspan x="242.0" dy="22.950000000000003">paid</tspan></text><rect x="24.0" y="402.45000000000005" width="104.0" height="112" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="34.0" y="432.45000000000005" fill="#252c28" font-size="17"><tspan x="34.0" dy="0">Pool</tspan></text><rect x="128.0" y="402.45000000000005" width="104.0" height="112" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="138.0" y="432.45000000000005" fill="#252c28" font-size="17"><tspan x="138.0" dy="0">Does not</tspan><tspan x="138.0" dy="22.950000000000003">pack</tspan></text><rect x="232.0" y="402.45000000000005" width="104.0" height="112" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="242.0" y="432.45000000000005" fill="#252c28" font-size="17"><tspan x="242.0" dy="0">Repair bill</tspan></text><text x="24" y="558.45" fill="#252c28" font-size="18"><tspan x="24" dy="0">Proposed deductible</tspan></text><text x="34.0" y="607.85" fill="#252c28" font-size="17"><tspan x="34.0" dy="0">Party</tspan></text><text x="138.0" y="607.85" fill="#252c28" font-size="17"><tspan x="138.0" dy="0">Packing</tspan><tspan x="138.0" dy="22.950000000000003">effort</tspan></text><text x="242.0" y="607.85" fill="#252c28" font-size="17"><tspan x="242.0" dy="0">Covered</tspan><tspan x="242.0" dy="22.950000000000003">repair</tspan><tspan x="242.0" dy="22.950000000000003">loss</tspan></text><rect x="24.0" y="687.85" width="104.0" height="112" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="34.0" y="717.85" fill="#252c28" font-size="17"><tspan x="34.0" dy="0">Tess</tspan></text><rect x="128.0" y="687.85" width="104.0" height="112" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="138.0" y="717.85" fill="#252c28" font-size="17"><tspan x="138.0" dy="0">Bears</tspan><tspan x="138.0" dy="22.950000000000003">effort</tspan></text><rect x="232.0" y="687.85" width="104.0" height="112" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="242.0" y="717.85" fill="#252c28" font-size="17"><tspan x="242.0" dy="0">Initial part</tspan></text><rect x="24.0" y="799.85" width="104.0" height="112" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="34.0" y="829.85" fill="#252c28" font-size="17"><tspan x="34.0" dy="0">Pool</tspan></text><rect x="128.0" y="799.85" width="104.0" height="112" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="138.0" y="829.85" fill="#252c28" font-size="17"><tspan x="138.0" dy="0">Does not</tspan><tspan x="138.0" dy="22.950000000000003">pack</tspan></text><rect x="232.0" y="799.85" width="104.0" height="112" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="242.0" y="829.85" fill="#252c28" font-size="17"><tspan x="242.0" dy="0">Remaining</tspan><tspan x="242.0" dy="22.950000000000003">covered</tspan><tspan x="242.0" dy="22.950000000000003">loss</tspan></text><text x="24" y="955.85" fill="#252c28" font-size="18"><tspan x="24" dy="0">Action stays private; damage stays</tspan><tspan x="24" dy="24.3">uncertain</tspan></text><rect x="24" y="1009.55" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1036.55" fill="#252c28" font-size="19"><tspan x="40" dy="0">Tess chooses packing</tspan></text><text x="40" y="1065.25" fill="#626962" font-size="17"><tspan x="40" dy="0">Care still costs effort.</tspan></text><path d="M 180 1095.55 V 1171.55" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="1171.55" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1198.55" fill="#252c28" font-size="19"><tspan x="40" dy="0">Risk can change</tspan></text><text x="40" y="1227.25" fill="#626962" font-size="17"><tspan x="40" dy="0">Good care does not rule out</tspan><tspan x="40" dy="22.950000000000003">damage.</tspan></text><text x="24" y="1315.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Rows allocate burdens. Lower arrows</tspan><tspan x="24" dy="21.6">show the order from private action to</tspan><tspan x="24" dy="21.6">uncertain outcome.</tspan></text><rect x="24" y="1397.3" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1423.3" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Reconnect preventable</tspan><tspan x="40" dy="22.950000000000003">loss to the decision, or reduce</tspan><tspan x="40" dy="22.950000000000003">prevention effort directly.</tspan></text><text x="24" y="1518.3" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: More care is conditional on</tspan><tspan x="24" dy="22.950000000000003">incentives and acceptable terms. Tess</tspan><tspan x="24" dy="22.950000000000003">may bear more risk and be worse off.</tspan></text></g></svg>
