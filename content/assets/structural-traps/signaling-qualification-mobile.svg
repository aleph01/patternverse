<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1830" viewBox="0 0 360 1830" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">A qualification is informative only if incentives support it</title><desc id="desc">Hypothetical qualitative illustration. In the proposed separating profile, a capable applicant finds an authentic educational qualification worthwhile if hired, while a less-capable applicant finds imitation too costly. Mara observes qualification rather than private ability and responds consistently with those choices. Change: Check imitation incentives and access, or obtain direct relevant evidence instead. Limitation: Expense alone proves little. Changed rewards, subsidies, unequal access, or other equilibria can undo separation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">A qualification is informative</tspan><tspan x="24" dy="28.35">only if incentives support it</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Private ability → observable</tspan><tspan x="24" dy="24.3">qualification → hiring decision</tspan></text><text x="24" y="214.75000000000003" fill="#252c28" font-size="18"><tspan x="24" dy="0">Alternative applicant · capable for this</tspan><tspan x="24" dy="24.3">job</tspan></text><rect x="24" y="268.45000000000005" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="295.45000000000005" fill="#252c28" font-size="19"><tspan x="40" dy="0">Capable applicant</tspan></text><text x="40" y="324.15000000000003" fill="#626962" font-size="17"><tspan x="40" dy="0">Qualification cost is worthwhile if</tspan><tspan x="40" dy="22.950000000000003">hired.</tspan></text><path d="M 180 370.20000000000005 V 446.20000000000005" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="446.20000000000005" width="312" height="86" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="473.20000000000005" fill="#252c28" font-size="19"><tspan x="40" dy="0">Obtains qualification</tspan></text><text x="40" y="501.90000000000003" fill="#626962" font-size="17"><tspan x="40" dy="0">An authentic observable credential.</tspan></text><path d="M 180 532.2 V 608.2" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="608.2" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="635.2" fill="#252c28" font-size="19"><tspan x="40" dy="0">Mara hires</tspan></text><text x="40" y="663.9000000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">Her inference fits these stipulated</tspan><tspan x="40" dy="22.950000000000003">incentives.</tspan></text><text x="24" y="751.95" fill="#252c28" font-size="18"><tspan x="24" dy="0">Alternative applicant · not yet capable</tspan><tspan x="24" dy="24.3">for this job</tspan></text><rect x="24" y="805.65" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="832.65" fill="#252c28" font-size="19"><tspan x="40" dy="0">Less-capable applicant</tspan></text><text x="40" y="861.35" fill="#626962" font-size="17"><tspan x="40" dy="0">Imitation costs more than this</tspan><tspan x="40" dy="22.950000000000003">opportunity is worth.</tspan></text><path d="M 180 907.4 V 983.4" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="983.4" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1010.4" fill="#252c28" font-size="19"><tspan x="40" dy="0">Does not imitate</tspan></text><text x="40" y="1039.1" fill="#626962" font-size="17"><tspan x="40" dy="0">The lack of credential is observable.</tspan></text><path d="M 180 1069.4 V 1145.4" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="1145.4" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1172.4" fill="#252c28" font-size="19"><tspan x="40" dy="0">Mara declines</tspan></text><text x="40" y="1201.1000000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">This inference needs the stated</tspan><tspan x="40" dy="22.950000000000003">access and cost assumptions.</tspan></text><rect x="24" y="1289.15" width="312" height="163.8499999999999" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1315.15" fill="#252c28" font-size="17"><tspan x="40" dy="0">The private ability labels are for the</tspan><tspan x="40" dy="22.950000000000003">reader, not information Mara sees.</tspan><tspan x="40" dy="22.950000000000003">The signal need not directly test the</tspan><tspan x="40" dy="22.950000000000003">job task; real education can also</tspan><tspan x="40" dy="22.950000000000003">build skills. Equal access cannot be</tspan><tspan x="40" dy="22.950000000000003">assumed.</tspan></text><text x="24" y="1479.0" fill="#626962" font-size="16"><tspan x="24" dy="0">Arrows show private type, chosen</tspan><tspan x="24" dy="21.6">observable action, then employer</tspan><tspan x="24" dy="21.6">response. They are not a claim about an</tspan><tspan x="24" dy="21.6">actual qualification or a ranking of</tspan><tspan x="24" dy="21.6">people’s overall worth.</tspan></text><rect x="24" y="1604.2" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1630.2" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Check imitation incentives</tspan><tspan x="40" dy="22.950000000000003">and access, or obtain direct</tspan><tspan x="40" dy="22.950000000000003">relevant evidence instead.</tspan></text><text x="24" y="1725.2" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Expense alone proves little.</tspan><tspan x="24" dy="22.950000000000003">Changed rewards, subsidies, unequal</tspan><tspan x="24" dy="22.950000000000003">access, or other equilibria can undo</tspan><tspan x="24" dy="22.950000000000003">separation.</tspan></text></g></svg>
