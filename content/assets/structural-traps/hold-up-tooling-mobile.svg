<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1677" viewBox="0 0 360 1677" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Fit-out changes the cost of walking away</title><desc id="desc">Hypothetical qualitative illustration. After location-specific fit-out, the initial lease expires and Orion proposes renewal. Lina can accept or leave with weak outside value for dedicated fixtures. A more costly portable design can preserve a stronger moving option if real premises and affordable relocation exist. Change: Protect usable outside value or secure credible terms before committing specific investment. Limitation: Portability costs more; some fit-out stays sunk. Real alternatives and sufficient returns remain necessary.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Fit-out changes the cost of</tspan><tspan x="24" dy="28.35">walking away</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Before spending · anticipate the later</tspan><tspan x="24" dy="24.3">renewal choice</tspan></text><rect x="24" y="214.75000000000003" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Dedicated shop fit-out</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Much of its value is lost on moving.</tspan></text><path d="M 180 300.75 V 376.75" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="376.75" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="403.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Initial lease expires</tspan></text><text x="40" y="432.45" fill="#626962" font-size="17"><tspan x="40" dy="0">Unprotected renewal terms are</tspan><tspan x="40" dy="22.950000000000003">proposed later.</tspan></text><rect x="24" y="520.5" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="547.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Orion proposes renewal terms</tspan></text><text x="40" y="576.2" fill="#626962" font-size="17"><tspan x="40" dy="0">The existing lease has been</tspan><tspan x="40" dy="22.950000000000003">honored.</tspan></text><rect x="62" y="698.25" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="78" y="725.25" fill="#252c28" font-size="19"><tspan x="78" dy="0">Lina accepts</tspan></text><text x="78" y="753.95" fill="#626962" font-size="17"><tspan x="78" dy="0">May retain more value than</tspan><tspan x="78" dy="22.950000000000003">walking away.</tspan></text><rect x="62" y="832.0" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="78" y="859.0" fill="#252c28" font-size="19"><tspan x="78" dy="0">Lina leaves</tspan></text><text x="78" y="887.7" fill="#626962" font-size="17"><tspan x="78" dy="0">Dedicated fixtures have weak</tspan><tspan x="78" dy="22.950000000000003">outside value.</tspan></text><path d="M 180.0 622.25 V 654.25 H 36 V 882.875" fill="none" stroke="#252c28" stroke-width="1.4"/><path d="M 36 749.125 H 62" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 36 882.875 H 62" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="975.75" fill="#252c28" font-size="18"><tspan x="24" dy="0">Change the fallback before fitting out</tspan></text><rect x="24" y="1005.15" width="312" height="101.75000000000011" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1032.15" fill="#252c28" font-size="19"><tspan x="40" dy="0">Portable fittings</tspan></text><text x="40" y="1060.8500000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">Cost more initially; real other</tspan><tspan x="40" dy="22.950000000000003">premises are available.</tspan></text><path d="M 180 1106.9 V 1182.9" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="1182.9" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1209.9" fill="#252c28" font-size="19"><tspan x="40" dy="0">Stronger moving option</tspan></text><text x="40" y="1238.6000000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">Can improve renewal bargaining;</tspan><tspan x="40" dy="22.950000000000003">some costs stay sunk.</tspan></text><text x="24" y="1326.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows show investment and later</tspan><tspan x="24" dy="21.6">renewal timing; the fork shows accept or</tspan><tspan x="24" dy="21.6">reject. Lower arrows compare a different</tspan><tspan x="24" dy="21.6">design, not an automatic third option after</tspan><tspan x="24" dy="21.6">spending.</tspan></text><rect x="24" y="1451.8500000000001" width="312" height="117.94999999999982" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1477.8500000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Protect usable outside</tspan><tspan x="40" dy="22.950000000000003">value or secure credible terms</tspan><tspan x="40" dy="22.950000000000003">before committing specific</tspan><tspan x="40" dy="22.950000000000003">investment.</tspan></text><text x="24" y="1595.8" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Portability costs more; some</tspan><tspan x="24" dy="22.950000000000003">fit-out stays sunk. Real alternatives and</tspan><tspan x="24" dy="22.950000000000003">sufficient returns remain necessary.</tspan></text></g></svg>
