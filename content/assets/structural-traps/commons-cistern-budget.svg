<svg xmlns="http://www.w3.org/2000/svg" width="840" height="915" viewBox="0 0 840 915" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Private catches share the depletion cost</title><desc id="desc">Hypothetical qualitative illustration. Net natural production adds living biomass to the shared fish stock in this case. One fisher and other fishers take catches from that same stock. Combined harvesting exceeds net natural addition. A proposed assessment and shared catch limit change withdrawal rights, not the certainty of renewal. Change: Join withdrawal rights to a revisable shared limit, monitoring, and changing ecological conditions. Limitation: Monitoring costs resources; fishers lose some current take. A catch limit guarantees neither renewal nor recovery.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Private catches share the depletion cost</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Private catches draw from one living stock</tspan></text><rect x="24" y="218.5" width="224" height="147.64999999999998" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="245.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Net natural addition</tspan></text><text x="40" y="274.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Growth and</tspan><tspan x="40" dy="22.950000000000003">reproduction after</tspan><tspan x="40" dy="22.950000000000003">natural losses; positive</tspan><tspan x="40" dy="22.950000000000003">here.</tspan></text><rect x="308" y="218.5" width="224" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324" y="245.5" fill="#252c28" font-size="19"><tspan x="324" dy="0">Fish in the lake</tspan></text><text x="324" y="274.2" fill="#626962" font-size="17"><tspan x="324" dy="0">One living biomass</tspan><tspan x="324" dy="22.950000000000003">stock shared by users.</tspan></text><rect x="592" y="140.5" width="224" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608" y="167.5" fill="#252c28" font-size="19"><tspan x="608" dy="0">One fisher’s catch</tspan></text><text x="608" y="196.2" fill="#626962" font-size="17"><tspan x="608" dy="0">Private food or income.</tspan></text><rect x="592" y="296.5" width="224" height="104.44999999999999" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608" y="323.5" fill="#252c28" font-size="19"><tspan x="608" dy="0">Other fishers’</tspan><tspan x="608" dy="25.650000000000002">catches</tspan></text><text x="608" y="377.84999999999997" fill="#626962" font-size="17"><tspan x="608" dy="0">Use the same stock.</tspan></text><path d="M 248 292.325 H 308" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 532 269.375 H 562" fill="none" stroke="#252c28" stroke-width="1.4"/><path d="M 562 183.5 V 348.725" fill="none" stroke="#252c28" stroke-width="1.4"/><path d="M 562 183.5 H 592" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 562 348.725 H 592" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="442.95" width="792" height="72.05000000000001" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="468.95" fill="#252c28" font-size="17"><tspan x="40" dy="0">In this hypothetical case combined catches exceed net natural addition, so the stock falls. Renewal</tspan><tspan x="40" dy="22.950000000000003">changes with population and habitat; no fixed sustainable yield is shown.</tspan></text><text x="24" y="541.0" fill="#252c28" font-size="18"><tspan x="24" dy="0">A revisable shared limit</tspan></text><rect x="24.0" y="570.4" width="366.0" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="597.4" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Assess stock and renewal</tspan></text><text x="40.0" y="626.1" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Uncertainty and outside users matter.</tspan></text><rect x="450.0" y="570.4" width="366.0" height="86" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="466.0" y="597.4" fill="#252c28" font-size="19"><tspan x="466.0" dy="0">Agree and enforce catches</tspan></text><text x="466.0" y="626.1" fill="#626962" font-size="17"><tspan x="466.0" dy="0">Revise the limit when conditions change.</tspan></text><path d="M 390.0 613.4 H 450.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><text x="24" y="698.4" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows transfer fish biomass; net addition already accounts for natural losses. Lower arrows show</tspan><tspan x="24" dy="21.6">governance steps, not fish flows. No width represents a catch quantity.</tspan></text><rect x="24" y="758.8" width="792" height="72.05000000000007" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="784.8" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Join withdrawal rights to a revisable shared limit, monitoring, and changing ecological</tspan><tspan x="40" dy="22.950000000000003">conditions.</tspan></text><text x="24" y="856.85" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Monitoring costs resources; fishers lose some current take. A catch limit guarantees neither</tspan><tspan x="24" dy="22.950000000000003">renewal nor recovery.</tspan></text></g></svg>
