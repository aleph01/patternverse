<svg xmlns="http://www.w3.org/2000/svg" width="840" height="840" viewBox="0 0 840 840" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Overtime can clear work and create later rework</title><desc id="desc">Hypothetical qualitative illustration. Backlog pressure prompts extended work, whose extra completions initially reduce pressure. Repeated insufficient recovery can contribute to fatigue, undiscovered errors, and later corrections that refill the backlog. The return burden exceeds initial relief by assumption in this case. Change: Break the fatigue-and-error path while covering continuing work and inherited corrections. Limitation: Recovery and discovery take time. Added qualified coverage, slower promises, or reduced commitments have costs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Overtime can clear work and create later rework</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Fast relief · balancing response</tspan></text><rect x="24" y="140.5" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="167.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Visible backlog pressure</tspan></text><text x="40" y="196.2" fill="#626962" font-size="17"><tspan x="40" dy="0">More unfinished work prompts</tspan><tspan x="40" dy="22.950000000000003">extra hours.</tspan></text><rect x="516" y="140.5" width="300" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="532" y="167.5" fill="#252c28" font-size="19"><tspan x="532" dy="0">Repeated extended work</tspan></text><text x="532" y="196.2" fill="#626962" font-size="17"><tspan x="532" dy="0">Initially increases completions.</tspan></text><path d="M 324 191.375 H 516" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="342" y="158.375" fill="#626962" font-size="16"><tspan x="342" dy="0">prompts overtime</tspan></text><path d="M 666.0 226.5 V 274.25 H 174.0 V 242.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="220" y="307.25" fill="#626962" font-size="16"><tspan x="220" dy="0">Return: extra completions reduce the backlog at first.</tspan></text><text x="24" y="352.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Delayed harm from that same remedy</tspan></text><rect x="24.0" y="381.45" width="224.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="408.45" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Inadequate recovery</tspan></text><text x="40.0" y="437.15" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Fatigue can impair</tspan><tspan x="40.0" dy="22.950000000000003">work.</tspan></text><rect x="308.0" y="381.45" width="224.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="408.45" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Undiscovered errors</tspan></text><text x="324.0" y="437.15" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Latent work waits for</tspan><tspan x="324.0" dy="22.950000000000003">discovery.</tspan></text><rect x="592.0" y="381.45" width="224.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="408.45" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Corrections return</tspan></text><text x="608.0" y="437.15" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Rework adds to the</tspan><tspan x="608.0" dy="22.950000000000003">backlog.</tspan></text><path d="M 248.0 432.325 H 308.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 532.0 432.325 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="525.2" width="792" height="95.0" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="551.2" fill="#252c28" font-size="17"><tspan x="40" dy="0">Return to backlog pressure: delayed corrections can prompt more extended work. This case</tspan><tspan x="40" dy="22.950000000000003">assumes the return burden outweighs initial relief; ordinary errors or new demand alone would not</tspan><tspan x="40" dy="22.950000000000003">prove the link.</tspan></text><text x="24" y="646.2" fill="#626962" font-size="16"><tspan x="24" dy="0">Arrows are hypothesized causal effects, not measured rates. The lower route returns to backlog pressure;</tspan><tspan x="24" dy="21.6">latent errors and known unfinished work are different accumulations.</tspan></text><rect x="24" y="706.6" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="732.6" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Break the fatigue-and-error path while covering continuing work and inherited corrections.</tspan></text><text x="24" y="781.7" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Recovery and discovery take time. Added qualified coverage, slower promises, or reduced</tspan><tspan x="24" dy="22.950000000000003">commitments have costs.</tspan></text></g></svg>
