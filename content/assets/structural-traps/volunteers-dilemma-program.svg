<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1261" viewBox="0 0 840 1261" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Select one uploader, then check completion</title><desc id="desc">Hypothetical qualitative illustration. Ari, Bea, and Cam are alternative capable volunteers: any one upload suffices. The proposed protocol selects Ari, obtains Bea and Cam’s acknowledgement, and checks Ari’s completion receipt. A missing receipt calls for an accepted capable backup, not an assumption that someone acted. Change: Agree one capable owner, acknowledge the assignment, and verify completion. Limitation: Assignment cannot fix expired access, an unnoticed failure, or an unavailable backup.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Select one uploader, then check completion</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Alternative capable volunteers · any one upload suffices</tspan></text><rect x="24" y="140.5" width="224" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="167.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Ari</tspan></text><text x="40" y="196.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Can act; hopes another</tspan><tspan x="40" dy="22.950000000000003">will.</tspan></text><rect x="308" y="140.5" width="224" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324" y="167.5" fill="#252c28" font-size="19"><tspan x="324" dy="0">Bea</tspan></text><text x="324" y="196.2" fill="#626962" font-size="17"><tspan x="324" dy="0">Can act; hopes another</tspan><tspan x="324" dy="22.950000000000003">will.</tspan></text><rect x="592" y="140.5" width="224" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608" y="167.5" fill="#252c28" font-size="19"><tspan x="608" dy="0">Cam</tspan></text><text x="608" y="196.2" fill="#626962" font-size="17"><tspan x="608" dy="0">Can act; hopes another</tspan><tspan x="608" dy="22.950000000000003">will.</tspan></text><rect x="260" y="332.25" width="320" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="276" y="359.25" fill="#252c28" font-size="19"><tspan x="276" dy="0">Any ONE accepted upload</tspan></text><text x="276" y="387.95" fill="#626962" font-size="17"><tspan x="276" dy="0">An open request has not selected an</tspan><tspan x="276" dy="22.950000000000003">owner.</tspan></text><path d="M 136.0 242.25 V 284.25 H 420 V 332.25" fill="none" stroke="#252c28" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M 420.0 242.25 V 284.25 H 420 V 332.25" fill="none" stroke="#252c28" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M 704.0 242.25 V 284.25 H 420 V 332.25" fill="none" stroke="#252c28" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="24" y="490.0" fill="#252c28" font-size="18"><tspan x="24" dy="0">Select responsibility, then check the outcome</tspan></text><rect x="260" y="519.4" width="320" height="127.39999999999998" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="276" y="546.4" fill="#252c28" font-size="19"><tspan x="276" dy="0">Ari accepts and attempts the</tspan><tspan x="276" dy="25.650000000000002">upload</tspan></text><text x="276" y="600.75" fill="#626962" font-size="17"><tspan x="276" dy="0">Bea and Cam acknowledge the</tspan><tspan x="276" dy="22.950000000000003">owner.</tspan></text><rect x="260" y="722.8" width="320" height="127.39999999999998" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="276" y="749.8" fill="#252c28" font-size="19"><tspan x="276" dy="0">Receipt present before the</tspan><tspan x="276" dy="25.650000000000002">deadline?</tspan></text><text x="276" y="804.15" fill="#626962" font-size="17"><tspan x="276" dy="0">Do not assume that naming an</tspan><tspan x="276" dy="22.950000000000003">owner completed the task.</tspan></text><rect x="24" y="946.1999999999999" width="300" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="973.1999999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Yes: completed</tspan></text><text x="40" y="1001.9" fill="#626962" font-size="17"><tspan x="40" dy="0">No duplicate upload is needed.</tspan></text><rect x="516" y="946.1999999999999" width="300" height="101.75000000000011" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="532" y="973.1999999999999" fill="#252c28" font-size="19"><tspan x="532" dy="0">No: accepted backup</tspan></text><text x="532" y="1001.9" fill="#626962" font-size="17"><tspan x="532" dy="0">A capable person takes over while</tspan><tspan x="532" dy="22.950000000000003">time remains.</tspan></text><path d="M 420.0 850.1999999999999 V 906.1999999999999" fill="none" stroke="#252c28" stroke-width="1.4"/><path d="M 420.0 906.1999999999999 H 174.0 V 946.1999999999999" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 420.0 906.1999999999999 H 666.0 V 946.1999999999999" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 420.0 646.8 V 722.8" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><text x="24" y="1089.95" fill="#626962" font-size="16"><tspan x="24" dy="0">Dashed inputs: alternative possible volunteers; any one suffices. Solid arrows: the accepted protocol and its</tspan><tspan x="24" dy="21.6">conditional completion branches.</tspan></text><rect x="24" y="1150.35" width="792" height="49.09999999999991" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1176.35" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Agree one capable owner, acknowledge the assignment, and verify completion.</tspan></text><text x="24" y="1225.4499999999998" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Assignment cannot fix expired access, an unnoticed failure, or an unavailable backup.</tspan></text></g></svg>
