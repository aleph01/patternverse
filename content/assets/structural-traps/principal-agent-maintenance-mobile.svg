<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1723" viewBox="0 0 360 1723" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Expert advice can serve a different objective</title><desc id="desc">Hypothetical qualitative illustration. Nina keeps most of a higher sale price; Eli receives only a small share and bears extra selling effort. His recommendation informs her acceptance decision, while market conditions also affect the sale. An independent paid assessment adds evidence before she chooses. Change: Improve the evidence supporting the principal’s retained decision and review the terms inducing advice. Limitation: Independent assessment is costly and fallible. Better information guarantees neither a higher price nor aligned interests.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Expert advice can serve a</tspan><tspan x="24" dy="28.35">different objective</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Shared sale; different reasons to</tspan><tspan x="24" dy="24.3">accept an offer</tspan></text><rect x="24" y="214.75000000000003" width="312" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Nina · homeowner</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Keeps most of an extra sale gain;</tspan><tspan x="40" dy="22.950000000000003">bears waiting risk.</tspan></text><rect x="24" y="392.5" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="419.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Eli · agent</tspan></text><text x="40" y="448.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Receives a small share; further</tspan><tspan x="40" dy="22.950000000000003">selling costs his time.</tspan></text><rect x="24" y="536.25" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="563.25" fill="#252c28" font-size="19"><tspan x="40" dy="0">Eli’s recommendation</tspan></text><text x="40" y="591.95" fill="#626962" font-size="17"><tspan x="40" dy="0">Nina cannot see all its evidence.</tspan></text><path d="M 180 622.25 V 698.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="698.25" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="725.25" fill="#252c28" font-size="19"><tspan x="40" dy="0">Nina’s accept-or-wait decision</tspan></text><text x="40" y="753.95" fill="#626962" font-size="17"><tspan x="40" dy="0">Advice influences a decision she</tspan><tspan x="40" dy="22.950000000000003">still owns.</tspan></text><path d="M 180 800.0 V 876.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="876.0" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="903.0" fill="#252c28" font-size="19"><tspan x="40" dy="0">Eventual sale outcome</tspan></text><text x="40" y="931.7" fill="#626962" font-size="17"><tspan x="40" dy="0">Buyers and market conditions also</tspan><tspan x="40" dy="22.950000000000003">matter.</tspan></text><text x="24" y="1019.75" fill="#252c28" font-size="18"><tspan x="24" dy="0">Add usable evidence before deciding</tspan></text><rect x="24" y="1049.15" width="312" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1076.15" fill="#252c28" font-size="19"><tspan x="40" dy="0">Independent assessment</tspan></text><text x="40" y="1104.8500000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">Disclosed fee independent of</tspan><tspan x="40" dy="22.950000000000003">accepting this offer.</tspan></text><path d="M 180 1150.9 V 1226.9" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="1226.9" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1253.9" fill="#252c28" font-size="19"><tspan x="40" dy="0">Compare real alternatives</tspan></text><text x="40" y="1282.6000000000001" fill="#626962" font-size="17"><tspan x="40" dy="0">Inform Nina’s decision;</tspan><tspan x="40" dy="22.950000000000003">disagreement remains.</tspan></text><text x="24" y="1370.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Role cards compare incentives. Arrows</tspan><tspan x="24" dy="21.6">show advice informing a decision and a</tspan><tspan x="24" dy="21.6">later uncertain result; the green route adds</tspan><tspan x="24" dy="21.6">evidence before that decision.</tspan></text><rect x="24" y="1474.25" width="312" height="117.94999999999982" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1500.25" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Improve the evidence</tspan><tspan x="40" dy="22.950000000000003">supporting the principal’s retained</tspan><tspan x="40" dy="22.950000000000003">decision and review the terms</tspan><tspan x="40" dy="22.950000000000003">inducing advice.</tspan></text><text x="24" y="1618.1999999999998" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Independent assessment is costly</tspan><tspan x="24" dy="22.950000000000003">and fallible. Better information</tspan><tspan x="24" dy="22.950000000000003">guarantees neither a higher price nor</tspan><tspan x="24" dy="22.950000000000003">aligned interests.</tspan></text></g></svg>
