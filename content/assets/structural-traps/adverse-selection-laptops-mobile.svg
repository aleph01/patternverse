<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1708" viewBox="0 0 360 1708" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">The offer filters which machines reach the market</title><desc id="desc">Hypothetical qualitative illustration. The same unverified offer reaches owners of dependable and worn machines. Dependable owners keep their machines while worn-machine owners find selling attractive. Only the accepting branch feeds the offered pool. A reliable pre-sale inspection can change what Rina knows before acceptance, without changing machine quality. Change: Make condition credibly distinguishable before agreement. Limitation: Reports must be accurate, unforgeable, and affordable. Information does not improve the machines.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">The offer filters which machines</tspan><tspan x="24" dy="28.35">reach the market</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">One unverified offer filters</tspan><tspan x="24" dy="24.3">participation</tspan></text><rect x="24" y="214.75000000000003" width="312" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Rina offers for unknown quality</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Owners know condition before</tspan><tspan x="40" dy="22.950000000000003">accepting.</tspan></text><rect x="62" y="392.5" width="274" height="127.39999999999998" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="78" y="419.5" fill="#252c28" font-size="19"><tspan x="78" dy="0">Dependable-machine</tspan><tspan x="78" dy="25.650000000000002">owner</tspan></text><text x="78" y="473.84999999999997" fill="#626962" font-size="17"><tspan x="78" dy="0">Prefers keeping it at this offer:</tspan><tspan x="78" dy="22.950000000000003">no sale.</tspan></text><rect x="62" y="551.9" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="78" y="578.9" fill="#252c28" font-size="19"><tspan x="78" dy="0">Worn-machine owner</tspan></text><text x="78" y="607.6" fill="#626962" font-size="17"><tspan x="78" dy="0">Finds selling attractive at this</tspan><tspan x="78" dy="22.950000000000003">offer.</tspan></text><path d="M 180.0 316.5 V 348.5 H 36 V 602.775" fill="none" stroke="#252c28" stroke-width="1.4"/><path d="M 36 456.2 H 62" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 36 602.775 H 62" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="720.65" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="747.65" fill="#252c28" font-size="19"><tspan x="40" dy="0">Offered pool shifts</tspan></text><text x="40" y="776.35" fill="#626962" font-size="17"><tspan x="40" dy="0">The attractive high-quality</tspan><tspan x="40" dy="22.950000000000003">machines did not enter.</tspan></text><path d="M 199.0 653.65 V 720.65" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="872.4" fill="#252c28" font-size="18"><tspan x="24" dy="0">Change the information before</tspan><tspan x="24" dy="24.3">acceptance</tspan></text><rect x="24" y="926.0999999999999" width="312" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="953.0999999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Independent inspection</tspan></text><text x="40" y="981.8" fill="#626962" font-size="17"><tspan x="40" dy="0">A reliable report follows the</tspan><tspan x="40" dy="22.950000000000003">machine.</tspan></text><path d="M 180 1027.85 V 1103.85" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="1103.85" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1130.85" fill="#252c28" font-size="19"><tspan x="40" dy="0">Condition-based offers</tspan></text><text x="40" y="1159.55" fill="#626962" font-size="17"><tspan x="40" dy="0">Rina can distinguish relevant</tspan><tspan x="40" dy="22.950000000000003">quality.</tspan></text><path d="M 180 1205.6 V 1281.6" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="1281.6" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1308.6" fill="#252c28" font-size="19"><tspan x="40" dy="0">Trades can return</tspan></text><text x="40" y="1337.3" fill="#626962" font-size="17"><tspan x="40" dy="0">Only if the recovered gain covers</tspan><tspan x="40" dy="22.950000000000003">verification cost.</tspan></text><text x="24" y="1425.35" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper branches: owners’ participation</tspan><tspan x="24" dy="21.6">responses to one offer. The continuing</tspan><tspan x="24" dy="21.6">arrow feeds the offered pool. Lower</tspan><tspan x="24" dy="21.6">arrows: the proposed information process.</tspan></text><rect x="24" y="1528.9499999999998" width="312" height="72.04999999999995" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1554.9499999999998" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Make condition credibly</tspan><tspan x="40" dy="22.950000000000003">distinguishable before agreement.</tspan></text><text x="24" y="1626.9999999999998" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Reports must be accurate,</tspan><tspan x="24" dy="22.950000000000003">unforgeable, and affordable. Information</tspan><tspan x="24" dy="22.950000000000003">does not improve the machines.</tspan></text></g></svg>
