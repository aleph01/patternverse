<svg xmlns="http://www.w3.org/2000/svg" width="840" height="627" viewBox="0 0 840 627" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Some listeners pay; all can hear the reporting</title><desc id="desc">Hypothetical qualitative illustration. Original voluntary donations and accepted member dues are alternative routes funding incremental local reporting. All listeners, including nonmembers, can benefit under either route. Dues work only after willing adoption and reliable collection for the agreed period. Change: Secure accepted, collectible funding for a defined period while retaining open listening. Limitation: Joining is voluntary; collection, fairness, editorial accountability, and later renewal still matter.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Some listeners pay; all can hear the reporting</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><rect x="24" y="111.1" width="224" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="138.1" fill="#252c28" font-size="19"><tspan x="40" dy="0">Voluntary donations</tspan></text><text x="40" y="166.79999999999998" fill="#626962" font-size="17"><tspan x="40" dy="0">Original contribution</tspan><tspan x="40" dy="22.950000000000003">choice.</tspan></text><rect x="24" y="286.85" width="224" height="127.39999999999998" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="313.85" fill="#252c28" font-size="19"><tspan x="40" dy="0">Accepted member</tspan><tspan x="40" dy="25.650000000000002">dues</tspan></text><text x="40" y="368.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Alternative collected</tspan><tspan x="40" dy="22.950000000000003">obligation.</tspan></text><rect x="308" y="211.1" width="224" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324" y="238.1" fill="#252c28" font-size="19"><tspan x="324" dy="0">Local reporting</tspan></text><text x="324" y="266.79999999999995" fill="#626962" font-size="17"><tspan x="324" dy="0">Ongoing additional</tspan><tspan x="324" dy="22.950000000000003">work; no single target.</tspan></text><rect x="592" y="211.1" width="224" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608" y="238.1" fill="#252c28" font-size="19"><tspan x="608" dy="0">Open listening</tspan></text><text x="608" y="266.79999999999995" fill="#626962" font-size="17"><tspan x="608" dy="0">Ari, Bea, Cam, Dev, and</tspan><tspan x="608" dy="22.950000000000003">nonmembers.</tspan></text><path d="M 248 161.975 H 278 V 243.97499999999997 H 308" fill="none" stroke="#252c28" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M 248 350.55 H 292 V 279.97499999999997 H 308" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><path d="M 532 261.97499999999997 H 592" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="456.25" fill="#626962" font-size="16"><tspan x="24" dy="0">Input arrows show funding. Output arrow shows shared access, not a money transfer or rival portions. Green</tspan><tspan x="24" dy="21.6">is an alternative route, not an extra automatic payment.</tspan></text><rect x="24" y="516.6500000000001" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="542.6500000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Secure accepted, collectible funding for a defined period while retaining open listening.</tspan></text><text x="24" y="591.7500000000001" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Joining is voluntary; collection, fairness, editorial accountability, and later renewal still matter.</tspan></text></g></svg>
