<svg xmlns="http://www.w3.org/2000/svg" width="840" height="745" viewBox="0 0 840 745" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Experience needs an accepted first opportunity</title><desc id="desc">Hypothetical qualitative illustration. Lea needs previous paid experience for a first paid role, while that role supplies accepted experience. A new paid supervised entry route supplies assessed work without demanding prior employment, making later consideration possible. Change: Accept a funded first-entry route instead of requiring prior employment for every start. Limitation: The employer must accept the evidence. Supervision costs resources; satisfactory work and a later vacancy are not guaranteed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Experience needs an accepted first opportunity</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">The first-job loop · accepted experience only</tspan></text><rect x="24" y="140.5" width="300" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="167.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Previous paid experience</tspan></text><text x="40" y="196.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Required by these employers.</tspan></text><rect x="516" y="140.5" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="532" y="167.5" fill="#252c28" font-size="19"><tspan x="532" dy="0">A first paid role</tspan></text><text x="532" y="196.2" fill="#626962" font-size="17"><tspan x="532" dy="0">The available way to gain</tspan><tspan x="532" dy="22.950000000000003">accepted experience.</tspan></text><path d="M 324 183.5 H 516" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="342" y="150.5" fill="#626962" font-size="16"><tspan x="342" dy="0">qualifies for a role</tspan></text><path d="M 666.0 242.25 V 274.25 H 174.0 V 226.5" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="220" y="307.25" fill="#626962" font-size="16"><tspan x="220" dy="0">Return: the role supplies accepted experience.</tspan></text><text x="24" y="352.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">New accepted entry route</tspan></text><rect x="24.0" y="381.45" width="224.0" height="127.4" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="408.45" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Paid supervised entry</tspan></text><text x="40.0" y="437.15" fill="#626962" font-size="17"><tspan x="40.0" dy="0">No prior job required;</tspan><tspan x="40.0" dy="22.950000000000003">funded supervision.</tspan></text><rect x="308.0" y="381.45" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="408.45" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Assessed real work</tspan></text><text x="324.0" y="437.15" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Satisfactory work</tspan><tspan x="324.0" dy="22.950000000000003">counts as experience.</tspan></text><rect x="592.0" y="381.45" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="408.45" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Eligible for</tspan><tspan x="608.0" dy="25.650000000000002">consideration</tspan></text><text x="608.0" y="462.79999999999995" fill="#626962" font-size="17"><tspan x="608.0" dy="0">A later job is not</tspan><tspan x="608.0" dy="22.950000000000003">guaranteed.</tspan></text><path d="M 248.0 445.15 H 308.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><path d="M 532.0 445.15 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="550.85" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows show qualifying dependencies, not effects over time. Lower arrows show an authorized entry</tspan><tspan x="24" dy="21.6">sequence.</tspan></text><rect x="24" y="611.25" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="637.25" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Accept a funded first-entry route instead of requiring prior employment for every start.</tspan></text><text x="24" y="686.35" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: The employer must accept the evidence. Supervision costs resources; satisfactory work and a</tspan><tspan x="24" dy="22.950000000000003">later vacancy are not guaranteed.</tspan></text></g></svg>
