<svg xmlns="http://www.w3.org/2000/svg" width="840" height="767" viewBox="0 0 840 767" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">The normal cycle needs an initial seed</title><desc id="desc">Hypothetical qualitative illustration. Battery charge enables the starter and engine; the running engine enables later alternator charging. Without starting charge, the ordinary route has no first step. Compatible external energy enables the engine before its charging system can operate. Change: Supply a compatible starting source available before ordinary operation. Limitation: Assumes discharge only. Assistance costs resources; faults and the cause of discharge still need attention.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">The normal cycle needs an initial seed</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Ordinary starting route · missing initial charge</tspan></text><rect x="24" y="140.5" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="167.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Usable battery charge</tspan></text><text x="40" y="196.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Powers the starter to turn the</tspan><tspan x="40" dy="22.950000000000003">engine.</tspan></text><rect x="516" y="140.5" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="532" y="167.5" fill="#252c28" font-size="19"><tspan x="532" dy="0">Running engine</tspan></text><text x="532" y="196.2" fill="#626962" font-size="17"><tspan x="532" dy="0">Drives the alternator, which can</tspan><tspan x="532" dy="22.950000000000003">replenish charge.</tspan></text><path d="M 324 191.375 H 516" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="342" y="158.375" fill="#626962" font-size="16"><tspan x="342" dy="0">enables starting</tspan></text><path d="M 666.0 242.25 V 274.25 H 174.0 V 242.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="220" y="307.25" fill="#626962" font-size="16"><tspan x="220" dy="0">Return: later engine-driven charging replenishes stored</tspan><tspan x="220" dy="21.6">energy.</tspan></text><text x="24" y="373.65000000000003" fill="#252c28" font-size="18"><tspan x="24" dy="0">External seed · same car and operating requirement</tspan></text><rect x="24.0" y="403.05" width="224.0" height="127.4" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="430.05" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Compatible external</tspan><tspan x="40.0" dy="25.650000000000002">energy</tspan></text><text x="40.0" y="484.4" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Available before the</tspan><tspan x="40.0" dy="22.950000000000003">engine runs.</tspan></text><rect x="308.0" y="403.05" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="430.05" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Engine can start</tspan></text><text x="324.0" y="458.75" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Assume the fault is</tspan><tspan x="324.0" dy="22.950000000000003">discharged charge only.</tspan></text><rect x="592.0" y="403.05" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="430.05" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Charging can operate</tspan></text><text x="608.0" y="458.75" fill="#626962" font-size="17"><tspan x="608.0" dy="0">A start is not proof of a</tspan><tspan x="608.0" dy="22.950000000000003">sound charging system.</tspan></text><path d="M 248.0 466.75 H 308.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><path d="M 532.0 466.75 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="572.45" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows show enabling dependencies at different times; lower arrows show the conditional starting</tspan><tspan x="24" dy="21.6">sequence. This is not a repair procedure.</tspan></text><rect x="24" y="632.85" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="658.85" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Supply a compatible starting source available before ordinary operation.</tspan></text><text x="24" y="707.95" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Assumes discharge only. Assistance costs resources; faults and the cause of discharge still need</tspan><tspan x="24" dy="22.950000000000003">attention.</tspan></text></g></svg>
