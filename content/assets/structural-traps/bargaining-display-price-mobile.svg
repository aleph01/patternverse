<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1147" viewBox="0 0 360 1147" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">A possible sale leaves the price unsettled</title><desc id="desc">Hypothetical qualitative illustration. Prices below Dev’s acceptance minimum fail for the seller; prices above Mira’s maximum fail for the buyer. The interval between permits agreement on the same known bicycle. A higher price within that overlap favors Dev and a lower price favors Mira. Change: Establish real alternatives and select acceptable enforceable terms within the overlap. Limitation: Private limits may be hard to learn. No overlap requires a changed package or no sale; fairness remains open.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">A possible sale leaves the price</tspan><tspan x="24" dy="28.35">unsettled</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><rect x="24" y="161.05" width="312" height="117.95000000000005" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="187.05" fill="#252c28" font-size="17"><tspan x="40" dy="0">Same bicycle, known condition and</tspan><tspan x="40" dy="22.950000000000003">included items. Dev accepts at or</tspan><tspan x="40" dy="22.950000000000003">above his minimum; Mira accepts</tspan><tspan x="40" dy="22.950000000000003">at or below her maximum.</tspan></text><rect x="24" y="305.00000000000006" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="332.00000000000006" fill="#252c28" font-size="19"><tspan x="40" dy="0">Below Dev’s minimum</tspan></text><text x="40" y="360.70000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Mira may like the price; Dev rejects.</tspan></text><rect x="24" y="415.00000000000006" width="312" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="442.00000000000006" fill="#252c28" font-size="19"><tspan x="40" dy="0">Mutually acceptable range</tspan></text><text x="40" y="470.70000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Both prefer a price here to their</tspan><tspan x="40" dy="22.950000000000003">alternatives.</tspan></text><rect x="24" y="540.75" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="567.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Above Mira’s maximum</tspan></text><text x="40" y="596.45" fill="#626962" font-size="17"><tspan x="40" dy="0">Dev may like the price; Mira rejects.</tspan></text><rect x="24" y="650.75" width="312" height="140.89999999999998" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="676.75" fill="#252c28" font-size="17"><tspan x="40" dy="0">Read in increasing price order.</tspan><tspan x="40" dy="22.950000000000003">Regions show acceptance only, not</tspan><tspan x="40" dy="22.950000000000003">monetary distances. A higher price</tspan><tspan x="40" dy="22.950000000000003">inside the overlap favors Dev; a</tspan><tspan x="40" dy="22.950000000000003">lower one favors Mira.</tspan></text><text x="24" y="817.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Cards are alternative price regions, not</tspan><tspan x="24" dy="21.6">chronological steps or utility quantities.</tspan><tspan x="24" dy="21.6">Green marks the agreement region; the</tspan><tspan x="24" dy="21.6">words also identify it.</tspan></text><rect x="24" y="921.25" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="947.25" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Establish real alternatives</tspan><tspan x="40" dy="22.950000000000003">and select acceptable enforceable</tspan><tspan x="40" dy="22.950000000000003">terms within the overlap.</tspan></text><text x="24" y="1042.25" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Private limits may be hard to</tspan><tspan x="24" dy="22.950000000000003">learn. No overlap requires a changed</tspan><tspan x="24" dy="22.950000000000003">package or no sale; fairness remains</tspan><tspan x="24" dy="22.950000000000003">open.</tspan></text></g></svg>
