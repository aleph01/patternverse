<svg xmlns="http://www.w3.org/2000/svg" width="840" height="927" viewBox="0 0 840 927" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Together matters; the preferred activity differs</title><desc id="desc">Hypothetical qualitative illustration. Nia prefers a film, Theo a concert, and both prefer either shared activity to separate evenings. Together at the film and together at the concert are the two double-outlined equilibria. A shared acknowledged draw can select one. Change: Agree one shared selection and confirm the same activity before departing. Limitation: Both activities must be feasible and acceptable. One person still receives the less preferred outcome.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Together matters; the preferred activity differs</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="139.1" fill="#626962" font-size="17"><tspan x="24" dy="0">Nia ↓</tspan></text><text x="136" y="139.1" fill="#252c28" font-size="17"><tspan x="136" dy="0">Theo: Film</tspan></text><text x="506" y="139.1" fill="#252c28" font-size="17"><tspan x="506" dy="0">Theo: Concert</tspan></text><text x="24" y="197.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Film</tspan></text><rect x="124" y="165.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="140" y="192.1" fill="#252c28" font-size="19"><tspan x="140" dy="0">Together at the film</tspan></text><text x="140" y="220.79999999999998" fill="#626962" font-size="17"><tspan x="140" dy="0">Nia’s preferred agreement.</tspan></text><rect x="128" y="169.1" width="314" height="218" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><rect x="494" y="165.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="510" y="192.1" fill="#252c28" font-size="19"><tspan x="510" dy="0">Separate evenings</tspan></text><text x="510" y="220.79999999999998" fill="#626962" font-size="17"><tspan x="510" dy="0">Both prefer either shared activity.</tspan></text><text x="24" y="499.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Concert</tspan></text><rect x="124" y="467.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="140" y="494.1" fill="#252c28" font-size="19"><tspan x="140" dy="0">Separate evenings</tspan></text><text x="140" y="522.8" fill="#626962" font-size="17"><tspan x="140" dy="0">Both prefer either shared activity.</tspan></text><rect x="494" y="467.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="510" y="494.1" fill="#252c28" font-size="19"><tspan x="510" dy="0">Together at the concert</tspan></text><text x="510" y="522.8" fill="#626962" font-size="17"><tspan x="510" dy="0">Theo’s preferred agreement.</tspan></text><rect x="498" y="471.1" width="314" height="218" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><text x="24" y="733.1" fill="#626962" font-size="16"><tspan x="24" dy="0">Each card or cell is an alternative combination of choices, not a later turn. Choices are made without seeing</tspan><tspan x="24" dy="21.6">the other’s current choice. Double outlines mark equilibria.</tspan></text><rect x="24" y="793.5" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="819.5" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Agree one shared selection and confirm the same activity before departing.</tspan></text><text x="24" y="868.6" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Both activities must be feasible and acceptable. One person still receives the less preferred</tspan><tspan x="24" dy="22.950000000000003">outcome.</tspan></text></g></svg>
