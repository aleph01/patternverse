<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1100" viewBox="0 0 360 1100" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Two entrances; one meeting needs a shared choice</title><desc id="desc">Hypothetical qualitative illustration. Mina and Owen can each choose North or South entrance. Both North and both South are double-outlined equilibria; split choices miss the meeting. Neither has an intrinsic preference for an entrance. Naming and acknowledging North selects one existing matching outcome. Change: Name one usable entrance and time, acknowledge it, and coordinate revisions. Limitation: Communication, access, and follow-through remain necessary. Recovery takes additional time or resources.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Two entrances; one meeting</tspan><tspan x="24" dy="28.35">needs a shared choice</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Owen chooses North</tspan></text><rect x="24" y="190.45000000000002" width="274" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="217.45000000000002" fill="#252c28" font-size="19"><tspan x="40" dy="0">Both at North</tspan></text><text x="40" y="246.15" fill="#626962" font-size="17"><tspan x="40" dy="0">Mina: North. They meet at the</tspan><tspan x="40" dy="22.950000000000003">North entrance.</tspan></text><rect x="28" y="194.45000000000002" width="266" height="93.74999999999997" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><rect x="24" y="328.2" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="355.2" fill="#252c28" font-size="19"><tspan x="40" dy="0">Different entrances</tspan></text><text x="40" y="383.9" fill="#626962" font-size="17"><tspan x="40" dy="0">Mina: South. They miss the</tspan><tspan x="40" dy="22.950000000000003">agreed meeting.</tspan></text><text x="24" y="465.95" fill="#252c28" font-size="18"><tspan x="24" dy="0">Owen chooses South</tspan></text><rect x="24" y="495.34999999999997" width="274" height="101.74999999999994" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="522.3499999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Different entrances</tspan></text><text x="40" y="551.05" fill="#626962" font-size="17"><tspan x="40" dy="0">Mina: North. They miss the</tspan><tspan x="40" dy="22.950000000000003">agreed meeting.</tspan></text><rect x="24" y="633.0999999999999" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="660.0999999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Both at South</tspan></text><text x="40" y="688.8" fill="#626962" font-size="17"><tspan x="40" dy="0">Mina: South. They meet at the</tspan><tspan x="40" dy="22.950000000000003">South entrance.</tspan></text><rect x="28" y="637.0999999999999" width="266" height="93.75" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><text x="24" y="770.8499999999999" fill="#626962" font-size="16"><tspan x="24" dy="0">Cells compare choices before observing</tspan><tspan x="24" dy="21.6">the other’s current decision, not</tspan><tspan x="24" dy="21.6">movements between entrances. Double</tspan><tspan x="24" dy="21.6">outlines mark equilibria.</tspan></text><rect x="24" y="874.4499999999998" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="900.4499999999998" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Name one usable entrance</tspan><tspan x="40" dy="22.950000000000003">and time, acknowledge it, and</tspan><tspan x="40" dy="22.950000000000003">coordinate revisions.</tspan></text><text x="24" y="995.4499999999998" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Communication, access, and</tspan><tspan x="24" dy="22.950000000000003">follow-through remain necessary.</tspan><tspan x="24" dy="22.950000000000003">Recovery takes additional time or</tspan><tspan x="24" dy="22.950000000000003">resources.</tspan></text></g></svg>
