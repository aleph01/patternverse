<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1099" viewBox="0 0 360 1099" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Together matters; the preferred activity differs</title><desc id="desc">Hypothetical qualitative illustration. Nia prefers a film, Theo a concert, and both prefer either shared activity to separate evenings. Together at the film and together at the concert are the two double-outlined equilibria. A shared acknowledged draw can select one. Change: Agree one shared selection and confirm the same activity before departing. Limitation: Both activities must be feasible and acceptable. One person still receives the less preferred outcome.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Together matters; the preferred</tspan><tspan x="24" dy="28.35">activity differs</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Theo chooses Film</tspan></text><rect x="24" y="190.45000000000002" width="274" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="217.45000000000002" fill="#252c28" font-size="19"><tspan x="40" dy="0">Together at the film</tspan></text><text x="40" y="246.15" fill="#626962" font-size="17"><tspan x="40" dy="0">Nia: Film. Nia’s preferred</tspan><tspan x="40" dy="22.950000000000003">agreement.</tspan></text><rect x="28" y="194.45000000000002" width="266" height="93.74999999999997" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><rect x="24" y="328.2" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="355.2" fill="#252c28" font-size="19"><tspan x="40" dy="0">Separate evenings</tspan></text><text x="40" y="383.9" fill="#626962" font-size="17"><tspan x="40" dy="0">Nia: Concert. Both prefer</tspan><tspan x="40" dy="22.950000000000003">either shared activity.</tspan></text><text x="24" y="465.95" fill="#252c28" font-size="18"><tspan x="24" dy="0">Theo chooses Concert</tspan></text><rect x="24" y="495.34999999999997" width="274" height="101.74999999999994" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="522.3499999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Separate evenings</tspan></text><text x="40" y="551.05" fill="#626962" font-size="17"><tspan x="40" dy="0">Nia: Film. Both prefer either</tspan><tspan x="40" dy="22.950000000000003">shared activity.</tspan></text><rect x="24" y="633.0999999999999" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="660.0999999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Together at the concert</tspan></text><text x="40" y="688.8" fill="#626962" font-size="17"><tspan x="40" dy="0">Nia: Concert. Theo’s preferred</tspan><tspan x="40" dy="22.950000000000003">agreement.</tspan></text><rect x="28" y="637.0999999999999" width="266" height="93.75" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><text x="24" y="770.8499999999999" fill="#626962" font-size="16"><tspan x="24" dy="0">Each card or cell is an alternative</tspan><tspan x="24" dy="21.6">combination of choices, not a later turn.</tspan><tspan x="24" dy="21.6">Choices are made without seeing the</tspan><tspan x="24" dy="21.6">other’s current choice. Double outlines</tspan><tspan x="24" dy="21.6">mark equilibria.</tspan></text><rect x="24" y="896.0499999999998" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="922.0499999999998" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Agree one shared</tspan><tspan x="40" dy="22.950000000000003">selection and confirm the same</tspan><tspan x="40" dy="22.950000000000003">activity before departing.</tspan></text><text x="24" y="1017.0499999999998" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Both activities must be feasible</tspan><tspan x="24" dy="22.950000000000003">and acceptable. One person still</tspan><tspan x="24" dy="22.950000000000003">receives the less preferred outcome.</tspan></text></g></svg>
