<svg xmlns="http://www.w3.org/2000/svg" width="840" height="927" viewBox="0 0 840 927" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Two entrances; one meeting needs a shared choice</title><desc id="desc">Hypothetical qualitative illustration. Mina and Owen can each choose North or South entrance. Both North and both South are double-outlined equilibria; split choices miss the meeting. Neither has an intrinsic preference for an entrance. Naming and acknowledging North selects one existing matching outcome. Change: Name one usable entrance and time, acknowledge it, and coordinate revisions. Limitation: Communication, access, and follow-through remain necessary. Recovery takes additional time or resources.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Two entrances; one meeting needs a shared choice</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="139.1" fill="#626962" font-size="17"><tspan x="24" dy="0">Mina ↓</tspan></text><text x="136" y="139.1" fill="#252c28" font-size="17"><tspan x="136" dy="0">Owen: North</tspan></text><text x="506" y="139.1" fill="#252c28" font-size="17"><tspan x="506" dy="0">Owen: South</tspan></text><text x="24" y="197.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">North</tspan></text><rect x="124" y="165.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="140" y="192.1" fill="#252c28" font-size="19"><tspan x="140" dy="0">Both at North</tspan></text><text x="140" y="220.79999999999998" fill="#626962" font-size="17"><tspan x="140" dy="0">They meet at the North entrance.</tspan></text><rect x="128" y="169.1" width="314" height="218" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><rect x="494" y="165.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="510" y="192.1" fill="#252c28" font-size="19"><tspan x="510" dy="0">Different entrances</tspan></text><text x="510" y="220.79999999999998" fill="#626962" font-size="17"><tspan x="510" dy="0">They miss the agreed meeting.</tspan></text><text x="24" y="499.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">South</tspan></text><rect x="124" y="467.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="140" y="494.1" fill="#252c28" font-size="19"><tspan x="140" dy="0">Different entrances</tspan></text><text x="140" y="522.8" fill="#626962" font-size="17"><tspan x="140" dy="0">They miss the agreed meeting.</tspan></text><rect x="494" y="467.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="510" y="494.1" fill="#252c28" font-size="19"><tspan x="510" dy="0">Both at South</tspan></text><text x="510" y="522.8" fill="#626962" font-size="17"><tspan x="510" dy="0">They meet at the South entrance.</tspan></text><rect x="498" y="471.1" width="314" height="218" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><text x="24" y="733.1" fill="#626962" font-size="16"><tspan x="24" dy="0">Cells compare choices before observing the other’s current decision, not movements between entrances.</tspan><tspan x="24" dy="21.6">Double outlines mark equilibria.</tspan></text><rect x="24" y="793.5" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="819.5" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Name one usable entrance and time, acknowledge it, and coordinate revisions.</tspan></text><text x="24" y="868.6" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Communication, access, and follow-through remain necessary. Recovery takes additional time or</tspan><tspan x="24" dy="22.950000000000003">resources.</tspan></text></g></svg>
