<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2176" viewBox="0 0 360 2176" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Local safeguards can undermine a beneficial partnership</title><desc id="desc">A hypothetical beneficial loop links Mira’s credible client plans with Owen’s reliable delivery. A separate harmful loop links unchecked promises to delivery disruption, withheld dates, negotiation pressure, and further unchecked promises. Local safeguards damage a partnership that could help both sides; neither needs to seek superiority. Shared provisional options and capacity checks address the harmful cross-effects.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.3"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.3"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Local safeguards can</tspan><tspan x="24" dy="28.35">undermine a beneficial</tspan><tspan x="24" dy="28.35">partnership</tspan></text><text x="24" y="124.95" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · causal</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="180.55" fill="#252c28" font-size="18"><tspan x="24" dy="0">The partnership worth preserving</tspan><tspan x="24" dy="24.3">· reinforcing</tspan></text><rect x="24" y="245.35000000000002" width="274" height="144" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="273.35" fill="#252c28" font-size="19"><tspan x="40" dy="0">Mira’s credible client</tspan><tspan x="40" dy="25.650000000000002">plans</tspan></text><text x="40" y="327.75" fill="#626962" font-size="17"><tspan x="40" dy="0">Feasible promises help</tspan><tspan x="40" dy="22.950000000000003">Owen schedule work.</tspan></text><rect x="24" y="479.35" width="274" height="144" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="507.35" fill="#252c28" font-size="19"><tspan x="40" dy="0">Owen’s reliable delivery</tspan></text><text x="40" y="536.1" fill="#626962" font-size="17"><tspan x="40" dy="0">Completed work supports</tspan><tspan x="40" dy="22.950000000000003">credible future plans.</tspan></text><path d="M 161 389.35 V 479.35" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="181" y="414.35" fill="#626962" font-size="16"><tspan x="181" dy="0">support</tspan><tspan x="181" dy="21.6">reliable</tspan><tspan x="181" dy="21.6">delivery</tspan></text><path d="M 161 623.35 V 641.35 H 336 V 229.35000000000002 H 161 V 245.35000000000002" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="24" y="675.35" fill="#626962" font-size="16"><tspan x="24" dy="0">Return: reliable delivery supports</tspan><tspan x="24" dy="21.6">credible plans.</tspan></text><text x="24" y="746.95" fill="#252c28" font-size="18"><tspan x="24" dy="0">The damaging cross-effects ·</tspan><tspan x="24" dy="24.3">reinforcing</tspan></text><rect x="24" y="811.75" width="274" height="144" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="839.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Mira’s unchecked</tspan><tspan x="40" dy="25.650000000000002">promises</tspan></text><text x="40" y="894.15" fill="#626962" font-size="17"><tspan x="40" dy="0">Dates are given without a</tspan><tspan x="40" dy="22.950000000000003">capacity check.</tspan></text><rect x="24" y="1045.75" width="274" height="144" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1073.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Owen’s delivery</tspan><tspan x="40" dy="25.650000000000002">disruption</tspan></text><text x="40" y="1128.15" fill="#626962" font-size="17"><tspan x="40" dy="0">Restarts displace agreed</tspan><tspan x="40" dy="22.950000000000003">commitments.</tspan></text><rect x="24" y="1279.75" width="274" height="144" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1307.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Dates withheld until</tspan><tspan x="40" dy="25.650000000000002">late</tspan></text><text x="40" y="1362.15" fill="#626962" font-size="17"><tspan x="40" dy="0">Owen protects the</tspan><tspan x="40" dy="22.950000000000003">schedule.</tspan></text><rect x="24" y="1513.75" width="274" height="144" rx="3" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1541.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Mira’s negotiation</tspan><tspan x="40" dy="25.650000000000002">pressure</tspan></text><text x="40" y="1596.15" fill="#626962" font-size="17"><tspan x="40" dy="0">Few credible options</tspan><tspan x="40" dy="22.950000000000003">remain for clients.</tspan></text><path d="M 161 955.75 V 1045.75" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="181" y="980.75" fill="#626962" font-size="16"><tspan x="181" dy="0">increase</tspan><tspan x="181" dy="21.6">disruption</tspan></text><path d="M 161 1189.75 V 1279.75" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="181" y="1214.75" fill="#626962" font-size="16"><tspan x="181" dy="0">encourages</tspan><tspan x="181" dy="21.6">withholding</tspan></text><path d="M 161 1423.75 V 1513.75" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="181" y="1448.75" fill="#626962" font-size="16"><tspan x="181" dy="0">increases</tspan><tspan x="181" dy="21.6">pressure</tspan></text><path d="M 161 1657.75 V 1675.75 H 336 V 795.75 H 161 V 811.75" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#arrow)"/><text x="24" y="1709.75" fill="#626962" font-size="16"><tspan x="24" dy="0">Return: prompts unchecked promises.</tspan></text><text x="24" y="1759.75" fill="#626962" font-size="16"><tspan x="24" dy="0">Arrows: hypothesized causal effects,</tspan><tspan x="24" dy="21.6">not chronology. Reinforcing</tspan><tspan x="24" dy="21.6">amplifies change; balancing</tspan><tspan x="24" dy="21.6">counteracts it.</tspan></text><rect x="24" y="1858.55" width="312" height="155.9000000000001" rx="3" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1886.55" fill="#252c28" font-size="18"><tspan x="40" dy="0">Change the relationship</tspan></text><text x="40" y="1917.05" fill="#252c28" font-size="18"><tspan x="40" dy="0">Share provisional options</tspan><tspan x="40" dy="24.3">early, confirm capacity</tspan><tspan x="40" dy="24.3">before promising, and name</tspan><tspan x="40" dy="24.3">what changes displace.</tspan></text><text x="24" y="2050.45" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Joint understanding creates</tspan><tspan x="24" dy="22.950000000000003">no extra hours. Genuine excess</tspan><tspan x="24" dy="22.950000000000003">demand still requires changes to</tspan><tspan x="24" dy="22.950000000000003">staffing, scope, timing, or</tspan><tspan x="24" dy="22.950000000000003">commitments.</tspan></text></g></svg>
