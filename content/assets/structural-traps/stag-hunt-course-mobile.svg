<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1167" viewBox="0 0 360 1167" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">The better hunt needs both participants</title><desc id="desc">Hypothetical qualitative illustration. Asha and Ben choose stag or hare without observing the other’s choice. Both stag and both hare are double-outlined equilibria. Each prefers stag against stag, but hare against hare. A lone stag hunter loses the dependable fallback. Change: Build credible assurance about the same joint plan; protection against failure would instead change payoffs. Limitation: Technical hunting risk is set aside. Promises alone may fail; the qualitative rankings do not establish risk dominance.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">The better hunt needs both</tspan><tspan x="24" dy="28.35">participants</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Ben chooses Stag</tspan></text><rect x="24" y="190.45000000000002" width="274" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="217.45000000000002" fill="#252c28" font-size="19"><tspan x="40" dy="0">Both choose stag</tspan></text><text x="40" y="246.15" fill="#626962" font-size="17"><tspan x="40" dy="0">Asha: Stag. Both obtain the</tspan><tspan x="40" dy="22.950000000000003">preferred shared result.</tspan></text><rect x="28" y="194.45000000000002" width="266" height="93.74999999999997" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><rect x="24" y="328.2" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="355.2" fill="#252c28" font-size="19"><tspan x="40" dy="0">Ben chooses stag alone</tspan></text><text x="40" y="383.9" fill="#626962" font-size="17"><tspan x="40" dy="0">Asha: Hare. Ben loses the</tspan><tspan x="40" dy="22.950000000000003">fallback; Asha gets a hare.</tspan></text><text x="24" y="465.95" fill="#252c28" font-size="18"><tspan x="24" dy="0">Ben chooses Hare</tspan></text><rect x="24" y="495.34999999999997" width="274" height="101.74999999999994" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="522.3499999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Asha chooses stag alone</tspan></text><text x="40" y="551.05" fill="#626962" font-size="17"><tspan x="40" dy="0">Asha: Stag. Asha loses the</tspan><tspan x="40" dy="22.950000000000003">fallback; Ben gets a hare.</tspan></text><rect x="24" y="633.0999999999999" width="274" height="124.70000000000005" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="660.0999999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Both choose hare</tspan></text><text x="40" y="688.8" fill="#626962" font-size="17"><tspan x="40" dy="0">Asha: Hare. Dependable for</tspan><tspan x="40" dy="22.950000000000003">each; less rewarding than the</tspan><tspan x="40" dy="22.950000000000003">shared stag.</tspan></text><rect x="28" y="637.0999999999999" width="266" height="116.70000000000005" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><text x="24" y="793.8" fill="#626962" font-size="16"><tspan x="24" dy="0">Cells compare simultaneous alternatives,</tspan><tspan x="24" dy="21.6">not hunting chronology. Double outlines</tspan><tspan x="24" dy="21.6">mark Nash equilibria. The story is a</tspan><tspan x="24" dy="21.6">stylized teaching model, not a field</tspan><tspan x="24" dy="21.6">observation.</tspan></text><rect x="24" y="918.9999999999999" width="312" height="117.95000000000005" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="944.9999999999999" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Build credible assurance</tspan><tspan x="40" dy="22.950000000000003">about the same joint plan;</tspan><tspan x="40" dy="22.950000000000003">protection against failure would</tspan><tspan x="40" dy="22.950000000000003">instead change payoffs.</tspan></text><text x="24" y="1062.9499999999998" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Technical hunting risk is set aside.</tspan><tspan x="24" dy="22.950000000000003">Promises alone may fail; the qualitative</tspan><tspan x="24" dy="22.950000000000003">rankings do not establish risk</tspan><tspan x="24" dy="22.950000000000003">dominance.</tspan></text></g></svg>
