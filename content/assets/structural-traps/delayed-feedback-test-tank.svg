<svg xmlns="http://www.w3.org/2000/svg" width="840" height="922" viewBox="0 0 840 922" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">The correction is still on its way</title><desc id="desc">Hypothetical qualitative illustration. Ada turns the shower mixer warmer. Earlier cool water still in the pipe arrives before the changed mixture. Repeating a large warmer turn can stack correction and later make the spray too hot. An alternative modest-adjustment procedure waits to assess the first change before repeating it; physical transit delay remains. One overshoot is shown here. Oscillation requires repeated reversals; delay alone does not establish it. Change: Coordinate adjustment size and timing with the physical response delay. Limitation: Supply and equipment are held steady here. Waiting takes time; changing delays, disturbances, and safe limits need separate control.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">The correction is still on its way</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">A mixer change takes time to reach the outlet</tspan></text><rect x="24.0" y="140.5" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40.0" y="167.5" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Turn toward warmer</tspan></text><text x="40.0" y="196.2" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Newly mixed water</tspan><tspan x="40.0" dy="22.950000000000003">enters the pipe.</tspan></text><rect x="308.0" y="140.5" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="167.5" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Earlier cool water</tspan><tspan x="324.0" dy="25.650000000000002">arrives</tspan></text><text x="324.0" y="221.85" fill="#626962" font-size="17"><tspan x="324.0" dy="0">The first change is still</tspan><tspan x="324.0" dy="22.950000000000003">in transit.</tspan></text><rect x="592.0" y="140.5" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="167.5" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Changed water</tspan><tspan x="608.0" dy="25.650000000000002">arrives later</tspan></text><text x="608.0" y="221.85" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Its temperature reflects</tspan><tspan x="608.0" dy="22.950000000000003">the earlier setting.</tspan></text><path d="M 248.0 204.2 H 308.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 532.0 204.2 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="309.9" fill="#252c28" font-size="18"><tspan x="24" dy="0">While the earlier cool water still arrives</tspan></text><rect x="260" y="339.29999999999995" width="320" height="127.39999999999998" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="276" y="366.29999999999995" fill="#252c28" font-size="19"><tspan x="276" dy="0">The first turn has not been felt</tspan><tspan x="276" dy="25.650000000000002">yet</tspan></text><text x="276" y="420.6499999999999" fill="#626962" font-size="17"><tspan x="276" dy="0">Same mixer, pipe, supply, and initial</tspan><tspan x="276" dy="22.950000000000003">condition.</tspan></text><rect x="24" y="562.6999999999999" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="589.6999999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Repeat a large warmer turn</tspan></text><text x="40" y="618.4" fill="#626962" font-size="17"><tspan x="40" dy="0">Stacked correction can make the</tspan><tspan x="40" dy="22.950000000000003">later spray too hot.</tspan></text><rect x="516" y="562.6999999999999" width="300" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="532" y="589.6999999999999" fill="#252c28" font-size="19"><tspan x="532" dy="0">Let the first change arrive</tspan></text><text x="532" y="618.4" fill="#626962" font-size="17"><tspan x="532" dy="0">Assess its effect before another</tspan><tspan x="532" dy="22.950000000000003">modest correction.</tspan></text><path d="M 420.0 466.69999999999993 V 522.6999999999999" fill="none" stroke="#252c28" stroke-width="1.4"/><path d="M 420.0 522.6999999999999 H 174.0 V 562.6999999999999" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 420.0 522.6999999999999 H 666.0 V 562.6999999999999" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><text x="24" y="706.4499999999999" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows show mixing and arrival order. Lower branches are alternative decision procedures from the</tspan><tspan x="24" dy="21.6">same condition. No spacing represents elapsed time or temperature. One overshoot is shown here.</tspan><tspan x="24" dy="21.6">Oscillation requires repeated reversals; delay alone does not establish it.</tspan></text><rect x="24" y="788.4499999999999" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="814.4499999999999" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Coordinate adjustment size and timing with the physical response delay.</tspan></text><text x="24" y="863.55" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Supply and equipment are held steady here. Waiting takes time; changing delays, disturbances,</tspan><tspan x="24" dy="22.950000000000003">and safe limits need separate control.</tspan></text></g></svg>
