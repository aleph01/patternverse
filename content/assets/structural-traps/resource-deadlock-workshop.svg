<svg xmlns="http://www.w3.org/2000/svg" width="840" height="812" viewBox="0 0 840 812" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Occupied space closes a waiting cycle</title><desc id="desc">Hypothetical qualitative illustration. A holds A and requests B; B holds B and requests C; C holds C and requests D; D holds D and requests A. No ordinary forward move is available. Authorized removal of A to a safe bay frees A, allowing D, C, and B to move before A can re-enter. Change: Create a safe release, then prevent new entry from closing the cycle again. Limitation: Safe geometry, authority, and compliance are assumed. No road-control specification is supplied.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Occupied space closes a waiting cycle</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Closed waiting cycle · resource map, not road geometry</tspan></text><rect x="24" y="140.5" width="330" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="167.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Car A holds space A</tspan></text><text x="40" y="196.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Needs space B before moving.</tspan></text><rect x="486" y="140.5" width="330" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="502" y="167.5" fill="#252c28" font-size="19"><tspan x="502" dy="0">Car B holds space B</tspan></text><text x="502" y="196.2" fill="#626962" font-size="17"><tspan x="502" dy="0">Needs space C before moving.</tspan></text><rect x="486" y="312.5" width="330" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="502" y="339.5" fill="#252c28" font-size="19"><tspan x="502" dy="0">Car C holds space C</tspan></text><text x="502" y="368.2" fill="#626962" font-size="17"><tspan x="502" dy="0">Needs space D before moving.</tspan></text><rect x="24" y="312.5" width="330" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="339.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Car D holds space D</tspan></text><text x="40" y="368.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Needs space A before moving.</tspan></text><path d="M 354 183.5 H 486" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 651.0 226.5 V 312.5" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 486 355.5 H 354" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 189.0 312.5 V 226.5" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="368" y="171.5" fill="#626962" font-size="16"><tspan x="368" dy="0">requests B</tspan></text><text x="663.0" y="258.5" fill="#626962" font-size="16"><tspan x="663.0" dy="0">requests C</tspan></text><text x="368" y="343.5" fill="#626962" font-size="16"><tspan x="368" dy="0">requests D</tspan></text><text x="24" y="258.5" fill="#626962" font-size="16"><tspan x="24" dy="0">D requests A</tspan></text><text x="24" y="442.5" fill="#252c28" font-size="18"><tspan x="24" dy="0">Authorized recovery · keep new entry out</tspan></text><rect x="24.0" y="471.9" width="224.0" height="127.4" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="498.9" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Move A into a safe</tspan><tspan x="40.0" dy="25.650000000000002">bay</tspan></text><text x="40.0" y="553.25" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Requires a verified extra</tspan><tspan x="40.0" dy="22.950000000000003">movement.</tspan></text><rect x="308.0" y="471.9" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="498.9" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">D, then C, then B</tspan><tspan x="324.0" dy="25.650000000000002">move</tspan></text><text x="324.0" y="553.25" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Each releases space for</tspan><tspan x="324.0" dy="22.950000000000003">the next.</tspan></text><rect x="592.0" y="471.9" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="498.9" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">A enters when clear</tspan></text><text x="608.0" y="527.5999999999999" fill="#626962" font-size="17"><tspan x="608.0" dy="0">A has lost its earlier</tspan><tspan x="608.0" dy="22.950000000000003">place.</tspan></text><path d="M 248.0 535.6 H 308.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><path d="M 532.0 535.6 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="641.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows: requests to the next holder. Lower arrows: recovery chronology. Each space has one occupant;</tspan><tspan x="24" dy="21.6">there is no ordinary escape in the initial model.</tspan></text><rect x="24" y="701.6999999999999" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="727.6999999999999" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Create a safe release, then prevent new entry from closing the cycle again.</tspan></text><text x="24" y="776.8" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Safe geometry, authority, and compliance are assumed. No road-control specification is supplied.</tspan></text></g></svg>
