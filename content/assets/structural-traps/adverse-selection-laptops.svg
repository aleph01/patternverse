<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1052" viewBox="0 0 840 1052" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">The offer filters which machines reach the market</title><desc id="desc">Hypothetical qualitative illustration. The same unverified offer reaches owners of dependable and worn machines. Dependable owners keep their machines while worn-machine owners find selling attractive. Only the accepting branch feeds the offered pool. A reliable pre-sale inspection can change what Rina knows before acceptance, without changing machine quality. Change: Make condition credibly distinguishable before agreement. Limitation: Reports must be accurate, unforgeable, and affordable. Information does not improve the machines.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">The offer filters which machines reach the market</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">One unverified offer filters participation</tspan></text><rect x="260" y="140.5" width="320" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="276" y="167.5" fill="#252c28" font-size="19"><tspan x="276" dy="0">Rina offers for unknown quality</tspan></text><text x="276" y="196.2" fill="#626962" font-size="17"><tspan x="276" dy="0">Owners know condition before</tspan><tspan x="276" dy="22.950000000000003">accepting.</tspan></text><rect x="24" y="338.25" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="365.25" fill="#252c28" font-size="19"><tspan x="40" dy="0">Dependable-machine owner</tspan></text><text x="40" y="393.95" fill="#626962" font-size="17"><tspan x="40" dy="0">Prefers keeping it at this offer: no</tspan><tspan x="40" dy="22.950000000000003">sale.</tspan></text><rect x="516" y="338.25" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="532" y="365.25" fill="#252c28" font-size="19"><tspan x="532" dy="0">Worn-machine owner</tspan></text><text x="532" y="393.95" fill="#626962" font-size="17"><tspan x="532" dy="0">Finds selling attractive at this</tspan><tspan x="532" dy="22.950000000000003">offer.</tspan></text><path d="M 420.0 242.25 V 298.25" fill="none" stroke="#252c28" stroke-width="1.4"/><path d="M 420.0 298.25 H 174.0 V 338.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 420.0 298.25 H 666.0 V 338.25" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="516" y="507.0" width="300" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="532" y="534.0" fill="#252c28" font-size="19"><tspan x="532" dy="0">Offered pool shifts</tspan></text><text x="532" y="562.7" fill="#626962" font-size="17"><tspan x="532" dy="0">It differs from all potential</tspan><tspan x="532" dy="22.950000000000003">machines.</tspan></text><path d="M 666.0 440.0 V 507.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="658.75" fill="#252c28" font-size="18"><tspan x="24" dy="0">Change the information before acceptance</tspan></text><rect x="24.0" y="688.15" width="224.0" height="127.4" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="715.15" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">Independent</tspan><tspan x="40.0" dy="25.650000000000002">inspection</tspan></text><text x="40.0" y="769.5" fill="#626962" font-size="17"><tspan x="40.0" dy="0">A reliable report follows</tspan><tspan x="40.0" dy="22.950000000000003">the machine.</tspan></text><rect x="308.0" y="688.15" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324.0" y="715.15" fill="#252c28" font-size="19"><tspan x="324.0" dy="0">Condition-based</tspan><tspan x="324.0" dy="25.650000000000002">offers</tspan></text><text x="324.0" y="769.5" fill="#626962" font-size="17"><tspan x="324.0" dy="0">Rina can distinguish</tspan><tspan x="324.0" dy="22.950000000000003">relevant quality.</tspan></text><rect x="592.0" y="688.15" width="224.0" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608.0" y="715.15" fill="#252c28" font-size="19"><tspan x="608.0" dy="0">Trades can return</tspan></text><text x="608.0" y="743.85" fill="#626962" font-size="17"><tspan x="608.0" dy="0">Only if the recovered</tspan><tspan x="608.0" dy="22.950000000000003">gain covers verification</tspan><tspan x="608.0" dy="22.950000000000003">cost.</tspan></text><path d="M 248.0 751.85 H 308.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><path d="M 532.0 751.85 H 592.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="857.55" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper branches: owners’ participation responses to one offer. The continuing arrow feeds the offered pool.</tspan><tspan x="24" dy="21.6">Lower arrows: the proposed information process.</tspan></text><rect x="24" y="917.9499999999999" width="792" height="49.10000000000002" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="943.9499999999999" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Make condition credibly distinguishable before agreement.</tspan></text><text x="24" y="993.05" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Reports must be accurate, unforgeable, and affordable. Information does not improve the</tspan><tspan x="24" dy="22.950000000000003">machines.</tspan></text></g></svg>
