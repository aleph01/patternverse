<svg xmlns="http://www.w3.org/2000/svg" width="840" height="998" viewBox="0 0 840 998" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Results earn the means to produce more results</title><desc id="desc">Hypothetical qualitative illustration. A has more grant support and a larger research record; B has less support and a smaller record under the illustration’s comparable-potential assumption. A funder rewarding raw results feeds support back toward A from a fixed pool, leaving less for B. A usable trial changes the allocation rule. Change: Evaluate opportunity and quality, and protect a usable trial rather than automatically rewarding raw totals. Limitation: Fixed funding means opportunity cost. Recruiting, research delay, quality, and inherited reputation still matter.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Results earn the means to produce more results</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="111.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">One fixed grant pool · coupled feedback</tspan></text><rect x="24" y="140.5" width="224" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="167.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">A · more support</tspan></text><text x="40" y="196.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Builds usable research</tspan><tspan x="40" dy="22.950000000000003">capability.</tspan></text><rect x="308" y="140.5" width="224" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324" y="167.5" fill="#252c28" font-size="19"><tspan x="324" dy="0">A · larger record</tspan></text><text x="324" y="196.2" fill="#626962" font-size="17"><tspan x="324" dy="0">Results take time.</tspan></text><rect x="24" y="342.25" width="224" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="369.25" fill="#252c28" font-size="19"><tspan x="40" dy="0">B · less support</tspan></text><text x="40" y="397.95" fill="#626962" font-size="17"><tspan x="40" dy="0">Less capability can be</tspan><tspan x="40" dy="22.950000000000003">built.</tspan></text><rect x="308" y="342.25" width="224" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="324" y="369.25" fill="#252c28" font-size="19"><tspan x="324" dy="0">B · smaller record</tspan></text><text x="324" y="397.95" fill="#626962" font-size="17"><tspan x="324" dy="0">Results take time.</tspan></text><rect x="592" y="250.5" width="224" height="150.34999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="608" y="277.5" fill="#252c28" font-size="19"><tspan x="608" dy="0">One next-award</tspan><tspan x="608" dy="25.650000000000002">decision</tspan></text><text x="608" y="331.84999999999997" fill="#626962" font-size="17"><tspan x="608" dy="0">Raw totals favor A;</tspan><tspan x="608" dy="22.950000000000003">more for A leaves less</tspan><tspan x="608" dy="22.950000000000003">for B.</tspan></text><path d="M 248 191.375 H 308" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 248 393.125 H 308" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 532 183.5 H 562 V 307.67499999999995 H 592" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 532 385.25 H 576 V 343.67499999999995 H 592" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 816 303.67499999999995 H 828 V 122.5 H 136.0 V 140.5" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 816 347.67499999999995 H 828 V 472.0 H 136.0 V 444.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="510.0" width="792" height="72.05000000000007" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="536.0" fill="#252c28" font-size="17"><tspan x="40" dy="0">Both result records feed one allocation decision. Its two return paths change future support from</tspan><tspan x="40" dy="22.950000000000003">the same fixed pool. Comparable potential is assumed, not inferred from raw counts.</tspan></text><text x="24" y="608.0500000000001" fill="#252c28" font-size="18"><tspan x="24" dy="0">Replace automatic winner bonuses</tspan></text><rect x="24.0" y="637.45" width="366.0" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40.0" y="664.45" fill="#252c28" font-size="19"><tspan x="40.0" dy="0">A usable trial for B</tspan></text><text x="40.0" y="693.1500000000001" fill="#626962" font-size="17"><tspan x="40.0" dy="0">Protected support and realistic review</tspan><tspan x="40.0" dy="22.950000000000003">timing.</tspan></text><rect x="450.0" y="637.45" width="366.0" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="466.0" y="664.45" fill="#252c28" font-size="19"><tspan x="466.0" dy="0">Assess quality and opportunity</tspan></text><text x="466.0" y="693.1500000000001" fill="#626962" font-size="17"><tspan x="466.0" dy="0">No guarantee B becomes the better team.</tspan></text><path d="M 390.0 688.325 H 450.0" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><text x="24" y="781.2" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper arrows show support enabling results; the explicit feedback statement returns results to the next</tspan><tspan x="24" dy="21.6">allocation for both teams. Lower arrows show the proposed trial and review.</tspan></text><rect x="24" y="841.6" width="792" height="72.05000000000007" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="867.6" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Evaluate opportunity and quality, and protect a usable trial rather than automatically</tspan><tspan x="40" dy="22.950000000000003">rewarding raw totals.</tspan></text><text x="24" y="939.6500000000001" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Fixed funding means opportunity cost. Recruiting, research delay, quality, and inherited</tspan><tspan x="24" dy="22.950000000000003">reputation still matter.</tspan></text></g></svg>
