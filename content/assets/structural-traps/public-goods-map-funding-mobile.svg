<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1186" viewBox="0 0 360 1186" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Some listeners pay; all can hear the reporting</title><desc id="desc">Hypothetical qualitative illustration. Original voluntary donations and accepted member dues are alternative routes funding incremental local reporting. All listeners, including nonmembers, can benefit under either route. Dues work only after willing adoption and reliable collection for the agreed period. Change: Secure accepted, collectible funding for a defined period while retaining open listening. Limitation: Joining is voluntary; collection, fairness, editorial accountability, and later renewal still matter.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Some listeners pay; all can hear</tspan><tspan x="24" dy="28.35">the reporting</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Alternative funding routes · adoption</tspan><tspan x="24" dy="24.3">is separate</tspan></text><rect x="24" y="214.75000000000003" width="312" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Voluntary donations</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Listeners may save their money and</tspan><tspan x="40" dy="22.950000000000003">still listen.</tspan></text><rect x="24" y="340.5" width="312" height="101.75" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="367.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Accepted membership dues</tspan></text><text x="40" y="396.2" fill="#626962" font-size="17"><tspan x="40" dy="0">Only willing members accept an</tspan><tspan x="40" dy="22.950000000000003">obligation.</tspan></text><rect x="24" y="512.25" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="539.25" fill="#252c28" font-size="19"><tspan x="40" dy="0">Local reporting</tspan></text><text x="40" y="567.95" fill="#626962" font-size="17"><tspan x="40" dy="0">Incremental work in an operating</tspan><tspan x="40" dy="22.950000000000003">station.</tspan></text><path d="M 24 265.625 H 12 V 563.125 H 24" fill="none" stroke="#252c28" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M 180 442.25 V 512.25" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><rect x="24" y="692.0" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="719.0" fill="#252c28" font-size="19"><tspan x="40" dy="0">All listeners can benefit</tspan></text><text x="40" y="747.7" fill="#626962" font-size="17"><tspan x="40" dy="0">Ari, Bea, Cam, Dev, and</tspan><tspan x="40" dy="22.950000000000003">nonmembers.</tspan></text><path d="M 180 614.0 V 692.0" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="835.75" fill="#626962" font-size="16"><tspan x="24" dy="0">Input arrows show funding. Output arrow</tspan><tspan x="24" dy="21.6">shows shared access, not a money</tspan><tspan x="24" dy="21.6">transfer or rival portions. Green is an</tspan><tspan x="24" dy="21.6">alternative route, not an extra automatic</tspan><tspan x="24" dy="21.6">payment.</tspan></text><rect x="24" y="960.9499999999999" width="312" height="117.94999999999993" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="986.9499999999999" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Secure accepted,</tspan><tspan x="40" dy="22.950000000000003">collectible funding for a defined</tspan><tspan x="40" dy="22.950000000000003">period while retaining open</tspan><tspan x="40" dy="22.950000000000003">listening.</tspan></text><text x="24" y="1104.8999999999999" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Joining is voluntary; collection,</tspan><tspan x="24" dy="22.950000000000003">fairness, editorial accountability, and</tspan><tspan x="24" dy="22.950000000000003">later renewal still matter.</tspan></text></g></svg>
