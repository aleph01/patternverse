<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1741" viewBox="0 0 360 1741" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">A relaxed response promise can hide unchanged waiting</title><desc id="desc">Hypothetical qualitative illustration. The same actual waiting time misses an original promise but appears more acceptable under a relaxed one. Accepted delay can reduce recovery priority, worsen actual waiting, and invite another relaxation. Restoring a justified reference and usable coverage changes that response. Change: Separate forecasts from the justified service promise and resource a feasible recovery. Limitation: A target adds no capacity. Training, backlogs, changing needs, and unaffordable promises require explicit decisions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">A relaxed response promise can</tspan><tspan x="24" dy="28.35">hide unchanged waiting</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Hold actual waiting fixed; compare</tspan><tspan x="24" dy="24.3">two standards</tspan></text><rect x="24" y="214.75000000000003" width="312" height="101.74999999999997" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Original response promise</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">The unchanged actual wait misses</tspan><tspan x="40" dy="22.950000000000003">it.</tspan></text><rect x="24" y="392.5" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="419.5" fill="#252c28" font-size="19"><tspan x="40" dy="0">Relaxed response promise</tspan></text><text x="40" y="448.2" fill="#626962" font-size="17"><tspan x="40" dy="0">The same wait looks more</tspan><tspan x="40" dy="22.950000000000003">acceptable.</tspan></text><rect x="24" y="536.25" width="312" height="140.89999999999998" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="562.25" fill="#252c28" font-size="17"><tspan x="40" dy="0">No customer is helped sooner by</tspan><tspan x="40" dy="22.950000000000003">changing the benchmark. A</tspan><tspan x="40" dy="22.950000000000003">forecast reports expected waiting; a</tspan><tspan x="40" dy="22.950000000000003">standard states the service people</tspan><tspan x="40" dy="22.950000000000003">should be able to expect.</tspan></text><text x="24" y="703.15" fill="#252c28" font-size="18"><tspan x="24" dy="0">Hypothesized erosion route</tspan></text><rect x="24" y="732.55" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="759.55" fill="#252c28" font-size="19"><tspan x="40" dy="0">Longer waits accepted</tspan></text><text x="40" y="788.25" fill="#626962" font-size="17"><tspan x="40" dy="0">Less recognized shortfall.</tspan></text><path d="M 180 818.55 V 894.55" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="894.55" width="312" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="921.55" fill="#252c28" font-size="19"><tspan x="40" dy="0">Recovery loses priority</tspan></text><text x="40" y="950.25" fill="#626962" font-size="17"><tspan x="40" dy="0">Coverage stays inadequate.</tspan></text><path d="M 180 980.55 V 1056.55" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="1056.55" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1083.55" fill="#252c28" font-size="19"><tspan x="40" dy="0">Actual waiting worsens</tspan></text><text x="40" y="1112.25" fill="#626962" font-size="17"><tspan x="40" dy="0">Another relaxation appears</tspan><tspan x="40" dy="22.950000000000003">reasonable.</tspan></text><rect x="24" y="1200.3" width="312" height="163.8499999999999" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1226.3" fill="#252c28" font-size="17"><tspan x="40" dy="0">The last step feeds another</tspan><tspan x="40" dy="22.950000000000003">lowering of the response standard.</tspan><tspan x="40" dy="22.950000000000003">A stable, justified reference needs</tspan><tspan x="40" dy="22.950000000000003">usable coverage; preserving an</tspan><tspan x="40" dy="22.950000000000003">impossible promise would be a</tspan><tspan x="40" dy="22.950000000000003">different mistake.</tspan></text><text x="24" y="1390.1499999999999" fill="#626962" font-size="16"><tspan x="24" dy="0">Upper cards are alternative comparisons,</tspan><tspan x="24" dy="21.6">not later waiting measurements. Lower</tspan><tspan x="24" dy="21.6">arrows show a hypothesized causal path;</tspan><tspan x="24" dy="21.6">its final step feeds further standard</tspan><tspan x="24" dy="21.6">revision.</tspan></text><rect x="24" y="1515.35" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1541.35" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Separate forecasts from</tspan><tspan x="40" dy="22.950000000000003">the justified service promise and</tspan><tspan x="40" dy="22.950000000000003">resource a feasible recovery.</tspan></text><text x="24" y="1636.35" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: A target adds no capacity.</tspan><tspan x="24" dy="22.950000000000003">Training, backlogs, changing needs,</tspan><tspan x="24" dy="22.950000000000003">and unaffordable promises require</tspan><tspan x="24" dy="22.950000000000003">explicit decisions.</tspan></text></g></svg>
