<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Each prefers implicating against either choice</title><desc id="desc">Hypothetical qualitative illustration. Noor and Leo each choose silence or implication without seeing the other’s choice. Each prefers implicating against silence and against implication. Both implicating is the double-outlined equilibrium although both prefer mutual silence. No sentence lengths are invented. Change: An enforceable consequence or future interaction would change the game; a promise alone does not. Limitation: The original one-shot rankings stay decisive. No practical intervention in an actual investigation is prescribed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Each prefers implicating against either choice</tspan></text><text x="24" y="68.3" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative relationships</tspan></text><text x="24" y="139.1" fill="#626962" font-size="17"><tspan x="24" dy="0">Noor ↓</tspan></text><text x="136" y="139.1" fill="#252c28" font-size="17"><tspan x="136" dy="0">Leo: Silent</tspan></text><text x="506" y="139.1" fill="#252c28" font-size="17"><tspan x="506" dy="0">Leo: Implicate</tspan></text><text x="24" y="197.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Silent</tspan></text><rect x="124" y="165.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="140" y="192.1" fill="#252c28" font-size="19"><tspan x="140" dy="0">Both stay silent</tspan></text><text x="140" y="220.79999999999998" fill="#626962" font-size="17"><tspan x="140" dy="0">Better for each than both implicating.</tspan></text><rect x="494" y="165.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="510" y="192.1" fill="#252c28" font-size="19"><tspan x="510" dy="0">Noor stays silent; Leo implicates</tspan></text><text x="510" y="220.79999999999998" fill="#626962" font-size="17"><tspan x="510" dy="0">Noor’s worst; Leo’s best.</tspan></text><text x="24" y="499.1" fill="#252c28" font-size="18"><tspan x="24" dy="0">Implicate</tspan></text><rect x="124" y="467.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="140" y="494.1" fill="#252c28" font-size="19"><tspan x="140" dy="0">Noor implicates; Leo stays silent</tspan></text><text x="140" y="522.8" fill="#626962" font-size="17"><tspan x="140" dy="0">Noor’s best; Leo’s worst.</tspan></text><rect x="494" y="467.1" width="322" height="226" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="510" y="494.1" fill="#252c28" font-size="19"><tspan x="510" dy="0">Both implicate</tspan></text><text x="510" y="522.8" fill="#626962" font-size="17"><tspan x="510" dy="0">The unique equilibrium; worse for</tspan><tspan x="510" dy="22.950000000000003">each than mutual silence.</tspan></text><rect x="498" y="471.1" width="314" height="218" rx="2" fill="none" stroke="#252c28" stroke-width="1.2"/><rect x="24" y="733.1" width="792" height="72.05000000000007" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="759.1" fill="#252c28" font-size="17"><tspan x="40" dy="0">For either choice by Leo, Noor prefers implicating. For either choice by Noor, Leo prefers</tspan><tspan x="40" dy="22.950000000000003">implicating. These compare alternatives, not later moves.</tspan></text><text x="24" y="831.1500000000001" fill="#626962" font-size="16"><tspan x="24" dy="0">Cells compare simultaneous alternatives, not a sequence. Double outline marks Nash equilibrium. “Best” and</tspan><tspan x="24" dy="21.6">“worst” refer only to the stated personal rankings.</tspan></text><rect x="24" y="891.5500000000001" width="792" height="72.05000000000007" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="917.5500000000001" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: An enforceable consequence or future interaction would change the game; a promise</tspan><tspan x="40" dy="22.950000000000003">alone does not.</tspan></text><text x="24" y="989.6000000000001" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: The original one-shot rankings stay decisive. No practical intervention in an actual investigation is</tspan><tspan x="24" dy="22.950000000000003">prescribed.</tspan></text></g></svg>
