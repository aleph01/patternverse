<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1817" viewBox="0 0 360 1817" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Select one uploader, then check completion</title><desc id="desc">Hypothetical qualitative illustration. Ari, Bea, and Cam are alternative capable volunteers: any one upload suffices. The proposed protocol selects Ari, obtains Bea and Cam’s acknowledgement, and checks Ari’s completion receipt. A missing receipt calls for an accepted capable backup, not an assumption that someone acted. Change: Agree one capable owner, acknowledge the assignment, and verify completion. Limitation: Assignment cannot fix expired access, an unnoticed failure, or an unavailable backup.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Select one uploader, then check</tspan><tspan x="24" dy="28.35">completion</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Alternative capable volunteers · any</tspan><tspan x="24" dy="24.3">one upload suffices</tspan></text><rect x="24" y="214.75000000000003" width="274" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="241.75000000000003" fill="#252c28" font-size="19"><tspan x="40" dy="0">Ari</tspan></text><text x="40" y="270.45000000000005" fill="#626962" font-size="17"><tspan x="40" dy="0">Can act; hopes another will.</tspan></text><rect x="24" y="324.75" width="274" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="351.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Bea</tspan></text><text x="40" y="380.45" fill="#626962" font-size="17"><tspan x="40" dy="0">Can act; hopes another will.</tspan></text><rect x="24" y="434.75" width="274" height="86" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="461.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Cam</tspan></text><text x="40" y="490.45" fill="#626962" font-size="17"><tspan x="40" dy="0">Can act; hopes another will.</tspan></text><rect x="24" y="614.75" width="312" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="641.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Any ONE accepted upload</tspan></text><text x="40" y="670.45" fill="#626962" font-size="17"><tspan x="40" dy="0">An open request has not selected</tspan><tspan x="40" dy="22.950000000000003">an owner.</tspan></text><path d="M 298 257.75 H 336" fill="none" stroke="#252c28" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M 298 367.75 H 336" fill="none" stroke="#252c28" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M 298 477.75 H 336" fill="none" stroke="#252c28" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M 336 257.75 V 578.75 H 180 V 614.75" fill="none" stroke="#252c28" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="24" y="772.5" fill="#252c28" font-size="18"><tspan x="24" dy="0">Select responsibility, then check the</tspan><tspan x="24" dy="24.3">outcome</tspan></text><rect x="24" y="826.1999999999999" width="312" height="127.39999999999998" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="853.1999999999999" fill="#252c28" font-size="19"><tspan x="40" dy="0">Ari accepts and attempts the</tspan><tspan x="40" dy="25.650000000000002">upload</tspan></text><text x="40" y="907.55" fill="#626962" font-size="17"><tspan x="40" dy="0">Bea and Cam acknowledge the</tspan><tspan x="40" dy="22.950000000000003">owner.</tspan></text><rect x="24" y="1029.6" width="312" height="127.40000000000009" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1056.6" fill="#252c28" font-size="19"><tspan x="40" dy="0">Receipt present before the</tspan><tspan x="40" dy="25.650000000000002">deadline?</tspan></text><text x="40" y="1110.95" fill="#626962" font-size="17"><tspan x="40" dy="0">Do not assume that naming an</tspan><tspan x="40" dy="22.950000000000003">owner completed the task.</tspan></text><rect x="62" y="1233.0" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="78" y="1260.0" fill="#252c28" font-size="19"><tspan x="78" dy="0">Yes: completed</tspan></text><text x="78" y="1288.7" fill="#626962" font-size="17"><tspan x="78" dy="0">No duplicate upload is</tspan><tspan x="78" dy="22.950000000000003">needed.</tspan></text><rect x="62" y="1366.75" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="78" y="1393.75" fill="#252c28" font-size="19"><tspan x="78" dy="0">No: accepted backup</tspan></text><text x="78" y="1422.45" fill="#626962" font-size="17"><tspan x="78" dy="0">A capable person takes over</tspan><tspan x="78" dy="22.950000000000003">while time remains.</tspan></text><path d="M 180.0 1157.0 V 1189.0 H 36 V 1417.625" fill="none" stroke="#252c28" stroke-width="1.4"/><path d="M 36 1283.875 H 62" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 36 1417.625 H 62" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 180.0 953.5999999999999 V 1029.6" fill="none" stroke="#00855b" stroke-width="1.4" marker-end="url(#green)"/><text x="24" y="1510.5" fill="#626962" font-size="16"><tspan x="24" dy="0">Dashed inputs: alternative possible</tspan><tspan x="24" dy="21.6">volunteers; any one suffices. Solid arrows:</tspan><tspan x="24" dy="21.6">the accepted protocol and its conditional</tspan><tspan x="24" dy="21.6">completion branches.</tspan></text><rect x="24" y="1614.1" width="312" height="95.0" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1640.1" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Agree one capable owner,</tspan><tspan x="40" dy="22.950000000000003">acknowledge the assignment, and</tspan><tspan x="40" dy="22.950000000000003">verify completion.</tspan></text><text x="24" y="1735.1" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Assignment cannot fix expired</tspan><tspan x="24" dy="22.950000000000003">access, an unnoticed failure, or an</tspan><tspan x="24" dy="22.950000000000003">unavailable backup.</tspan></text></g></svg>
