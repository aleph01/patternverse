<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1701" viewBox="0 0 360 1701" role="img" aria-labelledby="title desc" style="background:#ffffff;color-scheme:light">
<title id="title">Payment comes before a discretionary response</title><desc id="desc">Hypothetical qualitative illustration. After a full payment, Omar can send or withhold the described goods. A separable small order lowers Maya’s affordable exposure but leaves the same two responses available. The practical trial assumes uncertainty about his preferences, unlike the known-selfish-preferences benchmark. Change: Use relevant evidence and an affordable separable trial where appropriate, or change control through protection. Limitation: Maya can still lose the exposed payment. No universal trust threshold or guarantee of future honesty follows.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#252c28" stroke-width="1.4"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#00855b" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400"><text x="24" y="34" fill="#252c28" font-size="21"><tspan x="24" dy="0">Payment comes before a</tspan><tspan x="24" dy="28.35">discretionary response</tspan></text><text x="24" y="96.65" fill="#626962" font-size="16"><tspan x="24" dy="0">Hypothetical example · qualitative</tspan><tspan x="24" dy="21.6">relationships</tspan></text><text x="24" y="161.05" fill="#252c28" font-size="18"><tspan x="24" dy="0">Full order paid before dispatch</tspan></text><rect x="24" y="190.45000000000002" width="312" height="127.4" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="217.45000000000002" fill="#252c28" font-size="19"><tspan x="40" dy="0">Maya pays; Omar controls</tspan><tspan x="40" dy="25.650000000000002">dispatch</tspan></text><text x="40" y="271.8" fill="#626962" font-size="17"><tspan x="40" dy="0">No effective payment protection in</tspan><tspan x="40" dy="22.950000000000003">this benchmark.</tspan></text><rect x="62" y="393.85" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="78" y="420.85" fill="#252c28" font-size="19"><tspan x="78" dy="0">Send the described goods</tspan></text><text x="78" y="449.55" fill="#626962" font-size="17"><tspan x="78" dy="0">A voluntary response; shipping</tspan><tspan x="78" dy="22.950000000000003">risk can remain.</tspan></text><rect x="62" y="527.6" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="78" y="554.6" fill="#252c28" font-size="19"><tspan x="78" dy="0">Withhold the goods</tspan></text><text x="78" y="583.3000000000001" fill="#626962" font-size="17"><tspan x="78" dy="0">Maya can still lose the</tspan><tspan x="78" dy="22.950000000000003">exposed payment.</tspan></text><path d="M 180.0 317.85 V 349.85 H 36 V 578.475" fill="none" stroke="#252c28" stroke-width="1.4"/><path d="M 36 444.725 H 62" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 36 578.475 H 62" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><text x="24" y="671.35" fill="#252c28" font-size="18"><tspan x="24" dy="0">Separable small order</tspan></text><rect x="24" y="700.75" width="312" height="127.39999999999998" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="727.75" fill="#252c28" font-size="19"><tspan x="40" dy="0">Maya pays; Omar controls</tspan><tspan x="40" dy="25.650000000000002">dispatch</tspan></text><text x="40" y="782.1" fill="#626962" font-size="17"><tspan x="40" dy="0">Smaller affordable exposure;</tspan><tspan x="40" dy="22.950000000000003">preferences uncertain.</tspan></text><rect x="62" y="904.15" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="78" y="931.15" fill="#252c28" font-size="19"><tspan x="78" dy="0">Send the described goods</tspan></text><text x="78" y="959.85" fill="#626962" font-size="17"><tspan x="78" dy="0">A voluntary response; shipping</tspan><tspan x="78" dy="22.950000000000003">risk can remain.</tspan></text><rect x="62" y="1037.9" width="274" height="101.75" rx="2" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="78" y="1064.9" fill="#252c28" font-size="19"><tspan x="78" dy="0">Withhold the goods</tspan></text><text x="78" y="1093.6000000000001" fill="#626962" font-size="17"><tspan x="78" dy="0">Maya can still lose the</tspan><tspan x="78" dy="22.950000000000003">exposed payment.</tspan></text><path d="M 180.0 828.15 V 860.15 H 36 V 1088.775" fill="none" stroke="#252c28" stroke-width="1.4"/><path d="M 36 955.025 H 62" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 36 1088.775 H 62" fill="none" stroke="#252c28" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="24" y="1181.65" width="312" height="163.8499999999999" rx="2" fill="#ffffff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1207.65" fill="#252c28" font-size="17"><tspan x="40" dy="0">A smaller purchase does not</tspan><tspan x="40" dy="22.950000000000003">remove discretion or reverse the</tspan><tspan x="40" dy="22.950000000000003">known-selfish-preferences</tspan><tspan x="40" dy="22.950000000000003">benchmark. A successful trial is</tspan><tspan x="40" dy="22.950000000000003">evidence about that transaction,</tspan><tspan x="40" dy="22.950000000000003">not enforced future honesty.</tspan></text><text x="24" y="1371.5" fill="#626962" font-size="16"><tspan x="24" dy="0">Each fork is a sequence: payment first,</tspan><tspan x="24" dy="21.6">then the seller’s choice. The two panels</tspan><tspan x="24" dy="21.6">are alternative order sizes, not</tspan><tspan x="24" dy="21.6">automatically promised repeat business.</tspan></text><rect x="24" y="1475.1" width="312" height="117.94999999999982" rx="2" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1501.1" fill="#252c28" font-size="17"><tspan x="40" dy="0">Change: Use relevant evidence and</tspan><tspan x="40" dy="22.950000000000003">an affordable separable trial where</tspan><tspan x="40" dy="22.950000000000003">appropriate, or change control</tspan><tspan x="40" dy="22.950000000000003">through protection.</tspan></text><text x="24" y="1619.0499999999997" fill="#626962" font-size="17"><tspan x="24" dy="0">Limit: Maya can still lose the exposed</tspan><tspan x="24" dy="22.950000000000003">payment. No universal trust threshold or</tspan><tspan x="24" dy="22.950000000000003">guarantee of future honesty follows.</tspan></text></g></svg>
