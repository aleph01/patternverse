<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc" data-systemic-style="light-editorial">
<title id="title">Conditions surrounding a helpful exception</title>
<desc id="desc">In Nora and Ian's fictional household-planning example, the responsibilities and work schedules remain the same. Difficult discussions happen late, with requests raised in passing and shifts unchecked. One manageable Sunday discussion followed lunch, used three written decisions, and included checking shifts. Several conditions differed together; no cause is established. Green labels candidate helpful conditions, not measured improvement.</desc>
<style>
:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#ffffff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect{vector-effect:non-scaling-stroke;stroke-linecap:butt;stroke-linejoin:round}
.paper{fill:var(--paper)}.context{fill:var(--neutral)}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}
.accent{fill:var(--accent)}
</style>
<rect width="1120" height="780" class="paper"/>
<text x="50" y="46" font-size="30">What surrounded the exception?</text><rect x="32" y="76" width="1056" height="78" class="context"/><text x="50" y="126" font-size="30">Same household responsibilities and work schedules</text><text x="50" y="212" font-size="28">Difficult conversations</text><text x="594" y="212" font-size="28" class="accent">One manageable Sunday</text><path d="M565 184V648" class="fine"/><g data-condition="0"><text x="50" y="268" font-size="24">Timing</text><text x="50" y="314" font-size="29">Late; both tired</text><text x="594" y="314" font-size="28" class="accent">After lunch; time available</text><path d="M32 344H1088" class="fine"/></g><g data-condition="1"><text x="50" y="400" font-size="24">Preparation</text><text x="50" y="446" font-size="29">Requests raised in passing</text><text x="594" y="446" font-size="28" class="accent">Three written decisions</text><path d="M32 476H1088" class="fine"/></g><g data-condition="2"><text x="50" y="532" font-size="24">Availability</text><text x="50" y="578" font-size="29">Work shifts unchecked</text><text x="594" y="578" font-size="28" class="accent">Shifts checked before agreeing</text><path d="M32 608H1088" class="fine"/></g><text x="50" y="700" font-size="27">Several conditions differed together; no cause is established.</text><text x="50" y="744" font-size="27">Fictional comparison. Green marks candidate helpful conditions.</text>
</svg>
