<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1170" viewBox="0 0 660 1170" role="img" aria-labelledby="title desc" data-systemic-style="light-editorial">
<title id="title">A shared hope and two accounts of its meaning</title>
<desc id="desc">In the fictional case, Ellie and Paul both want more trust. Ellie would notice time with friends without repeated checking, and acknowledgment of updates without further questions. Paul would notice a clear return arrangement, updates when plans change, and room to ask about delays without accusations. Some overlap is identified: clear plans and delays discussed without accusations. Contact frequency and return time remain disputed. These are desired differences, not observed improvements.</desc>
<style>
:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#ffffff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect{vector-effect:non-scaling-stroke;stroke-linecap:butt;stroke-linejoin:round}
.paper{fill:var(--paper)}.context{fill:var(--neutral)}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}
.accent{fill:var(--accent)}
</style>
<rect width="660" height="1170" class="paper"/>
<text x="40" y="46" font-size="29">From a shared word to different signs</text><rect x="32" y="76" width="596" height="80" class="context"/><text x="50" y="126" font-size="31">Shared hope: more trust</text><text x="40" y="220" font-size="28">Ellie would notice</text><text x="40" y="270" font-size="31">Time with friends</text><text x="40" y="312" font-size="31">without repeated checking</text><text x="40" y="370" font-size="31">An update is acknowledged</text><text x="40" y="412" font-size="31">without more questions</text><path d="M32 450H628" class="fine"/><text x="40" y="510" font-size="28">Paul would notice</text><text x="40" y="560" font-size="31">A clear return arrangement</text><text x="40" y="602" font-size="31">An update if plans change</text><text x="40" y="660" font-size="31">Room to ask what happened</text><text x="40" y="702" font-size="31">without an accusation</text><path d="M32 740H628" class="fine"/><text x="40" y="800" font-size="28" class="accent">Some overlap</text><text x="40" y="850" font-size="31" class="accent">Clear plans; delays discussed</text><text x="40" y="892" font-size="31" class="accent">without accusations</text><path d="M32 930H628" class="fine"/><text x="40" y="985" font-size="28">Still to agree:</text><text x="40" y="1027" font-size="29">contact frequency and return time</text><text x="40" y="1090" font-size="27">Fictional desired differences,</text><text x="40" y="1132" font-size="27">not observed results.</text>
</svg>
