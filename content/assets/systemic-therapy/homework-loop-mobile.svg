<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1410" viewBox="0 0 660 1410" role="img" aria-labelledby="title desc" data-systemic-style="light-editorial">
<title id="title">Checking that produces less information</title>
<desc id="desc">A fictional homework exchange: Asha asks about progress; Leo answers briefly and turns away; Asha asks again and moves closer; Leo stops answering. Each event includes an invented first-person account. The green return arrow highlights Asha's account that less information prompts renewed checking. Arrows represent the reconstructed sequence, not proven causes or equal responsibility.</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a6aca3" stroke-width="1.25"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#00855b" stroke-width="1.5"/></marker>
</defs>
<style>
:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#ffffff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect{vector-effect:non-scaling-stroke;stroke-linecap:butt;stroke-linejoin:round}
.paper{fill:var(--paper)}.episode{fill:var(--neutral);stroke:var(--secondary);stroke-width:1}
.sequence{fill:none;stroke:var(--secondary);stroke-width:1.25}
.return{fill:none;stroke:var(--accent);stroke-width:1.5}
</style>
<rect width="660" height="1410" class="paper"/>
<text x="330" y="46" font-size="28" text-anchor="middle">Asha and Leo · one episode</text><path d="M330 310V390" class="sequence" marker-end="url(#gray)"/><path d="M330 610V690" class="sequence" marker-end="url(#gray)"/><path d="M330 910V990" class="sequence" marker-end="url(#gray)"/><path d="M90 1100H38V200H90" class="return" marker-end="url(#green)"/><g data-participant="Asha"><rect x="90" y="90" width="480" height="220" class="episode"/><text x="112" y="124" font-size="27" text-anchor="start">Asha</text><text x="112" y="169" font-size="30" text-anchor="start">asks about homework</text><text x="112" y="254" font-size="27" text-anchor="start">“I need to know</text><text x="112" y="287" font-size="27" text-anchor="start">where he is up to.”</text></g><g data-participant="Leo"><rect x="90" y="390" width="480" height="220" class="episode"/><text x="112" y="424" font-size="27" text-anchor="start">Leo</text><text x="112" y="469" font-size="30" text-anchor="start">answers briefly,</text><text x="112" y="511" font-size="30" text-anchor="start">turns away</text><text x="112" y="554" font-size="27" text-anchor="start">“It feels like</text><text x="112" y="587" font-size="27" text-anchor="start">an inspection.”</text></g><g data-participant="Asha"><rect x="90" y="690" width="480" height="220" class="episode"/><text x="112" y="724" font-size="27" text-anchor="start">Asha</text><text x="112" y="769" font-size="30" text-anchor="start">asks again, moves closer</text><text x="112" y="854" font-size="27" text-anchor="start">“He is ignoring it.”</text></g><g data-participant="Leo"><rect x="90" y="990" width="480" height="220" class="episode"/><text x="112" y="1024" font-size="27" text-anchor="start">Leo</text><text x="112" y="1069" font-size="30" text-anchor="start">stops answering</text><text x="112" y="1154" font-size="27" text-anchor="start">“I need space.”</text></g><path d="M46 1278H94" class="return" marker-end="url(#green)"/><text x="112" y="1286" font-size="27" text-anchor="start">Return to checking</text><text x="46" y="1332" font-size="26" text-anchor="start">Arrows follow the described sequence.</text><text x="46" y="1370" font-size="26" text-anchor="start">They do not prove causation.</text>
</svg>
