<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1360" viewBox="0 0 660 1360" role="img" aria-labelledby="title desc" data-systemic-style="light-editorial">
<title id="title">The same morning, a wider map</title>
<desc id="desc">Two views of the same fictional school-attendance situation. Both connect Sam with Jo and school. The wider view also includes Jo's early shift, the bus arriving after the first lesson starts, and pending assessment of Sam's headaches. Green lines identify added connections. Lines are not causal arrows and the figure shows no treatment outcome.</desc>
<style>
:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#ffffff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linecap:butt;stroke-linejoin:round}
.paper{fill:var(--paper)}.person{fill:var(--neutral);stroke:var(--ink);stroke-width:1.15}
.school{fill:var(--paper);stroke:var(--ink);stroke-width:1.15}
.connection{fill:none;stroke:var(--secondary);stroke-width:1.25}
.added{fill:none;stroke:var(--accent);stroke-width:1.5}
.accent{fill:var(--accent)}.fine{fill:none;stroke:var(--secondary);stroke-width:1}
</style><rect width="660" height="1360" class="paper"/>
<text x="330" y="62" font-size="30" text-anchor="middle">Initial frame</text><path d="M300 241L167 350M360 241L493 344" class="connection"/><circle cx="330" cy="210" r="44" class="person"/><text x="330" y="219" font-size="28" text-anchor="middle">Sam</text><circle cx="140" cy="380" r="42" class="person"/><text x="140" y="389" font-size="28" text-anchor="middle">Jo</text><rect x="460" y="344" width="120" height="72" class="school"/><text x="520" y="389" font-size="28" text-anchor="middle">School</text><text x="330" y="455" font-size="26" text-anchor="middle">Sam, Jo, and school</text><path d="M32 490H628" class="fine"/><text x="330" y="548" font-size="30" text-anchor="middle">Relevant context</text><path d="M300 992L167 1119M360 992L493 1114" class="connection"/><path d="M330 703V916" class="added"/><path d="M155 828Q96 971 124 1111" class="added"/><path d="M505 828L371 943" class="added"/><text x="330" y="650" font-size="28" text-anchor="middle" class="accent">Bus timetable</text><text x="330" y="686" font-size="26" text-anchor="middle">arrives after start</text><path d="M282 703H378" class="added"/><text x="155" y="775" font-size="28" text-anchor="middle" class="accent">Jo's work</text><text x="155" y="811" font-size="26" text-anchor="middle">early shift</text><path d="M107 828H203" class="added"/><text x="505" y="775" font-size="28" text-anchor="middle" class="accent">Headaches</text><text x="505" y="811" font-size="26" text-anchor="middle">assessment pending</text><path d="M457 828H553" class="added"/><circle cx="330" cy="960" r="44" class="person"/><text x="330" y="969" font-size="28" text-anchor="middle">Sam</text><circle cx="140" cy="1150" r="42" class="person"/><text x="140" y="1159" font-size="28" text-anchor="middle">Jo</text><rect x="460" y="1114" width="120" height="72" class="school"/><text x="520" y="1159" font-size="28" text-anchor="middle">School</text><text x="330" y="1225" font-size="26" text-anchor="middle">Same situation; more relevant information</text><path d="M42 1274H94" class="added"/><text x="111" y="1282" font-size="26" text-anchor="start">Added in conversation</text><text x="42" y="1326" font-size="26" text-anchor="start">Lines show connections, not causes.</text>
</svg>
