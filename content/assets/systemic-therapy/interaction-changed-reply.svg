<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="0 0 1120 810" role="img" aria-labelledby="title desc" data-systemic-style="light-editorial">
<title id="title">One changed reply, with the next response left open</title>
<desc id="desc">Both fictional sequences begin with Maia describing a difficult shift. In the familiar sequence, Owen offers solutions, followed by Maia explaining why they will not work. In the agreed variation, Owen asks what kind of response she wants. The next response remains open to discover. Green marks the changed reply. Arrows indicate response order, not established causation. No improvement is predicted or measured.</desc>
<defs><marker id="order" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a6aca3" stroke-width="1.25"/></marker></defs>
<style>
:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#ffffff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect{vector-effect:non-scaling-stroke;stroke-linecap:butt;stroke-linejoin:round}
.paper{fill:var(--paper)}.context{fill:var(--neutral)}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}
.sequence{fill:none;stroke:var(--secondary);stroke-width:1.25}
.accent{fill:var(--accent)}
</style>
<rect width="1120" height="810" class="paper"/>
<text x="50" y="46" font-size="30">One changed reply; the response stays open</text><rect x="32" y="78" width="1056" height="112" class="context"/><text x="50" y="118" font-size="24">Same opening</text><text x="50" y="164" font-size="31">Maia describes a difficult shift.</text><text x="50" y="250" font-size="27">Familiar sequence</text><text x="50" y="310" font-size="29">Owen offers solutions.</text><path d="M500 328H600" class="sequence" marker-end="url(#order)"/><text x="650" y="310" font-size="29">Maia explains why</text><text x="650" y="352" font-size="29">they will not work.</text><path d="M32 402H1088" class="fine"/><text x="50" y="468" font-size="27">Agreed variation</text><text x="50" y="526" font-size="29" class="accent">Owen asks what kind</text><text x="50" y="568" font-size="29" class="accent">of response she wants.</text><path d="M500 544H600" class="sequence" marker-end="url(#order)"/><text x="650" y="526" font-size="29">Next response:</text><text x="650" y="568" font-size="29">open to discover.</text><path d="M32 618H1088" class="fine"/><text x="50" y="684" font-size="27">Green marks the changed reply.</text><text x="50" y="726" font-size="27">Arrows show response order, not proven causes.</text><text x="50" y="768" font-size="27">Fictional comparison; no outcome is predicted.</text>
</svg>
