<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc" data-systemic-style="light-editorial">
<title id="title">The same morning, a wider map</title>
<desc id="desc">Two views of the same fictional school-attendance situation. Both connect Sam with Jo and school. The wider view also includes Jo's early shift, the bus arriving after the first lesson starts, and pending assessment of Sam's headaches. Green lines identify added connections. Lines are not causal arrows and the figure shows no treatment outcome.</desc>
<style>
:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#ffffff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect,circle{vector-effect:non-scaling-stroke;stroke-linecap:butt;stroke-linejoin:round}
.paper{fill:var(--paper)}.person{fill:var(--neutral);stroke:var(--ink);stroke-width:1.15}
.school{fill:var(--paper);stroke:var(--ink);stroke-width:1.15}
.connection{fill:none;stroke:var(--secondary);stroke-width:1.25}
.added{fill:none;stroke:var(--accent);stroke-width:1.5}
.accent{fill:var(--accent)}.fine{fill:none;stroke:var(--secondary);stroke-width:1}
</style><rect width="1200" height="730" class="paper"/>
<text x="220" y="58" font-size="28" text-anchor="middle">Initial frame</text><text x="865" y="58" font-size="28" text-anchor="middle">Relevant context</text><path d="M475 28V603" class="fine"/><path d="M193 303L112 439M247 303L325 434" class="connection"/><circle cx="220" cy="270" r="42" class="person"/><text x="220" y="279" font-size="26" text-anchor="middle">Sam</text><circle cx="90" cy="470" r="38" class="person"/><text x="90" y="479" font-size="26" text-anchor="middle">Jo</text><rect x="294" y="434" width="112" height="72" class="school"/><text x="350" y="479" font-size="26" text-anchor="middle">School</text><text x="220" y="568" font-size="24" text-anchor="middle">Sam, Jo, and school</text><path d="M835 342L726 492M895 342L1023 484" class="connection"/><path d="M865 168V268" class="added"/><path d="M635 263Q615 380 680 488" class="added"/><path d="M1085 263L907 296" class="added"/><text x="865" y="120" font-size="26" text-anchor="middle" class="accent">Bus timetable</text><text x="865" y="152" font-size="23" text-anchor="middle">arrives after start</text><path d="M817 168H913" class="added"/><text x="635" y="215" font-size="26" text-anchor="middle" class="accent">Jo's work</text><text x="635" y="247" font-size="23" text-anchor="middle">early shift</text><path d="M587 263H683" class="added"/><text x="1085" y="215" font-size="26" text-anchor="middle" class="accent">Headaches</text><text x="1085" y="247" font-size="23" text-anchor="middle">assessment pending</text><path d="M1037 263H1133" class="added"/><circle cx="865" cy="310" r="42" class="person"/><text x="865" y="319" font-size="26" text-anchor="middle">Sam</text><circle cx="700" cy="520" r="38" class="person"/><text x="700" y="529" font-size="26" text-anchor="middle">Jo</text><rect x="994" y="484" width="112" height="72" class="school"/><text x="1050" y="529" font-size="26" text-anchor="middle">School</text><text x="865" y="598" font-size="24" text-anchor="middle">Same situation; more relevant information</text><path d="M32 651H85" class="added"/><text x="101" y="658" font-size="23" text-anchor="start">Connections added in conversation</text><text x="32" y="696" font-size="23" text-anchor="start">All lines show reported connections, not causes.</text>
</svg>
