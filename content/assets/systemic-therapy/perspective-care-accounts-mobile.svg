<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1340" viewBox="0 0 660 1340" role="img" aria-labelledby="title desc" data-systemic-style="light-editorial">
<title id="title">One event, several possible meanings</title>
<desc id="desc">The fictional event stays the same: Lee declines an extra Sunday visit. Mara's first account is that he does not care. Other possibilities are a practical constraint or disagreement about the care plan. Each account is paired with a question that could clarify it. Green marks inquiry, not a correct or preferred explanation. These are not established motives and the figure shows no clinical outcome.</desc>
<style>
:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#ffffff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect{vector-effect:non-scaling-stroke;stroke-linecap:butt;stroke-linejoin:round}
.paper{fill:var(--paper)}.context{fill:var(--neutral)}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}
.accent{fill:var(--accent)}
</style>
<rect width="660" height="1340" class="paper"/>
<text x="40" y="46" font-size="29">One event, several possible meanings</text><text x="40" y="103" font-size="25">Shared observation</text><rect x="32" y="120" width="596" height="106" class="context"/><text x="50" y="164" font-size="31">Lee declines an extra</text><text x="50" y="206" font-size="31">Sunday visit.</text><g data-account="0"><text x="40" y="280" font-size="26">Mara's first account</text><text x="40" y="328" font-size="31">“He does not care.”</text><text x="40" y="416" font-size="26" class="accent">Question to explore</text><text x="40" y="460" font-size="29" class="accent">What supports or challenges</text><text x="40" y="502" font-size="29" class="accent">that account?</text><path d="M32 540H628" class="fine"/></g><g data-account="1"><text x="40" y="610" font-size="26">A possible constraint</text><text x="40" y="658" font-size="31">“He cannot make Sunday.”</text><text x="40" y="746" font-size="26" class="accent">Question to explore</text><text x="40" y="790" font-size="29" class="accent">What makes Sunday possible</text><text x="40" y="832" font-size="29" class="accent">or difficult?</text><path d="M32 870H628" class="fine"/></g><g data-account="2"><text x="40" y="940" font-size="26">A possible disagreement</text><text x="40" y="988" font-size="31">“He wants a different</text><text x="40" y="1030" font-size="31">care plan.”</text><text x="40" y="1076" font-size="26" class="accent">Question to explore</text><text x="40" y="1120" font-size="29" class="accent">What help does Lee propose?</text><path d="M32 1200H628" class="fine"/></g><text x="40" y="1260" font-size="27">Fictional accounts to check.</text><text x="40" y="1302" font-size="27">No explanation is established here.</text>
</svg>
