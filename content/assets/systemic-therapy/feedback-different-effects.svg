<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750" role="img" aria-labelledby="title desc" data-systemic-style="light-editorial">
<title id="title">One observation and two experiences to retain</title>
<desc id="desc">In the fictional couple example, Tess and Daniel both report fewer arguments. Tess describes relief when evenings do not escalate. Daniel describes concerns that remain unfinished because they are not returned to. The green review question asks whether they can pause and later return to a concern. The same observation remains, but the review includes both relief and an unmet purpose. These are qualitative fictional accounts, not measured improvement or causal evidence.</desc>
<style>
:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#ffffff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect{vector-effect:non-scaling-stroke;stroke-linecap:butt;stroke-linejoin:round}
.paper{fill:var(--paper)}.context{fill:var(--neutral)}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}
.accent{fill:var(--accent)}
</style>
<rect width="1120" height="750" class="paper"/>
<text x="50" y="46" font-size="30">One observation; two experiences</text><rect x="32" y="76" width="1056" height="78" class="context"/><text x="50" y="126" font-size="31">Both report fewer arguments.</text><text x="50" y="216" font-size="28">Tess’s experience</text><text x="594" y="216" font-size="28">Daniel’s experience</text><path d="M565 184V352" class="fine"/><text x="50" y="282" font-size="30">Relief when evenings</text><text x="50" y="324" font-size="30">do not escalate.</text><text x="594" y="282" font-size="29">Concerns stay unfinished.</text><text x="594" y="324" font-size="29">They do not return to them.</text><path d="M32 382H1088" class="fine"/><text x="50" y="448" font-size="27" class="accent">Question that changes the review</text><text x="50" y="502" font-size="31" class="accent">Can they pause and later return</text><text x="50" y="546" font-size="31" class="accent">to a concern?</text><path d="M32 590H1088" class="fine"/><text x="50" y="648" font-size="28">Relief is real; the original purpose is still unmet.</text><text x="50" y="706" font-size="27">Fictional accounts, not measured improvement.</text>
</svg>
