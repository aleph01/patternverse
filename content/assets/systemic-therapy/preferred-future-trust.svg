<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc" data-systemic-style="light-editorial">
<title id="title">A shared hope and two accounts of its meaning</title>
<desc id="desc">In the fictional case, Ellie and Paul both want more trust. Ellie would notice time with friends without repeated checking, and acknowledgment of updates without further questions. Paul would notice a clear return arrangement, updates when plans change, and room to ask about delays without accusations. Some overlap is identified: clear plans and delays discussed without accusations. Contact frequency and return time remain disputed. These are desired differences, not observed improvements.</desc>
<style>
:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#ffffff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect{vector-effect:non-scaling-stroke;stroke-linecap:butt;stroke-linejoin:round}
.paper{fill:var(--paper)}.context{fill:var(--neutral)}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}
.accent{fill:var(--accent)}
</style>
<rect width="1120" height="780" class="paper"/>
<text x="50" y="46" font-size="30">From a shared word to different signs</text><rect x="32" y="76" width="1056" height="78" class="context"/><text x="50" y="126" font-size="31">Shared hope: more trust</text><text x="50" y="216" font-size="28">Ellie would notice</text><text x="594" y="216" font-size="28">Paul would notice</text><path d="M565 184V450" class="fine"/><text x="50" y="282" font-size="31">Time with friends</text><text x="50" y="326" font-size="29">without repeated checking</text><text x="50" y="390" font-size="29">An update is acknowledged</text><text x="50" y="433" font-size="29">without more questions</text><text x="594" y="282" font-size="29">A clear return arrangement</text><text x="594" y="326" font-size="29">An update if plans change</text><text x="594" y="390" font-size="29">Room to ask what happened</text><text x="594" y="433" font-size="29">without an accusation</text><path d="M32 475H1088" class="fine"/><text x="50" y="535" font-size="28" class="accent">Some overlap</text><text x="50" y="584" font-size="29" class="accent">Clear plans; delays discussed without accusations</text><path d="M32 624H1088" class="fine"/><text x="50" y="680" font-size="28">Still to agree: contact frequency and return time.</text><text x="50" y="738" font-size="27">Fictional desired differences, not observed results.</text>
</svg>
