<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc" data-systemic-style="light-editorial">
<title id="title">One event, several possible meanings</title>
<desc id="desc">The fictional event stays the same: Lee declines an extra Sunday visit. Mara's first account is that he does not care. Other possibilities are a practical constraint or disagreement about the care plan. Each account is paired with a question that could clarify it. Green marks inquiry, not a correct or preferred explanation. These are not established motives and the figure shows no clinical outcome.</desc>
<style>
:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#ffffff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect{vector-effect:non-scaling-stroke;stroke-linecap:butt;stroke-linejoin:round}
.paper{fill:var(--paper)}.context{fill:var(--neutral)}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}
.accent{fill:var(--accent)}
</style>
<rect width="1120" height="800" class="paper"/>
<text x="50" y="44" font-size="28">Same observation; accounts to check</text><rect x="32" y="70" width="1056" height="78" class="context"/><text x="50" y="120" font-size="30">Lee declines an extra Sunday visit.</text><text x="50" y="205" font-size="25">Possible account</text><text x="605" y="205" font-size="25" class="accent">Question to explore</text><path d="M570 180V670" class="fine"/><g data-account="0"><text x="50" y="250" font-size="23">Mara's first account</text><text x="50" y="293" font-size="29">“He does not care.”</text><text x="605" y="293" font-size="27" class="accent">What supports or challenges</text><text x="605" y="333" font-size="27" class="accent">that account?</text><path d="M32 365H1088" class="fine"/></g><g data-account="1"><text x="50" y="400" font-size="23">A possible constraint</text><text x="50" y="443" font-size="29">“He cannot make Sunday.”</text><text x="605" y="443" font-size="27" class="accent">What makes Sunday possible</text><text x="605" y="483" font-size="27" class="accent">or difficult?</text><path d="M32 515H1088" class="fine"/></g><g data-account="2"><text x="50" y="550" font-size="23">A possible disagreement</text><text x="50" y="593" font-size="29">“He wants a different</text><text x="50" y="633" font-size="29">care plan.”</text><text x="605" y="593" font-size="27" class="accent">What help does Lee propose?</text><path d="M32 665H1088" class="fine"/></g><text x="50" y="728" font-size="25">Fictional scenario. Accounts remain provisional.</text><text x="50" y="766" font-size="25">Green marks inquiry, not an established explanation.</text>
</svg>
