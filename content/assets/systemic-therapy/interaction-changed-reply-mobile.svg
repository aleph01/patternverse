<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1335" viewBox="0 0 660 1335" role="img" aria-labelledby="title desc" data-systemic-style="light-editorial">
<title id="title">One changed reply, with the next response left open</title>
<desc id="desc">Both fictional sequences begin with Maia describing a difficult shift. In the familiar sequence, Owen offers solutions, followed by Maia explaining why they will not work. In the agreed variation, Owen asks what kind of response she wants. The next response remains open to discover. Green marks the changed reply. Arrows indicate response order, not established causation. No improvement is predicted or measured.</desc>
<defs><marker id="order" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a6aca3" stroke-width="1.25"/></marker></defs>
<style>
:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#ffffff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect{vector-effect:non-scaling-stroke;stroke-linecap:butt;stroke-linejoin:round}
.paper{fill:var(--paper)}.context{fill:var(--neutral)}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}
.sequence{fill:none;stroke:var(--secondary);stroke-width:1.25}
.accent{fill:var(--accent)}
</style>
<rect width="660" height="1335" class="paper"/>
<text x="40" y="46" font-size="30">One changed reply</text><text x="40" y="90" font-size="28">The next response stays open</text><rect x="32" y="120" width="596" height="150" class="context"/><text x="50" y="164" font-size="26">Same opening</text><text x="50" y="208" font-size="31">Maia describes</text><text x="50" y="250" font-size="31">a difficult shift.</text><text x="40" y="330" font-size="28">Familiar sequence</text><text x="40" y="390" font-size="31">Owen offers solutions.</text><path d="M40 425V475" class="sequence" marker-end="url(#order)"/><text x="40" y="535" font-size="31">Maia explains why</text><text x="40" y="579" font-size="31">they will not work.</text><path d="M32 625H628" class="fine"/><text x="40" y="690" font-size="28">Agreed variation</text><text x="40" y="750" font-size="31" class="accent">Owen asks what kind</text><text x="40" y="794" font-size="31" class="accent">of response she wants.</text><path d="M40 830V880" class="sequence" marker-end="url(#order)"/><text x="40" y="940" font-size="31">Next response:</text><text x="40" y="984" font-size="31">open to discover.</text><path d="M32 1030H628" class="fine"/><text x="40" y="1090" font-size="28">Green marks the changed reply.</text><text x="40" y="1140" font-size="27">Arrows show response order,</text><text x="40" y="1182" font-size="27">not proven causes.</text><text x="40" y="1250" font-size="27">Fictional comparison;</text><text x="40" y="1292" font-size="27">no outcome is predicted.</text>
</svg>
