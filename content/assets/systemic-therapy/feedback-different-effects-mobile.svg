<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1105" viewBox="0 0 660 1105" role="img" aria-labelledby="title desc" data-systemic-style="light-editorial">
<title id="title">One observation and two experiences to retain</title>
<desc id="desc">In the fictional couple example, Tess and Daniel both report fewer arguments. Tess describes relief when evenings do not escalate. Daniel describes concerns that remain unfinished because they are not returned to. The green review question asks whether they can pause and later return to a concern. The same observation remains, but the review includes both relief and an unmet purpose. These are qualitative fictional accounts, not measured improvement or causal evidence.</desc>
<style>
:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#ffffff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect{vector-effect:non-scaling-stroke;stroke-linecap:butt;stroke-linejoin:round}
.paper{fill:var(--paper)}.context{fill:var(--neutral)}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}
.accent{fill:var(--accent)}
</style>
<rect width="660" height="1105" class="paper"/>
<text x="40" y="46" font-size="30">One observation;</text><text x="40" y="88" font-size="30">two experiences</text><rect x="32" y="120" width="596" height="106" class="context"/><text x="50" y="162" font-size="31">Both report</text><text x="50" y="204" font-size="31">fewer arguments.</text><text x="40" y="284" font-size="28">Tess’s experience</text><text x="40" y="336" font-size="31">Relief when evenings</text><text x="40" y="378" font-size="31">do not escalate.</text><path d="M32 420H628" class="fine"/><text x="40" y="480" font-size="28">Daniel’s experience</text><text x="40" y="532" font-size="31">Concerns stay unfinished.</text><text x="40" y="574" font-size="31">They do not return to them.</text><path d="M32 616H628" class="fine"/><text x="40" y="676" font-size="28" class="accent">Question for review</text><text x="40" y="728" font-size="31" class="accent">Can they pause</text><text x="40" y="770" font-size="31" class="accent">and later return</text><text x="40" y="812" font-size="31" class="accent">to a concern?</text><path d="M32 854H628" class="fine"/><text x="40" y="914" font-size="29">Relief is real; the original</text><text x="40" y="956" font-size="29">purpose is still unmet.</text><text x="40" y="1022" font-size="27">Fictional accounts,</text><text x="40" y="1064" font-size="27">not measured improvement.</text>
</svg>
