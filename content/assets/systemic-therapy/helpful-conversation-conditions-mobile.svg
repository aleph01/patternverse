<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1290" viewBox="0 0 660 1290" role="img" aria-labelledby="title desc" data-systemic-style="light-editorial">
<title id="title">Conditions surrounding a helpful exception</title>
<desc id="desc">In Nora and Ian's fictional household-planning example, the responsibilities and work schedules remain the same. Difficult discussions happen late, with requests raised in passing and shifts unchecked. One manageable Sunday discussion followed lunch, used three written decisions, and included checking shifts. Several conditions differed together; no cause is established. Green labels candidate helpful conditions, not measured improvement.</desc>
<style>
:root{color-scheme:only light;--paper:#ffffff;--ink:#252c28;--secondary:#a6aca3;--neutral:#f1f2ef;--mint:#edf5f0;--accent:#00855b}
svg{background:#ffffff;color:var(--ink)}
text{fill:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}
path,rect{vector-effect:non-scaling-stroke;stroke-linecap:butt;stroke-linejoin:round}
.paper{fill:var(--paper)}.context{fill:var(--neutral)}
.fine{fill:none;stroke:var(--secondary);stroke-width:1}
.accent{fill:var(--accent)}
</style>
<rect width="660" height="1290" class="paper"/>
<text x="40" y="46" font-size="29">What surrounded the exception?</text><rect x="32" y="78" width="596" height="110" class="context"/><text x="50" y="123" font-size="30">Same household responsibilities</text><text x="50" y="166" font-size="30">and work schedules</text><g data-condition="0"><text x="40" y="250" font-size="28">Timing</text><text x="40" y="298" font-size="26">Difficult conversations</text><text x="40" y="344" font-size="31">Late; both tired</text><text x="40" y="400" font-size="26" class="accent">One manageable Sunday</text><text x="40" y="446" font-size="30" class="accent">After lunch; time available</text><path d="M32 478H628" class="fine"/></g><g data-condition="1"><text x="40" y="530" font-size="28">Preparation</text><text x="40" y="578" font-size="26">Difficult conversations</text><text x="40" y="624" font-size="31">Requests raised in passing</text><text x="40" y="680" font-size="26" class="accent">One manageable Sunday</text><text x="40" y="726" font-size="30" class="accent">Three written decisions</text><path d="M32 758H628" class="fine"/></g><g data-condition="2"><text x="40" y="810" font-size="28">Availability</text><text x="40" y="858" font-size="26">Difficult conversations</text><text x="40" y="904" font-size="31">Work shifts unchecked</text><text x="40" y="960" font-size="26" class="accent">One manageable Sunday</text><text x="40" y="1006" font-size="30" class="accent">Shifts checked before agreeing</text><path d="M32 1038H628" class="fine"/></g><text x="40" y="1110" font-size="28">Several conditions differed together.</text><text x="40" y="1152" font-size="28">No cause is established.</text><text x="40" y="1210" font-size="27">Fictional comparison. Green marks</text><text x="40" y="1252" font-size="27">candidate helpful conditions.</text>
</svg>
