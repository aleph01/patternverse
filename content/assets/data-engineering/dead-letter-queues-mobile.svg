<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1352" viewBox="0 0 360 1352" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Dead Letter Channel: owned recovery path</title><desc id="desc">Instruction E901 remains on the normal orders path while classified dependency failures are within a three-failure budget. At the third failure, a safe handoff preserves the original instruction and failure context in the dead letter channel. Diagnosis and repair precede controlled redrive through the normal idempotent receiver.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1352" fill="#fff"/><text x="24" y="34" font-size="23" fill="#252c28">Retain the unresolved work</text><text x="24" y="86" font-size="17" fill="#626962">Policy: three classified failures.</text><rect x="24" y="112" width="312" height="100" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Normal orders path</text><text x="40" y="167" font-size="17" fill="#626962">Instruction: E901</text><path d="M180 212V252H12V368H46" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M12 368V616H46" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="48" y="288" width="288" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="317" font-size="20" fill="#252c28">Fewer than 3 failures</text><text x="64" y="343" font-size="17" fill="#626962">Stay on the normal retry path.</text><text x="64" y="404" font-size="16" fill="#626962">Use the existing delay policy.</text><rect x="48" y="536" width="288" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="64" y="565" font-size="20" fill="#252c28">3 failures reached</text><text x="64" y="591" font-size="17" fill="#626962">Safe handoff to failure channel</text><text x="64" y="652" font-size="16" fill="#626962">Do not release the only copy.</text><path d="M192 696V774" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="776" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="805" font-size="20" fill="#252c28">Dead letter channel</text><text x="40" y="831" font-size="17" fill="#626962">Identity + original bytes</text><text x="40" y="886" font-size="17" fill="#626962">Reason / attempts / timestamps</text><text x="40" y="926" font-size="17" fill="#626962">Source / consumer version</text><path d="M180 952V1038" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="1004" font-size="16" fill="#626962">investigate</text><rect x="24" y="1040" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1069" font-size="18" fill="#252c28">Repair, then controlled redrive</text><text x="40" y="1095" font-size="16" fill="#626962">Revalidate; preserve logical identity.</text><text x="40" y="1150" font-size="16" fill="#626962">Use the normal idempotent receiver.</text><text x="40" y="1190" font-size="17" fill="#626962">Verify the business outcome.</text><text x="24" y="1296" font-size="17" fill="#626962">Redrive is an explicit decision.</text></svg>
