<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="event-grain-table"><title id="title">Transaction fact tables</title><desc id="desc">Order O17 line 1 ships in S41 line 1 for four units and S42 line 1 for six units. The shipment identity, not the order line, defines the fact grain. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Two shipment events remain two fact rows.</text><rect x="44" y="110" width="632" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="360.0" y="145.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Order O17 / line 1</text><text x="54" y="230" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Shipment line</text><text x="264.66666666666663" y="230" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Date</text><text x="475.3333333333333" y="230" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Units</text><path d="M44 246L676 246" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="44" y="254" width="210.66666666666666" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="149.33333333333331" y="286.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">S41 / 1</text><text x="360.0" y="286.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">01 Oct</text><text x="570.6666666666666" y="286.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">4</text><path d="M44 305L676 305" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="306" width="210.66666666666666" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="149.33333333333331" y="338.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">S42 / 1</text><text x="360.0" y="338.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">02 Oct</text><text x="570.6666666666666" y="338.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">6</text><path d="M44 357L676 357" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Two observations. Total shipped quantity: 10.</text></svg>