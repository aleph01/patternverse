<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="state-machine"><title id="title">Model lifecycle states explicitly</title><desc id="desc">Draft moves to review, then approved and published. Requested changes or edits withdraw approval and return the item to draft. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Approval belongs to a particular revision.</text><path d="M255 160L430 160" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M530 195L530 312" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M432 350L250 350" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="67.5" y="130.0" width="185" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="160.0" y="168.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Draft</text><rect x="437.5" y="130.0" width="185" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="530.0" y="168.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">In review</text><rect x="437.5" y="320.0" width="185" height="60" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="530.0" y="358.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Approved</text><rect x="57.5" y="320.0" width="185" height="60" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="150.0" y="358.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Published</text><path d="M440 180H360V265H160V199" fill="none" stroke="#00855b" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M440 350H360V265" fill="none" stroke="#00855b" stroke-width="1.2"/><text x="225" y="245" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Revise</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Editing approved content returns it to Draft.</text></svg>