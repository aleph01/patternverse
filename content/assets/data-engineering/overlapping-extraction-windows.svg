<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="overlapping-time-ranges"><title id="title">Overlapping extraction windows</title><desc id="desc">The first extraction covers 09:45–10:00. The next covers 09:50–10:05. Event E201 has timestamp 09:58 but appears at 10:02, so the overlap recovers it. Merging by event identity prevents duplicates. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Reread a margin to catch delayed visibility.</text><path d="M430 130L430 400" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="90" y="160" width="430" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="305.0" y="195.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Run 1: 09:45–10:00</text><rect x="235" y="280" width="430" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="450.0" y="315.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Run 2: 09:50–10:05</text><circle cx="430" cy="390" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><text x="430" y="446" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">E201 · time 09:58 · visible 10:02</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Overlap + idempotent merge; older arrivals need another</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">route.</text></svg>