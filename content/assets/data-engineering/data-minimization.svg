<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="purpose-limited-summary"><title id="title">Data minimization</title><desc id="desc">For twenty deliveries,19 have known outcomes,including3 late,and1 is unknown. The reported late rate is3/19. Names,email,and precise GPS are unnecessary for this metric; any operational detail has its own bounded retention. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Keep what serves the purpose and discard excess</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">detail.</text><text x="54" y="135" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Purpose</text><text x="344.72" y="135" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Required data</text><path d="M44 151L676 151" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="189.36" y="204.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Late delivery rate</text><text x="505.36" y="204.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">19 known; 3 late</text><path d="M44 235L676 235" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="189.36" y="281.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Unknown outcome</text><text x="505.36" y="281.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">1, reported separately</text><path d="M44 312L676 312" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="189.36" y="358.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Names / email / GPS</text><text x="505.36" y="358.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Excluded from metric</text><path d="M44 389L676 389" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Rate 3 / 19; define a separate need and lifetime for raw</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">detail.</text></svg>