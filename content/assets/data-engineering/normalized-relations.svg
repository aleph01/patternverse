<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="relation-decomposition"><title id="title">Normalized relations separate dependent facts</title><desc id="desc">Employees E17 and E28 both reference department D4. The name Operations is maintained in Department rather than repeated in each employee row. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">A department name has one maintained location.</text><text x="54" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Employee</text><text x="262.0" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Dept</text><path d="M44 156L364 156" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="148.0" y="196.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E17 · Maya</text><text x="308.0" y="196.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">D4</text><path d="M44 215L364 215" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="148.0" y="248.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E28 · Leon</text><text x="308.0" y="248.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">D4</text><path d="M44 267L364 267" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="148.0" y="300.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E31 · Ira</text><text x="308.0" y="300.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">D8</text><path d="M44 319L364 319" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="440" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Dept</text><text x="501.5" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Name</text><path d="M430 156L676 156" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="460.75" y="196.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">D4</text><rect x="491.5" y="164" width="184.5" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="583.75" y="196.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Operations</text><path d="M430 215L676 215" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="460.75" y="248.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">D8</text><text x="583.75" y="248.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Sales</text><path d="M430 267L676 267" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><path d="M353 258L424 195" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Employee references Department; names stay consistent.</text></svg>