<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="field-provenance"><title id="title">Golden records select trusted values with provenance</title><desc id="desc">The linked organization ORG731 takes its legal name and invoice address from Finance, its trading name from CRM and its delivery address from the portal, preserving provenance. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Select fields from their appropriate authorities.</text><text x="54" y="132" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Selected field</text><text x="401.6" y="132" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Authority</text><path d="M44 148L676 148" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="217.8" y="188.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Legal name</text><rect x="391.6" y="156" width="284.4" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="533.8" y="188.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Finance</text><path d="M44 207L676 207" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="217.8" y="240.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Invoice address</text><rect x="391.6" y="208" width="284.4" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="533.8" y="240.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Finance</text><path d="M44 259L676 259" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="217.8" y="292.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Trading name</text><rect x="391.6" y="260" width="284.4" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="533.8" y="292.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">CRM</text><path d="M44 311L676 311" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="217.8" y="344.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Delivery address</text><rect x="391.6" y="312" width="284.4" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="533.8" y="344.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Portal</text><path d="M44 363L676 363" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">One organization profile; field-level provenance.</text></svg>