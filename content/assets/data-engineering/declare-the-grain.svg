<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="grain-and-allocation"><title id="title">Declare the grain: receipt and receipt line</title><desc id="desc">Receipt R104 has EUR 8 and EUR 4 merchandise lines and one EUR 3 delivery fee. Repeating the fee gives EUR 6. Allocation in proportion to merchandise value assigns EUR 2 and EUR 1, preserving EUR 3; retaining the fee once at receipt grain is another option. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">One receipt fee cannot become two fees.</text><rect x="44" y="110" width="632" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="145.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">R104 · one delivery fee: EUR 3</text><text x="44" y="193" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Allocated in proportion to merchandise value</text><text x="54" y="233" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Receipt line</text><text x="264.66666666666663" y="233" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Repeated fee</text><text x="475.3333333333333" y="233" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Allocated fee</text><path d="M44 249L676 249" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="149.33333333333331" y="289.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">L1 · EUR 8</text><text x="360.0" y="289.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">EUR 3</text><rect x="465.3333333333333" y="257" width="210.66666666666669" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="570.6666666666666" y="289.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">EUR 2</text><path d="M44 308L676 308" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="149.33333333333331" y="341.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">L2 · EUR 4</text><text x="360.0" y="341.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">EUR 3</text><rect x="465.3333333333333" y="309" width="210.66666666666669" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="570.6666666666666" y="341.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">EUR 1</text><path d="M44 360L676 360" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="149.33333333333331" y="393.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Total</text><text x="360.0" y="393.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">EUR 6</text><rect x="465.3333333333333" y="361" width="210.66666666666669" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="570.6666666666666" y="393.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">EUR 3</text><path d="M44 412L676 412" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Retain once at receipt grain, or allocate explicitly.</text></svg>