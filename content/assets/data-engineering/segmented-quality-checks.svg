<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="segment-masking"><title id="title">Segmented quality checks reveal a hidden source failure</title><desc id="desc">One million orders have 2990 missing values, yielding 99.701% completeness and passing a 99.5% threshold. Web is 99.9% complete, while a 10000-order partner segment is only 80% complete. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Expose failures hidden inside an overall pass.</text><text x="54" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Segment</text><text x="205.68" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Rows</text><text x="388.96000000000004" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Missing</text><text x="528.0" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Complete</text><path d="M44 155L676 155" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="119.84" y="205.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Web</text><text x="287.32000000000005" y="205.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">990,000</text><text x="448.48" y="205.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">990</text><text x="597.0" y="205.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">99.9%</text><path d="M44 234L676 234" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="119.84" y="277.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Partner</text><text x="287.32000000000005" y="277.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">10,000</text><text x="448.48" y="277.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">2000</text><text x="597.0" y="277.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">80%</text><path d="M44 306L676 306" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="119.84" y="349.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Overall</text><text x="287.32000000000005" y="349.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">1,000,000</text><text x="448.48" y="349.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">2990</text><text x="597.0" y="349.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">99.701%</text><path d="M44 378L676 378" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Check the partner separately; the overall pass hides its</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">failure.</text></svg>