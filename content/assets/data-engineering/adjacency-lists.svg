<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="parent-pointer-tree"><title id="title">Adjacency lists</title><desc id="desc">The hierarchy labels Workspace 1, Finance 2, Projects 3, Forecast 4 and Apollo 5. Two selected stored rows show Finance.parent_id=1 and Forecast.parent_id=2. Moving Finance changes its parent pointer, not Forecast’s pointer. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Store only the immediate parent.</text><path d="M360 157L175 190" fill="none" stroke="#00855b" stroke-width="1.2"/><path d="M360 157L545 190" fill="none" stroke="#00855b" stroke-width="1.2"/><path d="M175 240L175 260" fill="none" stroke="#00855b" stroke-width="1.2"/><path d="M545 240L545 260" fill="none" stroke="#00855b" stroke-width="1.2"/><rect x="250.0" y="107.0" width="220" height="50" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="360.0" y="140.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Workspace · 1</text><rect x="77.5" y="190.0" width="195" height="50" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="175.0" y="223.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Finance · 2</text><rect x="447.5" y="190.0" width="195" height="50" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="545.0" y="223.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Projects · 3</text><rect x="77.5" y="260.0" width="195" height="50" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="175.0" y="293.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Forecast · 4</text><rect x="447.5" y="260.0" width="195" height="50" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="545.0" y="293.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Apollo · 5</text><text x="44" y="341" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Selected stored rows</text><text x="54" y="378" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Folder / id</text><text x="370.0" y="378" font-size="24" fill="#252c28" text-anchor="start" data-label="1">parent_id</text><path d="M44 394L676 394" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="202.0" y="433.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Finance / 2</text><text x="518.0" y="433.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">1 (Workspace)</text><path d="M44 450L676 450" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="202.0" y="482.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Forecast / 4</text><text x="518.0" y="482.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">2 (Finance)</text><path d="M44 499L676 499" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="538" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Moving Finance leaves Forecast.parent_id = 2.</text></svg>