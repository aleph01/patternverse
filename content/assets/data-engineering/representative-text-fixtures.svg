<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="syntax-fixtures"><title id="title">Representative text fixtures</title><desc id="desc">A CSV field contains a comma or newline inside quotes; Unicode strings can look equal while having distinct original code points; a Markdown heading marker within a fenced block is code. Fixtures preserve both source bytes and expected interpretation. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Keep small examples of real parsing edge cases.</text><text x="54" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Fixture</text><text x="382.64" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Expected interpretation</text><path d="M44 153L676 153" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="208.32" y="193.66" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">CSV: &quot;red, blue</text><text x="208.32" y="220.66" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">green&quot;</text><text x="524.3199999999999" y="207.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">One field</text><path d="M44 240L676 240" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="208.32" y="287.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Unicode: é / e + ◌́</text><text x="524.3199999999999" y="287.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">NFC matching key</text><path d="M44 320L676 320" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="208.32" y="367.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Fenced Markdown: # title</text><text x="524.3199999999999" y="367.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Code, not a heading</text><path d="M44 400L676 400" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Retain original bytes; compare normalized NFC keys.</text></svg>