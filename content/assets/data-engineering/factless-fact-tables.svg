<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="coverage-difference"><title id="title">Factless fact tables</title><desc id="desc">Five expected student-session pairs and three attendance records leave Cora S1 and Ben S2 unrecorded, assuming closed sessions and complete capture. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Expected participation minus recorded</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">attendance.</text><text x="54" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Student</text><text x="264.66666666666663" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Session S1</text><text x="475.3333333333333" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Session S2</text><path d="M44 146L676 146" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="149.33333333333331" y="186.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Maya</text><text x="360.0" y="186.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Present</text><text x="570.6666666666666" y="186.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Present</text><path d="M44 205L676 205" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="149.33333333333331" y="238.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Ben</text><text x="360.0" y="238.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Present</text><rect x="465.3333333333333" y="206" width="210.66666666666669" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="570.6666666666666" y="238.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Absent</text><path d="M44 257L676 257" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="149.33333333333331" y="290.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Cora</text><rect x="254.66666666666666" y="258" width="210.66666666666666" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="290.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Absent</text><text x="570.6666666666666" y="290.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Not expected</text><path d="M44 309L676 309" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Sessions closed; attendance capture complete.</text></svg>