<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="semantic-thread"><title id="title">Shared business vocabulary connects meaning to implementation</title><desc id="desc">Monthly purchasing accounts means distinct non-test accounts with a positive capture during a UTC calendar month. The same meaning guides implementation, reports and tests. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">One business meaning travels across the model.</text><text x="44" y="128" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Monthly purchasing accounts</text><rect x="44" y="152" width="632" height="136" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="66" y="187" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Distinct accounts · positive payment</text><text x="66" y="222" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Completed payment (capture)</text><text x="66" y="263" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Exclude tests · calendar month in UTC</text><path d="M360 288L141 356" fill="none" stroke="#00855b" stroke-width="1.2"/><text x="141" y="398" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Model</text><path d="M360 288L360 356" fill="none" stroke="#00855b" stroke-width="1.2"/><text x="360" y="398" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Report</text><path d="M360 288L579 356" fill="none" stroke="#00855b" stroke-width="1.2"/><text x="579" y="398" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Tests</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">The definition travels with its implementation.</text></svg>