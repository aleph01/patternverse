<svg xmlns="http://www.w3.org/2000/svg" width="720" height="864" viewBox="0 0 720 864" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Expansion, migration and evidence-gated contraction</title><desc id="desc">Expand supports both old and new interfaces. Migrate moves consumers while both remain available. A readiness gate checks data, consumers, and recovery obligations before Contract removes the old interface. Removing it is not an automatic consequence of adding the new one.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="864" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Support the middle state, then retire the old name</text><text x="24" y="84" font-size="19" fill="#626962">Parallel Change / Expand-Contract · three deliberate phases</text><rect x="24" y="112" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="150" font-size="22" fill="#252c28">1 Expand</text><text x="40" y="192" font-size="19" fill="#252c28">Support old + new interfaces; maintain one authoritative meaning.</text><path d="M72 224V280" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="260" font-size="18" fill="#626962">Compatible release</text><rect x="24" y="284" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="322" font-size="22" fill="#252c28">2 Migrate</text><text x="40" y="360" font-size="19" fill="#252c28">Move usages, backfill historical data, reconcile current changes.</text><text x="40" y="396" font-size="18" fill="#626962">Both forms remain supported during the transition.</text><path d="M72 412V468" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="448" font-size="18" fill="#626962">Collect readiness evidence</text><rect x="24" y="472" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="510" font-size="22" fill="#252c28">Retirement gate</text><text x="40" y="548" font-size="19" fill="#252c28">Data current · required readers and writers moved</text><text x="40" y="584" font-size="18" fill="#626962">Recovery window and migration obligations closed</text><path d="M72 600V656" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="636" font-size="18" fill="#626962">Only after readiness</text><rect x="24" y="660" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="698" font-size="22" fill="#252c28">3 Contract</text><text x="40" y="740" font-size="19" fill="#252c28">Remove the old interface and obsolete compatibility machinery.</text><text x="24" y="824" font-size="19" fill="#252c28">A working new interface does not establish that the old one is unused.</text></svg>
