<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Deterministic backoff versus independently jittered retries</title><desc id="desc">Four clients without jitter retry at elapsed times one, three, and seven seconds. Independent full-jitter draws spread their retry times within the same successive one, two, and four second waiting bounds. Request durations are omitted and the times are illustrative.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1120" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Backoff slows retries; jitter spreads their timing</text><rect x="24" y="104" width="672" height="104" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Same retry windows: 1, 2, then 4 seconds</text><text x="40" y="159" font-size="17" fill="#626962">All initial failures are at time zero; request durations are omitted.</text><text x="24" y="264" font-size="22" fill="#252c28">Without jitter / same delays</text><text x="40" y="310" font-size="18" fill="#252c28">A</text><path d="M100 304H660" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="177" y="301" width="6" height="6" fill="#252c28"/><rect x="337" y="301" width="6" height="6" fill="#252c28"/><rect x="657" y="301" width="6" height="6" fill="#252c28"/><text x="40" y="366" font-size="18" fill="#252c28">B</text><path d="M100 360H660" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="177" y="357" width="6" height="6" fill="#252c28"/><rect x="337" y="357" width="6" height="6" fill="#252c28"/><rect x="657" y="357" width="6" height="6" fill="#252c28"/><text x="40" y="422" font-size="18" fill="#252c28">C</text><path d="M100 416H660" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="177" y="413" width="6" height="6" fill="#252c28"/><rect x="337" y="413" width="6" height="6" fill="#252c28"/><rect x="657" y="413" width="6" height="6" fill="#252c28"/><text x="40" y="478" font-size="18" fill="#252c28">D</text><path d="M100 472H660" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="177" y="469" width="6" height="6" fill="#252c28"/><rect x="337" y="469" width="6" height="6" fill="#252c28"/><rect x="657" y="469" width="6" height="6" fill="#252c28"/><text x="100" y="520" font-size="17" fill="#626962">0</text><text x="180" y="520" font-size="17" fill="#626962">1</text><text x="340" y="520" font-size="17" fill="#626962">3</text><text x="660" y="520" font-size="17" fill="#626962">7</text><text x="24" y="608" font-size="22" fill="#252c28">Full jitter / independent draws</text><text x="40" y="654" font-size="18" fill="#252c28">A</text><path d="M100 648H660" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="113" y="645" width="6" height="6" fill="#00855b"/><rect x="241" y="645" width="6" height="6" fill="#00855b"/><rect x="409" y="645" width="6" height="6" fill="#00855b"/><text x="40" y="710" font-size="18" fill="#252c28">B</text><path d="M100 704H660" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="153" y="701" width="6" height="6" fill="#00855b"/><rect x="185" y="701" width="6" height="6" fill="#00855b"/><rect x="457" y="701" width="6" height="6" fill="#00855b"/><text x="40" y="766" font-size="18" fill="#252c28">C</text><path d="M100 760H660" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="105" y="757" width="6" height="6" fill="#00855b"/><rect x="153" y="757" width="6" height="6" fill="#00855b"/><rect x="313" y="757" width="6" height="6" fill="#00855b"/><text x="40" y="822" font-size="18" fill="#252c28">D</text><path d="M100 816H660" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="161" y="813" width="6" height="6" fill="#00855b"/><rect x="233" y="813" width="6" height="6" fill="#00855b"/><rect x="497" y="813" width="6" height="6" fill="#00855b"/><text x="100" y="864" font-size="17" fill="#626962">0</text><text x="180" y="864" font-size="17" fill="#626962">1</text><text x="340" y="864" font-size="17" fill="#626962">3</text><text x="660" y="864" font-size="17" fill="#626962">7</text><rect x="24" y="952" width="672" height="136" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="984" font-size="20" fill="#252c28">Squares mark retry starts; both axes show elapsed seconds.</text><text x="40" y="1026" font-size="17" fill="#626962">Independent draws reduce alignment but can still coincide.</text><text x="40" y="1064" font-size="17" fill="#626962">At the cap, keep drawing across the range rather than using a fixed delay.</text></svg>
