<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="conservation-check"><title id="title">Business invariant checks</title><desc id="desc">For an order of ten units, shipped six plus cancelled two plus open two reconciles to ten. A candidate with seven shipped plus two cancelled plus two open violates the rule and is held. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Test the rule that the business must preserve.</text><text x="54" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Version</text><text x="230.96" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Shipped</text><text x="344.72" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Cancel</text><text x="458.48" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Open</text><text x="572.24" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Total</text><path d="M44 153L676 153" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="132.48000000000002" y="212.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Current</text><text x="277.84000000000003" y="212.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">6</text><text x="391.6" y="212.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">2</text><text x="505.36" y="212.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">2</text><rect x="562.24" y="161" width="113.75999999999999" height="86" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="619.12" y="212.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">10</text><path d="M44 250L676 250" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="132.48000000000002" y="302.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Candidate</text><text x="277.84000000000003" y="302.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">7</text><text x="391.6" y="302.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">2</text><text x="505.36" y="302.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">2</text><text x="619.12" y="302.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">11</text><path d="M44 340L676 340" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="418" font-size="26" fill="#00855b" text-anchor="start" data-label="1">Ordered 10 = shipped + cancelled + open</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Hold the candidate; preserve the last valid publication.</text></svg>