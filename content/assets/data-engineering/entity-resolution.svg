<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="candidate-decision-fan"><title id="title">Entity resolution weighs evidence before linking</title><desc id="desc">Comparable records generate candidate pairs. Cluster validation must pass before accepting a pair; alternatives are evidence review or leaving the pair unlinked. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">A candidate pair is not yet an accepted identity.</text><text x="54" y="125" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Record A</text><text x="204.0" y="125" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Record B</text><path d="M44 141L344 141" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="119.0" y="181.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">M. Chen</text><text x="269.0" y="181.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Maya Chen</text><path d="M44 200L344 200" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="119.0" y="233.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Source 1</text><text x="269.0" y="233.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Source 2</text><path d="M44 252L344 252" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><path d="M344 220H385V350" fill="none" stroke="#00855b" stroke-width="1.2"/><path d="M385 220L432 145" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="445" y="153" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Check cluster, then</text><text x="445" y="184" font-size="24" fill="#252c28" text-anchor="start" data-label="1">accept</text><path d="M385 220L432 260" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="445" y="268" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Review evidence</text><path d="M385 220L432 375" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="445" y="383" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Leave unlinked</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Preserve evidence and the history of decisions.</text></svg>