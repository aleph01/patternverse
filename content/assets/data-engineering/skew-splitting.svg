<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="partial-aggregation"><title id="title">Skew splitting</title><desc id="desc">Six hot-merchant records with amounts 10, 20, 30, 40, 50, 60 are spread over three processing lanes. Partial sum/count pairs 50/2, 70/2, 90/2 merge to 210/6. The final stage must remove the temporary split key. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Split a hot key, then combine the partial answers.</text><rect x="44.0" y="150" width="202.66666666666666" height="110" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="145.33333333333331" y="182" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">10 + 40</text><text x="145.33333333333331" y="212" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">50 / 2</text><rect x="258.66666666666663" y="150" width="202.66666666666666" height="110" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="359.99999999999994" y="182" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">20 + 50</text><text x="359.99999999999994" y="212" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">70 / 2</text><rect x="473.3333333333333" y="150" width="202.66666666666666" height="110" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="574.6666666666666" y="182" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">30 + 60</text><text x="574.6666666666666" y="212" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">90 / 2</text><path d="M145 278L360 353" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M360 278L360 353" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M575 278L360 353" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="210" y="365" width="300" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="400.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Sum 210 · count 6</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Equal counts here; with unequal counts, merge sums and</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">counts.</text></svg>