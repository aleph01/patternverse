<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="index-recheck"><title id="title">Secondary access paths for live data</title><desc id="desc">A native index reflects O72 open v5. An asynchronous projection still says O71 open v18 although the source is shipped v19. Rechecking can remove stale positives but cannot recover matches missing from the projection. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Add another route to records and define its</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">consistency.</text><text x="54" y="144" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Access path</text><text x="262.56" y="144" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Candidate</text><text x="471.12" y="144" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Source check</text><path d="M44 160L676 160" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="148.28" y="219.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Native index</text><text x="356.84000000000003" y="219.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">O72 open v5</text><rect x="461.12" y="168" width="214.88" height="85" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="568.56" y="219.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Open v5</text><path d="M44 256L676 256" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="148.28" y="307.66" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Async projection</text><text x="356.84000000000003" y="308.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">O71 open v18</text><text x="568.56" y="308.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Shipped v19</text><path d="M44 345L676 345" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="410" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Stale candidates may be removed by rechecking.</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Missing candidates need a freshness or reconciliation</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">strategy.</text></svg>