<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="component-volume"><title id="title">Volume monitoring</title><desc id="desc">Expected volume is 1000 from A600, B300, C100. Actual remains 1000 because A600, B0, C400 offset one another. Component checks expose the missing B feed and unexpected C increase. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Track totals and the contributions behind them.</text><text x="54" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Feed</text><text x="212.0" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Expected</text><text x="370.0" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Actual</text><text x="528.0" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Change</text><path d="M44 155L676 155" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="123.0" y="199.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">A</text><text x="281.0" y="199.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">600</text><text x="439.0" y="199.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">600</text><text x="597.0" y="199.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">0</text><path d="M44 221L676 221" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="258.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">B</text><text x="281.0" y="258.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">300</text><text x="439.0" y="258.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">0</text><text x="597.0" y="258.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">−300</text><path d="M44 280L676 280" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="317.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">C</text><text x="281.0" y="317.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">100</text><text x="439.0" y="317.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">400</text><text x="597.0" y="317.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">+300</text><path d="M44 339L676 339" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="376.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Total</text><text x="281.0" y="376.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">1000</text><text x="439.0" y="376.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">1000</text><text x="597.0" y="376.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">0</text><path d="M44 398L676 398" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">A stable total can hide two large changes.</text></svg>