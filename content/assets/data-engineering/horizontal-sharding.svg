<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Classify a key, then resolve its owner</title><desc id="desc">Tenant 7 maps to logical bucket 6. Routing map version 12 assigns buckets 0–3 to A, 4–7 to B, and 8–11 to C, so this request goes only to B. The shards share a schema but hold different rows; replicas within a shard are a separate concern.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="720" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Classify a key, then resolve its owner</text><text x="24" y="78" font-size="19" fill="#626962">Twelve logical buckets; three owning groups.</text><rect x="24" y="112" width="192" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="36" y="148" font-size="20" fill="#252c28">Request: tenant 7</text><text x="36" y="186" font-size="17" fill="#626962">Read order O71</text><rect x="264" y="112" width="192" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="276" y="148" font-size="20" fill="#252c28">Logical bucket 6</text><text x="276" y="186" font-size="17" fill="#626962">(7 − 1) modulo 12</text><rect x="504" y="112" width="192" height="96" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="516" y="148" font-size="20" fill="#252c28">Routing map v12</text><text x="516" y="186" font-size="17" fill="#626962">Bucket 6 → B</text><path d="M218 160H258" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="220" y="100" font-size="16" fill="#626962">key</text><path d="M458 160H498" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="459" y="100" font-size="16" fill="#626962">map</text><path d="M600 208V284H360V332" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="284" font-size="20" fill="#252c28">Resolve bucket 6 → B</text><rect x="24" y="336" width="208" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="376" font-size="22" fill="#252c28">Shard A</text><text x="40" y="414" font-size="18" fill="#626962">Owns buckets 0–3</text><text x="40" y="454" font-size="18" fill="#252c28">Other tenant rows</text><rect x="256" y="336" width="208" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="272" y="376" font-size="22" fill="#252c28">Shard B</text><text x="272" y="414" font-size="18" fill="#626962">Owns buckets 4–7</text><text x="272" y="454" font-size="18" fill="#252c28">T7 / O71 / paid</text><rect x="488" y="336" width="208" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="504" y="376" font-size="22" fill="#252c28">Shard C</text><text x="504" y="414" font-size="18" fill="#626962">Owns buckets 8–11</text><text x="504" y="454" font-size="18" fill="#252c28">Other tenant rows</text><rect x="24" y="536" width="672" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="574" font-size="22" fill="#252c28">Same schema; different rows in each shard.</text><text x="40" y="618" font-size="19" fill="#626962">Replicas within a shard copy its data for availability.</text><text x="40" y="654" font-size="19" fill="#626962">Replication and sharding solve different capacity problems.</text></svg>
