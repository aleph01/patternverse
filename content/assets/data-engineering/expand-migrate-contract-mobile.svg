<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1040" viewBox="0 0 360 1040" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Expansion, migration and evidence-gated contraction</title><desc id="desc">Expand supports both old and new interfaces. Migrate moves consumers while both remain available. A readiness gate checks data, consumers, and recovery obligations before Contract removes the old interface. Removing it is not an automatic consequence of adding the new one.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1040" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Support the middle state</text><text x="24" y="84" font-size="18" fill="#626962">Parallel Change / Expand-Contract</text><rect x="24" y="112" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="150" font-size="22" fill="#252c28">1 Expand</text><text x="40" y="190" font-size="18" fill="#252c28">Old + new names supported</text><text x="40" y="230" font-size="19" fill="#626962">Keep one authority</text><path d="M72 256V312" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="292" font-size="18" fill="#626962">Compatible release</text><rect x="24" y="316" width="312" height="160" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="354" font-size="22" fill="#252c28">2 Migrate</text><text x="40" y="392" font-size="19" fill="#252c28">Move consumers</text><text x="40" y="426" font-size="18" fill="#252c28">Backfill + reconcile data</text><text x="40" y="464" font-size="18" fill="#626962">Both forms stay usable</text><path d="M72 476V532" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="512" font-size="17" fill="#626962">Collect readiness evidence</text><rect x="24" y="536" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="574" font-size="22" fill="#252c28">Retirement gate</text><text x="40" y="612" font-size="18" fill="#252c28">Required data is current</text><text x="40" y="646" font-size="18" fill="#252c28">Old usages have moved</text><text x="40" y="684" font-size="17" fill="#626962">Recovery obligations closed</text><path d="M72 712V768" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="748" font-size="18" fill="#626962">Only after readiness</text><rect x="24" y="772" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="810" font-size="22" fill="#252c28">3 Contract</text><text x="40" y="850" font-size="19" fill="#252c28">Remove the old name</text><text x="40" y="888" font-size="17" fill="#626962">Retire obsolete bridge code</text><text x="24" y="964" font-size="18" fill="#252c28">Phases may span many releases.</text><text x="24" y="1004" font-size="18" fill="#626962">New working ≠ old unused.</text></svg>
