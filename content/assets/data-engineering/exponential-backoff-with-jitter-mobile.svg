<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1304" viewBox="0 0 360 1304" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Retry timing with and without jitter</title><desc id="desc">Four clients without jitter retry at elapsed times one, three, and seven seconds. Independent full-jitter draws spread their retry times within the same successive one, two, and four second waiting bounds. Request durations are omitted and the times are illustrative.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1304" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Spread the retry starts</text><rect x="24" y="104" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="133" font-size="18" fill="#252c28">Retry windows / 1 s, 2 s, 4 s</text><text x="40" y="159" font-size="16" fill="#626962">Request durations are omitted.</text><text x="24" y="264" font-size="20" fill="#252c28">Without jitter / same delays</text><text x="24" y="310" font-size="18" fill="#252c28">A</text><path d="M60 304H312" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="93" y="301" width="6" height="6" fill="#252c28"/><rect x="165" y="301" width="6" height="6" fill="#252c28"/><rect x="309" y="301" width="6" height="6" fill="#252c28"/><text x="24" y="366" font-size="18" fill="#252c28">B</text><path d="M60 360H312" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="93" y="357" width="6" height="6" fill="#252c28"/><rect x="165" y="357" width="6" height="6" fill="#252c28"/><rect x="309" y="357" width="6" height="6" fill="#252c28"/><text x="24" y="422" font-size="18" fill="#252c28">C</text><path d="M60 416H312" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="93" y="413" width="6" height="6" fill="#252c28"/><rect x="165" y="413" width="6" height="6" fill="#252c28"/><rect x="309" y="413" width="6" height="6" fill="#252c28"/><text x="24" y="478" font-size="18" fill="#252c28">D</text><path d="M60 472H312" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="93" y="469" width="6" height="6" fill="#252c28"/><rect x="165" y="469" width="6" height="6" fill="#252c28"/><rect x="309" y="469" width="6" height="6" fill="#252c28"/><text x="60" y="520" font-size="17" fill="#626962">0</text><text x="96" y="520" font-size="17" fill="#626962">1</text><text x="168" y="520" font-size="17" fill="#626962">3</text><text x="312" y="520" font-size="17" fill="#626962">7</text><text x="24" y="608" font-size="20" fill="#252c28">Full jitter / independent draws</text><text x="24" y="654" font-size="18" fill="#252c28">A</text><path d="M60 648H312" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="64.2" y="645" width="6" height="6" fill="#00855b"/><rect x="121.8" y="645" width="6" height="6" fill="#00855b"/><rect x="197.4" y="645" width="6" height="6" fill="#00855b"/><text x="24" y="710" font-size="18" fill="#252c28">B</text><path d="M60 704H312" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="82.2" y="701" width="6" height="6" fill="#00855b"/><rect x="96.6" y="701" width="6" height="6" fill="#00855b"/><rect x="219" y="701" width="6" height="6" fill="#00855b"/><text x="24" y="766" font-size="18" fill="#252c28">C</text><path d="M60 760H312" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="60.6" y="757" width="6" height="6" fill="#00855b"/><rect x="82.2" y="757" width="6" height="6" fill="#00855b"/><rect x="154.2" y="757" width="6" height="6" fill="#00855b"/><text x="24" y="822" font-size="18" fill="#252c28">D</text><path d="M60 816H312" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="85.8" y="813" width="6" height="6" fill="#00855b"/><rect x="118.19999999999999" y="813" width="6" height="6" fill="#00855b"/><rect x="237" y="813" width="6" height="6" fill="#00855b"/><text x="60" y="864" font-size="17" fill="#626962">0</text><text x="96" y="864" font-size="17" fill="#626962">1</text><text x="168" y="864" font-size="17" fill="#626962">3</text><text x="312" y="864" font-size="17" fill="#626962">7</text><rect x="24" y="952" width="312" height="208" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="984" font-size="18" fill="#252c28">Squares mark retry starts.</text><text x="40" y="1028" font-size="17" fill="#626962">Both axes: elapsed seconds.</text><text x="40" y="1072" font-size="17" fill="#626962">Random starts can still coincide.</text><text x="40" y="1116" font-size="17" fill="#626962">These are illustrative draws.</text><text x="24" y="1220" font-size="16" fill="#626962">At the cap, keep randomizing the wait.</text><text x="24" y="1260" font-size="16" fill="#626962">Do not replace jitter with a fixed delay.</text></svg>
