<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="aligned-independent-summaries"><title id="title">Conformed dimensions</title><desc id="desc">Sales and returns are summarized independently by the same month and canonical product before being aligned. Adapter sales USD 75 and returns USD 20; Case sales USD 12 and no return summary. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Align processes through shared dimensions.</text><text x="54" y="145" font-size="24" fill="#252c28" text-anchor="start" data-label="1">October product</text><text x="332.08" y="145" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Sales USD</text><text x="509.03999999999996" y="145" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Returns USD</text><path d="M44 161L676 161" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="44" y="169" width="278.08" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="183.04" y="201.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Adapter</text><text x="410.55999999999995" y="201.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">75</text><text x="587.52" y="201.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">20</text><path d="M44 220L676 220" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="221" width="278.08" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="183.04" y="253.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Case</text><text x="410.55999999999995" y="253.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">12</text><text x="587.52" y="253.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">—</text><path d="M44 272L676 272" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="420" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Same product identity and calendar meaning.</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">— = no return summary; zero requires complete capture.</text></svg>