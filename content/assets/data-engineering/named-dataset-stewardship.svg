<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="accountability-route"><title id="title">Named dataset stewardship</title><desc id="desc">The daily balance dataset names Priya as steward,Mateo as deputy,and a monitored team escalation route. Stewardship covers business meaning and quality coordination; engineering responsibilities are separately named. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Give questions and incidents a maintained route</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">to an owner.</text><rect x="44" y="140" width="632" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="175.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Dataset: daily balance</text><text x="54" y="265" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Responsibility</text><text x="351.03999999999996" y="265" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Contact</text><path d="M44 281L676 281" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="192.51999999999998" y="325.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Steward</text><text x="508.52" y="325.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Priya</text><path d="M44 347L676 347" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="192.51999999999998" y="384.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Deputy</text><text x="508.52" y="384.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Mateo</text><path d="M44 406L676 406" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="192.51999999999998" y="443.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Escalation</text><text x="508.52" y="443.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Monitored team route</text><path d="M44 465L676 465" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Keep ownership current and distinguish business from</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">operations.</text></svg>