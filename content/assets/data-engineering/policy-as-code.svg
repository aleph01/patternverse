<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="evidence-binding"><title id="title">Policy as code</title><desc id="desc">Policy P12 evaluates candidate R108. Evidence from R107 is not evidence about R108,so the decision is HOLD. Current R107 remains public until a candidate has matching valid evidence. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Evaluate versioned rules against the exact</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">candidate.</text><text x="54" y="143" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Required</text><text x="262.56" y="143" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Provided</text><text x="483.76" y="143" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Decision</text><path d="M44 159L676 159" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="148.28" y="218.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Policy P12</text><text x="363.15999999999997" y="218.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Policy P12</text><text x="574.88" y="218.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Match</text><path d="M44 256L676 256" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="148.28" y="308.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Candidate R108</text><text x="363.15999999999997" y="308.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Evidence R107</text><text x="574.88" y="308.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">HOLD</text><path d="M44 346L676 346" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Version rules and bind evidence to the object being</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">authorized.</text></svg>