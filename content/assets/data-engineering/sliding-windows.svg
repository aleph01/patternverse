<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="window-membership"><title id="title">Sliding windows</title><desc id="desc">Ten-minute windows start every five minutes. Events 30 at 03,70 at 07,and 20 at 12 produce window sums 100,90,20. Their sum 210 is not the distinct-event total 120. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Overlapping windows count an event more than</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">once.</text><path d="M85 420L655 420" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M85 414L85 426" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="85" y="455" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">00</text><path d="M227.5 414L227.5 426" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="227.5" y="455" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">05</text><path d="M370 414L370 426" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="370" y="455" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10</text><path d="M512.5 414L512.5 426" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="512.5" y="455" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">15</text><path d="M655 414L655 426" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="655" y="455" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">20</text><rect x="85" y="130" width="285" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="227.5" y="165.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">[00,10) = 100</text><rect x="227.5" y="225" width="285" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="370.0" y="260.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">[05,15) = 90</text><rect x="370" y="320" width="285" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="512.5" y="355.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">[10,20) = 20</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Do not add overlapping window totals: 210 ≠ 120.</text></svg>