<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="matching-input-readiness"><title id="title">Data-aware dependencies</title><desc id="desc">October 25 orders v8 are ready but the successful returns job only provides October 24. Processing waits until October 25 returns v4 is ready, then pins both versions. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Wait for the required data version, not a green job.</text><text x="54" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Required Oct 25</text><text x="287.84000000000003" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Available</text><text x="540.6400000000001" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Ready?</text><path d="M44 153L676 153" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="160.92000000000002" y="203.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Orders</text><text x="404.24000000000007" y="203.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Oct 25 · v8</text><text x="603.3200000000002" y="203.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Yes</text><path d="M44 232L676 232" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="160.92000000000002" y="275.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Returns</text><text x="404.24000000000007" y="275.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Oct 24 · v3</text><text x="603.3200000000002" y="275.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">No</text><path d="M44 304L676 304" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="160.92000000000002" y="347.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Returns, later</text><rect x="277.84000000000003" y="305" width="252.80000000000007" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="404.24000000000007" y="347.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Oct 25 · v4</text><rect x="530.6400000000001" y="305" width="145.36" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="603.3200000000002" y="347.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Yes</text><path d="M44 376L676 376" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Run with orders v8 + returns v4 for the same date.</text></svg>