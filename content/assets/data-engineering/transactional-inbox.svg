<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="transaction-boundary"><title id="title">Transactional inbox</title><desc id="desc">A destination transaction records M701 as handled and changes available stock from 10 to 7. Only after commit is the incoming message acknowledged. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Record consumption with the business update.</text><text x="44" y="119" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Incoming M701</text><path d="M250 111H600V180" fill="none" stroke="#00855b" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="44" y="190" width="632" height="195" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="54" y="175" width="357.5" height="28" fill="#fff" stroke="none" stroke-width="1.2"/><text x="64" y="195" font-size="24" fill="#252c28" text-anchor="start" data-label="1">One destination transaction</text><rect x="70" y="255" width="268" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="204.0" y="290.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">M701 completed</text><rect x="382" y="255" width="268" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="516.0" y="290.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Reserve 3: 10 → 7</text><path d="M341 282L374 282" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="360" y="451" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Commit → acknowledge; retry → no second effect</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">No committed marker without its corresponding business</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">effect.</text></svg>