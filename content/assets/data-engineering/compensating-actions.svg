<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="forward-correction"><title id="title">Compensating actions</title><desc id="desc">Capacity starts at 100. R42 reserves 10 and R43 reserves 5, leaving 85. After cancelling external job X42 and confirming termination, releasing only R42 returns capacity to 95. R43 remains reserved; release R42 is idempotent. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Undo only this workflow’s business effect.</text><text x="44" y="126" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Start: 100 available · X42 is an external job</text><text x="54" y="174" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Action</text><text x="496.4" y="174" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Available</text><path d="M44 190L676 190" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="265.2" y="238.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">R42 reserves 10</text><text x="581.2" y="238.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">90</text><path d="M44 265L676 265" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="265.2" y="306.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">R43 reserves 5</text><text x="581.2" y="306.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">85</text><path d="M44 333L676 333" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="265.2" y="374.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Release R42 only</text><rect x="486.4" y="334" width="189.60000000000002" height="64" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="581.2" y="374.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">95</text><path d="M44 401L676 401" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="464" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Cancel X42 → confirm stopped → release R42 once</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">R43 remains reserved; final available capacity: 95.</text></svg>