<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="monotone-authority"><title id="title">Leases with fencing tokens</title><desc id="desc">Worker A pauses with token 41. After lease expiry worker B acquires token 42 and writes. The durable resource records fence 42 and rejects a later write from A using token 41. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">The protected resource rejects stale lease holders.</text><text x="54" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Worker</text><text x="243.6" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Token</text><text x="370.0" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Protected write</text><path d="M44 155L676 155" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="138.8" y="205.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">A pauses</text><text x="296.8" y="205.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">41</text><text x="518.0" y="205.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Lease expires</text><path d="M44 234L676 234" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="138.8" y="277.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">B</text><text x="296.8" y="277.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">42</text><rect x="360.0" y="235" width="316.0" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="518.0" y="277.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Accept; fence = 42</text><path d="M44 306L676 306" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="138.8" y="349.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">A resumes</text><text x="296.8" y="349.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">41</text><rect x="360.0" y="307" width="316.0" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="518.0" y="349.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Reject: 41 &lt; 42</text><path d="M44 378L676 378" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Lease expiry alone cannot stop a paused worker from</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">resuming.</text></svg>