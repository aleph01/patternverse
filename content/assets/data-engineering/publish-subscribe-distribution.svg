<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Fan-out interests and shared workers are separate delivery boundaries</title><desc id="desc">OrderPlaced messages E901 and E902 fan out to fulfillment, analytics, and notifications subscriptions. Each subscription receives both messages as independent logical deliveries. Two fulfillment workers take a different message each from their shared fulfillment queue; they divide that workload rather than each receiving the full stream. Publisher acceptance does not mean subscriber work has completed.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1080" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Independent subscriptions fan out; workers share</text><rect x="24" y="84" width="672" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="113" font-size="20" fill="#252c28">Order publisher</text><text x="40" y="139" font-size="17" fill="#626962">Publish E901 / O42 and E902 / O43 to orders.</text><path d="M360 180V278" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="236" font-size="17" fill="#626962">publish</text><rect x="24" y="280" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="309" font-size="20" fill="#252c28">Topic: orders</text><text x="40" y="335" font-size="17" fill="#626962">One logical delivery per matching subscription and publication</text><text x="24" y="430" font-size="18" fill="#252c28">Independent interests</text><path d="M360 392V452H128V518" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 452V518" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 452H592V518" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="520" width="208" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="549" font-size="18" fill="#252c28">Fulfillment</text><text x="40" y="575" font-size="16" fill="#626962">E901, E902</text><rect x="256" y="520" width="208" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="272" y="549" font-size="18" fill="#252c28">Analytics</text><text x="272" y="575" font-size="16" fill="#626962">E901, E902</text><rect x="488" y="520" width="208" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="504" y="549" font-size="18" fill="#252c28">Notifications</text><text x="504" y="575" font-size="16" fill="#626962">E901, E902</text><path d="M128 664V728H180V822" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M128 728H540V822" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="824" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="853" font-size="20" fill="#252c28">Fulfillment worker A</text><text x="40" y="879" font-size="17" fill="#626962">Takes E901 from that queue.</text><rect x="384" y="824" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="853" font-size="20" fill="#252c28">Fulfillment worker B</text><text x="400" y="879" font-size="17" fill="#626962">Takes E902 from that queue.</text><text x="24" y="992" font-size="18" fill="#252c28">Only the fulfillment workers divide the fulfillment stream.</text><text x="24" y="1032" font-size="17" fill="#626962">Analytics and notifications still own their independent deliveries.</text></svg>
