<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="dataset-fit-comparison"><title id="title">Self-Service Data Discovery</title><desc id="desc">A consumer asks for net collections by day. Catalog results distinguish Orders at order-line grain with booked amounts, Payment events at event grain requiring aggregation, and Net collections at day-by-merchant-by-currency grain with settled captures minus refunds. The last is the candidate suited to this illustrative question. Its entry identifies Payments as the owner and reports daily data through October 27. Discoverable metadata helps evaluate fit and find an access route; it does not itself grant permission to read the data. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Discovery helps people choose before querying.</text><text x="44" y="113" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Question: net collections by day</text><text x="54" y="174" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Dataset</text><text x="230.96" y="174" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Grain / meaning</text><text x="559.6" y="174" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Fit</text><path d="M44 190L676 190" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="132.48000000000002" y="237.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Orders</text><text x="385.28" y="237.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Order line · booked</text><text x="612.8" y="237.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">No</text><path d="M44 263L676 263" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="132.48000000000002" y="289.66" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Payment</text><text x="132.48000000000002" y="316.66" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">events</text><text x="385.28" y="303.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Event · captures / refunds</text><text x="612.8" y="303.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Aggregate</text><path d="M44 329L676 329" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="330" width="176.96" height="62" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="132.48000000000002" y="369.16" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Net collections</text><rect x="220.96" y="330" width="328.64" height="62" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="385.28" y="355.66" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Day × merchant × currency</text><text x="385.28" y="382.66" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Settled captures − refunds</text><rect x="549.6" y="330" width="126.39999999999998" height="62" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="612.8" y="369.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Fits</text><path d="M44 395L676 395" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="440" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Owner: Finance · daily data through Oct 27</text><rect x="44" y="462" width="632" height="50" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="495.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Read meaning → check limits → follow access route</text><text x="44" y="542" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Metadata visibility and data access are separate.</text></svg>