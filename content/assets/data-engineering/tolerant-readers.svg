<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="known-field-validation"><title id="title">Tolerant readers</title><desc id="desc">A reader requires an integer quantity and unit EA. An added zone A3 is harmless. Missing unit or quantity as text fails its contract. A relay may need to preserve fields that it does not interpret. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Ignore irrelevant additions; validate what you use.</text><text x="54" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Payload change</text><text x="458.48" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Reader decision</text><path d="M44 153L676 153" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="246.24" y="206.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Add zone = A3</text><rect x="448.48" y="161" width="227.51999999999998" height="73" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="562.24" y="206.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Accept</text><path d="M44 237L676 237" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="246.24" y="283.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Remove required unit</text><text x="562.24" y="283.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Reject</text><path d="M44 314L676 314" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="246.24" y="360.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Quantity 4 → &quot;4&quot;</text><text x="562.24" y="360.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Reject</text><path d="M44 391L676 391" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Tolerance has an explicit boundary around required</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">meaning.</text></svg>