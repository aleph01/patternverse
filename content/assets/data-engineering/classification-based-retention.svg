<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="clock-and-hold"><title id="title">Classification-based retention</title><desc id="desc">A ticket closes January1,2027 with a90-day retention period,due April1. A hold from March20 to April15 prevents disposal. On release,re-evaluate the original due date rather than restarting the ninety-day clock. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Calculate retention from the class and its</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">governing clock.</text><path d="M90 350L660 350" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M90 344L90 356" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="90" y="385" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Jan 1</text><path d="M390 344L390 356" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="390" y="385" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Mar 20</text><path d="M500 344L500 356" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="500" y="385" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Apr 1</text><path d="M660 344L660 356" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="660" y="385" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Apr 15</text><rect x="90" y="155" width="410" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="295.0" y="190.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">90-day retention</text><rect x="390" y="255" width="270" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="525.0" y="290.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Hold</text><path d="M500 130L500 390" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="4 4"/><text x="44" y="452" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Hold released → due date already passed → re-evaluate</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Eligibility is not proof of physical deletion.</text></svg>