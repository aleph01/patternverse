<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="window-membership"><title id="title">Tumbling windows</title><desc id="desc">Five-minute UTC windows assign events at 10:01 and 10:04:59 to [10:00, 10:05), events at 10:05 and 10:08 to [10:05, 10:10), and an event at 10:12 to [10:10, 10:15). Processing delay does not move membership. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Each event belongs to one non-overlapping</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">window.</text><path d="M85 420L660 420" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M85 414L85 426" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="85" y="455" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10:00</text><path d="M275 414L275 426" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="275" y="455" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10:05</text><path d="M465 414L465 426" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="465" y="455" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10:10</text><path d="M655 414L655 426" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="655" y="455" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10:15</text><rect x="85" y="250" width="186" height="75" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="178.0" y="296.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">100</text><rect x="275" y="250" width="186" height="75" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="368.0" y="296.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">60</text><rect x="465" y="250" width="186" height="75" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="558.0" y="296.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">50</text><circle cx="123" cy="170" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><text x="123" y="137" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">30</text><path d="M123 181L123 245" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="3 4"/><circle cx="270" cy="170" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><text x="240" y="120" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">70</text><path d="M270 181L270 245" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="3 4"/><circle cx="275" cy="190" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><text x="310" y="137" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">20</text><path d="M275 181L275 245" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="3 4"/><circle cx="389" cy="170" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><text x="389" y="137" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">40</text><path d="M389 181L389 245" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="3 4"/><circle cx="541" cy="170" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><text x="541" y="137" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">50</text><path d="M541 181L541 245" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="3 4"/><text x="44" y="372" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Window sums · all times UTC</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">10:05 belongs to [10:05, 10:10).</text></svg>