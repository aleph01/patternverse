<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="detail-to-summary"><title id="title">Aggregate fact tables</title><desc id="desc">Four sale lines roll up to two day-store rows. October1 has 3 units and USD62; October2 has 4 units and USD85. Totals remain 7 units and USD147. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Aggregate at a declared coarser grain.</text><text x="54" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Day / store</text><text x="264.66666666666663" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Units</text><text x="475.3333333333333" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Net sales USD</text><path d="M44 146L676 146" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="149.33333333333331" y="186.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">01 Oct / 7</text><text x="360.0" y="186.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">3</text><text x="570.6666666666666" y="186.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">62</text><path d="M44 205L676 205" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="149.33333333333331" y="238.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">02 Oct / 7</text><text x="360.0" y="238.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">4</text><text x="570.6666666666666" y="238.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">85</text><path d="M44 257L676 257" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="149.33333333333331" y="290.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Total</text><rect x="254.66666666666666" y="258" width="210.66666666666666" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="290.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">7</text><rect x="465.3333333333333" y="258" width="210.66666666666669" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="570.6666666666666" y="290.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">147</text><path d="M44 309L676 309" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Product-level questions still need retained detail.</text></svg>