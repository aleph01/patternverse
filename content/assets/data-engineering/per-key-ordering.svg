<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="parallel-key-lanes"><title id="title">Per-key ordering</title><desc id="desc">Interleaved input A1, B1, A2, B2, A3 is routed into ordered key lanes. A progresses created, paid, shipped; B progresses created, cancelled. Cross-key order is not defined. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Apply each order’s changes in sequence; different</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">orders can progress together.</text><text x="44" y="122" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Input: A1, B1, A2, B2, A3</text><text x="44" y="229" font-size="26" fill="#00855b" text-anchor="start" data-label="1">A</text><rect x="100" y="190" width="170" height="60" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="185.0" y="228.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Created</text><path d="M272 220L285 220" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="295" y="190" width="170" height="60" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="380.0" y="228.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Paid</text><path d="M467 220L480 220" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="490" y="190" width="170" height="60" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="575.0" y="228.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Shipped</text><text x="44" y="374" font-size="26" fill="#00855b" text-anchor="start" data-label="1">B</text><rect x="100" y="335" width="170" height="60" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="185.0" y="373.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Created</text><path d="M272 365L285 365" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="295" y="335" width="170" height="60" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="380.0" y="373.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Cancelled</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Shown here: stable routing, one ordered processor per</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">key.</text></svg>