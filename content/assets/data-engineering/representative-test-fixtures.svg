<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="ordered-fixture-sequence"><title id="title">Representative Test Fixtures</title><desc id="desc">A deliberately ordered fixture tests a latest-version-per-event contract within one source and a retained state horizon. E1 v1 amount40 is accepted; its retry leaves total40. E2 v1 amount40 is a distinct event, bringing total80. E1 v2 amount35 replaces its earlier value, bringing total75. A stale E1 v1 is ignored, leaving75. The expected sequence is40,40,80,75,75. Representative fixtures preserve consequential relationships, boundaries, prior state, and arrival order; they are not statistically representative samples. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Fixtures can represent a sequence of changes.</text><text x="44" y="113" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Latest version wins; repeated versions add nothing.</text><text x="54" y="160" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Event/version</text><text x="230.96" y="160" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Amount</text><text x="344.72" y="160" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Action</text><text x="471.12" y="160" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Expected total</text><path d="M44 176L676 176" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="132.48000000000002" y="217.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E1 v1</text><text x="277.84000000000003" y="217.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">40</text><text x="397.92" y="217.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">New</text><rect x="461.12" y="184" width="214.88" height="49" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="568.56" y="217.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">40</text><path d="M44 236L676 236" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="132.48000000000002" y="270.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E1 v1</text><text x="277.84000000000003" y="270.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">40</text><text x="397.92" y="270.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Retry</text><rect x="461.12" y="237" width="214.88" height="49" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="568.56" y="270.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">40</text><path d="M44 289L676 289" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="132.48000000000002" y="323.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E2 v1</text><text x="277.84000000000003" y="323.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">40</text><text x="397.92" y="323.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">New</text><rect x="461.12" y="290" width="214.88" height="49" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="568.56" y="323.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">80</text><path d="M44 342L676 342" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="132.48000000000002" y="376.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E1 v2</text><text x="277.84000000000003" y="376.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">35</text><text x="397.92" y="376.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Revise</text><rect x="461.12" y="343" width="214.88" height="49" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="568.56" y="376.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">75</text><path d="M44 395L676 395" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="132.48000000000002" y="429.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E1 v1</text><text x="277.84000000000003" y="429.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">40</text><text x="397.92" y="429.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Stale</text><rect x="461.12" y="396" width="214.88" height="49" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="568.56" y="429.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">75</text><path d="M44 448L676 448" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="460" width="632" height="43" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="490.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Final state: E1 v2 = 35; E2 v1 = 40 → 75</text><text x="44" y="538" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Record sequence, prior state, and expected results.</text></svg>