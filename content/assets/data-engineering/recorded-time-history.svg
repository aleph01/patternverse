<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="knowledge-time-interval"><title id="title">Recorded-time history preserves what the warehouse had accepted</title><desc id="desc">East was known until July 5 at 09:00 UTC. West was recorded then, although its business effective date was July 1. Queries for knowledge on July 3 and July 6 return East and West respectively. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Preserve what the system knew at each time.</text><text x="44" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Recorded region</text><rect x="100" y="185" width="330" height="75" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="265.0" y="231.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">East</text><rect x="430" y="185" width="235" height="75" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="547.5" y="231.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">West</text><path d="M100 350L665 350" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M100 344L100 356" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="100" y="385" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Jan 10</text><path d="M430 344L430 356" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="430" y="385" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Jul 5</text><path d="M665 344L665 356" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="665" y="385" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Jul 6</text><text x="44" y="435" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Business change: Jul 1 · recorded: Jul 5, 09:00 UTC</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Known on July 3 → East; known on July 6 → West</text></svg>