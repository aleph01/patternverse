<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="private-parallel-route"><title id="title">Shadow pipelines</title><desc id="desc">Production and candidate both use source S52. Only production publishes. The candidate writes privately and compares matched outputs; equal totals do not justify exposing the candidate without deeper checks. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Run the candidate beside production without</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">publishing it.</text><rect x="50.0" y="230.0" width="160" height="90" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="130.0" y="283.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">S52</text><path d="M210 275H270V160H340" fill="none" stroke="#00855b" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="345.0" y="130.0" width="220" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="455.0" y="168.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Production</text><text x="455" y="228" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Public release</text><path d="M210 275H270V385H340" fill="none" stroke="#00855b" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="345.0" y="355.0" width="220" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="455.0" y="393.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Candidate</text><text x="455" y="453" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Private result</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Match source boundaries; isolate candidate side effects.</text></svg>