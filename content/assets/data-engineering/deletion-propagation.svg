<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="deletion-progress"><title id="title">Deletion propagation</title><desc id="desc">Deletion D52 is applied in the warehouse, requires a retry in search, and awaits physical cleanup in the lake. Applied and verified are separate milestones. Backfills and restores must check applicable deletion records before publication. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Track deletion across the required copies.</text><text x="54" y="134" font-size="24" fill="#252c28" text-anchor="start" data-label="1">D52 target</text><text x="306.8" y="134" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Progress</text><path d="M44 150L676 150" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="170.4" y="200.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Warehouse</text><rect x="296.8" y="158" width="379.2" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="486.4" y="200.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Applied</text><path d="M44 229L676 229" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="170.4" y="272.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Search</text><text x="486.4" y="272.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Retry required</text><path d="M44 301L676 301" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="170.4" y="344.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Lake</text><text x="486.4" y="344.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Physical cleanup pending</text><path d="M44 373L676 373" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="418" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Applied ≠ verified.</text><text x="44" y="488" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Check deletion records before publishing a backfill or</text><text x="44" y="519" font-size="24" fill="#252c28" text-anchor="start" data-label="1">restore.</text></svg>