<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="shared-calculation"><title id="title">Shared metric definitions</title><desc id="desc">Net captures v1 selects posted, non-test events and adds USD 100 captures to signed refunds of minus USD 20. The same definition, period, scope and cutoff produce USD 80 in the dashboard, notebook and report. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">One metric definition serves several consumers.</text><rect x="44" y="135" width="336" height="265" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="54" y="120" width="207.5" height="28" fill="#fff" stroke="none" stroke-width="1.2"/><text x="64" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Net captures v1</text><text x="66" y="186" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Posted, non-test events</text><text x="66" y="240" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Captures: USD 100</text><text x="66" y="283" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Refunds: USD −20</text><text x="66" y="348" font-size="24" fill="#00855b" text-anchor="start" data-label="1">100 + (−20) = USD 80</text><path d="M380 270H411V185H443" fill="none" stroke="#00855b" stroke-width="1.2" marker-end="url(#arrow)"/><text x="467" y="145" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Dashboard</text><rect x="453" y="160" width="223" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="564.5" y="195.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">USD 80</text><path d="M380 270H411V315H443" fill="none" stroke="#00855b" stroke-width="1.2" marker-end="url(#arrow)"/><text x="467" y="275" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Notebook</text><rect x="453" y="290" width="223" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="564.5" y="325.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">USD 80</text><path d="M380 270H411V445H443" fill="none" stroke="#00855b" stroke-width="1.2" marker-end="url(#arrow)"/><text x="467" y="405" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Report</text><rect x="453" y="420" width="223" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="564.5" y="455.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">USD 80</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Same definition version, period, scope, and cutoff.</text></svg>