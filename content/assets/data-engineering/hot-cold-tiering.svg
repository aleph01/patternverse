<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="access-temperature"><title id="title">Hot-cold tiering</title><desc id="desc">Data younger than seven days is hot. From seven to under ninety days it remains directly queryable in a colder tier. At ninety days it is archived and must be restored before use; archive absence is not an empty query result. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Place data by age and the access it still needs.</text><rect x="44.0" y="165" width="202.66666666666666" height="115" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="145.33333333333331" y="197" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Hot</text><text x="145.33333333333331" y="227" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">&lt; 7 days</text><rect x="258.66666666666663" y="165" width="202.66666666666666" height="115" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="359.99999999999994" y="197" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Queryable cold</text><text x="359.99999999999994" y="227" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">7–&lt; 90 days</text><rect x="473.3333333333333" y="165" width="202.66666666666666" height="115" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="574.6666666666666" y="197" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Archive</text><text x="574.6666666666666" y="227" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">≥ 90 days</text><text x="145" y="365" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Direct reads</text><text x="360" y="365" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Direct reads</text><text x="575" y="365" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Restore first</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Balance latency, retrieval cost, retention, and restore time.</text></svg>