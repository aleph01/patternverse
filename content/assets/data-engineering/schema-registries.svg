<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="writer-schema-resolution"><title id="title">Schema registries</title><desc id="desc">Retained Avro records written with schema ID 41 are decoded using that writer schema. Reader schema ID 58 adds a nullable coupon with default null. Resolving old writer data against the reader supplies the default; changing the registry does not rewrite the old bytes. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Keep the writer schema available for every</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">payload.</text><rect x="44" y="150" width="280" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="184.0" y="185.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Payload · writer ID 41</text><rect x="396" y="150" width="280" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="536.0" y="185.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Registry schema 41</text><path d="M330 177L389 177" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M535 210L535 290" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="44" y="310" width="632" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="345.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Resolve writer 41 with reader 58 → coupon null</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Retain the schema needed to decode historical data.</text></svg>