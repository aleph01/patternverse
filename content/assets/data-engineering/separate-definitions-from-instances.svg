<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="relationship-map"><title id="title">Separate definitions from instances</title><desc id="desc">Three individually identified drill units reference specification D18 version 1 while keeping separate lifecycle states. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">A definition is shared; each instance has a life.</text><path d="M360 278L135 143" fill="none" stroke="#00855b" stroke-width="1.2"/><rect x="45.0" y="113.0" width="180" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="135.0" y="151.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Unit U101</text><text x="135" y="201" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Ready</text><path d="M360 278L585 143" fill="none" stroke="#00855b" stroke-width="1.2"/><rect x="495.0" y="113.0" width="180" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="585.0" y="151.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Unit U102</text><text x="585" y="201" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">In use</text><path d="M360 278L135 405" fill="none" stroke="#00855b" stroke-width="1.2"/><rect x="45.0" y="375.0" width="180" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="135.0" y="413.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Unit U103</text><text x="135" y="463" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Under repair</text><rect x="265.0" y="228.0" width="190" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="360.0" y="272.66" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Definition D18 /</text><text x="360.0" y="299.66" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">version 1</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">A new specification does not rewrite old instances.</text></svg>