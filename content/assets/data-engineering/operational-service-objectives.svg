<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="error-budget"><title id="title">Operational service objectives</title><desc id="desc">The objective is 99.9% of eligible records available within 120 seconds over twenty-eight days. Of one million records,999250 arrive on time and 750 miss. Success is 99.925%; the 1000-record miss budget is 75% spent. Missing records count as misses. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Define a measurable promise and spend its</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">budget.</text><text x="54" y="133" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Eligible</text><text x="264.66666666666663" y="133" font-size="24" fill="#252c28" text-anchor="start" data-label="1">On time</text><text x="475.3333333333333" y="133" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Late / missing</text><path d="M44 149L676 149" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="149.33333333333331" y="196.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">1,000,000</text><text x="360.0" y="196.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">999,250</text><text x="570.6666666666666" y="196.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">750</text><path d="M44 221L676 221" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="305" width="632" height="60" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><rect x="44" y="305" width="474" height="60" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="416" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Budget: 1,000 misses · used 750 · remaining 250</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Late recovery does not erase a missed timeliness</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">objective.</text></svg>