<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="manifest-membership"><title id="title">Manifest-based file ingestion</title><desc id="desc">Manifest B42 lists three files with 400,350,250 rows. Their validated total is 1000. Unlisted backup files do not belong to this batch; the manifest is published after the referenced files are ready. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">The manifest declares the exact ingestible set.</text><rect x="44" y="132" width="632" height="240" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="54" y="117" width="170.0" height="28" fill="#fff" stroke="none" stroke-width="1.2"/><text x="64" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Manifest B42</text><rect x="70.0" y="190" width="185.33333333333334" height="100" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="162.66666666666669" y="222" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">f1</text><text x="162.66666666666669" y="252" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">400 rows</text><rect x="267.33333333333337" y="190" width="185.33333333333334" height="100" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.00000000000006" y="222" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">f2</text><text x="360.00000000000006" y="252" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">350 rows</text><rect x="464.6666666666667" y="190" width="185.33333333333334" height="100" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="557.3333333333334" y="222" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">f3</text><text x="557.3333333333334" y="252" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">250 rows</text><text x="44" y="433" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Unlisted backup file → excluded</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Validate listed files, versions, counts, and completeness.</text></svg>