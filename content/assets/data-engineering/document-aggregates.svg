<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="nested-document"><title id="title">Document aggregates</title><desc id="desc">Order O17 contains a delivery-address snapshot and its two lines, with subtotal 6200 USD cents. Customer and catalog identities remain outside the document. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">The order owns its lines and agreed values.</text><rect x="44" y="105" width="430" height="336" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="54" y="90" width="332.5" height="28" fill="#fff" stroke="none" stroke-width="1.2"/><text x="64" y="110" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Order O17 · one aggregate</text><rect x="66" y="151" width="386" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="259.0" y="186.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Address snapshot</text><rect x="66" y="226" width="386" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="259.0" y="261.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Adapter P40 · 2 × 2500 cents</text><rect x="66" y="301" width="386" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="259.0" y="336.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Case P90 · 1 × 1200 cents</text><text x="66" y="417" font-size="24" fill="#00855b" text-anchor="start" data-label="1">Subtotal: 6200 USD cents</text><text x="514" y="185" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Customer C8</text><text x="514" y="284" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Catalog</text><path d="M474 175L500 175" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M474 280L500 280" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Atomic within the order; independent entities stay outside.</text></svg>