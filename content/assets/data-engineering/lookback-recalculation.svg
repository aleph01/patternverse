<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="rolling-recompute-scope"><title id="title">Lookback recalculation</title><desc id="desc">The October 26 run recomputes days 23–25; the October 27 run recomputes 24–26. A late October 24 change revises EUR 100 to EUR 120, while October 10 requires a separate backfill. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Rebuild a recent range to absorb late changes.</text><path d="M80 380L660 380" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M100 374L100 386" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="100" y="415" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Oct 23</text><path d="M280 374L280 386" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="280" y="415" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">24</text><path d="M460 374L460 386" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="460" y="415" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">25</text><path d="M640 374L640 386" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="640" y="415" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">26</text><rect x="80" y="155" width="470" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="315.0" y="190.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Run Oct 26: days 23–25</text><rect x="250" y="270" width="410" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="455.0" y="305.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Run Oct 27: days 24–26</text><text x="44" y="454" font-size="24" fill="#00855b" text-anchor="start" data-label="1">Oct 24: EUR 100 → EUR 120</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Oct 10: separate backfill; lookback is a recovery horizon.</text></svg>