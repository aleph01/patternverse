<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1240" viewBox="0 0 360 1240" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Three separately enforced workload allowances</title><desc id="desc">A fixed allocation divides twenty worker permits into twelve for live processing, four for backfills, and four for exploration. Backfills at their four-permit limit cannot take the live allowance. Each class has its own admission boundary; all still depend on shared systems that need separate limits.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1240" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Each compartment has a limit</text><rect x="24" y="112" width="312" height="192" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="144" font-size="20" fill="#252c28">LIVE / 12 worker permits</text><rect x="40" y="184" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="72" y="184" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="104" y="184" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="136" y="184" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="168" y="184" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="200" y="184" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="40" y="216" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="72" y="216" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="104" y="216" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="136" y="216" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="168" y="216" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="200" y="216" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="280" font-size="17" fill="#626962">Backfills cannot borrow these.</text><rect x="24" y="384" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="416" font-size="19" fill="#252c28">BACKFILL / 4 permits / full</text><rect x="40" y="456" width="22" height="22" fill="#00855b" stroke="#00855b" stroke-width="1.2"/><rect x="72" y="456" width="22" height="22" fill="#00855b" stroke="#00855b" stroke-width="1.2"/><rect x="104" y="456" width="22" height="22" fill="#00855b" stroke="#00855b" stroke-width="1.2"/><rect x="136" y="456" width="22" height="22" fill="#00855b" stroke="#00855b" stroke-width="1.2"/><text x="40" y="512" font-size="16" fill="#626962">Excess work stays outside this lane.</text><rect x="24" y="624" width="312" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="656" font-size="19" fill="#252c28">EXPLORATION / 4 permits</text><rect x="40" y="696" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="72" y="696" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="104" y="696" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="136" y="696" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="752" font-size="17" fill="#626962">An independent admission limit.</text><rect x="24" y="864" width="312" height="192" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="896" font-size="19" fill="#252c28">20 permits / fixed 12 + 4 + 4</text><text x="40" y="940" font-size="17" fill="#626962">Unused capacity can remain idle.</text><text x="40" y="984" font-size="17" fill="#626962">Shared database and storage</text><text x="40" y="1028" font-size="17" fill="#626962">still need their own controls.</text><text x="24" y="1120" font-size="16" fill="#626962">Squares: concurrent worker permits.</text><text x="24" y="1160" font-size="16" fill="#626962">These are not CPU or memory units.</text><text x="24" y="1200" font-size="16" fill="#626962">The allocation is illustrative.</text></svg>
