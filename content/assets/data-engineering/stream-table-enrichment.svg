<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="branching-derivation"><title id="title">Stream-table enrichment</title><desc id="desc">Customer C17 changes North to South at 10:00. Event E901 happened at 09:58 and is processed at 10:03. Current-table enrichment returns South; historical event-time enrichment returns North. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Choose which version of the table an event sees.</text><rect x="44.0" y="225.0" width="202" height="90" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="145.0" y="278.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E901 · C17</text><path d="M246 270H305V140.0H380" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="403" y="130.0" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Latest available</text><rect x="398" y="148.0" width="278" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="537.0" y="183.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">South</text><path d="M246 270H305V400.0H380" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="403" y="390.0" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Event-time as-of</text><rect x="398" y="408.0" width="278" height="54" f