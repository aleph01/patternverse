<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="pointer-switch"><title id="title">Atomic publication</title><desc id="desc">Readers pin current R17 while immutable R18 files and its manifest are prepared. Validation completes before a conditional pointer switch exposes R18. Readers of R17 can finish against that release. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Expose a complete release with one visibility</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">change.</text><text x="44" y="123" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Before commit</text><text x="414" y="123" font-size="24" fill="#252c28" text-anchor="start" data-label="1">After commit</text><rect x="55.0" y="175.0" width="190" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="150.0" y="213.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Current</text><rect x="455.0" y="175.0" width="190" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="550.0" y="213.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Current</text><rect x="55.0" y="325.0" width="190" height="60" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="150.0" y="363.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">R17</text><rect x="455.0" y="325.0" width="190" height="60" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="550.0" y="363.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">R18</text><path d="M150 237L150 317" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M550 237L550 317" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M255 205L445 205" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="350" y="265" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Conditional switch</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Prepare → validate → commit pointer; readers pin once.</text></svg>