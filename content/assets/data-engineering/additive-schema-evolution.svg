<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="coexisting-fields"><title id="title">Additive schema evolution</title><desc id="desc">Existing event_time_s remains seconds 1700000000. New event_time_ms holds 1700000000123. Old records lack the new field; this is not the same as zero. Consumers migrate while both meanings remain explicit. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Introduce a new field without repurposing the old</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">one.</text><text x="54" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Record</text><text x="174.07999999999998" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">event_time_s</text><text x="395.28" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">event_time_ms</text><path d="M44 156L676 156" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="104.03999999999999" y="215.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Old</text><text x="274.67999999999995" y="215.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">1700000000</text><text x="530.64" y="215.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Absent</text><path d="M44 253L676 253" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="104.03999999999999" y="305.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">New</text><text x="274.67999999999995" y="305.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">1700000000</text><rect x="385.28" y="254" width="290.72" height="86" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="530.64" y="305.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">1700000000123</text><path d="M44 343L676 343" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Preserve the old meaning; define absence and fallback</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">explicitly.</text></svg>