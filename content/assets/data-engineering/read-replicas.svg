<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="replica-progress"><title id="title">Read replicas</title><desc id="desc">The primary has committed position 102 and status paid. Replica A has applied 102 and returns paid; B is at 101 and returns open. Read-your-writes requires waiting for the relevant commit and starting a fresh query snapshot. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Route reads according to the freshness they</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">require.</text><text x="54" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Reader</text><text x="268.88" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Applied position</text><text x="483.76" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Order status</text><path d="M44 156L676 156" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="151.44" y="206.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Primary</text><text x="366.32" y="206.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">102</text><text x="574.88" y="206.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Paid</text><path d="M44 235L676 235" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="151.44" y="278.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Replica A</text><rect x="258.88" y="236" width="214.88" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="366.32" y="278.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">102</text><rect x="473.76" y="236" width="202.24" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="574.88" y="278.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Paid</text><path d="M44 307L676 307" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="151.44" y="350.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Replica B</text><text x="366.32" y="350.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">101</text><text x="574.88" y="350.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Open</text><path d="M44 379L676 379" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">A replica’s existence does not imply it has applied your</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">write.</text></svg>