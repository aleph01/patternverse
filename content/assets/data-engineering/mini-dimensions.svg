<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="profile-links"><title id="title">Mini-dimensions: reusable profiles, historical fact assignments</title><desc id="desc">Customer 107 has profile 11 at a January sale and profile 13 at a March sale. Profile 12 can exist without any fact recording its use. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Capture volatile profiles at the fact’s moment.</text><text x="54" y="123" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Sale</text><text x="212.0" y="123" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Customer</text><text x="370.0" y="123" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Profile</text><text x="528.0" y="123" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Amount</text><path d="M44 139L676 139" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="123.0" y="179.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Jan 12</text><text x="281.0" y="179.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">107</text><rect x="360.0" y="147" width="158.0" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="439.0" y="179.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">11</text><text x="597.0" y="179.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">100</text><path d="M44 198L676 198" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="231.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Mar 16</text><text x="281.0" y="231.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">107</text><rect x="360.0" y="199" width="158.0" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="439.0" y="231.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">13</text><text x="597.0" y="231.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">60</text><path d="M44 250L676 250" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="54" y="334" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Profile</text><text x="264.66666666666663" y="334" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Tier</text><text x="475.3333333333333" y="334" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Activity</text><path d="M44 350L676 350" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="149.33333333333331" y="386.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">11</text><text x="360.0" y="386.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Standard</text><text x="570.6666666666666" y="386.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Low</text><path d="M44 400L676 400" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="149.33333333333331" y="429.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">12</text><text x="360.0" y="429.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Standard</text><text x="570.6666666666666" y="429.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">High</text><path d="M44 443L676 443" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="444" width="210.6