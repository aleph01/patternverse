<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1080" viewBox="0 0 360 1080" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Reconstruct from accepted facts</title><desc id="desc">An authoritative stream contains Opened 20 at revision one, Reserved R1 three at revision two, and Released R1 one at revision three. Applying the first two events yields seventeen available seats; applying all three yields eighteen. Neither reconstruction sends a confirmation.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1080" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Facts reconstruct state</text><rect x="24" y="112" width="312" height="96" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">1 / Opened</text><text x="40" y="167" font-size="17" fill="#626962">Capacity: 20 seats</text><path d="M180 208V270" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="272" width="312" height="96" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="301" font-size="20" fill="#252c28">2 / Reserved</text><text x="40" y="327" font-size="17" fill="#626962">R1 holds 3 seats</text><path d="M180 368V430" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="432" width="312" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="461" font-size="20" fill="#252c28">Replay revisions 1–2</text><text x="40" y="487" font-size="17" fill="#626962">20 − 3 = 17 available</text><text x="40" y="526" font-size="17" fill="#626962">R1 holds 3 seats</text><path d="M180 552V614" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="594" font-size="16" fill="#626962">next fact</text><rect x="24" y="616" width="312" height="96" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="645" font-size="20" fill="#252c28">3 / Released</text><text x="40" y="671" font-size="17" fill="#626962">R1 releases 1 seat</text><path d="M180 712V774" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="776" width="312" height="136" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="805" font-size="20" fill="#252c28">Replay revisions 1–3</text><text x="40" y="831" font-size="17" fill="#626962">20 − 3 + 1 = 18 available</text><text x="40" y="882" font-size="17" fill="#626962">R1 holds 2 seats</text><text x="24" y="998" font-size="16" fill="#626962">Arrows: ordered application of facts.</text><text x="24" y="1034" font-size="16" fill="#626962">Rebuild state; send no confirmations.</text></svg>
