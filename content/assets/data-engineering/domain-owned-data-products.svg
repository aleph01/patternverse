<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="ownership-dependencies"><title id="title">Domain-owned data products</title><desc id="desc">Payments owns capture and refund facts. Finance owns net collections derived from those products. A shared platform provides infrastructure,while each domain owns its semantics,quality,and consumer-facing commitments. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Put product accountability with the domain that</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">knows it.</text><rect x="44" y="130" width="280" height="250" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="54" y="115" width="120.0" height="28" fill="#fff" stroke="none" stroke-width="1.2"/><text x="64" y="135" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Payments</text><rect x="396" y="130" width="280" height="250" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="406" y="115" width="107.5" height="28" fill="#fff" stroke="none" stroke-width="1.2"/><text x="416" y="135" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Finance</text><text x="73" y="213" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Captures</text><text x="73" y="280" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Refunds</text><text x="425" y="247" font-size="26" fill="#00855b" text-anchor="start" data-label="1">Net collections</text><path d="M330 247L388 247" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M44 431L676 431" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="360" y="474" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Shared platform and common interoperability rules</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">A derived product has its own owner and upstream</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">dependencies.</text></svg>