<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="state-sequence"><title id="title">Keep previous values: SCD Type 3</title><desc id="desc">Each pair is current region / previous region on key 107. The October overwrite drops East; this is not an as-of history. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Keep one previous value beside the current one.</text><text x="150" y="139" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">January</text><rect x="60" y="191" width="180" height="90" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="150.0" y="230.66" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Current: East</text><text x="150.0" y="257.65999999999997" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Previous: —</text><path d="M240 236L264 236" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="360" y="139" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">July</text><rect x="270" y="191" width="180" height="90" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="360.0" y="230.66" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Current: West</text><text x="360.0" y="257.65999999999997" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Previous: East</text><path d="M450 236L474 236" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="570" y="139" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">October</text><rect x="480" y="191" width="180" height="90" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="570.0" y="230.98" font-size="22" fill="#00855b" text-anchor="middle" data-label="1">Current: Central</text><text x="570.0" y="255.98" font-size="22" fill="#00855b" text-anchor="middle" data-label="1">Previous: West</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Key 107 stays fixed; East is no longer retained.</text></svg>