<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="compatibility-matrix"><title id="title">Compatibility checks in delivery</title><desc id="desc">Writer W8 is compatible with reader R8 but not deployed reader R7. Writer W7 works with both. A delivery check must cover live combinations and relevant retained data,not only the newest pair. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Test the producer-reader pairs that can coexist.</text><text x="54" y="147" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Writer ↓ / Reader →</text><text x="407.92" y="147" font-size="24" fill="#252c28" text-anchor="start" data-label="1">R7</text><text x="546.96" y="147" font-size="24" fill="#252c28" text-anchor="start" data-label="1">R8</text><path d="M44 163L676 163" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="220.96" y="222.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">W7</text><rect x="397.92" y="171" width="139.04000000000002" height="86" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="467.44000000000005" y="222.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Pass</text><rect x="536.96" y="171" width="139.03999999999996" height="86" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="606.48" y="222.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Pass</text><path d="M44 260L676 260" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="220.96" y="312.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">W8</text><text x="467.44000000000005" y="312.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Fail</text><rect x="536.96" y="261" width="139.03999999999996" height="86" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="606.48" y="312.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Pass</text><path d="M44 350L676 350" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">W8 cannot roll out safely while an R7 consumer still needs</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">it.</text></svg>