<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="pruning-comparison"><title id="title">Partition by access pattern</title><desc id="desc">A query for October 25 can prune three of four daily partitions. Hash partitions contain dates from all days, requiring all four to be considered for the same date filter. The tradeoff depends on actual queries. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Choose boundaries that match the filters people</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">use.</text><text x="44" y="130" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Filter: date = Oct 25</text><rect x="44.0" y="165" width="149.0" height="70" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="118.5" y="197" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Oct 23</text><rect x="205.0" y="165" width="149.0" height="70" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="279.5" y="197" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Oct 24</text><rect x="366.0" y="165" width="149.0" height="70" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="440.5" y="197" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Oct 25</text><rect x="527.0" y="165" width="149.0" height="70" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="601.5" y="197" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Oct 26</text><text x="44" y="304" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Date filter over hash partitions</text><rect x="44.0" y="340" width="149.0" height="70" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="118.5" y="372" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Mixed dates</text><rect x="205.0" y="340" width="149.0" height="70" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="279.5" y="372" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Mixed dates</text><rect x="366.0" y="340" width="149.0" height="70" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="440.5" y="372" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Mixed dates</text><rect x="527.0" y="340" width="149.0" height="70" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="601.5" y="372" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Mixed dates</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Partition keys help only when the query can prune</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">boundaries.</text></svg>