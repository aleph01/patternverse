<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1072" viewBox="0 0 720 1072" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Data downstream, capacity upstream</title><desc id="desc">Without feedback, a source offering five thousand records per second feeds a sink processing two thousand; a buffer with six thousand free places fills in two seconds. With feedback, downstream capacity limits upstream admission. Data moves downstream while a separate capacity signal travels upstream; excess work remains outside the controlled boundary.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="data" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#252c28" stroke-width="1.2"/></marker></defs><rect width="720" height="1072" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Data downstream, capacity upstream</text><text x="24" y="104" font-size="22" fill="#252c28">Without feedback</text><rect x="24" y="152" width="176" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="184" font-size="20" fill="#252c28">Source</text><text x="40" y="226" font-size="17" fill="#626962">5,000 offered / s</text><rect x="272" y="152" width="176" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="288" y="184" font-size="20" fill="#252c28">Buffer</text><text x="288" y="226" font-size="17" fill="#626962">6,000 free places</text><rect x="520" y="152" width="176" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="536" y="184" font-size="20" fill="#252c28">Sink</text><text x="536" y="226" font-size="17" fill="#626962">2,000 done / s</text><path d="M200 208H270" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#data)"/><path d="M448 208H518" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#data)"/><rect x="24" y="312" width="672" height="120" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="348" font-size="22" fill="#252c28">5,000 − 2,000 = 3,000 queued records / s</text><text x="40" y="396" font-size="20" fill="#626962">6,000 free places / 3,000 per s = 2 s to fill</text><text x="24" y="504" font-size="22" fill="#252c28">With feedback</text><rect x="24" y="560" width="176" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="596" font-size="19" fill="#252c28">Pause / resume</text><text x="40" y="650" font-size="17" fill="#626962">Read on demand</text><rect x="272" y="560" width="176" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="288" y="596" font-size="19" fill="#252c28">Bounded stages</text><text x="288" y="650" font-size="17" fill="#626962">Count unfinished</text><rect x="520" y="560" width="176" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="536" y="596" font-size="19" fill="#252c28">Sink capacity</text><text x="536" y="650" font-size="17" fill="#626962">Permits more work</text><path d="M200 610H270" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#data)"/><path d="M448 610H518" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#data)"/><path d="M608 688V760H112V690" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="248" y="742" font-size="19" fill="#252c28">Capacity feedback / permission</text><rect x="24" y="832" width="672" height="152" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="868" font-size="22" fill="#252c28">Unadmitted work stays outside this boundary</text><text x="40" y="914" font-size="19" fill="#626962">Feedback does not increase the sink’s capacity or erase backlog.</text><text x="40" y="956" font-size="19" fill="#626962">A source that cannot pause needs an explicit overload policy.</text><text x="24" y="1030" font-size="18" fill="#626962">Forward arrows: data. Return arrow: capacity feedback.</text></svg>
