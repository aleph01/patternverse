<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="boundary-reduction"><title id="title">Predicate and projection pushdown</title><desc id="desc">A query for tenant 7 needs only ID and amount. Source-side filtering selects E1 amount 20 and E3 amount 30; only these two projected records cross the execution boundary. Tenant is needed for filtering but need not be returned. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Filter rows and select columns near the source.</text><text x="54" y="127" font-size="24" fill="#252c28" text-anchor="start" data-label="1">ID</text><text x="212.0" y="127" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Tenant</text><text x="370.0" y="127" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Amount</text><text x="528.0" y="127" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Payload</text><path d="M44 143L676 143" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="44" y="151" width="158.0" height="44" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="123.0" y="181.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">E1</text><text x="281.0" y="181.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">7</text><rect x="360.0" y="151" width="158.0" height="44" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="439.0" y="181.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">20</text><text x="597.0" y="181.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">…</text><path d="M44 198L676 198" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="229.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E2</text><text x="281.0" y="229.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">8</text><text x="439.0" y="229.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">90</text><text x="597.0" y="229.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">…</text><path d="M44 246L676 246" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="247" width="158.0" height="44" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="123.0" y="277.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">E3</text><text x="281.0" y="277.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">7</text><rect x="360.0" y="247" width="158.0" height="44" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="439.0" y="277.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">30</text><text x="597.0" y="277.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">…</text><path d="M44 294L676 294" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="325.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E4</text><text x="281.0" y="325.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">9</text><text x="439.0" y="325.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">80</text><text x="597.0" y="325.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">…</text><path d="M44 342L676 342" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><path d="M44 392L676 392" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 5"/><text x="44" y="435" font-size="26" fill="#00855b" text-anchor="start" data-label="1">Across boundary: (E1, 20), (E3, 30)</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Verify semantic equivalence and actual execution</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">placement.</text></svg>