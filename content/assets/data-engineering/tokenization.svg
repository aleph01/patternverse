<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc"><title id="title">Tokenization: use the reference, protect the mapping</title><desc id="desc">A vault-based example shows C17, C28 and C17 becoming T_A7, T_K2 and T_A7. Repeated input retains equality within one scope. The original references and recovery mapping have restricted access; analysts receive tokens.</desc><style>
:root{color-scheme:only light;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b}
svg{background:#fff;color:var(--ink)}
path,rect,line,circle{stroke-linejoin:round;stroke-linecap:butt}
text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:26px;font-weight:400;fill:var(--ink)}
.small{font-size:23px}.accent-text{fill:var(--green)}
.hair{fill:none;stroke:var(--line);stroke-width:1.2}.line{fill:none;stroke:var(--ink);stroke-width:1.5}.accent{fill:none;stroke:var(--green);stroke-width:1.8}
.stone{fill:var(--stone)}.mint{fill:var(--mint)}.paper{fill:#fff;stroke:var(--line);stroke-width:1.2}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="50" class="" text-anchor="start">Original references</text><text x="446" y="50" class="" text-anchor="start">Analyst view</text><rect x="44" y="88" width="282" height="305" class="stone"/><path d="M349 95V366" class="accent" /><text x="349" y="81" class="small accent-text" text-anchor="middle">Replace</text><rect x="93" y="116" width="148" height="53" class="paper"/><text x="167" y="152" class="" text-anchor="middle">C17</text><path d="M241 143H485" class="accent" marker-end="url(#arrow)"/><rect x="491" y="116" width="168" height="53" class="mint"/><text x="575" y="152" class="accent-text" text-anchor="middle">T_A7</text><rect x="93" y="203" width="148" height="53" class="paper"/><text x="167" y="239" class="" text-anchor="middle">C28</text><path d="M241 230H485" class="accent" marker-end="url(#arrow)"/><rect x="491" y="203" width="168" height="53" class="mint"/><text x="575" y="239" class="accent-text" text-anchor="middle">T_K2</text><rect x="93" y="290" width="148" height="53" class="paper"/><text x="167" y="326" class="" text-anchor="middle">C17</text><path d="M241 317H485" class="accent" marker-end="url(#arrow)"/><rect x="491" y="290" width="168" height="53" class="mint"/><text x="575" y="326" class="accent-text" text-anchor="middle">T_A7</text><path d="M169 393V426H44" class="hair" /><text x="44" y="455" class="small" text-anchor="start">Restricted mapping</text><text x="44" y="497" class="small" text-anchor="start">C17 ↔ T_A7</text><text x="224" y="497" class="small" text-anchor="start">C28 ↔ T_K2</text><path d="M659 144H680V318H659" class="hair" /><text x="662" y="375" class="small" text-anchor="end">Same input,</text><text x="662" y="406" class="small" text-anchor="end">same token.</text><path d="M44 530H676" class="hair" /><text x="44" y="553" class="small" text-anchor="start">One token scope; illustrative shortened tokens.</text></svg>