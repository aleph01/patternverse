<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="versioned-cache-key"><title id="title">Result caching</title><desc id="desc">The cache key includes tenant 7,date October 25,metric logic m2,access scope p3,and snapshot v42. Snapshot v43 uses a new key for result 110, so an old v42 fill of 100 cannot replace it. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Reuse a result only within its validity scope.</text><text x="54" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Key context</text><text x="559.6" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Result</text><path d="M44 153L676 153" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="296.8" y="212.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">T7 · Oct 25 · m2 · p3 · v42</text><text x="612.8" y="212.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">100</text><path d="M44 249L676 249" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="250" width="505.6" height="85" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="296.8" y="301.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">T7 · Oct 25 · m2 · p3 · v43</text><rect x="549.6" y="250" width="126.39999999999998" height="85" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="612.8" y="301.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">110</text><path d="M44 338L676 338" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Include data version, logic, parameters, and authorization</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">scope.</text></svg>