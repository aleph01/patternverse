<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="allowed-location-map"><title id="title">Location-aware placement</title><desc id="desc">Tenant T17 permits regions A and B. Its primary is in A and recovery copy in B; region C is excluded. Workers, logs, replicas, and supporting copies are part of the placement boundary. Allowed placement does not itself authorize access. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Place every relevant copy inside its allowed</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">locations.</text><rect x="44.0" y="160" width="202.66666666666666" height="160" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="145.33333333333331" y="192" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Region A</text><text x="145.33333333333331" y="222" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Primary</text><text x="145.33333333333331" y="252" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Processing / temp</text><text x="145.33333333333331" y="282" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Logs</text><rect x="258.66666666666663" y="160" width="202.66666666666666" height="160" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="359.99999999999994" y="192" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Region B</text><text x="359.99999999999994" y="222" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Recovery</text><rect x="473.3333333333333" y="160" width="202.66666666666666" height="160" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="574.6666666666666" y="192" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Region C</text><text x="574.6666666666666" y="222" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Excluded</text><path d="M44 375V385H461V375" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="252.5" y="420" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">T17 allowed locations</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Account for processing, logs, replicas, and recovery</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">copies.</text></svg>