<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="coordinated-recovery"><title id="title">Checkpoint and resume</title><desc id="desc">Checkpoint C17 stores next offset 104 and state 100. Processing offsets 104 plus 20 and 105 plus 30 reaches 150, but a crash restores C17 and replays both. Sink effects must be coordinated or idempotent. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Restore a mutually consistent position and state.</text><rect x="44" y="141" width="632" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="176.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">C17: next offset 104 · state 100</text><path d="M150 212L150 270" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="44" y="282" width="275" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="181.5" y="317.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">104 +20 → 120</text><rect x="401" y="282" width="275" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="538.5" y="317.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">105 +30 → 150</text><path d="M325 309L392 309" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M535 350V422H30V168H38" fill="none" stroke="#00855b" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="340" y="466" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Crash → restore C17 → replay 104 and 105</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">A source offset alone is not a complete checkpoint.</text></svg>