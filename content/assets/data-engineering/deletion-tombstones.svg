<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="version-barrier"><title id="title">Deletion tombstones prevent stale updates from restoring deleted data</title><desc id="desc">Customer C17 version 40 exists, version 42 deletes it, and a delayed version 41 update is rejected. The tombstone must survive the possible replay horizon. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Remember the deletion so stale updates stay</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">deleted.</text><text x="54" y="143" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Arrives</text><text x="193.04" y="143" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Operation</text><text x="414.24" y="143" font-size="24" fill="#252c28" text-anchor="start" data-label="1">State</text><path d="M44 159L676 159" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="113.52" y="209.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">v40</text><text x="293.64" y="209.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Upsert C17</text><text x="540.12" y="209.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Present</text><path d="M44 238L676 238" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="113.52" y="281.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">v42</text><text x="293.64" y="281.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Delete C17</text><rect x="404.24" y="239" width="271.76" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="540.12" y="281.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Deleted at v42</text><path d="M44 310L676 310" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="113.52" y="353.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">v41</text><text x="293.64" y="353.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Late upsert</text><rect x="404.24" y="311" width="271.76" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="540.12" y="353.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Reject: 41 &lt; 42</text><path d="M44 382L676 382" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Discarding the tombstone too soon can resurrect C17.</text></svg>