<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="relationship-map"><title id="title">Star schema</title><desc id="desc">One posted sale-line fact carries quantity and net sales, and references unique Date, Product, Store and Customer dimension keys. Each dimension is lookup context; joins preserve the fact rows. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Facts carry measures; dimensions give context.</text><path d="M250 250H240V143H225" fill="none" stroke="#00855b" stroke-width="1.2"/><path d="M470 250H480V143H495" fill="none" stroke="#00855b" stroke-width="1.2"/><path d="M250 306H240V405H225" fill="none" stroke="#00855b" stroke-width="1.2"/><path d="M470 306H480V405H495" fill="none" stroke="#00855b" stroke-width="1.2"/><rect x="45.0" y="113.0" width="180" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="135.0" y="151.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Date</text><text x="135" y="201" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Calendar context</text><rect x="495.0" y="113.0" width="180" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="585.0" y="151.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Product</text><text x="585" y="201" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Product context</text><rect x="45.0" y="375.0" width="180" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="135.0" y="413.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Store</text><text x="135" y="463" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Store context</text><rect x="495.0" y="375.0" width="180" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="585.0" y="413.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Customer</text><text x="585" y="463" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Customer context</text><rect x="250" y="223" width="220" height="110" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="360" y="263" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Sale line</text><text x="360" y="304" font-size="22" fill="#00855b" text-anchor="middle" data-label="1">quantity · net sales</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Many facts can reference one dimension member.</text></svg>