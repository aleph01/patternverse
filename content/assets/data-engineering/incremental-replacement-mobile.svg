<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1090" viewBox="0 0 360 1090" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One authoritative publisher for each migrated cohort</title><desc id="desc">Tenant cohorts A, B, and C start with the old publisher. Successive handovers move A, then B, then C to the new publisher. Each cohort has one authoritative publisher per stage. Preparation and stale-writer fencing precede authority transfer; rollback requires current and representable data.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1090" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Move publishing authority</text><text x="24" y="84" font-size="17" fill="#626962">Stateful cohort example; not the code.</text><rect x="24" y="112" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="150" font-size="22" fill="#252c28">Stage 0</text><text x="40" y="194" font-size="20" fill="#252c28">A: old · B: old · C: old</text><text x="40" y="232" font-size="17" fill="#626962">One publisher for each cohort</text><rect x="24" y="288" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="326" font-size="22" fill="#252c28">Stage 1</text><text x="40" y="370" font-size="20" fill="#252c28">A: new · B: old · C: old</text><text x="40" y="408" font-size="17" fill="#626962">One publisher for each cohort</text><rect x="24" y="464" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="502" font-size="22" fill="#252c28">Stage 2</text><text x="40" y="546" font-size="20" fill="#252c28">A: new · B: new · C: old</text><text x="40" y="584" font-size="17" fill="#626962">One publisher for each cohort</text><rect x="24" y="640" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="678" font-size="22" fill="#252c28">Stage 3</text><text x="40" y="722" font-size="20" fill="#252c28">A: new · B: new · C: new</text><text x="40" y="760" font-size="17" fill="#626962">One publisher for each cohort</text><text x="24" y="876" font-size="21" fill="#252c28">Before each handover:</text><text x="24" y="918" font-size="18" fill="#252c28">Catch up to a checkpoint.</text><text x="24" y="956" font-size="18" fill="#252c28">Stop or fence stale publishers.</text><text x="24" y="994" font-size="18" fill="#252c28">Then enable the new publisher.</text><text x="24" y="1050" font-size="18" fill="#626962">Rollback needs current data.</text></svg>
