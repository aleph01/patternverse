<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="event-time-retention"><title id="title">Allowed lateness</title><desc id="desc">For window [10:00,10:05) with ten minutes of allowed lateness, an event arriving at watermark 10:09 updates 100 to 120. At watermark 10:16, a further event goes to a separate correction route. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Retain window state for a defined correction</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">horizon.</text><path d="M90 370L660 370" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M90 364L90 376" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="90" y="405" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10:05</text><path d="M300 364L300 376" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="300" y="405" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10:09</text><path d="M545 364L545 376" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="545" y="405" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10:15</text><path d="M660 364L660 376" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="660" y="405" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10:16</text><rect x="90" y="170" width="455" height="80" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="317.5" y="218.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Correction state retained</text><path d="M545 130L545 400" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="4 4"/><text x="300" y="302" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">+20 → 120</text><text x="565" y="460" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">+5 → correction route</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">The horizon follows watermark progress, not wall-clock</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">delay.</text></svg>