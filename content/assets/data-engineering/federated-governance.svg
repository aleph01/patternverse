<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="shared-rules-local-decisions"><title id="title">Federated governance</title><desc id="desc">Domains choose their own models within shared interoperability and policy rules. Platform checks enforce computable requirements. Feedback and explicit exceptions connect local experience to changes in common rules. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Agree on shared rules and let domains apply</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">them.</text><rect x="125" y="125" width="470" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="160.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Shared rules</text><path d="M360 185L170 265" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="45.0" y="270.0" width="250" height="90" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="170.0" y="323.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Payments</text><text x="170" y="397" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Local models</text><path d="M360 185L550 265" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="425.0" y="270.0" width="250" height="90" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="550.0" y="323.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Finance</text><text x="550" y="397" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Local models</text><path d="M550 422V469H170V422" fill="none" stroke="#00855b" stroke-width="1.2"/><text x="360" y="512" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Checks, feedback, and governed exceptions</text></svg>