<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Reconstruct from accepted facts</title><desc id="desc">An authoritative stream contains Opened 20 at revision one, Reserved R1 three at revision two, and Released R1 one at revision three. Applying the first two events yields seventeen available seats; applying all three yields eighteen. Neither reconstruction sends a confirmation.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="920" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Accepted facts are the authoritative record</text><rect x="24" y="112" width="672" height="300" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="144" font-size="20" fill="#252c28">POOL-1 / ordered event stream</text><rect x="48" y="168" width="624" height="64" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="197" font-size="20" fill="#252c28">1 / Opened</text><text x="64" y="223" font-size="17" fill="#626962">Capacity: 20 seats</text><rect x="48" y="248" width="624" height="64" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="277" font-size="20" fill="#252c28">2 / Reserved</text><text x="64" y="303" font-size="17" fill="#626962">Reservation R1: 3 seats</text><rect x="48" y="328" width="624" height="64" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="357" font-size="20" fill="#252c28">3 / Released</text><text x="64" y="383" font-size="17" fill="#626962">Reservation R1: 1 seat</text><path d="M180 412V558" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="492" font-size="17" fill="#626962">apply revisions 1–2</text><path d="M540 412V558" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="384" y="492" font-size="17" fill="#626962">apply revisions 1–3</text><rect x="24" y="560" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="589" font-size="20" fill="#252c28">State at revision 2</text><text x="40" y="615" font-size="17" fill="#626962">20 − 3 = 17 available</text><text x="40" y="684" font-size="18" fill="#626962">R1 holds 3 seats</text><rect x="384" y="560" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="589" font-size="20" fill="#252c28">State at revision 3</text><text x="400" y="615" font-size="17" fill="#626962">20 − 3 + 1 = 18 available</text><text x="400" y="684" font-size="18" fill="#626962">R1 holds 2 seats</text><text x="24" y="818" font-size="18" fill="#252c28">Arrows: replay the selected prefix into derived state.</text><text x="24" y="858" font-size="17" fill="#626962">Neither path sends a confirmation or rewrites the event stream.</text></svg>
