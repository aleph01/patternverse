<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="gap-bridging"><title id="title">Session windows</title><desc id="desc">With a 30-minute inactivity gap, 09:00 and 09:10 form one session while 09:50 starts another. A late 09:30 event bridges both gaps if the state and lateness policy still allow merging. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">A late event can connect two sessions.</text><text x="44" y="109" font-size="24" fill="#252c28" text-anchor="start" data-label="1">30-minute inactivity gap</text><path d="M100 365L650 365" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M100 359L100 371" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="100" y="400" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">09:00</text><path d="M210 359L210 371" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="210" y="400" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">09:10</text><path d="M430 359L430 371" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="430" y="400" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">09:30</text><path d="M650 359L650 371" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="650" y="400" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">09:50</text><rect x="80" y="165" width="155" height="80" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><rect x="620" y="165" width="50" height="80" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="150" y="140" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Session 1</text><text x="610" y="140" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Session 2</text><circle cx="100" cy="205" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><circle cx="210" cy="205" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><circle cx="650" cy="205" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><circle cx="430" cy="205" r="8" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><text x="430" y="289" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Late arrival</text><path d="M210 205H430H650" fill="none" stroke="#00855b" stroke-width="2"/><path d="M80 405V415H670V405" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="375.0" y="450" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Merged session when state is still available</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Session membership depends on the gap, not fixed clock</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">bins.</text></svg>