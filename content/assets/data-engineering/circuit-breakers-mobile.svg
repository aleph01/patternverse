<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1344" viewBox="0 0 360 1344" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Circuit breaker states and recovery rules</title><desc id="desc">Closed admits calls and observes classified outcomes. A threshold opens the breaker and rejects new calls. After a cooldown, a subsequent call may enter half-open as a limited probe. A successful qualifying probe closes the breaker; a failed probe reopens it and restarts the cooldown.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1344" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Admission follows breaker state</text><rect x="24" y="112" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="18" fill="#252c28">CLOSED / admit normal calls</text><text x="40" y="167" font-size="16" fill="#626962">Observe classified outcomes.</text><path d="M224 240V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="300" font-size="17" fill="#626962">Threshold reached</text><rect x="24" y="352" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="381" font-size="18" fill="#252c28">OPEN / reject new calls</text><text x="40" y="407" font-size="16" fill="#626962">No dependency invocation.</text><path d="M224 480V590" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="540" font-size="17" fill="#626962">Cooldown + next call</text><rect x="24" y="592" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="621" font-size="18" fill="#252c28">HALF-OPEN / limited probe</text><text x="40" y="647" font-size="16" fill="#626962">Test the protected operation.</text><text x="24" y="808" font-size="20" fill="#252c28">Probe outcomes / alternatives</text><rect x="24" y="848" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="877" font-size="18" fill="#252c28">Success / return to CLOSED</text><text x="40" y="903" font-size="16" fill="#626962">Reset the chosen history.</text><rect x="24" y="1040" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1069" font-size="18" fill="#252c28">Failure / return to OPEN</text><text x="40" y="1095" font-size="16" fill="#626962">Restart the cooldown.</text><text x="24" y="1224" font-size="16" fill="#626962">An inconclusive model probe reopens.</text><text x="24" y="1264" font-size="16" fill="#626962">Cooldown permits testing, not full traffic.</text><text x="24" y="1304" font-size="16" fill="#626962">Arrows: state changes; not call retries.</text></svg>
