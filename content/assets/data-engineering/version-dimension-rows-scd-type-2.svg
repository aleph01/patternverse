<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="time-intervals"><title id="title">Version dimension rows: SCD Type 2</title><desc id="desc">Two surrogate rows preserve the region history. A late-arriving June event still joins to key 107. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Choose the dimension row valid at event time.</text><text x="44" y="138" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Key 107 · East</text><rect x="110" y="155" width="280" height="50" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="250.0" y="188.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">[Jan 1, Jul 1)</text><text x="44" y="233" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Key 208 · West</text><rect x="390" y="250" width="275" height="50" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="527.5" y="283.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">[Jul 1, ∞)</text><path d="M100 440L665 440" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M110 434L110 446" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="110" y="475" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Jan 1</text><path d="M390 434L390 446" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="390" y="475" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Jul 1</text><path d="M665 434L665 446" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="665" y="475" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Later</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">June sale → 107; July sale → 208</text><circle cx="340" cy="343" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><text x="340" y="363" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">June sale, received in August</text><text x="340" y="399" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">→ key 107</text><path d="M340 332L340 211" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/></svg>