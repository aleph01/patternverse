<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1056" viewBox="0 0 720 1056" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">The example rejects full-subscription fan-out and explicitly drops deleted backlog</title><desc id="desc">Notifications has two pending messages and a capacity of two. A third publication is rejected before any queue changes, even though fulfillment has space. After notifications is unsubscribed and its backlog discarded, a later publication targets only fulfillment and analytics. This is the simulation’s chosen capacity policy, not a universal broker guarantee.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1056" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">A bounded fan-out policy makes backpressure visible</text><rect x="24" y="100" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="129" font-size="20" fill="#252c28">Before publication E903: capacity 2 per queue</text><text x="40" y="155" font-size="17" fill="#626962">Fulfillment 0/2; analytics 1/2; notifications 2/2: full</text><path d="M360 212V326" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="270" font-size="17" fill="#626962">preflight</text><rect x="24" y="328" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="357" font-size="20" fill="#252c28">Notifications is full: reject before enqueue</text><text x="40" y="383" font-size="17" fill="#626962">All target queues are checked first.</text><text x="40" y="438" font-size="17" fill="#626962">Queue sizes remain 0/2, 1/2, and 2/2.</text><path d="M360 472V582" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="526" font-size="17" fill="#626962">unsubscribe notifications</text><rect x="24" y="584" width="672" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="613" font-size="20" fill="#252c28">Delete the notifications subscription</text><text x="40" y="639" font-size="17" fill="#626962">Its pending E901 and E902 are discarded.</text><path d="M360 696V806" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="750" font-size="17" fill="#626962">publish E903 again</text><rect x="24" y="808" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="837" font-size="20" fill="#252c28">Two targets now receive E903</text><text x="40" y="863" font-size="17" fill="#626962">Fulfillment 1/2; analytics 2/2; returned enqueue count: 2</text><text x="40" y="918" font-size="17" fill="#626962">This does not mean their consumers finished.</text><text x="24" y="1010" font-size="18" fill="#252c28">Sequential queue-full rejection is not crash-atomic delivery.</text></svg>
