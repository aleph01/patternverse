<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="version-reference"><title id="title">Surrogate keys distinguish entity and version</title><desc id="desc">Customer identity 731 has Bronze version 8101 before June and Gold version 8102 from June. April and August sales reference the appropriate versions. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Entity identity continues; profile keys change.</text><rect x="44" y="105" width="632" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="360.0" y="140.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Durable customer identity 731</text><text x="54" y="220" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Profile key</text><text x="264.66666666666663" y="220" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Tier</text><text x="475.3333333333333" y="220" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Referenced by</text><path d="M44 236L676 236" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="44" y="244" width="210.66666666666666" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="149.33333333333331" y="276.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">8101</text><text x="360.0" y="276.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Bronze</text><text x="570.6666666666666" y="276.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">April sale</text><path d="M44 295L676 295" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="296" width="210.66666666666666" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="149.33333333333331" y="328.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">8102</text><text x="360.0" y="328.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Gold</text><text x="570.6666666666666" y="328.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">August sale</text><path d="M44 347L676 347" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">A profile version has its own surrogate key.</text></svg>