<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="authorized-slice"><title id="title">Row- and column-level access</title><desc id="desc">The underlying orders include A/O1/1000, A/O2/500, and B/O3/900. The tenant-A analyst query returns only O1/1000 and O2/500; B’s row is excluded. Email is not selectable under this policy. Source context and permitted result are separate. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Restrict both which records and which fields are</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">visible.</text><text x="44" y="125" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Underlying orders · email values omitted</text><text x="54" y="173" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Tenant</text><text x="180.4" y="173" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Order</text><text x="306.8" y="173" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Amount</text><text x="458.48" y="173" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Row access</text><path d="M44 189L676 189" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="107.2" y="228.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">A</text><text x="233.60000000000002" y="228.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">O1</text><text x="372.64" y="228.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">1000</text><text x="562.24" y="228.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Included</text><path d="M44 246L676 246" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="107.2" y="278.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">A</text><text x="233.60000000000002" y="278.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">O2</text><text x="372.64" y="278.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">500</text><text x="562.24" y="278.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Included</text><path d="M44 296L676 296" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="107.2" y="328.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">B</text><text x="233.60000000000002" y="328.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">O3</text><text x="372.64" y="328.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">900</text><text x="562.24" y="328.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Excluded</text><path d="M44 346L676 346" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="376" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Protected email column: not selectable</text><text x="44" y="414" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Permitted query result for tenant A</text><rect x="44" y="435" width="632" height="65" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="476.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">O1 / 1000 · O2 / 500</text><text x="44" y="542" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Tenant B’s row is absent from the returned result.</text></svg>