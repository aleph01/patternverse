<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1320" viewBox="0 0 360 1320" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Consumer test and provider verification share one contract</title><desc id="desc">The real stock reader runs against a controlled interaction and produces a versioned consumer contract. Separately, a verifier arranges provider state and calls the candidate inventory API with the same request. Its actual response is checked against that contract. Consumer success alone and provider success alone leave different evidence gaps.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1320" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Connect the two checks</text><text x="24" y="84" font-size="19" fill="#626962">1 Consumer test · reader-3</text><rect x="24" y="112" width="312" height="88" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="150" font-size="22" fill="#252c28">Real stock reader</text><text x="40" y="182" font-size="17" fill="#626962">Makes request; interprets reply</text><path d="M72 200V256" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="234" font-size="18" fill="#626962">GET /stock/S17</text><rect x="24" y="260" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="298" font-size="22" fill="#252c28">Controlled provider</text><text x="40" y="334" font-size="19" fill="#252c28">Example reply: 4 EA</text><text x="40" y="362" font-size="17" fill="#626962">Reader assertion must pass</text><path d="M72 372V436" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="412" font-size="17" fill="#626962">Publish tested agreement</text><rect x="24" y="440" width="312" height="208" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="478" font-size="22" fill="#252c28">Contract · reader-3</text><text x="40" y="514" font-size="18" fill="#252c28">GET /stock/S17 → 200</text><text x="40" y="548" font-size="17" fill="#252c28">available: integer · unit: EA</text><text x="40" y="582" font-size="18" fill="#252c28">Extra fields permitted</text><text x="40" y="618" font-size="18" fill="#626962">Precondition: S17 exists</text><path d="M72 648V720" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="690" font-size="17" fill="#626962">Read the same contract</text><text x="24" y="758" font-size="19" fill="#626962">2 Provider verification</text><rect x="24" y="788" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="826" font-size="22" fill="#252c28">Verifier</text><text x="40" y="862" font-size="18" fill="#252c28">Arrange fresh S17 state</text><text x="40" y="890" font-size="17" fill="#626962">Replay declared request</text><path d="M72 900V964" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="940" font-size="18" fill="#626962">GET /stock/S17</text><rect x="24" y="968" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1006" font-size="21" fill="#252c28">Candidate inventory API</text><text x="40" y="1042" font-size="19" fill="#252c28">Actual response: 7 EA</text><text x="40" y="1070" font-size="17" fill="#626962">Real serialization path</text><path d="M72 1080V1144" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="1120" font-size="17" fill="#626962">Compare actual response</text><rect x="24" y="1148" width="312" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1186" font-size="20" fill="#252c28">Match required obligations</text><text x="40" y="1218" font-size="18" fill="#626962">Integer quantity may vary</text><text x="24" y="1284" font-size="18" fill="#626962">No full system running together.</text></svg>
