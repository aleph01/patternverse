<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1012" viewBox="0 0 360 1012" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Classify a key, then resolve its owner</title><desc id="desc">Tenant 7 maps to logical bucket 6. Routing map version 12 assigns buckets 0–3 to A, 4–7 to B, and 8–11 to C, so this request goes only to B. The shards share a schema but hold different rows; replicas within a shard are a separate concern.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1012" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">One key, one owning shard</text><text x="24" y="78" font-size="17" fill="#626962">12 buckets; 3 owning groups.</text><rect x="24" y="112" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="144" font-size="21" fill="#252c28">Request: tenant 7</text><text x="40" y="172" font-size="17" fill="#626962">Read order O71</text><path d="M180 188V228" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="204" y="216" font-size="17" fill="#626962">classify</text><rect x="24" y="232" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="264" font-size="21" fill="#252c28">Logical bucket 6</text><text x="40" y="292" font-size="17" fill="#626962">(7 − 1) modulo 12 = 6</text><path d="M180 308V348" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="204" y="336" font-size="17" fill="#626962">lookup</text><rect x="24" y="352" width="312" height="92" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="386" font-size="21" fill="#252c28">Routing map v12</text><text x="40" y="420" font-size="19" fill="#252c28">Bucket 6 → B</text><rect x="24" y="504" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="536" font-size="20" fill="#252c28">A owns buckets 0–3</text><text x="40" y="564" font-size="17" fill="#626962">Other rows of the same schema</text><rect x="24" y="600" width="312" height="108" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="636" font-size="20" fill="#252c28">B owns buckets 4–7</text><text x="40" y="670" font-size="18" fill="#252c28">Tenant 7 / O71 / paid</text><rect x="24" y="728" width="312" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="760" font-size="20" fill="#252c28">C owns buckets 8–11</text><text x="40" y="788" font-size="17" fill="#626962">Other rows of the same schema</text><path d="M324 444V466H348V654H338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="480" font-size="17" fill="#626962">Route this request only to B.</text><rect x="24" y="852" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="886" font-size="19" fill="#252c28">Same schema; different rows.</text><text x="40" y="926" font-size="17" fill="#626962">Replicas copy a shard’s data.</text><text x="40" y="958" font-size="17" fill="#626962">They are not additional shards.</text></svg>
