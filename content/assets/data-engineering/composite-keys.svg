<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="tuple-membership"><title id="title">Composite keys require a matching combination</title><desc id="desc">Projects include NORTH 7, SOUTH 7 and SOUTH 8. The attempted foreign key NORTH 8 is invalid even though both separate values exist. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">The complete pair must exist in one parent row.</text><text x="54" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Tenant</text><text x="204.0" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Project</text><path d="M44 146L344 146" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="119.0" y="186.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">NORTH</text><text x="269.0" y="186.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">7</text><path d="M44 205L344 205" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="119.0" y="238.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">SOUTH</text><text x="269.0" y="238.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">7</text><path d="M44 257L344 257" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="119.0" y="290.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">SOUTH</text><text x="269.0" y="290.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">8</text><path d="M44 309L344 309" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="440" y="190" width="236" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="558.0" y="225.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">NORTH / 8</text><path d="M440 217H389V368" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="427" y="381" font-size="24" fill="#252c28" text-anchor="start" data-label="1">No matching pair</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Separate value checks cannot validate a composite key.</text></svg>