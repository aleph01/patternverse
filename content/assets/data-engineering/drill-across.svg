<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="aligned-independent-summaries"><title id="title">Drill across</title><desc id="desc">Independent sales and returns summaries align by October and canonical product, preserving missing summaries. Detail-to-detail Adapter joins would produce six pairs. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Summarize each process, then align the results.</text><text x="54" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Product</text><text x="332.08" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Sales USD</text><text x="509.03999999999996" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Returns USD</text><path d="M44 146L676 146" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="183.04" y="186.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Adapter</text><text x="410.55999999999995" y="186.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">75</text><text x="587.52" y="186.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">20</text><path d="M44 205L676 205" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="183.04" y="238.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Case</text><text x="410.55999999999995" y="238.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">12</text><rect x="499.03999999999996" y="206" width="176.96000000000004" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="587.52" y="238.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">—</text><path d="M44 257L676 257" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="183.04" y="290.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Cable</text><rect x="322.08" y="258" width="176.95999999999998" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="410.55999999999995" y="290.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">—</text><text x="587.52" y="290.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">7</text><path d="M44 309L676 309" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Do not multiply facts by joining detail to detail.</text></svg>