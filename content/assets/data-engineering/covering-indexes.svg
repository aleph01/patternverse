<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="index-coverage"><title id="title">Covering indexes</title><desc id="desc">Three illustrative entries from a latest-100-readings query for device 42 can read time and value from a covering index instead of following each locator to a table row. Some engines still require visibility checks in the base table. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Put the query’s needed values on its access path.</text><text x="54" y="143" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Device</text><text x="212.0" y="143" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Time ↓</text><text x="370.0" y="143" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Value</text><text x="528.0" y="143" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Locator</text><path d="M44 159L676 159" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="44" y="167" width="158.0" height="61" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="123.0" y="206.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">42</text><rect x="202.0" y="167" width="158.0" height="61" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="281.0" y="206.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">10:03</text><rect x="360.0" y="167" width="158.0" height="61" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="439.0" y="206.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">20.1</text><text x="597.0" y="206.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">r91</text><path d="M44 231L676 231" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="232" width="158.0" height="61" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="123.0" y="271.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">42</text><rect x="202.0" y="232" width="158.0" height="61" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="281.0" y="271.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">10:02</text><rect x="360.0" y="232" width="158.0" height="61" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="439.0" y="271.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">20.0</text><text x="597.0" y="271.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">r84</text><path d="M44 296L676 296" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="297" width="158.0" height="61" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="123.0" y="336.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">42</text><rect x="202.0" y="297" width="158.0" height="61" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="281.0" y="336.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">10:01</text><rect x="360.0" y="297" width="158.0" height="61" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="439.0" y="336.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">19.8</text><text x="597.0" y="336.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">r77</text><path d="M44 361L676 361" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Covered columns avoid value fetches; visibility may still</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">cost reads.</text></svg>