<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="record-refinement"><title id="title">Progressive refinement</title><desc id="desc">Raw events E1=30,E2=70,a duplicate E2,and invalid E3 become two unique valid enriched events. Daily revenue is 100. Duplicate and quarantine routes remain visible. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Improve the dataset through visible stages.</text><text x="54" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Raw input</text><text x="249.92" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Validated detail</text><text x="502.72" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Daily result</text><path d="M44 153L676 153" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="141.95999999999998" y="196.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E1 · 30</text><text x="366.32" y="196.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E1 · 30</text><path d="M44 217L676 217" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="141.95999999999998" y="253.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E2 · 70</text><text x="366.32" y="253.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E2 · 70</text><rect x="492.72" y="218" width="183.27999999999997" height="53" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="584.36" y="253.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">100</text><path d="M44 274L676 274" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="141.95999999999998" y="310.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E2 · retry</text><text x="366.32" y="310.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Duplicate route</text><path d="M44 331L676 331" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="141.95999999999998" y="367.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E3 · invalid</text><text x="366.32" y="367.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Quarantine</text><path d="M44 388L676 388" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Refinement changes trust and grain deliberately.</text></svg>