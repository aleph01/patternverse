<svg xmlns="http://www.w3.org/2000/svg" width="720" height="896" viewBox="0 0 720 896" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Consumer test and provider verification share one contract</title><desc id="desc">The real stock reader runs against a controlled interaction and produces a versioned consumer contract. Separately, a verifier arranges provider state and calls the candidate inventory API with the same request. Its actual response is checked against that contract. Consumer success alone and provider success alone leave different evidence gaps.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="896" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">One agreement connects two independent checks</text><text x="24" y="94" font-size="19" fill="#626962">1 Consumer test · reader-3</text><rect x="24" y="132" width="240" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="174" font-size="22" fill="#252c28">Real stock reader</text><text x="40" y="214" font-size="19" fill="#252c28">Builds request</text><text x="40" y="254" font-size="19" fill="#626962">Interprets 4 EA</text><rect x="432" y="132" width="264" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="448" y="174" font-size="22" fill="#252c28">Controlled provider</text><text x="448" y="214" font-size="19" fill="#252c28">Checks request</text><text x="448" y="254" font-size="19" fill="#626962">Example reply: 4 EA</text><path d="M264 196H432" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="304" y="180" font-size="17" fill="#626962">request</text><path d="M432 240H264" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="316" y="264" font-size="17" fill="#626962">reply</text><path d="M552 276V320H360V352" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="324" font-size="18" fill="#626962">Publish after consumer assertions</text><rect x="24" y="356" width="672" height="148" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="394" font-size="22" fill="#252c28">Shared contract · reader-3</text><text x="40" y="430" font-size="19" fill="#252c28">GET /stock/S17 → 200 · available: integer · unit: EA</text><text x="40" y="466" font-size="18" fill="#626962">Extra fields permitted · provider precondition: S17 exists</text><path d="M156 504V600" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="180" y="552" font-size="18" fill="#626962">Read the same contract</text><text x="384" y="582" font-size="19" fill="#626962">2 Provider verification</text><rect x="24" y="604" width="264" height="152" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="646" font-size="22" fill="#252c28">Verifier</text><text x="40" y="686" font-size="18" fill="#252c28">Arrange fresh S17 state</text><text x="40" y="726" font-size="17" fill="#626962">Invoke + match response</text><rect x="432" y="604" width="264" height="152" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="448" y="646" font-size="22" fill="#252c28">Candidate API</text><text x="448" y="686" font-size="18" fill="#252c28">Actual response: 7 EA</text><text x="448" y="726" font-size="18" fill="#626962">Real serialization path</text><path d="M288 660H432" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="316" y="640" font-size="17" fill="#626962">request</text><path d="M432 708H288" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="328" y="738" font-size="17" fill="#626962">reply</text><text x="24" y="812" font-size="18" fill="#252c28">Seven can match four’s integer rule; the field name and EA remain required.</text><text x="24" y="854" font-size="19" fill="#626962">Neither application needs the other running alongside it.</text></svg>
