<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="release-comparison"><title id="title">Historical restatement</title><desc id="desc">March revenue was released as USD 1000 on April 1. A late March 31 event for 200 arrives April 5. A new release reports 1200 while the original remains reproducible. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Publish a corrected past with its revision intact.</text><text x="54" y="145" font-size="24" fill="#252c28" text-anchor="start" data-label="1">March release</text><text x="294.15999999999997" y="145" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Published</text><text x="490.0799999999999" y="145" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Revenue, USD</text><path d="M44 161L676 161" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="164.07999999999998" y="214.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">R1</text><text x="382.11999999999995" y="214.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Apr 1</text><text x="578.04" y="214.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">1,000</text><path d="M44 246L676 246" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="164.07999999999998" y="292.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">R2</text><text x="382.11999999999995" y="292.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Apr 5</text><rect x="480.0799999999999" y="247" width="195.91999999999996" height="74" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="578.04" y="292.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">1,200</text><path d="M44 324L676 324" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="407" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Late March event: +USD 200, received Apr 5</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Latest restated → R2; originally reported → R1</text></svg>