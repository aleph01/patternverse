<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1216" viewBox="0 0 360 1216" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Data downstream, capacity upstream</title><desc id="desc">Without feedback, a source offering five thousand records per second feeds a sink processing two thousand; a buffer with six thousand free places fills in two seconds. With feedback, downstream capacity limits upstream admission. Data moves downstream while a separate capacity signal travels upstream; excess work remains outside the controlled boundary.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="data" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#252c28" stroke-width="1.2"/></marker></defs><rect width="360" height="1216" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Capacity controls admission</text><text x="24" y="88" font-size="20" fill="#252c28">Without feedback</text><rect x="24" y="112" width="312" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="142" font-size="18" fill="#252c28">Source / 5,000 offered per s</text><text x="40" y="172" font-size="17" fill="#626962">No capacity signal respected.</text><rect x="24" y="248" width="312" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="278" font-size="18" fill="#252c28">Buffer / 6,000 free places</text><text x="40" y="308" font-size="17" fill="#626962">Grows by 3,000 records per s.</text><rect x="24" y="384" width="312" height="80" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="414" font-size="18" fill="#252c28">Sink / 2,000 completed per s</text><text x="40" y="444" font-size="17" fill="#626962">Steady illustrative rates.</text><path d="M300 192V246" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#data)"/><path d="M300 328V382" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#data)"/><text x="24" y="508" font-size="20" fill="#252c28">6,000 / 3,000 = 2 s to fill</text><text x="24" y="550" font-size="17" fill="#626962">A larger buffer only buys more time.</text><text x="24" y="608" font-size="20" fill="#252c28">With feedback</text><rect x="24" y="656" width="312" height="80" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="686" font-size="18" fill="#252c28">Source / pause or resume</text><text x="40" y="716" font-size="17" fill="#626962">Read when capacity permits.</text><rect x="24" y="792" width="312" height="80" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="822" font-size="18" fill="#252c28">Bound buffers and in-flight work</text><text x="40" y="852" font-size="17" fill="#626962">Declare the capacity units.</text><rect x="24" y="928" width="312" height="80" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="958" font-size="18" fill="#252c28">Sink / capacity returns</text><text x="40" y="988" font-size="17" fill="#626962">Completion or freed buffer space.</text><path d="M300 736V790" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#data)"/><path d="M300 872V926" fill="none" stroke="#252c28" stroke-width="1.3" marker-end="url(#data)"/><path d="M24 968H12V696H22" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="1060" font-size="17" fill="#252c28">Return arrow: capacity permission.</text><text x="24" y="1100" font-size="17" fill="#626962">Data arrows: downstream delivery.</text><text x="24" y="1140" font-size="17" fill="#626962">Unadmitted work remains upstream.</text><text x="24" y="1180" font-size="17" fill="#626962">Non-pausable sources need a policy.</text></svg>
