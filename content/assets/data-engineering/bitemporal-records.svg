<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="two-time-plane"><title id="title">Bitemporal records preserve successive business timelines</title><desc id="desc">The upper knowledge slice records East indefinitely. After the July 5 correction, East ends July 1 and West begins. July 3 has two answers depending on knowledge time. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Ask both when it applied and when it was known.</text><text x="44" y="111" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Recorded time</text><path d="M92 139L92 415" fill="none" stroke="#252c28" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="145" y="155" width="515" height="100" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="400" y="212" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">East · known before Jul 5</text><rect x="145" y="285" width="240" height="100" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><rect x="385" y="285" width="275" height="100" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="260" y="344" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">East</text><text x="520" y="344" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">West</text><text x="145" y="277" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Correction recorded Jul 5</text><path d="M145 425L660 425" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M145 419L145 431" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="145" y="460" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Jan 1</text><path d="M385 419L385 431" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="385" y="460" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Jul 1</text><path d="M580 419L580 431" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="580" y="460" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Jul 3</text><text x="400" y="491" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Business effective time</text><path d="M580 145L580 386" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="4 4"/><text x="44" y="540" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Valid Jul 3: known Jul 3 → East; known Jul 6 → West</text></svg>