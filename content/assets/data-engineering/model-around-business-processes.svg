<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="process-grains"><title id="title">Model around business processes</title><desc id="desc">One order line for ten units becomes two shipment lines for four and six units and one invoice line for ten. Shared context connects the processes without equating their rows. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">One order, three business grains.</text><text x="134" y="126" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Ordered</text><rect x="44" y="164" width="180" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="134.0" y="199.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">10 units</text><path d="M134 315L134 374" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="360" y="126" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Shipped</text><rect x="270" y="164" width="180" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="199.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">4 units</text><rect x="270" y="237" width="180" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="272.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">6 units</text><path d="M360 315L360 374" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="586" y="126" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Invoiced</text><rect x="496" y="164" width="180" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="586.0" y="199.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">10 units</text><path d="M586 315L586 374" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M134 374L586 374" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="360" y="420" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Customer · product</text><text x="360" y="463" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Order, shipment, and invoice dates have distinct roles.</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Link context. Preserve each observation.</text></svg>