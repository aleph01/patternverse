<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="column-separation"><title id="title">Vertical partitioning for live processing</title><desc id="desc">Event E901 version 12 has a narrow control record and a separate large payload. The control record references the exact payload version; readers requiring the body fetch it explicitly. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Separate frequently used fields from bulky</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">payloads.</text><rect x="44" y="135" width="632" height="115" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="54" y="120" width="320.0" height="28" fill="#fff" stroke="none" stroke-width="1.2"/><text x="64" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Logical event E901 · v12</text><text x="70" y="207" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Identity + status + exact payload reference</text><path d="M180 258L180 320" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M530 258L530 320" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="44" y="335" width="280" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="184.0" y="370.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Narrow control</text><rect x="396" y="335" width="280" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="536.0" y="370.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Large body P17/v3</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Keep identity and version consistency across the split.</text></svg>