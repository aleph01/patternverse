<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="snapshot-log-handoff"><title id="title">Snapshot then stream</title><desc id="desc">A consistent baseline at C100 contains P7=10. Changes captured during copying are applied after the baseline: C101 sets P7=7, C102 creates Q2=4, and C103 deletes P7. Final state has only Q2=4. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Bridge the baseline and the change stream.</text><rect x="44" y="140" width="632" height="65" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="360.0" y="181.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Baseline at C100: P7 = 10</text><text x="44" y="252" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Capture while the snapshot is copied</text><text x="54" y="295" font-size="24" fill="#252c28" text-anchor="start" data-label="1">C101</text><text x="264.66666666666663" y="295" font-size="24" fill="#252c28" text-anchor="start" data-label="1">C102</text><text x="475.3333333333333" y="295" font-size="24" fill="#252c28" text-anchor="start" data-label="1">C103</text><path d="M44 311L676 311" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="149.33333333333331" y="355.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">P7 = 7</text><text x="360.0" y="355.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Q2 = 4</text><rect x="465.3333333333333" y="319" width="210.66666666666669" height="56" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="570.6666666666666" y="355.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Delete P7</text><path d="M44 378L676 378" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Apply after the baseline → P7 absent; Q2 = 4</text></svg>