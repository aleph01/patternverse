<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="keyed-difference"><title id="title">Parallel-run comparison</title><desc id="desc">Two pipelines run on source S52. Old produces A10000, B6000; new produces A10100, B5900. Both total 16000, but per-key differences reveal plus 100 and minus 100. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Compare matching outputs at the grain that</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">matters.</text><text x="44" y="121" font-size="24" fill="#252c28" text-anchor="start" data-label="1">All amounts in USD cents</text><text x="54" y="163" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Key</text><text x="212.0" y="163" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Old</text><text x="370.0" y="163" font-size="24" fill="#252c28" text-anchor="start" data-label="1">New</text><text x="528.0" y="163" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Difference</text><path d="M44 179L676 179" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="123.0" y="229.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">A</text><text x="281.0" y="229.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">10,000</text><text x="439.0" y="229.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">10,100</text><text x="597.0" y="229.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">+100</text><path d="M44 258L676 258" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="301.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">B</text><text x="281.0" y="301.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">6,000</text><text x="439.0" y="301.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">5,900</text><text x="597.0" y="301.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">−100</text><path d="M44 330L676 330" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="373.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Total</text><text x="281.0" y="373.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">16,000</text><text x="439.0" y="373.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">16,000</text><text x="597.0" y="373.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">0</text><path d="M44 402L676 402" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Pin comparable inputs; explain differences before</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">handover.</text></svg>