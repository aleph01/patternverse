<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="historical-current-comparison"><title id="title">Hybrid Slowly Changing Dimensions</title><desc id="desc">An illustrative Type 6 hybrid combines Type 2 historical region and Type 1 current region for customer A42. Version 107 is East during [January 1, July 1), version 208 is West from July 1. After the change, current region is overwritten to West on both rows. June sale 100 references key 107, July sale 200 references 208. Historical grouping returns East 100 and West 200; grouping by current region returns West 300. The stored fact keys do not change. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Keep historical and current views together.</text><text x="44" y="116" font-size="24" fill="#252c28" text-anchor="start" data-label="1">After July 1 change · Type 6 example · customer A42</text><text x="54" y="161" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Key</text><text x="129.84" y="161" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Historical</text><text x="287.84000000000003" y="161" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Current</text><text x="445.84000000000003" y="161" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Valid interval</text><path d="M44 177L676 177" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="81.92" y="223.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">107</text><text x="198.84000000000003" y="223.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">East</text><rect x="277.84000000000003" y="185" width="158.0" height="60" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="356.84000000000003" y="223.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">West</text><text x="555.9200000000001" y="223.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">[Jan 1, Jul 1)</text><path d="M44 248L676 248" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="81.92" y="287.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">208</text><text x="198.84000000000003" y="287.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">West</text><rect x="277.84000000000003" y="249" width="158.0" height="60" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="356.84000000000003" y="287.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">West</text><text x="555.9200000000001" y="287.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">[Jul 1, ∞)</text><path d="M44 312L676 312" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="344" font-size="24" fill="#252c28" text-anchor="start" data-label="1">June sale: 100 · customer version: 107</text><text x="44" y="378" font-size="24" fill="#252c28" text-anchor="start" data-label="1">July sale: 200 · customer version: 208</text><text x="44" y="410" font-size="24" fill="#252c28" text-anchor="start" data-label="1">By historical region</text><text x="400" y="410" font-size="24" fill="#252c28" text-anchor="start" data-label="1">By current region</text><rect x="44" y="430" width="280" height="65" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="184.0" y="471.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">East 100 · West 200</text><rect x="400" y="430" width="276" height="65" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="538.0" y="471.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">West 300</text><text x="44" y="538" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Update the current value on every A42 version.</text></svg>