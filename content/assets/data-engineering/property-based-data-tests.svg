<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="invariant-under-transformation"><title id="title">Property-based data tests</title><desc id="desc">An average should not change when input is repartitioned. Partition A contains 0,0 and B contains 6. Averaging partial means gives 3, but combining sum 6 and count 3 gives 2. Generated partitions expose this bug. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Generate cases that challenge a general property.</text><rect x="44" y="153" width="268" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="178.0" y="188.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Partition A: 0, 0</text><rect x="406" y="153" width="270" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="541.0" y="188.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Partition B: 6</text><text x="44" y="290" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Wrong: mean(0, 6) = 3</text><text x="44" y="357" font-size="26" fill="#00855b" text-anchor="start" data-label="1">Correct: (0 + 6) / (2 + 1) = 2</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Property: changing partition boundaries preserves the</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">result.</text></svg>