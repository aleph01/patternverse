<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="attempt-and-commit-evidence"><title id="title">Run ledgers</title><desc id="desc">Run R42 attempt A1 fails. A2 publishes release 119 but loses its acknowledgement. The ledger records an uncertain outcome until the durable commit receipt confirms release 119, avoiding a duplicate publication. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Track attempts separately from publication</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">evidence.</text><text x="54" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Run / attempt</text><text x="268.88" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Outcome</text><text x="439.52" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Evidence</text><path d="M44 155L676 155" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="151.44" y="205.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">R42 / A1</text><text x="344.2" y="205.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Failed</text><text x="552.76" y="205.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">No publication</text><path d="M44 234L676 234" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="151.44" y="277.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">R42 / A2</text><text x="344.2" y="277.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Uncertain</text><text x="552.76" y="277.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Ack lost</text><path d="M44 306L676 306" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="151.44" y="349.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">R42 / A2</text><rect x="258.88" y="307" width="170.64" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="344.2" y="349.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Published</text><rect x="429.52" y="307" width="246.48000000000002" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="552.76" y="349.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Commit receipt 119</text><path d="M44 378L676 378" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Reconcile uncertain outcomes against the publication</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">system.</text></svg>