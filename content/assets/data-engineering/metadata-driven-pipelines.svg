<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="configuration-state-separation"><title id="title">Metadata-driven pipelines</title><desc id="desc">Configuration v12 and template v4 declare extraction and publication separately. Countries use full snapshot / complete replacement; Events use cursor incremental / append with retry protection. Cursor 100 advances to 120 only after publication. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Generate execution from versioned declarations.</text><text x="44" y="127" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Pinned config v12 · template v4</text><text x="54" y="185" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Dataset</text><text x="205.68" y="185" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Extract</text><text x="414.24" y="185" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Publish</text><path d="M44 201L676 201" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="119.84" y="257.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Countries</text><text x="299.96000000000004" y="257.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Full snapshot</text><text x="540.12" y="243.16000000000003" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Replace complete</text><text x="540.12" y="270.16" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">target</text><path d="M44 291L676 291" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="119.84" y="340.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Events</text><text x="299.96000000000004" y="326.16" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Cursor</text><text x="299.96000000000004" y="353.16" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">incremental</text><text x="540.12" y="326.16" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Append + retry</text><text x="540.12" y="353.16" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">protection</text><path d="M44 374L676 374" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="405" width="632" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="440.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Events: cursor 100 → run → publish → cursor 120</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Configuration is intent; cursor state is progress.</text></svg>