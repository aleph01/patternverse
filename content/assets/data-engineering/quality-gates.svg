<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="transition-decision"><title id="title">Quality gates</title><desc id="desc">Orders B42 fails uniqueness, so dependent balance processing is held. Corrected B43 passes all required checks and may start processing. Model M9 fails a required segment check and is held from promotion. Permission applies only to the named candidate and transition. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Gate the next transition with matching evidence.</text><text x="54" y="145" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Candidate</text><text x="193.04" y="145" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Evidence</text><text x="376.32" y="145" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Transition</text><text x="572.24" y="145" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Decision</text><path d="M44 161L676 161" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="113.52" y="219.16" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Orders B42</text><text x="274.68" y="205.66" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Uniqueness</text><text x="274.68" y="232.66" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">fails</text><text x=