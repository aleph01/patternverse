<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1176" viewBox="0 0 360 1176" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One local atomic boundary, later delivery</title><desc id="desc">One source database transaction inserts order O42 and outbox event E901 together. A rollback preserves neither. After commit, a relay reads the pending event and publishes it to a separate broker; broker acceptance is outside the source transaction.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1176" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Commit change and intent</text><rect x="24" y="112" width="312" height="480" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="146" font-size="20" fill="#252c28">One source transaction</text><rect x="40" y="176" width="280" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="205" font-size="20" fill="#252c28">Order O42</text><text x="56" y="231" font-size="17" fill="#626962">7000 euro cents / EUR 70</text><text x="56" y="276" font-size="17" fill="#626962">Business state</text><rect x="40" y="352" width="280" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="56" y="381" font-size="18" fill="#252c28">Outbox E901</text><text x="56" y="407" font-size="16" fill="#626962">OrderPlaced / O42 / version 1</text><text x="56" y="452" font-size="16" fill="#626962">Captured payload / pending</text><text x="40" y="548" font-size="18" fill="#252c28">Commit both or neither.</text><path d="M180 592V686" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="688" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="717" font-size="18" fill="#252c28">Relay reads committed intent</text><text x="40" y="743" font-size="16" fill="#626962">One worker in this example</text><text x="40" y="790" font-size="16" fill="#626962">Publish E901 and saved payload</text><path d="M180 816V910" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="870" font-size="17" fill="#626962">send</text><rect x="24" y="912" width="312" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="941" font-size="18" fill="#252c28">Separate broker</text><text x="40" y="967" font-size="16" fill="#626962">Acceptance outside source commit</text><text x="40" y="1010" font-size="16" fill="#626962">Consumers progress separately.</text><text x="24" y="1130" font-size="16" fill="#626962">Arrows: read after commit, then send.</text></svg>
