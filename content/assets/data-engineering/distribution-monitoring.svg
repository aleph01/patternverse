<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="distribution-comparison"><title id="title">Distribution monitoring</title><desc id="desc">Both datasets contain 1000 values with mean 30. Reference values are all 30. Current values are 500 tens and 500 fifties, so half exceed 40 despite the unchanged mean. This deliberately simple example demonstrates a distribution shift. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Look beyond a stable average.</text><text x="44" y="123" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Reference</text><text x="402" y="123" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Current</text><path d="M90 345L280 345" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M425 345L615 345" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="169" y="170" width="33" height="175" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><rect x="425" y="257" width="33" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><rect x="582" y="257" width="33" height="88" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="90" y="384" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10</text><text x="185" y="384" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">30</text><text x="280" y="384" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">50</text><text x="425" y="384" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10</text><text x="520" y="384" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">30</text><text x="615" y="384" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">50</text><text x="185" y="438" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Mean 30</text><text x="520" y="438" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Mean 30</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Share above 40: reference 0%; current 50%.</text></svg>