<svg xmlns="http://www.w3.org/2000/svg" width="720" height="944" viewBox="0 0 720 944" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One local atomic boundary, later delivery</title><desc id="desc">One source database transaction inserts order O42 and outbox event E901 together. A rollback preserves neither. After commit, a relay reads the pending event and publishes it to a separate broker; broker acceptance is outside the source transaction.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="944" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Commit the order and publication intent</text><rect x="24" y="112" width="672" height="280" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="148" font-size="20" fill="#252c28">One source database transaction</text><rect x="48" y="176" width="288" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="64" y="205" font-size="20" fill="#252c28">Order O42</text><text x="64" y="231" font-size="17" fill="#626962">7000 euro cents / EUR 70</text><text x="64" y="276" font-size="17" fill="#626962">Business state</text><rect x="384" y="176" width="288" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="400" y="205" font-size="18" fill="#252c28">Outbox E901</text><text x="400" y="231" font-size="16" fill="#626962">OrderPlaced / O42 / version 1</text><text x="400" y="276" font-size="16" fill="#626962">Captured payload / pending</text><text x="40" y="358" font-size="19" fill="#252c28">Commit both; rollback preserves neither.</text><path d="M360 392V480" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="482" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="511" font-size="20" fill="#252c28">Relay reads committed outbox records</text><text x="40" y="537" font-size="17" fill="#626962">Publish E901 with the payload captured during the order transaction.</text><text x="40" y="580" font-size="18" fill="#626962">Delivery does not repeat the order transaction.</text><path d="M360 610V698" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="660" font-size="17" fill="#626962">send</text><rect x="24" y="700" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="729" font-size="20" fill="#252c28">Separate broker</text><text x="40" y="755" font-size="17" fill="#626962">Broker acceptance is outside the source transaction.</text><text x="40" y="798" font-size="18" fill="#626962">Consumer completion is another milestone.</text><text x="24" y="902" font-size="18" fill="#626962">Arrows: read committed intent, then attempt publication.</text></svg>
