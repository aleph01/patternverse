<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="identifier-on-facts"><title id="title">Degenerate dimensions</title><desc id="desc">Invoice-line facts retain source and invoice number. Grouping ERP-A INV17 yields USD62 from two lines, and INV18 yields USD25 from one; no separate invoice dimension is required. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">An invoice number can stay on its fact rows.</text><text x="54" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Source / invoice</text><text x="401.6" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Line</text><text x="540.64" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">USD</text><path d="M44 146L676 146" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="44" y="154" width="347.6" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="217.8" y="186.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">ERP-A / INV17</text><text x="461.12" y="186.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">1</text><text x="603.3199999999999" y="186.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">50</text><path d="M44 205L676 205" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="206" width="347.6" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="217.8" y="238.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">ERP-A / INV17</text><text x="461.12" y="238.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">2</text><text x="603.3199999999999" y="238.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">12</text><path d="M44 257L676 257" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="258" width="347.6" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="217.8" y="290.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">ERP-A / INV18</text><text x="461.12" y="290.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">1</text><text x="603.3199999999999" y="290.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">25</text><path d="M44 309L676 309" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Three lines represent two invoices.</text></svg>