<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="dependency-impact"><title id="title">Incremental Transformation</title><desc id="desc">E2 changes from 70 on day 1 to 50 on day 2. Both old and new groups must be updated: day 1 falls from 100 to 30, day 2 becomes 50, while an unrelated total 500 is unchanged. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Recompute every output affected by a change.</text><text x="54" y="143" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Affected group</text><text x="370.0" y="143" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Before</text><text x="528.0" y="143" font-size="24" fill="#252c28" text-anchor="start" data-label="1">After</text><path d="M44 159L676 159" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="202.0" y="208.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Day 1</text><text x="439.0" y="208.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">100</text><rect x="518.0" y="167" width="158.0" height="66" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="597.0" y="208.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">30</text><path d="M44 236L676 236" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="202.0" y="278.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Day 2</text><text x="439.0" y="264.66" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">No prior</text><text x="439.0" y="291.66" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">group</text><rect x="518.0" y="237" width="158.0" height="66" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="597.0" y="278.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">50</text><path d="M44 306L676 306" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="202.0" y="348.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Other day</text><text x="439.0" y="348.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">500</text><text x="597.0" y="348.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">500</text><path d="M44 376L676 376" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">E2 moved groups: retract 70, then add 50.</text></svg>