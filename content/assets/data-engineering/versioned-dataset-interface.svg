<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="contract-vs-release"><title id="title">Versioned Dataset Interfaces</title><desc id="desc">Interface v1 exposes one order per row in releases R501 and R502 with ten and eleven rows. Interface v2 exposes order lines with twenty-four and twenty-seven rows. Releases change data; interface versions declare the grain change. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Version a change in meaning separately from a</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">refresh.</text><text x="54" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Interface / grain</text><text x="433.2" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">R501</text><text x="559.6" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">R502</text><path d="M44 156L676 156" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="233.6" y="215.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">v1 · order</text><text x="486.4" y="215.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">10</text><text x="612.8" y="215.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">11</text><path d="M44 253L676 253" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="254" width="379.2" height="86" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="233.6" y="305.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">v2 · order line</text><text x="486.4" y="305.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">24</text><text x="612.8" y="305.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">27</text><path d="M44 343L676 343" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">A new data release is not automatically a new interface</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">version.</text></svg>