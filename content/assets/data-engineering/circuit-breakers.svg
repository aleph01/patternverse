<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1008" viewBox="0 0 720 1008" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Closed, open and half-open circuit breaker transitions</title><desc id="desc">Closed admits calls and observes classified outcomes. A threshold opens the breaker and rejects new calls. After a cooldown, a subsequent call may enter half-open as a limited probe. A successful qualifying probe closes the breaker; a failed probe reopens it and restarts the cooldown.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1008" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Three states control admission to the dependency</text><rect x="208" y="112" width="304" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="224" y="148" font-size="22" fill="#252c28">CLOSED</text><text x="224" y="188" font-size="18" fill="#626962">Admit normal calls.</text><text x="224" y="220" font-size="17" fill="#626962">Observe classified outcomes.</text><path d="M360 240V350" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="304" font-size="17" fill="#626962">threshold reached</text><rect x="208" y="352" width="304" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="224" y="388" font-size="22" fill="#252c28">OPEN</text><text x="224" y="428" font-size="18" fill="#626962">Reject new calls locally.</text><text x="224" y="460" font-size="17" fill="#626962">Do not invoke the dependency.</text><path d="M360 480V590" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="544" font-size="17" fill="#626962">cooldown + next call</text><rect x="208" y="592" width="304" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="224" y="628" font-size="22" fill="#252c28">HALF-OPEN</text><text x="224" y="668" font-size="18" fill="#626962">Admit limited probes.</text><text x="224" y="700" font-size="17" fill="#626962">Test the protected operation.</text><path d="M208 656H64V176H206" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="80" y="308" font-size="17" fill="#626962">probe succeeds</text><path d="M512 656H656V416H514" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="524" y="568" font-size="17" fill="#626962">probe fails</text><text x="524" y="600" font-size="16" fill="#626962">or inconclusive</text><rect x="24" y="824" width="672" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="856" font-size="20" fill="#252c28">Cooldown is permission to test, not proof of recovery</text><text x="40" y="902" font-size="17" fill="#626962">The model uses one probe; production policies may evaluate several.</text><text x="40" y="944" font-size="17" fill="#626962">Arrows show state transitions, not retries or cancellation of in-flight calls.</text></svg>
