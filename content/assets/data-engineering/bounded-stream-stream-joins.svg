<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="join-time-band"><title id="title">Bounded stream-stream joins</title><desc id="desc">Order O42 at 10:00 joins shipments of O42 from 10:00 through 14:00 inclusive. Shipments at 10:30 and 13:50 match, while one at 14:10 does not. Multiple eligible matches produce multiple outputs. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Bound the relationship in both key and time.</text><rect x="90" y="183" width="500" height="80" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="340.0" y="231.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">O42 eligible shipment interval</text><path d="M90 340L670 340" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M90 334L90 346" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="90" y="375" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10:00</text><path d="M590 334L590 346" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="590" y="375" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">14:00</text><path d="M670 334L670 346" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="670" y="375" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">14:10</text><circle cx="153" cy="306" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><text x="153" y="140" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10:30</text><path d="M153 151L153 295" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="3 4"/><circle cx="569" cy="306" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><text x="569" y="140" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">13:50</text><path d="M569 151L569 295" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="3 4"/><circle cx="670" cy="306" r="5" fill="#252c28" stroke="#252c28" stroke-width="1.5"/><text x="670" y="140" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">14:10</text><path d="M670 151L670 295" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="3 4"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Key O42 + time predicate; watermarks govern state</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">cleanup.</text></svg>