<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="fixture-actual-comparison"><title id="title">Transformation Unit Tests</title><desc id="desc">Small static fixtures give order O42 two payments of 60 and 40 and two shipments of 4 and 6 units. The independently specified expectation is one row with paid 100 and shipped units 10. An unfixed transformation joins both detail relations before aggregation, creating four pairs and returning paid 200 and units 20. Comparing the actual row with the expected row exposes the multiplication. The test executes the production transformation, not a separately reimplemented copy. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Tiny inputs can expose a multiplied join.</text><text x="44" y="113" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Payment fixture</text><text x="406" y="113" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Shipment fixture</text><rect x="44" y="138" width="270" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="179.0" y="173.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">O42: 60 and 40</text><rect x="406" y="138" width="270" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="541.0" y="173.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">O42: 4 and 6 units</text><path d="M179 205L290 241" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M541 205L430 241" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="150.0" y="247.0" width="420" height="70" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="360.0" y="290.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Model under test</text><path d="M574 282H690V449H683" fill="none" stroke="#252c28" stroke-width="1.2" marker-end="url(#arrow)"/><text x="44" y="386" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Expected fixture</text><text x="400" y="386" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Actual: test fails</text><rect x="44" y="407" width="280" height="85" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="184.0" y="444.16" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Paid 100</text><text x="184.0" y="471.16" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Units 10</text><rect x="400" y="407" width="276" height="85" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="538.0" y="444.16" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Paid 200</text><text x="538.0" y="471.16" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Units 20</text><text x="360" y="461" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">≠</text><text x="44" y="538" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Two payments × two shipments = four joined rows.</text></svg>