<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1056" viewBox="0 0 360 1056" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Read stored; refresh separately</title><desc id="desc">Three sales for shop A total USD 100. After another USD 10 sale commits, the source contains four sales totaling USD 110 while generation 1 still contains three sales totaling USD 100. A successful refresh publishes generation 2 with four sales totaling USD 110.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1056" fill="#fff"/><text x="24" y="34" font-size="22" fill="#252c28">Read stored; refresh separately</text><text x="24" y="78" font-size="17" fill="#626962">Shop A / USD. All amounts in cents.</text><rect x="24" y="112" width="312" height="192" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="144" font-size="20" fill="#252c28">1. Initial publication</text><text x="40" y="192" font-size="17" fill="#252c28">Source: 3 sales / 10000 cents</text><text x="40" y="234" font-size="17" fill="#252c28">Stored: 3 sales / 10000 cents</text><text x="40" y="278" font-size="19" fill="#626962">Published generation 1</text><path d="M72 304V364" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="344" font-size="17" fill="#626962">Source commit +1000</text><rect x="24" y="368" width="312" height="192" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="400" font-size="20" fill="#252c28">2. New sale committed</text><text x="40" y="448" font-size="17" fill="#252c28">Source: 4 sales / 11000 cents</text><text x="40" y="490" font-size="17" fill="#252c28">Stored: 3 sales / 10000 cents</text><text x="40" y="534" font-size="19" fill="#626962">Published generation 1</text><path d="M72 560V620" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="600" font-size="17" fill="#626962">Refresh commit</text><rect x="24" y="624" width="312" height="192" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="656" font-size="20" fill="#252c28">3. Refresh committed</text><text x="40" y="704" font-size="17" fill="#252c28">Source: 4 sales / 11000 cents</text><text x="40" y="746" font-size="17" fill="#252c28">Stored: 4 sales / 11000 cents</text><text x="40" y="790" font-size="19" fill="#626962">Published generation 2</text><rect x="24" y="884" width="312" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="918" font-size="19" fill="#252c28">Reads do not trigger this refresh.</text><text x="40" y="962" font-size="17" fill="#626962">Publish one complete result.</text></svg>
