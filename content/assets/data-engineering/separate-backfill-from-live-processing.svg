<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="isolated-work-lanes"><title id="title">Separate backfill from live processing</title><desc id="desc">Live and backfill executions have independent checkpoints and budgets. Backfill builds a private candidate and validates it. A version-aware overlap policy and atomic publication prevent older recovery work from overwriting newer live results. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Keep historical recovery from disrupting current</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">work.</text><text x="44" y="135" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Live lane</text><text x="44" y="300" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Backfill lane</text><rect x="44" y="155" width="250" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="169.0" y="190.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Current progress</text><rect x="44" y="320" width="250" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="169.0" y="355.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Historical scope</text><path d="M304 182L390 182" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M304 347L390 347" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="400" y="155" width="276" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="538.0" y="190.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Live release</text><rect x="400" y="320" width="276" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="538.0" y="355.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Private candidate</text><text x="44" y="452" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Validate → resolve overlap → atomic publication</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Separate resource budgets and independent recovery</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">positions.</text></svg>