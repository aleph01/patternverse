<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="ranked-whole-row"><title id="title">Deduplicate with an explicit winner</title><desc id="desc">Customer C17 has rows R1 v7 received 09:03, R2 v8 received 09:02, and R3 v8 received 09:05. Highest version then earliest receipt chooses R2; a stable row ID breaks any remaining tie. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Choose one whole row with a total ordering.</text><text x="54" y="133" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Row</text><text x="212.0" y="133" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Version</text><text x="370.0" y="133" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Receipt</text><text x="528.0" y="133" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Region</text><path d="M44 149L676 149" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="123.0" y="198.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">R1</text><text x="281.0" y="198.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">7</text><text x="439.0" y="198.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">09:03</text><text x="597.0" y="198.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">North</text><path d="M44 226L676 226" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="227" width="158.0" height="66" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="123.0" y="268.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">R2</text><rect x="202.0" y="227" width="158.0" height="66" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="281.0" y="268.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">8</text><rect x="360.0" y="227" width="158.0" height="66" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="439.0" y="268.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">09:02</text><rect x="518.0" y="227" width="158.0" height="66" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="597.0" y="268.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">South</text><path d="M44 296L676 296" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="338.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">R3</text><text x="281.0" y="338.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">8</text><text x="439.0" y="338.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">09:05</text><text x="597.0" y="338.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">South</text><path d="M44 366L676 366" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Winner R2; conflicting payloads at one version need a</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">policy.</text></svg>