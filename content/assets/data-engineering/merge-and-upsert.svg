<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="versioned-merge"><title id="title">Merge and upsert</title><desc id="desc">C17 updates from v4 North to v5 South. A stale v1 update cannot replace C18 v2 East. C19 v1 West is inserted. Merge requires explicit identity, ordering, and conflict rules. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Match by identity and apply the winning version.</text><text x="54" y="131" font-size="24" fill="#252c28" text-anchor="start" data-label="1">ID</text><text x="155.12" y="131" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Stored</text><text x="332.08000000000004" y="131" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Incoming</text><text x="509.0400000000001" y="131" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Result</text><path d="M44 147L676 147" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="94.56" y="197.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">C17</text><text x="233.60000000000002" y="197.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">v4 North</text><text x="410.56000000000006" y="197.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">v5 South</text><rect x="499.0400000000001" y="155" width="176.96000000000004" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="587.5200000000001" y="197.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">v5 South</text><path d="M44 226L676 226" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="94.56" y="269.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">C18</text><text x="233.60000000000002" y="269.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">v2 East</text><text x="410.56000000000006" y="269.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">v1 North</text><text x="587.5200000000001" y="269.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">v2 East</text><path d="M44 298L676 298" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="94.56" y="341.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">C19</text><text x="233.60000000000002" y="341.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">—</text><text x="410.56000000000006" y="341.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">v1 West</text><rect x="499.0400000000001" y="299" width="176.96000000000004" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="587.5200000000001" y="341.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">v1 West</text><path d="M44 370L676 370" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Upsert is not permission for an older row to win.</text></svg>