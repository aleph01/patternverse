<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="scoped-reference-check"><title id="title">Referential integrity checks</title><desc id="desc">A/17 has a parent. A/29 does not, even though B/29 exists. The reference key includes its namespace. Null is permitted only where the relationship is explicitly optional and checks use an agreed source boundary. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Check that the referenced identity actually exists.</text><text x="54" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Child reference</text><text x="275.2" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Parent set</text><text x="452.15999999999997" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Result</text><path d="M44 156L676 156" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="154.6" y="206.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">A / 17</text><text x="353.67999999999995" y="206.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">A / 17</text><rect x="442.15999999999997" y="164" width="233.84000000000003" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="559.0799999999999" y="206.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Found</text><path d="M44 235L676 235" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="154.6" y="278.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">A / 29</text><text x="353.67999999999995" y="278.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">B / 29</text><text x="559.0799999999999" y="278.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Missing A / 29</text><path d="M44 307L676 307" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="154.6" y="350.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">NULL</text><text x="353.67999999999995" y="350.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Optional only</text><text x="559.0799999999999" y="350.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Policy dependent</text><path d="M44 379L676 379" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Namespace, timing, and null policy belong in the check.</text></svg>