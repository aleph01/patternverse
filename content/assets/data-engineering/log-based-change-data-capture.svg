<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="ordered-change-log"><title id="title">Log-based change data capture</title><desc id="desc">Committed log positions L1, L2, and L3 record an insert, update, and delete of product P7. The consumer applies source ordering and persists a restart position. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Read committed changes from the database log.</text><text x="54" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Position</text><text x="212.0" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">P7 change</text><text x="452.15999999999997" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Target state</text><path d="M44 156L676 156" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="123.0" y="204.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">L1</text><text x="322.08" y="204.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Insert 10</text><text x="559.0799999999999" y="204.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">P7 = 10</text><path d="M44 230L676 230" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="271.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">L2</text><text x="322.08" y="271.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Set quantity to 7</text><text x="559.0799999999999" y="271.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">P7 = 7</text><path d="M44 297L676 297" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="338.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">L3</text><text x="322.08" y="338.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Delete</text><rect x="442.15999999999997" y="298" width="233.84000000000003" height="63" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="559.0799999999999" y="338.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">P7 absent</text><path d="M44 364L676 364" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Durable restart position follows applied changes.</text></svg>