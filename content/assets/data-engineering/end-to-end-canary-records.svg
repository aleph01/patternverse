<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="end-to-end-trace"><title id="title">End-to-end canary records</title><desc id="desc">Canary C742 enters at 12:00. It reaches broker after two seconds,transform after eight,publication after eleven,but the target consumer still lacks it at the one-minute deadline. Expected amount is three times 1200 equals 3600. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Send a recognizable record through the real route.</text><rect x="35.0" y="157.5" width="170" height="65" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="120.0" y="198.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Source</text><text x="120" y="253" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">+0 s</text><rect x="245.0" y="157.5" width="170" height="65" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="330.0" y="198.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Broker</text><text x="330" y="253" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">+2 s</text><rect x="455.0" y="157.5" width="170" height="65" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="540.0" y="198.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Transform</text><text x="540" y="253" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">+8 s</text><rect x="455.0" y="317.5" width="170" height="65" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="540.0" y="358.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Published</text><text x="540" y="413" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">+11 s</text><rect x="125.0" y="317.5" width="170" height="65" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="210.0" y="358.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Consumer</text><text x="210" y="413" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Missing</text><path d="M208 190L239 190" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M419 190L450 190" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M540 226L540 310" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M450 350L299 350" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">C742 · expected 3 × 1,200 = 3,600 · deadline 12:01</text></svg>