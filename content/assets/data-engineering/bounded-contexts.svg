<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="relationship-map"><title id="title">Bounded contexts: one company, three useful models</title><desc id="desc">Commercial account, payer accounts and service workspace have different identities and states; mappings connect the contexts. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">One company can have several useful identities.</text><path d="M360 278L135 143" fill="none" stroke="#00855b" stroke-width="1.2"/><rect x="45.0" y="113.0" width="180" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="135.0" y="151.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Sales</text><text x="135" y="201" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">AC-72 · established</text><path d="M360 278L585 143" fill="none" stroke="#00855b" stroke-width="1.2"/><rect x="495.0" y="113.0" width="180" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="585.0" y="151.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Billing</text><text x="585" y="201" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">BILL-19 · current</text><path d="M360 278L135 405" fill="none" stroke="#00855b" stroke-width="1.2"/><rect x="45.0" y="375.0" width="180" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="135.0" y="413.16" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Service access</text><text x="135" y="463" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">WS-301 · enabled</text><path d="M360 278L585 405" fill="none" stroke="#00855b" stroke-width="1.2"/><rect x="495.0" y="375.0" width="180" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="585.0" y="413.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Billing</text><text x="585" y="463" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">BILL-20 · overdue</text><rect x="265.0" y="228.0" width="190" height="100" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="360.0" y="286.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Explicit links</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Linked identities retain their own business rules.</text></svg>