<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="transaction-boundary"><title id="title">Trigger-based change capture</title><desc id="desc">Updating customer C418 from North to South also inserts change E901 through a database trigger. Commit makes both durable; rollback makes neither visible. A worker delivers asynchronously. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Capture the change in the source transaction.</text><rect x="44" y="130" width="632" height="220" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="54" y="115" width="320.0" height="28" fill="#fff" stroke="none" stroke-width="1.2"/><text x="64" y="135" font-size="24" fill="#252c28" text-anchor="start" data-label="1">One database transaction</text><rect x="75" y="190" width="260" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="205.0" y="225.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">C418 → South</text><rect x="380" y="190" width="260" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="510.0" y="225.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Capture E901</text><path d="M340 217L373 217" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M510 350L510 403" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="510" y="455" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Async delivery</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">A trigger adds work to every source write.</text></svg>