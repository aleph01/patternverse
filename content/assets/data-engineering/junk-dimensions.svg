<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="combination-lookup"><title id="title">Junk dimensions</title><desc id="desc">Order Profile 41 means gift wrapped, standard service and web. Profile 42 means not wrapped, express and phone. Two order lines reuse profile 41. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">A profile key names a reusable combination.</text><text x="54" y="125" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Profile</text><text x="155.12" y="125" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Gift wrap</text><text x="294.15999999999997" y="125" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Service</text><text x="490.0799999999999" y="125" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Channel</text><path d="M44 141L676 141" fill="none" stroke="#a6aca3" stroke-width="1.2"/><rect x="44" y="149" width="101.12" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="94.56" y="181.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">41</text><text x="214.64" y="181.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Yes</text><text x="382.11999999999995" y="181.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Standard</text><text x="578.04" y="181.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Web</text><path d="M44 200L676 200" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="201" width="101.12" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="94.56" y="233.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">42</text><text x="214.64" y="233.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">No</text><text x="382.11999999999995" y="233.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Express</text><text x="578.04" y="233.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Phone</text><path d="M44 252L676 252" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="365" font-size="26" fill="#252c28" text-anchor="start" data-label="1">O17 / L1 → 41</text><text x="44" y="418" font-size="26" fill="#252c28" text-anchor="start" data-label="1">O17 / L2 → 41</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Combination keys are not order identities.</text></svg>