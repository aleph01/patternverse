<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="identity-reconciliation"><title id="title">Source-to-target reconciliation</title><desc id="desc">Source has P1=100,P2=50,P3=50. Target has P1=100,P2=50,P2=50. Both count three rows and total 200, but P3 is missing and P2 is duplicated. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Compare identities and multiplicities, not just</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">totals.</text><text x="54" y="135" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Source</text><text x="243.6" y="135" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Target</text><text x="433.2" y="135" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Difference</text><path d="M44 151L676 151" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="138.8" y="200.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">P1 · 100</text><text x="328.4" y="200.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">P1 · 100</text><text x="549.6" y="200.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Equal</text><path d="M44 228L676 228" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="138.8" y="270.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">P2 · 50</text><text x="328.4" y="270.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">P2 · 50</text><text x="549.6" y="270.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Equal</text><path d="M44 298L676 298" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="138.8" y="340.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">P3 · 50</text><text x="328.4" y="340.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">P2 · 50</text><text x="549.6" y="340.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Missing / duplicate</text><path d="M44 368L676 368" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="418" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Count 3 and sum 200 match on both sides.</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Reconcile at the key and grain that can reveal the failure.</text></svg>