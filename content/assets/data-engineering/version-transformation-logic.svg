<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="controlled-logic-comparison"><title id="title">Version transformation logic</title><desc id="desc">On source S52, logic L17 produces 1000 and L18 produces 800. On source S53, L18 produces 750. Reference R8 and environment E4 are pinned. Holding inputs fixed separates logic change from source change. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Record which logic produced each result.</text><text x="54" y="138" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Source</text><text x="264.66666666666663" y="138" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Logic</text><text x="475.3333333333333" y="138" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Result, cents</text><path d="M44 154L676 154" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="149.33333333333331" y="204.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">S52</text><text x="360.0" y="204.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">L17</text><text x="570.6666666666666" y="204.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">1000</text><path d="M44 233L676 233" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="149.33333333333331" y="276.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">S52</text><rect x="254.66666666666666" y="234" width="210.66666666666666" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="276.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">L18</text><text x="570.6666666666666" y="276.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">800</text><path d="M44 305L676 305" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="149.33333333333331" y="348.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">S53</text><text x="360.0" y="348.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">L18</text><text x="570.6666666666666" y="348.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">750</text><path d="M44 377L676 377" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Pin reference R8 and environment E4; preserve lineage to</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">logic.</text></svg>