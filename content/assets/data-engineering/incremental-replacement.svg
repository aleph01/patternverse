<svg xmlns="http://www.w3.org/2000/svg" width="720" height="936" viewBox="0 0 720 936" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">One authoritative publisher for each migrated cohort</title><desc id="desc">Tenant cohorts A, B, and C start with the old publisher. Successive handovers move A, then B, then C to the new publisher. Each cohort has one authoritative publisher per stage. Preparation and stale-writer fencing precede authority transfer; rollback requires current and representable data.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="936" fill="#fff"/><text x="24" y="36" font-size="24" fill="#252c28">Transfer publishing authority, not random events</text><text x="24" y="84" font-size="18" fill="#626962">Stateful tenant cohorts A, B, C · separate from the read-only code.</text><text x="40" y="146" font-size="20" fill="#626962">Stage</text><text x="212" y="146" font-size="20" fill="#626962">A</text><text x="388" y="146" font-size="20" fill="#626962">B</text><text x="564" y="146" font-size="20" fill="#626962">C</text><rect x="24" y="176" width="144" height="96" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="232" font-size="21" fill="#252c28">Stage 0</text><rect x="184" y="176" width="160" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="212" y="232" font-size="23" fill="#252c28">old</text><rect x="360" y="176" width="160" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="388" y="232" font-size="23" fill="#252c28">old</text><rect x="536" y="176" width="160" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="564" y="232" font-size="23" fill="#252c28">old</text><rect x="24" y="292" width="144" height="96" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="348" font-size="21" fill="#252c28">Stage 1</text><rect x="184" y="292" width="160" height="96" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="212" y="348" font-size="23" fill="#252c28">new</text><rect x="360" y="292" width="160" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="388" y="348" font-size="23" fill="#252c28">old</text><rect x="536" y="292" width="160" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="564" y="348" font-size="23" fill="#252c28">old</text><rect x="24" y="408" width="144" height="96" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="464" font-size="21" fill="#252c28">Stage 2</text><rect x="184" y="408" width="160" height="96" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="212" y="464" font-size="23" fill="#252c28">new</text><rect x="360" y="408" width="160" height="96" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="388" y="464" font-size="23" fill="#252c28">new</text><rect x="536" y="408" width="160" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="564" y="464" font-size="23" fill="#252c28">old</text><rect x="24" y="524" width="144" height="96" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="580" font-size="21" fill="#252c28">Stage 3</text><rect x="184" y="524" width="160" height="96" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="212" y="580" font-size="23" fill="#252c28">new</text><rect x="360" y="524" width="160" height="96" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="388" y="580" font-size="23" fill="#252c28">new</text><rect x="536" y="524" width="160" height="96" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="564" y="580" font-size="23" fill="#252c28">new</text><text x="24" y="704" font-size="22" fill="#252c28">Before each handover:</text><text x="24" y="748" font-size="19" fill="#252c28">Backfill and catch up to an identified checkpoint.</text><text x="24" y="790" font-size="19" fill="#252c28">Stop or fence the old publisher before enabling new authority.</text><text x="24" y="832" font-size="19" fill="#626962">Rollback requires current data the old system can represent.</text><text x="24" y="894" font-size="20" fill="#252c28">One authoritative publisher per cohort and stage.</text></svg>
