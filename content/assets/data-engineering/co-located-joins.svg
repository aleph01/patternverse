<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="partition-alignment"><title id="title">Co-located joins</title><desc id="desc">Orders and payments are both routed by the same tenant-key mapping. Tenant 7 is local on worker A, 8 on B, 9 on C. Each local join uses tenant and order ID, avoiding movement of its inputs for the join, though the result may still travel. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Put matching join keys on the same worker.</text><rect x="50" y="135" width="190" height="285" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="60" y="120" width="120.0" height="28" fill="#fff" stroke="none" stroke-width="1.2"/><text x="70" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Worker A</text><text x="145" y="207" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Tenant 7</text><rect x="65" y="240" width="160" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="145.0" y="275.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Orders</text><rect x="65" y="330" width="160" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="145.0" y="365.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Payments</text><path d="M145 300L145 322" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="265" y="135" width="190" height="285" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="275" y="120" width="120.0" height="28" fill="#fff" stroke="none" stroke-width="1.2"/><text x="285" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Worker B</text><text x="360" y="207" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Tenant 8</text><rect x="280" y="240" width="160" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="360.0" y="275.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Orders</text><rect x="280" y="330" width="160" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="365.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Payments</text><path d="M360 300L360 322" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="480" y="135" width="190" height="285" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="490" y="120" width="120.0" height="28" fill="#fff" stroke="none" stroke-width="1.2"/><text x="500" y="140" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Worker C</text><text x="575" y="207" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Tenant 9</text><rect x="495" y="240" width="160" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="575.0" y="275.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Orders</text><rect x="495" y="330" width="160" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="575.0" y="365.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Payments</text><path d="M575 300L575 322" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Compatible key mapping and task placement; exact</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">requirements depend on the engine.</text></svg>