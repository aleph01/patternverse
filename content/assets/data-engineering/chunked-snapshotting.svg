<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="range-completion"><title id="title">Chunked snapshotting</title><desc id="desc">A snapshot scope over integer keys 0–999 is split into four half-open ranges; range width does not imply row count. Chunk 3 is retried independently; publication waits for a complete set under the selected consistency protocol. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Track each bounded range until all are complete.</text><text x="44" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Key domain 0–999; not a row count</text><rect x="44.0" y="172" width="149.0" height="100" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="118.5" y="204" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">0–249</text><text x="118.5" y="234" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Done</text><text x="118.5" y="303" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">C1</text><rect x="205.0" y="172" width="149.0" height="100" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="279.5" y="204" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">250–499</text><text x="279.5" y="234" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Done</text><text x="279.5" y="303" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">C2</text><rect x="366.0" y="172" width="149.0" height="100" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="440.5" y="204" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">500–749</text><text x="440.5" y="234" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Retry</text><text x="440.5" y="303" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">C3</text><rect x="527.0" y="172" width="149.0" height="100" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="601.5" y="204" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">750–999</text><text x="601.5" y="234" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Done</text><text x="601.5" y="303" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">C4</text><path d="M44 362V372H676V362" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="360.0" y="407" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">3 of 4 complete</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Retry C3; do not publish an incomplete snapshot.</text></svg>