<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="revision-order"><title id="title">Early results with corrections</title><desc id="desc">A result evolves from revision 1 value 60 to revision 2 value 100 to revision 3 value 95. Delivery order 1,3,2,retry 3 must leave revision 3 value 95 at the sink through an atomic revision check. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Replace a result only with a newer revision.</text><text x="54" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Delivery</text><text x="212.0" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Revision</text><text x="370.0" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Value</text><text x="528.0" y="130" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Stored</text><path d="M44 146L676 146" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="123.0" y="190.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">1</text><text x="281.0" y="190.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">1</text><text x="439.0" y="190.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">60</text><text x="597.0" y="190.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">r1 · 60</text><path d="M44 212L676 212" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="249.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">2</text><text x="281.0" y="249.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">3</text><text x="439.0" y="249.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">95</text><rect x="518.0" y="213" width="158.0" height="55" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="597.0" y="249.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">r3 · 95</text><path d="M44 271L676 271" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="308.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">3</text><text x="281.0" y="308.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">2</text><text x="439.0" y="308.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">100</text><rect x="518.0" y="272" width="158.0" height="55" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="597.0" y="308.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">r3 · 95</text><path d="M44 330L676 330" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="367.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">4</text><text x="281.0" y="367.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">3</text><text x="439.0" y="367.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">95</text><rect x="518.0" y="331" width="158.0" height="55" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="597.0" y="367.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">r3 · 95</text><path d="M44 389L676 389" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Atomic condition: incoming revision &gt; stored revision.</text></svg>