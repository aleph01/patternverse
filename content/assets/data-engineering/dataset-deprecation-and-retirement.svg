<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="state-sequence"><title id="title">Dataset deprecation and retirement</title><desc id="desc">A dataset progresses from supported to deprecated to retired after consumers and producers have been addressed. Retiring service and disposing retained data are distinct decisions governed by their own policies. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">End a dataset’s service life with explicit stages.</text><text x="150" y="139" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Supported</text><rect x="60" y="191" width="180" height="90" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="150.0" y="244.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Active service</text><path d="M240 236L264 236" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="150" y="338" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Named owner</text><text x="360" y="139" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Deprecated</text><rect x="270" y="191" width="180" height="90" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="360.0" y="244.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Migration</text><path d="M450 236L474 236" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="360" y="338" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Move consumers</text><text x="570" y="139" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Retired</text><rect x="480" y="191" width="180" height="90" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="570.0" y="244.16" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Service ended</text><text x="570" y="338" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Retention decision</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Retirement closes service; retention governs stored</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">copies.</text></svg>