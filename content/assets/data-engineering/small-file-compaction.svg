<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="file-set-replacement"><title id="title">Small-file compaction</title><desc id="desc">Snapshot v41 has f1–f4. Compaction writes g1 containing the same E1–E4. Concurrent ingestion adds f5 with E5 in v42. Validated v43 references g1 plus f5; the append must not be lost and old readers retain old files. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Rewrite file layout without changing logical</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">records.</text><text x="54" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Snapshot</text><text x="193.04" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">File set</text><text x="471.12" y="137" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Logical records</text><path d="M44 153L676 153" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="113.52" y="203.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">v41</text><text x="322.08000000000004" y="203.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">f1, f2, f3, f4</text><text x="568.56" y="203.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E1–E4</text><path d="M44 232L676 232" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="113.52" y="275.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">v42</text><text x="322.08000000000004" y="275.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">f1–f4 + f5</text><text x="568.56" y="275.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E1–E5</text><path d="M44 304L676 304" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="113.52" y="347.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">v43</text><rect x="183.04" y="305" width="278.08000000000004" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="322.08000000000004" y="347.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">g1 + f5</text><rect x="461.12" y="305" width="214.88" height="68" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="568.56" y="347.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">E1–E5</text><path d="M44 376L676 376" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Commit against current metadata; retire old files only when</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">safe.</text></svg>