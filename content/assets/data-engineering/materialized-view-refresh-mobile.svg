<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1264" viewBox="0 0 360 1264" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Refresh failure keeps the old result</title><desc id="desc">A full refresh starts from published generation 2 with four sales totaling 11000 cents. Rebuilding after source corrections would publish generation 3 with three sales totaling 7000 cents. An injected publication failure rolls back to generation 2; a successful retry publishes generation 3 and the corrected result together.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1264" fill="#fff"/><text x="24" y="34" font-size="21" fill="#252c28">Failure keeps the old result</text><text x="24" y="78" font-size="17" fill="#626962">Shop A / USD. All amounts in cents.</text><rect x="24" y="112" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="146" font-size="18" fill="#252c28">1. Published before refresh</text><text x="40" y="196" font-size="20" fill="#252c28">G2 / 4 sales / 11000 cents</text><text x="40" y="244" font-size="16" fill="#626962">Readers use the complete old result.</text><path d="M72 288V344" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="320" font-size="17" fill="#626962">Build candidate</text><rect x="24" y="348" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="382" font-size="18" fill="#252c28">2. Candidate inside transaction</text><text x="40" y="432" font-size="20" fill="#252c28">G3 / 3 sales / 7000 cents</text><text x="40" y="480" font-size="16" fill="#626962">Candidate is not yet published.</text><path d="M72 524V580" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="556" font-size="17" fill="#626962">Abort / rollback</text><rect x="24" y="584" width="312" height="176" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="618" font-size="18" fill="#252c28">3. Failure rolls back</text><text x="40" y="668" font-size="20" fill="#252c28">G2 / 4 sales / 11000 cents</text><text x="40" y="716" font-size="16" fill="#626962">Old rows and generation are restored.</text><path d="M72 760V816" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="792" font-size="17" fill="#626962">Retry / commit</text><rect x="24" y="820" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="854" font-size="18" fill="#252c28">4. Retry commits</text><text x="40" y="904" font-size="20" fill="#252c28">G3 / 3 sales / 7000 cents</text><text x="40" y="952" font-size="16" fill="#626962">Rows and generation commit together.</text><rect x="24" y="1088" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="1122" font-size="18" fill="#252c28">Generation is a publication identity.</text><text x="40" y="1166" font-size="18" fill="#626962">It is not a source watermark.</text><text x="40" y="1206" font-size="16" fill="#626962">Readers may retain an older snapshot.</text></svg>
