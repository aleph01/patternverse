<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="identity-state"><title id="title">Stateful stream deduplication</title><desc id="desc">A/E901 appears twice, but A/E902 and B/E901 are distinct events despite equal amounts. Deduplication on source plus event ID yields three accepted events totaling 120 while state is retained. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Remember event identity within a declared</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">horizon.</text><text x="54" y="128" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Source / ID</text><text x="325.76" y="128" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Amount</text><text x="464.79999999999995" y="128" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Decision</text><path d="M44 144L676 144" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="179.88" y="187.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">A / E901</text><text x="385.28" y="187.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">40</text><rect x="454.79999999999995" y="152" width="221.20000000000005" height="53" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="565.4" y="187.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Accept</text><path d="M44 208L676 208" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="179.88" y="244.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">A / E901</text><text x="385.28" y="244.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">40</text><text x="565.4" y="244.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Duplicate</text><path d="M44 265L676 265" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="179.88" y="301.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">A / E902</text><text x="385.28" y="301.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">40</text><rect x="454.79999999999995" y="266" width="221.20000000000005" height="53" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="565.4" y="301.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Accept</text><path d="M44 322L676 322" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="179.88" y="358.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">B / E901</text><text x="385.28" y="358.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">40</text><rect x="454.79999999999995" y="323" width="221.20000000000005" height="53" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="565.4" y="358.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Accept</text><path d="M44 379L676 379" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Three events = 120. Equal payloads are not duplicate</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">identities.</text></svg>