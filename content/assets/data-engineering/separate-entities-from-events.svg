<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="entity-and-event-track"><title id="title">Separate entities from events</title><desc id="desc">Ticket T902 has one continuing identity and four events: opened, resolved, reopened, resolved again. Two resolution events do not imply two tickets. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">One ticket. Four distinct occurrences.</text><rect x="250.0" y="103.0" width="220" height="60" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="360.0" y="141.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Ticket T902</text><path d="M360 163L360 218" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M77 313L643 313" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M77 307L77 319" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="77" y="348" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">09:00</text><path d="M263 307L263 319" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="263" y="348" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10:15</text><path d="M450 307L450 319" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="450" y="348" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">11:00</text><path d="M643 307L643 319" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="643" y="348" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">12:30</text><circle cx="77" cy="313" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><text x="77" y="259" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Opened</text><circle cx="263" cy="313" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><text x="263" y="259" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Resolved</text><circle cx="450" cy="313" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><text x="450" y="259" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Reopened</text><circle cx="643" cy="313" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><text x="643" y="259" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Resolved</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Current state: resolved. Event identities remain distinct.</text></svg>