font-size="26" fill="#252c28" text-anchor="middle" data-label="1">−0.1 °C</text><circle cx="610" cy="205" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><text x="610" y="158" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">+0.4 °C</text><circle cx="120" cy="345" r="5" fill="#252c28" stroke="#252c28" stroke-width="1.5"/><text x="120" y="391" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">08:59</text><circle cx="275" cy="345" r="5" fill="#252c28" stroke="#252c28" stroke-width="1.5"/><text x="275" y="391" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">09:05</text><path d="M275 335V275H150V220" fill="none" stroke="#00855b" stroke-width="1.2" marker-end="url(#arrow)"/><circle cx="440" cy="345" r="5" fill="#252c28" stroke="#252c28" stroke-width="1.5"/><text x="440" y="391" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">09:10</text><path d="M440 335V275H360V220" fill="none" stroke="#00855b" stroke-width="1.2" marker-end="url(#arrow)"/><text x="44" y="449" font-size="24" fill="#252c28" text-anchor="start" data-label="1">D7 readings; equality is eligible.</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">08:59 → no match; 09:05 → +0.2 °C; 09:10 → −0.1 °C</text></svg>