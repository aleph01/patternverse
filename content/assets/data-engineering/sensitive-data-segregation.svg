<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="access-boundary"><title id="title">Sensitive-data segregation</title><desc id="desc">Contact data is stored in a restricted area while analytics uses a limited reference. An authorized notification workflow crosses the boundary for its defined purpose. General analytics readers do not get contact access. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Keep sensitive detail behind a narrower boundary.</text><rect x="44" y="130" width="280" height="270" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="54" y="115" width="220.0" height="28" fill="#fff" stroke="none" stroke-width="1.2"/><text x="64" y="135" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Analytics access</text><rect x="396" y="130" width="280" height="270" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="406" y="115" width="245.0" height="28" fill="#fff" stroke="none" stroke-width="1.2"/><text x="416" y="135" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Restricted contact</text><text x="75" y="215" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Customer ref</text><text x="75" y="282" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Limited facts</text><text x="425" y="215" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Phone / email</text><text x="425" y="282" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Contact identity</text><path d="M330 350H388" fill="none" stroke="#00855b" stroke-width="1.2" marker-end="url(#arrow)"/><text x="360" y="459" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Authorized notification workflow</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Separate storage and enforce the access boundary.</text></svg>