<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1128" viewBox="0 0 720 1128" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Fixed workload capacity partitions contain interference</title><desc id="desc">A fixed allocation divides twenty worker permits into twelve for live processing, four for backfills, and four for exploration. Backfills at their four-permit limit cannot take the live allowance. Each class has its own admission boundary; all still depend on shared systems that need separate limits.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1128" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Separate allowances protect a named resource</text><rect x="24" y="112" width="672" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Fixed allocation: 20 worker permits</text><text x="40" y="167" font-size="17" fill="#626962">Live processing 12; backfills 4; exploration 4. No borrowing in this example.</text><rect x="24" y="304" width="672" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="338" font-size="20" fill="#252c28">LIVE / 12</text><rect x="272" y="328" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="304" y="328" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="336" y="328" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="368" y="328" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="400" y="328" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="432" y="328" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="272" y="360" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="304" y="360" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="336" y="360" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="368" y="360" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="400" y="360" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="432" y="360" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="418" font-size="18" fill="#626962">Its allowance remains separate.</text><rect x="24" y="512" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="546" font-size="20" fill="#252c28">BACKFILL / 4</text><rect x="272" y="536" width="22" height="22" fill="#00855b" stroke="#00855b" stroke-width="1.2"/><rect x="304" y="536" width="22" height="22" fill="#00855b" stroke="#00855b" stroke-width="1.2"/><rect x="336" y="536" width="22" height="22" fill="#00855b" stroke="#00855b" stroke-width="1.2"/><rect x="368" y="536" width="22" height="22" fill="#00855b" stroke="#00855b" stroke-width="1.2"/><text x="40" y="626" font-size="18" fill="#626962">Full: excess backfill stays outside.</text><rect x="24" y="720" width="672" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="754" font-size="20" fill="#252c28">EXPLORATION / 4</text><rect x="272" y="744" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="304" y="744" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="336" y="744" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><rect x="368" y="744" width="22" height="22" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="834" font-size="18" fill="#626962">Independent admission boundary.</text><rect x="24" y="944" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="976" font-size="20" fill="#252c28">The protected resource here is worker concurrency</text><text x="40" y="1018" font-size="17" fill="#626962">Squares are permits, not automatically reserved CPU, memory or connections.</text><text x="40" y="1060" font-size="17" fill="#626962">Shared downstream limits and data correctness remain separate obligations.</text></svg>
