<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="typed-lineage-graph"><title id="title">Graph relationships</title><desc id="desc">Orders and Customers feed Build Sales, which produces Sales. Sales feeds Daily Report and Partner Export, combining inputs and branching consumers. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Typed edges reveal the downstream impact.</text><path d="M130 164L310 204" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M590 164L410 204" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M360 275L360 314" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M340 384L210 414" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M380 384L510 414" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="45.0" y="100.0" width="170" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="130.0" y="138.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Orders</text><rect x="505.0" y="100.0" width="170" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="590.0" y="138.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Customers</text><rect x="265.0" y="210.0" width="190" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="360.0" y="248.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Build Sales</text><rect x="280.0" y="320.0" width="160" height="60" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="360.0" y="358.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Sales</text><rect x="45.0" y="420.0" width="210" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="150.0" y="458.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Daily Report</text><rect x="465.0" y="420.0" width="210" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="570.0" y="458.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Partner Export</text><text x="360" y="183" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Input to</text><text x="390" y="305" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Produces</text><text x="360" y="431" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Feeds</text></svg>