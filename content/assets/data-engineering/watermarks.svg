<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc"><title id="title">Watermarks: the slower active input sets the combined watermark</title><desc id="desc">On a shared event-time scale, West reports 10:12 and East 10:06. The combined minimum is 10:06, short of the 10:10 window end. When East advances to 10:11 the combined watermark passes the window end and an end-of-window trigger can fire. Watermarks are progress estimates, not proof that every event has arrived.</desc><style>
:root{color-scheme:only light;--ink:#252c28;--line:#a6aca3;--stone:#f1f2ef;--mint:#edf5f0;--green:#00855b}
svg{background:#fff;color:var(--ink)}
path,rect,line,circle{stroke-linejoin:round;stroke-linecap:butt}
text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:26px;font-weight:400;fill:var(--ink)}
.small{font-size:23px}.accent-text{fill:var(--green)}
.hair{fill:none;stroke:var(--line);stroke-width:1.2}.line{fill:none;stroke:var(--ink);stroke-width:1.5}.accent{fill:none;stroke:var(--green);stroke-width:1.8}
.stone{fill:var(--stone)}.mint{fill:var(--mint)}.paper{fill:#fff;stroke:var(--line);stroke-width:1.2}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="50" class="" text-anchor="start">Two active inputs. Combined watermark.</text><text x="178" y="100" class="small" text-anchor="start">Event time →</text><rect x="363" y="114" width="185" height="256" class="stone"/><rect x="178" y="114" width="222" height="256" class="mint"/><text x="44" y="175" class="small" text-anchor="start">West</text><path d="M178 167H651.6" class="hair" /><path d="M178 167H622" class="line" /><circle cx="622" cy="167" r="5" fill="#252c28"/><text x="622" y="145" class="small" text-anchor="middle">10:12</text><text x="44" y="258" class="small" text-anchor="start">East</text><path d="M178 250H651.6" class="hair" /><path d="M178 250H400" class="line" /><circle cx="400" cy="250" r="5" fill="#252c28"/><text x="422" y="228" class="small" text-anchor="start">10:06</text><path d="M400 115V370" class="accent" /><text x="44" y="335" class="small" text-anchor="start">Combined</text><circle cx="400" cy="327" r="5" fill="#00855b"/><text x="386" y="335" class="small accent-text" text-anchor="end">10:06</text><path d="M363 369V385H548V369" class="hair" /><text x="455.5" y="417" class="small" text-anchor="middle">Window 10:05–10:10</text><text x="44" y="463" class="small" text-anchor="start">East advances to 10:11</text><path d="M400 495H585" class="accent" marker-end="url(#arrow)"/><path d="M548 479V511" class="hair" /><circle cx="585" cy="495" r="5" fill="#00855b"/><text x="599" y="503" class="small accent-text" text-anchor="start">10:11</text><text x="44" y="542" class="small" text-anchor="start">The window can emit; later events are still possible.</text></svg>