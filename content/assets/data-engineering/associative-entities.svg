<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="relationship-records"><title id="title">Associative entities give relationships their own records</title><desc id="desc">Three enrollment records connect two students and two offerings. Each enrollment has a student, an offering and a grade. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">The grade belongs to the enrollment.</text><text x="44" y="118" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Enrollment</text><text x="54" y="160" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Student</text><text x="264.66666666666663" y="160" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Offering</text><text x="475.3333333333333" y="160" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Grade</text><path d="M44 176L676 176" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="149.33333333333331" y="216.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">S17</text><text x="360.0" y="216.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">O42</text><rect x="465.3333333333333" y="184" width="210.66666666666669" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="570.6666666666666" y="216.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">A</text><path d="M44 235L676 235" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="149.33333333333331" y="268.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">S17</text><text x="360.0" y="268.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">O55</text><rect x="465.3333333333333" y="236" width="210.66666666666669" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="570.6666666666666" y="268.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">B</text><path d="M44 287L676 287" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="149.33333333333331" y="320.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">S28</text><text x="360.0" y="320.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">O42</text><rect x="465.3333333333333" y="288" width="210.66666666666669" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="570.6666666666666" y="320.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">B+</text><path d="M44 339L676 339" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">A relationship can have its own identity and attributes.</text></svg>