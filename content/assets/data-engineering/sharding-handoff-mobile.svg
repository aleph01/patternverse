<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1072" viewBox="0 0 360 1072" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">A quiesced bucket handoff</title><desc id="desc">With requests paused, copy bucket 6 from B to D, change the authoritative owner from B at version 12 to D at version 13, and remove B’s old copy. After requests resume, an old version-12 write to B is rejected; a refreshed version-13 read from D returns paid.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="1072" fill="#fff"/><text x="24" y="36" font-size="22" fill="#252c28">Move placement, keep identity</text><text x="24" y="78" font-size="17" fill="#626962">Requests pause throughout steps 1–3.</text><rect x="24" y="112" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="146" font-size="19" fill="#252c28">1. Before the move</text><text x="40" y="190" font-size="19" fill="#252c28">v12: bucket 6 → B</text><text x="40" y="228" font-size="17" fill="#626962">B has T7 / O71 / paid</text><path d="M72 256V316" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="294" font-size="17" fill="#626962">Copy selected rows</text><rect x="24" y="320" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="354" font-size="19" fill="#252c28">2. Copy bucket 6 to D</text><text x="40" y="398" font-size="19" fill="#252c28">v12: B still owns it</text><text x="40" y="436" font-size="17" fill="#626962">D is a copy, not a second writer</text><path d="M72 464V524" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="502" font-size="17" fill="#626962">Change ownership</text><rect x="24" y="528" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="562" font-size="19" fill="#252c28">3. Publish placement; clean up</text><text x="40" y="606" font-size="19" fill="#252c28">v13: bucket 6 → D</text><text x="40" y="644" font-size="17" fill="#626962">Remove bucket 6 rows from B</text><path d="M72 672V732" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="96" y="710" font-size="17" fill="#626962">Resume requests</text><rect x="24" y="736" width="312" height="224" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="770" font-size="18" fill="#252c28">4. Validate each routed operation</text><text x="40" y="814" font-size="18" fill="#252c28">Old v12 write → B: rejected</text><text x="40" y="854" font-size="18" fill="#252c28">Fresh v13 read → D: paid</text><text x="40" y="900" font-size="18" fill="#626962">Bucket 6 keeps its identity.</text><text x="40" y="938" font-size="18" fill="#626962">Old B copy: absent</text><text x="24" y="1000" font-size="17" fill="#626962">Quiesced, in-memory teaching model.</text><text x="24" y="1032" font-size="17" fill="#626962">No online or crash-recovery guarantee.</text></svg>
