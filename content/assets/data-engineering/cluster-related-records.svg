<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="block-locality"><title id="title">Cluster related records</title><desc id="desc">Tenant 7 occurs in every block before clustering. After sorting, tenant 7 is concentrated in blocks 1 and 2; block 2 also contains tenant 8 and requires residual filtering. Clustering is not a uniqueness constraint. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Bring similar records into fewer scanned blocks.</text><text x="44" y="128" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Before: tenant 7 scattered</text><rect x="44.0" y="155" width="149.0" height="115" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="118.5" y="187" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">7</text><text x="118.5" y="217" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">8</text><text x="118.5" y="247" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">9</text><rect x="205.0" y="155" width="149.0" height="115" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="279.5" y="187" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">8</text><text x="279.5" y="217" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">7</text><text x="279.5" y="247" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">9</text><rect x="366.0" y="155" width="149.0" height="115" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="440.5" y="187" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">9</text><text x="440.5" y="217" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">8</text><text x="440.5" y="247" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">7</text><rect x="527.0" y="155" width="149.0" height="115" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="601.5" y="187" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">7</text><text x="601.5" y="217" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">9</text><text x="601.5" y="247" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">8</text><text x="44" y="328" font-size="24" fill="#252c28" text-anchor="start" data-label="1">After: nearby values share blocks</text><rect x="44.0" y="355" width="149.0" height="115" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="118.5" y="387" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">7</text><text x="118.5" y="417" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">7</text><text x="118.5" y="447" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">7</text><rect x="205.0" y="355" width="149.0" height="115" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="279.5" y="387" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">7</text><text x="279.5" y="417" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">8</text><text x="279.5" y="447" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">8</text><rect x="366.0" y="355" width="149.0" height="115" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="440.5" y="387" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">8</text><text x="440.5" y="417" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">8</text><text x="440.5" y="447" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">9</text><rect x="527.0" y="355" width="149.0" height="115" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="601.5" y="387" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">9</text><text x="601.5" y="417" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">9</text><text x="601.5" y="447" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">9</text><text x="44" y="538" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Metadata prunes blocks; exact predicates still filter rows.</text></svg>