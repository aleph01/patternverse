<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1072" viewBox="0 0 720 1072" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Dead Letter Channel: owned recovery path</title><desc id="desc">Instruction E901 remains on the normal orders path while classified dependency failures are within a three-failure budget. At the third failure, a safe handoff preserves the original instruction and failure context in the dead letter channel. Diagnosis and repair precede controlled redrive through the normal idempotent receiver.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="720" height="1072" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Preserve work beyond normal recovery</text><rect x="24" y="112" width="672" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="141" font-size="20" fill="#252c28">Normal orders path</text><text x="40" y="167" font-size="17" fill="#626962">Illustrative policy: three classified dependency failures</text><path d="M360 208V248H180V286" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 248H540V286" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="288" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="317" font-size="20" fill="#252c28">Fewer than 3 failures</text><text x="40" y="343" font-size="17" fill="#626962">Stay on the normal retry path.</text><text x="40" y="398" font-size="17" fill="#626962">Use the existing delay policy.</text><rect x="384" y="288" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="400" y="317" font-size="20" fill="#252c28">3 failures reached</text><text x="400" y="343" font-size="17" fill="#626962">Safe handoff to failure channel</text><text x="400" y="398" font-size="17" fill="#626962">Preserve the recoverable copy.</text><path d="M540 432V510" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="512" width="672" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="541" font-size="20" fill="#252c28">Dead letter channel: E901 is still unresolved</text><text x="40" y="567" font-size="17" fill="#626962">Identity + original bytes + failure category + attempts + timestamps</text><text x="40" y="620" font-size="18" fill="#626962">Retain source destination and processing version; assign an owner.</text><path d="M360 656V734" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="376" y="704" font-size="17" fill="#626962">owner investigates</text><rect x="24" y="736" width="672" height="160" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="765" font-size="20" fill="#252c28">Repair, then controlled redrive</text><text x="40" y="791" font-size="17" fill="#626962">Revalidate and preserve logical event identity.</text><text x="40" y="852" font-size="18" fill="#626962">Use the normal idempotent receiver and verify the business outcome.</text><text x="24" y="976" font-size="18" fill="#252c28">Arrows: disposition and recovery paths. Redrive is not an automatic loop.</text><text x="24" y="1016" font-size="18" fill="#626962">This budget is an application policy, not a universal broker counter.</text></svg>
