<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="dimension-roles"><title id="title">Role-playing dimensions</title><desc id="desc">Order line L1 references the shared date dimension as Order Oct30, Due Nov2 and Ship Nov3. Each role can be filtered independently. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">One calendar, three independent date roles.</text><rect x="225.0" y="103.0" width="270" height="60" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="360.0" y="141.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Date dimension</text><path d="M360 163L143 234" fill="none" stroke="#00855b" stroke-width="1.2"/><text x="143" y="275" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Order</text><rect x="57" y="309" width="172" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="143.0" y="344.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">30 Oct</text><path d="M360 163L360 234" fill="none" stroke="#00855b" stroke-width="1.2"/><text x="360" y="275" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Due</text><rect x="274" y="309" width="172" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="360.0" y="344.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">02 Nov</text><path d="M360 163L577 234" fill="none" stroke="#00855b" stroke-width="1.2"/><text x="577" y="275" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Ship</text><rect x="491" y="309" width="172" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="577.0" y="344.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">03 Nov</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">All three foreign keys belong to the same fact row.</text></svg>