<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="pinned-inputs"><title id="title">Deterministic transformations</title><desc id="desc">Batch B42, reference v7, logic v3, config C7, business date October 1, and UTC are pinned. Both executions select the same customer record R2 with identical logical content; ambient time or unpinned references would break the guarantee. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">The same complete inputs produce the same</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">result.</text><text x="54" y="133" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Pinned input</text><text x="395.28000000000003" y="133" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Value</text><path d="M44 149L676 149" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="214.64000000000001" y="191.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Source / reference</text><text x="530.64" y="191.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">B42 / v7</text><path d="M44 212L676 212" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="214.64000000000001" y="247.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Logic / config</text><text x="530.64" y="247.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">v3 / C7</text><path d="M44 268L676 268" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="214.64000000000001" y="303.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Business date / zone</text><text x="530.64" y="303.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Oct 1 / UTC</text><path d="M44 324L676 324" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="385" width="268" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="178.0" y="406.66" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Run A → R2 / selected</text><text x="178.0" y="433.66" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">customer record</text><rect x="406" y="385" width="270" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="541.0" y="406.66" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Run B → R2 / selected</text><text x="541.0" y="433.66" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">customer record</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Pin nondeterministic dependencies, ordering, and</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">precision.</text></svg>