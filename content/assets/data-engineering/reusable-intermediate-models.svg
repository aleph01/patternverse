<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="grain-safe-composition"><title id="title">Reusable intermediate models</title><desc id="desc">Order O42 has payments 60+40 and shipment costs EUR 5+7+8. Each is summarized independently before a one-order intermediate is reused. Joining raw child rows would multiply both totals. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Aggregate each many-side before joining it.</text><rect x="44" y="150" width="270" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="179.0" y="171.66" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Payments: EUR 60 +</text><text x="179.0" y="198.66" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">40</text><rect x="406" y="150" width="270" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="541.0" y="171.66" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Shipment costs: EUR 5</text><text x="541.0" y="198.66" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">+ 7 + 8</text><path d="M179 215L285 300" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M541 215L435 300" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="100" y="310" width="520" height="80" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="344.66" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">O42 · payments EUR 100 / shipping cost EUR</text><text x="360.0" y="371.66" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">20</text><text x="360" y="434" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Finance     Service     Operations</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">One row per order; one shared intermediate.</text></svg>