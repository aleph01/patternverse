<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1488" viewBox="0 0 360 1488" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Fan-out interests and shared workers are separate delivery boundaries</title><desc id="desc">OrderPlaced messages E901 and E902 fan out to fulfillment, analytics, and notifications subscriptions. Each subscription receives both messages as independent logical deliveries. Two fulfillment workers take a different message each from their shared fulfillment queue; they divide that workload rather than each receiving the full stream. Publisher acceptance does not mean subscriber work has completed.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1488" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Fan out by independent interest</text><rect x="24" y="104" width="312" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Order publisher</text><text x="40" y="159" font-size="17" fill="#626962">E901 / O42 and E902 / O43</text><path d="M180 200V286" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="252" font-size="17" fill="#626962">publish</text><rect x="24" y="288" width="312" height="112" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="317" font-size="20" fill="#252c28">Topic: orders</text><text x="40" y="343" font-size="17" fill="#626962">Route to matching subscriptions.</text><text x="24" y="464" font-size="18" fill="#252c28">Each subscription gets both.</text><rect x="24" y="520" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="549" font-size="20" fill="#252c28">Fulfillment subscription</text><text x="40" y="575" font-size="17" fill="#626962">E901, E902</text><rect x="24" y="704" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="733" font-size="20" fill="#252c28">Analytics subscription</text><text x="40" y="759" font-size="17" fill="#626962">E901, E902</text><rect x="24" y="888" width="312" height="112" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="917" font-size="20" fill="#252c28">Notifications subscription</text><text x="40" y="943" font-size="17" fill="#626962">E901, E902</text><path d="M24 344H12V576H22" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M12 576V760H22" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M12 760V944H22" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="1104" font-size="20" fill="#252c28">Fulfillment workers share work</text><rect x="24" y="1168" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="1197" font-size="20" fill="#252c28">Two workers, one subscription</text><text x="40" y="1223" font-size="17" fill="#626962">Worker A takes E901.</text><text x="40" y="1278" font-size="17" fill="#626962">Worker B takes E902.</text><text x="40" y="1314" font-size="16" fill="#626962">One take removes one message.</text><path d="M336 576H348V1256H338" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="1424" font-size="18" fill="#252c28">Other interests keep their copies.</text></svg>
