<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="two-clock-placement"><title id="title">Event-time processing</title><desc id="desc">Events of 30 and 70 are processed promptly in the 10:00–10:05 event-time window. A 20 event with timestamp 10:03 is processed at 10:09 and corrects the same window from 100 to 120 under the chosen late-data policy. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Group by when the event happened.</text><text x="54" y="128" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Event</text><text x="212.0" y="128" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Happened</text><text x="370.0" y="128" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Processed</text><text x="528.0" y="128" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Amount</text><path d="M44 144L676 144" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="123.0" y="190.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E1</text><text x="281.0" y="190.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">10:01</text><text x="439.0" y="190.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">10:02</text><text x="597.0" y="190.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">30</text><path d="M44 215L676 215" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="254.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E2</text><text x="281.0" y="254.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">10:04</text><text x="439.0" y="254.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">10:05</text><text x="597.0" y="254.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">70</text><path d="M44 279L676 279" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="318.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E3</text><rect x="202.0" y="280" width="158.0" height="60" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="281.0" y="318.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">10:03</text><text x="439.0" y="318.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">10:09</text><rect x="518.0" y="280" width="158.0" height="60" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="597.0" y="318.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">20</text><path d="M44 343L676 343" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><rect x="44" y="403" width="632" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="438.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Event window 10:00–10:05: 100 → 120</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Processing time drives execution; event time drives</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">membership.</text></svg>