<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="replicated-reference"><title id="title">Broadcast small inputs</title><desc id="desc">A complete reference v17 mapping country to region is broadcast to three workers. Each enriches its local large input without repartitioning it. The reference must fit worker memory and have the intended version. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Copy the small side to each processing worker.</text><rect x="175" y="125" width="370" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="160.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Reference v17</text><path d="M360 183L145 281" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="57.5" y="290.0" width="175" height="80" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="145.0" y="338.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Worker</text><text x="145" y="419" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Local + v17</text><path d="M360 183L360 281" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="272.5" y="290.0" width="175" height="80" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="360.0" y="338.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Worker</text><text x="360" y="419" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Local + v17</text><path d="M360 183L575 281" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="487.5" y="290.0" width="175" height="80" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="575.0" y="338.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Worker</text><text x="575" y="419" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Local + v17</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Memory cost grows with workers; pin the reference</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">meaning.</text></svg>