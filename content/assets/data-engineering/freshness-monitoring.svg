<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="stage-lag"><title id="title">Freshness monitoring</title><desc id="desc">At noon the source is at 12:00 and landing at 11:59:50, but the published dataset is only current through 11:43. A job succeeding at noon does not repair the seventeen-minute data lag against a five-minute objective. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Measure the age of usable data at the consumer.</text><text x="54" y="136" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Stage</text><text x="262.56" y="136" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Data through</text><text x="477.44000000000005" y="136" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Age at noon</text><path d="M44 152L676 152" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="148.28" y="202.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Source</text><text x="360.0" y="202.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">12:00</text><text x="571.72" y="202.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">0</text><path d="M44 231L676 231" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="148.28" y="274.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Landing</text><text x="360.0" y="274.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">11:59:50</text><text x="571.72" y="274.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">10 seconds</text><path d="M44 303L676 303" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="148.28" y="346.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Published</text><text x="360.0" y="346.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">11:43</text><text x="571.72" y="346.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">17 minutes</text><path d="M44 375L676 375" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="420" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Job status: successful at 12:00</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Published freshness misses the five-minute objective.</text></svg>