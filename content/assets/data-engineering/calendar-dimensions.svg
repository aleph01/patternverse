<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="calendar-membership"><title id="title">Calendar Dimensions</title><desc id="desc">A date dimension has one row per day. December 31, 2026 and January 1, 2027 have different calendar years but share ISO week 2026-W53 and, in an illustrative July-start fiscal calendar named by its ending year, fiscal year FY2027. Facts of 60 and 40 join by date key and sum to 100 in that ISO week. Calendar attributes are explicitly maintained rather than inferred from the year embedded in the date key. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Store calendar meaning alongside each date.</text><text x="54" y="138" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Date</text><text x="268.88" y="138" font-size="24" fill="#252c28" text-anchor="start" data-label="1">31 Dec 2026</text><text x="477.44" y="138" font-size="24" fill="#252c28" text-anchor="start" data-label="1">01 Jan 2027</text><path d="M44 154L676 154" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="151.44" y="194.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Date key</text><text x="363.15999999999997" y="194.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">20261231</text><text x="571.72" y="194.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">20270101</text><path d="M44 213L676 213" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="151.44" y="246.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Calendar year</text><text x="363.15999999999997" y="246.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">2026</text><text x="571.72" y="246.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">2027</text><path d="M44 265L676 265" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="151.44" y="298.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">ISO week</text><rect x="258.88" y="266" width="208.56" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="363.15999999999997" y="298.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">2026-W53</text><rect x="467.44" y="266" width="208.56" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="571.72" y="298.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">2026-W53</text><path d="M44 317L676 317" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="151.44" y="350.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Fiscal year</text><rect x="258.88" y="318" width="208.56" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="363.15999999999997" y="350.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">FY2027</text><rect x="467.44" y="318" width="208.56" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="571.72" y="350.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">FY2027</text><path d="M44 369L676 369" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="422" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Sales: 60 on Dec 31; 40 on Jan 1</text><rect x="44" y="452" width="632" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="487.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">ISO week 2026-W53 → 100</text><text x="44" y="538" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Fiscal year: Jul–Jun, labeled by ending year.</text></svg>