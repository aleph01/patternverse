<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="deadline-budget"><title id="title">Bounded retries</title><desc id="desc">The operation has at most four attempts, a ten-second total deadline, and a three-second per-attempt timeout. Attempts use 0–3,3.5–6.5,7.5–10 seconds. The deadline prevents attempt four and shortens attempt three. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Stop when attempts or the deadline is exhausted.</text><path d="M80 350L650 350" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M80 344L80 356" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="80" y="385" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">0 s</text><path d="M251 344L251 356" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="251" y="385" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">3</text><path d="M451 344L451 356" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="451" y="385" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">6.5</text><path d="M650 344L650 356" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="650" y="385" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10 s</text><rect x="80" y="195" width="171" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="165.5" y="230.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Try 1</text><rect x="280" y="195" width="171" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="365.5" y="230.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Try 2</text><rect x="508" y="195" width="142" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="579.0" y="230.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Try 3</text><path d="M650 135L650 405" fill="none" stroke="#00855b" stroke-width="1.2"/><text x="650" y="449" font-size="24" fill="#252c28" text-anchor="end" data-label="1">Deadline</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Maximum four attempts does not guarantee four are</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">allowed.</text></svg>