<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="snapshot-series"><title id="title">Periodic snapshots: sum locations at a common cutoff, choose balances across time</title><desc id="desc">One item has six underlying observations: one per warehouse and closing day. Warehouses A and B are pivoted into columns here. Daily totals 20, 16, 25 cannot be added to obtain closing inventory; the latest total is25. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">A balance is measured at each period boundary.</text><text x="54" y="133" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Closing day</text><text x="212.0" y="133" font-size="24" fill="#252c28" text-anchor="start" data-label="1">A</text><text x="370.0" y="133" font-size="24" fill="#252c28" text-anchor="start" data-label="1">B</text><text x="528.0" y="133" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Total</text><path d="M44 149L676 149" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="123.0" y="189.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Jun 1</text><text x="281.0" y="189.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">12</text><text x="439.0" y="189.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">8</text><text x="597.0" y="189.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">20</text><path d="M44 208L676 208" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="241.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Jun 2</text><text x="281.0" y="241.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">9</text><text x="439.0" y="241.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">7</text><text x="597.0" y="241.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">16</text><path d="M44 260L676 260" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="293.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Jun 3</text><text x="281.0" y="293.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">15</text><text x="439.0" y="293.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">10</text><rect x="518.0" y="261" width="158.0" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="597.0" y="293.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">25</text><path d="M44 312L676 312" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="402" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Grain: item × warehouse × closing day</text><text x="44" y="445" font-size="24" fill="#252c28" text-anchor="start" data-label="1">A and B are warehouses, pivoted for display.</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Latest balance: 25. Do not sum balances across days.</text></svg>