<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1232" viewBox="0 0 360 1232" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">The example rejects full-subscription fan-out and explicitly drops deleted backlog</title><desc id="desc">Notifications has two pending messages and a capacity of two. A third publication is rejected before any queue changes, even though fulfillment has space. After notifications is unsubscribed and its backlog discarded, a later publication targets only fulfillment and analytics. This is the simulation’s chosen capacity policy, not a universal broker guarantee.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker><marker id="wiring" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#626962" stroke-width="1.2"/></marker></defs><rect width="360" height="1232" fill="#fff"/><text x="24" y="32" font-size="22" fill="#252c28">Capacity and deletion are policies</text><rect x="24" y="104" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="133" font-size="20" fill="#252c28">Capacity: 2 pending per queue</text><text x="40" y="159" font-size="17" fill="#626962">Fulfillment 0/2; analytics 1/2</text><text x="40" y="214" font-size="17" fill="#626962">Notifications 2/2: full.</text><path d="M180 248V334" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="294" font-size="17" fill="#626962">publish E903</text><rect x="24" y="336" width="312" height="144" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="365" font-size="20" fill="#252c28">Full queue: reject publication</text><text x="40" y="391" font-size="17" fill="#626962">No target queue changes.</text><text x="40" y="446" font-size="17" fill="#626962">There is no partial enqueue.</text><path d="M180 480V566" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="532" font-size="17" fill="#626962">unsubscribe</text><rect x="24" y="568" width="312" height="144" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="597" font-size="20" fill="#252c28">Delete notifications</text><text x="40" y="623" font-size="17" fill="#626962">Discard pending E901 and E902.</text><path d="M180 712V798" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="196" y="764" font-size="17" fill="#626962">retry E903</text><rect x="24" y="800" width="312" height="176" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="829" font-size="20" fill="#252c28">Two remaining targets</text><text x="40" y="855" font-size="17" fill="#626962">Fulfillment 1/2</text><text x="40" y="910" font-size="17" fill="#626962">Analytics 2/2; return count: 2</text><text x="24" y="1040" font-size="18" fill="#252c28">Publish counts enqueues.</text><text x="24" y="1080" font-size="17" fill="#626962">Pending work was not processed.</text><text x="24" y="1144" font-size="18" fill="#252c28">This policy can block publishing.</text><text x="24" y="1184" font-size="17" fill="#626962">No crash-atomic fan-out is claimed.</text></svg>
