<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="absence-classification"><title id="title">Distinguish missing, unknown, and inapplicable</title><desc id="desc">A missing transit duration can mean unknown physical transit, inapplicable digital fulfillment, or unexplained source omission. These require different handling. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Absence does not tell you its cause.</text><text x="54" y="138" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Value</text><text x="142.48000000000002" y="138" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Reason</text><text x="332.08000000000004" y="138" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Meaning</text><path d="M44 154L676 154" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="88.24000000000001" y="194.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">—</text><rect x="132.48000000000002" y="162" width="189.60000000000002" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="227.28000000000003" y="194.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Unknown</text><text x="499.04" y="194.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Carrier cannot say</text><path d="M44 213L676 213" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="88.24000000000001" y="246.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">—</text><rect x="132.48000000000002" y="214" width="189.60000000000002" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="227.28000000000003" y="246.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Inapplicable</text><text x="499.04" y="246.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Digital fulfillment</text><path d="M44 265L676 265" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="88.24000000000001" y="298.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">—</text><rect x="132.48000000000002" y="266" width="189.60000000000002" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="227.28000000000003" y="298.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Unclassified</text><text x="499.04" y="298.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Investigate source</text><path d="M44 317L676 317" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Do not replace all three with zero.</text></svg>