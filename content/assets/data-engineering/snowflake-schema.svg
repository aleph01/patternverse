<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="normalized-dimension-chain"><title id="title">Snowflake schema</title><desc id="desc">Sale lines reference Products, which reference Subcategories, which reference Category. Adapter and Case roll up to Accessories without multiplying sale rows. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Normalize the descriptive branch.</text><rect x="200.0" y="98.0" width="320" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="360.0" y="136.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Sale lines · USD 87</text><path d="M360 158L360 200" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="420" y="193" font-size="24" fill="#252c28" text-anchor="start" data-label="1">many → one</text><rect x="150.0" y="205.0" width="420" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="360.0" y="243.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Products · Adapter / Case</text><path d="M360 265L360 307" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="420" y="300" font-size="24" fill="#252c28" text-anchor="start" data-label="1">many → one</text><rect x="210.0" y="312.0" width="300" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="360.0" y="350.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Subcategories</text><path d="M360 372L360 414" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="420" y="407" font-size="24" fill="#252c28" text-anchor="start" data-label="1">many → one</text><rect x="160.0" y="419.0" width="400" height="60" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="360.0" y="457.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Category · Accessories</text><text x="44" y="538" font-size="24" fill="#252c28" text-anchor="start" data-label="1">3 sale lines; the USD 87 total is preserved.</text></svg>