<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="attributed-access-chain"><title id="title">Access audit trails</title><desc id="desc">Mira requests R17/C17 through service support under query Q9. Trusted attribution links the user and service identity to the access event. A denied R18 request has no database access event. A log entry does not prove a human read or understood the result. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Preserve who requested what and what actually</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">happened.</text><rect x="44" y="140" width="632" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="175.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Mira → support service → Q9 → R17 / C17</text><text x="54" y="277" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Request</text><text x="338.40000000000003" y="277" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Access event</text><path d="M44 293L676 293" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="186.20000000000002" y="344.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">R17 / C17 allowed</text><text x="502.20000000000005" y="344.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Attributed query Q9</text><path d="M44 374L676 374" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="186.20000000000002" y="418.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">R18 denied</text><text x="502.20000000000005" y="418.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">No database read</text><path d="M44 448L676 448" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Link decisions and actual access with trusted identity</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">context.</text></svg>