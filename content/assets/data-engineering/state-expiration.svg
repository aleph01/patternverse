<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="state-retention-boundary"><title id="title">State expiration</title><desc id="desc">For window [10:00,10:05) with ten minutes of allowed lateness, state exists at watermark 10:12 and is expired after the cleanup boundary at watermark 10:16. Physical reclamation and result retention are separate concerns. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Expire state when its correctness horizon is past.</text><rect x="80" y="176" width="470" height="85" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="315.0" y="227.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Window state retained</text><path d="M80 350L660 350" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M80 344L80 356" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="80" y="385" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10:05</text><path d="M390 344L390 356" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="390" y="385" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10:12</text><path d="M550 344L550 356" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="550" y="385" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10:15</text><path d="M660 344L660 356" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="660" y="385" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">10:16</text><path d="M550 130L550 382" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="4 4"/><text x="570" y="443" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Cleanup eligible</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">State lifetime is part of the late-data correctness contract.</text></svg>