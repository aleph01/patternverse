<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="boundary-ownership"><title id="title">Half-open time intervals</title><desc id="desc">July is [July 1, August 1); August is [August 1, September 1). A boundary event belongs to exactly one interval. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Include the start; exclude the end.</text><rect x="90" y="175" width="260" height="70" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="220.0" y="218.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">July</text><rect x="350" y="270" width="280" height="70" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="490.0" y="313.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">August</text><circle cx="90" cy="210" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><circle cx="350" cy="210" r="7" fill="#fff" stroke="#252c28" stroke-width="1.5"/><circle cx="350" cy="305" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><circle cx="630" cy="305" r="7" fill="#fff" stroke="#00855b" stroke-width="1.5"/><path d="M350 150L350 390" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M90 385L630 385" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M90 379L90 391" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="90" y="420" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Jul 1</text><path d="M350 379L350 391" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="350" y="420" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Aug 1</text><path d="M630 379L630 391" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="630" y="420" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Sep 1</text><text x="90" y="126" font-size="26" fill="#00855b" text-anchor="start" data-label="1">[start, end)</text><text x="44" y="493" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Event at exactly Aug 1 belongs to August.</text></svg>