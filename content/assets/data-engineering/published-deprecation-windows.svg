<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="migration-calendar"><title id="title">Published deprecation windows</title><desc id="desc">Notice is published January 12 with a usable replacement. A February 26 checkpoint and April 5 readiness check precede April 12,2027 at 00:00 UTC retirement. Historical decoding and retention have separate policies; announcing a date alone does not establish migration readiness. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Give consumers a usable replacement and a</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">known deadline.</text><path d="M90 300L650 300" fill="none" stroke="#a6aca3" stroke-width="1.2"/><path d="M90 294L90 306" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="90" y="335" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Jan 12</text><path d="M290 294L290 306" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="290" y="335" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Feb 26</text><path d="M480 294L480 306" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="480" y="335" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Apr 5</text><path d="M650 294L650 306" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="650" y="335" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Apr 12</text><circle cx="90" cy="300" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><circle cx="290" cy="300" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><circle cx="480" cy="300" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><circle cx="650" cy="300" r="5" fill="#00855b" stroke="#00855b" stroke-width="1.5"/><text x="90" y="155" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Notice +</text><text x="90" y="186" font-size="24" fill="#252c28" text-anchor="start" data-label="1">replacement</text><text x="290" y="410" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Checkpoint</text><text x="480" y="155" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Readiness</text><text x="480" y="186" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">check</text><text x="676" y="410" font-size="24" fill="#252c28" text-anchor="end" data-label="1">Retire</text><text x="676" y="450" font-size="24" fill="#252c28" text-anchor="end" data-label="1">12 Apr 2027, 00:00 UTC</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Keep the old interface supported through the declared</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">window.</text></svg>