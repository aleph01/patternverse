<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="path-labelled-tree"><title id="title">Materialized paths</title><desc id="desc">Workspace 1 carries /1/, Finance 2 /1/2/, Projects 3 /1/3/, Forecast 4 /1/2/4/, and Apollo 5 /1/3/5/. Moving Finance under Projects rewrites the Finance and Forecast prefixes while IDs remain stable. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Each node carries its root-to-node path.</text><path d="M250 135L175 243" fill="none" stroke="#00855b" stroke-width="1.2"/><path d="M470 135L545 243" fill="none" stroke="#00855b" stroke-width="1.2"/><path d="M175 297H60V375H175" fill="none" stroke="#00855b" stroke-width="1.2"/><path d="M545 297H660V375H545" fill="none" stroke="#00855b" stroke-width="1.2"/><rect x="250.0" y="108.0" width="220" height="54" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="360.0" y="143.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Workspace · 1</text><text x="360" y="187" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">/1/</text><rect x="77.5" y="243.0" width="195" height="54" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="175.0" y="278.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Finance · 2</text><text x="175" y="322" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">/1/2/</text><rect x="447.5" y="243.0" width="195" height="54" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="545.0" y="278.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Projects · 3</text><text x="545" y="322" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">/1/3/</text><rect x="77.5" y="375.0" width="195" height="54" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="175.0" y="410.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Forecast · 4</text><text x="175" y="454" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">/1/2/4/</text><rect x="447.5" y="375.0" width="195" height="54" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="545.0" y="410.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Apollo · 5</text><text x="545" y="454" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">/1/3/5/</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Moving a subtree changes every descendant path.</text></svg>