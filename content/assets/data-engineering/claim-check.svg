<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="reference-indirection"><title id="title">Claim Check</title><desc id="desc">A 20 MB payload is stored as P17 version 3. Event E17 carries its immutable reference. The consumer retrieves that exact version under the required authorization and retention policy. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Carry a durable reference to the large payload.</text><rect x="45.0" y="135.0" width="250" height="100" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="170.0" y="193.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">P17 · v3</text><text x="310" y="275" font-size="24" fill="#252c28" text-anchor="start" data-label="1">20 MB object</text><rect x="400.0" y="147.5" width="280" height="75" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="540.0" y="193.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">E17: ref P17/v3</text><path d="M295 185L392 185" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M540 225V385H310" fill="none" stroke="#00855b" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="45.0" y="355.0" width="250" height="60" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="170.0" y="393.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Consumer</text><path d="M170 350L170 244" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Store first; keep the referenced version retrievable.</text></svg>