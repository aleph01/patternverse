<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="transaction-boundary"><title id="title">Transactional consume-process-publish</title><desc id="desc">Processing input offset 104 adds 20 to state 100. One supported transaction commits the output, state or changelog 120, and next offset 105, or aborts all. External effects outside the transaction are excluded. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Commit outputs and consumed position together.</text><text x="44" y="119" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Input offset 104 · amount +20</text><rect x="44" y="163" width="632" height="230" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="54" y="148" width="332.5" height="28" fill="#fff" stroke="none" stroke-width="1.2"/><text x="64" y="168" font-size="24" fill="#252c28" text-anchor="start" data-label="1">One supported transaction</text><text x="78" y="220" font-size="26" fill="#00855b" text-anchor="start" data-label="1">Output record</text><text x="78" y="280" font-size="26" fill="#00855b" text-anchor="start" data-label="1">State / changelog = 120</text><text x="78" y="340" font-size="26" fill="#00855b" text-anchor="start" data-label="1">Next consumed offset = 105</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Commit all or abort all; external systems need their own</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">protocol.</text></svg>