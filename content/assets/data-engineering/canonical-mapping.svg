<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="value-mapping"><title id="title">Canonical mapping</title><desc id="desc">Web P means paid, ERP P means pending, and ERP S means settled, mapped to paid. Equal source codes do not necessarily share meaning. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Translate using source context and shared</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">meaning.</text><text x="44" y="113" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Source + code</text><text x="449" y="113" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Canonical status</text><rect x="44" y="145" width="230" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="159.0" y="180.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Web P</text><rect x="44" y="227" width="230" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="159.0" y="262.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">ERP P</text><rect x="44" y="309" width="230" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="159.0" y="344.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">ERP S</text><rect x="440" y="145" width="236" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="558.0" y="180.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">paid</text><rect x="440" y="227" width="236" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="558.0" y="262.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">pending</text><rect x="440" y="309" width="236" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="558.0" y="344.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">paid</text><path d="M274 172L433 172" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M274 254L433 254" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M274 336L433 336" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Keep original values and mapping version for traceability.</text></svg>