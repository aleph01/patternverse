<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="bounded-offset-ranges"><title id="title">Microbatch processing</title><desc id="desc">Offsets 100–102,103–105,106–108 form batches 41,42,43. A failed or uncertain batch 42 is replayed with the same bounded input and an idempotent or coordinated publication protocol. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Process a stream as successive bounded</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">batches.</text><rect x="44.0" y="173" width="202.66666666666666" height="100" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="145.33333333333331" y="205" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">100–102</text><text x="145.33333333333331" y="235" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Batch 41</text><rect x="258.66666666666663" y="173" width="202.66666666666666" height="100" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="359.99999999999994" y="205" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">103–105</text><text x="359.99999999999994" y="235" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Batch 42</text><rect x="473.3333333333333" y="173" width="202.66666666666666" height="100" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="574.6666666666666" y="205" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">106–108</text><text x="574.6666666666666" y="235" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Batch 43</text><path d="M455 290V365H267V290" fill="none" stroke="#00855b" stroke-width="1.2" marker-end="url(#arrow)"/><text x="360" y="421" font-size="24" fill="#252c28" text-anchor="middle" data-label="1">Replay the exact batch 42 range</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Checkpointed ranges bound the work; the sink must</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">handle retries.</text></svg>