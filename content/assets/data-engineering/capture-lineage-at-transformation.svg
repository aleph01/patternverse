<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="planned-recorded-lineage"><title id="title">Capture Lineage at Transformation</title><desc id="desc">Planned dependencies connect Captures and Refunds to Net sales without proving a particular execution. Recorded run R42 binds captures snapshot S52 and refunds snapshot F33 to logic L8 and output release R108, with a separate confirmed publication receipt. A later refund snapshot F34 is not substituted into R42’s historical record. Version bindings, run identity, and publication evidence support investigation; the existence of lineage does not establish data correctness or complete capture coverage. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Bind the output to the inputs actually used.</text><text x="44" y="108" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Planned dependencies</text><rect x="45.0" y="135.0" width="170" height="52" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="130.0" y="169.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Captures</text><rect x="295.0" y="135.0" width="170" height="52" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="380.0" y="169.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Refunds</text><rect x="490.0" y="203.0" width="180" height="52" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="580.0" y="237.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Net sales</text><path d="M130 193V229H480" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><path d="M380 193V229H480" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><path d="M44 284L676 284" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="324" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Recorded run R42</text><rect x="44" y="350" width="240" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="164.0" y="385.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Captures · S52</text><rect x="44" y="423" width="240" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="164.0" y="458.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Refunds · F33</text><rect x="330.5" y="373.5" width="175" height="65" fill="#fff" stroke="#a6aca3" stroke-width="1.2"/><text x="418.0" y="414.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Logic L8</text><path d="M292 377L324 396" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M292 450L324 419" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="553" y="374" width="123" height="65" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="614.5" y="415.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">R108</text><path d="M511 406L545 406" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="614" y="478" font-size="24" fill="#00855b" text-anchor="middle" data-label="1">Published</text><text x="44" y="538" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Record the release identity and its confirmed publication.</text></svg>