<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="publication-barrier"><title id="title">Publication quality gates</title><desc id="desc">R108 pins orders O91,refunds F33,customers C410,and policy 12. A refund-key failure keeps R107 current. Repair R109 must be checked before the conditional publication switch. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Validate the exact release that will become visible.</text><text x="44" y="125" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Private candidate R108</text><text x="70" y="200" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Freshness / coverage</text><text x="650" y="200" font-size="26" fill="#00855b" text-anchor="end" data-label="1">Pass</text><text x="70" y="265" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Pinned inputs O91 / F33 / C410</text><text x="650" y="265" font-size="26" fill="#00855b" text-anchor="end" data-label="1">Pass</text><text x="70" y="330" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Refund key integrity</text><text x="650" y="330" font-size="26" fill="#252c28" text-anchor="end" data-label="1">Fail</text><path d="M44 406L676 406" fill="none" stroke="#00855b" stroke-width="2"/><text x="44" y="452" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Failed gate → keep the current published release</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Bind evidence to immutable inputs, policy, and candidate</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">identity.</text></svg>