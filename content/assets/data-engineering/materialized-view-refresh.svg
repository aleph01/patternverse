<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Refresh failure keeps the old result</title><desc id="desc">A full refresh starts from published generation 2 with four sales totaling 11000 cents. Rebuilding after source corrections would publish generation 3 with three sales totaling 7000 cents. An injected publication failure rolls back to generation 2; a successful retry publishes generation 3 and the corrected result together.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:miter;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="1000" fill="#fff"/><text x="24" y="34" font-size="24" fill="#252c28">Publish data and generation in one transaction</text><text x="24" y="78" font-size="19" fill="#626962">Shop A / USD. Corrected source: 3 sales / 7000 cents.</text><rect x="24" y="112" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="146" font-size="21" fill="#252c28">1. Published before refresh</text><text x="400" y="146" font-size="19" fill="#252c28">G2 / 4 sales / 11000 cents</text><text x="40" y="200" font-size="19" fill="#626962">Readers use the complete old result.</text><path d="M360 240V284" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="384" y="272" font-size="18" fill="#626962">Build candidate</text><rect x="24" y="288" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="322" font-size="21" fill="#252c28">2. Candidate inside transaction</text><text x="400" y="322" font-size="19" fill="#252c28">G3 / 3 sales / 7000 cents</text><text x="40" y="376" font-size="19" fill="#626962">Candidate is not yet published.</text><path d="M360 416V460" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="384" y="448" font-size="18" fill="#626962">Abort / rollback</text><rect x="24" y="464" width="672" height="128" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="498" font-size="21" fill="#252c28">3. Failure rolls back</text><text x="400" y="498" font-size="19" fill="#252c28">G2 / 4 sales / 11000 cents</text><text x="40" y="552" font-size="19" fill="#626962">Old rows and generation are restored.</text><path d="M360 592V636" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="384" y="624" font-size="18" fill="#626962">Retry / commit</text><rect x="24" y="640" width="672" height="128" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="40" y="674" font-size="21" fill="#252c28">4. Retry commits</text><text x="400" y="674" font-size="19" fill="#252c28">G3 / 3 sales / 7000 cents</text><text x="40" y="728" font-size="19" fill="#626962">Rows and generation commit together.</text><rect x="24" y="864" width="672" height="96" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="40" y="898" font-size="21" fill="#252c28">Generation is a publication identity.</text><text x="40" y="942" font-size="19" fill="#626962">It is not a source watermark or a freshness deadline.</text></svg>
