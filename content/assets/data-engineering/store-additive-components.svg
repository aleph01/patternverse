<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="weighted-components"><title id="title">Store additive components</title><desc id="desc">Shard A has one failure in100 requests; B has five in10. Combined rate is6/110=5.45%, while averaging the two percentages gives 25.5%. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Combine the components before calculating a</text><text x="44" y="84" font-size="28" fill="#252c28" text-anchor="start" data-label="1">rate.</text><text x="54" y="128" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Shard</text><text x="264.66666666666663" y="128" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Failures</text><text x="475.3333333333333" y="128" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Eligible requests</text><path d="M44 144L676 144" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="149.33333333333331" y="184.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">A</text><text x="360.0" y="184.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">1</text><text x="570.6666666666666" y="184.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">100</text><path d="M44 203L676 203" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="149.33333333333331" y="236.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">B</text><text x="360.0" y="236.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">5</text><text x="570.6666666666666" y="236.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">10</text><path d="M44 255L676 255" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="149.33333333333331" y="288.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Total</text><rect x="254.66666666666666" y="256" width="210.66666666666666" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="360.0" y="288.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">6</text><rect x="465.3333333333333" y="256" width="210.66666666666669" height="48" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="570.6666666666666" y="288.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">110</text><path d="M44 307L676 307" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="436" font-size="26" fill="#00855b" text-anchor="start" data-label="1">6 / 110 = 5.45%</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">An average of shard rates weights shards, not requests.</text></svg>