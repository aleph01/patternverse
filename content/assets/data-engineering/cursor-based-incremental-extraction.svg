<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="commit-before-cursor"><title id="title">Cursor-based incremental extraction</title><desc id="desc">Cursor C17 fetches records 41 and 72 and returns C18. Data becomes durable before C18 is committed. A crash before cursor advancement replays the page safely. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Persist the page before advancing its cursor.</text><rect x="44" y="145" width="150" height="54" fill="#f1f2ef" stroke="none" stroke-width="1.2"/><text x="119.0" y="180.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">C17</text><path d="M200 172L270 172" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="280" y="145" width="396" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="478.0" y="180.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Page: records 41, 72</text><path d="M475 210L475 300" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="280" y="310" width="396" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="478.0" y="345.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Durable destination</text><path d="M280 337H120V425H280" fill="none" stroke="#00855b" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="290" y="398" width="386" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="483.0" y="433.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Then commit C18</text><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Crash before cursor commit → replay this page.</text></svg>