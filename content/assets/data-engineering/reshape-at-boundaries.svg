<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="grain-preserving-reshape"><title id="title">Reshape at boundaries</title><desc id="desc">Order O42 contains two lines, 30 and 70, plus one order shipping fee of 5. Relational staging separates the header and lines. A nested API or flat report must preserve the fee grain. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Change representation without changing the facts.</text><rect x="44" y="129" width="632" height="120" fill="none" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="54" y="114" width="132.5" height="28" fill="#fff" stroke="none" stroke-width="1.2"/><text x="64" y="134" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Order O42</text><text x="70" y="196" font-size="26" fill="#252c28" text-anchor="start" data-label="1">Lines: 30, 70     Shipping fee: 5</text><path d="M190 256L190 310" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M530 256L530 310" fill="none" stroke="#00855b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="44" y="325" width="292" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="190.0" y="360.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Header: O42 · fee 5</text><rect x="386" y="325" width="290" height="54" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="531.0" y="360.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Lines: 30 and 70</text><text x="44" y="500" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Naive flattening can repeat the fee; retain it once or</text><text x="44" y="531" font-size="24" fill="#252c28" text-anchor="start" data-label="1">allocate.</text></svg>