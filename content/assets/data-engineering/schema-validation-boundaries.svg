<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="contract-check"><title id="title">Schema validation at boundaries</title><desc id="desc">Schema requires an integer quantity and an explicit unit. E1 quantity 3 EA passes; E2 string 3 and E3 missing unit fail. Structural validation does not prove the business quantity is correct. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Validate the representation before accepting it.</text><text x="54" y="132" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Record</text><text x="212.0" y="132" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Quantity</text><text x="370.0" y="132" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Unit</text><text x="528.0" y="132" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Decision</text><path d="M44 148L676 148" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="123.0" y="197.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E1</text><text x="281.0" y="197.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">3 (int)</text><text x="439.0" y="197.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">EA</text><rect x="518.0" y="156" width="158.0" height="66" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="597.0" y="197.84" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">Accept</text><path d="M44 225L676 225" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="267.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E2</text><text x="281.0" y="267.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">&quot;3&quot; (text)</text><text x="439.0" y="267.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">EA</text><text x="597.0" y="267.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Reject</text><path d="M44 295L676 295" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="123.0" y="337.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">E3</text><text x="281.0" y="337.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">3 (int)</text><text x="439.0" y="337.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Missing</text><text x="597.0" y="337.84" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Reject</text><path d="M44 365L676 365" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">A valid schema can still carry an incorrect business fact.</text></svg>