<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc" data-data-engineering-style="light-editorial" data-visual-form="read-boundary"><title id="title">Consistent snapshot reads</title><desc id="desc">A transfer of 20 changes A=60,B=40 into A=40,B=60. A mixed read of old A and new B invents a balance of 120. Each coherent snapshot totals 100. Illustrative scenario. </desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect,circle{stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker></defs><rect width="720" height="560" fill="#fff"/><text x="44" y="49" font-size="28" fill="#252c28" text-anchor="start" data-label="1">Read every part from the same committed view.</text><text x="54" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Read view</text><text x="306.8" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">A</text><text x="433.20000000000005" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">B</text><text x="559.6" y="139" font-size="24" fill="#252c28" text-anchor="start" data-label="1">Sum</text><path d="M44 155L676 155" fill="none" stroke="#a6aca3" stroke-width="1.2"/><text x="170.4" y="203.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Before</text><text x="360.0" y="203.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">60</text><text x="486.40000000000003" y="203.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">40</text><rect x="549.6" y="163" width="126.39999999999998" height="63" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="612.8" y="203.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">100</text><path d="M44 229L676 229" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="170.4" y="270.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">After</text><text x="360.0" y="270.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">40</text><text x="486.40000000000003" y="270.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">60</text><rect x="549.6" y="230" width="126.39999999999998" height="63" fill="#edf5f0" stroke="none" stroke-width="1.2"/><text x="612.8" y="270.34" font-size="26" fill="#00855b" text-anchor="middle" data-label="1">100</text><path d="M44 296L676 296" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="170.4" y="337.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">Mixed</text><text x="360.0" y="337.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">60</text><text x="486.40000000000003" y="337.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">60</text><text x="612.8" y="337.34" font-size="26" fill="#252c28" text-anchor="middle" data-label="1">120</text><path d="M44 363L676 363" fill="none" stroke="#e3e7e1" stroke-width="0.8"/><text x="44" y="516" font-size="24" fill="#252c28" text-anchor="start" data-label="1">One snapshot boundary must cover every chunk or query.</text></svg>