<svg xmlns="http://www.w3.org/2000/svg" width="560" height="590" viewBox="0 0 560 590" role="img" aria-labelledby="title desc">
<title id="title">Protect a base and bound an uncertain opportunity</title>
<desc id="desc">An illustrative teaching pilot. A large neutral box holds existing work, responsibilities, time, and rest. A smaller green box holds one workshop with preparation and follow-up capped. A dashed line between the boxes marks where shared costs need checking. Separation is conditional on real limits; it is not a guarantee of safety or a prescribed allocation ratio.</desc>
<style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;fill:#252c28}rect,path{stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="560" height="590" fill="#fff"/>
<text x="28" y="42" font-size="30">Separate what must hold</text>
<text x="28" y="77" font-size="24">from what you can afford to try.</text>
<rect x="28" y="106" width="504" height="170" rx="12" fill="#f1f3ef" stroke="#4e5851" stroke-width="2"/>
<text x="50" y="145" font-size="26" font-weight="600">Dependable base</text>
<text x="50" y="187" font-size="24">Existing work and responsibilities</text>
<text x="50" y="224" font-size="24">Time and rest needed to sustain them</text>
<path d="M28 308H532" fill="none" stroke="#898983" stroke-width="2" stroke-dasharray="6 7"/>
<text x="28" y="344" font-size="23">Check where costs could cross.</text>
<rect x="28" y="374" width="412" height="146" rx="12" fill="#edf5f0" stroke="#00855b" stroke-width="2"/>
<text x="50" y="413" font-size="26" font-weight="600">Bounded opportunity</text>
<text x="50" y="453" font-size="24">Try one teaching workshop</text>
<text x="50" y="490" font-size="24">Cap preparation and follow-up</text>
<text x="28" y="563" font-size="22">If it disappoints, the base must still hold.</text>
</svg>
