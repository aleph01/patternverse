<svg xmlns="http://www.w3.org/2000/svg" width="560" height="930" viewBox="0 0 560 930" role="img" aria-labelledby="title desc" data-life-pattern="web-of-goals">
<title id="title">Three activities connected by shared goals</title>
<desc id="desc">An original goal web. Walking with a friend joins movement, connection, and enjoyment. Shared cooking joins connection, practical skills, and lower expenses. A repair circle joins practical skills, lower expenses, and independence. Goal labels are shared across the shaded activity shapes. Their positions and distances have no numerical meaning.</desc>
<style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400}path,polygon,rect{stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="560" height="930" fill="#fff"/>
<text x="28" y="42" text-anchor="start" font-size="30" fill="#252c28"><tspan x="28" dy="0">Build a web of goals</tspan></text><text x="28" y="79" text-anchor="start" font-size="22" fill="#252c28"><tspan x="28" dy="0">Goals are shared points.</tspan><tspan x="28" dy="28">Each shaded shape is an activity.</tspan></text><polygon data-activity="repair" data-goals="skills expenses independence" points="200,650 435,510 420,810" fill="#f0f2ef" stroke="#4e5851" stroke-width="2.5"/><polygon data-activity="cooking" data-goals="connection skills expenses" points="340,310 200,650 435,510" fill="#f3eff9" stroke="#7259b8" stroke-width="2.5"/><polygon data-activity="walk" data-goals="movement connection enjoyment" points="125,165 340,310 100,440" fill="#edf5f0" stroke="#00855b" stroke-width="2.5"/><g data-activity-label="walk"><text x="182" y="315" text-anchor="middle" font-size="26" fill="#00855b"><tspan x="182" dy="0">Walk with</tspan><tspan x="182" dy="31">a friend</tspan></text></g><g data-activity-label="cooking"><text x="344" y="442" text-anchor="middle" font-size="26" fill="#7259b8"><tspan x="344" dy="0">Shared</tspan><tspan x="344" dy="31">cooking</tspan></text></g><g data-activity-label="repair"><text x="365" y="700" text-anchor="middle" font-size="26" fill="#4e5851"><tspan x="365" dy="0">Repair</tspan><tspan x="365" dy="31">circle</tspan></text></g><g data-goal="movement" data-state="possible">
<rect x="38" y="142" width="174" height="46" rx="8" fill="#fff" stroke="#b9c0b7" stroke-width="1.4"/>
<text x="125" y="173" text-anchor="middle" font-size="25" fill="#252c28"><tspan x="125" dy="0">Movement</tspan></text>

</g><g data-goal="connection" data-state="possible">
<rect x="245" y="287" width="190" height="46" rx="8" fill="#fff" stroke="#b9c0b7" stroke-width="1.4"/>
<text x="340" y="318" text-anchor="middle" font-size="25" fill="#252c28"><tspan x="340" dy="0">Connection</tspan></text>

</g><g data-goal="enjoyment" data-state="possible">
<rect x="13" y="417" width="174" height="46" rx="8" fill="#fff" stroke="#b9c0b7" stroke-width="1.4"/>
<text x="100" y="448" text-anchor="middle" font-size="25" fill="#252c28"><tspan x="100" dy="0">Enjoyment</tspan></text>

</g><g data-goal="skills" data-state="possible">
<rect x="90" y="627" width="220" height="46" rx="8" fill="#fff" stroke="#b9c0b7" stroke-width="1.4"/>
<text x="200" y="658" text-anchor="middle" font-size="25" fill="#252c28"><tspan x="200" dy="0">Practical skills</tspan></text>

</g><g data-goal="expenses" data-state="possible">
<rect x="324" y="487" width="222" height="46" rx="8" fill="#fff" stroke="#b9c0b7" stroke-width="1.4"/>
<text x="435" y="518" text-anchor="middle" font-size="25" fill="#252c28"><tspan x="435" dy="0">Lower expenses</tspan></text>

</g><g data-goal="independence" data-state="possible">
<rect x="308" y="787" width="224" height="46" rx="8" fill="#fff" stroke="#b9c0b7" stroke-width="1.4"/>
<text x="420" y="818" text-anchor="middle" font-size="25" fill="#252c28"><tspan x="420" dy="0">Independence</tspan></text>

</g><text x="28" y="876" text-anchor="start" font-size="21" fill="#596158"><tspan x="28" dy="0">Possible contributions, not guarantees.</tspan><tspan x="28" dy="28">Lines do not represent causation.</tspan></text>
</svg>
