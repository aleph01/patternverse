<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc" data-life-pattern="web-of-goals">
<title id="title">Three activities connected by shared goals</title>
<desc id="desc">An original goal web. Walking with a friend joins movement, connection, and enjoyment. Shared cooking joins connection, practical skills, and lower expenses. A repair circle joins practical skills, lower expenses, and independence. Goal labels are shared across the shaded activity shapes. Their positions and distances have no numerical meaning.</desc>
<style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400}path,polygon,rect{stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="960" height="650" fill="#fff"/>
<text x="28" y="42" text-anchor="start" font-size="32" fill="#252c28"><tspan x="28" dy="0">Build a web of goals</tspan></text><text x="28" y="79" text-anchor="start" font-size="22" fill="#252c28"><tspan x="28" dy="0">Goals are shared points. Each shaded shape is an activity.</tspan></text><polygon data-activity="repair" data-goals="skills expenses independence" points="430,535 730,195 810,500" fill="#f0f2ef" stroke="#4e5851" stroke-width="2.5"/><polygon data-activity="cooking" data-goals="connection skills expenses" points="430,295 430,535 730,195" fill="#f3eff9" stroke="#7259b8" stroke-width="2.5"/><polygon data-activity="walk" data-goals="movement connection enjoyment" points="165,170 430,295 145,465" fill="#edf5f0" stroke="#00855b" stroke-width="2.5"/><g data-activity-label="walk"><text x="230" y="320" text-anchor="middle" font-size="25" fill="#00855b"><tspan x="230" dy="0">Walk with</tspan><tspan x="230" dy="31">a friend</tspan></text></g><g data-activity-label="cooking"><text x="510" y="346" text-anchor="middle" font-size="25" fill="#7259b8"><tspan x="510" dy="0">Shared</tspan><tspan x="510" dy="31">cooking</tspan></text></g><g data-activity-label="repair"><text x="675" y="415" text-anchor="middle" font-size="25" fill="#4e5851"><tspan x="675" dy="0">Repair</tspan><tspan x="675" dy="31">circle</tspan></text></g><g data-goal="movement" data-state="possible">
<rect x="78" y="147" width="174" height="46" rx="8" fill="#fff" stroke="#b9c0b7" stroke-width="1.4"/>
<text x="165" y="178" text-anchor="middle" font-size="24" fill="#252c28"><tspan x="165" dy="0">Movement</tspan></text>

</g><g data-goal="connection" data-state="possible">
<rect x="335" y="272" width="190" height="46" rx="8" fill="#fff" stroke="#b9c0b7" stroke-width="1.4"/>
<text x="430" y="303" text-anchor="middle" font-size="24" fill="#252c28"><tspan x="430" dy="0">Connection</tspan></text>

</g><g data-goal="enjoyment" data-state="possible">
<rect x="58" y="442" width="174" height="46" rx="8" fill="#fff" stroke="#b9c0b7" stroke-width="1.4"/>
<text x="145" y="473" text-anchor="middle" font-size="24" fill="#252c28"><tspan x="145" dy="0">Enjoyment</tspan></text>

</g><g data-goal="skills" data-state="possible">
<rect x="320" y="512" width="220" height="46" rx="8" fill="#fff" stroke="#b9c0b7" stroke-width="1.4"/>
<text x="430" y="543" text-anchor="middle" font-size="24" fill="#252c28"><tspan x="430" dy="0">Practical skills</tspan></text>

</g><g data-goal="expenses" data-state="possible">
<rect x="619" y="172" width="222" height="46" rx="8" fill="#fff" stroke="#b9c0b7" stroke-width="1.4"/>
<text x="730" y="203" text-anchor="middle" font-size="24" fill="#252c28"><tspan x="730" dy="0">Lower expenses</tspan></text>

</g><g data-goal="independence" data-state="possible">
<rect x="698" y="477" width="224" height="46" rx="8" fill="#fff" stroke="#b9c0b7" stroke-width="1.4"/>
<text x="810" y="508" text-anchor="middle" font-size="24" fill="#252c28"><tspan x="810" dy="0">Independence</tspan></text>

</g><text x="28" y="611" text-anchor="start" font-size="21" fill="#596158"><tspan x="28" dy="0">Possible contributions, not guarantees. Lines do not represent causation.</tspan></text>
</svg>
