<svg xmlns="http://www.w3.org/2000/svg" width="660" height="850" viewBox="0 0 660 850" role="img" aria-labelledby="title desc"><title id="title">A simplified three-generation family diagram</title><desc id="desc">George and Joan are parents of Anne and Michael. Anne and Paul, separated in 2010, are parents of Leah and Rob. Connections show family structure, not causes or inherited roles.</desc><rect width="100%" height="100%" fill="white"/><g font-family="system-ui,sans-serif" fill="#252c28"><text x="20" y="55" font-size="20" fill="#58615b">Generation 1</text><text x="20" y="325" font-size="20" fill="#58615b">Generation 2</text><text x="20" y="595" font-size="20" fill="#58615b">Generation 3</text><path d="M200 120H255 M405 120H460" fill="none" stroke="#68756c" stroke-width="2"/><path d="M330 151V265H585V374 M330 265H415V374" fill="none" stroke="#68756c" stroke-width="2"/><path d="M165 410H185 M335 410H345" fill="none" stroke="#68756c" stroke-width="2"/><path d="M260 450V565H175V644 M260 565H385V644" fill="none" stroke="#68756c" stroke-width="2"/><rect x="60" y="84" width="140" height="72" rx="3" fill="#f1f2ef" stroke="#68756c"/><text x="130" y="114" text-anchor="middle" font-size="21">George</text><text x="130" y="142" text-anchor="middle" font-size="18">1936–2015</text><rect x="460" y="84" width="140" height="72" rx="3" fill="#f1f2ef" stroke="#68756c"/><text x="530" y="114" text-anchor="middle" font-size="21">Joan</text><text x="530" y="142" text-anchor="middle" font-size="18">1938–2021</text><rect x="25" y="374" width="140" height="72" rx="3" fill="#f1f2ef" stroke="#68756c"/><text x="95" y="404" text-anchor="middle" font-size="21">Paul</text><text x="95" y="432" text-anchor="middle" font-size="18">born 1963</text><rect x="345" y="374" width="140" height="72" rx="3" fill="#f1f2ef" stroke="#68756c"/><text x="415" y="404" text-anchor="middle" font-size="21">Anne</text><text x="415" y="432" text-anchor="middle" font-size="18">born 1965</text><rect x="515" y="374" width="140" height="72" rx="3" fill="#f1f2ef" stroke="#68756c"/><text x="585" y="404" text-anchor="middle" font-size="21">Michael</text><text x="585" y="432" text-anchor="middle" font-size="18">born 1968</text><rect x="105" y="644" width="140" height="72" rx="3" fill="#f1f2ef" stroke="#68756c"/><text x="175" y="674" text-anchor="middle" font-size="21">Leah</text><text x="175" y="702" text-anchor="middle" font-size="18">born 1991</text><rect x="315" y="644" width="140" height="72" rx="3" fill="#f1f2ef" stroke="#68756c"/><text x="385" y="674" text-anchor="middle" font-size="21">Rob</text><text x="385" y="702" text-anchor="middle" font-size="18">born 1994</text><rect x="255" y="89.0" width="150" height="62" rx="24" fill="white" stroke="#68756c"/><text x="330" y="126.0" text-anchor="middle" font-size="18">Married 1960</text><rect x="185" y="370.0" width="150" height="80" rx="24" fill="white" stroke="#68756c"/><text x="260" y="403.0" text-anchor="middle" font-size="18">Married 1988</text><text x="260" y="429.0" text-anchor="middle" font-size="18">Separated 2010</text><text x="20" y="802" font-size="18">Family connections, not causal explanations.</text><text x="20" y="830" font-size="16" fill="#58615b">Original teaching example · Other family branches are outside this extract.</text></g></svg>
