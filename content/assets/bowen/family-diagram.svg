<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">A simplified three-generation family diagram</title><desc id="desc">George and Joan are parents of Anne and Michael. Anne and Paul, separated in 2010, are parents of Leah and Rob. Connections show family structure, not causes or inherited roles.</desc><rect width="100%" height="100%" fill="white"/><g font-family="system-ui,sans-serif" fill="#252c28"><text x="20" y="40" font-size="20" fill="#58615b">Generation 1</text><text x="20" y="235" font-size="20" fill="#58615b">Generation 2</text><text x="20" y="430" font-size="20" fill="#58615b">Generation 3</text><path d="M380 100H445 M595 100H660" fill="none" stroke="#68756c" stroke-width="2"/><path d="M520 131V195H850V259 M520 195H580V259" fill="none" stroke="#68756c" stroke-width="2"/><path d="M230 295H295 M445 295H510" fill="none" stroke="#68756c" stroke-width="2"/><path d="M370 335V400H245V454 M370 400H495V454" fill="none" stroke="#68756c" stroke-width="2"/><rect x="240" y="64" width="140" height="72" rx="3" fill="#f1f2ef" stroke="#68756c"/><text x="310" y="94" text-anchor="middle" font-size="21">George</text><text x="310" y="122" text-anchor="middle" font-size="18">1936–2015</text><rect x="660" y="64" width="140" height="72" rx="3" fill="#f1f2ef" stroke="#68756c"/><text x="730" y="94" text-anchor="middle" font-size="21">Joan</text><text x="730" y="122" text-anchor="middle" font-size="18">1938–2021</text><rect x="90" y="259" width="140" height="72" rx="3" fill="#f1f2ef" stroke="#68756c"/><text x="160" y="289" text-anchor="middle" font-size="21">Paul</text><text x="160" y="317" text-anchor="middle" font-size="18">born 1963</text><rect x="510" y="259" width="140" height="72" rx="3" fill="#f1f2ef" stroke="#68756c"/><text x="580" y="289" text-anchor="middle" font-size="21">Anne</text><text x="580" y="317" text-anchor="middle" font-size="18">born 1965</text><rect x="780" y="259" width="140" height="72" rx="3" fill="#f1f2ef" stroke="#68756c"/><text x="850" y="289" text-anchor="middle" font-size="21">Michael</text><text x="850" y="317" text-anchor="middle" font-size="18">born 1968</text><rect x="175" y="454" width="140" height="72" rx="3" fill="#f1f2ef" stroke="#68756c"/><text x="245" y="484" text-anchor="middle" font-size="21">Leah</text><text x="245" y="512" text-anchor="middle" font-size="18">born 1991</text><rect x="425" y="454" width="140" height="72" rx="3" fill="#f1f2ef" stroke="#68756c"/><text x="495" y="484" text-anchor="middle" font-size="21">Rob</text><text x="495" y="512" text-anchor="middle" font-size="18">born 1994</text><rect x="445" y="69.0" width="150" height="62" rx="24" fill="white" stroke="#68756c"/><text x="520" y="106.0" text-anchor="middle" font-size="18">Married 1960</text><rect x="295" y="255.0" width="150" height="80" rx="24" fill="white" stroke="#68756c"/><text x="370" y="288.0" text-anchor="middle" font-size="18">Married 1988</text><text x="370" y="314.0" text-anchor="middle" font-size="18">Separated 2010</text><text x="20" y="572" font-size="18">Family connections, not causal explanations.</text><text x="20" y="600" font-size="16" fill="#58615b">Original teaching example · Other family branches are outside this extract.</text></g></svg>
