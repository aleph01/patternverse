<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" viewBox="0 0 360 600" role="img" aria-labelledby="title desc" data-illustration-style="light-editorial"><title id="title">A symbolic scene can remain still</title><desc id="desc">Overhead view of a fictional sandtray. One green miniature stands at the doorway of a house; three gray figures face the house. A walled green garden stands apart. Callouts identify the garden as a protected place, the person at the doorway, and others waiting. The wall’s protective meaning comes from the fictional maker’s account. No arrow or rearranged scene prescribes a change.</desc><style>
:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;fill:#252c28;letter-spacing:0}
path,rect,circle,ellipse,line{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.line{fill:none;stroke:#7c857c;stroke-width:1.25}.fine{fill:none;stroke:#a6aca3;stroke-width:1}.ground{fill:none;stroke:#d4d8d0;stroke-width:1}
.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.tray{fill:#fafbf9;stroke:#899489;stroke-width:1.4}.sand{fill:#f1f2ef;stroke:none}.house-floor{fill:#fff;stroke:none}
.person{fill:#626962;stroke:none}.plan-head{fill:#fff;stroke:#626962;stroke-width:1}.accent .person,.accent .plan-head{fill:#00855b;stroke:#00855b;stroke-width:.7}
.accent-line{fill:none;stroke:#00855b;stroke-width:1.8}.accent-text{fill:#00855b}.quiet{fill:#626962}
.garden{fill:#edf5f0;stroke:#00855b;stroke-width:1.7}.plant{fill:#edf5f0;stroke:#a6aca3;stroke-width:1}
.hand-shape{fill:inherit;stroke:inherit;stroke-width:1.2}.hand-context{fill:#f1f2ef;stroke:#a6aca3}.hand-accent{fill:#edf5f0;stroke:#00855b}
</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L6 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="360" height="600" fill="#fff"/><rect x="16" y="84" width="328" height="350" class="tray"/><rect x="24" y="92" width="312" height="334" class="sand"/><rect x="44" y="120" width="107" height="112" class="garden"/><path d="M60 207H135M60 196H135" class="fine" /><circle cx="76.1" cy="159.2" r="10.700000000000001" class="plant"/><circle cx="113.55" cy="153.6" r="12.84" class="plant"/><rect x="184" y="244" width="57" height="72" class="house-floor"/><path d="M241 267.04V244H184V316H241V292.96" class="line" /><path d="M233 267.04H241M233 292.96H241" class="accent-line" /><text x="212.5" y="285" font-size="13" class="quiet" text-anchor="middle">House</text><g class="accent"><g transform="translate(259 279) rotate(-90) scale(0.55)"><path d="M-19 12Q-16 4-7 3H7Q16 4 19 12V17Q0 24-19 17Z" class="person"/><ellipse cx="0" cy="0" rx="10" ry="12" class="plan-head"/><path d="M-3-10L0-15L3-10" class="person"/></g></g><g transform="translate(306 230) rotate(-90) scale(0.48)"><path d="M-19 12Q-16 4-7 3H7Q16 4 19 12V17Q0 24-19 17Z" class="person"/><ellipse cx="0" cy="0" rx="10" ry="12" class="plan-head"/><path d="M-3-10L0-15L3-10" class="person"/></g><g transform="translate(309 301) rotate(-90) scale(0.48)"><path d="M-19 12Q-16 4-7 3H7Q16 4 19 12V17Q0 24-19 17Z" class="person"/><ellipse cx="0" cy="0" rx="10" ry="12" class="plan-head"/><path d="M-3-10L0-15L3-10" class="person"/></g><g transform="translate(299 369) rotate(-90) scale(0.48)"><path d="M-19 12Q-16 4-7 3H7Q16 4 19 12V17Q0 24-19 17Z" class="person"/><ellipse cx="0" cy="0" rx="10" ry="12" class="plan-head"/><path d="M-3-10L0-15L3-10" class="person"/></g><text x="22" y="33" font-size="17" class="" text-anchor="start">A protected place</text><text x="22" y="56" font-size="14" class="accent-text" text-anchor="start">The wall protects.</text><path d="M97 66V113" class="fine" /><text x="182" y="467" font-size="16" class="" text-anchor="start">At the doorway</text><path d="M259 307V444" class="fine" /><text x="179" y="518" font-size="16" class="" text-anchor="start">Others are waiting</text><path d="M314 386V493H306" class="fine" /><text x="24" y="566" font-size="17" class="accent-text" text-anchor="start">The scene can remain still.</text></svg>
