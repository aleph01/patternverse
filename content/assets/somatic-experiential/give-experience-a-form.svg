<svg xmlns="http://www.w3.org/2000/svg" width="720" height="820" viewBox="0 0 720 820" role="img" aria-labelledby="title desc" data-illustration-style="light-editorial"><title id="title">Five ways to give experience a form</title><desc id="desc">A comparison, not a sequence: a seated person speaks a first-person sentence; another directs words toward an empty chair; a posture accompanies one person’s phrase about asking; the same hand is shown in two positions to explore a gesture; miniature figures, a house and a garden form a still scene. Green highlights the expressive element in each example. These fictional forms do not diagnose a feeling or prescribe an expression.</desc><style>
:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;fill:#252c28;letter-spacing:0}
path,rect,circle,ellipse,line{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.line{fill:none;stroke:#7c857c;stroke-width:1.25}.fine{fill:none;stroke:#a6aca3;stroke-width:1}.ground{fill:none;stroke:#d4d8d0;stroke-width:1}
.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.tray{fill:#fafbf9;stroke:#899489;stroke-width:1.4}.sand{fill:#f1f2ef;stroke:none}.house-floor{fill:#fff;stroke:none}
.person{fill:#626962;stroke:none}.plan-head{fill:#fff;stroke:#626962;stroke-width:1}.accent .person,.accent .plan-head{fill:#00855b;stroke:#00855b;stroke-width:.7}
.accent-line{fill:none;stroke:#00855b;stroke-width:1.8}.accent-text{fill:#00855b}.quiet{fill:#626962}
.garden{fill:#edf5f0;stroke:#00855b;stroke-width:1.7}.plant{fill:#edf5f0;stroke:#a6aca3;stroke-width:1}
.hand-shape{fill:inherit;stroke:inherit;stroke-width:1.2}.hand-context{fill:#f1f2ef;stroke:#a6aca3}.hand-accent{fill:#edf5f0;stroke:#00855b}
</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L6 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="820" fill="#fff"/><g transform="translate(30 40)"><text x="0" y="0" font-size="18" class="" text-anchor="start">Speak From the Position</text><path d="M51 65V114H12M16 114V153M46 114V153" class="line" /><g transform="translate(42 84) scale(-0.95 0.95)" class="person"><path d="M-6 9Q-15 5-13-5Q-11-17-1-14Q8-13 9-4L5 7-2 11Z"/><path d="M-10-4L-18 0-10 4Z"/><path d="M3 11Q13 15 16 25L24 32H-10Q-24 30-27 41L-35 62H-52V70H-25L-10 44H23Q38 43 32 33L21 20Q18 13 9 11Z"/><path d="M4 15L-10 17H-20L-23 22-5 26 12 22Z"/></g><text x="126" y="79" font-size="24" class="accent-text" text-anchor="start">“I need</text><text x="126" y="108" font-size="24" class="accent-text" text-anchor="start">time.”</text><path d="M65 79L109 83" class="accent-line" /><text x="0" y="196" font-size="15" class="quiet" text-anchor="start">Speak in the first person.</text></g><g transform="translate(385 40)"><text x="0" y="0" font-size="18" class="" text-anchor="start">Address It Directly</text><path d="M37 65V114H-2M2 114V153M32 114V153" class="line" /><g transform="translate(28 84) scale(-0.95 0.95)" class="person"><path d="M-6 9Q-15 5-13-5Q-11-17-1-14Q8-13 9-4L5 7-2 11Z"/><path d="M-10-4L-18 0-10 4Z"/><path d="M3 11Q13 15 16 25L24 32H-10Q-24 30-27 41L-35 62H-52V70H-25L-10 44H23Q38 43 32 33L21 20Q18 13 9 11Z"/><path d="M4 15L-10 17H-20L-23 22-5 26 12 22Z"/></g><path d="M253 65V114H214M218 114V153M248 114V153" class="line" /><path d="M74 85Q149 63 206 95" class="accent-line" marker-end="url(#arrow)"/><text x="110" y="39" font-size="17" class="accent-text" text-anchor="start">“I need you to wait.”</text><text x="0" y="196" font-size="15" class="quiet" text-anchor="start">Give the words an addressee.</text></g><g transform="translate(30 290)"><text x="0" y="0" font-size="18" class="" text-anchor="start">Give It Bodily Form</text><g transform="translate(58 27)"><path d="M15 27C3 28 0 43 7 49C17 58 31 48 31 38C32 31 24 26 15 27ZM11 55Q29 54 41 75L50 91L36 99L27 84L27 112L53 145L43 152L16 120L8 151H-3L0 111L-3 79Q-2 61 11 55Z" class="person"/><path d="M10 56Q30 52 42 78" class="accent-line" /></g><text x="143" y="77" font-size="19" class="accent-text" text-anchor="start">“There is no</text><text x="143" y="104" font-size="19" class="accent-text" text-anchor="start">point asking.”</text><text x="0" y="196" font-size="15" class="quiet" text-anchor="start">Explore one possible posture.</text></g><g transform="translate(385 290)"><text x="0" y="0" font-size="18" class="" text-anchor="start">Amplify What Is Emerging</text><g transform="translate(65 108) scale(.85)" class="hand-context"><path d="M-12 56L-13 24-25 4Q-28-2-23-5Q-19-8-15-2L-8 8V-24Q-8-31-3-31Q2-31 2-24V-7L4-35Q5-41 10-40Q15-39 14-33L13-6L17-28Q18-34 23-33Q28-32 26-25L23-1L27-17Q29-23 34-21Q38-19 36-13L29 23Q26 36 14 42L14 56Z" class="hand-shape" /></g><g transform="translate(199 64) scale(.85)" class="hand-accent"><path d="M-12 56L-13 24-25 4Q-28-2-23-5Q-19-8-15-2L-8 8V-24Q-8-31-3-31Q2-31 2-24V-7L4-35Q5-41 10-40Q15-39 14-33L13-6L17-28Q18-34 23-33Q28-32 26-25L23-1L27-17Q29-23 34-21Q38-19 36-13L29 23Q26 36 14 42L14 56Z" class="hand-shape" /></g><path d="M102 140Q147 135 172 92" class="accent-line" marker-end="url(#arrow)"/><text x="41" y="171" font-size="13" class="quiet" text-anchor="start">Emerging</text><text x="166" y="171" font-size="13" class="quiet" text-anchor="start">Repeated / enlarged</text><text x="0" y="196" font-size="15" class="quiet" text-anchor="start">Explore the movement’s quality.</text></g><path d="M30 260H690M30 510H690" class="ground" /><text x="30" y="550" font-size="18" class="" text-anchor="start">Build a Symbolic Scene</text><rect x="30" y="584" width="300" height="155" class="tray"/><rect x="37" y="591" width="286" height="141" class="sand"/><rect x="58" y="614" width="76" height="73" class="garden"/><path d="M70 639h50M70 654h50M70 669h50" class="fine" /><rect x="181" y="642" width="48" height="48" class="house-floor"/><path d="M229 657.36V642H181V690H229V674.64" class="line" /><path d="M221 657.36H229M221 674.64H229" class="accent-line" /><g class="accent"><g transform="translate(245 668) rotate(-90) scale(0.4)"><path d="M-19 12Q-16 4-7 3H7Q16 4 19 12V17Q0 24-19 17Z" class="person"/><ellipse cx="0" cy="0" rx="10" ry="12" class="plan-head"/><path d="M-3-10L0-15L3-10" class="person"/></g></g><g transform="translate(288 629) rotate(-90) scale(0.38)"><path d="M-19 12Q-16 4-7 3H7Q16 4 19 12V17Q0 24-19 17Z" class="person"/><ellipse cx="0" cy="0" rx="10" ry="12" class="plan-head"/><path d="M-3-10L0-15L3-10" class="person"/></g><g transform="translate(297 671) rotate(-90) scale(0.38)"><path d="M-19 12Q-16 4-7 3H7Q16 4 19 12V17Q0 24-19 17Z" class="person"/><ellipse cx="0" cy="0" rx="10" ry="12" class="plan-head"/><path d="M-3-10L0-15L3-10" class="person"/></g><g transform="translate(286 710) rotate(-90) scale(0.38)"><path d="M-19 12Q-16 4-7 3H7Q16 4 19 12V17Q0 24-19 17Z" class="person"/><ellipse cx="0" cy="0" rx="10" ry="12" class="plan-head"/><path d="M-3-10L0-15L3-10" class="person"/></g><text x="382" y="632" font-size="19" class="accent-text" text-anchor="start">A scene can remain still.</text><text x="382" y="667" font-size="16" class="quiet" text-anchor="start">Positions and boundaries</text><text x="382" y="691" font-size="16" class="quiet" text-anchor="start">can carry a relationship.</text><text x="30" y="785" font-size="15" class="quiet" text-anchor="start">Related forms of expression; no required sequence.</text></svg>
