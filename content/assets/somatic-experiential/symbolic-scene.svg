<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img" aria-labelledby="title desc" data-illustration-style="light-editorial"><title id="title">A symbolic scene can remain still</title><desc id="desc">Overhead view of a fictional sandtray. One green miniature stands at the doorway of a house; three gray figures face the house. A walled green garden stands apart. Callouts identify the garden as a protected place, the person at the doorway, and others waiting. The wall’s protective meaning comes from the fictional maker’s account. No arrow or rearranged scene prescribes a change.</desc><style>
:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;fill:#252c28;letter-spacing:0}
path,rect,circle,ellipse,line{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.line{fill:none;stroke:#7c857c;stroke-width:1.25}.fine{fill:none;stroke:#a6aca3;stroke-width:1}.ground{fill:none;stroke:#d4d8d0;stroke-width:1}
.context{fill:#f1f2ef;stroke:#a6aca3;stroke-width:1}.tray{fill:#fafbf9;stroke:#899489;stroke-width:1.4}.sand{fill:#f1f2ef;stroke:none}.house-floor{fill:#fff;stroke:none}
.person{fill:#626962;stroke:none}.plan-head{fill:#fff;stroke:#626962;stroke-width:1}.accent .person,.accent .plan-head{fill:#00855b;stroke:#00855b;stroke-width:.7}
.accent-line{fill:none;stroke:#00855b;stroke-width:1.8}.accent-text{fill:#00855b}.quiet{fill:#626962}
.garden{fill:#edf5f0;stroke:#00855b;stroke-width:1.7}.plant{fill:#edf5f0;stroke:#a6aca3;stroke-width:1}
.hand-shape{fill:inherit;stroke:inherit;stroke-width:1.2}.hand-context{fill:#f1f2ef;stroke:#a6aca3}.hand-accent{fill:#edf5f0;stroke:#00855b}
</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L6 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="590" fill="#fff"/><rect x="40" y="96" width="640" height="350" class="tray"/><rect x="49" y="105" width="622" height="332" class="sand"/><rect x="112" y="158" width="156" height="154" class="garden"/><path d="M128 287H252M128 276H252" class="fine" /><circle cx="158.8" cy="211.9" r="15.600000000000001" class="plant"/><circle cx="213.4" cy="204.2" r="18.72" class="plant"/><rect x="348" y="224" width="78" height="88" class="house-floor"/><path d="M426 252.16V224H348V312H426V283.84000000000003" class="line" /><path d="M418 252.16H426M418 283.84000000000003H426" class="accent-line" /><text x="387" y="273" font-size="15" class="quiet" text-anchor="middle">House</text><g class="accent"><g transform="translate(449 268) rotate(-90) scale(0.72)"><path d="M-19 12Q-16 4-7 3H7Q16 4 19 12V17Q0 24-19 17Z" class="person"/><ellipse cx="0" cy="0" rx="10" ry="12" class="plan-head"/><path d="M-3-10L0-15L3-10" class="person"/></g></g><g transform="translate(552 187) rotate(-90) scale(0.65)"><path d="M-19 12Q-16 4-7 3H7Q16 4 19 12V17Q0 24-19 17Z" class="person"/><ellipse cx="0" cy="0" rx="10" ry="12" class="plan-head"/><path d="M-3-10L0-15L3-10" class="person"/></g><g transform="translate(580 274) rotate(-90) scale(0.65)"><path d="M-19 12Q-16 4-7 3H7Q16 4 19 12V17Q0 24-19 17Z" class="person"/><ellipse cx="0" cy="0" rx="10" ry="12" class="plan-head"/><path d="M-3-10L0-15L3-10" class="person"/></g><g transform="translate(550 368) rotate(-90) scale(0.65)"><path d="M-19 12Q-16 4-7 3H7Q16 4 19 12V17Q0 24-19 17Z" class="person"/><ellipse cx="0" cy="0" rx="10" ry="12" class="plan-head"/><path d="M-3-10L0-15L3-10" class="person"/></g><text x="56" y="42" font-size="20" class="" text-anchor="start">A protected place</text><text x="56" y="69" font-size="16" class="accent-text" text-anchor="start">The wall protects.</text><path d="M192 78V150" class="fine" /><text x="450" y="42" font-size="20" class="" text-anchor="start">Others are waiting</text><path d="M551 54V157" class="fine" /><text x="388" y="497" font-size="20" class="" text-anchor="start">At the doorway</text><path d="M449 299V472" class="fine" /><text x="56" y="555" font-size="20" class="accent-text" text-anchor="start">The scene can remain still.</text></svg>
