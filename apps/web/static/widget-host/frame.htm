<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; frame-src about:; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Article widget host</title>
    <style>
      html,
      body,
      iframe {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <script>
      // A separate document avoids inheriting the application's script policy.
      // The .htm extension also avoids hosting redirects that change offline cache keys.
      // Only the parent can supply content, once; widget messages never reach app APIs.
      if (window.parent !== window) {
        const receive = (event) => {
          if (event.source !== window.parent || event.data?.type !== 'article-widget-source')
            return;
          const { source, title, autoResize } = event.data;
          if (typeof source !== 'string' || source.length > 512000 || typeof title !== 'string')
            return;
          window.removeEventListener('message', receive);
          const frame = document.createElement('iframe');
          frame.title = title;
          frame.setAttribute('sandbox', 'allow-scripts');
          // Only this child's numeric size can leave the sandbox. No widget message
          // becomes an application command, and the sandbox keeps its opaque origin.
          if (autoResize === true) {
            const observeContentSize = () => {
              let scheduled = false;
              let previous = 0;
              const measure = () => {
                if (scheduled) return;
                scheduled = true;
                requestAnimationFrame(() => {
                  scheduled = false;
                  const body = document.body;
                  if (!body) return;
                  const style = getComputedStyle(body);
                  const height = Math.ceil(
                    Math.max(body.scrollHeight, body.getBoundingClientRect().height) +
                      (parseFloat(style.marginTop) || 0) +
                      (parseFloat(style.marginBottom) || 0),
                  );
                  if (height === previous) return;
                  previous = height;
                  parent.postMessage({ type: 'article-widget-size', height }, '*');
                });
              };
              new ResizeObserver(measure).observe(document.body);
              window.addEventListener('resize', measure);
              window.addEventListener('load', measure);
              measure();
            };
            const sizingScript = '<script>(' + observeContentSize.toString() + ')();<\/script>';
            frame.srcdoc = source.replace(/<\/body\s*>/i, sizingScript + '</body>');
            window.addEventListener('message', (message) => {
              if (
                message.source !== frame.contentWindow ||
                message.data?.type !== 'article-widget-size' ||
                !Number.isFinite(message.data.height)
              )
                return;
              const height = Math.max(240, Math.min(20000, Math.ceil(message.data.height)));
              frame.style.height = height + 'px';
              window.parent.postMessage(
                { type: 'article-widget-size', height },
                window.location.origin,
              );
            });
          } else {
            frame.srcdoc = source;
          }
          document.body.append(frame);
        };
        window.addEventListener('message', receive);
        window.parent.postMessage({ type: 'article-widget-ready' }, '*');
      }
    </script>
  </body>
</html>
