<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="preserve-the-invariants-title preserve-the-invariants-desc">
<title id="preserve-the-invariants-title">Preserve the Invariants</title>
<desc id="preserve-the-invariants-desc">A boundary labeled Invariants remain true surrounds the current artifact, transformation, and revised artifact.</desc>
<style>:root{--paper:#fff;--surface:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;font-size:16px;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--surface:#242420;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="preserve-the-invariants-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/>
<rect x="24" y="118" width="672" height="248" fill="var(--highlight)" stroke="var(--line)" stroke-width="2"/><text x="360" y="158" text-anchor="middle">Invariants remain true</text><rect x="52" y="222" width="144" height="76" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="124" y="254" text-anchor="middle"><tspan x="124" dy="0">Current</tspan><tspan x="124" dy="22">artifact</tspan></text>
<rect x="288" y="222" width="144" height="76" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="360" y="265" text-anchor="middle"><tspan x="360" dy="0">Transformation</tspan></text>
<rect x="524" y="222" width="144" height="76" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="596" y="254" text-anchor="middle"><tspan x="596" dy="0">Revised</tspan><tspan x="596" dy="22">artifact</tspan></text><path d="M 196 260 H 280" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#preserve-the-invariants-arrow)"/><path d="M 432 260 H 516" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#preserve-the-invariants-arrow)"/>
</svg>
