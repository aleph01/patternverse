<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="draft-the-prompt-together-title draft-the-prompt-together-desc">
<title id="draft-the-prompt-together-title">Draft the Prompt Together</title>
<desc id="draft-the-prompt-together-desc">A rough intention becomes a draft prompt; a human review loop clarifies it before it is used for the task.</desc>
<style>:root{--paper:#fff;--surface:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;font-size:16px;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--surface:#242420;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="draft-the-prompt-together-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M1 1L7 5L1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/>
<text x="360" y="65" text-anchor="middle">Make the request inspectable before doing the task</text>
<g fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5">
<rect x="28" y="148" width="140" height="90"/>
<rect x="226" y="148" width="130" height="90"/>
<rect x="414" y="148" width="110" height="90" fill="var(--highlight)"/>
<rect x="582" y="148" width="110" height="90"/>
</g>
<text x="98" y="187" text-anchor="middle">Rough<tspan x="98" dy="24">intention</tspan></text>
<text x="291" y="187" text-anchor="middle">Draft<tspan x="291" dy="24">the prompt</tspan></text>
<text x="469" y="187" text-anchor="middle">Human<tspan x="469" dy="24">review</tspan></text>
<text x="637" y="187" text-anchor="middle">Use for<tspan x="637" dy="24">the task</tspan></text>
<g fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#draft-the-prompt-together-arrow)">
<path d="M168 193H218"/><path d="M356 193H406"/><path d="M524 193H574"/>
<path d="M469 238V330H291V246"/>
</g>
<text x="553" y="132" text-anchor="middle">Accept</text>
<text x="380" y="365" text-anchor="middle">Clarify gaps and revise assumptions</text>
<text x="360" y="422" text-anchor="middle">A better brief still needs a result you can check.</text>
</svg>
