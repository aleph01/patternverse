<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="look-for-the-decisive-unknown-title look-for-the-decisive-unknown-desc">
<title id="look-for-the-decisive-unknown-title">Look for the Decisive Unknown</title>
<desc id="look-for-the-decisive-unknown-desc">A decisive question splits the investigation into Answer A leading to Action A and Answer B leading to Action B.</desc>
<style>:root{--paper:#fff;--surface:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;font-size:16px;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--surface:#242420;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="look-for-the-decisive-unknown-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/>
<rect x="240" y="70" width="240" height="76" fill="var(--highlight)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="360" y="113" text-anchor="middle"><tspan x="360" dy="0">Decisive question</tspan></text><path d="M 360 146 V 180 H 144 V 212" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#look-for-the-decisive-unknown-arrow)"/><path d="M 360 180 H 576 V 212" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#look-for-the-decisive-unknown-arrow)"/><rect x="64" y="218" width="160" height="76" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="144" y="261" text-anchor="middle"><tspan x="144" dy="0">Answer A</tspan></text><rect x="496" y="218" width="160" height="76" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="576" y="261" text-anchor="middle"><tspan x="576" dy="0">Answer B</tspan></text><path d="M 144 294 V 326" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#look-for-the-decisive-unknown-arrow)"/><path d="M 576 294 V 326" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#look-for-the-decisive-unknown-arrow)"/><rect x="64" y="332" width="160" height="76" fill="var(--highlight)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="144" y="375" text-anchor="middle"><tspan x="144" dy="0">Action A</tspan></text><rect x="496" y="332" width="160" height="76" fill="var(--highlight)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="576" y="375" text-anchor="middle"><tspan x="576" dy="0">Action B</tspan></text>
</svg>
