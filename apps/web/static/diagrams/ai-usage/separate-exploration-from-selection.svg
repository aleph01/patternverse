<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="separate-exploration-from-selection-title separate-exploration-from-selection-desc">
<title id="separate-exploration-from-selection-title">Separate Exploration from Selection</title>
<desc id="separate-exploration-from-selection-desc">Five distinct stages: explore widely, establish criteria, compare candidates, select, then develop the chosen direction.</desc>
<style>:root{--paper:#fff;--surface:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;font-size:16px;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--surface:#242420;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="separate-exploration-from-selection-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/>
<rect x="28" y="180" width="112" height="76" fill="var(--highlight)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="84" y="212" text-anchor="middle"><tspan x="84" dy="0">Explore</tspan><tspan x="84" dy="22">widely</tspan></text>
<rect x="168" y="180" width="112" height="76" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="224" y="212" text-anchor="middle"><tspan x="224" dy="0">Establish</tspan><tspan x="224" dy="22">criteria</tspan></text>
<rect x="308" y="180" width="112" height="76" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="364" y="223" text-anchor="middle"><tspan x="364" dy="0">Compare</tspan></text>
<rect x="448" y="180" width="112" height="76" fill="var(--highlight)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="504" y="223" text-anchor="middle"><tspan x="504" dy="0">Select</tspan></text>
<rect x="588" y="180" width="112" height="76" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="644" y="223" text-anchor="middle"><tspan x="644" dy="0">Develop</tspan></text><path d="M 140 218 H 164" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#separate-exploration-from-selection-arrow)"/>
<path d="M 280 218 H 304" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#separate-exploration-from-selection-arrow)"/>
<path d="M 420 218 H 444" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#separate-exploration-from-selection-arrow)"/>
<path d="M 560 218 H 584" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#separate-exploration-from-selection-arrow)"/><text x="360" y="136" text-anchor="middle">Different jobs. Distinct stages.</text>
</svg>
