<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="attack-then-repair-title attack-then-repair-desc">
<title id="attack-then-repair-title">Attack, Then Repair</title>
<desc id="attack-then-repair-desc">A loop moves from Propose to Attack to Repair to Test again. Preserve the valuable core stays at the center.</desc>
<style>:root{--paper:#fff;--surface:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;font-size:16px;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--surface:#242420;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="attack-then-repair-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/>
<rect x="44" y="74" width="160" height="76" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="124" y="117" text-anchor="middle"><tspan x="124" dy="0">Propose</tspan></text><rect x="280" y="74" width="160" height="76" fill="var(--highlight)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="360" y="117" text-anchor="middle"><tspan x="360" dy="0">Attack</tspan></text><rect x="516" y="74" width="160" height="76" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="596" y="117" text-anchor="middle"><tspan x="596" dy="0">Repair</tspan></text><path d="M 204 112 H 272" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#attack-then-repair-arrow)"/><path d="M 440 112 H 508" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#attack-then-repair-arrow)"/><path d="M 596 150 V 370 H 448" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#attack-then-repair-arrow)"/><rect x="280" y="332" width="160" height="76" fill="var(--highlight)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="360" y="375" text-anchor="middle"><tspan x="360" dy="0">Test again</tspan></text><path d="M 280 370 H 124 V 158" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#attack-then-repair-arrow)"/><text x="360" y="236" text-anchor="middle">Preserve the</text><text x="360" y="260" text-anchor="middle">valuable core</text>
</svg>
