<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="choose-the-representation-before-solving-title choose-the-representation-before-solving-desc">
<title id="choose-the-representation-before-solving-title">Choose the Representation Before Solving</title>
<desc id="choose-the-representation-before-solving-desc">A raw problem can become a timeline, graph, matrix, or state machine. A useful view reveals structure that informs the solution.</desc>
<style>:root{--paper:#fff;--surface:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;font-size:16px;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--surface:#242420;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="choose-the-representation-before-solving-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/>
<rect x="244" y="36" width="232" height="76" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="360" y="79" text-anchor="middle"><tspan x="360" dy="0">Raw problem</tspan></text><path d="M 360 112 V 140 M 103 140 H 619" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M 103 140 V 172" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#choose-the-representation-before-solving-arrow)"/><rect x="32" y="178" width="142" height="68" fill="var(--highlight)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="103" y="217" text-anchor="middle"><tspan x="103" dy="0">Timeline</tspan></text><path d="M 275 140 V 172" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#choose-the-representation-before-solving-arrow)"/><rect x="204" y="178" width="142" height="68" fill="var(--highlight)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="275" y="217" text-anchor="middle"><tspan x="275" dy="0">Graph</tspan></text><path d="M 447 140 V 172" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#choose-the-representation-before-solving-arrow)"/><rect x="376" y="178" width="142" height="68" fill="var(--highlight)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="447" y="217" text-anchor="middle"><tspan x="447" dy="0">Matrix</tspan></text><path d="M 619 140 V 172" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#choose-the-representation-before-solving-arrow)"/><rect x="548" y="178" width="142" height="68" fill="var(--highlight)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="619" y="217" text-anchor="middle"><tspan x="619" dy="0">States</tspan></text><text x="360" y="294" text-anchor="middle">Choose the view that reveals the relationship.</text><rect x="104" y="346" width="196" height="76" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="202" y="389" text-anchor="middle"><tspan x="202" dy="0">Inspect structure</tspan></text><path d="M 300 384 H 412" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#choose-the-representation-before-solving-arrow)"/><rect x="420" y="346" width="196" height="76" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="518" y="389" text-anchor="middle"><tspan x="518" dy="0">Solve</tspan></text>
</svg>
