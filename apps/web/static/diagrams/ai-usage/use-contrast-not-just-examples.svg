<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="use-contrast-not-just-examples-title use-contrast-not-just-examples-desc">
<title id="use-contrast-not-just-examples-title">Use Contrast, Not Just Examples</title>
<desc id="use-contrast-not-just-examples-desc">Three neighboring examples: Too little, Target, and Too much. The target is distinguished by the amount of useful detail, not decoration.</desc>
<style>:root{--paper:#fff;--surface:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;font-size:16px;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--surface:#242420;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="use-contrast-not-just-examples-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/>
<rect x="40" y="164" width="160" height="116" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="120" y="216" text-anchor="middle"><tspan x="120" dy="0">Too little</tspan><tspan x="120" dy="22">Definition only</tspan></text>
<rect x="280" y="164" width="160" height="116" fill="var(--highlight)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="360" y="216" text-anchor="middle"><tspan x="360" dy="0">Target</tspan><tspan x="360" dy="22">Useful depth</tspan></text>
<rect x="520" y="164" width="160" height="116" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text x="600" y="216" text-anchor="middle"><tspan x="600" dy="0">Too much</tspan><tspan x="600" dy="22">Excessive detail</tspan></text><path d="M 200 222 H 276 M 444 222 H 516" stroke="var(--line)" stroke-width="2"/><text x="360" y="332" text-anchor="middle">Name the difference that matters.</text>
</svg>
