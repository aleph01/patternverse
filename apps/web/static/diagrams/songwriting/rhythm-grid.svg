<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="rhythm-grid-title rhythm-grid-desc"><title id="rhythm-grid-title">Same bar, different rhythmic shape</title><desc id="rhythm-grid-desc">Three four-beat rows show a seed, an earlier arrival, and a version ending in a one-beat rest.</desc><style>:root{--paper:#fff;--ink:#181814;--muted:#65655f;--line:#007a4d;--wash:#e2f5eb;--soft:#ecece5;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--muted:#b6b6ae;--line:#05ce78;--wash:#173e2e;--soft:#343430}}</style><rect width="720" height="470" fill="var(--paper)"/><text x="360" y="35" text-anchor="middle" font-size="21" font-weight="650">Same bar, different rhythmic shape</text><text x="240" y="100" text-anchor="middle" font-size="18">1</text><path d="M180 114 L180 379" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 5"/><text x="360" y="100" text-anchor="middle" font-size="18">2</text><path d="M300 114 L300 379" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 5"/><text x="480" y="100" text-anchor="middle" font-size="18">3</text><path d="M420 114 L420 379" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 5"/><text x="600" y="100" text-anchor="middle" font-size="18">4</text><path d="M540 114 L540 379" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 5"/><text x="30" y="168" text-anchor="start" font-size="16">Seed</text><rect x="180" y="130" width="120" height="60" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="240" y="166" text-anchor="middle" font-size="16">E4</text><rect x="300" y="130" width="120" height="60" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="360" y="166" text-anchor="middle" font-size="16">G4</text><rect x="420" y="130" width="240" height="60" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="540" y="166" text-anchor="middle" font-size="16">A4</text><text x="30" y="258" text-anchor="start" font-size="16">Earlier arrival</text><rect x="180" y="220" width="60" height="60" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="210" y="256" text-anchor="middle" font-size="16">E4</text><rect x="240" y="220" width="60" height="60" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="270" y="256" text-anchor="middle" font-size="16">G4</text><rect x="300" y="220" width="360" height="60" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="480" y="256" text-anchor="middle" font-size="16">A4</text><text x="30" y="348" text-anchor="start" font-size="16">Leave space</text><rect x="180" y="310" width="120" height="60" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="240" y="346" text-anchor="middle" font-size="16">E4</text><rect x="300" y="310" width="120" height="60" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="360" y="346" text-anchor="middle" font-size="16">G4</text><rect x="420" y="310" width="120" height="60" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="480" y="346" text-anchor="middle" font-size="16">A4</text><rect x="540" y="310" width="120" height="60" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/><text x="600" y="346" text-anchor="middle" font-size="16">Rest</text><text x="360" y="445" text-anchor="middle" font-size="16">Each row fills four beats. Rests still occupy counted time.</text></svg>
