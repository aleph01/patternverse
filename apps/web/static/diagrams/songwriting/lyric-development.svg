<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="lyric-development-title lyric-development-desc"><title id="lyric-development-title">Let new information change the return</title><desc id="lyric-development-desc">A scene, new evidence, and an admission lead to a recurring chorus heard with different knowledge.</desc><style>:root{--paper:#fff;--ink:#181814;--muted:#65655f;--line:#007a4d;--wash:#e2f5eb;--soft:#ecece5;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--muted:#b6b6ae;--line:#05ce78;--wash:#173e2e;--soft:#343430}}</style><rect width="720" height="470" fill="var(--paper)"/><text x="360" y="35" text-anchor="middle" font-size="21" font-weight="650">Let new information change the return</text><rect x="40" y="110" width="180" height="135" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="130" y="145" text-anchor="middle" font-size="21">Verse 1</text><text x="130" y="186" text-anchor="middle" font-size="14">A key in the lock</text><text x="130" y="216" text-anchor="middle" font-size="14">A hesitant return</text><rect x="270" y="110" width="180" height="135" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="360" y="145" text-anchor="middle" font-size="21">Verse 2</text><text x="360" y="186" text-anchor="middle" font-size="14">A folded note</text><text x="360" y="216" text-anchor="middle" font-size="14">Someone has waited</text><rect x="500" y="110" width="180" height="135" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="590" y="145" text-anchor="middle" font-size="21">Bridge</text><text x="590" y="186" text-anchor="middle" font-size="14">A mistaken assumption</text><text x="590" y="216" text-anchor="middle" font-size="14">A changed commitment</text><path d="M220 175 L260 175" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M450 175 L490 175" fill="none" stroke="var(--line)" stroke-width="3"/><rect x="100" y="310" width="520" height="85" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="360" y="346" text-anchor="middle" font-size="19">The same chorus returns in a changed context.</text><text x="360" y="376" text-anchor="middle" font-size="18">“Leave the porch light on.”</text><text x="360" y="445" text-anchor="middle" font-size="16">Development can happen through meaning as well as new words.</text></svg>
