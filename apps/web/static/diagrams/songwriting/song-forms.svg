<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="song-forms-title song-forms-desc"><title id="song-forms-title">Different forms for related material</title><desc id="song-forms-desc">A proportional 52-bar timeline shows the complete song. A separate schematic verse–refrain design uses a different organization.</desc><style>:root{--paper:#fff;--ink:#181814;--muted:#65655f;--line:#007a4d;--wash:#e2f5eb;--soft:#ecece5;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--muted:#b6b6ae;--line:#05ce78;--wash:#173e2e;--soft:#343430}}</style><rect width="720" height="470" fill="var(--paper)"/><text x="360" y="35" text-anchor="middle" font-size="21" font-weight="650">Different forms for related material</text><text x="40" y="100" text-anchor="start" font-size="20">Canonical Porch Light: 52 bars</text><rect x="48" y="130" width="48" height="100" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="72" y="172" text-anchor="middle" font-size="12">Intro</text><text x="72" y="207" text-anchor="middle" font-size="16">4</text><rect x="96" y="130" width="96" height="100" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="144" y="172" text-anchor="middle" font-size="18">V1</text><text x="144" y="207" text-anchor="middle" font-size="16">8</text><rect x="192" y="130" width="96" height="100" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="240" y="172" text-anchor="middle" font-size="18">C1</text><text x="240" y="207" text-anchor="middle" font-size="16">8</text><rect x="288" y="130" width="96" height="100" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="336" y="172" text-anchor="middle" font-size="18">V2</text><text x="336" y="207" text-anchor="middle" font-size="16">8</text><rect x="384" y="130" width="96" height="100" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="432" y="172" text-anchor="middle" font-size="18">C2</text><text x="432" y="207" text-anchor="middle" font-size="16">8</text><rect x="480" y="130" width="48" height="100" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="504" y="172" text-anchor="middle" font-size="12">Bridge</text><text x="504" y="207" text-anchor="middle" font-size="16">4</text><rect x="528" y="130" width="96" height="100" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="576" y="172" text-anchor="middle" font-size="18">C3</text><text x="576" y="207" text-anchor="middle" font-size="16">8</text><rect x="624" y="130" width="48" height="100" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="648" y="172" text-anchor="middle" font-size="12">Outro</text><text x="648" y="207" text-anchor="middle" font-size="16">4</text><text x="40" y="282" text-anchor="start" font-size="20">A verse–refrain alternative</text><rect x="48" y="312" width="250" height="85" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="173" y="346" text-anchor="middle" font-size="15">Verse 1 + refrain</text><text x="173" y="374" text-anchor="middle" font-size="12">Rewrite the connection</text><rect x="298" y="312" width="250" height="85" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="423" y="346" text-anchor="middle" font-size="15">Verse 2 + refrain</text><text x="423" y="374" text-anchor="middle" font-size="12">New information</text><rect x="548" y="312" width="124" height="85" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="610" y="346" text-anchor="middle" font-size="15">Final return</text><text x="610" y="374" text-anchor="middle" font-size="12">Choose length</text><text x="360" y="445" text-anchor="middle" font-size="15">The lower row is schematic; it does not inherit the 52-bar map.</text></svg>
