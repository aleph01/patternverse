<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="keyboard-and-intervals-title keyboard-and-intervals-desc"><title id="keyboard-and-intervals-title">Locate pitches and count intervals</title><desc id="keyboard-and-intervals-desc">A C4 to C5 keyboard highlights E4, G4, and A4. Adjacent white keys E to F and B to C are semitone pairs.</desc><style>:root{--paper:#fff;--ink:#181814;--muted:#65655f;--line:#007a4d;--wash:#e2f5eb;--soft:#ecece5;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--muted:#b6b6ae;--line:#05ce78;--wash:#173e2e;--soft:#343430}}</style><rect width="720" height="470" fill="var(--paper)"/><text x="360" y="35" text-anchor="middle" font-size="21" font-weight="650">Locate pitches and count intervals</text><text x="360" y="85" text-anchor="middle" font-size="17">C4 is middle C; the course seed uses E4, G4, and A4.</text><rect x="90" y="120" width="65" height="180" rx="0" fill="#fff" stroke="#181814" stroke-width="1.5"/><text x="122.5" y="277" text-anchor="middle" font-size="17" style="fill:#181814">C4</text><rect x="155" y="120" width="65" height="180" rx="0" fill="#fff" stroke="#181814" stroke-width="1.5"/><text x="187.5" y="277" text-anchor="middle" font-size="17" style="fill:#181814">D4</text><rect x="220" y="120" width="65" height="180" rx="0" fill="#dff5e8" stroke="#181814" stroke-width="1.5"/><text x="252.5" y="277" text-anchor="middle" font-size="17" style="fill:#181814">E4</text><rect x="285" y="120" width="65" height="180" rx="0" fill="#fff" stroke="#181814" stroke-width="1.5"/><text x="317.5" y="277" text-anchor="middle" font-size="17" style="fill:#181814">F4</text><rect x="350" y="120" width="65" height="180" rx="0" fill="#dff5e8" stroke="#181814" stroke-width="1.5"/><text x="382.5" y="277" text-anchor="middle" font-size="17" style="fill:#181814">G4</text><rect x="415" y="120" width="65" height="180" rx="0" fill="#dff5e8" stroke="#181814" stroke-width="1.5"/><text x="447.5" y="277" text-anchor="middle" font-size="17" style="fill:#181814">A4</text><rect x="480" y="120" width="65" height="180" rx="0" fill="#fff" stroke="#181814" stroke-width="1.5"/><text x="512.5" y="277" text-anchor="middle" font-size="17" style="fill:#181814">B4</text><rect x="545" y="120" width="65" height="180" rx="0" fill="#fff" stroke="#181814" stroke-width="1.5"/><text x="577.5" y="277" text-anchor="middle" font-size="17" style="fill:#181814">C5</text><rect x="135" y="120" width="40" height="108" rx="0" fill="#181814" stroke="#181814" stroke-width="1.5"/><text x="155" y="200" text-anchor="middle" font-size="13" style="fill:#fff">C♯</text><rect x="200" y="120" width="40" height="108" rx="0" fill="#181814" stroke="#181814" stroke-width="1.5"/><text x="220" y="200" text-anchor="middle" font-size="13" style="fill:#fff">D♯</text><rect x="330" y="120" width="40" height="108" rx="0" fill="#181814" stroke="#181814" stroke-width="1.5"/><text x="350" y="200" text-anchor="middle" font-size="13" style="fill:#fff">F♯</text><rect x="395" y="120" width="40" height="108" rx="0" fill="#181814" stroke="#181814" stroke-width="1.5"/><text x="415" y="200" text-anchor="middle" font-size="13" style="fill:#fff">G♯</text><rect x="460" y="120" width="40" height="108" rx="0" fill="#181814" stroke="#181814" stroke-width="1.5"/><text x="480" y="200" text-anchor="middle" font-size="13" style="fill:#fff">A♯</text><text x="360" y="347" text-anchor="middle" font-size="19">E4 → G4: 3 semitones (minor third)</text><text x="360" y="383" text-anchor="middle" font-size="19">G4 → A4: 2 semitones (major second)</text><text x="360" y="440" text-anchor="middle" font-size="17">No black key separates E–F or B–C.</text></svg>
