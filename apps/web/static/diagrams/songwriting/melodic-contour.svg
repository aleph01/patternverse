<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="melodic-contour-title melodic-contour-desc"><title id="melodic-contour-title">Three ways a melody can move</title><desc id="melodic-contour-desc">Schematic lines compare rising, arching, and mostly level contours. They are not exact musical notation.</desc><style>:root{--paper:#fff;--ink:#181814;--muted:#65655f;--line:#007a4d;--wash:#e2f5eb;--soft:#ecece5;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--muted:#b6b6ae;--line:#05ce78;--wash:#173e2e;--soft:#343430}}</style><rect width="720" height="470" fill="var(--paper)"/><text x="360" y="35" text-anchor="middle" font-size="21" font-weight="650">Three ways a melody can move</text><text x="35" y="130" text-anchor="start" font-size="17">Rise</text><path d="M240 160 L330 145" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M330 145 L420 130" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M420 130 L510 110" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M510 110 L600 85" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="240" cy="160" r="6" fill="var(--line)"/><circle cx="330" cy="145" r="6" fill="var(--line)"/><circle cx="420" cy="130" r="6" fill="var(--line)"/><circle cx="510" cy="110" r="6" fill="var(--line)"/><circle cx="600" cy="85" r="6" fill="var(--line)"/><text x="35" y="235" text-anchor="start" font-size="17">Arch</text><path d="M240 255 L330 230" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M330 230 L420 200" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M420 200 L510 230" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M510 230 L600 255" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="240" cy="255" r="6" fill="var(--line)"/><circle cx="330" cy="230" r="6" fill="var(--line)"/><circle cx="420" cy="200" r="6" fill="var(--line)"/><circle cx="510" cy="230" r="6" fill="var(--line)"/><circle cx="600" cy="255" r="6" fill="var(--line)"/><text x="35" y="340" text-anchor="start" font-size="17">Level, then fall</text><path d="M240 325 L330 325" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M330 325 L420 325" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M420 325 L510 345" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M510 345 L600 365" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="240" cy="325" r="6" fill="var(--line)"/><circle cx="330" cy="325" r="6" fill="var(--line)"/><circle cx="420" cy="325" r="6" fill="var(--line)"/><circle cx="510" cy="345" r="6" fill="var(--line)"/><circle cx="600" cy="365" r="6" fill="var(--line)"/><text x="360" y="445" text-anchor="middle" font-size="16">Direction only: exact pitches, intervals, and durations are not shown.</text></svg>
