<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="meter-groups-title meter-groups-desc"><title id="meter-groups-title">Beat count and beat division</title><desc id="meter-groups-desc">Three pairs of subdivisions in 3/4 contrast with two groups of three subdivisions in 6/8.</desc><style>:root{--paper:#fff;--ink:#181814;--muted:#65655f;--line:#007a4d;--wash:#e2f5eb;--soft:#ecece5;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--muted:#b6b6ae;--line:#05ce78;--wash:#173e2e;--soft:#343430}}</style><rect width="720" height="470" fill="var(--paper)"/><text x="360" y="35" text-anchor="middle" font-size="21" font-weight="650">Beat count and beat division</text><text x="45" y="92" text-anchor="start" font-size="19">3/4: three simple beats</text><rect x="65" y="113" width="168" height="65" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><rect x="245" y="113" width="168" height="65" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><rect x="425" y="113" width="168" height="65" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><circle cx="90" cy="140" r="7" fill="var(--line)"/><text x="90" y="202" text-anchor="middle" font-size="19">1</text><circle cx="180" cy="140" r="7" fill="var(--line)"/><text x="180" y="202" text-anchor="middle" font-size="19">&amp;</text><circle cx="270" cy="140" r="7" fill="var(--line)"/><text x="270" y="202" text-anchor="middle" font-size="19">2</text><circle cx="360" cy="140" r="7" fill="var(--line)"/><text x="360" y="202" text-anchor="middle" font-size="19">&amp;</text><circle cx="450" cy="140" r="7" fill="var(--line)"/><text x="450" y="202" text-anchor="middle" font-size="19">3</text><circle cx="540" cy="140" r="7" fill="var(--line)"/><text x="540" y="202" text-anchor="middle" font-size="19">&amp;</text><text x="45" y="267" text-anchor="start" font-size="19">6/8: two compound beats</text><rect x="65" y="288" width="258" height="65" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><rect x="335" y="288" width="258" height="65" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><circle cx="90" cy="315" r="7" fill="var(--line)"/><text x="90" y="377" text-anchor="middle" font-size="19">1</text><circle cx="180" cy="315" r="7" fill="var(--line)"/><text x="180" y="377" text-anchor="middle" font-size="19">la</text><circle cx="270" cy="315" r="7" fill="var(--line)"/><text x="270" y="377" text-anchor="middle" font-size="19">li</text><circle cx="360" cy="315" r="7" fill="var(--line)"/><text x="360" y="377" text-anchor="middle" font-size="19">2</text><circle cx="450" cy="315" r="7" fill="var(--line)"/><text x="450" y="377" text-anchor="middle" font-size="19">la</text><circle cx="540" cy="315" r="7" fill="var(--line)"/><text x="540" y="377" text-anchor="middle" font-size="19">li</text><text x="360" y="445" text-anchor="middle" font-size="16">Six small units; different grouping and different larger pulse.</text></svg>
