<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="temporary-home-title temporary-home-desc"><title id="temporary-home-title">Point toward a temporary destination</title><desc id="temporary-home-desc">C moves through E7 to Am. G-sharp leads to A while the surrounding C-major context can continue.</desc><style>:root{--paper:#fff;--ink:#181814;--muted:#65655f;--line:#007a4d;--wash:#e2f5eb;--soft:#ecece5;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--muted:#b6b6ae;--line:#05ce78;--wash:#173e2e;--soft:#343430}}</style><rect width="720" height="470" fill="var(--paper)"/><text x="360" y="35" text-anchor="middle" font-size="21" font-weight="650">Point toward a temporary destination</text><rect x="65" y="135" width="150" height="135" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="140" y="178" text-anchor="middle" font-size="27">C</text><text x="140" y="227" text-anchor="middle" font-size="18">C E G</text><path d="M220 200 L280 200" fill="none" stroke="var(--line)" stroke-width="3"/><rect x="285" y="135" width="150" height="135" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="360" y="178" text-anchor="middle" font-size="27">E7</text><text x="360" y="227" text-anchor="middle" font-size="18">E G♯ B D</text><path d="M440 200 L500 200" fill="none" stroke="var(--line)" stroke-width="3"/><rect x="505" y="135" width="150" height="135" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="580" y="178" text-anchor="middle" font-size="27">Am</text><text x="580" y="227" text-anchor="middle" font-size="18">A C E</text><text x="360" y="94" text-anchor="middle" font-size="19">C remains the wider tonal reference.</text><text x="360" y="329" text-anchor="middle" font-size="21">E7 is V7/vi in C: the dominant of Am.</text><text x="360" y="370" text-anchor="middle" font-size="18">G♯ → A helps point toward the local destination.</text><text x="360" y="420" text-anchor="middle" font-size="16">A brief tonicization is not automatically a full key change.</text></svg>
