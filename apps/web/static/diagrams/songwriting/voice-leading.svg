<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="voice-leading-title voice-leading-desc"><title id="voice-leading-title">Follow each voice through the change</title><desc id="voice-leading-desc">C4 and E4 remain while G4 rises to A4. Without a lower bass, the final chord is Am in first inversion.</desc><style>:root{--paper:#fff;--ink:#181814;--muted:#65655f;--line:#007a4d;--wash:#e2f5eb;--soft:#ecece5;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--muted:#b6b6ae;--line:#05ce78;--wash:#173e2e;--soft:#343430}}</style><rect width="720" height="470" fill="var(--paper)"/><text x="360" y="35" text-anchor="middle" font-size="21" font-weight="650">Follow each voice through the change</text><text x="200" y="93" text-anchor="middle" font-size="23">C major</text><text x="520" y="93" text-anchor="middle" font-size="23">Am/C</text><path d="M225 165 L495 125" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="200" cy="165" r="6" fill="var(--line)"/><circle cx="520" cy="125" r="6" fill="var(--line)"/><text x="158" y="171" text-anchor="middle" font-size="19">G4</text><text x="561" y="131" text-anchor="middle" font-size="19">A4</text><path d="M225 245 L495 245" fill="none" stroke="var(--muted)" stroke-width="3"/><circle cx="200" cy="245" r="6" fill="var(--line)"/><circle cx="520" cy="245" r="6" fill="var(--line)"/><text x="158" y="251" text-anchor="middle" font-size="19">E4</text><text x="561" y="251" text-anchor="middle" font-size="19">E4</text><path d="M225 325 L495 325" fill="none" stroke="var(--muted)" stroke-width="3"/><circle cx="200" cy="325" r="6" fill="var(--line)"/><circle cx="520" cy="325" r="6" fill="var(--line)"/><text x="158" y="331" text-anchor="middle" font-size="19">C4</text><text x="561" y="331" text-anchor="middle" font-size="19">C4</text><text x="360" y="395" text-anchor="middle" font-size="19">Two notes stay; one rises by a whole step.</text><text x="360" y="442" text-anchor="middle" font-size="15">With a separate lower A bass, the full Am chord is root position.</text></svg>
