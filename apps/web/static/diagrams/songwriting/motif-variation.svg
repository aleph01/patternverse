<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="motif-variation-title motif-variation-desc"><title id="motif-variation-title">Keep an identity while changing a feature</title><desc id="motif-variation-desc">Three note gestures preserve durations one, one, and two beats while their pitch endings and direction change.</desc><style>:root{--paper:#fff;--ink:#181814;--muted:#65655f;--line:#007a4d;--wash:#e2f5eb;--soft:#ecece5;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--muted:#b6b6ae;--line:#05ce78;--wash:#173e2e;--soft:#343430}}</style><rect width="720" height="470" fill="var(--paper)"/><text x="360" y="35" text-anchor="middle" font-size="21" font-weight="650">Keep an identity while changing a feature</text><text x="32" y="130" text-anchor="start" font-size="17">Seed</text><path d="M210 155 L360 135" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M360 135 L510 125" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="210" cy="155" r="8" fill="var(--line)"/><text x="210" y="85" text-anchor="middle" font-size="17">E4</text><text x="210" y="180" text-anchor="middle" font-size="14">1 beat</text><circle cx="360" cy="135" r="8" fill="var(--line)"/><text x="360" y="85" text-anchor="middle" font-size="17">G4</text><text x="360" y="180" text-anchor="middle" font-size="14">1 beat</text><circle cx="510" cy="125" r="8" fill="var(--line)"/><text x="510" y="85" text-anchor="middle" font-size="17">A4</text><text x="510" y="180" text-anchor="middle" font-size="14">2 beats</text><text x="32" y="250" text-anchor="start" font-size="17">New ending</text><path d="M210 275 L360 255" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M360 255 L510 225" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="210" cy="275" r="8" fill="var(--line)"/><text x="210" y="205" text-anchor="middle" font-size="17">E4</text><text x="210" y="300" text-anchor="middle" font-size="14">1 beat</text><circle cx="360" cy="255" r="8" fill="var(--line)"/><text x="360" y="205" text-anchor="middle" font-size="17">G4</text><text x="360" y="300" text-anchor="middle" font-size="14">1 beat</text><circle cx="510" cy="225" r="8" fill="var(--line)"/><text x="510" y="205" text-anchor="middle" font-size="17">C5</text><text x="510" y="300" text-anchor="middle" font-size="14">2 beats</text><text x="32" y="370" text-anchor="start" font-size="17">Answer</text><path d="M210 365 L360 385" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M360 385 L510 395" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="210" cy="365" r="8" fill="var(--line)"/><text x="210" y="325" text-anchor="middle" font-size="17">G4</text><text x="210" y="420" text-anchor="middle" font-size="14">1 beat</text><circle cx="360" cy="385" r="8" fill="var(--line)"/><text x="360" y="325" text-anchor="middle" font-size="17">E4</text><text x="360" y="420" text-anchor="middle" font-size="14">1 beat</text><circle cx="510" cy="395" r="8" fill="var(--line)"/><text x="510" y="325" text-anchor="middle" font-size="17">D4</text><text x="510" y="420" text-anchor="middle" font-size="14">2 beats</text><text x="360" y="453" text-anchor="middle" font-size="16">A preserved rhythm connects different pitch shapes.</text></svg>
