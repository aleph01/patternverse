<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="phrase-map-title phrase-map-desc"><title id="phrase-map-title">Musical punctuation within counted time</title><desc id="phrase-map-desc">Eight bars group into four lyric phrases. Schematic rests show that a phrase can leave breathing room without deleting time.</desc><style>:root{--paper:#fff;--ink:#181814;--muted:#65655f;--line:#007a4d;--wash:#e2f5eb;--soft:#ecece5;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--muted:#b6b6ae;--line:#05ce78;--wash:#173e2e;--soft:#343430}}</style><rect width="720" height="470" fill="var(--paper)"/><text x="360" y="35" text-anchor="middle" font-size="21" font-weight="650">Musical punctuation within counted time</text><text x="360" y="92" text-anchor="middle" font-size="19">A verse with four two-bar lyric phrases</text><rect x="60" y="145" width="75" height="65" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/><text x="97.5" y="185" text-anchor="middle" font-size="20">1</text><rect x="135" y="145" width="75" height="65" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/><text x="172.5" y="185" text-anchor="middle" font-size="20">2</text><rect x="210" y="145" width="75" height="65" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/><text x="247.5" y="185" text-anchor="middle" font-size="20">3</text><rect x="285" y="145" width="75" height="65" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/><text x="322.5" y="185" text-anchor="middle" font-size="20">4</text><rect x="360" y="145" width="75" height="65" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/><text x="397.5" y="185" text-anchor="middle" font-size="20">5</text><rect x="435" y="145" width="75" height="65" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/><text x="472.5" y="185" text-anchor="middle" font-size="20">6</text><rect x="510" y="145" width="75" height="65" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/><text x="547.5" y="185" text-anchor="middle" font-size="20">7</text><rect x="585" y="145" width="75" height="65" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/><text x="622.5" y="185" text-anchor="middle" font-size="20">8</text><rect x="60" y="245" width="150" height="65" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="135" y="285" text-anchor="middle" font-size="20">Line 1</text><rect x="172" y="325" width="38" height="28" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/><text x="191" y="346" text-anchor="middle" font-size="12">rest</text><rect x="210" y="245" width="150" height="65" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="285" y="285" text-anchor="middle" font-size="20">Line 2</text><rect x="322" y="325" width="38" height="28" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/><text x="341" y="346" text-anchor="middle" font-size="12">rest</text><rect x="360" y="245" width="150" height="65" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="435" y="285" text-anchor="middle" font-size="20">Line 3</text><rect x="472" y="325" width="38" height="28" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/><text x="491" y="346" text-anchor="middle" font-size="12">rest</text><rect x="510" y="245" width="150" height="65" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="585" y="285" text-anchor="middle" font-size="20">Line 4</text><rect x="622" y="325" width="38" height="28" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/><text x="641" y="346" text-anchor="middle" font-size="12">rest</text><text x="360" y="405" text-anchor="middle" font-size="18">A phrase can finish before its counted span ends.</text><text x="360" y="443" text-anchor="middle" font-size="15">Rest boxes are schematic breathing positions, not fixed durations.</text></svg>
