<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="circle-of-fifths-title circle-of-fifths-desc"><title id="circle-of-fifths-title">A map of key relationships</title><desc id="circle-of-fifths-desc">Major keys move clockwise by fifths from C to G to D. Each key is paired with its relative minor. C, F, and G are highlighted as neighboring signatures.</desc><style>:root{--paper:#fff;--ink:#181814;--muted:#65655f;--line:#007a4d;--wash:#e2f5eb;--soft:#ecece5;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--muted:#b6b6ae;--line:#05ce78;--wash:#173e2e;--soft:#343430}}</style><rect width="720" height="470" fill="var(--paper)"/><text x="360" y="35" text-anchor="middle" font-size="21" font-weight="650">A map of key relationships</text><circle cx="360" cy="245" r="160" fill="none" stroke="var(--muted)" stroke-width="1.5"/><circle cx="360" cy="245" r="114" fill="none" stroke="var(--muted)" stroke-dasharray="3 6"/><circle cx="360" cy="85" r="23" fill="var(--wash)"/><text x="360" y="91" text-anchor="middle" font-size="21" font-weight="700">C</text><text x="360" y="139" text-anchor="middle" font-size="16" style="fill:var(--line)">Am</text><circle cx="440" cy="106.436" r="23" fill="var(--wash)"/><text x="440" y="112.436" text-anchor="middle" font-size="21" font-weight="700">G</text><text x="415.5" y="153.871" text-anchor="middle" font-size="16" style="fill:var(--line)">Em</text><circle cx="498.564" cy="165" r="23" fill="var(--paper)"/><text x="498.564" y="171" text-anchor="middle" font-size="21" font-weight="450">D</text><text x="456.129" y="194.5" text-anchor="middle" font-size="16" style="fill:var(--line)">Bm</text><circle cx="520" cy="245" r="23" fill="var(--paper)"/><text x="520" y="251" text-anchor="middle" font-size="21" font-weight="450">A</text><text x="471" y="250" text-anchor="middle" font-size="16" style="fill:var(--line)">F♯m</text><circle cx="498.564" cy="325" r="23" fill="var(--paper)"/><text x="498.564" y="331" text-anchor="middle" font-size="21" font-weight="450">E</text><text x="456.129" y="305.5" text-anchor="middle" font-size="16" style="fill:var(--line)">C♯m</text><circle cx="440" cy="383.564" r="23" fill="var(--paper)"/><text x="440" y="389.564" text-anchor="middle" font-size="21" font-weight="450">B</text><text x="415.5" y="346.129" text-anchor="middle" font-size="16" style="fill:var(--line)">G♯m</text><circle cx="360" cy="405" r="23" fill="var(--paper)"/><text x="360" y="411" text-anchor="middle" font-size="17" font-weight="450">F♯ / G♭</text><text x="360" y="374" text-anchor="middle" font-size="14" style="fill:var(--line)">D♯m / E♭m</text><circle cx="280" cy="383.564" r="23" fill="var(--paper)"/><text x="280" y="389.564" text-anchor="middle" font-size="21" font-weight="450">D♭</text><text x="304.5" y="346.129" text-anchor="middle" font-size="16" style="fill:var(--line)">B♭m</text><circle cx="221.436" cy="325" r="23" fill="var(--paper)"/><text x="221.436" y="331" text-anchor="middle" font-size="21" font-weight="450">A♭</text><text x="263.871" y="305.5" text-anchor="middle" font-size="16" style="fill:var(--line)">Fm</text><circle cx="200" cy="245" r="23" fill="var(--paper)"/><text x="200" y="251" text-anchor="middle" font-size="21" font-weight="450">E♭</text><text x="249" y="250" text-anchor="middle" font-size="16" style="fill:var(--line)">Cm</text><circle cx="221.436" cy="165" r="23" fill="var(--paper)"/><text x="221.436" y="171" text-anchor="middle" font-size="21" font-weight="450">B♭</text><text x="263.871" y="194.5" text-anchor="middle" font-size="16" style="fill:var(--line)">Gm</text><circle cx="280" cy="106.436" r="23" fill="var(--wash)"/><text x="280" y="112.436" text-anchor="middle" font-size="21" font-weight="700">F</text><text x="304.5" y="153.871" text-anchor="middle" font-size="16" style="fill:var(--line)">Dm</text><text x="360" y="235" text-anchor="middle" font-size="14">Major outside</text><text x="360" y="259" text-anchor="middle" font-size="14">Minor inside</text><text x="360" y="448" text-anchor="middle" font-size="16">Clockwise from C: add sharps. Counterclockwise: add flats.</text></svg>
