<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="energy-arc-title energy-arc-desc"><title id="energy-arc-title">Plan contrast across the whole song</title><desc id="energy-arc-desc">A conceptual line rises for choruses, reduces in the bridge, and settles into the outro; it summarizes several musical dimensions.</desc><style>:root{--paper:#fff;--ink:#181814;--muted:#65655f;--line:#007a4d;--wash:#e2f5eb;--soft:#ecece5;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--muted:#b6b6ae;--line:#05ce78;--wash:#173e2e;--soft:#343430}}</style><rect width="720" height="470" fill="var(--paper)"/><text x="360" y="35" text-anchor="middle" font-size="21" font-weight="650">Plan contrast across the whole song</text><path d="M75 365 L665 365" fill="none" stroke="var(--muted)" stroke-width="2"/><text x="45" y="230" text-anchor="middle" font-size="14">More</text><text x="45" y="344" text-anchor="middle" font-size="14">Less</text><path d="M85 315 L155 285" fill="none" stroke="var(--line)" stroke-width="4"/><path d="M155 285 L235 195" fill="none" stroke="var(--line)" stroke-width="4"/><path d="M235 195 L315 250" fill="none" stroke="var(--line)" stroke-width="4"/><path d="M315 250 L395 185" fill="none" stroke="var(--line)" stroke-width="4"/><path d="M395 185 L465 295" fill="none" stroke="var(--line)" stroke-width="4"/><path d="M465 295 L555 145" fill="none" stroke="var(--line)" stroke-width="4"/><path d="M555 145 L645 320" fill="none" stroke="var(--line)" stroke-width="4"/><circle cx="85" cy="315" r="7" fill="var(--line)"/><text x="85" y="393" text-anchor="middle" font-size="15">Intro</text><circle cx="155" cy="285" r="7" fill="var(--line)"/><text x="155" y="393" text-anchor="middle" font-size="15">V1</text><circle cx="235" cy="195" r="7" fill="var(--line)"/><text x="235" y="393" text-anchor="middle" font-size="15">C1</text><circle cx="315" cy="250" r="7" fill="var(--line)"/><text x="315" y="393" text-anchor="middle" font-size="15">V2</text><circle cx="395" cy="185" r="7" fill="var(--line)"/><text x="395" y="393" text-anchor="middle" font-size="15">C2</text><circle cx="465" cy="295" r="7" fill="var(--line)"/><text x="465" y="393" text-anchor="middle" font-size="15">Br</text><circle cx="555" cy="145" r="7" fill="var(--line)"/><text x="555" y="393" text-anchor="middle" font-size="15">C3</text><circle cx="645" cy="320" r="7" fill="var(--line)"/><text x="645" y="393" text-anchor="middle" font-size="15">Out</text><text x="360" y="93" text-anchor="middle" font-size="17">One arrangement plan: activity, density, register, and space</text><text x="360" y="438" text-anchor="middle" font-size="15">Conceptual sketch, not a measurement of emotion or audio loudness.</text></svg>
