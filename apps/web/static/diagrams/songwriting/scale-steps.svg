<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="scale-title scale-desc"><title id="scale-title">Build a major scale from steps</title><desc id="scale-desc">C major and D major use the same ordered whole and half steps. Equal semitone distances have equal widths. D major requires F-sharp and C-sharp.</desc><style>:root{--paper:#fff;--ink:#181814;--muted:#65655f;--line:#007a4d;--wash:#e2f5eb;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--muted:#b6b6ae;--line:#05ce78;--wash:#173e2e}}</style><rect width="720" height="470" fill="var(--paper)"/><text x="360" y="38" text-anchor="middle" font-size="23" fill="var(--ink)">One scale shape, two starting pitches</text><text x="360" y="83" text-anchor="middle" font-size="16" fill="var(--ink)">W = whole step (2 semitones)     H = half step (1 semitone)</text><text x="360" y="125" text-anchor="middle" font-size="20" fill="var(--ink)">C major</text><path d="M88 175 H176" stroke="var(--line)" stroke-width="2"/><text x="132.0" y="220" text-anchor="middle" font-size="16" fill="var(--ink)">W</text><circle cx="88" cy="175" r="6" fill="var(--line)"/><text x="88" y="156" text-anchor="middle" font-size="16" fill="var(--ink)">C4</text><path d="M176 175 H264" stroke="var(--line)" stroke-width="2"/><text x="220.0" y="220" text-anchor="middle" font-size="16" fill="var(--ink)">W</text><circle cx="176" cy="175" r="6" fill="var(--line)"/><text x="176" y="156" text-anchor="middle" font-size="16" fill="var(--ink)">D4</text><path d="M264 175 H308" stroke="var(--line)" stroke-width="2"/><text x="286.0" y="220" text-anchor="middle" font-size="16" fill="var(--ink)">H</text><circle cx="264" cy="175" r="6" fill="var(--line)"/><text x="264" y="156" text-anchor="middle" font-size="16" fill="var(--ink)">E4</text><path d="M308 175 H396" stroke="var(--line)" stroke-width="2"/><text x="352.0" y="220" text-anchor="middle" font-size="16" fill="var(--ink)">W</text><circle cx="308" cy="175" r="6" fill="var(--line)"/><text x="308" y="156" text-anchor="middle" font-size="16" fill="var(--ink)">F4</text><path d="M396 175 H484" stroke="var(--line)" stroke-width="2"/><text x="440.0" y="220" text-anchor="middle" font-size="16" fill="var(--ink)">W</text><circle cx="396" cy="175" r="6" fill="var(--line)"/><text x="396" y="156" text-anchor="middle" font-size="16" fill="var(--ink)">G4</text><path d="M484 175 H572" stroke="var(--line)" stroke-width="2"/><text x="528.0" y="220" text-anchor="middle" font-size="16" fill="var(--ink)">W</text><circle cx="484" cy="175" r="6" fill="var(--line)"/><text x="484" y="156" text-anchor="middle" font-size="16" fill="var(--ink)">A4</text><path d="M572 175 H616" stroke="var(--line)" stroke-width="2"/><text x="594.0" y="220" text-anchor="middle" font-size="16" fill="var(--ink)">H</text><circle cx="572" cy="175" r="6" fill="var(--line)"/><text x="572" y="156" text-anchor="middle" font-size="16" fill="var(--ink)">B4</text><circle cx="616" cy="175" r="6" fill="var(--line)"/><text x="616" y="156" text-anchor="middle" font-size="16" fill="var(--ink)">C5</text><text x="360" y="270" text-anchor="middle" font-size="20" fill="var(--ink)">D major</text><path d="M88 320 H176" stroke="var(--line)" stroke-width="2"/><text x="132.0" y="365" text-anchor="middle" font-size="16" fill="var(--ink)">W</text><circle cx="88" cy="320" r="6" fill="var(--line)"/><text x="88" y="301" text-anchor="middle" font-size="16" fill="var(--ink)">D4</text><path d="M176 320 H264" stroke="var(--line)" stroke-width="2"/><text x="220.0" y="365" text-anchor="middle" font-size="16" fill="var(--ink)">W</text><circle cx="176" cy="320" r="6" fill="var(--line)"/><text x="176" y="301" text-anchor="middle" font-size="16" fill="var(--ink)">E4</text><path d="M264 320 H308" stroke="var(--line)" stroke-width="2"/><text x="286.0" y="365" text-anchor="middle" font-size="16" fill="var(--ink)">H</text><circle cx="264" cy="320" r="6" fill="var(--line)"/><text x="264" y="301" text-anchor="middle" font-size="16" fill="var(--ink)">F♯4</text><path d="M308 320 H396" stroke="var(--line)" stroke-width="2"/><text x="352.0" y="365" text-anchor="middle" font-size="16" fill="var(--ink)">W</text><circle cx="308" cy="320" r="6" fill="var(--line)"/><text x="308" y="301" text-anchor="middle" font-size="16" fill="var(--ink)">G4</text><path d="M396 320 H484" stroke="var(--line)" stroke-width="2"/><text x="440.0" y="365" text-anchor="middle" font-size="16" fill="var(--ink)">W</text><circle cx="396" cy="320" r="6" fill="var(--line)"/><text x="396" y="301" text-anchor="middle" font-size="16" fill="var(--ink)">A4</text><path d="M484 320 H572" stroke="var(--line)" stroke-width="2"/><text x="528.0" y="365" text-anchor="middle" font-size="16" fill="var(--ink)">W</text><circle cx="484" cy="320" r="6" fill="var(--line)"/><text x="484" y="301" text-anchor="middle" font-size="16" fill="var(--ink)">B4</text><path d="M572 320 H616" stroke="var(--line)" stroke-width="2"/><text x="594.0" y="365" text-anchor="middle" font-size="16" fill="var(--ink)">H</text><circle cx="572" cy="320" r="6" fill="var(--line)"/><text x="572" y="301" text-anchor="middle" font-size="16" fill="var(--ink)">C♯5</text><circle cx="616" cy="320" r="6" fill="var(--line)"/><text x="616" y="301" text-anchor="middle" font-size="16" fill="var(--ink)">D5</text><text x="360" y="413" text-anchor="middle" font-size="19" fill="var(--ink)">Same gaps: 2 · 2 · 1 · 2 · 2 · 2 · 1</text><text x="360" y="449" text-anchor="middle" font-size="16" fill="var(--ink)">The upper note repeats the starting pitch one octave higher.</text></svg>
