<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="lyric-stress-title lyric-stress-desc"><title id="lyric-stress-title">Give important words musical time</title><desc id="lyric-stress-desc">Five original title syllables occupy two four-beat bars, with longer durations on porch, light, and on.</desc><style>:root{--paper:#fff;--ink:#181814;--muted:#65655f;--line:#007a4d;--wash:#e2f5eb;--soft:#ecece5;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--muted:#b6b6ae;--line:#05ce78;--wash:#173e2e;--soft:#343430}}</style><rect width="720" height="470" fill="var(--paper)"/><text x="360" y="35" text-anchor="middle" font-size="21" font-weight="650">Give important words musical time</text><text x="220" y="99" text-anchor="middle" font-size="21">Bar 1: F</text><text x="484" y="99" text-anchor="middle" font-size="21">Bar 2: G</text><text x="129" y="143" text-anchor="middle" font-size="17">1</text><path d="M96 155 L96 322" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 5"/><text x="195" y="143" text-anchor="middle" font-size="17">2</text><path d="M162 155 L162 322" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 5"/><text x="261" y="143" text-anchor="middle" font-size="17">3</text><path d="M228 155 L228 322" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 5"/><text x="327" y="143" text-anchor="middle" font-size="17">4</text><path d="M294 155 L294 322" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 5"/><text x="393" y="143" text-anchor="middle" font-size="17">1</text><path d="M360 155 L360 322" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 5"/><text x="459" y="143" text-anchor="middle" font-size="17">2</text><path d="M426 155 L426 322" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 5"/><text x="525" y="143" text-anchor="middle" font-size="17">3</text><path d="M492 155 L492 322" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 5"/><text x="591" y="143" text-anchor="middle" font-size="17">4</text><path d="M558 155 L558 322" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 5"/><rect x="96" y="190" width="66" height="100" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="129" y="229" text-anchor="middle" font-size="18">Leave</text><text x="129" y="267" text-anchor="middle" font-size="18">A4</text><rect x="162" y="190" width="66" height="100" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.5"/><text x="195" y="229" text-anchor="middle" font-size="18">the</text><text x="195" y="267" text-anchor="middle" font-size="18">A4</text><rect x="228" y="190" width="132" height="100" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="294" y="229" text-anchor="middle" font-size="18">porch</text><text x="294" y="267" text-anchor="middle" font-size="18">G4</text><rect x="360" y="190" width="132" height="100" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="426" y="229" text-anchor="middle" font-size="18">light</text><text x="426" y="267" text-anchor="middle" font-size="18">E4</text><rect x="492" y="190" width="132" height="100" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="558" y="229" text-anchor="middle" font-size="18">on</text><text x="558" y="267" text-anchor="middle" font-size="18">G4</text><text x="360" y="373" text-anchor="middle" font-size="19">Five syllables across eight quarter-note beats.</text><text x="360" y="410" text-anchor="middle" font-size="19">Durations: 1 + 1 + 2 | 2 + 2</text><text x="360" y="448" text-anchor="middle" font-size="15">One original setting; musical emphasis also depends on delivery.</text></svg>
