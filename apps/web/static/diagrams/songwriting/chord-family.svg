<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="chord-family-title chord-family-desc"><title id="chord-family-title">Seven triads from one major scale</title><desc id="chord-family-desc">The C-major diatonic triads are labeled by Roman numeral, chord name, and notes, with their qualities distinguished.</desc><style>:root{--paper:#fff;--ink:#181814;--muted:#65655f;--line:#007a4d;--wash:#e2f5eb;--soft:#ecece5;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--muted:#b6b6ae;--line:#05ce78;--wash:#173e2e;--soft:#343430}}</style><rect width="720" height="470" fill="var(--paper)"/><text x="360" y="35" text-anchor="middle" font-size="21" font-weight="650">Seven triads from one major scale</text><text x="360" y="90" text-anchor="middle" font-size="19">C major: C · D · E · F · G · A · B</text><rect x="42" y="135" width="84" height="170" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="84" y="173" text-anchor="middle" font-size="22">I</text><text x="84" y="223" text-anchor="middle" font-size="23">C</text><text x="84" y="270" text-anchor="middle" font-size="15">C E G</text><rect x="134" y="135" width="84" height="170" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="176" y="173" text-anchor="middle" font-size="22">ii</text><text x="176" y="223" text-anchor="middle" font-size="23">Dm</text><text x="176" y="270" text-anchor="middle" font-size="15">D F A</text><rect x="226" y="135" width="84" height="170" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="268" y="173" text-anchor="middle" font-size="22">iii</text><text x="268" y="223" text-anchor="middle" font-size="23">Em</text><text x="268" y="270" text-anchor="middle" font-size="15">E G B</text><rect x="318" y="135" width="84" height="170" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="360" y="173" text-anchor="middle" font-size="22">IV</text><text x="360" y="223" text-anchor="middle" font-size="23">F</text><text x="360" y="270" text-anchor="middle" font-size="15">F A C</text><rect x="410" y="135" width="84" height="170" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="452" y="173" text-anchor="middle" font-size="22">V</text><text x="452" y="223" text-anchor="middle" font-size="23">G</text><text x="452" y="270" text-anchor="middle" font-size="15">G B D</text><rect x="502" y="135" width="84" height="170" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="544" y="173" text-anchor="middle" font-size="22">vi</text><text x="544" y="223" text-anchor="middle" font-size="23">Am</text><text x="544" y="270" text-anchor="middle" font-size="15">A C E</text><rect x="594" y="135" width="84" height="170" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="636" y="173" text-anchor="middle" font-size="22">vii°</text><text x="636" y="223" text-anchor="middle" font-size="23">Bdim</text><text x="636" y="270" text-anchor="middle" font-size="15">B D F</text><text x="360" y="355" text-anchor="middle" font-size="17">Major: I, IV, V     Minor: ii, iii, vi     Diminished: vii°</text><text x="360" y="407" text-anchor="middle" font-size="19">In G major, I–vi–IV–V becomes G–Em–C–D.</text><text x="360" y="445" text-anchor="middle" font-size="16">Chord relationships survive transposition; names change.</text></svg>
