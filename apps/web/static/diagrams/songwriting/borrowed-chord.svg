<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="borrowed-chord-title borrowed-chord-desc"><title id="borrowed-chord-title">A parallel-mode color on the way home</title><desc id="borrowed-chord-desc">F major changes to F minor before C. The A to A-flat to G line makes the borrowed pitch explicit.</desc><style>:root{--paper:#fff;--ink:#181814;--muted:#65655f;--line:#007a4d;--wash:#e2f5eb;--soft:#ecece5;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--muted:#b6b6ae;--line:#05ce78;--wash:#173e2e;--soft:#343430}}</style><rect width="720" height="470" fill="var(--paper)"/><text x="360" y="35" text-anchor="middle" font-size="21" font-weight="650">A parallel-mode color on the way home</text><text x="140" y="110" text-anchor="middle" font-size="27">F</text><rect x="75" y="145" width="130" height="165" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="140" y="186" text-anchor="middle" font-size="23">F</text><text x="140" y="230" text-anchor="middle" font-size="23" style="fill:var(--line)">A</text><text x="140" y="274" text-anchor="middle" font-size="23">C</text><path d="M212 228 L282 228" fill="none" stroke="var(--line)" stroke-width="3"/><text x="360" y="110" text-anchor="middle" font-size="27">Fm</text><rect x="295" y="145" width="130" height="165" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="360" y="186" text-anchor="middle" font-size="23">F</text><text x="360" y="230" text-anchor="middle" font-size="23" style="fill:var(--line)">A♭</text><text x="360" y="274" text-anchor="middle" font-size="23">C</text><path d="M432 228 L502 228" fill="none" stroke="var(--line)" stroke-width="3"/><text x="580" y="110" text-anchor="middle" font-size="27">C</text><rect x="515" y="145" width="130" height="165" rx="6" fill="var(--wash)" stroke="var(--ink)" stroke-width="1.5"/><text x="580" y="186" text-anchor="middle" font-size="23">E</text><text x="580" y="230" text-anchor="middle" font-size="23" style="fill:var(--line)">G</text><text x="580" y="274" text-anchor="middle" font-size="23">C</text><text x="360" y="368" text-anchor="middle" font-size="23">One inner line: A → A♭ → G</text><text x="360" y="408" text-anchor="middle" font-size="17">The wider reference stays C; Fm borrows from C minor.</text><text x="360" y="446" text-anchor="middle" font-size="15">A held A natural in the melody needs a deliberate clash check.</text></svg>
