<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="iceberg-model-title iceberg-model-desc">
<title id="iceberg-model-title">Four levels of inquiry</title><desc id="iceberg-model-desc">A visible event leads to questions about recurrence, arrangements, and sustaining assumptions. Each level needs evidence.</desc>
<style>:root{--paper:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="iceberg-model-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="40" text-anchor="middle" font-size="19"><tspan x="360" dy="0">Move from the event toward testable explanations</tspan></text><rect x="80" y="70" width="560" height="66" rx="5" fill="var(--highlight)" fill-opacity="1" stroke="var(--ink)" stroke-width="1.5"/><text x="360.0" y="109.0" text-anchor="middle" font-size="16"><tspan x="360.0" dy="0">Event: what happened?</tspan></text><rect x="100" y="158" width="520" height="66" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="360.0" y="197.0" text-anchor="middle" font-size="16"><tspan x="360.0" dy="0">Pattern: what recurs, and when?</tspan></text><rect x="120" y="246" width="480" height="66" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="360.0" y="285.0" text-anchor="middle" font-size="16"><tspan x="360.0" dy="0">Structure: what arrangements could produce it?</tspan></text><rect x="140" y="334" width="440" height="66" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="360.0" y="373.0" text-anchor="middle" font-size="16"><tspan x="360.0" dy="0">Assumptions: what keeps those arrangements?</tspan></text><text x="360" y="449" text-anchor="middle" font-size="16"><tspan x="360" dy="0">Depth is a question to investigate, not a guarantee of truth.</tspan></text></svg>
