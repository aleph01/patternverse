<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="connection-circles-title connection-circles-desc">
<title id="connection-circles-title">A proposed path must return</title><desc id="connection-circles-desc">More experienced volunteers may improve repair success, which may support recommendations and recruitment. Every return link needs evidence.</desc>
<style>:root{--paper:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="connection-circles-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="39" text-anchor="middle" font-size="19"><tspan x="360" dy="0">Close the path, then inspect each mechanism</tspan></text><rect x="240" y="67" width="240" height="65" rx="5" fill="var(--highlight)" fill-opacity="1" stroke="var(--ink)" stroke-width="1.5"/><text x="360.0" y="105.5" text-anchor="middle" font-size="16"><tspan x="360.0" dy="0">Experienced volunteers</tspan></text><rect x="470" y="210" width="220" height="75" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="580.0" y="253.5" text-anchor="middle" font-size="16"><tspan x="580.0" dy="0">Successful repairs</tspan></text><rect x="30" y="210" width="220" height="75" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="140.0" y="253.5" text-anchor="middle" font-size="16"><tspan x="140.0" dy="0">New volunteers</tspan></text><rect x="240" y="350" width="240" height="65" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="360.0" y="388.5" text-anchor="middle" font-size="16"><tspan x="360.0" dy="0">Recommendations</tspan></text><path d="M480 105 L568 200" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#connection-circles-arrow)"/><path d="M580 285 L470 340" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#connection-circles-arrow)"/><path d="M240 380 L145 295" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#connection-circles-arrow)"/><path d="M140 210 L240 115" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#connection-circles-arrow)"/><text x="360" y="238" text-anchor="middle" font-size="16"><tspan x="360" dy="0">Hypotheses, not proof</tspan></text><text x="360" y="450" text-anchor="middle" font-size="16"><tspan x="360" dy="0">Capacity and competing feedback may change the pattern.</tspan></text></svg>
