<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="ladder-of-inference-title ladder-of-inference-desc">
<title id="ladder-of-inference-title">Expose the steps in an interpretation</title><desc id="ladder-of-inference-desc">Observed information is selected, interpreted, and connected to a conclusion and action. Beliefs also shape what receives attention next.</desc>
<style>:root{--paper:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="ladder-of-inference-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="38" text-anchor="middle" font-size="19"><tspan x="360" dy="0">An action rests on a chain you can examine</tspan></text><rect x="70" y="355" width="350" height="54" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="245.0" y="388.0" text-anchor="middle" font-size="16"><tspan x="245.0" dy="0">Observations available</tspan></text><rect x="115" y="284" width="350" height="54" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="290.0" y="317.0" text-anchor="middle" font-size="16"><tspan x="290.0" dy="0">Observations selected</tspan></text><rect x="160" y="213" width="350" height="54" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="335.0" y="246.0" text-anchor="middle" font-size="16"><tspan x="335.0" dy="0">Meaning and assumptions</tspan></text><rect x="205" y="142" width="350" height="54" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="380.0" y="175.0" text-anchor="middle" font-size="16"><tspan x="380.0" dy="0">Conclusion</tspan></text><rect x="250" y="71" width="350" height="54" rx="5" fill="var(--highlight)" fill-opacity="1" stroke="var(--ink)" stroke-width="1.5"/><text x="425.0" y="104.0" text-anchor="middle" font-size="16"><tspan x="425.0" dy="0">Action</tspan></text><path d="M255 354 L270 345" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#ladder-of-inference-arrow)"/><path d="M300 283 L315 274" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#ladder-of-inference-arrow)"/><path d="M345 212 L360 203" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#ladder-of-inference-arrow)"/><path d="M390 141 L405 132" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#ladder-of-inference-arrow)"/><path d="M620 98 H665 V382 H435" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ladder-of-inference-arrow)"/><text x="595" y="433" text-anchor="middle" font-size="14"><tspan x="595" dy="0">Attention feeds back</tspan></text></svg>
