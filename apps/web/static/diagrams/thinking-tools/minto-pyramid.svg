<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="minto-pyramid-title minto-pyramid-desc">
<title id="minto-pyramid-title">An answer with inspectable support</title><desc id="minto-pyramid-desc">One answer is supported by two distinct reasons. Evidence supports each reason; weak joins require revision.</desc>
<style>:root{--paper:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="minto-pyramid-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="39" text-anchor="middle" font-size="19"><tspan x="360" dy="0">Read down for support; read up for justification</tspan></text><rect x="225" y="65" width="270" height="65" rx="5" fill="var(--highlight)" fill-opacity="1" stroke="var(--ink)" stroke-width="1.5"/><text x="360.0" y="103.5" text-anchor="middle" font-size="16"><tspan x="360.0" dy="0">Answer, with qualifications</tspan></text><rect x="58" y="205" width="262" height="70" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="189.0" y="246.0" text-anchor="middle" font-size="16"><tspan x="189.0" dy="0">Reason 1: a supporting claim</tspan></text><rect x="400" y="205" width="262" height="70" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="531.0" y="246.0" text-anchor="middle" font-size="16"><tspan x="531.0" dy="0">Reason 2: a distinct claim</tspan></text><rect x="58" y="345" width="262" height="65" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="189.0" y="383.5" text-anchor="middle" font-size="16"><tspan x="189.0" dy="0">Evidence and its limits</tspan></text><rect x="400" y="345" width="262" height="65" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="531.0" y="383.5" text-anchor="middle" font-size="16"><tspan x="531.0" dy="0">Evidence and its limits</tspan></text><path d="M290 130 L189 195" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#minto-pyramid-arrow)"/><path d="M430 130 L531 195" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#minto-pyramid-arrow)"/><path d="M189 275 V335" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#minto-pyramid-arrow)"/><path d="M531 275 V335" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#minto-pyramid-arrow)"/><text x="360" y="450" text-anchor="middle" font-size="16"><tspan x="360" dy="0">Structure exposes missing evidence; it cannot supply it.</tspan></text></svg>
