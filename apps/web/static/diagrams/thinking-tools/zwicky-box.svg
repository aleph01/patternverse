<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="zwicky-box-title zwicky-box-desc">
<title id="zwicky-box-title">Recombine dimensions</title><desc id="zwicky-box-desc">Three dimensions each offer two alternatives. A candidate selects one from each, then checks compatibility and requirements.</desc>
