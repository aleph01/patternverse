<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="ishikawa-diagram-title ishikawa-diagram-desc">
<title id="ishikawa-diagram-title">A cause inventory is not a causal verdict</title><desc id="ishikawa-diagram-desc">Possible contributors from materials, methods, measurement, and environment point toward an observed effect. Investigate the links rather than accepting the layout as proof.</desc>
<style>:root{--paper:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="ishikawa-diagram-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="38" text-anchor="middle" font-size="19"><tspan x="360" dy="0">Organize hypotheses around a specific effect</tspan></text><path d="M50 230 H485" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#ishikawa-diagram-arrow)"/><rect x="500" y="190" width="185" height="80" rx="5" fill="var(--highlight)" fill-opacity="1" stroke="var(--ink)" stroke-width="1.5"/><text x="592.5" y="225.0" text-anchor="middle" font-size="16"><tspan x="592.5" dy="0">Cracked pottery</tspan><tspan x="592.5" dy="23">on a lower shelf</tspan></text><path d="M145 118 L240 220" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#ishikawa-diagram-arrow)"/><path d="M340 118 L415 220" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#ishikawa-diagram-arrow)"/><path d="M145 345 L240 240" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#ishikawa-diagram-arrow)"/><path d="M340 345 L415 240" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#ishikawa-diagram-arrow)"/><text x="132" y="91" text-anchor="middle" font-size="16"><tspan x="132" dy="0">Materials</tspan></text><text x="340" y="91" text-anchor="middle" font-size="16"><tspan x="340" dy="0">Methods</tspan></text><text x="130" y="380" text-anchor="middle" font-size="16"><tspan x="130" dy="0">Measurement</tspan></text><text x="340" y="380" text-anchor="middle" font-size="16"><tspan x="340" dy="0">Environment</tspan></text><text x="360" y="440" text-anchor="middle" font-size="16"><tspan x="360" dy="0">Add mechanisms, evidence, and competing explanations.</tspan></text></svg>
