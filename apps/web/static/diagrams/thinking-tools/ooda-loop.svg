<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="ooda-loop-title ooda-loop-desc">
<title id="ooda-loop-title">Orientation changes the loop</title><desc id="ooda-loop-desc">Observation informs orientation. Decisions and actions produce feedback that can revise orientation as well as the next action.</desc>
<style>:root{--paper:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="ooda-loop-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="38" text-anchor="middle" font-size="20"><tspan x="360" dy="0">Adapt the understanding that guides action</tspan></text><rect x="35" y="80" width="185" height="75" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="127.5" y="123.5" text-anchor="middle" font-size="16"><tspan x="127.5" dy="0">Observe</tspan></text><rect x="267" y="178" width="190" height="96" rx="5" fill="var(--highlight)" fill-opacity="1" stroke="var(--ink)" stroke-width="1.5"/><text x="362.0" y="221.0" text-anchor="middle" font-size="16"><tspan x="362.0" dy="0">Orient:</tspan><tspan x="362.0" dy="23">working interpretation</tspan></text><rect x="500" y="80" width="185" height="75" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="592.5" y="123.5" text-anchor="middle" font-size="16"><tspan x="592.5" dy="0">Decide</tspan></text><rect x="500" y="333" width="185" height="75" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="592.5" y="376.5" text-anchor="middle" font-size="16"><tspan x="592.5" dy="0">Act</tspan></text><path d="M220 118 L285 168" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#ooda-loop-arrow)"/><path d="M457 205 L530 165" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#ooda-loop-arrow)"/><path d="M593 155 V323" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#ooda-loop-arrow)"/><path d="M500 367 L375 284" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#ooda-loop-arrow)"/><path d="M500 390 H126 V165" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#ooda-loop-arrow)"/><text x="263" y="371" text-anchor="middle" font-size="15"><tspan x="263" dy="0">Feedback</tspan></text><text x="360" y="448" text-anchor="middle" font-size="16"><tspan x="360" dy="0">A later observation can change the frame, not only the tactic.</tspan></text></svg>
