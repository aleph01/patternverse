<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="feedback-loops-title feedback-loops-desc">
<title id="feedback-loops-title">Correction and amplification</title><desc id="feedback-loops-desc">A balancing loop counteracts a change; a reinforcing loop amplifies it. Both can contain delays and operate alongside other loops.</desc>
<style>:root{--paper:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="feedback-loops-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="38" text-anchor="middle" font-size="20"><tspan x="360" dy="0">A closed path changes its starting condition</tspan></text><rect x="45" y="80" width="280" height="75" rx="5" fill="var(--highlight)" fill-opacity="1" stroke="var(--ink)" stroke-width="1.5"/><text x="185.0" y="123.5" text-anchor="middle" font-size="16"><tspan x="185.0" dy="0">Balancing: a gap increases</tspan></text><rect x="45" y="250" width="280" height="75" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="185.0" y="293.5" text-anchor="middle" font-size="16"><tspan x="185.0" dy="0">Correction reduces the gap</tspan></text><rect x="395" y="80" width="280" height="75" rx="5" fill="var(--highlight)" fill-opacity="1" stroke="var(--ink)" stroke-width="1.5"/><text x="535.0" y="123.5" text-anchor="middle" font-size="16"><tspan x="535.0" dy="0">Reinforcing: participation rises</tspan></text><rect x="395" y="250" width="280" height="75" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="535.0" y="293.5" text-anchor="middle" font-size="16"><tspan x="535.0" dy="0">Useful capacity grows</tspan></text><path d="M270 155 V240" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#feedback-loops-arrow)"/><path d="M100 250 V165" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#feedback-loops-arrow)"/><path d="M620 155 V240" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#feedback-loops-arrow)"/><path d="M450 250 V165" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#feedback-loops-arrow)"/><text x="185" y="205" text-anchor="middle" font-size="14"><tspan x="185" dy="0">Response / delay</tspan></text><text x="535" y="205" text-anchor="middle" font-size="14"><tspan x="535" dy="0">Return / delay</tspan></text><text x="185" y="374" text-anchor="middle" font-size="16"><tspan x="185" dy="0">May resist or overshoot</tspan></text><text x="535" y="374" text-anchor="middle" font-size="16"><tspan x="535" dy="0">May grow or decline</tspan></text><text x="360" y="435" text-anchor="middle" font-size="16"><tspan x="360" dy="0">Evidence, capacity limits, and competing loops still matter.</tspan></text></svg>
