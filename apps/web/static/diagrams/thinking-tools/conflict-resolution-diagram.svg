<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="conflict-resolution-diagram-title conflict-resolution-diagram-desc">
<title id="conflict-resolution-diagram-title">Examine the connections</title><desc id="conflict-resolution-diagram-desc">A shared objective connects to two needs, each linked to a proposal. Test the assumptions on those connections before treating proposals as necessary.</desc>
<style>:root{--paper:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="conflict-resolution-diagram-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="40" text-anchor="middle" font-size="20"><tspan x="360" dy="0">Keep needs distinct from proposals</tspan></text><rect x="32" y="181" width="166" height="90" rx="5" fill="var(--highlight)" fill-opacity="1" stroke="var(--ink)" stroke-width="1.5"/><text x="115.0" y="221.0" text-anchor="middle" font-size="16"><tspan x="115.0" dy="0">Shared</tspan><tspan x="115.0" dy="23">objective</tspan></text><rect x="280" y="80" width="166" height="90" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="363.0" y="131.0" text-anchor="middle" font-size="16"><tspan x="363.0" dy="0">Need A</tspan></text><rect x="280" y="290" width="166" height="90" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="363.0" y="341.0" text-anchor="middle" font-size="16"><tspan x="363.0" dy="0">Need B</tspan></text><rect x="518" y="80" width="166" height="90" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="601.0" y="131.0" text-anchor="middle" font-size="16"><tspan x="601.0" dy="0">Proposal A</tspan></text><rect x="518" y="290" width="166" height="90" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="601.0" y="341.0" text-anchor="middle" font-size="16"><tspan x="601.0" dy="0">Proposal B</tspan></text><path d="M198 210 L270 125" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#conflict-resolution-diagram-arrow)"/><path d="M198 242 L270 335" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#conflict-resolution-diagram-arrow)"/><path d="M446 125 H508" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#conflict-resolution-diagram-arrow)"/><path d="M446 335 H508" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#conflict-resolution-diagram-arrow)"/><path d="M601 180 V280" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#conflict-resolution-diagram-arrow)"/><text x="570" y="229" text-anchor="middle" font-size="14"><tspan x="570" dy="0">Conflict</tspan></text><text x="360" y="430" text-anchor="middle" font-size="16"><tspan x="360" dy="0">Which assumption makes each connection necessary?</tspan></text></svg>
