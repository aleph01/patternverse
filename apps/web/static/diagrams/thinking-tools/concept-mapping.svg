<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="concept-mapping-title concept-mapping-desc">
<title id="concept-mapping-title">Links form propositions</title><desc id="concept-mapping-desc">Condensation produces liquid water. Nearby air cooling can enable condensation. Read each labeled connection as a statement, then check it.</desc>
<style>:root{--paper:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="concept-mapping-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="40" text-anchor="middle" font-size="19"><tspan x="360" dy="0">A meaningful link does more than associate words</tspan></text><rect x="50" y="110" width="180" height="75" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="140.0" y="153.5" text-anchor="middle" font-size="16"><tspan x="140.0" dy="0">Nearby air cools</tspan></text><rect x="490" y="110" width="180" height="75" rx="5" fill="var(--highlight)" fill-opacity="1" stroke="var(--ink)" stroke-width="1.5"/><text x="580.0" y="153.5" text-anchor="middle" font-size="16"><tspan x="580.0" dy="0">Condensation</tspan></text><rect x="490" y="330" width="180" height="75" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="580.0" y="373.5" text-anchor="middle" font-size="16"><tspan x="580.0" dy="0">Liquid water</tspan></text><path d="M230 148 H480" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#concept-mapping-arrow)"/><text x="355" y="128" text-anchor="middle" font-size="15"><tspan x="355" dy="0">can enable</tspan></text><path d="M580 185 V320" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#concept-mapping-arrow)"/><text x="630" y="255" text-anchor="middle" font-size="15"><tspan x="630" dy="0">produces</tspan></text><text x="285" y="343" text-anchor="middle" font-size="16"><tspan x="285" dy="0">Focus question:</tspan></text><text x="265" y="374" text-anchor="middle" font-size="16"><tspan x="265" dy="0">Why is the window wet?</tspan></text><text x="360" y="450" text-anchor="middle" font-size="16"><tspan x="360" dy="0">Verify the proposition and the conditions under which it holds.</tspan></text></svg>
