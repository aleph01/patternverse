<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="decision-matrix-title decision-matrix-desc">
<title id="decision-matrix-title">A result depends on the weights</title><desc id="decision-matrix-desc">The choir software example scores A at 34 and B at 32. Raising the second criterion weight from four to five produces a 37–37 tie.</desc>
<style>:root{--paper:#fff;--ink:#181814;--line:#007a4d;--highlight:#dff8ea;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--line:#05ce78;--highlight:#163b2b}}</style>
<defs><marker id="decision-matrix-arrow" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M 1 1 L 7 5 L 1 9" fill="none" stroke="var(--line)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="39" text-anchor="middle" font-size="18"><tspan x="360" dy="0">Test whether the preference survives plausible change</tspan></text><rect x="45" y="80" width="280" height="65" rx="5" fill="var(--highlight)" fill-opacity="1" stroke="var(--ink)" stroke-width="1.5"/><text x="185.0" y="118.5" text-anchor="middle" font-size="16"><tspan x="185.0" dy="0">Original weights: 3, 4, 2</tspan></text><rect x="395" y="80" width="280" height="65" rx="5" fill="var(--highlight)" fill-opacity="1" stroke="var(--ink)" stroke-width="1.5"/><text x="535.0" y="118.5" text-anchor="middle" font-size="16"><tspan x="535.0" dy="0">Revised weights: 3, 5, 2</tspan></text><rect x="45" y="205" width="280" height="80" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="185.0" y="240.0" text-anchor="middle" font-size="16"><tspan x="185.0" dy="0">A = 34</tspan><tspan x="185.0" dy="23">B = 32</tspan></text><rect x="395" y="205" width="280" height="80" rx="5" fill="var(--highlight)" fill-opacity="0.28" stroke="var(--ink)" stroke-width="1.5"/><text x="535.0" y="240.0" text-anchor="middle" font-size="16"><tspan x="535.0" dy="0">A = 37</tspan><tspan x="535.0" dy="23">B = 37</tspan></text><path d="M185 145 V195" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#decision-matrix-arrow)"/><path d="M535 145 V195" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#decision-matrix-arrow)"/><text x="185" y="343" text-anchor="middle" font-size="16"><tspan x="185" dy="0">Conditional preference for A</tspan></text><text x="535" y="343" text-anchor="middle" font-size="16"><tspan x="535" dy="0">Tie under another weighting</tspan></text><text x="360" y="426" text-anchor="middle" font-size="16"><tspan x="360" dy="0">Scores expose judgments; totals do not decide for you.</tspan></text></svg>
