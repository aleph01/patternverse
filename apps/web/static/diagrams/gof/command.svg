<svg xmlns="http://www.w3.org/2000/svg" width="720" height="426" viewBox="0 0 720 426" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Represent the action before choosing when to run it</title><desc id="desc">A menu or shortcut constructs a DeleteRange command. The invoker executes it against Document and stores the command in history. Undo is later requested through the command, whose saved state supports restoration under the stated no-intervening-edit assumption.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="426" fill="#fff"/><text x="24" y="32" font-size="24" text-anchor="start" fill="#252c28">An action with an explicit lifetime</text><rect x="28" y="82" width="192" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="113" font-size="20" text-anchor="start" fill="#252c28">Invoker</text><text x="44" y="138" font-size="17" text-anchor="start" fill="#626962">Menu or shortcut</text><rect x="264" y="82" width="192" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="280" y="113" font-size="20" text-anchor="start" fill="#252c28">DeleteRange</text><text x="280" y="138" font-size="17" text-anchor="start" fill="#626962">Request + undo data</text><rect x="500" y="82" width="192" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="516" y="113" font-size="20" text-anchor="start" fill="#252c28">Document</text><text x="516" y="138" font-size="17" text-anchor="start" fill="#626962">Receiver</text><path d="M220 124H262" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M456 124H498" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="264" y="278" width="192" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="280" y="309" font-size="20" text-anchor="start" fill="#252c28">History</text><text x="280" y="334" font-size="17" text-anchor="start" fill="#626962">Store command</text><path d="M360 166V276" fill="none" stroke="#a6aca3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="378" y="225" font-size="17" text-anchor="start" fill="#252c28">retain for undo</text></svg>
