<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="template-method-title template-method-desc"><title id="template-method-title">Template Method collaboration</title><desc id="template-method-desc">The base importer owns step order. A format-specific override supplies reading while shared validation and cleanup stay in the workflow.</desc><style>:root{--diagram-paper:#fff;--diagram-surface:#fff;--diagram-ink:#181814;--diagram-line:#007a4d;--diagram-border:#181814;--diagram-highlight:#dff8ea;color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--diagram-paper:#181814;--diagram-surface:#242420;--diagram-ink:#fff;--diagram-line:#05ce78;--diagram-border:#b8bbb8;--diagram-highlight:#163b2b}}</style><defs><marker id="template-method-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--diagram-line)"/></marker></defs><rect width="720" height="470" rx="16" fill="var(--diagram-paper)"/><path d="M 208.0 95.0 L 272.0 95.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#template-method-arrow)"/><path d="M 448.0 95.0 L 512.0 95.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#template-method-arrow)"/><path d="M 360.0 287.0 L 360.0 128.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#template-method-arrow)"/><path d="M 600.0 128.0 L 600.0 287.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#template-method-arrow)"/><rect x="32.0" y="62.0" width="176" height="66" rx="11" fill="var(--diagram-highlight)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="120" y="100" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="120" dy="0">Open source</tspan></text><rect x="272.0" y="62.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="360" y="100" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="360" dy="0">Read records: hook</tspan></text><rect x="512.0" y="62.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="600" y="100" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="600" dy="0">Validate + write</tspan></text><rect x="272.0" y="287.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="360" y="325" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="360" dy="0">CSV / JSON lines</tspan></text><rect x="512.0" y="287.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="600" y="325" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="600" dy="0">Always close</tspan></text><text x="240.0" y="49.0" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">then</text><text x="480.0" y="49.0" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">then</text><text x="372.0" y="207.5" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">overrides</text><text x="612.0" y="207.5" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">finally</text></svg>
