<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="interpreter-title interpreter-desc"><title id="interpreter-title">Interpreter collaboration</title><desc id="interpreter-desc">Compound expressions recursively evaluate terminal expressions against a deliberate task context.</desc><style>:root{--diagram-paper:#fff;--diagram-surface:#fff;--diagram-ink:#181814;--diagram-line:#007a4d;--diagram-border:#181814;--diagram-highlight:#dff8ea;color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--diagram-paper:#181814;--diagram-surface:#242420;--diagram-ink:#fff;--diagram-line:#05ce78;--diagram-border:#b8bbb8;--diagram-highlight:#163b2b}}</style><defs><marker id="interpreter-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--diagram-line)"/></marker></defs><rect width="720" height="470" rx="16" fill="var(--diagram-paper)"/><path d="M 313.8 98.0 L 196.2 182.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#interpreter-arrow)"/><path d="M 406.2 98.0 L 523.8 182.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#interpreter-arrow)"/><path d="M 570.0 248.0 L 570.0 332.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#interpreter-arrow)"/><path d="M 150.0 248.0 L 150.0 332.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#interpreter-arrow)"/><path d="M 482.0 365.0 L 238.0 365.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#interpreter-arrow)"/><rect x="272.0" y="32.0" width="176" height="66" rx="11" fill="var(--diagram-highlight)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="360" y="70" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="360" dy="0">AND expression</tspan></text><rect x="62.0" y="182.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="150" y="220" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="150" dy="0">Is unfinished</tspan></text><rect x="482.0" y="182.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="570" y="220" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="570" dy="0">NOT expression</tspan></text><rect x="482.0" y="332.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="570" y="370" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="570" dy="0">Is blocked</tspan></text><rect x="62.0" y="332.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="150" y="370" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="150" dy="0">Task context</tspan></text><text x="255.0" y="128.0" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">left operand</text><text x="465.0" y="128.0" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">right operand</text><text x="582.0" y="290.0" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">operand</text><text x="162.0" y="290.0" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">reads</text><text x="360.0" y="319.0" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">reads</text></svg>
