<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="adapter-title adapter-desc"><title id="adapter-title">Adapter collaboration</title><desc id="adapter-desc">The application uses its mail contract; the adapter translates payloads and results at the provider boundary.</desc><style>:root{--diagram-paper:#fff;--diagram-surface:#fff;--diagram-ink:#181814;--diagram-line:#007a4d;--diagram-border:#181814;--diagram-highlight:#dff8ea;color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--diagram-paper:#181814;--diagram-surface:#242420;--diagram-ink:#fff;--diagram-line:#05ce78;--diagram-border:#b8bbb8;--diagram-highlight:#163b2b}}</style><defs><marker id="adapter-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--diagram-line)"/></marker></defs><rect width="720" height="470" rx="16" fill="var(--diagram-paper)"/><path d="M 208.0 150.0 L 272.0 150.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#adapter-arrow)"/><path d="M 448.0 150.0 L 512.0 150.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#adapter-arrow)"/><path d="M 600.0 183.0 L 600.0 307.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#adapter-arrow)"/><path d="M 512.0 340.0 L 208.0 340.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#adapter-arrow)"/><rect x="32.0" y="117.0" width="176" height="66" rx="11" fill="var(--diagram-highlight)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="120" y="155" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="120" dy="0">Application caller</tspan></text><rect x="272.0" y="117.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x=