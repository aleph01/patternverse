<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">The current state decides the valid transition</title><desc id="desc">Idle accepts start and transitions to Transferring. Transferring accepts pause and transitions to Paused. Paused accepts resume and returns to Transferring. Resume is invalid while Idle. This is only a subset of the full upload lifecycle.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="420" fill="#fff"/><text x="24" y="32" font-size="24" text-anchor="start" fill="#252c28">Behavior follows lifecycle state</text><rect x="28" y="82" width="192" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="113" font-size="20" text-anchor="start" fill="#252c28">Idle</text><text x="44" y="138" font-size="17" text-anchor="start" fill="#626962">start allowed</text><rect x="264" y="82" width="192" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="280" y="113" font-size="20" text-anchor="start" fill="#252c28">Transferring</text><text x="280" y="138" font-size="17" text-anchor="start" fill="#626962">pause allowed</text><rect x="500" y="82" width="192" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="516" y="113" font-size="20" text-anchor="start" fill="#252c28">Paused</text><text x="516" y="138" font-size="17" text-anchor="start" fill="#626962">resume allowed</text><path d="M220 124H262" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="242" y="102" font-size="16" text-anchor="middle" fill="#252c28">start</text><path d="M456 124H498" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="478" y="102" font-size="16" text-anchor="middle" fill="#252c28">pause</text><path d="M596 166V240H360V168" fill="none" stroke="#a6aca3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="478" y="265" font-size="18" text-anchor="middle" fill="#252c28">resume</text><text x="24" y="370" font-size="18" text-anchor="start" fill="#252c28">The same request can be valid in one state and invalid in another.</text></svg>
