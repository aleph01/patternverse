<svg xmlns="http://www.w3.org/2000/svg" width="720" height="468" viewBox="0 0 720 468" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Put collaboration rules in one local coordinator</title><desc id="desc">Server and credential fields report changes to ConnectionDialog. The dialog combines both values and sets the test button availability. The fields do not hold references to the button or each other.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="468" fill="#fff"/><text x="24" y="32" font-size="24" text-anchor="start" fill="#252c28">Coordinate the combined state</text><rect x="28" y="80" width="260" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="111" font-size="20" text-anchor="start" fill="#252c28">Server field</text><text x="44" y="136" font-size="17" text-anchor="start" fill="#626962">Report changes</text><rect x="432" y="80" width="260" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="448" y="111" font-size="20" text-anchor="start" fill="#252c28">Credential</text><text x="448" y="136" font-size="17" text-anchor="start" fill="#626962">Report changes</text><path d="M158 164V200H360V238" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M562 164V200H360V238" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="230" y="240" width="260" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="246" y="271" font-size="20" text-anchor="start" fill="#252c28">ConnectionDialog</text><text x="246" y="296" font-size="17" text-anchor="start" fill="#626962">Evaluate combined rule</text><path d="M360 324V378" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="230" y="380" width="260" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="246" y="411" font-size="20" text-anchor="start" fill="#252c28">Test button</text><text x="246" y="436" font-size="17" text-anchor="start" fill="#626962">Enable or disable</text></svg>
