<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="mediator-title mediator-desc"><title id="mediator-title">Mediator collaboration</title><desc id="mediator-desc">Participants report events to one scoped mediator, which owns the collaboration rules and updates other participants.</desc><style>:root{--diagram-paper:#fff;--diagram-surface:#fff;--diagram-ink:#181814;--diagram-line:#007a4d;--diagram-border:#181814;--diagram-highlight:#dff8ea;color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--diagram-paper:#181814;--diagram-surface:#242420;--diagram-ink:#fff;--diagram-line:#05ce78;--diagram-border:#b8bbb8;--diagram-highlight:#163b2b}}</style><defs><marker id="mediator-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--diagram-line)"/></marker></defs><rect width="720" height="470" rx="16" fill="var(--diagram-paper)"/><path d="M 208.0 90.0 L 272.0 90.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#mediator-arrow)"/><path d="M 512.0 90.0 L 448.0 90.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#mediator-arrow)"/><path d="M 343.1489361702128 123.0 L 256.8510638297872 292.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#mediator-arrow)"/><path d="M 376.8510638297872 123.0 L 463.1489361702128 292.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#mediator-arrow)"/><rect x="32.0" y="57.0" width="176" height="66" rx="11" fill="var(--diagram-highlight)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="120" y="95" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="120" dy="0">Server selector</tspan></text><rect x="272.0" y="57.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" str