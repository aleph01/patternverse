<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="visitor-title visitor-desc"><title id="visitor-title">Visitor collaboration</title><desc id="visitor-desc">An element accepts the selected operation and dispatches to its type-specific visitor method. The visitor owns the operation.</desc><style>:root{--diagram-paper:#fff;--diagram-surface:#fff;--diagram-ink:#181814;--diagram-line:#007a4d;--diagram-border:#181814;--diagram-highlight:#dff8ea;color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--diagram-paper:#181814;--diagram-surface:#242420;--diagram-ink:#fff;--diagram-line:#05ce78;--diagram-border:#b8bbb8;--diagram-highlight:#163b2b}}</style><defs><marker id="visitor-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--diagram-line)"/></marker></defs><rect width="720" height="470" rx="16" fill="var(--diagram-paper)"/><path d="M 208.0 100.0 L 272.0 100.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#visitor-arrow)"/><path d="M 448.0 100.0 L 512.0 100.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#visitor-arrow)"/><path d="M 497.6 292.0 L 582.4 133.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#visitor-arrow)"/><path d="M 292.8 292.0 L 547.2 133.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#visitor-arrow)"/><rect x="32.0" y="67.0" width="176" height="66" rx="11" fill="var(--diagram-highlight)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="120" y="105" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="120" dy="0">Addition element</tspan></text><rect x="272.0" y="67.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="360" y="105" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="360" dy="0">accept(visitor)</tspan></text><rect x="512.0" y="67.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="600" y="105" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="600" dy="0">visit_addition(node)</tspan></text><rect x="392.0" y="292.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="480" y="330" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="480" dy="0">Formatting visitor</tspan></text><rect x="152.0" y="292.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="240" y="330" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="240" dy="0">Dependency visitor</tspan></text><text x="240.0" y="54.0" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">element dispatch</text><text x="480.0" y="54.0" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">type-specific call</text><text x="552.0" y="212.5" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">operation variant</text><text x="420.0" y="200.5" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">operation variant</text></svg>
