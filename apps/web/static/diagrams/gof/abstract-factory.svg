<svg xmlns="http://www.w3.org/2000/svg" width="720" height="438" viewBox="0 0 720 438" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Choose a family, then create compatible products</title><desc id="desc">The application chooses BrowserWidgets. Its create_button and create_menu operations supply a browser button and browser menu. NativeWidgets is an unused alternative family, not an independently mixed product source.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="438" fill="#fff"/><text x="24" y="32" font-size="24" text-anchor="start" fill="#252c28">One coherent family choice</text><rect x="230" y="76" width="260" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="246" y="107" font-size="20" text-anchor="start" fill="#252c28">BrowserWidgets</text><text x="246" y="132" font-size="17" text-anchor="start" fill="#626962">Selected family</text><path d="M360 160V190H170V220" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M360 190H550V220" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="40" y="222" width="260" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="56" y="253" font-size="20" text-anchor="start" fill="#252c28">Button</text><text x="56" y="278" font-size="17" text-anchor="start" fill="#626962">Browser</text><rect x="420" y="222" width="260" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="436" y="253" font-size="20" text-anchor="start" fill="#252c28">Menu</text><text x="436" y="278" font-size="17" text-anchor="start" fill="#626962">Browser</text><rect x="230" y="330" width="260" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 4"/><text x="246" y="361" font-size="20" text-anchor="start" fill="#252c28">NativeWidgets</text><text x="246" y="386" font-size="17" text-anchor="start" fill="#626962">Unused alternative</text></svg>
