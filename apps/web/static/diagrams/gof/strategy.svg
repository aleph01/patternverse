<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc" data-style="light-editorial">
<title id="title">Select the strategy before calling it</title><desc id="desc">First, the customer option express is mapped to an express pricing strategy at the application boundary. Then checkout calls the selected express strategy with a shipment and receives a quote. Standard pricing remains an unused alternative and is not called.</desc>
<style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}path,rect{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs>
<rect width="720" height="470" fill="#fff"/>
<text x="24" y="36" font-size="23" text-anchor="start" fill="#252c28">1  Select at the application boundary</text><rect x="24" y="62" width="236" height="70" fill="#fff" stroke="#a6aca3" stroke-width="1.2" /><text x="44" y="91" font-size="18" text-anchor="start" fill="#626962">Customer option</text><text x="44" y="118" font-size="21" text-anchor="start" fill="#252c28">Express</text><path d="M260 97H432" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="346" y="81" font-size="18" text-anchor="middle" fill="#252c28">Select</text><rect x="434" y="62" width="262" height="70" fill="#edf5f0" stroke="#00855b" stroke-width="1.2" /><text x="454" y="91" font-size="20" text-anchor="start" fill="#252c28">Supply express pricing</text><text x="454" y="118" font-size="18" text-anchor="start" fill="#626962">For this checkout</text><path d="M24 168H696" fill="none" stroke="#a6aca3" stroke-width="1.5"/><text x="24" y="211" font-size="23" text-anchor="start" fill="#252c28">2  Call during checkout</text><rect x="24" y="258" width="236" height="76" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2" /><text x="142" y="303" font-size="21" text-anchor="middle" fill="#252c28">Checkout workflow</text><path d="M260 280H432" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="346" y="265" font-size="18" text-anchor="middle" fill="#252c28">Shipment</text><path d="M434 319H262" fill="none" stroke="#a6aca3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="346" y="343" font-size="18" text-anchor="middle" fill="#252c28">Quote</text><rect x="434" y="258" width="262" height="76" fill="#edf5f0" stroke="#00855b" stroke-width="1.2" /><text x="454" y="290" font-size="21" text-anchor="start" fill="#252c28">Express pricing</text><text x="454" y="316" font-size="18" text-anchor="start" fill="#626962">Selected strategy</text><rect x="434" y="366" width="262" height="68" fill="#fff" stroke="#a6aca3" stroke-width="1.2" stroke-dasharray="5 4"/><text x="454" y="395" font-size="20" text-anchor="start" fill="#626962">Standard pricing</text><text x="454" y="420" font-size="18" text-anchor="start" fill="#626962">Alternative; not called</text><text x="24" y="454" font-size="18" text-anchor="start" fill="#252c28">The contract defines the call. Application code chooses the implementation.</text>
</svg>
