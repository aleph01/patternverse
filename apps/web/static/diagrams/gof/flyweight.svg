<svg xmlns="http://www.w3.org/2000/svg" width="720" height="362" viewBox="0 0 720 362" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Share the common type; keep each position local</title><desc id="desc">Two logical tree values have different coordinates and point to the same immutable oak TreeType holding species and asset data. Changing a coordinate is not a change to the shared type.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="362" fill="#fff"/><text x="24" y="32" font-size="24" text-anchor="start" fill="#252c28">Many positions, one shared type</text><rect x="28" y="82" width="260" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="113" font-size="20" text-anchor="start" fill="#252c28">Tree A</text><text x="44" y="138" font-size="17" text-anchor="start" fill="#626962">x=10, y=20</text><rect x="432" y="82" width="260" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="448" y="113" font-size="20" text-anchor="start" fill="#252c28">Tree B</text><text x="448" y="138" font-size="17" text-anchor="start" fill="#626962">x=30, y=40</text><path d="M158 166V210H360V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M562 166V210H360V246" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><rect x="230" y="248" width="260" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="246" y="279" font-size="20" text-anchor="start" fill="#252c28">TreeType: oak</text><text x="246" y="304" font-size="17" text-anchor="start" fill="#626962">Shared species + asset</text></svg>
