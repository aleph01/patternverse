<svg xmlns="http://www.w3.org/2000/svg" width="720" height="396" viewBox="0 0 720 396" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Traversal position belongs to each iterator</title><desc id="desc">Two iterators read the same Root, First, Second traversal. Iterator A has already yielded Root and next yields First. Iterator B has not advanced and next yields Root. Their cursor states are independent.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="396" fill="#fff"/><text x="24" y="32" font-size="24" text-anchor="start" fill="#252c28">Independent traversal positions</text><rect x="100" y="80" width="520" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="116" y="111" font-size="20" text-anchor="start" fill="#252c28">Tree traversal</text><text x="116" y="136" font-size="17" text-anchor="start" fill="#626962">Root → First → Second</text><rect x="28" y="266" width="260" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="44" y="297" font-size="20" text-anchor="start" fill="#252c28">Iterator A</text><text x="44" y="322" font-size="17" text-anchor="start" fill="#626962">Next: First</text><rect x="432" y="266" width="260" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="448" y="297" font-size="20" text-anchor="start" fill="#252c28">Iterator B</text><text x="448" y="322" font-size="17" text-anchor="start" fill="#626962">Next: Root</text><path d="M158 266V166" fill="none" stroke="#a6aca3" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M562 266V166" fill="none" stroke="#a6aca3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="381" font-size="18" text-anchor="start" fill="#252c28">The client consumes values without knowing how the tree is stored.</text></svg>
