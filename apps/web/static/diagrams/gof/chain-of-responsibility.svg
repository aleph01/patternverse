<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="chain-of-responsibility-title chain-of-responsibility-desc"><title id="chain-of-responsibility-title">Chain of Responsibility collaboration</title><desc id="chain-of-responsibility-desc">A shortcut moves outward only when a candidate passes. Handling stops propagation; the application is a fallback.</desc><style>:root{--diagram-paper:#fff;--diagram-surface:#fff;--diagram-ink:#181814;--diagram-line:#007a4d;--diagram-border:#181814;--diagram-highlight:#dff8ea;color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--diagram-paper:#181814;--diagram-surface:#242420;--diagram-ink:#fff;--diagram-line:#05ce78;--diagram-border:#b8bbb8;--diagram-highlight:#163b2b}}</style><defs><marker id="chain-of-responsibility-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--diagram-line)"/></marker></defs><rect width="720" height="470" rx="16" fill="var(--diagram-paper)"/><path d="M 208.0 90.0 L 272.0 90.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#chain-of-responsibility-arrow)"/><path d="M 448.0 90.0 L 512.0 90.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#chain-of-responsibility-arrow)"/><path d="M 600.0 123.0 L 600.0 287.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#chain-of-responsibility-arrow)"/><path d="M 360.0 123.0 L 360.0 287.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#chain-of-responsibility-arrow)"/><rect x="32.0" y="57.0" width="176" height="66" rx="11" fill="var(--diagram-highlight)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="120" y="95" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="120" dy="0">Shortcut request</tspan></text><rect x="272.0" y="57.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="360" y="95" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="360" dy="0">Focused component</tspan></text><rect x="512.0" y="57.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="600" y="95" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="600" dy="0">Parent panel</tspan></text><rect x="512.0" y="287.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="600" y="325" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="600" dy="0">Application handler</tspan></text><rect x="272.0" y="287.0" width="176" height="66" rx="11" fill="var(--diagram-surface)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="360" y="325" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="360" dy="0">Handled: stop</tspan></text><text x="240.0" y="44.0" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">offer</text><text x="480.0" y="44.0" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">if passed</text><text x="612.0" y="205.0" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">if passed</text><text x="372.0" y="205.0" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="var(--diagram-ink)" stroke="var(--diagram-paper)" stroke-width="5" paint-order="stroke">if handled</text></svg>
