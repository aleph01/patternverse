<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc" data-style="light-editorial"><title id="title">Copy the editable state; share only deliberate values</title><desc id="desc">An original shape is cloned into a new shape with a new identity and an independent label list. Both point to the same immutable style. Updating duplicate labels leaves the original labels unchanged.</desc><style>:root{color-scheme:only light}svg{background:#fff}text{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-weight:400;letter-spacing:0}rect,path{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:butt}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#a6aca3" stroke-width="1.2"/></marker><marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L7 4L0 7" fill="none" stroke="#00855b" stroke-width="1.2"/></marker></defs><rect width="720" height="420" fill="#fff"/><text x="24" y="32" font-size="24" text-anchor="start" fill="#252c28">A copy with its own identity</text><rect x="28" y="84" width="270" height="84" fill="#f1f2ef" stroke="#a6aca3" stroke-width="1.2"/><text x="44" y="115" font-size="20" text-anchor="start" fill="#252c28">Original shape</text><text x="44" y="140" font-size="17" text-anchor="start" fill="#626962">ID A · own label list</text><rect x="422" y="84" width="270" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="438" y="115" font-size="20" text-anchor="start" fill="#252c28">Cloned shape</text><text x="438" y="140" font-size="17" text-anchor="start" fill="#626962">ID B · copied label list</text><path d="M298 126H420" fill="none" stroke="#00855b" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="360" y="109" font-size="18" text-anchor="middle" fill="#252c28">clone</text><rect x="230" y="270" width="260" height="84" fill="#edf5f0" stroke="#00855b" stroke-width="1.2"/><text x="246" y="301" font-size="20" text-anchor="start" fill="#252c28">Immutable style</text><text x="246" y="326" font-size="17" text-anchor="start" fill="#626962">Shared deliberately</text><path d="M163 168V234H270V268" fill="none" stroke="#a6aca3" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M557 168V234H450V268" fill="none" stroke="#a6aca3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="397" font-size="18" text-anchor="start" fill="#252c28">Cloning everything is not the same as defining a useful copy.</text></svg>
