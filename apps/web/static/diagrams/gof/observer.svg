<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="observer-title observer-desc"><title id="observer-title">Observer collaboration</title><desc id="observer-desc">The document publishes one coherent title change to independent subscribers. Their subscription lifetimes remain explicit.</desc><style>:root{--diagram-paper:#fff;--diagram-surface:#fff;--diagram-ink:#181814;--diagram-line:#007a4d;--diagram-border:#181814;--diagram-highlight:#dff8ea;color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--diagram-paper:#181814;--diagram-surface:#242420;--diagram-ink:#fff;--diagram-line:#05ce78;--diagram-border:#b8bbb8;--diagram-highlight:#163b2b}}</style><defs><marker id="observer-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--diagram-line)"/></marker></defs><rect width="720" height="470" rx="16" fill="var(--diagram-paper)"/><path d="M 360.0 98.0 L 360.0 182.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#observer-arrow)"/><path d="M 313.4117647058824 248.0 L 166.58823529411765 352.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#observer-arrow)"/><path d="M 360.0 248.0 L 360.0 352.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#observer-arrow)"/><path d="M 406.5882352941176 248.0 L 553.4117647058823 352.0" fill="none" stroke="var(--diagram-line)" stroke-width="2" marker-end="url(#observer-arrow)"/><rect x="272.0" y="32.0" width="176" height="66" rx="11" fill="var(--diagram-highlight)" stroke="var(--diagram-border)" stroke-width="1.5"/><text x="360" y="70" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="var(--diagram-ink)"><tspan x="360" dy="0">Document model</tspan></text><rect x="272.0" y="182.0" width="176" height="66" rx="11" fill="var(--diagram-sur