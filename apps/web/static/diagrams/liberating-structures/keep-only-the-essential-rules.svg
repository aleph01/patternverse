<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="keep-only-the-essential-rules-title keep-only-the-essential-rules-desc">
<title id="keep-only-the-essential-rules-title">Test what each requirement protects</title><desc id="keep-only-the-essential-rules-desc">An expansive rule list passes through a removal test. Keep necessary rules, propose removing others, and verify uncertain obligations.</desc>
<style>:root{--paper:#fff;--ink:#181814;--accent:#007a4d;--soft:#e8f4ed;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--accent:#05ce78;--soft:#163b2b}}</style>
<defs><marker id="tip" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="var(--accent)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="40" text-anchor="middle" font-size="19"><tspan x="360" dy="0">Test what each requirement protects</tspan></text><rect x="190" y="80" width="340" height="60" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="360.0" y="116.0" text-anchor="middle" font-size="17"><tspan x="360.0" dy="0">List current requirements</tspan></text><path d="M360 142 L360 180" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><rect x="140" y="187" width="440" height="70" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="360.0" y="216.0" text-anchor="middle" font-size="17"><tspan x="360.0" dy="0">Without this rule,</tspan><tspan x="360.0" dy="24">what would actually fail?</tspan></text><path d="M360 260 L130 308" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><path d="M360 260 L360 308" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><path d="M360 260 L590 308" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><rect x="35" y="315" width="190" height="65" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="130.0" y="353.5" text-anchor="middle" font-size="17"><tspan x="130.0" dy="0">Keep</tspan></text><rect x="265" y="315" width="190" height="65" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="360.0" y="341.5" text-anchor="middle" font-size="17"><tspan x="360.0" dy="0">Propose</tspan><tspan x="360.0" dy="24">removal</tspan></text><rect x="495" y="315" width="190" height="65" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="590.0" y="353.5" text-anchor="middle" font-size="17"><tspan x="590.0" dy="0">Verify</tspan></text><text x="360" y="430" text-anchor="middle" font-size="17"><tspan x="360" dy="0">Preserve obligations and check who depends on the rule.</tspan></text>
</svg>
