<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="separate-observation-meaning-and-action-title separate-observation-meaning-and-action-desc">
<title id="separate-observation-meaning-and-action-title">Keep the reasoning visible</title><desc id="separate-observation-meaning-and-action-desc">An observation, a possible interpretation, and a proposed action remain distinct: owner missing, role unclear, test an owner field.</desc>
<style>:root{--paper:#fff;--ink:#181814;--accent:#007a4d;--soft:#e8f4ed;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--accent:#05ce78;--soft:#163b2b}}</style>
<defs><marker id="tip" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="var(--accent)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="40" text-anchor="middle" font-size="19"><tspan x="360" dy="0">Keep the reasoning visible</tspan></text><rect x="35" y="155" width="180" height="110" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="125.0" y="204.0" text-anchor="middle" font-size="17"><tspan x="125.0" dy="0">What?</tspan><tspan x="125.0" dy="24">Owner missing</tspan></text><rect x="270" y="155" width="180" height="110" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="360.0" y="204.0" text-anchor="middle" font-size="17"><tspan x="360.0" dy="0">So what?</tspan><tspan x="360.0" dy="24">Role unclear?</tspan></text><rect x="505" y="155" width="180" height="110" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="595.0" y="204.0" text-anchor="middle" font-size="17"><tspan x="595.0" dy="0">Now what?</tspan><tspan x="595.0" dy="24">Test owner field</tspan></text><path d="M217 210 L262 210" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><path d="M452 210 L497 210" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><text x="360" y="350" text-anchor="middle" font-size="17"><tspan x="360" dy="0">The explanation remains provisional.</tspan><tspan x="360" dy="24">The action needs a review condition.</tspan></text>
</svg>
