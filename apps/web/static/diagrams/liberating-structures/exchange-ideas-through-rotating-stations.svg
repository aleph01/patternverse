<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="exchange-ideas-through-rotating-stations-title exchange-ideas-through-rotating-stations-desc">
<title id="exchange-ideas-through-rotating-stations-title">Keep the exchange, adapt who moves</title><desc id="exchange-ideas-through-rotating-stations-desc">In person, presenters stay at stations and audiences rotate. Online audiences can stay while presenters rotate through external rooms.</desc>
<style>:root{--paper:#fff;--ink:#181814;--accent:#007a4d;--soft:#e8f4ed;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--accent:#05ce78;--soft:#163b2b}}</style>
<defs><marker id="tip" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="var(--accent)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="40" text-anchor="middle" font-size="19"><tspan x="360" dy="0">Keep the exchange, adapt who moves</tspan></text><text x="185" y="100" text-anchor="middle" font-size="17"><tspan x="185" dy="0">In person</tspan></text><text x="535" y="100" text-anchor="middle" font-size="17"><tspan x="535" dy="0">External online rooms</tspan></text><rect x="45" y="145" width="86" height="72" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="88.0" y="175.0" text-anchor="middle" font-size="17"><tspan x="88.0" dy="0">Station</tspan><tspan x="88.0" dy="24">1</tspan></text><rect x="145" y="145" width="86" height="72" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="188.0" y="175.0" text-anchor="middle" font-size="17"><tspan x="188.0" dy="0">Station</tspan><tspan x="188.0" dy="24">2</tspan></text><rect x="245" y="145" width="86" height="72" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="288.0" y="175.0" text-anchor="middle" font-size="17"><tspan x="288.0" dy="0">Station</tspan><tspan x="288.0" dy="24">3</tspan></text><rect x="395" y="145" width="86" height="72" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="438.0" y="175.0" text-anchor="middle" font-size="17"><tspan x="438.0" dy="0">Room</tspan><tspan x="438.0" dy="24">1</tspan></text><rect x="495" y="145" width="86" height="72" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="538.0" y="175.0" text-anchor="middle" font-size="17"><tspan x="538.0" dy="0">Room</tspan><tspan x="538.0" dy="24">2</tspan></text><rect x="595" y="145" width="86" height="72" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="638.0" y="175.0" text-anchor="middle" font-size="17"><tspan x="638.0" dy="0">Room</tspan><tspan x="638.0" dy="24">3</tspan></text><text x="185" y="265" text-anchor="middle" font-size="17"><tspan x="185" dy="0">Presenters stay</tspan><tspan x="185" dy="24">Audiences rotate</tspan></text><text x="535" y="265" text-anchor="middle" font-size="17"><tspan x="535" dy="0">Audiences stay</tspan><tspan x="535" dy="24">Presenters rotate</tspan></text><text x="360" y="380" text-anchor="middle" font-size="17"><tspan x="360" dy="0">Preserve questions, feedback, and transition time.</tspan><tspan x="360" dy="24">The guide does not move participants.</tspan></text>
</svg>
