<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="meet-across-a-difference-title meet-across-a-difference-desc">
<title id="meet-across-a-difference-title">An encounter across positions</title><desc id="meet-across-a-difference-desc">Ten ordered positions form five pairs when the physical line folds. Numbers show order, not labels for people. Online adaptation omits the fold.</desc>
<style>:root{--paper:#fff;--ink:#181814;--accent:#007a4d;--soft:#e8f4ed;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--accent:#05ce78;--soft:#163b2b}}</style>
<defs><marker id="tip" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="var(--accent)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="40" text-anchor="middle" font-size="19"><tspan x="360" dy="0">An encounter across positions</tspan></text><path d="M60 150 H660" stroke="var(--ink)" stroke-width="1.2"/><circle cx="60" cy="150" r="8" fill="var(--accent)"/><text x="60" y="185" text-anchor="middle" font-size="15"><tspan x="60" dy="0">1</tspan></text><circle cx="126" cy="150" r="8" fill="var(--accent)"/><text x="126" y="185" text-anchor="middle" font-size="15"><tspan x="126" dy="0">2</tspan></text><circle cx="192" cy="150" r="8" fill="var(--accent)"/><text x="192" y="185" text-anchor="middle" font-size="15"><tspan x="192" dy="0">3</tspan></text><circle cx="258" cy="150" r="8" fill="var(--accent)"/><text x="258" y="185" text-anchor="middle" font-size="15"><tspan x="258" dy="0">4</tspan></text><circle cx="324" cy="150" r="8" fill="var(--accent)"/><text x="324" y="185" text-anchor="middle" font-size="15"><tspan x="324" dy="0">5</tspan></text><circle cx="390" cy="150" r="8" fill="var(--accent)"/><text x="390" y="185" text-anchor="middle" font-size="15"><tspan x="390" dy="0">6</tspan></text><circle cx="456" cy="150" r="8" fill="var(--accent)"/><text x="456" y="185" text-anchor="middle" font-size="15"><tspan x="456" dy="0">7</tspan></text><circle cx="522" cy="150" r="8" fill="var(--accent)"/><text x="522" y="185" text-anchor="middle" font-size="15"><tspan x="522" dy="0">8</tspan></text><circle cx="588" cy="150" r="8" fill="var(--accent)"/><text x="588" y="185" text-anchor="middle" font-size="15"><tspan x="588" dy="0">9</tspan></text><circle cx="654" cy="150" r="8" fill="var(--accent)"/><text x="654" y="185" text-anchor="middle" font-size="15"><tspan x="654" dy="0">10</tspan></text><text x="360" y="110" text-anchor="middle" font-size="17"><tspan x="360" dy="0">Position along the original spectrum</tspan></text><text x="360" y="260" text-anchor="middle" font-size="17"><tspan x="360" dy="0">After folding: different positions meet</tspan></text><path d="M90 304 V354" stroke="var(--accent)" stroke-width="1.5"/><circle cx="90" cy="304" r="7" fill="var(--accent)"/><circle cx="90" cy="354" r="7" fill="var(--accent)"/><text x="105" y="310" text-anchor="start" font-size="15"><tspan x="105" dy="0">1</tspan></text><text x="105" y="360" text-anchor="start" font-size="15"><tspan x="105" dy="0">10</tspan></text><path d="M225 304 V354" stroke="var(--accent)" stroke-width="1.5"/><circle cx="225" cy="304" r="7" fill="var(--accent)"/><circle cx="225" cy="354" r="7" fill="var(--accent)"/><text x="240" y="310" text-anchor="start" font-size="15"><tspan x="240" dy="0">2</tspan></text><text x="240" y="360" text-anchor="start" font-size="15"><tspan x="240" dy="0">9</tspan></text><path d="M360 304 V354" stroke="var(--accent)" stroke-width="1.5"/><circle cx="360" cy="304" r="7" fill="var(--accent)"/><circle cx="360" cy="354" r="7" fill="var(--accent)"/><text x="375" y="310" text-anchor="start" font-size="15"><tspan x="375" dy="0">3</tspan></text><text x="375" y="360" text-anchor="start" font-size="15"><tspan x="375" dy="0">8</tspan></text><path d="M495 304 V354" stroke="var(--accent)" stroke-width="1.5"/><circle cx="495" cy="304" r="7" fill="var(--accent)"/><circle cx="495" cy="354" r="7" fill="var(--accent)"/><text x="510" y="310" text-anchor="start" font-size="15"><tspan x="510" dy="0">4</tspan></text><text x="510" y="360" text-anchor="start" font-size="15"><tspan x="510" dy="0">7</tspan></text><path d="M630 304 V354" stroke="var(--accent)" stroke-width="1.5"/><circle cx="630" cy="304" r="7" fill="var(--accent)"/><circle cx="630" cy="354" r="7" fill="var(--accent)"/><text x="645" y="310" text-anchor="start" font-size="15"><tspan x="645" dy="0">5</tspan></text><text x="645" y="360" text-anchor="start" font-size="15"><tspan x="645" dy="0">6</tspan></text><text x="360" y="420" text-anchor="middle" font-size="17"><tspan x="360" dy="0">Listen to reasoning; agreement or movement is optional.</tspan></text>
</svg>
