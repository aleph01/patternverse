<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="draw-on-a-wider-circle-of-help-title draw-on-a-wider-circle-of-help-desc">
<title id="draw-on-a-wider-circle-of-help-title">Help from the center and the wider circle</title><desc id="draw-on-a-wider-circle-of-help-desc">A client clarifies a real challenge, central consultants explore it while the client listens, satellite groups add observations, and the client selects takeaways.</desc>
<style>:root{--paper:#fff;--ink:#181814;--accent:#007a4d;--soft:#e8f4ed;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--accent:#05ce78;--soft:#163b2b}}</style>
<defs><marker id="tip" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="var(--accent)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="40" text-anchor="middle" font-size="19"><tspan x="360" dy="0">Help from the center and the wider circle</tspan></text><rect x="225" y="75" width="270" height="55" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="360.0" y="108.5" text-anchor="middle" font-size="17"><tspan x="360.0" dy="0">Client brings a challenge</tspan></text><rect x="50" y="170" width="170" height="65" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="135.0" y="196.5" text-anchor="middle" font-size="17"><tspan x="135.0" dy="0">Consultant 1</tspan><tspan x="135.0" dy="24">Explore</tspan></text><rect x="275" y="170" width="170" height="65" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="360.0" y="196.5" text-anchor="middle" font-size="17"><tspan x="360.0" dy="0">Consultant 2</tspan><tspan x="360.0" dy="24">Explore</tspan></text><rect x="500" y="170" width="170" height="65" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="585.0" y="196.5" text-anchor="middle" font-size="17"><tspan x="585.0" dy="0">Consultant 3</tspan><tspan x="585.0" dy="24">Explore</tspan></text><path d="M360 132 L360 162" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><text x="360" y="267" text-anchor="middle" font-size="15"><tspan x="360" dy="0">Client listens without routine rebuttal</tspan></text><rect x="70" y="290" width="250" height="60" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="195.0" y="326.0" text-anchor="middle" font-size="17"><tspan x="195.0" dy="0">Satellite observations</tspan></text><rect x="400" y="290" width="250" height="60" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="525.0" y="326.0" text-anchor="middle" font-size="17"><tspan x="525.0" dy="0">Satellite observations</tspan></text><path d="M195 352 L310 390" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><path d="M525 352 L410 390" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><rect x="195" y="397" width="330" height="50" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="360.0" y="428.0" text-anchor="middle" font-size="17"><tspan x="360.0" dy="0">Client selects takeaways</tspan></text>
</svg>
