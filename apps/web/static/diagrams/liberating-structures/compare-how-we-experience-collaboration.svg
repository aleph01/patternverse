<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="compare-how-we-experience-collaboration-title compare-how-we-experience-collaboration-desc">
<title id="compare-how-we-experience-collaboration-title">Four questions, no combined quality score</title><desc id="compare-how-we-experience-collaboration-desc">Separateness concerns difference, tuning concerns mutual understanding, action concerns joint work, and reason concerns why collaboration matters. Each assessment needs examples.</desc>
<style>:root{--paper:#fff;--ink:#181814;--accent:#007a4d;--soft:#e8f4ed;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--accent:#05ce78;--soft:#163b2b}}</style>
<defs><marker id="tip" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="var(--accent)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="40" text-anchor="middle" font-size="19"><tspan x="360" dy="0">Four questions, no combined quality score</tspan></text><rect x="45" y="100" width="290" height="105" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="190.0" y="146.5" text-anchor="middle" font-size="17"><tspan x="190.0" dy="0">Separateness</tspan><tspan x="190.0" dy="24">Are differences heard?</tspan></text><rect x="385" y="100" width="290" height="105" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="530.0" y="146.5" text-anchor="middle" font-size="17"><tspan x="530.0" dy="0">Tuning</tspan><tspan x="530.0" dy="24">Do we understand?</tspan></text><rect x="45" y="245" width="290" height="105" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="190.0" y="291.5" text-anchor="middle" font-size="17"><tspan x="190.0" dy="0">Action</tspan><tspan x="190.0" dy="24">What do we do together?</tspan></text><rect x="385" y="245" width="290" height="105" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="530.0" y="291.5" text-anchor="middle" font-size="17"><tspan x="530.0" dy="0">Reason</tspan><tspan x="530.0" dy="24">Why work together?</tspan></text><text x="360" y="420" text-anchor="middle" font-size="17"><tspan x="360" dy="0">A personal profile invites inquiry, not a team diagnosis.</tspan></text>
</svg>
