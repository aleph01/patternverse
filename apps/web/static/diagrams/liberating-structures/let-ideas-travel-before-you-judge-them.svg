<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="let-ideas-travel-before-you-judge-them-title let-ideas-travel-before-you-judge-them-desc">
<title id="let-ideas-travel-before-you-judge-them-title">Five independent readings, then discussion</title><desc id="let-ideas-travel-before-you-judge-them-desc">A card with an idea and first step receives five independent one-to-five ratings before scores are totaled. Totals guide attention rather than determine objective value.</desc>
<style>:root{--paper:#fff;--ink:#181814;--accent:#007a4d;--soft:#e8f4ed;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--accent:#05ce78;--soft:#163b2b}}</style>
<defs><marker id="tip" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="var(--accent)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="40" text-anchor="middle" font-size="19"><tspan x="360" dy="0">Five independent readings, then discussion</tspan></text><rect x="200" y="85" width="320" height="65" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="360.0" y="123.5" text-anchor="middle" font-size="17"><tspan x="360.0" dy="0">One idea + first step</tspan></text><path d="M360 152 L360 195" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><rect x="40" y="210" width="100" height="85" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="90.0" y="246.5" text-anchor="middle" font-size="17"><tspan x="90.0" dy="0">Reader 1</tspan><tspan x="90.0" dy="24">1 to 5</tspan></text><rect x="175" y="210" width="100" height="85" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="225.0" y="246.5" text-anchor="middle" font-size="17"><tspan x="225.0" dy="0">Reader 2</tspan><tspan x="225.0" dy="24">1 to 5</tspan></text><rect x="310" y="210" width="100" height="85" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="360.0" y="246.5" text-anchor="middle" font-size="17"><tspan x="360.0" dy="0">Reader 3</tspan><tspan x="360.0" dy="24">1 to 5</tspan></text><rect x="445" y="210" width="100" height="85" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="495.0" y="246.5" text-anchor="middle" font-size="17"><tspan x="495.0" dy="0">Reader 4</tspan><tspan x="495.0" dy="24">1 to 5</tspan></text><rect x="580" y="210" width="100" height="85" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="630.0" y="246.5" text-anchor="middle" font-size="17"><tspan x="630.0" dy="0">Reader 5</tspan><tspan x="630.0" dy="24">1 to 5</tspan></text><text x="360" y="355" text-anchor="middle" font-size="17"><tspan x="360" dy="0">Decide before seeing previous scores.</tspan><tspan x="360" dy="24">Then total 5 to 25; discuss leaders and wild cards.</tspan></text>
</svg>
