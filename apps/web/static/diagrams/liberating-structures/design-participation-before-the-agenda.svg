<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="design-participation-before-the-agenda-title design-participation-before-the-agenda-desc">
<title id="design-participation-before-the-agenda-title">Give every agenda step a job</title><desc id="design-participation-before-the-agenda-desc">Purpose informs an invitation, participation arrangement, and output that the next step can use. Timing, hosts, access, and alternatives support the whole sequence.</desc>
<style>:root{--paper:#fff;--ink:#181814;--accent:#007a4d;--soft:#e8f4ed;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--accent:#05ce78;--soft:#163b2b}}</style>
<defs><marker id="tip" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="var(--accent)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="40" text-anchor="middle" font-size="19"><tspan x="360" dy="0">Give every agenda step a job</tspan></text><rect x="25" y="160" width="130" height="85" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="90.0" y="208.5" text-anchor="middle" font-size="17"><tspan x="90.0" dy="0">Purpose</tspan></text><rect x="205" y="160" width="130" height="85" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="270.0" y="208.5" text-anchor="middle" font-size="17"><tspan x="270.0" dy="0">Invitation</tspan></text><rect x="385" y="160" width="130" height="85" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="450.0" y="208.5" text-anchor="middle" font-size="17"><tspan x="450.0" dy="0">Participation</tspan></text><rect x="565" y="160" width="130" height="85" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="630.0" y="208.5" text-anchor="middle" font-size="17"><tspan x="630.0" dy="0">Output</tspan></text><path d="M158 202 L197 202" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><path d="M338 202 L377 202" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><path d="M518 202 L557 202" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><rect x="65" y="315" width="590" height="65" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="360.0" y="353.5" text-anchor="middle" font-size="17"><tspan x="360.0" dy="0">Host · Timing · Access · Fallback · Evaluation</tspan></text><text x="360" y="425" text-anchor="middle" font-size="17"><tspan x="360" dy="0">Connect outputs instead of merely listing topics.</tspan></text>
</svg>
