<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="think-alone-before-thinking-together-title think-alone-before-thinking-together-desc">
<title id="think-alone-before-thinking-together-title">Give each account room before combining it</title><desc id="think-alone-before-thinking-together-desc">Independent reflection moves into pairs, quartets, and selected whole-group sharing. Differences can remain useful at every step.</desc>
<style>:root{--paper:#fff;--ink:#181814;--accent:#007a4d;--soft:#e8f4ed;color-scheme:light dark}text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--paper:#181814;--ink:#fff;--accent:#05ce78;--soft:#163b2b}}</style>
<defs><marker id="tip" viewBox="0 0 8 10" refX="7" refY="5" markerWidth="6" markerHeight="7" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="var(--accent)" stroke-width="1.5"/></marker></defs>
<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="40" text-anchor="middle" font-size="19"><tspan x="360" dy="0">Give each account room before combining it</tspan></text><rect x="25" y="170" width="130" height="90" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="90.0" y="209.0" text-anchor="middle" font-size="17"><tspan x="90.0" dy="0">Alone</tspan><tspan x="90.0" dy="24">Notice</tspan></text><rect x="205" y="170" width="130" height="90" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="270.0" y="209.0" text-anchor="middle" font-size="17"><tspan x="270.0" dy="0">Pairs</tspan><tspan x="270.0" dy="24">Exchange</tspan></text><rect x="385" y="170" width="130" height="90" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="450.0" y="209.0" text-anchor="middle" font-size="17"><tspan x="450.0" dy="0">Quartets</tspan><tspan x="450.0" dy="24">Develop</tspan></text><rect x="565" y="170" width="130" height="90" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="630.0" y="209.0" text-anchor="middle" font-size="17"><tspan x="630.0" dy="0">All</tspan><tspan x="630.0" dy="24">Share</tspan></text><path d="M158 215 L197 215" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><path d="M338 215 L377 215" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><path d="M518 215 L557 215" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><text x="360" y="355" text-anchor="middle" font-size="17"><tspan x="360" dy="0">Carry observations and differences forward.</tspan><tspan x="360" dy="24">Shared themes do not establish consensus.</tspan></text>
</svg>
