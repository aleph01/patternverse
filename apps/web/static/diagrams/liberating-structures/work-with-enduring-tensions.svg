<rect width="720" height="470" fill="var(--paper)"/><text x="360" y="40" text-anchor="middle" font-size="19"><tspan x="360" dy="0">Design for two legitimate demands</tspan></text><rect x="40" y="110" width="270" height="95" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="175.0" y="151.5" text-anchor="middle" font-size="17"><tspan x="175.0" dy="0">Independent access</tspan><tspan x="175.0" dy="24">What does it protect?</tspan></text><rect x="410" y="110" width="270" height="95" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="545.0" y="151.5" text-anchor="middle" font-size="17"><tspan x="545.0" dy="0">Responsible use</tspan><tspan x="545.0" dy="24">What does it protect?</tspan></text><path d="M175 207 L310 292" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><path d="M545 207 L410 292" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#tip)"/><rect x="180" y="300" width="360" height="80" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="1.2"/><text x="360.0" y="334.0" text-anchor="middle" font-size="17"><tspan x="360.0" dy="0">An arrangement to test</tspan><tspan x="360.0" dy="24">Tool-specific orientation</tspan></text><text x="360" y="425" text-anchor="middle" font-size="17"><tspan x="360" dy="0">Inspect what happens to both concerns.</tspan></text>
