<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Explore What Feels Wrong — recognition library</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #181814;
        --paper: #fff;
        --muted: #62655f;
        --green: #007a4d;
        --mint: #dff8ea;
        --focus: #1557ff;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: var(--paper);
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 4px 0 12px;
        font-size: 16px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button,
      summary,
      label {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
      button {
        min-height: 44px;
        background: transparent;
        border: 0;
      }
      p {
        margin: 0;
      }
      .modes {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid var(--ink);
        margin-bottom: 20px;
      }
      .modes button {
        padding: 8px 0 12px;
        border-bottom: 3px solid transparent;
        font-size: 0.875rem;
        font-weight: 750;
      }
      .modes [aria-selected='true'] {
        color: var(--green);
        border-bottom-color: var(--green);
      }
      .tools {
        display: flex;
        align-items: end;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .search {
        display: block;
        flex: 1;
        min-width: 180px;
        font-size: 0.75rem;
        font-weight: 700;
      }
      .search input {
        display: block;
        width: 100%;
        min-height: 44px;
        margin-top: 4px;
        padding: 8px 10px;
        border: 1px solid #a9aaa4;
        border-radius: 4px;
        background: var(--paper);
        font-size: 0.875rem;
        font-weight: 400;
      }
      .back {
        color: var(--green);
        font-size: 0.8125rem;
        font-weight: 750;
        padding: 6px 0;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 1.3rem;
        line-height: 1.25;
        letter-spacing: -0.025em;
      }
      .intro {
        color: var(--muted);
        font-size: 0.875rem;
        margin: 0 0 20px;
      }
      .category {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 14px;
        text-align: left;
        border-top: 1px solid var(--ink);
        padding: 16px 4px;
      }
      .category:last-child {
        border-bottom: 1px solid var(--ink);
      }
      .category:hover,
      summary:hover {
        color: var(--green);
        background: #fbfefc;
      }
      .number,
      .count {
        font-size: 0.75rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .copy {
        flex: 1;
        min-width: 0;
      }
      .title {
        display: block;
        font-weight: 750;
      }
      .description,
      .path {
        display: block;
        color: var(--muted);
        font-size: 0.8125rem;
        margin-top: 4px;
        font-weight: 400;
      }
      .chevron {
        color: var(--green);
        font-size: 25px;
        line-height: 1;
        flex-shrink: 0;
        transition: transform 140ms ease;
      }
      details {
        border-top: 1px solid #c7c8c1;
      }
      details:last-child {
        border-bottom: 1px solid #c7c8c1;
      }
      summary {
        display: flex;
        align-items: center;
        gap: 14px;
        list-style: none;
        min-height: 48px;
        padding: 14px 4px;
        font-size: 0.9375rem;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::marker {
        content: '';
      }
      summary .copy {
        font-weight: 650;
      }
      details[open] > summary {
        color: var(--green);
      }
      details[open] > summary .chevron {
        transform: rotate(90deg);
      }
      .detail {
        border-left: 3px solid var(--green);
        padding: 12px 18px 18px;
        margin-bottom: 14px;
        background: #fbfefc;
        font-size: 0.875rem;
      }
      .detail p + p {
        margin-top: 12px;
      }
      .label {
        display: block;
        font-size: 0.75rem;
        font-weight: 750;
        margin-bottom: 4px;
      }
      .boundary {
        color: var(--muted);
        font-size: 0.8125rem;
      }
      .family-group > summary .copy {
        font-weight: 750;
      }
      .family-group > summary .count {
        white-space: nowrap;
      }
      .examples {
        margin: 0 0 16px 12px;
        border-left: 2px solid #dff8ea;
        padding-left: 14px;
      }
      .example {
        padding: 10px 0;
        border-top: 1px solid #e2e3dc;
      }
      .example-statement {
        font-size: 0.9375rem;
      }
      .example-info,
      .example-info:last-child {
        border: 0;
      }
      .example-info > summary {
        padding: 4px 0 0;
        min-height: 32px;
        justify-content: flex-start;
        color: var(--green);
        font-size: 0.75rem;
        gap: 8px;
      }
      .example-info .chevron {
        font-size: 18px;
      }
      .example-info .detail {
        margin: 10px 0 0;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 20px;
        color: var(--muted);
        font-size: 0.75rem;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @media (max-width: 560px) {
        .tools {
          gap: 8px;
        }
        .search {
          flex-basis: 100%;
        }
        .category {
          gap: 8px;
        }
        .category .description {
          font-size: 0.75rem;
        }
        .detail {
          padding: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .chevron {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="recognition-browser" aria-label="What feels unacceptable about me?">
      <div class="modes" role="tablist" aria-label="Browse recognition entries">
        <button
          id="aspect-tab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="recognition-panel"
          data-mode="aspect"
        >
          By aspect of myself
        </button>
        <button
          id="judgment-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="recognition-panel"
          tabindex="-1"
          data-mode="judgment"
        >
          By self-judgment
        </button>
      </div>
      <div class="tools">
        <label class="search"
          >Find a subject or phrase<input
            id="search"
            type="search"
            placeholder="Reassurance, anger, trying hard…"
            autocomplete="off"
        /></label>
      </div>
      <div id="recognition-panel" role="tabpanel" aria-labelledby="aspect-tab"></div>
      <p id="recognition-status" class="sr" role="status" aria-live="polite"></p>
      <footer><span id="library-count"></span><span>Prewritten recognition examples</span></footer>
    </main>
    <script type="application/json" id="recognition-data">
      <!-- SELF_ACCEPTABILITY_LIBRARY -->
    </script>
    <script>
      (() => {
        const data = JSON.parse(document.getElementById('recognition-data').textContent);
        const root = document.getElementById('recognition-browser');
        const panel = document.getElementById('recognition-panel');
        const status = document.getElementById('recognition-status');
        const search = document.getElementById('search');
        const opened = new Set();
        const openFamilies = new Set();
        let mode = 'aspect',
          category = null;
        const escape = (value) =>
          String(value).replace(
            /[&<>"']/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
          );
        const chevron = '<span class="chevron" aria-hidden="true">›</span>';
        const categories = () => (mode === 'aspect' ? data.domains : data.judgments);
        function row(record) {
          return (
            '<div class="example" data-example="' +
            record.id +
            '"><p class="example-statement">' +
            escape(record.statement) +
            '</p><details class="example-info" data-entry="' +
            record.id +
            '"' +
            (opened.has(record.id) ? ' open' : '') +
            '><summary>Meaning and details<span class="sr">: ' +
            escape(record.statement) +
            '</span>' +
            chevron +
            '</summary><div class="detail"><p><span class="label">What is being judged</span>' +
            escape(record.subjects.join(' · ')) +
            '</p><p><span class="label">Possible self-judgment</span>' +
            escape(record.judgment_name) +
            '</p><p><span class="label">Scope</span>' +
            escape(
              record.scope === 'unspecified'
                ? 'Not separately specified; do not assume a global judgment.'
                : record.scope === 'local'
                  ? 'A specific aspect or situation.'
                  : 'A broader judgment about oneself.',
            ) +
            '</p><p><span class="label">Clarify the meaning</span>' +
            escape(record.clarification) +
            '</p><p class="boundary">' +
            escape(record.meaning_boundary) +
            '</p></div></details></div>'
          );
        }
        function familyRows(records, expand) {
          return data.subfamilies
            .map((family) => {
              const rows = records.filter((record) => record.subfamily_id === family.id);
              if (!rows.length) return '';
              // Concrete examples lead; the original broader statement remains available last.
              rows.sort((a, b) => Number(a.id === family.id) - Number(b.id === family.id));
              return (
                '<details class="family-group" data-family="' +
                family.id +
                '"' +
                (expand || openFamilies.has(family.id) ? ' open' : '') +
                '><summary><span class="copy">' +
                escape(family.title) +
                '</span><span class="count">' +
                rows.length +
                ' examples</span>' +
                chevron +
                '</summary><div class="examples">' +
                rows.map(row).join('') +
                '</div></details>'
              );
            })
            .join('');
        }
        function render() {
          root.querySelectorAll('[data-mode]').forEach((button) => {
            button.setAttribute('aria-selected', String(button.dataset.mode === mode));
            button.tabIndex = button.dataset.mode === mode ? 0 : -1;
          });
          panel.setAttribute('aria-labelledby', mode + '-tab');
          const query = search.value.trim().toLocaleLowerCase();
          const filtered = data.records.filter(
            (record) =>
              (!category || (mode === 'aspect' ? record.domain : record.judgment) === category) &&
              (!query ||
                [
                  record.statement,
                  record.family_name,
                  record.domain_name,
                  record.judgment_name,
                  ...record.subjects,
                ]
                  .join(' ')
                  .toLocaleLowerCase()
                  .includes(query)),
          );
          if (!category && !query) {
            panel.innerHTML =
              '<h2>' +
              (mode === 'aspect' ? 'What about me feels wrong?' : 'How am I judging myself?') +
              '</h2><p class="intro">These are examples to recognize or reject, not statements about what is actually wrong with you.</p>' +
              categories()
                .map((item, index) => {
                  const count = data.records.filter(
                    (record) => (mode === 'aspect' ? record.domain : record.judgment) === item.id,
                  ).length;
                  return (
                    '<button class="category" type="button" data-category="' +
                    item.id +
                    '"><span class="number">' +
                    String(index + 1).padStart(2, '0') +
                    '</span><span class="copy"><span class="title">' +
                    escape(item.title) +
                    '</span><span class="description">' +
                    escape(item.description) +
                    '</span></span><span class="count">' +
                    count +
                    ' examples' +
                    '</span>' +
                    chevron +
                    '</button>'
                  );
                })
                .join('');
            return;
          }
          const heading = category
            ? categories().find((item) => item.id === category).title
            : 'Search results';
          panel.innerHTML =
            '<button type="button" class="back" data-back>← All ' +
            (mode === 'aspect' ? 'aspects' : 'self-judgments') +
            '</button><h2>' +
            escape(heading) +
            '</h2><p class="intro">' +
            filtered.length +
            ' matching ' +
            (filtered.length === 1 ? 'example' : 'examples') +
            '. Open a subfamily to browse its examples. Meaning and details are optional.</p>' +
            (filtered.length
              ? familyRows(filtered, Boolean(query) || mode === 'judgment')
              : '<p>No examples match this search.</p>');
        }
        root.addEventListener('click', (event) => {
          const target = event.target.closest('button');
          if (!target) return;
          if (target.dataset.mode) {
            mode = target.dataset.mode;
            category = null;
            render();
            status.textContent =
              'Browsing by ' + (mode === 'aspect' ? 'aspect of myself.' : 'self-judgment.');
          } else if (target.dataset.category) {
            category = target.dataset.category;
            render();
            panel.querySelector('[data-back]').focus({ preventScroll: true });
            status.textContent = categories().find((item) => item.id === category).title;
          } else if (target.hasAttribute('data-back')) {
            const previous = category;
            category = null;
            search.value = '';
            render();
            (
              panel.querySelector('[data-category="' + previous + '"]') ||
              root.querySelector('[data-mode="' + mode + '"]')
            ).focus({ preventScroll: true });
            status.textContent = 'All categories.';
          }
        });
        root.addEventListener(
          'toggle',
          (event) => {
            const target = event.target;
            if (target.matches('details[data-entry]')) {
              if (target.open) opened.add(target.dataset.entry);
              else opened.delete(target.dataset.entry);
            } else if (target.matches('details[data-family]')) {
              if (target.open) openFamilies.add(target.dataset.family);
              else openFamilies.delete(target.dataset.family);
            }
          },
          true,
        );
        search.addEventListener('input', () => {
          render();
          status.textContent = panel.querySelector('h2').textContent;
        });
        root.querySelector('.modes').addEventListener('keydown', (event) => {
          if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
          event.preventDefault();
          mode =
            event.key === 'Home'
              ? 'aspect'
              : event.key === 'End'
                ? 'judgment'
                : mode === 'aspect'
                  ? 'judgment'
                  : 'aspect';
          category = null;
          render();
          root.querySelector('[data-mode="' + mode + '"]').focus();
          status.textContent =
            'Browsing by ' + (mode === 'aspect' ? 'aspect of myself.' : 'self-judgment.');
        });
        document.getElementById('library-count').textContent =
          data.records.length +
          ' examples · ' +
          data.subfamilies.length +
          ' subfamilies · ' +
          data.domains.length +
          ' domains · candidate taxonomy ' +
          data.version;
        render();
      })();
    </script>
  </body>
</html>
