<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><!-- TITLE --></title>
    <style>
      :root {
        color-scheme: light;
        font:
          14px/1.6 system-ui,
          sans-serif;
        color: #252822;
        background: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 4px 0 8px;
        background: #fff;
      }
      p {
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }
      .context {
        color: #60645e;
        font-size: 12px;
        margin-bottom: 14px;
      }
      fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        border: 0;
        padding: 0;
        margin: 0 0 12px;
      }
      legend {
        font-size: 12px;
        margin-bottom: 7px;
        padding: 0;
      }
      label {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        gap: 7px;
        padding: 7px 10px;
        border: 1px solid #a5aaa2;
        cursor: pointer;
      }
      label:has(:checked) {
        border-color: #007a4d;
        background: #edf6f1;
      }
      input {
        margin: 0;
        accent-color: #007a4d;
      }
      label:has(:focus-visible),
      summary:focus-visible {
        outline: 2px solid #007a4d;
        outline-offset: 3px;
      }
      .extra {
        margin: 0 0 12px;
      }
      #panels {
        width: 100%;
      }
      figure {
        margin: 0 0 14px;
        width: 100%;
      }
      figcaption {
        font-size: 12px;
        margin-bottom: 3px;
        color: #60645e;
      }
      svg {
        display: block;
        max-width: 100%;
        height: auto;
      }
      #key {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin-bottom: 10px;
        font-size: 12px;
      }
      .key-symbol {
        display: inline-block;
        margin-right: 6px;
        font-size: 18px;
        vertical-align: middle;
      }
      #readout {
        margin: 10px 0 14px;
        font-size: 13px;
      }
      #text-account {
        border-left: 2px solid #007a4d;
        padding: 4px 10px;
        margin: 10px 0 14px;
      }
      #text-account h2 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 6px;
      }
      #text-account p {
        font-size: 13px;
      }
      details {
        border-top: 1px solid #d8dcd5;
        padding-top: 10px;
      }
      summary {
        cursor: pointer;
        font-size: 12px;
      }
      details p {
        font-size: 12px;
        color: #60645e;
        margin: 10px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 12px;
      }
      caption {
        text-align: left;
        padding: 10px 0;
        color: #60645e;
      }
      th,
      td {
        text-align: left;
        border-bottom: 1px solid #e3e6e0;
        padding: 6px 4px 6px 0;
        font-weight: 400;
        overflow-wrap: anywhere;
        vertical-align: top;
      }
      thead th {
        color: #60645e;
      }
      td {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body data-lesson="<!-- LESSON_ID -->">
    <p class="context"><!-- CONTEXT --></p>
    <fieldset>
      <legend><!-- CONTROL --></legend>
      <!-- MODES -->
    </fieldset>
    <!-- EXTRA -->
    <div id="key" aria-label="Chart key" hidden></div>
    <div id="panels"></div>
    <p id="readout" role="status" aria-live="polite" aria-atomic="true"><!-- FALLBACK --></p>
    <section id="text-account" aria-labelledby="account-heading" hidden>
      <h2 id="account-heading">Text account</h2>
      <p></p>
    </section>
    <details>
      <summary>Data and text description</summary>
      <p><!-- FALLBACK --></p>
      <table>
        <caption>
          Fixed fictional observations · recorded values are unchanged by the display controls
        </caption>
        <thead>
          <tr>
            <!-- TABLE_HEAD -->
          </tr>
        </thead>
        <tbody>
          <!-- TABLE_ROWS -->
        </tbody>
      </table>
    </details>
    <!-- PLOT_SCRIPT -->
  </body>
</html>
