name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Rust browser target
        run: rustup target add wasm32-unknown-unknown

      - name: Verify Pattern Markdown and browser host
        run: |
          cargo test --locked --manifest-path crates/pattern-core/Cargo.toml
          cargo test --locked --manifest-path crates/pattern-host/Cargo.toml
          cargo build --locked --release --target wasm32-unknown-unknown --manifest-path crates/pattern-wasm/Cargo.toml

      - name: Check formatting
        run: pnpm format:check

      - name: Lint and type-check
        run: pnpm lint

      - name: Validate Patternverse Commons
        run: pnpm validate:content

      - name: Compile normalized corpus output
        run: pnpm compile:content:production

      - name: Run unit tests
        run: pnpm test

      - name: Build packages and web
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @patternverse/web exec playwright install --with-deps chromium

      - name: Run essential browser tests
        run: pnpm test:e2e
