[package]
name = "pattern-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
publish = false
description = "Portable Pattern Markdown semantic core"

[dependencies]
chumsky = { version = "0.9.3", default-features = false, features = ["std"] }
ariadne = "0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
syn = { version = "=2.0.119", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
proptest = { version = "=1.6.0", default-features = false, features = ["std"] }
insta = { version = "=1.41.1", default-features = false, features = ["json"] }
tempfile = "=3.15.0"
fs2 = "=0.4.3"
